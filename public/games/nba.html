<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NBA Basketball Manager 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
<style>body{margin:0}img{max-width:100%}
/* Layout: FM-style shell — sticky club bar on top, left rail nav, dense data panels in main. Single dark theme by choice. */
:root {
  --bg: #0c1116; --rail: #0f161c; --panel: #141c23; --panel2: #1a242d; --line: #24303a; --line2: #2f3d49;
  --fg: #dde5ea; --muted: #94a3af; --dim: #7d8d99;
  --accent: #ee7d2f; --accent-ink: #1b0e05; --accent-soft: rgba(238, 125, 47, .14);
  --good: #4fbf7f; --warn: #e2aa3d; --bad: #dc5a54; --elite: #4cc5e3;
  --gold: #f0c548;
  --t1: #d0564f; --t2: #db8b3a; --t3: #c8cbc0; --t4: #5cc07d; --t5: #4cc5e3;
  --f-display: 'Barlow Condensed', 'Noto Sans SC', 'Arial Narrow', sans-serif;
  --f-body: 'IBM Plex Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--f-body); }
* { box-sizing: border-box; }
a { color: inherit; text-decoration: none; cursor: pointer; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

#app { display: grid; grid-template-columns: 188px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--rail); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; flex-wrap: wrap; }
.brand { font: 700 18px/1.05 var(--f-display); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.brand b { color: var(--accent); }
.club { display: flex; align-items: center; gap: 10px; min-width: 0; }
.crest { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--f-display); color: #fff; letter-spacing: .03em; flex: none; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .15); }
.club .nm { font: 600 17px/1.1 var(--f-display); letter-spacing: .02em; white-space: nowrap; }
.club .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
.when { color: var(--muted); font-size: 12px; margin-left: auto; text-align: right; white-space: nowrap; }
.when b { color: var(--fg); font: 600 15px/1.1 var(--f-display); letter-spacing: .03em; display: block; }
.go { display: flex; gap: 6px; flex-wrap: wrap; }
.prog { height: 3px; background: var(--accent); position: fixed; left: 0; top: env(safe-area-inset-top, 0px); z-index: 50; transition: width .1s; }

nav.rail { background: var(--rail); border-right: 1px solid var(--line); padding: 10px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
nav.rail .grp { font: 600 11px/1 var(--f-display); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; padding: 12px 10px 6px; }
nav.rail a { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: 4px; color: var(--muted); }
@media (hover: hover) { nav.rail a:hover { background: var(--panel2); color: var(--fg); } }
nav.rail a.on { background: var(--accent-soft); color: var(--accent); box-shadow: inset 2px 0 0 var(--accent); }
.badge { background: var(--accent); color: var(--accent-ink); font: 600 11px/1 var(--f-mono); padding: 2px 6px; border-radius: 9px; }

main { overflow-y: auto; padding-block: 18px 40px; padding-inline: 20px; min-width: 0; }
.h1 { font: 700 26px/1.1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; margin: 0 0 4px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 16px; max-width: 70ch; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
.grid.g2 { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sp { flex: 1; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.card > h3 { margin: 0; padding: 10px 14px; font: 600 13px/1.2 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.card > h3 .sp { flex: 1; }
.card .bd { padding: 12px 14px; }
.card .bd.flush { padding: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.big { font: 700 34px/1 var(--f-display); letter-spacing: .01em; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .acc { color: var(--accent); }
.note { background: var(--panel2); border-left: 3px solid var(--accent); padding: 9px 12px; border-radius: 0 4px 4px 0; color: var(--muted); }
.note b { color: var(--fg); }

.btn { background: var(--panel2); border: 1px solid var(--line2); padding: 6px 12px; border-radius: 4px; cursor: pointer; white-space: nowrap; font-size: 13px; }
@media (hover: hover) { .btn:hover { border-color: var(--muted); } }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
@media (hover: hover) { .btn.pri:hover { filter: brightness(1.08); } }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.go .btn.pri { font: 600 15px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 9px 16px; }

.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font: 600 11px/1.2 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
table.t th.sortable { cursor: pointer; } table.t th.sortable:hover, table.t th.on { color: var(--accent); }
table.t td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
@media (hover: hover) { table.t tr:hover td { background: rgba(255, 255, 255, .025); } }
table.t .n, table.t th.n { text-align: right; }
table.t tr.me td { background: var(--accent-soft); }
table.t tr.cut td { border-bottom: 2px solid var(--line2); }
table.t .num { font-family: var(--f-mono); font-size: 12.5px; }
.pl { color: var(--fg); font-weight: 500; } @media (hover: hover) { .pl:hover { color: var(--accent); text-decoration: underline; } }
.tm { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; } .tm i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; } @media (hover: hover) { .tm:hover { color: var(--accent); } }
.pos i { font-style: normal; color: var(--dim); }
.ph .jersey small { display: block; font-size: 12px; opacity: .75; margin-top: 2px; }
.ph .jersey { flex-direction: column; }
.depths { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.depth { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; line-height: 1.9; font-size: 12.5px; }
.depth .dh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.depth .dh b { font: 700 18px/1 var(--f-display); color: var(--accent); }
.depth .dh span { font-size: 11.5px; }
.pos { font: 600 11px/1 var(--f-mono); color: var(--muted); background: var(--panel2); border: 1px solid var(--line2); padding: 2px 4px; border-radius: 3px; }

.ov { display: inline-block; min-width: 30px; text-align: center; font: 600 12.5px/1 var(--f-mono); padding: 4px 4px; border-radius: 3px; color: #0c1116; }
.ov.t1 { background: var(--t1); } .ov.t2 { background: var(--t2); } .ov.t3 { background: var(--t3); } .ov.t4 { background: var(--t4); } .ov.t5 { background: var(--t5); }
.av { font: 600 13px/1 var(--f-mono); }
.av.t1 { color: var(--t1); } .av.t2 { color: var(--t2); } .av.t3 { color: var(--t3); } .av.t4 { color: var(--t4); } .av.t5 { color: var(--t5); }
.stars { letter-spacing: 1px; white-space: nowrap; font-size: 13px; }
.stars .f { color: var(--accent); } .stars .e { color: var(--line2); }
.stars .h { background: linear-gradient(90deg, var(--accent) 50%, var(--line2) 50%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.chip { display: inline-block; font-size: 11.5px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
.chip.win { color: var(--good); border-color: rgba(79, 191, 127, .4); } .chip.rebuild { color: var(--elite); border-color: rgba(76, 197, 227, .4); }
.chip.acc { color: var(--accent); border-color: rgba(238, 125, 47, .45); }
.chip.st { color: var(--fg); border-color: var(--muted); }
.W { color: var(--good); font-weight: 600; } .L { color: var(--bad); font-weight: 600; }
.meter { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.meter > i { display: block; height: 100%; background: var(--accent); }
.meter.g > i { background: var(--good); } .meter.w > i { background: var(--warn); } .meter.b > i { background: var(--bad); }
.know { display: inline-block; width: 60px; vertical-align: middle; }

/* attributes */
.attrs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 4px 18px; }
.attrs h4 { margin: 6px 0 4px; font: 600 11px/1 var(--f-display); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; grid-column: auto; }
.ar { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px dotted var(--line); gap: 8px; }
.ar span:first-child { color: var(--muted); }

/* player header */
.ph { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.ph .jersey { width: 56px; height: 56px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font: 700 22px/1 var(--f-display); color: #fff; flex: none; }
.ph .nm { font: 700 24px/1.05 var(--f-display); letter-spacing: .02em; }
.ph .meta { color: var(--muted); font-size: 12.5px; }
.ph .rt { margin-left: auto; display: flex; gap: 18px; }
.ph .rt div { text-align: center; } .ph .rt small { display: block; color: var(--dim); font: 600 10.5px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 5px; }

/* inputs */
input[type=number], select, textarea, input[type=text] { background: var(--bg); color: var(--fg); border: 1px solid var(--line2); border-radius: 4px; padding: 5px 7px; font: inherit; }
input[type=number] { width: 74px; font-family: var(--f-mono); }
input[type=range] { accent-color: var(--accent); width: 100%; }
textarea { width: 100%; min-height: 110px; font: 11.5px/1.4 var(--f-mono); }
.slider { display: grid; grid-template-columns: 110px minmax(0, 1fr) 54px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.slider small { grid-column: 1 / -1; color: var(--dim); margin-top: -4px; }

/* modal & toast */
[hidden] { display: none !important; }
#modal { position: fixed; inset: 0; background: rgba(4, 7, 10, .72); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
.mbox { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; width: min(920px, 100%); position: relative; padding: 18px 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
.mbox .x { position: absolute; right: 10px; top: 8px; background: none; border: 0; font-size: 22px; color: var(--muted); cursor: pointer; }
#toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 80; max-width: min(380px, calc(100% - 32px)); }
.toast { background: var(--panel2); border: 1px solid var(--line2); border-left: 3px solid var(--accent); padding: 9px 12px; border-radius: 4px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); animation: tin .2s ease-out; }
.toast.good { border-left-color: var(--good); } .toast.bad { border-left-color: var(--bad); }
@keyframes tin { from { transform: translateY(6px); opacity: 0; } }

/* live match */
.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 12px; }
.score .side { display: flex; align-items: center; gap: 10px; min-width: 0; }
.score .side.r { flex-direction: row-reverse; text-align: right; }
.score .pts { font: 700 48px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.score .clk { text-align: center; }
.score .clk b { display: block; font: 700 22px/1 var(--f-mono); color: var(--accent); }
.score .clk span { font-size: 12px; color: var(--muted); }
.feed { max-height: 360px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
.ev { display: grid; grid-template-columns: 92px 64px minmax(0, 1fr); gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
.ev .c { color: var(--dim); font-family: var(--f-mono); font-size: 11.5px; }
.ev .s { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.ev.sys { background: var(--panel2); color: var(--accent); font-weight: 500; }
.ev.s0 { box-shadow: inset 3px 0 0 var(--c0); } .ev.s1 { box-shadow: inset 3px 0 0 var(--c1); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 4px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 5px 10px; cursor: pointer; color: var(--muted); border-right: 1px solid var(--line2); font-size: 12.5px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-soft); color: var(--accent); }

/* start screen */
.start { max-width: 1180px; margin: 0 auto; padding-block: 28px 60px; padding-inline: 16px; }
.start .hero { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 18px; }
.start .hero h1 { font: 700 clamp(34px, 6vw, 60px)/.92 var(--f-display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.start .hero h1 b { color: var(--accent); }
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; border-top: 3px solid var(--c); text-align: left; }
@media (hover: hover) { .tcard:hover { border-color: var(--line2); background: var(--panel2); } }
.tcard.sel { outline: 2px solid var(--accent); }
.tcard .tn { font: 600 17px/1.1 var(--f-display); letter-spacing: .02em; }
.tcard .ts { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.lgbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0; margin-bottom: 12px; background: var(--bg); border-bottom: 1px solid var(--line); }

.court { background: radial-gradient(circle at 50% 120%, rgba(238, 125, 47, .10), transparent 60%); }
.bracket { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 10px; }
.ser { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; margin-bottom: 6px; font-size: 12.5px; }
.ser div { display: flex; justify-content: space-between; gap: 6px; }
.ser .w { color: var(--fg); font-weight: 600; } .ser .l { color: var(--dim); }
.capbar { position: relative; height: 26px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin: 18px 0 26px; }
.capbar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); opacity: .85; }
.capbar > b { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--fg); }
.capbar > b span { position: absolute; top: 28px; left: -30px; width: 60px; text-align: center; font-size: 11px; color: var(--muted); font-weight: 400; }
.msg { border-bottom: 1px solid var(--line); padding: 10px 14px; cursor: pointer; }
@media (hover: hover) { .msg:hover { background: var(--panel2); } }
.msg .tt { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.msg.unread .tt::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.msg .wh { color: var(--dim); font-size: 11.5px; }
.msg .body { color: var(--muted); margin-top: 6px; white-space: pre-line; cursor: auto; }

@media (max-width: 820px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
  nav.rail { flex-direction: row; overflow-x: auto; padding: 6px 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  nav.rail .grp { display: none; }
  nav.rail a { white-space: nowrap; gap: 6px; }
  main { padding-inline: 16px; }
  .when { margin-left: 0; text-align: left; }
  .top { gap: 10px; }
  .grid, .grid.g2 { grid-template-columns: minmax(0, 1fr); }
  .score .pts { font-size: 36px; }
  .ev { grid-template-columns: 70px minmax(0, 1fr); } .ev .s { display: none; }
  .bracket { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ph .rt { margin-left: 0; }
}

/* badges & honors */
.bdg { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 3px; margin: 0 4px 4px 0; border: 1px solid; white-space: nowrap; }
.bdg.b1 { color: #d39a6a; border-color: rgba(211, 154, 106, .5); background: rgba(211, 154, 106, .1); }
.bdg.b2 { color: #c9d2db; border-color: rgba(201, 210, 219, .5); background: rgba(201, 210, 219, .08); }
.bdg.b3 { color: #f0c548; border-color: rgba(240, 197, 72, .6); background: rgba(240, 197, 72, .12); }
.bdg.b4 { color: #c39bff; border-color: rgba(195, 155, 255, .65); background: rgba(195, 155, 255, .14); }
.bdot { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 50%; font: 600 10.5px/1 var(--f-mono); margin-right: 3px; color: #0c1116; }
.bdot.b1 { background: #d39a6a; } .bdot.b2 { background: #c9d2db; } .bdot.b3 { background: #f0c548; } .bdot.b4 { background: #c39bff; }
.bdlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px 14px; }
.bdi { display: flex; align-items: center; gap: 6px; font-size: 12px; min-width: 0; }
.bdi .bdg { margin: 0; flex: none; }
.hons { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.hon { font-size: 12px; padding: 3px 9px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line2); color: var(--fg); white-space: nowrap; }
.hon.top { border-color: rgba(240, 197, 72, .6); color: #f0c548; background: rgba(240, 197, 72, .1); }

.bdi.pot .bdg { opacity: .55; border-style: dashed; }

.bdtot { display: inline-grid; place-items: center; min-width: 22px; height: 20px; padding: 0 5px; border-radius: 10px; font: 600 11.5px/1 var(--f-mono); color: #0c1116; background: var(--line2); }
.bdtot.b1 { background: #d39a6a; } .bdtot.b2 { background: #c9d2db; } .bdtot.b3 { background: #f0c548; } .bdtot.b4 { background: #c39bff; }
.bdcat { font: 500 11px/1 var(--f-mono); color: var(--muted); margin-right: 5px; }
.bdcats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; margin-bottom: 8px; }
.bdcatbtn { display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 4px; padding: 7px 10px; cursor: pointer; color: var(--fg); font-size: 12.5px; text-align: left; }
.bdcatbtn span { flex: 1; } .bdcatbtn b { font: 700 16px/1 var(--f-display); } .bdcatbtn i { font-style: normal; font-size: 11px; color: var(--dim); }
@media (hover: hover) { .bdcatbtn:hover { border-color: var(--muted); } } .bdcatbtn.on { border-color: var(--accent); background: var(--accent-soft); }
.bdgroup { border-top: 1px solid var(--line); padding: 8px 0 4px; }
.bdgh { font: 600 12px/1 var(--f-display); letter-spacing: .1em; color: var(--accent); margin-bottom: 6px; }

.av.t6 { color: var(--gold); text-shadow: 0 0 8px rgba(240, 197, 72, .35); }

/* ---------- visual layer: team colour, depth instead of outlines, star cards, ritual motion ---------- */
:root { --team: #ee7d2f; --teamhi: #ee7d2f; --ease-out: cubic-bezier(.2, .8, .2, 1); --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --f-display: 'Barlow Condensed', 'DIN Condensed', 'Roboto Condensed', 'Arial Narrow', 'PingFang SC', 'Noto Sans SC', sans-serif; --fl-top: 64px; }
body { background: radial-gradient(110% 60% at 50% -12%, color-mix(in srgb, var(--team) 18%, transparent), transparent 62%) fixed, var(--bg); }
.top { background: linear-gradient(100deg, color-mix(in srgb, var(--team) 44%, var(--rail)) 0%, color-mix(in srgb, var(--team) 12%, var(--rail)) 45%, var(--rail) 80%); border-bottom-color: color-mix(in srgb, var(--teamhi) 45%, var(--line)); box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
nav.rail a.on { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 22%, transparent), transparent); }
.crest { position: relative; text-shadow: 0 1px 2px rgba(0, 0, 0, .7); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .22), 0 2px 6px rgba(0, 0, 0, .35); }
.crest::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(160deg, rgba(255, 255, 255, .3), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, .25)); pointer-events: none; }
/* panels: soft depth instead of 1px outlines */
.card { background: linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, 0) 120px), var(--panel); border-color: rgba(255, 255, 255, .07); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 8px 22px rgba(0, 0, 0, .28); }
.card > h3, .card.fold > summary { color: #c5d0d8; background: linear-gradient(90deg, color-mix(in srgb, var(--team) 24%, transparent), transparent 75%); border-bottom: 1px solid rgba(255, 255, 255, .06); }
.card > h3::before, .card.fold > summary::before { content: ''; width: 3px; height: 12px; border-radius: 2px; background: var(--teamhi); flex: none; }
.card.fold > summary { list-style: none; cursor: pointer; padding: 10px 14px; font: 600 13px/1.2 var(--f-display); letter-spacing: .12em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; min-height: 40px; }
.card.fold > summary::-webkit-details-marker { display: none; }
.card.fold > summary::after { content: '▾'; margin-left: auto; color: var(--muted); transition: transform .2s var(--ease-out); }
.card.fold:not([open]) > summary { border-bottom: 0; } .card.fold:not([open]) > summary::after { transform: rotate(-90deg); }
.note { background: linear-gradient(90deg, rgba(238, 125, 47, .13), rgba(238, 125, 47, .02)); color: #b8c4cd; }
.btn { background: linear-gradient(180deg, #24313c, #1b252e); border-color: #33424f; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 1px 3px rgba(0, 0, 0, .3); transition: transform .12s var(--ease-out), filter .12s, border-color .12s; }
.btn:active:not([disabled]) { transform: translateY(1px) scale(.98); }
.btn.pri { background: linear-gradient(180deg, #f59a52, #e3701f); border-color: #f39048; color: var(--accent-ink); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 4px 14px rgba(238, 125, 47, .28); }
.btn.ghost, .btn.danger { background: transparent; box-shadow: none; }
.seg { background: rgba(0, 0, 0, .2); } .seg button.on { background: linear-gradient(180deg, rgba(238, 125, 47, .28), rgba(238, 125, 47, .12)); }
/* ratings: metallic chips, condensed tabular numerals */
.ov, .av, table.t .num, .badge, .bdot, .bdtot, .sigmini, .score .clk b, .ev .c, .ev .s, .sp-v, .sm-t, .pos, input[type=number], .bdcat { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

.stars .e { color: #6b7b88; } .stars .h { background: linear-gradient(90deg, var(--accent) 50%, #6b7b88 50%); -webkit-background-clip: text; background-clip: text; }

.more-row { padding: 8px; display: flex; justify-content: center; border-top: 1px solid var(--line); }
/* modal: blurred backdrop + short rise */

/* live scoreboard: team colours bleed in from each side */
.lvscore { position: sticky; top: 0; z-index: 4; }

/* start: team cards in team colours */
.tcard { --tbg: linear-gradient(135deg, color-mix(in srgb, var(--c) 62%, #0b1015) 0%, color-mix(in srgb, var(--c) 22%, #121a21) 55%, #121a21 100%);

.lgrules summary::marker { color: var(--accent); }

/* home hero: club banner + star cards of the core rotation */
.hhero { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(160px, auto) minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 12px 14px; margin-bottom: 14px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--teamhi) 30%, transparent);
  background: linear-gradient(120deg, color-mix(in srgb, var(--team) 55%, #0b1015) 0%, color-mix(in srgb, var(--team) 18%, #121a21) 50%, #121a21 100%); box-shadow: 0 10px 28px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .08); }

.hh-s { font-size: 12px; color: rgba(255, 255, 255, .85); } .hh-s em { font: 700 17px/1 var(--f-display); font-style: normal; color: #fff; margin: 0 1px; font-variant-numeric: tabular-nums; }

/* star card */
.pcard { --fr: #c98d5e; --fc: #3b2617; position: relative; isolation: isolate; flex: none; display: flex; flex-direction: column; width: 66px; height: 90px; padding: 5px 6px; border-radius: 7px; overflow: hidden; color: #fff; text-align: left;
  background: radial-gradient(110% 60% at 30% 0%, color-mix(in srgb, var(--pt) 70%, transparent), transparent 75%), linear-gradient(165deg, var(--fc) 0%, #0b1015 95%);
  box-shadow: inset 0 0 0 1.5px var(--fr), inset 0 0 0 3px rgba(0, 0, 0, .35), 0 4px 12px rgba(0, 0, 0, .4); }

.pc-lg { --fr: #ffe27a; --fc: #3a2a08; box-shadow: inset 0 0 0 2px #ffd54a, inset 0 0 0 4px rgba(0, 0, 0, .3), 0 0 16px rgba(255, 213, 74, .35), 0 4px 12px rgba(0, 0, 0, .4); }

.ph { background: linear-gradient(110deg, color-mix(in srgb, var(--pt) 38%, transparent), transparent 62%); border: 1px solid rgba(255, 255, 255, .06); border-radius: 8px; padding: 10px; }
.ph .pcard { width: 76px; height: 104px; } .ph .pcard .pco { font-size: 30px; } .ph .phn { flex: 1 1 220px; min-width: 0; }

/* legend draw: face-down deck, 3D flip, holo face */
.lghero { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; }
.lghero small { display: block; font: 600 11px/1 var(--f-display); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.lghero h1 { margin: 2px 0 0; font: 700 30px/1 var(--f-display); letter-spacing: .03em; } .lghero h1 b { color: var(--gold); }
.lgbar { position: static; display: flex; align-items: center; gap: 8px; padding: 4px 0 8px; margin: 0; background: none; border: 0; }
.lgdeck { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; perspective: 1200px; }
.lgflip { position: relative; aspect-ratio: 5 / 7; padding: 0; border: 0; background: none; cursor: pointer; color: #fff; font: inherit; text-align: left; border-radius: 12px; }
.lgflip:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.lgback, .lgfront { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: inherit; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; }
.lgback { align-items: center; justify-content: center; gap: 6px; background: repeating-linear-gradient(45deg, rgba(255, 255, 255, .04) 0 6px, transparent 6px 12px), radial-gradient(80% 60% at 50% 40%, #3a2a10, #120d06 80%);
  box-shadow: inset 0 0 0 2px rgba(240, 197, 72, .75), inset 0 0 0 6px rgba(0, 0, 0, .35), inset 0 0 0 7px rgba(240, 197, 72, .35), 0 8px 20px rgba(0, 0, 0, .45); }
.lgbk-y { font: 700 46px/1 var(--f-display); color: var(--gold); text-shadow: 0 0 18px rgba(240, 197, 72, .45); }
.lgbk-t { font: 600 12px/1 var(--f-display); letter-spacing: .3em; color: rgba(240, 197, 72, .9); }
.lgfront { transform: rotateY(180deg); padding: 10px; gap: 2px; background: radial-gradient(120% 70% at 20% 0%, rgba(255, 213, 74, .3), transparent 60%), linear-gradient(165deg, #3a2a08, #0b1015 85%);
  box-shadow: inset 0 0 0 2px #ffd54a, inset 0 0 0 4px rgba(0, 0, 0, .35), 0 8px 22px rgba(0, 0, 0, .5); transition: box-shadow .25s; }
.lgfront::after { content: ''; position: absolute; inset: -20%; background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, .5) 50%, transparent 60%); transform: translateX(-130%); pointer-events: none; }

.lgpk { font: 700 14px/1 var(--f-display); color: var(--gold); }
.lgnm { margin-top: auto; font: 700 21px/1 var(--f-display); letter-spacing: .01em; text-shadow: 0 2px 6px rgba(0, 0, 0, .6); }
.lgmeta { font-size: 11px; color: rgba(255, 255, 255, .8); }
.lgrt { display: flex; align-items: flex-end; gap: 6px; margin: 4px 0 6px; }
.lgrt i { display: block; font: 600 10px/1 var(--f-display); letter-spacing: .1em; font-style: normal; color: rgba(255, 255, 255, .78); margin-bottom: 2px; }
.lgrt b { font: 700 28px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.lgrt .pk b { color: var(--gold); text-shadow: 0 0 12px rgba(240, 197, 72, .5); }
.lgar { color: rgba(255, 255, 255, .6); font-size: 12px; padding-bottom: 5px; }
.lgbd { align-self: flex-start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 700 12px/1 var(--f-display); letter-spacing: .04em; color: #1b0e05; padding: 4px 7px; border-radius: 3px; background: linear-gradient(90deg, #ffe27a, #f0c548 40%, #fff3c4 50%, #f0c548 60%, #ffe27a); background-size: 250% 100%; animation: shine 2.6s linear infinite; box-shadow: 0 0 10px rgba(240, 197, 72, .4); }
@keyframes shine { from { background-position: 100% 0; } to { background-position: -150% 0; } }
.lgflip.sel .lgfront { box-shadow: inset 0 0 0 2px #fff3c4, 0 0 0 3px var(--gold), 0 0 26px rgba(240, 197, 72, .6), 0 10px 26px rgba(0, 0, 0, .5); }
.lgflip.sel .lgin { transform: rotateY(180deg) translateY(-4px); }
.lgdeck.deal .lgflip { animation: deal .5s var(--ease-out) calc(var(--i) * 50ms) both; }
@keyframes deal { from { opacity: 0; transform: translateY(-30px) rotate(-6deg) scale(.9); } }
.lgdock { position: sticky; bottom: 0; z-index: 6; display: flex; align-items: stretch; gap: 8px; margin-top: 10px; padding: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, rgba(26, 33, 40, .97), #0f161c); border: 1px solid rgba(240, 197, 72, .35); border-bottom: 0; border-radius: 10px 10px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, .45); }
#lgdet { flex: 1; min-width: 0; }
.lgok { min-width: 96px; font: 700 17px/1 var(--f-display) !important; letter-spacing: .06em; }
.lgdet.empty { display: flex; align-items: center; height: 100%; min-height: 44px; color: var(--muted); }
.lgd-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .lgd-h b { font: 700 18px/1.1 var(--f-display); }
.lgd-y { font-size: 11.5px; color: var(--gold); margin-left: auto; }
.lgd-sig { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: #c5d0d8; margin: 4px 0; } .lgd-sig .sigb { flex: none; }
.lgd-at { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 12px; color: var(--muted); }
.lgd-n { font-size: 12px; color: var(--muted); } .lgd-n summary { cursor: pointer; color: var(--fg); min-height: 28px; display: inline-flex; align-items: center; }

/* celebration overlay */
.fx { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; overflow: hidden; cursor: pointer; background: radial-gradient(60% 50% at 50% 45%, color-mix(in srgb, var(--fxc) 28%, transparent), rgba(4, 7, 10, .8) 75%); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fadein .25s ease-out, fxout .35s ease-in 2.05s forwards; }
.fx.big { animation: fadein .25s ease-out, fxout .35s ease-in 3.25s forwards; }
@keyframes fxout { to { opacity: 0; } }
.fxrays { position: absolute; left: 50%; top: 45%; width: 160vmax; height: 160vmax; margin: -80vmax 0 0 -80vmax; background: repeating-conic-gradient(color-mix(in srgb, var(--fxc) 22%, transparent) 0 8deg, transparent 8deg 22deg); -webkit-mask: radial-gradient(closest-side, #000 8%, transparent 60%); mask: radial-gradient(closest-side, #000 8%, transparent 60%); animation: spin 16s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
.fxbox { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 0 20px; perspective: 800px; animation: fxpop .55s var(--ease-spring) both; }
@keyframes fxpop { from { opacity: 0; transform: scale(.7); } }
.fxbox small { margin-top: 10px; font: 700 13px/1 var(--f-display); letter-spacing: .3em; color: var(--fxc); }
.fxbox b { font: 700 30px/1.05 var(--f-display); color: #fff; text-shadow: 0 2px 12px rgba(0, 0, 0, .6); max-width: 90vw; }
.fxbox > span:last-child { font-size: 13px; color: rgba(255, 255, 255, .88); }
.fxicon { width: 104px; height: 104px; display: grid; place-items: center; font-size: 60px; line-height: 1; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--fxc) 38%, transparent), transparent 70%); }
.fxicon.bdgfx { font-size: 64px; text-shadow: 0 0 24px currentColor; } .bdgfx.b3 { color: #f0c548; } .bdgfx.b4 { color: #c39bff; }
.fx .crest { box-shadow: 0 0 0 3px var(--fxc), 0 0 30px var(--fxc); }
.fx .pcard.xl { animation: fxcard .9s var(--ease-spring) both; }
@keyframes fxcard { from { transform: rotateY(-200deg) scale(.6); opacity: 0; } 50% { opacity: 1; } }
.fxcf { position: absolute; left: 50%; top: 42%; width: 0; height: 0; }
.fxcf i { position: absolute; width: 8px; height: 12px; border-radius: 2px; background: var(--c); opacity: 0; animation: conf 1.8s cubic-bezier(.15, .7, .3, 1) var(--d) both; }
@keyframes conf { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 35% { opacity: 1; transform: translate(calc(var(--x) * 34vw), calc(var(--y) * -34vh)) rotate(calc(var(--r) * .4)); } 100% { opacity: 0; transform: translate(calc(var(--x) * 46vw), calc(var(--y) * 46vh)) rotate(var(--r)); } }
/* floating value changes */
#floats { position: fixed; left: 50%; top: calc(var(--fl-top) + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 84; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
.fl { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 5px; border-radius: 16px; font: 600 13px/1 var(--f-body); color: var(--fg); background: rgba(20, 28, 35, .95); border: 1px solid var(--line2); box-shadow: 0 6px 18px rgba(0, 0, 0, .45); white-space: nowrap; animation: flup 2.6s var(--ease-out) both; }
.fl i { font-style: normal; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; font-size: 11px; background: var(--line2); }
.fl.good { border-color: rgba(79, 191, 127, .55); } .fl.good i { background: var(--good); color: #06210f; }
.fl.bad { border-color: rgba(220, 90, 84, .55); } .fl.bad i { background: var(--bad); color: #fff; }
.fl.pur { border-color: rgba(195, 155, 255, .55); } .fl.pur i { background: #c39bff; color: #1d0c3a; }
@keyframes flup { 0% { opacity: 0; transform: translateY(14px) scale(.9); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-18px); } }
@media (prefers-reduced-motion: reduce) { .fxcf, .fxrays, .pc-lg::after, .lgfront::before, .lgfront::after { display: none; } }

@media (max-width: 820px) {

  .cere-h h2 { font-size: 22px; } .chero.cbigc .cn b { font-size: 18px; }
  /* modal: fixed top strip so the close button and the sticky scoreboard never collide with content */
  #modal::before { content: ''; position: fixed; left: 0; right: 0; top: 0; height: calc(46px + env(safe-area-inset-top, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); z-index: 5; }
  .mbox .x { position: fixed; z-index: 6; }

  .tpickbar { min-height: 48px; padding: 4px 6px 4px 8px; gap: 8px; } .tpickbar .big { font-size: 17px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lghero h1 { font-size: 24px; }
  .lgdeck { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }

  .lgfront { padding: 6px; }

  <div class="card" style="margin-bottom:14px"><div class="bd row"><span>薪资 <b class="num">${money(pay)}</b></span><span class="muted">·</span><span>${pay < CAP ? `空间 <b class="good num">${money(CAP - pay)}</b>` : '<span class="warn">已超帽</span>'}</span><span class="muted">·</span><span>中产特例 ${S.mleUsed ? '<span class="dim">已用</span>' : `<b class="acc">≤${MLE}M 可用</b>`}</span><span class="muted">·</span><span>名单 ${n}/${RMAX}</span><span class="sp"></span>
   <div class="seg">${['ALL', ...POS].map(x => `<button class="${FAPOS === x ? 'on' : ''}" data-act="faPos" data-v="${x}">${x === 'ALL' ? '全部' : x}</button>`).join('')}</div><button class="btn sm ${FANOCROWD ? 'pri' : ''}" data-act="faCrowd" title="隐藏标着“位置拥挤”的球员：你队这个位置已经有 3 个以上能力和实际攻防都不比他差的人">${FANOCROWD ? '✓ ' : ''}隐藏拥挤位置</button></div></div>
  <div class="card"><div class="tw"><table class="t"><thead><tr><th>位置</th>${th('fa', 'name', '球员')}${th('fa', 'age', '年龄', 'n')}${th('fa', 'ovr', '能力')}${th('fa', 'pot', '潜力')}${th('fa', 'ask', '要价', 'n')}<th>期望年限</th>${inFA ? '<th>看重</th><th class="n">报价数</th>' : ''}<th>报价（M/年）</th><th>年限</th><th></th></tr></thead><tbody>

   <td>${o ? `<span class="chip acc">${S.fa && S.fa.final && S.fa.final[p.id] ? '最终面谈中' : '已报价·等待中'}</span> <button class="btn sm" data-act="faOffer" data-id="${p.id}">改价</button> <a class="dim" data-act="faCancel" data-id="${p.id}">撤回</a>${S.fa && S.fa.final && S.fa.final[p.id] ? `<div style="margin-top:4px"><select data-chg="faPitch" data-id="${p.id}" aria-label="推销方式" style="font-size:12px;padding:3px 6px;max-width:210px"><option value="">推销方式：不额外推销</option>${Object.entries(PITCHCN).map(([k, l]) => `<option value="${k}" ${o.pitch === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>` : ''}` : S.fa && S.fa.final && S.fa.final[p.id] ? '<span class="dim" style="font-size:12px">最终面谈中，不接受新报价</span>' : `<button class="btn sm ${S.phase === 'fa' ? '' : 'pri'}" data-act="faOffer" data-id="${p.id}">${S.phase === 'fa' ? '报价' : '签约'}</button>`}</td></tr>`; }).join('') || '<tr><td colspan="12" class="dim">没有符合条件的自由球员</td></tr>'}
  </tbody></table></div></div>`;
};

/* ---- draft ---- */
// draft fit uses the scouted ranges projected toward potential (what the user can actually know)
function draftFit(p, v) { const gr = Math.max(0, ((v.pot[0] + v.pot[1]) - (v.ovr[0] + v.ovr[1])) / 2) * .15, a = {}; for (const k in v.a) a[k] = (v.a[k][0] + v.a[k][1]) / 2 + gr; return fitChips(p, a, 2); }
