<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CBA 篮球经理 2026-27</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: FM-style shell — sticky club bar on top, left rail nav, dense data panels in main. Single dark theme by choice. */
:root {
  --bg: #0c1116; --rail: #0f161c; --panel: #141c23; --panel2: #1a242d; --line: #24303a; --line2: #2f3d49;
  --fg: #dde5ea; --muted: #8394a2; --dim: #7d8d9a;
  --accent: #3d8bfd; --accent-ink: #03122a; --accent-soft: rgba(61, 139, 253, .15); --cba-red: #ef3b43;
  --good: #4fbf7f; --warn: #e2aa3d; --bad: #dc5a54; --elite: #4cc5e3;
  --gold: #f0c548;
  --t1: #d0564f; --t2: #db8b3a; --t3: #c8cbc0; --t4: #5cc07d; --t5: #4cc5e3;
  --f-display: 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', sans-serif-condensed, 'PingFang SC', 'Noto Sans SC', sans-serif;
  --fs-body: 13px; --fs-sm: 12px; --fs-xs: 11px; --fs-lbl: 10px;
  --f-body: 'IBM Plex Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: var(--fs-body)/1.45 var(--f-body); }
* { box-sizing: border-box; }
a { color: inherit; text-decoration: none; cursor: pointer; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

#app { display: grid; grid-template-columns: 188px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--rail); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; flex-wrap: wrap; }
.brand { font: 700 18px/1.05 var(--f-display); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.brand b { color: var(--cba-red); }
.club { display: flex; align-items: center; gap: 10px; min-width: 0; }
.crest { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--f-display); color: #fff; letter-spacing: .03em; flex: none; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .15); }
.club .nm { font: 600 17px/1.1 var(--f-display); letter-spacing: .02em; white-space: nowrap; }
.club .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
.when { color: var(--muted); font-size: 12px; margin-left: auto; text-align: right; white-space: nowrap; }
.when b { color: var(--fg); font: 600 15px/1.1 var(--f-display); letter-spacing: .03em; display: block; }
.go { display: flex; gap: 6px; flex-wrap: wrap; }
.prog { height: 3px; background: var(--accent); position: fixed; left: 0; top: env(safe-area-inset-top, 0px); z-index: 50; transition: width .1s; }

nav.rail { background: var(--rail); border-right: 1px solid var(--line); padding: 10px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
nav.rail .grp { font: 600 11px/1 var(--f-display); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; padding: 12px 10px 6px; }
nav.rail a { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: 4px; color: var(--muted); }
nav.rail a:hover { background: var(--panel2); color: var(--fg); }
nav.rail a.on { background: var(--accent-soft); color: var(--accent); box-shadow: inset 2px 0 0 var(--accent); }
.badge { background: var(--accent); color: var(--accent-ink); font: 600 11px/1 var(--f-mono); padding: 2px 6px; border-radius: 9px; }

main { overflow-y: auto; padding-block: 18px 40px; padding-inline: 20px; min-width: 0; }
.h1 { font: 700 26px/1.1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; margin: 0 0 4px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 16px; max-width: 70ch; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); align-items: start; }
.grid.g2 { grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); }
.grid > * { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sp { flex: 1; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.card > h3 { margin: 0; padding: 10px 14px; font: 600 13px/1.2 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.card > h3 .sp { flex: 1; }
.card .bd { padding: 12px 14px; }
.card .bd.flush { padding: 0; }
.ftiles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); }
.ftile .bd { display: flex; flex-direction: column; gap: 4px; }
.ftile .k { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
.ftile .s { color: var(--muted); font-size: 12px; }
.abroad-ask { border-color: var(--accent); }
.abr-row + .abr-row { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
.fevs { display: flex; flex-direction: column; }
.fev { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.fev .why { flex: 1 1 160px; min-width: 0; }
.fev .wh { font-size: 11.5px; }
.ipcs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.ipc { display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.ipc .k { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
.ipc b { font: 600 22px/1.1 var(--f-display); }
.ipc .s { color: var(--dim, var(--muted)); font-size: 11.5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.big { font: 700 34px/1 var(--f-display); letter-spacing: .01em; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .acc { color: var(--accent); }
.note { background: var(--panel2); border-left: 3px solid var(--accent); padding: 9px 12px; border-radius: 0 4px 4px 0; color: var(--muted); }
.note b { color: var(--fg); }

.btn { background: var(--panel2); border: 1px solid var(--line2); padding: 6px 12px; border-radius: 4px; cursor: pointer; white-space: nowrap; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.go .btn.pri { font: 600 15px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 9px 16px; }

.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font: 600 11px/1.2 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
table.t th.sortable { cursor: pointer; } table.t th.sortable:hover, table.t th.on { color: var(--accent); }
table.t td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t tr:hover td { background: rgba(255, 255, 255, .025); }
table.t .n, table.t th.n { text-align: right; }
table.t tr.me td { background: var(--accent-soft); }
table.t tr.cut td { border-bottom: 2px solid var(--line2); }
table.t .num { font: 500 var(--fs-sm)/1.2 var(--f-display); font-variant-numeric: tabular-nums; }
.pl { color: var(--fg); font-weight: 500; } .pl:hover { color: var(--accent); text-decoration: underline; }
.tm { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; } .tm i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; } .tm:hover { color: var(--accent); }
.pos i { font-style: normal; color: var(--dim); }
.ph .jersey small { display: block; font-size: 12px; opacity: .75; margin-top: 2px; }
.ph .jersey { flex-direction: column; }
.depths { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.depth { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; line-height: 1.9; font-size: 12.5px; }
.depth .dh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.depth .dh b { font: 700 18px/1 var(--f-display); color: var(--accent); }
.depth .dh span { font-size: 11.5px; }
.pos { font: 600 11px/1 var(--f-mono); color: var(--muted); background: var(--panel2); border: 1px solid var(--line2); padding: 2px 4px; border-radius: 3px; }

.ov { display: inline-block; min-width: 28px; text-align: center; font: 600 var(--fs-sm)/1 var(--f-display); font-variant-numeric: tabular-nums; padding: 3px 4px; border-radius: 3px; color: #0c1116; }
.ov.t1 { background: var(--t1); } .ov.t2 { background: var(--t2); } .ov.t3 { background: var(--t3); } .ov.t4 { background: var(--t4); } .ov.t5 { background: var(--t5); }
.ov.t6 { background: linear-gradient(90deg, #ffd54a, #ff8a3d); color: #1b0e05; box-shadow: 0 0 0 1px rgba(255, 213, 74, .55), 0 0 8px rgba(255, 170, 60, .35); }
.av { font: 600 13px/1 var(--f-mono); }
.av.t1 { color: var(--t1); } .av.t2 { color: var(--t2); } .av.t3 { color: var(--t3); } .av.t4 { color: var(--t4); } .av.t5 { color: var(--t5); }
.stars { letter-spacing: 1px; white-space: nowrap; font-size: 13px; }
.stars .f { color: var(--accent); } .stars .e { color: var(--line2); }
.stars .h { background: linear-gradient(90deg, var(--accent) 50%, var(--line2) 50%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.chip { display: inline-block; font-size: 11.5px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
.chip.win { color: var(--good); border-color: rgba(79, 191, 127, .4); } .chip.rebuild { color: var(--elite); border-color: rgba(76, 197, 227, .4); }
.chip.acc { color: var(--accent); border-color: rgba(238, 125, 47, .45); }
.chip.st { color: var(--fg); border-color: var(--muted); }
.W { color: var(--good); font-weight: 600; } .L { color: var(--bad); font-weight: 600; }
.meter { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.meter > i { display: block; height: 100%; background: var(--accent); }
.meter.g > i { background: var(--good); } .meter.w > i { background: var(--warn); } .meter.b > i { background: var(--bad); }
.know { display: inline-block; width: 60px; vertical-align: middle; }

/* attributes */
.attrs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 4px 18px; }
.attrs h4 { margin: 6px 0 4px; font: 600 11px/1 var(--f-display); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; grid-column: auto; }
.ar { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px dotted var(--line); gap: 8px; }
.ar span:first-child { color: var(--muted); }

/* player header */
.ph { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.ph .jersey { width: 56px; height: 56px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font: 700 22px/1 var(--f-display); color: #fff; flex: none; }
.ph .nm { font: 700 24px/1.05 var(--f-display); letter-spacing: .02em; }
.ph .meta { color: var(--muted); font-size: 12.5px; }
.ph .rt { margin-left: auto; display: flex; gap: 18px; }
.ph .rt div { text-align: center; } .ph .rt small { display: block; color: var(--dim); font: 600 10.5px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 5px; }

/* inputs */
input[type=number], select, textarea, input[type=text] { background: var(--bg); color: var(--fg); border: 1px solid var(--line2); border-radius: 4px; padding: 5px 7px; font: inherit; }
input[type=number] { width: 74px; font-family: var(--f-mono); }
input[type=range] { accent-color: var(--accent); width: 100%; }
textarea { width: 100%; min-height: 110px; font: 11.5px/1.4 var(--f-mono); }
.slider { display: grid; grid-template-columns: 110px minmax(0, 1fr) 54px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.slider small { grid-column: 1 / -1; color: var(--dim); margin-top: -4px; }

/* modal & toast */
[hidden] { display: none !important; }
#modal { position: fixed; inset: 0; background: rgba(4, 7, 10, .72); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
.mbox { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; width: min(920px, 100%); position: relative; padding: 18px 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
.mbox .x { position: absolute; right: 10px; top: 8px; background: none; border: 0; font-size: 22px; color: var(--muted); cursor: pointer; }
#toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 80; max-width: min(380px, calc(100% - 32px)); }
.toast { background: var(--panel2); border: 1px solid var(--line2); border-left: 3px solid var(--accent); padding: 9px 12px; border-radius: 4px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); animation: tin .2s ease-out; }
.toast.good { border-left-color: var(--good); } .toast.bad { border-left-color: var(--bad); }
@keyframes tin { from { transform: translateY(6px); opacity: 0; } }

/* live match */
.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 12px; }
.score .side { display: flex; align-items: center; gap: 10px; min-width: 0; }
.score .side.r { flex-direction: row-reverse; text-align: right; }
.score .pts { font: 700 48px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.score .clk { text-align: center; }
.score .clk b { display: block; font: 700 22px/1 var(--f-mono); color: var(--accent); }
.score .clk span { font-size: 12px; color: var(--muted); }
.feed { max-height: 360px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
.ev { display: grid; grid-template-columns: 92px 64px minmax(0, 1fr); gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
.ev .c { color: var(--dim); font-family: var(--f-mono); font-size: 11.5px; }
.ev .s { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.ev.sys { background: var(--panel2); color: var(--accent); font-weight: 500; }
.ev.s0 { box-shadow: inset 3px 0 0 var(--c0); } .ev.s1 { box-shadow: inset 3px 0 0 var(--c1); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 4px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 5px 10px; cursor: pointer; color: var(--muted); border-right: 1px solid var(--line2); font-size: 12.5px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-soft); color: var(--accent); }

/* start screen */
.start { max-width: 1180px; margin: 0 auto; padding-block: 28px 60px; padding-inline: 16px; }
.start .hero { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 18px; }
.start .hero h1 { font: 700 clamp(34px, 6vw, 60px)/.92 var(--f-display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.start .hero h1 b { color: var(--cba-red); }
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; border-top: 3px solid var(--c); text-align: left; }
.tcard:hover { border-color: var(--line2); background: var(--panel2); }
.tcard.sel { outline: 2px solid var(--accent); }
.tcard .tn { font: 600 17px/1.1 var(--f-display); letter-spacing: .02em; }
.tcard .ts { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }

.court { background: radial-gradient(circle at 50% 120%, rgba(238, 125, 47, .10), transparent 60%); }
.bracket { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 10px; }
.ser { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; margin-bottom: 6px; font-size: 12.5px; }
.ser div { display: flex; justify-content: space-between; gap: 6px; }
.ser .w { color: var(--fg); font-weight: 600; } .ser .l { color: var(--dim); }
.capbar { position: relative; height: 26px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin: 18px 0 26px; }
.capbar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); opacity: .85; }
.capbar > b { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--fg); }
.capbar > b span { position: absolute; top: 28px; left: -30px; width: 60px; text-align: center; font-size: 11px; color: var(--muted); font-weight: 400; }
.msg { border-bottom: 1px solid var(--line); padding: 10px 14px; cursor: pointer; }
.msg:hover { background: var(--panel2); }
.msg .tt { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.msg.unread .tt::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.msg .wh { color: var(--dim); font-size: 11.5px; }
.msg .body { color: var(--muted); margin-top: 6px; white-space: pre-line; cursor: auto; }

@media (max-width: 820px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
  nav.rail { flex-direction: row; overflow-x: auto; padding: 6px 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  nav.rail .grp { display: none; }
  nav.rail a { white-space: nowrap; gap: 6px; }
  main { padding-inline: 16px; }
  .when { margin-left: 0; text-align: left; }
  .top { gap: 10px; }
  .grid, .grid.g2 { grid-template-columns: minmax(0, 1fr); }
  .score .pts { font-size: 36px; }
  .ev { grid-template-columns: 70px minmax(0, 1fr); } .ev .s { display: none; }
  .bracket { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ph .rt { margin-left: 0; }
}

/* badges & honors */
.bdg { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 3px; margin: 0 4px 4px 0; border: 1px solid; white-space: nowrap; }
.bdg.b1 { color: #d39a6a; border-color: rgba(211, 154, 106, .5); background: rgba(211, 154, 106, .1); }
.bdg.b2 { color: #c9d2db; border-color: rgba(201, 210, 219, .5); background: rgba(201, 210, 219, .08); }
.bdg.b3 { color: #f0c548; border-color: rgba(240, 197, 72, .6); background: rgba(240, 197, 72, .12); }
.bdg.b4 { color: #c39bff; border-color: rgba(195, 155, 255, .65); background: rgba(195, 155, 255, .14); }
.bdot { display: inline-grid; place-items: center; min-width: 18px; height: 18px; border-radius: 50%; font: 600 10.5px/1 var(--f-mono); margin-right: 3px; color: #0c1116; }
.bdot.b1 { background: #d39a6a; } .bdot.b2 { background: #c9d2db; } .bdot.b3 { background: #f0c548; } .bdot.b4 { background: #c39bff; }
.bdlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px 14px; }
.bdi { display: flex; align-items: center; gap: 6px; font-size: 12px; min-width: 0; }

.champ .cbig { font: 700 24px/1.2 var(--f-display); }
.t tr.sel td { background: color-mix(in srgb, var(--elite) 8%, transparent); }
.chip.rise { color: var(--accent); border-color: rgba(255, 170, 60, .45); }

/* matchup panel: diverging bars, green = our edge, red = theirs */
.mu { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.mu-h { display: flex; align-items: center; margin-bottom: 8px; font: 600 11px/1 var(--f-display); letter-spacing: .14em; color: var(--muted); }
.mu-h .dim { cursor: help; border: 1px solid var(--line2); border-radius: 50%; width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; letter-spacing: 0; }

.mu-l { font-weight: 600; font-size: 13px; }

.sm-r.p .sm-i { color: var(--good); } .sm-r.n .sm-i { color: var(--bad); }
.sp-g { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px 10px; align-items: center; }
.sp-v { font: 600 13px/1 var(--f-mono, monospace); color: var(--muted); } .sp-v.r { text-align: right; } .sp-v.lead { color: var(--fg); }
.sp-m { cursor: help; } .sp-l { font-size: 11.5px; color: var(--muted); text-align: center; margin-bottom: 4px; }
.dvb i.a { background: var(--accent); }
.tacp { display: flex; flex-wrap: wrap; gap: 4px 12px; cursor: help; }

.tacp i { width: 7px; height: 7px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--line2); }
.tacp i.o { background: var(--muted); border-color: var(--muted); } .tacp i.p { background: var(--good); border-color: var(--good); } .tacp i.n { background: var(--bad); border-color: var(--bad); }

.sig.god .sigb { background: linear-gradient(90deg, #f0c548, #ee7d2f); color: #1b0e05; border-color: transparent; }
.sig.god { border-color: rgba(240, 197, 72, .55); }

.chip.sf { font-size: 11px; padding: 1px 6px; } .chip.sf i { font-style: normal; opacity: .85; margin-left: 4px; font-size: 10.5px; }

/* ---- star-card theme (REQ-021): arena floor, team-colour accents, foil rating badges ---- */
:root { --ball: #f08a24; --ball-soft: rgba(240, 138, 36, .16); --foil: linear-gradient(115deg, #ffd54a 0%, #fff1a8 22%, #f0a83a 40%, #ffd54a 58%, #c39bff 80%, #7fe3f7 100%); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
main.court {
  background:
    radial-gradient(circle at 50% 108%, transparent 0 128px, rgba(255, 255, 255, .045) 129px 131px, transparent 132px),
    radial-gradient(120% 60% at 50% -12%, rgba(240, 138, 36, .13), transparent 62%),
    repeating-linear-gradient(90deg, rgba(222, 160, 96, .028) 0 54px, rgba(0, 0, 0, .07) 54px 56px),
    var(--bg);
}
.top { background: linear-gradient(100deg, color-mix(in srgb, var(--tc, var(--rail)) 32%, var(--rail)) 0%, var(--rail) 58%); border-bottom: 2px solid var(--tc, var(--line)); }
.crest { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .22), 0 2px 6px rgba(0, 0, 0, .45); text-shadow: 0 1px 2px rgba(0, 0, 0, .7); }
nav.rail a.on { background: linear-gradient(90deg, var(--ball-soft), transparent); color: #ffb366; box-shadow: inset 0 -2px 0 var(--ball); }
@media (min-width: 821px) { nav.rail a.on { box-shadow: inset 3px 0 0 var(--ball); } }
.card { background-color: var(--panel); background-image: linear-gradient(180deg, rgba(255, 255, 255, .035), transparent 40%); border-color: #26323d; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 6px 18px rgba(0, 0, 0, .28); }
.card > h3 { color: var(--fg); background: linear-gradient(90deg, var(--ball-soft), transparent 65%); border-bottom-color: rgba(240, 138, 36, .28); }
.card > h3::before { content: ''; flex: none; width: 3px; height: 12px; border-radius: 2px; background: var(--ball); box-shadow: 0 0 6px rgba(240, 138, 36, .6); }
.btn.pri { background: linear-gradient(180deg, #7ab4ff, #3d8bfd); border-color: #3d8bfd; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 2px 8px rgba(47, 116, 224, .35); color: #04122a; }
.go .btn.pri { background: linear-gradient(180deg, #ffa647, #e07412); border-color: #e07412; color: #1b0e05; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 2px 10px rgba(240, 138, 36, .45); }
.ov { border-radius: 4px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 -1px 0 rgba(0, 0, 0, .25); }
.ov.t1 { background: linear-gradient(160deg, #f39a93, #dc6058); }
.ov.t2 { background: linear-gradient(160deg, #f5b86e, #c9792c); }
.ov.t3 { background: linear-gradient(160deg, #eef0e8, #a9ad9f); }
.ov.t4 { background: linear-gradient(160deg, #8fe3a8, #3aa863); }
.ov.t5 { background: linear-gradient(160deg, #9debfb, #2aa6c8); }
.ov.t6 { background: var(--foil); background-size: 220% 100%; color: #1b0e05; }
.av.t1 { color: #ee7a72; }
.stars .e { color: #62737f; }
.tcard { position: relative; overflow: hidden; background-color: var(--panel); background-image: linear-gradient(160deg, color-mix(in srgb, var(--c) 24%, transparent) 0%, transparent 58%); transition: transform .15s ease-out, box-shadow .15s ease-out; }
.tcard::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, .07) 50%, transparent 60%); }
.tcard:hover { transform: translateY(-1px); }
.tcard.sel { outline: 2px solid var(--ball); box-shadow: 0 0 0 4px rgba(240, 138, 36, .22), 0 8px 22px rgba(0, 0, 0, .4); }
.start .hero h1 { background: linear-gradient(180deg, #fff, #c9d3da); -webkit-background-clip: text; background-clip: text; color: transparent; }
.start .hero h1 b { background: linear-gradient(180deg, #ff6a5e, #e3262f); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ph.card-star { border: 2px solid transparent; border-radius: 10px; padding: 10px 12px; background: linear-gradient(135deg, color-mix(in srgb, var(--tc) 34%, #121a21) 0%, #121a21 62%) padding-box, var(--foil) border-box; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); }
.ph.card-star .jersey { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .25), inset 0 -14px 18px rgba(0, 0, 0, .25), 0 4px 10px rgba(0, 0, 0, .45); }
.ph.card-star .rt .ov { font-size: 18px; padding: 5px 6px; min-width: 40px; }
.ph.card-star .ov.t6 { animation: foil 3.2s linear infinite; }
@keyframes foil { to { background-position: -220% 0; } }
.score { background: radial-gradient(80% 130% at 0% 50%, color-mix(in srgb, var(--hc, transparent) 30%, transparent), transparent 60%), radial-gradient(80% 130% at 100% 50%, color-mix(in srgb, var(--ac, transparent) 30%, transparent), transparent 60%), linear-gradient(180deg, #0b1015, #06090c); border-color: #33281c; box-shadow: inset 0 0 0 1px rgba(240, 138, 36, .14), 0 8px 24px rgba(0, 0, 0, .45); }
.score .pts { color: #ffe2bf; text-shadow: 0 0 14px rgba(255, 150, 50, .55); font-variant-numeric: tabular-nums; }
.score .clk b { color: #ffa24a; font-family: var(--f-display); font-size: 24px; text-shadow: 0 0 10px rgba(255, 140, 40, .6); }
.score.fin { border-color: rgba(240, 197, 72, .55); }
.score.fin .clk b { color: var(--gold); }

  startGame: () => { if (PICKTEAM == null) return; S.userTid = PICKTEAM; const t = U(); bump(); msg(`欢迎来到 ${t.city}`, `董事会对你的期望：${{ win: '冲击总冠军。', mid: '打进季后赛（前 12 名）。', rebuild: '保级（别掉进第 19、20 名的升降级附加赛），培养年轻核心。' }[teamMode(t.id)]}\n老板给的外援预算：${moneyU(t.ib)}（联盟外援薪资上限 ${moneyU(ICAP)}）。\n\n上手提示：\n· 顶部“继续”模拟一轮，或一次模拟一周 / 到下一阶段 / 到常规赛结束。\n· 主页可以“观看文字直播”你的比赛，暂停后可以换人、改对位。\n· 外援市场：能力越强越难请，给钱也不一定来；外援政策：同时最多注册 3 人、每季 6 人次，每场四节合计最多 7 人次（第四节只能 1 人）。\n· 球迷与收入：人气决定上座、周边和赞助；收入 = 门票 + 周边 + 赞助 + 联盟分红 + 战绩奖金。可以调票价。年轻球员申请留洋时，放行能换来社会关注和人气。\n· 战术页设置首发、分钟和外援上场节次（四节 7 人次：前三节每节最多 2 人，第四节 1 人）。\n· 交易页勾选双方国内球员和选秀权，实时看对方态度（外援不能交易）。\n· 选秀页用球探点数考察新秀，缩小属性误差。`, 'info'); save(); go('home'); },
  openMsg: (d, el, e) => { if (e && e.target.closest('[data-stop]')) return; const m = S.inbox.find(x => x.id === +d.id); if (!m) return; m.read = true; OPENMSG = OPENMSG === m.id ? null : m.id; save(); if (VIEW !== 'inbox') { VIEW = 'inbox'; render(); } else rerender(); },
  offerAccept: d => {

  },

  offerCounter: d => { if ($('#mbody .offerpop')) closeModal(); const m = S.inbox.find(x => x.id === +d.id); if (!m) return; const { from, aiGive, aiGet } = m.data; TR = { tid: from, mine: aiGet.pids.filter(id => S.players[id] && S.players[id].tid === S.userTid), myPk: [...aiGet.picks], theirs: aiGive.pids.filter(id => S.players[id] && S.players[id].tid === from), thPk: [...aiGive.picks] }; m.status = 'rejected'; save(); go('trade'); },
  autoRot: () => { U().rot = lockedAutoRot(S.userTid); save(); rerender(); const n = Object.keys(U().lockMin || {}).length; toast(n ? `已自动安排，${n} 名锁定球员保持原分钟数` : '已按能力自动安排轮换'); },
  rotLock: d => { const t = U(), id = +d.id, rot = getRot(t.id); t.lockMin = t.lockMin || {}; if (t.lockMin[id]) delete t.lockMin[id]; else { const i = rot.findIndex(x => x.id === id); t.lockMin[id] = { min: rot[i].min, st: i < 5 }; } save(); rerender(); },
  rotMove: d => { const r = getRot(S.userTid), i = +d.i, j = i + +d.d; if (j < 0 || j >= r.length) return; [r[i], r[j]] = [r[j], r[i]]; U().rot = r; syncLocks(); save(); rerender(); },
  trClear: () => { trInit(TR.tid); rerender(); },

  trSubmit: () => {
    const uG = { pids: TR.mine, picks: TR.myPk }, aG = { pids: TR.theirs, picks: TR.thPk };

    if (!ev.accept) { toast(`${team(TR.tid).abbr} 拒绝了：${ev.ratio > .85 ? '“差一点，再加点筹码。”' : '“这个报价对我们没有吸引力。”'}`, 'bad'); return; }
    const txt = executeTrade(S.userTid, TR.tid, uG, aG); S.news.unshift({ when: dayLabel(), txt: '交易：' + txt }); msg('交易完成', txt, 'info'); toast('交易完成！', 'good'); trInit(TR.tid); save(); rerender();
  },
  tradeWith: d => { trInit(+d.tid); go('trade'); },

  shop: d => { const n = shopPlayer(+d.id); closeModal(); toast(n ? `收到 ${n} 份报价，去收件箱查看` : '暂时没有球队愿意出价', n ? 'good' : ''); save(); if (n) { VIEW = 'inbox'; OPENMSG = S.inbox[0].id; } render(); },
  release: d => { CONFIRM = 'rel' + d.id; modal(playerHTML(S.players[+d.id])); },
  cancelConfirmP: d => { CONFIRM = null; modal(playerHTML(S.players[+d.id])); },

  neg: d => openNeg(+d.id),
  negSubmit: d => { const sal = parseFloat($('#negSal').value), yrs = +$('#negYrs').value; if (!(sal >= MINSAL)) { toast('请输入有效年薪'); return; } const r = negotiate(+d.id, clamp(sal, MINSAL, MAXSAL), yrs); save(); if (r.ok) { closeModal(); toast(r.txt, 'good'); render(); } else openNeg(+d.id, r); },
  faPos: d => { FAPOS = d.v; rerender(); },
  rfaYes: d => { const r = rfaDecide(+d.id, true); toast(r.txt, r.ok ? 'good' : 'bad'); save(); rerender(); },
  rfaNo: d => { const r = rfaDecide(+d.id, false); toast(r.txt, r.ok ? '' : 'bad'); save(); rerender(); },
  faCrowd: () => { FANOCROWD = !FANOCROWD; rerender(); },
  faOffer: d => { const id = +d.id, sal = parseFloat($('#fa-sal-' + id).value), yrs = +$('#fa-yrs-' + id).value; if (!(sal >= MINSAL)) { toast('请输入有效报价'); return; } const r = signFA(id, clamp(sal, MINSAL, MAXSAL), yrs); toast(r.txt, r.ok ? 'good' : 'bad'); save(); rerender(); },
  faCancel: d => { delete S.fa.offers[+d.id]; save(); rerender(); },
  faDay: () => { faNextDay(); save(); toast(S.fa.day > FA_DAYS ? '自由市场结束，可以开始新赛季' : `自由市场第 ${S.fa.day} 天`); render(); },
  startFA: () => { if (abroadPending().length) { toast('先在主页答复留洋申请，再进入自由市场', 'bad'); go('home'); return; } startFA(); save(); go('fa'); },
  newSeason: () => { const e = newSeason(); if (e) { toast(e, 'bad'); go('squad'); return; } save(); toast(`${fs(S.season)} 赛季开始！`, 'good'); TR = null; OPENMSG = S.inbox[0].id; go('inbox'); },
  scout: d => { if (scoutProspect(+d.id)) { save(); if (!$('#modal').hidden) openPlayer(+d.id); rerender(); } },
  draftSort: d => { DRAFTSORT = d.v; rerender(); },
  draftPick: d => { draftPlayer(+d.id); afterDraftStep(); },

  draftUntil: () => { draftUntilUser(); afterDraftStep(); },
  draftAll: () => { while (S.phase === 'draft') { if (curPick() && pickOwner(curPick()) === S.userTid) ACT.draftAutoSilent(); else aiPick(); } afterDraftStep(); },
  draftPassMe: () => { draftPass(); afterDraftStep(); },
  draftAutoSilent: () => { const best = prospects().map(p => ({ p, v: prospectView(p) })).sort((a, b) => b.v.est - a.v.est)[0]; if (best) draftPlayer(best.p.id); else aiPick(); },
  export: () => { $('#expBox').value = JSON.stringify(S); toast('存档文本已生成'); },
  copyExport: () => { const b = $('#expBox'); if (!b.value) b.value = JSON.stringify(S); b.select(); try { navigator.clipboard.writeText(b.value).then(() => toast('已复制到剪贴板', 'good'), () => toast('请手动复制选中的文本')); } catch (e) { toast('请手动复制选中的文本'); } },
  importText: () => importSave($('#impBox').value),

  slots: () => openSlots(),
  trWith: d => { trInit(+d.id); rerender(); $('main').scrollTop = 0; },
  glDown: d => { const p = S.players[+d.id]; if (!p || p.tid !== S.userTid) return; if (rosterN(S.userTid) <= 8) { toast('一队至少要留 8 人', 'bad'); return; } sendDown(p); const t = U(); if (t.lockMin) delete t.lockMin[p.id]; save(); rerender(); toast(`${pname(p)} 已下放CBDL`); },
  glUp: d => { const p = S.players[+d.id]; if (!p) return; if (rosterN(S.userTid) >= RMAX) { toast('一队名单已满，先下放或裁掉一人', 'bad'); return; } recallUp(p); save(); rerender(); toast(`${pname(p)} 已召回一队`, 'good'); },
  cereNext: () => { closeModal(); },
  sqPo: d => { SQPO = d.v === '1'; rerender(); },
  poSugYes: d => { const r = poMinSug(+d.opp), t = U(), cur = getRot(t.id); if (S.poSugDone && S.poSugDone.key === r.key) return; S.poSugDone = { key: r.key, list: r.list }; t.rot = cur.map(x => { const o = r.list.find(o => o.id === x.id); return { id: x.id, min: o ? o.sug : x.min }; }); save(); closeModal(); rerender(); toast(`已采用第 ${r.game} 场上场时间建议`, 'good'); },
  rotSugYes: () => { if (ROTSUG) { U().rot = ROTSUG; ROTSUG = null; save(); } closeModal(); rerender(); toast('已采用建议轮换', 'good'); },
  rotSugKeep: () => { ROTSUG = null; closeModal(); rerender(); },

};
function afterDraftStep() { save(); if (S.phase !== 'draft') { toast('选秀结束，进入续约期', 'good'); go('home'); } else rerender(); }
function importSave(txt) {
  try { const s = JSON.parse(txt); if (!s || s.v !== 2 || s.game !== 'cba' || !s.players || !s.teams) throw 0; S = s; bump(); migrate(); TR = null; VIEW = 'home'; save(); closeModal(); render(); toast('存档已导入', 'good'); }
  catch (e) { toast('无法读取：这不是有效的 CBA 篮球经理存档', 'bad'); }
}
const CHG = {
  hYear: (d, el) => { HYEAR = +el.value; rerender(); },
  dYear: (d, el) => { DYEAR = +el.value; rerender(); },

  trTog: (d, el) => { const arr = TR[d.side], id = d.side.endsWith('Pk') ? d.id : +d.id; const i = arr.indexOf(id); if (i >= 0) arr.splice(i, 1); else arr.push(id); rerender(); },
  sTeam: (d, el) => { STEAM = +el.value; rerender(); },
  sQual: (d, el) => { SQUAL = el.checked; rerender(); },
  offCore: (d, el) => { U().tac.offCore = el.value === '' ? null : +el.value; save(); rerender(); toast(el.value === '' ? '已取消进攻核心' : `进攻核心：${pname(S.players[+el.value])}`, 'good'); },
  defCore: (d, el) => { U().tac.defCore = el.value === '' ? null : +el.value; save(); rerender(); toast(el.value === '' ? '已取消防守核心' : `防守核心：${pname(S.players[+el.value])}`, 'good'); },
  stopper: (d, el) => { U().tac.stopper = el.value === '' ? null : +el.value; save(); rerender(); },
  stopMode: (d, el) => { U().tac.stopMode = el.value; save(); rerender(); },

  lvMatch: (d, el) => { if (!LIVE || LIVE.done) return; LIVE.G.setMatch(LIVE.side, +d.id, el.value === '' ? null : +el.value); drawLive(); },
  slotName: (d, el) => { SLOTNAME = el.value; },
  iqTog: (d, el) => { const t = U(), id = +d.id, q = +d.q, cur = iqPlan(t.id), nx = {}; for (const k in cur) nx[k] = cur[k].slice(); const a = nx[id] = nx[id] || []; if (el.checked) { if (!a.includes(q)) a.push(q); } else nx[id] = a.filter(x => x !== q); nx[id].sort(); if (!iqValid(nx)) { toast(`超出限制：四节最多 ${IMPQ} 人次，第 1-3 节每节最多 2 名外援、第 4 节 1 名`, 'bad'); el.checked = !el.checked; return; } t.tac.iq = nx; save(); rerender(); },
  pauseOffer: (d, el) => { S.pauseOnOffer = el.checked; save(); },
};

document.addEventListener('click', e => {
  if (e.target.id === 'modal') { closeModal(); rerender(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset, el, e); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'impFile' && el.files && el.files[0]) { const fr = new FileReader(); fr.onload = () => importSave(fr.result); fr.readAsText(el.files[0]); return; }
  if (el.dataset && el.dataset.chg && CHG[el.dataset.chg]) CHG[el.dataset.chg](el.dataset, el);
});
document.addEventListener('input', e => { const el = e.target; if (el.type === 'range' && el.dataset.chg === 'tac') CHG.tac(el.dataset, el); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) { closeModal(); rerender(); } });

function boot(data) {
  if (data && data.S) { S = data.S; bump(); migrate(); }
  else if (!load()) newLeague();
  render();
  refreshSlots().then(() => { if (S.userTid == null || VIEW === 'save') render(); }).catch(() => { });
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ S }));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});

</script>
