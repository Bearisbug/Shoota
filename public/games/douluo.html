<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a1709">
<title>斗罗·万相</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=Jersey+10&display=swap" media="print" onload="this.media='all'">
<style>
/* 视觉语言：深褐描金的像素边框 + 米黄壁纸。边框由 JS 生成的 9-slice SVG（--fr-*）绘制，
   文字色随所在表面切换：深色表面（面板/按钮/选项）与纸面（剧情卡/弹窗/卡片）各有一套 token。 */
:root{
  --mar-0:#1b0602;--mar-1:#2b0b04;--mar-2:#4a1709;--mar-3:#5a1e0c;--mar-4:#71301a;
  --gold-0:#a8701f;--gold-1:#e3aa45;--gold-2:#f6d27a;
  --cream:#fbf2c8;--paper:#f6e7bb;--ink:#3a170a;
  --r-white:#f3efe2;--r-yellow:#eebd2c;--r-purple:#9160d6;--r-black:#141016;--r-red:#d8382a;--r-gold:#f7d266;
  --f-disp:"Ma Shan Zheng","STKaiti","KaiTi",serif;
  --f-serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-ui:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Jersey 10","Noto Sans SC",ui-monospace,monospace;
  --col:760px;--dock-h:64px;
  color-scheme:light;
}
.panel,.hud,.dock,.opt,.btn,.vbar,.toast,.flash{
  --fg:#f8e9c6;--dim:#dcb994;--faint:#a88566;--line:#6d3118;--line-2:#8c4a26;
  --gold:#f2c35e;--red:#ff9178;--jade:#a6df8d;--blue:#9cc0ff;
  --panel:#3a1208;--panel-2:#2e0d05;--gold-bg:rgba(242,195,94,.13);--bg:#2b0b04;--track:#220803;--ring-ol:rgba(255,236,200,.3);
  --t-fei:#9b8f86;--t-xia:#cbbca9;--t-zhong:#9fd58d;--t-shang:#93bbff;--t-ding:#d3a6ff;--t-ji:#ffb067;--t-shen:#ffe07a;
  color:var(--fg);
}
.field,.paper,.story,.modal .box,.tile,.idc,.perk,.slot,.fcard,.seg button{
  --fg:#3a170a;--dim:#6b4428;--faint:#97714f;--line:#d6b26f;--line-2:#c09650;
  --gold:#9a5806;--red:#ad2f1c;--jade:#2b7434;--blue:#2f5fae;
  --panel:#fbf1d2;--panel-2:#f0dca9;--gold-bg:rgba(200,140,30,.13);--bg:#f6e7bb;--track:#dcc289;--ring-ol:rgba(58,23,10,.38);
  --t-fei:#857a70;--t-xia:#77685a;--t-zhong:#3a8637;--t-shang:#2c5fb6;--t-ding:#7a3fc2;--t-ji:#c25c0c;--t-shen:#a07400;
  color:var(--fg);
}

*{box-sizing:border-box}
html{background:var(--mar-0);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--f-ui);font-size:14px;line-height:1.6;color:var(--ink);background-color:var(--mar-0);background-image:var(--wall-dark);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;margin:0;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px dashed var(--gold-2);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-family:var(--f-serif);font-weight:900;line-height:1.3;text-wrap:balance}
p{margin:0}
.num{font-family:var(--f-num);font-size:1.22em;line-height:1;letter-spacing:.03em}
.dim{color:var(--dim)}.faint{color:var(--faint)}.small{font-size:12.5px}
.px{display:inline-block;width:1em;height:1em;vertical-align:-.14em;flex:none}
[hidden]{display:none!important}

/* ---------- 版心 ---------- */
.col{position:relative;width:min(var(--col),100%);margin:0 auto;min-height:100vh;background-color:var(--cream);background-image:var(--wall);border-inline:4px solid #cdc58e;box-shadow:0 0 0 4px var(--mar-1);padding-bottom:calc(var(--dock-h) + 28px + env(safe-area-inset-bottom,0px))}
.col.bare{padding-bottom:28px}
.field{display:grid;gap:14px;padding:14px 8px 6px;align-content:start}
@media (min-width:560px){.col{border-inline-width:6px}.field{padding:18px 16px 8px;gap:16px}}

/* ---------- 表面：面板 / 纸 / 剧情卡 ---------- */
.panel{position:relative;min-width:0;background:var(--mar-2);background-clip:padding-box;border:9px solid transparent;border-image:var(--fr-panel) 9 / 9px stretch;padding:4px 6px 8px}
.ph{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;padding:2px 0 6px;margin-bottom:12px;border-bottom:4px solid #efdaa4;list-style:none}
.ph::-webkit-details-marker{display:none}
.ph h2{font-size:19px;letter-spacing:.06em;color:var(--fg)}
.ph .sub{font-size:12.5px;color:var(--dim)}
.ph .rt{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--dim)}
.paper{background:var(--paper);background-clip:padding-box;border:6px solid transparent;border-image:var(--fr-paper) 6 / 6px stretch;padding:10px 12px}
.story{position:relative;min-width:0;background:var(--paper);background-clip:padding-box;border:12px solid transparent;border-image:var(--fr-gold) 12 / 12px stretch;padding:10px 12px 14px;animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both}
.sec-t{font-size:12px;letter-spacing:.14em;color:var(--faint);margin:0 0 6px}

/* ---------- 抬头 HUD ---------- */
.hud{position:sticky;top:0;z-index:20;background:var(--mar-2);padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;box-shadow:inset 0 -3px 0 var(--mar-4),0 4px 0 var(--mar-0)}
.hud-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.avatar{width:58px;height:58px;background:#1a0602;background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-gbtn) 4 / 4px stretch}
.avatar svg{display:block;width:100%;height:100%}
.avatar.lg{width:84px;height:84px}
.hud-name{font-family:var(--f-serif);font-weight:900;font-size:19px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-sub{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-date{font-size:12px;color:var(--faint)}
.hud-date .num{color:var(--gold-2);font-size:16px}
.hud-btns{display:flex;gap:6px}
.hud-k{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;margin:10px -12px 0;background:var(--mar-1);border-top:2px solid var(--mar-1)}
.k{display:flex;flex-direction:column;align-items:center;padding:4px 2px 7px;background:var(--mar-2);min-width:0}
.k small{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--dim);white-space:nowrap}
.k small .px{width:11px;height:11px;color:var(--gold-1)}
.k b{font-family:var(--f-num);font-size:23px;font-weight:400;letter-spacing:.03em;color:var(--gold-2);line-height:1.05}
.k.warn b{color:#ff8a70}
.k.bump b{animation:bump .7s ease}

/* ---------- 五维（参照「学识/慷慨…」那一排） ---------- */
.vbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--mar-2);background-clip:padding-box;border:9px solid transparent;border-image:var(--fr-panel) 9 / 9px stretch;padding:0 0 2px}
.v{display:flex;flex-direction:column;align-items:center;min-width:0}
.v .pips{display:flex;gap:1px;height:9px;align-items:center}
.v .pips i{width:5px;height:5px;margin:0 1px;transform:rotate(45deg);background:#64301a}
.v .pips i.on{background:#ffe066}
.v .px{width:30px;height:30px;margin:3px 0 1px;color:#d8ccb8}
.v.hi .px{color:var(--gold-2)}
.v b{font-size:13px;letter-spacing:.12em;line-height:1.3}
.v .num{font-size:19px;color:var(--gold-2);line-height:1}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:3px 14px;background:var(--mar-3);background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-btn) 4 / 4px stretch;font-weight:700;letter-spacing:.08em;white-space:nowrap;user-select:none;transition:transform .1s ease,filter .12s ease}
.btn:hover:not(:disabled){filter:brightness(1.18)}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:disabled{opacity:.42;filter:grayscale(.6)}
.btn.pri{background:var(--gold-1);border-image-source:var(--fr-gbtn);--fg:#3a1505;--dim:#6b3a12;--faint:#8a5a2a;color:#3a1505}
.btn.sm{min-height:32px;padding:1px 10px;font-size:13px;letter-spacing:.04em}
.btn.big{min-height:52px;padding:4px 30px;font-size:17px}
.btn.sq{width:40px;padding:0}
.btn.sq .px{width:18px;height:18px}
.btn s{font-weight:400;opacity:.7}
.modal .box > .btn:last-child{justify-self:stretch}

/* ---------- 标签 ---------- */
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;line-height:1.55;padding:0 6px;border:1px solid var(--line-2);color:var(--fg);white-space:nowrap;font-weight:500}
.chip.gold{color:var(--gold);border-color:currentColor;background:var(--gold-bg)}
.chip.red{color:var(--red);border-color:currentColor}
.chip.jade{color:var(--jade);border-color:currentColor}
.chip.faint{color:var(--faint);border-style:dashed}
.tier{font-weight:700}
.tier-废{color:var(--t-fei)}.tier-下{color:var(--t-xia)}.tier-中{color:var(--t-zhong)}.tier-上{color:var(--t-shang)}.tier-顶{color:var(--t-ding)}.tier-极{color:var(--t-ji)}.tier-神{color:var(--t-shen)}.tier-空{color:var(--faint)}
.bt{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:0 6px;line-height:18px;white-space:nowrap;border:1px solid currentColor}
.bt.t2{background:#15161b;color:#ecebe6;border-color:#6b6f7c}
.bt.t4{background:linear-gradient(90deg,#b8862b,#f3d27a,#b8862b);color:#2a1b00;border-color:#f3d27a}

/* ---------- 剧情卡 ---------- */
.flag{position:absolute;top:-17px;right:4px;z-index:2;display:flex;flex-direction:column;align-items:center;width:48px;pointer-events:none}
.flag .rod{width:46px;height:6px;background:#1d0b06;box-shadow:inset 0 -2px 0 #000}
.flag .ban{width:26px;height:38px;margin-top:-1px;padding-top:6px;display:grid;justify-items:center;align-content:start;background:var(--flag,#3d7a45);color:#fff4d8;font:400 22px/1 var(--f-num);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);box-shadow:inset 3px 0 0 rgba(255,255,255,.18);transform-origin:top center;animation:sway 3.2s ease-in-out infinite}
.flag .lab{margin-top:1px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--flag,#3d7a45)}
.story-k{font-size:12px;color:var(--faint);letter-spacing:.06em;padding-right:54px}
.story-t{font-size:22px;letter-spacing:.03em;margin:2px 0 10px;padding-right:54px}
.tx{font-family:var(--f-serif);font-size:15.5px;line-height:1.9;white-space:pre-line;color:var(--fg)}
.tx.ps{white-space:normal}
.tx.ps p + p{margin-top:.7em}
.story .tx{border-top:3px solid var(--line);padding-top:10px}
.story-left{margin-top:10px;font-size:12.5px;color:var(--faint);text-align:center;letter-spacing:.08em}
.echo{font-size:13px;line-height:1.7;color:var(--gold);background:var(--gold-bg);border-left:3px solid currentColor;padding:6px 10px;margin:8px 0}
.echo.mem,.echo.dim{color:var(--dim);background:transparent}
.echo.warn{color:var(--red);background:rgba(200,50,30,.09)}
.res{display:grid;gap:8px;margin-top:14px;padding-top:12px;border-top:3px dashed var(--line);animation:fadeUp .35s both}
.res .pick{font-size:13px;color:var(--dim)}
.res .pick .ok{color:var(--jade)}.res .pick .bad{color:var(--red)}
.res .rt{font-family:var(--f-serif);font-size:15px;line-height:1.85}
.res .note{font-size:12.5px;color:var(--faint)}
.res-go{display:flex;justify-content:flex-end;margin-top:4px}
.deltas{display:flex;flex-wrap:wrap;gap:5px}
.delta{display:inline-flex;align-items:center;font-size:12px;line-height:1.55;padding:0 7px;border:1px solid var(--line-2);color:var(--fg);animation:pop .32s both;animation-delay:calc(var(--i,0) * 45ms)}
.delta.up{color:var(--jade);border-color:currentColor;background:rgba(80,170,80,.10)}
.delta.dn{color:var(--red);border-color:currentColor;background:rgba(200,60,40,.08)}
.alog .delta{animation:none}

/* ---------- 选项（深色木牌） ---------- */
.opts{display:grid;gap:10px}
.story .opts{margin-top:14px}
.opt{position:relative;display:grid;gap:3px;width:100%;text-align:left;background:var(--mar-3);background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-plank) 4 / 4px stretch;padding:8px 12px 9px;transition:transform .12s ease,filter .12s ease}
button.opt:hover:not(:disabled){border-image-source:var(--fr-plank-hi);background:#68250f;transform:translateX(3px)}
button.opt:active:not(:disabled){transform:translate(3px,2px)}
.opt:disabled{filter:grayscale(.55) brightness(.92);opacity:.6}
.opt .t{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-weight:700;font-size:15px;line-height:1.45;padding-right:18px}
.opt .t .px{color:var(--gold)}
.opt .m{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:12.5px;line-height:1.55;color:var(--dim)}
.opt .m.hint{font-family:var(--f-serif)}
.opt.tm{border-image-source:var(--fr-plank-hi);background:#6a2a0e}
.opt.alter{background:#64190f}
.opt.alter::after{content:"";position:absolute;left:-4px;top:-4px;bottom:-4px;width:4px;background:#e0412c}
@media (hover:hover){
  .story,.modal .box{counter-reset:opt}
  .story button.opt:not(:disabled),.modal button.opt:not(:disabled){counter-increment:opt}
  .story button.opt:not(:disabled)::before,.modal button.opt:not(:disabled)::before{content:counter(opt);position:absolute;top:7px;right:8px;padding:1px 4px;font:400 13px/1 var(--f-num);color:var(--faint);border:1px solid var(--line-2)}
}

/* ---------- 要务告示 ---------- */
.notice{display:grid;gap:8px}
.notice .kick{text-align:center;font-size:12px;letter-spacing:.4em;color:var(--faint)}
.notice-h{display:flex;align-items:center;justify-content:center;gap:10px;padding-bottom:8px;border-bottom:3px solid var(--gold-0)}
.notice-h .px{width:16px;height:16px;color:var(--gold-0)}
.notice h3{font-size:19px;letter-spacing:.06em}
.notice p{font-family:var(--f-serif);font-size:14.5px;line-height:1.8}
.notice .rumor{font-size:13.5px;color:var(--dim);border-left:3px solid var(--line-2);padding-left:8px}
.notice .tip{font-family:var(--f-ui);font-size:12.5px;color:var(--faint)}
.notice-go{display:flex;justify-content:flex-end}

/* ---------- 行动 ---------- */
.ap{display:inline-flex;gap:3px;align-items:center}
.ap .px{width:22px;height:22px}
.ap .px.on{color:var(--gold-2);filter:drop-shadow(0 0 4px rgba(246,210,122,.55))}
.ap .px.off{color:#6e3520}
.ag + .ag{margin-top:12px}
.ag-t{display:flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.3em;color:var(--dim);margin-bottom:6px}
.ag-t::after{content:"";flex:1;height:2px;background:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px}
.tile{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;align-items:center;min-height:58px;padding:5px 8px;text-align:left;background:#f3e2b2;background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-tile) 4 / 4px stretch;transition:transform .12s ease,filter .12s ease}
.tile .ic{grid-row:1 / span 2;display:grid;place-items:center;width:32px;height:32px;background:var(--mar-2);color:var(--gold-2);box-shadow:inset 0 0 0 2px #2a0b04}
.tile .ic .px{width:20px;height:20px}
.tile b{align-self:end;font-size:14.5px;line-height:1.25}
.tile .d{align-self:start;font-size:11.5px;line-height:1.35;color:var(--dim);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.04)}
.tile:active:not(:disabled){transform:translateY(1px)}
.tile:disabled{opacity:.46;filter:grayscale(.7)}
.tile.hot{background:#fde6a0;border-image-source:var(--fr-tile-hot)}
.tile.hot .ic{background:#8a3a10}
.tile.rec{animation:glow 1.8s ease-in-out infinite}
.tile.rec::after{content:"荐";position:absolute;top:-11px;right:-8px;width:22px;height:22px;display:grid;place-items:center;background:#b5341f;color:#fff2d6;font-family:var(--f-disp);font-size:15px;line-height:1;box-shadow:0 0 0 2px #fff2d6,0 0 0 4px #b5341f;transform:rotate(8deg)}
.act-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:2px solid var(--line)}
.alog{display:grid;gap:10px}
.alog > div{display:grid;gap:4px;padding-left:10px;border-left:3px solid var(--line-2);font-size:13.5px}
.alog p{font-family:var(--f-serif);line-height:1.75}
.alog .when{font-size:12px;color:var(--gold)}

/* ---------- 底部页签（参照「探索/总览/酒馆」） ---------- */
.dock{position:fixed;left:50%;bottom:0;z-index:30;transform:translateX(-50%);width:min(var(--col),100%);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;padding:0 3px env(safe-area-inset-bottom,0px);background:var(--mar-1);box-shadow:0 -4px 0 var(--gold-1),0 -7px 0 var(--mar-0)}
.dock button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--dock-h);background:#3a1107;color:var(--faint);font-size:13px;letter-spacing:.14em;transition:transform .15s ease,color .15s ease}
.dock button .px{width:22px;height:22px}
.dock button[aria-selected="true"]{z-index:1;height:calc(var(--dock-h) + 10px);transform:translateY(-10px);margin-bottom:-10px;background:var(--mar-2);color:var(--gold-2);clip-path:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% 100%,0 100%);box-shadow:inset 0 4px 0 var(--gold-1),inset 4px 0 0 var(--gold-1),inset -4px 0 0 var(--gold-1)}
@media (min-width:480px){.dock button span::before,.dock button span::after{content:"◆";display:inline-block;font-size:7px;vertical-align:3px;margin:0 5px;opacity:.55}}
.dock .dot{position:absolute;top:9px;left:calc(50% + 9px);width:8px;height:8px;background:#e5432f;box-shadow:0 0 0 2px #3a1107}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(22,6,2,.66);animation:fade .18s both}
.modal .box{position:relative;width:min(600px,100%);max-height:min(88vh,920px);overflow:auto;overscroll-behavior:contain;display:grid;gap:12px;align-content:start;background:var(--paper);background-clip:padding-box;border:12px solid transparent;border-image:var(--fr-gold) 12 / 12px stretch;padding:10px 12px 14px;animation:sheetIn .3s cubic-bezier(.2,.8,.2,1) both}
.modal .box > .sec-t:first-child{margin:0}
.modal .box h3{font-size:20px;letter-spacing:.03em;padding-bottom:8px;border-bottom:3px solid var(--line)}
.modal .box > p.dim{font-size:13px}
.modal .box .tx{font-size:15px;line-height:1.85}
@media (max-width:640px){.modal{align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}.modal .box{max-height:90vh}}

/* ---------- 决斗 ---------- */
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:10px 12px;background:var(--mar-2);color:#f8e9c6;box-shadow:inset 0 0 0 3px var(--mar-0),inset 0 0 0 5px var(--gold-0)}
.vs-side{display:grid;gap:1px;min-width:0}
.vs-side.r{text-align:right;justify-items:end}
.vs-side b{max-width:100%;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs-side small{font-size:11.5px;color:#dcb994}
.vs .pw{font-size:23px;color:var(--gold-2)}
.vs .pips{display:flex;gap:6px;padding:3px}
.vs .pips i{width:10px;height:10px;transform:rotate(45deg);background:#2a0b04;box-shadow:inset 0 0 0 2px #8c4a26}
.vs .pips i.on{background:var(--gold-2);box-shadow:none}
.vs-mid{font-family:var(--f-disp);font-size:26px;line-height:1;color:var(--gold-2);padding:0 4px}
.dlog{display:grid;gap:4px;font-size:13.5px}
.dlog > div{padding:6px 8px;border-left:4px solid var(--jade);background:rgba(80,170,80,.08)}
.dlog > div.l{border-left-color:var(--red);background:rgba(200,60,40,.07)}
.opts.tac{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.opts.tac .opt{justify-items:center;text-align:center}
.opts.tac .opt .t{justify-content:center;padding-right:0}

/* ---------- 读数条 ---------- */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:3.4em minmax(0,1fr) 4.4em;gap:8px;align-items:center;font-size:13px}
.bar .tr,.bbar .tr{position:relative;height:10px;background:var(--track);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.bar .tr::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.25) 9px 10px)}
.bar .fi{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ffe9a3 0 3px,var(--gold-1) 3px 7px,#b9781d 7px)}
.bar .fi.red{background:linear-gradient(#ffb19e 0 3px,#d8432c 3px 7px,#962513 7px)}
.bar .v{text-align:right;font-family:var(--f-num);font-size:18px;line-height:1}
.bar .v small{font-size:10px;color:var(--faint)}
.bar.solo{grid-template-columns:minmax(0,1fr)}
.bbar{display:grid;grid-template-columns:4.6em minmax(0,1fr) 2.8em;gap:8px;align-items:center;font-size:13px}
.bbar .z{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--faint)}
.bbar .fi{position:absolute;top:0;bottom:0;background:var(--jade)}
.bbar .fi.neg{background:var(--red)}
.bbar .v{text-align:right;font-family:var(--f-num);font-size:17px;line-height:1}

/* ---------- 武魂 / 魂环 ---------- */
.ring{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid var(--r-white);box-shadow:0 0 0 1px var(--ring-ol);flex:none;vertical-align:-2px}
.ring.empty{border:2px dashed var(--line-2);box-shadow:none}
.ringstrip{display:flex;gap:6px;flex-wrap:wrap}
.ringstrip .ring{width:20px;height:20px;border-width:4px}
.rings-big{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.rings-big .ring{width:28px;height:28px;border-width:5px}
.rlist{display:grid}
.rrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-bottom:2px solid var(--line);font-size:13.5px}
.rrow:last-child{border-bottom:0}
.rrow .ring{margin-top:3px}
.rrow .yr{font-family:var(--f-num);font-size:17px;color:var(--gold);white-space:nowrap}
.wh-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px}
.wh-n{font-family:var(--f-serif);font-size:18px}
.glyph{width:72px;height:72px;display:grid;place-items:center;font-family:var(--f-disp);font-size:44px;line-height:1;color:var(--gold-2);background:#1a0602;background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-gbtn) 4 / 4px stretch}
.evo{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.evo li{position:relative;display:flex;align-items:center;gap:6px;padding:3px 8px;background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--line);font-size:12.5px}
.evo li + li::before{content:"▸";position:absolute;left:-14px;color:var(--faint)}
.evo li small{color:var(--faint)}
.evo li.now{box-shadow:inset 0 0 0 2px var(--gold)}
.evo li.past{opacity:.55}
.whs{display:grid;gap:8px}
.whs .w{display:grid;gap:3px;padding:8px 10px;background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--line)}
.whs .w.vessel{box-shadow:inset 0 0 0 2px var(--gold)}
.whs .w.off{opacity:.6}
.trait{display:grid;gap:2px;margin-bottom:10px}
.trait b{font-family:var(--f-serif);font-size:16px}
.path{display:grid;gap:6px;margin-top:10px;padding:10px;background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--gold-0)}
.path-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.path-h .num{color:var(--gold)}
.next{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.kv{display:grid;gap:6px;font-size:13.5px}

/* ---------- 行囊 / 拍卖 / 机缘 ---------- */
.bonemap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:400px;margin:0 auto}
.bonemap .bs{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;text-align:center;background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--line)}
.bonemap .bs.on{box-shadow:inset 0 0 0 3px var(--c,var(--gold))}
.slots,.flist{display:grid;gap:8px}
.slot,.fcard{background:#f3e2b2;background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-tile) 4 / 4px stretch;padding:7px 10px}
.slot{display:flex;gap:8px 10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sl-m{display:grid;gap:2px;min-width:0;flex:1 1 210px}
.sl-m b{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}
.sl-b{display:flex;gap:6px;flex-wrap:wrap}
.fcard{display:grid;gap:4px}
.fgrp + .fgrp{margin-top:12px}
.fgrp > summary{cursor:pointer;list-style:none}
.fgrp > summary::-webkit-details-marker{display:none}
.fgrp > summary::before{content:"▸";margin-right:-2px;transition:transform .15s}
.fgrp[open] > summary::before{transform:rotate(90deg)}
.fcard.past{opacity:.6}
.fc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fc-h b{font-size:15px}
.fc-h .st{margin-left:auto}
.tierb{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 4px;font-family:var(--f-serif);font-weight:900;font-size:13px;color:#fff6dc;background:var(--c)}
.fc-m{display:flex;gap:2px 10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--dim)}
.fc-x{font-family:var(--f-serif);font-size:13.5px;line-height:1.75}
.fc-go{justify-self:end}

/* ---------- 天下 ---------- */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.panel .seg{margin-bottom:10px}
.seg button{min-height:34px;padding:1px 14px;font-size:13.5px;font-weight:700;letter-spacing:.1em;color:var(--dim);background:#efd9a2;background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-tile) 4 / 4px stretch}
.seg button[aria-pressed="true"]{background:var(--mar-3);color:var(--gold-2);border-image-source:var(--fr-btn)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:2px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--faint);font-size:12px;letter-spacing:.08em}
td.r,th.r{text-align:right}
table.rk td{white-space:normal;vertical-align:top}
table.rk td.num{white-space:nowrap;padding-top:9px}
table.rk td.r.num:first-child{width:2.2em}
table.rk td .small{font-size:12px;line-height:1.45}
tr.me td{background:var(--gold-bg);color:var(--gold)}
tr.dead td{color:var(--faint)}
.news{display:grid}
.news > div{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:2px solid var(--line);font-size:13.5px;line-height:1.65}
.news > div:last-child{border-bottom:0}
.news .num{color:var(--gold)}
.news .star{font-weight:700}

/* ---------- 季报 ---------- */
.rep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.rep-grid > div{display:grid;gap:2px;padding:8px 10px;background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--line)}
.rep-grid small{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:12px}
.rep-grid b{font-family:var(--f-num);font-size:23px;font-weight:400;line-height:1.1}
.rep-hz{color:var(--red);font-size:13.5px;line-height:1.7}

/* ---------- 提示 ---------- */
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));z-index:70;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));padding:6px 14px;background:var(--mar-1);background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-btn) 4 / 4px stretch;font-size:13.5px;pointer-events:none;animation:flashIn .25s both}
/* 行动反馈占据固定的文档空间，不覆盖按钮，也不在更新后推动按钮。 */
.action-feedback{height:96px;box-sizing:border-box;overflow:auto;overflow-wrap:anywhere;scrollbar-gutter:stable;margin:10px 0 2px;padding:10px 12px;background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--line);font-size:13.5px;line-height:1.6}
.action-feedback b{display:block;color:var(--gold-2);font-size:14px}
.action-feedback .deltas{margin-top:6px}
.action-feedback .delta{animation:none;max-width:100%;white-space:normal;overflow-wrap:anywhere}
@media(max-width:520px){.action-feedback{height:112px}}

/* ---------- 封面 / 开局 ---------- */
.title-plate{text-align:center;padding:12px 10px 14px}
.title-plate .sec-t{color:var(--dim);letter-spacing:.3em}
.logo{font-family:var(--f-disp);font-weight:400;font-size:clamp(56px,16vw,96px);line-height:1.08;letter-spacing:.04em;color:var(--gold-2);text-shadow:4px 4px 0 #1b0602}
.logo em{font-style:normal;color:#ff8f6b}
.lede{max-width:30em;margin:8px auto 0;font-family:var(--f-serif);font-size:14.5px;line-height:1.85}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;margin-top:12px;font-size:13px;color:var(--dim)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta .px{color:var(--gold-1)}
.meta b{font-size:20px;color:var(--gold-2)}
.resume{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.idgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.idc{display:grid;gap:4px;align-content:start;min-width:0;padding:9px 12px 10px;text-align:left;background:#f3e2b2;background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-tile) 4 / 4px stretch;transition:transform .12s ease}
.idc:hover{transform:translateY(-3px);background:#fbe7ad;border-image-source:var(--fr-tile-hot)}
.idc-k{display:flex;justify-content:space-between;gap:6px;font-size:12px;letter-spacing:.1em;color:var(--faint)}
.idc h3{font-size:17px}
.idc-tag{font-family:var(--f-serif);font-size:13.5px;color:var(--dim)}
.idc-w{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px}
.idc-f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.pips{display:flex;gap:4px}
.pips i{width:8px;height:8px;transform:rotate(45deg);border:1px solid var(--faint)}
.pips i.on{background:var(--gold);border-color:var(--gold)}
details.panel > summary{cursor:pointer}
details.panel:not([open]) > summary{margin-bottom:0;border-bottom:0;padding-bottom:0}
.ledger td{white-space:normal}
.foot{text-align:center;font-size:12px;color:var(--faint);padding:4px 8px 10px}
.topline{display:flex}
.pc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:4px}
.pc h4{margin:0 0 4px;font-family:var(--f-ui);font-size:12.5px;letter-spacing:.3em}
.pc .pro h4{color:var(--jade)}.pc .con h4{color:var(--red)}
.pc ul{margin:0;padding-left:1.1em}
.pc li{font-size:13.5px;line-height:1.7}
input.nm{width:min(280px,100%);font:inherit;font-size:16px;padding:7px 12px;color:#3a170a;background:#f8ecc8;background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-tile) 4 / 4px stretch;outline:none}
input.nm:focus{border-image-source:var(--fr-tile-hot)}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.perk{position:relative;display:grid;gap:4px;align-content:start;padding:9px 12px 10px;text-align:left;background:#f3e2b2;background-clip:padding-box;border:4px solid transparent;border-image:var(--fr-tile) 4 / 4px stretch}
.perk b{font-family:var(--f-serif);font-size:16px}
.perk span{font-size:13px;line-height:1.65;color:var(--dim)}
.perk[aria-pressed="true"]{background:#fde6a0;border-image-source:var(--fr-tile-hot)}
.perk[aria-pressed="true"]::after{content:"选";position:absolute;top:-10px;right:-6px;width:22px;height:22px;display:grid;place-items:center;background:#b5341f;color:#fff2d6;font-family:var(--f-disp);font-size:15px;line-height:1;box-shadow:0 0 0 2px #fff2d6,0 0 0 4px #b5341f;transform:rotate(8deg)}
.go{display:flex;justify-content:center;padding:4px 0 8px}

/* ---------- 结局卷宗 ---------- */
.dossier{display:grid;gap:16px}
.stamp{position:absolute;right:12px;top:8px;padding:6px 8px;font-family:var(--f-disp);font-size:34px;line-height:1;color:#b3301e;box-shadow:inset 0 0 0 3px #b3301e;transform:rotate(-8deg);opacity:.92}
.port-h{display:grid;gap:4px;padding-right:80px}
.port-h .fh{font-family:var(--f-disp);font-size:clamp(34px,8vw,52px);line-height:1.05;color:var(--gold)}
.port-h .nm{font-family:var(--f-serif);font-weight:900;font-size:22px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tags span{padding:2px 10px;font-family:var(--f-serif);font-weight:700;font-size:13px;color:var(--gold);box-shadow:inset 0 0 0 2px currentColor}
.port-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:620px){.port-grid{grid-template-columns:minmax(0,1fr)}}
.radar{width:100%;max-width:300px;justify-self:center}
.grade{font-family:var(--f-disp);font-size:46px;line-height:1;color:#b3301e}
.afterlife{display:grid;gap:6px;font-family:var(--f-serif);font-size:14.5px;line-height:1.75}
.afterlife div{border-left:3px solid var(--line-2);padding-left:10px}
.end-tx{font-family:var(--f-serif);font-size:15.5px;line-height:1.9}
.port-go{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

@keyframes cardIn{from{opacity:0;transform:translateY(16px) rotate(-1.2deg)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.9)}}
@keyframes bump{30%{transform:scale(1.28);color:#fff}}
@keyframes glow{50%{filter:brightness(1.08) drop-shadow(0 0 6px rgba(246,210,122,.9))}}
@keyframes sway{50%{transform:rotate(4deg)}}
@keyframes flashIn{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes flashOut{to{opacity:0;transform:translate(-50%,12px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.achievement-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:14px}.achievement-card{border:1px solid var(--line);padding:12px;background:rgba(255,255,255,.025)}.achievement-card.earned{border-color:var(--gold)}.achievement-card.locked{opacity:.65}.achievement-card p{font-size:12px;line-height:1.65;margin:7px 0 4px}.achievement-card small{font-size:11px;line-height:1.6;color:var(--dim)}.achievement-state{float:right;font-size:11px;color:var(--dim)}
/* 势力图沿用褐金像素纸面，手机端保留可读据点。 */
.campaign-summary{display:grid;gap:3px;padding:10px 12px;margin-bottom:12px;border:2px solid var(--gold-0);background:var(--mar-1);font-size:12px}
.campaign-summary>b{font-size:15px;color:var(--gold-2)}
.campaign-map{overflow:auto;border:4px solid #8a5728;box-shadow:0 0 0 2px #d8b66c;background:#e7d2a1}
.campaign-map svg{display:block;width:100%;min-width:570px;height:auto;font-family:var(--f-ui)}
.map-name{fill:#fff7df;font-size:14px;font-weight:700;paint-order:stroke;stroke:#3a2718;stroke-width:2px}
.map-owner{fill:#fff7df;font-size:11px;paint-order:stroke;stroke:#3a2718;stroke-width:1.5px}
.map-water{fill:#837244;font-size:17px;letter-spacing:4px}
.map-node{cursor:pointer}
.map-node:focus{outline:none}
.map-node:focus rect,.map-node:hover rect{stroke:#fff0b3;stroke-width:5px}
.campaign-legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.campaign-faction{position:relative;display:grid;gap:3px;text-align:left;padding:9px 9px 8px 12px;border:2px solid #986b36;border-left:5px solid var(--fc);background:#301008;color:#f8e9c6;font-size:11px}
.campaign-faction b{font-size:13px;color:#f6d27a}
.campaign-faction .num{font-size:22px;color:#f7e5ba}
.campaign-faction span{color:#d4b38d}
@media(max-width:480px){.campaign-legend{grid-template-columns:repeat(2,minmax(0,1fr))}.campaign-map svg{min-width:565px}.campaign-summary{padding:8px}.campaign-faction{padding:8px}}


.god-requirements{margin-top:12px}.god-req-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:7px 14px;margin:10px 0}.god-req-row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:5px 0;font-size:12px}.god-req-row .chip{white-space:nowrap}.god-requirements p{line-height:1.7;margin-top:9px}

.hunt-filters{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.hunt-filters .btn{font-size:12px;padding:7px 10px}.hunt-band{margin:18px 0}.hunt-band h4{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:9px;color:var(--gold);font-size:14px}.hunt-band h4 span{font-weight:400;font-size:12px}.hunt-band .opts{margin-top:10px}.hunt-band .opt:disabled{--fg:#513820;--dim:#70583f;--faint:#80674e;--red:#a33222;--jade:#326634;--gold:#88550e;--line-2:#a88c66;--gold-bg:rgba(136,85,14,.1);opacity:1;filter:none;background:#eadfc7;cursor:not-allowed}.hunt-block-reason{color:#795030;font-size:12px;line-height:1.6;border-top:1px dashed #b99b6c;padding-top:7px}
.spirit-switch{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.spirit-switch button{flex:1;white-space:normal;min-width:130px}.spirit-switch small{display:block;font-size:11px;margin-top:4px;font-weight:400}
.opt.rare-sighting{border:4px solid #ffcf61;border-image:none;background:#a52225;box-shadow:inset 0 0 0 2px #f7654f,0 0 0 2px #861b1d;padding:12px 14px}.opt.rare-sighting .t,.opt.rare-sighting .m,.opt.rare-sighting .hint,.opt.rare-sighting .faint{color:#fff1cf}.opt.rare-sighting .rare-notice{font-weight:700;font-size:14px;color:#fff8e4}.rare-badge{display:inline-block;background:#ffe3a0;color:#801313;padding:3px 8px;font-weight:800;font-size:12px;line-height:1.4}.rare-alert{border:3px solid #a52225;background:#fff0ce;color:#8b171b;padding:12px 15px;margin:12px 0 18px;line-height:1.65}.rare-alert strong{display:block;font-size:19px}.rare-alert p{margin:4px 0 0}.tile.rare-hunt{border-image:none;border:4px solid #ffcf61;background:#a52225;color:#fff1cf;box-shadow:0 0 0 2px #861b1d}.tile.rare-hunt .d{color:#fff1cf}.opt.rare-sighting:focus-visible{outline:3px solid #1b5261;outline-offset:4px}

/* 小字对比度（全尺寸）：弱色与品级色压深一档，小字号对底色 ≥4.5:1 */
.panel,.hud,.dock,.opt,.btn,.vbar,.toast,.flash{--dim:#e2c4a2;--faint:#c9a582}
.field,.paper,.story,.modal .box,.tile,.idc,.perk,.slot,.fcard,.seg button{--dim:#5c3a20;--faint:#6f4f33;--gold:#7f4604;--red:#9a2a18;--jade:#276a30;--t-xia:#6a5b4e;--t-zhong:#276a30;--t-ding:#7a3fc2;--t-ji:#9a4606;--t-shen:#7a5800}
.bt.t0{background:var(--r-yellow);border-color:#a8801a;color:#3a2400!important}

发怒，只说：「放在我眼皮底下。」胡列娜第一次正眼看你。","d":{"精神":2,"shift":1,"bonds":{"比比东":3,"胡列娜":3},"flags":["pope_knows_you_saw"],"trait":{"逆":1,"险":1,"仁":1}}}},{"t":"吹熄灯火，伏地请罪","hint":"门口抱菊的男人对你起了兴趣","win":{"text":"额头贴着冰冷的石砖。月关轻笑一声：「懂事的小灯，归我带吧。」","d":{"体魄":1,"bonds":{"月关":6},"flags":["knelt"],"trait":{"险":-1,"忠":1}}}}]},{"id":"n02_final","title":"圆月与蓝银","year":2645,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M38","echo":{"flag":"saved_hulie","text":"前因 · 2637：猎魂森林里，你先把胡列娜拉出了藤网。"},"text":"精英大赛总决赛，武魂城的天是铅灰色的。教皇给你的命令只有一句：「名单上报第七席，不出手。」\n\n可开场锣一响，一切都乱了。邪月的圆月斩碎了唐三背后的八根蛛矛，妖魅的红雾漫过赛台，史莱克七怪被一个个逼到台边。然后那个蓝衣少年抬起眼，紫光从他瞳孔深处亮起，红雾像绸子一样被划开。\n\n最高的看台上，教皇站着，一动不动。你知道她在看谁：唐三，和他身后那个驼背的男人。\n\n你的灯在手里跳。它想往两处去：一处是唐三的影子，紫光正从那里往外溢；另一处是他身边的兔耳少女，她的影子里蹲着一只雪白的、比整座武魂城还古老的兔子。","choices":[{"t":"点亮冥月，锁住唐三的影子","hint":"关键战：在紫极魔瞳下撑过三息","need":{"战力":450},"chance":0.4,"win":{"text":"你在紫极魔瞳下撑了三息。武魂殿还是输了，那夜她在黑暗里只说了两个字：「三息。」","d":{"名望":8,"精神":3,"bonds":{"比比东":6},"rep":{"武魂殿":3},"flags":["three_breaths"],"trait":{"险":1}}},"lose":{"text":"紫光把冥月原样折回你的识海。你倒在最后，那之后教皇再没看你一眼。","d":{"伤势":30,"bonds":{"比比东":-3},"flags":["exiled"],"trait":{"险":1}}}},{"t":"把灯转向那只白兔的影子","hint":"你会比所有人早一步知道她是什么","win":{"text":"你看见十万年的月亮，和一个冲她伸出手的男孩。你垂下灯，什么也没说。","d":{"shift":1,"bonds":{"小舞":4},"flags":["saw_xiaowu","exiled"],"reveal":["小舞"],"trait":{"仁":1,"逆":1}}},"note":"按：决赛后相思断肠红落地，小舞十万年魂兽身份暴露（M39）。"},{"t":"守着命令，一步不动","hint":"她要的是听话，还是别的？","win":{"text":"你提灯站到终场，魂环一次没亮。教皇看了你一眼，那一眼很冷。","d":{"bonds":{"比比东":-1},"flags":["exiled"],"trait":{"忠":2,"险":-2}}}}]},{"id":"n03_hunt","title":"猎魂之夜","year":2651,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M51","echo":{"flag":"pope_knows_you_saw","text":"前因 · 2636：六岁那年，你对她说过：「您那时很疼。」"},"text":"长老殿连开三天会：胡列娜受封圣女，菊鬼二老去星斗捉十万年柔骨兔，一个月后，猎魂行动。\n\n教皇在殿里等你，眼底有一层你不认识的暗色。「蓝电霸王龙宗，你随月关、鬼魅去。」你问为什么是蓝电。她看了你很久：「他们欠一个人，欠了二十多年。我替他讨。」\n\n那夜没有月亮。八千人围住龙脊山，雷云翻滚，喊杀，然后是火。你的灯从未这样亮过，死者最后想起的东西像倒着下的雪，全落进灯里：孙子的第一声啼哭，一碗没端上桌的面。\n\n宗主殿前，玉元震九环齐转，独战两位封号斗罗。侧殿后墙，一个满脸是血的蓝发少年正把玉家孩子往石缝里推。是玉衡。他转身挡住缝口，电光在臂上炸开：「来啊，武魂殿的狗。」东北方，七宝的方向也烧红了。鬼魅的黑雾正飘过来，你只剩几息。","choices":[{"t":"随菊鬼二老踏平龙脊","hint":"教皇会交给你一只封着魂骨的铅匣","win":{"text":"龙脊山的雷停了。回城时，教皇把一只刻着「玉元震」的铅匣交你保管。","d":{"名望":6,"rep":{"武魂殿":6,"宗门":-10},"bonds":{"比比东":4,"月关":3},"flags":["did_massacre"],"item":"铅匣一只（内封蓝电宗主魂骨，代教皇保管）","trait":{"仁":-2,"忠":1}}}},{"t":"用蜃楼遮住石缝","hint":"改写原著：蓝电血脉留下一支","need":{"精神":50},"canonChange":{"node":"M51","inertia":3,"desc":"玉衡与十一名玉家孩童从后山石缝逃出，蓝电霸王龙血脉未绝"},"win":{"text":"蜃楼织出一面完整的山壁。鬼魅的黑雾从石缝前飘过，什么也没发现。","d":{"shift":10,"flags":["spared_yuheng"],"bonds":{"玉衡":15},"rep":{"武魂殿":-5,"宗门":5},"met":["landian"],"trait":{"逆":2,"仁":2,"忠":-1}}}},{"t":"拦在玉元震的雷霆之前","hint":"关键战：月关、鬼魅压阵，撑过三回合","need":{"战力":850},"chance":0.3,"win":{"text":"老龙的雷霆劈碎了半座山，你还站着。教皇亲手为你记了功。","d":{"伤势":40,"名望":12,"体魄":3,"rep":{"武魂殿":8,"宗门":-8},"bonds":{"比比东":6},"flags":["fought_yuan"],"trait":{"险":2,"忠":1}}},"lose":{"text":"一道紫雷劈穿冥月，你被月关抬下山时只剩半口气，灯罩裂纹又长了一截。","d":{"伤势":75,"rep":{"武魂殿":2},"flags":["fought_yuan"],"trait":{"险":2}}}}]},{"id":"n04a_lake","title":"星湖","year":2651,"cond":{"flag":null,"notFlag":"spared_yuheng","levelMin":0},"canon":"M52","echo":{"flag":"did_massacre","text":"前因 · 2651：龙脊山那一夜的记忆，还在你灯里落个不停。"},"text":"龙脊山的血还没干，你就被编进了星斗大森林的猎捕小队：菊鬼二老，黄金一代，还有胡列娜带来的杀神唐银。每靠近唐银一次，灯罩的裂纹就烫一次。\n\n第七天，星湖。蝎子辫少女身后卧着青蟒与黑猿。两极静止领域罩下的一瞬，唐银的伪装像水一样褪去，蓝银草暴起，八根蛛矛张开。「唐三！」焱吼得满嘴是血。\n\n月关喊你照他的眼睛，冥月却自己转向湖对岸的芦苇：一头角结冰晶的白鹿正发着抖。另一个十万年，只有你看见了。你把灯压低了一寸。\n\n唐三倒下。那个少女走过去，捧起他的脸，化成一道血红的光。撤退路上，鬼魅把一头断了四肢的噬梦貘扔在你脚下：「教皇许你的，杀了它。」第六环升起时，你怀里多了两封信：一封盖着教皇印，一封没有署名，像出自天斗太子府。","choices":[{"t":"拆开教皇的信，回武魂城","hint":"回到她身边，看她一步步走进黑暗","win":{"text":"你把无名信扔进篝火。回城那天，教皇殿深处的密室第一次锁上了门。","d":{"ring":{"beast":"噬梦貘","years":19000,"kind":"控","skill":"噬梦","desc":"吞去目标前几息的念头，令其出手落空、招式中断"},"bonds":{"比比东":4},"rep":{"武魂殿":3},"flags":["go_pope","hid_baishuang"],"met":["beast"],"reveal":["大明","二明"],"trait":{"忠":1,"仁":1}}}},{"t":"拆开那封没有署名的信","hint":"去天斗，站到千仞雪身后","win":{"text":"信里只有一行字：「雪还没停。」你连夜南下天斗城。","d":{"ring":{"beast":"噬梦貘","years":19000,"kind":"控","skill":"噬梦","desc":"吞去目标前几息的念头，令其出手落空、招式中断"},"bonds":{"千仞雪":5},"flags":["go_angel","hid_baishuang"],"met":["beast"],"reveal":["大明","二明"],"trait":{"忠":-1,"逆":1,"仁":1}}}},{"t":"把芦苇里的白鹿指给月关","hint":"又一个十万年，武魂殿会记你大功","win":{"text":"菊瓣追进芦苇，只带回半截冰角。武魂殿记你大功，你却再不敢照湖水。","d":{"ring":{"beast":"噬梦貘","years":19000,"kind":"控","skill":"噬梦","desc":"吞去目标前几息的念头，令其出手落空、招式中断"},"名望":8,"rep":{"武魂殿":6,"魂兽":-15},"bonds":{"白霜":-20,"比比东":3},"flags":["go_pope"],"met":["beast"],"item":"霜角白鹿的半截冰角","trait":{"仁":-3,"忠":1}}}}]},{"id":"n04b_lake","title":"星湖","year":2651,"cond":{"flag":"spared_yuheng","notFlag":null,"levelMin":0},"canon":"M52","echo":{"flag":"spared_yuheng","text":"前因 · 2651：龙脊山那夜，你用蜃楼遮住了后山的石缝。"},"text":"龙脊山的血还没干，你就被编进了星斗大森林的猎捕小队：菊鬼二老，黄金一代，还有胡列娜带来的杀神唐银。每靠近唐银一次，灯罩的裂纹就烫一次。\n\n第七天，星湖。蝎子辫少女身后卧着青蟒与黑猿。两极静止领域罩下的一瞬，唐银的伪装像水一样褪去，蓝银草暴起，八根蛛矛张开。「唐三！」焱吼得满嘴是血。\n\n月关喊你照他的眼睛，冥月却自己转向湖对岸的芦苇：一头角结冰晶的白鹿正发着抖。另一个十万年，只有你看见了。你把灯压低了一寸。\n\n唐三倒下。那个少女走过去，捧起他的脸，化成一道血红的光。撤退路上，鬼魅把一头断了四肢的噬梦貘扔在你脚下：「教皇许你的，杀了它。」第六环升起时，你怀里多了两封信：一封盖着教皇印，一封没有署名，像出自天斗太子府。\n\n你还想起石缝里那个蓝发少年。听说他带着十一个孩子，躲在天斗城外。","choices":[{"t":"拆开教皇的信，回武魂城","hint":"回到她身边，看她一步步走进黑暗","win":{"text":"你把无名信扔进篝火。回城那天，教皇殿深处的密室第一次锁上了门。","d":{"ring":{"beast":"噬梦貘","years":19000,"kind":"控","skill":"噬梦","desc":"吞去目标前几息的念头，令其出手落空、招式中断"},"bonds":{"比比东":4},"rep":{"武魂殿":3},"flags":["go_pope","hid_baishuang"],"met":["beast"],"reveal":["大明","二明"],"trait":{"忠":1,"仁":1}}}},{"t":"拆开那封没有署名的信","hint":"去天斗，站到千仞雪身后","win":{"text":"信里只有一行字：「雪还没停。」你连夜南下天斗城。","d":{"ring":{"beast":"噬梦貘","years":19000,"kind":"控","skill":"噬梦","desc":"吞去目标前几息的念头，令其出手落空、招式中断"},"bonds":{"千仞雪":5},"flags":["go_angel","hid_baishuang"],"met":["beast"],"reveal":["大明","二明"],"trait":{"忠":-1,"逆":1,"仁":1}}}},{"t":"熄了灯，去找那个蓝发少年","hint":"背叛武魂殿，再也回不了头","win":{"text":"你把两封信一起烧了，熄灯走进夜色。武魂殿的名册上，你的名字被朱笔划去。","d":{"ring":{"beast":"噬梦貘","years":19000,"kind":"控","skill":"噬梦","desc":"吞去目标前几息的念头，令其出手落空、招式中断"},"shift":8,"bonds":{"玉衡":5},"rep":{"武魂殿":-15,"宗门":5},"flags":["go_tang","defected","hid_baishuang"],"met":["beast"],"trait":{"逆":2,"忠":-3}}}}]},{"id":"n05a_coup","title":"天斗宫变","year":2652,"cond":{"flag":"go_angel","notFlag":null,"levelMin":0},"canon":"M56","echo":{"flag":"angel_contact","text":"前因：很多年前，你答应过替她守住一个秘密。"},"text":"你在太子府做了一年影子。白天是圣殿里不起眼的执事，夜里和纪无声一左一右立在书房檐下。纪无声不知道你是谁的人，殿下让他信，他就信。\n\n你知道的比他多。你知道每天清晨殿下端给陛下的参汤里有七彩斑斓，也知道她独处时会摘下雪清河的面具，对着铜镜看自己的金发，再一丝不苟地戴回去。「快了，」她说，「再过一个月，我就不必做别人了。」\n\n一个月后，雪夜大帝寿宴。天使领域笼罩大殿，一千名武魂殿魂师藏在禁卫甲下。然后唐三来了，乱披风之舞一锤一锤砸碎了金色的天。殿门外，一个使寒霜剑的少女护着宁荣荣冲了进来。\n\n领域碎了。她站在一地金羽里，没有回头：「{name}，你走。」","choices":[{"t":"背起她，从密道撤出天斗","hint":"你会成为她身边最后一个人","win":{"text":"你背她走完了整条密道。回到武魂城后，她在天使神殿后山替你钉住一头冥月鸮王：「你的灯，该有个真身了。」","d":{"ring":{"beast":"冥月鸮王","years":38000,"kind":"辅","skill":"冥月真身","desc":"器魂真身：灯化明月悬空，月下己方精神系魂技威力倍增"},"bonds":{"千仞雪":8},"rep":{"天斗":-8},"flags":["with_angel"],"met":["qibao","huangshi"],"trait":{"忠":2,"群":1}}}},{"t":"先放纪无声走，再去追她","hint":"两道影子，一道留下，一道离开","win":{"text":"纪无声深深看你一眼，消失在雨里。追上她时，她只说：「你总是最后一个。」第七环仍是她替你猎的。","d":{"ring":{"beast":"冥月鸮王","years":38000,"kind":"辅","skill":"冥月真身","desc":"器魂真身：灯化明月悬空，月下己方精神系魂技威力倍增"},"bonds":{"纪无声":8,"千仞雪":3},"rep":{"天斗":-4},"flags":["with_angel"],"met":["qibao","huangshi"],"trait":{"仁":1,"群":1}}}},{"t":"提灯拦住唐三一息","hint":"关键战：在乱披风之舞下撑一息","need":{"战力":1000},"chance":0.3,"win":{"text":"冥月锁住锤影一息，她借这一息撤出大殿。唐三看你的眼神第一次变了。","d":{"ring":{"beast":"冥月鸮王","years":38000,"kind":"辅","skill":"冥月真身","desc":"器魂真身：灯化明月悬空，月下己方精神系魂技威力倍增"},"名望":10,"伤势":35,"bonds":{"千仞雪":6,"唐三":-3},"flags":["with_angel"],"met":["qibao","huangshi"],"trait":{"险":2,"忠":1}}},"lose":{"text":"锤影砸碎冥月，你被她拖出殿外。半年后伤好，她仍替你猎来了第七环。","d":{"ring":{"beast":"冥月鸮王","years":38000,"kind":"辅","skill":"冥月真身","desc":"器魂真身：灯化明月悬空，月下己方精神系魂技威力倍增"},"伤势":65,"bonds":{"千仞雪":4},"flags":["with_angel"],"met":["qibao","huangshi"],"trait":{"险":2}}}}]},{"id":"n05c_traitor","title":"叛灯","year":2652,"cond":{"flag":"go_tang","notFlag":null,"levelMin":0},"canon":"M55","echo":{"flag":"spared_yuheng","text":"前因 · 2651：龙脊山那夜，你用蜃楼遮住了后山的石缝。"},"text":"星湖回来第三个月，你在天斗城外的破庙里找到了玉衡。他瘦得脱形，身边是十一个玉家孩子。他拔刀架在你脖子上，抖了很久，没有砍下去。「那天，你为什么放我走？」\n\n你答不上来，把灯递给他。他看见了龙脊山那一夜落进灯里的东西，抱着灯坐在地上，哭得像个孩子。\n\n一个月后，他带你见了大师。驼背布衣，眼里有比恨更冷的东西。「冥月灯，我在教皇殿门口见过你。你能画出武魂殿在庚辛城的主殿吗？」你画了。那一夜庚辛主殿被屠，一个满身烟灰的铁匠学徒欧冶青替唐门开了城门。\n\n宫变那夜，你混在天斗禁卫里，一眼认出了禁卫甲下的武魂殿魂师。身边站着七宝的林照，寒霜剑已出鞘；回廊尽头，太子的影子纪无声正看着你。","choices":[{"t":"拆穿假禁卫，护住寝宫","hint":"救驾之功，天斗会记住你","win":{"text":"冥月照出一百张藏在甲下的脸，唐三把救驾之功记在你头上。半年后，玉衡陪你猎来第七环。","d":{"ring":{"beast":"冥月鸮王","years":36000,"kind":"辅","skill":"冥月真身","desc":"器魂真身：灯化明月悬空，月下己方精神系魂技威力倍增"},"名望":10,"rep":{"天斗":10},"bonds":{"唐三":5,"林照":5},"flags":["saved_emperor"],"met":["qibao","shenjiang","huangshi"],"trait":{"逆":1,"忠":1}}}},{"t":"在宫墙下给千仞雪留生路","hint":"你还欠她一场雪","win":{"text":"你用蜃楼替她遮住一段宫墙，纪无声看见了，没有拦。第七环是玉衡陪你去猎的。","d":{"ring":{"beast":"冥月鸮王","years":36000,"kind":"辅","skill":"冥月真身","desc":"器魂真身：灯化明月悬空，月下己方精神系魂技威力倍增"},"shift":2,"rep":{"天斗":3},"bonds":{"千仞雪":6,"纪无声":4},"met":["qibao","shenjiang","huangshi"],"trait":{"仁":1,"忠":-1}}}}]},{"id":"n06a_gate","title":"天使之门","year":2656,"cond":{"flag":null,"notFlag":"go_tang","levelMin":0},"canon":"M75","echo":{"flag":"knows_truth","text":"前因：你知道那座黑殿里发生过什么，也知道她们是母女。"},"text":"四年里，大陆换了颜色。七宗重选，雪崩登基，武魂殿成了武魂帝国，教皇成了女皇。罗刹的传承在吃她，她越来越强，也越来越不像她，有时会把你的名字叫成另一个：小刚。\n\n二六五六年，唐三从海上回来，鬼斗罗、菊斗罗先后死在他手里。嘉陵关首战，他重创了女皇的灵魂，她被罢黜指挥权，坐在后营不点灯的帐里。\n\n同一夜，千仞雪站在天使神殿门前。明天，千道流会走进去，把自己献给孙女，让她成神。\n\n你提着灯站在两座帐篷之间。灯里那段记忆，你揣了二十年：烛火全灭的高殿，按住手腕的那只手，掐断的尖叫。西门外，幽冥白虎的咆哮已经扑上了城墙。","choices":[{"t":"把灯里那段记忆点给她看","hint":"改写原著：女儿在成神前看见母亲的伤","need":{"精神":60},"canonChange":{"node":"M85","inertia":4,"desc":"千仞雪成神前得知身世真相；终局她碎神位护母，罗刹神位断绝，比比东以凡人之身存活"},"win":{"text":"冥月真身升起，她在月光里站到月亮偏西：「我父亲，是她杀的。」你答：「是。」","d":{"shift":20,"flags":["truth_revealed"],"bonds":{"千仞雪":10,"比比东":10},"trait":{"逆":3,"仁":1},"ending":"e2"}}},{"t":"提灯上西门，迎战幽冥白虎","hint":"关键战：守住西门，守住她的献祭","need":{"战力":1200},"chance":0.45,"win":{"text":"冥月悬于西门，白虎三扑三退。天亮时，你还站在城头。","d":{"名望":15,"trait":{"忠":1,"险":1},"ending":"e1"}},"lose":{"text":"白虎的爪穿过冥月。你从城头坠下，风正从西往东吹。","d":{"trait":{"险":1},"ending":"e4"}}},{"t":"什么也不说，陪她们走完","hint":"让一切照原样发生","win":{"text":"你替两座帐篷各守了一夜灯。第二天，光柱冲天。","d":{"bonds":{"千仞雪":3,"比比东":3},"trait":{"逆":-2},"ending":"e1"}}}]},{"id":"n06c_pass","title":"关下之灯","year":2656,"cond":{"flag":"go_tang","notFlag":null,"levelMin":0},"canon":"M75","echo":{"flag":"saved_emperor","text":"前因 · 2652：宫变那夜，你拆穿了假禁卫，护住了雪夜大帝。"},"text":"四年里，你换了三个名字。在唐门你叫「灯」，在敏之一族的情报网里你是一个编号，在武魂帝国的通缉令上，你的画像旁写着「叛徒」，赏金比玉衡还高。\n\n玉衡如今是蓝电残部的头领，最小的那个孩子已经会叫你「灯叔」。大师替他们在天斗城外置了宅子，门楣挂一块没有字的匾：「等仇报了，再写。」\n\n二六五六年，嘉陵关。你把亲手画的城防图交给唐三，站在天斗大营的望楼上看那座百米雄关。城头插着武魂帝国的旗，旗下站着你认识的人：邪月一言不发，胡列娜远远望着大营。焱的火在西门城头烧成一面墙，他吼出你的名字：「{name}！出来！」","choices":[{"t":"提灯出营，赴焱的西门之约","hint":"关键战：焱的火与邪月的刃一起来","need":{"战力":1150},"chance":0.5,"win":{"text":"你撑过了三回合，玉衡的雷准时落下。焱跪在灰里，没有死。","d":{"名望":12,"bonds":{"焱":4,"玉衡":5},"trait":{"险":2,"群":1},"ending":"e3"}},"lose":{"text":"火墙合拢，月刃从火里来。你没等到那道雷，灯从望楼下滚了出去。","d":{"trait":{"险":1},"ending":"e4"}}},{"t":"隔着城墙，为胡列娜点灯","hint":"不赴约，也不躲，用你的方式告别","win":{"text":"冥月悬在大营上空，照着她那半边城墙。她看了很久，转身下了城头。","d":{"shift":2,"bonds":{"胡列娜":8,"焱":-5},"trait":{"仁":1,"险":-1},"ending":"e3"}}}]}],"endings":[{"id":"e1","title":"结局·长明","type":"宿","grade":1,"text":"千仞雪成神，比比东成了罗刹神。天斗城下，那柄双神共存的剑刺来时，比比东挡在了女儿身前。你的灯自己亮了，照见她最后的记忆：一间产房，一个金色胎发的婴儿，一只停在半空、终究没落下的手。唐三赦免了你。后来武魂城废墟上盖起一座孤儿院，院长提着灯，觉醒从不让外人主持；每年初雪，他会在半截台阶上拢一根蜡烛。","afterlife":["比比东：替女儿挡下那一剑，临终说出了一切，罗刹神陨落。","千仞雪：被赦免，失了神位，初雪时偶尔来台阶上陪你坐一坐。","胡列娜：被赦免，远远喊你「灯童」，像很多年前一样。","武魂殿：武魂帝国覆灭，神魂村立起了金碑。"],"worldline":"原著终局不变：罗刹神陨落、武魂帝国覆灭；你作为被赦免的旧人，守着比比东最后的记忆活下去。"},{"id":"e2","title":"结局·双月同天","type":"改","grade":3,"text":"千仞雪照旧成神，一切看上去都和本该发生的一样。只有一件事不同：那柄剑刺来时，她比母亲更快。她亲手撕碎天使神装化作一面盾，神位碎了，剑上的海神之力斩断了缠在比比东身上的黑光。两个女人跌坐在地，一个不再是神，一个不再是罗刹。「我知道了，」千仞雪说，「妈妈。」极北冰原边上从此多了一座木屋，门口挂着一盏灯。","afterlife":["比比东：罗刹传承剥落，以凡人之身活到白发，常为一锅汤的盐和女儿吵半天。","千仞雪：碎了神位，第一次叫出「妈妈」，在极北看了一辈子雪。","唐三：收剑放行，只说了一句：走得越远越好。","武魂殿：帝国依旧覆灭，罗刹神位从此断了传承。"],"worldline":"千仞雪成神前得知身世，终局碎神位护母；母女以凡人之身存活，罗刹神位断绝，武魂帝国覆灭不变。"},{"id":"e3","title":"结局·龙骨灯","type":"叛","grade":2,"text":"嘉陵关破，武魂守军投降。邪月倒提月刃走在最前，焱经过你身边啐了一口，可他们都活着。比比东倒在女儿怀里时，你隔着很远举起灯，最后一次照见她的记忆：那座黑殿的门缝外，一直站着一个提灯的六岁孩子。原来她知道。战后你带玉衡走进教皇殿地宫，找到三只刻着「玉元震」的铅匣。龙脊山上立起一座祠堂，大师写的匾上只有一个字：在。","afterlife":["玉衡：带着十一个孩子重建蓝电，二十年后龙脊山顶雷声再起。","大师：亲手题了那块匾，写完一个字就搁下了笔。","焱：常在你的灯铺门口站一会儿，骂一句叛徒，又不走。","武魂殿：帝国覆灭，地宫里的魂骨一一归还旧主。"],"worldline":"蓝电霸王龙血脉未绝，宗主三块魂骨自武魂殿地宫寻回、归还玉家；罗刹陨落与帝国覆灭不变。"},{"id":"e4","title":"结局·灯烬","type":"死","grade":0,"text":"你仰面倒在嘉陵关城下，冥月真身碎成满地光点，像当年猎魂森林的萤火。灯在做最后一件事：把你自己的记忆一盏盏点亮，偏厅的炭火，红衣的小姑娘，雪里的蜡烛，石缝里不哭的孩子。裂纹走到了尽头。熄灭前，它照出一件你不记得的事：雪夜的圣殿后门，有人放下襁褓里的你，又替你点了一盏小油灯。原来你从来不是一个人。","afterlife":["胡列娜：在城头喊过你的名字，喊得很急，你没听清。","比比东：始终没有走出那道门，终局照原著陨落。","孤儿院嬷嬷：很多年里一直记得，那个总被最后想起的孩子有一盏很好看的灯。","武魂殿：武魂帝国覆灭，史书上没有提灯的人。"],"worldline":"你战死于嘉陵关，世界线照原著前行，史书上没有那个提灯的人。"}],"summary":"九节点：觉醒窥见黑殿之夜；精英大赛战唐三，胜得「三息」赴杀戮之都，败则贬往天斗太子府；猎魂之夜放走玉衡（改 M51）或硬接玉元震；星湖三分：回比比东（密室事件）、投千仞雪（宫变）、叛入唐门（需放走玉衡）；嘉陵关武魂一侧可把记忆照给千仞雪（改 M85）。结局：长明、双月同天、龙骨灯、灯烬。"},{"id":"landian","title":"蓝电霸王龙·玉家子弟","defaultName":"玉衡","gender":"男","tagline":"注定灭门的宗门，你能留下几条命","intro":"你生在蓝电霸王龙宗的旁支，却觉醒了二十年来第一个纯血。族人管大师叫废物，宗门中立几十年，以为谁也不敢动它；可二六五一年的某一夜，武魂殿会上山。一千八百条命，三块魂骨，你能救回多少？","birthYear":2632,"startYear":2638,"faction":"蓝电霸王龙宗","wuhun":{"name":"蓝电霸王龙","type":"兽","system":"强攻","tier":"顶","desc":"玉家纯血传承，雷电与龙力同体；魂环只能取自亚龙种，否则龙血排斥、爆体而亡。"},"innate":8,"attrs":{"体魄":34,"精神":24,"悟性":30,"魅力":24,"气运":22},"coins":300,"rep":{"武魂殿":0,"天斗":5,"星罗":0,"宗门":20,"魂兽":-5},"bonds":{"玉天恒":10,"大师":0,"玉元震":5},"flavor":{"work":{"name":"雷泽采药","desc":"替药堂采雷泽草药换钱"},"faction":{"name":"宗门差事","desc":"替长老巡山、守雷池"},"place":"雷鸣峰"},"rings":[{"slot":1,"options":[{"beast":"雷鳞蜥龙","years":410,"kind":"攻","skill":"雷鳞裂爪","desc":"长老定下的那头，龙爪覆鳞带电，撕裂时附加麻痹。","need":{"战力":120}},{"beast":"闪鳞蜥龙","years":370,"kind":"敏","skill":"疾雷步","desc":"大师指的那头，脚下生雷，可连续两次短距折向突进。","need":{"战力":100}}]},{"slot":2,"options":[{"beast":"雷角地行龙","years":720,"kind":"攻","skill":"霸王冲撞","desc":"低头蓄雷后直线冲撞，破甲极强。","need":{"战力":230}},{"beast":"鳞甲地龙","years":560,"kind":"防","skill":"龙鳞甲","desc":"周身浮起一层带电龙鳞，受击时反震雷流。","need":{"战力":190}},{"beast":"雷鬃地行龙","years":980,"kind":"攻","skill":"奔雷冲锋","desc":"越限的地行龙王种，冲撞带三重雷爆，吸收时龙血会沸。","need":{"战力":330}}]},{"slot":3,"options":[{"beast":"暴风雷翼龙","years":1690,"kind":"攻","skill":"雷翼冲击","desc":"雷电化作双翼短距滑翔，再自上而下贯穿目标。","need":{"战力":370}},{"beast":"岩甲角龙","years":13 把一半工钱塞进你手里。","d":{"金魂币":150,"bonds":{"欧冶青":5},"met":["shenjiang"],"trait":{"群":1}}}}]},{"id":"ev_puppet","title":"新雷鸣峰","when":{"yearMin":2652,"yearMax":2655,"levelMin":0,"flag":"puppet","notFlag":null},"w":5,"once":true,"text":"九根新铸的龙柱立起来了，金线宗旗挂在六芒星底下。四十几个武魂殿从各地凑来的蓝电弟子跪在祖祠前，等你这个宗主训话。最小的那个才八岁，和当年的玉笙一般大。","choices":[{"t":"偷偷教他们真正的雷","win":{"text":"夜里你带他们去雷泽，讲亚龙之律，讲先学会跑。","d":{"名望":3,"rep":{"武魂殿":-5},"flags":["taught_true"],"trait":{"逆":1,"仁":1}}}},{"t":"照武魂殿的规矩来","win":{"text":"执事满意地记了一笔。月底的赏钱，比旧宗门的补贴多三倍。","d":{"金魂币":500,"rep":{"武魂殿":8},"trait":{"逆":-1,"仁":-1}}}}]}],"nodes":[{"id":"n_awaken","title":"紫电入骨","year":2638,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":null,"echo":null,"text":"雷鸣峰的雷季来得早。祖祠里，旁支的孩子赤脚排在队尾，主家孩子的衣襟上绣着金线龙纹。蓝电的孩子不去武魂殿觉醒，只认祖宗的石头。轮到你时，觉醒石由蓝转紫，又沉成近乎发黑的深蓝。三长老倒吸一口冷气：「先天魂力八级，纯血。」旁支出纯血，二十年来头一回。\n\n银发如雷的宗主玉元震俯身按住你的头：「蓝电的担子，往后压在你们这一代身上。」人群里，十一岁的玉天恒抱着胳膊打量你，像打量一件刚出炉的兵器。\n\n散场时，偏殿里有个灰衫中年人独自上香。廊下的叔伯笑他罗三炮，笑他是宗主早当没生过的儿子。他却盯着你未褪的龙鳞：「长老会给你挑最凶的雷鳞蜥龙。往后四十年，人人教你往前扑，没人教你往旁边躲。先学会跑，才学得会扑。」","choices":[{"t":"照族规，取最凶的那头","hint":"宗门喜欢听话的孩子","win":{"text":"长老们满意地点头，宗主记住了你的名字。第一环，你会去猎雷鳞蜥龙。","d":{"体魄":1,"rep":{"宗门":3},"bonds":{"玉元震":5},"trait":{"忠":1}}}},{"t":"追上小刚叔，问怎么跑","hint":"长老会皱眉，大师会记住你","win":{"text":"他在雨里停下，给你讲了半个时辰闪鳞蜥龙的步法。长老在身后皱眉。","d":{"悟性":2,"rep":{"宗门":-2},"bonds":{"大师":10},"flags":["xiaogang_seed"],"trait":{"逆":1}}},"note":"按：大师武魂罗三炮是蓝电变异，一辈子卡在二十九级。"}]},{"id":"n_huangdou","title":"皇斗之败","year":2644,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M19","echo":{"flag":"xiaogang_seed","text":"前因 · 2638：六岁那年，大师教你先学会跑。"},"text":"天斗城大斗魂场，你十二岁，被宗门派来给皇斗战队观战。队长玉天恒意气风发，对面是一支叫史莱克的杂牌队，七个半大孩子。\n\n然后你看见一株最普通的蓝银草缠住了独孤雁的碧磷蛇，看见一黑一白两道虎影合成一头幽冥白虎，把堂兄的霸王龙撞出了场。满场寂静之后是哄笑。\n\n更大的哄笑在后头。有人认出史莱克带队的灰衫人，就是蓝电宗主那个被赶下山的儿子玉小刚。「皇斗输给了罗三炮教出来的人！」玉天恒的脸白得像纸，攥着枪杆的指节发青。大师站在场边，没有看任何人，只在本子上写了一行字。\n\n散场时，人潮从你们之间穿过去。堂兄在左，大师在右。","choices":[{"t":"上前向大师行族礼","hint":"堂兄会觉得被你背叛","win":{"text":"你跪下叫了声三叔。大师扶起你，堂兄头也不回地走了。","d":{"bonds":{"大师":10,"玉天恒":-5},"rep":{"宗门":-2},"flags":["honored_master"],"trait":{"逆":1}}}},{"t":"站到堂兄身边","hint":"玉家的孩子，先护自家人","win":{"text":"你一言不发地站在他身侧。他没说话，回程却把马让给了你。","d":{"bonds":{"玉天恒":10},"trait":{"群":1,"忠":1}}}},{"t":"夜里去找唐三","hint":"问问那株草凭什么拦住碧磷蛇","win":{"text":"那个蓝银草少年给你倒了杯水：「我的武魂不弱，只是你们没见过。」","d":{"悟性":1,"bonds":{"唐三":8,"大师":5},"flags":["met_tangsan"],"trait":{"险":1}}},"note":"按：唐三是蓝银草与昊天锤的双生武魂。"}]},{"id":"n_elite","title":"红雾","year":2645,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M37","echo":{"flag":"honored_master","text":"前因 · 2644：你在大斗魂场向大师行过族礼。"},"text":"武魂城，全大陆高级魂师学院精英大赛。你十三岁，作为天斗皇家学院的替补，跟着堂兄出征。场边你见过星罗皇家学院的戴澜，雷纹白虎，眼神像刀；见过神风学院借名参赛的千古明，身后一明一暗两条龙影。\n\n对上武魂殿那一场，胡列娜只抬了一下手。妖魅的红雾漫过全场，队友一个接一个跪倒，独孤雁就倒在你脚边。红雾深处亮着一盏青灰色的灯，武魂殿替补苏夜提着冥月灯走过来，灯光扫过你的眼睛，你看见自己六岁那年的雨夜被一页一页翻了出来。\n\n裁判还没有吹哨。只要撑过三回合不倒，你就是全场唯一站着的人。","choices":[{"t":"斩向那盏灯","hint":"关键战：撑过三回合","need":{"战力":350},"chance":0.45,"win":{"text":"你是全场最后站着的人。比比东在高台上看了你一眼；回山后，宗主收你做了亲传。","d":{"名望":12,"rep":{"宗门":5,"天斗":5},"bonds":{"玉元震":10,"苏夜":5},"flags":["zongzhu_disciple"],"met":["wuhun","xingluo","qiangu"],"trait":{"险":1}}},"lose":{"text":"灯光一晃，你跪进红雾。回山后族人迁怒于你，只有大师来信，叫你去史莱克。","d":{"伤势":30,"rep":{"宗门":-3},"bonds":{"大师":8},"flags":["master_lessons"],"met":["wuhun","xingluo","qiangu"]}}},{"t":"扑过去护住独孤雁","hint":"你会倒下，但堂兄会欠你一份","win":{"text":"你用后背替她挡下余波，一同倒下。堂兄抱起她时，看你的眼神变了。败后你去了史莱克。","d":{"伤势":25,"bonds":{"玉天恒":12,"独孤雁":10,"大师":5},"flags":["shielded_yan","master_lessons"],"met":["wuhun","xingluo","qiangu"],"trait":{"仁":1,"群":1}}},"note":"按：原著武魂殿以妖魅一击放倒天斗皇家战队。"}]},{"id":"n_storm","title":"山雨欲来","year":2650,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M47","echo":{"flag":"tianhen_friend","text":"前因 · 2648：你替堂兄在宗主面前说过情。"},"text":"你十八岁这年，雷鸣峰上的乌鸦多了。武魂殿给上三宗的补贴断了，山下的商队不再上山，天斗城里有人说唐三认祖归宗，回了昊天宗。宗主听完只是摆手：「比比东不会动小刚的家。」\n\n你不信。玉天恒也不信，独孤雁的事被压了两年，他看宗门的眼神早就变了。那夜在雷池边，他指着池底一块落石说，小时候他从那里钻出去过，那是先祖避雷劫开的古道，被落石封死多年，通向山背的涧谷。\n\n宗主殿、雷池、天斗城。离那一夜还有几个月，你只来得及做一件事。","choices":[{"t":"再闯宗主殿，逼他备战","hint":"你会站在宗主身边迎接那一夜","win":{"text":"宗主终究没有调兵，却把一枚雷令按进你手心：「真到那一夜，护住孩子。」","d":{"rep":{"宗门":2},"bonds":{"玉元震":8},"flags":["warned"],"item":"宗主雷令","trait":{"忠":1}}}},{"t":"和堂兄挖通雷池古道","hint":"在宗主眼皮底下备一条退路","need":{"体魄":38},"win":{"text":"四个月夜里刨石，堂兄磨烂三回手，你断了七根龙爪指甲。古道通了，独孤雁在出口搭起窝棚等着。","d":{"伤势":10,"bonds":{"玉天恒":10,"独孤雁":5},"flags":["tunnel"],"trait":{"逆":1,"险":1}}}},{"t":"下山求小刚叔出面","hint":"也许来得及，也许来不及","win":{"text":"大师连夜去求见太子，回来只说了一句：「来不及了。」你调头往山上赶。","d":{"bonds":{"大师":8},"flags":["went_tiandou"],"trait":{"群":1}}},"note":"按：武魂殿此前已决议，一个月后启动猎魂行动。"}]},{"id":"n_hunt_tunnel","title":"雷池古道","year":2651,"cond":{"flag":"tunnel","notFlag":null,"levelMin":0},"canon":"M51","echo":{"flag":"yusheng_debt","text":"前因 · 2642：雷泽那年，你留下来给玉笙止过血。"},"text":"今夜是旁支守夜祭雷的日子。你挨家挨户劝来了人，说雷池今年有异象，孩子们来沾沾龙气。雷池边挤了三百一十二个人，最小的还在襁褓里，最老的是拄拐的七叔公。\n\n然后山下亮起了火把，一条，十条，一百条。峰顶炸开金色雷光，夜空里浮起一黑一金两个巨大的圆，缓缓压向宗主殿，那是菊鬼二老的两极静止。宗主撑不住的。\n\n「古道一次只过一个人，至少要一个时辰。」玉天恒攥住你的胳膊，「一旦被发现，挤在里面的一个也跑不掉。」七叔公用拐杖顿地：「孩子先走！我们这些老骨头最后！」玉笙抱着一个三岁的孩子挤到你身边：「{name}哥，你走最后，对不对？」","choices":[{"t":"打开古道，带三百人走","hint":"改写原著","need":{"名望":15},"canonChange":{"node":"M51","inertia":4,"desc":"蓝电霸王龙宗三百一十二名孩童与旁支族人自雷池古道生还，玉天恒未死"},"win":{"text":"一个时辰，你守在入口，最后一个钻进去。山涧里独孤雁的灯亮着；身后，宗主殿塌了。","d":{"shift":12,"名望":15,"rep":{"宗门":15,"武魂殿":-20},"bonds":{"玉笙":15,"玉天恒":15,"独孤雁":8},"flags":["clan_saved","tianhen_alive"],"trait":{"逆":2,"仁":2,"群":1}}}},{"t":"只拉起玉笙钻出石缝","hint":"活下来两个人，剩下的交给命","win":{"text":"一盏茶工夫，你们从老藤后滚进山涧。回头时，雷池边的歌声已经没了。","d":{"shift":1,"bonds":{"玉笙":15},"flags":["yusheng_saved","in_tiandou"],"trait":{"群":-1,"险":-1}}}}]},{"id":"n_hunt","title":"猎魂之夜","year":2651,"cond":{"flag":null,"notFlag":"tunnel","levelMin":0},"canon":"M51","echo":{"flag":"suye_umbrella","text":"前因 · 2645：武魂城雨夜，你给罚跪的苏夜撑过一把伞。"},"text":"火把从三面缠上雷鸣峰。山门那边传来第一声惨叫时，你站在祖祠前，身后挤着二十几个孩子，玉笙攥着一根比她还高的门闩，守着侧门。\n\n峰顶，宗主化身霸王龙，金色雷光一次次撞向夜空里一黑一金两个巨大的圆，一次比一次暗。祖祠龙柱上的铁链齐齐崩断。\n\n大门被一杆骑枪撞开。武魂殿圣殿骑士统领踏进来，六个魂环压得烛火伏地。他身后，一个瘦削苍白的青年提着青灰色的灯，是苏夜。灯光扫过孩子们，停在你脸上。远处鸦岭方向，有人正把什么东西装进三只木匣。","choices":[{"t":"龙吼震门，截住统领","hint":"关键战：撑过三回合，孩子们就能出去","need":{"战力":750},"chance":0.35,"win":{"text":"三回合，你用霸王龙吼钉住了他。玉笙带孩子们从侧门没入夜色，你浑身是血滚下后山。","d":{"伤势":40,"名望":10,"rep":{"武魂殿":-10},"bonds":{"玉笙":10},"flags":["kids_saved","in_tiandou"],"trait":{"仁":1,"险":1}}},"lose":{"text":"骑枪贯穿你的肩，把你钉在龙柱上。最后看见的，是孩子们被一个个拖出祖祠。","d":{"伤势":60,"flags":["captured"],"trait":{"险":1}}}},{"t":"迎着那盏灯走过去","hint":"赌苏夜还记得你","need":{"精神":36},"canonChange":{"node":"M51","inertia":1,"desc":"苏夜以冥月灯迷住骑士统领，放走一个蓝电少年和几个孩子"},"win":{"text":"灯光在你记忆里停了一瞬。苏夜别过脸，统领的眼神忽然空了。你抱起两个孩子冲出侧门。","d":{"shift":2,"bonds":{"苏夜":15,"玉笙":5},"flags":["suye_spared","in_tiandou"],"met":["wuhun"],"trait":{"逆":1,"险":1}}}},{"t":"潜上鸦岭，记下每张脸","hint":"你会知道三块骨头去了哪里","win":{"text":"鸦岭上，一个天斗暗卫用影蝠替你遮住身形。你看着宗主的三块骨头被剥出，分进三只匣子。","d":{"伤势":20,"精神":3,"bonds":{"纪无声":8},"flags":["saw_bones","in_tiandou"],"met":["huangshi"],"trait":{"仁":-1,"险":-1}}},"note":"按：一匣送教皇殿，一匣给圣龙宗少宗主，一匣给象甲宗主。"}]},{"id":"n_tea","title":"教皇的茶","year":2652,"cond":{"flag":"captured","notFlag":null,"levelMin":0},"canon":"M51","echo":{"flag":"master_lessons","text":"前因 · 2645：红雾一败之后，是大师教你承认自己会输。"},"text":"锁环封住魂力，你在没有窗的石室里关了不知多少天，听执事们说一年后要开七宗重选大会，上三宗缺了一个位子。\n\n教皇殿里，比比东素袍未冠，亲手煮茶。「玉小刚的族侄。他教过你什么？」「教我承认自己会输。」她的手在壶上停了一瞬，笑了：「他还是这样。」\n\n「玉元震把他从族谱上划掉，他在山门外跪了三天三夜，那老东西连门都没开。我替他出了一口气。」宗主的三块骨头，头骨她留着，右臂赏给了圣龙宗少宗主拓跋烈，左腿赏给了象甲宗宗主呼延震。她推过来一枚新铸的青玉令牌，正面是霸王龙，背面是六芒星：「雷鸣峰可以重建，你来当宗主，旗挂在我的旗杆上。不接，我也放你回去，回他身边，告诉他是我放的。」","choices":[{"t":"接过那枚宗主令","hint":"雷鸣峰会立起来，挂着别人的旗","win":{"text":"雷鸣峰会重新立起来，挂着别人的旗。武魂殿送来的第一笔银子，比你见过的都多。","d":{"金魂币":2000,"名望":5,"shift":3,"rep":{"武魂殿":30,"宗门":-20,"天斗":-10},"bonds":{"比比东":10,"大师":-10},"flags":["puppet"],"item":"蓝电宗主令（武魂殿铸）","trait":{"忠":-2,"逆":-1}}}},{"t":"把茶泼在白玉地上","hint":"她会放你走，为了另一个人","win":{"text":"茶水在白玉上散开。她没看你，只挥了挥手。三天后，你把这句话带给了大师。","d":{"rep":{"武魂殿":-15},"bonds":{"比比东":-20,"大师":10},"flags":["spat_pope","in_tiandou"],"trait":{"忠":1,"逆":1}}},"note":"按：原著比比东灭蓝电，自称是替大师出气。"}]},{"id":"n_jialing","title":"嘉陵关","year":2656,"cond":{"flag":null,"notFlag":"puppet","levelMin":0},"canon":"M74","echo":{"flag":"saw_bones","text":"前因 · 2651：鸦岭上，你亲眼看着三块骨头被分进三只匣子。"},"text":"五年。七宗重选大会上，圣龙宗、象甲宗都进了新七宗，拓跋烈当众亮出新融的右臂骨，满场喝彩；武魂殿立国，雪崩继位，唐三出海又归来。你二十四岁，站在嘉陵关外的天斗大营。\n\n首战那天，象甲宗主呼延震的巨象虚影遮天压来，唐三只抬了一下手。战后他从那具躯体里取出一截缠雷的腿骨，放进你手里：「老师说，这是你家的。」奔雷龙踏。你在血泥里跪了很久。\n\n林照在帐前磨剑，你怀里揣着戴澜从水云关寄来的信。号角响起，青金色的圣龙军团涌出关门，旗下青年的右臂覆满暗蓝龙鳞，五指缠雷。「蓝电的余孽！你们宗主的爪子，现在是我的！」柳二龙浑身燃起火龙之焰，回头看你：「你不想去，姑姑替你去。」","choices":[{"t":"迎战拓跋烈，夺回龙爪","hint":"关键战：用宗主的雷，拿宗主的爪","need":{"战力":1050},"chance":0.4,"win":{"text":"你用宗主教你的雷，劈开了他握不稳的爪。霸王龙爪回到你右臂时，你听见一声很远的龙吟。","d":{"伤势":35,"名望":15,"rep":{"天斗":8,"武魂殿":-10},"bone":{"slot":"右臂","name":"霸王龙爪","desc":"宗主玉元震遗骨，龙爪缠雷，可瞬发一记不耗魂环的霸王龙爪。","attrs":{"体魄":6}},"item":"奔雷龙踏（宗主左腿骨）","reveal":["拓跋希"],"met":["qibao","xingluo"],"trait":{"险":1,"逆":1}}},"lose":{"text":"那只龙爪穿过你胸口时，你认出了那道雷。","d":{"ending":"e3"}}},{"t":"请柳二龙姑姑出手","hint":"骨头会回来，只是不是你亲手拿的","win":{"text":"火龙从天而降，把拓跋烈连人带甲吞了下去。她从灰烬里扒出龙爪，用衣襟包好塞给你。","d":{"rep":{"天斗":3},"bonds":{"柳二龙":10},"item":"霸王龙爪与奔雷龙踏","reveal":["拓跋希"],"met":["qibao","xingluo"],"trait":{"群":1,"险":-1}}},"note":"按：原著呼延震于嘉陵关首战被唐三秒杀。"}]},{"id":"n_jialing_puppet","title":"城下之龙","year":2656,"cond":{"flag":"puppet","notFlag":null,"levelMin":0},"canon":"M74","echo":{"flag":"stood_for_master","text":"前因 · 除夕家宴：你曾站起来，说小刚叔不是废物。"},"text":"五年，你跪着把雷鸣峰立了起来：九根新铸的龙柱，金线绣的宗旗，四十几个凑来的蓝电弟子，旗杆顶上挂着六芒星。七宗重选大会上，你坐在圣龙宗下首。\n\n现在你站在嘉陵关城头，站在拓跋烈身边。他的右臂覆满暗蓝龙鳞，五指缠雷，那是宗主的爪。首战那天，你亲眼看着呼延震被唐三一抬手放倒，那截奔雷龙踏落进了天斗人手里。\n\n号角响了。拓跋烈要你的弟子跟他出关打头阵。城下天斗阵中，一个灰衫老人站在柳二龙身边，仰头喊你的名字：「{name}！」声音不大，却穿过了整片战场。","choices":[{"t":"阵前倒戈，雷劈拓跋烈","hint":"五年的跪，用一爪还清","need":{"战力":1000},"chance":0.45,"win":{"text":"你从背后一爪劈开他的龙铠，火龙随即落下将他吞没。你跪在大师面前，五年的跪用一爪还清。","d":{"shift":4,"rep":{"武魂殿":-40,"天斗":10},"bonds":{"大师":15,"柳二龙":5},"flags":["defected"],"item":"霸王龙爪（宗主右臂骨）","trait":{"逆":2,"忠":1}}},"lose":{"text":"他的龙爪比你的雷快。那道熟悉的雷光，穿过了你的胸口。","d":{"ending":"e3"}}},{"t":"守在旗下，等帝国赢","hint":"宗主说过，谁都不站最安全","win":{"text":"你没有动。你看着火龙落下，看着拓跋烈和那条手臂一起被吞没，一直站到天黑。","d":{"bonds":{"大师":-15},"rep":{"武魂殿":3},"trait":{"险":-2,"忠":-1},"ending":"e4"}}}]},{"id":"n_bones_home","title":"三骨","year":2657,"cond":{"flag":"clan_saved","notFlag":null,"levelMin":0},"canon":"M85","echo":{"flag":"xiaogang_head","text":"前因 · 2651：你请大师做了三百人的族长。"},"text":"武魂帝国覆灭了。天上一金一紫两位神撞碎了半边天空，比比东替女儿挡下一剑，死前说了很多话，有一些是说给一个穿灰布长衫的老人听的。\n\n城破第三天，大师领你走进教皇殿深处一间不起眼的书房。书案上一盏熄灭的灯，一只紫檀木匣，纸条上三个字：给小刚。匣里锦缎上躺着雷霆龙瞳，两点金光已经很暗。大师读完匣底那封信，折好收进袖子，很久才开口：「她拿一千八百条命，换一口我根本不想出的气。可她也是这世上唯一觉得我被欺负了的人。」\n\n他把木匣递给你：「三块骨头都齐了。它们是蓝电的东西，该由蓝电的人决定往哪去。」天斗城里，三百多个人在等你回家。","choices":[{"t":"带三骨回雷鸣峰，交给族人","hint":"蓝电会重新打雷","win":{"text":"那年春天，你领着三百多人回到了雷鸣峰。","d":{"shift":5,"rep":{"宗门":20,"天斗":5},"flags":["bones_home"],"trait":{"群":2,"仁":1},"ending":"e1"}}},{"t":"一个人回山守着它们","hint":"让骨头和宗门睡在一起","win":{"text":"你让族人留在天斗城，自己抱着木匣上了山。","d":{"flags":["bones_buried"],"trait":{"群":-2},"ending":"e2"}}}]},{"id":"n_bones","title":"三骨","year":2657,"cond":{"flag":null,"notFlag":"clan_saved","levelMin":0},"canon":"M85","echo":{"flag":"defected","text":"前因 · 2656：嘉陵关阵前，你倒戈劈向了拓跋烈。"},"text":"武魂帝国覆灭了。天上一金一紫两位神撞碎了半边天空，比比东替女儿挡下一剑，死前说了很多话，有一些是说给一个穿灰布长衫的老人听的。\n\n城破第三天，大师领你走进教皇殿深处一间不起眼的书房。书案上一盏熄灭的灯，一只紫檀木匣，纸条上三个字：给小刚。匣里躺着雷霆龙瞳，两点金光已经很暗。大师读完匣底那封信，折好收进袖子：「她拿一千八百条命，换一口我根本不想出的气。可她也是这世上唯一觉得我被欺负了的人。」\n\n他把木匣和那截奔雷龙踏一起递给你：「三块骨头都齐了，该由蓝电的人决定往哪去。」可雷鸣峰上，只剩焦黑的柱子和荒草。","choices":[{"t":"把三骨埋进祖祠废墟","hint":"让它们和宗门睡在一起","win":{"text":"你在祖祠裂开的青石底下挖了一个坑。没有立碑，也没有告诉任何人。","d":{"flags":["bones_buried"],"trait":{"忠":1,"群":-1},"ending":"e2"}}},{"t":"融了龙瞳，守着空山","hint":"宗主的眼睛，替你看着这座山","win":{"text":"金光沉进你的眼底。宗主看过的雷鸣峰，往后由你来看。","d":{"bone":{"slot":"头","name":"雷霆龙瞳","desc":"宗主玉元震遗骨，龙瞳一睁，同阶魂师如负雷霆。","attrs":{"精神":8}},"trait":{"险":1,"逆":1},"ending":"e2"}}}]}],"endings":[{"id":"e1","title":"结局·蓝电长鸣","type":"宗","grade":3,"text":"回山的队伍比出山时还长：六年里走了几个老人，又添了十几个孩子。玉笙第一个挽起袖子，搬开祖祠门口的碎石。唐门派来工匠，欧冶青重铸了龙柱铁链，雪崩封大师为蓝电王。大师不接宗主之位：「宗主该由会打雷的人来做。」你成了第二十七代宗主，把雷霆龙瞳供进龙龛，把奔雷龙踏交给玉笙，在新宗规第一条写下：蓝电不求人，亦不负人；有约必守，有难必援。那夜，雷鸣峰顶终于又打了雷。","afterlife":["玉天恒：与独孤雁成婚，婚宴三十六张长案不分上下首，独孤博喝得大醉。","大师：受封蓝电王，仍在天斗城教书，每年雷祭上山主祭。","玉笙：接过奔雷龙踏，成了雷鸣峰上跑得最快的人。","蓝电霸王龙宗：废主旁之分，弃中立而守约，再没人叫它被灭门的上三宗。"],"worldline":"蓝电霸王龙宗未绝，三百余人归山重建，大师受封蓝电王；宗门弃中立而守约。"},{"id":"e2","title":"结局·孤龙守冢","type":"孤","grade":1,"text":"你回到雷鸣峰，再没下山，宗主的骨头也没有再离开这座山。雪崩封大师为蓝电王，可玉家只剩一个名字：活下来的人散在天斗城的街巷里，改姓的改姓，入唐门的入唐门。你在祖祠旁搭了草屋，砍柴挑水，雷雨夜站在峰顶黑石上，浑身缠着蓝紫电光，像一条孤零零的龙。猎户说，那是蓝电最后一个纯血。有时你对着青石说话：宗主说错了，谁都不站不是最安全，是最孤单。","afterlife":["大师：在天斗城教了一辈子书，柳二龙常替他上山送米面和酒，洒一碗在青石上。","柳二龙：问过你要守到什么时候。你说，守到有人回来。","提灯的苍白男人：某年冬天在山门石阶坐了一夜，留下一把断了骨的旧油纸伞。","蓝电霸王龙宗：只活在天斗的史书和唐门的卷宗里。"],"worldline":"与原著相近：蓝电只剩名号，宗主三骨留在雷鸣峰，峰上只有一个守冢人。"},{"id":"e3","title":"结局·雷落嘉陵","type":"死","grade":1,"text":"那只龙爪落下来时，你认出了那道雷，六岁那年它在你头顶停过。现在它穿过了你的胸口。你跪进血泥，听见柳二龙撕心裂肺地喊你的名字。然后火来了，一条通红的火龙把拓跋烈连人带甲、连那条不属于他的手臂一起吞了进去。大师把你葬在雷鸣峰，把龙爪和龙踏放在你右手边和左腿边，就像它们原本该在的位置。墓碑上只有一行：他为他的宗门，向前扑了一次。","afterlife":["柳二龙：焚杀拓跋烈，从灰烬里扒出霸王龙爪，用自己的衣襟包好。","大师：一年后在教皇殿书房找到写着给小刚的木匣，把它埋在你墓旁。","唐三：在嘉陵关为你点了一盏灯，此后每逢雷雨都会停下来听一会儿。","蓝电霸王龙宗：纯血又少一脉；雷雨夜，峰上总有人听见两声龙吟，一老一少。"],"worldline":"你死于本宗宗主的龙爪之下，柳二龙焚杀拓跋烈；三块魂骨最终都葬在雷鸣峰。"},{"id":"e4","title":"结局·傀儡之冠","type":"堕","grade":0,"text":"武魂帝国像被雷劈中的沙塔，一夜塌尽。天斗军上山时，新蓝电的弟子早已跑光，你穿着宗主袍独自坐在祖祠门口。地牢第九十二天，大师捧着紫檀木匣站在铁栅外：「陛下准了唐三的请，不杀你。新雷鸣峰会被拆掉。」他沉默很久：「我教你先学会跑，却没教你什么时候该站起来。这是我的错。」半个月后你被放出城，沿官道往北走。茶馆里，说书人正讲那个给武魂殿当了五年狗的伪宗主，满堂哄笑。","afterlife":["大师：三块骨头都落在他手里，一块也没融，供在天斗城的旧书房里。","拓跋烈：死在柳二龙的火龙里，霸王龙爪从灰烬中被扒了出来。","新蓝电宗：四十几个弟子被遣散回乡，九根新龙柱被推倒。","蓝电霸王龙宗：史书只记旧宗，七宗重选大会上的那一个不算。"],"worldline":"武魂帝国扶起的伪蓝电随帝国覆灭被拆除，你被赦后流放，三块魂骨归于大师。"}],"summary":"蓝电旁支纯血线，主题是猎魂之夜能留下几条命。11 个节点，单局经过 7–8 个：觉醒、皇斗、精英大赛战苏夜、山雨欲来三岔；挖通古道者可救三百一十二人（改写 M51），否则祖祠死战、借苏夜之灯或上鸦岭看三骨分匣，被俘则受比比东宗主令。嘉陵关战拓跋烈夺霸王龙爪，傀儡线可倒戈。"},{"id":"beast","title":"星斗·十万年魂兽化形","defaultName":"白霜","gender":"女","tagline":"你是猎物，也是会走路的宝库","intro":"你是霜泉谷的十万年霜角白鹿，追着小舞的脚步化成六岁女孩。人间有热粥，也有武魂殿执事发亮的眼睛：在他们眼里，你是一道十万年魂环和一块必掉的魂骨。星湖那天，献祭的也可能是你。","birthYear":2631,"startYear":2637,"faction":"魂兽","wuhun":{"name":"霜角白鹿","type":"兽","system":"控制","tier":"顶","desc":"本体所化的冰属性武魂，踏霜无声、凝雾迷踪；无需猎杀即可自生魂环，鹿角可解百毒。"},"innate":10,"attrs":{"体魄":34,"精神":44,"悟性":38,"魅力":40,"气运":26},"coins":0,"rep":{"武魂殿":0,"天斗":0,"星罗":0,"宗门":0,"魂兽":25},"bonds":{"大明":20,"二明":20,"小舞":10},"flavor":{"work":{"name":"药铺帮工","desc":"跟姜婆婆采药卖药"},"faction":{"name":"林中巡守","desc":"替星斗魂兽探路示警"},"place":"诺丁城·姜家药铺"},"rings":[{"slot":1,"options":[{"beast":"自生·霜 1}}}}]}],"nodes":[{"id":"n_huaxing","title":"霜角","year":2637,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":null,"text":"霜泉谷的夜冷得发脆。今夜子时，你骨头里最后一道年轮合拢，你成了十万年霜角白鹿。\n\n二明蹲在泉边，地面陷下一寸，他说话难得拐弯：「小舞半年前就走了。你真想好了？」大明在雾里吐信：「人类要的不是你，是你的角、你的环、你的骨。化了形就回不了头，六十级以前，魂斗罗一眼就能看穿你。」\n\n你还是走进了泉水。化形的疼，像把十万年一寸寸折进一个小小的身体里。你从水里站起来，是一个白头发的六岁女孩。二明给你取了个人类的名字：{name}。你感觉得到，第一道魂环正在骨头里等着自己长出来。","choices":[{"t":"循着小舞的气味南下","hint":"去她去的地方","win":{"text":"你踩着薄霜出了林子。空气里那一点甜甜的兔子味，一直往南，通向人类的城。","d":{"bonds":{"小舞":5},"flags":["follow_xiaowu"],"reveal":["大明","二明"],"trait":{"险":1}}}},{"t":"向二明讨一条回头路","hint":"森林会给你留门","win":{"text":"二明拍着胸口说，只要你回来，森林就认你。大明没说话，尾巴扫平了你的脚印。","d":{"bonds":{"二明":5,"大明":5},"rep":{"魂兽":5},"flags":["promise_return"],"reveal":["大明","二明"],"trait":{"群":1,"险":-1}}}}]},{"id":"n_first_night","title":"人间第一夜","year":2637,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M05","text":"诺丁城给你的第一样东西是一碗粥。城南草药铺的姜婆婆把旧棉袄裹在你身上，往小米粥里卧了个鸡蛋。你捧着碗，眼泪掉进了粥里。\n\n开春，武魂殿执事来城里主持觉醒。水晶球亮起时，你体内的白鹿抬了头，脚下霜气乱窜，眼看魂环就要现形。姜婆婆一抬手打翻药罐，满屋苦烟遮住了你。执事咳着记下：兽武魂，先天满魂力，可推荐武魂殿。\n\n姜婆婆回绝了推荐，把你送进诺丁学院当工读生。第一天，一个蝎子辫女孩凑过来嗅了嗅你，压低声音：「你身上……有星斗的味道。」她身后那个蓝衣男孩，什么都没问。","choices":[{"t":"对小舞说出你的本名","hint":"同类相认","win":{"text":"小舞一把抱住你，说从今往后两只十万年互相守着秘密。唐三在门口站岗，像什么都没听见。","d":{"bonds":{"小舞":10,"唐三":5},"flags":["xiaowu_kin"],"reveal":["小舞"],"trait":{"群":1}}}},{"t":"只说自己是山里孤儿","hint":"藏得更深","win":{"text":"小舞眨眨眼没再追问。回到药铺，姜婆婆在灯下替你缝新袄，你第一次觉得有了家。","d":{"精神":2,"bonds":{"姜婆婆":10},"flags":["hide_well"],"trait":{"群":-1,"险":-1}}}}]},{"id":"n_titan","title":"月下巨猿","year":2643,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M15","text":"六年里你学会了用筷子、煎药，学会了在被问起魂环时说一句「运气好，猎到只老雪貂」。你随小舞考进史莱克，不在七怪之列，只是跟着他们来星斗外围猎魂。\n\n这夜，林子里响起山在走路的声音。二明来了，他来找小舞，也找到了你。小舞抱着他的手指哭了一场，最后摇头：她要留在唐三身边。二明沉默了很久，转过那颗比你整个人还大的脑袋看你。\n\n「你呢？」他问，「林子里的家伙都说你身上全是人味。可你要回来，我替你挡着。」营火那边，唐三正守着小舞那道刚刚自生的千年魂环。","choices":[{"t":"天亮前跟二明回森林","hint":"重新学做一头鹿","win":{"text":"你没跟任何人告别。二明把你放在肩上，林子的风灌进衣领，冷得让你想哭。","d":{"bonds":{"二明":10},"rep":{"魂兽":8},"flags":["return_forest"],"trait":{"忠":1,"群":-1}}}},{"t":"留在史莱克去天斗","hint":"继续做人","win":{"text":"二明叹口气，揉乱你的白头发走了。第二天，你跟着史莱克的马车往天斗城去。","d":{"bonds":{"小舞":5,"唐三":5},"flags":["stay_human"],"trait":{"群":1,"逆":1}}}}]},{"id":"n_red_flower","title":"红花落地","year":2645,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M39","echo":{"flag":"deacon_marked","text":"前因 · 诺丁：武魂殿的本子上，早就记着你的名字。"},"text":"武魂城的决赛场像一口倒扣的金钟，你坐在最高一排角落，帽兜压住白发。大明说过，魂斗罗以上能察觉幼生期的化形者，而这里的封号斗罗多得数不过来。\n\n场上，相思断肠红落地，小舞的十万年身份当众暴露。鬼斗罗的目光扫过看台，在你这一排停了一瞬。你体内的白鹿炸了毛，冰霜从指尖往外渗。\n\n一只冰凉的手按住你的手腕。武魂殿队的替补少年苏夜坐到你身边，掌心托着一盏幽暗的冥月灯。他看见了什么，脸色发白，却低声说：「别动。」灯光一晃，遮住了你的霜气。远处，昊天斗罗一锤落下，带走了唐三和小舞。苏夜朝看台后的一条小巷偏了偏头。","choices":[{"t":"追着昊天斗罗的方向跑","hint":"回到小舞身边","chance":0.8,"win":{"text":"你跑了三天三夜，在星斗林口追上小舞。她拉住你的袖子，说哥说过五年后来接她。","d":{"bonds":{"小舞":5,"苏夜":3},"flags":["suye_knows","chased_xiaowu"],"met":["wuhun"],"trait":{"险":1,"群":1}}},"lose":{"text":"城外巡逻的执事放出魂技，你挨了一下才钻进林子，三天后才追上小舞。","d":{"伤势":25,"bonds":{"小舞":5},"flags":["suye_knows","chased_xiaowu"],"met":["wuhun"]}}},{"t":"走苏夜指的那条小巷","hint":"欠武魂殿少年一个人情","win":{"text":"小巷尽头停着去天斗的货车。你回头，苏夜已经不见了，只剩一点幽蓝的灯光。","d":{"bonds":{"苏夜":10},"flags":["suye_knows","suye_saved"],"met":["wuhun"],"trait":{"险":-1}}}}]},{"id":"n_lantern","title":"提灯人","year":2650,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M47","echo":{"flag":"suye_saved","text":"前因 · 2645：苏夜在武魂城替你遮住了霜气。"},"text":"落霞镇在星斗边缘，离星湖一夜脚程。你在镇东头开了个草药摊，手艺是姜婆婆教的，镇上人叫你白姑娘。你十九岁了，至少这具身体是。\n\n灯节那晚，一个提灯的青年站到你摊前，要一包酸枣仁，说是失眠。是苏夜。他如今是武魂殿猎队的先遣，来勘进山的路。你们沿着溪走了很远，谁也没提武魂城那一天。临别时，他把一盏素白河灯塞进你手里。\n\n「明年夏天，武魂殿要进星湖捉小舞。」他说，「教皇定的，长老带队。我不该告诉你。」那盏灯在你掌心里，暖得发烫。","choices":[{"t":"连夜赶回星湖报信","hint":"让森林早做准备","win":{"text":"大明听完只说了一句知道了。当夜，湖面起了一层封湖的雾。","d":{"bonds":{"小舞":5,"大明":5},"rep":{"魂兽":8},"flags":["warned_lake"],"trait":{"群":1,"忠":1}}}},{"t":"求苏夜给你看猎队名单","hint":"他会为你冒更大的险","need":{"魅力":40},"chance":0.7,"win":{"text":"他沉默很久，把名单摊在溪石上：菊鬼二老、黄金一代，还有一只压住气息的人面魔蛛。","d":{"bonds":{"苏夜":10},"flags":["saw_roster"],"trait":{"险":1}}},"lose":{"text":"他摇头收起了灯：「知道得越多，你越危险。」那晚他再没开口。","d":{"bonds":{"苏夜":-3},"trait":{"险":1}}}},{"t":"放灯入溪，从此两清","hint":"不留软肋","win":{"text":"河灯漂远了。你告诉自己，不把软肋交到任何人手里。","d":{"bonds":{"苏夜":-8},"flags":["cut_suye"],"trait":{"群":-2}}}}]},{"id":"n_starlake","title":"星湖","year":2651,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M52","echo":{"flag":"saw_roster","text":"前因 · 2650：你看过名单，知道人面魔蛛藏在哪片草里。"},"text":"那年夏天，菊斗罗、鬼斗罗带着黄金一代涌进星湖。队伍里那个叫唐银的蓝发青年忽然转身，满地蓝银草缠住了胡列娜和邪月——是唐三。他一个人对两个封号斗罗，一步步退，脚下的血越来越多。\n\n两极静止领域罩住了他。领域边缘，一只被魂导器压住气息的三万年人面魔蛛翘起毒螯，对准他的后心。苏夜提着灯站在领域外，脸色惨白。\n\n小舞停下脚步，回头看了你一眼。那一眼你很熟悉，是近乎温柔的决绝。十万年化形者可以把一切献给一个人，献祭者永世不得超生。\n\n你也是十万年。你离唐三比她近十步。你只有一次呼吸的时间。","choices":[{"t":"抢先把自己献给唐三","hint":"改写原著","canonChange":{"node":"M52","inertia":3,"desc":"献祭者由小舞换成霜角白鹿：唐三第六环与右臂骨来自你，小舞存活"},"win":{"text":"你比小舞快了一步。白光升起时，你听见苏夜手里的灯啪地碎了。","d":{"shift":10,"bonds":{"小舞":20,"唐三":20},"flags":["sacrificed_self"],"trait":{"仁":2,"逆":2},"ending":"e1"}}},{"t":"扑到唐三身前挡下一击","hint":"改写原著","canonChange":{"node":"M52","inertia":5,"desc":"星湖无人献祭：小舞存活，唐三缺失十万年第六环与魂骨，武魂殿转而追猎两头十万年"},"win":{"text":"毒螯刺穿冰甲，黑纹爬满你半边身子。小舞没有献祭，扑过来抱住了倒下的你。","d":{"shift":20,"伤势":55,"bonds":{"小舞":15,"唐三":10},"rep":{"武魂殿":-20,"魂兽":10},"flags":["blocked_strike"],"trait":{"逆":3,"险":2,"仁":1}}}},{"t":"冲进黑雾撞向鬼斗罗","hint":"关键战：撞乱两极静止","need":{"战力":800},"chance":0.3,"win":{"text":"你三撞鬼魅，领域松了一瞬，唐三挣脱。可小舞还是走向了他，粉色的光散了。","d":{"伤势":40,"名望":15,"rep":{"武魂殿":-15},"bonds":{"唐三":5},"flags":["beat_ghost","lake_free"],"trait":{"险":2}}},"lose":{"text":"鬼斗罗一掌落在你后颈。醒来时你在铁笼车里，听见他们说兔子献祭了，好在还捞着一头。","d":{"伤势":50,"rep":{"武魂殿":-5},"flags":["caged"],"trait":{"险":2}}}},{"t":"伏在雾里一动不动","hint":"原著：小舞献祭","win":{"text":"你看着粉光升起，看着唐三抱住一只小兔。指甲掐进掌心，你始终没有起身。","d":{"flags":["hid_starlake","lake_free"],"bonds":{"小舞":-5},"trait":{"险":-2,"逆":-1}}}}]},{"id":"n_cage","title":"破笼","year":2652,"cond":{"flag":"caged","notFlag":null,"levelMin":0},"canon":"M56","echo":{"flag":"suye_stories","text":"前因 · 地宫：你给苏夜讲了一整个冬天的森林。"},"text":"武魂城地宫的白玉石室，干净得像一座没有死人的坟。比比东来看过你一次，像看一件珠宝：她不要你的尸体，要你长到六十级后，自愿献祭给胡列娜。苏夜被派来看守你，他每天送药，从不点灯。\n\n可今夜城里乱了。天斗传回消息，太子雪清河就是千仞雪，她回城与教皇决裂，长老殿吵成一团，镣铐上的符文闪了几下。\n\n门外传来焱的脚步声。教皇等不及了，他来押你去献祭台，周身火焰烧得心神不宁。苏夜站在他身后，手里的冥月灯暗着，看了你一眼。","choices":[{"t":"挣断镣铐冲破第二道门","hint":"关键战：火克冰","need":{"战力":900},"chance":0.5,"win":{"text":"冰对火，你撞碎了第二道门。焱捂着冻伤的手臂没再追，城里乱得没人顾得上你。","d":{"伤势":35,"名望":10,"rep":{"武魂殿":-20},"flags":["escaped","lake_free"],"reveal":["千仞雪"],"trait":{"险":2,"逆":1}}},"lose":{"text":"火克冰。你倒在第二道门前，血把地面染成淡粉色。","d":{"伤势":60,"reveal":["千仞雪"],"ending":"e2"}}},{"t":"让苏夜熄灯替你开门","hint":"他从此回不了武魂殿","need":{"魅力":40},"chance":0.7,"win":{"text":"冥月灯熄了。苏夜替你开了三道门，在城墙下说：「往西走，别回头。」","d":{"shift":3,"bonds":{"苏夜":20},"rep":{"武魂殿":-15},"flags":["suye_defected","escaped","lake_free"],"reveal":["千仞雪"],"trait":{"群":1}}},"lose":{"text":"焱察觉了。苏夜被押进长老殿刑房，你被拖回石室，镣铐换了新的。","d":{"bonds":{"苏夜":10},"reveal":["千仞雪"],"ending":"e2"}}},{"t":"顺从地走向献祭台","hint":"认命","win":{"text":"你没有挣扎。走过长廊时，你只问焱一句：今天外面下雪了吗。","d":{"reveal":["千仞雪"],"trait":{"险":-2},"ending":"e2"}}}]},{"id":"n_jimie","title":"寂灭","year":2653,"cond":{"flag":"blocked_strike","notFlag":null,"levelMin":0},"canon":null,"echo":{"flag":"decoy","text":"前因 · 2652：你独自北上，把追兵从小舞身边引开。"},"text":"星湖之后，武魂殿的悬赏令贴满两国分殿：白发，冰属性，鹿类兽武魂，年约二十，赏格一块魂骨。唐门立起来了，可唐三没有第六环，追兵太多，你决定把他们引往北方。\n\n你过了最后一座有分殿的小城，进了终年不化的冰封森林。追来的是寂灭小队，队长厉锋是八十六级的魂斗罗，镰刃上的血槽从没干过。他们的精神探子提着一盏灯走在最后，是苏夜。\n\n夜里，一只纸鹤落在你栖身的古树上。苏夜写：「明日正午，冰原东侧，我备了替身。信我一次。」","choices":[{"t":"跃下古树迎战寂灭小队","hint":"关键战：以冰对镰","need":{"战力":950},"chance":0.45,"win":{"text":"冰原是你的拟态之地。你撑过三轮镰刃遁入暴雪，厉锋只砍下一缕白发。","d":{"伤势":40,"名望":15,"rep":{"武魂殿":-15},"flags":["beat_jimie"],"trait":{"险":2}}},"lose":{"text":"镰刃切开冰甲。你在雪里倒下，最后听见有人说：活的，教皇要活的。","d":{"伤势":60,"ending":"e2"}}},{"t":"照苏夜的计划假死","hint":"赌他骗得过魂斗罗","need":{"魅力":35},"chance":0.7,"win":{"text":"冰原上传回消息：白鹿已死，尸骨落进冰缝。悬赏令一张张被撕了下来。","d":{"bonds":{"苏夜":15},"rep":{"武魂殿":-5},"flags":["fake_death"],"trait":{"险":-1,"群":1}}},"lose":{"text":"替身被厉锋识破，你带伤滚进冰河才逃出生天。苏夜替你挨了一顿鞭子。","d":{"伤势":45,"bonds":{"苏夜":8}}}},{"t":"趁夜继续往北逃","hint":"谁也不信","win":{"text":"你在雪原上逃了整整一冬。到开春，追兵终于散了，你也瘦得只剩一把骨头。","d":{"伤势":30,"trait":{"险":-1,"群":-1}}}}]},{"id":"n_dusk","title":"王的黄昏","year":2656,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M70","echo":{"flag":"blocked_strike","text":"前因 · 2651：你替唐三挡下那一击，他至今没有第六环。"},"text":"你回到星湖时，湖水是黑的。比比东亲自进了星斗，死亡蛛皇的毒冲着两位王配，一路烧进魂核。武魂殿退了，可是太迟了。\n\n二明躺在湖边，像一座塌下的山，看见你还咧嘴：「{name}，你回来啦，长高了。」大明的鳞片翻起，底下的肉是紫的：「顶多三天。我们商量好了，把环和骨都给小三，他还差一步就是封号斗罗。」唐三跪在他们中间，说他不要。\n\n你身体里的白鹿动了一下。很多年前大明说过：霜角白鹿的角，能解百毒。在真身里折下那对角化进湖中，毒也许能冻住。可那是你武魂的根，折了它，你再也化不回完整的白鹿；而这世上欠着的东西，会挪到别处去。","choices":[{"t":"守着他们走完三天","hint":"原著：双王献祭","win":{"text":"第三天清晨，一道天青、一道金褐的光落进唐三体内。整座森林伏地低鸣。","d":{"bonds":{"二明":10,"大明":10,"唐三":5},"rep":{"魂兽":15},"flags":["kings_sacrificed"],"trait":{"逆":-2,"忠":1},"ending":"e3"}}},{"t":"化出真身折下霜角","hint":"改写原著","canonChange":{"node":"M70","inertia":5,"desc":"大明二明存活，星斗不失主；唐三失去借双王献祭晋封号之路，终局推迟"},"win":{"text":"你把断角沉进湖心。整片星湖一息冻结，二明喘出了一口干净的气。","d":{"shift":15,"bonds":{"二明":20,"大明":20},"rep":{"魂兽":20},"flags":["horn_broken"],"trait":{"逆":3,"仁":2},"ending":"e4"}}}]}],"endings":[{"id":"e1","title":"结局·霜环","type":"祭","grade":2,"text":"你比小舞快了一步。人面魔蛛的毒螯刺穿冰甲时，你把手按在唐三心口，对身体里的白鹿说：去吧。白光升起，一道红环、一块冰蓝的右臂骨落进他体内。献祭者永世不得超生，可有一缕寒意留了下来：唐三握拳时，小舞靠在他肩上时，它会轻轻凉一下。二六五七年初雪，小舞穿着红嫁衣接住一片雪，那片雪很久都没有化。","afterlife":["小舞：活着走完此后每一年，从未变回兔子，也没有人需要复活她。","唐三：成神那天摊开手掌，说第六环里住着一个快了一步的朋友。","苏夜：离开武魂殿，在落霞镇开了间药铺，每年四月初八放一盏素白河灯。","星斗大森林：二明在霜泉谷捡了一整夜的霜，等它们一片片化掉。"],"worldline":"献祭者由柔骨兔换成霜角白鹿：小舞未死，唐三以霜环霜骨走完原著之路，复活小舞的执念从未出现。"},{"id":"e2","title":"结局·会走路的魂环","type":"死","grade":1,"text":"你又醒在白玉石室里。比比东告诉你，那个提灯的孩子还关在长老殿刑房。你说：「我愿意。放了他，往后不许再找他。」她轻声说，你们这些化了形的，怎么都学会了人最傻的那一套，但她答应了。仪式上胡列娜问你恨不恨她，你说不恨。白光过后，圣女多了一道十万年魂环和一块冰蓝头骨。武魂殿典籍只记了一行：环十万年，骨为头。他们把你记成了一笔收成。","afterlife":["胡列娜：嘉陵关上一人挡住三支军团，此后每年初雪都独自站在殿顶。","苏夜：被放出武魂城，在北方寒泉边搭了木屋，夜夜点着那盏冥月灯。","唐门：嘉陵关一战伤亡远重于原著，唐三从此再没提过星湖。","星斗大森林：二明封了霜泉谷，谁也不许再进去。"],"worldline":"霜角白鹿献祭武魂殿圣女：胡列娜得十万年魂环与冰蓝头骨，嘉陵关之战唐门伤亡更重。"},{"id":"e3","title":"结局·星斗新主","type":"王","grade":2,"text":"你没有折角。你化回白鹿贴着二明和大明，替他们压住烧进魂核的毒火，送他们走完最后三天。大明说：「森林交给你了。」两道光落进唐三体内，他成了封号斗罗。失主的森林引来各方猎团，第一支在你的霜天里走了七天七夜，出来时冻掉了脚趾。战后唐三带来两国约书：星湖千里，万年魂兽不得猎杀，化形者与人同律。小舞笑着说：「你待在这里，是王。」","afterlif
