2,"精神":2,"bonds":{"楼高":10},"flags":["back_yard"]}}}]},{"id":"ev_linzhao","title":"剑斗罗的铁臂","when":{"yearMin":2652,"yearMax":2655,"levelMin":0,"flag":"tang_side","notFlag":null},"w":4,"once":true,"text":"七宝琉璃宗的林照来了力堂，背一柄寒霜剑，眼圈发青。猎魂之夜，她师父剑斗罗断了一臂。「师父不肯要假手。我想求一只能握剑的铁臂，他若不戴，就当我自己的念想。」","choices":[{"t":"熬一个月打只铁臂","need":{"悟性":36},"chance":0.5,"win":{"text":"铁臂五指能屈能伸，握剑时簧片无声。后来听说剑斗罗没戴，却天天擦。","d":{"金魂币":500,"名望":12,"rep":{"宗门":10},"bonds":{"林照":12},"item":"七宝的谢礼","met":["qibao"]}},"lose":{"text":"第三根手指总扣不紧剑柄。林照说没关系，你还是把它熔了。","d":{"名望":-2,"bonds":{"林照":4},"met":["qibao"]}}},{"t":"劝她先问问剑斗罗","win":{"text":"一个月后她带来一句话：师父说，铁匠的手比剑客的嘴老实。","d":{"魅力":2,"bonds":{"林照":5},"met":["qibao"]}}}]},{"id":"ev_judouluo","title":"菊香石院","when":{"yearMin":2652,"yearMax":2654,"levelMin":0,"flag":"wuhun_side","notFlag":null},"w":5,"once":true,"text":"你被安置在教皇殿后山的石院，炉、砧、锤一样不缺，只缺一扇自己能开的门。第七天来了个锦袍绣满菊花的男人，香气浓得发腻。他把一具缴来的诸葛神弩搁在砧上：「冕下要这个，要比唐门的还好。」","choices":[{"t":"补上那两三分，交出真图","win":{"text":"你只用了九天。菊斗罗试射时，弩箭穿透三道石墙。石院的门从那天起不再上锁。","d":{"金魂币":800,"名望":8,"rep":{"武魂殿":15},"bonds":{"苏夜":3},"flags":["true_design"],"reveal":["月关"],"trait":{"忠":1,"仁":-1}}}},{"t":"交一份差一分的图","need":{"精神":32},"chance":0.6,"win":{"text":"造得出，用不久，三百箭后机括就松。菊斗罗摸了半天，没摸出那一分。","d":{"金魂币":400,"rep":{"武魂殿":5},"shift":2,"flags":["flawed_design"],"reveal":["月关"],"trait":{"逆":2}}},"lose":{"text":"菊斗罗只射了五十箭就笑了，一根指头点在你眉心。你在地上躺了三天。","d":{"伤势":55,"rep":{"武魂殿":-10},"reveal":["月关"]}}}]},{"id":"ev_father_blade","title":"半道回纹","when":{"yearMin":2648,"yearMax":2657,"levelMin":0,"flag":null,"notFlag":null},"w":2,"once":true,"text":"鬼市旧货摊上压着一把没开刃的长刀，刀脊一道回纹只敲了一半——你认得那个起手。三百把殿役刀，你爹打到最后一把时倒在了炉前。摊主说刀是从主殿废料堆里流出来的，开价一百五十金魂币。","choices":[{"t":"买下它，补完那道回纹","need":{"金魂币":150},"win":{"text":"你把刀回了炉，补完那道回纹，打成一把菜刀挂在灶台上。那一夜你睡得很沉。","d":{"金魂币":-150,"精神":3,"气运":3,"item":"补完回纹的刀","trait":{"群":1}}}},{"t":"不买，记下那道回纹","win":{"text":"你没碰它。往后你打的每一件东西，刀脊上都多了半道回纹，城里人一看便知。","d":{"精神":1,"名望":3}}}]}],"nodes":[{"id":"n_awaken","title":"觉醒·铁灰色的城","year":2637,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M03","text":"庚辛城的天是被烟熏灰的。一千多座炉在天亮前一齐拉起风箱，城北压着武魂殿主殿的金顶。三年前，你爹从那座殿里领回三百把长刀的殿役，第三十九天夜里趴在炉前，再没起来。\n\n觉醒堂里，你掌心浮出一座泥胎铁箍的小炉。执事看了一眼：「器武魂，熔炉，普通。下一个。」没人注意到炉口那一点淡青的火——除了门边一个胡子被火燎得卷曲的老头。他盯着你的手看了很久。\n\n散场时他拦住你娘：「我叫楼高。这孩子，明天寅时送到我后院拉风箱。」他没说收徒，只说拉风箱。","choices":[{"t":"寅时之前就去后院等着","hint":"楼高嘴上不说，心里会记下","win":{"text":"天没亮你就蹲在楼家后院。老头开门看见你，哼了一声，把风箱柄塞进你手里。","d":{"体魄":2,"bonds":{"楼高":5},"flags":["early_bird"],"trait":{"忠":1}}}},{"t":"带上爹留下的那柄锤","hint":"楼高认得这柄锤","win":{"text":"楼高接过锤，拇指摸过锤柄上的旧痕：「这锤，我认得。」他把它挂在了风箱旁。","d":{"悟性":1,"bonds":{"楼高":6},"item":"父亲的锤子","flags":["father_hammer"]}}},{"t":"先去主殿门口看那座金顶","hint":"把恨记下；主殿也会记住你","win":{"text":"你在金顶下站到天黑，把它的样子刻进心里。门口的武士多看了你两眼。","d":{"精神":2,"rep":{"武魂殿":-5},"flags":["grudge_dian"],"trait":{"逆":1}}}}]},{"id":"n_dianyi","title":"殿役","year":2645,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M40","text":"你十四岁这年，庚辛主殿换了殿主。红衣主教迈尔斯手指白净，到任第三天就在协会门口贴出告示：殿役翻倍，每炉每季交枪头二百、箭镞两千，逾期封炉。\n\n秋天，商队带来武魂城的消息：一支叫史莱克的野学院夺了大赛冠军，决赛后有人一锤砸向教皇殿。全城铁匠在酒馆里压着嗓子说那柄锤，楼高照旧开炉，一支殿役也没交。\n\n第二个月，主殿的武士站到了楼家门口。迈尔斯笑着说，楼会长年纪大了，可以让徒弟替他去主殿铸坊做工，炉子照开。思龙看着你，楼高没有回头。","choices":[{"t":"替师父去主殿铸坊做工","hint":"保住楼家的炉；师父会冷着你","win":{"text":"你跟着武士走进主殿侧门。身后，楼高把锤子往砧上一扔，三天没跟你说话。","d":{"金魂币":150,"rep":{"武魂殿":8},"bonds":{"楼高":-5},"flags":["dianyi"],"trait":{"群":1,"险":-1}}}},{"t":"陪师父顶回去，看炉被封","hint":"断了进项，你得自己找饭吃","win":{"text":"铁封条铆上炉口那天，楼高拍了拍你的后脑勺：「好小子。往后自己找饭吃。」","d":{"金魂币":-30,"rep":{"武魂殿":-8},"bonds":{"楼高":8,"思龙":5},"flags":["forge_sealed"],"trait":{"忠":1,"逆":1}}}},{"t":"去求迈尔斯宽限一季","hint":"赌一把迈尔斯的心情","need":{"魅力":25},"chance":0.35,"win":{"text":"迈尔斯打量你半晌，在告示上楼家那一行划了一道。「一季。」他记住了你的脸。","d":{"名望":6,"rep":{"武魂殿":3},"bonds":{"楼高":3},"flags":["forge_spared"]}},"lose":{"text":"迈尔斯连门都没让你进。第二天，楼家三座炉被铆上了铁封条。","d":{"名望":-2,"rep":{"武魂殿":-5},"flags":["forge_sealed"]}}}]},{"id":"n_night","title":"主殿之夜","year":2651,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M55","echo":{"flag":"suye_token","text":"前因 · 2648：苏夜在你砧子上留过一块月牙铁牌。"},"text":"二十岁这年冬天，唐门宗主唐三和七宝琉璃宗的宁荣荣进了铁匠协会。楼高看了三张图纸——孔雀翎、暴雨梨花针、佛怒唐莲——当夜答应入唐门。迈尔斯的快马明早出城，告楼高私通唐门。\n\n唐三只问主殿有多少人，然后递给你一具诸葛神弩：「你们铁匠熟地道，带路。」那一夜金顶烧成了火柱。你从排烟道钻进铸坊，看见思迪被反绑在铁柱上，铁水正顺着炭屑往他脚边爬。\n\n楼梯上走下来一个人，金纹黑袍烧掉半边，掌心一盏冷灯，怀里抱着主殿名册——庚辛城每一家替协会跑过腿的铺子都在上面。是苏夜。五道魂环在他脚下升起。「让开，」他轻声说，「或者跟我走。」","choices":[{"t":"端起神弩拦住苏夜","hint":"关键战：撑三回合，名册留下","need":{"战力":380},"chance":0.4,"win":{"text":"四十八箭封住楼梯口，你借烟道热浪绕到他身后。三回合后唐三赶到，苏夜丢下名册遁走。","d":{"名望":12,"rep":{"武魂殿":-15,"天斗":5},"bonds":{"唐三":10,"苏夜":-5},"item":"诸葛神弩","flags":["tang_side","list_kept"],"met":["wuhun"],"trait":{"险":1}}},"lose":{"text":"冷灯一晃，你又看见爹趴在炉前，手一松弩就落了地。醒来时，苏夜正拖着你在地火道里走。","d":{"伤势":35,"rep":{"武魂殿":5},"bonds":{"楼高":-5},"flags":["wuhun_side","captured"],"met":["wuhun"]}}},{"t":"冲进火里背出思迪","hint":"师兄活下来，名册会出城","win":{"text":"你背着思迪从铁水里蹚出来，鞋底烧穿了。回头时，苏夜和名册都已不见。","d":{"伤势":15,"名望":5,"bonds":{"思迪":15,"楼高":5},"flags":["tang_side","list_escaped"],"met":["wuhun"],"trait":{"仁":2}}}},{"t":"随苏夜从地火道离开","hint":"走到武魂殿那一边去","win":{"text":"你领他钻进地火道。出口外的荒坡上回头看，整座庚辛城都被映红了，你没看见师父。","d":{"rep":{"武魂殿":12},"bonds":{"苏夜":10,"楼高":-20,"思龙":-10},"flags":["wuhun_side","follow_suye"],"met":["wuhun"],"trait":{"忠":-2,"群":-1}}}}]},{"id":"n_fanti","title":"凡铁","year":2655,"cond":{"flag":"tang_side","notFlag":null,"levelMin":0},"canon":"M68","text":"武魂殿立国了。一条横贯东西的疆域把天斗和星罗切开，庚辛城往北每隔几十里就是一座新哨卡。泰坦把你派回庚辛开唐门分坊：「你是庚辛人，铁精也只有你的火化得开。」思迪管账，手上的烫疤结成了硬壳，打铁却比从前稳。\n\n秋天，戴澜来了。星罗庶出的七皇子，水云关外帝国的军旗一天比一天多。他要一千具诸葛神弩，一个月交货，价钱随你开。\n\n那天夜里你翻出爹留下的一块犁铧铁。楼高说过，用凡铁打出神器，才算神匠。你掌心的青火，第一次跳得这样急。","choices":[{"t":"闭炉七日，用犁铧铁打一把刀","hint":"可能觉醒神匠之火；单子会黄","need":{"悟性":34},"chance":0.55,"win":{"text":"第七天开炉，青火里透出一线金。犁铧铁成了一把刀，戴澜握着它，很久没说话。","d":{"悟性":10,"精神":4,"等级":1,"名望":10,"item":"犁铧刀","shift":3,"bonds":{"戴澜":5},"flags":["shenjiang_fire"],"met":["xingluo"],"trait":{"逆":1,"险":1}}},"lose":{"text":"第七天开炉，刀身裂成三截。戴澜没多说，去了别家。你在冷炉前坐到天亮。","d":{"悟性":2,"伤势":15,"金魂币":-100,"met":["xingluo"]}}},{"t":"一个月交出一千具神弩","hint":"水云关多守一年；也会多死很多人","win":{"text":"分坊三十座炉连轴转了一个月。戴澜点完数，留下一箱金魂币：「我的兄长们，也会死在这批弩下。」","d":{"金魂币":2000,"名望":12,"rep":{"星罗":10},"bonds":{"戴澜":10},"flags":["sold_dailan"],"met":["xingluo"],"trait":{"仁":-1}}}}]},{"id":"n_jianu","title":"嘉陵关的弩","year":2655,"cond":{"flag":"wuhun_side","notFlag":null,"levelMin":0},"canon":"M68","echo":{"flag":"captured","text":"前因 · 2651：你是被苏夜从地火道里拖出庚辛城的。"},"text":"武魂殿变成了武魂帝国。立国那天礼炮响了一个时辰，你砧上的铁屑都在跳。教皇殿后山那座石院早不锁了，门口换了牌子：帝国铸器监·首席。每月上百具仿制的唐门弩从你手里出去，送往每一座新插上帝国旗的城。他们待你很好，好得让你夜里睡不着。\n\n秋天你被派到嘉陵关。城墙高厚各百米，城头一百五十台守城巨弩，要你一台台改到能射穿一丈山岩。苏夜站在你身后，什么都没说。\n\n同一天，一个商队伙计塞给你一张油纸，是楼高的字，只有一句：「炉要开了。」","choices":[{"t":"在每台绞盘里留一道死扣","hint":"总有一天，能让它们一齐哑火","need":{"精神":32},"chance":0.65,"win":{"text":"一百五十道死扣，藏在绞盘最深的齿缝里。验收那天，菊斗罗亲手摸过每一台，没摸出来。","d":{"金魂币":500,"rep":{"武魂殿":5},"flags":["ballista_key"],"trait":{"逆":1,"仁":1}}},"lose":{"text":"改到第九十台时监工撞见你多敲了一锤。你挨了三十鞭，死扣全被拆掉。","d":{"伤势":40,"rep":{"武魂殿":-10},"flags":["ballista_true"]}}},{"t":"把巨弩造到极致","hint":"嘉陵关更难破；帝国视你为功臣","win":{"text":"改好的巨弩一箭穿透了靶后的山岩。帝国赏下一箱金魂币，苏夜替你斟了一杯酒。","d":{"金魂币":1500,"名望":10,"悟性":2,"rep":{"武魂殿":15},"bonds":{"苏夜":5},"flags":["ballista_true"],"trait":{"忠":1,"仁":-1}}}},{"t":"揣着师父的信连夜南逃","hint":"赶回去见师父；帝国会通缉你","need":{"体魄":30},"chance":0.7,"win":{"text":"你从排水渠爬出嘉陵关，一路向南。到天斗城南时鞋底磨穿，信还在怀里。","d":{"rep":{"武魂殿":-25},"bonds":{"楼高":10},"flags":["fled_south","tang_side"],"trait":{"群":2,"险":1}}},"lose":{"text":"追兵在山口截住你，一枪挑穿了肩。苏夜把你押回城头，再没提这件事。","d":{"伤势":45,"bonds":{"苏夜":3},"flags":["ballista_true"]}}}]},{"id":"n_xunqi","title":"殉器","year":2656,"cond":{"flag":"tang_side","notFlag":null,"levelMin":0},"canon":"M72","echo":{"flag":"shenjiang_fire","text":"前因 · 2655：你用一块犁铧铁，烧出了青里透金的火。"},"text":"炉要开了。你赶回天斗城南时，唐门前院的炉一座都没熄——要打仗了。唐三从海上回来，已是封号斗罗。\n\n后院里，楼高瘦成一根烧剩的炭条。炉台上摆着三样东西：孔雀翎、暴雨梨花针、三朵佛怒唐莲。铁是好铁，工是神工，可它们是冷的。「神器要一口气，」师父说，「一口人的气。」\n\n他脱下补过无数次的旧袍，叠好放在砧上。「你拉了十九年风箱，知道我为什么不让你碰锤？因为这一天，得有人替我拉风箱。这城里只有你的火有这个分寸。」\n\n炉火从橘红烧到发白。你知道凡人造神器要一条命，可你隐约觉得，未必是这一条。","choices":[{"t":"拉起风箱，送师父最后一程","hint":"原著：楼高殉器，三件神器出炉","win":{"text":"你拉了一夜。天亮时炉里只剩三样东西，指尖一碰便轻轻一颤，像是活的。炉壁上熔着一道人影。","d":{"悟性":3,"精神":3,"名望":10,"item":"孔雀翎","bonds":{"楼高":10,"泰坦":5},"flags":["lougao_dead"],"trait":{"逆":-2,"忠":1}}}},{"t":"以神匠之火替师父完成最后一锻","hint":"改写原著","need":{"悟性":46},"canonChange":{"node":"M72","inertia":4,"desc":"楼高未殉器：三件神器以神匠之火为魂，不再需要一条人命"},"win":{"text":"你把右手伸进白火里。青金之火灌进三样东西。醒来时师父蹲在旁边，胡子上全是泪，骂得比哪次都响。","d":{"名望":15,"item":"孔雀翎","shift":12,"bonds":{"楼高":20},"flags":["lougao_alive"],"trait":{"逆":3,"仁":1},"bone":{"slot":"右臂","name":"青金熔炉臂","desc":"右臂在神匠之火里重铸，骨中常燃一缕青金火","attrs":{"体魄":4,"精神":4}}}}},{"t":"推开师父，自己跳进炉口","hint":"改写原著·就此结局","canonChange":{"node":"M72","inertia":3,"desc":"殉器者换成楼高的第三个徒弟，楼高活到终局"},"win":{"text":"你一把推开师父，跳进了火里。那火是青的，是你自己的颜色。","d":{"shift":8,"bonds":{"楼高":30},"flags":["self_sacrifice"],"trait":{"仁":3,"逆":2},"ending":"e3"}}}]},{"id":"n_jialing","title":"火对火","year":2656,"cond":{"flag":"tang_side","notFlag":null,"levelMin":0},"canon":"M74","echo":{"flag":"lougao_alive","text":"前因 · 2656：师父没进炉。后营那五个魂斗罗，是冲着他来的。"},"text":"三个月后，你站在嘉陵关下。城墙像一道从天上垂下来的铁幕，城头一百五十台巨弩对着平原。唐门器械阵摆在关前三里，诸葛神弩、连弩车、投石架，一半出自你手。\n\n首战那天，一朵铁莲在圣龙军团阵中开了花，平原上空了一大片。当夜关上冲下一道火——帝国黄金一代的焱，火焰领主，带人来烧器械阵。同一时刻，后营亮起了五道魂斗罗的魂环，那里有力堂的图纸、火药，和不能打仗的人。\n\n林照的剑在侧翼亮了一下，纪无声的影子贴在雪崩的大帐边。火已舔上第一排弩车，你只能去一个地方。","choices":[{"t":"打开孔雀翎，迎上焱的火","hint":"关键战：撑到武堂赶来","need":{"战力":600},"chance":0.4,"win":{"text":"三百六十五根针分十二路开屏，焱的火被钉散三次。武堂赶到时，他捂着肩退回关上。","d":{"名望":15,"rep":{"天斗":8,"武魂殿":-10},"bonds":{"林照":5},"flags":["beat_yan"],"met":["qibao","huangshi"],"trait":{"险":1}}},"lose":{"text":"你的火压不住他的火。孔雀翎只开了一半，你被烧得滚下土坡，林照把你拖了回来。","d":{"伤势":50,"bonds":{"林照":5},"met":["qibao","huangshi"]}}},{"t":"握紧暴雨梨花针守后营","hint":"关键战：五个魂斗罗，撑三回合","need":{"战力":700},"chance":0.35,"win":{"text":"四十九枚银钉一次打完。五个魂斗罗被钉在后营门口，泰坦赶到时，你还挡在帐前。","d":{"名望":20,"rep":{"天斗":5},"bonds":{"泰坦":10,"楼高":10},"flags":["held_camp"],"met":["qibao","huangshi"],"trait":{"群":2}}},"lose":{"text":"银钉打空时对面还剩三人。一掌扫中你胸口，后营烧了一角，泰坦把你从火里刨了出来。","d":{"伤势":65,"flags":["camp_burned"],"met":["qibao","huangshi"]}}},{"t":"带人把器械拖出火场","hint":"能救一台是一台","win":{"text":"你带着力堂的人冲进火里拖车。天亮时清点，器械阵还剩七成，明日少死一些人。","d":{"金魂币":300,"名望":5,"rep":{"天斗":5},"bonds":{"林照":3},"flags":["saved_engines"],"met":["qibao","huangshi"],"trait":{"仁":1,"险":-1}}}}]},{"id":"n_chengtou_key","title":"城头·死扣","year":2656,"cond":{"flag":"ballista_key","notFlag":"tang_side","levelMin":0},"canon":"M75","echo":{"flag":"ballista_key","text":"前因 · 2655：你在一百五十台绞盘里各留了一道死扣。"},"text":"师父的死讯是苏夜带来的。他从武魂城回来，在城头站了很久才开口：「楼高进了炉子，炉里出来三件东西。」你手里的锤掉在了地上。那张写着「炉要开了」的油纸，你揣到边角都磨破了。你没有回去。\n\n三个月后，唐门和天斗的大军压到关下。首战，一朵铁莲在圣龙军团里开了花。当夜，城下摸上来一队力之一族——泰坦之子泰诺打头，思龙跟在他身后，拎着铁钳，是来毁弩的。\n\n明日拂晓就是总攻。一百五十台巨弩的绞盘里，各藏着一道只有你知道的死扣。","choices":[{"t":"守住你的弩，迎战泰诺","hint":"关键战：胜则守住城头","need":{"战力":560},"chance":0.45,"win":{"text":"你知道哪段城砖底下是空的。泰诺被三支巨弩箭逼下城墙，思龙的铁钳被青火熔断了半截。「走吧，师兄。」","d":{"名望":20,"rep":{"武魂殿":20},"bonds":{"思龙":-20},"trait":{"忠":1,"群":-2},"ending":"e4"}},"lose":{"text":"泰诺一拳砸碎你脚下的城砖。醒来时你手脚都上了铁链，思龙坐在旁边，一夜没合眼。","d":{"伤势":55,"bonds":{"思龙":5},"flags":["captured_jialing"]}}},{"t":"拔掉死扣，让巨弩一齐哑火","hint":"改写原著","canonChange":{"node":"M75","inertia":3,"desc":"嘉陵关巨弩一夜哑火，雪崩违令强攻的十万伤亡大减"},"win":{"text":"你沿着城头一台台拔过去。拂晓总攻时，一百五十台巨弩一声没响，关下少死了好几万人。","d":{"名望":10,"shift":10,"rep":{"武魂殿":-30,"天斗":10},"bonds":{"思龙":10},"flags":["ballista_silenced"],"trait":{"逆":2,"仁":2,"忠":-2}}}},{"t":"放下锤子，跟思龙走下城头","hint":"你的弩会被毁；帝国当你是叛徒","win":{"text":"你扔下锤。思龙什么也没说，伸手把你从垛口拉下来。身后，泰诺开始砸第一台弩。","d":{"rep":{"武魂殿":-20},"bonds":{"思龙":10},"flags":["surrendered"],"trait":{"群":1}}}}]},{"id":"n_chengtou","title":"城头","year":2656,"cond":{"flag":"ballista_true","notFlag":"tang_side","levelMin":0},"canon":"M75","text":"师父的死讯是苏夜带来的。他从武魂城回来，在城头站了很久才开口：「楼高进了炉子，炉里出来三件东西。」你手里的锤掉在了地上。那张写着「炉要开了」的油纸，你揣到边角都磨破了。你没有回去。\n\n三个月后，唐门和天斗的大军压到关下。首战，一朵铁莲在圣龙军团里开了花。当夜，城下摸上来一队力之一族——泰坦之子泰诺打头，思龙跟在他身后，拎着铁钳，是来毁弩的。\n\n明日拂晓就是总攻。这段城墙一百五十台巨弩，每一台都被你造到了极致，每一台都听你的。","choices":[{"t":"守住你的弩，迎战泰诺","hint":"关键战：胜则守住城头","need":{"战力":560},"chance":0.45,"win":{"text":"你知道哪段城砖底下是空的。泰诺被三支巨弩箭逼下城墙，思龙的铁钳被青火熔断了半截。「走吧，师兄。」","d":{"名望":20,"rep":{"武魂殿":20},"bonds":{"思龙":-20},"trait":{"忠":1,"群":-2},"ending":"e4"}},"lose":{"text":"泰诺一拳砸碎你脚下的城砖。醒来时你手脚都上了铁链，思龙坐在旁边，一夜没合眼。","d":{"伤势":55,"bonds":{"思龙":5},"flags":["captured_jialing"]}}},{"t":"放下锤子，跟思龙走下城头","hint":"你的弩会被毁；帝国当你是叛徒","win":{"text":"你扔下锤。思龙什么也没说，伸手把你从垛口拉下来。身后，泰诺开始砸第一台弩。","d":{"rep":{"武魂殿":-20},"bonds":{"思龙":10},"flags":["surrendered"],"trait":{"群":1}}}}]},{"id":"n_xilu","title":"熄炉","year":2657,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M85","echo":{"flag":"lougao_alive","text":"前因 · 2656：师父没进炉。今夜拉风箱的，是他。"},"text":"仗打完了。嘉陵关破在一场毒雾里，之后的仗打到了天上，有金色的翅膀，有比夜还黑的镰刀，有人死了又活过来。斗罗历二六五七年冬，武魂帝国没有了。\n\n唐三召集议事堂，说了三件事：唐家军解散；唐门从此只做宗门，不做军械；所有暗器连同图纸，一并销毁。他看着你：「不管你替谁打过铁，你是楼高的徒弟。你来烧。」\n\n力堂后院的炉又点着了。铁匣里是孔雀翎、暴雨梨花针、最后一朵唐莲，和力堂这些年的几百张图纸；墙外是七千多具诸葛神弩。你爹的锤子靠在砧边，枣木柄是空心的。","choices":[{"t":"把一切一件件投进炉里","hint":"唐门暗器真正绝迹","win":{"text":"纸在青火里卷起来，三样东西在火里叹了一口气。七千具神弩，你烧了四十天。","d":{"名望":10,"shift":2,"flags":["all_destroyed"],"trait":{"仁":2},"ending":"e1"}}},{"t":"截下一张图纸，封进锤柄","hint":"改写原著","canonChange":{"node":"M85","inertia":3,"desc":"终局暗器销毁并不彻底：一份孔雀翎图纸流传后世"},"win":{"text":"你把孔雀翎的图纸折成一指宽，裹七层油布塞进锤柄，用一枚冷锻铁楔封死。","d":{"shift":6,"item":"锤柄里的孔雀翎图纸","flags":["kept_blueprint"],"trait":{"逆":2,"险":1},"ending":"e2"}}}]}],"endings":[{"id":"e1","title":"结局·凡铁","type":"匠","grade":3,"text":"最后一朵唐莲在火里开到最大，然后塌了下去。第四十一天，你没有倒掉铁水，把它们浇成一千副犁铧，送往嘉陵关外被血泡过的荒地。\n\n你回了庚辛城，只砌一座炉，门口挂块木牌：修锅，打犁，磨刀，不接兵器。思龙捧来一块刻着「神匠」的铁牌，你挂在后墙，低到要弯腰才看得见。有人问你和楼高谁才是神匠，你说：「师父用凡铁打出神器，我把神器打回凡铁。我们俩加起来，才算一个。」","afterlife":["楼高：三件神器入炉那夜，庚辛城的老铁匠都朝天斗方向磕了头。","思龙：接任铁匠协会会长，每年开春都来你铺子里借一缕青火。","唐三：唐门从此不造军械，议事堂的名册上，你的名字从力堂挪进了客卿。","铁匠协会：殿役成了老人嘴里的旧话，孩子觉醒时，再没人等在父亲的炉前。"],"worldline":"唐门暗器连同图纸尽数销毁，熔成千副犁铧送往嘉陵关外；庚辛城多了一位不造杀器的神匠。"},{"id":"e2","title":"结局·锤柄里的孔雀","type":"暗","grade":2,"text":"世上的人都说，唐门的暗器没有了。你回庚辛城开了间小铺，不接兵器，爹的锤子挂在后墙，从不用，也不让人碰。\n\n第十一年秋天，一个两鬓斑白的人在铺里坐了半天，留下一袋金魂币和一张画着白虎的纸条。你把钱分给城南，纸条扔进了炉。\n\n你老了，收了个武魂是铁剪的孤儿。临终前你指着那柄锤：「哪天世道又要吃人，就打开它；哪天你想拿它去吃人，就扔进炉里。分不清，就别打开。」","afterlife":["楼高：至死不知道那张图纸还在世上；或者他知道，只是没说。","唐三：他一直相信暗器已经绝迹，神界的史册上也是这么记的。","星罗：十年之约到期那年，有人带着白虎纸条来过庚辛城，空手而回。","铁匠协会：老铁匠们压低声音说，三件神器也许没有全烧。"],"worldline":"暗器并未绝迹：一份孔雀翎图纸藏在庚辛城一柄旧锤里，世界线留下了一道暗门。"},{"id":"e3","title":"结局·炉中青焰","type":"殉","grade":3,"text":"那火是青的，是你自己的颜色。熔炉从掌心脱出，你这二十五年攒下的每一锤，都泼进了孔雀翎、暴雨梨花针和三朵唐莲里。\n\n后来你在嘉陵关的唐莲里感觉到一千个人的死，也在孔雀翎开屏时救下一个不认识的少年兵。神器没有眼睛。\n\n终局那年冬天，瘸了腿的师父亲手把三件东西放回炉里：「老三，出来吧。」你变回一小团青火，被他封在庚辛城地火井口。从此城里的铁匠开炉前，都先来借一缕火种。","afterlife":["楼高：又活了九年，收的徒弟比前半辈子加起来还多，教的第一件事是拉风箱。","思龙：接任协会会长，在地火井口立了一块无字的铁牌。","唐三：终局销毁暗器时，他把三件神器交给楼高亲手处置，没有过问。","庚辛城：地火井口那点青火燃了很多年，没有人让它熄。"],"worldline":"殉器的不是楼高而是你；楼高活到终局亲手毁器，庚辛城地火井上从此燃着一点不灭的青火。"},{"id":"e4","title":"结局·城头巨弩","type":"死","grade":1,"text":"拂晓总攻，你抬手，落下，一百五十台巨弩同时长啸。那一天关下死了十几万人，比任何人预料的都多。焱把一坛酒浇在你头上，说你是帝国的英雄。那夜你洗了七遍手。\n\n大半年后，毒雾漫上城头，城门被撞开。唐门的人登城后第一件事，是调转巨弩。第七十三台的弩口慢慢转向你，箭镞上一道极细的青线，是你亲手淬的。你没有跑。原来你打的东西，有时也会转回来，找到你。","afterlife":["苏夜：从城头捡起你的锤，擦净血迹揣进怀里，随撤退的人群往西去了。","思龙：在协会门口的石狮下埋了一块没刻字的铁牌，说那是他的师弟。","武魂帝国：覆灭那年冬天，城头一百五十台巨弩被熔成了一座铁山。","嘉陵关：史官记下了伤亡和雪崩的强攻，没有人记那批巨弩是谁改的。"],"worldline":"你改造的巨弩让嘉陵关总攻伤亡远超原著；关破之日，你死在自己淬过的弩箭之下，名字不入史册。"}],"summary":"锻造线，成长靠接单、考级、鉴宝、改弩换金魂币与名望。2645殿役分叉（苏夜/纪无声）；2651主殿之夜拦苏夜定阵营。唐门线：凡铁（神匠之火/卖弩戴澜）→殉器（原著/代殉/投炉E3）→嘉陵关战焱或守后营。武魂线：改巨弩→城头战泰诺胜E4，或拔死扣。熄炉：全烧E1，截图纸→E2。"}]</script>

:{"精神":1}},"note":"按：唐昊隐姓埋名做铁匠，因十五年前那一战失去了妻子阿银。"},{"t":"赶紧离开","win":{"text":"你快步出了酒馆，心一路怦怦直跳，再没敢回头，也再没进过那家酒馆。","d":{"trait":{"险":-1}}}}]},{"id":"c_nuoding_duel","title":"练功场之争","when":{"yearMin":2637,"yearMax":2639,"levelMin":5,"flag":null,"notFlag":null},"w":2,"once":true,"text":"诺丁学院的贵族学员萧尘宇带人堵住了工读生，要他们让出练功场。领头的工读生是个蓝银草少年，袖口里似乎藏着什么东西。萧尘宇瞥见你，冷笑着要你选边站。","choices":[{"t":"站到工读生一边","need":{"战力":60},"chance":0.55,"win":{"text":"蓝银草缠住对方双腿，你补上一拳，萧尘宇灰头土脸地走了。那少年冲你笑了笑。","d":{"名望":2,"bonds":{"唐三":8,"小舞":5},"trait":{"仁":1,"群":1}}},"lose":{"text":"你被萧尘宇的狼爪划破了肩膀，正要倒下时，那个蓝银草少年替你挡下了第二击。","d":{"伤势":15,"bonds":{"唐三":5}}},"note":"按：唐三入学不久便击败萧尘宇，成了七舍真正的老大。"},{"t":"站到萧尘宇一边","win":{"text":"萧尘宇随手赏了你三十金魂币。从那天起，工读生们看你的眼神就彻底冷了下来。","d":{"金魂币":30,"bonds":{"唐三":-8,"小舞":-6},"trait":{"仁":-1}}}},{"t":"两不相帮，转身走开","win":{"text":"身后传来一阵喧哗，你没有回头。后来听说，那天是工读生们赢了。","d":{"trait":{"险":-1}}}}]},{"id":"c_subsidy","title":"领补贴的长队","when":{"yearMin":2637,"yearMax":2650,"levelMin":10,"flag":null,"notFlag":null},"w":2,"once":false,"text":"武魂殿分殿门口排着长队，注册魂师每月可领一枚金魂币的补贴。轮到你时，执事翻着名册压低声音说：若肯在殿里挂个虚职，补贴还能翻上一倍。","choices":[{"t":"只领该领的那份","win":{"text":"你把金魂币揣进怀里，执事耸耸肩，在名册上勾了一笔，扯着嗓子喊了下一个。","d":{"金魂币":20}}},{"t":"挂个虚职","win":{"text":"名册上多了你的名字。每月多领一份钱，也多了一份随时可能落到头上的殿里差遣。","d":{"金魂币":60,"rep":{"武魂殿":4},"flags":["wuhun_post"],"trait":{"逆":-1}}}},{"t":"不领，不欠这份人情","win":{"text":"执事诧异地看了你一眼，没说什么，只在名册上你的名字旁边画了个小小的记号。","d":{"rep":{"武魂殿":-2},"trait":{"逆":1,"群":-1}}},"note":"按：武魂殿代发帝国补贴，七成以上魂师因此与它关系密切。"}]},{"id":"c_hunt_permit","title":"猎魂森林的担保","when":{"yearMin":2637,"yearMax":2648,"levelMin":9,"flag":null,"notFlag":null},"w":2,"once":true,"text":"猎魂森林由国家圈养魂兽，进入须持武魂殿手令，外加三名贵族担保。林外一个落魄贵族在兜售担保名额，开价八十金魂币，拍着胸脯说童叟无欺。","choices":[{"t":"付钱进林","need":{"金魂币":80},"win":{"text":"林中魂兽年限齐整，你在里面练了一整天手，对各类魂兽的习性心里总算有了底。","d":{"金魂币":-80,"体魄":2,"悟性":1}}},{"t":"跟他砍价","need":{"魅力":25},"chance":0.5,"win":{"text":"一番软磨硬泡，他四十金就松了口，临了还多送你一张手绘的林区草图。","d":{"金魂币":-40,"体魄":2}},"lose":{"text":"他嫌你寒酸，转头把名额卖给了别人，还当着众人的面骂了你两句穷鬼。","d":{"名望":-1}}},{"t":"向武魂殿告发他" <script type="application/json" id="d-treas">{"treasures":[{"id":"t_c_mantuoluo","name":"曼陀罗蛇","tier":"良","place":"猎魂森林·诺丁城郊","yearMin":2637,"yearMax":2638,"canon":"M06","owner":"唐三（第一魂环）","rumor":"猎魂森林边的猎户说，最近林子里有条紫黑花纹的大蛇，咬伤了好几个魂师，伤口三天就发黑。","memory":"原著中，大师带唐三入猎魂森林，唐三以蓝银草缠住近四百年的曼陀罗蛇，吸收为第一魂环，大师也被蛇毒所伤。","text":"林间腥甜的气味越来越浓。你拨开灌木，看见一条水桶粗的花蛇盘在倒木上，鳞片紫黑相间，信子一吐就带出淡淡的绿雾。不远处的草丛里，一个灰衣中年人正领着一个瘦小男孩悄悄靠近，男孩手里握着一株不起眼的蓝银草。\n你认得那张脸。按记忆里的顺序，再过一刻钟，这条蛇就会成为唐三的第一魂环。","choices":[{"t":"抢先出手斩蛇夺环","need":{"战力":149},"win":{"text":"你抢在蓝银草缠上去之前一刀斩下蛇头，近四百年的黄环落进你体内，蛇毒随魂力一起在经脉里流转。","d":{"ring":{"beast":"曼陀罗蛇","years":390,"kind":"控","skill":"曼陀罗缠毒","desc":"缠绕目标并注入麻痹蛇毒，越挣扎毒发越快"},"精神":3,"气运":2,"trait":{"逆":1},"shift":3,"world":{"offset":{"唐三":-1},"news":{"M06":"猎魂森林的曼陀罗蛇被一名孩童抢先斩杀，唐三的第一环另觅他兽"},"note":"唐三第一环换成无毒的百年魂兽，蓝银草失去了剧毒"}}},"battle":{"n":"曼陀罗蛇","years":390},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"替大师挡下蛇毒","need":{"体魄":25},"win":{"text":"毒牙擦过你的手臂，大师的罗三炮趁机扑上去。你毒发昏了一夜，醒来时大师正在给你敷药。","d":{"伤势":20,"体魄":3,"悟性":3,"bonds":{"大师":15,"唐三":8},"trait":{"仁":1}}}},{"t":"躲在树后看唐三吸环","need":{"精神":20},"win":{"text":"你屏住呼吸看完全程，蓝银草缠蛇的手法、男孩眼里不属于孩子的冷静，你都一一记下。","d":{"悟性":4,"精神":2,"flags":["saw_tangsan_ring1"]}}},{"t":"转身离开","win":{"text":"你悄悄退出林子。身后传来蛇的嘶鸣和孩子的呼喝声，那是别人的故事。","d":{}}}],"minLevel":8},{"id":"t_c_guiteng","name":"鬼藤","tier":"良","place":"猎魂森林·深处老林","yearMin":2639,"yearMax":2642,"canon":"M09","owner":"唐三（第二魂环）","rumor":"猎魂森林深处有一片终年不见光的老林子，藤蔓会自己挪地方，进去的猎户常说背后有东西在扯衣角。","memory":"原著中，唐三在诺丁的几年里吸收鬼藤为第二魂环，得到寄生之技，蓝银草从此能在敌人身上扎根吸取魂力。","text":"老林里静得出奇，你脚边的枯叶忽然自己翻了个面。一根暗褐色的藤蔓从腐木里探出来，表皮布满鬼脸似的疤结，悄无声息地缠上你的脚踝。你挥刀斩断，断口立刻又生出三根新须。\n这是一株七百多年的鬼藤。记忆里它本该在一两年后被唐三找到，成为他蓝银草上那道会扎根的黄环。","choices":[{"t":"斩断主根夺环","need":{"战力":214},"win":{"text":"你顺着藤蔓找到地下的主根，一刀断之。黄色魂环升起时，你感到它在体内悄悄扎下了根。","d":{"ring":{"beast":"鬼藤","years":720,"kind":"控","skill":"鬼藤寄生","desc":"藤须扎入敌人体内吸取魂力，越缠越牢"},"精神":4,"体魄":2,"trait":{"逆":1},"shift":3,"world":{"offset":{"唐三":-1},"news":{"M09":"诺丁城外的鬼藤被人抢先猎杀，唐三的第二环另寻他物"},"note":"唐三少了寄生之技，蓝银草的缠控大打折扣"}}},"battle":{"n":"鬼藤","years":720},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"只取藤心入药","need":{"悟性":30},"win":{"text":"你剖开主藤取出一截墨绿的藤心，留下根须让它慢慢再生。藤心入药，筋骨里多了一股韧劲。","d":{"体魄":4,"悟性":2,"item":"鬼藤藤心"}}},{"t":"撒药粉困住它","chance":0.5,"win":{"text":"药粉让藤蔓缩成一团，你从容剪下几截藤须，拿到城里卖了个好价钱。","d":{"金魂币":120,"气运":1}},"lose":{"text":"藤蔓挣开药粉反卷过来，你被勒得浑身青紫才逃出林子。","d":{"伤势":20}}},{"t":"转身离开","win":{"text":"你退回林外的阳光里。那片老林静静地合拢，像在等另一个人。","d":{}}}],"minLevel":18},{"id":"t_c_banjing","name":"板晶里的发金","tier":"良","place":"索托城·魂导器小铺","yearMin":2642,"yearMax":2643,"canon":"M10","owner":"唐三（制成龙须针）","rumor":"索托城一家魂导器小铺的角落里堆着几块灰扑扑的板晶，老板说是压箱底的废料，便宜卖。","memory":"原著中，唐三在索托城的魂导器店里从板晶中认出发金，用它做成能破罡气的龙须针，史莱克第四关全靠它撑场。","text":"铺子门脸不大，柜台后的胖老板眯着眼在打盹。你在角落的废料堆里翻出一块巴掌大的灰色板晶，对着光一照，里面隐约有一缕比发丝还细的金线在流动。\n门口传来脚步声，一个背着包袱的少年和一个扎蝎子辫的女孩走了进来，少年的目光直接落在废料堆上。你握着板晶，掌心微微发烫。","choices":[{"t":"抢先付钱买下","need":{"金魂币":80},"win":{"text":"你把金魂币拍在柜台上，老板睁开一只眼看了你一会儿，收了钱。少年在门口愣了片刻，转身去看别的货了。","d":{"金魂币":-80,"item":"板晶发金","悟性":3,"气运":2,"trait":{"逆":1},"shift":3,"world":{"offset":{"唐三":-1},"news":{"M10":"索托城的板晶发金被人先一步买走，唐三没能做成龙须针"},"note":"唐三没有龙须针，史莱克第四关打得极其艰难"}}}},{"t":"识破老板的身份","need":{"精神":30},"win":{"text":"你盯着那双眯着的眼睛：「弗兰德院长，这铺子也是史莱克的？」胖老板的镜片闪了一下，笑出了声。","d":{"bonds":{"弗兰德":15},"名望":3,"flags":["know_flender"]}}},{"t":"提议和少年平分发金","need":{"魅力":25},"win":{"text":"少年想了想就点头了，他只要一半就够做一盒针。剩下的你打了一柄薄刃，两人从此算是认识了。","d":{"item":"半截发金","悟性":2,"bonds":{"唐三":15,"小舞":5},"trait":{"群":1}}}},{"t":"转身离开","win":{"text":"你把板晶放回废料堆，拍拍手上的灰，走出了铺子。","d":{}}}],"minLevel":15},{"id":"t_c_fengwei","name":"千年凤尾鸡冠蛇","tier":"珍","place":"星斗大森林·外围南麓","yearMin":2642,"yearMax":2643,"canon":"M14","owner":"奥斯卡（第三魂环）","rumor":"星斗外围有人看见一条头顶红冠、尾羽如凤的大蛇，几支猎魂队为了它差点打起来。","memory":"原著中，史莱克七怪在星斗外围与盖世龙蛇孟家争夺千年凤尾鸡冠蛇，最终由奥斯卡吸收为第三魂环，得到能飞的蘑菇肠。","text":"林间空地上，一条两丈长的大蛇正昂首吐信，头顶血红的肉冠像一团火，尾端散开七彩翎羽。空地两头各站着一队人：一边是七个半大少年，一个香肠嘴的少年正搓着手说这环归他；另一边是一对拄蛇杖的老人和一个冷着脸的少女。\n两边都还没动手，蛇已经察觉到了你的气息，翎羽齐齐竖了起来。","choices":[{"t":"抢在两队前斩蛇夺环","need":{"战力":299},"win":{"text":"你从侧面掠入，一击打断蛇的七寸。千年紫环落在你身上，翎羽般的魂力让你身子一轻，两队人面面相觑。","d":{"ring":{"beast":"凤尾鸡冠蛇","years":1300,"kind":"敏","skill":"凤翎掠空","desc":"短时生出翎翼滑翔，高空俯冲时附带灼烧"},"体魄":3,"气运":3,"名望":4,"trait":{"逆":1},"shift":6,"world":{"offset":{"奥斯卡":-3},"news":{"M14":"千年凤尾鸡冠蛇被外人抢走，奥斯卡没有得到飞行香肠"},"note":"奥斯卡少了蘑菇肠，日后营救与高空支援全都落空"}}},"battle":{"n":"凤尾鸡冠蛇","years":1300},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"帮史莱克压住孟家","need":{"战力":299},"win":{"text":"你挡在孟家老人面前，替七怪争到了出手的时间。奥斯卡吸完魂环，冲你连作了三个揖。","d":{"bonds":{"奥斯卡":20,"戴沐白":10,"唐三":8},"名望":3,"trait":{"群":1}}},"battle":{"n":"凤尾鸡冠蛇","years":1300},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"混战中捡一片凤翎","chance":0.5,"win":{"text":"混战里一片凤翎飘到你脚边。你捡起来，羽根里还存着一丝火性，握在掌心暖洋洋的。","d":{"精神":3,"气运":2,"item":"凤尾翎"}},"lose":{"text":"你刚弯下腰，蛇尾就横扫过来，把你抽进了灌木丛。","d":{"伤势":15}}},{"t":"转身离开","win":{"text":"你绕开空地往林子深处走，身后很快响起了打斗声。","d":{}}}],"minLevel":28},{"id":"t_c_bazhumao","name":"人面魔蛛与八蛛矛","tier":"绝","place":"星斗大森林·外围东林","yearMin":2642,"yearMax":2643,"canon":"M16","owner":"唐三（第三魂环、外附魂骨八蛛矛）","rumor":"星斗外围有一片林子挂满了灰白的蛛网，网上粘着的鸟兽都被吸成了空壳，连猎魂队都绕着走。","memory":"原著中，唐三越限吸收约两千年的人面魔蛛为第三魂环，意外得到外附魂骨八蛛矛。这是他一生战力的根基，后来进化为海神八翼。","text":"蛛网从树冠一直垂到地面，网丝上挂着露珠似的毒液。网心伏着一只磨盘大的蜘蛛，背甲上的纹路像一张扭曲的人脸，八条长腿末端泛着青黑色的光。你知道，再过不久，那个蓝银草少年就会在这里冒着爆体的风险吸收它，背后长出八根蛛矛。\n蜘蛛缓缓转过那张人脸，看向了你。","choices":[{"t":"斩杀魔蛛，夺环夺骨","hint":"改写原著 · 达到标示战力后可挑战，获胜才能取得奖励","need":{"战力":380},"canonChange":{"node":"M16","inertia":5,"desc":"人面魔蛛与八蛛矛被抢，唐三失去外附魂骨"},"win":{"text":"你斩断它最后一条腿，紫环和一截骨刺同时飞起。越限的魂力几乎撑裂经脉，你咬牙扛住，背后刺出八根森冷的蛛矛。","d":{"ring":{"beast":"人面魔蛛","years":2000,"kind":"控","skill":"蛛网束缚","desc":"喷出坚韧蛛网缚住目标，附带麻痹剧毒","noBone":true},"bone":{"slot":"外附","name":"八蛛矛","desc":"背生八根蛛矛，剧毒锋利，可刺穿护体魂力并吞噬敌人精血","attrs":{"体魄":6,"精神":4},"years":2000},"等级":2,"体魄":6,"flags":["overlimit","bazhumao"],"trait":{"逆":2,"险":1},"shift":15,"world":{"offset":{"唐三":-5},"news":{"M16":"星斗外围的人面魔蛛被人抢先斩杀，八蛛矛落入他人之手"},"note":"唐三没有八蛛矛，吞噬之能与后来的海神八翼都成了泡影"}}},"battle":{"n":"人面魔蛛","years":2000}},{"t":"替唐三护法守夜","need":{"战力":380},"win":{"text":"你在林外守了一夜，挡下三只闻腥而来的魂兽。天亮时少年走出林子，背后八根蛛矛一闪即收，冲你郑重点头。","d":{"bonds":{"唐三":20,"小舞":8},"名望":3,"体魄":3,"trait":{"群":1}}},"battle":{"n":"人面魔蛛","years":2000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"收集网上的魔蛛毒液","need":{"精神":30},"win":{"text":"你用玉瓶收了满满一瓶毒液，蜘蛛似乎懒得理你。这毒拿来淬暗器，见血封喉。","d":{"item":"魔蛛毒液","精神":3,"悟性":2}}},{"t":"转身离开","win":{"text":"你和那张人脸对视了片刻，慢慢退出了蛛网的范围。","d":{}}}],"minLevel":25},{"id":"t_c_bingcao","name":"冰火两仪眼","tier":"神","place":"落日森林·冰火两仪眼","yearMin":2641,"yearMax":2644,"canon":"M24","owner":"唐三与史莱克七怪（独孤博的药园）","rumor":"落日森林深处有一处终年白雾的山谷，雾气一半冰冷一半灼人，谷外常有毒死的魂兽，据说是一位封号斗罗的私园。","memory":"原著中，独孤博以解毒为条件带唐三进冰火两仪眼。唐三服八角玄冰草与烈火杏娇疏后入阴阳泉，水火不侵；又把园中仙草分给七怪：奇茸通天菊给戴沐白、绮罗郁金香给宁荣荣、鸡冠凤凰葵给马红俊、水仙玉肌骨给朱竹清、相思断肠红认了小舞、望穿秋水露与九品紫芝给自己和大师。一处药园，成就了整支史莱克七怪。","text":"白雾散开，谷底是一眼一半结霜、一半翻着赤泡的泉，两色泉水绞成太极。泉边一冷一热两株仙草：八角玄冰草与烈火杏娇疏。再往外，石缝里是金黄的奇茸通天菊，黑石上一朵血红的相思断肠红，南侧绮罗郁金香与八瓣仙兰并蒂而生，东边火岩上开着鸡冠凤凰葵，阴泉边还有水仙玉肌骨、九品紫芝……\n这是独孤博的私园，也是原著里史莱克七怪一半的机缘。毒阵还没发作，你只有一个时辰。\n\n这里考验的是抵御寒热的体魄与辨识药性的精神。采药无需决斗；仙草收入行囊后可逐株炼化。","choices":[{"t":"冰火同修：两草＋阴阳泉","hint":"体魄抵御寒热，精神调和两草；不进行战斗","need":{"体魄":40,"精神":40},"canonChange":{"node":"M24","inertia":5,"desc":"冰火两仪眼两草被抢，唐三不再水火不侵"},"win":{"text":"金属割冰草，玄玉手挖杏娇疏，十息之内两草入口。冰与火在体内撞成一团，你一头扎进阴阳泉，在极寒极热里煎了七天。爬出来时经脉通透、水火不侵，连身上的魂环都被泉水淬得更加凝实。临走前你还灌满了两只温玉瓶。","d":{"等级":1.5,"体魄":6,"精神":6,"cap":{"体魄":15,"精神":10},"flags":["shuihuo","overlimit"],"item":["阳泉水·温玉瓶","阴泉水·温玉瓶"],"trait":{"逆":2,"险":1},"shift":18,"world":{"offset":{"唐三":-4,"独孤博":-2},"news":{"M24":"冰火两仪眼的两株仙草被人抢先服下，唐三与独孤博的解毒交易落空"},"note":"唐三失去水火不侵，独孤博的毒也无人能解"}}},"nonCombat":true},{"t":"尽收药园，一株不留","hint":"体魄与精神均达 60，辨药、避毒、耐寒热，收齐仙草；采集不等于一次全部炼化","need":{"体魄":60,"精神":60},"canonChange":{"node":"M25","inertia":5,"desc":"冰火两仪眼被一扫而空，史莱克七怪无一得到仙草"},"win":{"text":"你以体魄抵住寒热交侵，以精神逐株辨认药性，将十二种仙草和两瓶泉水分别封存。药园的机缘尽入行囊，接下来须逐株炼化，不能一口吞下整座药园。","d":{"flags":["binghuo_harvest"],"item":["八角玄冰草","烈火杏娇疏","奇茸通天菊","绮罗郁金香","八瓣仙兰","鸡冠凤凰葵","水仙玉肌骨","望穿秋水露","相思断肠红","九品紫芝","九品龙芝","幽香绮罗仙品","阳泉水·温玉瓶","阴泉水·温玉瓶"],"bonds":{"独孤博":-30},"trait":{"逆":4,"险":2},"shift":40,"world":{"offset":{"唐三":-6,"戴沐白":-4,"宁荣荣":-6,"马红俊":-5,"朱竹清":-7,"小舞":-4,"独孤博":-2},"news":{"M24":"冰火两仪眼被人一扫而空，独孤博的药园寸草不剩","M25":"史莱克七怪赶到冰火两仪眼时只剩一片焦土，七人的突破机缘全部落空"},"note":"史莱克七怪失去冰火两仪眼的全部仙草：戴沐白少了金刚之体，宁荣荣停在七宝，朱竹清少了七级，马红俊邪火未除，小舞没有护身之花"}}},"nonCombat":true},{"t":"与独孤博立约，园中仙草共享","hint":"先辨清药性再立约；无需与独孤博交战","need":{"体魄":35,"精神":40,"悟性":40},"win":{"text":"你在泉边坐下，对着白雾说：「你的毒，我能解。」独孤博现身时眼里全是杀意，听你讲完毒理，杀意变成了动摇。他留你在谷中住了半月，许你挑一株仙草，又亲手替你用阴泉洗了一遍经脉。","d":{"等级":3,"精神":8,"悟性":6,"体魄":6,"cap":{"精神":8,"悟性":5},"bonds":{"独孤博":25},"flags":["dugubo_friend"],"item":"九品紫芝","trait":{"群":1,"仁":1}}},"nonCombat":true},{"t":"只割一片冰叶带走","need":{"体魄":25,"精神":35},"win":{"text":"你用匕首轻轻削下一片冰叶含在舌下，寒意直冲识海。仙草根本未伤，半年就会再长回来。","d":{"精神":6,"体魄":3,"等级":1.5}},"nonCombat":true,"hint":"抵御冰叶寒意并辨清药性，只取少量"},{"t":"转身离开","win":{"text":"毒雾开始翻涌，你在毒阵发作前退出了山谷。","d":{}}}],"minLevel":30},{"id":"t_c_dixue","name":"万年地穴魔蛛","tier":"绝","place":"落日森林·塌陷地洞","yearMin":2643,"yearMax":2644,"canon":"M28","owner":"唐三（第四魂环）","rumor":"落日森林最近塌了好几处地洞，猎户说洞底有东西在织网，网丝比铁丝还硬。","memory":"原著中，七怪在落日森林遇袭，小舞被魔蛛刺中，相思断肠红挡下致命一击；唐三随后吸收万年地穴魔蛛为第四魂环，得到蓝银囚笼。","text":"地洞深不见底，洞壁上全是灰白的蛛丝，一碰就发出铮铮的金属声。你点起火折子往下看，火光照出一只比牛还大的蜘蛛，通体漆黑，背上一道血红的纹，八只复眼像八盏小灯笼。它身上的气息足有万年。\n原著里，这只魔蛛成了唐三的第四魂环。而就在这片林子里，小舞会被它的同族刺中后背。","choices":[{"t":"下洞斩杀，夺万年环","need":{"战力":798},"win":{"text":"你在洞底和它缠斗了半个时辰，最后一刀劈开它的背甲。万年黑环落下时，地底的土石都在你脚下翻涌。","d":{"ring":{"beast":"地穴魔蛛","years":10000,"kind":"控","skill":"地穴囚笼","desc":"从地底翻起蛛丝与土石结成牢笼，困住目标并持续吸取魂力"},"体魄":4,"精神":4,"flags":["overlimit"],"trait":{"逆":1,"险":1},"shift":8,"world":{"offset":{"唐三":-3},"news":{"M28":"落日森林的万年地穴魔蛛被人抢先猎杀，唐三的第四环只得千年"},"note":"唐三没有蓝银囚笼，控场能力大减"}}},"battle":{"n":"地穴魔蛛","years":10000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"先清掉林中的魔蛛","need":{"战力":798},"win":{"text":"你提前一天进林，把附近游荡的几只人面魔蛛清理干净。七怪进林时，再没有毒刺从暗处射向小舞。","d":{"bonds":{"小舞":15,"唐三":10},"名望":4,"trait":{"仁":1},"shift":4,"world":{"offset":{"小舞":1},"news":{"M28":"七怪在落日森林有惊无险，小舞未被魔蛛刺中"},"note":"小舞没有受伤，柳二龙认义女的事也没有发生"}}},"battle":{"n":"地穴魔蛛","years":10000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"只割一捆地穴蛛丝","need":{"体魄":35},"win":{"text":"你割下一捆蛛丝，回去拧成一根细索，刀砍不断，火烧不焦。","d":{"item":"地穴蛛丝索","体魄":2,"悟性":2}}},{"t":"转身离开","win":{"text":"火折子灭了，你在黑暗里听了一会儿那铮铮声，退出了地洞。","d":{}}}],"minLevel":38},{"id":"t_c_qicai","name":"时年的七彩头骨","tier":"绝","place":"天斗城·史莱克学院后巷","yearMin":2644,"yearMax":2645,"canon":"M30","owner":"唐三（后赠宁荣荣）","rumor":"天斗城里有个独来独往的魂师，据说头骨里藏着一块会发七色光的魂骨，最近有人看见他在史莱克学院外转悠。","memory":"原著中，时年受人指使刺杀唐三，反被阎王帖毒杀，唐三从他身上得到七彩头骨，后来转赠给了宁荣荣。","text":"夜里的巷子很深，一道人影贴着墙根挪到史莱克学院后墙下。他气息内敛，额角却隐隐透出七色微光。你认得这个人：时年。原著里他今晚会刺杀唐三，然后死在一枚阎王帖下，把一块七彩头骨留给唐三。\n他也察觉到了你，手按在刀柄上，眼神像蛇一样冷。巷口的更夫刚敲过三更，四下再没有别的声音。","choices":[{"t":"截杀时年，夺取头骨","need":{"战力":1540},"win":{"text":"你抢在他翻墙前出手，三招之后他倒在巷子里。一块七彩流转的头骨从他体内浮出，落进你的手心。","d":{"bone":{"slot":"头","name":"七彩幻境头骨","desc":"展开幻之空间，友军精神力大增，敌人陷入七彩幻境","attrs":{"精神":10,"魅力":4},"years":30000},"名望":3,"trait":{"逆":1,"险":1},"shift":6,"world":{"offset":{"宁荣荣":-2},"news":{"M30":"刺客时年在史莱克学院外被人截杀，七彩头骨下落不明"},"note":"唐三没得到七彩头骨，宁荣荣也少了这份赠礼"}}},"battle":{"n":"时年","lv":72},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"敲墙示警唐三","need":{"精神":30},"win":{"text":"你在墙外重重敲了三下。唐三提前惊醒，时年扑了个空，仓皇逃进了夜色。","d":{"bonds":{"唐三":15},"名望":2,"trait":{"仁":1},"shift":2,"world":{"note":"时年刺杀失手逃走，七彩头骨没有落到唐三手里"}}}},{"t":"买下他的刺杀情报","need":{"魅力":40,"金魂币":500},"win":{"text":"你开价买下他的底细。时年收了钱，说出幕后是苍晖一系的人，然后消失在夜色里。","d":{"金魂币":-500,"item":"时年的密信","flags":["know_canghui"],"名望":2}}},{"t":"转身离开","win":{"text":"你退回巷口，把这一夜留给原本该发生的事。","d":{}}}],"minLevel":35},{"id":"t_c_lieyang","name":"十首烈阳蛇内丹","tier":"绝","place":"杀戮之都·地狱路第二关","yearMin":2647,"yearMax":2649,"canon":"M44","owner":"唐三（后给马红俊作第七魂环）","rumor":"杀戮之都的老兵说，地狱路第二关有条十个头的火蛇，闯过去的杀神都带走了一颗烫手的珠子。","memory":"原著中，唐三在地狱路以九九归一斩断十首烈阳蛇与内丹的联系，取走内丹；后来马红俊以它为第七魂环，进化成七首火凤凰。","text":"地狱路第二关是一片熔岩湖，湖心盘着一条十首巨蛇，十颗头颅轮流喷吐烈焰，烧得空气都在扭曲。蛇腹下隐隐透出一点金红，那是它的内丹，它所有的力量都系在那颗珠子上。\n你记得原著里的破法：九九归一，斩断蛇与内丹的牵连。在这座魂技失效的城里，你只能靠一身真本事。","choices":[{"t":"斩断联系，夺取内丹","need":{"战力":1221},"win":{"text":"你以最纯粹的力道连斩八十一刀，最后一刀切断了蛇与内丹之间那根火线。十首齐垂，一颗灼热的珠子滚进你手里。","d":{"item":"十首烈阳蛇内丹","体魄":10,"精神":5,"等级":3,"flags":["snake_bane"],"trait":{"逆":1,"险":1},"shift":8,"world":{"offset":{"马红俊":-4},"news":{"M63":"马红俊没有十首烈阳蛇内丹，未能进化为七首火凤凰"},"note":"胖子没有七首火凤凰，海神第二考少了开路之人"}}},"battle":{"n":"十首烈阳蛇","years":30000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"以内丹炼成魂环","need":{"战力":1221,"精神":60},"win":{"text":"内丹在你掌心燃成一圈赤红的光，你咬牙将它炼化。烈阳之力在体内盘踞，从此万蛇见你皆伏。","d":{"ring":{"beast":"十首烈阳蛇","years":30000,"kind":"攻","skill":"烈阳十首","desc":"召出十道烈阳蛇影齐喷火焰，克制一切蛇类"},"体魄":6,"flags":["snake_bane","overlimit"],"trait":{"逆":1,"险":1},"shift":8,"world":{"offset":{"马红俊":-4},"news":{"M63":"十首烈阳蛇内丹被人炼成魂环，马红俊没能进化为七首火凤凰"},"note":"胖子没有七首火凤凰，海神第二考少了开路之人"}}},"battle":{"n":"十首烈阳蛇","years":30000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"斩几颗蛇头换赏金","need":{"战力":1221},"win":{"text":"你砍下三颗蛇首便退出了熔岩湖。杀戮之都的执法者照价收下，给了你一笔不小的赏钱。","d":{"金魂币":1500,"名望":3,"体魄":3}},"battle":{"n":"十首烈阳蛇","years":30000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"转身离开","win":{"text":"热浪扑面，你退回第一关的血路，把这条蛇留给后来的人。","d":{}}}],"minLevel":50},{"id":"t_c_lanyin","name":"蓝银皇十万年右腿骨","tier":"神","place":"天斗城外·瀑布谷","yearMin":2646,"yearMax":2650,"canon":"M46","owner":"唐三（阿银遗骨，唐昊转交）","rumor":"天斗城外有处深山瀑布，常年有锤声从水帘后传出。樵夫说里面住着个整天喝酒的高大男人，从不让人靠近他腰间那只旧布囊。","memory":"原著中，唐昊一直贴身带着妻子阿银留下的十万年蓝银皇右腿骨，直到瀑布谷中才交给唐三，唐三吸收后八脉全通，得到飞行与再生之能。","text":"水帘后是一间简陋的石屋，桌上歪着几只空酒坛。高大的男人背对着你睡着，鼾声粗重，腰间系着一只褪色的旧布囊，布囊口露出一截淡蓝色的骨，泛着柔和的光，像一株安静的草。\n你知道那是什么，也知道他是谁。昊天斗罗哪怕醉着，也只差一线就会醒。偷走它，唐三就永远等不到那一天。","choices":[{"t":"盗走右腿骨","hint":"趁守护者离开潜入旧藏，以体魄穿越瀑流、精神避开警戒；不必击败唐昊","need":{"体魄":45,"精神":60},"canonChange":{"node":"M46","inertia":5,"desc":"蓝银皇右腿骨被盗，唐三八脉未能全通"},"win":{"text":"你屏住呼吸，指尖勾出那截魂骨，一步步退出水帘。直到跑出十里你才敢回头，瀑布后传来一声悲怒的长啸。","d":{"bone":{"slot":"右腿","name":"蓝银皇右腿骨","desc":"十万年蓝银皇遗骨，可凌空飞行，断肢再生如野火烧不尽","attrs":{"体魄":10,"精神":6,"悟性":4}},"等级":6,"体魄":8,"flags":["regen","fly"],"bonds":{"唐昊":-60},"trait":{"逆":2,"忠":-2},"shift":20,"world":{"offset":{"唐三":-6},"news":{"M46":"唐昊珍藏的蓝银皇右腿骨被盗，唐三八脉未通，昊天斗罗震怒寻凶"},"note":"唐三没有蓝银皇右腿骨，八脉未通，也失去了飞行与再生"}}},"nonCombat":true},{"t":"陪他喝一夜酒","need":{"魅力":40},"win":{"text":"他醒来时你已在桌边坐了半夜。他没赶你，推过来一碗酒，絮絮讲起一个女人。天亮时他说：「替我照看那孩子。」","d":{"bonds":{"唐昊":25,"唐三":10},"精神":3,"flags":["tanghao_drink"],"trait":{"群":1}}}},{"t":"隔着水帘悟锤意","need":{"悟性":45},"win":{"text":"你在瀑布外坐了三天，听那锤声一下下砸进水里。锤意入心，你的力道沉了一截。","d":{"体魄":5,"悟性":3}}},{"t":"转身离开","win":{"text":"你没有掀开水帘，只听着里头的鼾声，转身下了山。","d":{}}}],"minLevel":55},{"id":"t_c_haotian","name":"昊天宗的两块传承魂骨","tier":"绝","place":"昊天宗·长老堂石室","yearMin":2650,"yearMax":2656,"canon":"M72","owner":"唐昊（断肢归还宗门，后由唐三取回）","rumor":"昊天宗封山多年，最近却有人看见长老堂夜里点灯到天明，像是在守着什么要紧东西。","memory":"原著中，唐昊在瀑布谷自断右臂左腿，剥离出黑色右臂骨与暗青左腿骨还给宗门，由长老会保管，直到唐三任首席长老后才归还唐昊，让他复原到九十六级以上。","text":"长老堂后的石室没有窗，墙上一排铁锤沉默地挂着。石台中央并排放着两块魂骨：一截漆黑如墨的右臂骨，一截暗青如铁的左腿骨，骨面上纹路深重，压得人喘不过气。那是唐昊用断肢换来的东西。\n守夜的长老在隔壁打坐，呼吸绵长。你知道，原著里这两块骨要等到很多年后才会回到唐昊身上。","choices":[{"t":"盗走两块传承魂骨","need":{"体魄":60,"精神":75},"win":{"text":"你一手一块抱起魂骨，翻出长老堂时惊醒了守夜长老。昊天锤擦着你后背砸塌半面墙，你已经冲进了夜色。","d":{"bone":[{"slot":"右臂","name":"昊天黑色右臂骨","desc":"唐昊亲手剥离的昊天宗传承臂骨，一拳自带锤势","attrs":{"体魄":12}},{"slot":"左腿","name":"昊天暗青左腿骨","desc":"昊天宗传承腿骨，踏地如锤震，身法沉稳","attrs":{"体魄":8,"精神":4}}],"伤势":30,"bonds":{"唐昊":-40,"唐三":-20},"trait":{"逆":2,"忠":-1},"shift":12,"world":{"offset":{"唐昊":-6},"news":{"M72":"昊天宗传承魂骨失窃，唐昊未能复原到九十六级"},"note":"唐昊少了两块魂骨，终战时战力不复巅峰"}}},"nonCombat":true,"hint":"潜入旧藏需体魄 60、精神 75；这是盗取遗物，不是正面击败昊天斗罗"},{"t":"在骨前参悟一夜","need":{"悟性":50},"win":{"text":"你没有动它们，只在石台前静坐，把骨上的纹路一寸寸刻进脑海。天亮前你悄然离开，力道里多了一份沉重。","d":{"体魄":6,"悟性":5,"精神":3}}},{"t":"以功名求宗主一见","need":{"名望":40},"win":{"text":"你递上拜帖说明来意。唐啸打量你许久，允你隔着石门感受骨中锤意半日，临别还送了你一句话。","d":{"体魄":4,"悟性":3,"bonds":{"唐啸":10}}}},{"t":"转身离开","win":{"text":"你在石室门口站了片刻，没有推门，原路退了回去。","d":{}}}],"minLevel":65},{"id":"t_c_jingying","name":"两万年镜影兽","tier":"绝","place":"极北之地·外围冰封森林","yearMin":2650,"yearMax":2651,"canon":"M50","owner":"奥斯卡（镜影头骨）","rumor":"天斗北端的冰封森林里，有猎魂队说见过一头会分身的冰兽，砍中的永远是影子。","memory":"原著中，奥斯卡出走后加入猎魂小队，与浩特等人在冰封森林猎杀两万年镜影兽，得到镜影头骨，学会幻化分身。","text":"冰封森林的雪地上，一头银白色的兽影正绕着一支猎魂小队打转。它一化二，二化四，转眼间雪地上全是它的影子，小队里的人砍得气喘吁吁。人群里有个脸上带疤的青年，正咬着牙往嘴里塞一根香肠，眼神比你记忆中沉了许多。\n是奥斯卡。原著里，这头两万年镜影兽的头骨会落进他手里。","choices":[{"t":"抢先斩杀，夺取头骨","need":{"战力":1000},"win":{"text":"你闭上眼，凭精神力找到唯一的真身，一刀斩下。一块冰晶似的头骨浮起，正落在你面前。奥斯卡愣了一下，苦笑着收回了手。","d":{"bone":{"slot":"头","name":"镜影头骨","desc":"两万年镜影兽头骨，可幻化出以假乱真的分身","attrs":{"精神":10,"悟性":4},"years":20000},"名望":4,"trait":{"逆":1},"shift":6,"world":{"offset":{"奥斯卡":-3},"news":{"M50":"冰封森林的镜影兽被外人斩杀，奥斯卡没能得到镜影头骨"},"note":"奥斯卡没有镜影头骨，失去了幻化分身之能"}}},"battle":{"n":"镜影兽","years":20000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"指出真身，助他猎杀","need":{"精神":50},"win":{"text":"你喊出真身的方位，奥斯卡的小队一拥而上。他拿到头骨后冲你深深一揖，说这份情他记十年。","d":{"bonds":{"奥斯卡":25,"宁荣荣":5},"名望":3,"精神":2,"trait":{"群":1}}}},{"t":"收一捧镜影冰晶","chance":0.5,"win":{"text":"冰晶在掌心化开，你的脑海里多出一道模糊的分影，久久不散。","d":{"精神":4,"悟性":1}},"lose":{"text":"冰晶里的残影反噬，你头痛了好几天，看什么都是重影。","d":{"伤势":12}}},{"t":"转身离开","win":{"text":"你没有惊动那支小队，踩着自己的脚印退出了森林。","d":{}}}],"minLevel":50},{"id":"t_c_xuelong","name":"水晶血龙参","tier":"绝","place":"天斗帝国·敏之一族祖祠","yearMin":2650,"yearMax":2651,"canon":"M54","owner":"小舞（白鹤所赠，助她化回人形）","rumor":"敏之一族的老宗主白鹤据说藏着一株会发红光的老参，族里谁病了都舍不得用。","memory":"原著中，白鹤把敏之一族的传家宝水晶血龙参赠给唐门，喂给了兔形的小舞；它天生八品，与相思断肠红相辅，助小舞日后化回人形。","text":"敏之一族的祖祠后面有一间暖房，房里一只白玉盆，盆中卧着一株通体透红的老参。参体晶莹，像一块血色水晶，根须末端弯成龙爪的形状，隐隐有心跳般的脉动。只闻了一缕参香，你就觉得周身血气都热了起来。\n原著里，这株天生八品的水晶血龙参，是小舞重新化回人形的关键一味。","choices":[{"t":"夺参吞服","need":{"战力":950},"win":{"text":"你闯进暖房，捧起玉盆转身就走。血龙参入腹，血气像一条小龙在经脉里翻滚，连最早吸收的魂环都被滋养得厚重了。","d":{"等级":4,"体魄":10,"气运":4,"ringUp":{"target":"lowest","add":3000},"rep":{"天斗":-6},"bonds":{"白鹤":-30},"trait":{"逆":2,"仁":-1},"shift":10,"world":{"offset":{"小舞":-3},"news":{"M54":"敏之一族的水晶血龙参被人夺走，小舞化回人形之期一再推迟"},"note":"小舞少了血龙参，复活之路更加漫长"}}}},{"t":"以重金换一截参须","need":{"金魂币":2000},"win":{"text":"白鹤犹豫许久，剪下一截参须交给你。你没有讨价还价，他倒是有些意外。","d":{"金魂币":-2000,"体魄":5,"等级":1.5,"bonds":{"白鹤":10}}}},{"t":"劝白鹤献参唐门","need":{"魅力":45},"win":{"text":"你把来意说透，白鹤看了你很久，最终点头。唐三后来知道是你牵的线，亲自登门道谢。","d":{"bonds":{"唐三":20,"小舞":15,"白鹤":10},"名望":5,"trait":{"群":1}}}},{"t":"转身离开","win":{"text":"你在暖房外闻了一口参香，转身离开了祖祠。","d":{}}}],"minLevel":55},{"id":"t_c_shenwang","name":"万年九品参王","tier":"绝","place":"极北之地·外围北方大森林","yearMin":2648,"yearMax":2656,"canon":"M71","owner":"唐三（复活小舞的材料）","rumor":"北方大森林的采参人说，林子里有一株会走路的老参，夜里蹦着跑，脚印像个小孩。","memory":"原著中，北方大森林的参王会自行移动，吉祥曾服下一株万年参王打通经脉；万年九品参王须活体带回，是唐三复活小舞的材料之一。","text":"雪地上一串小小的脚印弯弯绕绕，你追了半夜，终于在一棵老松下堵住了它。那是一株手臂长的人参，根须分成手脚，参顶开着一簇红籽，正抱着树根瑟瑟发抖，九片参叶在月光下微微发亮。\n万年九品参王。原著里，它要被活着带回去，作为复活小舞的材料。你一伸手，它就吓得把九片叶子全缩了起来。","choices":[{"t":"当场吞服参王","need":{"战力":1000},"win":{"text":"你一把捉住它，在它尖叫之前一口咬下。参力像一场暴雪冲开全身经脉，新得的魂环也跟着暴涨，你在松下坐了七天才睁眼。","d":{"等级":5,"体魄":8,"精神":5,"悟性":3,"ringUp":{"target":"last","mul":1.5},"flags":["meridian_open"],"trait":{"逆":1,"仁":-1},"shift":8,"world":{"offset":{"小舞":-2},"news":{"M71":"万年九品参王被人吞服，复活小舞的材料少了一味"},"note":"唐三复活小舞时少了一味主药，只能另寻替代"}}}},{"t":"活捉参王送给唐三","need":{"体魄":50},"win":{"text":"你用红绳拴住参王，一路护着送到唐三手里。他接过时，手都在抖。","d":{"bonds":{"唐三":25,"小舞":15},"名望":4,"trait":{"仁":1,"群":1}}}},{"t":"只摘几颗参籽","chance":0.6,"win":{"text":"参王拼命挣扎，留下三颗红籽逃走了。参籽入口，一股暖意从腹中升起，经月不散。","d":{"体魄":4,"等级":1}},"lose":{"text":"参王一头钻进雪里，你扑了一身雪，只摸到一根断须。","d":{"体魄":1}}},{"t":"转身离开","win":{"text":"你松开手，参王一溜烟钻进雪里，只留下一串小脚印。","d":{}}}],"minLevel":58},{"id":"t_c_shenghun","name":"万年圣魂草","tier":"绝","place":"星斗大森林·中圈背阴山坳","yearMin":2651,"yearMax":2656,"canon":"M53","owner":"大明、二明负责寻找（原著未写下落）","rumor":"星斗大森林中圈的魂兽最近有些反常，几头大家伙成天在一片山坳里翻找，像在找什么东西。","memory":"原著提到万年圣魂草能唤醒灵魂，大明、二明负责在星斗大森林寻找，它是复活小舞所需的灵物之一，原著并未写明下落。","text":"山坳背阴处的岩缝里，一株半透明的小草在雾里轻轻摇晃，叶片上流转着淡金的光，像有一缕缕魂魄在里面游。你只是看着它，脑海里那些模糊的旧梦就一桩桩清晰起来。\n远处传来沉闷的脚步声，一头青色巨蟒和一只庞大的猿影正往这边来。它们在找的，就是你眼前这株草。","choices":[{"t":"抢先采走圣魂草","need":{"战力":1050,"精神":55},"win":{"text":"你连根拔起圣魂草，在两头巨兽赶到前钻进密林。草叶入口，识海像被点亮一盏灯，最强的那道魂环也随之明亮了几分。","d":{"精神":12,"悟性":5,"等级":3,"ringUp":{"target":"highest","mul":1.2},"rep":{"魂兽":-15},"bonds":{"二明":-20},"trait":{"逆":1},"shift":8,"world":{"offset":{"小舞":-2},"news":{"M53":"星斗大森林的万年圣魂草被人采走，大明二明空手而归"},"note":"复活小舞所需的唤魂灵物落入他人之手"}}}},{"t":"把位置指给大明二明","need":{"魅力":40},"win":{"text":"你冲两头巨兽举起双手，指了指岩缝。二明低头嗅了嗅你，喉咙里滚出一声低吼，算是谢了。","d":{"bonds":{"二明":20,"大明":15},"rep":{"魂兽":15},"reveal":["二明"],"气运":3,"trait":{"仁":1}}}},{"t":"掐一片叶子就跑","chance":0.55,"win":{"text":"你掐下一片叶子塞进嘴里转身就跑，识海清凉了好几天。","d":{"精神":5}},"lose":{"text":"你的手刚伸出去，青色巨蟒的尾巴已经扫到，你被抽出了山坳。","d":{"伤势":30}}},{"t":"转身离开","win":{"text":"脚步声越来越近，你退进林子，把那株草留给它们。","d":{}}}],"minLevel":60},{"id":"t_c_mozhu3w","name":"三万年人面魔蛛","tier":"绝","place":"星斗大森林·中圈星湖畔","yearMin":2650,"yearMax":2651,"canon":"M53","owner":"唐三（星湖之后击杀泄愤）","rumor":"星湖附近的林子里有一张能罩住半座山头的蛛网，有人说网的主人已经活了三万年，专挑人吃。","memory":"原著中，星湖一战里有一只隐身的三万年人面魔蛛参与围杀，小舞献祭后，唐三追进林中将它击杀。","text":"星湖边的林子被蛛丝裹成了一座灰白的坟。网心挂着一只比屋子还大的人面魔蛛，背甲上那张人脸已经长出了皱纹，八只眼睛里满是贪婪。它的气息你在原著里读过：星湖一战，正是它从隐身处刺出的那一下，让局面无可挽回。\n现在，它还在网上打盹，网丝随着它的呼吸一起一伏，湖风吹过时发出低低的呜咽声。","choices":[{"t":"斩杀魔蛛，夺三万年环","need":{"战力":1221},"win":{"text":"你一刀劈开网心，魔蛛惊醒反扑，八根长腿把你逼到湖边。最后你一刀从它的人脸正中贯穿，三万年的黑环沉沉落下。","d":{"ring":{"beast":"人面魔蛛","years":30000,"kind":"攻","skill":"魔蛛千刺","desc":"背后探出千根毒刺齐射，中者麻痹溃烂"},"体魄":6,"名望":5,"trait":{"险":1},"shift":6,"world":{"offset":{"唐三":-1},"news":{"M53":"星湖之战前，那只隐身的三万年人面魔蛛已被人斩杀"},"note":"星湖围杀少了一只魔蛛，唐三也没能在复仇中突破"}}},"battle":{"n":"人面魔蛛","years":30000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"烧网逼它离开星湖","need":{"战力":1221},"win":{"text":"你一把火烧了半座山头的蛛网，魔蛛嘶叫着往森林深处逃去，再也没有回来。","d":{"名望":3,"rep":{"魂兽":-5},"shift":3,"world":{"note":"三万年人面魔蛛被逼离星湖，没有参与围杀小舞"}}},"battle":{"n":"人面魔蛛","years":30000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"削一截旧腿做暗器","need":{"悟性":45},"win":{"text":"你趁它打盹，削下一截脱落的旧腿，回去磨成三枚毒刺，见血封喉。","d":{"item":"魔蛛毒刺","悟性":3}}},{"t":"转身离开","win":{"text":"你绕开那片灰白的林子，走向星湖的另一边。","d":{}}}],"minLevel":62},{"id":"t_c_hanxin","name":"寒心铁精与深海沉银","tier":"珍","place":"庚辛城·鉴宝街","yearMin":2649,"yearMax":2651,"canon":"M55","owner":"唐三（交楼高打造三大暗器）","rumor":"庚辛城的地摊上什么都有，听说有人花十个金魂币淘到一块冷得冻手的铁疙瘩，转手卖了一万。","memory":"原著中，唐三在庚辛城收服铁匠楼高，凑齐寒心铁精、深海沉银银母等材料，打造孔雀翎、暴雨梨花针、佛怒唐莲三大暗器。","text":"庚辛城的鉴宝街从早吵到晚，满地都是锈铁和矿石。你在一个老摊主的筐底摸到一块拳头大的黑铁，冷得像握着一块冰；隔壁摊上又摆着一团银灰色的软泥，轻轻一按就沉下去，抬手又鼓回来。\n寒心铁精，深海沉银的银母。原著里唐三就是凑齐了这些，才让楼高造出暴雨梨花针和佛怒唐莲。","choices":[{"t":"两样全都买下","need":{"金魂币":1500},"win":{"text":"你不动声色地把两样都买下，摊主还以为宰了个冤大头。回到客栈打开包袱，铁精的寒气凝了一层白霜。","d":{"金魂币":-1500,"item":["寒心铁精","深海沉银银母"],"悟性":3,"气运":2,"trait":{"逆":1},"shift":5,"world":{"offset":{"唐三":-1},"news":{"M55":"寒心铁精与银母被人先行买走，楼高的三大暗器迟迟造不出"},"note":"唐门少了三大暗器，日后几场硬仗都少了底牌"}}}},{"t":"凭眼力淘一块铁精碎","need":{"悟性":45},"win":{"text":"你在三十个摊子里只挑出一块指甲大的铁精碎，花了五个金魂币。拿去打一枚飞刀，正合适。","d":{"item":"寒心铁精碎块","金魂币":-5,"悟性":3}}},{"t":"把消息卖给铁匠协会","need":{"魅力":35},"win":{"text":"你把两样东西的下落卖给铁匠协会的管事，换了一大笔钱，也结识了几位大匠。","d":{"金魂币":800,"名望":3}}},{"t":"转身离开","win":{"text":"你把铁疙瘩放回筐里，继续在嘈杂的街上闲逛。","d":{}}}],"minLevel":45},{"id":"t_c_ruanjia","name":"八宝如意软甲","tier":"珍","place":"庚辛城·拍卖行","yearMin":2651,"yearMax":2651,"canon":"M55","owner":"奥斯卡、小舞（唐三拍下）","rumor":"庚辛城拍卖行压轴的是一阴一阳两件软甲，据说是前代大匠所作，连强攻系第六魂技都打不穿。","memory":"原著中，八宝如意软甲阴阳两件被唐三拍下，分给奥斯卡与小舞穿着，能硬接强攻系第六魂技，凤凰火也烧不坏。","text":"拍卖行里灯火通明，台上的锦盒打开，两件软甲叠在一起，一件乌黑一件雪白，薄得像两层纱，光一照却流转出八种纹路。拍卖师一句话说完，满场都静了：强攻系第六魂技，打不穿。\n角落里，一个蓝衣青年正在低声和同伴商量。你知道他是谁，也知道原著里这两件软甲最后穿在了谁身上。","choices":[{"t":"两件一并拍下","need":{"金魂币":6000},"win":{"text":"你连举三次牌，把价钱抬到满场无人跟。两件软甲落进你手里，那蓝衣青年远远看了你一眼，没有说话。","d":{"金魂币":-6000,"item":["八宝如意软甲·阴","八宝如意软甲·阳"],"体魄":6,"名望":6,"trait":{"逆":1},"shift":4,"world":{"offset":{"小舞":-1,"奥斯卡":-1},"news":{"M55":"八宝如意软甲被一位豪客整套拍走，唐三空手而归"},"note":"奥斯卡与小舞少了护身软甲，后来几次险境更加凶险"}}}},{"t":"只拍下一件阴甲","need":{"金魂币":3000},"win":{"text":"你拍下乌黑的那件阴甲，雪白的阳甲留给了蓝衣青年。他冲你点点头，算是交了个朋友。","d":{"金魂币":-3000,"item":"八宝如意软甲·阴","体魄":4,"bonds":{"唐三":5}}}},{"t":"暗中帮唐三压价","need":{"魅力":40},"win":{"text":"你在场下和几位豪客打了招呼，价钱没有再往上抬。唐三拍下软甲后，特地过来道谢。","d":{"bonds":{"唐三":15,"奥斯卡":5},"名望":2,"trait":{"群":1}}}},{"t":"转身离开","win":{"text":"你放下号牌，在落槌声里起身离开了拍卖行。","d":{}}}],"minLevel":45},{"id":"t_c_langdao","name":"狼盗首领的飓风右腿","tier":"绝","place":"天斗西陲·瀚海城以西狼盗营地","yearMin":2652,"yearMax":2652,"canon":"M59","owner":"戴沐白（嗜血狂化之飓风右腿骨）","rumor":"天斗西陲的狼盗越来越猖獗，听说他们的首领一发狂，力气能翻倍，连魂技都不用就能撕碎一个魂王。","memory":"原著中，唐三一行西行途中剿灭狼盗，从首领体内得到嗜血狂化之飓风右腿骨，交给了戴沐白。","text":"荒原尽头的营地里火光冲天，被掳来的村民挤在木笼里瑟瑟发抖。帐前站着一个赤膊的狼头巨汉，右腿比常人粗了一圈，皮下有东西在一鼓一鼓地跳。他一声狼嚎，周身气血翻涌成红雾，双眼通红。\n你记得那条腿里藏着什么：嗜血狂化之飓风右腿骨，攻防速翻倍，代价是不能用魂技。","choices":[{"t":"斩杀首领，取走腿骨","need":{"战力":1221},"win":{"text":"狂化的狼盗首领硬扛了你三十招，最后被你一脚踢碎膝盖。一截赤红的腿骨从他体内浮出，带着飓风般的戾气。","d":{"bone":{"slot":"右腿","name":"嗜血狂化之飓风右腿","desc":"狂化时攻、防、速倍增，但狂化中无法施展魂技","attrs":{"体魄":10,"精神":2},"years":30000},"名望":6,"rep":{"天斗":5},"trait":{"逆":1,"险":1},"shift":5,"world":{"offset":{"戴沐白":-3},"news":{"M59":"西陲狼盗首领被人斩杀，飓风右腿骨下落不明"},"note":"戴沐白没有拿到飓风右腿骨"}}},"battle":{"n":"狼盗首领","years":30000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"潜入营地救出村民","need":{"精神":50},"win":{"text":"你趁夜摸进营地，一个个撬开木笼。天亮时狼盗才发现人跑光了，首领在营地里暴跳如雷。","d":{"名望":8,"rep":{"天斗":8},"气运":3,"trait":{"仁":2}}}},{"t":"截下他们一车赃物","need":{"战力":1221},"win":{"text":"你在山道上伏击了狼盗的运货队，掀开篷布，满车都是抢来的金魂币和货物。","d":{"金魂币":1200,"名望":2}},"battle":{"n":"狼盗首领","years":30000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"转身离开","win":{"text":"你远远看了一眼营地的火光，拨转马头离开了荒原。","d":{}}}],"minLevel":60},{"id":"t_c_mojing","name":"掀翻海魔号的魔鲸","tier":"绝","place":"大海·瀚海城外海","yearMin":2652,"yearMax":2652,"canon":"M60","owner":"唐三（以八蛛矛吞噬其能量）","rumor":"瀚海城的老船长说，最近有艘大船在外海被一头黑色巨鲸撞沉，鲸背上还站着个人。","memory":"原著中，海德尔复仇引来魔鲸，海魔号沉没；唐三在海底以八蛛矛吞噬魔鲸的能量，升到六十八级。","text":"海面突然隆起一座黑色的山。那头魔鲸张开巨口，海水像瀑布一样倒灌进去，旁边的大船被它一个翻身拍成了碎木。鲸背上站着一个满脸怨毒的老人，正嘶吼着谁的名字。\n你记得原著：这艘船叫海魔号，唐三会在海底用八蛛矛吞噬这头魔鲸的力量。可现在，你离它更近，浪头已经打湿了你的衣襟。","choices":[{"t":"斩杀魔鲸，吞其精元","need":{"战力":1100},"win":{"text":"你踏浪而上，一刀刺进魔鲸头顶。巨鲸翻滚着沉入海底，你追下去，把它流散的精元一口口吞进经脉，连最弱的魂环都涨了一截。","d":{"等级":4,"体魄":9,"精神":4,"ringUp":{"target":"lowest","add":5000},"flags":["whale_essence"],"名望":5,"trait":{"险":1,"逆":1},"shift":6,"world":{"offset":{"唐三":-2},"news":{"M60":"外海魔鲸被人斩杀，唐三没能吞噬它的力量"},"note":"唐三少了魔鲸之力，登上海神岛时只有六十六级"}}}},{"t":"救起落水的船员","need":{"体魄":50},"win":{"text":"你一趟趟潜下去，把落水的人拖上浮板。等魔鲸游远，海面上已经漂着十几个劫后余生的人。","d":{"名望":6,"气运":4,"bonds":{"唐三":5},"trait":{"仁":2}}}},{"t":"潜下去捡鲸鳞","chance":0.5,"win":{"text":"魔鲸翻身时蹭落了几片黑鳞，你潜下去捞起两片，鳞片坚硬得像铁。","d":{"体魄":3,"item":"魔鲸黑鳞"}},"lose":{"text":"暗流把你卷向鲸口，你拼命才游出来，呛了一肚子海水。","d":{"伤势":20}}},{"t":"转身离开","win":{"text":"你把船头掉转，离开了那片翻涌的海域。","d":{}}}],"minLevel":62},{"id":"t_c_zizhenzhu","name":"紫珍珠海盗团的宝库","tier":"珍","place":"大海·紫珍珠岛岩洞","yearMin":2652,"yearMax":2652,"canon":"M60","owner":"唐三（收服紫珍珠海盗团）","rumor":"海上的商船都怕挂紫珍珠旗的船，据说他们的老巢藏在一座怪岛上，宝库里的金子能堆成山。","memory":"原著中，唐三一行在海上收服紫珍珠海盗团，收吉祥为徒，海盗团成了他们登上海神岛前的落脚之处。","text":"紫珍珠岛的礁石像一圈獠牙，海盗的船在港里一字排开。你从岩洞后摸进去，洞底堆满了箱子，打开一只，金魂币哗啦啦淌了一地，另一只里全是叫不出名的海珠和魂导器。洞口传来脚步声，一个红发女子拎着弯刀走进来，眼神比刀还亮。\n原著里，这伙海盗会被唐三收服。可现在，宝库就在你脚下。","choices":[{"t":"收服海盗，夺下宝库","need":{"战力":1000},"win":{"text":"你和红发女子交手十招，她的弯刀断成两截。海盗们看着首领低头，没人敢动，宝库从此归你调用。","d":{"金魂币":6000,"名望":6,"flags":["pirate_lord"],"trait":{"逆":1,"险":1},"shift":5,"world":{"news":{"M60":"紫珍珠海盗团被一名陌生强者收服，唐三一行没能在此落脚"},"note":"唐三少了紫珍珠这个海上据点，吉祥也没有拜他为师"}}}},{"t":"跟海盗谈一笔买卖","need":{"魅力":40},"win":{"text":"你不拔刀，只讲生意。红发女子听完大笑，拿出一箱海珠换你陆上的货路。","d":{"金魂币":2000,"名望":2}}},{"t":"顺手抱一箱就走","chance":0.5,"win":{"text":"你抱起最近的一只箱子跳进海里，游出半里才浮上来，打开一看，箱子里是满满的金魂币。","d":{"金魂币":1500}},"lose":{"text":"你刚抱起箱子就被发现，挨了一刀才跳海脱身。","d":{"伤势":25}}},{"t":"转身离开","win":{"text":"你把箱盖合上，悄悄从岩洞后退回了海里。","d":{}}}],"minLevel":58},{"id":"t_c_qiankun","name":"天斗镇国之宝","tier":"神","place":"天斗城·皇宫宝库","yearMin":2645,"yearMax":2652,"canon":"M58","owner":"唐三（雪夜所赐，即海神之心）","rumor":"天斗皇宫有件镇国之宝，是只碗大的蓝色罩子，历代皇帝都只在祭天时请出来看一眼。","memory":"原著中，雪夜大帝封唐三为蓝昊王时赐下瀚海乾坤罩，它吸血认主，实为海神之心；唐三在海神第七考把它嵌入三叉戟，才拔出了神器。","text":"宝库最深处的玉台上扣着一只碗大的蓝色罩子，罩面像一片凝固的海，里头隐隐有潮声起伏。你靠近一步，它便轻轻一震，像在嗅你的血。\n你知道这东西真正的名字：海神之心。原著里它会被赐给唐三，海神第七考少了它，三叉戟根本拔不出来，九考者缺一考必死。守库的老供奉就在门外。","choices":[{"t":"滴血认主，带走宝罩","hint":"改写原著","need":{"战力":1200,"精神":60},"canonChange":{"node":"M58","inertia":5,"desc":"瀚海乾坤罩被盗，唐三拿不到海神之心"},"win":{"text":"你咬破指尖按在罩上，蓝光一闪，宝罩缩成掌心大小没入你的手腕。门外的老供奉察觉时，你已翻出三重宫墙。","d":{"item":"瀚海乾坤罩","精神":10,"体魄":8,"气运":6,"flags":["haishen_heart","overlimit"],"rep":{"天斗":-30},"trait":{"逆":2,"险":1},"shift":22,"world":{"offset":{"唐三":-8},"news":{"M58":"天斗镇国之宝瀚海乾坤罩失窃，唐三受封蓝昊王时未得赐宝"},"note":"唐三没有海神之心，海神第七考注定受阻"}}}},{"t":"立功求帝王一观","need":{"名望":45},"win":{"text":"你凭一身功名求见雪夜大帝。他命人捧出宝罩让你看了一炷香，那潮声在你心里响了很多天。","d":{"精神":5,"悟性":3,"rep":{"天斗":5}}}},{"t":"向雪夜道破它的真名","need":{"魅力":45},"win":{"text":"你低声说出海神之心四个字。雪夜大帝的手微微一颤，沉默良久，赐你一面金牌，可自由出入皇宫。","d":{"rep":{"天斗":12},"名望":5,"item":"天斗金牌","bonds":{"雪夜":15}}}},{"t":"转身离开","win":{"text":"潮声在身后渐渐远了，你没有回头，走出了宝库。","d":{}}}],"minLevel":65},{"id":"t_c_landian","name":"蓝电宗主的三块魂骨","tier":"神","place":"武魂城·长老殿地下密库","yearMin":2651,"yearMax":2657,"canon":"M51","owner":"下落不明（原著留白）","rumor":"猎魂之夜后有个传闻：蓝电霸王龙宗主死时身上的三块魂骨被人剥走，至今没人见过它们。","memory":"原著留白：猎魂之夜蓝电霸王龙宗被灭门，宗主身上的三块魂骨被剥走，从此下落不明。","text":"长老殿地下的密库一层套一层，你避开第三道魂导警戒时，一缕淡紫的电光从墙角的铁匣里漏了出来。打开匣子，三块魂骨静静躺在黑绒上，骨面上还缠着细碎的雷纹，偶尔噼啪一响，像一头被困的龙在低吼。\n这是蓝电霸王龙宗主身上剥下的骨。原著里没人知道它们在哪儿，现在你知道了。","choices":[{"t":"盗出三块魂骨","need":{"体魄":60,"精神":75},"win":{"text":"你把铁匣整个抱走，警钟在身后响成一片。你借着夜色冲出武魂城，怀里的雷纹一路噼啪作响，像在为你开路。","d":{"bone":[{"slot":"头","name":"蓝电龙首骨","desc":"蓝电霸王龙宗主遗骨，龙威慑魂，雷光护体","attrs":{"精神":8,"体魄":4}},{"slot":"躯干","name":"蓝电龙脊骨","desc":"雷电在脊骨中流转，受击时反震雷霆","attrs":{"体魄":10}},{"slot":"左臂","name":"蓝电龙爪骨","desc":"臂化龙爪，爪带紫电，可撕裂护体魂力","attrs":{"体魄":6,"精神":4}}],"名望":10,"rep":{"武魂殿":-30},"trait":{"逆":2,"险":2},"shift":10,"world":{"news":{"M51":"武魂城密库失窃，蓝电霸王龙宗主的三块魂骨重见天日"},"note":"蓝电三块魂骨被人从武魂殿盗出，大师得知后心结稍解"}}},"nonCombat":true,"hint":"以体魄越过密库机关、精神避开守卫；不与封号斗罗正面交战"},{"t":"只取一块，余骨还玉家","need":{"体魄":60,"精神":75},"win":{"text":"你只留下龙爪骨，其余两块寄回蓝电残部。玉天恒收到时，对着北方磕了三个头。","d":{"bone":{"slot":"左臂","name":"蓝电龙爪骨","desc":"臂化龙爪，爪带紫电，可撕裂护体魂力","attrs":{"体魄":6,"精神":4}},"bonds":{"玉天恒":25,"大师":15},"名望":6,"rep":{"武魂殿":-20},"trait":{"仁":1}}},"nonCombat":true,"hint":"以体魄越过密库机关、精神避开守卫；不与封号斗罗正面交战"},{"t":"记下位置告诉大师","need":{"精神":55},"win":{"text":"你没动铁匣，只把它的位置一字不差记下，写成密信寄给大师。听说他读信时，在灯下坐到了天亮。","d":{"bonds":{"大师":25},"名望":3,"flags":["lan_bones_known"],"trait":{"群":1}}}},{"t":"转身离开","win":{"text":"你合上铁匣，原样放回墙角，从来路悄悄退了出去。","d":{}}}],"minLevel":70},{"id":"t_c_xiehu","name":"十万年邪魔虎鲸王","tier":"神","place":"海神岛·外海邪魔虎鲸领域","yearMin":2653,"yearMax":2654,"canon":"M65","owner":"唐三（第八魂环、十万年左腿骨）","rumor":"海神岛的岛民说，外海有一族黑白相间的虎鲸，鲸王已活了十万年，专门撞沉渔船，连海神斗罗都头疼。","memory":"原著中，唐三在海神第四考剿灭邪魔虎鲸族，击杀十万年邪魔虎鲸王，得到第八魂环与十万年左腿骨，升到八十四级。","text":"海面下涌上来一大片黑白相间的影子，一头头虎鲸围成环形，把你困在中央。环的尽头，一头比海神殿还长的巨鲸浮出水面，背鳍像一面黑色战旗，眼里闪着邪异的红光。十万年的凶威压下来，海浪都矮了三分。\n原著里，这是唐三的第四考，也是他的第八魂环和左腿骨。缺了这一考，九考者必死。","choices":[{"t":"斩杀鲸王，夺环夺骨","hint":"改写原著 · 达到标示战力后可挑战，获胜才能取得奖励","need":{"战力":2800},"canonChange":{"node":"M65","inertia":5,"desc":"邪魔虎鲸王被抢杀，唐三海神第四考无从完成"},"win":{"text":"你在鲸群里杀了一天一夜，最后一刀斩开鲸王的头颅。十万年的红环从海底升起，一截黑白相间的腿骨随之浮上水面。","d":{"ring":{"beast":"邪魔虎鲸王","years":100000,"kind":"攻","skill":"虎鲸邪魔斧","desc":"双手化作虎鲸邪魔斧，劈开海浪与护体魂力","noBone":true},"bone":{"slot":"左腿","name":"十万年邪魔左腿骨","desc":"十万年邪魔虎鲸王遗骨，踏浪而行，腿出如碎牙斩","attrs":{"体魄":12,"精神":4},"years":100000},"等级":5,"体魄":8,"flags":["overlimit"],"名望":10,"trait":{"逆":2,"险":2},"shift":20,"world":{"offset":{"唐三":-6},"news":{"M65":"邪魔虎鲸王被外人斩杀，唐三的海神第四考陷入绝境"},"note":"唐三少了第八魂环与左腿骨，海神九考岌岌可危"},"rareClaim":["邪魔虎鲸王"]}},"battle":{"n":"邪魔虎鲸王","years":100000}},{"t":"替唐三挡住鲸群","need":{"战力":2800},"win":{"text":"你挡住了鲸群的左翼，让唐三专心对付鲸王。战后他浑身是血地游过来，冲你伸出了手。","d":{"bonds":{"唐三":25,"小舞":10},"名望":6,"体魄":5,"trait":{"群":1},"rareClaim":["邪魔虎鲸王"]}},"battle":{"n":"邪魔虎鲸王","years":100000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"斩一头落单的万年虎鲸","need":{"战力":2800},"win":{"text":"你只盯住鲸群边缘一头落单的万年虎鲸，斩杀后吞下了它的精元。","d":{"等级":2,"体魄":6}},"battle":{"n":"邪魔虎鲸王","years":100000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"转身离开","win":{"text":"你沉入水下，从鲸群的缝隙里游了出去。","d":{}}}],"minLevel":75},{"id":"t_c_baimu","name":"白目魔虎王","tier":"绝","place":"落日森林·深处断崖","yearMin":2650,"yearMax":2656,"canon":null,"owner":"戴沐白（白目魔虎王右臂骨）","rumor":"落日森林深处有一头额生白眼的魔虎，吼声能震落整片林子的叶子。","memory":"原著中，白目魔虎王的右臂骨最终归了戴沐白，成为他白虎强攻的又一张底牌。","text":"林子深处的断崖下，一头黑色魔虎伏在巨石上，额头正中多出一只白色的竖眼，冷冷地看着你。它每一次呼吸，四周的树叶都簌簌往下掉。它的右前爪比左爪粗了一圈，爪尖泛着金属一样的光。\n你认得这股气息。原著里，这块右臂骨后来落在戴沐白手里，成了白虎强攻的又一张底牌。","choices":[{"t":"斩杀虎王，夺右臂骨","need":{"战力":1500},"win":{"text":"白目魔虎扑了你七次，你躲了六次，第七次迎上去一刀斩断它的右爪。虎王倒下时，一截白骨从断爪里浮了出来。","d":{"bone":{"slot":"右臂","name":"白目魔虎王右臂骨","desc":"臂生虎爪，一击可撕裂护体魂力，附带震魂虎啸","attrs":{"体魄":10,"精神":3},"years":50000},"名望":5,"trait":{"险":1},"shift":4,"world":{"offset":{"戴沐白":-2},"note":"戴沐白少了白目魔虎王右臂骨，白虎强攻少了一张底牌"}}},"battle":{"n":"白目魔虎王","years":50000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"引戴沐白来一战","need":{"魅力":40},"win":{"text":"你把虎王的巢穴告诉戴沐白，还替他压阵。他拿到臂骨后，大笑着说欠你一顿酒。","d":{"bonds":{"戴沐白":20,"朱竹清":5},"名望":3,"trait":{"群":1}}}},{"t":"伏在崖上看它捕猎","need":{"悟性":50},"win":{"text":"你伏在崖上看了它三天捕猎，从那几记扑杀里悟出一套刁钻的爪法。","d":{"体魄":4,"悟性":3}}},{"t":"转身离开","win":{"text":"白色竖眼一直盯着你，直到你退出它的地盘。","d":{}}}],"minLevel":62},{"id":"t_c_anmo","name":"暗魔邪神虎的三色能量珠","tier":"神","place":"星斗大森林·核心圈外缘","yearMin":2656,"yearMax":2656,"canon":"M77","owner":"下落不明（被黑洞卷走）","rumor":"星斗深处传出一声虎啸，三种颜色的光冲天而起，又被一道黑漩卷走，不知去向。","memory":"原著中，唐三为昊天锤寻找魂环时与暗魔邪神虎等强大魂兽交手；邪神虎死后的三色能量珠被黑洞卷走，下落成谜。","text":"一头比山还高的黑虎倒在血泊里，双翼残破，胸口裂开一道大口子，三色光芒正从伤口里一缕缕往外涌，凝成一颗拳头大的珠子，红、黑、紫三色绞在一起缓缓旋转。半空里一道黑色漩涡正在成形，吸力越来越强，碎石和断木都在往里飞。\n原著里，这颗珠子就是在这里被卷走的，从此下落不明。","choices":[{"t":"冲到漩涡边截珠","need":{"战力":1700},"win":{"text":"你顶着吸力冲上去，一把攥住那颗珠子。漩涡把你半边身子扯得变了形，你硬拽着珠子摔回地面，三色能量顺着手臂灌进全身。","d":{"等级":5,"体魄":12,"精神":10,"气运":5,"伤势":30,"flags":["overlimit","sanse_pearl"],"trait":{"险":2,"逆":1},"shift":8,"world":{"news":{"M77":"暗魔邪神虎的能量珠没有被黑洞卷走，而是被一名人类截下"},"note":"原著里下落成谜的三色能量珠落到了你手里"}}}},{"t":"以精神力追踪漩涡","need":{"精神":75},"win":{"text":"你没有冲上去，而是以精神力死死咬住那道漩涡，直到它在天边消失。你记下了它去的方向。","d":{"精神":6,"悟性":5,"flags":["vortex_trace"],"item":"漩涡方位图"}}},{"t":"收取散落的光屑","chance":0.6,"win":{"text":"漩涡散去后，地上还残留着几缕三色光屑，你盘膝坐下，一一吸入体内，筋骨隐隐作响。","d":{"等级":1.5,"体魄":4}},"lose":{"text":"光屑里的残余邪气钻进经脉，你在林中吐了三天黑血。","d":{"伤势":30}}},{"t":"转身离开","win":{"text":"你退到林边，看着那道漩涡把一切卷走，又归于平静。","d":{}}}],"minLevel":85},{"id":"t_c_yihuang","name":"千钧蚁皇","tier":"神","place":"星斗大森林·核心圈黄土蚁原","yearMin":2656,"yearMax":2656,"canon":"M77","owner":"唐三（昊天锤魂环）","rumor":"星斗核心圈有一片寸草不生的黄土地，地下挖满了蚁穴，有人说一只蚂蚁就能扛起一座城门。","memory":"原著中，唐三为昊天锤补齐魂环，与千钧蚁皇等十万年级魂兽交手，最终连吸三环，昊天锤满八环，达到九十五级巅峰。","text":"黄土地一踩就塌，脚下全是密密麻麻的蚁道。最深处的蚁巢里，一只金褐色的巨蚁伏在王座似的土台上，个头不过一头牛大，却压得四周的土层都在往下沉。它慢慢抬起一只前肢，你身上像突然压了一座山。\n千钧之力。原著里，唐三的昊天锤正需要这样的魂环。四周的蚁群停下了动作，千万只触角齐齐转向你。","choices":[{"t":"斩杀蚁皇，夺其魂环","need":{"战力":2800},"win":{"text":"你顶着千钧之重一寸寸挪到它面前，一刀砸碎它的头甲。土黄的十万年魂环升起，你的每一拳从此都重若千钧。","d":{"ring":{"beast":"千钧蚁皇","years":100000,"kind":"攻","skill":"千钧重压","desc":"以千钧之力压落，目标周身重力倍增、寸步难行"},"体魄":10,"等级":3,"flags":["overlimit"],"trait":{"逆":1,"险":1},"shift":10,"world":{"offset":{"唐三":-2},"news":{"M77":"千钧蚁皇被人斩杀，唐三的昊天锤少吸了一环"},"note":"唐三昊天锤少了一个魂环，九十五级巅峰来得更迟"},"rareClaim":["千钧蚁皇"]}},"battle":{"n":"千钧蚁皇","years":100000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"与蚁皇立契为盟","need":{"精神":75,"魅力":45},"win":{"text":"你收起刀，以精神力传去一段善意。蚁皇沉默许久，放下前肢，让你带走一片它亲手褪下的蚁甲。","d":{"bone":{"slot":"外附","name":"千钧蚁甲","desc":"蚁皇褪下的甲壳，覆身时重若千钧、刀枪难入","attrs":{"体魄":8,"精神":4}},"rep":{"魂兽":15},"trait":{"仁":1}}}},{"t":"在蚁道里寻蚁晶","chance":0.55,"win":{"text":"你在一条废弃的蚁道尽头挖出一块金褐色的晶体，握在手里沉得出奇，像攥着一块小小的山。","d":{"体魄":5,"item":"千钧蚁晶"}},"lose":{"text":"蚁道塌了，你被埋在土里，挣扎了大半天才爬出来，浑身是伤。","d":{"伤势":30}}},{"t":"转身离开","win":{"text":"身上的重压一点点退去，你踩着松动的黄土离开了蚁原。","d":{}}}],"minLevel":85},{"id":"t_c_mojingwang","name":"深海魔鲸王","tier":"神","place":"深海·魔鲸海域","yearMin":2657,"yearMax":2657,"canon":"M79","owner":"唐三（鲸珠、深海魔鲸躯干骨）","rumor":"人类的船从不敢驶进那片黑水，老水手说那里沉睡着海里最古老的王，它翻个身就是一场海啸。","memory":"原著中，唐三入海斩杀深海魔鲸王，取鲸珠重铸海神之心，得到深海魔鲸躯干骨，升到九十九级，完成海神第八考。","text":"黑水下面没有光，只有一头山脉般的巨影在缓缓游动。它每摆一下尾，海流就翻转一次，连你的魂力都被压得只剩一线。巨影的额头里透出一点幽蓝，那是它的鲸珠；它的脊背下，藏着一截能化为神铠的躯干骨。\n原著里，唐三要靠这两样完成海神第八考，重铸破碎的海神之心。你此刻比他早到了一步。","choices":[{"t":"斩杀鲸王，夺珠夺骨","hint":"改写原著 · 达到标示战力后可挑战，获胜才能取得奖励","need":{"战力":6500},"canonChange":{"node":"M79","inertia":5,"desc":"深海魔鲸王被抢杀，唐三无法重铸海神之心"},"win":{"text":"你在黑水里和它厮杀了三天，最后从它额头剜出鲸珠。巨鲸沉入海沟，一截幽蓝的躯干骨浮到你面前。","d":{"bone":{"slot":"躯干","name":"深海魔鲸躯干骨","desc":"魔鲸王遗骨，覆体如深海神铠，可在万米深海行动自如","attrs":{"体魄":15,"精神":8},"years":1000000},"item":"鲸珠","等级":6,"体魄":10,"精神":8,"flags":["overlimit"],"名望":15,"trait":{"逆":2,"险":2},"shift":25,"world":{"offset":{"唐三":-3},"news":{"M79":"深海魔鲸王被一名人类斩杀，鲸珠下落不明，唐三的第八考陷入僵局"},"note":"唐三没有鲸珠，海神之心无法重铸，成神之路被截断"},"rareClaim":["深海魔鲸王"]}},"battle":{"n":"深海魔鲸王","years":1000000}},{"t":"助唐三斩鲸，只取鲸脑","need":{"战力":6500},"win":{"text":"你替唐三缠住鲸尾。鲸王倒下后，他收好鲸珠，把鲸脑分给了你。浩瀚的精神力冲进识海，你昏睡了一天一夜。","d":{"精神":12,"悟性":5,"等级":2,"bonds":{"唐三":25},"trait":{"群":1},"rareClaim":["深海魔鲸王"]}},"battle":{"n":"深海魔鲸王","years":1000000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"转身离开","win":{"text":"你浮出黑水，海面上的阳光刺得睁不开眼。那头王仍在深处沉睡。","d":{}}}],"minLevel":90},{"id":"t_s2_shengming","name":"生命之湖","tier":"神","place":"星斗大森林·核心圈","yearMin":2642,"yearMax":2657,"canon":null,"owner":"帝天（二三部中的兽神居所）","rumor":"有猎魂队说，星斗大森林最深处有一片终年不冻的湖，湖边连十万年魂兽都低着头走路，靠近的人类没有一个回来。","memory":"二三部中，生命之湖是星斗大森林的魂兽圣地，兽神帝天常居于此，只有顶尖魂兽可以进入。","text":"林子越走越静，最后连虫鸣都没了。树冠豁然散开，一片翠绿的湖水躺在谷底，水汽里全是浓得发甜的生命气息，你只吸了一口，骨缝里的旧伤就开始发痒。湖心的水面忽然隆起，一只金色竖瞳从水下睁开，比你整个人还大。\n「人类。」那声音直接落在你脑海里，「八十万年来，敢走到这里的，你是第三个。说吧，来求什么，还是来求死。」\n帝天没有离开湖心。他的黑龙领域笼罩整片水岸：兽神本体战力约 12000，已超过普通极限斗罗。得到允许可以在岸边修行；若强取湖心本源，面对的就是帝天，而非外围守卫。","choices":[{"t":"陈明来意，请求湖岸洗髓","hint":"先以名望与心神取得允许；仅借湖岸生机，不触碰湖心本源","need":{"名望":45,"体魄":75,"精神":85,"魅力":50},"win":{"text":"帝天允许你坐在湖岸，却在你身后划下一道不可越过的黑线。七日洗髓之后，旧伤尽愈；他记住了你的名字，也说得明白：想再进一步，就回来承受真正的龙威。","d":{"等级":2,"体魄":10,"精神":6,"伤势":-100,"名望":3,"reveal":["帝天"],"bonds":{"帝天":15},"flags":["s_ditian_mercy"],"world":{"note":"帝天准许你借用湖岸生机，并留下再来试炼的约定"},"uniqueReward":"t_s2_shengming"}},"lose":{"text":"金瞳里闪过一丝厌烦，一股威压碾下来，你七窍流血被抛出谷口，好在还留着命。","d":{"伤势":60,"reveal":["帝天"]}},"nonCombat":true},{"t":"趁其不备，偷取湖心精华","hint":"帝天本体亲自镇守，战力 12000；夺取会破坏与魂兽一方的信任","need":{"战力":12000,"体魄":110,"精神":110},"win":{"text":"你顶住黑龙领域，在龙神爪落下前抢下一缕湖心本源。帝天为守住湖底没有追出核心圈；这不是斩杀兽神，真正的代价是森林从此把你视作掠夺者。","d":{"等级":3,"体魄":14,"精神":8,"名望":5,"reveal":["帝天"],"bonds":{"帝天":-60},"rep":{"魂兽":-35},"flags":["s_dragon_raider"],"world":{"note":"你强取湖心本源，帝天封闭了通往龙眠之渊的交涉道路"},"uniqueReward":"t_s2_shengming"}},"lose":{"text":"龙神爪压碎了你的护体魂力。你抛下器物，带着重伤逃出核心圈，湖心本源仍在兽神守护之下。","d":{"伤势":65,"精神":-4,"reveal":["帝天"],"bonds":{"帝天":-20},"flags":["s_dragon_raider"]}},"battle":{"n":"帝天","lv":99,"power":12000}},{"t":"以护林约定换取试炼资格","need":{"名望":55,"悟性":85,"魅力":60},"win":{"text":"帝天并不需要一套人类暗器。他问的是猎魂队、商路和被毁去的巢穴。你们议定核心区的禁猎界线，他交给你一枚旧鳞制成的护符，允许你日后再来接受龙威试炼。护符并非从他身上剥下的完整魂骨。","d":{"精神":6,"悟性":6,"名望":4,"item":"黑龙护林符","reveal":["帝天"],"bonds":{"帝天":20},"rep":{"魂兽":10},"flags":["s_ditian_oath"],"uniqueReward":"t_s2_shengming"}},"lose":{"text":"帝天看了一眼便失了兴致，只说了句「雕虫小技」，湖面掀起浪头把你推回了林中。","d":{"名望":-2,"reveal":["帝天"]}},"nonCombat":true,"hint":"承诺不再掠夺核心圈本源；获得护符与后续试炼资格"},{"t":"转身离开","win":{"text":"你低下头，一步一步倒退出山谷。直到走出很远，那道金色目光才从你背上移开。","d":{}}}],"minLevel":80,"requiredNPCs":["帝天"]},{"id":"t_s3_longmian","name":"龙眠之渊","tier":"神","place":"星斗大森林·生命之湖地底","yearMin":2648,"yearMax":2657,"canon":null,"owner":"银龙王（三部苏醒，化名古月娜）","rumor":"星斗大森林深处偶有地鸣，像有什么庞然大物在地底翻了个身。附近的魂兽会成群伏地不动，连十万年的也不例外。","memory":"三部揭示：龙神被修罗神劈成金银两半，银龙王逃到斗罗大陆，由帝天护着在星斗大森林地下长眠，两万年后才醒来。","text":"地缝深处是一条看不到尽头的银色甬道，墙上每一片鳞纹都在缓慢呼吸。甬道尽头，一团月光似的银辉蜷成一团，里面隐约是一条龙的轮廓，小得像只猫，又大得像整片天空。你刚踏进一步，背后就响起帝天压低的嗓音：\n「再往前一步，我就把你的魂捏碎。」\n可就在这时，那团银辉里有一只眼睛，微微睁开了一条缝。\n这里苏醒的只是梦中的一缕意识，不是银龙王完整醒来。梦境外的本源结界战力约 24000；银龙王真身按本游戏的神级尺度为 48000，不能用普通百万年魂兽的年限公式折算。帝天仍守着入口，先前若曾强取湖心本源，便无从获得允许。","choices":[{"t":"静立不动，以精神力回应","hint":"须先获帝天认可；精神 120、悟性 100，回应一缕梦中意识","need":{"等级":90,"精神":120,"悟性":100},"win":{"text":"你没有伸手索取，而是让自己的精神之海安静下来。银辉在梦中与你共鸣，教你辨认相互排斥的元素。她仍在沉睡，你得到的只是一次指引；若能把心神修炼到足够稳固，将来还可以回来承接龙纹。","d":{"精神":12,"悟性":10,"ringUp":{"target":"lowest","mul":1.15},"reveal":["银龙王","帝天"],"flags":["s_yinlong_glance","overlimit"],"bonds":{"帝天":10},"uniqueReward":"t_s3_longmian"}},"lose":{"text":"那只眼睛又合上了，帝天却已经出手。你被一尾扫出地缝，精神之海裂开一道口子。","d":{"精神":-6,"伤势":55,"reveal":["银龙王","帝天"]}},"cond":{"anyFlag":["s_ditian_mercy","s_ditian_oath","s_ditian_trial"]},"nonCombat":true},{"t":"强行穿过银龙本源结界","need":{"等级":99,"战力":24000,"体魄":140,"精神":140},"win":{"text":"你以全部魂力撑开一道缝隙，银色烙印却在刺入识海时反噬。帝天将你逐出地底，结界重新合拢。你夺得一道残缺龙纹，银龙王并未苏醒，更没有化成你的魂环或魂骨。护林的交涉道路就此断绝。","d":{"精神":14,"体魄":10,"伤势":40,"ringUp":{"target":"highest","mul":1.2},"reveal":["银龙王","帝天"],"flags":["s_dragon_mark","s_dragon_raider"],"bonds":{"帝天":-60},"rep":{"魂兽":-30},"uniqueReward":"t_s3_longmian"}},"lose":{"text":"银色结界反卷而来，你的精神防御接连破碎。你被抛回地面，靠同行者救治才保住性命，无法取得龙纹。","d":{"精神":-8,"伤势":75,"flags":["s_dragon_raider"],"bonds":{"帝天":-30}}},"battle":{"n":"银龙王·沉睡结界","lv":100,"power":24000},"hint":"面对战力 24000 的本源反击；破开一层结界不等于击败银龙王真身"},{"t":"向帝天承诺守口如瓶","need":{"名望":45,"魅力":60},"win":{"text":"帝天盯了你很久，最终收回杀意，把你送回地面，还丢下一句话：将来人类若要动这片林子，你记得今天。","d":{"名望":3,"气运":4,"reveal":["帝天"],"bonds":{"帝天":15},"flags":["s_ditian_oath"],"uniqueReward":"t_s3_longmian"}},"lose":{"text":"帝天不信人类的誓言，抹去了你这段记忆。你在林子边醒来，只觉得头痛欲裂。","d":{"精神":-4,"伤势":20}},"nonCombat":true,"hint":"退出地底，承担守护秘密的约定；不会直接获得银龙之力"},{"t":"转身离开","win":{"text":"你转身就走，一路不敢回头。身后的地缝无声合拢，好像从没打开过。","d":{}}}],"minLevel":85,"requiredNPCs":["帝天","银龙王"],"cond":{"notFlag":"s_dragon_raider"}},{"id":"t_s2_bingsui","name":"万年冰髓矿脉","tier":"神","place":"极北之地·无名冰窟","yearMin":2640,"yearMax":2657,"canon":null,"owner":"无主","rumor":"极北的冰原猎人说，有一道冰缝底下冒出的寒气能把魂力冻住。","memory":"二部中，极北冰窟里藏着成片的万年冰髓，是精神系魂师梦寐以求的修炼宝物。","text":"冰缝下面是一整片乳白色的冰髓矿脉，寒意凝成雾，在你睫毛上结霜。矿脉深处有一个被啃得坑坑洼洼的凹坑，像是曾有什么巨大的东西在这里沉睡过很多年，又早已离开。\n冰髓在幽暗里泛着微光，每一块都能冻住魂力，也能淬炼精神之海。","choices":[{"t":"凿取一块万年冰髓","need":{"体魄":35},"chance":0.6,"win":{"text":"你小心敲下拳头大的一块冰髓，冰蚕翻了个身继续睡。冰髓入腹，一股极寒直冲精神之海，冻住又化开，你的魂力凝实了一大截。","d":{"等级":4,"精神":10,"体魄":4,"item":"万年冰髓"}},"lose":{"text":"敲击声惊动了冰蚕，一股精神冲击像冰锥扎进脑海。你踉跄逃出冰缝，半个月都在头疼。","d":{"精神":-5,"伤势":35}}},{"t":"转身离开","win":{"text":"你没敢惊动它，悄悄爬出冰缝。风雪很快盖住了那道裂口。","d":{}}}],"minLevel":30},{"id":"t_s2_xianling","name":"妖眼魔树下的仙灵草","tier":"绝","place":"星斗大森林·外围西林","yearMin":2638,"yearMax":2657,"canon":null,"owner":"万妖王的领地（二部中称其靠吞噬仙灵草蜕变）","rumor":"星斗西边有片林子，树皮上长着一只只闭着的眼睛。采药人说那里有会说话的草，可去找的人，最后都被树根拖进了地里。","memory":"二部提到，仙灵草天生有灵智，喜伴妖眼魔树而生；一株妖眼魔树吞了它，两者融合，成了统御星斗外围的万妖王。","text":"这片林子里每一棵树都在看你。树皮上的眼睛一只接一只睁开，枝条无风自动。林子正中，一株半透明的小草从老树根缝里探出头，叶尖挂着露珠，竟奶声奶气地开口：「快走呀，它醒着呢。」\n话音刚落，你脚下的泥土拱起，一条比腰还粗的树根缓缓缠了上来，远处传来一声沉闷又古老的叹息。","choices":[{"t":"抢下仙灵草就跑","need":{"战力":750},"chance":0.4,"win":{"text":"你斩断树根，一把连泥带草捧起，拼命冲出林子。仙灵草在你掌心哭了一路，最后还是乖乖化成一股清流涌入眉心。","d":{"等级":3,"精神":10,"悟性":6,"reveal":["万妖王"],"trait":{"险":1}}},"lose":{"text":"整座林子活了过来，万千枝条把你缠成一个茧。你拼尽全力才挣脱，浑身是血。","d":{"伤势":65,"reveal":["万妖王"]}}},{"t":"请小草与你同行","need":{"魅力":30},"chance":0.5,"win":{"text":"小草犹豫半天，从树根里钻了出来，跳上你的肩头。老树没有发作，只是所有眼睛都看着你离开。","d":{"精神":6,"气运":6,"悟性":4,"item":"仙灵草（有灵）","reveal":["万妖王"],"trait":{"仁":1}}},"lose":{"text":"小草摇了摇头缩回根缝。树根把你轻轻推出林子，像在赶一只苍蝇。","d":{"伤势":10,"reveal":["万妖王"]}}},{"t":"转身离开","win":{"text":"你后退着离开，枝条慢慢垂下，那些眼睛一只接一只闭上。","d":{}}}],"minLevel":70},{"id":"t_s2_xiongjun","name":"暗金爪痕","tier":"绝","place":"星斗大森林·中圈北麓","yearMin":2640,"yearMax":2657,"canon":null,"owner":"熊君（二三部十大凶兽第六）","rumor":"猎魂队在星斗北麓发现一排爪痕，石壁被划开半尺深，切口边缘的空气至今还在扭曲，像被撕开的布。","memory":"二三部中，熊君是暗金恐爪熊，身负比蒙血脉，利爪能撕裂空间，曾抓伤帝天，后被帝天教训。","text":"爪痕一路延伸到山坳里。坳中卧着一头暗金色的巨熊，像一座小山，正把一头万年魂兽的骨头嚼得咯吱作响，四周的树全被拦腰削断，切口平滑得像镜面。它抬起头，琥珀色的眼睛里没有好奇，只有被打扰的不耐烦。\n它慢慢站起身，一只前爪随意地往空中一划，你面前一丈处的空间就裂开了一道黑缝，又缓缓合拢。","choices":[{"t":"拔出武魂迎战","hint":"四十多万年的凶兽 · 达到标示战力后可挑战，获胜才能取得奖励","need":{"战力":5246},"chance":0.18,"win":{"text":"你在空间裂缝之间辗转腾挪，硬是撑了一百招。巨熊停下来，咧嘴像在笑，丢下一截断掉的暗金爪尖便走了。","d":{"等级":4,"体魄":10,"reveal":["熊君"],"bone":{"slot":"右臂","name":"暗金恐爪臂骨","desc":"熊君的断爪化入臂骨，挥击时可在近身处撕开细小空间裂缝。","attrs":{"体魄":8},"years":470000}}},"lose":{"text":"第三招你就没躲开，一爪落下，连同你身后的山石一起被撕成两半。","d":{"death":"与熊君硬拼，被撕裂空间的熊爪斩断","reveal":["熊君"]}},"battle":{"n":"熊君","years":470000}},{"t":"献上带来的烈酒与蜂蜜","need":{"金魂币":300},"chance":0.6,"win":{"text":"巨熊嗅了嗅，一口吞下整坛蜂蜜，打着饱嗝趴回去。它用爪背把一块金色的石头拨到你脚边，是它磨爪用的星金矿。","d":{"金魂币":1500,"体魄":4,"气运":3,"reveal":["熊君"]}},"lose":{"text":"它嫌不够，一巴掌拍翻了你，又把剩下的酒全喝了。你断了两根肋骨。","d":{"伤势":40,"金魂币":-100,"reveal":["熊君"]}}},{"t":"转身离开","win":{"text":"你慢慢退出山坳，巨熊早已低头继续啃骨头，懒得看你一眼。","d":{}}}],"minLevel":70},{"id":"t_s2_chiwang","name":"赤焰巡界","tier":"珍","place":"星斗大森林·核心圈外缘","yearMin":2636,"yearMax":2657,"canon":null,"owner":"赤王（二部中帝天的部下）","rumor":"核心圈边上常有三道赤红火光同时亮起，像三盏灯笼。见过的人说，那是一条狗，三个头，比城门还高。","memory":"二部中，赤王是三头赤魔獒，身怀部分真龙血脉，受帝天差遣做护卫，修为约三十一万年。","text":"你刚越过一条溪，三团火光就从三个方向同时亮起。三颗獒首从林间探出，赤红鬃毛像在燃烧，每颗头上的眼睛都盯着你不同的部位：左边看你的手，右边看你的脚，中间那双直勾勾盯着你的眼睛。脚下的落叶被热浪烤得卷了边。中间那颗头开口，声音像闷雷：\n「再往里，是兽神的地方。人类，你是走错了，还是不想活了？」","choices":[{"t":"请它指点一招","need":{"战力":4500},"chance":0.45,"win":{"text":"赤王三首同时喷出火焰，你在火海里硬撑了一炷香。它收了火，评价一句「骨头还行」，又叫来一头族中老獒，让你亲手猎下它的魂环。","d":{"等级":3,"体魄":8,"reveal":["赤王"],"ring":{"beast":"赤魔獒（赤王族裔）","years":50000,"kind":"攻","skill":"三首赤炎","desc":"赤王指给你一头老獒，三道火焰同时喷吐"}}},"lose":{"text":"三首火焰比你想的烫十倍，你被烧得皮开肉绽，滚进溪水里才保住一条命。","d":{"伤势":50,"reveal":["赤王"]}},"battle":{"n":"赤王","years":300000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"老实说是走错了","win":{"text":"赤王打量你半天，左边那颗头打了个哈欠。它用鼻子把你拱回外圈，还顺手吓跑了附近埋伏你的一群魂兽。","d":{"气运":3,"伤势":-10,"reveal":["赤王"]}}},{"t":"转身离开","win":{"text":"你没等它说完就退回溪对岸，三团火光在林间久久未灭，像三只眼睛一直目送你离开。","d":{}}}],"minLevel":65},{"id":"t_s2_biji","name":"翡翠天鹅之羽","tier":"绝","place":"星斗大森林·碧水泽","yearMin":2640,"yearMax":2657,"canon":null,"owner":"碧姬（二三部中的森林守护者）","rumor":"受了重伤闯进星斗深处的魂师里，有人奇迹般活着出来，说迷糊中看见一只翠绿天鹅从头顶飞过，醒来伤就好了一半。","memory":"二三部中，碧姬是翡翠天鹅族长，最强治愈系魂兽，主张人类与魂兽和解，常被传为帝天所爱。","text":"泽水碧得发亮，水面上停着一只翠绿的天鹅，羽毛每一根都像打磨过的翡翠。你还没开口，它已经化成一个穿碧裙的女子，赤足踩在水面上，轻声叹气：\n「又是一个带着一身伤来的孩子。人类和魂兽，非要这样杀来杀去吗？」\n她看着你，眼神温柔得近乎悲伤。泽边伏着几只受伤的幼兽，正被淡淡的碧光包裹着，伤口一点点愈合。","choices":[{"t":"请她治伤","win":{"text":"她抬手洒下一片碧光，你身上所有旧伤新伤都在愈合，连幼年落下的暗疾也一并消散。","d":{"伤势":-100,"体魄":6,"气运":3,"reveal":["碧姬"],"trait":{"仁":1}}}},{"t":"向她讨一根翡翠翎羽","hint":"她看重的是心性","need":{"魅力":40},"chance":0.5,"win":{"text":"碧姬想了想，从翅下拔下一根翎羽放进你掌心：「拿着它，下次别再杀那么多。」翎羽化入你的肋骨，生机绵绵不绝。","d":{"reveal":["碧姬"],"bone":{"slot":"躯干","name":"翡翠天鹅翎骨","desc":"碧姬所赠，伤势会缓缓自愈，治疗类魂技效果翻倍。","attrs":{"体魄":6,"魅力":6}},"bonds":{"碧姬":15}}},"lose":{"text":"碧姬摇头：「你身上杀气太重。」她治好了你的伤，却不肯多给什么。","d":{"伤势":-50,"reveal":["碧姬"]}}},{"t":"承诺此后不猎幼兽","win":{"text":"碧姬笑了，在你眉心点了一下。那之后你走在林子里，魂兽对你的敌意都淡了许多。","d":{"气运":6,"名望":2,"reveal":["碧姬"],"trait":{"仁":2},"flags":["s_biji_oath"],"bonds":{"碧姬":10}}}}],"minLevel":72},{"id":"t_s3_ziji","name":"紫雾龙影","tier":"绝","place":"星斗大森林·核心圈东谷","yearMin":2645,"yearMax":2657,"canon":null,"owner":"紫姬（三部十大凶兽之一）","rumor":"核心圈东侧的山谷常年笼着紫雾，雾里有龙吟。闯进去的魂师说，雾中站着一个紫衣女人，美得让人忘了跑。","memory":"三部中，紫姬是地狱魔龙王，龙族，居星斗核心圈，修为约三十万年，曾引唐舞麟与古月娜去见帝天。","text":"紫雾浓得化不开，脚下的草都是暗紫色。雾中有个紫衣女子倚着一棵枯树，指尖缠着一缕黑紫色的火焰，像在把玩一条小蛇。她抬眼看你，瞳孔是竖着的。\n「小家伙，能走到这里，有点本事。」她笑意盈盈，「我这几天正闷，陪我打一场，赢了有赏；输了嘛……就留下来当我的花肥。」","choices":[{"t":"应战","need":{"战力":3873},"chance":0.2,"win":{"text":"你被魔龙之炎烧得半身焦黑，却一步没退。紫姬收了手，眼里多了几分欣赏，把一缕地狱魔龙之炎封进你的掌心。","d":{"等级":5,"体魄":6,"精神":6,"reveal":["紫姬"],"ring":{"beast":"地狱魔龙之炎（紫姬所赐）","years":120000,"kind":"攻","skill":"魔龙紫炎","desc":"紫姬封入的一缕龙炎，焚烧一切生机","noBone":true,"special":true},"flags":["overlimit"]}},"lose":{"text":"紫色火焰沾身即燃，你在雾中烧成一捧灰，只剩她一声意兴阑珊的叹息。","d":{"death":"与紫姬对战，被地狱魔龙之炎焚尽","reveal":["紫姬"]}},"battle":{"n":"紫姬","years":200000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"说个笑话逗她开心","need":{"魅力":35},"chance":0.5,"win":{"text":"紫姬先是一愣，然后笑得花枝乱颤。她随手丢给你一片紫色龙鳞当赏钱，说这玩意 。猎人说里面有只蝎子，尾巴一甩能把一座冰山劈成两半，脾气还特别坏。","memory":"二部中，冰帝是冰碧帝皇蝎，极北三大天王之一，约三十九万九千年，卡在四十万年大劫前，暗恋雪帝。融合需要体魄至少 50，留下四十万年本命魂环与四十万年躯干骨。","text":"冰谷里的冰是碧绿的，透着幽光。一只翡翠色的巨蝎盘踞在谷底，尾钩高高翘起，每一节甲壳都像打磨过的碧玉。它用螯钳指着你，声音却是个脆生生的少女嗓：\n「哪来的人类？本帝心情不好，你最好有个好理由，不然就留在这儿当冰雕吧！」\n谷壁上果然立着好几座人形冰雕，姿势千奇百怪，有的还保持着逃跑的样子。","choices":[{"t":"请冰帝融入冰蚕空武魂","hint":"需要天梦撑开的冰系空武魂、精神 60、体魄 50；觉醒冰帝武魂，并获得四十万年魂环与四十万年躯干骨；融合时获得一次两级魂力，主武魂瓶颈处先蓄积","cond":{"flag":"s_bingcan_host","iceVessel":true},"need":{"精神":60,"体魄":50},"win":{"text":"冰帝盯着你眉心里探出头的天梦冰蚕看了很久：「你这条肥虫子……也罢，四十万年大劫我扛不过去，与其被雷劈死，不如跟着你。」碧绿冰光没入你体内，冰蚕与冰蝎合而为一。冰帝的本源凝成一道四十万年红色魂环，附于冰碧帝皇蝎武魂；一块四十万年躯干骨随之留在你手中，可在行囊融合。融合后的本源也推动了你的魂力成长，主副武魂的环位仍分别计算。","d":{"wuhun2":{"name":"冰碧帝皇蝎","tier":"神","system":"极致之冰","desc":"天梦冰蚕撑开的空武魂里住进了冰帝，觉醒为极致之冰的第二武魂，寒气可冻结魂力","act":{"n":"极致之冰","d":"以极致之冰淬体：体魄 +4、战力永久 +25"},"power":0.3,"ice":1,"source":"bingdi"},"体魄":12,"精神":8,"reveal":["冰帝"],"flags":["s_bingdi_fused"],"world":{"note":"冰帝融入你的武魂，极北三大天王少了一位"},"rareClaim":["冰碧蝎"],"rareStatus":"已封魂","iceFusion":true}}},{"t":"与她过招切磋","need":{"战力":4978},"chance":0.25,"win":{"text":"碧绿冰晶铺天盖地，你硬是在冰暴中站住了。冰帝哼了一声，甩给你一截脱下的蝎甲，碧光在你脊背间流转。","d":{"等级":4,"reveal":["冰帝"],"bone":{"slot":"躯干","name":"冰碧帝皇蝎甲骨","desc":"冰帝蜕下的甲壳化为躯干骨，周身自带碧冰护甲，冰属性魂技威力大增。","attrs":{"体魄":8,"精神":4},"years":400000}}},"lose":{"text":"一记冰碧蝎尾正中胸口，你被钉在冰壁上，碧冰顺着伤口爬满全身。","d":{"death":"冰帝蝎尾贯胸，冻毙于碧冰谷","reveal":["冰帝"]}},"battle":{"n":"冰帝","years":400000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"说起冰原深处的白衣女子","hint":"她有个心事","need":{"魅力":30},"chance":0.55,"win":{"text":"冰帝立刻不凶了，扭扭捏捏打听雪帝的事。你说了半天，她一高兴，送了你一块碧冰灵晶。","d":{"精神":6,"气运":4,"item":"碧冰灵晶","reveal":["冰帝"],"bonds":{"冰帝":15}}},"lose":{"text":"她听到一半忽然恼羞成怒，尖叫着说本帝才没有，一尾巴把你扫出了冰谷，你摔得眼冒金星。","d":{"伤势":35,"reveal":["冰帝"]}}},{"t":"转身离开","win":{"text":"你拱手告罪，倒退着走出冰谷。身后传来一声不满的哼，一块碧冰砸在你脚边，算是送客。","d":{}}}],"minLevel":70},{"id":"t_s2_taitan","name":"百丈雪魔","tier":"绝","place":"极北之地·外围冰原","yearMin":2638,"yearMax":2657,"canon":null,"owner":"泰坦雪魔王（二部中极北三大天王之一）","rumor":"极北外围的冰原上有座会走路的雪山，所过之处冰层齐齐裂开。有人说它是在找什么，又有人说它是在发脾气。","memory":"二部中，泰坦雪魔王身负冰神血脉，身高逾百米，力大无穷，至少二十万年；曾追求雪帝被打成重伤，养了近千年。","text":"地面每隔几息就震一下。你爬上冰丘，看见一个白毛巨人正一步一个深坑地走过冰原，身高超过百米，肩上落满积雪。它停下来，低头看向你，鼻孔喷出的白气把冰丘吹平了一半。\n「人类……」它的声音像雪崩，「你，身上，有她的味道吗？」\n它巨大的鼻子凑近，一下一下地嗅，眼神竟有几分可怜。","choices":[{"t":"与它比拼蛮力","need":{"体魄":45},"chance":0.35,"win":{"text":"你和巨人掌对掌僵持了整整一刻，它咧嘴大笑，一拳砸开冰层，把底下的一块冰神血晶丢给你。","d":{"等级":3,"体魄":12,"reveal":["泰坦雪魔王"],"item":"冰神血晶"}},"lose":{"text":"巨人只是轻轻一按，你连人带冰丘一起陷进了冰层，挣扎了一整夜才爬出来。","d":{"伤势":60,"reveal":["泰坦雪魔王"]}}},{"t":"说你没见过她","win":{"text":"巨人失望地叹了一口气，吹得你倒退十丈。它转身离开，脚印里却留下几株被踩出来的冰魄草。","d":{"精神":4,"气运":3,"reveal":["泰坦雪魔王"]}}},{"t":"转身离开","win":{"text":"你趴在冰丘后一动不动，屏息等那座会走路的雪山远去，直到地面不再震动才敢抬头。","d":{}}}],"minLevel":60},{"id":"t_s2_bingxiong","name":"冰熊王的猎场","tier":"珍","place":"极北之地·冰海岸","yearMin":2636,"yearMax":2657,"canon":null,"owner":"冰熊王（二部中由雪帝照看长大）","rumor":"极北冰海岸边，有头白熊专爱偷渔民的鱼，一掌拍下去冰面裂开半里。奇怪的是它从不伤人，抢完就跑。","memory":"二部中，冰熊王由雪帝照料长大，约二十万年，近战可与泰坦雪魔王一较高下，后成为霍雨浩的魂灵。","text":"你在海岸边烤着刚钓上的鱼，冰面忽然隆起，一头比房子还大的白熊探出脑袋，鼻子一抽一抽地嗅着烤鱼的香味。它看看鱼，又看看你，眼神里没有杀意，只有赤裸裸的馋。\n然后它咧开大嘴，把爪子搭在了你的烤架上。爪子落下的地方，冰面无声地裂开一圈细纹。你忽然意识到，这头熊身上的寒气，比你见过的任何魂兽都要深厚，深厚得不像是这片海岸该有的东西。","choices":[{"t":"把鱼让给它","win":{"text":"白熊吃得心满意足，临走拍了拍你的头，一股寒气灌进体内，你的骨头硬了一截。之后几年，它常常来蹭你的烤鱼。","d":{"体魄":6,"气运":4,"reveal":["冰熊王"],"bonds":{"冰熊王":20},"trait":{"仁":1}}}},{"t":"护住烤鱼，跟它过两招","need":{"战力":3873},"chance":0.4,"win":{"text":"白熊乐了，跟你在冰面上扭打成一团。打完它心满意足地吃了鱼，还把一枚掉落的冰熊爪骨留给了你。","d":{"等级":2,"体魄":6,"reveal":["冰熊王"],"bone":{"slot":"左臂","name":"冰熊王掌骨","desc":"冰熊王打闹时掉下的旧爪，挥掌带起极寒冰浪。","attrs":{"体魄":6},"years":200000}}},"lose":{"text":"它只是轻轻拍了你一下，你就飞出去三十丈，鱼也没了。","d":{"伤势":45,"reveal":["冰熊王"]}},"battle":{"n":"冰熊王","years":200000},"hint":"达到标示战力后可挑战，获胜才能取得奖励"},{"t":"转身离开","win":{"text":"你扔下烤架就跑，跑出老远回头一看，白熊正抱着烤鱼吃得欢，连铁签都一起嚼了。","d":{}}}],"minLevel":60},{"id":"t_s3_mohuang","name":"深渊里的鲸歌","tier":"神","place":"深海·魔鲸海沟","yearMin":2640,"yearMax":2651,"canon":null,"owner":"魔皇（三部中圣灵教之主，深海魔鲸王之妻）","rumor":"远海的渔民说，有些夜里海底会传来两头巨鲸的歌声，一高一低，此起彼伏。听过的船后来都改道绕开了那片海。","memory":"三部揭示：魔皇是深海魔鲸王之妻，丈夫为唐三所杀后，她谋划两万余年欲毁灭人类，最终成为圣灵教魔皇。","text":"你借着避水宝物沉入海沟，幽暗里浮着巨大的影子。一头比岛还长的魔鲸游过你头顶，另一个身影跟在它身边，比它小些，鳞光幽蓝，绕着它缓缓打转，像在撒娇。\n那个较小的身影发现了你。它停住，海水在一瞬间变得冰冷粘稠。一个女声从四面八方压过来：「人类？离我的丈夫远一点。」","choices":[{"t":"向她示警，劝夫妇远离唐门之人","hint":"这会改变一些事","need":{"精神":45},"chance":0.3,"win":{"text":"她沉默很久，冷冷说了句「我记住你了」。海沟深处飘出一枚鲸胶，裹着深海的力量。你隐约感到，世界线被你拨动了一下。","d":{"等级":4,"体魄":8,"item":"深海鲸胶","reveal":["魔皇"],"shift":3,"flags":["s_mohuang_warned"]}},"lose":{"text":"她只当你是在挑衅丈夫，海水骤然凝固，一道漆黑的声波穿透你的胸膛，你沉向海沟最深处。","d":{"death":"惊扰魔皇，被深海声波震碎心脉","reveal":["魔皇"]}}},{"t":"献上陆地的珍宝，求一缕海之精华","need":{"金魂币":600},"chance":0.55,"win":{"text":"她对陆地的东西很好奇，挑走了你最贵的那件。作为交换，一缕海渊精华钻进你的经脉，你在水下如履平地。","d":{"等级":3,"体魄":6,"精神":4,"金魂币":-500,"reveal":["魔皇"]}},"lose":{"text":"她收下宝物，却没有给任何东西，只是一尾把你拍出了海沟。","d":{"金魂币":-500,"伤势":40,"reveal":["魔皇"]}}},{"t":"转身离开","win":{"text":"你屏住呼吸往上浮，再也不敢回头。身后的鲸歌重新响起，一高一低，渐渐被海水吞没。","d":{}}}],"minLevel":65},{"id":"t_s2_renyu","name":"冰海人鱼族","tier":"珍","place":"极北冰海","yearMin":2638,"yearMax":2657,"canon":null,"owner":"人鱼族（二部中冰海的顶级势力）","rumor":"极北冰海上，月圆之夜有歌声从冰层下传来，美得让人想跳下去。老渔民会把耳朵塞住，说那是人鱼在唱歌。","memory":"二部中，冰海由人鱼族统治，族长率海魂兽守卫领地，极度敌视人类；人鱼一族擅长精神类能力。","text":"冰层下的歌声越来越近。一块浮冰翻过来，露出一张苍白美丽的脸，鱼尾泛着银蓝的光。四周冰缝里，一双双眼睛同时亮起，有人鱼，也有獠牙森森的海魂兽。\n为首的人鱼冷冷道：「人类都没有好东西。说出你的来意，然后滚出冰海。」\n她身后的海魂兽低声咆哮，冰面下黑影翻涌，至少有上百只。","choices":[{"t":"讨教精神之道","need":{"精神":35},"chance":0.5,"win":{"text":"你耐着性子与她们对歌三夜，人鱼族长终于松口，教了你一段凝神的古调。精神之海从此平静如镜。","d":{"精神":10,"悟性":4,"魅力":3}},"lose":{"text":"人鱼的歌声化成精神冲击，你被唱得神魂颠倒，醒来已漂在岸边。","d":{"精神":-4,"伤势":30}}},{"t":"杀出一条路，夺走冰海珍珠","need":{"战力":700},"chance":0.35,"win":{"text":"你冲破海魂兽的围堵，抢下一颗精神珍珠逃上冰面。人鱼族的怒歌在身后响了很久。","d":{"精神":8,"等级":2,"item":"冰海精神珍珠","trait":{"逆":1}}},"lose":{"text":"海魂兽从四面八方涌来，你被拖进冰下，好不容易才挣脱上岸。","d":{"伤势":70}}},{"t":"转身离开","win":{"text":"你举起双手一步步退回岸边，那些眼睛一直盯着你，歌声渐渐沉入冰层之下。","d":{}}}],"minLevel":45},{"id":"t_s3_longgu","name":"龙谷","tier":"神","place":"大陆北境·无名裂谷（入口位置推算）","yearMin":2646,"yearMax":2657,"canon":null,"owner":"龙神遗留的小世界（三四部中的历练地）","rumor":"北境有座裂谷，雨天会传出龙吟。进去的人出来后都说里面另有天地，可谁也说不清自己在里面待了多久。","memory":"续作提到，龙谷是龙神神魂开辟的小世界，原在斗罗大陆，龙气浓郁，孕育过山龙王躯干骨等魂骨，龙神残魂坐镇中央。","text":"穿过裂谷尽头的雾墙，眼前是另一片天地。天空泛着金色，远处山脉的轮廓像一条条卧着的巨龙，空气里的龙气浓得能拧出水来。脚下的白骨堆成小山，每一根都比你的腰还粗。\n山谷正中隐约有一道庞大的意志在沉睡。一个苍老的声音在风里回荡：「龙之血脉……还是外来的小虫子？」","choices":[{"t":"在龙骨间搜寻魂骨","need":{"体魄":80,"精神":80},"win":{"text":"你在一具山岳般的龙骸里找到一块仍在搏动的躯干骨，土黄色龙纹流转，厚重得像一座山，融入身体时大地都在共鸣。","d":{"等级":3,"bone":{"slot":"躯干","name":"山龙王躯干骨","desc":"龙谷所出，大地之力源源不绝，防御与力量皆至巅峰。","attrs":{"体魄":12,"精神":4}}}},"lose":{"text":"龙骸里残存的龙威忽然苏醒，一声无形的咆哮震得你五脏移位，你爬着逃出了骨山。","d":{"伤势":70}},"nonCombat":true,"hint":"以体魄承受龙威、精神辨认残魂，在遗骸中寻骨"},{"t":"向沉睡的意志行礼求教","need":{"悟性":40},"chance":0.45,"win":{"text":"那意志打量你很久，送你一段龙吟。你在谷中闭关，出来时外面只过了一个月，你却觉得像过了十年。","d":{"等级":6,"悟性":8,"精神":6,"flags":["s_longgu_blessed"]}},"lose":{"text":"意志不屑一顾，龙气骤然暴涨，你被挤出了小世界，摔在裂谷外昏迷不醒。","d":{"伤势":45}}},{"t":"强闯谷心，夺取龙神残魂","hint":"神之残魂","need":{"战力":1250},"chance":0.08,"win":{"text":"龙威山崩般压下，你咬碎牙关硬扛到底。残魂竟发出一声赞许的低吟，分出一缕龙神之力烙进你的血脉。","d":{"等级":10,"体魄":10,"精神":10,"flags":["overlimit","s_longshen_canhun"],"shift":5}},"lose":{"text":"龙神残魂只是睁了睁眼，你连同这段妄念一起，化作谷中又一副白骨。","d":{"death":"强夺龙神残魂，被龙威碾碎"}}},{"t":"转身离开","win":{"text":"你在谷口站了很久，听着谷中的龙吟，最终没有走进去。雾墙在身后缓缓合拢。","d":{}}}],"minLevel":85},{"id":"t_s2_dragon_trial","name":"兽神的龙威试炼","tier":"神","place":"星斗大森林·生命之湖岸","yearMin":2642,"yearMax":2680,"minLevel":90,"requiredNPCs":["帝天"],"cond":{"anyFlag":["s_ditian_mercy","s_ditian_oath"],"notFlag":"s_dragon_raider"},"owner":"帝天","rumor":"湖岸的黑鳞护符亮起微光，兽神正在等一个赴约的人。","memory":"本游戏延伸剧情：帝天保留兽神身份，试炼胜利不等于将其猎杀。","text":"帝天认出了你带回的约定，把龙爪按在湖岸。黑色纹路连成领域，他要求你凭自己的本领站到最后。\n「洗髓给不了你真正的意志。你可以接下龙神爪的试炼，也可以帮森林修复被猎魂队破坏的边界。两条路都有价值。」\n这次比试由帝天主动收束杀意，本体战力仍为 12000；胜利不会使他死亡，也不会掉落八十万年魂环。","choices":[{"t":"迎接帝天的龙威试炼","sparring":true,"battle":{"n":"帝天","lv":99,"power":12000},"need":{"战力":12000,"等级":90,"体魄":110,"精神":110},"hint":"胜后获凝练的十万年外附龙鳞骨；帝天仍在世","win":{"text":"你终于在龙神爪收势时站稳。帝天将多年积存的蜕鳞精华凝成一块外附骨递给你，又在你的魂环上留下龙威淬炼的痕迹。这是试炼的赠礼，不是兽神的遗骨。","d":{"uniqueReward":"t_s2_dragon_trial","bone":{"slot":"外附","name":"黑龙蜕鳞外附骨","years":100000,"attrs":{"体魄":6,"精神":6},"desc":"帝天以蜕鳞本源凝成的试炼赠礼，并非其本体魂骨。"},"ringUp":{"t
