:460},"chance":0.55,"win":{"text":"你在囚笼下撑过三轮，唐三先慢了半拍，光链缠住他的手腕。他笑着收了草：「你的龙，很好。」","d":{"名望":8,"精神":2,"flags":["holy_name"],"bonds":{"唐三":6},"trait":{"险":-1}}},"lose":{"text":"第三轮时锁龙印崩开，黑龙当众出笼，满场死寂。裁判宣布你落败。","d":{"伤势":25,"名望":5,"flags":["dark_exposed"],"bonds":{"比比东":5},"rep":{"宗门":-3}}}},{"t":"撕开锁龙印，放黑龙出笼","hint":"必胜，但暗龙当众暴露","win":{"text":"黑龙一口吞掉半场的光，草笼应声而碎，唐三掌中锤影一闪即收。贵宾席上，比比东第一次站了起来。","d":{"名望":10,"伤势":15,"flags":["dark_exposed"],"bonds":{"比比东":10,"千古寒川":-8},"rep":{"武魂殿":3,"宗门":-3},"trait":{"逆":1,"险":1,"忠":-1}}},"note":"按：唐三第四环得自万年地穴魔蛛，蓝银囚笼即出自此环。"}]},{"id":"n_voices","title":"两个声音","year":2648,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M44","echo":{"flag":"dark_exposed","text":"前因 · 2645：黑龙当众出笼，那夜纪无声替你截杀了圣龙宗派来的刺客。"},"text":"大赛之后，两样东西一直压在你枕下：菊斗罗代教皇捎来的话——「等你哪天想喂它，又不想死，来找她」；还有纪无声塞给你的玉牌，刻着一盏灯，「天斗城的灯，为你留着」。随后唐昊一锤砸向武魂城，史莱克星散，你也该选一条路了。\n\n三年后，你十七岁，坐在北镇一家酒馆的吧台前。傍晚，吧台后的木板被人从底下掀开，又甜又腥的血气涌上来，左臂猛地一沉。上来的瘦高少年腰挂两把血纹刃：「下面是杀戮之都，你不该下去。」\n\n「我知道。可我身体里有个东西想下去。」他说他叫墨刃，生在下面。\n\n那夜你蜷在客栈里，听见两个声音同时在骨头里响。一个从地底传来，冷而甜：『来，做我的翼。』另一个更老，隔着千年的冰：『别听她的……我们原本是一个……到北边来。』","choices":[{"t":"握紧玉牌，回天斗投太子","hint":"走向光：做雪清河的门客","win":{"text":"你做了太子府的门客。雪清河听你说完，只轻轻按了按你的左臂，那个甜冷的声音便退远了。","d":{"flags":["path_light","told_angel"],"bonds":{"千仞雪":12,"纪无声":5,"墨刃":3},"rep":{"天斗":8},"met":["shalu","huangshi"],"trait":{"群":1,"忠":1}}}},{"t":"走下木板门，烙下罗刹印","hint":"走向暗：比比东会记住你","win":{"text":"你在杀戮之都待了一年，地狱杀戮场是黑龙替你杀出来的。血湖下的印记，烙进了暗龙。","d":{"体魄":4,"伤势":20,"flags":["path_dark","rakshasa_mark"],"bonds":{"比比东":12,"胡列娜":5,"墨刃":6},"rep":{"武魂殿":5},"met":["shalu"],"trait":{"仁":-1,"险":1}}}},{"t":"藏起声音，循北方而去","hint":"秘密只属于你","win":{"text":"你谁也没告诉，把那个更老的声音藏进骨头，往北走了半年。冰原尽头，它说得越来越清楚。","d":{"精神":4,"悟性":2,"flags":["dusk_voice"],"bonds":{"夜昙":6,"墨刃":3},"met":["shalu"],"trait":{"群":-1,"逆":1}}},"note":"按：原著中唐三化名唐银在杀戮之都约两年，与胡列娜同获杀神领域。"}]},{"id":"n_mist","title":"晨昏雾散","year":2651,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M51","echo":{"flag":"sealed_obedient","text":"前因 · 2637：觉醒那天你跪下受印，二十年来，暗龙从没见过真正的血战。"},"text":"斗罗历二六五一年，你二十岁，回到千古谷。三天里噩耗接连传来：七宝琉璃宗城堡被破，剑斗罗断臂；蓝电霸王龙宗满门一千八百余口，无一生还。\n\n第四夜，晨昏雾被烧散了。一条金鳞浊眼的巨龙压下南天，龙背上站着圣龙宗宗主拓跋希，九环封号斗罗。身后三百圣龙宗魂师，一个红衣主教展开谕令：「千古一族窝藏异端，族灭。双龙之子，活捉。」\n\n拓跋家曾给千古家看了三百年门，四十年前把旧谷的路卖给武魂殿，换走一块龙血晶，一代代喂出这条伪圣龙。祖父抽出空荡的左袖，放出他褪成象牙色的老龙：「拓跋希，你爹给我牵过马。」\n\n你守祠堂。台阶上走来六环的少宗主拓跋烈，龙口滴着金色涎水：「你家那块龙血晶，我从小喝到大。今天来尝尝原汁。」\n\n黑龙一下下撞着锁龙印：这一次，还要锁着我吗？","choices":[{"t":"只以圣龙守住祠堂","hint":"守家规，稳扎稳打","need":{"战力":950},"chance":0.4,"win":{"text":"圣龙咬穿伪龙的喉咙，拓跋烈倒在台阶上。拓跋希卷起儿子尸身退走，千古谷保住一半，祖父的魂力却碎了。","d":{"名望":10,"体魄":3,"flags":["held_valley"],"bonds":{"千古寒川":10},"rep":{"武魂殿":-10},"reveal":["拓跋希"],"trait":{"忠":1}}},"lose":{"text":"拓跋烈的龙爪按住你后颈。谷口传来祖父一声大笑，八十七级的老龙自爆，族人趁乱撤走，你被押往武魂城。","d":{"伤势":40,"flags":["captured"],"bonds":{"千古寒川":10},"rep":{"武魂殿":-10},"reveal":["拓跋希"],"trait":{"忠":1}}}},{"t":"撕开锁龙印，放黑龙上阵","hint":"暗龙克制偷来的龙血，但难收回","need":{"战力":850},"chance":0.55,"win":{"text":"黑龙一现身，伪圣龙就在它的威压下哀鸣。拓跋烈死在祠堂前，偷来的龙血化作金水渗进石缝。","d":{"名望":12,"伤势":20,"flags":["held_valley","dark_exposed"],"bonds":{"夜昙":8,"千古寒川":-5},"rep":{"武魂殿":-10},"reveal":["拓跋希"],"trait":{"逆":1,"险":1}}},"lose":{"text":"黑龙压住了伪龙，你却收不住它，被拓跋希一掌拍落。祖父自爆换族人撤走，你被押往武魂城。","d":{"伤势":50,"flags":["captured","dark_exposed"],"rep":{"武魂殿":-10},"reveal":["拓跋希"],"trait":{"险":1}}}},{"t":"护着族人从后山撤离","hint":"保住族人，丢下祠堂","win":{"text":"你背着孩子撤进冰原，回头时祖父的老龙在谷口亮成一颗太阳。他自爆了。拓跋烈追上来，扣住了你。","d":{"伤势":25,"名望":3,"flags":["captured"],"bonds":{"夜昙":6,"千古寒川":5},"rep":{"武魂殿":-10},"reveal":["拓跋希"],"trait":{"仁":2,"群":1}}},"note":"按：原著猎魂行动中，武魂殿同夜攻破七宝城堡、屠灭蓝电霸王龙宗。"}]},{"id":"n_reselect","title":"七宗重选","year":2655,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M57","echo":{"flag":"captured","text":"前因 · 2651：祖父自爆，你被押进教皇殿地牢，一年后才被放出来。"},"text":"斗罗历二六五五年，你二十四岁，戴着面具坐在武魂城七宗重选大会的看台上。这几年大陆翻了天：天斗太子雪清河原来是武魂殿的千仞雪，宫变失败退回武魂城；新七宗尽数亲附武魂殿，圣龙宗位列第四。拓跋希老了十岁，却在宗主席上笑。\n\n族里那卷从不示人的家谱，如今在你手里。千二百年前，一头活了百万年的晨昏龙渡过八劫，第九劫降临时，天使之神要它的光，罗刹神要它的暗，将它撕成两半。神界为它雕好的神座就此空着，称作留白。它把两半龙魂藏进一个千家守座武士和一个罗刹女祭司的血里，那便是千古。明暗通婚，是在等一个能把两条龙重新合起来的人。\n\n散会后，一根金羽落进你掌心：天使神座旁，龙座仍空。菊斗罗捻着菊花笑：「陛下说，拓跋希是她的狗。你若想要那条狗的命，就去找她。」\n\n左臂里那个最老的声音又响了：『到北边来。』","choices":[{"t":"去斗罗殿，站到天使身后","hint":"光之路：千仞雪的圣龙护法","win":{"text":"你做了千仞雪的圣龙护法。她看着你，像看一盏终于点亮的灯。","d":{"flags":["angel_guard"],"bonds":{"千仞雪":12},"rep":{"武魂殿":5},"reveal":["千仞雪"],"trait":{"忠":1,"群":1}}}},{"t":"握住比比东伸来的手","hint":"暗之路：罗刹之翼，拓跋希的命","win":{"text":"她教你不加环也能喂饱暗龙。从此它不再半夜咬你，只在她身后安静地睡。","d":{"伤势":-20,"flags":["rakshasa_side"],"bonds":{"比比东":12},"rep":{"武魂殿":5},"reveal":["千仞雪"],"trait":{"仁":-1,"忠":1}}}},{"t":"谁的手都不握，回双龙冢","hint":"留白之路：听清那个声音，爆体之险","need":{"精神":55},"win":{"text":"你连夜出城，穿过晨昏雾一路向北。母亲已在裂谷边等你：「暗脉的人，都会梦见这里。」","d":{"flags":["dusk_path"],"bonds":{"夜昙":8},"rep":{"魂兽":5,"武魂殿":-8},"reveal":["千仞雪"],"trait":{"逆":2,"群":-1}}}}]},{"id":"n_angel","title":"天使降临","year":2656,"cond":{"flag":"angel_guard","notFlag":null,"levelMin":0},"canon":"M76","echo":{"flag":"told_angel","text":"前因 · 2648：你把骨头里的两个声音，都告诉了当年的太子。"},"text":"武魂殿成了武魂帝国。你随天使军团上了嘉陵关，在城头远远望见唐三。他已是封号斗罗，目光落在你背后的圣龙上，像在惋惜什么。\n\n那夜千道流在天使神像下召见你，六只金翼收在身后：「千古尘的事，是我那个不成器的儿子造的孽。」他望向神座旁雕着龙的空石座，「天使从来没有坐骑。千二百年前，一头龙走到了神界门口，是天使与罗刹在它渡最后一劫时把它撕开的。千家欠千古家的，不止一个千古尘。」\n\n第二天，千道流献祭。金光冲天，千仞雪在光里展开六翼，成了神。她托着一团光走到你面前，光里旋着一道魂环：「神赐魂环，四万年。接了它，圣龙就是天使的圣龙。」她让出身后的路，路尽头是那个空了千二百年的石座。\n\n「上去吧。」她的声音近乎请求，「祖父走了。我身边，只剩你了。」","choices":[{"t":"跪上龙座，接下神赐","hint":"做天使的圣龙，一生不离","win":{"text":"你跪上石座，第七环烧成白金色的火，圣龙生出六只光翼。人们开始叫你天使圣龙。","d":{"等级":2,"ring":{"beast":"神赐魂环","years":40000,"kind":"攻","skill":"天使圣龙真身","desc":"神赐魂环：圣龙披上天使圣焰，化为六翼圣龙真身"},"flags":["angel_dragon"],"bonds":{"千仞雪":15},"reveal":["千道流"],"trait":{"忠":2},"ending":"e1"}}},{"t":"接下魂环，站着不跪","hint":"守护她，但不做谁的坐骑","win":{"text":"你接了环，没有跪。她怔了一下，然后笑了：「也好。那就站在我身边。」","d":{"等级":2,"ring":{"beast":"神赐魂环","years":40000,"kind":"攻","skill":"天使圣龙真身","desc":"神赐魂环：圣龙披上天使圣焰，化为六翼圣龙真身"},"flags":["stood_beside"],"bonds":{"千仞雪":8},"reveal":["千道流"],"trait":{"逆":1,"忠":1},"ending":"e1"}}},{"t":"在神光里转身，回北方去","hint":"辜负她，走向留白之路","win":{"text":"你没有回头。身后六翼的光暗了一瞬，再也没有人叫你的名字。","d":{"flags":["dusk_path"],"bonds":{"千仞雪":-25,"夜昙":6},"rep":{"武魂殿":-15},"reveal":["千道流"],"trait":{"逆":2,"忠":-2}}}}]},{"id":"n_rakshasa","title":"罗刹之翼","year":2656,"cond":{"flag":"rakshasa_side","notFlag":null,"levelMin":0},"canon":"M75","echo":{"flag":"rakshasa_mark","text":"前因 · 2648：杀戮之都血湖下的印记，早已烙进了你的暗龙。"},"text":"你站到了比比东身边。她从死人身上抽出怨念，一缕一缕喂进你的左臂；你看着她戴上女皇的冠，夜里独自站在殿顶，望着天斗城的方向。\n\n嘉陵关一役，鬼斗罗、菊斗罗先后战死，供奉殿收走了她的兵权。那夜她只带你一人北上，走进早已死去的杀戮之都。干涸的血湖底埋着一座神殿，壁画上罗刹神手持巨镰，身边盘着一条黑龙。那龙只有半边身子，另一半齐齐撕去，只剩空白。\n\n「我说过不在乎它原本是什么。我骗了你。」她背对着你，「我也是双生武魂。给第二武魂加环那年，没有人替我扛，我一个人在黑屋子里疼了三天三夜。」\n\n湖底传来低沉的龙吟，是一头五万年的渊底冥蛟。「第一武魂没满九环就给第二武魂加环，一半的人会炸。我替你扛。代价是，暗龙从此烙着罗刹的印。」\n\n骨头深处，那个最老的声音叹了一声：『你若答应她，我们就再也合不上了。』","choices":[{"t":"让她亲手为暗龙加环","hint":"第二武魂加环，罗刹之印永不褪去","win":{"text":"三天三夜，她一直握着你的手，把炸开的那一半一口口吞下。你醒来时，暗龙鳞上多了一道镰形血印。","d":{"等级":2,"ring":{"beast":"渊底冥蛟","years":50000,"kind":"攻","skill":"罗刹魔龙真身","desc":"第二武魂第一环：暗龙烙上罗刹神印，以怨念为食"},"flags":["rakshasa_wing"],"bonds":{"比比东":15},"reveal":["噬魂蛛皇"],"trait":{"忠":2},"ending":"e2"}}},{"t":"先要她许诺不动千古家","hint":"族人平安；她会记住你讨价还价","win":{"text":"她看了你很久：「你和我年轻时一样，会讨价还价。」她答应了，然后握住了你的手。","d":{"等级":2,"ring":{"beast":"渊底冥蛟","years":50000,"kind":"攻","skill":"罗刹魔龙真身","desc":"第二武魂第一环：暗龙烙上罗刹神印，以怨念为食"},"flags":["valley_spared"],"bonds":{"比比东":8,"夜昙":5},"reveal":["噬魂蛛皇"],"trait":{"群":1,"忠":-1},"ending":"e2"}}},{"t":"收回暗龙，独自北上","hint":"辜负她，走向留白之路","win":{"text":"你收回左臂，退出神殿。她没有追，只在你身后说了一句：「你会后悔的。」","d":{"flags":["dusk_path"],"bonds":{"比比东":-25,"夜昙":6},"rep":{"武魂殿":-15},"reveal":["噬魂蛛皇"],"trait":{"逆":2,"忠":-2}}}}]},{"id":"n_tomb","title":"双龙冢","year":2656,"cond":{"flag":"dusk_path","notFlag":null,"levelMin":0},"canon":null,"echo":{"flag":"dusk_voice","text":"前因 · 早年：你从小就听得见那个最老的声音，它一直叫你到北边来。"},"text":"母亲陪你顺着冰壁走进裂谷最深处。冰层透明如水晶，封着一具大得望不到边的龙骨，从头到尾被齐齐劈开，左半白如玉，右半黑如墨，裂缝里千二百年来一直渗着灰光。\n\n灰光凝成一道影子，鳞片半明半暗，眼睛是灰的。『你来了，第三个。』它叫晨昏。『千古长宁太怕暗，千古尘被人逼着合，光太亮。两个都炸了。』\n\n办法只有一个：冰原上那头双首蛟，是它的血渗进冰里养出来的，一首白一首黑，四万七千年。斩了它，让两条龙同时咬住那唯一一道环，谁也不许多吃一口。越限的那一份，由合一的龙身和它的残魂来扛。成了，你才有资格去渡它没渡完的第九劫；不成，你会炸。\n\n「一半一半。」母亲按住你左臂上发烫的锁龙印，「你要是怕，现在回头，娘陪你回去。」\n\n冰窟深处，一白一黑两颗蛟首探了出来。你身体里的两条龙，第一次没有互相推挤。","choices":[{"t":"独自下冰窟，斩蛟同环","hint":"胜则双龙合一，败则暗龙替你而碎 · 达到标示战力后可挑战，获胜才能取得奖励","need":{"战力":1466},"chance":0.5,"win":{"text":"两条龙同时咬住那道环，一口不多，一口不少。你走出冢底时，身体里只剩一条灰金色的龙。","d":{"等级":3,"体魄":5,"精神":5,"ring":{"beast":"双首晨昏蛟","years":47000,"kind":"攻","skill":"晨昏龙真身","desc":"晨昏同环：光暗双龙合为一条晨昏龙，呼吸间光暗互换"},"flags":["dusk_one"],"trait":{"险":2,"群":-1}}},"lose":{"text":"暗龙多吃了一口。千钧一发之际，它从你身体里挣出去，替你碎在了冰窟里。","d":{"伤势":60,"flags":["dragon_lost"],"ending":"e4"}},"battle":{"n":"双首晨昏蛟","years":47000}},{"t":"请母亲以暗脉之血护阵","hint":"母亲压住白首，胜算更大 · 达到标示战力后可挑战，获胜才能取得奖励","need":{"战力":1466,"精神":55},"chance":0.65,"win":{"text":"母亲的黑龙压住白首，你一爪斩下黑首。同环时，她替你稳住了暗龙那一半。","d":{"等级":3,"精神":4,"ring":{"beast":"双首晨昏蛟","years":47000,"kind":"攻","skill":"晨昏龙真身","desc":"晨昏同环：光暗双龙合为一条晨昏龙，呼吸间光暗互换"},"flags":["dusk_one"],"bonds":{"夜昙":15},"trait":{"群":2}}},"lose":{"text":"母亲替你挡下白首的龙息，暗龙却在同环时失了衡。它挣出去，替你和她碎在了冰里。","d":{"伤势":50,"flags":["dragon_lost"],"bonds":{"夜昙":10},"ending":"e4"}},"battle":{"n":"双首晨昏蛟","years":47000}},{"t":"不合了，跟母亲回家","hint":"不赌命；神座继续空着","win":{"text":"你转身要走，暗龙却自己挣出左臂扑向黑首。它咬断了蛟颈，也在同环之前碎在了冰里。","d":{"伤势":20,"flags":["dragon_lost"],"bonds":{"夜昙":8},"trait":{"险":-2},"ending":"e4"}},"note":"按：原创设定。魂兽百万年后须渡九劫成神，从无成功先例。"}]},{"id":"n_ninth","title":"第九劫","year":2657,"cond":{"flag":"dusk_one","notFlag":null,"levelMin":0},"canon":"M83","text":"晨昏的残影跟在你身边，淡了许多。『第九劫，是光与暗同时落在你身上。千二百年前，我没扛住。』\n\n斗罗历二六五七年，嘉陵关。天裂成两半：一半金光，千仞雪六翼遮天，天使圣剑亮如劈开世界的闪电；一半漆黑，比比东拖着罗刹魔镰，身后万鬼哀嚎。两尊神并肩而立，海神唐三的身体正从天上坠落，扎辫子的姑娘扑向他坠落的方向。\n\n第二道合击已经蓄满。金光与黑光拧成一股斜劈而下，劈向城头两个须发皆白的老人：剑斗罗尘心，骨斗罗古榕。一个白衣女子拔剑冲出，剑上凝霜，是林照：「师父——」\n\n她来不及。谁都来不及。\n\n『就是这里。』晨昏轻笑，『光与暗同时落下的地方。』\n\n迎上去，就是从命运手里硬抢下两个人，也是让那两个都向你伸过手的人看见，你选了谁都不是的路。你也可以只送出曾属于暗龙的那一半，替你挨这一下。","choices":[{"t":"张开龙翼，迎上合击","hint":"改写原著：尘心、古榕生还","canonChange":{"node":"M83","inertia":4,"desc":"剑斗罗尘心、骨斗罗古榕在天使与罗刹的第二道合击下生还"},"win":{"text":"金光与黑光在你龙翼上撞成一团，被晨昏龙一口吞下，光化成暗，暗化成光，在你脚下凝成第十道灰金魂环。","d":{"等级":5,"shift":15,"flags":["dusk_god"],"bonds":{"林照":20},"rep":{"天斗":10,"宗门":10},"trait":{"逆":3,"仁":2},"ending":"e3"}}},{"t":"只把暗半身送进劫光","hint":"原著不变；暗龙替你承劫","win":{"text":"曾属于暗龙的那一半迎了上去，在劫光里碎成黑雪。劫过去了，城头那两个老人还是倒下了。","d":{"flags":["dragon_lost"],"bonds":{"林照":3},"trait":{"逆":-2,"险":-1},"ending":"e4"}}}]}],"endings":[{"id":"e1","title":"结局·圣龙侍天","type":"光","grade":2,"text":"你陪她走完了剩下的路。她被观音泪击碎心脏，你抱她到海边看了三天海。后来修罗魔剑落下，比比东挡在了女儿身前。\n\n那天傍晚，千仞雪亲手碎了神位，六翼片片剥落，她落进你的龙翼里，轻得像一片雪。唐三赦免了她：「你们可以走了。」\n\n你带她回了北方。她站在晨昏雾边问：「这里一直是这样吗？」「一直是。」「真好，没人分得清是天亮还是天黑。」雾里，她学会了生火，你学会了沏茶。","afterlife":["千仞雪：碎神位成了凡人，随你在晨昏雾里终老，再没提过神座。","比比东：替女儿挡下修罗魔剑，临终吐出埋了二十多年的真相。","唐三：成海神，与小舞双神共存，赦免了千仞雪与胡列娜。","千古家族：千家与千古家的千年旧怨了结，留白神位依旧空置。"],"worldline":"千仞雪身边多了一条圣龙；终局照旧，晨昏神位继续空置。"},{"id":"e2","title":"结局·罗刹之翼","type":"暗","grade":2,"text":"比比东在废墟神殿接下罗刹传承，你的罗刹魔龙盘在她身后，替她挡下每一道射向后背的光。\n\n最后一战，修罗魔剑落下时，她没有看你，她看着女儿。你扑上去已经晚了，魔剑穿透了她的胸口。她轻得像一捧灰：「去北边……把我的镰刀埋在那条龙旁边。它们分开太久了。」\n\n你把半柄魔镰埋进双龙冢，埋在劈成两半的龙骨旁，做了守冢人。暗龙常趴在冰面上，听冰下那半边白骨和一柄黑镰挨得很近。","afterlife":["比比东：死于修罗魔剑之下，魔镰残片与晨昏龙白骨同眠冰底。","千仞雪：碎神位后得赦，此生再没踏进极北一步。","胡列娜：得赦后北上一次，在双龙冢前替老师上了一炷香。","千古家族：族人每年来冢边一回，带来南边天斗与星罗的消息。"],"worldline":"罗刹神身边曾有一条龙；终局照旧，魔镰残片被埋进双龙冢。"},{"id":"e3","title":"结局·晨昏","type":"神","grade":3,"text":"你身后，尘心和古榕还站着，林照扑在师父身前，剑还在抖。\n\n晨昏的残影化作灰金光点融进龙鳞：『引路的，总要献上自己。我就是你了。』空了千二百年的神座终于刻上名字：晨昏之神，不属光暗，司掌昼夜交接的一刻。\n\n比比东的神魂经过神界门口，看见你笑了：「原来你选了这个。」「我谁都没选。」「这才是最难的。」\n\n你把祠堂八字凿成：明暗同族，亦可同身。晨昏雾散了，孩子们第一次看见日出。","afterlife":["尘心与古榕：生还于嘉陵关，此后同守七宝琉璃宗二十年。","林照：师父活了下来，她把那一挡之恩记成了一生的交情。","比比东：神魂过神界门口时与你相见，说你选了最难的那条路。","千古家族：走出极北，日出日落时天边常有灰金色的龙影掠过。"],"worldline":"空置千二百年的晨昏神位有了主人；尘心、古榕生还，千古家族走出极北。"},{"id":"e4","title":"结局·留白","type":"凡","grade":1,"text":"暗龙走了。最后那一刻是它先扑上去的，回头望你那一眼，没有饿，也没有恨。圣龙蜷在你胸口，哭得像条刚破壳的小龙。晨昏的残影散了，神座继续空着。\n\n你回谷做了家主，先废了明暗通婚：「以后谁喜欢谁，就娶谁嫁谁。生一条龙，就好好养一条。」\n\n南边的世界照原样走完了它的路。你没凿掉祠堂那八个字，只在底下刻了一行小字：此处留白。孩子问起，你说这里本该有个故事，总会有人来写完。","afterlife":["夜昙：亲手拆下你左臂的锁龙印，放进祠堂，与前两方并排。","晨昏：残魂散于双龙冢，千二百年的等待到此为止。","千仞雪与比比东：一个碎了神位，一个替女儿而死，一切如原著。","千古家族：废除明暗通婚，双龙之子的传承就此断绝。"],"worldline":"原著终局不变；晨昏神位继续空置，双龙之子的传承就此断绝。"}],"summary":"九节点：2637觉醒→2645半决赛对唐三（强检定，败或放龙则暗龙暴露）→2648北镇两个声音（光/暗/晨昏）→2651晨昏雾散对拓跋烈（强检定，败则被俘）→2655七宗重选三岔：天使e1、罗刹e2、双龙冢同环（强检定，败e4）→2657第九劫改命（M83尘心古榕生还）e3，或送暗半身e4。"},{"id":"shalu","title":"杀戮之都·堕落者" ,"note":"按：白霜是十万年霜角白鹿化形，冰露是她的本源之物。"},{"t":"还给她，叫她快走","win":{"text":"她愣了愣，把冰露收回去，转身消失在雾里。","d":{"bonds":{"白霜":8},"rep":{"魂兽":3},"met":["beast"],"trait":{"仁":1}}}}]},{"id":"ev_yuheng","title":"斗魂场的蓝电","when":{"yearMin":2652,"yearMax":2655,"levelMin":0,"flag":null,"notFlag":null},"w":3,"once":true,"text":"天斗城斗魂场，生死斗的对手是个手臂缠着蓝电的年轻人。他打得像不想活了，每一拳都冲着要害。台下有人说，他是蓝电霸王龙宗灭门那夜逃出来的。","choices":[{"t":"打晕他，认输下台","win":{"text":"你收刀认输。他在台上躺了很久，才哑着嗓子问你的名字：玉衡记住了。","d":{"名望":-2,"bonds":{"玉衡":6},"met":["landian"],"trait":{"仁":1}}}},{"t":"按生死斗规矩打","need":{"战力":850},"chance":0.55,"win":{"text":"你赢了，没下死手。他被抬下台时，眼里全是恨。","d":{"金魂币":200,"名望":6,"bonds":{"玉衡":-4},"met":["landian"],"trait":{"仁":-1}}},"lose":{"text":"蓝电劈穿了你的肩。他举着拳头站了很久，没打下最后一拳。","d":{"伤势":45,"bonds":{"玉衡":2},"met":["landian"]}}}]},{"id":"ev_red_fog","title":"冰原红雾","when":{"yearMin":2654,"yearMax":2656,"levelMin":50,"flag":null,"notFlag":null},"w":3,"once":true,"text":"北边商路上传着怪事：冰原上有一团红雾，雾里站着个白头发的人，一整支商队一个都没回来。你手背上的暗紫血管，这几夜跳得格外厉害。","choices":[{"t":"循着红雾追上去","need":{"精神":45},"chance":0.5,"win":{"text":"你在雪窝里找到一个活口。他说雾里有人在哼歌，哼的是海。","d":{"精神":3,"气运":2,"flags":["fog_trail"],"trait":{"险":1}}},"lose":{"text":"红雾掠过你藏身的山脊，你的血沸了，跪在雪里一夜没站起来。","d":{"伤势":40}}},{"t":"去天斗报官","win":{"text":"官府记下了，没人信。可商路还是封了半年。","d":{"名望":2,"rep":{"天斗":3},"trait":{"险":-1}}}}]}],"nodes":[{"id":"n_ten_one","title":"十人活一","year":2644,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":null,"echo":null,"text":"你十五岁那年，父亲已经交了十二年的血，每月四杯。他的指甲是青的，夜里会无缘无故醒来喘气。血卫敲门：「墨沉，你交不起了。今年你家出一个人进场。」\n\n父亲说他去。你趁夜也报了名，算好你们不会同场。三天后走进铁门，你在对面那排人里看见了他。黑铁王座上那团影子一动不动——把你们分进一场，不是巧合。\n\n钟响。沙是暗红的，父亲始终护在你左边，用肩膀替你吃了疤狼那一刀。最后场上只剩两个人。香已烧过大半，城规写着：香尽时还站着两个，两个都死。父亲把刀柄塞进你手里，刀尖抵着自己心口：「这城只有一条规矩是真的，活下去。你娘和我拿血换了你十五年，别让我们亏本。」\n\n王座上的人，微微向前倾了倾身子。","choices":[{"t":"握住父亲的手，让他做完","hint":"你会活下来，城规从此刻进骨头","win":{"text":"香灰落下前，他把最后的力气压进了你手里。你活着走出铁门，城规刻进了骨头。","d":{"名望":6,"精神":2,"bonds":{"墨沉":10},"flags":["city_law"],"trait":{"仁":-2,"逆":-1,"忠":1}}}},{"t":"扔下双刃，跪在他身边","hint":"违背城规等于求死，除非王开口","win":{"text":"满场哗然。王第一次开口：「两个都留下。」三天后，父亲死在石屋里，死在你身边。","d":{"伤势":10,"bonds":{"墨沉":10,"杀戮之王":10},"flags":["threw_blades","king_page"],"trait":{"仁":2,"逆":1,"险":1}}}}]},{"id":"n_tangyin","title":"唐银与狐狸","year":2647,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M44","echo":{"flag":"threw_blades","text":"前因 · 2644：王留下了你，你成了他的血侍，知道了满城喝的血腥玛丽，都是王的血。"},"text":"三年里你进了四十一次场，黑巷的人压低声音叫你「墨家那把刀」。这一年，城里来了两个新人。\n\n先来的是个狐狸眼的女孩，北镇酒馆里，一个托着冷白灯火的年轻人送她到木板边。她一口喝干血腥玛丽，冲你笑：「城里生的？味道不一样。」她叫胡列娜。半个月后又来一个年轻人，脸平平无奇，眼睛静得出奇，酒下肚时眼底闪过一点紫。他说他叫唐银。\n\n血酒馆里，三个老手围住胡列娜，第三个从背后压低了刀。你的手刚摸到腰间，角落里唐银的手指轻轻一弹，那人捂着手腕跪下——那种伤口不是刀，是某种极小极快的东西。\n\n当夜两个人都来找你。胡列娜坐在血湖边：「帮我活到走地狱路那天，我带你干干净净出城。」唐银等在石屋门口：「我需要一个懂这座城的人。我不问你的过去。」","choices":[{"t":"和唐银结盟","hint":"他什么都不缺，除了这座城的门道","win":{"text":"你教他哪条巷子的血卫换岗最慢。他按住你的手腕：「急和快不一样。你的刀在怕。」","d":{"悟性":3,"bonds":{"唐三":10},"flags":["ally_tang"],"trait":{"群":1}}}},{"t":"接受胡列娜的交易","hint":"武魂殿的承诺，要到城外才兑现","win":{"text":"你替她挡下三刀，都是从背后来的。她第一次没冲你笑：「为什么？」","d":{"魅力":3,"bonds":{"胡列娜":10},"rep":{"武魂殿":5},"flags":["ally_hu"],"trait":{"险":1}}}},{"t":"谁也不跟，独自进场","win":{"text":"你照旧一个人进场。城里人说，墨家那把刀，从不跟人背靠背。","d":{"体魄":2,"名望":5,"flags":["lone_blade"],"trait":{"群":-2}}}}]},{"id":"n_hell_road","title":"地狱路","year":2649,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M44","echo":{"flag":"ally_tang","text":"前因 · 2647：你和唐银背靠背打了一年。他说：两年后，天斗城。"},"text":"唐银比你早一个月赢满一百场，胡列娜晚他几天。三天后，他们从王座背后那道门里走了出来，身上罩着一层薄薄的红雾——杀神领域。千年来，地狱路只走出过八个人。\n\n现在轮到你。第一关，洞顶挂满血蝙蝠，它们落在你肩上嗅了嗅，又飞走了，像嗅到同类。第二关，一条十首巨蛇死在滚烫的石厅里，伤口干净利落，内丹已被取走——你认得那种干净。\n\n第三关很黑。黑暗里亮起一点香头似的红光，光下站着穿旧皮甲的父亲，腰侧带伤，握着你接过的那把刀。「{name}，过来。」他一步步走近，「这城只有一条规矩是真的。你忘了？」\n\n他抬起了刀。","choices":[{"t":"拔刀，斩了这道影子","hint":"关键战：心魔会随你的恐惧变强","need":{"战力":600},"chance":0.5,"win":{"text":"刀穿过影子，没有声音。你走出门，红雾落在你身上，凉得像血湖的水。","d":{"等级":3,"精神":3,"名望":10,"flags":["shashen"],"trait":{"险":1,"仁":-1}}},"lose":{"text":"影子的刀比你快。血卫把你拖出来时，你不记得自己是怎么倒下的。","d":{"伤势":60,"flags":["failed_road"],"trait":{"险":1}}}},{"t":"放下双刃，走到他面前","hint":"心魔不一定要用刀来破","need":{"精神":38},"win":{"text":"你把刀放在他脚边。影子抬手按了按你的头，像你六岁那年。然后它散了。","d":{"等级":3,"精神":5,"名望":10,"bonds":{"杀戮之王":8},"flags":["shashen","laid_down"],"trait":{"仁":2,"逆":1}}},"note":"按：原著心魔关靠意志硬闯，放刀破心魔是本线原创。"},{"t":"转身，退出地狱路","hint":"活下去，但再没有第二次","win":{"text":"你退出了门。王说过，回头的人这辈子别想再进第二次。可你活着。","d":{"flags":["turned_back"],"trait":{"险":-2}}}}]},{"id":"n_swan_kiss","title":"雪色天鹅吻","year":2649,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M44","echo":{"flag":"shashen","text":"前因 · 2649：你从地狱路走了出来，身上多了一层红雾。"},"text":"那一夜唐银带你去了血湖。湖面暗红，没有风也在起伏，像在呼吸。他从怀里拿出一朵雪白的花，花瓣弯得像低下脖子的天鹅：「雪色天鹅吻。它不杀人，只让毒长得快上千百倍。」\n\n「城里还有人。」你说，「还有孩子。」\n\n「这湖不干，城就一直在。还会有人爬进来，还会有孩子在六岁那年喝下第一杯整的。」他看着你，「你是在这儿生的。我想听你说一句。」\n\n你什么也没说出来。花落进湖里，沉了。湖面翻成发黑的紫，甜腻的毒雾漫向四方，王座方向传来成千上万只蝙蝠张嘴的嘶吼，钟楼响了。胡列娜从雾里冲出来：「上层有暗道，武魂殿的人在出口接应！」\n\n黑巷那边，有孩子在哭。","choices":[{"t":"挡在唐银身后截血卫","hint":"关键战：他会记得是谁守住了湖边","need":{"战力":650},"chance":0.6,"win":{"text":"血卫一排排扑上来，你一个人守住了湖岸。唐银走前回头看了你一眼。","d":{"名望":6,"bonds":{"唐三":10},"flags":["side_tang","rearguard"],"trait":{"忠":1,"险":1}}},"lose":{"text":"你挡下七个，第八个的铁钩撕开了你的背。唐银把你扛出了毒雾。","d":{"伤势":50,"bonds":{"唐三":6},"flags":["side_tang"]}}},{"t":"跑回黑巷，把孩子背出去","hint":"能救几个是几个","win":{"text":"老鸦塞给你几瓶解药，自己留下了。你背出九个孩子，紫月在身后灭了。","d":{"伤势":25,"bonds":{"老鸦":6,"唐三":4},"rep":{"天斗":3},"flags":["side_tang","saved_kids"],"trait":{"仁":2,"群":1}}},"note":"按：老鸦配了三十年解药，只够孩子用，原创设定。"},{"t":"护着胡列娜从暗道出城","hint":"武魂殿会欠你一个人情","win":{"text":"暗道尽头是武魂殿的斗篷。她回头看了一眼毒雾：「千年之约，这回算我欠你。」","d":{"bonds":{"胡列娜":10},"rep":{"武魂殿":8},"flags":["side_hu"],"trait":{"群":1,"逆":-1}}}}]},{"id":"n_gengxin","title":"庚辛城的炉火","year":2651,"cond":{"flag":"side_tang","notFlag":null,"levelMin":0},"canon":"M55","echo":{"flag":"saved_kids","text":"前因 · 2649：你背出来的九个孩子，如今住在天斗城外的孤儿院。"},"text":"出城后的两年，你在天斗城外打生死斗。断了血腥玛丽，头半年像死过一回；熬过去，魂力像决堤的河——那座城压了你二十年。\n\n二六五一年春，天斗城都在传两件事：蓝电霸王龙宗一夜灭门；城南新起了一个唐门。宗主怀里抱着一只一动不动的粉白小兔：「我说过，两年。我叫唐三，唐银是城里用的名字。」\n\n一个月后，你随他去了庚辛城。那一夜唐门屠武魂殿主殿，你在回廊尽头堵住一个肩头带伤的人。他掌心一盏冷白的灯，被风吹得明明暗暗——当年在北镇送胡列娜下台阶的，就是他。\n\n「是你。」苏夜说，「城里出来的那个。」回廊那头，唐门弟子的脚步声越来越近。","choices":[{"t":"放那个提灯的人走","hint":"唐三不会问，但他会知道","win":{"text":"你侧身让开。他走过你身边时低声说：「我欠你一次。」唐三没问，但他知道。","d":{"等级":3,"bonds":{"苏夜":10},"flags":["joined_tangmen","spared_suye"],"met":["wuhun"],"trait":{"仁":1,"忠":-1}}}},{"t":"把他押到唐三面前","hint":"苏夜会记得是你押的","win":{"text":"唐三看了苏夜很久，放他走了。苏夜记得，押他来的是你。","d":{"等级":3,"bonds":{"唐三":6,"苏夜":-8},"rep":{"武魂殿":-5,"宗门":5},"flags":["joined_tangmen"],"met":["wuhun"],"trait":{"忠":1}}}}]},{"id":"n_star_lake","title":"星湖","year":2651,"cond":{"flag":"side_hu","notFlag":null,"levelMin":0},"canon":"M52","echo":{"flag":"ally_hu","text":"前因 · 2647：你在城里替胡列娜挡过三刀。"},"text":"武魂殿兑现了承诺。档案上你是北境猎户之子；胡列娜封圣女那天，你成了圣女身边的刀。断了血腥玛丽，头半年像死过一回，之后魂力像决堤的河。她请你吃了十串冰糖葫芦，你吃到第三串就酸皱了脸。\n\n二六五一年，教皇下令去星斗大森林猎十万年魂兽。菊鬼二老压阵，邪月、焱、苏夜都在。胡列娜带来一个人，眼睛亮得惊人：「他也是城里出来的。」唐银朝你拱了拱手。夜里，湖雾中有个白发女孩赤脚站在冰碴上，看着营火。\n\n第五天，星湖。天青牛蟒与泰坦巨猿破水而出，唐银反水，蓝银草暴起，黑锤在手。粉色的光从被围的女孩身上升起，落进他的身体。菊斗罗尖声叫出：唐三。邪月的月刃已在你身边亮起，胡列娜踉跄着退到悬空的碎石边。","choices":[{"t":"护住胡列娜，拖离湖岸","hint":"她会记住谁在她最难看时站在前面","win":{"text":"你把她拖离碎石。她攥着你的袖子，指节发白，一句话也没说。","d":{"等级":3,"bonds":{"胡列娜":10},"rep":{"武魂殿":5},"flags":["saint_blade"],"met":["wuhun"],"trait":{"忠":1}}}},{"t":"横刀替唐三挡月刃","hint":"关键战：邪月不会认错第二次","need":{"战力":800},"chance":0.5,"win":{"text":"月刃撞上你的刀，偏了半尺。没人看清是谁出的手，除了唐三。","d":{"等级":3,"bonds":{"唐三":10,"胡列娜":-5},"flags":["saint_blade","helped_tang_lake"],"met":["wuhun"],"trait":{"逆":1,"险":1}}},"lose":{"text":"月刃劈开了你的刀和肩。邪月盯着你，没有再出第二刀。","d":{"等级":3,"伤势":50,"bonds":{"唐三":5},"flags":["saint_blade"],"met":["wuhun"]}}},{"t":"去雾里放走白发女孩","hint":"放她走，比猎她难","win":{"text":"你冲她摆了摆手。她后退一步，又一步，消失在雾里。","d":{"等级":3,"bonds":{"白霜":10},"rep":{"魂兽":8,"武魂殿":-5},"flags":["saint_blade","spared_baishuang"],"met":["wuhun","beast"],"trait":{"仁":2,"逆":1}}},"note":"按：白霜是十万年霜角白鹿化形，也在这次猎捕名单上。"}]},{"id":"n_ruins","title":"紫月的残骸","year":2654,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":null,"echo":{"flag":"crow_poison","text":"前因 · 2636：你跟老鸦认过毒，认得他那一手字。"},"text":"城毁后第五年，从城里出来的人开始死于一种热病：紫月该升起的夜里，血自己烧三天，第三天人就没了。你咬着刀柄熬过第一次，手背血管成了暗紫，梦里的王座后面全是红眼睛。\n\n你独自北上。北镇酒馆塌了一半，石阶断成几截。杀戮之都还在，只是死了：血湖干成黑亮的硬壳，王座裂成两半，面具不见了。石室深处有一道你没见过的门，门口靠墙坐着一具骸骨，一侧眼窝还缠着黑布，怀里抱着油布包好的一摞纸。是老鸦。\n\n纸上抄着门后的刻纹：执剑的修罗，执镰的罗刹；修罗第八考，曰守狱。最后半行是：「城毁那夜，王没有死。蝠王也没有。它会去找」\n\n门后亮起一对、两对、三对红眼睛——是同一只。四万年的渊影魔蝠在嗅你。你的双刃发烫，血纹正一寸寸变成暗金。","choices":[{"t":"斩了魔蝠，读完最后一页","hint":"关键战：你会知道王在等什么 · 达到标示战力后可挑战，获胜才能取得奖励","need":{"战力":1405},"chance":0.55,"win":{"text":"魔蝠倒下时，双刃已成暗金长刃。你读完了：王即守狱者，他在等一个能杀而不杀的人。","d":{"等级":2,"ring":{"beast":"渊影魔蝠","years":42000,"kind":"攻","skill":"修罗血刃·真身","desc":"器魂真身：双刃化为暗金长刃，刃过之处吞噬魂力"},"bone":{"slot":"右臂","name":"渊蝠臂骨","desc":"臂上可化出半透明骨刃，命中时吸走对手少量魂力","attrs":{"体魄":4,"精神":4}},"bonds":{"老鸦":5},"flags":["know_trial","wuhun_mutated"],"trait":{"逆":1,"险":1}}},"lose":{"text":"魔蝠撕开你的胸口逃进黑暗。你抱着译稿爬出来，血纹已变成暗金。","d":{"伤势":65,"flags":["know_trial","wuhun_mutated"]}},"battle":{"n":"渊影魔蝠","years":42000}},{"t":"斩了魔蝠，封上门和笔记","hint":"关键战：有些秘密，不知道也能活 · 达到标示战力后可挑战，获胜才能取得奖励","need":{"战力":1405},"chance":0.55,"win":{"text":"你把老鸦和他的三十年一起封进石室。有些秘密，不知道也能活。","d":{"等级":2,"ring":{"beast":"渊影魔蝠","years":42000,"kind":"攻","skill":"修罗血刃·真身","desc":"器魂真身：双刃化为暗金长刃，刃过之处吞噬魂力"},"bone":{"slot":"右臂","name":"渊蝠臂骨","desc":"臂上可化出半透明骨刃，命中时吸走对手少量魂力","attrs":{"体魄":4,"精神":4}},"flags":["wuhun_mutated","sealed_ruins"],"trait":{"逆":-1}}},"lose":{"text":"你没斩下它，只来得及合上那道门。门后的嗅声，很久才停。","d":{"伤势":65,"flags":["wuhun_mutated","sealed_ruins"]}},"battle":{"n":"渊影魔蝠","years":42000}},{"t":"背上老鸦的骨头离开","win":{"text":"你没碰那双红眼睛。北镇后山，你把老鸦和译稿埋在一起，先读完了最后一页。","d":{"bonds":{"老鸦":8},"flags":["know_trial"],"trait":{"仁":1,"险":-1}}}}]},{"id":"n_slaughter_king","title":"杀戮之王","year":2656,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M69","echo":{"flag":"fog_trail","text":"前因 · 2655：你在冰原上循着红雾，找到过一个活口。"},"text":"两年里大陆变了天：武魂殿立国，唐三从海上回来，满大陆都在传昊天宗复出。二六五六年冬，你在一条冰谷里追上了那团红雾。\n\n谷里已有武魂帝国的寂灭小队，二十五人摆成十人围一人的阵。被围的是个赤脚的白发老人，红雾里无数红眼睛明灭。二十五道魂环同时亮起，又像风里的烛火一个个灭了。一炷香不到，没有一个人走出那片雾。红雾漫上山脊，你膝盖一软，几乎跪下——就像城里每个人在王座底下跪了一辈子。\n\n南边亮起蓝金色的光，额上烙着三叉戟的青年踏雪而来。老人捂头跪倒，眼里的红褪去。他叫唐晨，是唐三的曾祖父。天亮前他看见了你：「城里的孩子，你身上有我的血。我欠你们一座城。」\n\n他要去海边见一个人，唐三要南下嘉陵关。你看见老人按在胸口的手，每隔几步就收紧一下。","choices":[{"t":"跟上老人去海边","hint":"你知道他身体里还有东西没走","win":{"text":"他没回头，也没赶你走。瀚海城的船，要走十天。","d":{"bonds":{"唐晨":10},"flags":["go_sea"],"trait":{"逆":1}}}},{"t":"随唐三南下嘉陵关","hint":"战争要来了","win":{"text":"唐三把你编进唐门先锋，没给职位：「城里学的东西，这里用得上。」","d":{"bonds":{"唐三":5},"rep":{"天斗":5},"flags":["go_south"],"trait":{"群":1}}}},{"t":"回武魂帝国，回她身边","hint":"她站在另一边，你也会","win":{"text":"她在帅帐门口看见你，伸手理了理你的领口：「瘦了。北边的东西不好吃吧？」","d":{"bonds":{"胡列娜":8},"rep":{"武魂殿":8},"flags":["go_hu"],"trait":{"忠":1}}}}]},{"id":"n_jialing","title":"嘉陵关","year":2657,"cond":{"flag":"go_south","notFlag":null,"levelMin":0},"canon":"M82","echo":{"flag":"spared_suye","text":"前因 · 2651：庚辛城的回廊里，你放苏夜走过。"},"text":"去年那场强攻，嘉陵关下死了十万人。二六五七年开春，唐三从海上回来，天斗大军再次压到关下。百米高的关墙，让你想起杀戮场那堵外墙。开战前，背霜剑的林照瞥你一眼：「唐宗主说，你在只有杀人的城里长大，却没变成那座城。」手臂缠着蓝电的玉衡跟在柳二龙身后，每次冲锋都冲在最前。\n\n攻到第三天，人一排排冲上去，一排排倒下，没有看台，没有人下注。黄昏，苏夜从城头的阴影里走出来，冷白的灯光扫过，天斗士兵一个个眼神空了，被箭雨钉在原地。林照的剑光劈开圣龙军团前锋：「我替你挡住，你去灭了那盏灯！」\n\n灯光碰了碰你的心防，门后是一个场子，一炷香。城下还有成百上千的伤兵躺在泥里，没人去拖。","choices":[{"t":"迎着那盏灯冲上城头","hint":"关键战：灭了冥月灯，城下少死一片人","need":{"战力":1200},"chance":0.45,"win":{"text":"你撑过三回合冥月灯，刀尖抵上灯芯。灯灭时苏夜笑了一下，城下少死了一片人。","d":{"名望":15,"bonds":{"林照":8,"唐三":5},"met":["qibao","landian"],"trait":{"险":1},"ending":"e1"}},"lose":{"text":"冥月灯翻开了那炷香，你跪在城头。再醒来时，你躺在北去的板车上。","d":{"伤势":60,"met":["qibao","landian"],"ending":"e4"}}},{"t":"放下刀，去城下拖伤兵","hint":"今天不必再多死一个人","win":{"text":"你拖了一夜伤兵，刀一次都没出鞘。天亮时林照在你身边坐下，什么也没说。","d":{"名望":8,"bonds":{"林照":5,"唐三":5},"met":["qibao","landian"],"trait":{"仁":3},"ending":"e1"}}},{"t":"扔下刀，离开战场","hint":"这一回，你只想活下去","win":{"text":"你扔下刀，向北走。这一回，你只想活下去。","d":{"flags":["deserted"],"met":["qibao","landian"],"trait":{"群":-2,"险":-1},"ending":"e4"}}}]},{"id":"n_sea_god","title":"海神岛的三日","year":2657,"cond":{"flag":"go_sea","notFlag":null,"levelMin":0},"canon":"M80","echo":{"flag":"know_trial","text":"前因 · 2654：你读完了老鸦的译稿，知道王在等什么。"},"text":"船走了十天。唐晨每夜坐在船头看海，眼睛会变红，你就把双刃横在膝上守着。第七夜他开口：「她说谁先成神就嫁谁，我转身就走了。修罗第八考叫守狱。我选了那座城，想着十年总能等到一个生于杀、长于杀，却能在当杀时不杀的人。」他按住胸口，「等到罗刹的怨念渗进骨头，那头蝙蝠钻了进来。那年场上有个孩子扔了刀，我站起来说了句话。那是我最后一次清醒。」\n\n海神岛上，波赛西站在潮水里，像站了几十年。第二天唐晨咳出暗紫的血。第三天黄昏，她把你叫到一边：「它在他心脉里扎了几十年的根，他撑不过今夜。它也可以现在出来——它会认你，你从生下来就喝着它的血。他能多活几年。可是你……」\n\n屋里，唐晨握着一柄血红的剑，没有回头：「孩子，别听她的。我欠的够多了。」","choices":[{"t":"把蝠王引进自己的血里","hint":"改写原著：唐晨活到终战","need":{"精神":50},"canonChange":{"node":"M80","inertia":4,"desc":"唐晨未死于海神岛，亲手交出修罗魔剑，终战代尘心、古榕赴死"},"win":{"text":"你握住他的手，它沿着他的手臂一寸寸爬进你的身体。那是你喝下的最后一杯血腥玛丽。","d":{"伤势":40,"shift":15,"bonds":{"唐晨":15,"波赛西":5},"flags":["bat_host"],"trait":{"逆":3,"仁":1},"ending":"e3"}}},{"t":"守着他，走完这三天","hint":"他想死在她身边，这是他自己选的","win":{"text":"第三天黄昏，他死在她身边。那柄血红的剑，后来到了唐三手里。","d":{"bonds":{"唐晨":8,"波赛西":5},"trait":{"逆":-1,"忠":1},"ending":"e1"}}}]},{"id":"n_pass_break","title":"破关之日","year":2657,"cond":{"flag":"go_hu","notFlag":null,"levelMin":0},"canon":"M82","echo":{"flag":"saint_blade","text":"前因 · 2651：星湖那天，你是圣女身边的刀。"},"text":"胡列娜没问你这两年去了哪儿。立国后她做过一阵摄政，在长老殿里吵赢了，也吵累了，眼角的媚意底下压着更重的东西。\n\n二六五七年，嘉陵关守不住了。最后一天清晨，关墙内侧升起一片碧绿的雾——毒斗罗的毒失了控，不挑人，漫过城墙和营房，守军成片跪倒。胡列娜站在关墙上一动不动：「老师让我守着这里。」\n\n「这里已经没了。」你把她拽下城墙，从运粮小道往南边山里跑。她的魂力在掉，咳出来的血是黑的。二十里外的断崖拐角，站着背霜剑的林照，衣襟上沾着关下的泥和血：「武魂帝国的圣女，你走不了。今天关下死了几十万人，总得有人给个交代。」\n\n胡列娜拉了拉你的衣角：「别打。把我交出去，你还能……」\n\n「在城里，你答应过带我出去。」你转过身，「你做到了。」","choices":[{"t":"拔刀，迎上林照的剑","hint":"关键战：你身后就是胡列娜","need":{"战力":1250},"chance":0.45,"win":{"text":"你的刀先停，她的剑也收了。林照看了你很久：「你在城里护过她，现在还护着。行吧。」","d":{"名望":10,"bonds":{"胡列娜":10,"林照":3},"met":["qibao"],"trait":{"险":1,"忠":1},"ending":"e2"}},"lose":{"text":"霜剑穿透了你的红雾。醒来时你躺在北去的车上，没人告诉你她去了哪儿。","d":{"伤势":70,"bonds":{"胡列娜":5},"met":["qibao"],"ending":"e4"}}},{"t":"收刀，向林照求一条路","hint":"你在城里从没求过谁","win":{"text":"你在城里从没求过谁。林照沉默了很久，侧身让开：「往西走，别回头。」","d":{"bonds":{"胡列娜":6,"林照":8},"met":["qibao"],"trait":{"仁":2,"群":1},"ending":"e2"}}}]}],"endings":[{"id":"e1","title":"结局·刑堂","type":"律","grade":2,"text":"战争在你二十八岁那年结束。唐三没有杀千仞雪，也没有杀胡列娜；唐门的暗器图纸被一张张送进熔炉。那夜他来找你：「唐门要设刑堂。你见过最坏的规矩，见过的人才知道该怎么写一条好的。」你在空屋里坐了三天，第三天清晨写下第一条：「唐门刑堂，不设死刑。」你废过人的魂力，赶过人出山门，却没让任何人死在刑堂里。偶尔你梦见王座上的老人摘下面具，看着那张纸，点了点头。考成了。","afterlife":["唐三：唐门从此不造暗器，刑堂第一条被他刻进了宗规。","唐晨：死在海神岛的黄昏，死在等了他几十年的女人身边。","老鸦：三十年的译稿，被你收在刑堂书架的最高一层。","杀戮之都：北镇那块木板上压了块石头，你每年冬天去看一眼。"],"worldline":"唐门刑堂由杀戮之都长大的人执掌，第一条是不设死刑；世界线大体随原著收束。"},{"id":"e2","title":"结局·狐火","type":"守","grade":2,"text":"后来的事，是在山里猎户家听说的：唐三死了又活，成了神；最后那一剑，比比东替她女儿挡下了。胡列娜一夜没说话，天亮时才开口：「她教我杀人，教我魅惑人，从没教过我怎么哭。」唐三赦免了她。她没回武魂城：「我想去看海，没有紫月的那种。」你们在瀚海城外的渔村住下，她补渔网，补一次骂一次。那座城教你别对谁动心，后来你才知道，它教的一大半是错的。","afterlife":["胡列娜：在渔村补了一辈子渔网，再没用过魅惑。","邪月：收到她托人带回的一封信，守着空了的教皇殿。","林照：回七宝复命，只说断崖下没找到人。","武魂殿：残部群龙无首，就此星散。"],"worldline":"胡列娜获赦后不回武魂城，武魂殿残部群龙无首、就此星散。"},{"id":"e3","title":"结局·空城之王","type":"王","grade":3,"text":"你醒来已是第五天。唐晨又活了一年多：亲手把修罗魔剑交给唐三，陪波赛西走到海神之光散尽，然后去了天斗城。双神联手那天，一个白发老人提着漆黑的巨锤先一步迎了上去，替两位老友死在城下。你回到北边那座空城，在门楣刻下一行字：「此城不再收人。」有人掀开北镇的木板往下看，会看见一双暗金色的眼睛，听见一声：「回去。」他们都回去了。","afterlife":["唐晨：代尘心、古榕战死在天斗城下，这一回是他自己选的。","尘心与古榕：活到七宝少宗主出嫁那天，一左一右坐在主位上。","波赛西：在第九考中献祭，终于等到了他。","血红九头蝙蝠王：锁在你的血里，锁在一座空城里。"],"worldline":"唐晨活到终战并代尘心、古榕战死，七宝两大斗罗存活；血红九头蝙蝠王被你锁进杀戮之都废墟。"},{"id":"e4","title":"结局·北镇酒馆","type":"凡","grade":1,"text":"你记不清自己是怎么走回北镇的，只记得雪很厚，你一路在想：这辈子还没为自己活过一天。你花了一个冬天修好塌掉的酒馆，在那块木板上压一口大酒缸。酒是麦子酿的，不掺血。南边的消息一年年传来，你擦着杯子，不说话。有年冬天来了个冻紫嘴唇的孩子，问这底下是不是有座城。「以前有，」你说，「现在没了。」每年紫月该升起的夜里，你给自己倒一杯麦酒，对着酒缸说：「我活下来了。」","afterlife":["唐三：成了神。北镇的人说起他，像说一个很远的故事。","胡列娜：听说获了赦，去了海边。你没去找她。","那个孩子：在你店里跑堂，后来学会了酿酒。","杀戮之都：木板压在酒缸底下，再没有人下去过。"],"worldline":"你从大陆的棋盘上消失，世界线照原著走完；北镇多了一间不卖血的酒馆。"}],"summary":"每局 8 个节点（含互斥分支共 11 个）。十人活一：依城规送父亲走或扔刀成王的血侍；结盟唐银 / 胡列娜 / 独行；地狱路心魔战定杀神；毁城后分庚辛城（苏夜）与星湖（白霜）；城墟斩渊影魔蝠、知修罗第八考；唐晨苏醒后分嘉陵关（战苏夜）、破关（战林照）、海神岛（引蝠王入体，）。结局：刑堂 / 狐火 / 空城之王 / 北镇酒馆。"},{"id":"qibao","title":"七宝琉璃宗·剑斗罗亲传","defaultName":"林照","gender":"女","tagline":"满门辅助，唯你一剑","intro":"七宝琉璃宗满门辅助，护着天下第二宗门的只有剑、骨两位斗罗。你是护卫营的孤女，六岁觉醒寒霜剑，被从不收徒的尘心带上听剑崖。猎魂之夜与嘉陵关在前方，师父的右臂与性命，都系在你的剑上。","birthYear":2631,"startYear":2637,"faction":"七宝琉璃宗","wuhun":{"name":"寒霜剑","type":"器","system":"强攻","tier":"顶","desc":"霜白细长的单剑，斩中处结霜封脉。剑意主「止」，越冷越锋利。"},"innate":9,"attrs":{"体魄":32,"精神":34,"悟性":42,"魅力":24,"气运":22},"coins":80,"rep":{"武魂殿":-5,"天斗":5,"星罗":0,"宗门":15,"魂兽":0},"bonds":{"尘心":10,"宁荣荣":8,"古榕":3,"宁风致":3},"flavor":{"work":{"name":"护卫营押镖","desc":"随七宝商队押镖换饷银"},"faction":{"name":"宗门差事","desc":"替宗主跑腿、守夜、看账"},"place":"七宝城·听剑崖"},"rings" n":{"yearMin":2651,"yearMax":2653,"levelMin":0,"flag":null,"notFlag":null},"w":5,"once":true,"text":"猎魂之夜后一个月，七宝迁入天斗城。宁风致咳着血，在城南划出一大片地交给唐三，叫他立一个新宗门：唐门。七宝出钱、出人、出门路。「七宝输得太惨，」他对你说，「唐三是我们押上的最后一枚筹码。」","choices":[{"t":"代七宝坐进唐门议事堂","win":{"text":"你坐在议事堂末席，替七宝记下每一笔钱的去处。唐三敬了你一杯茶。","d":{"bonds":{"唐三":6,"宁风致":4},"rep":{"宗门":5},"名望":6,"trait":{"忠":1},"flags":["tangmen_seat"]}}},{"t":"回去陪两位老人几天","win":{"text":"师父嘴上赶你走，夜里却多煮了一碗面。古榕嗤笑：「老剑，你也有今天。」","d":{"bonds":{"尘心":8,"古榕":5},"trait":{"群":1}}}}]},{"id":"ev_gengxin","title":"凡铁剑鞘","when":{"yearMin":2651,"yearMax":2653,"levelMin":0,"flag":null,"notFlag":null},"w":4,"once":true,"text":"你随荣荣去庚辛城替唐门采买铁料。铁匠协会里有个满手烫疤的学徒叫欧冶青，盯着你的寒霜剑看了很久：「器武魂没有鞘，会冷着自己。我给你打一副，凡铁的。」","choices":[{"t":"收下这副凡铁剑鞘","win":{"text":"剑鞘不值钱，可寒霜剑放进去严丝合缝。那夜你第一次睡得暖。","d":{"item":"凡铁剑鞘","精神":2,"bonds":{"欧冶青":8},"met":["shenjiang"],"flags":["iron_sheath"]}}},{"t":"去废料堆里淘寒心铁精","need":{"金魂币":300},"chance":0.4,"win":{"text":"你淘出一块寒心铁精，欧冶青把它锻进剑鞘，剑鸣都变清了。","d":{"金魂币":-300,"item":"寒心铁精剑鞘","精神":3,"体魄":2,"bonds":{"欧冶青":5},"met":["shenjiang"],"flags":["iron_sheath"]}},"lose":{"text":"三百金魂币换来一块废铁。欧冶青憋着笑，还是给你打了副鞘。","d":{"金魂币":-300,"item":"凡铁剑鞘","bonds":{"欧冶青":5},"met":["shenjiang"],"flags":["iron_sheath"]}},"note":"按：庚辛城能淘到寒心铁精等稀有金属，是原著的机缘地。"}]},{"id":"ev_cracked","title":"裂了的剑","when":{"yearMin":2651,"yearMax":2654,"levelMin":0,"flag":"sword_cracked","notFlag":null},"w":5,"once":true,"text":"你在病床上躺了半个月，寒霜剑一凝就疼，剑身上蛛网似的裂纹怎么也合不上。古榕站在床边，脸色铁青：「老剑那条胳膊是替你挨的。你要是就此废了，他才是白挨。」","choices":[{"t":"把裂剑一寸寸重新磨过","need":{"精神":48},"chance":0.55,"win":{"text":"冰裂了再冻上，比原来更硬。裂纹成了剑脊上一道白线。","d":{"体魄":3,"精神":4,"bonds":{"古榕":5},"trait":{"险":1},"flags":["reforged_sword"]}},"lose":{"text":"磨到第七天，裂纹又崩开一寸，你疼晕在剑庐里。","d":{"伤势":35,"精神":1}}},{"t":"去唐门求唐三救师父的手","win":{"text":"唐三点头，说他会尽全力。师父知道后，一个谢字也没说。","d":{"bonds":{"唐三":6,"尘心":6},"trait":{"仁":1,"群":1}}}}]},{"id":"ev_reselect","title":"七宗重选","when":{"yearMin":2653,"yearMax":2655,"levelMin":55,"flag":null,"notFlag":null},"w":4,"once":true,"text":"武魂殿召开七宗重选大会，九宝琉璃宗的席位要靠人打下来。荣荣远在海上，宗主身后站着两位老人，还缺一把能上台的年轻的剑。对面是武魂殿扶起的新宗，领头的是个魂斗罗。","choices":[{"t":"替九宝上台出剑","need":{"战力":1100},"chance":0.45,"win":{"text":"你三剑逼下那名魂斗罗，台下一片死寂。九宝的席位，是你砍回来的。","d":{"名望":12,"rep":{"宗门":8,"武魂殿":-6},"trait":{"险":1,"忠":1}}},"lose":{"text":"你撑了十招才落台。席位最后靠宗主的情面保住了。","d":{"伤势":40,"名望":4,"rep":{"宗门":2}}}},{"t":"站在宗主身后，不出剑","win":{"text":"你只是站着。宁风致说过，剑只要站在那里，别人就会算清楚。","d":{"魅力":2,"rep":{"宗门":3},"trait":{"险":-1}}}}]},{"id":"ev_north_again","title":"旧羊皮地图","when":{"yearMin":2653,"yearMax":2656,"levelMin":60,"flag":null,"notFlag":"north_sword"},"w":3,"once":true,"text":"大陆上战火渐起，你的剑意却一直差最后一口气。师父把那张旧羊皮地图又压在了你的剑架上，冰川处的墨点还在，什么字也没写。荣荣远在海上，宗门暂时还用不着你。","choices":[{"t":"独自北上去看那座冰川","need":{"悟性":52},"chance":0.55,"win":{"text":"你在师父十六岁的剑痕前坐了三天，起身时，满谷风雪停了一息。","d":{"悟性":4,"bonds":{"尘心":4},"flags":["north_sword"],"trait":{"群":-1,"险":1}}},"lose":{"text":"暴风雪困了你两个月。你没找到冰川，只带回一身冻伤。","d":{"伤势":35,"体魄":2}}},{"t":"把地图收好，留在宗门","win":{"text":"你把地图压回剑架。有些剑，要到最后才知道自己是什么。","d":{"rep":{"宗门":3},"trait":{"群":1,"险":-1}}}}]}],"nodes":[{"id":"n_awaken","title":"寒霜出鞘","year":2637,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M03","text":"七宝城的琉璃殿每年开春开一次侧门，放外院的孩子觉醒武魂。殿里亮起的尽是琉璃塔、玉笛、药囊，好看，值钱，却没有一样能杀人。\n\n轮到你时，你报的是护卫营。爹前年护送商队去巴拉克，再没回来，名字刻在后山一块青石上，刻得很浅，下雨天要用手指摸才摸得出。\n\n手按上水晶球，掌心猛地一顶，像屋檐下的冰凌咔地断下来。你握住了一柄霜白的细剑，脚边青砖结了一圈白霜。先天魂力九级。\n\n殿门口站着两个老人。骨斗罗古榕先笑出声：「冰做的剑，老剑，正配你那张脸。」剑斗罗尘心没笑，看了你很久，说：「跟我走。」他这辈子从没收过徒弟。人群里，一个绛红裙子的小丫头被挤倒在地，正哭鼻子。","choices":[{"t":"跪下，向剑斗罗叩三个头","hint":"规矩人，师父嘴上不说，心里记着","win":{"text":"你磕得额头见了红。师父没扶你，只把自己的剑穗解下来，系在了你的剑柄上。","d":{"bonds":{"尘心":5},"trait":{"忠":1},"flags":["kowtow"]}}},{"t":"抬头反问：你的剑能教我什么","hint":"骨斗罗会大笑，剑斗罗会多看你一眼","win":{"text":"古榕笑得直拍大腿。师父答：「教你活着把剑收回来。」你没听懂，跟他走了。","d":{"悟性":1,"bonds":{"尘心":6,"古榕":4},"trait":{"逆":1,"险":1},"flags":["asked_back"]}}},{"t":"先去扶起哭鼻子的小丫头","hint":"宁荣荣从此认得你，宗主也是","win":{"text":"她抽抽搭搭地抓着你的袖子不放：「你的剑好冷。」宗主宁风致在一旁笑了。","d":{"魅力":1,"bonds":{"宁荣荣":8,"宁风致":4},"trait":{"仁":1,"群":1},"flags":["helped_rongrong"]}}}]},{"id":"n_leave_home","title":"少主离家","year":2643,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M11","text":"二六四三年春，宁荣荣坐在宗主书房的窗台上晃着腿：「史莱克学院，只收怪物。我倒要看看什么怪物配跟本小姐同学。」她目光一扫，落在门边的你身上，「谁敢偷偷跟着，我就跟谁绝交，一辈子。」\n\n她走后，宁风致亲手给你倒了一杯茶。七宗宗主给护卫营的孤女倒茶，传出去要被账房的老先生念叨半个月。「骨叔剑叔若去，三天之内满城都知道七宝少主到了。你不同。」他没说完，你听懂了：做她的影子。\n\n可师父已经在听剑崖上收拾出了第二张石床。他说你的剑到了该磨的时候，再晚，就钝了。","choices":[{"t":"随少主南下，做她的影子","hint":"分叉：索托城。宗主会记着这份情","win":{"text":"你揣着宗主给的盘缠南下，在史莱克对面的老槐客栈住了下来，推开窗就是那块歪招牌。","d":{"金魂币":200,"bonds":{"宁风致":6,"宁荣荣":4},"rep":{"宗门":3},"trait":{"群":1,"忠":1},"flags":["shadow_guard"]}}},{"t":"留下，随师父上听剑崖","hint":"分叉：听剑崖。师父不会说他很高兴","win":{"text":"你搬上听剑崖。站桩三个时辰，挥剑一万次，少一次师父就站在旁边看着。","d":{"悟性":2,"体魄":1,"bonds":{"尘心":8},"trait":{"群":-1},"flags":["sword_cliff"]}}}]},{"id":"n_order","title":"五百套暗器","year":2644,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M27","echo":{"flag":"sparred_tangsan","text":"前因 · 2643：你在索托斗魂场和唐三交过一回手。"},"text":"二六四四年秋，力之一族族长泰坦当街跪在一个十三岁少年面前，叫他少主。消息传进七宝别院时，你正在屋顶值夜。\n\n脚下书房里，宁风致刚给那个叫唐三的少年下了五百套暗器的订单，五百万金魂币。他说山雨欲来，七宝要先买一把伞。\n\n然后是古榕的声音，冷得像骨头上刮下来的霜：「昊天宗的种，十年后就是第二个唐昊。趁他羽翼未丰——此子留不得。」\n\n「骨叔。」宁风致轻轻打断了他。书房里静了很久。你攥着剑柄，屋瓦上的霜化了又结。末了，宗主的声音仍是温温和和的：「再看看。」","choices":[{"t":"把古榕的话透给唐三","hint":"唐三欠你一份情；骨斗罗迟早知道是你","win":{"text":"唐三听完只说了句多谢，转身便走。三天后古榕看你的眼神，像在看一块没长好的骨头。","d":{"bonds":{"唐三":8,"古榕":-6},"trait":{"仁":1,"忠":-1},"flags":["warned_tangsan"]}}},{"t":"去找骨爷爷当面问个明白","hint":"他会骂你，然后教你七宝怎么活","win":{"text":"古榕骂了你半个时辰，最后说：「辅助宗门活下来，靠的是先想最坏的事。」","d":{"精神":1,"bonds":{"古榕":8},"rep":{"宗门":3},"trait":{"险":1},"flags":["gurong_lesson"]}}},{"t":"把听到的话烂在肚子里","hint":"宁风致会看出你懂分寸","win":{"text":"第二天宗主在廊下遇见你，只笑着说了句：「昨夜风大，辛苦了。」","d":{"魅力":1,"bonds":{"宁风致":6},"trait":{"险":-1,"忠":1},"flags":["kept_silent"]}}}]},{"id":"n_ambush","title":"场边的剑","year":2645,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M35","text":"精英大赛开幕，你没有参赛资格，只抱着剑站在史莱克休息区的栏杆外，像一根柱子。荣荣把九宝琉璃塔的光同时分给六个人，下场时冲你抬了抬下巴：看见没有。你点头，她哼一声扭过头，耳朵尖是红的。\n\n大赛移师武魂城的途中，山谷里伏兵四起。菊斗罗、鬼斗罗一左一右缠住了师父，史莱克众人被分割开，荣荣的马车前只剩下你。\n\n一杆倒刺长枪挑开了车帘。持枪的是武魂殿执事厉锋，四十七级魂宗，四个魂环在夜里一明一灭。他看了一眼你的剑，笑了：「七宝也养剑？」","choices":[{"t":"迎上那杆倒刺长枪","hint":"关键战：独自守住马车三回合","need":{"战力":450},"chance":0.5,"win":{"text":"第三剑，你的霜刃冻住了枪尖的倒刺。厉锋退了，荣荣从车窗里探出头，第一次没嫌你是冰棍。","d":{"名望":8,"体魄":2,"bonds":{"宁荣荣":6,"尘心":4},"trait":{"险":1},"flags":["held_carriage"],"reveal":["月关","鬼魅"]}},"lose":{"text":"倒刺刮开你的左肩，第四枪刺向车窗——天上落下一道剑光，厉锋连人带枪被劈成两半。师父背上挨了鬼斗罗一爪，只说：「还有谁。」","d":{"伤势":45,"bonds":{"尘心":8,"古榕":4},"flags":["master_saved_me"],"reveal":["月关","鬼魅"]}}},{"t":"死守车门，放声喊师父","hint":"不丢人。你会听到师父最长的一段话","win":{"text":"师父回剑救下了你。夜里古榕边缝伤口边骂：「喊救命不丢人，死了才丢人！」师父说了一夜的话。","d":{"伤势":15,"bonds":{"尘心":6,"宁荣荣":4,"古榕":3},"trait":{"群":1,"险":-1},"flags":["called_master"],"reveal":["月关","鬼魅"]}}},{"t":"抱起荣荣钻进密林","hint":"保人不保车","need":{"体魄":35},"chance":0.7,"win":{"text":"你背着荣荣在林子里绕了半夜，甩掉了追兵。她趴在你背上小声说：「木头，你别死。」","d":{"bonds":{"宁荣荣":6},"trait":{"仁":1,"险":-1}}},"lose":{"text":"你在林子里被追上，一枪擦过后背。是骨龙从地底翻起，把你们俩卷了回去。","d":{"伤势":30,"bonds":{"宁荣荣":4,"古榕":4}}}}]},{"id":"n_letters","title":"三封信","year":2647,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M41","echo":{"flag":"held_carriage","text":"前因 · 2645：你独自守住了荣荣的马车。"},"text":"武魂城那一锤之后两年，七怪散了。荣荣不再睡到日上三竿，夜里趴在藏书阁的书堆上睡着，手里攥着一张纸，只写了两个字：十年。\n\n你十六岁，剑意却像卡在鞘口，怎么也拔不出来。开春第一天，你屋里多了三封信。\n\n第一封是一张旧羊皮，压在剑架上：师父手绘的极北冰原地图，冰川处点着一个墨点，一个字也没写。第二封盖着宗主私印：「账房缺一双眼睛。」第三封是东宫的帖子，烫金，太子雪清河请七宝的剑入宫，教小郡主们习剑。那天师父什么也没说，却在你门外站了很久。","choices":[{"t":"带上旧地图，北上极北","hint":"分叉：极北冰原。剑意最纯，离七宝风声最远","win":{"text":"你一个人往北走。过了冰封森林，树没了，只剩一望无际的雪，白得分不清天地。","d":{"悟性":2,"体魄":2,"bonds":{"尘心":4},"trait":{"群":-1,"险":1},"flags":["went_north"]}}},{"t":"留在七宝，学看账看人","hint":"分叉：账房。你会看见第二宗门的另一面","win":{"text":"你被关进账房，一百二十个先生的算盘声像一场不停的雨。荣荣说你迟早被算盘埋了。","d":{"魅力":2,"精神":1,"金魂币":300,"bonds":{"宁风致":5,"宁荣荣":3},"rep":{"宗门":3},"flags":["ledger_room"]}}},{"t":"应太子之邀，入东宫教剑","hint":"分叉：天斗皇宫。人人都说太子好","win":{"text":"雪清河笑着说冰剑如雪，名不虚传。可你站在他面前，总像隔着一层看不见的琉璃。","d":{"魅力":2,"金魂币":200,"bonds":{"雪清河":5},"rep":{"天斗":6},"flags":["east_palace"]}}}]},{"id":"n_night_warned","title":"七宝之夜","year":2651,"cond":{"flag":"raid_warning","notFlag":null,"levelMin":0},"canon":"M51","echo":{"flag":"raid_warning","text":"前因 · 2650：你把武魂殿调兵的风声带回了宗主书房。"},"text":"二六五一年春夜，七宝城的灯一盏盏灭了，只剩最高处的琉璃塔还亮着。三更，你在东墙巡夜，脚下砖石轻轻一颤。城外亮起魂环的光，黄的、紫的、黑的，像潮水漫过来。最前面是两道九环。\n\n同一夜，天斗的另一头，蓝电霸王龙宗满门被屠。后来人们管这叫猎魂之夜。\n\n你早知道它会来。三天前你把风声带进宗主书房，宁风致沉默很久，连夜以游学之名把孩子们送出了城，又在东墙下埋了七宝存了五十年的琉璃阵基。\n\n师父从听剑崖一剑而下，被两个封号斗罗夹在半空，其中一个戴着银面具。一个魂圣狂笑着撞碎北门，直奔内院，宗主和荣荣就在里面。","choices":[{"t":"把警告变成部署，守东墙","hint":"改写原著：保住师父的右臂","need":{"战力":850},"canonChange":{"node":"M51","inertia":3,"desc":"七宝提前布防，剑斗罗右臂得保，宗门伤亡减半"},"win":{"text":"银面具那一掌冲师父右臂而去，你出剑。不是斩，是止。十丈风雪骤落，那团灰光慢了一息，七杀剑回锋。","d":{"shift":8,"名望":10,"bonds":{"尘心":10,"古榕":5},"rep":{"武魂殿":-10,"宗门":8},"trait":{"逆":2,"忠":1},"flags":["arm_saved"]}}},{"t":"迎战撞进内院的魂圣","hint":"关键战：拖住他，等古榕的骨墙合拢","need":{"战力":900},"chance":0.45,"win":{"text":"你撑过三回合，骨墙合拢，魂圣被骨龙压进地里。可半空中那一掌，还是毁了师父的右臂。","d":{"伤势":30,"名望":10,"bonds":{"宁风致":6,"宁荣荣":4},"trait":{"险":1,"忠":1},"flags":["held_inner"]}},"lose":{"text":"第三拳砸在剑身上，寒霜剑裂了。师父回剑钉死魂圣，把整个右侧留给了银面具。他的右臂，是替你挨的。","d":{"伤势":60,"bonds":{"尘心":10},"trait":{"险":1},"flags":["sword_cracked"]}}},{"t":"背起宗主，护荣荣进密道","hint":"保得住人，保不住别的","win":{"text":"你背着咳血的宗主冲进密道，荣荣攥着你的衣角。天亮时出来，师父的右袖空荡荡地垂着。","d":{"bonds":{"宁风致":8,"宁荣荣":5},"trait":{"仁":1,"险":-1},"flags":["carried_fengzhi"]}}}]},{"id":"n_night","title":"七宝之夜","year":2651,"cond":{"flag":null,"notFlag":"raid_warning","levelMin":0},"canon":"M51","text":"二六五一年春夜，七宝城的灯一盏盏灭了，只剩最高处的琉璃塔还亮着。三更，你在东墙巡夜，脚下砖石轻轻一颤。城外亮起魂环的光，黄的、紫的、黑的，像潮水漫过来。最前面是两道九环。\n\n同一夜，天斗的另一头，蓝电霸王龙宗满门被屠。后来人们管这叫猎魂之夜。\n\n这一个月你夜夜睡不着。城外的商队来了又走，天斗城里传来风声，好几座主殿的魂师不知去向。你什么都没抓住，只觉得这座城太安静了。\n\n师父从听剑崖一剑而下，被两个封号斗罗夹在半空，其中一个戴着银面具。一个魂圣狂笑着撞碎北门，直奔内院，宗主和荣荣就在里面。","choices":[{"t":"迎战撞进内院的魂圣","hint":"关键战：拖住他，等古榕的骨墙合拢","need":{"战力":900},"chance":0.45,"win":{"text":"你撑过三回合，骨墙合拢，魂圣被骨龙压进地里。可半空中那一掌，还是毁了师父的右臂。","d":{"伤势":30,"名望":10,"bonds":{"宁风致":6,"宁荣荣":4},"trait":{"险":1,"忠":1},"flags":["held_inner"]}},"lose":{"text":"第三拳砸在剑身上，寒霜剑裂了。师父回剑钉死魂圣，把整个右侧留给了银面具。他的右臂，是替你挨的。","d":{"伤势":60,"bonds":{"尘心":10},"trait":{"险":1},"flags":["sword_cracked"]}}},{"t":"背起宗主，护荣荣进密道","hint":"保得住人，保不住别的","win":{"text":"你背着咳血的宗主冲进密道，荣荣攥着你的衣角。天亮时出来，师父的右袖空荡荡地垂着。","d":{"bonds":{"宁风致":8,"宁荣荣":5},"trait":{"仁":1,"险":-1},"flags":["carried_fengzhi"]}}}]},{"id":"n_coup","title":"宫变","year":2652,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M56","echo":{"flag":"east_palace","text":"前因 · 2647：你在东宫教过剑，太子待你温和，却从不靠近。"},"text":"二六五二年，七宝以探病之名入宫。跟在宁风致身后的，有唐门的唐三，有剑、骨二老。师父的右手，又稳稳握住了七杀剑。\n\n长廊柱后那片比别处更浓的影子里，纪无声站着。你经过时，听见他极轻的两个字：「小心。」\n\n禁卫里一半是假的，白袍从盔甲下露了出来。雪清河站在雪夜大帝床前，脸上的温和一点点褪去，六道金翼在身后展开——不是他，是她。武魂殿的千仞雪，在东宫藏了十几年。\n\n天使领域压得你的剑抬不起来。唐三冲了上去，二老把一千魂师拦在殿门外。殿门口，一个提灯的金发青年正替千仞雪断后，灯光扫过之处，禁卫们眼神发直。他叫苏夜。","choices":[{"t":"拦住那个提灯的人","hint":"强战：冥月灯能窥人记忆","need":{"战力":1000},"chance":0.5,"win":{"text":"你一剑冻住灯焰，苏夜看了你一眼，像看见了你八岁那年的雪。他退了，断后的阵脚就此崩开。","d":{"名望":8,"rep":{"天斗":8,"武魂殿":-8},"bonds":{"苏夜":-5},"trait":{"险":1},"met":["wuhun"],"reveal":["千仞雪"],"flags":["stopped_suye"]}},"lose":{"text":"灯光扫过你的眼，你看见了冰封森林、听剑崖、东墙……回过神时，剑已脱手，他走远了。","d":{"伤势":40,"精神":1,"bonds":{"苏夜":3},"met":["wuhun"],"reveal":["千仞雪"]}}},{"t":"守在雪夜大帝床前","hint":"天斗会记得七宝的剑没有离开","win":{"text":"你横剑立在龙床前，直到金光散尽。纪无声从影子里出来，站到了你身边。","d":{"rep":{"天斗":10},"bonds":{"纪无声":4,"宁风致":3},"trait":{"忠":2},"met":["huangshi"],"reveal":["千仞雪"]}}},{"t":"宫变后独自北上","hint":"去看那座冰川，补全你的剑意","win":{"text":"荣荣出海那天，你往北走。师父什么也没说，只把旧地图压回了你的剑架上。","d":{"悟性":3,"bonds":{"尘心":3,"宁荣荣":-3},"trait":{"群":-2,"险":1},"reveal":["千仞雪"],"flags":["north_sword"]}}}]},{"id":"n_jialing_sword","title":"嘉陵关","year":2657,"cond":{"flag":"north_sword","notFlag":null,"levelMin":0},"canon":"M83","echo":{"flag":"north_sword","text":"前因：你在极北冰川上，见过师父十六岁斩下的那道剑痕。"},"text":"二六五六年秋，天斗大军兵临嘉陵关。圣龙军团的龙骑从关里冲出，前锋眼看要溃。师父一步踏上半空，七杀剑出鞘，一剑劈出几百丈深沟，龙骑连人带兽被掀翻。两军死寂，然后天斗爆出震天的欢呼。\n\n前一夜，他坐在营火边问你：「仗打完了，想做什么。」你想起极北冰川上那两道剑痕，没答上来。\n\n破关之后，罗刹神归来。死亡领域铺开，唐三倒下，复活之光在荣荣和奥斯卡手里一点点凝聚。你看见两位老人对视了一眼，骨龙低吼，七杀剑嗡鸣——他们要冲进去了。","choices":[{"t":"抢在师父之前出剑","hint":"改写原著：拦下剑、骨二老","need":{"战力":1250},"chance":0.4,"canonChange":{"node":"M83","inertia":4,"desc":"剑斗罗、骨斗罗未冲入死亡领域，七宝结局改写"},"win":{"text":"你在死亡领域里撑过了第三镰。复活之光亮起时，你跌进了一只握了一百多年剑的右手里。","d":{"shift":15,"trait":{"逆":3,"忠":1},"ending":"e1"}},"lose":{"text":"你挡住了两镰，第三镰落下时，复活之光亮了。你笑了一下，然后没有撑住。","d":{"shift":12,"trait":{"逆":2,"仁":2},"ending":"e4"}}},{"t":"转身守在荣荣身前","hint":"复活之光需要有人守；这是你六岁选好的位置","win":{"text":"你一步跨到荣荣身前，把漫过来的黑雾一缕缕冻碎在半空。越过她的肩，你看见两颗流星坠进深井。","d":{"bonds":{"宁荣荣":10},"trait":{"忠":2,"群":1},"ending":"e2"}}},{"t":"追着师父的剑光冲上去","hint":"师父的最后一剑，会留给你","win":{"text":"死亡领域里，师父第一次在出剑时回头：「胡闹。」那一剑轻得像风，把你推出了一百丈。","d":{"bonds":{"尘心":5},"trait":{"险":2,"群":-1},"ending":"e3"}}}]},{"id":"n_jialing","title":"嘉陵关","year":2657,"cond":{"flag":null,"notFlag":"north_sword","levelMin":0},"canon":"M83","echo":{"flag":"arm_saved","text":"前因 · 2651：你在东墙上保住了师父的右臂。"},"text":"二六五六年秋，天斗大军兵临嘉陵关。圣龙军团的龙骑从关里冲出，前锋眼看要溃。师父一步踏上半空，七杀剑出鞘，一剑劈出几百丈深沟，龙骑连人带兽被掀翻。两军死寂，然后天斗爆出震天的欢呼。\n\n前一夜，他坐在营火边问你：「仗打完了，想做什么。」你看着他的侧脸，没答上来。\n\n破关之后，罗刹神归来。死亡领域铺开，唐三倒下，复活之光在荣荣和奥斯卡手里一点点凝聚。你看见两位老人对视了一眼，骨龙低吼，七杀剑嗡鸣——他们要冲进去了。","choices":[{"t":"抢在师父之前出剑","hint":"改写原著：拦下剑、骨二老","need":{"战力":1250},"chance":0.4,"canonChange":{"node":"M83","inertia":4,"desc":"剑斗罗、骨斗罗未冲入死亡领域，七宝结局改写"},"win":{"text":"你在死亡领域里撑过了第三镰。复活之光亮起时，你跌进了一只握了一百多年剑的右手里。","d":{"shift":15,"trait":{"逆":3,"忠":1},"ending":"e1"}},"lose":{"text":"你挡住了两镰，第三镰落下时，复活之光亮了。你笑了一下，然后没有撑住。","d":{"shift":12,"trait":{"逆":2,"仁":2},"ending":"e4"}}},{"t":"转身守在荣荣身前","hint":"复活之光需要有人守；这是你六岁选好的位置","win":{"text":"你一步跨到荣荣身前，把漫过来的黑雾一缕缕冻碎在半空。越过她的肩，你看见两颗流星坠进深井。","d":{"bonds":{"宁荣荣":10},"trait":{"忠":2,"群":1},"ending":"e2"}}}]}],"endings":[{"id":"e1","title":"结局·师在剑在","type":"改命","grade":3,"text":"你比七杀剑快了半步，一头扎进死亡领域。镰刀落下，你出剑，不是斩，是止。剑碎了三次，凝了三次；第三镰落下时，身后亮起九宝琉璃塔的七彩光。\n\n九宝宗谱上多了一行史书没有的小字：嘉陵关一役，剑斗罗、骨斗罗生还。荣荣出嫁那天，师父喝了她敬的茶，只说一个「好」字，放杯的手在抖。夜里他问你：「你的剑，找到了吗。」你说，它是用来让人停下来的。","afterlife":["尘心：活着看荣荣出嫁，余生每年开春，陪你在听剑崖看一次雾。","古榕：照旧骂奥斯卡配不上荣荣，喝醉了就靠着老剑的肩打鼾。","宁荣荣：成为九彩斗罗，在宗谱上亲手添了那行小字。","九宝琉璃宗：剑骨二老健在，第二宗门成了大陆最稳的一座山门。"],"worldline":"剑斗罗尘心、骨斗罗古榕于嘉陵关生还，亲眼看着宁荣荣出嫁；九宝琉璃宗的结局被改写。"},{"id":"e2","title":"结局·九宝之剑","type":"守护","grade":1,"text":"你守在荣荣身前，一剑又一剑，把每一缕黑雾冻碎在半空。复活之光落在唐三身上时，七杀剑的光熄了。那天黄昏，你在焦土上找到一截骨头，和一角青衫。\n\n葬礼后，荣荣背挺得笔直：「九宝琉璃宗，只剩一把剑了。」你跪下，把寒霜剑横在膝上：「我在。」从此山门前立起两块青石，一块刻剑，一块刻骨，中间坐着寒霜斗罗。","afterlife":["尘心：战死嘉陵关，只留下一角青衫，葬在九宝山门前。","古榕：与老剑同葬，坟前青石刻着一截骨。","宁荣荣：嫁给奥斯卡，成为九彩斗罗；她的小女儿总缠着你问师父的事。","九宝琉璃宗：寒霜斗罗坐镇山门，百年无人敢犯。"],"worldline":"原著线：二老战死嘉陵关，你接过守护者之位，成为九宝琉璃宗唯一的剑——寒霜斗罗。"},{"id":"e3","title":"结局·霜行万里","type":"剑道","grade":2,"text":"师父那一剑把你推出死亡领域，剑光在你身后合拢，像一道鞘。风里传来他最后一句：「去走你自己的剑。」\n\n葬礼后荣荣红着眼笑：「走吧，木头，九宝有我。」你北行到那座冰川，在师父的剑痕旁斩出第三道，不深，却让几百年的风雪停了一息。后来大陆上传说，北方有个白衣女剑客，她出现的地方，仗就打不起来。","afterlife":["尘心：把最后一剑留给了你，与古榕同葬嘉陵关外。","古榕：战死时骨龙护在老剑左侧，一如七十年来。","宁荣荣：独掌九宝琉璃宗，每年冬天往北方寄一封信，从不落款。","九宝琉璃宗：没有你坐镇，却多了一个传说：北方有剑，止战。"],"worldline":"二老战死；你离开宗门北行，成为不属任何势力的寒霜斗罗，战后大陆多了一把止战之剑。"},{"id":"e4","title":"结局·以身为鞘","type":"牺牲","grade":2,"text":"你倒进一只右手里，看见师父那张石头似的脸碎了。「冰封森林那次，你站着看我选。这一次，换我选了。」\n\n史书写着二老生还，没写为什么。古榕在你坟前坐了一整天：「傻丫头，你是剑斗罗的徒弟，不是剑斗罗。」一个月后，有人在极北冰川上看见师父斩出一道短而直的剑痕，像一道鞘，底下刻着：吾徒{name}，剑在，鞘在。","afterlife":["尘心：回到九宝山门前再没离开，每天抱剑望着北边，说在等雪停。","古榕：活到很老，再没骂过任何人一句傻丫头。","宁荣荣：在宗谱上写下你的名字，给女儿起的小名里也有它。","九宝琉璃宗：剑骨二老健在，山门前多了一块刻着鞘的青石。"],"worldline":"你战死嘉陵关，剑斗罗与骨斗罗因此生还；尘心余生守在九宝山门前，等雪停。"}],"summary":"10 节点（两组互斥）16 事件。分叉一（2643）：南下做影子／上听剑崖；分叉二（2647）：极北悟剑得 north_sword，账房或东宫得 raid_warning。七宝之夜持预警保住师父右臂，否则战魂圣。嘉陵关战罗刹神，胜 e1 败 e4；守荣荣 e2；持 north_sword 追剑光 e3。"},{"id":"huangshi","title":"天斗皇室·暗卫","defaultName":"纪无声","gender":"男","tagline":"你是太子的影子，太子却是假的","intro":"天斗皇宫西墙下的鸦巢，养着没有名字的孤儿。你以影蝠觉醒，十二岁起做太子雪清河三步之外的影子。白玉盏、七彩斑斓、深宫长夜，终有一天你会知道太子是谁——做她的影子，还是天斗的影子？","birthYear":2630,"startYear":2636,"faction":"天斗","wuhun":{"name":"影蝠","type":"兽","system":"敏攻/侦察","tier":"上","desc":"从影子里剥离的漆黑蝙蝠，振翼无声，以超声辨物，擅潜伏、侦察与一击即走。"},"innate":7,"attrs":{"体魄":22,"精神":34,"悟性":30,"魅力":16,"气运":18},"coins":40,"rep":{"武魂殿":0,"天斗":5,"星罗":0,"宗门":0,"魂兽":0},"bonds":{"秦鸮":10,"寒蝉":10,"雪夜":2},"flavor":{"work":{"name":"顶班夜巡","desc":"替宫人值夜，换点赏钱"},"faction":{"name":"暗卫密差","desc":"替暗卫营查人、送信、盯梢"},"place":"天斗皇宫·鸦巢"},"rings":[{"slot":1,"options":[{"beast":"夜啼鬼蝠","years":380,"kind":"敏","skill":"无声翼","desc":"振翼无声，短距滑翔，落地不起一粒尘。","need":{"战力":100}},{"beast":"灰翼蝠","years":260,"kind": xt":"她看了你很久，替你把刀推回鞘里。从此你是她唯一活着的知情人。","d":{"bonds":{"雪清河":12},"flags":["keep_secret"],"reveal":["千仞雪"],"trait":{"忠":1,"群":1}}}},{"t":"把这个秘密带给雪崩","hint":"帝国多一分胜算，她少一道影子","win":{"text":"雪崩听完，把手里的蛐蛐罐摔得粉碎，然后笑了：「原来大哥也在装。」","d":{"bonds":{"雪崩":10,"雪清河":-6},"rep":{"天斗":5},"flags":["told_snow"],"reveal":["千仞雪"],"trait":{"忠":-1,"逆":1}}}},{"t":"去月轩问唐三看出来没有","hint":"那个少年看人，比你还准","win":{"text":"唐三放下茶盏：「我只知道，她看谁都隔着一层。你也一样。」","d":{"悟性":2,"bonds":{"唐三":8},"flags":["asked_tang"],"reveal":["千仞雪"],"trait":{"群":1}}}}]},{"id":"n_soulhunt","title":"猎魂之夜","year":2651,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M51","echo":{"flag":"told_snow","text":"前因 · 2650：雪崩已经知道了太子的秘密。"},"text":"太子说：「去蓝电霸王龙宗后山，只看，不动。」你伏在断崖的阴影里，看武魂殿的人马把雷鸣峰烧成一片红。东边七宝琉璃宗的方向，天也是红的。\n\n一个蓝发少年背着昏迷的小女孩往山脊上爬，满脸是血，是精英大赛那年跟在玉天恒身后的玉衡。小路另一头，一盏苍白的灯正一步步走近：苏夜穿着武魂殿黑袍，腰间挂着鼓鼓的令囊。昨夜你听红衣主教说过，东宫已经知会，城防军不会出城。\n\n那只令囊里，装着东宫通敌的铁证。你身上的东宫腰牌，硌着你的肋骨。","choices":[{"t":"照她的吩咐，只看不动","hint":"你会把这一夜原原本本带回给她","win":{"text":"你把这一夜一字不漏地记下。苏夜的灯在玉衡藏身处停了一息，又走开了。","d":{"bonds":{"雪清河":5},"flags":["east_night"],"met":["landian"],"trait":{"仁":-1,"险":-1}}}},{"t":"把这一夜写成密报给雪崩","hint":"蓝电的血，会变成帝国手里的刀","win":{"text":"密报连夜送进四皇子府。雪崩在舆图上圈起蓝电二字：「这笔血，我会让他们还。」","d":{"bonds":{"雪崩":6},"rep":{"天斗":3},"flags":["snow_night"],"trait":{"忠":-1}}}},{"t":"截住那盏灯，夺下令囊","hint":"关键战：苏夜，55 级，撑过三回合","need":{"战力":600},"chance":0.45,"win":{"text":"三回合后苏夜收了灯，任你扯走令囊：「安静的影子，今夜不安静了。」你带着铁证去了四皇子府。","d":{"名望":6,"伤势":25,"rep":{"武魂殿":-8,"天斗":4},"flags":["snow_night","took_pouch"],"item":"东宫令囊","met":["wuhun"],"trait":{"险":2,"逆":1}}},"lose":{"text":"冥月灯照穿了你的影子。你醒来时躺在东宫，是她亲自去武魂殿把你领了回来。","d":{"伤势":55,"rep":{"武魂殿":-5},"bonds":{"雪清河":6},"flags":["east_night","captured"],"met":["wuhun"]}}}]},{"id":"n_daughter","title":"教皇的女儿","year":2651,"cond":{"flag":"east_night","notFlag":null,"levelMin":0},"canon":"M53","echo":{"flag":"captured","text":"前因 · 2651：猎魂之夜你落进武魂殿手里，是她亲自把你领回来的。"},"text":"星湖传来消息：唐三身边那个女孩献祭了。他回到天斗，创了一个叫唐门的宗门，七宝琉璃宗给他出钱。\n\n这夜她屏退所有人，摘下太子冠，第一次在你面前用自己的声音说话。她叫千仞雪，教皇比比东是她的母亲，供奉殿的千道流是她的祖父。「父皇撑不过明年，七彩斑斓已经入了骨髓。到那一天，我就不必再做雪清河了。」\n\n她走到你面前，比你矮半个头，你第一次发现。「蛇矛和刺血是祖父的人，萨拉斯是母亲的人。整座天斗城，没有一个人是我自己的。」烛光里，她的眼睛是很浅的金色。「我只问一次。你是谁的影子？」","choices":[{"t":"我是你的影子","hint":"从此天斗再没有你的位置","win":{"text":"她没有笑，只是很轻地点了一下头，像把一件很重的东西放进了你手里。","d":{"bonds":{"雪清河":15},"rep":{"天斗":-5,"武魂殿":5},"flags":["her_shadow"],"trait":{"忠":2,"群":1}}}},{"t":"我是天斗的影子，但不卖你","hint":"两边都要守，两边都会疼","win":{"text":"她垂下眼：「两边都守，你会疼的。」第二天，她仍让你站在三步之外。","d":{"bonds":{"雪清河":5,"雪夜":5},"flags":["torn"],"trait":{"仁":1}}}},{"t":"把她说的每个字记下来","hint":"这些话足够让她死一百次","win":{"text":"这些话够她死一百次。你写完那页纸，压在了蛐蛐罐底下。","d":{"bonds":{"雪清河":-10},"rep":{"天斗":6},"flags":["recorded"],"trait":{"忠":-2}}}}]},{"id":"n_coup","title":"天斗宫变","year":2652,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M56","echo":{"flag":"her_shadow","text":"前因 · 2651：你对她说，你是她的影子。"},"text":"宫变在一个无风的夜里。她披上六翼天使的金甲，一千名武魂殿魂师从四门涌向养心殿。唐三赶来了，放下背上那个面色苍白的少女，一个人走进天使领域，漆黑的大锤一锤重过一锤，金色领域裂开了第一道纹。\n\n就在这时，刺血斗罗甩开骨斗罗，像一道血色闪电扑向寝殿，扑向你身后龙床上奄奄一息的陛下。只要陛下死在今夜，天斗要乱十年。\n\n广场中央，她在锤声里回过头，冠落在地，六翼中有一翼染了血。她什么也没说，只是看着你。\n\n刺血斗罗离你还有四十丈。","choices":[{"t":"改命：张开夜帷护她退走","hint":"改写原著","canonChange":{"node":"M56","inertia":3,"desc":"宫变不以全歼收场：你借暗卫营密道放走千仞雪过半部属，天斗与武魂殿照旧决裂，却留下一笔未清的旧账"},"win":{"text":"夜帷吞没了半座广场。你领着她和五百部属从鸦巢密道出城，身后只剩火光与锤声。","d":{"shift":8,"bonds":{"雪清河":15},"rep":{"天斗":-15,"武魂殿":8},"flags":["her_path","opened_tunnel"],"trait":{"逆":2,"仁":1,"忠":1}}}},{"t":"放下刀，随她走出天斗城","hint":"跟她去武魂城，从此不再回头","win":{"text":"你把东宫腰牌留在寝殿门槛上，跟着那道残破的金光，走进了城外的夜色。","d":{"bonds":{"雪清河":10},"rep":{"天斗":-12,"武魂殿":5},"flags":["her_path"],"trait":{"忠":1,"群":1}}}},{"t":"拦住扑向寝殿的刺血斗罗","hint":"关键战：封号斗罗，撑过三回合","need":{"战力":750},"chance":0.35,"win":{"text":"你在血光里撑过三回合，剑斗罗的剑光终于落下。她隔着人群看了你一眼，转身走了。","d":{"名望":12,"伤势":35,"bonds":{"雪夜":10,"雪崩":6},"rep":{"天斗":10,"武魂殿":-10},"flags":["emp_path","saved_night"],"trait":{"险":2,"忠":1}}},"lose":{"text":"刺血一掌震碎了你的影子。昏过去前，你看见一道金光落在身前，她把你带出了天斗城。","d":{"伤势":65,"bonds":{"雪清河":6},"rep":{"天斗":-5},"flags":["her_path"]}}},{"t":"背起昏迷的陛下冲出寝殿","hint":"救驾之功，从此你是帝国的人","win":{"text":"你背着老人从暗门撞出去，身后的窗棂被血光削成碎片。陛下在你背上，轻得像一把枯枝。","d":{"bonds":{"雪夜":10,"雪崩":8},"rep":{"天斗":8,"武魂殿":-5},"flags":["emp_path","saved_night"],"trait":{"忠":1,"仁":1}}}}]},{"id":"n_snow","title":"雪崩","year":2654,"cond":{"flag":"emp_path","notFlag":null,"levelMin":0},"canon":"M57","echo":{"flag":"antidote_lead","text":"前因 · 2651：独孤博答应过，替你留一条路。"},"text":"宫变之后，宁风致用秘法唤醒了陛下，代价是燃他余寿。两年过去，七彩斑斓还是追进了骨髓。四皇子雪崩立为太子，白天在朝堂上学着不笑，夜里一个人坐在养心殿的台阶上。\n\n独孤博把你拉到廊下：「唐小子托我照看冰火两仪眼。那里的东西配上阴阳两泉，也许能把七彩斑斓的根拔出来。也许。」他盯着你，「这药没人试过，陛下经不起试错。要试，得先找个活人。冲得过去就活，冲不过去……就算冲过去，也不会毫发无损。」\n\n雪崩从殿里出来，眼睛是红的：「父皇刚才又说起你，说等他走了，让你看着我，别让我犯浑。」","choices":[{"t":"改命：以身试药，抢回十年","hint":"改写原著：你会失去一只耳朵","need":{"体魄":35},"canonChange":{"node":"M75","inertia":4,"desc":"雪夜大帝未在2654年冬病逝；嘉陵关由雪夜坐镇，雪崩以太子身份随军，违令强攻、十万伤亡不再发生"},"win":{"text":"药力冲过经脉，你在冰火两仪眼边昏了七天。醒来时左耳一片死寂，陛下却在那天坐了起来。","d":{"shift":15,"伤势":40,"bonds":{"雪夜":15,"独孤博":8,"雪崩":6},"flags":["saved_emperor","deaf_left"],"trait":{"逆":3,"仁":2,"险":2}}}},{"t":"守在雪崩身后，陪他接江山","hint":"陛下会走，你会留下","win":{"text":"那年冬天陛下驾崩。灵前，雪崩攥着你的手腕，攥得很紧：「别走。」","d":{"bonds":{"雪崩":12},"trait":{"忠":2,"群":1}}}},{"t":"带寒蝉重整鸦巢","hint":"天斗的影子，从此由你来养","win":{"text":"陛下驾崩后第二个月，鸦巢的灰瓦换了新的。你和寒蝉重抄名册，空着秦鸮那一栏。","d":{"名望":5,"bonds":{"寒蝉":10},"rep":{"天斗":6},"flags":["spymaster"],"trait":{"忠":1,"群":-1}}}}]},{"id":"n_wall","title":"嘉陵关·城上","year":2656,"cond":{"flag":"her_path","notFlag":null,"levelMin":0},"canon":"M76","echo":{"flag":"opened_tunnel","text":"前因 · 2652：宫变那夜，你从鸦巢密道放走了她五百部属。"},"text":"武魂帝国立国的第二年，大军压到嘉陵关。千道流在天使神殿里闭门不出，她在殿中等一场传承，你守在城墙暗渠的出口。\n\n子时三刻，护城河底那条废弃的暗渠里，有十几个压得很低的心跳，稳得像受过最严的训练。走在最前面的那一个，你在鸦巢的通铺上听着它睡了整整六年。\n\n寒蝉。你走后，雪崩把秦鸮的位子给了她。一只手扶上铁闸，手背上有一道你熟悉的疤，是九岁那年蝠洞里留下的。她的呼吸停了一下。\n\n「十七，」她在黑暗里叫你在鸦巢的编号，「是你吧。」","choices":[{"t":"在城墙阴影里迎战寒蝉","hint":"关键战：同营长大的她，64 级","need":{"战力":900},"chance":0.55,"win":{"text":"第三回合，你的夜帷吞没了她的蝉鸣。你没有下杀手，拧开铁闸，放她的人回了天斗。","d":{"名望":10,"伤势":30,"bonds":{"寒蝉":5},"trait":{"忠":1,"仁":1},"ending":"e1"}},"lose":{"text":"寒蝉的音刃穿透了你的影子。你倒下时，身体正好挡住通往神殿的那道门。","d":{"伤势":80,"ending":"e4"}}},{"t":"打开铁闸，放她回去","hint":"她会知道，也会原谅","win":{"text":"铁闸升起，她在你身边停了一步：「十七，好好活。」暗渠里的心跳一个个远去。","d":{"bonds":{"寒蝉":15},"rep":{"武魂殿":-5,"天斗":5},"flags":["spared_cicada"],"trait":{"仁":2,"群":1},"ending":"e1"}}},{"t":"不理城下，守在神殿门外","hint":"军械库也许会烧，神殿的门不会被推开","win":{"text":"那夜军械库烧了半座，神殿的门始终没人推开。天亮时，金光照彻百里。","d":{"bonds":{"雪清河":10},"flags":["guard_temple"],"trait":{"忠":2,"群":-1},"ending":"e1"}}}]},{"id":"n_banner","title":"嘉陵关·帅旗","year":2656,"cond":{"flag":"emp_path","notFlag":"saved_emperor","levelMin":0},"canon":"M75","echo":{"flag":"spymaster","text":"前因 · 2654：你和寒蝉重整了鸦巢。"},"text":"雪崩登基两年，御驾亲征嘉陵关。唐三掌天斗军权，严令不得出战，可雪崩望着那座百米高的城墙，眼睛一天比一天红：「父皇是被他们一口一口喂死的。我不想等。」\n\n城头的守城巨弩抬起了一百五十张口，吊桥不知为何放下了一半。雪崩翻身上马，几万骑兵跟着上马。传令官嘶声喊着：「蓝昊王有令，不得出战！」他没有听。\n\n城垛后，白金主教萨拉斯脚下升起八个魂环，目光越过千军万马，落在雪崩身上。那是等猎物上钩的眼神。你的手按在刀柄上。","choices":[{"t":"随他冲阵，替他挡下萨拉斯","hint":"关键战：不必赢，只要他活着回来","need":{"战力":950},"chance":0.4,"win":{"text":"你在萨拉斯手下撑过三回合，硬把雪崩的马头拽回本阵。龙旗还在，他也还在。","d":{"名望":15,"伤势":45,"bonds":{"雪崩":10},"trait":{"险":2,"忠":1},"ending":"e2"}},"lose":{"text":"萨拉斯的圣光落下时，你张开了所有的影子。雪崩回到了本阵，你没有。","d":{"伤势":80,"ending":"e4"}}},{"t":"在帅旗下拔刀逼他回头","hint":"他会恨你三天，记你一辈子","win":{"text":"刀锋横在他马前。他瞪着你，三天没跟你说话，此后却再没违过一次帅令。","d":{"shift":3,"bonds":{"雪崩":8},"flags":["drew_on_snow"],"trait":{"逆":1,"险":1},"ending":"e2"}}},{"t":"守在帅旗下，等他回来","hint":"影子不拦主上","win":{"text":"影子不拦主上，只等主上。他回来时浑身是血，身后少了很多人。","d":{"bonds":{"雪崩":5},"trait":{"忠":1,"险":-1},"ending":"e2"}}}]},{"id":"n_night","title":"雪夜未央","year":2656,"cond":{"flag":"saved_emperor","notFlag":null,"levelMin":0},"canon":"M75","echo":{"flag":"tang_ally","text":"前因 · 2651：你替雪崩去唐门牵过线，唐门的机括今夜就埋在山脚。"},"text":"陛下活过了那个冬天，亲自坐镇嘉陵关外的中军御辇。雪崩以太子身份随军，攥着剑柄攥了两个月，一次也没拔出来。你站在御辇三步之外，左耳一片死寂，只能偏过头，用右耳听这座大营。\n\n就是这只右耳听见了：吊桥那边冲出三百精骑，个个魂力深厚，领头的穿白金主教袍，八个魂环明灭。萨拉斯。他们不冲前军，贴着天灵山脚绕了一个大弧，直扑御辇。武魂帝国也知道了，那个本该死去的老皇帝还活着。\n\n辇里，老人轻轻笑了一声：「眼睛亮的孩子，去吧。」","choices":[{"t":"截住萨拉斯的三百精骑","hint":"关键战：你身后就是陛下","need":{"战力":950},"chance":0.45,"win":{"text":"独孤博的毒雾在你身后铺开，你在萨拉斯面前撑过三回合，禁卫的长枪终于到了。","d":{"名望":15,"伤势":40,"bonds":{"雪夜":10,"独孤博":4},"trait":{"险":2},"ending":"e3"}},"lose":{"text":"你把三百骑拖在山脚整整一炷香。萨拉斯的光落下时，御辇已退进大营深处。","d":{"伤势":80,"ending":"e4"}}},{"t":"把御辇藏进影子里","hint":"暗卫本就不该站在光里","win":{"text":"影子罩住了御辇，萨拉斯的精骑扑了个空，在山脚撞进了唐门的机括阵。","d":{"bonds":{"雪夜":8},"flags":["hid_emperor"],"trait":{"险":-1},"ending":"e3"}}}]}],"endings":[{"id":"e1","title":"结局·天使无名","type":"情","grade":2,"text":"战争结束了。她成过神，也亲手碎过神位。那个从没抱过她的女人替她挡下修罗神剑，她跪在血泊里，哭得像个孩子。唐三赦免了她，看着你说：「你还是她的影子。」\n\n武魂城的城门在清晨打开。她换上青布衣裳，在城门口买了一支糖人，皱眉说太甜。你下意识退进门洞的阴影，她走回来，把你拉进阳光里：「我已经不是太子，也不是神了。你不必再站在三步之外。」","afterlife":["千仞雪：碎去神位后隐于山野，有人见她在小镇学做糖人，总嫌自己做得太甜。","寒蝉：回天斗做了一辈子暗卫统领，再没叫过任何人十七。","雪崩：成为明君，从未下旨追查那个消失的东宫暗卫。","鸦巢：名册上{name}那一栏被划去，旁边有人添了四个小字：去向不明。"],"worldline":"千仞雪自碎神位后没有孤身离去，她身边多了一道影子；天斗暗卫营的名册上少了一个名字。"},{"id":"e2","title":"结局·无名碑","type":"忠","grade":2,"text":"武魂帝国覆灭，雪崩成了明君。嘉陵关那一战之后，他在唐三面前横剑于地：「师父，罚我。」此后再没违过一次帅令。\n\n你接了秦鸮的位子。鸦巢后院那口老井被填平，立起一块一人多高的青石碑，一个字也没刻。雪崩想封你爵位，你说：「影子的名字写进史书，就不是影子了。」\n\n后来的史书写了雪崩大帝的隐忍与十年和平，也写了他身边一位暗卫统领，只有四个字：其名不传。","afterlife":["雪崩：亲自主持唐三的婚礼，答应他十年不攻星罗，到死没有违约。","寒蝉：做了你半辈子的副手，退下来后在鸦巢教孩子们赤足走霜瓦。","千仞雪：被赦免后不知所终，有人说她回过一次东宫，看了看那株梅树。","秦鸮：无字碑落成那夜，你在碑前替他斟了一碗酒。"],"worldline":"主线照原著推进：雪崩成为明君并许下十年之约；鸦巢后院立起一块为所有影子而立的无字碑。"},{"id":"e3","title":"结局·雪夜未央","type":"命","grade":3,"text":"嘉陵关破的那天，雪夜大帝坐在御辇里，看那座百米城墙在唐门暗器和昊天锤影下一寸寸崩塌。天斗没有违令出击，护城河里没有填进十万条命。\n\n第一场雪落时，老皇帝退位，诏书最后一句是：朕老矣，所幸见太平。退位那夜他召你进养心殿，问你左耳是不是还听不见。「属下用一只耳朵，换了陛下十年。不亏。」他笑得咳了很久，像很多年前那样摸了摸你的头：「眼睛亮的孩子，黑里头也亮。」","afterlife":["雪夜大帝：退位后又活了三年，走在一个晴天，枕边放着一只旧蛐蛐罐。","雪崩：在父亲身边学会了等待才登基，比原本的他更好。","独孤博：逢人便说那副药是他配的，却从不提试药的人是谁。","天斗暗卫营：统领{name}左耳失聪，回声只剩十五丈，却再没让一道影子落空。"],"worldline":"雪夜大帝活过了武魂帝国，嘉陵关下没有十万人枉死，雪崩在父亲身边学会了等待之后才登基。"},{"id":"e4","title":"结局·影灭","type":"死","grade":1,"text":"那一击来的时候，你本来躲得开。可你身后有人。\n\n你把所有魂力压成一道薄薄的影子，挡在那一击前面。影子碎了。你倒在嘉陵关发红的泥土里，影蝠从你身体里飘出来，绕着你转了三圈，像六岁觉醒那天一样无声，然后散了。你最后看见的，是身后那个人还站着，离你正好三步。\n\n那就好。\n\n后来写嘉陵关的书有很多，没有一本写到你。只有鸦巢的孩子每年清明，会在老槐树下多摆一碗粥：「给一个影子。」","afterlife":["你护住的那个人：照原路走完了这场战争，只在很深的夜里，偶尔回头望向身后三步。","寒蝉：从此不许营里任何孩子再用十七这个编号。","雪崩：在老槐树下埋了一只发黑的蛐蛐罐，罐底的字条写着：多谢照看。","鸦巢：清明那碗粥一直摆了下去，新来的孩子不知道是给谁的。"],"worldline":"你死在嘉陵关 ait":{"群":1,"忠":1}}}},{"t":"去找大哥，替他执刀","hint":"大哥讲规矩，你赌他的规矩","win":{"text":"大哥听完只说一句：「要死，也该死在我手里。」他收下了你。","d":{"bonds":{"戴维斯":10,"戴沐白":-5,"朱竹漪":5},"flags":["side_weisi"],"trait":{"忠":1,"险":1}}}},{"t":"把药碗端给三哥看","hint":"借三哥护住母亲，戴琰会更早动手","need":{"名望":15},"win":{"text":"三哥连夜把母亲接出听雨轩。五哥的刀，从此会出得更早。","d":{"bonds":{"戴沐白":15,"戴琰":-20,"沈氏":5},"flags":["side_mubai","yan_exposed"],"trait":{"仁":1,"险":1}}}}]},{"id":"n_gate","title":"斗虎台","year":2650,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"留白·星罗夺嫡","echo":{"flag":"side_weisi","text":"前因 · 2648：你站在了大哥这一侧。"},"text":"斗虎台上，幽冥白虎对幽冥白虎。竹清胜了竹云，三哥胜了大哥。\n\n人群里一支破魂箭直奔大哥后心，是五哥的箭。你扑过去，用雷铠截下了它，箭头在你肩上嗡嗡发颤。\n\n大哥跪在台上，嘴角带血。宗正戴衡展开祖制：「败者入寂，或死，或废。」三哥攥着拳迟疑，父皇只冷冷一句：「祖制不由你想。」大哥抬头看你：「别替我求情。」\n\n台后就是白虎宗祠的虎门。三百年来，进去求废祖制的皇子没有一个走出来。门缝里有风，像有什么东西在呼吸。三哥看着你，父皇也看着你。","choices":[{"t":"推开虎门，血誓废祖制","hint":"改写原著","need":{"名望":25},"canonChange":{"node":"留白·星罗夺嫡","inertia":4,"desc":"星罗皇子相残的祖制被废：戴维斯不死不废，朱竹云免于陪寂，戴氏兄弟不必再在斗虎台上分生死"},"win":{"text":"门里是十一具朝着门口的骸骨。三天后你走了出来，满身是血。父皇低头：祖制废。","d":{"shift":15,"伤势":30,"名望":20,"rep":{"星罗":10},"bonds":{"戴维斯":20,"戴沐白":10,"朱竹云":10,"星罗皇帝":10,"朱竹漪":5},"flags":["zuzhi_abolished"],"trait":{"逆":3,"仁":2,"险":1}}}},{"t":"沉默，看大哥被废","hint":"原著方向：败者入寂","win":{"text":"宗正的手按上大哥丹田。他没出声，你也没有。从此他住进了寂园。","d":{"rep":{"星罗":3},"bonds":{"戴维斯":-10},"flags":["weisi_crippled"],"trait":{"逆":-1,"仁":-1}}}},{"t":"求一句：圈而不废","hint":"父皇会准，也会记住你心软","need":{"魅力":30},"win":{"text":"父皇准了。大哥保住魂力，被圈进寂园，走前没有看你。","d":{"bonds":{"戴维斯":5,"朱竹云":5,"星罗皇帝":-5},"flags":["weisi_spared"],"trait":{"仁":1}}}}]},{"id":"n_gengxin","title":"庚辛城","year":2651,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M55","echo":null,"text":"猎魂之夜过去不到半年，三哥留下一封信弃了储位，随唐三走了。\n\n庚辛城武魂殿主殿一夜被屠，殿里没有一具全尸，只有墙上嵌着细如牛毛的针，整个大陆只有一伙人用得出这样的手艺。武魂殿要星罗协查，父皇点了你的名。提灯的苏夜也来了，手里攥着铁匠协会的名册。\n\n你在楼高铺子的后院堵住一个满手烫疤的青年，楼高的三徒弟欧冶青。他不跑，也不求饶：「殿下要抓就抓，图纸烧了。」\n\n巷口灯光一晃，苏夜的声音传来：「七殿下，找到了吗？」","choices":[{"t":"替铁匠协会遮掩","hint":"欧冶青欠你一条命","win":{"text":"你把线索引向北方。欧冶青欠你一条命，苏夜的灯在你脸上多停了一息。奏报递上去，你被调往水云关。","d":{"rep":{"武魂殿":-8,"宗门":3},"bonds":{"欧冶青":15,"苏夜":-5},"flags":["covered_tangmen","at_shuiyun"],"met":["shenjiang","wuhun"],"trait":{"逆":1,"仁":1}}}},{"t":"把欧冶青交给苏夜","hint":"武魂殿记功，庚辛城记仇","win":{"text":"苏夜审了三天放人。武魂殿记你一功，庚辛城不会原谅你。父皇调你去水云关。","d":{"rep":{"武魂殿":10,"星罗":-3},"bonds":{"苏夜":10,"欧冶青":-20},"flags":["gave_ouye","at_shuiyun"],"met":["shenjiang","wuhun"],"trait":{"逆":-1,"仁":-1}}}},{"t":"只交出那本账","hint":"两不得罪，两不领情","win":{"text":"两边都不得罪，也都不领情。父皇看完奏报，把你调去了水云关。","d":{"rep":{"武魂殿":3},"bonds":{"苏夜":5},"flags":["neutral_gengxin","at_shuiyun"],"met":["shenjiang","wuhun"],"trait":{"险":-1}}}}]},{"id":"n_shuiyun","title":"水云","year":2655,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"留白·水云关","echo":{"flag":"zhuyi_vow","text":"前因：城头那杯酒，竹漪喝干了。"},"text":"武魂帝国立国，两国之间的门关上了。你守水云关四年，沧澜江的雾一年比一年浓，浓到站在城头看不见江面。\n\n这年秋天，象甲宗宗主呼延震率两万武魂军压到关下，说是借道。八十二级魂斗罗，八个魂环在雾里一明一暗。韩擎压阵，竹漪握着你的手腕，城头的弩阵还差三回合才能装填完毕。韩擎低声说：「殿下，打不打，只在你一句话。」\n\n同一夜，江滩驿亭亮起一盏灯。送信的兵说，提灯的人只见你一个，带来的是武魂帝国真正的条件。关后，是星罗二十七座城。","choices":[{"t":"开关迎战呼延震","hint":"关键战：撑过三回合","need":{"战力":950},"chance":0.45,"win":{"text":"你撑过三回合，弩阵齐发，象甲宗退兵三十里。水云关的名字传遍了星罗。","d":{"名望":15,"伤势":30,"rep":{"星罗":10,"武魂殿":-10},"bonds":{"韩擎":10,"朱竹漪":5},"flags":["won_huyan","path_hold"],"trait":{"险":1,"群":1}}},"lose":{"text":"象甲踏碎外关。韩擎替你堵住门洞，战死在那里。驿亭的灯还亮着。","d":{"伤势":50,"名望":-5,"flags":["lost_huyan","hanqing_dead","suye_comes"],"trait":{"险":1}}}},{"t":"闭门不战，去驿亭","hint":"听听武魂帝国的条件","win":{"text":"你独自出关。灯下坐着苏夜，桌上摊着一卷写好的帛书。","d":{"bonds":{"苏夜":5},"flags":["met_envoy","suye_comes"],"trait":{"险":-1,"忠":-1}}}}]},{"id":"n_envoy","title":"灯下帛书","year":2655,"cond":{"flag":"suye_comes","notFlag":null,"levelMin":0},"canon":null,"echo":{"flag":"hanqing_dead","text":"前因：韩擎战死在外关的门洞里。"},"text":"驿亭里只点着一盏冥月灯，灯罩碎了一角。苏夜比在武魂城时瘦了，推过来一卷帛书。\n\n「教皇的条件。」他说，「星罗中立，不出一兵。事成之后，武魂帝国的网替殿下一直铺到白虎殿。令堂做太后，朱姑娘做皇后。」\n\n帛书末尾已盖好了教皇印，只空着你的名字。你想起白虎殿那句祖制，想起韩擎，想起关上那些等你回去的人。亭外的江水拍着石阶，一下，又一下。\n\n江雾漫进亭子。苏夜把笔推到你手边：「殿下也可以不签。只是这盏灯，下次就不是我来提了。」","choices":[{"t":"提笔签下密约","hint":"换母亲做太后","win":{"text":"你写下名字。苏夜收起帛书，灯光在你脸上停了很久。","d":{"rep":{"武魂殿":20,"星罗":-5},"bonds":{"苏夜":10},"flags":["pact_signed","path_crown"],"trait":{"忠":-2,"群":-1}}}},{"t":"烧掉帛书，夜袭外关","hint":"关键战：替韩擎讨回那道门","need":{"战力":950},"chance":0.5,"win":{"text":"帛书在灯上烧尽。当夜你踏雷夺回外关，替韩擎把城门重新挂了上去。","d":{"名望":10,"rep":{"武魂殿":-15,"星罗":5},"bonds":{"苏夜":-10,"朱竹漪":5},"flags":["retook_gate","path_hold"],"trait":{"忠":1,"险":1}}},"lose":{"text":"夜袭撞上象甲盾阵，你被抬回内关。外关没夺回来，可关还在。","d":{"伤势":40,"rep":{"武魂殿":-10},"flags":["path_hold"],"trait":{"险":1}}}},{"t":"推回笔，放他离开","hint":"两不相欠","win":{"text":"「两不相欠。」苏夜笑了笑，提着那盏破灯消失在雾里。","d":{"bonds":{"苏夜":5,"朱竹漪":3},"flags":["let_suye_go","path_hold"],"trait":{"仁":1,"险":-1}}}}]},{"id":"n_jialing","title":"嘉陵烽火","year":2656,"cond":{"flag":"zuzhi_abolished","notFlag":null,"levelMin":0},"canon":"M75","echo":{"flag":"pact_signed","text":"前因 · 2655：你签过那卷帛书。"},"text":"嘉陵关久攻不下。一道影子从暗道摸进水云关，是天斗暗卫纪无声，带来雪崩的亲笔：武魂帝国南线空虚，若星罗肯出兵，嘉陵关下能少死几万人。纪无声跪在灯下，衣襟还湿着：「陛下说，天斗会记得水云关。」三哥和唐三，也回来了。\n\n父皇的旨意先到一步：不得先启战端。\n\n当天傍晚，大哥戴维斯骑马上了关。祖制废后，他的魂力一分未损，身后跟着朱竹云和白虎旧部。他把圣旨往桌上一扔：「老头子怕了。七弟，这道关是你守的，你说出不出。」","choices":[{"t":"三虎同出水云关","hint":"改写原著：星罗出兵南线","need":{"名望":40},"canonChange":{"node":"M75","inertia":3,"desc":"星罗出兵落鹰原牵制武魂帝国南线，雪崩违令强攻的伤亡从十万降到不足三万"},"win":{"text":"大哥大笑上马。雷纹与邪眸两头白虎并肩出关，旗上写着一个戴字。","d":{"shift":12,"rep":{"天斗":15,"武魂殿":-15},"bonds":{"戴维斯":10,"戴沐白":10,"纪无声":10},"flags":["xingluo_strikes"],"met":["huangshi"],"trait":{"逆":2,"群":1}}}},{"t":"依旨死守","hint":"星罗不流血，也不站出来","win":{"text":"你送纪无声平安北归。大哥摔门而去，星罗一兵未动。","d":{"bonds":{"戴维斯":-5,"纪无声":5},"flags":["held_order","path_hold"],"met":["huangshi"],"trait":{"逆":-1,"忠":1}}}},{"t":"不出兵，写信给三哥","hint":"南线虚实摆上唐三案头","win":{"text":"南线虚实连夜送到唐三案头。你没出一兵，却替嘉陵关打了一仗。","d":{"rep":{"天斗":8,"武魂殿":-5},"bonds":{"戴沐白":10,"纪无声":5},"flags":["intel_to_mubai","path_hold"],"met":["huangshi"],"trait":{"群":1}}}}]},{"id":"n_luoying","title":"落鹰原","year":2657,"cond":{"flag":"xingluo_strikes","notFlag":null,"levelMin":0},"canon":"M82","echo":{"flag":"youlei_sync","text":"前因：幽雷已经成形，竹漪就在你身侧。"},"text":"星罗军北上落鹰原，武魂帝国南线被死死钉在原地。嘉陵关破城的消息先到，接着是唐三战死，又复活。\n\n第三天黄昏，天边压来一条金龙。圣龙宗宗主拓跋希率残部南下突围，九十三级封号斗罗，九个魂环像一串烧红的铁。他要从落鹰原撕开一条去星罗的路。北边嘉陵关方向的烽火，一夜没熄，落鹰原上的草全伏向南方。\n\n大哥擦掉嘴角的血，朱竹云和竹漪各自站到自家白虎身侧。他看着那条龙，咧嘴一笑：「咱们兄弟拦一条龙，够不够？」","choices":[{"t":"齐出迎战拓跋希","hint":"关键战：以白虎拦龙","need":{"战力":1200},"chance":0.5,"win":{"text":"第三回合，金龙坠地。拓跋希跪在焦土上，圣龙军扔下了兵器。","d":{"名望":20,"reveal":["拓跋希"],"ending":"e2","trait":{"险":1,"群":1}}},"lose":{"text":"龙爪洞穿你的胸口。你用最后的雷光把他钉在原地，直到北边传来武魂城降了。","d":{"伤势":90,"reveal":["拓跋希"],"ending":"e4","trait":{"险":1}}}},{"t":"全军退回水云关","hint":"不拿白虎去赌封号斗罗","win":{"text":"你带兵退回关内。拓跋希绕道而去，十天后北边传来武魂城降了。","d":{"bonds":{"戴维斯":-5},"ending":"e1","trait":{"险":-1}}}}]},{"id":"n_crown","title":"王冠","year":2657,"cond":{"flag":"path_crown","notFlag":null,"levelMin":0},"canon":"M85","echo":{"flag":"retook_gate","text":"前因：外关是你亲手夺回来的。"},"text":"武魂帝国亡了。比比东替女儿挡下那一剑的消息传到星罗城时，父皇已经说不出话。\n\n密约的另一半兑现了。那些领过武魂殿补贴的贵族一夜之间全站到你身后，宗正戴衡捧着白虎冠，在御座前等你。苏夜从南边逃来求庇，那盏灯碎得只剩一圈铁骨，他跪在殿下，一句话也不说。\n\n宫门外的人说，三哥正从武魂城南下，身边跟着朱竹清，还有一个背着黑锤的人。\n\n殿外百官已经跪了一地。你想起六岁那年，父皇转扳指的手停下的那一刻。白虎冠就在眼前，你伸手就能够到。","choices":[{"t":"戴上白虎冠，关死水云","hint":"星罗只剩一个皇帝的故事","win":{"text":"当夜你下了三道旨：闭关、焚册，把苏夜送进寂园。祖制那一行字上，按着你的手印。","d":{"rep":{"星罗":15},"ending":"e3","trait":{"忠":-1,"群":-2}}}},{"t":"放下冠，回关迎三哥","hint":"交出帛书，也交出那张网","win":{"text":"你把帛书和那张网一起交给宗正，骑马出了城，回水云关去。","d":{"rep":{"武魂殿":-15,"星罗":5},"bonds":{"戴沐白":10,"朱竹漪":10},"ending":"e1","trait":{"忠":1,"群":1}}}}]},{"id":"n_hold","title":"死守","year":2657,"cond":{"flag":"path_hold","notFlag":null,"levelMin":0},"canon":"M83","echo":{"flag":"shenbow","text":"前因：城头那一千具刻着青字的神弩，都上了弦。"},"text":"嘉陵关破了，唐三战死又复活，比比东限天斗三日投降。南线武魂军孤注一掷，要从水云关撕开去星罗的路。\n\n领头的是一条金龙。圣龙宗宗主拓跋希，九十三级封号斗罗，龙吟震得城头弩弦嗡嗡作响，江雾被龙翼扇开了一道口子。城下的攻城梯一层层压上来，韩擎留下的旧部守在垛口，没有一个人回头。北边的消息还没有来。\n\n竹漪站在你身侧，把袖子挽到手肘：「幽雷，这次试试十成。」你身后是关，关后是星罗。你这一生没赢过谁，也没输给谁，只是守着这道关。","choices":[{"t":"与竹漪合击守门","hint":"关键战：一起赢，一起输","need":{"精神":50,"等级":75},"win":{"text":"幽雷劈开龙鳞，金龙没撑过第三回合，掉头北去。你们一起赢了。","d":{"名望":15,"reveal":["拓跋希"],"bonds":{"朱竹漪":10},"ending":"e1","trait":{"群":1}}},"lose":{"text":"幽雷炸开的那一刻，龙爪穿过了雷光。竹漪接住了你。","d":{"伤势":90,"reveal":["拓跋希"],"ending":"e4","trait":{"群":1}}},"battle":{"n":"拓跋希","lv":93}},{"t":"放出真身独守城门","hint":"关键战：撑到北边消息","win":{"text":"你独自在城门下撑到北边亮起蓝金色的光，拓跋希收爪退走。","d":{"名望":15,"伤势":40,"reveal":["拓跋希"],"ending":"e1","trait":{"险":1,"群":-1}}},"lose":{"text":"真身在第三回合被撕开。你没有退，把那条龙钉在了原地。","d":{"伤势":90,"reveal":["拓跋希"],"ending":"e4","trait":{"险":1,"群":-1}}},"battle":{"n":"拓跋希","lv":93},"need":{"等级":75}}]}],"endings":[{"id":"e1","title":"结局·十年之约","type":"守成","grade":1,"text":"武魂城亡后第十天，三哥带着朱竹清和背锤的唐啸来到水云关。你从城头顺绳滑下，被他一把抱住：「小七，你比我还高了。」\n\n那夜城头喝酒，他说雪崩答应唐三，十年不攻星罗。「十年以后，星罗要有一个不用斗虎台挑出来的皇帝。」\n\n第二年开春你娶了竹漪，关上只摆了三桌酒。她说：「这次不是谁配给谁的。」你守住了这道关。至于笼子，那是十年以后的事。","afterlife":["戴沐白：回星罗城见了父皇，十年里一点点拆着宗祠里的旧规矩。","朱竹漪：做了水云关的女主人，幽雷再没在战场上响过。","沈氏：搬到关后小院，种了一架葡萄，咳嗽一年比一年轻。","星罗：以守代战，商路重开，迎来十年喘息。"],"worldline":"原著方向：星罗以守代战，雪崩与唐三定下十年不攻星罗之约。"},{"id":"e2","title":"结局·三虎同关","type":"改命","grade":3,"text":"金龙坠地三天后，三哥带着唐三从武魂城走出来，一手一个搂住你和大哥。三个姓戴的人第一次站在一起，没有一只手放在刀柄上。\n\n那年秋天，雪崩亲临水云关，在盟书上划掉「十年」，改成「永世」。\n\n父皇临终传位大哥，没有斗虎台。宗祠里那行祖制被凿平，新刻上去的是你用血写的八个字：戴氏子孙，生而为兄。大哥看了很久：「七弟，这字写得太丑了。」","afterlife":["戴维斯：继位为帝，在位三十年，没有一个皇子进过寂园。","戴沐白：与朱竹清游历大陆，回来时教你儿子怎么用白虎打滚。","朱竹漪：随你受封白虎亲王妃，幽雷之名传遍两国。","星罗：与天斗立水云之盟，永世不相攻。"],"worldline":"祖制被废，星罗出兵南线截下最后一条龙，十年之约改为永世之盟。"},{"id":"e3","title":"结局·雷纹王冠","type":"王座","grade":2,"text":"白虎冠比你想象的轻。苏夜进寂园前举灯照了照你：「陛下，你现在怕的，是你自己。」\n\n三天后三哥来了，看着御座上的你，只说了一句：「小七，这些年，辛苦你了。」然后转身离开，再没回过星罗。\n\n十年里星罗越来越强。你的长子六岁觉醒，是一头没有雷纹的白虎。宗正出列，又念起那段祖制。你坐在上首，转着白玉扳指，没有看任何人。","afterlife":["戴沐白：在史莱克旧址住下，再没踏进星罗一步。","苏夜：在寂园最里一间屋子提灯终老，再不窥任何人的记忆。","朱竹漪：受封皇后，从不推辞，也再没和你一起用过幽雷。","星罗：国力日盛，祖制照旧，武魂殿的余烬在暗处未熄。"],"worldline":"星罗中立自保，你借武魂殿遗网登基；祖制照旧，笼子换了主人。"},{"id":"e4","title":"结局·埋骨水云","type":"殉道","grade":2,"text":"你记得的最后一样东西是雾。竹漪抱着你，一遍遍叫的不是七殿下，是{name}。\n\n三哥第五天才到。他接过那只乌木匣，里面是你烧得发紫的护腕，还缠着秋狝那截断绳。他在关前跪了很久：「我跑了这么多年，把该守的全扔给了你。」\n\n那年夏天，雪崩答应唐三十年不攻星罗。星罗人把这十年叫作澜年，老兵说，江雾最浓时，城头会伏着一头白虎，望着北方。","afterlife":["朱竹漪：在关后给你立了衣冠冢，一生未嫁，每年开春洒一杯酒进江雾。","戴沐白：回到星罗城，第一件事是拆了斗虎台。","沈氏：在你走后第二年也去了，葬在衣冠冢旁，竹漪种了一架葡萄。","星罗：未遭战火，那十年被叫作澜年。"],"worldline":"拓跋希的南下被你拦住，星罗未遭战火；你战死，那十年被叫作澜年。"}],"summary":"星罗庶出七皇子线，主题是笼子：藏、站队、拆笼或成为笼子。11 个节点，单局经过 7–9 个：觉醒、精英大赛战戴沐白、配虎站队、斗虎台（推开虎门废祖制）、庚辛城、水云关战呼延震或见密使，再按 path 旗分流到帛书、嘉陵烽火（需废祖制，改写 M75）与三个终局节点。客串苏夜、玉衡、林照、欧冶青、纪无声。"},{"id":"haishen","title":"海神岛·潮音岛民","defaultName":"凌汐","gender":"女","tagline":"魔鬼岛里，有人在远海唱歌","intro":"海马城渔家女，六岁觉醒潮音螺，被大祭司波赛西点为侍祭候补。大陆人叫你的家乡魔鬼岛，你却在螺里听见远海有人唱歌。圣战、九考、魔鲸王，和一段等了百年的旧情，都会落进你的潮声里。","birthYear":2633,"startYear":2639,"faction":"海神岛","wuhun":{"name":"潮音螺","type":"器","system":"辅助控制","tier":"上","desc":"淡青海螺，听潮辨声，以螺音乱敌、增友、镇魂；与远海潮母同源，螺中常闻歌声。"},"innate":7,"attrs":{"体魄":18,"精神":36,"悟性":28,"魅力":26,"气运":25},"coins":60,"rep":{"武魂殿":0,"天斗":0,"星罗":0,"宗门":5,"魂兽":3},"bonds":{"凌渡":15,"吉祥":10,"海马斗罗":8},"flavor":{"work":{"name":"随父出海","desc":"补网打渔，换些金魂币"},"faction":{"name":"巡潮守灯","desc":"为海马圣柱巡潮、添灯"},"place":"海马城"},"rings":[{"slot":1,"options":[{"beast":"回声水母","years":380,"kind":"辅","skill":"潮音·回响","desc":"螺声回荡，同伴魂力运转加快一成，回声探知三十丈。","need":{"战力":90}},{"beast":"老回声水母","years":415,"kind":"辅","skill":"潮音·回响","desc":"嗡鸣更沉，同伴魂力加快一成半，探知五十丈；吸收剧痛。","need":{"战力":125}},{"beast":"礁影海蛇","years":560,"kind":"攻","skill":"潮音·蛇鸣","desc":"螺音化作嘶鸣的蛇影噬咬近敌。越限之环，吸收如赌命。","need":{"战力":200}}]},{"slot":2,"options":[{"beast":"静海歌鲀","years":720,"kind":"控","skill":"潮音·静海","desc":"低沉螺音钻入敌耳，令其迟滞，打断凝聚中的魂技。","need":{"战力":210}},{"beast":"鸣沙蟹","years":600,"kind":"防","skill":"潮音·沙幕","desc":"螺音震起细沙水幕，替自己挡下一记远程魂技。","need":{"战力":190}},{"beast":"歌鲀母","years":1100,"kind":"控","skill":"潮音·沉海","desc":"整片水域的声音一齐沉下去，敌人如坠深水。越限之环。","need":{"战力":330}}]},{"slot":3,"options":[{"beast":"雾鸣鳐","years":1550,"kind":"控","skill":"潮音·雾鸣","desc":"螺声化作带鸣水雾，干扰视听与精神探测，可藏匿身形。","need":{"战力":340}},{"beast":"银环海蛇","years":1300,"kind":"攻","skill":"潮音·银环","desc":"螺音凝成环形声刃，绕身切割近身之敌。","need":{"战力":310}},{"beast":"怒浪雾鸣鳐","years":2600,"kind":"控","skill":"潮音·雾海","desc":"浪尖上的老鳐之环，雾可遮一整支船队。越限之环。","need":{"战力":520}}]},{"slot":4,"options":[{"beast":"鸣角独角鲸","years":4600,"kind":"攻","skill":"潮音·破浪","desc":"螺音凝为一线锐鸣，如独角鲸长角，破水裂甲、震散魂技。","need":{"战力":520}},{"beast":"珊瑚潮龟","years":3 海螺落进你手里。先天魂力七级，器武魂潮音螺。人群还没议论完，一道白底金纹的身影已站在你面前——从不下山的大祭司波赛西。\n\n「孩子，你在螺里听见了什么？」你把螺贴到耳边：「有人在唱歌，在很远很远的地方。」\n\n她沉默了很久。「海神亲和。十日后上山，做侍祭候补。」父亲凌渡按在你肩上的手在抖。她转身又停下：「她若不愿，也可以晚些。海神等得起。」","choices":[{"t":"捧着螺，跟大祭司上山","hint":"侍祭候补，波赛西会记住你","win":{"text":"你住进海神山，一年回一次家。东窗下那个背影，记住了你的名字。","d":{"悟性":2,"精神":2,"bonds":{"波赛西":8},"rep":{"宗门":5},"flags":["acolyte_early"],"trait":{"忠":1}}}},{"t":"攥住父亲的手，晚几年","hint":"留在海马城，与海马斗罗更亲","win":{"text":"你留在海马城，每七日上一次山。海马斗罗常来家里喝鱼汤。","d":{"体魄":2,"魅力":2,"bonds":{"海马斗罗":8,"凌渡":8},"flags":["acolyte_late"],"trait":{"群":1}}}}]},{"id":"n_ship","title":"送船","year":2646,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":null,"text":"吉祥十岁生日那天，外务船进港了。两桅白帆，船头钉着三叉戟铜徽，一年一来：卸下大陆的铁器和盐，装走珍珠、鲸油，还有该送走的人。\n\n前一晚她在你家灶台边坐了一夜，把这些年配的药一包包写好：这包治晕船，这包治触须毒，这包给凌叔泡脚。「我又不是不回来了。」「你就是不回来了。」你说完就后悔了。\n\n天亮时海马斗罗站在人群最后，像一根不说话的桅杆。波赛西没有来，规矩比任何人都老。吉祥走上跳板，回头冲你笑了一下。潮音螺在你手里发烫，远海那首歌一遍遍地唱：别让她一个人走。\n\n船工开始收跳板。海马斗罗看着你——只要你往前一步，他就当作没看见。","choices":[{"t":"纵身跳上船","hint":"私自离岛，去大陆看看","win":{"text":"你落在甲板上，吉祥哭着捶你。海神岛在身后缩成一个点。","d":{"bonds":{"吉祥":12,"波赛西":-5},"rep":{"宗门":-5},"flags":["left_once"],"shift":1,"trait":{"逆":1,"群":2,"险":1}}}},{"t":"转身面向海神山跪誓","hint":"做真正的侍祭","win":{"text":"山顶的雾散了整整一个时辰。第二天，波赛西亲手给你系上了银发带。","d":{"名望":5,"bonds":{"波赛西":12},"rep":{"宗门":8},"flags":["vowed"],"trait":{"忠":2,"群":-1}}}},{"t":"吹响潮音螺送她一程","hint":"不走，也不跪","win":{"text":"螺声追着白帆出港很远。吉祥没有回头，可你知道她听见了。","d":{"精神":1,"bonds":{"吉祥":6},"trait":{"仁":1}}}}]},{"id":"n_bloodtide","title":"血潮","year":2650,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":null,"echo":{"flag":"left_once","text":"前因 · 2646：你跳上外务船，在瀚海城待了两年，又随船回岛。"},"text":"那一年，海是红的。沙滩上躺满鳃被撕开的死鱼，一头三条渔船长的魔魂大白鲨冲上断礁海，背鳍被齐根咬断。海马斗罗脸色像压着暴雨：「圣战。邪魔虎鲸和魔魂大白鲨。」\n\n海神岛的规矩是不插手，七圣柱只沿岸巡潮，护着渔民。你被分在断礁海——父亲的船也在这里下网。\n\n第七天黄昏，潮音螺在耳边炸开：一头独眼小白鲨慌不择路地逃，三道巨影呈扇形包抄，直冲渔船堆而来。领头的是一头万年邪魔虎鲸，它浮出半个脑袋盯着礁上的你，咧开锯齿般的牙，像在笑。\n\n海马斗罗在三十里外。吹响求援螺号，他片刻就到；可片刻之后，小白鲨早被撕碎，杀红眼的虎鲸会不会冲进渔船，谁也说不准。","choices":[{"t":"立在礁头，以潮音拦它","hint":"三环对万年：撑过三回合","need":{"战力":380},"chance":0.45,"win":{"text":"静海迟滞了它，雾鸣蒙了它的眼。撑到第三回合，海马斗罗的长戟从天而落。小白鲨从你脚下游走，回头看了你一眼。","d":{"名望":10,"rep":{"魂兽":5,"宗门":5},"bonds":{"海马斗罗":8,"小白":8},"flags":["beat_orca"],"trait":{"险":2,"仁":1}}},"lose":{"text":"它一头撞碎礁石，用尾巴把你卷进深海。黑暗尽头，你听见了那首歌。","d":{"伤势":55,"bonds":{"小白":10},"flags":["sunk"],"reveal":["小白"],"trait":{"险":2}}}},{"t":"吹求援螺号，护船后撤","hint":"稳妥；那头小白鲨活不成","win":{"text":"渔船全数回港。海马斗罗赶到时水面只剩一团血，你耳边的歌断了一拍。","d":{"bonds":{"海马斗罗":5,"凌渡":5},"rep":{"魂兽":-3},"flags":["called_help"],"trait":{"险":-2,"群":1}}}}]},{"id":"n_stillabyss","title":"无风之海","year":2651,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":null,"echo":{"flag":"sunk","text":"前因 · 2650：你被虎鲸拖入深海，在一只岛一样大的巨螺腹中醒来，是鲨王送你回岸。"},"text":"圣战平息后，你耳边的歌变了，急促、断续，像唱歌的人喘不上气。十八岁生日那天，你借了父亲的船，循着歌往西，驶进从没人去过的禁海。\n\n第三天，风停了。海面平得像一面镜子，前方浮着一座海图上没有的浅灰小岛，珊瑚林一圈圈旋向顶端，像你手里的螺。岛在呼吸。\n\n『回声的孩子。』那声音像一万次潮汐叠在一起。它叫潮母，曾是海神的号角，海神飞升后留在这片静渊替海数潮汐；你的先祖拾得它一片碎壳，血脉里才有了潮音螺。\n\n『深海魔鲸王寿劫将至，想吞我的潮心，炼成一副铠甲熬过天劫。从前有大祭司和海神神念在，它不敢来。可大祭司老了。我要一只耳朵，在岛上替我听着——那盏灯，什么时候熄。』","choices":[{"t":"与潮母立约，做它的耳朵","hint":"守一个不能告诉大祭司的秘密","win":{"text":"珊瑚林轻轻一颤，一缕潮声住进你的螺心。你成了远海在岛上的耳朵。","d":{"精神":3,"bonds":{"潮母":20},"rep":{"魂兽":10},"flags":["tide_pact"],"reveal":["远海未名海魂兽"],"shift":2,"trait":{"逆":1,"忠":-1}}}},{"t":"回岛禀报大祭司","hint":"忠于海神殿；潮母有所保留","win":{"text":"波赛西听完，只望着西方说：「它还活着。」从此海神之光多照了西边一分。","d":{"bonds":{"波赛西":10,"潮母":5},"rep":{"宗门":5},"flags":["told_poseidon"],"reveal":["远海未名海魂兽"],"trait":{"忠":2}}}},{"t":"请它渡你一口潮息","hint":"贪一口十万年的气","need":{"精神":40},"chance":0.5,"win":{"text":"潮息灌进经脉，像回到襁褓里。你的魂力整整涨了一截，潮母没有再提约定。","d":{"等级":1.5,"精神":2,"bonds":{"潮母":8},"reveal":["远海未名海魂兽"],"trait":{"险":2}}},"lose":{"text":"十万年的潮息太重，你七窍流血。潮母叹了口气，把你送出了静渊。","d":{"伤势":40,"bonds":{"潮母":3},"reveal":["远海未名海魂兽"],"trait":{"险":2}}}}]},{"id":"n_outsiders","title":"外来者","year":2652,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M61","echo":{"flag":"pearl_pact","text":"前因 · 2648：你与紫珍珠击掌为约，今天进港的正是她的旗舰。"},"text":"外来者的船在一个晴得过分的早晨进港——挂紫帆的紫珍珠海盗旗舰。海神之光没有把他们挡在十里外，这意味着他们被允许登岛。\n\n一个背竹篓的身影跳下跳板，差点栽进海里。「{name}姐！」吉祥扑进你怀里，又郑重地往后一指：「我拜师了。」人群正中是个眉目温和的青年，眼睛深得看不见底，他护着装有小舞本源的行囊，神情里藏着疲惫。「唐三。小舞的情况，还需要另寻办法。」\n\n海马圣柱前，唐三的手掌落下，整根圣柱从底到顶亮成金色。你的潮音螺骤然发烫，他腰间一枚流光溢彩的罩子与它一起震动、一起唱。光散去，他额上多了一枚三叉戟烙印。\n\n「海神九考。」海马斗罗哑声说。山顶那口百年未鸣的海神钟，响了一声。","choices":[{"t":"请命做唐三的引路侍祭","hint":"随九考同行，见证一切","win":{"text":"海马斗罗点了头。从明天起，你每日提着食盒走侧径上山。","d":{"名望":5,"bonds":{"唐三":8,"吉祥":5},"flags":["guide_tangsan"],"trait":{"群":1}}}},{"t":"回到山顶，守着大祭司","hint":"看她不愿被人看见的一面","win":{"text":"你回到东窗下。波赛西没问为什么，只让你把灯擦亮些。","d":{"bonds":{"波赛西":8,"宁荣荣":3},"flags":["stay_poseidon"],"trait":{"忠":1}}}}]},{"id":"n_frostguest","title":"霜客","year":2653,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M63","echo":{"flag":"tide_pact","text":"前因 · 2651：你与潮母立约，知道远海有一头十万年在等人。"},"text":"这一年你被派去北岸巡潮。雾门礁的雾浓得伸手不见五指，潮音螺里却有两种声音：一叶小舟乱划的桨声，和一艘三桅大船吃满风的帆声。\n\n小舟撞上礁石。船上女子银发如雪，发间别着鹿角玉簪，在四季如春的岛上冻得嘴唇发紫。你听见她的心跳，太慢，太沉，像一头在雪原走了很久的鹿。「我叫白霜。听说远海有一头活了十几万年的海魂兽，我想看看，同类怎么活这么久。」\n\n大船泊在海神之光边界，船头青年提一盏幽蓝的灯：「武魂殿苏夜。她是星斗大森林走失的十万年魂兽，交给我，我立刻掉头。」灯光一晃，一根冰针挑向你的记忆，被你的螺音弹了回去。他轻轻一咦：「只看见一片海，和一首歌。」\n\n白霜靠着礁石，没有求你。她在等。","choices":[{"t":"领白霜入海神之光","hint":"武魂殿会记下你的脸","win":{"text":"海神之光合拢，白船进不得一步。苏夜笑了笑，把灯收进袖里：「后会有期。」","d":{"bonds":{"白霜":12,"苏夜":-5},"rep":{"武魂殿":-8,"魂兽":5},"flags":["sheltered_baishuang"],"met":["beast","wuhun"],"shift":2,"trait":{"仁":1,"逆":1}}}},{"t":"驾舟送她去静渊见潮母","hint":"把秘密分给另一个十万年","need":{"精神":45},"chance":0.6,"win":{"text":"雾鸣藏住小舟，你们在无风之海见到潮母。两个十万年隔水对望，很久没有说话。","d":{"bonds":{"白霜":18,"潮母":6,"苏夜":-5},"rep":{"武魂殿":-8,"魂兽":10},"flags":["baishuang_tide"],"met":["beast","wuhun"],"shift":3,"trait":{"逆":2,"险":1}}},"lose":{"text":"白船咬着雾追了半夜，冥月灯照穿了你的雾鸣。白霜拖着你逃回海神之光里。","d":{"伤势":35,"bonds":{"白霜":10},"rep":{"武魂殿":-10},"flags":["sheltered_baishuang"],"met":["beast","wuhun"],"trait":{"险":1}}}},{"t":"守岛规，两边都不许登岸","hint":"白霜会转舵北去","win":{"text":"白霜点点头，划着小舟消失在雾里。苏夜朝你举了举灯，也掉头走了。","d":{"bonds":{"白霜":-5,"苏夜":5},"rep":{"宗门":5},"flags":["closed_gate"],"met":["beast","wuhun"],"trait":{"仁":-1,"忠":1,"逆":-1}}}}]},{"id":"n_orca_court","title":"虎鲸王庭","year":2654,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M65","echo":{"flag":"beat_orca","text":"前因 · 2650：你曾在断礁海独挡一头万年虎鲸三回合。"},"text":"第四考只有一句话：剿灭邪魔虎鲸一族。三百头虎鲸盘踞怒浪绝境以西，王是一头十万年老鲸。海神岛倾巢而出，七圣柱斗罗各领门人，魔魂大白鲨尽数到齐，唐三立在最前面那条船头。\n\n你和宁荣荣同在辅助阵。海马斗罗只交代一句：「虎鲸靠叫声打仗，你的螺，要让它们听不见彼此。」三道螺音叠成一张网撒下去，九宝琉璃塔的彩光落在你身上，虎鲸的阵型开始错乱。\n\n然后它们冲着辅助阵来了。一头血纹爬满全身的母鲸破浪而出——虎鲸王后，四万年往上，它知道是谁在乱它们的声。海马斗罗被五头万年虎鲸缠在三百丈外，小白正从远处拼命游来。\n\n宁荣荣攥住你的胳膊：「{name}，你说，我听你的。」","choices":[{"t":"迎上去，正面乱它的声","hint":"护住辅助阵，撑过三回合","need":{"战力":650},"chance":0.45,"win":{"text":"螺音钻进王后的颅腔，它在船舷前一头撞偏。小白赶到，把它掀进了浅滩。","d":{"名望":15,"rep":{"宗门":10,"魂兽":-3},"bonds":{"宁荣荣":10,"唐三":8,"小白":5},"flags":["beat_queen"],"reveal":["邪魔虎鲸王"],"trait":{"险":2,"群":1}}},"lose":{"text":"王后咬住了你喷出的声浪，巨力倒灌。你听见手里「咔」的一声，潮音螺裂了。","d":{"伤势":65,"精神":-3,"bonds":{"宁荣荣":8},"flags":["cracked_shell"],"trait":{"险":2}}}},{"t":"护着宁荣荣弃船后撤","hint":"稳妥；唐三多吃一记苦头","win":{"text":"你拽着她跳进圣柱阵中。辅助阵崩了一角，唐三硬扛了王后一击，嘴角带血。","d":{"bonds":{"宁荣荣":12,"唐三":-5},"flags":["retreated"],"trait":{"险":-2,"仁":1}}}}]},{"id":"n_leave","title":"离岛之潮","year":2656,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M67","echo":{"flag":"cracked_shell","text":"前因 · 2654：虎鲸王后咬碎了你的螺音，潮音螺上留下一道裂纹。"},"text":"虎鲸王死在唐三手里，第八环又是十万年。之后的考核快得叫人喘不过气：挑战七圣柱，在波赛西手下撑过一炷香，拔出海神三叉戟。香燃尽那一刻殿门开了，唐三嘴角带血，眼睛亮得惊人。波赛西没有出来送他。\n\n大陆来了挂唐门旗号的海船，消息已经旧了一年：武魂殿立国，天斗老皇帝驾崩，天下乱成一锅粥。七怪要走了。\n\n出发前一夜，吉祥来找你。她二十岁了，是唐三唯一的弟子，额上也有一枚小小的海神烙印。「师父说船上还有一个位子。{name}姐，你想不想去看看大陆现在什么样？」\n\n窗外，海神山顶的灯火亮着。你知道波赛西又坐在了东窗前。","choices":[{"t":"登上唐门的船去大陆","hint":"离开海神岛；你会错过一些事","win":{"text":"船帆鼓起，海神山缩成一点灯火。你第一次没有回头。","d":{"bonds":{"吉祥":8},"rep":{"天斗":5,"宗门":-3},"flags":["left_for_mainland"],"trait":{"逆":1,"险":1}}}},{"t":"留下，大祭司身边需要人","hint":"你会见到一个百年前的人","win":{"text":"你把位子让给了别人。那夜你端着鱼汤走到东窗下，她喝了一口。","d":{"bonds":{"波赛西":10,"海马斗罗":5},"rep":{"宗门":5},"flags":["stayed_island"],"trait":{"忠":1,"群":1}}}}]},{"id":"n_call","title":"海神的呼唤","year":2657,"cond":{"flag":"left_for_mainland","notFlag":null,"levelMin":0},"canon":"M84","echo":{"flag":"silver_tray","text":"前因 · 2655：你替欧冶青寻到了深海沉银，他说要给你打一只螺托。"},"text":"大陆比你想的更吵，也更沉默。吵的是战鼓，沉默的是伤兵营里一天送走的几十个人。年初海上传来消息：波赛西在第九考中献祭，唐三成了新的海神。那夜你朝西跪到天亮——你错过了。\n\n欧冶青在唐门力堂，偶尔半夜满身煤灰地过来，往你手里塞个烫手的烤红薯；有一天他带来一只银白螺托，严丝合缝地扣在潮音螺底下。\n\n嘉陵关破了，欢呼还没落，天就黑了：天使与罗刹同时降临，一道蓝金色的光从天上坠落。唐三死了。百万大军被召到关前，跪地向海神祈祷。\n\n你把螺贴到耳边。百万条小溪各自乱流，大海那头却有东西在等——长明灯、潮母、海神留下的每一缕神念，等一个入海口。吉祥的声音在抖：「{name}姐，你的螺在发光。」","choices":[{"t":"登上点将台，吹响潮音螺","hint":"把百万人的祈祷送往大海","canonChange":{"node":"M84","inertia":1,"desc":"海神的呼唤经潮音螺汇聚，唐三复活提前了一刻"},"win":{"text":"第一声很轻，第二声百川同流，第三声大海那头推开了一扇门。光落在唐三身上。","d":{"名望":20,"shift":3,"bonds":{"唐三":10,"吉祥":5,"欧冶青":5},"rep":{"天斗":10},"met":["shenjiang"],"trait":{"群":1},"ending":"e2"}}},{"t":"以回响替奥斯卡二人续力","hint":"复活之光的代价会轻一些","need":{"精神":50},"canonChange":{"node":"M84","inertia":2,"desc":"奥斯卡、宁荣荣失去魂力的时间由约一年缩短为半年"},"win":{"text":"回响托着两人的魂力。复活之光落下时，他们没有倒下，只是握紧了彼此的手。","d":{"名望":10,"shift":4,"bonds":{"宁荣荣":12,"奥斯卡":8,"欧冶青":5},"rep":{"天斗":5},"met":["shenjiang"],"trait":{"仁":1},"ending":"e2"}}}]},{"id":"n_threedays_pact","title":"三日","year":2657,"cond":{"flag":"tide_pact","notFlag":null,"levelMin":0},"canon":"M80","echo":{"flag":"tide_pact","text":"前因 · 2651：你在静渊与潮母立约，做它在岛上的耳朵。"},"text":"那个老人是踩着浪从东边走来的，海神之光没有拦他。他一身红黑相间的旧袍，手背爬满蝙蝠翅膀似的黑紫细纹。「小姑娘，波赛西还在山上吗？一百年前我从这里走下去，总得自己走上来。」\n\n殿门口，波赛西看着他走上最后一级。「你老了。」「你没有。」你悄悄带上了殿门。\n\n三日里出了两件事。海龙斗罗收到消息：唐三海神之心碎尽，正从海上回来，要斩深海魔鲸王完成第八考。潮母只对你一人说：『我的潮心洗得掉蝙蝠王的毒。只是潮心离体，我只剩几年。只有立过约的耳朵，才捧得住它。』\n\n唐晨扶着门框，黑纹已爬到眼角：「我欠她一百年，不该再让别人替我付利息。」波赛西望着你，那双海一样深的眼睛里，第一次有了你看得懂的东西。","choices":[{"t":"捧螺入海，求那颗潮心","hint":"改写原著：唐晨不死","canonChange":{"node":"M80","inertia":5,"desc":"唐晨未死于海神岛，嘉陵关多出一位99级斗罗，唐三不再陨落"},"win":{"text":"潮心落进他胸口，黑纹一寸寸退成青烟。他睁眼对波赛西说：「你看，我又欠了一个人。」","d":{"shift":20,"bonds":{"唐晨":20,"波赛西":15,"潮母":-10},"flags":["saved_tangchen"],"trait":{"逆":3,"仁":1},"ending":"e3"}}},{"t":"随唐三下魔鲸海沟","hint":"守住潮心，撑过三回合","need":{"战力":850},"chance":0.35,"win":{"text":"你用海啸撞散它的声呐，在潮母螺口前吹出这辈子最长的一口气。三叉戟的金光从魔鲸王背后贯出。","d":{"名望":30,"rep":{"魂兽":15},"bonds":{"潮母":20,"唐三":10,"小白":10},"reveal":["深海魔鲸王"],"trait":{"险":2},"ending":"e4"}},"lose":{"text":"魔鲸王一声长鸣震碎了你的螺音，唐三把你拖出海沟。醒来时，海面浮着一大片金光。","d":{"伤势":60,"trait":{"险":2},"ending":"e1"}}},{"t":"守东窗那盏灯","hint":"原著之路：三日后，灯旁少一个人","win":{"text":"你守在东窗下，没让任何人进去。第三夜，灯火跳了两下，照旧亮着。","d":{"bonds":{"波赛西":10,"唐晨":5},"trait":{"逆":-2,"忠":1},"ending":"e1"}}}]},{"id":"n_threedays","title":"三日","year":2657,"cond":{"flag":null,"notFlag":"tide_pact","levelMin":0},"canon":"M80","echo":{"flag":"told_poseidon","text":"前因 · 2651：你把潮母的事禀报了大祭司，海神之光多照了西边一分。"},"text":"那个老人是踩着浪从东边走来的，海神之光没有拦他。他一身红黑相间的旧袍，手背爬满蝙蝠翅膀似的黑紫细纹。「小姑娘，波赛西还在山上吗？一百年前我从这里走下去，总得自己走上来。」\n\n殿门口，波赛西看着他走上最后一级。「你老了。」「你没有。」你悄悄带上了殿门。\n\n三日里，海龙斗罗收到消息：唐三海神之心碎尽，正从海上回来，要斩深海魔鲸王完成第八考。同一夜，远海的歌忽然变成一声短促的警报——魔鲸王动了，它在往静渊游。潮母没有向你求什么，它只是在唱。\n\n唐晨扶着门框，黑纹已爬到眼角，听见螺响便笑了：「去吧，小姑娘。这里有我们两个老东西，够了。」","choices":[{"t":"随唐三下魔鲸海沟","hint":"守住静渊，撑过三回合","need":{"战力":850},"chance":0.3,"win":{"text":"你用海啸撞散它的声呐，潮母在你身后一同长鸣。三叉戟的金光从魔鲸王背后贯出。","d":{"名望":30,"rep":{"魂兽":15},"bonds":{"潮母":20,"唐三":10,"小白":10},"reveal":["深海魔鲸王"],"trait":{"险":2},"ending":"e4"}},"lose":{"text":"魔鲸王一声长鸣震碎了你的螺音，唐三把你拖出海沟。醒来时，海面浮着一大片金光。","d":{"伤势":60,"trait":{"险":2},"ending":"e1"}}},{"t":"守东窗那盏灯","hint":"原著之路：三日后，灯旁少一个人","win":{"text":"你守在东窗下，没让任何人进去。第三夜，灯火跳了两下，照旧亮着。","d":{"bonds":{"波赛西":10,"唐晨":5},"trait":{"逆":-2,"忠":1},"ending":"e1"}}}]}],"endings":[{"id":"e1","title":"结局·潮声守岛","type":"守","grade":1,"text":"唐晨在第三夜走了，留下一柄血红的修罗魔剑。第九考前夜，波赛西让你替她梳头，第一次叫你的名字：「侍祭侍奉的是海神，不是哪一个人。今夜以后，你可以忘了这句话。」她走进金光，再没出来。唐三成了海神，海龙斗罗接任大祭司，你做了侍祭长。那年冬天，你废除了「岛上不养无魂之人」的旧规。东窗下的铜灯，你每天去添油。","afterlife":["波赛西：在第九考中献祭，与唐晨在神界重逢。","吉祥：回海马城开药铺，木牌上写着无魂者诊金全免。","潮母：歌声一年比一年轻，仍在静渊替海数着潮汐。","海神岛：海龙斗罗任大祭司，岛门第一次为无魂者打开。"],"worldline":"原著主线照常推进；你成为侍祭长，废除了无魂者十岁离岛的千年旧规。"},{"id":"e2","title":"结局·远帆","type":"行","grade":2,"text":"嘉陵关前的百万人后来都说，他们听见了海。唐三复活，双神共存，武魂帝国覆灭。说书人从不提一个海岛来的侍祭，你也不在意。新海神替你解了额上的烙印，你却没有回岛，做了海神岛第一位驻大陆的使节。紫珍珠的海盗船改成商船，十天一个来回，瀚海城的人叫它潮音号。欧冶青问你：「上岛的考核，有没有给铁匠的？」你笑出了声。","afterlife":["吉祥：留在大陆行医，成了天斗城最难排上号的大夫。","欧冶青：年年来瀚海城码头送船，说总要上岛看看那七根柱子。","林照：每年海祭都来瀚海城看海，不说话，你便陪她站着。","海神岛：与大陆首次通航，魔鬼岛之名渐被人忘了。"],"worldline":"海神岛首次与大陆通航；海神的呼唤经潮音汇聚，复活之光的代价略轻。"},{"id":"e3","title":"结局·晨潮","type":"改","grade":3,"text":"潮母第一次离开静渊，把一颗珍珠色的潮心放进你掌心：『替我看着那座岛，我要睡了。』唐晨的黑纹退成青烟。第九考，波赛西依然献祭：「这一次换我先走，你慢慢来。」嘉陵关决战那天，一柄黑色巨锤从天而降，砸偏了罗刹魔镰，白发老人挡在剑斗罗与骨斗罗身前。唐三没有坠落。第二年春天，唐晨回到海神岛，坐在东窗下她坐了一百年的位置，面朝神界。","afterlife":["唐晨：守着东窗铜灯度过余生，说等她多久都行。","波赛西：依旧献祭，这一次是她让他慢慢来。","潮母：交出潮心后长眠静渊，螺壳上的珊瑚年年长高。","尘心、古榕：被唐晨护在身后，活着走下了嘉陵关。"],"worldline":"唐晨未死，唐三未陨落，尘心、古榕生还，复活之光未动用；潮母长眠。"},{"id":"e4","title":"结局·渊歌","type":"海","grade":2,"text":"魔鲸王在离你十丈处停住，三叉戟的金光从它背后贯出。唐三重铸海神之心，波赛西在第九考中献祭，临行前摸了摸你的头。那年秋天，寿数将尽的潮母选择了化形，你在静渊海面上捞起一个白发小女孩，她一开口就是那首歌。你和小白立下远海之约：海神岛不猎远海的十万年，远海魂兽不近岛岸百里。很多年后，海马城的孩子在螺里听见两个声音唱歌。","afterlife":["潮母：化形为白发女孩住进凌家，父亲多摆了一副碗筷。","小白：与你共立远海之约，接过魔鲸死后空出的大海。","唐三：以鲸珠重铸海神之心，在远海之约上落下金印。","海神岛：与远海魂兽约定不战，海洋霸主之争就此平息。"],"worldline":"魔鲸王死后的海洋真空由远海之约填补；潮母化形为人，留在海马城。"}],"summary":"渔家女凌汐，上品器武魂潮音螺。11节点（2657年三个互斥终局节点，单局见9个）+16事件。分叉：跳船/跪誓；血潮虎鲸检定；静渊立约决定能否救唐晨；引路/守大祭司；霜客三选；虎鲸王后检定；去留大陆。结局：潮声守岛、远帆、晨潮（改命）、渊歌（胜魔鲸王）。"},{"id":"shenjiang","title":"庚辛城·神匠学徒","defaultName":"欧冶青","gender":"男","tagline":"凡铁打出神器，才算神匠","intro":"庚辛城上千家铁匠铺，城北压着武魂殿的金顶。你六岁觉醒熔炉，被判普通，却被神匠楼高看见一点青火。拉十九年风箱，接单、考级、淘铁精，撞上唐门与三大暗器——你的手艺卖给谁，就会杀死谁。","birthYear":2631,"startYear":2637,"faction":"铁匠协会","wuhun":{"name":"熔炉","type":"器","system":"锻造","tier":"中","desc":"掌心一座泥胎铁箍的小炉，火色淡青，能化开寻常炉火化不开的铁精。"},"innate":5,"attrs":{"体魄":24,"精神":20,"悟性":30,"魅力":15,"气运":18},"coins":60,"rep":{"武魂殿":0,"天斗":0,"星罗":5,"宗门":0,"魂兽":0},"bonds":{"楼高":5,"思龙":5,"思迪":3},"flavor":{"work":{"name":"接单打铁","desc":"替城里铺子打铁换金魂币"},"faction":{"name":"协会差事","desc":"替铁匠协会跑腿办事"},"place":"庚辛城·楼家后院"},"rings":[{"slot":1,"options":[{"beast":"赤鳞火蜥","years":380,"kind":"辅","skill":"炉心火","desc":"熔炉火温暴涨，铁坯更快到火候，近身之敌亦被灼伤","need":{"战力":110}},{"beast":"铁背穿山甲","years":320,"kind":"防","skill":"铁骨","desc":"双臂覆上一层铁甲，挨锤不伤，可硬接刀剑","need":{"战力":90}},{"beast":"赤岩火蝎","years":560,"kind":"攻","skill":"蝎尾淬","desc":"青火凝成蝎尾一刺，灼穿皮甲；越限之环，吸收有爆体之险","need":{"战力":160}}]},{"slot":2,"options":[{"beast":"炎甲虫","years":620,"kind":"辅","skill":"淬火","desc":"青火顺着铁的筋骨重排纹理，所淬兵器多扛三成力","need":{"战力":230}},{"beast":"金纹铁蜈","years":540,"kind":"攻","skill":"千锤","desc":"每一锤的力道
