function newRun(p,name,perk){
  const a=Object.assign({},p.attrs); if(perk==="body"){a.体魄+=8;a.精神+=8} if(perk==="fate"){a.气运+=15}
  S.run={id:p.id,name,perk,y0:p.startYear,t:0,lv:p.innate||0,bank:0,a,coins:p.coins||0,fame:0,hurt:0,
    rep:Object.assign({},p.rep),bonds:Object.assign({},p.bonds),flags:[],trait:{仁:0,逆:0,群:0,险:0,忠:0},
    rings:[],bones:[],items:[],acap:perk==="fate"?{气运:130}:{},shift:0,bonusFate:0,reveal:[],met:[],
    storyQueueVersion:2,nodesDone:[],evSeen:[],queue:[],ap:3,x:{evo:0,sword:0,devour:0,gear:0},bag:[],world:{offset:[],news:{},notes:[]},treasDone:[],heard:[],missed:[],rumors:[],actLog:[],log:[],newsSeen:[],turns:0,phase:"turn",report:null,altered:[],hist:[]};
  S.meta.runs++; startTurn(); save();
}
function startTurn(){
  migrateSoulSystems();migrateOpportunities();flushSealedRings([]);
  const r=R(),p=P(); r.ap=3; r.actLog=[]; r.queue=[]; r.turns++;
  const y=year();
  // Conditions are evaluated when a chapter reaches the front, after earlier choices.
  const order=(a,b)=>a.year-b.year||(Number((a.canon||'').slice(1))||0)-(Number((b.canon||'').slice(1))||0);
  for(const n of [...p.nodes].sort(order))if(n.year<=y&&!storyNodeSettled(n,'node'))r.queue.push({k:'node',id:n.id});
  const fz=myFac();if(fz){r.facDone=r.facDone||[];for(const n of [...fz.nodes].sort(order))if(n.year<=y&&!storyNodeSettled(n,'fnode')&&!(n.canon&&/^M/.test(n.canon)&&(packHasCanon(n.canon)||canonTaken(n.canon,'f'))))r.queue.push({k:'fnode',id:n.id,facId:fz.id});}
  refreshStoryQueue();
  // random events
  const pool=p.events.map(e=>({e,src:"p"})).concat(COMMON.map(e=>({e,src:"c"}))).concat(fortunes().map(e=>({e,src:"f"}))).filter(({e,src})=>evOK(e,y)&&evAllowed(e,src!=="p"));
  const nEv=r.queue.some(q=>!q.ack)?0:1; // 关键剧情之外，每季保留一次原有际遇
  r.rumors=[];
  for(const t of TREAS){ if(r.treasDone.includes(t.id)||r.missed.includes(t.id)) continue;
    if(t.yearMax<y){ r.missed.push(t.id); if(known(t)) r.rumors.push({k:"miss",id:t.id}); continue }
    if(t.yearMin<=y&&!known(t)&&r.lv>=tMin(t)-8&&rnd()<.1+r.a.气运/400+r.fame/500){ r.heard.push(t.id); r.rumors.push({k:"heard",id:t.id}) } }
  for(let i=0;i<nEv&&pool.length;i++){ const tot=pool.reduce((a,x)=>a+(x.e.w||2),0); let q=rnd()*tot, pick=0; for(let j=0;j<pool.length;j++){q-=pool[j].e.w||2; if(q<=0){pick=j;break}} const {e,src}=pool.splice(pick,1)[0]; r.queue.push({k:"ev",id:e.id,src}); r.evSeen.push(e.id) }
  if(r.lv>=50||year()>END_YEAR) r.queue.push(seasonalStory());
  if(!r.queue.length) r.queue.push(seasonalStory());
  const chl=challengerFor(r); if(chl&&rnd()<.45) r.queue.push(chl);
  const xs=xiaowuSacrifice(r); if(xs) r.queue.push(xs);
  const ot=orgThreat(); if(ot) r.queue.push(ot);
  while(opportunityRecoveryEvent()){} // 替代成长是自动情报，不占玩家剧情选择。
  const reunion=shrekEncounterEvent();if(reunion)r.queue.push(reunion);
  r.phase="turn";
}
function myFac(){return S.run&&S.run.fac?F_BY[S.run.fac.id]:null}
function facPerk(k){const f=myFac();return f&&f.perk&&f.perk[k]||0}
function tryPromote(out){const r=R(),f=myFac(); if(!f) return; while(r.fac.rank<4){ const q=f.rankReq&&f.rankReq[r.fac.rank+1]; if(!q) break; if(r.fac.merit>=(q.merit||0)&&r.lv>=(q["等级"]||0)){ r.fac.rank++; out&&out.push({t:`晋升：${f.name}·${f.ranks[r.fac.rank]}`,up:true}); gainA("魅力",2,out); toast(`晋升为${f.name}${f.ranks[r.fac.rank]}`) } else break }}

function resolveChoice(c,forced){
  if(c.cond&&!condOK(c.cond))return {ok:false,text:"前置条件已改变，此项安排不再执行。",ds:[],chance:false};
  if((c.cond||c.battle||c.nonCombat||c.shrekHunt)&&forced!==false){const[ok,why]=needOKc(c);if(!ok)return {ok:false,text:"条件尚未满足："+why,ds:[],chance:false}}
  const r=R();
  let ok=true; const gated=c.need&&Object.keys(c.need).length&&needOK(c.need)[0];
  if(c.chance!=null&&!gated){ ok=rnd()<clamp(c.chance+r.a.气运/400,.05,.95) }
  if(forced!==undefined) ok=forced;
  const o=ok?c.win:(c.lose||(forced===false?{text:"这一战你没能拿下，只得负伤退走。原本想做成的事，也随之落空。",d:{伤势:30,名望:-2}}:c.win)); let d=o&&o.d;
  if(!ok&&d&&d.death){ d=Object.assign({},d); delete d.death; d.伤势=Math.max(d.伤势||0,45) }
  const ds=apply(d);
  if(c.canonChange&&ok){ if(!r.altered.includes(c.canonChange.node))r.altered.push(c.canonChange.node); ds.push({t:`世界线已改写：${c.canonChange.desc||c.canonChange.node}`,up:false}) }
  return {ok,text:o&&o.text,ds,note:c.note||(o&&o.note),chance:(c.chance!=null&&!gated)||forced!==undefined};
}

function fuseBone(i){

      if(ATTRS.includes(k)) r.a[k]=clamp(r.a[k]-v,0,acap(k));
    delete old.appliedAttrs;

  }

/* 魂骨温养提高等效品质，保留原始来源；突破十万年须有外附成长性或稀有本源。 */
function boneGrowthLimit(b){

function boneGrowthInfo(b,r){

 const gain=Math.max(100,Math.ceil(y*(.06+Math.min(.04,(r.a.体魄+r.a.精神)/4000))/100)*100);
 const target=Math.min(limit,stage,y+gain),cost=Math.ceil((200+y*.025)/100)*100;
 let reason='';
 if(r.settled||r.pendingEnd)reason='此生已结算';
 else if(r.queue.some(q=>!q.ack)||r.report)reason='先处理完本季待定之事';
 else if(r.ap<1)reason='本季行动已用完';
 else if(b.growthSeason===r.y0*12+r.t)reason='本季已温养，须待下季';
 else if(y>=limit)reason=y>=1000000?'魂骨已至百万年品质':y>=50000&&y<100000&&b.slot!=='外附'?'本源已至极限，可借十万年魂骨突破':'本源已至成长极限';
 else if(target<=y)reason='修为尚不足以承载更高品质';
 else if(target>=100000&&(r.a.体魄<80||r.a.精神<80))reason='十万年品质需体魄 80、精神 80';
 else if(target>=10000&&(r.a.体魄<40||r.a.精神<40))reason='万年品质需体魄 40、精神 40';
 else if(r.coins<cost)reason=`缺金魂币 ${cost-r.coins}`;

}
function boneBreakthroughReason(b,material,r){

 if(r.queue.some(q=>!q.ack)||r.report)return '先处理完本季待定之事';
 if(r.ap<1)return '本季行动已用完';
 if(r.lv<75||r.a.体魄<80||r.a.精神<80)return '突破需 75 级、体魄 80、精神 80';

}

function pxSvg(rows,pal,s){ const h=rows.length,w=rows[0].length; let b=""; rows.forEach((row,y)=>{ for(let x=0;x<row.length;){ const ch=row[x]; if(!pal[ch]){x++;continue} let n=1; while(row[x+n]===ch) n++; b+=`<rect x="${x}" y="${y}" width="${n}" height="1" fill="${pal[ch]}"/>`; x+=n } });
  return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w*s}" height="${h*s}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${b}</svg>`)}")` }

  F("--fr-btn",[".DDD.","DCCCD","DC.CD","DCCCD",".DDD."],{D:"#1d0702",C:"#efd6a2"},2);
  F("--fr-gbtn",B5,{D:"#2a0b04",L:"#fff0b8",S:"#b07a22"},2);
  F("--fr-plank",B5,{D:"#1d0702",L:"#9a5128",S:"#33100a"},2);
  F("--fr-plank-hi",B5,{D:"#1d0702",L:"#f6d27a",S:"#a8701f"},2);

  const wall=(c1,c2)=>{ const g=Array.from({length:24},()=>Array(24).fill(".")); const put=(pts,ch)=>pts.forEach(([x,y])=>g[y][x]=ch);
    put([[4,2],[3,3],[4,3],[5,3],[2,4],[3,4],[4,4],[5,4],[6,4],[3,5],[4,5],[5,5],[4,6]],"a");
    put([[16,13],[15,14],[17,14],[14,15],[18,15],[13,16],[16,16],[19,16],[14,17],[18,17],[15,18],[17,18],[16,19]],"a");
    put([[16,4],[4,16],[10,10],[22,22]],"b"); return pxSvg(g.map(r=>r.join("")),{a:c1,b:c2},2) };
  st.setProperty("--wall",wall("#d7dea6","#cbd59a")); st.setProperty("--wall-dark",wall("#2a0c05","#250a04")) }
