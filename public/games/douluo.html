米。"}]},{"id":"c_angel_god","title":"天使降临","when":{"yearMin":2656,"yearMax":2657,"levelMin":0,"flag":null,"notFlag":null},"w":2,"once":true,"text":"武魂城上空金光万丈，九道光柱从斗罗殿冲天而起。三日后，一位金甲女子踏空而立，背后六翼舒展。满城百姓跪伏在地，都说武魂殿出了一尊真神。","choices":[{"t":"跪下祈福","win":{"text":"金光洒落在身上，你只觉心神宁静，那是许久都没有过的安稳。","d":{"精神":2,"rep":{"武魂殿":4},"trait":{"逆":-1}}}},{"t":"抬头直视神光","need":{"精神":55},"chance":0.3,"win":{"text":"神光刺得你双目流泪，却也洗过你全身魂力，精神仿佛被重铸了一遍。","d":{"等级":1,"精神":5,"reveal":["千道流","六翼天使"],"trait":{"逆":1}}},"lose":{"text":"你双目剧痛，眼前只剩一片金白，足足半个月后才重见光明。","d":{"伤势":30}}},{"t":"连夜赶去天斗示警","win":{"text":"天斗军方连夜加固城防，你带去的消息，比密探还快了整整半天。","d":{"名望":2,"rep":{"天斗":5},"reveal":["千仞雪"]}},"note":"按：千道流献祭自身，送孙女千仞雪成为天使之神。"}]},{"id":"c_dugu_poison","title":"失控的毒雾","when":{"yearMin":2657,"yearMax":2657,"levelMin":0,"flag":null,"notFlag":null},"w":2,"once":true,"text":"嘉陵关决战，城头升起一片碧绿毒雾，顺风卷向武魂帝国守军，城下哀嚎连成一片。高处一个青面老者的手在发抖，毒雾已经失控，正朝自己人漫来。","choices":[{"t":"扯湿布护着伤兵后撤","win":{"text":"你前后背出七八个伤兵，自己也吸了几口毒雾，咳了整整半个月。","d":{"名望":3,"伤势":10,"trait":{"仁":2}}}},{"t":"上前劝老者收手","need":{"名望":40},"chance":0.3,"win":{"text":"老者看着城下的尸山，终于收了毒，低声说了一句：「这辈子，够了。」","d":{"名望":3,"bonds":{"独孤博":12},"trait":{"仁":1}}},"lose":{"text":"毒雾倒卷而来，你连人带话被吞了进去，被拖出来时只剩半口气。","d":{"伤势":40}}},{"t":"趁毒冲进关门","need":{"战力":1000},"chance":0.4,"win":{"text":"你第一个冲进嘉陵关，从死人堆里抢下了守将的令旗。","d":{"金魂币":200,"名望":5,"trait":{"险":2,"仁":-1}}},"lose":{"text":"毒雾里敌我不分，你和守军一起，倒在了阴暗的城门洞里。","d":{"伤势":40}},"note":"按：独孤博此战一场毒攻死伤数十万，此后发誓不再在战场上用毒。"}]},{"id":"c_two_gods","title":"海神陨落","when":{"yearMin":2657,"yearMax":2657,"levelMin":0,"flag":null,"notFlag":null},"w":2,"once":true,"text":"天斗城外天地变色，金色天使与血红魔镰两尊神祇，围攻一位手持三叉戟的青年。一夜之后传来噩耗：海神陨落了。城中百万人自发跪地，为他祈祷。","choices":[{"t":"和百万人一同祈祷","win":{"text":"你闭上眼的那一刻，仿佛感到自己的心念汇入了一片浩瀚无边的金光。","d":{"精神":3,"气运":3,"rep":{"天斗":3},"bonds":{"唐三":5},"trait":{"群":1}}}},{"t":"赶去战场帮忙","need":{"战力":1200},"chance":0.2,"win":{"text":"你挡下一道余波，护住了施展复活之光的两人，金光里有人朝你点头。","d":{"等级":1,"名望":5,"bonds":{"唐三":10},"trait":{"险":2}}},"lose":{"text":"神战的余波像大山一样压下来，你还没靠近，就被震飞了出去。","d":{"伤势":40}}},{"t":"收拾行装出城","win":{"text":"你随着逃难的人群出了城，回头时，天边正亮起一道冲天金光。","d":{"trait":{"险":-2}}},"note":"按：唐三借复活之光与百万人信仰复活，以双神共存击杀比比东。"}]}]}</script>
<script type="application/json" id="d-treas">{"treasures":[{"id":"t_s2_shengming","name":"生命之湖","tier":"神","place":"星斗大森林·核心圈","yearMin":2642,"yearMax":2657,"canon":null,"owner":"帝天（二三部中的兽神居所）","rumor":"有猎魂队说，星斗大森林最深处有一片终年不冻的湖，湖边连十万年魂兽都低着头走路，靠近的人类没有一个回来。","memory":"二三部中，生命之湖是星斗大森林的魂兽圣地，兽神帝天常居于此，只有顶尖魂兽可以进入。","text":"林子越走越静，最后连虫鸣都没了。树冠豁然散开，一片翠绿的湖水躺在谷底，水汽里全是浓得发甜的生命气息，你只吸了一口，骨缝里的旧伤就开始发痒。湖心的水面忽然隆起，一只金色竖瞳从水下睁开，比你整个人还大。\n「人类。」那声音直接落在你脑海里，「八十万年来，敢走到这里的，你是第三个。说吧，来求什么，还是来求死。」","choices":[{"t":"跪地陈情，求湖水洗髓","hint":"兽神并不憎恶所有人类","need":{"魅力":35},"chance":0.55,"win":{"text":"帝天沉默良久，尾尖轻轻一挑，一捧湖水落在你身上。你在湖边昏睡三日，醒来时筋骨如新，魂力奔涌。","d":{"等级":5,"体魄":8,"伤势":-100,"reveal":["帝天"],"flags":["s_ditian_mercy"]}},"lose":{"text":"金瞳里闪过一丝厌烦，一股威压碾下来，你七窍流血被抛出谷口，好在还留着命。","d":{"伤势":60,"reveal":["帝天"]}}},{"t":"趁其不备，偷取湖心精华","hint":"对面是八十万年的黑龙","need":{"战力":1000},"chance":0.12,"win":{"text":"你潜入湖底抢得一缕翠绿精华，转身狂奔。身后传来低沉的笑声，他竟没有追。精华入体，你的生命本源翻了一倍。","d":{"等级":7,"体魄":12,"气运":5,"reveal":["帝天"],"trait":{"险":2}}},"lose":{"text":"一只覆满黑鳞的龙爪从水下探出，你连惨叫都来不及发出。湖面重归平静，像什么都没发生过。","d":{"death":"偷生命之湖精华，被帝天一爪拍碎","reveal":["帝天"]}}},{"t":"以唐门暗器手艺相换","need":{"悟性":40},"chance":0.4,"win":{"text":"你摊开一套精巧暗器讲解原理，帝天听得意外认真。临别时他吐出一片褪下的黑色逆鳞，鳞片冰凉，压着一缕龙威。","d":{"精神":6,"悟性":5,"reveal":["帝天"],"bone":{"slot":"外附","name":"黑龙逆鳞","desc":"帝天褪下的旧逆鳞，危急时自行护主，挡下一击必死之伤。","attrs":{"体魄":6,"精神":4}}}},"lose":{"text":"帝天看了一眼便失了兴致，只说了句「雕虫小技」，湖面掀起浪头把你推回了林中。","d":{"名望":-2,"reveal":["帝天"]}}},{"t":"转身离开","win":{"text":"你低下头，一步一步倒退出山谷。直到走出很远，那道金色目光才从你背上移开。","d":{}}}]},{"id":"t_s3_longmian","name":"龙眠之渊","tier":"神","place":"星斗大森林·生命之湖地底","yearMin":2648,"yearMax":2657,"canon":null,"owner":"银龙王（三部苏醒，化名古月娜）","rumor":"星斗大森林深处偶有地鸣，像有什么庞然大物在地底翻了个身。附近的魂兽会成群伏地不动，连十万年的也不例外。","memory":"三部揭示：龙神被修罗神劈成金银两半，银龙王逃到斗罗大陆，由帝天护着在星斗大森林地下长眠，两万年后才醒来。","text":"地缝深处是一条看不到尽头的银色甬道，墙上每一片鳞纹都在缓慢呼吸。甬道尽头，一团月光似的银辉蜷成一团，里面隐约是一条龙的轮廓，小得像只猫，又大得像整片天空。你刚踏进一步，背后就响起帝天压低的嗓音：\n「再往前一步，我就把你的魂捏碎。」\n可就在这时，那团银辉里有一只眼睛，微微睁开了一条缝。","choices":[{"t":"静立不动，以精神力回应","hint":"她还在梦里","need":{"精神":50},"chance":0.35,"win":{"text":"银辉里传来一丝极轻的好奇，像有人隔着梦看了你一眼。一缕银光落进你的精神之海，从此你对万物元素的感知清晰得可怕。","d":{"精神":14,"悟性":8,"等级":3,"reveal":["银龙王","帝天"],"flags":["s_yinlong_glance","overlimit"]}},"lose":{"text":"那只眼睛又合上了，帝天却已经出手。你被一尾扫出地缝，精神之海裂开一道口子。","d":{"精神":-6,"伤势":55,"reveal":["银龙王","帝天"]}}},{"t":"伸手触碰银辉","need":{"战力":1100},"chance":0.1,"win":{"text":"指尖碰到银辉的瞬间，一股古老到无法理解的力量涌进经脉又退去，只留下一枚银色的龙纹烙印。","d":{"等级":8,"体魄":10,"精神":10,"气运":8,"reveal":["银龙王","帝天"],"flags":["s_dragon_mark"]}},"lose":{"text":"银辉只是轻轻一颤，你的身体便从指尖开始化成光点。帝天叹了口气，没有阻拦。","d":{"death":"触碰沉睡的银龙王，被龙神之力湮灭","reveal":["银龙王","帝天"]}}},{"t":"向帝天承诺守口如瓶","need":{"魅力":30},"chance":0.6,"win":{"text":"帝天盯了你很久，最终收回杀意，把你送回地面，还丢下一句话：将来人类若要动这片林子，你记得今天。","d":{"名望":3,"气运":4,"reveal":["帝天"],"bonds":{"帝天":15},"flags":["s_ditian_oath"]}},"lose":{"text":"帝天不信人类的誓言，抹去了你这段记忆。你在林子边醒来，只觉得头痛欲裂。","d":{"精神":-4,"伤势":20}}},{"t":"转身离开","win":{"text":"你转身就走，一路不敢回头。身后的地缝无声合拢，好像从没打开过。","d":{}}}]},{"id":"t_s2_bingsui","name":"万年冰髓与沉睡的冰蚕","tier":"神","place":"极北之地·无名冰窟","yearMin":2640,"yearMax":2657,"canon":null,"owner":"天梦冰蚕（二部中霍雨浩的第一魂环）","rumor":"极北的冰原猎人说，有一道冰缝底下冒出的寒气能把魂力冻住，夜里还能听见像蚕吃桑叶的沙沙声。","memory":"二部中，天梦冰蚕因躲避天敌坠入冰窟，靠大量万年冰髓沉睡修炼数万年，出世时已近百万年，精神力冠绝魂兽。","text":"冰缝下面是一整片乳白色的冰髓矿脉，寒意凝成雾，在你睫毛上结霜。矿脉中央卧着一只通体如玉的胖蚕，比水缸还大，背上九道金纹缓缓明灭。它睡得很沉，嘴边还挂着半块啃了一半的冰髓。\n就在你屏住呼吸时，一个懒洋洋的声音在脑海里响起：「嗯？好久没见过人类了……你的精神之海，看起来挺宽敞。」","choices":[{"t":"凿取一块万年冰髓","need":{"体魄":35},"chance":0.6,"win":{"text":"你小心敲下拳头大的一块冰髓，冰蚕翻了个身继续睡。冰髓入腹，一股极寒直冲精神之海，冻住又化开，你的魂力凝实了一大截。","d":{"等级":4,"精神":10,"体魄":4,"item":"万年冰髓"}},"lose":{"text":"敲击声惊动了冰蚕，一股精神冲击像冰锥扎进脑海。你踉跄逃出冰缝，半个月都在头疼。","d":{"精神":-5,"伤势":35}}},{"t":"敞开精神之海，任它寄居","hint":"原著里它撑爆过一位封号斗罗","need":{"精神":55},"chance":0.25,"win":{"text":"冰蚕钻入你眉心，在精神之海里打了个滚，满意地住下。它把九十万年的修为凝成一道魂环送给你，从此你的精神力再无同代敌手。","d":{"ring":{"beast":"天梦冰蚕","years":1000000,"kind":"控","skill":"天梦冰封","desc":"冰蚕寄居精神之海，精神冲击与极寒同时降临"},"精神":15,"reveal":["天梦冰蚕"],"flags":["overlimit","s_bingcan_host"]}},"lose":{"text":"冰蚕的精神本源比你想象的庞大千倍，刚进入精神之海，你的头颅便像被灌满的皮囊一样涨裂。","d":{"death":"强行容纳天梦冰蚕，精神之海撑爆","reveal":["天梦冰蚕"]}}},{"t":"和它聊聊天，讲讲外面的世界","need":{"魅力":25},"win":{"text":"冰蚕听得津津有味，临别时送了你一缕精神本源当谢礼。「等我睡醒了，去外面找你玩。」","d":{"精神":8,"悟性":5,"气运":3,"reveal":["天梦冰蚕"],"bonds":{"天梦冰蚕":20}}}},{"t":"转身离开","win":{"text":"你没敢惊动它，悄悄爬出冰缝。风雪很快盖住了那道裂口。","d":{}}}]},{"id":"t_s2_xianling","name":"妖眼魔树下的仙灵草","tier":"绝","place":"星斗大森林·外围西林","yearMin":2638,"yearMax":2657,"canon":null,"owner":"万妖王的领地（二部中称其靠吞噬仙灵草蜕变）","rumor":"星斗西边有片林子，树皮上长着一只只闭着的眼睛。采药人说那里有会说话的草，可去找的人，最后都被树根拖进了地里。","memory":"二部提到，仙灵草天生有灵智，喜伴妖眼魔树而生；一株妖眼魔树吞了它，两者融合，成了统御星斗外围的万妖王。","text":"这片林子里每一棵树都在看你。树皮上的眼睛一只接一只睁开，枝条无风自动。林子正中，一株半透明的小草从老树根缝里探出头，叶尖挂着露珠，竟奶声奶气地开口：「快走呀，它醒着呢。」\n话音刚落，你脚下的泥土拱起，一条比腰还粗的树根缓缓缠了上来，远处传来一声沉闷又古老的叹息。","choices":[{"t":"抢下仙灵草就跑","need":{"战力":750},"chance":0.4,"win":{"text":"你斩断树根，一把连泥带草捧起，拼命冲出林子。仙灵草在你掌心哭了一路，最后还是乖乖化成一股清流涌入眉心。","d":{"等级":3,"精神":10,"悟性":6,"reveal":["万妖王"],"trait":{"险":1}}},"lose":{"text":"整座林子活了过来，万千枝条把你缠成一个茧。你拼尽全力才挣脱，浑身是血。","d":{"伤势":65,"reveal":["万妖王"]}}},{"t":"请小草与你同行","need":{"魅力":30},"chance":0.5,"win":{"text":"小草犹豫半天，从树根里钻了出来，跳上你的肩头。老树没有发作，只是所有眼睛都看着你离开。","d":{"精神":6,"气运":6,"悟性":4,"item":"仙灵草（有灵）","reveal":["万妖王"],"trait":{"仁":1}}},"lose":{"text":"小草摇了摇头缩回根缝。树根把你轻轻推出林子，像在赶一只苍蝇。","d":{"伤势":10,"reveal":["万妖王"]}}},{"t":"转身离开","win":{"text":"你后退着离开，枝条慢慢垂下，那些眼睛一只接一只闭上。","d":{}}}]},{"id":"t_s2_xiongjun","name":"暗金爪痕","tier":"绝","place":"星斗大森林·中圈北麓","yearMin":2640,"yearMax":2657,"canon":null,"owner":"熊君（二三部十大凶兽第六）","rumor":"猎魂队在星斗北麓发现一排爪痕，石壁被划开半尺深，切口边缘的空气至今还在扭曲，像被撕开的布。","memory":"二三部中，熊君是暗金恐爪熊，身负比蒙血脉，利爪能撕裂空间，曾抓伤帝天，后被帝天教训。","text":"爪痕一路延伸到山坳里。坳中卧着一头暗金色的巨熊，像一座小山，正把一头万年魂兽的骨头嚼得咯吱作响，四周的树全被拦腰削断，切口平滑得像镜面。它抬起头，琥珀色的眼睛里没有好奇，只有被打扰的不耐烦。\n它慢慢站起身，一只前爪随意地往空中一划，你面前一丈处的空间就裂开了一道黑缝，又缓缓合拢。","choices":[{"t":"拔出武魂迎战","hint":"四十多万年的凶兽","need":{"战力":1100},"chance":0.18,"win":{"text":"你在空间裂缝之间辗转腾挪，硬是撑了一百招。巨熊停下来，咧嘴像在笑，丢下一截断掉的暗金爪尖便走了。","d":{"等级":4,"体魄":10,"reveal":["熊君"],"bone":{"slot":"右臂","name":"暗金恐爪臂骨","desc":"熊君的断爪化入臂骨，挥击时可在近身处撕开细小空间裂缝。","attrs":{"体魄":8}}}},"lose":{"text":"第三招你就没躲开，一爪落下，连同你身后的山石一起被撕成两半。","d":{"death":"与熊君硬拼，被撕裂空间的熊爪斩断","reveal":["熊君"]}}},{"t":"献上带来的烈酒与蜂蜜","need":{"金魂币":300},"chance":0.6,"win":{"text":"巨熊嗅了嗅，一口吞下整坛蜂蜜，打着饱嗝趴回去。它用爪背把一块金色的石头拨到你脚边，是它磨爪用的星金矿。","d":{"金魂币":1500,"体魄":4,"气运":3,"reveal":["熊君"]}},"lose":{"text":"它嫌不够，一巴掌拍翻了你，又把剩下的酒全喝了。你断了两根肋骨。","d":{"伤势":40,"金魂币":-100,"reveal":["熊君"]}}},{"t":"转身离开","win":{"text":"你慢慢退出山坳，巨熊早已低头继续啃骨头，懒得看你一眼。","d":{}}}]},{"id":"t_s2_chiwang","name":"赤焰巡界","tier":"珍","place":"星斗大森林·核心圈外缘","yearMin":2636,"yearMax":2657,"canon":null,"owner":"赤王（二部中帝天的部下）","rumor":"核心圈边上常有三道赤红火光同时亮起，像三盏灯笼。见过的人说，那是一条狗，三个头，比城门还高。","memory":"二部中，赤王是三头赤魔獒，身怀部分真龙血脉，受帝天差遣做护卫，修为约三十一万年。","text":"你刚越过一条溪，三团火光就从三个方向同时亮起。三颗獒首从林间探出，赤红鬃毛像在燃烧，每颗头上的眼睛都盯着你不同的部位：左边看你的手，右边看你的脚，中间那双直勾勾盯着你的眼睛。脚下的落叶被热浪烤得卷了边。中间那颗头开口，声音像闷雷：\n「再往里，是兽神的地方。人类，你是走错了，还是不想活了？」","choices":[{"t":"请它指点一招","need":{"战力":800},"chance":0.45,"win":{"text":"赤王三首同时喷出火焰，你在火海里硬撑了一炷香。它收了火，评价一句「骨头还行」，又叫来一头族中老獒，让你亲手猎下它的魂环。","d":{"等级":3,"体魄":8,"reveal":["赤王"],"ring":{"beast":"赤魔獒（赤王族裔）","years":50000,"kind":"攻","skill":"三首赤炎","desc":"赤王指给你一头老獒，三道火焰同时喷吐"}}},"lose":{"text":"三首火焰比你想的烫十倍，你被烧得皮开肉绽，滚进溪水里才保住一条命。","d":{"伤势":50,"reveal":["赤王"]}}},{"t":"老实说是走错了","win":{"text":"赤王打量你半天，左边那颗头打了个哈欠。它用鼻子把你拱回外圈，还顺手吓跑了附近埋伏你的一群魂兽。","d":{"气运":3,"伤势":-10,"reveal":["赤王"]}}},{"t":"转身离开","win":{"text":"你没等它说完就退回溪对岸，三团火光在林间久久未灭，像三只眼睛一直目送你离开。","d":{}}}]},{"id":"t_s2_biji","name":"翡翠天鹅之羽","tier":"绝","place":"星斗大森林·碧水泽","yearMin":2640,"yearMax":2657,"canon":null,"owner":"碧姬（二三部中的森林守护者）","rumor":"受了重伤闯进星斗深处的魂师里，有人奇迹般活着出来，说迷糊中看见一只翠绿天鹅从头顶飞过，醒来伤就好了一半。","memory":"二三部中，碧姬是翡翠天鹅族长，最强治愈系魂兽，主张人类与魂兽和解，常被传为帝天所爱。","text":"泽水碧得发亮，水面上停着一只翠绿的天鹅，羽毛每一根都像打磨过的翡翠。你还没开口，它已经化成一个穿碧裙的女子，赤足踩在水面上，轻声叹气：\n「又是一个带着一身伤来的孩子。人类和魂兽，非要这样杀来杀去吗？」\n她看着你，眼神温柔得近乎悲伤。泽边伏着几只受伤的幼兽，正被淡淡的碧光包裹着，伤口一点点愈合。","choices":[{"t":"请她治伤","win":{"text":"她抬手洒下一片碧光，你身上所有旧伤新伤都在愈合，连幼年落下的暗疾也一并消散。","d":{"伤势":-100,"体魄":6,"气运":3,"reveal":["碧姬"],"trait":{"仁":1}}}},{"t":"向她讨一根翡翠翎羽","hint":"她看重的是心性","need":{"魅力":40},"chance":0.5,"win":{"text":"碧姬想了想，从翅下拔下一根翎羽放进你掌心：「拿着它，下次别再杀那么多。」翎羽化入你的肋骨，生机绵绵不绝。","d":{"reveal":["碧姬"],"bone":{"slot":"躯干","name":"翡翠天鹅翎骨","desc":"碧姬所赠，伤势会缓缓自愈，治疗类魂技效果翻倍。","attrs":{"体魄":6,"魅力":6}},"bonds":{"碧姬":15}}},"lose":{"text":"碧姬摇头：「你身上杀气太重。」她治好了你的伤，却不肯多给什么。","d":{"伤势":-50,"reveal":["碧姬"]}}},{"t":"承诺此后不猎幼兽","win":{"text":"碧姬笑了，在你眉心点了一下。那之后你走在林子里，魂兽对你的敌意都淡了许多。","d":{"气运":6,"名望":2,"reveal":["碧姬"],"trait":{"仁":2},"flags":["s_biji_oath"],"bonds":{"碧姬":10}}}}]},{"id":"t_s3_ziji","name":"紫雾龙影","tier":"绝","place":"星斗大森林·核心圈东谷","yearMin":2645,"yearMax":2657,"canon":null,"owner":"紫姬（三部十大凶兽之一）","rumor":"核心圈东侧的山谷常年笼着紫雾，雾里有龙吟。闯进去的魂师说，雾中站着一个紫衣女人，美得让人忘了跑。","memory":"三部中，紫姬是地狱魔龙王，龙族，居星斗核心圈，修为约三十万年，曾引唐舞麟与古月娜去见帝天。","text":"紫雾浓得化不开，脚下的草都是暗紫色。雾中有个紫衣女子倚着一棵枯树，指尖缠着一缕黑紫色的火焰，像在把玩一条小蛇。她抬眼看你，瞳孔是竖着的。\n「小家伙，能走到这里，有点本事。」她笑意盈盈，「我这几天正闷，陪我打一场，赢了有赏；输了嘛……就留下来当我的花肥。」","choices":[{"t":"应战","need":{"战力":1000},"chance":0.2,"win":{"text":"你被魔龙之炎烧得半身焦黑，却一步没退。紫姬收了手，眼里多了几分欣赏，把一缕地狱魔龙之炎封进你的掌心。","d":{"等级":5,"体魄":6,"精神":6,"reveal":["紫姬"],"ring":{"beast":"地狱魔龙之炎（紫姬所赐）","years":120000,"kind":"攻","skill":"魔龙紫炎","desc":"紫姬封入的一缕龙炎，焚烧一切生机"},"flags":["overlimit"]}},"lose":{"text":"紫色火焰沾身即燃，你在雾中烧成一捧灰，只剩她一声意兴阑珊的叹息。","d":{"death":"与紫姬对战，被地狱魔龙之炎焚尽","reveal":["紫姬"]}}},{"t":"说个笑话逗她开心","need":{"魅力":35},"chance":0.5,"win":{"text":"紫姬先是一愣，然后笑得花枝乱颤。她随手丢给你一片紫色龙鳞当赏钱，说这玩意在人类那边能换不少金魂币，然后挥手让你走。","d":{"气运":5,"魅力":4,"金魂币":800,"reveal":["紫姬"]}},"lose":{"text":"她一点也没笑，只是伸出一根手指把你弹出了紫雾，你在山坡上滚了很久，骨头都散了架。","d":{"伤势":25,"reveal":["紫姬"]}}},{"t":"转身离开","win":{"text":"你连连告罪退出雾外，身后传来一声意味不明的轻笑：「胆小鬼，下回再来呀。」","d":{}}}]},{"id":"t_s2_xuedi","name":"冰极雪域","tier":"神","place":"极北之地·核心冰原","yearMin":2642,"yearMax":2657,"canon":null,"owner":"雪帝（二部中霍雨浩最强魂灵）","rumor":"极北深处有一片地方，雪是往天上飘的。去过的人只回来一个，他说那里住着一个比冰还白的女人，看人一眼人就冻成了雕像。","memory":"二部中，雪帝是冰天雪女，极北三大天王之首，冰属性最强魂兽，约七十万年；天劫难渡，最终成为霍雨浩的魂灵。","text":"风停了，雪花从地面缓缓升起，飘向灰白的天空。冰原尽头站着一个白衣女子，长发、睫毛、指尖都是冰晶。她身边卧着一头巨大的白熊，正懒洋洋地看着你。\n女子没回头：「七十年来第一个活着走到这里的人类。」她终于转过脸，眼中是千年不化的冷，「你想要什么？冰的力量，还是活着离开？」","choices":[{"t":"请她赐一缕极致之冰","need":{"精神":45},"chance":0.4,"win":{"text":"雪帝凝视你良久，伸指在你眉心一点。一缕纯粹到发蓝的寒意沉入你的骨髓，你从此对冰有了近乎本能的掌控。","d":{"等级":6,"精神":10,"体魄":6,"reveal":["雪帝","冰熊王"],"flags":["s_jizhi_bing","overlimit"]}},"lose":{"text":"寒意太过纯粹，你的血液在一瞬间凝住。冰熊把你叼出冰原，你在床上躺了三个月。","d":{"伤势":70,"体魄":-4,"reveal":["雪帝","冰熊王"]}}},{"t":"挑战冰原之主","hint":"七十万年的冰天雪女","need":{"战力":1200},"chance":0.1,"win":{"text":"你的魂技在她身前一尺就冻成了冰雕，她却没有杀你。「勇气可嘉。」她留给你一块永不融化的雪帝冰晶。","d":{"等级":3,"体魄":8,"item":"雪帝冰晶","reveal":["雪帝","冰熊王"]}},"lose":{"text":"她甚至没有动。冰原上多了一座人形冰雕，表情还停在出手的那一刻。","d":{"death":"挑战雪帝，被冻成冰雕","reveal":["雪帝","冰熊王"]}}},{"t":"问她可曾想过化而为人","need":{"悟性":35},"win":{"text":"雪帝怔了一下，第一次露出近乎笑的表情。「你这人类，倒是有趣。」她让冰熊把你送出了冰原，还附赠一路风雪不侵。","d":{"气运":6,"魅力":4,"精神":4,"reveal":["雪帝","冰熊王"],"bonds":{"雪帝":15}}}},{"t":"转身离开","win":{"text":"你躬身行礼，转身走回风雪里。身后的雪又开始往天上飘。","d":{}}}]},{"id":"t_s2_bingdi","name":"冰碧帝皇蝎巢","tier":"绝","place":"极北之地·碧冰谷","yearMin":2640,"yearMax":2657,"canon":null,"owner":"冰帝（二部中化为霍雨浩的第二武魂）","rumor":"极北有一道冰谷，冰是碧绿色的。猎人说里面有只蝎子，尾巴一甩能把一座冰山劈成两半，脾气还特别坏。","memory":"二部中，冰帝是冰碧帝皇蝎，极北三大天王之一，约三十九万九千年，卡在四十万年大劫前，暗恋雪帝。","text":"冰谷里的冰是碧绿的，透着幽光。一只翡翠色的巨蝎盘踞在谷底，尾钩高高翘起，每一节甲壳都像打磨过的碧玉。它用螯钳指着你，声音却是个脆生生的少女嗓：\n「哪来的人类？本帝心情不好，你最好有个好理由，不然就留在这儿当冰雕吧！」\n谷壁上果然立着好几座人形冰雕，姿势千奇百怪，有的还保持着逃跑的样子。","choices":[{"t":"与她过招切磋","need":{"战力":950},"chance":0.25,"win":{"text":"碧绿冰晶铺天盖地，你硬是在冰暴中站住了。冰帝哼了一声，甩给你一截脱下的蝎甲，碧光在你脊背间流转。","d":{"等级":4,"reveal":["冰帝"],"bone":{"slot":"躯干","name":"冰碧帝皇蝎甲骨","desc":"冰帝蜕下的甲壳化为躯干骨，周身自带碧冰护甲，冰属性魂技威力大增。","attrs":{"体魄":8,"精神":4}}}},"lose":{"text":"一记冰碧蝎尾正中胸口，你被钉在冰壁上，碧冰顺着伤口爬满全身。","d":{"death":"冰帝蝎尾贯胸，冻毙于碧冰谷","reveal":["冰帝"]}}},{"t":"说起冰原深处的白衣女子","hint":"她有个心事","need":{"魅力":30},"chance":0.55,"win":{"text":"冰帝立刻不凶了，扭扭捏捏打听雪帝的事。你说了半天，她一高兴，送了你一块碧冰灵晶。","d":{"精神":6,"气运":4,"item":"碧冰灵晶","reveal":["冰帝"],"bonds":{"冰帝":15}}},"lose":{"text":"她听到一半忽然恼羞成怒，尖叫着说本帝才没有，一尾巴把你扫出了冰谷，你摔得眼冒金星。","d":{"伤势":35,"reveal":["冰帝"]}}},{"t":"转身离开","win":{"text":"你拱手告罪，倒退着走出冰谷。身后传来一声不满的哼，一块碧冰砸在你脚边，算是送客。","d":{}}}]},{"id":"t_s2_taitan","name":"百丈雪魔","tier":"绝","place":"极北之地·外围冰原","yearMin":2638,"yearMax":2657,"canon":null,"owner":"泰坦雪魔王（二部中极北三大天王之一）","rumor":"极北外围的冰原上有座会走路的雪山，所过之处冰层齐齐裂开。有人说它是在找什么，又有人说它是在发脾气。","memory":"二部中，泰坦雪魔王身负冰神血脉，身高逾百米，力大无穷，至少二十万年；曾追求雪帝被打成重伤，养了近千年。","text":"地面每隔几息就震一下。你爬上冰丘，看见一个白毛巨人正一步一个深坑地走过冰原，身高超过百米，肩上落满积雪。它停下来，低头看向你，鼻孔喷出的白气把冰丘吹平了一半。\n「人类……」它的声音像雪崩，「你，身上，有她的味道吗？」\n它巨大的鼻子凑近，一下一下地嗅，眼神竟有几分可怜。","choices":[{"t":"与它比拼蛮力","need":{"体魄":45},"chance":0.35,"win":{"text":"你和巨人掌对掌僵持了整整一刻，它咧嘴大笑，一拳砸开冰层，把底下的一块冰神血晶丢给你。","d":{"等级":3,"体魄":12,"reveal":["泰坦雪魔王"],"item":"冰神血晶"}},"lose":{"text":"巨人只是轻轻一按，你连人带冰丘一起陷进了冰层，挣扎了一整夜才爬出来。","d":{"伤势":60,"reveal":["泰坦雪魔王"]}}},{"t":"说你没见过她","win":{"text":"巨人失望地叹了一口气，吹得你倒退十丈。它转身离开，脚印里却留下几株被踩出来的冰魄草。","d":{"精神":4,"气运":3,"reveal":["泰坦雪魔王"]}}},{"t":"转身离开","win":{"text":"你趴在冰丘后一动不动，屏息等那座会走路的雪山远去，直到地面不再震动才敢抬头。","d":{}}}]},{"id":"t_s2_bingxiong","name":"冰熊王的猎场","tier":"珍","place":"极北之地·冰海岸","yearMin":2636,"yearMax":2657,"canon":null,"owner":"冰熊王（二部中由雪帝照看长大）","rumor":"极北冰海岸边，有头白熊专爱偷渔民的鱼，一掌拍下去冰面裂开半里。奇怪的是它从不伤人，抢完就跑。","memory":"二部中，冰熊王由雪帝照料长大，约二十万年，近战可与泰坦雪魔王一较高下，后成为霍雨浩的魂灵。","text":"你在海岸边烤着刚钓上的鱼，冰面忽然隆起，一头比房子还大的白熊探出脑袋，鼻子一抽一抽地嗅着烤鱼的香味。它看看鱼，又看看你，眼神里没有杀意，只有赤裸裸的馋。\n然后它咧开大嘴，把爪子搭在了你的烤架上。爪子落下的地方，冰面无声地裂开一圈细纹。你忽然意识到，这头熊身上的寒气，比你见过的任何魂兽都要深厚，深厚得不像是这片海岸该有的东西。","choices":[{"t":"把鱼让给它","win":{"text":"白熊吃得心满意足，临走拍了拍你的头，一股寒气灌进体内，你的骨头硬了一截。之后几年，它常常来蹭你的烤鱼。","d":{"体魄":6,"气运":4,"reveal":["冰熊王"],"bonds":{"冰熊王":20},"trait":{"仁":1}}}},{"t":"护住烤鱼，跟它过两招","need":{"战力":650},"chance":0.4,"win":{"text":"白熊乐了，跟你在冰面上扭打成一团。打完它心满意足地吃了鱼，还把一枚掉落的冰熊爪骨留给了你。","d":{"等级":2,"体魄":6,"reveal":["冰熊王"],"bone":{"slot":"左臂","name":"冰熊王掌骨","desc":"冰熊王打闹时掉下的旧爪，挥掌带起极寒冰浪。","attrs":{"体魄":6}}}},"lose":{"text":"它只是轻轻拍了你一下，你就飞出去三十丈，鱼也没了。","d":{"伤势":45,"reveal":["冰熊王"]}}},{"t":"转身离开","win":{"text":"你扔下烤架就跑，跑出老远回头一看，白熊正抱着烤鱼吃得欢，连铁签都一起嚼了。","d":{}}}]},{"id":"t_s3_mohuang","name":"深渊里的鲸歌","tier":"神","place":"深海·魔鲸海沟","yearMin":2640,"yearMax":2651,"canon":null,"owner":"魔皇（三部中圣灵教之主，深海魔鲸王之妻）","rumor":"远海的渔民说，有些夜里海底会传来两头巨鲸的歌声，一高一低，此起彼伏。听过的船后来都改道绕开了那片海。","memory":"三部揭示：魔皇是深海魔鲸王之妻，丈夫为唐三所杀后，她谋划两万余年欲毁灭人类，最终成为圣灵教魔皇。","text":"你借着避水宝物沉入海沟，幽暗里浮着巨大的影子。一头比岛还长的魔鲸游过你头顶，另一个身影跟在它身边，比它小些，鳞光幽蓝，绕着它缓缓打转，像在撒娇。\n那个较小的身影发现了你。它停住，海水在一瞬间变得冰冷粘稠。一个女声从四面八方压过来：「人类？离我的丈夫远一点。」","choices":[{"t":"向她示警，劝夫妇远离唐门之人","hint":"这会改变一些事","need":{"精神":45},"chance":0.3,"win":{"text":"她沉默很久，冷冷说了句「我记住你了」。海沟深处飘出一枚鲸胶，裹着深海的力量。你隐约感到，世界线被你拨动了一下。","d":{"等级":4,"体魄":8,"item":"深海鲸胶","reveal":["魔皇"],"shift":3,"flags":["s_mohuang_warned"]}},"lose":{"text":"她只当你是在挑衅丈夫，海水骤然凝固，一道漆黑的声波穿透你的胸膛，你沉向海沟最深处。","d":{"death":"惊扰魔皇，被深海声波震碎心脉","reveal":["魔皇"]}}},{"t":"献上陆地的珍宝，求一缕海之精华","need":{"金魂币":600},"chance":0.55,"win":{"text":"她对陆地的东西很好奇，挑走了你最贵的那件。作为交换，一缕海渊精华钻进你的经脉，你在水下如履平地。","d":{"等级":3,"体魄":6,"精神":4,"金魂币":-500,"reveal":["魔皇"]}},"lose":{"text":"她收下宝物，却没有给任何东西，只是一尾把你拍出了海沟。","d":{"金魂币":-500,"伤势":40,"reveal":["魔皇"]}}},{"t":"转身离开","win":{"text":"你屏住呼吸往上浮，再也不敢回头。身后的鲸歌重新响起，一高一低，渐渐被海水吞没。","d":{}}}]},{"id":"t_s2_renyu","name":"冰海人鱼族","tier":"珍","place":"极北冰海","yearMin":2638,"yearMax":2657,"canon":null,"owner":"人鱼族（二部中冰海的顶级势力）","rumor":"极北冰海上，月圆之夜有歌声从冰层下传来，美得让人想跳下去。老渔民会把耳朵塞住，说那是人鱼在唱歌。","memory":"二部中，冰海由人鱼族统治，族长率海魂兽守卫领地，极度敌视人类；人鱼一族擅长精神类能力。","text":"冰层下的歌声越来越近。一块浮冰翻过来，露出一张苍白美丽的脸，鱼尾泛着银蓝的光。四周冰缝里，一双双眼睛同时亮起，有人鱼，也有獠牙森森的海魂兽。\n为首的人鱼冷冷道：「人类都没有好东西。说出你的来意，然后滚出冰海。」\n她身后的海魂兽低声咆哮，冰面下黑影翻涌，至少有上百只。","choices":[{"t":"讨教精神之道","need":{"精神":35},"chance":0.5,"win":{"text":"你耐着性子与她们对歌三夜，人鱼族长终于松口，教了你一段凝神的古调。精神之海从此平静如镜。","d":{"精神":10,"悟性":4,"魅力":3}},"lose":{"text":"人鱼的歌声化成精神冲击，你被唱得神魂颠倒，醒来已漂在岸边。","d":{"精神":-4,"伤势":30}}},{"t":"杀出一条路，夺走冰海珍珠","need":{"战力":700},"chance":0.35,"win":{"text":"你冲破海魂兽的围堵，抢下一颗精神珍珠逃上冰面。人鱼族的怒歌在身后响了很久。","d":{"精神":8,"等级":2,"item":"冰海精神珍珠","trait":{"逆":1}}},"lose":{"text":"海魂兽从四面八方涌来，你被拖进冰下，好不容易才挣脱上岸。","d":{"伤势":70}}},{"t":"转身离开","win":{"text":"你举起双手一步步退回岸边，那些眼睛一直盯着你，歌声渐渐沉入冰层之下。","d":{}}}]},{"id":"t_s3_longgu","name":"龙谷","tier":"神","place":"大陆北境·无名裂谷（入口位置推算）","yearMin":2646,"yearMax":2657,"canon":null,"owner":"龙神遗留的小世界（三四部中的历练地）","rumor":"北境有座裂谷，雨天会传出龙吟。进去的人出来后都说里面另有天地，可谁也说不清自己在里面待了多久。","memory":"续作提到，龙谷是龙神神魂开辟的小世界，原在斗罗大陆，龙气浓郁，孕育过山龙王躯干骨等魂骨，龙神残魂坐镇中央。","text":"穿过裂谷尽头的雾墙，眼前是另一片天地。天空泛着金色，远处山脉的轮廓像一条条卧着的巨龙，空气里的龙气浓得能拧出水来。脚下的白骨堆成小山，每一根都比你的腰还粗。\n山谷正中隐约有一道庞大的意志在沉睡。一个苍老的声音在风里回荡：「龙之血脉……还是外来的小虫子？」","choices":[{"t":"在龙骨间搜寻魂骨","need":{"战力":900},"chance":0.35,"win":{"text":"你在一具山岳般的龙骸里找到一块仍在搏动的躯干骨，土黄色龙纹流转，厚重得像一座山，融入身体时大地都在共鸣。","d":{"等级":3,"bone":{"slot":"躯干","name":"山龙王躯干骨","desc":"龙谷所出，大地之力源源不绝，防御与力量皆至巅峰。","attrs":{"体魄":12,"精神":4}}}},"lose":{"text":"龙骸里残存的龙威忽然苏醒，一声无形的咆哮震得你五脏移位，你爬着逃出了骨山。","d":{"伤势":70}}},{"t":"向沉睡的意志行礼求教","need":{"悟性":40},"chance":0.45,"win":{"text":"那意志打量你很久，送你一段龙吟。你在谷中闭关，出来时外面只过了一个月，你却觉得像过了十年。","d":{"等级":6,"悟性":8,"精神":6,"flags":["s_longgu_blessed"]}},"lose":{"text":"意志不屑一顾，龙气骤然暴涨，你被挤出了小世界，摔在裂谷外昏迷不醒。","d":{"伤势":45}}},{"t":"强闯谷心，夺取龙神残魂","hint":"神之残魂","need":{"战力":1250},"chance":0.08,"win":{"text":"龙威山崩般压下，你咬碎牙关硬扛到底。残魂竟发出一声赞许的低吟，分出一缕龙神之力烙进你的血脉。","d":{"等级":10,"体魄":10,"精神":10,"flags":["overlimit","s_longshen_canhun"],"shift":5}},"lose":{"text":"龙神残魂只是睁了睁眼，你连同这段妄念一起，化作谷中又一副白骨。","d":{"death":"强夺龙神残魂，被龙威碾碎"}}},{"t":"转身离开","win":{"text":"你在谷口站了很久，听着谷中的龙吟，最终没有走进去。雾墙在身后缓缓合拢。","d":{}}}]}]}</script>

function startTurn(){
  const r=R(),p=P(); r.ap=3; r.actLog=[]; r.queue=[]; r.turns++;
  const y=year();
  // key nodes due
  for(const n of p.nodes){ if(r.nodesDone.includes(n.id)) continue; if(n.year>y) continue;
    if(condOK(n.cond)) r.queue.push({k:"node",id:n.id}); r.nodesDone.push(n.id) }
  // random events
  const pool=p.events.map(e=>({e,src:"p"})).concat(COMMON.map(e=>({e,src:"c"}))).concat(fortunes().map(e=>({e,src:"f"}))).filter(({e})=>evOK(e,y));
  const nEv = r.queue.length? (rnd()<.6?1:0) : 1+(rnd()<.55?1:0)+(rnd()<.2?1:0);
  r.rumors=[];
  for(const t of TREAS){ if(r.treasDone.includes(t.id)||r.missed.includes(t.id)) continue;
    if(t.yearMax<y){ r.missed.push(t.id); if(known(t)) r.rumors.push({k:"miss",id:t.id}); continue }
    if(t.yearMin<=y&&!known(t)&&rnd()<.18+r.a.气运/250+r.fame/300){ r.heard.push(t.id); r.rumors.push({k:"heard",id:t.id}) } }
  for(let i=0;i<nEv&&pool.length;i++){ const tot=pool.reduce((a,x)=>a+(x.e.w||2),0); let q=rnd()*tot, pick=0; for(let j=0;j<pool.length;j++){q-=pool[j].e.w||2; if(q<=0){pick=j;break}} const {e,src}=pool.splice(pick,1)[0]; r.queue.push({k:"ev",id:e.id,src}); r.evSeen.push(e.id) }
  r.phase="turn";
}
function fortunes(){return (FORT.common||[]).concat((FORT.byId&&FORT.byId[S.run.id])||[])}

function evOK(e,y){const r=R(),w=e.when||{}; if(e.once!==false&&r.evSeen.includes(e.id)) return false; if(w.yearMin&&y<w.yearMin) return false; if(w.yearMax&&y>w.yearMax) return false; if(w.levelMin&&r.lv<w.levelMin) return false; if(w.levelMax&&r.lv>w.levelMax) return false; if(w.flag&&!r.flags.includes(w.flag)) return false; if(w.notFlag&&r.flags.includes(w.notFlag)) return false; if(w.ageMin&&age()<w.ageMin) return false; if(w.ageMax&&age()>w.ageMax) return false; return true}
function condOK(c){const r=R(); if(!c) return true; if(c.flag&&!r.flags.includes(c.flag)) return false; if(c.notFlag&&r.flags.includes(c.notFlag)) return false; if(c.levelMin&&r.lv<c.levelMin) return false; if(c.flags&&!c.flags.every(f=>r.flags.includes(f))) return false; if(c.anyFlag&&!c.anyFlag.some(f=>r.flags.includes(f))) return false; return true}

/* apply delta, return list of display deltas */
function apply(d){
  const r=R(),out=[]; if(!d) return out;
  const add=(lab,v,unit)=>{ if(!v) return; out.push({t:`${lab} ${v>0?"+":""}${Math.round(v*10)/10}${unit||""}`,up:v>0}) };
  if(d.ring) for(const x of [].concat(d.ring)) gainRing(x,out);
  if(d.bone) for(const b of [].concat(d.bone)){ r.bones.push(b); out.push({t:`魂骨·${b.slot}·${b.name}`,up:true}); if(b.attrs) for(const[k,v] of Object.entries(b.attrs)) if(ATTRS.includes(k)) r.a[k]=clamp(r.a[k]+v,0,100) }
  if(d.等级) { const before=r.lv; addLevel(d.等级); add("等级",Math.round((r.lv-before)*10)/10) }
  for(const k of ATTRS) if(d[k]){ r.a[k]=clamp(r.a[k]+d[k],0,100); add(k,d[k]) }
  if(d.金魂币){ r.coins=Math.max(0,r.coins+d.金魂币); add("金魂币",d.金魂币) }
  if(d.名望){ r.fame=clamp(r.fame+d.名望,0,100); add("名望",d.名望) }
  if(d.伤势){ r.hurt=clamp(r.hurt+d.伤势,0,100); out.push({t:`伤势 ${d.伤势>0?"+":""}${d.伤势}`,up:d.伤势<0}) }
  if(d.rep) for(const[k,v] of Object.entries(d.rep)){ r.rep[k]=clamp((r.rep[k]||0)+v,-100,100); add(k,v) }
  if(d.bonds) for(const[k,v] of Object.entries(d.bonds)){ r.bonds[k]=clamp((r.bonds[k]||0)+v,-100,100); add(k+"·人情",v) }
  if(d.flags) for(const f of d.flags) if(!r.flags.includes(f)) r.flags.push(f);
  if(d.trait) for(const[k,v] of Object.entries(d.trait)) if(k in r.trait) r.trait[k]+=v;
  if(d.item) for(const it of [].concat(d.item)){ r.items.push(it); out.push({t:`获得 ${it}`,up:true}) }
  if(d.shift){ r.shift+=d.shift; out.push({t:`世界线偏移 +${d.shift}%`,up:false}) }
  if(d.reveal) for(const x of d.reveal) if(!r.reveal.includes(x)){ r.reveal.push(x); out.push({t:`榜单揭晓：${x}`,up:true}) }
  if(d.met) for(const x of d.met) if(!r.met.includes(x)) r.met.push(x);
  if(d.death){ r.pendingEnd={k:"death",cause:d.death} }
  if(d.ending){ r.pendingEnd={k:"end",id:d.ending} }
  if(d.world){ const w=d.world; for(const[k,v] of Object.entries(w.offset||{})) if(v){ r.world.offset.push({n:k,v,y:year()}); out.push({t:`${k} 原著等级 ${v>0?"+":""}${v}`,up:false}) } Object.assign(r.world.news,w.news||{}); if(w.note){ r.world.notes.push({y:year(),t:w.note}); out.push({t:"原著改变："+w.note,up:false}) } }
  return out;
}
function addLevel(x){const r=R(); const c=cap(r); let want=r.lv+x; if(want>c){ r.bank+=want-c; want=c } r.lv=Math.max(0,Math.round(want*100)/100)}
function gainRing(x,out){const r=R(); if(r.rings.length>=9){ const lo=r.rings.reduce((a,y,i)=>y.years<r.rings[a].years?i:a,0); if(x.years>r.rings[lo].years){ r.rings[lo]=x; out&&out.push({t:`魂环替换：${yLabel(x.years)}「${x.skill}」`,up:true}) } addLevel(1); return }

function resolveChoice(c){
  const r=R(); const cost=c.cost&&c.cost.fate||0;
  if(cost){ let b=r.bonusFate; const u=Math.min(b,cost); r.bonusFate-=u; S.meta.fate-=cost-u }
  let ok=true; if(c.chance!=null){ let ch=c.chance; ok=rnd()<clamp(ch,.05,.95) }
  const o=ok?c.win:(c.lose||c.win); const ds=apply(o&&o.d);
  if(c.canonChange){ r.altered.push(c.canonChange.node); ds.push({t:`改写原著：${c.canonChange.desc||c.canonChange.node}`,up:false}) }
  return {ok,text:o&&o.text,ds,note:c.note||(o&&o.note),chance:c.chance!=null};
}

/* ============ rankings ============ */
function lvAt(e,y){let v=null; for(const[yy,l] of e.lv) if(yy<=y) v=l; return v}
function ageAt(e,y){let v=null; for(const[yy,l] of e.age) if(yy<=y) v=l; return v}
function revealed(name,ry){const r=R(); const y=year()+(r&&r.perk==="memory"?1:0); return ry<=y||(r&&r.reveal.includes(name))}
function rankPower(){
  const r=R(),y=year(); let rows=WORLD.fenghao.map(e=>({n:e.n,h:e.h,w:e.w,lv:lvAt(e,y)==null?null:Math.min(100,lvAt(e,y)+offsetOf(e.n,y)),dead:e.dead&&e.dead<y,rv:revealed(e.n,e.reveal)||(e.mask&&revealed(e.mask,e.reveal)),ru:e.rumor&&e.rumor.y<=y?e.rumor:null})).filter(x=>x.lv!=null&&x.lv>=91);
  const hidden=rows.filter(x=>!x.rv&&!x.ru).length; rows=rows.filter(x=>x.rv||x.ru).map(x=>x.rv?x:Object.assign(x,{rumor:true,dead:false}));
  if(r.lv>=91) rows.push({n:r.name,h:fenghao(),w:P().wuhun.name,lv:Math.floor(r.lv),me:true});
  rows.sort((a,b)=>(!!a.rumor-!!b.rumor)||(a.dead-b.dead)||(b.lv-a.lv)); return {rows,hidden};
}
function rankBeast(){
  const r=R(),y=year(); let rows=WORLD.beasts.map(e=>({n:e.n,k:e.k,a:ageAt(e,y),dead:e.dead&&e.dead<y,rv:revealed(e.n,e.reveal),note:e.note,ru:e.rumor&&e.rumor.y<=y?e.rumor:null})).filter(x=>x.a!=null);
  const hidden=rows.filter(x=>!x.rv&&!x.ru).length; rows=rows.filter(x=>x.rv||x.ru).map(x=>x.rv?x:Object.assign(x,{rumor:true,dead:false}));
  if(P().id==="beast") rows.push({n:r.name,k:P().wuhun.name,a:100000+(year()-P().startYear)*600,me:true});
  rows.sort((a,b)=>(!!a.rumor-!!b.rumor)||(a.dead-b.dead)||(b.a-a.a)); return {rows,hidden};
}
const IDW={wuhun:"苏夜",landian:"玉衡",beast:"白霜",qiangu:"千古明",shalu:"墨刃",qibao:"林照",huangshi:"纪无声",xingluo:"戴澜",haishen:"凌汐",shenjiang:"欧冶青"};
function rankWuhun(){
  const r=R(); let rows=WORLD.wuhun.filter(e=>e.reveal<9000).map(e=>{const rv=revealed(e.n,e.reveal); return {n:rv?e.n:(e.mask||null),o:e.o,t:e.t,tier:rv?e.tier:(e.mask?"?":null),rv}}).filter(x=>x.n);
  const hidden=WORLD.wuhun.filter(e=>!revealed(e.n,e.reveal)&&!e.mask).length;
  for(const p of PACKS){ if(p.id===r.id) continue; if(r.met.includes(p.id)) rows.push({n:p.wuhun.name,o:p.defaultName,t:p.wuhun.type,tier:p.wuhun.tier,rv:true}) }
  rows.push({n:wname(),o:r.name,t:P().wuhun.type,tier:wtier(),me:true,rv:true});
  rows.sort((a,b)=>(TIER_RANK[b.tier]||0)-(TIER_RANK[a.tier]||0)); return {rows,hidden:hidden+PACKS.length-1-r.met.length};
}
function fenghao(){const w=P().wuhun.name; if(P().id==="qiangu") return "晨昏斗罗"; const s=w.split("·")[0]; return (s.length<=2?s:s[0]+s[s.length-1])+"斗罗"}

   <div class="bars">${ATTRS.map(k=>`<div class="bar"><span>${k}</span><span class="tr"><span class="fi" style="width:${p.attrs[k]}%"></span></span><span class="v">${p.attrs[k]}</span></div>`).join("")}</div></div>
   <label class="sec-t" for="nm" style="margin:0">你的名字</label><input id="nm" class="nm" maxlength="8" value="${esc(p.defaultName)}" autocomplete="off">
   <div class="sec-t" style="margin:0">金手指（三选一）</div><div class="perks">${PERKS.map(x=>`<button class="perk" data-p="${x.id}" aria-pressed="${x.id===perk}"><b>${x.n}</b><span>${x.d}</span></button>`).join("")}</div>
   <div><button class="btn pri" id="go">开始这一世</button></div></div>`;
  app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{perk=b.dataset.p;app.querySelectorAll("[data-p]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.p===perk))});
  document.getElementById("back").onclick=home;
  document.getElementById("go").onclick=()=>{newRun(p,document.getElementById("nm").value.trim()||p.defaultName,perk);TAB="season";render()};
  window.scrollTo(0,0);
}
window.__dl={S:()=>S,R,P,power,year,home,render};
if(S.run&&S.run.settled) S.run=null;
if(S.run&&!S.run.x) S.run.x={evo:0,sword:0,devour:0,gear:0};
if(S.run&&!S.run.world){ Object.assign(S.run,{world:{offset:[],news:{},notes:[]},treasDone:[],heard:[],missed:[],rumors:[]}) }
PACKS.length?home():(app.innerHTML="<p>没有身份包。</p>");
})();
</script>
