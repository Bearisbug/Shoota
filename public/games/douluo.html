<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: management-sim shell. Sticky top bar (date, KPIs, End Season). Left column = 魂师档案; right = tabbed workspace. Ring colours are the rarity palette. */
:root{
  --bg:#0f1219; --panel:#161b26; --panel-2:#1d2331; --line:#2a3245; --line-2:#364059;
  --fg:#e7e2d6; --dim:#a29e93; --faint:#6c6a68;
  --gold:#d8a744; --gold-bg:#d8a7441f; --red:#d0533f; --red-bg:#d0533f1c; --jade:#4fae86; --jade-bg:#4fae861c; --blue:#5b8fd6;
  --r-white:#e9e7e0; --r-yellow:#e3b33a; --r-purple:#9b6ad8; --r-black:#05060a; --r-red:#da3a2e; --r-gold:#f3d170;
  --t-fei:#7c7a76; --t-xia:#a6a39b; --t-zhong:#6fae8e; --t-shang:#5b8fd6; --t-ding:#a272de; --t-ji:#e08a3c; --t-shen:#e6c454;
  --f-disp:"Ma Shan Zheng","STKaiti","KaiTi",serif; --f-serif:"Noto Serif SC","Songti SC",serif; --f-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f1ece0;--panel:#faf6ec;--panel-2:#f2ecdd;--line:#ddd3bc;--line-2:#cbbfa3;--fg:#231f1a;--dim:#5f584d;--faint:#8e8576;--gold:#94640f;--gold-bg:#94640f17;--red:#a63a2a;--red-bg:#a63a2a14;--jade:#2a7a59;--jade-bg:#2a7a5914;--r-white:#fff;--r-black:#16171b;--t-xia:#8a8578;color-scheme:light}}
:root[data-theme="light"]{--bg:#f1ece0;--panel:#faf6ec;--panel-2:#f2ecdd;--line:#ddd3bc;--line-2:#cbbfa3;--fg:#231f1a;--dim:#5f584d;--faint:#8e8576;--gold:#94640f;--gold-bg:#94640f17;--red:#a63a2a;--red-bg:#a63a2a14;--jade:#2a7a59;--jade-bg:#2a7a5914;--r-white:#fff;--r-black:#16171b;--t-xia:#8a8578;color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--f-ui);font-size:14px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 14px}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1a1307;font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line-2);border-radius:999px;padding:1px 9px;white-space:nowrap}
.chip.gold{color:var(--gold);border-color:var(--gold)} .chip.red{color:var(--red);border-color:var(--red)} .chip.jade{color:var(--jade);border-color:var(--jade)}
.tier{font-weight:700} .tier-废{color:var(--t-fei)} .tier-下{color:var(--t-xia)} .tier-中{color:var(--t-zhong)} .tier-上{color:var(--t-shang)} .tier-顶{color:var(--t-ding)} .tier-极{color:var(--t-ji)} .tier-神{color:var(--t-shen)}
.ring{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid var(--r-white);flex:none}
.ring.empty{border:2px dashed var(--line-2)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;padding-block:9px}
.top .date{font-family:var(--f-serif);font-weight:900;font-size:16px}
.kpi{display:flex;flex-direction:column;line-height:1.15}
.kpi small{font-size:11px;color:var(--dim)}
.kpi b{font-family:var(--f-num);font-weight:600;font-size:15px}
.top .grow{flex:1}

/* shell */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;padding-block:16px 60px;align-items:start}
@media (max-width:960px){.shell{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.side{display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px)}
@media (max-width:960px){.side{position:static;order:2}.main{order:1}}
.dossier-h{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.dossier-h .nm{font-family:var(--f-serif);font-weight:900;font-size:19px}
.sec-t{font-size:11.5px;letter-spacing:.14em;color:var(--dim);margin:2px 0 8px}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:3.2em 1fr 2.6em;gap:8px;align-items:center;font-size:12.5px}
.bar .tr{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;position:relative}
.bar .fi{position:absolute;inset:0 auto 0 0;background:var(--gold);border-radius:3px}
.bar .fi.red{background:var(--red)} .bar .fi.jade{background:var(--jade)}
.bar .v{text-align:right;font-family:var(--f-num)}
.bbar{display:grid;grid-template-columns:4.6em 1fr 2.6em;gap:8px;align-items:center;font-size:12.5px}
.bbar .tr{height:6px;background:var(--panel-2);border-radius:3px;position:relative}
.bbar .z{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--faint)}
.bbar .fi{position:absolute;top:0;bottom:0;background:var(--jade);border-radius:3px}
.bbar .fi.neg{background:var(--red)}
.ringstrip{display:flex;gap:5px;flex-wrap:wrap}
.ringstrip .ring{width:18px;height:18px;border-width:4px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--dim);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--gold)}
.tabs button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:5px;vertical-align:middle}
.main{min-width:0}

/* events & nodes */
.ev{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px;display:grid;gap:10px;margin-bottom:12px}
.ev.node{border-color:var(--gold);background:linear-gradient(var(--gold-bg),var(--gold-bg)),var(--panel)}
.ev .eh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ev .eh h3{font-family:var(--f-serif);font-weight:900;font-size:17px}
.ev .tx{font-family:var(--f-serif);font-size:15px;line-height:1.85;white-space:pre-line}
.ev.node .tx{font-size:15.5px}
.echo{font-size:12.5px;color:var(--gold);border-left:2px solid var(--gold);padding-left:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:grid;gap:4px}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt:disabled{opacity:.5}
.opt .t{font-weight:700}
.opt .m{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.opt.alter{border-color:color-mix(in srgb,var(--red) 55%,var(--line))}
.res{border-top:1px dashed var(--line-2);padding-top:9px;display:grid;gap:6px}
.res .rt{font-family:var(--f-serif);font-size:14.5px}
.res .note{font-size:12.5px;color:var(--dim)}
.deltas{display:flex;flex-wrap:wrap;gap:5px}
.delta{font-family:var(--f-num);font-size:12px;padding:1px 7px;border-radius:4px;background:var(--panel-2)}
.delta.up{color:var(--jade);background:var(--jade-bg)} .delta.dn{color:var(--red);background:var(--red-bg)}

/* actions */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.act{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:grid;gap:3px;align-content:start;min-height:76px}
.act:hover:not(:disabled){border-color:var(--gold)}
.act:disabled{opacity:.45}
.act b{font-size:14.5px}
.act span{font-size:12px;color:var(--dim)}
.act.hot{border-color:var(--red)}
.ap{display:flex;gap:5px;align-items:center}
.ap i{width:12px;height:12px;border-radius:50%;border:2px solid var(--gold);display:block}
.ap i.on{background:var(--gold)}
.endbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.alog{display:grid;gap:6px;margin-top:12px}
.alog div{font-size:13px;border-left:2px solid var(--line-2);padding-left:9px}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--dim);font-size:12px}
td.r,th.r{text-align:right}
tr.me td{background:var(--gold-bg)}
tr.dead td{color:var(--faint)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.subtabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px}
.subtabs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

/* modal */
.modal{position:fixed;inset:0;z-index:30;background:#000a;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:18px;display:grid;gap:12px}
.modal h3{font-family:var(--f-serif);font-weight:900;font-size:19px}
.rep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.rep-grid div{background:var(--panel-2);border-radius:8px;padding:8px 10px}
.rep-grid small{display:block;color:var(--dim);font-size:11.5px}
.rep-grid b{font-family:var(--f-num);font-size:17px}
.news{display:grid;gap:5px;font-size:13px}
.news div{display:grid;grid-template-columns:4.2em 1fr;gap:8px}

/* home */
.hero{padding-block:30px 20px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.hero h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(46px,9vw,80px);line-height:1}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin:0;color:var(--dim);max-width:40em}
.idgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.idc{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px;display:grid;gap:5px;min-width:0}
.idc:hover{border-color:var(--gold)}
.idc h3{font-family:var(--f-serif);font-weight:900;font-size:16px}
.idc .row{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}
.pips{display:flex;gap:3px} .pips i{width:8px;height:8px;border-radius:50%;border:1px solid var(--faint)} .pips i.on{background:var(--gold);border-color:var(--gold)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 0 12px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-serif);font-weight:900;font-size:19px}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.perk{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px;display:grid;gap:3px}
.perk[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-bg)}
.perk span{font-size:12.5px;color:var(--dim)}
input.nm{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font:inherit;color:var(--fg);width:min(260px,100%)}

/* portrait */
.port{max-width:880px;margin:0 auto;padding-block:24px 60px;display:grid;gap:16px}
.dossier{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:18px;overflow:hidden}
.stamp{position:absolute;right:18px;top:16px;border:3px solid var(--red);color:var(--red);font-family:var(--f-disp);font-size:30px;line-height:1;padding:8px 10px;border-radius:6px;transform:rotate(-8deg);opacity:.9}
.port-h{display:grid;gap:4px;padding-right:110px}
.port-h .fh{font-family:var(--f-disp);font-size:clamp(34px,7vw,52px);line-height:1.05;color:var(--gold)}
.port-h .nm{font-family:var(--f-serif);font-weight:900;font-size:22px}
.port-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:720px){.port-grid{grid-template-columns:minmax(0,1fr)}}
.radar{width:100%;max-width:320px;justify-self:center}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-family:var(--f-serif);font-weight:700;border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:2px 10px}
.grade{font-family:var(--f-disp);font-size:44px;line-height:1;color:var(--gold)}
.afterlife{display:grid;gap:6px;font-family:var(--f-serif);font-size:14.5px}
.afterlife div{border-left:2px solid var(--line-2);padding-left:10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:6px;z-index:60;font-size:13.5px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

发怒，只说：「放在我眼皮底下。」胡列娜第一次正眼看你。","d":{"精神":2,"shift":1,"bonds":{"比比东":3,"胡列娜":3},"flags":["pope_knows_you_saw"],"trait":{"逆":1,"险":1,"仁":1}}}},{"t":"吹熄灯火，伏地请罪","hint":"门口抱菊的男人对你起了兴趣","win":{"text":"额头贴着冰冷的石砖。月关轻笑一声：「懂事的小灯，归我带吧。」","d":{"体魄":1,"bonds":{"月关":6},"flags":["knelt"],"trait":{"险":-1,"忠":1}}}}]},{"id":"n02_final","title":"圆月与蓝银","year":2645,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M38","echo":{"flag":"saved_hulie","text":"前因 · 2637：猎魂森林里，你先把胡列娜拉出了藤网。"},"text":"精英大赛总决赛，武魂城的天是铅灰色的。教皇给你的命令只有一句：「名单上报第七席，不出手。」\n\n可开场锣一响，一切都乱了。邪月的圆月斩碎了唐三背后的八根蛛矛，妖魅的红雾漫过赛台，史莱克七怪被一个个逼到台边。然后那个蓝衣少年抬起眼，紫光从他瞳孔深处亮起，红雾像绸子一样被划开。\n\n最高的看台上，教皇站着，一动不动。你知道她在看谁：唐三，和他身后那个驼背的男人。\n\n你的灯在手里跳。它想往两处去：一处是唐三的影子，紫光正从那里往外溢；另一处是他身边的兔耳少女，她的影子里蹲着一只雪白的、比整座武魂城还古老的兔子。","choices":[{"t":"点亮冥月，锁住唐三的影子","hint":"关键战：在紫极魔瞳下撑过三息","need":{"战力":450},"chance":0.4,"win":{"text":"你在紫极魔瞳下撑了三息。武魂殿还是输了，那夜她在黑暗里只说了两个字：「三息。」","d":{"名望":8,"精神":3,"bonds":{"比比东":6},"rep":{"武魂殿":3},"flags":["three_breaths"],"trait":{"险":1}}},"lose":{"text":"紫光把冥月原样折回你的识海。你倒在最后，那之后教皇再没看你一眼。","d":{"伤势":30,"bonds":{"比比东":-3},"flags":["exiled"],"trait":{"险":1}}}},{"t":"把灯转向那只白兔的影子","hint":"你会比所有人早一步知道她是什么","win":{"text":"你看见十万年的月亮，和一个冲她伸出手的男孩。你垂下灯，什么也没说。","d":{"shift":1,"bonds":{"小舞":4},"flags":["saw_xiaowu","exiled"],"reveal":["小舞"],"trait":{"仁":1,"逆":1}}},"note":"按：决赛后相思断肠红落地，小舞十万年魂兽身份暴露（M39）。"},{"t":"守着命令，一步不动","hint":"她要的是听话，还是别的？","win":{"text":"你提灯站到终场，魂环一次没亮。教皇看了你一眼，那一眼很冷。","d":{"bonds":{"比比东":-1},"flags":["exiled"],"trait":{"忠":2,"险":-2}}}}]},{"id":"n03_hunt","title":"猎魂之夜","year":2651,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M51","echo":{"flag":"pope_knows_you_saw","text":"前因 · 2636：六岁那年，你对她说过：「您那时很疼。」"},"text":"长老殿连开三天会：胡列娜受封圣女，菊鬼二老去星斗捉十万年柔骨兔，一个月后，猎魂行动。\n\n教皇在殿里等你，眼底有一层你不认识的暗色。「蓝电霸王龙宗，你随月关、鬼魅去。」你问为什么是蓝电。她看了你很久：「他们欠一个人，欠了二十多年。我替他讨。」\n\n那夜没有月亮。八千人围住龙脊山，雷云翻滚，喊杀，然后是火。你的灯从未这样亮过，死者最后想起的东西像倒着下的雪，全落进灯里：孙子的第一声啼哭，一碗没端上桌的面。\n\n宗主殿前，玉元震九环齐转，独战两位封号斗罗。侧殿后墙，一个满脸是血的蓝发少年正把玉家孩子往石缝里推。是玉衡。他转身挡住缝口，电光在臂上炸开：「来啊，武魂殿的狗。」东北方，七宝的方向也烧红了。鬼魅的黑雾正飘过来，你只剩几息。","choices":[{"t":"随菊鬼二老踏平龙脊","hint":"教皇会交给你一只封着魂骨的铅匣","win":{"text":"龙脊山的雷停了。回城时，教皇把一只刻着「玉元震」的铅匣交你保管。","d":{"名望":6,"rep":{"武魂殿":6,"宗门":-10},"bonds":{"比比东":4,"月关":3},"flags":["did_massacre"],"item":"铅匣一只（内封蓝电宗主魂骨，代教皇保管）","trait":{"仁":-2,"忠":1}}}},{"t":"用蜃楼遮住石缝","hint":"改写原著：蓝电血脉留下一支（宿命 −1）","need":{"精神":50},"cost":{"fate":1},"canonChange":{"node":"M51","inertia":3,"desc":"玉衡与十一名玉家孩童从后山石缝逃出，蓝电霸王龙血脉未绝"},"win":{"text":"蜃楼织出一面完整的山壁。鬼魅的黑雾从石缝前飘过，什么也没发现。","d":{"shift":10,"flags":["spared_yuheng"],"bonds":{"玉衡":15},"rep":{"武魂殿":-5,"宗门":5},"met":["landian"],"trait":{"逆":2,"仁":2,"忠":-1}}}},{"t":"拦在玉元震的雷霆之前","hint":"关键战：月关、鬼魅压阵，撑过三回合","need":{"战力":850},"chance":0.3,"win":{"text":"老龙的雷霆劈碎了半座山，你还站着。教皇亲手为你记了功。","d":{"伤势":40,"名望":12,"体魄":3,"rep":{"武魂殿":8,"宗门":-8},"bonds":{"比比东":6},"flags":["fought_yuan"],"trait":{"险":2,"忠":1}}},"lose":{"text":"一道紫雷劈穿冥月，你被月关抬下山时只剩半口气，灯罩裂纹又长了一截。","d":{"伤势":75,"rep":{"武魂殿":2},"flags":["fought_yuan"],"trait":{"险":2}}}}]},{"id":"n04a_lake","title":"星湖","year":2651,"cond":{"flag":null,"notFlag":"spared_yuheng","levelMin":0},"canon":"M52","echo":{"flag":"did_massacre","text":"前因 · 2651：龙脊山那一夜的记忆，还在你灯里落个不停。"},"text":"龙脊山的血还没干，你就被编进了星斗大森林的猎捕小队：菊鬼二老，黄金一代，还有胡列娜带来的杀神唐银。每靠近唐银一次，灯罩的裂纹就烫一次。\n\n第七天，星湖。蝎子辫少女身后卧着青蟒与黑猿。两极静止领域罩下的一瞬，唐银的伪装像水一样褪去，蓝银草暴起，八根蛛矛张开。「唐三！」焱吼得满嘴是血。\n\n月关喊你照他的眼睛，冥月却自己转向湖对岸的芦苇：一头角结冰晶的白鹿正发着抖。另一个十万年，只有你看见了。你把灯压低了一寸。\n\n唐三倒下。那个少女走过去，捧起他的脸，化成一道血红的光。撤退路上，鬼魅把一头断了四肢的噬梦貘扔在你脚下：「教皇许你的，杀了它。」第六环升起时，你怀里多了两封信：一封盖着教皇印，一封没有署名，像出自天斗太子府。","choices":[{"t":"拆开教皇的信，回武魂城","hint":"回到她身边，看她一步步走进黑暗","win":{"text":"你把无名信扔进篝火。回城那天，教皇殿深处的密室第一次锁上了门。","d":{"ring":{"beast":"噬梦貘","years":19000,"kind":"控","skill":"噬梦","desc":"吞去目标前几息的念头，令其出手落空、招式中断"},"bonds":{"比比东":4},"rep":{"武魂殿":3},"flags":["go_pope","hid_baishuang"],"met":["beast"],"reveal":["大明","二明"],"trait":{"忠":1,"仁":1}}}},{"t":"拆开那封没有署名的信","hint":"去天斗，站到千仞雪身后","win":{"text":"信里只有一行字：「雪还没停。」你连夜南下天斗城。","d":{"ring":{"beast":"噬梦貘","years":19000,"kind":"控","skill":"噬梦","desc":"吞去目标前几息的念头，令其出手落空、招式中断"},"bonds":{"千仞雪":5},"flags":["go_angel","hid_baishuang"],"met":["beast"],"reveal":["大明","二明"],"trait":{"忠":-1,"逆":1,"仁":1}}}},{"t":"把芦苇里的白鹿指给月关","hint":"又一个十万年，武魂殿会记你大功","win":{"text":"菊瓣追进芦苇，只带回半截冰角。武魂殿记你大功，你却再不敢照湖水。","d":{"ring":{"beast":"噬梦貘","years":19000,"kind":"控","skill":"噬梦","desc":"吞去目标前几息的念头，令其出手落空、招式中断"},"名望":8,"rep":{"武魂殿":6,"魂兽":-15},"bonds":{"白霜":-20,"比比东":3},"flags":["go_pope"],"met":["beast"],"item":"霜角白鹿的半截冰角","trait":{"仁":-3,"忠":1}}}}]},{"id":"n04b_lake","title":"星湖","year":2651,"cond":{"flag":"spared_yuheng","notFlag":null,"levelMin":0},"canon":"M52","echo":{"flag":"spared_yuheng","text":"前因 · 2651：龙脊山那夜，你用蜃楼遮住了后山的石缝。"},"text":"龙脊山的血还没干，你就被编进了星斗大森林的猎捕小队：菊鬼二老，黄金一代，还有胡列娜带来的杀神唐银。每靠近唐银一次，灯罩的裂纹就烫一次。\n\n第七天，星湖。蝎子辫少女身后卧着青蟒与黑猿。两极静止领域罩下的一瞬，唐银的伪装像水一样褪去，蓝银草暴起，八根蛛矛张开。「唐三！」焱吼得满嘴是血。\n\n月关喊你照他的眼睛，冥月却自己转向湖对岸的芦苇：一头角结冰晶的白鹿正发着抖。另一个十万年，只有你看见了。你把灯压低了一寸。\n\n唐三倒下。那个少女走过去，捧起他的脸，化成一道血红的光。撤退路上，鬼魅把一头断了四肢的噬梦貘扔在你脚下：「教皇许你的，杀了它。」第六环升起时，你怀里多了两封信：一封盖着教皇印，一封没有署名，像出自天斗太子府。\n\n你还想起石缝里那个蓝发少年。听说他带着十一个孩子，躲在天斗城外。","choices":[{"t":"拆开教皇的信，回武魂城","hint":"回到她身边，看她一步步走进黑暗","win":{"text":"你把无名信扔进篝火。回城那天，教皇殿深处的密室第一次锁上了门。","d":{"ring":{"beast":"噬梦貘","years":19000,"kind":"控","skill":"噬梦","desc":"吞去目标前几息的念头，令其出手落空、招式中断"},"bonds":{"比比东":4},"rep":{"武魂殿":3},"flags":["go_pope","hid_baishuang"],"met":["beast"],"reveal":["大明","二明"],"trait":{"忠":1,"仁":1}}}},{"t":"拆开那封没有署名的信","hint":"去天斗，站到千仞雪身后","win":{"text":"信里只有一行字：「雪还没停。」你连夜南下天斗城。","d":{"ring":{"beast":"噬梦貘","years":19000,"kind":"控","skill":"噬梦","desc":"吞去目标前几息的念头，令其出手落空、招式中断"},"bonds":{"千仞雪":5},"flags":["go_angel","hid_baishuang"],"met":["beast"],"reveal":["大明","二明"],"trait":{"忠":-1,"逆":1,"仁":1}}}},{"t":"熄了灯，去找那个蓝发少年","hint":"背叛武魂殿，再也回不了头","win":{"text":"你把两封信一起烧了，熄灯走进夜色。武魂殿的名册上，你的名字被朱笔划去。","d":{"ring":{"beast":"噬梦貘","years":19000,"kind":"控","skill":"噬梦","desc":"吞去目标前几息的念头，令其出手落空、招式中断"},"shift":8,"bonds":{"玉衡":5},"rep":{"武魂殿":-15,"宗门":5},"flags":["go_tang","defected","hid_baishuang"],"met":["beast"],"trait":{"逆":2,"忠":-3}}}}]},{"id":"n05a_coup","title":"天斗宫变","year":2652,"cond":{"flag":"go_angel","notFlag":null,"levelMin":0},"canon":"M56","echo":{"flag":"angel_contact","text":"前因：很多年前，你答应过替她守住一个秘密。"},"text":"你在太子府做了一年影子。白天是圣殿里不起眼的执事，夜里和纪无声一左一右立在书房檐下。纪无声不知道你是谁的人，殿下让他信，他就信。\n\n你知道的比他多。你知道每天清晨殿下端给陛下的参汤里有七彩斑斓，也知道她独处时会摘下雪清河的面具，对着铜镜看自己的金发，再一丝不苟地戴回去。「快了，」她说，「再过一个月，我就不必做别人了。」\n\n一个月后，雪夜大帝寿宴。天使领域笼罩大殿，一千名武魂殿魂师藏在禁卫甲下。然后唐三来了，乱披风之舞一锤一锤砸碎了金色的天。殿门外，一个使寒霜剑的少女护着宁荣荣冲了进来。\n\n领域碎了。她站在一地金羽里，没有回头：「{name}，你走。」","choices":[{"t":"背起她，从密道撤出天斗","hint":"你会成为她身边最后一个人","win":{"text":"你背她走完了整条密道。回到武魂城后，她在天使神殿后山替你钉住一头冥月鸮王：「你的灯，该有个真身了。」","d":{"ring":{"beast":"冥月鸮王","years":38000,"kind":"辅","skill":"冥月真身","desc":"器魂真身：灯化明月悬空，月下己方精神系魂技威力倍增"},"bonds":{"千仞雪":8},"rep":{"天斗":-8},"flags":["with_angel"],"met":["qibao","huangshi"],"trait":{"忠":2,"群":1}}}},{"t":"先放纪无声走，再去追她","hint":"两道影子，一道留下，一道离开","win":{"text":"纪无声深深看你一眼，消失在雨里。追上她时，她只说：「你总是最后一个。」第七环仍是她替你猎的。","d":{"ring":{"beast":"冥月鸮王","years":38000,"kind":"辅","skill":"冥月真身","desc":"器魂真身：灯化明月悬空，月下己方精神系魂技威力倍增"},"bonds":{"纪无声":8,"千仞雪":3},"rep":{"天斗":-4},"flags":["with_angel"],"met":["qibao","huangshi"],"trait":{"仁":1,"群":1}}}},{"t":"提灯拦住唐三一息","hint":"关键战：在乱披风之舞下撑一息","need":{"战力":1000},"chance":0.3,"win":{"text":"冥月锁住锤影一息，她借这一息撤出大殿。唐三看你的眼神第一次变了。","d":{"ring":{"beast":"冥月鸮王","years":38000,"kind":"辅","skill":"冥月真身","desc":"器魂真身：灯化明月悬空，月下己方精神系魂技威力倍增"},"名望":10,"伤势":35,"bonds":{"千仞雪":6,"唐三":-3},"flags":["with_angel"],"met":["qibao","huangshi"],"trait":{"险":2,"忠":1}}},"lose":{"text":"锤影砸碎冥月，你被她拖出殿外。半年后伤好，她仍替你猎来了第七环。","d":{"ring":{"beast":"冥月鸮王","years":38000,"kind":"辅","skill":"冥月真身","desc":"器魂真身：灯化明月悬空，月下己方精神系魂技威力倍增"},"伤势":65,"bonds":{"千仞雪":4},"flags":["with_angel"],"met":["qibao","huangshi"],"trait":{"险":2}}}}]},{"id":"n05c_traitor","title":"叛灯","year":2652,"cond":{"flag":"go_tang","notFlag":null,"levelMin":0},"canon":"M55","echo":{"flag":"spared_yuheng","text":"前因 · 2651：龙脊山那夜，你用蜃楼遮住了后山的石缝。"},"text":"星湖回来第三个月，你在天斗城外的破庙里找到了玉衡。他瘦得脱形，身边是十一个玉家孩子。他拔刀架在你脖子上，抖了很久，没有砍下去。「那天，你为什么放我走？」\n\n你答不上来，把灯递给他。他看见了龙脊山那一夜落进灯里的东西，抱着灯坐在地上，哭得像个孩子。\n\n一个月后，他带你见了大师。驼背布衣，眼里有比恨更冷的东西。「冥月灯，我在教皇殿门口见过你。你能画出武魂殿在庚辛城的主殿吗？」你画了。那一夜庚辛主殿被屠，一个满身烟灰的铁匠学徒欧冶青替唐门开了城门。\n\n宫变那夜，你混在天斗禁卫里，一眼认出了禁卫甲下的武魂殿魂师。身边站着七宝的林照，寒霜剑已出鞘；回廊尽头，太子的影子纪无声正看着你。","choices":[{"t":"拆穿假禁卫，护住寝宫","hint":"救驾之功，天斗会记住你","win":{"text":"冥月照出一百张藏在甲下的脸，唐三把救驾之功记在你头上。半年后，玉衡陪你猎来第七环。","d":{"ring":{"beast":"冥月鸮王","years":36000,"kind":"辅","skill":"冥月真身","desc":"器魂真身：灯化明月悬空，月下己方精神系魂技威力倍增"},"名望":10,"rep":{"天斗":10},"bonds":{"唐三":5,"林照":5},"flags":["saved_emperor"],"met":["qibao","shenjiang","huangshi"],"trait":{"逆":1,"忠":1}}}},{"t":"在宫墙下给千仞雪留生路","hint":"你还欠她一场雪","win":{"text":"你用蜃楼替她遮住一段宫墙，纪无声看见了，没有拦。第七环是玉衡陪你去猎的。","d":{"ring":{"beast":"冥月鸮王","years":36000,"kind":"辅","skill":"冥月真身","desc":"器魂真身：灯化明月悬空，月下己方精神系魂技威力倍增"},"shift":2,"rep":{"天斗":3},"bonds":{"千仞雪":6,"纪无声":4},"met":["qibao","shenjiang","huangshi"],"trait":{"仁":1,"忠":-1}}}}]},{"id":"n06a_gate","title":"天使之门","year":2656,"cond":{"flag":null,"notFlag":"go_tang","levelMin":0},"canon":"M75","echo":{"flag":"knows_truth","text":"前因：你知道那座黑殿里发生过什么，也知道她们是母女。"},"text":"四年里，大陆换了颜色。七宗重选，雪崩登基，武魂殿成了武魂帝国，教皇成了女皇。罗刹的传承在吃她，她越来越强，也越来越不像她，有时会把你的名字叫成另一个：小刚。\n\n二六五六年，唐三从海上回来，鬼斗罗、菊斗罗先后死在他手里。嘉陵关首战，他重创了女皇的灵魂，她被罢黜指挥权，坐在后营不点灯的帐里。\n\n同一夜，千仞雪站在天使神殿门前。明天，千道流会走进去，把自己献给孙女，让她成神。\n\n你提着灯站在两座帐篷之间。灯里那段记忆，你揣了二十年：烛火全灭的高殿，按住手腕的那只手，掐断的尖叫。西门外，幽冥白虎的咆哮已经扑上了城墙。","choices":[{"t":"把灯里那段记忆点给她看","hint":"改写原著：女儿在成神前看见母亲的伤（宿命 −2）","need":{"精神":60},"cost":{"fate":2},"canonChange":{"node":"M85","inertia":4,"desc":"千仞雪成神前得知身世真相；终局她碎神位护母，罗刹神位断绝，比比东以凡人之身存活"},"win":{"text":"冥月真身升起，她在月光里站到月亮偏西：「我父亲，是她杀的。」你答：「是。」","d":{"shift":20,"flags":["truth_revealed"],"bonds":{"千仞雪":10,"比比东":10},"trait":{"逆":3,"仁":1},"ending":"e2"}}},{"t":"提灯上西门，迎战幽冥白虎","hint":"关键战：守住西门，守住她的献祭","need":{"战力":1200},"chance":0.45,"win":{"text":"冥月悬于西门，白虎三扑三退。天亮时，你还站在城头。","d":{"名望":15,"trait":{"忠":1,"险":1},"ending":"e1"}},"lose":{"text":"白虎的爪穿过冥月。你从城头坠下，风正从西往东吹。","d":{"trait":{"险":1},"ending":"e4"}}},{"t":"什么也不说，陪她们走完","hint":"让一切照原样发生","win":{"text":"你替两座帐篷各守了一夜灯。第二天，光柱冲天。","d":{"bonds":{"千仞雪":3,"比比东":3},"trait":{"逆":-2},"ending":"e1"}}}]},{"id":"n06c_pass","title":"关下之灯","year":2656,"cond":{"flag":"go_tang","notFlag":null,"levelMin":0},"canon":"M75","echo":{"flag":"saved_emperor","text":"前因 · 2652：宫变那夜，你拆穿了假禁卫，护住了雪夜大帝。"},"text":"四年里，你换了三个名字。在唐门你叫「灯」，在敏之一族的情报网里你是一个编号，在武魂帝国的通缉令上，你的画像旁写着「叛徒」，赏金比玉衡还高。\n\n玉衡如今是蓝电残部的头领，最小的那个孩子已经会叫你「灯叔」。大师替他们在天斗城外置了宅子，门楣挂一块没有字的匾：「等仇报了，再写。」\n\n二六五六年，嘉陵关。你把亲手画的城防图交给唐三，站在天斗大营的望楼上看那座百米雄关。城头插着武魂帝国的旗，旗下站着你认识的人：邪月一言不发，胡列娜远远望着大营。焱的火在西门城头烧成一面墙，他吼出你的名字：「{name}！出来！」","choices":[{"t":"提灯出营，赴焱的西门之约","hint":"关键战：焱的火与邪月的刃一起来","need":{"战力":1150},"chance":0.5,"win":{"text":"你撑过了三回合，玉衡的雷准时落下。焱跪在灰里，没有死。","d":{"名望":12,"bonds":{"焱":4,"玉衡":5},"trait":{"险":2,"群":1},"ending":"e3"}},"lose":{"text":"火墙合拢，月刃从火里来。你没等到那道雷，灯从望楼下滚了出去。","d":{"trait":{"险":1},"ending":"e4"}}},{"t":"隔着城墙，为胡列娜点灯","hint":"不赴约，也不躲，用你的方式告别","win":{"text":"冥月悬在大营上空，照着她那半边城墙。她看了很久，转身下了城头。","d":{"shift":2,"bonds":{"胡列娜":8,"焱":-5},"trait":{"仁":1,"险":-1},"ending":"e3"}}}]}],"endings":[{"id":"e1","title":"结局·长明","type":"宿","grade":1,"text":"千仞雪成神，比比东成了罗刹神。天斗城下，那柄双神共存的剑刺来时，比比东挡在了女儿身前。你的灯自己亮了，照见她最后的记忆：一间产房，一个金色胎发的婴儿，一只停在半空、终究没落下的手。唐三赦免了你。后来武魂城废墟上盖起一座孤儿院，院长提着灯，觉醒从不让外人主持；每年初雪，他会在半截台阶上拢一根蜡烛。","afterlife":["比比东：替女儿挡下那一剑，临终说出了一切，罗刹神陨落。","千仞雪：被赦免，失了神位，初雪时偶尔来台阶上陪你坐一坐。","胡列娜：被赦免，远远喊你「灯童」，像很多年前一样。","武魂殿：武魂帝国覆灭，神魂村立起了金碑。"],"worldline":"原著终局不变：罗刹神陨落、武魂帝国覆灭；你作为被赦免的旧人，守着比比东最后的记忆活下去。"},{"id":"e2","title":"结局·双月同天","type":"改","grade":3,"text":"千仞雪照旧成神，一切看上去都和本该发生的一样。只有一件事不同：那柄剑刺来时，她比母亲更快。她亲手撕碎天使神装化作一面盾，神位碎了，剑上的海神之力斩断了缠在比比东身上的黑光。两个女人跌坐在地，一个不再是神，一个不再是罗刹。「我知道了，」千仞雪说，「妈妈。」极北冰原边上从此多了一座木屋，门口挂着一盏灯。","afterlife":["比比东：罗刹传承剥落，以凡人之身活到白发，常为一锅汤的盐和女儿吵半天。","千仞雪：碎了神位，第一次叫出「妈妈」，在极北看了一辈子雪。","唐三：收剑放行，只说了一句：走得越远越好。","武魂殿：帝国依旧覆灭，罗刹神位从此断了传承。"],"worldline":"千仞雪成神前得知身世，终局碎神位护母；母女以凡人之身存活，罗刹神位断绝，武魂帝国覆灭不变。"},{"id":"e3","title":"结局·龙骨灯","type":"叛","grade":2,"text":"嘉陵关破，武魂守军投降。邪月倒提月刃走在最前，焱经过你身边啐了一口，可他们都活着。比比东倒在女儿怀里时，你隔着很远举起灯，最后一次照见她的记忆：那座黑殿的门缝外，一直站着一个提灯的六岁孩子。原来她知道。战后你带玉衡走进教皇殿地宫，找到三只刻着「玉元震」的铅匣。龙脊山上立起一座祠堂，大师写的匾上只有一个字：在。","afterlife":["玉衡：带着十一个孩子重建蓝电，二十年后龙脊山顶雷声再起。","大师：亲手题了那块匾，写完一个字就搁下了笔。","焱：常在你的灯铺门口站一会儿，骂一句叛徒，又不走。","武魂殿：帝国覆灭，地宫里的魂骨一一归还旧主。"],"worldline":"蓝电霸王龙血脉未绝，宗主三块魂骨自武魂殿地宫寻回、归还玉家；罗刹陨落与帝国覆灭不变。"},{"id":"e4","title":"结局·灯烬","type":"死","grade":0,"text":"你仰面倒在嘉陵关城下，冥月真身碎成满地光点，像当年猎魂森林的萤火。灯在做最后一件事：把你自己的记忆一盏盏点亮，偏厅的炭火，红衣的小姑娘，雪里的蜡烛，石缝里不哭的孩子。裂纹走到了尽头。熄灭前，它照出一件你不记得的事：雪夜的圣殿后门，有人放下襁褓里的你，又替你点了一盏小油灯。原来你从来不是一个人。","afterlife":["胡列娜：在城头喊过你的名字，喊得很急，你没听清。","比比东：始终没有走出那道门，终局照原著陨落。","孤儿院嬷嬷：很多年里一直记得，那个总被最后想起的孩子有一盏很好看的灯。","武魂殿：武魂帝国覆灭，史书上没有提灯的人。"],"worldline":"你战死于嘉陵关，世界线照原著前行，史书上没有那个提灯的人。"}],"summary":"九节点：觉醒窥见黑殿之夜；精英大赛战唐三，胜得「三息」赴杀戮之都，败则贬往天斗太子府；猎魂之夜花 1 宿命放走玉衡（改 M51）或硬接玉元震；星湖三分：回比比东（密室事件）、投千仞雪（宫变）、叛入唐门（需放走玉衡）；嘉陵关武魂一侧可花 2 宿命把记忆照给千仞雪（改 M85）。结局：长明、双月同天、龙骨灯、灯烬。"},{"id":"landian","title":"蓝电霸王龙·玉家子弟","defaultName":"玉衡","gender":"男","tagline":"注定灭门的宗门，你能留下几条命","intro":"你生在蓝电霸王龙宗的旁支，却觉醒了二十年来第一个纯血。族人管大师叫废物，宗门中立几十年，以为谁也不敢动它；可二六五一年的某一夜，武魂殿会上山。一千八百条命，三块魂骨，你能救回多少？","birthYear":2632,"startYear":2638,"faction":"蓝电霸王龙宗","wuhun":{"name":"蓝电霸王龙","type":"兽","system":"强攻","tier":"顶","desc":"玉家纯血传承，雷电与龙力同体；魂环只能取自亚龙种，否则龙血排斥、爆体而亡。"},"innate":8,"attrs":{"体魄":34,"精神":24,"悟性":30,"魅力":24,"气运":22},"coins":300,"rep":{"武魂殿":0,"天斗":5,"星罗":0,"宗门":20,"魂兽":-5},"bonds":{"玉天恒":10,"大师":0,"玉元震":5},"flavor":{"work":{"name":"雷泽采药","desc":"替药堂采雷泽草药换钱"},"faction":{"name":"宗门差事","desc":"替长老巡山、守雷池"},"place":"雷鸣峰"},"rings":[{"slot":1,"options":[{"beast":"雷鳞蜥龙","years":410,"kind":"攻","skill":"雷鳞裂爪","desc":"长老定下的那头，龙爪覆鳞带电，撕裂时附加麻痹。","need":{"战力":120}},{"beast":"闪鳞蜥龙","years":370,"kind":"敏","skill":"疾雷步","desc":"大师指的那头，脚下生雷，可连续两次短距折向突进。","need":{"战力":100}}]},{"slot":2,"options":[{"beast":"雷角地行龙","years":720,"kind":"攻","skill":"霸王冲撞","desc":"低头蓄雷后直线冲撞，破甲极强。","need":{"战力":230}},{"beast":"鳞甲地龙","years":560,"kind":"防","skill":"龙鳞甲","desc":"周身浮起一层带电龙鳞，受击时反震雷流。","need":{"战力":190}},{"beast":"雷鬃地行龙","years":980,"kind":"攻","skill":"奔雷冲锋","desc":"越限的地行龙王种，冲撞带三重雷爆，吸收时龙血会沸。","need":{"战力":330}}]},{"slot":3,"options":[{"beast":"暴风雷翼龙","years":1690,"kind":"攻","skill":"雷翼冲击","desc":"雷电化作双翼 :{"大师":10,"玉天恒":-5},"rep":{"宗门":-2},"flags":["honored_master"],"trait":{"逆":1}}}},{"t":"站到堂兄身边","hint":"玉家的孩子，先护自家人","win":{"text":"你一言不发地站在他身侧。他没说话，回程却把马让给了你。","d":{"bonds":{"玉天恒":10},"trait":{"群":1,"忠":1}}}},{"t":"夜里去找唐三","hint":"问问那株草凭什么拦住碧磷蛇","win":{"text":"那个蓝银草少年给你倒了杯水：「我的武魂不弱，只是你们没见过。」","d":{"悟性":1,"bonds":{"唐三":8,"大师":5},"flags":["met_tangsan"],"trait":{"险":1}}},"note":"按：唐三是蓝银草与昊天锤的双生武魂。"}]},{"id":"n_elite","title":"红雾","year":2645,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M37","echo":{"flag":"honored_master","text":"前因 · 2644：你在大斗魂场向大师行过族礼。"},"text":"武魂城，全大陆高级魂师学院精英大赛。你十三岁，作为天斗皇家学院的替补，跟着堂兄出征。场边你见过星罗皇家学院的戴澜，雷纹白虎，眼神像刀；见过神风学院借名参赛的千古明，身后一明一暗两条龙影。\n\n对上武魂殿那一场，胡列娜只抬了一下手。妖魅的红雾漫过全场，队友一个接一个跪倒，独孤雁就倒在你脚边。红雾深处亮着一盏青灰色的灯，武魂殿替补苏夜提着冥月灯走过来，灯光扫过你的眼睛，你看见自己六岁那年的雨夜被一页一页翻了出来。\n\n裁判还没有吹哨。只要撑过三回合不倒，你就是全场唯一站着的人。","choices":[{"t":"斩向那盏灯","hint":"关键战：撑过三回合","need":{"战力":350},"chance":0.45,"win":{"text":"你是全场最后站着的人。比比东在高台上看了你一眼；回山后，宗主收你做了亲传。","d":{"名望":12,"rep":{"宗门":5,"天斗":5},"bonds":{"玉元震":10,"苏夜":5},"flags":["zongzhu_disciple"],"met":["wuhun","xingluo","qiangu"],"trait":{"险":1}}},"lose":{"text":"灯光一晃，你跪进红雾。回山后族人迁怒于你，只有大师来信，叫你去史莱克。","d":{"伤势":30,"rep":{"宗门":-3},"bonds":{"大师":8},"flags":["master_lessons"],"met":["wuhun","xingluo","qiangu"]}}},{"t":"扑过去护住独孤雁","hint":"你会倒下，但堂兄会欠你一份","win":{"text":"你用后背替她挡下余波，一同倒下。堂兄抱起她时，看你的眼神变了。败后你去了史莱克。","d":{"伤势":25,"bonds":{"玉天恒":12,"独孤雁":10,"大师":5},"flags":["shielded_yan","master_lessons"],"met":["wuhun","xingluo","qiangu"],"trait":{"仁":1,"群":1}}},"note":"按：原著武魂殿以妖魅一击放倒天斗皇家战队。"}]},{"id":"n_storm","title":"山雨欲来","year":2650,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M47","echo":{"flag":"tianhen_friend","text":"前因 · 2648：你替堂兄在宗主面前说过情。"},"text":"你十八岁这年，雷鸣峰上的乌鸦多了。武魂殿给上三宗的补贴断了，山下的商队不再上山，天斗城里有人说唐三认祖归宗，回了昊天宗。宗主听完只是摆手：「比比东不会动小刚的家。」\n\n你不信。玉天恒也不信，独孤雁的事被压了两年，他看宗门的眼神早就变了。那夜在雷池边，他指着池底一块落石说，小时候他从那里钻出去过，那是先祖避雷劫开的古道，被落石封死多年，通向山背的涧谷。\n\n宗主殿、雷池、天斗城。离那一夜还有几个月，你只来得及做一件事。","choices":[{"t":"再闯宗主殿，逼他备战","hint":"你会站在宗主身边迎接那一夜","win":{"text":"宗主终究没有调兵，却把一枚雷令按进你手心：「真到那一夜，护住孩子。」","d":{"rep":{"宗门":2},"bonds":{"玉元震":8},"flags":["warned"],"item":"宗主雷令","trait":{"忠":1}}}},{"t":"和堂兄挖通雷池古道","hint":"在宗主眼皮底下备一条退路","need":{"体魄":38},"win":{"text":"四个月夜里刨石，堂兄磨烂三回手，你断了七根龙爪指甲。古道通了，独孤雁在出口搭起窝棚等着。","d":{"伤势":10,"bonds":{"玉天恒":10,"独孤雁":5},"flags":["tunnel"],"trait":{"逆":1,"险":1}}}},{"t":"下山求小刚叔出面","hint":"也许来得及，也许来不及","win":{"text":"大师连夜去求见太子，回来只说了一句：「来不及了。」你调头往山上赶。","d":{"bonds":{"大师":8},"flags":["went_tiandou"],"trait":{"群":1}}},"note":"按：武魂殿此前已决议，一个月后启动猎魂行动。"}]},{"id":"n_hunt_tunnel","title":"雷池古道","year":2651,"cond":{"flag":"tunnel","notFlag":null,"levelMin":0},"canon":"M51","echo":{"flag":"yusheng_debt","text":"前因 · 2642：雷泽那年，你留下来给玉笙止过血。"},"text":"今夜是旁支守夜祭雷的日子。你挨家挨户劝来了人，说雷池今年有异象，孩子们来沾沾龙气。雷池边挤了三百一十二个人，最小的还在襁褓里，最老的是拄拐的七叔公。\n\n然后山下亮起了火把，一条，十条，一百条。峰顶炸开金色雷光，夜空里浮起一黑一金两个巨大的圆，缓缓压向宗主殿，那是菊鬼二老的两极静止。宗主撑不住的。\n\n「古道一次只过一个人，至少要一个时辰。」玉天恒攥住你的胳膊，「一旦被发现，挤在里面的一个也跑不掉。」七叔公用拐杖顿地：「孩子先走！我们这些老骨头最后！」玉笙抱着一个三岁的孩子挤到你身边：「{name}哥，你走最后，对不对？」","choices":[{"t":"打开古道，带三百人走","hint":"改写原著（宿命 −2）","need":{"名望":15},"cost":{"fate":2},"canonChange":{"node":"M51","inertia":4,"desc":"蓝电霸王龙宗三百一十二名孩童与旁支族人自雷池古道生还，玉天恒未死"},"win":{"text":"一个时辰，你守在入口，最后一个钻进去。山涧里独孤雁的灯亮着；身后，宗主殿塌了。","d":{"shift":12,"名望":15,"rep":{"宗门":15,"武魂殿":-20},"bonds":{"玉笙":15,"玉天恒":15,"独孤雁":8},"flags":["clan_saved","tianhen_alive"],"trait":{"逆":2,"仁":2,"群":1}}}},{"t":"只拉起玉笙钻出石缝","hint":"活下来两个人，剩下的交给命","win":{"text":"一盏茶工夫，你们从老藤后滚进山涧。回头时，雷池边的歌声已经没了。","d":{"shift":1,"bonds":{"玉笙":15},"flags":["yusheng_saved","in_tiandou"],"trait":{"群":-1,"险":-1}}}}]},{"id":"n_hunt","title":"猎魂之夜","year":2651,"cond":{"flag":null,"notFlag":"tunnel","levelMin":0},"canon":"M51","echo":{"flag":"suye_umbrella","text":"前因 · 2645：武魂城雨夜，你给罚跪的苏夜撑过一把伞。"},"text":"火把从三面缠上雷鸣峰。山门那边传来第一声惨叫时，你站在祖祠前，身后挤着二十几个孩子，玉笙攥着一根比她还高的门闩，守着侧门。\n\n峰顶，宗主化身霸王龙，金色雷光一次次撞向夜空里一黑一金两个巨大的圆，一次比一次暗。祖祠龙柱上的铁链齐齐崩断。\n\n大门被一杆骑枪撞开。武魂殿圣殿骑士统领踏进来，六个魂环压得烛火伏地。他身后，一个瘦削苍白的青年提着青灰色的灯，是苏夜。灯光扫过孩子们，停在你脸上。远处鸦岭方向，有人正把什么东西装进三只木匣。","choices":[{"t":"龙吼震门，截住统领","hint":"关键战：撑过三回合，孩子们就能出去","need":{"战力":750},"chance":0.35,"win":{"text":"三回合，你用霸王龙吼钉住了他。玉笙带孩子们从侧门没入夜色，你浑身是血滚下后山。","d":{"伤势":40,"名望":10,"rep":{"武魂殿":-10},"bonds":{"玉笙":10},"flags":["kids_saved","in_tiandou"],"trait":{"仁":1,"险":1}}},"lose":{"text":"骑枪贯穿你的肩，把你钉在龙柱上。最后看见的，是孩子们被一个个拖出祖祠。","d":{"伤势":60,"flags":["captured"],"trait":{"险":1}}}},{"t":"迎着那盏灯走过去","hint":"赌苏夜还记得你","need":{"精神":36},"canonChange":{"node":"M51","inertia":1,"desc":"苏夜以冥月灯迷住骑士统领，放走一个蓝电少年和几个孩子"},"win":{"text":"灯光在你记忆里停了一瞬。苏夜别过脸，统领的眼神忽然空了。你抱起两个孩子冲出侧门。","d":{"shift":2,"bonds":{"苏夜":15,"玉笙":5},"flags":["suye_spared","in_tiandou"],"met":["wuhun"],"trait":{"逆":1,"险":1}}}},{"t":"潜上鸦岭，记下每张脸","hint":"你会知道三块骨头去了哪里","win":{"text":"鸦岭上，一个天斗暗卫用影蝠替你遮住身形。你看着宗主的三块骨头被剥出，分进三只匣子。","d":{"伤势":20,"精神":3,"bonds":{"纪无声":8},"flags":["saw_bones","in_tiandou"],"met":["huangshi"],"trait":{"仁":-1,"险":-1}}},"note":"按：一匣送教皇殿，一匣给圣龙宗少宗主，一匣给象甲宗主。"}]},{"id":"n_tea","title":"教皇的茶","year":2652,"cond":{"flag":"captured","notFlag":null,"levelMin":0},"canon":"M51","echo":{"flag":"master_lessons","text":"前因 · 2645：红雾一败之后，是大师教你承认自己会输。"},"text":"锁环封住魂力，你在没有窗的石室里关了不知多少天，听执事们说一年后要开七宗重选大会，上三宗缺了一个位子。\n\n教皇殿里，比比东素袍未冠，亲手煮茶。「玉小刚的族侄。他教过你什么？」「教我承认自己会输。」她的手在壶上停了一瞬，笑了：「他还是这样。」\n\n「玉元震把他从族谱上划掉，他在山门外跪了三天三夜，那老东西连门都没开。我替他出了一口气。」宗主的三块骨头，头骨她留着，右臂赏给了圣龙宗少宗主拓跋烈，左腿赏给了象甲宗宗主呼延震。她推过来一枚新铸的青玉令牌，正面是霸王龙，背面是六芒星：「雷鸣峰可以重建，你来当宗主，旗挂在我的旗杆上。不接，我也放你回去，回他身边，告诉他是我放的。」","choices":[{"t":"接过那枚宗主令","hint":"雷鸣峰会立起来，挂着别人的旗","win":{"text":"雷鸣峰会重新立起来，挂着别人的旗。武魂殿送来的第一笔银子，比你见过的都多。","d":{"金魂币":2000,"名望":5,"shift":3,"rep":{"武魂殿":30,"宗门":-20,"天斗":-10},"bonds":{"比比东":10,"大师":-10},"flags":["puppet"],"item":"蓝电宗主令（武魂殿铸）","trait":{"忠":-2,"逆":-1}}}},{"t":"把茶泼在白玉地上","hint":"她会放你走，为了另一个人","win":{"text":"茶水在白玉上散开。她没看你，只挥了挥手。三天后，你把这句话带给了大师。","d":{"rep":{"武魂殿":-15},"bonds":{"比比东":-20,"大师":10},"flags":["spat_pope","in_tiandou"],"trait":{"忠":1,"逆":1}}},"note":"按：原著比比东灭蓝电，自称是替大师出气。"}]},{"id":"n_jialing","title":"嘉陵关","year":2656,"cond":{"flag":null,"notFlag":"puppet","levelMin":0},"canon":"M74","echo":{"flag":"saw_bones","text":"前因 · 2651：鸦岭上，你亲眼看着三块骨头被分进三只匣子。"},"text":"五年。七宗重选大会上，圣龙宗、象甲宗都进了新七宗，拓跋烈当众亮出新融的右臂骨，满场喝彩；武魂殿立国，雪崩继位，唐三出海又归来。你二十四岁，站在嘉陵关外的天斗大营。\n\n首战那天，象甲宗主呼延震的巨象虚影遮天压来，唐三只抬了一下手。战后他从那具躯体里取出一截缠雷的腿骨，放进你手里：「老师说，这是你家的。」奔雷龙踏。你在血泥里跪了很久。\n\n林照在帐前磨剑，你怀里揣着戴澜从水云关寄来的信。号角响起，青金色的圣龙军团涌出关门，旗下青年的右臂覆满暗蓝龙鳞，五指缠雷。「蓝电的余孽！你们宗主的爪子，现在是我的！」柳二龙浑身燃起火龙之焰，回头看你：「你不想去，姑姑替你去。」","choices":[{"t":"迎战拓跋烈，夺回龙爪","hint":"关键战：用宗主的雷，拿宗主的爪","need":{"战力":1050},"chance":0.4,"win":{"text":"你用宗主教你的雷，劈开了他握不稳的爪。霸王龙爪回到你右臂时，你听见一声很远的龙吟。","d":{"伤势":35,"名望":15,"rep":{"天斗":8,"武魂殿":-10},"bone":{"slot":"右臂","name":"霸王龙爪","desc":"宗主玉元震遗骨，龙爪缠雷，可瞬发一记不耗魂环的霸王龙爪。","attrs":{"体魄":6}},"item":"奔雷龙踏（宗主左腿骨）","reveal":["拓跋希"],"met":["qibao","xingluo"],"trait":{"险":1,"逆":1}}},"lose":{"text":"那只龙爪穿过你胸口时，你认出了那道雷。","d":{"ending":"e3"}}},{"t":"请柳二龙姑姑出手","hint":"骨头会回来，只是不是你亲手拿的","win":{"text":"火龙从天而降，把拓跋烈连人带甲吞了下去。她从灰烬里扒出龙爪，用衣襟包好塞给你。","d":{"rep":{"天斗":3},"bonds":{"柳二龙":10},"item":"霸王龙爪与奔雷龙踏","reveal":["拓跋希"],"met":["qibao","xingluo"],"trait":{"群":1,"险":-1}}},"note":"按：原著呼延震于嘉陵关首战被唐三秒杀。"}]},{"id":"n_jialing_puppet","title":"城下之龙","year":2656,"cond":{"flag":"puppet","notFlag":null,"levelMin":0},"canon":"M74","echo":{"flag":"stood_for_master","text":"前因 · 除夕家宴：你曾站起来，说小刚叔不是废物。"},"text":"五年，你跪着把雷鸣峰立了起来：九根新铸的龙柱，金线绣的宗旗，四十几个凑来的蓝电弟子，旗杆顶上挂着六芒星。七宗重选大会上，你坐在圣龙宗下首。\n\n现在你站在嘉陵关城头，站在拓跋烈身边。他的右臂覆满暗蓝龙鳞，五指缠雷，那是宗主的爪。首战那天，你亲眼看着呼延震被唐三一抬手放倒，那截奔雷龙踏落进了天斗人手里。\n\n号角响了。拓跋烈要你的弟子跟他出关打头阵。城下天斗阵中，一个灰衫老人站在柳二龙身边，仰头喊你的名字：「{name}！」声音不大，却穿过了整片战场。","choices":[{"t":"阵前倒戈，雷劈拓跋烈","hint":"五年的跪，用一爪还清","need":{"战力":1000},"chance":0.45,"win":{"text":"你从背后一爪劈开他的龙铠，火龙随即落下将他吞没。你跪在大师面前，五年的跪用一爪还清。","d":{"shift":4,"rep":{"武魂殿":-40,"天斗":10},"bonds":{"大师":15,"柳二龙":5},"flags":["defected"],"item":"霸王龙爪（宗主右臂骨）","trait":{"逆":2,"忠":1}}},"lose":{"text":"他的龙爪比你的雷快。那道熟悉的雷光，穿过了你的胸口。","d":{"ending":"e3"}}},{"t":"守在旗下，等帝国赢","hint":"宗主说过，谁都不站最安全","win":{"text":"你没有动。你看着火龙落下，看着拓跋烈和那条手臂一起被吞没，一直站到天黑。","d":{"bonds":{"大师":-15},"rep":{"武魂殿":3},"trait":{"险":-2,"忠":-1},"ending":"e4"}}}]},{"id":"n_bones_home","title":"三骨","year":2657,"cond":{"flag":"clan_saved","notFlag":null,"levelMin":0},"canon":"M85","echo":{"flag":"xiaogang_head","text":"前因 · 2651：你请大师做了三百人的族长。"},"text":"武魂帝国覆灭了。天上一金一紫两位神撞碎了半边天空，比比东替女儿挡下一剑，死前说了很多话，有一些是说给一个穿灰布长衫的老人听的。\n\n城破第三天，大师领你走进教皇殿深处一间不起眼的书房。书案上一盏熄灭的灯，一只紫檀木匣，纸条上三个字：给小刚。匣里锦缎上躺着雷霆龙瞳，两点金光已经很暗。大师读完匣底那封信，折好收进袖子，很久才开口：「她拿一千八百条命，换一口我根本不想出的气。可她也是这世上唯一觉得我被欺负了的人。」\n\n他把木匣递给你：「三块骨头都齐了。它们是蓝电的东西，该由蓝电的人决定往哪去。」天斗城里，三百多个人在等你回家。","choices":[{"t":"带三骨回雷鸣峰，交给族人","hint":"蓝电会重新打雷","win":{"text":"那年春天，你领着三百多人回到了雷鸣峰。","d":{"shift":5,"rep":{"宗门":20,"天斗":5},"flags":["bones_home"],"trait":{"群":2,"仁":1},"ending":"e1"}}},{"t":"一个人回山守着它们","hint":"让骨头和宗门睡在一起","win":{"text":"你让族人留在天斗城，自己抱着木匣上了山。","d":{"flags":["bones_buried"],"trait":{"群":-2},"ending":"e2"}}}]},{"id":"n_bones","title":"三骨","year":2657,"cond":{"flag":null,"notFlag":"clan_saved","levelMin":0},"canon":"M85","echo":{"flag":"defected","text":"前因 · 2656：嘉陵关阵前，你倒戈劈向了拓跋烈。"},"text":"武魂帝国覆灭了。天上一金一紫两位神撞碎了半边天空，比比东替女儿挡下一剑，死前说了很多话，有一些是说给一个穿灰布长衫的老人听的。\n\n城破第三天，大师领你走进教皇殿深处一间不起眼的书房。书案上一盏熄灭的灯，一只紫檀木匣，纸条上三个字：给小刚。匣里躺着雷霆龙瞳，两点金光已经很暗。大师读完匣底那封信，折好收进袖子：「她拿一千八百条命，换一口我根本不想出的气。可她也是这世上唯一觉得我被欺负了的人。」\n\n他把木匣和那截奔雷龙踏一起递给你：「三块骨头都齐了，该由蓝电的人决定往哪去。」可雷鸣峰上，只剩焦黑的柱子和荒草。","choices":[{"t":"把三骨埋进祖祠废墟","hint":"让它们和宗门睡在一起","win":{"text":"你在祖祠裂开的青石底下挖了一个坑。没有立碑，也没有告诉任何人。","d":{"flags":["bones_buried"],"trait":{"忠":1,"群":-1},"ending":"e2"}}},{"t":"融了龙瞳，守着空山","hint":"宗主的眼睛，替你看着这座山","win":{"text":"金光沉进你的眼底。宗主看过的雷鸣峰，往后由你来看。","d":{"bone":{"slot":"头","name":"雷霆龙瞳","desc":"宗主玉元震遗骨，龙瞳一睁，同阶魂师如负雷霆。","attrs":{"精神":8}},"trait":{"险":1,"逆":1},"ending":"e2"}}}]}],"endings":[{"id":"e1","title":"结局·蓝电长鸣","type":"宗","grade":3,"text":"回山的队伍比出山时还长：六年里走了几个老人，又添了十几个孩子。玉笙第一个挽起袖子，搬开祖祠门口的碎石。唐门派来工匠，欧冶青重铸了龙柱铁链，雪崩封大师为蓝电王。大师不接宗主之位：「宗主该由会打雷的人来做。」你成了第二十七代宗主，把雷霆龙瞳供进龙龛，把奔雷龙踏交给玉笙，在新宗规第一条写下：蓝电不求人，亦不负人；有约必守，有难必援。那夜，雷鸣峰顶终于又打了雷。","afterlife":["玉天恒：与独孤雁成婚，婚宴三十六张长案不分上下首，独孤博喝得大醉。","大师：受封蓝电王，仍在天斗城教书，每年雷祭上山主祭。","玉笙：接过奔雷龙踏，成了雷鸣峰上跑得最快的人。","蓝电霸王龙宗：废主旁之分，弃中立而守约，再没人叫它被灭门的上三宗。"],"worldline":"蓝电霸王龙宗未绝，三百余人归山重建，大师受封蓝电王；宗门弃中立而守约。"},{"id":"e2","title":"结局·孤龙守冢","type":"孤","grade":1,"text":"你回到雷鸣峰，再没下山，宗主的骨头也没有再离开这座山。雪崩封大师为蓝电王，可玉家只剩一个名字：活下来的人散在天斗城的街巷里，改姓的改姓，入唐门的入唐门。你在祖祠旁搭了草屋，砍柴挑水，雷雨夜站在峰顶黑石上，浑身缠着蓝紫电光，像一条孤零零的龙。猎户说，那是蓝电最后一个纯血。有时你对着青石说话：宗主说错了，谁都不站不是最安全，是最孤单。","afterlife":["大师：在天斗城教了一辈子书，柳二龙常替他上山送米面和酒，洒一碗在青石上。","柳二龙：问过你要守到什么时候。你说，守到有人回来。","提灯的苍白男人：某年冬天在山门石阶坐了一夜，留下一把断了骨的旧油纸伞。","蓝电霸王龙宗：只活在天斗的史书和唐门的卷宗里。"],"worldline":"与原著相近：蓝电只剩名号，宗主三骨留在雷鸣峰，峰上只有一个守冢人。"},{"id":"e3","title":"结局·雷落嘉陵","type":"死","grade":1,"text":"那只龙爪落下来时，你认出了那道雷，六岁那年它在你头顶停过。现在它穿过了你的胸口。你跪进血泥，听见柳二龙撕心裂肺地喊你的名字。然后火来了，一条通红的火龙把拓跋烈连人带甲、连那条不属于他的手臂一起吞了进去。大师把你葬在雷鸣峰，把龙爪和龙踏放在你右手边和左腿边，就像它们原本该在的位置。墓碑上只有一行：他为他的宗门，向前扑了一次。","afterlife":["柳二龙：焚杀拓跋烈，从灰烬里扒出霸王龙爪，用自己的衣襟包好。","大师：一年后在教皇殿书房找到写着给小刚的木匣，把它埋在你墓旁。","唐三：在嘉陵关为你点了一盏灯，此后每逢雷雨都会停下来听一会儿。","蓝电霸王龙宗：纯血又少一脉；雷雨夜，峰上总有人听见两声龙吟，一老一少。"],"worldline":"你死于本宗宗主的龙爪之下，柳二龙焚杀拓跋烈；三块魂骨最终都葬在雷鸣峰。"},{"id":"e4","title":"结局·傀儡之冠","type":"堕","grade":0,"text":"武魂帝国像被雷劈中的沙塔，一夜塌尽。天斗军上山时，新蓝电的弟子早已跑光，你穿着宗主袍独自坐在祖祠门口。地牢第九十二天，大师捧着紫檀木匣站在铁栅外：「陛下准了唐三的请，不杀你。新雷鸣峰会被拆掉。」他沉默很久：「我教你先学会跑，却没教你什么时候该站起来。这是我的错。」半个月后你被放出城，沿官道往北走。茶馆里，说书人正讲那个给武魂殿当了五年狗的伪宗主，满堂哄笑。","afterlife":["大师：三块骨头都落在他手里，一块也没融，供在天斗城的旧书房里。","拓跋烈：死在柳二龙的火龙里，霸王龙爪从灰烬中被扒了出来。","新蓝电宗：四十几个弟子被遣散回乡，九根新龙柱被推倒。","蓝电霸王龙宗：史书只记旧宗，七宗重选大会上的那一个不算。"],"worldline":"武魂帝国扶起的伪蓝电随帝国覆灭被拆除，你被赦后流放，三块魂骨归于大师。"}],"summary":"蓝电旁支纯血线，主题是猎魂之夜能留下几条命。11 个节点，单局经过 7–8 个：觉醒、皇斗、精英大赛战苏夜、山雨欲来三岔；挖通古道者可花 2 宿命救三百一十二人（改写 M51），否则祖祠死战、借苏夜之灯或上鸦岭看三骨分匣，被俘则受比比东宗主令。嘉陵关战拓跋烈夺霸王龙爪，傀儡线可倒戈。"},{"id":"beast","title":"星斗·十万年魂兽化形","defaultName":"白霜","gender":"女","tagline":"你是猎物，也是会走路的宝库","intro":"你是霜泉谷的十万年霜角白鹿，追着小舞的脚步化成六岁女孩。人间有热粥，也有武魂殿执事发亮的眼睛：在他们眼里，你是一道十万年魂环和一块必掉的魂骨。星湖那天，献祭的也可能是你。","birthYear":2631,"startYear":2637,"faction":"魂兽","wuhun":{"name":"霜角白鹿","type":"兽","system":"控制","tier":"顶","desc":"本体所化的冰属性武魂，踏霜无声、凝雾迷踪；无需猎杀即可自生魂环，鹿角可解百毒。"},"innate":10,"attrs":{"体魄":34,"精神":44,"悟性":38,"魅力":40,"气运":26},"coins":0,"rep":{"武魂殿":0,"天斗":0,"星罗":0,"宗门":0,"魂兽":25},"bonds":{"大明":20,"二明":20,"小舞":10},"flavor":{"work":{"name":"药铺帮工","desc":"跟姜婆婆采药卖药"},"faction":{"name 冷得让你想哭。","d":{"bonds":{"二明":10},"rep":{"魂兽":8},"flags":["return_forest"],"trait":{"忠":1,"群":-1}}}},{"t":"留在史莱克去天斗","hint":"继续做人","win":{"text":"二明叹口气，揉乱你的白头发走了。第二天，你跟着史莱克的马车往天斗城去。","d":{"bonds":{"小舞":5,"唐三":5},"flags":["stay_human"],"trait":{"群":1,"逆":1}}}}]},{"id":"n_red_flower","title":"红花落地","year":2645,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M39","echo":{"flag":"deacon_marked","text":"前因 · 诺丁：武魂殿的本子上，早就记着你的名字。"},"text":"武魂城的决赛场像一口倒扣的金钟，你坐在最高一排角落，帽兜压住白发。大明说过，魂斗罗以上能察觉幼生期的化形者，而这里的封号斗罗多得数不过来。\n\n场上，相思断肠红落地，小舞的十万年身份当众暴露。鬼斗罗的目光扫过看台，在你这一排停了一瞬。你体内的白鹿炸了毛，冰霜从指尖往外渗。\n\n一只冰凉的手按住你的手腕。武魂殿队的替补少年苏夜坐到你身边，掌心托着一盏幽暗的冥月灯。他看见了什么，脸色发白，却低声说：「别动。」灯光一晃，遮住了你的霜气。远处，昊天斗罗一锤落下，带走了唐三和小舞。苏夜朝看台后的一条小巷偏了偏头。","choices":[{"t":"追着昊天斗罗的方向跑","hint":"回到小舞身边","chance":0.8,"win":{"text":"你跑了三天三夜，在星斗林口追上小舞。她拉住你的袖子，说哥说过五年后来接她。","d":{"bonds":{"小舞":5,"苏夜":3},"flags":["suye_knows","chased_xiaowu"],"met":["wuhun"],"trait":{"险":1,"群":1}}},"lose":{"text":"城外巡逻的执事放出魂技，你挨了一下才钻进林子，三天后才追上小舞。","d":{"伤势":25,"bonds":{"小舞":5},"flags":["suye_knows","chased_xiaowu"],"met":["wuhun"]}}},{"t":"走苏夜指的那条小巷","hint":"欠武魂殿少年一个人情","win":{"text":"小巷尽头停着去天斗的货车。你回头，苏夜已经不见了，只剩一点幽蓝的灯光。","d":{"bonds":{"苏夜":10},"flags":["suye_knows","suye_saved"],"met":["wuhun"],"trait":{"险":-1}}}}]},{"id":"n_lantern","title":"提灯人","year":2650,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M47","echo":{"flag":"suye_saved","text":"前因 · 2645：苏夜在武魂城替你遮住了霜气。"},"text":"落霞镇在星斗边缘，离星湖一夜脚程。你在镇东头开了个草药摊，手艺是姜婆婆教的，镇上人叫你白姑娘。你十九岁了，至少这具身体是。\n\n灯节那晚，一个提灯的青年站到你摊前，要一包酸枣仁，说是失眠。是苏夜。他如今是武魂殿猎队的先遣，来勘进山的路。你们沿着溪走了很远，谁也没提武魂城那一天。临别时，他把一盏素白河灯塞进你手里。\n\n「明年夏天，武魂殿要进星湖捉小舞。」他说，「教皇定的，长老带队。我不该告诉你。」那盏灯在你掌心里，暖得发烫。","choices":[{"t":"连夜赶回星湖报信","hint":"让森林早做准备","win":{"text":"大明听完只说了一句知道了。当夜，湖面起了一层封湖的雾。","d":{"bonds":{"小舞":5,"大明":5},"rep":{"魂兽":8},"flags":["warned_lake"],"trait":{"群":1,"忠":1}}}},{"t":"求苏夜给你看猎队名单","hint":"他会为你冒更大的险","need":{"魅力":40},"chance":0.7,"win":{"text":"他沉默很久，把名单摊在溪石上：菊鬼二老、黄金一代，还有一只压住气息的人面魔蛛。","d":{"bonds":{"苏夜":10},"flags":["saw_roster"],"trait":{"险":1}}},"lose":{"text":"他摇头收起了灯：「知道得越多，你越危险。」那晚他再没开口。","d":{"bonds":{"苏夜":-3},"trait":{"险":1}}}},{"t":"放灯入溪，从此两清","hint":"不留软肋","win":{"text":"河灯漂远了。你告诉自己，不把软肋交到任何人手里。","d":{"bonds":{"苏夜":-8},"flags":["cut_suye"],"trait":{"群":-2}}}}]},{"id":"n_starlake","title":"星湖","year":2651,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M52","echo":{"flag":"saw_roster","text":"前因 · 2650：你看过名单，知道人面魔蛛藏在哪片草里。"},"text":"那年夏天，菊斗罗、鬼斗罗带着黄金一代涌进星湖。队伍里那个叫唐银的蓝发青年忽然转身，满地蓝银草缠住了胡列娜和邪月——是唐三。他一个人对两个封号斗罗，一步步退，脚下的血越来越多。\n\n两极静止领域罩住了他。领域边缘，一只被魂导器压住气息的三万年人面魔蛛翘起毒螯，对准他的后心。苏夜提着灯站在领域外，脸色惨白。\n\n小舞停下脚步，回头看了你一眼。那一眼你很熟悉，是近乎温柔的决绝。十万年化形者可以把一切献给一个人，献祭者永世不得超生。\n\n你也是十万年。你离唐三比她近十步。你只有一次呼吸的时间。","choices":[{"t":"抢先把自己献给唐三","hint":"改写原著（宿命 −1）","cost":{"fate":1},"canonChange":{"node":"M52","inertia":3,"desc":"献祭者由小舞换成霜角白鹿：唐三第六环与右臂骨来自你，小舞存活"},"win":{"text":"你比小舞快了一步。白光升起时，你听见苏夜手里的灯啪地碎了。","d":{"shift":10,"bonds":{"小舞":20,"唐三":20},"flags":["sacrificed_self"],"trait":{"仁":2,"逆":2},"ending":"e1"}}},{"t":"扑到唐三身前挡下一击","hint":"改写原著（宿命 −2）","cost":{"fate":2},"canonChange":{"node":"M52","inertia":5,"desc":"星湖无人献祭：小舞存活，唐三缺失十万年第六环与魂骨，武魂殿转而追猎两头十万年"},"win":{"text":"毒螯刺穿冰甲，黑纹爬满你半边身子。小舞没有献祭，扑过来抱住了倒下的你。","d":{"shift":20,"伤势":55,"bonds":{"小舞":15,"唐三":10},"rep":{"武魂殿":-20,"魂兽":10},"flags":["blocked_strike"],"trait":{"逆":3,"险":2,"仁":1}}}},{"t":"冲进黑雾撞向鬼斗罗","hint":"关键战：撞乱两极静止","need":{"战力":800},"chance":0.3,"win":{"text":"你三撞鬼魅，领域松了一瞬，唐三挣脱。可小舞还是走向了他，粉色的光散了。","d":{"伤势":40,"名望":15,"rep":{"武魂殿":-15},"bonds":{"唐三":5},"flags":["beat_ghost","lake_free"],"trait":{"险":2}}},"lose":{"text":"鬼斗罗一掌落在你后颈。醒来时你在铁笼车里，听见他们说兔子献祭了，好在还捞着一头。","d":{"伤势":50,"rep":{"武魂殿":-5},"flags":["caged"],"trait":{"险":2}}}},{"t":"伏在雾里一动不动","hint":"原著：小舞献祭","win":{"text":"你看着粉光升起，看着唐三抱住一只小兔。指甲掐进掌心，你始终没有起身。","d":{"flags":["hid_starlake","lake_free"],"bonds":{"小舞":-5},"trait":{"险":-2,"逆":-1}}}}]},{"id":"n_cage","title":"破笼","year":2652,"cond":{"flag":"caged","notFlag":null,"levelMin":0},"canon":"M56","echo":{"flag":"suye_stories","text":"前因 · 地宫：你给苏夜讲了一整个冬天的森林。"},"text":"武魂城地宫的白玉石室，干净得像一座没有死人的坟。比比东来看过你一次，像看一件珠宝：她不要你的尸体，要你长到六十级后，自愿献祭给胡列娜。苏夜被派来看守你，他每天送药，从不点灯。\n\n可今夜城里乱了。天斗传回消息，太子雪清河就是千仞雪，她回城与教皇决裂，长老殿吵成一团，镣铐上的符文闪了几下。\n\n门外传来焱的脚步声。教皇等不及了，他来押你去献祭台，周身火焰烧得心神不宁。苏夜站在他身后，手里的冥月灯暗着，看了你一眼。","choices":[{"t":"挣断镣铐冲破第二道门","hint":"关键战：火克冰","need":{"战力":900},"chance":0.5,"win":{"text":"冰对火，你撞碎了第二道门。焱捂着冻伤的手臂没再追，城里乱得没人顾得上你。","d":{"伤势":35,"名望":10,"rep":{"武魂殿":-20},"flags":["escaped","lake_free"],"reveal":["千仞雪"],"trait":{"险":2,"逆":1}}},"lose":{"text":"火克冰。你倒在第二道门前，血把地面染成淡粉色。","d":{"伤势":60,"reveal":["千仞雪"],"ending":"e2"}}},{"t":"让苏夜熄灯替你开门","hint":"他从此回不了武魂殿","need":{"魅力":40},"chance":0.7,"win":{"text":"冥月灯熄了。苏夜替你开了三道门，在城墙下说：「往西走，别回头。」","d":{"shift":3,"bonds":{"苏夜":20},"rep":{"武魂殿":-15},"flags":["suye_defected","escaped","lake_free"],"reveal":["千仞雪"],"trait":{"群":1}}},"lose":{"text":"焱察觉了。苏夜被押进长老殿刑房，你被拖回石室，镣铐换了新的。","d":{"bonds":{"苏夜":10},"reveal":["千仞雪"],"ending":"e2"}}},{"t":"顺从地走向献祭台","hint":"认命","win":{"text":"你没有挣扎。走过长廊时，你只问焱一句：今天外面下雪了吗。","d":{"reveal":["千仞雪"],"trait":{"险":-2},"ending":"e2"}}}]},{"id":"n_jimie","title":"寂灭","year":2653,"cond":{"flag":"blocked_strike","notFlag":null,"levelMin":0},"canon":null,"echo":{"flag":"decoy","text":"前因 · 2652：你独自北上，把追兵从小舞身边引开。"},"text":"星湖之后，武魂殿的悬赏令贴满两国分殿：白发，冰属性，鹿类兽武魂，年约二十，赏格一块魂骨。唐门立起来了，可唐三没有第六环，追兵太多，你决定把他们引往北方。\n\n你过了最后一座有分殿的小城，进了终年不化的冰封森林。追来的是寂灭小队，队长厉锋是八十六级的魂斗罗，镰刃上的血槽从没干过。他们的精神探子提着一盏灯走在最后，是苏夜。\n\n夜里，一只纸鹤落在你栖身的古树上。苏夜写：「明日正午，冰原东侧，我备了替身。信我一次。」","choices":[{"t":"跃下古树迎战寂灭小队","hint":"关键战：以冰对镰","need":{"战力":950},"chance":0.45,"win":{"text":"冰原是你的拟态之地。你撑过三轮镰刃遁入暴雪，厉锋只砍下一缕白发。","d":{"伤势":40,"名望":15,"rep":{"武魂殿":-15},"flags":["beat_jimie"],"trait":{"险":2}}},"lose":{"text":"镰刃切开冰甲。你在雪里倒下，最后听见有人说：活的，教皇要活的。","d":{"伤势":60,"ending":"e2"}}},{"t":"照苏夜的计划假死","hint":"赌他骗得过魂斗罗","need":{"魅力":35},"chance":0.7,"win":{"text":"冰原上传回消息：白鹿已死，尸骨落进冰缝。悬赏令一张张被撕了下来。","d":{"bonds":{"苏夜":15},"rep":{"武魂殿":-5},"flags":["fake_death"],"trait":{"险":-1,"群":1}}},"lose":{"text":"替身被厉锋识破，你带伤滚进冰河才逃出生天。苏夜替你挨了一顿鞭子。","d":{"伤势":45,"bonds":{"苏夜":8}}}},{"t":"趁夜继续往北逃","hint":"谁也不信","win":{"text":"你在雪原上逃了整整一冬。到开春，追兵终于散了，你也瘦得只剩一把骨头。","d":{"伤势":30,"trait":{"险":-1,"群":-1}}}}]},{"id":"n_dusk","title":"王的黄昏","year":2656,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M70","echo":{"flag":"blocked_strike","text":"前因 · 2651：你替唐三挡下那一击，他至今没有第六环。"},"text":"你回到星湖时，湖水是黑的。比比东亲自进了星斗，死亡蛛皇的毒冲着两位王配，一路烧进魂核。武魂殿退了，可是太迟了。\n\n二明躺在湖边，像一座塌下的山，看见你还咧嘴：「{name}，你回来啦，长高了。」大明的鳞片翻起，底下的肉是紫的：「顶多三天。我们商量好了，把环和骨都给小三，他还差一步就是封号斗罗。」唐三跪在他们中间，说他不要。\n\n你身体里的白鹿动了一下。很多年前大明说过：霜角白鹿的角，能解百毒。在真身里折下那对角化进湖中，毒也许能冻住。可那是你武魂的根，折了它，你再也化不回完整的白鹿；而这世上欠着的东西，会挪到别处去。","choices":[{"t":"守着他们走完三天","hint":"原著：双王献祭","win":{"text":"第三天清晨，一道天青、一道金褐的光落进唐三体内。整座森林伏地低鸣。","d":{"bonds":{"二明":10,"大明":10,"唐三":5},"rep":{"魂兽":15},"flags":["kings_sacrificed"],"trait":{"逆":-2,"忠":1},"ending":"e3"}}},{"t":"化出真身折下霜角","hint":"改写原著（宿命 −1）","cost":{"fate":1},"canonChange":{"node":"M70","inertia":5,"desc":"大明二明存活，星斗不失主；唐三失去借双王献祭晋封号之路，终局推迟"},"win":{"text":"你把断角沉进湖心。整片星湖一息冻结，二明喘出了一口干净的气。","d":{"shift":15,"bonds":{"二明":20,"大明":20},"rep":{"魂兽":20},"flags":["horn_broken"],"trait":{"逆":3,"仁":2},"ending":"e4"}}}]}],"endings":[{"id":"e1","title":"结局·霜环","type":"祭","grade":2,"text":"你比小舞快了一步。人面魔蛛的毒螯刺穿冰甲时，你把手按在唐三心口，对身体里的白鹿说：去吧。白光升起，一道红环、一块冰蓝的右臂骨落进他体内。献祭者永世不得超生，可有一缕寒意留了下来：唐三握拳时，小舞靠在他肩上时，它会轻轻凉一下。二六五七年初雪，小舞穿着红嫁衣接住一片雪，那片雪很久都没有化。","afterlife":["小舞：活着走完此后每一年，从未变回兔子，也没有人需要复活她。","唐三：成神那天摊开手掌，说第六环里住着一个快了一步的朋友。","苏夜：离开武魂殿，在落霞镇开了间药铺，每年四月初八放一盏素白河灯。","星斗大森林：二明在霜泉谷捡了一整夜的霜，等它们一片片化掉。"],"worldline":"献祭者由柔骨兔换成霜角白鹿：小舞未死，唐三以霜环霜骨走完原著之路，复活小舞的执念从未出现。"},{"id":"e2","title":"结局·会走路的魂环","type":"死","grade":1,"text":"你又醒在白玉石室里。比比东告诉你，那个提灯的孩子还关在长老殿刑房。你说：「我愿意。放了他，往后不许再找他。」她轻声说，你们这些化了形的，怎么都学会了人最傻的那一套，但她答应了。仪式上胡列娜问你恨不恨她，你说不恨。白光过后，圣女多了一道十万年魂环和一块冰蓝头骨。武魂殿典籍只记了一行：环十万年，骨为头。他们把你记成了一笔收成。","afterlife":["胡列娜：嘉陵关上一人挡住三支军团，此后每年初雪都独自站在殿顶。","苏夜：被放出武魂城，在北方寒泉边搭了木屋，夜夜点着那盏冥月灯。","唐门：嘉陵关一战伤亡远重于原著，唐三从此再没提过星湖。","星斗大森林：二明封了霜泉谷，谁也不许再进去。"],"worldline":"霜角白鹿献祭武魂殿圣女：胡列娜得十万年魂环与冰蓝头骨，嘉陵关之战唐门伤亡更重。"},{"id":"e3","title":"结局·星斗新主","type":"王","grade":2,"text":"你没有折角。你化回白鹿贴着二明和大明，替他们压住烧进魂核的毒火，送他们走完最后三天。大明说：「森林交给你了。」两道光落进唐三体内，他成了封号斗罗。失主的森林引来各方猎团，第一支在你的霜天里走了七天七夜，出来时冻掉了脚趾。战后唐三带来两国约书：星湖千里，万年魂兽不得猎杀，化形者与人同律。小舞笑着说：「你待在这里，是王。」","afterlife":["大明二明：葬在冰火两仪眼旁，化作唐三跨过封号那道坎的两道光。","唐三：辞去天斗帝师之职，亲手把那封护林约书送到星湖。","苏夜：在林子边站了一夜没有进来，雪地里留下一盏素白河灯。","星斗大森林：有了新王，魂兽们重新学会认你身上的人味与雪。"],"worldline":"双王献祭如原著，但星斗未被瓜分：化形白鹿继位为王，两国立约，万年以上魂兽与化形者首次受人律保护。"},{"id":"e4","title":"结局·断角","type":"命","grade":3,"text":"折角的声音，像霜泉谷开春第一块冰裂开。你把断角沉进湖心，整片星湖一息冻结，毒被封进冰里，一层层褪成透明。二明吐出最后一口黑血，喘了一口干净的气。你的霜角冲再也凝不出来，真身头顶只剩两截断茬。唐三说：「我欠的，又多了一笔。」你说是你自己要的。终局之战来得更晚，也更难。后来，落霞镇的溪里漂着两盏素白河灯，一盏写霜，一盏写夜。","afterlife":["大明二明：都活着，二明笨手笨脚地帮初生的小鹿爬出冰窟窿。","唐三：没能借双王献祭封号，多走了一年弯路，嘉陵关也多守了一年。","苏夜：某个春天提着一包酸枣仁来敲门，说失眠一直没治好。","星斗大森林：双王犹在，没有失主，也没有被人瓜分。"],"worldline":"大明二明存活，星斗双王犹在；唐三晋封号之路改写，终局之战推迟一年且更惨烈，世界线大幅偏移。"}],"summary":"v1 beast 线改编。9 个节点：2637 化形、人间第一夜；2643 月下巨猿分回林/留人（事件归林、龙威）；2645 红花落地分追小舞/随苏夜（事件兔与鹿、雨夜传话）；2650 提灯人；2651 星湖四选：献祭改写 M52→e1，挡刀改写 M52→2653 寂灭，战鬼斗罗胜或潜伏→远海，败→2652 破笼；破笼、寂灭失败→e2；2656 王的黄昏，折角改写 M70→e4，否则 e3。魂环全部自生（门槛 50，越限 80），保留年限上限；单线宿命最多 3 点。"},{"id":"qiangu","title":"千古家族·第三代传承人","defaultName":"千古明","gender":"男","tagline":"天使要你的光，罗刹要你的暗","intro":"极北晨昏雾里，藏着不见于史册的千古家族。千二百年前，天使与罗刹撕碎了一头将要成神的龙，两半龙魂落进你家血脉。你是第三个同时生着光明圣龙与黑暗魔龙的人，家规说暗龙永不可解锁。","birthYear":2631,"startYear":2637,"faction":"千古家族（隐世）","wuhun":{"name":"光明圣龙·黑暗魔龙","type":"兽","system":"强攻","tier":"极","desc":"圣龙金白鳞甲、光焰龙息；魔龙被锁龙印封在左臂，渴血噬魂，加环有爆体之险。"},"innate":9,"attrs":{"体魄":34,"精神":38,"悟性":36,"魅力":28,"气运":22},"coins":200,"rep":{"武魂殿":-5,"天斗":0,"星罗":0,"宗门":0,"魂兽":5},"bonds":{"千古寒川":10,"夜昙":10,"千古曜":5},"flavor":{"work":{"name":"随父跑商","desc":"跟父亲的商队走冰原换盐"},"faction":{"name":"巡守晨昏雾","desc":"替家族巡雾、看守谷口"},"place":"千古谷"},"rings":[{"slot":1,"options":[{"beast":"曦光蜥","years":380,"kind":"攻","skill":"曦光龙爪","desc":"圣龙前爪凝聚日光，撕裂时附带灼烧与短暂致盲","need":{"战力":110}},{"beast":"冰棘地龙蜥","years":260,"kind":"防","skill":"棘鳞甲","desc":"圣龙鳞片竖起冰棘，近身者反被刺伤","need":{"战力":90}},{"beast":"白棘龙蜥王","years":560,"kind":"攻","skill":"白棘龙息","desc":"越限之环：一口荆棘状的光焰龙息，穿透力极强","need":{"战力":160}}]},{"slot 龙冲上半空吞掉半场的光，你咬破舌尖才把它拽回来。","d":{"伤势":35,"名望":6,"flags":["dark_exposed"],"bonds":{"比比东":5},"rep":{"宗门":-3}}}},{"t":"以光链缠斗，磨他魂力","hint":"更稳，但拖得越久左臂越疼","need":{"战力":460},"chance":0.55,"win":{"text":"你在囚笼下撑过三轮，唐三先慢了半拍，光链缠住他的手腕。他笑着收了草：「你的龙，很好。」","d":{"名望":8,"精神":2,"flags":["holy_name"],"bonds":{"唐三":6},"trait":{"险":-1}}},"lose":{"text":"第三轮时锁龙印崩开，黑龙当众出笼，满场死寂。裁判宣布你落败。","d":{"伤势":25,"名望":5,"flags":["dark_exposed"],"bonds":{"比比东":5},"rep":{"宗门":-3}}}},{"t":"撕开锁龙印，放黑龙出笼","hint":"必胜，但暗龙当众暴露","win":{"text":"黑龙一口吞掉半场的光，草笼应声而碎，唐三掌中锤影一闪即收。贵宾席上，比比东第一次站了起来。","d":{"名望":10,"伤势":15,"flags":["dark_exposed"],"bonds":{"比比东":10,"千古寒川":-8},"rep":{"武魂殿":3,"宗门":-3},"trait":{"逆":1,"险":1,"忠":-1}}},"note":"按：唐三第四环得自万年地穴魔蛛，蓝银囚笼即出自此环。"}]},{"id":"n_voices","title":"两个声音","year":2648,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M44","echo":{"flag":"dark_exposed","text":"前因 · 2645：黑龙当众出笼，那夜纪无声替你截杀了圣龙宗派来的刺客。"},"text":"大赛之后，两样东西一直压在你枕下：菊斗罗代教皇捎来的话——「等你哪天想喂它，又不想死，来找她」；还有纪无声塞给你的玉牌，刻着一盏灯，「天斗城的灯，为你留着」。随后唐昊一锤砸向武魂城，史莱克星散，你也该选一条路了。\n\n三年后，你十七岁，坐在北镇一家酒馆的吧台前。傍晚，吧台后的木板被人从底下掀开，又甜又腥的血气涌上来，左臂猛地一沉。上来的瘦高少年腰挂两把血纹刃：「下面是杀戮之都，你不该下去。」\n\n「我知道。可我身体里有个东西想下去。」他说他叫墨刃，生在下面。\n\n那夜你蜷在客栈里，听见两个声音同时在骨头里响。一个从地底传来，冷而甜：『来，做我的翼。』另一个更老，隔着千年的冰：『别听她的……我们原本是一个……到北边来。』","choices":[{"t":"握紧玉牌，回天斗投太子","hint":"走向光：做雪清河的门客","win":{"text":"你做了太子府的门客。雪清河听你说完，只轻轻按了按你的左臂，那个甜冷的声音便退远了。","d":{"flags":["path_light","told_angel"],"bonds":{"千仞雪":12,"纪无声":5,"墨刃":3},"rep":{"天斗":8},"met":["shalu","huangshi"],"trait":{"群":1,"忠":1}}}},{"t":"走下木板门，烙下罗刹印","hint":"走向暗：比比东会记住你","win":{"text":"你在杀戮之都待了一年，地狱杀戮场是黑龙替你杀出来的。血湖下的印记，烙进了暗龙。","d":{"体魄":4,"伤势":20,"flags":["path_dark","rakshasa_mark"],"bonds":{"比比东":12,"胡列娜":5,"墨刃":6},"rep":{"武魂殿":5},"met":["shalu"],"trait":{"仁":-1,"险":1}}}},{"t":"藏起声音，循北方而去","hint":"秘密只属于你","win":{"text":"你谁也没告诉，把那个更老的声音藏进骨头，往北走了半年。冰原尽头，它说得越来越清楚。","d":{"精神":4,"悟性":2,"flags":["dusk_voice"],"bonds":{"夜昙":6,"墨刃":3},"met":["shalu"],"trait":{"群":-1,"逆":1}}},"note":"按：原著中唐三化名唐银在杀戮之都约两年，与胡列娜同获杀神领域。"}]},{"id":"n_mist","title":"晨昏雾散","year":2651,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M51","echo":{"flag":"sealed_obedient","text":"前因 · 2637：觉醒那天你跪下受印，二十年来，暗龙从没见过真正的血战。"},"text":"斗罗历二六五一年，你二十岁，回到千古谷。三天里噩耗接连传来：七宝琉璃宗城堡被破，剑斗罗断臂；蓝电霸王龙宗满门一千八百余口，无一生还。\n\n第四夜，晨昏雾被烧散了。一条金鳞浊眼的巨龙压下南天，龙背上站着圣龙宗宗主拓跋希，九环封号斗罗。身后三百圣龙宗魂师，一个红衣主教展开谕令：「千古一族窝藏异端，族灭。双龙之子，活捉。」\n\n拓跋家曾给千古家看了三百年门，四十年前把旧谷的路卖给武魂殿，换走一块龙血晶，一代代喂出这条伪圣龙。祖父抽出空荡的左袖，放出他褪成象牙色的老龙：「拓跋希，你爹给我牵过马。」\n\n你守祠堂。台阶上走来六环的少宗主拓跋烈，龙口滴着金色涎水：「你家那块龙血晶，我从小喝到大。今天来尝尝原汁。」\n\n黑龙一下下撞着锁龙印：这一次，还要锁着我吗？","choices":[{"t":"只以圣龙守住祠堂","hint":"守家规，稳扎稳打","need":{"战力":950},"chance":0.4,"win":{"text":"圣龙咬穿伪龙的喉咙，拓跋烈倒在台阶上。拓跋希卷起儿子尸身退走，千古谷保住一半，祖父的魂力却碎了。","d":{"名望":10,"体魄":3,"flags":["held_valley"],"bonds":{"千古寒川":10},"rep":{"武魂殿":-10},"reveal":["拓跋希"],"trait":{"忠":1}}},"lose":{"text":"拓跋烈的龙爪按住你后颈。谷口传来祖父一声大笑，八十七级的老龙自爆，族人趁乱撤走，你被押往武魂城。","d":{"伤势":40,"flags":["captured"],"bonds":{"千古寒川":10},"rep":{"武魂殿":-10},"reveal":["拓跋希"],"trait":{"忠":1}}}},{"t":"撕开锁龙印，放黑龙上阵","hint":"暗龙克制偷来的龙血，但难收回","need":{"战力":850},"chance":0.55,"win":{"text":"黑龙一现身，伪圣龙就在它的威压下哀鸣。拓跋烈死在祠堂前，偷来的龙血化作金水渗进石缝。","d":{"名望":12,"伤势":20,"flags":["held_valley","dark_exposed"],"bonds":{"夜昙":8,"千古寒川":-5},"rep":{"武魂殿":-10},"reveal":["拓跋希"],"trait":{"逆":1,"险":1}}},"lose":{"text":"黑龙压住了伪龙，你却收不住它，被拓跋希一掌拍落。祖父自爆换族人撤走，你被押往武魂城。","d":{"伤势":50,"flags":["captured","dark_exposed"],"rep":{"武魂殿":-10},"reveal":["拓跋希"],"trait":{"险":1}}}},{"t":"护着族人从后山撤离","hint":"保住族人，丢下祠堂","win":{"text":"你背着孩子撤进冰原，回头时祖父的老龙在谷口亮成一颗太阳。他自爆了。拓跋烈追上来，扣住了你。","d":{"伤势":25,"名望":3,"flags":["captured"],"bonds":{"夜昙":6,"千古寒川":5},"rep":{"武魂殿":-10},"reveal":["拓跋希"],"trait":{"仁":2,"群":1}}},"note":"按：原著猎魂行动中，武魂殿同夜攻破七宝城堡、屠灭蓝电霸王龙宗。"}]},{"id":"n_reselect","title":"七宗重选","year":2655,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M57","echo":{"flag":"captured","text":"前因 · 2651：祖父自爆，你被押进教皇殿地牢，一年后才被放出来。"},"text":"斗罗历二六五五年，你二十四岁，戴着面具坐在武魂城七宗重选大会的看台上。这几年大陆翻了天：天斗太子雪清河原来是武魂殿的千仞雪，宫变失败退回武魂城；新七宗尽数亲附武魂殿，圣龙宗位列第四。拓跋希老了十岁，却在宗主席上笑。\n\n族里那卷从不示人的家谱，如今在你手里。千二百年前，一头活了百万年的晨昏龙渡过八劫，第九劫降临时，天使之神要它的光，罗刹神要它的暗，将它撕成两半。神界为它雕好的神座就此空着，称作留白。它把两半龙魂藏进一个千家守座武士和一个罗刹女祭司的血里，那便是千古。明暗通婚，是在等一个能把两条龙重新合起来的人。\n\n散会后，一根金羽落进你掌心：天使神座旁，龙座仍空。菊斗罗捻着菊花笑：「陛下说，拓跋希是她的狗。你若想要那条狗的命，就去找她。」\n\n左臂里那个最老的声音又响了：『到北边来。』","choices":[{"t":"去斗罗殿，站到天使身后","hint":"光之路：千仞雪的圣龙护法","win":{"text":"你做了千仞雪的圣龙护法。她看着你，像看一盏终于点亮的灯。","d":{"flags":["angel_guard"],"bonds":{"千仞雪":12},"rep":{"武魂殿":5},"reveal":["千仞雪"],"trait":{"忠":1,"群":1}}}},{"t":"握住比比东伸来的手","hint":"暗之路：罗刹之翼，拓跋希的命","win":{"text":"她教你不加环也能喂饱暗龙。从此它不再半夜咬你，只在她身后安静地睡。","d":{"伤势":-20,"flags":["rakshasa_side"],"bonds":{"比比东":12},"rep":{"武魂殿":5},"reveal":["千仞雪"],"trait":{"仁":-1,"忠":1}}}},{"t":"谁的手都不握，回双龙冢","hint":"留白之路：听清那个声音，爆体之险","need":{"精神":55},"win":{"text":"你连夜出城，穿过晨昏雾一路向北。母亲已在裂谷边等你：「暗脉的人，都会梦见这里。」","d":{"flags":["dusk_path"],"bonds":{"夜昙":8},"rep":{"魂兽":5,"武魂殿":-8},"reveal":["千仞雪"],"trait":{"逆":2,"群":-1}}}}]},{"id":"n_angel","title":"天使降临","year":2656,"cond":{"flag":"angel_guard","notFlag":null,"levelMin":0},"canon":"M76","echo":{"flag":"told_angel","text":"前因 · 2648：你把骨头里的两个声音，都告诉了当年的太子。"},"text":"武魂殿成了武魂帝国。你随天使军团上了嘉陵关，在城头远远望见唐三。他已是封号斗罗，目光落在你背后的圣龙上，像在惋惜什么。\n\n那夜千道流在天使神像下召见你，六只金翼收在身后：「千古尘的事，是我那个不成器的儿子造的孽。」他望向神座旁雕着龙的空石座，「天使从来没有坐骑。千二百年前，一头龙走到了神界门口，是天使与罗刹在它渡最后一劫时把它撕开的。千家欠千古家的，不止一个千古尘。」\n\n第二天，千道流献祭。金光冲天，千仞雪在光里展开六翼，成了神。她托着一团光走到你面前，光里旋着一道魂环：「神赐魂环，四万年。接了它，圣龙就是天使的圣龙。」她让出身后的路，路尽头是那个空了千二百年的石座。\n\n「上去吧。」她的声音近乎请求，「祖父走了。我身边，只剩你了。」","choices":[{"t":"跪上龙座，接下神赐","hint":"做天使的圣龙，一生不离","win":{"text":"你跪上石座，第七环烧成白金色的火，圣龙生出六只光翼。人们开始叫你天使圣龙。","d":{"等级":2,"ring":{"beast":"神赐魂环","years":40000,"kind":"攻","skill":"天使圣龙真身","desc":"神赐魂环：圣龙披上天使圣焰，化为六翼圣龙真身"},"flags":["angel_dragon"],"bonds":{"千仞雪":15},"reveal":["千道流"],"trait":{"忠":2},"ending":"e1"}}},{"t":"接下魂环，站着不跪","hint":"守护她，但不做谁的坐骑","win":{"text":"你接了环，没有跪。她怔了一下，然后笑了：「也好。那就站在我身边。」","d":{"等级":2,"ring":{"beast":"神赐魂环","years":40000,"kind":"攻","skill":"天使圣龙真身","desc":"神赐魂环：圣龙披上天使圣焰，化为六翼圣龙真身"},"flags":["stood_beside"],"bonds":{"千仞雪":8},"reveal":["千道流"],"trait":{"逆":1,"忠":1},"ending":"e1"}}},{"t":"在神光里转身，回北方去","hint":"辜负她，走向留白之路","win":{"text":"你没有回头。身后六翼的光暗了一瞬，再也没有人叫你的名字。","d":{"flags":["dusk_path"],"bonds":{"千仞雪":-25,"夜昙":6},"rep":{"武魂殿":-15},"reveal":["千道流"],"trait":{"逆":2,"忠":-2}}}}]},{"id":"n_rakshasa","title":"罗刹之翼","year":2656,"cond":{"flag":"rakshasa_side","notFlag":null,"levelMin":0},"canon":"M75","echo":{"flag":"rakshasa_mark","text":"前因 · 2648：杀戮之都血湖下的印记，早已烙进了你的暗龙。"},"text":"你站到了比比东身边。她从死人身上抽出怨念，一缕一缕喂进你的左臂；你看着她戴上女皇的冠，夜里独自站在殿顶，望着天斗城的方向。\n\n嘉陵关一役，鬼斗罗、菊斗罗先后战死，供奉殿收走了她的兵权。那夜她只带你一人北上，走进早已死去的杀戮之都。干涸的血湖底埋着一座神殿，壁画上罗刹神手持巨镰，身边盘着一条黑龙。那龙只有半边身子，另一半齐齐撕去，只剩空白。\n\n「我说过不在乎它原本是什么。我骗了你。」她背对着你，「我也是双生武魂。给第二武魂加环那年，没有人替我扛，我一个人在黑屋子里疼了三天三夜。」\n\n湖底传来低沉的龙吟，是一头五万年的渊底冥蛟。「第一武魂没满九环就给第二武魂加环，一半的人会炸。我替你扛。代价是，暗龙从此烙着罗刹的印。」\n\n骨头深处，那个最老的声音叹了一声：『你若答应她，我们就再也合不上了。』","choices":[{"t":"让她亲手为暗龙加环","hint":"第二武魂加环，罗刹之印永不褪去","win":{"text":"三天三夜，她一直握着你的手，把炸开的那一半一口口吞下。你醒来时，暗龙鳞上多了一道镰形血印。","d":{"等级":2,"ring":{"beast":"渊底冥蛟","years":50000,"kind":"攻","skill":"罗刹魔龙真身","desc":"第二武魂第一环：暗龙烙上罗刹神印，以怨念为食"},"flags":["rakshasa_wing"],"bonds":{"比比东":15},"reveal":["噬魂蛛皇"],"trait":{"忠":2},"ending":"e2"}}},{"t":"先要她许诺不动千古家","hint":"族人平安；她会记住你讨价还价","win":{"text":"她看了你很久：「你和我年轻时一样，会讨价还价。」她答应了，然后握住了你的手。","d":{"等级":2,"ring":{"beast":"渊底冥蛟","years":50000,"kind":"攻","skill":"罗刹魔龙真身","desc":"第二武魂第一环：暗龙烙上罗刹神印，以怨念为食"},"flags":["valley_spared"],"bonds":{"比比东":8,"夜昙":5},"reveal":["噬魂蛛皇"],"trait":{"群":1,"忠":-1},"ending":"e2"}}},{"t":"收回暗龙，独自北上","hint":"辜负她，走向留白之路","win":{"text":"你收回左臂，退出神殿。她没有追，只在你身后说了一句：「你会后悔的。」","d":{"flags":["dusk_path"],"bonds":{"比比东":-25,"夜昙":6},"rep":{"武魂殿":-15},"reveal":["噬魂蛛皇"],"trait":{"逆":2,"忠":-2}}}}]},{"id":"n_tomb","title":"双龙冢","year":2656,"cond":{"flag":"dusk_path","notFlag":null,"levelMin":0},"canon":null,"echo":{"flag":"dusk_voice","text":"前因 · 早年：你从小就听得见那个最老的声音，它一直叫你到北边来。"},"text":"母亲陪你顺着冰壁走进裂谷最深处。冰层透明如水晶，封着一具大得望不到边的龙骨，从头到尾被齐齐劈开，左半白如玉，右半黑如墨，裂缝里千二百年来一直渗着灰光。\n\n灰光凝成一道影子，鳞片半明半暗，眼睛是灰的。『你来了，第三个。』它叫晨昏。『千古长宁太怕暗，千古尘被人逼着合，光太亮。两个都炸了。』\n\n办法只有一个：冰原上那头双首蛟，是它的血渗进冰里养出来的，一首白一首黑，四万七千年。斩了它，让两条龙同时咬住那唯一一道环，谁也不许多吃一口。越限的那一份，由合一的龙身和它的残魂来扛。成了，你才有资格去渡它没渡完的第九劫；不成，你会炸。\n\n「一半一半。」母亲按住你左臂上发烫的锁龙印，「你要是怕，现在回头，娘陪你回去。」\n\n冰窟深处，一白一黑两颗蛟首探了出来。你身体里的两条龙，第一次没有互相推挤。","choices":[{"t":"独自下冰窟，斩蛟同环","hint":"胜则双龙合一，败则暗龙替你而碎","need":{"战力":1250},"chance":0.5,"win":{"text":"两条龙同时咬住那道环，一口不多，一口不少。你走出冢底时，身体里只剩一条灰金色的龙。","d":{"等级":3,"体魄":5,"精神":5,"ring":{"beast":"双首晨昏蛟","years":47000,"kind":"攻","skill":"晨昏龙真身","desc":"晨昏同环：光暗双龙合为一条晨昏龙，呼吸间光暗互换"},"flags":["dusk_one"],"trait":{"险":2,"群":-1}}},"lose":{"text":"暗龙多吃了一口。千钧一发之际，它从你身体里挣出去，替你碎在了冰窟里。","d":{"伤势":60,"flags":["dragon_lost"],"ending":"e4"}}},{"t":"请母亲以暗脉之血护阵","hint":"母亲压住白首，胜算更大","need":{"战力":1100,"精神":55},"chance":0.65,"win":{"text":"母亲的黑龙压住白首，你一爪斩下黑首。同环时，她替你稳住了暗龙那一半。","d":{"等级":3,"精神":4,"ring":{"beast":"双首晨昏蛟","years":47000,"kind":"攻","skill":"晨昏龙真身","desc":"晨昏同环：光暗双龙合为一条晨昏龙，呼吸间光暗互换"},"flags":["dusk_one"],"bonds":{"夜昙":15},"trait":{"群":2}}},"lose":{"text":"母亲替你挡下白首的龙息，暗龙却在同环时失了衡。它挣出去，替你和她碎在了冰里。","d":{"伤势":50,"flags":["dragon_lost"],"bonds":{"夜昙":10},"ending":"e4"}}},{"t":"不合了，跟母亲回家","hint":"不赌命；神座继续空着","win":{"text":"你转身要走，暗龙却自己挣出左臂扑向黑首。它咬断了蛟颈，也在同环之前碎在了冰里。","d":{"伤势":20,"flags":["dragon_lost"],"bonds":{"夜昙":8},"trait":{"险":-2},"ending":"e4"}},"note":"按：原创设定。魂兽百万年后须渡九劫成神，从无成功先例。"}]},{"id":"n_ninth","title":"第九劫","year":2657,"cond":{"flag":"dusk_one","notFlag":null,"levelMin":0},"canon":"M83","text":"晨昏的残影跟在你身边，淡了许多。『第九劫，是光与暗同时落在你身上。千二百年前，我没扛住。』\n\n斗罗历二六五七年，嘉陵关。天裂成两半：一半金光，千仞雪六翼遮天，天使圣剑亮如劈开世界的闪电；一半漆黑，比比东拖着罗刹魔镰，身后万鬼哀嚎。两尊神并肩而立，海神唐三的身体正从天上坠落，扎辫子的姑娘扑向他坠落的方向。\n\n第二道合击已经蓄满。金光与黑光拧成一股斜劈而下，劈向城头两个须发皆白的老人：剑斗罗尘心，骨斗罗古榕。一个白衣女子拔剑冲出，剑上凝霜，是林照：「师父——」\n\n她来不及。谁都来不及。\n\n『就是这里。』晨昏轻笑，『光与暗同时落下的地方。』\n\n迎上去，就是从命运手里硬抢下两个人，也是让那两个都向你伸过手的人看见，你选了谁都不是的路。你也可以只送出曾属于暗龙的那一半，替你挨这一下。","choices":[{"t":"张开龙翼，迎上合击","hint":"改写原著（宿命 −2）：尘心、古榕生还","cost":{"fate":2},"canonChange":{"node":"M83","inertia":4,"desc":"剑斗罗尘心、骨斗罗古榕在天使与罗刹的第二道合击下生还"},"win":{"text":"金光与黑光在你龙翼上撞成一团，被晨昏龙一口吞下，光化成暗，暗化成光，在你脚下凝成第十道灰金魂环。","d":{"等级":5,"shift":15,"flags":["dusk_god"],"bonds":{"林照":20},"rep":{"天斗":10,"宗门":10},"trait":{"逆":3,"仁":2},"ending":"e3"}}},{"t":"只把暗半身送进劫光","hint":"原著不变；暗龙替你承劫","win":{"text":"曾属于暗龙的那一半迎了上去，在劫光里碎成黑雪。劫过去了，城头那两个老人还是倒下了。","d":{"flags":["dragon_lost"],"bonds":{"林照":3},"trait":{"逆":-2,"险":-1},"ending":"e4"}}}]}],"endings":[{"id":"e1","title":"结局·圣龙侍天","type":"光","grade":2,"text":"你陪她走完了剩下的路。她被观音泪击碎心脏，你抱她到海边看了三天海。后来修罗魔剑落下，比比东挡在了女儿身前。\n\n那天傍晚，千仞雪亲手碎了神位，六翼片片剥落，她落进你的龙翼里，轻得像一片雪。唐三赦免了她：「你们可以走了。」\n\n你带她回了北方。她站在晨昏雾边问：「这里一直是这样吗？」「一直是。」「真好，没人分得清是天亮还是天黑。」雾里，她学会了生火，你学会了沏茶。","afterlife":["千仞雪：碎神位成了凡人，随你在晨昏雾里终老，再没提过神座。","比比东：替女儿挡下修罗魔剑，临终吐出埋了二十多年的真相。","唐三：成海神，与小舞双神共存，赦免了千仞雪与胡列娜。","千古家族：千家与千古家的千年旧怨了结，留白神位依旧空置。"],"worldline":"千仞雪身边多了一条圣龙；终局照旧，晨昏神位继续空置。"},{"id":"e2","title":"结局·罗刹之翼","type":"暗","grade":2,"text":"比比东在废墟神殿接下罗刹传承，你的罗刹魔龙盘在她身后，替她挡下每一道射向后背的光。\n\n最后一战，修罗魔剑落下时，她没有看你，她看着女儿。你扑上去已经晚了，魔剑穿透了她的胸口。她轻得像一捧灰：「去北边……把我的镰刀埋在那条龙旁边。它们分开太久了。」\n\n你把半柄魔镰埋进双龙冢，埋在劈成两半的龙骨旁，做了守冢人。暗龙常趴在冰面上，听冰下那半边白骨和一柄黑镰挨得很近。","afterlife":["比比东：死于修罗魔剑之下，魔镰残片与晨昏龙白骨同眠冰底。","千仞雪：碎神位后得赦，此生再没踏进极北一步。","胡列娜：得赦后北上一次，在双龙冢前替老师上了一炷香。","千古家族：族人每年来冢边一回，带来南边天斗与星罗的消息。"],"worldline":"罗刹神身边曾有一条龙；终局照旧，魔镰残片被埋进双龙冢。"},{"id":"e3","title":"结局·晨昏","type":"神","grade":3,"text":"你身后，尘心和古榕还站着，林照扑在师父身前，剑还在抖。\n\n晨昏的残影化作灰金光点融进龙鳞：『引路的，总要献上自己。我就是你了。』空了千二百年的神座终于刻上名字：晨昏之神，不属光暗，司掌昼夜交接的一刻。\n\n比比东的神魂经过神界门口，看见你笑了：「原来你选了这个。」「我谁都没选。」「这才是最难的。」\n\n你把祠堂八字凿成：明暗同族，亦可同身。晨昏雾散了，孩子们第一次看见日出。","afterlife":["尘心与古榕：生还于嘉陵关，此后同守七宝琉璃宗二十年。","林照：师父活了下来，她把那一挡之恩记成了一生的交情。","比比东：神魂过神界门口时与你相见，说你选了最难的那条路。","千古家族：走出极北，日出日落时天边常有灰金色的龙影掠过。"],"worldline":"空置千二百年的晨昏神位有了主人；尘心、古榕生还，千古家族走出极北。"},{"id":"e4","title":"结局·留白","type":"凡","grade":1,"text":"暗龙走了。最后那一刻是它先扑上去的，回头望你那一眼，没有饿，也没有恨。圣龙蜷在你胸口，哭得像条刚破壳的小龙。晨昏的残影散了，神座继续空着。\n\n你回谷做了家主，先废了明暗通婚：「以后谁喜欢谁，就娶谁嫁谁。生一条龙，就好好养一条。」\n\n南边的世界照原样走完了它的路。你没凿掉祠堂那八个字，只在底下刻了一行小字：此处留白。孩子问起，你说这里本该有个故事，总会有人来写完。","afterlife":["夜昙：亲手拆下你左臂的锁龙印，放进祠堂，与前两方并排。","晨昏：残魂散于双龙冢，千二百年的等待到此为止。","千仞雪与比比东：一个碎了神位，一个替女儿而死，一切如原著。","千古家族：废除明暗通婚，双龙之子的传承就此断绝。"],"worldline":"原著终局不变；晨昏神位继续空置，双龙之子的传承就此断绝。"}],"summary":"九节点：2637觉醒→2645半决赛对唐三（强检定，败或放龙则暗龙暴露）→2648北镇两个声音（光/暗/晨昏）→2651晨昏雾散对拓跋烈（强检定，败则被俘）→2655七宗重选三岔：天使e1、罗刹e2、双龙冢同环（强检定，败e4） ,"notFlag":null},"w":2,"once":false,"text":"地狱杀戮场今天十人进场，看台上有人开了盘口。一个老手被几个新人盯上，赔率一赔三。你认得他的步子——他的左膝有旧伤，转身时会慢半拍。","choices":[{"t":"押老手输","need":{"金魂币":50},"chance":0.6,"win":{"text":"第七个倒下的就是他。庄家脸色铁青，把金魂币一枚枚数给你。","d":{"金魂币":120,"精神":1,"trait":{"险":1}}},"lose":{"text":"老手拖着伤腿活到了最后。你那五十金魂币，进了庄家的口袋。","d":{"金魂币":-50}}},{"t":"不赌，只看他的刀","win":{"text":"你看完一整场，记下三种城里人才会的阴招。","d":{"悟性":2,"trait":{"险":-1}}}}]},{"id":"ev_bat_pen","title":"兽栏里的血蝠","when":{"yearMin":2645,"yearMax":2649,"levelMin":25,"flag":null,"notFlag":null},"w":2,"once":true,"text":"王座底下的兽栏关着猎血队带回的魂兽。最深处那只赤翼血蝠不吃生肉，只舔铁栏上的血。你走近时它没有叫，把鼻尖凑过来嗅你，像嗅一个同类。","choices":[{"t":"伸手让它舔你的血","need":{"精神":30},"chance":0.5,"win":{"text":"它舔完就睡了。那夜你的血烧得滚烫，醒来时魂力异样地顺服。","d":{"精神":4,"flags":["overlimit"],"trait":{"险":2}}},"lose":{"text":"它咬穿了你的手腕。你三天说不出话，梦里全是红眼睛。","d":{"伤势":35,"气运":-2}},"note":"按：获得越限资格。原创设定：城里人的血都与王同源。"},{"t":"退出兽栏","win":{"text":"你退到门外。身后，那双红眼睛一直跟着你。","d":{"trait":{"险":-1}}}}]},{"id":"ev_snow_lotus","title":"冰缝里的雪莲","when":{"yearMin":2640,"yearMax":2649,"levelMin":15,"flag":null,"notFlag":null},"w":2,"once":true,"text":"随猎血队出城的第二夜，你在冰缝底下看见一株血色雪莲，花心凝着霜。血卫说那是魂兽的口粮，守着它的东西就在附近。离回城的期限，只剩一天。","choices":[{"t":"下冰缝去摘","need":{"体魄":32},"chance":0.55,"win":{"text":"你吞下花瓣，冷得牙齿打颤。那之后修炼，魂力像化开的冰水。","d":{"体魄":3,"悟性":3,"trait":{"险":2}}},"lose":{"text":"冰缝里的雪蛛咬了你一口。血卫把你拖回城，你昏了五天。","d":{"伤势":40}}},{"t":"记下位置，下次再来","win":{"text":"你在冰上刻了个记号。下一趟再来，那株花已经不见了。","d":{"气运":1,"trait":{"险":-1}}}}]},{"id":"ev_suye_lamp","title":"冥月灯","when":{"yearMin":2647,"yearMax":2649,"levelMin":0,"flag":null,"notFlag":null},"w":3,"once":true,"text":"北镇酒馆里，那个托灯的年轻人又在等。他说自己叫苏夜，替圣女候选守在门口。冷白的灯火朝你一晃，他的脸色变了：「抱歉，灯会自己看。」","choices":[{"t":"问他看见了什么","win":{"text":"「一个场子，一炷香。」他把灯收起来，像把看见的东西一起收走。","d":{"精神":1,"bonds":{"苏夜":5},"met":["wuhun"],"trait":{"群":1}}}},{"t":"叫他别再看了","win":{"text":"他愣了一下，灯火暗下去：「好。」那之后，他再没照过你。","d":{"bonds":{"苏夜":2},"met":["wuhun"],"trait":{"群":-1}}}}]},{"id":"ev_qiangu","title":"北镇来客","when":{"yearMin":2648,"yearMax":2649,"levelMin":0,"flag":nul 边半夜，是她用鹿角把你拱醒的。","d":{"伤势":30,"精神":2,"bonds":{"白霜":4},"met":["beast"]}},"note":"按：白霜是十万年霜角白鹿化形，冰露是她的本源之物。"},{"t":"还给她，叫她快走","win":{"text":"她愣了愣，把冰露收回去，转身消失在雾里。","d":{"bonds":{"白霜":8},"rep":{"魂兽":3},"met":["beast"],"trait":{"仁":1}}}}]},{"id":"ev_yuheng","title":"斗魂场的蓝电","when":{"yearMin":2652,"yearMax":2655,"levelMin":0,"flag":null,"notFlag":null},"w":3,"once":true,"text":"天斗城斗魂场，生死斗的对手是个手臂缠着蓝电的年轻人。他打得像不想活了，每一拳都冲着要害。台下有人说，他是蓝电霸王龙宗灭门那夜逃出来的。","choices":[{"t":"打晕他，认输下台","win":{"text":"你收刀认输。他在台上躺了很久，才哑着嗓子问你的名字：玉衡记住了。","d":{"名望":-2,"bonds":{"玉衡":6},"met":["landian"],"trait":{"仁":1}}}},{"t":"按生死斗规矩打","need":{"战力":850},"chance":0.55,"win":{"text":"你赢了，没下死手。他被抬下台时，眼里全是恨。","d":{"金魂币":200,"名望":6,"bonds":{"玉衡":-4},"met":["landian"],"trait":{"仁":-1}}},"lose":{"text":"蓝电劈穿了你的肩。他举着拳头站了很久，没打下最后一拳。","d":{"伤势":45,"bonds":{"玉衡":2},"met":["landian"]}}}]},{"id":"ev_red_fog","title":"冰原红雾","when":{"yearMin":2654,"yearMax":2656,"levelMin":50,"flag":null,"notFlag":null},"w":3,"once":true,"text":"北边商路上传着怪事：冰原上有一团红雾，雾里站着个白头发的人，一整支商队一个都没回来。你手背上的暗紫血管，这几夜跳得格外厉害。","choices":[{"t":"循着红雾追上去","need":{"精神":45},"chance":0.5,"win":{"text":"你在雪窝里找到一个活口。他说雾里有人在哼歌，哼的是海。","d":{"精神":3,"气运":2,"flags":["fog_trail"],"trait":{"险":1}}},"lose":{"text":"红雾掠过你藏身的山脊，你的血沸了，跪在雪里一夜没站起来。","d":{"伤势":40}}},{"t":"去天斗报官","win":{"text":"官府记下了，没人信。可商路还是封了半年。","d":{"名望":2,"rep":{"天斗":3},"trait":{"险":-1}}}}]}],"nodes":[{"id":"n_ten_one","title":"十人活一","year":2644,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":null,"echo":null,"text":"你十五岁那年，父亲已经交了十二年的血，每月四杯。他的指甲是青的，夜里会无缘无故醒来喘气。血卫敲门：「墨沉，你交不起了。今年你家出一个人进场。」\n\n父亲说他去。你趁夜也报了名，算好你们不会同场。三天后走进铁门，你在对面那排人里看见了他。黑铁王座上那团影子一动不动——把你们分进一场，不是巧合。\n\n钟响。沙是暗红的，父亲始终护在你左边，用肩膀替你吃了疤狼那一刀。最后场上只剩两个人。香已烧过大半，城规写着：香尽时还站着两个，两个都死。父亲把刀柄塞进你手里，刀尖抵着自己心口：「这城只有一条规矩是真的，活下去。你娘和我拿血换了你十五年，别让我们亏本。」\n\n王座上的人，微微向前倾了倾身子。","choices":[{"t":"握住父亲的手，让他做完","hint":"你会活下来，城规从此刻进骨头","win":{"text":"香灰落下前，他把最后的力气压进了你手里。你活着走出铁门，城规刻进了骨头。","d":{"名望":6,"精神":2,"bonds":{"墨沉":10},"flags":["city_law"],"trait":{"仁":-2,"逆":-1,"忠":1}}}},{"t":"扔下双刃，跪在他身边","hint":"违背城规等于求死，除非王开口","win":{"text":"满场哗然。王第一次开口：「两个都留下。」三天后，父亲死在石屋里，死在你身边。","d":{"伤势":10,"bonds":{"墨沉":10,"杀戮之王":10},"flags":["threw_blades","king_page"],"trait":{"仁":2,"逆":1,"险":1}}}}]},{"id":"n_tangyin","title":"唐银与狐狸","year":2647,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M44","echo":{"flag":"threw_blades","text":"前因 · 2644：王留下了你，你成了他的血侍，知道了满城喝的血腥玛丽，都是王的血。"},"text":"三年里你进了四十一次场，黑巷的人压低声音叫你「墨家那把刀」。这一年，城里来了两个新人。\n\n先来的是个狐狸眼的女孩，北镇酒馆里，一个托着冷白灯火的年轻人送她到木板边。她一口喝干血腥玛丽，冲你笑：「城里生的？味道不一样。」她叫胡列娜。半个月后又来一个年轻人，脸平平无奇，眼睛静得出奇，酒下肚时眼底闪过一点紫。他说他叫唐银。\n\n血酒馆里，三个老手围住胡列娜，第三个从背后压低了刀。你的手刚摸到腰间，角落里唐银的手指轻轻一弹，那人捂着手腕跪下——那种伤口不是刀，是某种极小极快的东西。\n\n当夜两个人都来找你。胡列娜坐在血湖边：「帮我活到走地狱路那天，我带你干干净净出城。」唐银等在石屋门口：「我需要一个懂这座城的人。我不问你的过去。」","choices":[{"t":"和唐银结盟","hint":"他什么都不缺，除了这座城的门道","win":{"text":"你教他哪条巷子的血卫换岗最慢。他按住你的手腕：「急和快不一样。你的刀在怕。」","d":{"悟性":3,"bonds":{"唐三":10},"flags":["ally_tang"],"trait":{"群":1}}}},{"t":"接受胡列娜的交易","hint":"武魂殿的承诺，要到城外才兑现","win":{"text":"你替她挡下三刀，都是从背后来的。她第一次没冲你笑：「为什么？」","d":{"魅力":3,"bonds":{"胡列娜":10},"rep":{"武魂殿":5},"flags":["ally_hu"],"trait":{"险":1}}}},{"t":"谁也不跟，独自进场","win":{"text":"你照旧一个人进场。城里人说，墨家那把刀，从不跟人背靠背。","d":{"体魄":2,"名望":5,"flags":["lone_blade"],"trait":{"群":-2}}}}]},{"id":"n_hell_road","title":"地狱路","year":2649,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M44","echo":{"flag":"ally_tang","text":"前因 · 2647：你和唐银背靠背打了一年。他说：两年后，天斗城。"},"text":"唐银比你早一个月赢满一百场，胡列娜晚他几天。三天后，他们从王座背后那道门里走了出来，身上罩着一层薄薄的红雾——杀神领域。千年来，地狱路只走出过八个人。\n\n现在轮到你。第一关，洞顶挂满血蝙蝠，它们落在你肩上嗅了嗅，又飞走了，像嗅到同类。第二关，一条十首巨蛇死在滚烫的石厅里，伤口干净利落，内丹已被取走——你认得那种干净。\n\n第三关很黑。黑暗里亮起一点香头似的红光，光下站着穿旧皮甲的父亲，腰侧带伤，握着你接过的那把刀。「{name}，过来。」他一步步走近，「这城只有一条规矩是真的。你忘了？」\n\n他抬起了刀。","choices":[{"t":"拔刀，斩了这道影子","hint":"关键战：心魔会随你的恐惧变强","need":{"战力":600},"chance":0.5,"win":{"text":"刀穿过影子，没有声音。你走出门，红雾落在你身上，凉得像血湖的水。","d":{"等级":3,"精神":3,"名望":10,"flags":["shashen"],"trait":{"险":1,"仁":-1}}},"lose":{"text":"影子的刀比你快。血卫把你拖出来时，你不记得自己是怎么倒下的。","d":{"伤势":60,"flags":["failed_road"],"trait":{"险":1}}}},{"t":"放下双刃，走到他面前","hint":"心魔不一定要用刀来破","need":{"精神":38},"win":{"text":"你把刀放在他脚边。影子抬手按了按你的头，像你六岁那年。然后它散了。","d":{"等级":3,"精神":5,"名望":10,"bonds":{"杀戮之王":8},"flags":["shashen","laid_down"],"trait":{"仁":2,"逆":1}}},"note":"按：原著心魔关靠意志硬闯，放刀破心魔是本线原创。"},{"t":"转身，退出地狱路","hint":"活下去，但再没有第二次","win":{"text":"你退出了门。王说过，回头的人这辈子别想再进第二次。可你活着。","d":{"flags":["turned_back"],"trait":{"险":-2}}}}]},{"id":"n_swan_kiss","title":"雪色天鹅吻","year":2649,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M44","echo":{"flag":"shashen","text":"前因 · 2649：你从地狱路走了出来，身上多了一层红雾。"},"text":"那一夜唐银带你去了血湖。湖面暗红，没有风也在起伏，像在呼吸。他从怀里拿出一朵雪白的花，花瓣弯得像低下脖子的天鹅：「雪色天鹅吻。它不杀人，只让毒长得快上千百倍。」\n\n「城里还有人。」你说，「还有孩子。」\n\n「这湖不干，城就一直在。还会有人爬进来，还会有孩子在六岁那年喝下第一杯整的。」他看着你，「你是在这儿生的。我想听你说一句。」\n\n你什么也没说出来。花落进湖里，沉了。湖面翻成发黑的紫，甜腻的毒雾漫向四方，王座方向传来成千上万只蝙蝠张嘴的嘶吼，钟楼响了。胡列娜从雾里冲出来：「上层有暗道，武魂殿的人在出口接应！」\n\n黑巷那边，有孩子在哭。","choices":[{"t":"挡在唐银身后截血卫","hint":"关键战：他会记得是谁守住了湖边","need":{"战力":650},"chance":0.6,"win":{"text":"血卫一排排扑上来，你一个人守住了湖岸。唐银走前回头看了你一眼。","d":{"名望":6,"bonds":{"唐三":10},"flags":["side_tang","rearguard"],"trait":{"忠":1,"险":1}}},"lose":{"text":"你挡下七个，第八个的铁钩撕开了你的背。唐银把你扛出了毒雾。","d":{"伤势":50,"bonds":{"唐三":6},"flags":["side_tang"]}}},{"t":"跑回黑巷，把孩子背出去","hint":"能救几个是几个","win":{"text":"老鸦塞给你几瓶解药，自己留下了。你背出九个孩子，紫月在身后灭了。","d":{"伤势":25,"bonds":{"老鸦":6,"唐三":4},"rep":{"天斗":3},"flags":["side_tang","saved_kids"],"trait":{"仁":2,"群":1}}},"note":"按：老鸦配了三十年解药，只够孩子用，原创设定。"},{"t":"护着胡列娜从暗道出城","hint":"武魂殿会欠你一个人情","win":{"text":"暗道尽头是武魂殿的斗篷。她回头看了一眼毒雾：「千年之约，这回算我欠你。」","d":{"bonds":{"胡列娜":10},"rep":{"武魂殿":8},"flags":["side_hu"],"trait":{"群":1,"逆":-1}}}}]},{"id":"n_gengxin","title":"庚辛城的炉火","year":2651,"cond":{"flag":"side_tang","notFlag":null,"levelMin":0},"canon":"M55","echo":{"flag":"saved_kids","text":"前因 · 2649：你背出来的九个孩子，如今住在天斗城外的孤儿院。"},"text":"出城后的两年，你在天斗城外打生死斗。断了血腥玛丽，头半年像死过一回；熬过去，魂力像决堤的河——那座城压了你二十年。\n\n二六五一年春，天斗城都在传两件事：蓝电霸王龙宗一夜灭门；城南新起了一个唐门。宗主怀里抱着一只一动不动的粉白小兔：「我说过，两年。我叫唐三，唐银是城里用的名字。」\n\n一个月后，你随他去了庚辛城。那一夜唐门屠武魂殿主殿，你在回廊尽头堵住一个肩头带伤的人。他掌心一盏冷白的灯，被风吹得明明暗暗——当年在北镇送胡列娜下台阶的，就是他。\n\n「是你。」苏夜说，「城里出来的那个。」回廊那头，唐门弟子的脚步声越来越近。","choices":[{"t":"放那个提灯的人走","hint":"唐三不会问，但他会知道","win":{"text":"你侧身让开。他走过你身边时低声说：「我欠你一次。」唐三没问，但他知道。","d":{"等级":3,"bonds":{"苏夜":10},"flags":["joined_tangmen","spared_suye"],"met":["wuhun"],"trait":{"仁":1,"忠":-1}}}},{"t":"把他押到唐三面前","hint":"苏夜会记得是你押的","win":{"text":"唐三看了苏夜很久，放他走了。苏夜记得，押他来的是你。","d":{"等级":3,"bonds":{"唐三":6,"苏夜":-8},"rep":{"武魂殿":-5,"宗门":5},"flags":["joined_tangmen"],"met":["wuhun"],"trait":{"忠":1}}}}]},{"id":"n_star_lake","title":"星湖","year":2651,"cond":{"flag":"side_hu","notFlag":null,"levelMin":0},"canon":"M52","echo":{"flag":"ally_hu","text":"前因 · 2647：你在城里替胡列娜挡过三刀。"},"text":"武魂殿兑现了承诺。档案上你是北境猎户之子；胡列娜封圣女那天，你成了圣女身边的刀。断了血腥玛丽，头半年像死过一回，之后魂力像决堤的河。她请你吃了十串冰糖葫芦，你吃到第三串就酸皱了脸。\n\n二六五一年，教皇下令去星斗大森林猎十万年魂兽。菊鬼二老压阵，邪月、焱、苏夜都在。胡列娜带来一个人，眼睛亮得惊人：「他也是城里出来的。」唐银朝你拱了拱手。夜里，湖雾中有个白发女孩赤脚站在冰碴上，看着营火。\n\n第五天，星湖。天青牛蟒与泰坦巨猿破水而出，唐银反水，蓝银草暴起，黑锤在手。粉色的光从被围的女孩身上升起，落进他的身体。菊斗罗尖声叫出：唐三。邪月的月刃已在你身边亮起，胡列娜踉跄着退到悬空的碎石边。","choices":[{"t":"护住胡列娜，拖离湖岸","hint":"她会记住谁在她最难看时站在前面","win":{"text":"你把她拖离碎石。她攥着你的袖子，指节发白，一句话也没说。","d":{"等级":3,"bonds":{"胡列娜":10},"rep":{"武魂殿":5},"flags":["saint_blade"],"met":["wuhun"],"trait":{"忠":1}}}},{"t":"横刀替唐三挡月刃","hint":"关键战：邪月不会认错第二次","need":{"战力":800},"chance":0.5,"win":{"text":"月刃撞上你的刀，偏了半尺。没人看清是谁出的手，除了唐三。","d":{"等级":3,"bonds":{"唐三":10,"胡列娜":-5},"flags":["saint_blade","helped_tang_lake"],"met":["wuhun"],"trait":{"逆":1,"险":1}}},"lose":{"text":"月刃劈开了你的刀和肩。邪月盯着你，没有再出第二刀。","d":{"等级":3,"伤势":50,"bonds":{"唐三":5},"flags":["saint_blade"],"met":["wuhun"]}}},{"t":"去雾里放走白发女孩","hint":"放她走，比猎她难","win":{"text":"你冲她摆了摆手。她后退一步，又一步，消失在雾里。","d":{"等级":3,"bonds":{"白霜":10},"rep":{"魂兽":8,"武魂殿":-5},"flags":["saint_blade","spared_baishuang"],"met":["wuhun","beast"],"trait":{"仁":2,"逆":1}}},"note":"按：白霜是十万年霜角白鹿化形，也在这次猎捕名单上。"}]},{"id":"n_ruins","title":"紫月的残骸","year":2654,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":null,"echo":{"flag":"crow_poison","text":"前因 · 2636：你跟老鸦认过毒，认得他那一手字。"},"text":"城毁后第五年，从城里出来的人开始死于一种热病：紫月该升起的夜里，血自己烧三天，第三天人就没了。你咬着刀柄熬过第一次，手背血管成了暗紫，梦里的王座后面全是红眼睛。\n\n你独自北上。北镇酒馆塌了一半，石阶断成几截。杀戮之都还在，只是死了：血湖干成黑亮的硬壳，王座裂成两半，面具不见了。石室深处有一道你没见过的门，门口靠墙坐着一具骸骨，一侧眼窝还缠着黑布，怀里抱着油布包好的一摞纸。是老鸦。\n\n纸上抄着门后的刻纹：执剑的修罗，执镰的罗刹；修罗第八考，曰守狱。最后半行是：「城毁那夜，王没有死。蝠王也没有。它会去找」\n\n门后亮起一对、两对、三对红眼睛——是同一只。四万年的渊影魔蝠在嗅你。你的双刃发烫，血纹正一寸寸变成暗金。","choices":[{"t":"斩了魔蝠，读完最后一页","hint":"关键战：你会知道王在等什么","need":{"战力":1000},"chance":0.55,"win":{"text":"魔蝠倒下时，双刃已成暗金长刃。你读完了：王即守狱者，他在等一个能杀而不杀的人。","d":{"等级":2,"ring":{"beast":"渊影魔蝠","years":42000,"kind":"攻","skill":"修罗血刃·真身","desc":"器魂真身：双刃化为暗金长刃，刃过之处吞噬魂力"},"bone":{"slot":"右臂","name":"渊蝠臂骨","desc":"臂上可化出半透明骨刃，命中时吸走对手少量魂力","attrs":{"体魄":4,"精神":4}},"bonds":{"老鸦":5},"flags":["know_trial","wuhun_mutated"],"trait":{"逆":1,"险":1}}},"lose":{"text":"魔蝠撕开你的胸口逃进黑暗。你抱着译稿爬出来，血纹已变成暗金。","d":{"伤势":65,"flags":["know_trial","wuhun_mutated"]}}},{"t":"斩了魔蝠，封上门和笔记","hint":"关键战：有些秘密，不知道也能活","need":{"战力":1000},"chance":0.55,"win":{"text":"你把老鸦和他的三十年一起封进石室。有些秘密，不知道也能活。","d":{"等级":2,"ring":{"beast":"渊影魔蝠","years":42000,"kind":"攻","skill":"修罗血刃·真身","desc":"器魂真身：双刃化为暗金长刃，刃过之处吞噬魂力"},"bone":{"slot":"右臂","name":"渊蝠臂骨","desc":"臂上可化出半透明骨刃，命中时吸走对手少量魂力","attrs":{"体魄":4,"精神":4}},"flags":["wuhun_mutated","sealed_ruins"],"trait":{"逆":-1}}},"lose":{"text":"你没斩下它，只来得及合上那道门。门后的嗅声，很久才停。","d":{"伤势":65,"flags":["wuhun_mutated","sealed_ruins"]}}},{"t":"背上老鸦的骨头离开","win":{"text":"你没碰那双红眼睛。北镇后山，你把老鸦和译稿埋在一起，先读完了最后一页。","d":{"bonds":{"老鸦":8},"flags":["know_trial"],"trait":{"仁":1,"险":-1}}}}]},{"id":"n_slaughter_king","title":"杀戮之王","year":2656,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M69","echo":{"flag":"fog_trail","text":"前因 · 2655：你在冰原上循着红雾，找到过一个活口。"},"text":"两年里大陆变了天：武魂殿立国，唐三从海上回来，满大陆都在传昊天宗复出。二六五六年冬，你在一条冰谷里追上了那团红雾。\n\n谷里已有武魂帝国的寂灭小队，二十五人摆成十人围一人的阵。被围的是个赤脚的白发老人，红雾里无数红眼睛明灭。二十五道魂环同时亮起，又像风里的烛火一个个灭了。一炷香不到，没有一个人走出那片雾。红雾漫上山脊，你膝盖一软，几乎跪下——就像城里每个人在王座底下跪了一辈子。\n\n南边亮起蓝金色的光，额上烙着三叉戟的青年踏雪而来。老人捂头跪倒，眼里的红褪去。他叫唐晨，是唐三的曾祖父。天亮前他看见了你：「城里的孩子，你身上有我的血。我欠你们一座城。」\n\n他要去海边见一个人，唐三要南下嘉陵关。你看见老人按在胸口的手，每隔几步就收紧一下。","choices":[{"t":"跟上老人去海边","hint":"你知道他身体里还有东西没走","win":{"text":"他没回头，也没赶你走。瀚海城的船，要走十天。","d":{"bonds":{"唐晨":10},"flags":["go_sea"],"trait":{"逆":1}}}},{"t":"随唐三南下嘉陵关","hint":"战争要来了","win":{"text":"唐三把你编进唐门先锋，没给职位：「城里学的东西，这里用得上。」","d":{"bonds":{"唐三":5},"rep":{"天斗":5},"flags":["go_south"],"trait":{"群":1}}}},{"t":"回武魂帝国，回她身边","hint":"她站在另一边，你也会","win":{"text":"她在帅帐门口看见你，伸手理了理你的领口：「瘦了。北边的东西不好吃吧？」","d":{"bonds":{"胡列娜":8},"rep":{"武魂殿":8},"flags":["go_hu"],"trait":{"忠":1}}}}]},{"id":"n_jialing","title":"嘉陵关","year":2657,"cond":{"flag":"go_south","notFlag":null,"levelMin":0},"canon":"M82","echo":{"flag":"spared_suye","text":"前因 · 2651：庚辛城的回廊里，你放苏夜走过。"},"text":"去年那场强攻，嘉陵关下死了十万人。二六五七年开春，唐三从海上回来，天斗大军再次压到关下。百米高的关墙，让你想起杀戮场那堵外墙。开战前，背霜剑的林照瞥你一眼：「唐宗主说，你在只有杀人的城里长大，却没变成那座城。」手臂缠着蓝电的玉衡跟在柳二龙身后，每次冲锋都冲在最前。\n\n攻到第三天，人一排排冲上去，一排排倒下，没有看台，没有人下注。黄昏，苏夜从城头的阴影里走出来，冷白的灯光扫过，天斗士兵一个个眼神空了，被箭雨钉在原地。林照的剑光劈开圣龙军团前锋：「我替你挡住，你去灭了那盏灯！」\n\n灯光碰了碰你的心防，门后是一个场子，一炷香。城下还有成百上千的伤兵躺在泥里，没人去拖。","choices":[{"t":"迎着那盏灯冲上城头","hint":"关键战：灭了冥月灯，城下少死一片人","need":{"战力":1200},"chance":0.45,"win":{"text":"你撑过三回合冥月灯，刀尖抵上灯芯。灯灭时苏夜笑了一下，城下少死了一片人。","d":{"名望":15,"bonds":{"林照":8,"唐三":5},"met":["qibao","landian"],"trait":{"险":1},"ending":"e1"}},"lose":{"text":"冥月灯翻开了那炷香，你跪在城头。再醒来时，你躺在北去的板车上。","d":{"伤势":60,"met":["qibao","landian"],"ending":"e4"}}},{"t":"放下刀，去城下拖伤兵","hint":"今天不必再多死一个人","win":{"text":"你拖了一夜伤兵，刀一次都没出鞘。天亮时林照在你身边坐下，什么也没说。","d":{"名望":8,"bonds":{"林照":5,"唐三":5},"met":["qibao","landian"],"trait":{"仁":3},"ending":"e1"}}},{"t":"扔下刀，离开战场","hint":"这一回，你只想活下去","win":{"text":"你扔下刀，向北走。这一回，你只想活下去。","d":{"flags":["deserted"],"met":["qibao","landian"],"trait":{"群":-2,"险":-1},"ending":"e4"}}}]},{"id":"n_sea_god","title":"海神岛的三日","year":2657,"cond":{"flag":"go_sea","notFlag":null,"levelMin":0},"canon":"M80","echo":{"flag":"know_trial","text":"前因 · 2654：你读完了老鸦的译稿，知道王在等什么。"},"text":"船走了十天。唐晨每夜坐在船头看海，眼睛会变红，你就把双刃横在膝上守着。第七夜他开口：「她说谁先成神就嫁谁，我转身就走了。修罗第八考叫守狱。我选了那座城，想着十年总能等到一个生于杀、长于杀，却能在当杀时不杀的人。」他按住胸口，「等到罗刹的怨念渗进骨头，那头蝙蝠钻了进来。那年场上有个孩子扔了刀，我站起来说了句话。那是我最后一次清醒。」\n\n海神岛上，波赛西站在潮水里，像站了几十年。第二天唐晨咳出暗紫的血。第三天黄昏，她把你叫到一边：「它在他心脉里扎了几十年的根，他撑不过今夜。它也可以现在出来——它会认你，你从生下来就喝着它的血。他能多活几年。可是你……」\n\n屋里，唐晨握着一柄血红的剑，没有回头：「孩子，别听她的。我欠的够多了。」","choices":[{"t":"把蝠王引进自己的血里","hint":"改写原著（宿命 −2）：唐晨活到终战","need":{"精神":50},"cost":{"fate":2},"canonChange":{"node":"M80","inertia":4,"desc":"唐晨未死于海神岛，亲手交出修罗魔剑，终战代尘心、古榕赴死"},"win":{"text":"你握住他的手，它沿着他的手臂一寸寸爬进你的身体。那是你喝下的最后一杯血腥玛丽。","d":{"伤势":40,"shift":15,"bonds":{"唐晨":15,"波赛西":5},"flags":["bat_host"],"trait":{"逆":3,"仁":1},"ending":"e3"}}},{"t":"守着他，走完这三天","hint":"他想死在她身边，这是他自己选的","win":{"text":"第三天黄昏，他死在她身边。那柄血红的剑，后来到了唐三手里。","d":{"bonds":{"唐晨":8,"波赛西":5},"trait":{"逆":-1,"忠":1},"ending":"e1"}}}]},{"id":"n_pass_break","title":"破关之日","year":2657,"cond":{"flag":"go_hu","notFlag":null,"levelMin":0},"canon":"M82","echo":{"flag":"saint_blade","text":"前因 · 2651：星湖那天，你是圣女身边的刀。"},"text":"胡列娜没问你这两年去了哪儿。立国后她做过一阵摄政，在长老殿里吵赢了，也吵累了，眼角的媚意底下压着更重的东西。\n\n二六五七年，嘉陵关守不住了。最后一天清晨，关墙内侧升起一片碧绿的雾——毒斗罗的毒失了控，不挑人，漫过城墙和营房，守军成片跪倒。胡列娜站在关墙上一动不动：「老师让我守着这里。」\n\n「这里已经没了。」你把她拽下城墙，从运粮小道往南边山里跑。她的魂力在掉，咳出来的血是黑的。二十里外的断崖拐角，站着背霜剑的林照，衣襟上沾着关下的泥和血：「武魂帝国的圣女，你走不了。今天关下死了几十万人，总得有人给个交代。」\n\n胡列娜拉了拉你的衣角：「别打。把我交出去，你还能……」\n\n「在城里，你答应过带我出去。」你转过身，「你做到了。」","choices":[{"t":"拔刀，迎上林照的剑","hint":"关键战：你身后就是胡列娜","need":{"战力":1250},"chance":0.45,"win":{"text":"你的刀先停，她的剑也收了。林照看了你很久：「你在城里护过她，现在还护着。行吧。」","d":{"名望":10,"bonds":{"胡列娜":10,"林照":3},"met":["qibao"],"trait":{"险":1,"忠":1},"ending":"e2"}},"lose":{"text":"霜剑穿透了你的红雾。醒来时你躺在北去的车上，没人告诉你她去了哪儿。","d":{"伤势":70,"bonds":{"胡列娜":5},"met":["qibao"],"ending":"e4"}}},{"t":"收刀，向林照求一条路","hint":"你在城里从没求过谁","win":{"text":"你在城里从没求过谁。林照沉默了很久，侧身让开：「往西走，别回头。」","d":{"bonds":{"胡列娜":6,"林照":8},"met":["qibao"],"trait":{"仁":2,"群":1},"ending":"e2"}}}]}],"endings":[{"id":"e1","title":"结局·刑堂","type":"律","grade":2,"text":"战争在你二十八岁那年结束。唐三没有杀千仞雪，也没有杀胡列娜；唐门的暗器图纸被一张张送进熔炉。那夜他来找你：「唐门要设刑堂。你见过最坏的规矩，见过的人才知道该怎么写一条好的。」你在空屋里坐了三天，第三天清晨写下第一条：「唐门刑堂，不设死刑。」你废过人的魂力，赶过人出山门，却没让任何人死在刑堂里。偶尔你梦见王座上的老人摘下面具，看着那张纸，点了点头。考成了。","afterlife":["唐三：唐门从此不造暗器，刑堂第一条被他刻进了宗规。","唐晨：死在海神岛的黄昏，死在等了他几十年的女人身边。","老鸦：三十年的译稿，被你收在刑堂书架的最高一层。","杀戮之都：北镇那块木板上压了块石头，你每年冬天去看一眼。"],"worldline":"唐门刑堂由杀戮之都长大的人执掌，第一条是不设死刑；世界线大体随原著收束。"},{"id":"e2","title":"结局·狐火","type":"守","grade":2,"text":"后来的事，是在山里猎户家听说的：唐三死了又活，成了神；最后那一剑，比比东替她女儿挡下了。胡列娜一夜没说话，天亮时才开口：「她教我杀人，教我魅惑人，从没教过我怎么哭。」唐三赦免了她。她没回武魂城：「我想去看海，没有紫月的那种。」你们在瀚海城外的渔村住下，她补渔网，补一次骂一次。那座城教你别对谁动心，后来你才知道，它教的一大半是错的。","afterlife":["胡列娜：在渔村补了一辈子渔网，再没用过魅惑。","邪月：收到她托人带回的一封信，守着空了的教皇殿。","林照：回七宝复命，只说断崖下没找到人。","武魂殿：残部群龙无首，就此星散。"],"worldline":"胡列娜获赦后不回武魂城，武魂殿残部群龙无首、就此星散。"},{"id":"e3","title":"结局·空城之王","type":"王","grade":3,"text":"你醒来已是第五天。唐晨又活了一年多：亲手把修罗魔剑交给唐三，陪波赛西走到海神之光散尽，然后去了天斗城。双神联手那天，一个白发老人提着漆黑的巨锤先一步迎了上去，替两位老友死在城下。你回到北边那座空城，在门楣刻下一行字：「此城不再收人。」有人掀开北镇的木板往下看，会看见一双暗金色的眼睛，听见一声：「回去。」他们都回去了。","afterlife":["唐晨：代尘心、古榕战死在天斗城下，这一回是他自己选的。","尘心与古榕：活到七宝少宗主出嫁那天，一左一右坐在主位上。","波赛西：在第九考中献祭，终于等到了他。","血红九头蝙蝠王：锁在你的血里，锁在一座空城里。"],"worldline":"唐晨活到终战并代尘心、古榕战死，七宝两大斗罗存活；血红九头蝙蝠王被你锁进杀戮之都废墟。"},{"id":"e4","title":"结局·北镇酒馆","type":"凡","grade":1,"text":"你记不清自己是怎么走回北镇的，只记得雪很厚，你一路在想：这辈子还没为自己活过一天。你花了一个冬天修好塌掉的酒馆，在那块木板上压一口大酒缸。酒是麦子酿的，不掺血。南边的消息一年年传来，你擦着杯子，不说话。有年冬天来了个冻紫嘴唇的孩子，问这底下是不是有座城。「以前有，」你说，「现在没了。」每年紫月该升起的夜里，你给自己倒一杯麦酒，对着酒缸说：「我活下来了。」","afterlife":["唐三：成了神。北镇的人说起他，像说一个很远的故事。","胡列娜：听说获了赦，去了海边。你没去找她。","那个孩子：在你店里跑堂，后来学会了酿酒。","杀戮之都：木板压在酒缸底下，再没有人下去过。"],"worldline":"你从大陆的棋盘上消失，世界线照原著走完；北镇多了一间不卖血的酒馆。"}],"summary":"每局 8 个节点（含互斥分支共 11 个）。十人活一：依城规送父亲走或扔刀成王的血侍；结盟唐银 / 胡列娜 / 独行；地狱路心魔战定杀神；毁城后分庚辛城（苏夜）与星湖（白霜）；城墟斩渊影魔蝠、知修罗第八考；唐晨苏醒后分嘉陵关（战苏夜）、破关（战林照）、海神岛（引蝠王入体，宿命 −2）。结局：刑堂 / 狐火 / 空城之王 / 北镇酒馆。"},{"id":"qibao","title":"七宝琉璃宗·剑斗罗亲传","defaultName":"林照","gender":"女","tagline":"满门辅助，唯你一剑","intro":"七宝琉璃宗满门辅助，护着天下第二宗门的只有剑、骨两位斗罗。你是护卫营的孤女，六岁觉醒寒霜剑，被从不收徒的尘心带上听剑崖。猎魂之夜与嘉陵关在前方，师父的右臂与性命，都系在你的剑上。","birthYear":2631,"startYear":2637,"faction":"七宝琉璃宗","wuhun":{"name":"寒霜剑","type":"器","system":"强攻","tier":"顶","desc":"霜白细长的单剑，斩中处结霜封脉。剑意主「止」，越冷越锋利。"},"innate":9,"attrs":{"体魄":32,"精神":34,"悟性":42,"魅力":24,"气运":22},"coins":80,"rep":{"武魂殿":-5,"天斗":5,"星罗":0,"宗门":15,"魂兽":0},"bonds":{"尘心":10,"宁荣荣":8,"古榕":3,"宁风致":3},"flavor":{"work":{"name":"护卫营押镖","desc":"随七宝商队押镖换饷银"},"faction":{"name":"宗门差事","desc":"替宗主跑腿、守夜、看账"},"place":"七宝城·听剑崖"},"rings":[{"slot":1,"op
