flags":["knew_tangyin"],"trait":{"忠":1}}}},{"t":"撇下她，独走地狱路","need":{"战力":900},"win":{"text":"血蝙蝠、十首烈阳蛇、心魔，你一关关杀穿。出来时杀神领域在你身上，圣女看你的眼神冷得像刀。","d":{"merit":10,"体魄":5,"精神":5,"item":"杀神领域","flags":["killing_domain"],"bonds":{"胡列娜":-15,"比比东":-5},"trait":{"群":-2,"险":2}}}}]},{"id":"fx_wuhundian_hunt","title":"猎魂之夜","year":2651,"cond":{"rankMin":1},"canon":"M51","text":"长老殿的命令只有八个字：七宝重创，蓝电除名。\n\n你被分在哪一路，由你自己选——这是红衣主教的特权。东路随菊鬼二老攻七宝城，剑斗罗和骨斗罗在那里等着；西路八千人围龙脊山，蓝电霸王龙一千八百口，一个不留。出发前胡列娜递给你一杯酒：「老师说，蓝电的事，是替一个人出气。」她没说是谁。\n\n夜里起风了。你把酒喝干，往哪边走，要在马镫上决定。","choices":[{"t":"随菊鬼二老攻七宝","need":{"战力":1200},"win":{"text":"两极静止合拢的一刻，你替菊斗罗挡下了骨斗罗的骨龙。七宝城塌了西角，长老殿记你首功。","d":{"rank":1,"merit":40,"伤势":30,"bonds":{"月关":15,"鬼魅":15,"宁荣荣":-20},"rep":{"宗门":-20},"trait":{"忠":1,"险":1}}}},{"t":"领队踏平龙脊山","hint":"蓝电宗主的三块魂骨，有一块会归你","need":{"战力":1300},"win":{"text":"天亮时龙脊山没有一盏灯亮着。玉元震的右臂骨被剥下来送到你手里，长老们说，这是冕下赏的。","d":{"rank":1,"merit":50,"bone":{"slot":"右臂","name":"蓝电霸王龙宗主右臂骨","desc":"雷霆缠臂，一拳带万钧雷暴","attrs":{"体魄":6,"精神":2}},"bonds":{"大师":-50,"玉天恒":-40},"rep":{"宗门":-30},"flags":["landian_bone"],"trait":{"仁":-3,"忠":2}}}},{"t":"放走一队蓝电的孩子","hint":"背着长老殿行事","win":{"text":"后山那条小路你没让人去搜。三十几个孩子消失在雷池方向，你在战报上写：无一生还。","d":{"merit":10,"bonds":{"玉天恒":15},"rep":{"宗门":10},"flags":["spared_landian"],"trait":{"仁":2,"忠":-2}}}}]},{"id":"fx_wuhundian_lake","title":"星湖追猎","year":2651,"cond":{"rankMin":1},"canon":"M52","echo":{"flag":"knew_tangyin","text":"前因 · 2647：你在杀戮之都就认出了唐银是谁。"},"text":"星斗大森林深处，星湖像一块打碎的镜子。菊斗罗把追猎小舞的队伍交给你一半，自己和鬼斗罗压阵。胡列娜带来的那个唐银走在最前面，一路上话很少。\n\n天青牛蟒从湖里抬起头的时候，唐银反了。蓝银草缠住鬼斗罗，昊天锤砸向菊斗罗，他一个人挡在那只粉色的兔子前面。两极静止领域一合，他浑身的骨头都在响。小舞看着他，眼里有一种你在任何魂兽身上都没见过的东西——她要献祭。\n\n你离她只有十步。","choices":[{"t":"抢在献祭前擒下小舞","hint":"改写原著","need":{"战力":1500},"canonChange":{"node":"M52","inertia":5,"desc":"小舞被武魂殿生擒，没有献祭"},"win":{"text":"你一掌切在她后颈，献祭的光还没亮就熄了。唐三嘶吼着被蓝银草拖进湖底遁走。十万年柔骨兔，被关进了教皇殿地牢。","d":{"rank":1,"merit":70,"名望":20,"bonds":{"比比东":25,"唐三":-80,"小舞":-60},"rep":{"魂兽":-40},"shift":25,"flags":["caught_xiaowu"],"world":{"offset":{"唐三":-8,"小舞":-10},"news":{"M52":"星湖之战，十万年柔骨兔被武魂殿生擒押回武魂城，唐三重伤遁走"},"note":"小舞没有献祭，唐三少了第六魂环与魂骨，从此只为救她一人而活"},"trait":{"逆":3,"仁":-2}}}},{"t":"按令压阵，任她献祭","win":{"text":"红光冲天，柔骨兔化成一道魂环落进唐三体内。你什么都没做，战报上写：目标自毁。","d":{"merit":20,"bonds":{"比比东":5},"trait":{"逆":-1}}}},{"t":"暗中替唐三偏开一爪","hint":"背着菊鬼二老行事","need":{"精神":55},"win":{"text":"献祭照旧，可鬼斗罗最后那一爪被你偏开了半寸。唐三本来就会活，但他记住了你。","d":{"merit":-10,"bonds":{"唐三":20,"小舞":10},"flags":["spared_tangsan"],"trait":{"仁":1,"忠":-2}}}}]},{"id":"fx_wuhundian_empire","title":"武魂帝国","year":2654,"cond":{"rankMin":2},"canon":"M68","echo":{"flag":"caught_xiaowu","text":"前因 · 2651：星湖那一夜，柔骨兔是你亲手押回武魂城的。"},"text":"比比东在武魂城加冕那天，教皇殿的金顶换成了黑金。十余个王国的使者跪了满满一殿，七宗重选上来的新七宗站在最前排。\n\n大典之后，胡列娜在殿后回廊等你。她如今是武魂帝国的圣女，第一顺位继承人，一身红袍衬得她像一团火。「老师越来越不像老师了，」她低声说，「有时候我觉得，她身上有别的东西。」焱站在回廊尽头，拳头攥得发白。\n\n同一晚，天使神殿亮了一夜。千仞雪回来了，她在找一个能替她守门的人。","choices":[{"t":"握住胡列娜的手","hint":"恋人向；焱会恨你","need":{"魅力":50},"win":{"text":"她的手很凉，过了很久才回握。回廊尽头一声闷响，是焱一拳砸碎了石柱。","d":{"merit":20,"bonds":{"胡列娜":35,"焱":-40},"flags":["lover_huliena"],"trait":{"群":1}}}},{"t":"去天使神殿替千仞雪守门","hint":"站到大供奉一边","need":{"精神":65},"win":{"text":"你在神殿门外守了七天七夜。千仞雪出来时，第一道光幕的金纹落在你肩上：「你比我想的可靠。」","d":{"merit":20,"精神":3,"bonds":{"千仞雪":35,"千道流":15,"比比东":-15},"flags":["angel_side"],"trait":{"忠":-1}}}},{"t":"只做女皇手里的刀","hint":"晋升；供奉殿淬炼全部魂环","win":{"text":"你单膝跪在黑金王座前。比比东的手按在你头顶，冷得不像活人。供奉殿连夜以秘法淬你魂环，长老殿多了一把椅子。","d":{"rank":1,"merit":40,"bonds":{"比比东":25},"flags":["empress_blade"],"ringUp":{"target":"all","mul":1.3,"add":2000},"trait":{"忠":2,"仁":-1}}}}]},{"id":"fx_wuhundian_rakshasa","title":"罗刹神座下","year":2657,"cond":{"rankMin":2},"canon":"M85","echo":{"flag":"lover_huliena","text":"前因 · 2654：加冕那夜，你在回廊上握住了胡列娜的手。"},"text":"嘉陵关破了，比比东没有走。她在关后的废城里坐了三天，再站起来时，死亡蛛皇的八条腿变成了漆黑的镰刃——罗刹神。她一招让海神陨落，只给天斗三天投降。\n\n第三天，唐三活过来了。他身边站着小舞，两人的神光交叠成一种你从没见过的颜色。比比东把千仞雪护在身后，罗刹魔镰指着地面，像在等一个人替她决定什么。\n\n你站在她左手边。这里离两位神只有一百步，也是武魂帝国最后一道防线。","choices":[{"t":"迎上双神，替女皇挡剑","hint":"改写原著：武魂帝国不亡","need":{"战力":2300},"canonChange":{"node":"M85","inertia":5,"desc":"比比东没有死，武魂帝国没有覆灭"},"win":{"text":"修罗魔剑劈下时你横在最前面。神光把你烧得只剩一口气，那一剑终究没落到她们母女身上。唐三收剑：「十年，十年后再打。」","d":{"rank":1,"merit":80,"名望":30,"伤势":70,"bonds":{"比比东":40,"千仞雪":30,"唐三":-30},"shift":30,"world":{"news":{"M85":"双神合击被人以身相挡，比比东与千仞雪退守武魂城，大陆三分"},"note":"比比东活了下来，武魂帝国退守一隅，与两大帝国三分天下"},"ending":"fx_wuhundian_e1","trait":{"忠":3,"逆":2,"险":2}}}},{"t":"带胡列娜离开战场","hint":"进入结局：残阳归隐","need":{"魅力":55},"win":{"text":"你拉住胡列娜的手腕往后退。她回头看了老师最后一眼，比比东朝她轻轻点头，然后转身迎向了那道剑光。","d":{"bonds":{"胡列娜":30,"比比东":10},"ending":"fx_wuhundian_e2","trait":{"仁":1,"忠":-1}}}},{"t":"放下武器，向海神投降","win":{"text":"你把武器扔在地上。比比东没有回头，修罗魔剑落下时，她替女儿挡下了那一剑。武魂帝国，到此为止。","d":{"名望":-10,"bonds":{"唐三":10,"比比东":-20},"trait":{"忠":-2}}}}]}],"endings":[{"id":"fx_wuhundian_e1","title":"结局·罗刹之侧","type":"王","grade":3,"text":"武魂帝国没有亡。它从十余个王国缩回到武魂城与天灵山脉以南，比比东把罗刹魔镰插在城门上，十年没有拔出来。\n\n你做了供奉殿首座。唐三的信使每年来一次，问的都是同一句：十年之约还作不作数。你每次都替她回答：作数。有人骂你是罗刹神的走狗，也有人说，是你给这片大陆留下了一点平衡。","afterlife":["比比东：守着罗刹神位，再没踏出武魂城一步，母女俩终于能坐在一张桌上吃饭。","千仞雪：收起六翼，替母亲管起了供奉殿，偶尔问你天斗城的雪顶茶好不好喝。","胡列娜：继承了圣女之位，常在城头望着天斗的方向发呆。","武魂帝国：退守武魂城一隅，与天斗、星罗三分天下。"],"worldline":"比比东活了下来，罗刹神坐镇武魂城，大陆进入三足鼎立的时代。"},{"id":"fx_wuhundian_e2","title":"结局·残阳归隐","type":"隐","grade":1,"text":"你和胡列娜在南方一个渔村落了脚。她把红袍压进箱底，学着补网，手上被麻绳磨出了茧。村里人只当你们是一对逃难来的夫妻。\n\n那一战的消息过了半年才传到海边：教皇替女儿挡下修罗魔剑，武魂帝国覆灭，海神赦免了圣女。胡列娜听完，在礁石上坐了一夜。天亮时她回来说：「老师最后点头，是叫我好好活着。」","afterlife":["胡列娜：再没用过妖狐武魂，每年老师的忌日，往海里放一盏红灯。","唐三：知道你们在哪里，从没派人来过。","武魂殿：随帝国一同覆灭，残部散入两大帝国。"],"worldline":"武魂帝国照原著覆灭，只是圣女没有留在废墟里，而是去了海边。"}]},{"id":"qibao","name":"七宝琉璃宗","desc":"天下第二宗，财力第一。辅助系的宗门最缺能打的人——你来了，琉璃塔下就多了一柄刀。","join":{"need":{"名望":15},"hint":"在天斗城拍卖场或七宝城门前露一手，宁风致自会派人来请。"},"ranks":["客卿","护宗长老","大长老","副宗主","宗主之位"],"rankReq":[{"merit":0,"等级":0},{"merit":30,"等级":40},{"merit":80,"等级":55},{"merit":160,"等级":70},{"merit":280,"等级":85}],"perk":{"desc":"七宝增幅：战力+10%，俸禄丰厚","power":0.1,"train":0.05,"coins":80},"task":{"name":"七宝差事","lines":["押送一船琉璃器去瀚海城，沿途有三拨水匪盯着这条船。","替宗主去拍卖场压价，把一株九品紫芝拍回七宝库房。","陪少主宁荣荣练融环，被七宝琉璃塔增幅得手脚发飘。","去天斗城各家贵族府上收账，有人想赖账，有人想送女儿。","在琉璃城墙上替骨斗罗守一夜，他说今晚风里有血腥味。"]},"nodes":[{"id":"fx_qibao_oath","title":"十年之约","year":2646,"cond":{"rankMin":0},"canon":"M41","text":"琉璃殿的门槛被一个少年跪出了印子。奥斯卡脸上还带着武魂城一战的灰，额头抵着青砖：「请宗主给我十年。十年后我若到不了七十级，再不踏进七宝城一步。」\n\n宁风致没让他起来，只看了你一眼。你是七宝新请的客卿，坐在左手第三把交椅上，本不该说话。宁荣荣躲在屏风后头，咬着袖子不出声。\n\n奥斯卡走出殿门时塞给你一沓信：「她不肯见我。劳烦你，每年替我交一封。」骨斗罗古榕在你耳边哼了一声：「宗规写得明白，直系配偶须是战斗魂师。一根香肠，配不上琉璃塔。」","choices":[{"t":"替奥斯卡向宗主求情","hint":"奥荣的十年由此多一分底气","need":{"魅力":35},"win":{"text":"宁风致终于开口：「十年。七宝琉璃宗等得起。」奥斯卡冲你深深一揖，背影没入山道。","d":{"merit":10,"bonds":{"奥斯卡":20,"宁荣荣":10,"宁风致":5},"flags":["kept_letters"],"trait":{"仁":1,"群":1}}}},{"t":"收下信，一封也不交","hint":"暗线：她会以为他再没来过信","win":{"text":"你把那沓信锁进了客卿院的暗格。往后五年，宁荣荣一封也没有收到。","d":{"merit":5,"bonds":{"奥斯卡":-10},"flags":["hid_letters"],"trait":{"仁":-1,"忠":-1,"逆":1}}}},{"t":"附和骨斗罗，宗规不可废","win":{"text":"古榕拍了拍你的肩膀。从这一刻起，你在七宝就不只是个外人了。","d":{"merit":15,"bonds":{"古榕":12,"宁荣荣":-5},"rep":{"宗门":3},"trait":{"忠":1}}}}]},{"id":"fx_qibao_elder","title":"大长老之争","year":2650,"cond":{"rankMin":1},"canon":null,"text":"老长老宁怀石开春坐化，大长老的位子空了出来。七宝琉璃宗立宗以来，这把椅子只坐过姓宁的人。\n\n旁支的宁远山在议事厅里拍了桌子：「客卿是客，护宗长老是护，大长老是家。外姓人坐上去，祖宗牌位都要往下掉。」满堂长老都是辅助系，嗓门一个比一个低。剑斗罗闭着眼，骨斗罗在剔牙。\n\n宁荣荣已经十八岁了。她从回廊尽头走来，掌心的九宝琉璃塔转着九道光：「谁说七宝的家只能姓宁？我爹缺的是一把刀，不是一块牌位。」宁风致笑而不语，把议事厅让给了你。","choices":[{"t":"接骨斗罗三招","hint":"晋升大长老","need":{"战力":950},"win":{"text":"骨龙的第三爪停在你喉前三寸，再也压不下去。古榕收了武魂：「这把椅子，你坐得。」","d":{"rank":1,"merit":30,"名望":8,"bonds":{"古榕":15,"宁荣荣":10},"trait":{"险":1}}}},{"t":"翻开七宝的账本说话","hint":"晋升大长老，旁支记恨","need":{"名望":40},"win":{"text":"你把这几年替宗门挣下的每一笔进项念完，宁远山的脸从红变白。满堂举手。","d":{"rank":1,"merit":20,"金魂币":500,"bonds":{"宁风致":12},"flags":["ningyuanshan_grudge"],"trait":{"忠":-1}}}},{"t":"让给宁家人，只求九宝增幅","hint":"九宝琉璃塔淬炼你最弱的魂环","win":{"text":"你退了一步。宁荣荣瞪了你半天，还是把九宝的光一层层压进你的魂环里，环色亮了一截。","d":{"merit":10,"悟性":2,"bonds":{"宁荣荣":8},"ringUp":{"target":"lowest","mul":1.5,"add":1000},"trait":{"群":1}}}}]},{"id":"fx_qibao_night","title":"七宝之夜","year":2651,"cond":{"rankMin":1},"canon":"M51","text":"那一夜七宝城的琉璃灯一盏一盏灭了。武魂殿的人没有叫阵，西角城墙先塌了一段，菊斗罗的花香和鬼斗罗的黑雾一起漫了进来。\n\n剑斗罗提着七杀剑迎上去，两极静止领域在他头顶缓缓合拢。骨斗罗护着宗主退向后山，宁荣荣的九宝琉璃塔亮到第七层就再也升不上去——她在发抖。藏宝库的方向也起了火，那里有七宝三百年的家底。\n\n你是这一夜城里第三强的人。三处都在等你。","choices":[{"t":"挡在剑斗罗身前","hint":"剑斗罗保住右臂","need":{"战力":1300},"win":{"text":"两极静止合拢的那一瞬，你替尘心挡了鬼斗罗一爪。七杀剑趁隙出鞘，菊斗罗的花瓣碎了一地。","d":{"merit":40,"伤势":35,"名望":12,"bonds":{"尘心":25,"宁风致":10},"rep":{"武魂殿":-25},"flags":["saved_sword"],"world":{"offset":{"尘心":1},"news":{"M51":"七宝之夜，剑斗罗在一名外姓长老舍身相护下保住了右臂"},"note":"剑斗罗没有失去右臂"},"trait":{"仁":1,"险":1}}}},{"t":"背宁荣荣冲出火海","hint":"她会记得是谁背她出城","need":{"精神":55},"win":{"text":"你背着她穿过塌了半边的琉璃回廊。她伏在你肩上，九宝的光一层一层落在你背上，暖得发烫。","d":{"merit":25,"伤势":20,"bonds":{"宁荣荣":25,"宁风致":15},"flags":["saved_rongrong"],"trait":{"仁":1,"群":1}}}},{"t":"死守藏宝库","win":{"text":"火灭时库门还在，七宝三百年的家底一枚金魂币也没少。宁风致说，这比十座城都值钱。","d":{"merit":30,"金魂币":1500,"bonds":{"宁风致":10},"rep":{"宗门":5},"trait":{"忠":1,"群":-1}}}}]},{"id":"fx_qibao_wedding","title":"琉璃婚约","year":2652,"cond":{"rankMin":2},"canon":null,"echo":{"flag":"hid_letters","text":"前因 · 2646：奥斯卡托你转交的信，五年里你一封也没送到。"},"text":"七宝迁进天斗城的第三个月，宁风致在国师府后园摆了一桌只有两个人的酒。「那一夜死了两千人，宗规还在：直系配偶须是战斗魂师。」他替你斟满，「荣荣的意思，我问过了。」\n\n消息比喜帖跑得快。婚期前一天，史莱克的人到了：唐三站在国师府门口，戴沐白、朱竹清、马红俊在他身后，奥斯卡走在最前面，脸上多了一道从眉骨划到下颌的疤。「我回来了，」他看着楼上的窗，「晚了五年，还不算太晚吧？」\n\n宁荣荣就在楼上，窗没有开。","choices":[{"t":"迎娶宁荣荣，接下史莱克","hint":"改写原著：拆散奥荣","need":{"战力":1300,"魅力":50},"canonChange":{"node":"M84","inertia":5,"desc":"宁荣荣嫁给了你，奥斯卡与她百分之百的契合从此不在"},"win":{"text":"凤凰火、白虎、镜像分身，你一个个打回门外。唐三最后收起蓝银草：「她自己选的，我认。」楼上的窗开了，她披着嫁衣在看你。","d":{"rank":1,"merit":50,"名望":15,"bonds":{"宁荣荣":35,"宁风致":20,"奥斯卡":-60,"唐三":-25,"马红俊":-20,"戴沐白":-15},"rep":{"宗门":15},"flags":["married_rongrong","beat_shrek"],"shift":20,"world":{"offset":{"奥斯卡":-4},"news":{"M61":"史莱克众人登上海神岛，七宝少主没有同行，她已在天斗城嫁作人妇","M84":"复活之光少了百分之百的契合，只亮了一半，唐三靠百万信仰才勉强回魂"},"note":"宁荣荣嫁给了你，奥荣CP与复活之光一起碎了"},"trait":{"逆":3,"险":1,"仁":-1}}}},{"t":"退婚，开门放他上楼","hint":"成全奥荣，史莱克欠你一个人情","win":{"text":"你亲手推开了国师府的门。奥斯卡冲上楼时撞翻了两个花架。唐三朝你抱拳：「这份情，唐门记下了。」","d":{"merit":20,"bonds":{"奥斯卡":30,"宁荣荣":20,"唐三":20},"rep":{"宗门":-3},"flags":["gave_rongrong"],"trait":{"仁":2,"群":1}}}},{"t":"婚事作罢，换七宝财权","hint":"宁风致的库房金印，比婚书更重","need":{"名望":50},"win":{"text":"你把婚书推回宁风致面前，换回一枚库房金印。从此唐门每领一笔七宝的钱，都要过你的手。","d":{"rank":1,"merit":40,"金魂币":3000,"bonds":{"宁风致":-5,"唐三":-15,"宁荣荣":-10},"flags":["qibao_treasury"],"trait":{"忠":-2,"仁":-1}}}}]},{"id":"fx_qibao_return","title":"七怪归来","year":2656,"cond":{"rankMin":2,"flag":"married_rongrong"},"canon":"M74","echo":{"flag":"beat_shrek","text":"前因 · 2652：婚礼前夜，你把史莱克的人打出了国师府。"},"text":"四年后，海神岛的船回来了。唐三额头上多了一枚三叉戟烙印，身后的人里少了一个——那个人如今站在你身边，九宝琉璃塔亮到了第九层。\n\n嘉陵关的仗打到第二个月，天斗缺一座能把七个人串起来的塔。唐三带着奥斯卡登门，话说得很客气：「七位一体缺了荣荣，就只剩六个人。」奥斯卡没说话，镜影头骨在他额前亮着，那是要动手的意思。\n\n宁荣荣握住你的手，掌心全是汗。七宝所有长老都在等你开口：九宝琉璃塔，借还是不借。","choices":[{"t":"九宝塔下，一战七怪","hint":"进入结局：九宝琉璃","need":{"战力":1900},"win":{"text":"九宝的光全落在你一人身上，你从院中打到城头，海神烙印也没能压住你。唐三收手退走，七位一体从此成了旧话。","d":{"rank":1,"merit":60,"名望":20,"bonds":{"唐三":-30,"奥斯卡":-30,"宁荣荣":15},"rep":{"宗门":20},"shift":8,"world":{"offset":{"唐三":-3},"news":{"M74":"嘉陵关首战，史莱克七位一体未能重组，唐三只身迎战比比东"},"note":"七位一体再没出现过，唐三的嘉陵关打得更苦"},"ending":"fx_qibao_e1","trait":{"险":1,"群":-1}}}},{"t":"与荣荣一起随七怪出征","hint":"和解：你做第八个人","need":{"魅力":60},"win":{"text":"你把手伸给奥斯卡。他盯了很久才握住，握得很疼。那天的七位一体里多了一道光，是你的。","d":{"merit":40,"bonds":{"唐三":25,"奥斯卡":20,"宁荣荣":20},"rep":{"天斗":15},"flags":["eighth_monster"],"trait":{"群":2,"仁":1}}}},{"t":"写一封休书，放她回去","hint":"进入结局：琉璃塔外","win":{"text":"你把休书压在她的妆奁下，连夜出了天斗城。走到城门才听见身后塔光大亮——七位一体，又凑齐了。","d":{"merit":-20,"bonds":{"宁荣荣":-10,"奥斯卡":30},"ending":"fx_qibao_e2","trait":{"仁":2,"群":-2}}}}]},{"id":"fx_qibao_throne","title":"宗主之位","year":2656,"cond":{"rankMin":2,"notFlag":"married_rongrong"},"canon":"M85","echo":{"flag":"qibao_treasury","text":"前因 · 2652：你用一纸婚书，换下了七宝的库房金印。"},"text":"宁风致做了四年国师，鬓角全白了。替雪夜续命的那门秘法，抽走的是他自己的元气。这年冬天，他把宗门长老叫到国师府，说要传位。\n\n宁荣荣刚从海神岛回来，九宝琉璃塔亮着九层，额上是大供奉继承人的印记。史莱克的人都在，唐三坐在客席上一言不发——嘉陵关的唐家军，一半的军饷是七宝出的。\n\n这些年替七宝守家的人是你。长老们一半看你，一半看她。宁风致把宗主金印推到桌子正中：「你们自己说。」","choices":[{"t":"琉璃殿上，挑战唐三","hint":"改写原著：夺宗主之位","need":{"战力":2000},"canonChange":{"node":"M85","inertia":4,"desc":"九宝琉璃宗没有交到宁荣荣手里"},"win":{"text":"你和唐三在琉璃殿前打了一炷香，三叉戟没有出鞘，蓝银草先断了。他收手：「七宝的事，七宝自己定。」金印落进你手里。","d":{"rank":1,"merit":60,"名望":25,"bonds":{"唐三":-30,"宁荣荣":-25,"奥斯卡":-15},"shift":15,"world":{"offset":{"宁荣荣":-3},"news":{"M85":"战后九宝琉璃宗新宗主即位，却不是宁荣荣，而是一名外姓长老"},"note":"宁荣荣没有继承九宝琉璃宗"},"ending":"fx_qibao_e1","trait":{"逆":2,"险":1,"忠":-1}}}},{"t":"断了唐门的军饷","hint":"与唐门翻脸，宗门站到你这边","need":{"名望":60},"win":{"text":"你只说了一句：七宝的钱，往后先养七宝的人。半数长老站到了你身后，唐三起身离席，再没回来。","d":{"rank":1,"merit":40,"金魂币":5000,"bonds":{"唐三":-40,"宁荣荣":-20},"rep":{"天斗":-15,"宗门":10},"world":{"offset":{"唐三":-2},"news":{"M75":"唐家军军饷吃紧，嘉陵关总攻推迟了两个月"},"note":"七宝断了唐门的军饷，嘉陵关打得更久"},"trait":{"忠":-2,"仁":-1}}}},{"t":"把金印推给宁荣荣","hint":"进入结局：九宝琉璃","win":{"text":"你把金印推了过去。她愣了好一会儿，九宝琉璃塔的光第一次照在一个外姓人身上，照得比谁都亮。","d":{"merit":30,"bonds":{"宁荣荣":30,"宁风致":20,"唐三":15},"ending":"fx_qibao_e1","trait":{"仁":1,"忠":2}}}}]}],"endings":[{"id":"fx_qibao_e1","title":"结局·九宝琉璃","type":"宗","grade":3,"text":"战后第二年，七宝琉璃宗在天斗城东重立山门，匾上改了一个字：九宝。开山那天，九层塔光冲上云端，半个天斗城都看得见。\n\n宗主金印落在谁手里，外人说法不一；七宝自己的人都清楚，那一夜城墙上的血、嘉陵关前的军饷、琉璃殿里的那一战，是谁扛下来的。辅助系的宗门，第一次有了自己的刀。","afterlife":["宁荣荣：成了九彩斗罗，说起当年那个外姓长老，总要先哼一声再笑。","宁风致：卸下国师之职，在九宝山门前种了一院子琉璃花，再不问宗门事。","尘心与古榕：两位老人的名字刻在九宝塔基上，塔下的香火从未断过。","九宝琉璃宗：财力与武力兼有，成为战后大陆第一宗门。"],"worldline":"七宝琉璃宗有了一位外姓擎天柱，九宝琉璃宗成了战后大陆第一宗门。"},{"id":"fx_qibao_e2","title":"结局·琉璃塔外","type":"孤","grade":1,"text":"你走的那天没有带走七宝一枚金魂币。天斗城门在身后合上，城里的塔光一层一层亮起来，你知道那是什么——七个人又站到了一起。\n\n后来有人在极北的冰原上见过一个独行的魂师，喝酒时从不说自己从哪里来。只有一回喝醉了，那人说自己娶过一座塔，又亲手把它还了回去。","afterlife":["宁荣荣：嫁给了奥斯卡，妆奁底下那封休书，她留了一辈子。","奥斯卡：成了食神斗罗，每年托人往北方捎一根香肠，从不署名。","九宝琉璃宗：宗谱上你的那一页被人悄悄留着，没有撕。"],"worldline":"你拆了奥荣又亲手还了回去，世界线绕了一个圈，回到原处。"}]},{"id":"haotian","name":"昊天宗","desc":"天下第一宗，封山二十年。外姓人想上五峰，得先过千米铁索，再过唐家人的眼睛。","join":{"need":{"名望":25},"hint":"带着昊天斗罗重现世的消息上五峰，宗主唐啸会见你。"},"ranks":["外姓客卿","长老","首席长老","副宗主","宗主"],"rankReq":[{"merit":0,"等级":0},{"merit":35,"等级":50},{"merit":90,"等级":65},{"merit":170,"等级":78},{"merit":280,"等级":90}],"perk":{"desc":"昊天锤意：战力+15%","power":0.15,"train":0,"coins":30},"task":{"name":"五峰差事","lines":["替长老堂巡一夜铁索，千米深谷底下有东西在往上爬。","下山去天斗城打探武魂殿的动静，赶在封山时辰前回来。","陪三代弟子唐虎对锤，他的锤总比他的脑子快三分。","把藏经阁里发霉的锤谱搬出来晒，顺手偷看两页。","替宗主给散落四方的旧附属宗族送信，没有一家肯收。"]},"nodes":[{"id":"fx_haotian_seal","title":"封山二十年","year":2646,"cond":{"rankMin":0},"canon":"M40","text":"昊天峰的铁索有一千米长。你走到一半，脚下的云忽然裂开，看得见谷底的白骨。\n\n宗主唐啸在峰顶石殿里见你，身后是空了二十年的附属宗族席位。去年武魂城那一锤，整个大陆都听见了，只有昊天宗装作没听见。「他砸的是教皇殿，」唐啸说，「受累的是五峰两百口人。」他说的是唐昊，他的亲弟弟，宗谱上已经除了名的那个。\n\n他要一个外姓人，替他去做唐家人做不了的事。","choices":[{"t":"替宗主下山寻唐昊","hint":"唐家兄弟的旧怨，从你手里过","need":{"精神":40},"win":{"text":"你在天斗城外的瀑布谷找到一个酗酒的男人。他听完来意，只说了一句：「告诉大哥，我欠的，我会还。」","d":{"merit":20,"bonds":{"唐啸":15,"唐昊":10},"flags":["met_tanghao"],"trait":{"群":1}}}},{"t":"替宗门守住铁索","win":{"text":"你在断索崖守了一年，两次砍断武魂殿探子攀上来的绳子。长老堂开始叫你的名字了。","d":{"merit":25,"体魄":2,"bonds":{"唐啸":8},"trait":{"忠":1}}}},{"t":"当面劝宗主出山","hint":"长老们不会喜欢你","need":{"名望":30},"win":{"text":"满殿长老都变了脸色。唐啸沉默良久：「不是不想，是不能。」他没说为什么，你记下了这句话。","d":{"merit":10,"bonds":{"唐啸":5},"flags":["urged_open"],"trait":{"逆":1,"险":1}}}}]},{"id":"fx_haotian_bones","title":"瀑布谷还骨","year":2650,"cond":{"rankMin":1},"canon":"M46","echo":{"flag":"met_tanghao","text":"前因 · 2646：你在瀑布谷见过唐昊，他说过，他欠的会还。"},"text":"瀑布谷里没有风，只有水声。唐昊站在潭边，左手提锤，右手空着——一会儿，连右手也不会有了。\n\n长老会派你来收骨。宗门传承的右臂骨与左腿骨在他身上带了二十年，宗规说除名之人不得带走宗门一物。唐三跪在他身后，脸白得像纸。唐昊没看儿子，只看你：「你是大哥派来的？」\n\n骨匣在你手里，很轻，要装进去的东西很重。长老会只说了收，没说怎么收；唐啸只交代了一句：「别让他死在你面前。」","choices":[{"t":"担保魂骨暂寄其身","hint":"改写原著：唐昊不断肢","need":{"名望":45},"canonChange":{"node":"M46","inertia":4,"desc":"唐昊没有自断肢体，魂骨暂留其身"},"win":{"text":"你以长老身份写下担保：魂骨暂寄唐昊之身，十年后归还。唐昊愣了很久，把锤放下了。唐三扶住了他。","d":{"merit":20,"bonds":{"唐昊":30,"唐三":15,"唐啸":10},"rep":{"宗门":-5},"shift":12,"flags":["tanghao_whole"],"world":{"offset":{"唐昊":17},"news":{"M46":"唐昊归还宗门魂骨一事被长老会搁置，昊天斗罗未曾断肢"},"note":"唐昊没有自断肢体，一直保持九十五级以上"},"trait":{"逆":2,"仁":2}}}},{"t":"亲手接过骨匣","win":{"text":"两块魂骨落进匣子时还是热的。唐昊没哼一声，你却一夜没睡。长老会给你记了功。","d":{"merit":30,"bonds":{"唐昊":-10,"唐啸":5},"trait":{"忠":1,"仁":-1}}}},{"t":"替唐昊封血，送他出谷","need":{"精神":50},"win":{"text":"你封住他断肢处的血脉，一路送到谷口。唐昊对唐三说：「宗门里，这个人可以信。」","d":{"merit":15,"bonds":{"唐昊":20,"唐三":15},"trait":{"仁":2}}}}]},{"id":"fx_haotian_return","title":"认祖归宗","year":2651,"cond":{"rankMin":1},"canon":"M49","text":"唐三上五峰那天，铁索断了一根，他一个人把唐天、唐玉从谷底拉了上来。长老堂并没有因此给他好脸色。\n\n他先胜了唐虎，又胜了七长老。按规矩，第三场由长老堂推一个人，胜了才准入宗谱。几位长老你看我、我看你，最后都看向你——外姓人出手，输了不丢唐家的脸，赢了，正好压一压这个从天而降的少主。\n\n唐啸坐在上首，没有说话。他看唐三的眼神，像在看二十年前的弟弟。","choices":[{"t":"下场，赢他一回","hint":"与唐三正面交手","need":{"战力":1100},"win":{"text":"你接下他三锤，第四锤你先到了。唐三退了一步，抹掉嘴角的血：「再来。」唐啸抬手：「够了，入谱。」","d":{"merit":40,"名望":10,"bonds":{"唐三":-5,"唐啸":10},"flags":["beat_tangsan"],"trait":{"险":1}}}},{"t":"接一锤便认输","win":{"text":"你只接了一锤就收了武魂。七长老骂你软骨头，唐三却朝你点了点头。","d":{"merit":5,"bonds":{"唐三":20,"唐啸":5},"trait":{"仁":1,"群":1}}}},{"t":"让他立约十年不夺首席","hint":"为日后的首席之争埋线","need":{"名望":45},"win":{"text":"你说，赢了可以入谱，首席长老的位子十年内不许碰。唐三答得很快：「我本来就不要。」","d":{"merit":25,"bonds":{"唐三":-10},"flags":["chief_pact"],"trait":{"忠":-1}}}}]},{"id":"fx_haotian_hunt","title":"五峰不动","year":2651,"cond":{"rankMin":1},"canon":"M51","echo":{"flag":"urged_open","text":"前因 · 2646：你劝过宗主出山，他说不是不想，是不能。"},"text":"猎魂之夜的消息是半夜传上五峰的：七宝城墙塌了，龙脊山火光冲天。山下来求援的蓝电弟子跪在铁索那头，浑身是血。\n\n长老堂连夜议事。昊天宗封山二十年，不是怕，是因为一个约：唐晨当年险胜千道流，换来武魂殿所属永不踏上昊天峰。出山，约就破了；不出山，蓝电一千八百口今夜就要除名。\n\n唐啸把昊天锤横在桌上，锤柄朝着你：「你是外姓人，你来说。」","choices":[{"t":"力主出山，驰援龙脊山","hint":"改写原著：昊天宗提前复出","need":{"名望":55},"canonChange":{"node":"M51","inertia":5,"desc":"昊天宗提前出山，蓝电霸王龙宗保住了一半族人"},"win":{"text":"五峰的锤一起下了山。天亮前杀到龙脊山，武魂殿退了，蓝电只剩下一半人。千道流那个约，从这一夜起作废了。","d":{"rank":1,"merit":50,"名望":20,"bonds":{"唐啸":15,"大师":25,"玉天恒":20},"rep":{"武魂殿":-40,"宗门":25},"shift":18,"flags":["haotian_open"],"world":{"news":{"M51":"猎魂之夜，封山二十年的昊天宗突然出山驰援龙脊山，蓝电霸王龙宗保住半数族人","M72":"昊天宗早在猎魂之夜便已出山，此后与武魂殿血战不休"},"note":"昊天宗提前复出，蓝电半数生还，昊天峰从此不再安全"},"trait":{"逆":2,"仁":1,"险":2}}}},{"t":"守约，铁索不落","win":{"text":"你说了两个字：守约。蓝电弟子在铁索那头跪到天亮，然后一个人走了。唐啸收起锤，很久没有说话。","d":{"merit":25,"bonds":{"唐啸":5,"大师":-10},"trait":{"逆":-1,"仁":-1}}}},{"t":"一人下山，不带宗门","need":{"战力":1300},"win":{"text":"你没用昊天宗的名义，独自下山，背回来三十七个蓝电的孩子。长老堂只当没看见。","d":{"merit":15,"伤势":30,"bonds":{"玉天恒":15,"大师":15},"rep":{"宗门":10},"trait":{"仁":2,"群":-1}}}}]},{"id":"fx_haotian_chief","title":"首席长老","year":2656,"cond":{"rankMin":1},"canon":"M72","echo":{"flag":"chief_pact","text":"前因 · 2651：你让唐三立过约，十年内不夺首席。"},"text":"唐三回来了。海神岛的四年让他变成了另一个人，额上的三叉戟烙印一亮，五峰的云都会散开。他要带昊天宗出山去嘉陵关，为此他要首席长老之位——按宗规，首席可以调动长老堂。\n\n长老堂的回答是三场。前两场他赢得轻松，第三场，所有人都看着你。你在五峰守了十年，这把椅子是你的，或者本该是你的。\n\n唐啸说：「昊天宗是唐家的宗门，可这十年，是你替我守的。」","choices":[{"t":"接他三锤，寸步不让","hint":"与唐三争首席；得昊天传承","need":{"战力":2000},"win":{"text":"三锤之后你还站着，他也还站着。唐三收锤，向你行了晚辈礼。唐啸当夜传你昊天宗秘法，以锤意淬你最强的那道魂环。","d":{"rank":1,"merit":50,"名望":20,"bonds":{"唐三":10,"唐啸":15},"flags":["kept_chief"],"ringUp":{"target":"highest","mul":1.5,"add":5000},"world":{"news":{"M72":"唐三挑战昊天宗首席长老之位未果，由一名外姓首席率宗门出山"},"note":"唐三没有当上昊天宗首席长老"},"trait":{"险":1,"忠":1}}}},{"t":"让出首席，做他的副手","win":{"text":"你起身让开了那把椅子。唐三坐下前对你说：「出山以后，前锋是你的。」","d":{"merit":30,"bonds":{"唐三":25,"唐啸":10},"trait":{"群":1,"仁":1}}}},{"t":"联合长老堂三票否决","hint":"权谋：首席之位，不必打","need":{"名望":65},"win":{"text":"你只是请七长老、九长老喝了顿酒。表决时三票否决，唐三连上场的机会都没有。他看你的眼神，从此冷了。","d":{"rank":1,"merit":40,"bonds":{"唐三":-35},"flags":["vetoed_tangsan"],"trait":{"忠":-2}}}}]},{"id":"fx_haotian_master","title":"昊天令","year":2657,"cond":{"rankMin":2},"canon":"M75","text":"嘉陵关下，唐昊三锤压服了金鳄斗罗。那三锤唐啸在关外看得清清楚楚——他这个弟弟，到底还是比他强。\n\n战后那晚，唐啸在营帐里摆了两只碗，一只给自己，一只给你。「二十年前我爱过一个人，她嫁给了老二。」他喝干了碗里的酒，「后来我替他守宗门，守到今天，守够了。」他把一块刻着昊字的黑令放在桌上：昊天令，可调长老堂，可废宗主。\n\n帐外，唐昊和唐三父子在低声说话。帐内，只有你和这块令。","choices":[{"t":"接下昊天令，执掌五峰","hint":"进入结局：外姓宗主","need":{"战力":2100,"名望":70},"win":{"text":"你接过令牌。第二天唐啸当着三军宣布退位，唐昊什么也没说，第一个朝你抱了拳。","d":{"rank":1,"merit":80,"名望":25,"bonds":{"唐啸":20,"唐昊":10},"shift":12,"world":{"news":{"M85":"战后昊天宗在天斗城重开山门，宗主却是一名外姓人"},"note":"昊天宗第一次由外姓人执掌"},"ending":"fx_haotian_e1","trait":{"逆":2}}}},{"t":"把令牌交给唐昊","hint":"进入结局：五峰云散","win":{"text":"你把昊天令推到帐门口。唐昊进来，看看令牌，又看看他大哥，二十年来第一次叫了一声：「大哥。」","d":{"bonds":{"唐啸":25,"唐昊":25,"唐三":15},"ending":"fx_haotian_e2","trait":{"仁":2,"群":2}}}},{"t":"劝宗主再守十年","win":{"text":"唐啸笑了：「你这人，劝人干活倒是在行。」他把令牌揣回怀里，又守了十年。","d":{"merit":20,"bonds":{"唐啸":15},"trait":{"忠":1}}}}]}],"endings":[{"id":"fx_haotian_e1","title":"结局·外姓宗主","type":"宗","grade":3,"text":"昊天宗在天斗城东重开山门那天，来贺的人从城门排到了山脚。新任宗主不姓唐，这件事被说书人讲了一百年。\n\n你没有改宗规，只添了一条：附属宗族，去者不追，来者不拒。力之一族的泰坦第一个上门，喝醉了说，当年要是有你，他们也不会被抛下。昊天锤还是昊天宗的锤，只是握锤的人，终于不只姓唐。","afterlife":["唐啸：退位后住在五峰旧址，每天走一遍铁索，说是替宗门看门。","唐昊：和阿银在天斗城开了间铁匠铺，偶尔来宗门指点三代弟子。","唐三：成神前回过一次昊天宗，只说了一句：宗门交给你，我放心。","昊天宗：重回天下第一宗门，四大附属宗族重归门下。"],"worldline":"昊天宗第一次由外姓人执掌，唐家兄弟二十年的旧怨在你手里了结。"},{"id":"fx_haotian_e2","title":"结局·五峰云散","type":"散","grade":1,"text":"唐啸把宗主之位传给了唐昊，唐昊三天后传给了唐三，唐三一个月后辞去一切，又转回大伯手里。昊天宗的宗主之位转了一圈，回到原处。\n\n你没有等它转完就下了山。五峰的铁索在身后一根根收起，云把整座山都吞了进去。你在昊天宗守了十年，最后只带走一样东西：唐啸那晚喝剩的半坛酒。","afterlife":["唐啸：重开昊天宗，每年给你寄一坛酒，坛口封着一个昊字。","唐昊：与阿银在天斗城相守，说起你时只说：那是个讲道理的人。","昊天宗：重返天下第一宗门，宗谱的外姓客卿一栏，只有你一个名字。"],"worldline":"昊天宗照原著复出，唐家兄弟的旧怨在一碗酒里散了。"}]},{"id":"landian","name":"蓝电霸王龙宗","desc":"上三宗里最骄傲的一支，魂环只取亚龙。中立了一百年，猎魂之夜以前，它还以为中立能保命。","join":{"need":{"名望":15},"hint":"去龙脊山雷池下挑战守山弟子，赢了，玉元震会亲自见你。"},"ranks":["客卿","长老","大长老","副宗主","宗主"],"rankReq":[{"merit":0,"等级":0},{"merit":30,"等级":42},{"merit":85,"等级":58},{"merit":160,"等级":72},{"merit":280,"等级":86}],"perk":{"desc":"雷霆淬体：战力+12%","power":0.12,"train":0.05,"coins":35},"task":{"name":"龙脊山差事","lines":["随玉天恒去落日森林猎一头亚龙种，他非要先跟你打一架。","替宗主给天斗城的大师送一封信，信封上没写落款。","在雷池边替幼龙子弟护法，一道雷劈歪了，劈在你头上。","去巴拉克王国收一笔旧账，对方说只认玉家的龙，不认人。","陪二家主玉罗冕巡山，他问起柳二龙时声音放得很轻。"]},"nodes":[{"id":"fx_landian_master","title":"教皇殿的长谈","year":2645,"cond":{"rankMin":0},"canon":"M36","text":"精英大赛还没打完，宗主玉元震私下找到你：「小刚要去见那个人。你跟着，别让他看见。」\n\n大师玉小刚是宗主的独子，二十多年没回过龙脊山。他攥着一块长老令走进教皇殿，背挺得笔直，出来时却像老了十岁。殿门关着，你守在外头，听见里面有个女人的声音，冷得像冰，又在最后一句裂开了：「小刚，我的事，你永远不要知道。」\n\n大师出来，看见了你。他没问你是谁派来的。","choices":[{"t":"劝大师回一趟龙脊山","hint":"父子之间，你来递话","need":{"魅力":40},"win":{"text":"他沉默了一路，到天斗城门才开口：「过年，我回去一趟。」那一年，玉元震在雷池边站了一整夜。","d":{"merit":20,"bonds":{"大师":15,"玉元震":20},"flags":["master_home"],"trait":{"群":1,"仁":1}}}},{"t":"把殿里听到的报给宗主","need":{"精神":40},"win":{"text":"你一字不漏地报了上去。玉元震听完只说了一句：「那个女人，迟早会来找蓝电。」","d":{"merit":25,"bonds":{"玉元震":10,"大师":-5},"flags":["warned_bibi"],"trait":{"忠":1}}}},{"t":"什么也不问，送他回去","win":{"text":"你陪他走到天斗城，一句话没问。分别时他说：「替我谢谢父亲。」","d":{"merit":10,"bonds":{"大师":10},"trait":{"仁":1}}}}]},{"id":"fx_landian_bones","title":"宗主的三块魂骨","year":2649,"cond":{"rankMin":1},"canon":null,"text":"玉元震有三块魂骨：头骨、躯干、右臂，都是历代宗主传下来的，蓝电霸王龙宗的半条命。\n\n这一年他开始咳血。不是病，是老了，雷霆在骨头里烧了一百年。他把你叫到雷池底的密室，三块魂骨摆在石台上，雷光在上面爬。「天恒还撑不起来，小刚又不肯回来。武魂殿的人最近在山下转得勤。」他看着你，「这三块骨头，你说放在哪里最稳？」\n\n石台旁边还有一个空匣子，是他早就备好的。","choices":[{"t":"沉进雷池最深处","hint":"原著留白：三块魂骨下落不明","need":{"名望":30},"win":{"text":"你亲手把匣子沉进雷池底，只有你和宗主知道位置。他让你在池底泡了三天三夜，雷光把你的魂环淬亮了一层。","d":{"merit":30,"bonds":{"玉元震":20},"flags":["hid_bones"],"ringUp":{"target":"last","mul":1.4,"add":3000},"trait":{"忠":1,"险":-1}}}},{"t":"请宗主赐你一块","hint":"得一块魂骨，宗门会议论","need":{"战力":1000},"win":{"text":"玉元震看了你很久，把右臂骨推过来：「你比天恒更像我年轻的时候。」融骨那天，你一拳把雷池打出一个坑。","d":{"merit":10,"bone":{"slot":"右臂","name":"蓝电霸王龙右臂骨","desc":"雷霆缠臂，一拳带万钧雷暴","attrs":{"体魄":6,"精神":2}},"bonds":{"玉元震":10,"玉天恒":-15},"trait":{"险":1,"忠":-1}}}},{"t":"交给玉天恒保管","win":{"text":"你说骨头是玉家的，该在玉家人手里。玉天恒接过匣子时，手在抖。","d":{"merit":20,"bonds":{"玉天恒":20,"玉元震":10},"flags":["bones_tianheng"],"trait":{"群":1}}}}]},{"id":"fx_landian_envoy","title":"白金主教的来信","year":2650,"cond":{"rankMin":1},"canon":"M47","text":"天斗武魂圣殿的白金主教萨拉斯亲自上了龙脊山，带着一封教皇手书：蓝电霸王龙宗归附武魂殿，宗主之子玉小刚入长老殿，从此两家是一家。\n\n信写得很客气，客气得像一张讣告。玉元震把信传给长老们看，没人说话。萨拉斯在雷池边负手看风景：「冕下给你们一年。一年不答，就不用答了。」\n\n玉元震的目光落在你身上。你是外人，有些话外人说得，玉家人说不得。","choices":[{"t":"当众撕信，逐他下山","hint":"立威，也把那一天拉近了","need":{"战力":1150},"win":{"text":"你把信撕成两半扔进雷池，一掌把萨拉斯逼退到山门。他擦着嘴角的血笑了：「好，好。」","d":{"merit":30,"名望":12,"bonds":{"玉元震":10},"rep":{"武魂殿":-30},"flags":["tore_letter"],"trait":{"险":2,"逆":1}}}},{"t":"虚与委蛇，暗中备战","hint":"为猎魂之夜留一条退路","need":{"精神":55},"win":{"text":"你替宗主写了一封回信，三个月拖成半年。半年里，后山多了一条通往雷池古道的暗路。","d":{"merit":35,"bonds":{"玉元震":15},"flags":["prepared"],"trait":{"险":-1}}}},{"t":"劝宗主先送走老弱","win":{"text":"你说答与不答，先把孩子送出山。玉元震点了头，却只送走了一百人——蓝电的骨头太硬。","d":{"merit":20,"flags":["sent_children"],"trait":{"仁":1}}}}]},{"id":"fx_landian_night","title":"龙脊山守夜","year":2651,"cond":{"rankMin":1},"canon":"M51","echo":{"flag":"prepared","text":"前因 · 2650：你拖了萨拉斯半年，后山多了一条暗路。"},"text":"八千人。火把从山脚排进云里，像一条倒着往上爬的火龙。领头的是两名长老殿长老，后面一顶黑纱轿子，轿帘始终没有掀开。\n\n玉元震化出了蓝电霸王龙真身，雷云压得整座山都在响。他回头对你说了今晚唯一一句话：「蓝电的骨头，不能落在他们手里。」玉天恒带着三代子弟守在雷池边，最小的才七岁。\n\n轿帘动了一下。你感觉到一股死亡蛛皇的气息，冷得像那天在教皇殿门外听见的声音。","choices":[{"t":"死守龙脊山到天亮","hint":"改写原著：蓝电不灭","need":{"战力":1500},"canonChange":{"node":"M51","inertia":5,"desc":"蓝电霸王龙宗没有被灭门"},"win":{"text":"你和玉元震一前一后守着山门，雷霆劈到天亮。黑纱轿子在晨光里退走，轿里的人一句话也没留下。蓝电霸王龙宗还在。","d":{"rank":1,"merit":70,"名望":25,"伤势":55,"bonds":{"玉元震":30,"大师":35,"玉天恒":25,"比比东":-30},"rep":{"武魂殿":-40,"宗门":30},"shift":20,"flags":["held_mountain"],"world":{"news":{"M51":"猎魂之夜，蓝电霸王龙宗死守龙脊山到天亮，武魂殿八千人无功而返"},"note":"蓝电霸王龙宗没有被灭门，大师不必背负血仇"},"trait":{"逆":3,"险":2}}}},{"t":"带孩子们从古道突围","hint":"保下三百人","win":{"text":"你领着三百个孩子从雷池古道钻出去，回头时龙脊山已经没有一盏灯了。玉天恒一路没哭，到了天斗城才跪下。","d":{"merit":40,"伤势":25,"bonds":{"玉天恒":35,"大师":20},"flags":["saved_youth"],"world":{"news":{"M51":"猎魂之夜，蓝电霸王龙宗满门遭屠，仅三百名少年从雷池古道逃出"},"note":"蓝电霸王龙一脉留下了三百颗种子"},"trait":{"仁":2}}}},{"t":"抢回宗主的魂骨","hint":"原著留白：魂骨的下落","need":{"战力":1300},"win":{"text":"玉元震倒下时，你从长老殿的人手里夺回骨匣，背上挨了一记蛛矛。宗主的魂骨，没有落进武魂城。","d":{"merit":45,"伤势":45,"bonds":{"大师":15},"flags":["saved_bones"],"item":"蓝电宗主骨匣","world":{"note":"蓝电宗主的三块魂骨没有落入武魂殿之手"},"trait":{"险":2}}}}]},{"id":"fx_landian_rebirth","title":"七宗重选","year":2652,"cond":{"rankMin":1},"canon":null,"text":"武魂殿的七宗重选大会在武魂城开了七天。旧七宗只来了两家，新七宗的位子早就分好了，圣龙宗主拓跋希坐在第一把椅子上，龙鳞在封号斗罗的红袍下泛着光。\n\n你扛着蓝电霸王龙宗的旗子走进会场，满座哗然。拓跋希笑了：「蓝电？我圣龙宗才是真龙。亚龙种，也配排在上三宗？」\n\n大师坐在观礼席上，脸色比纸还白。他在看主位上那个女人，那个女人也在看他。","choices":[{"t":"上台挑战拓跋希","hint":"真龙对亚龙，当着全大陆打一场","need":{"战力":1700},"win":{"text":"你的雷霆劈碎了圣龙第三片逆鳞，拓跋希跪在台上起不来。满场寂静里，主位上的比比东第一次鼓了掌。蓝电的旗，插回了上三宗的位子。","d":{"rank":1,"merit":50,"名望":25,"bonds":{"比比东":5},"rep":{"武魂殿":-10,"宗门":25},"world":{"offset":{"拓跋希":-3},"note":"蓝电霸王龙宗在武魂殿眼皮底下夺回了上三宗之名"},"trait":{"险":2}}}},{"t":"陪大师去见比比东","hint":"大师与比比东，最后一面","need":{"魅力":55},"win":{"text":"那晚你守在殿外。大师出来时眼睛是红的：「她承认了，龙脊山那一夜，是她。她说，是为了我。」他笑了一声，比哭还难听。","d":{"merit":20,"bonds":{"大师":30,"柳二龙":10},"flags":["master_bibi"],"reveal":["比比东"],"trait":{"群":1}}}},{"t":"卷起旗子，退出大会","win":{"text":"你把旗子卷起来带走了。蓝电不在他们的名单上，也就不欠他们什么。","d":{"merit":10,"rep":{"武魂殿":-5},"trait":{"逆":1,"群":-1}}}}]},{"id":"fx_landian_king","title":"蓝电长鸣","year":2656,"cond":{"rankMin":2},"canon":"M75","echo":{"flag":"held_mountain","text":"前因 · 2651：猎魂之夜，你和玉元震守住了龙脊山。"},"text":"嘉陵关下，黄金圣龙又一次出现在战场上。大师、弗兰德、柳二龙三个人站成一个三角，金色的龙影压住了半边天。\n\n战后，雪崩封大师为蓝电王，蓝电霸王龙宗的旗子插上了天斗城头。大师却把王印推到你面前：「我是个废武魂，这辈子只会讲道理。宗门要的是能打雷的人。」柳二龙站在他身后，这一回没有骂他，只是握住了他的手。\n\n雷池那边，玉天恒在等你的回答。","choices":[{"t":"接下宗主之位","hint":"进入结局：雷鸣龙脊","need":{"战力":1900,"名望":65},"win":{"text":"你接过王印，第一件事是带全宗回龙脊山。雷池重新亮起来的那一夜，整座山都在长鸣。","d":{"rank":1,"merit":80,"名望":20,"bonds":{"大师":20,"玉天恒":15},"ending":"fx_landian_e1","trait":{"忠":1}}}},{"t":"把宗主之位让给玉天恒","hint":"进入结局：龙骨归家","win":{"text":"你把王印推给玉天恒。他跪下接了，又站起来，红着眼说：「这个宗门，你守过，玉家记一辈子。」","d":{"bonds":{"玉天恒":30,"大师":20},"ending":"fx_landian_e2","trait":{"仁":2,"群":1}}}},{"t":"随大师入天斗做幕僚","win":{"text":"你跟大师进了天斗城，做了那个替他把道理讲成刀的人。","d":{"merit":20,"bonds":{"大师":25},"rep":{"天斗":15},"trait":{"群":1}}}}]}],"endings":[{"id":"fx_landian_e1","title":"结局·雷鸣龙脊","type":"宗","grade":3,"text":"龙脊山重修山门那年，雷池里孵出了第一条幼龙。蓝电霸王龙宗的宗谱上，第一次出现了一个外姓宗主的名字，下面一行小字：猎魂之夜，守山之人。\n\n你没有改掉亚龙种的祖训，也没有去武魂城报仇——那个女人已经不在了。你只是每年那一夜都在山门前站一宿，等天亮，像在替谁守着什么。","afterlife":["大师：做了蓝电王兼天斗国师，晚年和柳二龙住在龙脊山脚，再不自称废武魂。","玉天恒：成了宗门大长老，独孤雁的碧磷蛇毒，你替他找到了解法。","柳二龙：火龙终于回了家，在雷池边教小孩子打架。","蓝电霸王龙宗：重回上三宗之列，雷池百年不熄。"],"worldline":"蓝电霸王龙宗在外姓宗主手里重回上三宗，龙脊山的雷又响了起来。"},{"id":"fx_landian_e2","title":"结局·龙骨归家","type":"义","grade":2,"text":"玉天恒接了宗主之位，第一道命令是把你的名字刻进玉家祠堂，排在玉元震的下一行。族里有老人反对，他只说：「那些年没有这个人，就没有玉家。」\n\n你没有留在龙脊山。临走那天，大师送你到山门，递给你一本手抄的册子，是他一辈子的武魂理论，扉页上写着：给那个替我守过家的人。","afterlife":["玉天恒：带着蓝电霸王龙宗重回龙脊山，娶了独孤雁，生了一条会打雷的小龙。","大师：与柳二龙终成眷属，那本册子的底稿，一直放在他枕边。","蓝电霸王龙宗：宗谱上多了一个外姓人，排在宗主的下一行。"],"worldline":"蓝电霸王龙宗由玉家人重新执掌，你的名字留在了玉家祠堂里。"}]},{"id":"tiandou","name":"天斗皇室","desc":"天斗帝国皇权分散、外强中干。供奉殿里坐着毒斗罗，东宫里坐着一个谁也看不透的人。","join":{"need":{"名望":20},"hint":"在天斗城大斗魂场打出名号，东宫和雪星亲王府都会递帖子。"},"ranks":["供奉","护国供奉","国师","帝师","摄政王"],"rankReq":[{"merit":0,"等级":0},{"merit":30,"等级":45},{"merit":90,"等级":60},{"merit":170,"等级":72},{"merit":280,"等级":85}],"perk":{"desc":"皇室供奉：俸禄最厚","power":0.05,"train":0.05,"coins":100},"task":{"name":"皇室差事","lines":["替太子去皇家学院训话，梦神机三位教委在下面打瞌睡。","陪四皇子雪崩逛遍天斗城的酒楼，他每一家都赊账。","替雪星亲王巡视三大军区，有个营的兵册上一半是死人。","去嘉陵关外探查武魂殿的工事，城墙一个月又高了三尺。","在皇宫地牢审一个武魂殿探子，他只肯说出一个名字。"]},"nodes":[{"id":"fx_tiandou_prince","title":"太子的茶","year":2645,"cond":{"rankMin":0},"canon":"M29","text":"太子雪清河请人喝茶，从来只请一个人。他的书房在东宫最深处，窗外一树白梨，茶是天斗北境的雪顶，烫得刚好。\n\n「供奉殿里有毒斗罗，学院里有三位魂斗罗，父皇身边却缺一个自己人。」他笑起来眉眼温和，说的每一句都滴水不漏，「我想请你，做我的自己人。」\n\n出东宫时，你在宫门外撞上四皇子雪崩。他浑身酒气，拽着你的袖子不放：「太子哥哥请你喝茶了？他的茶，可不好喝。」说完打了个嗝，眼神却清醒得吓人。","choices":[{"t":"做东宫的门客","hint":"他是全天斗最好的主上","win":{"text":"雪清河亲手给你斟了第二杯。从此东宫的门对你不设防——至少看起来是这样。","d":{"merit":20,"bonds":{"千仞雪":20},"flags":["prince_man"],"trait":{"忠":1}}}},{"t":"跟雪崩去喝花酒","hint":"纨绔四皇子，未必是纨绔","need":{"魅力":35},"win":{"text":"那一夜雪崩喝倒了三个人，只有你看见他把酒全倒进了袖子里。他冲你眨了眨眼。","d":{"merit":15,"bonds":{"雪崩":20},"flags":["xuebeng_friend"],"trait":{"群":1}}}},{"t":"去供奉殿拜见毒斗罗","need":{"名望":25},"win":{"text":"独孤博眯着眼看你：「太子请你喝茶了？喝了就喝了，别喝第二杯。」","d":{"merit":15,"bonds":{"独孤博":15},"trait":{"险":-1}}}}]},{"id":"fx_tiandou_poison","title":"七彩斑斓","year":2648,"cond":{"rankMin":0},"canon":null,"echo":{"flag":"prince_man","text":"前因 · 2645：你做了东宫的门客，那里的门对你从不设防。"},"text":"雪夜大帝的咳嗽一年比一年重。御医说是风寒，独孤博闻了闻皇帝喝剩的药渣，脸色变了一瞬，又什么都没说。\n\n你在御药房的账册里翻到一味药：七彩斑斓的引子，经手人是东宫的一个小太监，三个月前失足落井。二皇子死在三年前，三皇子死在前年，都说是急病。\n\n账册还在你手里，御药房的灯快灭了。东宫那边，有人在等你今晚过去喝茶。","choices":[{"t":"把账册呈给雪夜大帝","hint":"打草惊蛇，但皇帝会信你","need":{"名望":40},"win":{"text":"雪夜看完账册，沉默很久：「朕知道了，你先回去。」第二天东宫换了一批太监，太子的茶再没请过你。","d":{"merit":30,"bonds":{"雪夜":20,"千仞雪":-25},"flags":["knew_poison"],"trait":{"忠":1,"险":1}}}},{"t":"请独孤博配一副解药","hint":"替皇帝暗中续命","need":{"精神":50},"win":{"text":"独孤博骂骂咧咧配了三个月，七彩斑斓的毒被压住了三成。雪夜的咳嗽轻了，没人知道为什么。","d":{"merit":30,"bonds":{"独孤博":20,"雪夜":10},"flags":["slowed_poison"],"world":{"note":"雪夜大帝体内的七彩斑斓被暗中压住了三成"},"trait":{"仁":1}}}},{"t":"烧了账册，去东宫喝茶","hint":"从此你是太子的人","win":{"text":"账册在灯芯上卷成了灰。东宫的茶还是那么烫，雪清河说：「你来晚了。」你说：「路上灯灭了。」","d":{"merit":25,"bonds":{"千仞雪":25},"flags":["burned_ledger"],"trait":{"忠":-1,"仁":-2}}}}]},{"id":"fx_tiandou_xuebeng","title":"四皇子的命","year":2650,"cond":{"rankMin":1},"canon":null,"echo":{"flag":"xuebeng_friend","text":"前因 · 2645：你见过雪崩把酒倒进袖子里。"},"text":"雪崩从皇家猎场回来的路上翻了车。马是被人射倒的，箭上没有记号。车里本该是雪崩，坐着的却是他的贴身小厮。\n\n第二天夜里，雪崩翻窗进了你的府邸，身上还穿着那身花里胡哨的袍子，脸上却一点笑都没有：「二哥、三哥都是这么没的。我装了十年纨绔，装不下去了。」他把一枚刻着龙的皇牌拍在桌上：「我手里只有这个。你帮我活下来，我登基那天，你要什么给什么。」\n\n窗外有脚步声，很轻，是东宫的人。","choices":[{"t":"拔剑，护住雪崩","hint":"和东宫撕破脸","need":{"战力":1100},"win":{"text":"进来的六个人，你留下五具尸体，放走一个回去报信。雪崩看着满地血，第一次叫你：「先生。」","d":{"merit":40,"伤势":20,"bonds":{"雪崩":35,"千仞雪":-30},"flags":["saved_xuebeng"],"trait":{"仁":1,"险":1}}}},{"t":"连夜送雪崩出城","win":{"text":"你把他送出南门，扮成商贩混进去巴拉克的车队。东宫的人扑了空，太子的笑容第一次挂不住了。","d":{"merit":25,"bonds":{"雪崩":20},"flags":["xuebeng_fled"],"trait":{"险":-1}}}},{"t":"两边下注，假意交人","hint":"权谋：东宫与雪崩都欠你","need":{"精神":55},"win":{"text":"你让东宫的人带走一个替身，真雪崩藏进你府里的地窖。两边都以为你是自己人。","d":{"merit":35,"bonds":{"雪崩":15,"千仞雪":10},"flags":["double_game"],"trait":{"忠":-2}}}}]},{"id":"fx_tiandou_coup","title":"天斗宫变","year":2652,"cond":{"rankMin":1},"canon":"M56","echo":{"flag":"knew_poison","text":"前因 · 2648：七彩斑斓的账册，你早就呈给过雪夜大帝。"},"text":"雪夜大帝病危的消息是假的，宫变是真的。那一夜皇宫禁卫换了一半，换上来的人袖口都绣着一道金线——武魂殿的金线。\n\n雪清河站在太和殿上，六翼天使在他背后缓缓张开，金光照得殿内亮如白昼。他不再掩饰，声音变得清亮：「天斗的皇位，我等了十五年。」唐三和史莱克的人破瓦而入，刺血斗罗与蛇矛斗罗堵住殿门，雪崩被押在龙椅旁。\n\n千仞雪看着你，像是早知道你会站在哪里，又像还在等你选。","choices":[{"t":"亲手揭下她的面具","hint":"与千仞雪正面交手","need":{"战力":1400},"win":{"text":"你和唐三一左一右，蓝银草缠住六翼，你一击砸碎了天使领域一角。金光散尽，殿上站着一个金发女子。她看你的眼神，从此只有恨。","d":{"rank":1,"merit":50,"名望":20,"伤势":35,"bonds":{"千仞雪":-40,"唐三":15,"雪崩":20,"雪夜":20},"rep":{"武魂殿":-30,"天斗":20},"flags":["unmasked_qrx"],"trait":{"险":1,"忠":1}}}},{"t":"抢下雪崩，护他出殿","hint":"救驾之功；皇室秘库淬环","win":{"text":"你踹开押人的禁卫，背着雪崩从偏殿杀出去。天亮后雪夜开了皇室秘库，取龙血玉髓替你淬了一道魂环。","d":{"rank":1,"merit":40,"bonds":{"雪崩":30,"雪夜":15},"flags":["saved_xuebeng"],"ringUp":{"target":"lowest","mul":1.6,"add":2000},"trait":{"仁":1}}}},{"t":"站到千仞雪身后","hint":"改写原著：宫变成功","need":{"名望":45},"canonChange":{"node":"M56","inertia":5,"desc":"宫变成功，天斗帝国落入千仞雪之手"},"win":{"text":"你拔剑指向殿顶的唐三。供奉殿倒向东宫，史莱克的人带伤退走。天亮时雪清河坐上龙椅，看你像在看一件刚到手的珍宝。","d":{"rank":1,"merit":60,"bonds":{"千仞雪":40,"唐三":-40,"雪崩":-50},"rep":{"武魂殿":30,"天斗":-30},"shift":25,"flags":["coup_success"],"world":{"offset":{"唐三":-3},"news":{"M56":"天斗宫变成功，太子雪清河登基，天斗帝国实际归于武魂殿","M57":"宁风致辞去一切官职，七宝琉璃宗与天斗皇室决裂"},"note":"天斗帝国落入千仞雪之手，唐三失去了最大的盟友"},"trait":{"逆":3,"忠":-2}}}}]},{"id":"fx_tiandou_regent","title":"雪夜驾崩","year":2654,"cond":{"rankMin":2,"notFlag":"coup_success"},"canon":"M73","echo":{"flag":"saved_xuebeng","text":"前因 · 宫墙之内：你救过雪崩的命，他叫过你一声先生。"},"text":"雪夜大帝是在一个下雪的早晨走的。宁风致用秘法替他续了两年命，最后那一夜，皇帝把你和雪崩一起叫到榻前。\n\n「崩儿装了十年糊涂，朕都知道。」他握着儿子的手，眼睛却看着你，「他心软，好大喜功，打不了仗。武魂殿立了国，天斗要一个镇得住朝堂的人。」他从枕下摸出一道遗诏，名字那一栏空着：「帝师的位子，你自己填。」\n\n雪崩跪在榻边，没有抬头。殿外，雪星亲王带着三大军区的将领候着，也在等这道遗诏。","choices":[{"t":"填上自己，执掌兵符","hint":"改写原著：唐三拿不到军权","need":{"名望":70},"canonChange":{"node":"M73","inertia":4,"desc":"雪崩拜你为师，天斗军权不在唐三手中"},"win":{"text":"你在遗诏上写下自己的名字。雪崩登基那天当众拜你为师，百万天斗军的兵符落在你手里。","d":{"rank":1,"merit":60,"名望":15,"bonds":{"雪崩":20,"唐三":-15},"rep":{"天斗":20},"shift":15,"flags":["dishi"],"world":{"news":{"M73":"新帝雪崩当众拜帝师，帝师却不是唐三；天斗军权握在帝师一人手中"},"note":"唐三没有接掌天斗军方，只以客将身份参战"},"trait":{"逆":2}}}},{"t":"空着遗诏，交给雪崩","hint":"让他自己当皇帝","win":{"text":"你把遗诏折好放进雪崩手里：「名字你来写。」他攥着那张纸，哭得像个孩子。后来他写的是唐三。","d":{"merit":30,"bonds":{"雪崩":30,"唐三":10},"trait":{"仁":1,"群":1}}}},{"t":"联手雪星亲王压住朝堂","hint":"权谋：军中有人","need":{"精神":60},"win":{"text":"你和雪星亲王在殿外谈了一盏茶。遗诏宣读时，三大军区的将领没有一个出声。","d":{"merit":40,"bonds":{"雪崩":-5},"flags":["xuexing_pact"],"trait":{"忠":-1}}}}]},{"id":"fx_tiandou_jialing","title":"嘉陵关","year":2656,"cond":{"rankMin":2,"notFlag":"coup_success"},"canon":"M75","text":"嘉陵关的城墙一百米高、一百米厚，护城河里的水是黑的。天斗围了它三个月，唐家军的诸葛神弩射秃了半面城墙，关还在。\n\n这一夜军帐里吵翻了。雪崩拍着沙盘要明日总攻：「六大供奉刚到，再等，就等来比比东了！」唐三摇头，说至少还要十天。将领们分成两边，都看向你——这一仗听谁的，你一句话就能定。\n\n原本的史书上，这一夜之后，天斗死了十万人。","choices":[{"t":"按住雪崩，十日后再攻","hint":"进入结局：天斗柱石","need":{"名望":65},"win":{"text":"你当着众将收了雪崩的令箭。十天后唐家军从地道打开关门，天斗只折了一万人。雪崩事后说：「朕差一点就成了罪人。」","d":{"rank":1,"merit":70,"名望":25,"bonds":{"雪崩":15,"唐三":20},"shift":12,"world":{"news":{"M75":"嘉陵关总攻推迟十日，天斗军伤亡由十万减到一万"},"note":"雪崩没有违令强攻，天斗少死了九万人"},"ending":"fx_tiandou_e1","trait":{"仁":2}}}},{"t":"夺下帅印，亲自破关","hint":"与唐三争帅印","need":{"战力":2000},"win":{"text":"你和唐三在帐前对峙了一盏茶，最后他把帅印推给你：「你来。」那一夜你亲自登城，嘉陵关的城门在黎明前塌了。","d":{"rank":1,"merit":80,"名望":30,"bonds":{"唐三":-10,"雪崩":10},"world":{"offset":{"唐三":-2},"news":{"M75":"嘉陵关一夜而破，破关的是天斗帝师，不是唐三"},"note":"嘉陵关的头功不在唐三名下"},"ending":"fx_tiandou_e1","trait":{"险":2,"逆":1}}}},{"t":"顺着雪崩，明日总攻","hint":"进入结局：宫墙之外","win":{"text":"总攻在黎明开始，到黄昏时护城河被尸体填平了。十万人。战后朝堂要一个人担这笔账，那个人是你。","d":{"名望":-20,"bonds":{"雪崩":-20},"ending":"fx_tiandou_e2","trait":{"忠":1,"仁":-1}}}}]}],"endings":[{"id":"fx_tiandou_e1","title":"结局·天斗柱石","type":"王","grade":3,"text":"战后第三年，雪崩在朝会上加封你为摄政王。你推辞了三次，第四次他把诏书直接贴在了你的府门上。\n\n天斗的皇权从来没有这么稳过。七宝琉璃宗、昊天宗、唐门都在城里，谁也不服谁，却都肯来你府上喝一杯茶。你喝茶从不请第二个人——这个习惯，是跟一个早就不在天斗的人学的。","afterlife":["雪崩：成了天斗百年来最好的皇帝，却一直改不掉在朝会上打瞌睡的毛病。","千仞雪：自碎神位后不知去向，只有你每年收到一包北境的雪顶茶。","独孤博：赖在你府上的客房不走，说是替你试毒。","天斗帝国：与星罗约定十年不战，皇权在摄政王手里稳了一代人。"],"worldline":"天斗帝国有了一根撑得住朝堂的柱子，嘉陵关外少了九万座坟。"},{"id":"fx_tiandou_e2","title":"结局·宫墙之外","type":"贬","grade":1,"text":"罪名是贪功冒进，判的是削去一切官职，永不录用。雪崩没有来送你，只托人带了一句话：朕对不起你。\n\n你出天斗城那天下着雪，像雪夜大帝走的那个早晨。城门口有个卖茶的老人给你倒了一碗，烫得刚好。喝完你才看见碗底压着一枚龙形皇牌，背面刻着四个小字：来日方长。","afterlife":["雪崩：嘉陵关之后再没违过一次军令，朝堂上每逢有人提起你，他便散朝。","唐三：辞官前替你上过一道折子，被压在御书房最底下。","天斗帝国：赢了战争，十万座坟立在嘉陵关外，碑上没有你的名字，也没有你的罪。"],"worldline":"嘉陵关照原著死了十万人，史书把这笔账记在了你的名下。"}]},{"id":"xingluo","name":"星罗皇室","desc":"投效戴氏皇族，执掌星罗兵权。皇子相残的祖制、南北百年的宿怨，都押在你的刀上。","join":{"need":{"名望":15},"hint":"持魂师令入星罗城，过皇家供奉殿的三场考校。"},"ranks":["客卿","供奉","元帅","护国公","摄政王"],"rankReq":[{"merit":0,"等级":0},{"merit":30,"等级":40},{"merit":90,"等级":55},{"merit":170,"等级":70},{"merit":280,"等级":85}],"perk":{"desc":"军功爵禄，战力加成","power":0.1,"train":0,"coins":60},"task":{"name":"星罗军务","lines":["随边军巡视水云关，清剿越境的武魂殿斥候。","押运庚辛城新铸的军械北上，沿途提防天斗的探子。","替皇子查一桩账目，账本里藏着另一位皇子的人。","带一队魂师镇压星斗大森林南缘涌出的魂兽潮。"]},"nodes":[{"id":"fx_xingluo_01","title":"两位皇子","year":2646,"cond":{},"canon":"留白·星罗夺嫡","text":"精英大赛散场不到半年，三皇子戴沐白回到了星罗城。朱竹清跟在他身边，两人每天天不亮就上斗虎台对练，白虎的啸声半个皇城都听得见。\n\n大皇子戴维斯的帖子先到。他亲手给你斟酒：「老三在天斗混了几年，回来就想翻天。星罗的规矩你懂，赢的那个活，输的那个连名字都留不下。」\n\n第二天，戴沐白在校场堵住你，只说了一句：「我不拉人。你要站哪边，站到我面前说清楚。」供奉殿的老人提醒你：陛下最厌恶的，就是外人替他挑儿子。","choices":[{"t":"喝下大皇子的酒","win":{"text":"戴维斯拍着你的肩笑了。当晚，你的名字进了大皇子府的供奉名册。","d":{"bonds":{"戴维斯":20,"戴沐白":-10},"flags":["xl_weisi"],"merit":15,"trait":{"险":1}}}},{"t":"站到戴沐白面前","need":{"魅力":35},"win":{"text":"戴沐白盯了你很久，扔给你一壶酒：「喝了，以后就是兄弟。」朱竹清在一旁没说话，只点了一下头。","d":{"bonds":{"戴沐白":20,"朱竹清":10,"戴维斯":-10},"flags":["xl_mubai"],"merit":10,"trait":{"群":1}}}},{"t":"两份帖子原样呈进宫","win":{"text":"皇帝什么也没说。三天后，你多了一份直属皇帐的差事。","d":{"bonds":{"星罗皇帝":15},"flags":["xl_throne"],"merit":25,"trait":{"忠":2}}}}]},{"id":"fx_xingluo_02","title":"斗虎台","year":2650,"cond":{},"canon":"留白·星罗夺嫡","echo":{"flag":"xl_weisi","text":"前因 · 2646：你喝下了大皇子的酒。"},"text":"斗虎台的规矩四百年没变：两位皇子各带未婚妻上台，幽冥白虎对幽冥白虎，输的一方入寂园，废去魂力，终身圈禁。\n\n台上，朱竹清的身法比三年前快了一倍，朱竹云已经接不住她的爪。两头白虎撞在一起，整座台子都在抖，戴维斯的虎影先裂开了一道缝。\n\n你坐在供奉席上，袖中扣着一枚破罡针。大皇子府这些年给过你很多东西，此刻他们看你的眼神只有一个意思。皇帝坐在高处，像什么都没看见。","choices":[{"t":"一针打散幽冥白虎","hint":"改写原著","need":{"战力":950},"canonChange":{"node":"留白·星罗夺嫡","inertia":4,"desc":"戴沐白输掉斗虎台，被逐出星罗"},"win":{"text":"针没入白虎眉心，融合技崩了。戴维斯一拳把弟弟打下台。当夜朱竹清背着戴沐白翻出了皇城，他回头看你的那一眼，你记了很多年。","d":{"shift":10,"bonds":{"戴维斯":30,"戴沐白":-40,"朱竹清":-30},"flags":["xl_mubai_fell"],"rep":{"星罗":10},"merit":30,"trait":{"仁":-2,"忠":-1},"world":{"offset":{"戴沐白":-3},"note":"戴维斯赢下斗虎台，戴沐白流亡天斗"}}}},{"t":"按住针，看他们分胜负","hint":"原著方向","win":{"text":"戴维斯的虎影碎了。戴沐白赢了，却在台下扶起哥哥，求父皇圈而不废。皇帝没答应，也没拒绝。","d":{"rep":{"星罗":3},"merit":10,"flags":["xl_canon_duel"],"trait":{"忠":1}}}},{"t":"揪出看台下的弩手","need":{"精神":50},"win":{"text":"你看穿了看台下埋伏的弩手，抢先把人揪了出来。戴沐白赢得干干净净，欠了你一份情。","d":{"bonds":{"戴沐白":25,"朱竹清":15,"戴维斯":-30},"merit":20,"flags":["xl_mubai_debt"],"trait":{"仁":1}}}}]},{"id":"fx_xingluo_03","title":"朱笔地图","year":2652,"cond":{"rankMin":1},"canon":"M57","text":"天斗宫变的消息传到星罗城时，皇帝正在看水云关的军报。太子雪清河原来是武魂殿的人，天斗与武魂殿彻底撕破了脸。\n\n当夜，从天斗撤回来的萨拉斯敲开了你的府门。他带来的不是威胁，是一张地图：巴拉克王国、法斯诺行省、诺丁城以南的土地，全用朱笔圈给了星罗。\n\n「教皇冕下只要一件事：武魂殿与天斗开战那天，星罗的大军越过边境。」萨拉斯笑了笑，「星罗等这一天，等了几百年吧？」","choices":[{"t":"收下地图，转呈陛下","win":{"text":"皇帝看着朱笔圈出的土地，一夜没合眼。第二天，水云关增兵三万。","d":{"flags":["xl_map"],"bonds":{"星罗皇帝":10},"merit":25,"rep":{"武魂殿":10},"trait":{"忠":1,"逆":1}}}},{"t":"斩使焚图","need":{"战力":1100},"win":{"text":"萨拉斯没想到你会动手，带着一条断臂逃出了城。武魂殿从此把你的名字写进了黑册。","d":{"rep":{"武魂殿":-25,"天斗":10},"名望":8,"merit":10,"flags":["xl_anti_wuhun"],"trait":{"仁":1,"险":1}}}},{"t":"留使三日，套他底牌","need":{"精神":55},"win":{"text":"三天里，你套出了武魂殿的整套出兵时刻。地图你收下了，萨拉斯却不知道自己说漏了多少。","d":{"flags":["xl_map","xl_intel"],"merit":30,"item":"武魂殿出兵时刻表","trait":{"忠":-1}}}}]},{"id":"fx_xingluo_04","title":"北伐","year":2656,"cond":{"rankMin":2},"canon":"M75","echo":{"flag":"xl_map","text":"前因 · 2652：萨拉斯的朱笔地图，一直锁在你的书房。"},"text":"武魂帝国百万大军压向嘉陵关。天斗把能打的魂师全调去了西线，南境只剩一层窗纸。\n\n星罗的御前会议开了三天。老将主张守约观望，年轻的皇子们眼睛发亮。皇帝把元帅印推到你面前：「天斗和武魂殿打得越久，星罗的机会越大。你说，打还是不打？」\n\n诺丁城离水云关不到两百里。闭上眼，你就能看见虎旗插上天斗城头。你也知道，戴沐白和朱竹清此刻正站在嘉陵关的城墙上。","choices":[{"t":"挥师北伐，直取天斗","hint":"改写原著","need":{"战力":1600,"名望":50},"canonChange":{"node":"M75","inertia":5,"desc":"星罗趁嘉陵关大战挥师北伐，天斗腹背受敌"},"win":{"text":"四十万星罗军越过水云关，七日连下诺丁、索托两城。嘉陵关的天斗军听说后院起火，阵脚大乱。","d":{"shift":25,"flags":["xl_north"],"rank":1,"merit":40,"名望":15,"rep":{"星罗":20,"天斗":-50},"bonds":{"戴沐白":-30,"朱竹清":-20,"星罗皇帝":20},"trait":{"逆":3,"险":2,"仁":-2},"world":{"offset":{"唐三":-3},"news":{"M75":"星罗四十万大军越过水云关北伐，天斗南境失守，嘉陵关总攻被迫推迟"},"note":"南北战争爆发，天斗两线作战"}}}},{"t":"守约观望","hint":"原著方向","win":{"text":"你把元帅印推了回去：「等他们打完，我们再说话。」皇帝赐你入白虎宗祠闭关一月，出来时魂环亮得刺眼。","d":{"merit":15,"rep":{"星罗":5},"ringUp":{"target":"highest","mul":1.2,"add":0},"flags":["xl_wait"],"trait":{"险":-1,"忠":1}}}},{"t":"借道北上，援嘉陵关","need":{"名望":45},"win":{"text":"你带三万星罗魂师开到嘉陵关，虎旗第一次和天斗的龙旗并排。戴沐白在城头看见你，愣了很久。","d":{"rep":{"天斗":25,"武魂殿":-20},"bonds":{"戴沐白":20,"朱竹清":10,"雪崩":15},"merit":25,"shift":6,"flags":["xl_allied"],"world":{"note":"星罗出兵援天斗，南北两国第一次结盟"},"trait":{"仁":2,"群":1}}}}]},{"id":"fx_xingluo_05","title":"白虎拦关","year":2657,"cond":{"flag":"xl_north"},"canon":"M82","echo":{"flag":"xl_mubai_fell","text":"前因 · 2650：斗虎台之后，戴沐白再没踏进星罗城一步。"},"text":"北伐第二年，星罗军打到了天斗城南八十里的平原。你的前锋在这里被两个人拦住了。\n\n戴沐白和朱竹清并肩站在官道中央，身后没有一兵一卒。三皇子周身九道魂环，朱竹清的眼睛冷得像冰。「我是星罗的皇子，」戴沐白开口，「也是史莱克的老大。你要过去，先过我们两个。」\n\n身后是四十万星罗军，身前是幽冥白虎。天斗城头上，雪崩亲自登上了城楼。这一战的胜负，决定这片大陆到底有几个皇帝。","choices":[{"t":"正面击溃幽冥白虎","need":{"战力":2000},"win":{"text":"白虎碎成漫天光点。戴沐白单膝跪地，朱竹清扶着他退进了天斗城。三天后，雪崩递来了降表。","d":{"ending":"fx_xingluo_e1","rank":1,"名望":20,"bonds":{"戴沐白":-40,"朱竹清":-30},"world":{"note":"天斗向星罗称臣，大陆南北归于戴氏"}}}},{"t":"绕开二人，奇袭天斗城","need":{"精神":70},"win":{"text":"你留下大军和他们对峙，自己带三百死士从地下水道摸进了天斗城。天亮时，皇宫换了旗。","d":{"ending":"fx_xingluo_e1","rank":1,"bonds":{"戴沐白":-20,"雪崩":-30},"trait":{"险":2},"world":{"note":"天斗城一夜易主，大陆南北归于戴氏"}}}},{"t":"听他说完，收兵","win":{"text":"你让大军后撤三十里。戴沐白在你帐中喝了一夜酒，第二天带着停战书回了天斗城。","d":{"ending":"fx_xingluo_e2","bonds":{"戴沐白":30,"朱竹清":15},"trait":{"仁":2}}}}]},{"id":"fx_xingluo_06","title":"摄政王印","year":2657,"cond":{"notFlag":"xl_north"},"canon":"M85","text":"武魂帝国覆灭的消息传到星罗城那天，皇帝咳了一夜的血。他把你叫进寝宫，屏退了所有人。\n\n「沐白不要这个位子，他跟着唐三走了。维斯……」老皇帝没说下去。龙床边放着两样东西：一方摄政王印，一封还没盖印的北伐诏书。「天斗打了两年仗，国库空了，嘉陵关死了十万人。现在出兵，三个月就能饮马天斗城。」\n\n他看着你：「印给你。诏书烧不烧，你自己定。」","choices":[{"t":"接印，烧了诏书","win":{"text":"诏书在灯上卷成一团灰。你成了星罗的摄政王，第一道令是遣使去天斗：十年不起刀兵。","d":{"ending":"fx_xingluo_e2","rank":1,"bonds":{"星罗皇帝":15},"trait":{"仁":2}}}},{"t":"接印，盖下诏书","hint":"改写原著","need":{"名望":60},"canonChange":{"node":"M85","inertia":5,"desc":"武魂帝国覆灭后，星罗趁天斗疲敝北伐"},"win":{"text":"王印落在诏书上，声音很轻。三个月后，星罗虎旗出现在天斗城下。","d":{"ending":"fx_xingluo_e1","rank":1,"shift":20,"trait":{"逆":2,"仁":-2},"world":{"offset":{"戴沐白":-2},"news":{"M85":"武魂帝国覆灭三月后，星罗趁天斗疲敝北伐，饮马天斗城"},"note":"原著的十年和平没有到来"}}}},{"t":"把印还给陛下","win":{"text":"你跪下磕了三个头，把印推了回去。老皇帝闭上眼，笑了一下：「你比我的儿子们都清醒。」","d":{"bonds":{"星罗皇帝":20},"名望":5,"trait":{"忠":2}}}}]}],"endings":[{"id":"fx_xingluo_e1","title":"结局·南朝一统","type":"王","grade":3,"text":"斗罗历2658年春，星罗虎旗插上了天斗城头。雪崩在城门口交出国玺，只说了一句「替我照顾好百姓」。你没有称帝，以摄政王之名把两国的版图并在一张图上，史书称之为南朝一统。此后二十年，大陆上不再有南北之分，只有一个越来越沉默的你。戴沐白再也没有回过星罗。","afterlife":["戴沐白：与朱竹清隐居天斗旧地，终生不入星罗城一步。","雪崩：受封北境王，每年上一道请安折，字越写越好。","唐三：神界传下一句话：「不许屠城。」你照做了。","星罗皇室：戴氏一统大陆，摄政王府比皇宫还要热闹。"],"worldline":"星罗吞并天斗，大陆南北一统，原著的十年和平变成了戴氏的天下。"},{"id":"fx_xingluo_e2","title":"结局·虎符归鞘","type":"臣","grade":2,"text":"你把虎符锁进了白虎宗祠，从此星罗的兵只守不攻。戴沐白偶尔回来，在斗虎台上和你喝一壶酒，谈起史莱克，谈起那几年的刀光。南北商路重新开通，诺丁城的铁匠铺又热闹起来。后人说你是星罗最有权的人，也是最不像权臣的人。","afterlife":["戴沐白：与朱竹清成婚，受封镇北王，替星罗守着水云关。","星罗皇帝：两年后病逝，临终把幼孙托付给了你。","雪崩：与星罗互派使节，南北和平延续了三十年。","星罗皇室：斗虎台祖制被废，皇子不再生而为敌。"],"worldline":"星罗收刀入鞘，南北和平从十年变成了三十年。"}]},{"id":"tangmen","name":"史莱克·唐门","desc":"入史莱克，成唐门中人。与唐三并肩，或在他远赴海神岛的几年里，把唐门握进自己手中。","join":{"need":{"名望":15},"hint":"闯过史莱克的四关考核，再让大师点一次头。"},"ranks":["学员","堂主","副门主","长老","门主之位"],"rankReq":[{"merit":0,"等级":0},{"merit":30,"等级":40},{"merit":90,"等级":55},{"merit":170,"等级":70},{"merit":280,"等级":85}],"perk":{"desc":"唐门暗器，修炼加速","power":0.06,"train":0.08,"coins":30},"task":{"name":"唐门差事","lines":["替力堂试射新出炉的诸葛神弩，记下每一支箭的偏差。","跟敏堂的斥候潜进武魂分殿，抄出一份调兵名单。","押一车药材去药堂，杨无敌要亲手验过每一株。","在史莱克新生营当一个月教官，教他们不抛弃不放弃。"]},"nodes":[{"id":"fx_tangmen_01","title":"五年之约","year":2646,"cond":{},"canon":"M41","text":"唐昊一锤砸向教皇殿之后，史莱克七怪散了。唐三被父亲带走，小舞回了星斗大森林，临走前七个人在后山约好：五年后，再聚史莱克。\n\n奥斯卡跪在七宝琉璃宗山门外求见宁风致，被一句「配不上」挡了回来。他立下十年之约，背着包袱走了。胖子跟弗兰德闭关，戴沐白和朱竹清回了星罗。\n\n学院一下子空了。弗兰德把你叫进院长室，难得没算账：「这五年，史莱克总得有人撑着。」大师在一旁咳了一声：「也总得有人替他们看着点。」","choices":[{"t":"留守史莱克","win":{"text":"你搬进了七怪住过的宿舍。五年里，史莱克多了一个只收怪物的教官，也多了一面写满新生名字的墙。","d":{"merit":25,"bonds":{"弗兰德":15,"大师":10},"flags":["tm_stay"],"trait":{"群":1,"忠":1}}}},{"t":"追上奥斯卡同行","need":{"魅力":30},"win":{"text":"你在城外追上了他。奥斯卡咧嘴一笑：「走，带你去吃这辈子最难吃的猎魂小队伙食。」","d":{"bonds":{"奥斯卡":25},"flags":["tm_oscar"],"名望":3,"merit":10,"trait":{"群":1,"险":1}}}},{"t":"独自去星斗寻小舞","need":{"战力":600},"win":{"text":"你在星斗外围转了三个月，没见到小舞，只撞见一头泰坦巨猿蹲在树上看你。它没动手，像在替谁守着什么。","d":{"bonds":{"小舞":10},"rep":{"魂兽":10},"体魄":3,"merit":10,"flags":["tm_xingdou"],"trait":{"险":2}}}}]},{"id":"fx_tangmen_02","title":"唐门初立","year":2651,"cond":{},"canon":"M54","echo":{"flag":"tm_stay","text":"前因 · 2646：七怪散去的五年，是你撑着史莱克。"},"text":"小舞献祭之后，唐三回来了。他瘦得厉害，眼神却比任何时候都硬。七宝琉璃宗出钱，四个单属性宗族带着族人入门，天斗城南竖起了一块新牌匾：唐门。\n\n议事堂第一次开会，五个堂口分下去。力堂给了泰坦，药堂给了杨无敌，敏堂给了白鹤一脉。剩下的武堂，管着唐门所有能打的人。唐三看向胖子，胖子拍着胸口站了起来。\n\n你也站了起来。议事堂里安静了一瞬。胖子看着你，笑容一点点收了回去：「兄弟，这个位子，你也想要？」","choices":[{"t":"跟胖子比一场","need":{"战力":1000},"win":{"text":"凤凰火烧穿了你半边衣袖，你还是先一步把他按在了地上。胖子爬起来，一句话没说，转身走了。","d":{"rank":1,"merit":20,"名望":5,"bonds":{"马红俊":-20,"唐三":-5},"flags":["tm_wutang"],"trait":{"群":-1,"险":1}}}},{"t":"让给胖子，去敏堂","need":{"精神":45},"win":{"text":"你坐了回去，转头跟白鹤要了敏堂副手的位子。散会后，胖子硬塞给你一只烤鸡。","d":{"rank":1,"merit":15,"bonds":{"马红俊":15,"白鹤":10,"白沉香":10},"flags":["tm_mintang"],"trait":{"群":1}}}},{"t":"不要堂口，跟着唐三","win":{"text":"你说：「他在哪里，我在哪里。」唐三看了你一眼，把门主令牌的副牌交到你手上。","d":{"merit":25,"bonds":{"唐三":20},"flags":["tm_shadow"],"trait":{"忠":2}}}}]},{"id":"fx_tangmen_03","title":"沉香","year":2654,"cond":{},"canon":"留白·唐门","echo":{"flag":"tm_mintang","text":"前因 · 2651：你进了敏堂，和白沉香同进同出。"},"text":"唐三带着七怪出海已经两年，海神岛上一点消息也传不回来。唐门的情报全压在敏堂身上，白沉香带着侦察队一趟趟往武魂帝国边境跑，你常和她在同一个山洞里守到天亮。\n\n她是白鹤的孙女，轻功比风还快，说话却很慢。那一夜她问你：「胖子走之前说，回来就娶我。你说，一个人说的话，隔着海还算不算数？」\n\n洞外下着雨。她没有看你，耳根却有些红。你知道这一句答出去，就再也收不回来。","choices":[{"t":"说出藏了三年的心意","hint":"改写原著","need":{"魅力":50},"canonChange":{"node":"M85","inertia":4,"desc":"白沉香没有等马红俊，她选了你"},"win":{"text":"雨停的时候，她靠在你肩上睡着了。那年秋天，白鹤亲自为你们定了亲。","d":{"shift":15,"bonds":{"白沉香":40,"白鹤":15,"马红俊":-40},"flags":["tm_chenxiang"],"trait":{"逆":2,"忠":-1},"world":{"offset":{"马红俊":-3},"note":"马红俊回到大陆时，白沉香已经是别人的未婚妻"}}}},{"t":"替胖子说一句算数","win":{"text":"她笑了笑，把一根雨燕羽毛塞进你手里：「那你替我收着，等他回来再还给他。」","d":{"bonds":{"白沉香":15,"马红俊":15},"merit":10,"trait":{"群":1,"忠":1}}}},{"t":"转开话题，谈军情","win":{"text":"你把地图铺开，指出武魂帝国新修的三条驿道。她看着你，轻轻叹了口气，接过了笔。","d":{"merit":20,"item":"武魂帝国驿道图","trait":{"群":-1}}}}]},{"id":"fx_tangmen_04","title":"门主之位","year":2656,"cond":{"rankMin":1},"canon":"M68","echo":{"flag":"tm_wutang","text":"前因 · 2651：你从胖子手里抢下了武堂。"},"text":"唐三不在的四年，唐门是你撑起来的。七宗重选、武魂帝国立国、杨无双带人夜袭药堂，每一次都是你在议事堂拍的板。九个人的议事堂里，有五个习惯了听你的。\n\n斗罗历2656年，唐三回来了。他额头上多了一道三叉戟烙印，身后跟着六个人，每一个都强得让你快认不出来。\n\n门主的椅子空着。泰坦站在唐三身后，杨无敌站在你身后。唐三没坐，只是看着你：「这四年，辛苦你了。」所有人都在等你开口。","choices":[{"t":"起身，把椅子让给他","win":{"text":"你把门主令牌放在桌上。唐三按住你的手：「副门主的位子，一直是你的。」当夜他用玄天秘法替你梳了一遍魂环。","d":{"rank":1,"merit":25,"bonds":{"唐三":25,"泰坦":15},"ringUp":{"target":"last","mul":1.4,"add":0},"flags":["tm_loyal"],"trait":{"忠":2,"群":1}}}},{"t":"按门规，议事堂投票","hint":"改写原著","need":{"名望":60,"魅力":50},"canonChange":{"node":"M72","inertia":5,"desc":"唐三没能收回唐门，转而只身扶持昊天宗复出"},"win":{"text":"九票里你拿下五票。唐三沉默片刻，转身走出议事堂：「唐门是你的了，我回昊天宗。」胖子追了出去，再没回来。","d":{"rank":2,"shift":20,"rep":{"宗门":10},"bonds":{"唐三":-40,"马红俊":-30,"泰坦":-40,"杨无敌":20},"flags":["tm_master"],"trait":{"忠":-3,"逆":2},"world":{"offset":{"唐三":-4},"news":{"M72":"唐三回到大陆，在唐门议事堂落选，只身回昊天宗任首席长老"},"note":"唐门落入你手，唐家军不再听唐三号令"}}}},{"t":"当众请战：赢我再坐","need":{"战力":1900},"win":{"text":"海神之光和你的武魂撞在一起，议事堂塌了半边。唐三收起三叉戟：「你比我想的还强。我不在时，唐门交给你。」","d":{"rank":1,"merit":30,"名望":15,"bonds":{"唐三":10,"马红俊":-10},"flags":["tm_cohead"],"trait":{"险":2}}}}]},{"id":"fx_tangmen_05","title":"楼高殉炉","year":2656,"cond":{},"canon":"M72","text":"七根深海沉银圣柱炼出的银母送到了庚辛城，楼高看了一眼，说了句「够了」，就把自己关进了熔炉房。\n\n第七天，炉火变成青白色。徒弟们哭着拍门，门里只传出老人的笑声：「神匠一辈子，总得打一件让神也低头的东西。」然后是一声闷响。\n\n火熄了。炉里躺着一支孔雀翎、一匣暴雨梨花针，还有三朵莲花状的机括，花瓣上刻着细小的经文——佛怒唐莲。三朵莲花摆上议事堂的长桌，所有人都看向了你。","choices":[{"t":"留一朵，贴身带上战场","need":{"精神":60},"win":{"text":"莲花入手冰凉，比看上去重得多。你把它缝进了贴身的软甲里。","d":{"item":"佛怒唐莲","flags":["tm_lotus"],"merit":20,"trait":{"险":1}}}},{"t":"全部送去嘉陵关","win":{"text":"三朵莲花连夜送到唐三手上。他回了一封信，只有四个字：唐门不倒。","d":{"bonds":{"唐三":15},"merit":15,"trait":{"群":1,"忠":1}}}},{"t":"封存莲花与图纸","win":{"text":"你把莲花锁进铁匣，钥匙熔进了楼高的炉灰里：「这种东西，多用一次，就多死一城人。」","d":{"merit":10,"flags":["tm_seal"],"trait":{"仁":2}}}}]},{"id":"fx_tangmen_06","title":"最后一朵莲","year":2657,"cond":{},"canon":"M83","echo":{"flag":"tm_lotus","text":"前因 · 2656：楼高的一朵佛怒唐莲，一直贴在你胸口。"},"text":"嘉陵关破了，武魂守军投降的那天，天上落下两道光。比比东成了罗刹神，与千仞雪并肩。唐三迎上去，只撑了一刻钟。\n\n海神陨落的消息传遍了天斗大营。尘心和古榕死在关前，史莱克六怪围着唐三的身体跪成一圈，奥斯卡和宁荣荣拼命催动复活之光。比比东在云端俯视：「三天，天斗投降，否则屠城。」\n\n唐门的人全都看着你。三天，足够做很多事。","choices":[{"t":"一朵唐莲，直上云端","need":{"战力":2000,"精神":75},"win":{"text":"莲花在云端炸开，罗刹神的黑袍被撕开一道口子。比比东第一次低头看你，那一眼让你半边身子没了知觉。就在这一瞬，复活之光亮了。","d":{"ending":"fx_tangmen_e1","伤势":40,"名望":20}}},{"t":"让一万唐家军跪下祈祷","need":{"名望":60},"win":{"text":"你让唐家军一万人跪在营前，喊同一个名字。第三天黎明，海神从光里站了起来。","d":{"ending":"fx_tangmen_e2","bonds":{"唐三":20}}}},{"t":"守住唐门，等他回来","win":{"text":"你没有出手，只是把唐门的人一个个排上了城墙。三天里，没有一个人退。","d":{"bonds":{"唐三":10},"trait":{"群":1,"险":-1}}}}]}],"endings":[{"id":"fx_tangmen_e1","title":"结局·唐门之主","type":"门","grade":3,"text":"战后，唐三解散了唐家军，销毁暗器图纸，把门主令牌的正牌放进你手里：「唐门不该只有暗器。」说完便带着小舞去了神界。你守着天斗城南那块牌匾，把五堂改成七堂，收的弟子里有铁匠的儿子，也有魂兽的后代。很多年后，唐门不再造杀人的东西，却成了大陆上最难招惹的宗门。","afterlife":["唐三：成神前最后一件事，是把唐门交到你手上。","马红俊：武堂堂主做到老，每年都要找你比一场，输赢各半。","泰坦：在力堂熔炉边去世，临终把锤子留给了你。","唐门：以宗门之名立于天斗城南，三百年不衰。"],"worldline":"唐门没有随唐三成神而散，成了大陆上第一个不靠暗器立足的宗门。"},{"id":"fx_tangmen_e2","title":"结局·不抛弃不放弃","type":"群","grade":2,"text":"海神复活的那一刻，一万人的喊声把云都震散了。后来的双神之战你没看清，只记得你站在唐门最前面，一步也没退。战后你回到史莱克，接过了弗兰德的院长之位，在学院门口立了一块石头，刻着七个字：不抛弃，不放弃。来报名的孩子越来越多，你每年只收几个怪物。","afterlife":["唐三：每隔十年回一趟史莱克，在后山和你坐一晚上。","弗兰德：退休后在索托城开了家魂导器店，还是那么抠。","奥斯卡与宁荣荣：魂力恢复后的第一顿饭，是在你的院长室吃的。","史莱克学院：成了大陆第一学院，七怪的名字刻在门口。"],"worldline":"史莱克与唐门合为一体，大陆的下一代怪物从这里走出来。"}]},{"id":"haishendao","name":"海神岛","desc":"远渡魔鬼岛，在海神之光下修炼受考。与唐三同场九考，甚至去争那柄三叉戟。","join":{"need":{"等级":35},"hint":"从瀚海城出海十日，在海马圣柱前接受分配。"},"ranks":["岛民","圣柱候补","圣柱斗罗","大供奉候选","大祭司"],"rankReq":[{"merit":0,"等级":0},{"merit":30,"等级":45},{"merit":90,"等级":60},{"merit":170,"等级":75},{"merit":280,"等级":88}],"perk":{"desc":"海神之光，修炼加速","power":0,"train":0.12,"coins":20},"task":{"name":"圣柱考核","lines":["去怒浪绝境驱赶冲上岸的魔魂大白鲨幼崽，别让它们伤到岛民。","替海马城护航一支远海商队，避开邪魔虎鲸的巡游线。","在海神山的台阶上站满一个时辰，替新来的岛民压阵。","潜进环形海底，清理积了百年的深海沉银碎渣。"]},"nodes":[{"id":"fx_haishendao_01","title":"海马圣柱","year":2647,"cond":{},"canon":"留白·海神岛","text":"船靠上海神岛时，你才明白武魂殿为什么叫它魔鬼岛：四季如春，满岛花香，岸边的岛民看外人的眼神却像在看一具尸体。\n\n海马圣柱下，海马斗罗把手按在你额头上。片刻后他收回手，神情有些古怪：「黄级、紫级，都能保你活着。黑级四到六项，失败就死。你选哪一个？」\n\n远处海神山顶，一个白袍女人站在海神殿前，隔着五百米看了你一眼。岛民说，那是大供奉波赛西，她已经很多年没看过任何一个陆地人了。","choices":[{"t":"接黑级考核","need":{"战力":650},"win":{"text":"额头一烫，一道暗金色的烙印落了下来。海马斗罗沉默很久：「你是十年来第一个敢接黑级的。」","d":{"rank":1,"merit":15,"名望":5,"bonds":{"波赛西":5,"海马斗罗":10},"flags":["hs_black"],"trait":{"险":2}}}},{"t":"接紫级考核","win":{"text":"你选了最稳的路。海马斗罗点点头，把你安排进了海马城的岛民营。","d":{"merit":15,"flags":["hs_purple"],"trait":{"险":-1}}}},{"t":"问那白袍女人是谁","need":{"魅力":35},"win":{"text":"海马斗罗像看傻子一样看着你：「她是这座岛的神，别问第二次。」可当晚，你的考核单上多了一行：大供奉亲阅。","d":{"merit":10,"bonds":{"波赛西":10},"flags":["hs_noticed"]}}}]},{"id":"fx_haishendao_02","title":"空柱","year":2650,"cond":{},"canon":"留白·海神岛","text":"七圣柱中最东边那一根的主人，在睡梦里坐化了。圣柱空了三个月，岛上能争的只剩两个人：你，和海幻斗罗的嫡传弟子。\n\n规矩很简单：两人站上圣柱下的潮台，在怒浪绝境的浪头里打一炷香，谁先落海谁输。海幻斗罗站在台下，脸色阴沉，那个弟子是一手带大的。\n\n海龙斗罗在一旁低声提醒你：「你要是赢了，这座岛上就多了一个记仇的圣柱斗罗。」","choices":[{"t":"正面把对手打落海","need":{"战力":900},"win":{"text":"第七个浪头打下来时，对手被你一掌拍进海里。你站在潮台上浑身湿透，圣柱亮了。","d":{"rank":1,"merit":25,"名望":10,"bonds":{"海幻斗罗":-20},"flags":["hs_pillar"],"trait":{"险":1}}}},{"t":"借浪势逼他自退","need":{"精神":55},"win":{"text":"一炷香里你没出一招杀手，只把浪头一层层压到对手身上。他自己跳进了海里，上来时冲你行了一礼。","d":{"rank":1,"merit":20,"bonds":{"海龙斗罗":15},"flags":["hs_pillar"],"trait":{"仁":1}}}},{"t":"把圣柱让出去","win":{"text":"你下了潮台。海幻斗罗多看了你一眼，那一年，你的考核单上少了最难的两项。","d":{"merit":15,"bonds":{"海幻斗罗":15},"trait":{"群":1,"险":-1}}}}]},{"id":"fx_haishendao_03","title":"三叉戟烙印","year":2652,"cond":{"rankMin":1},"canon":"M61","text":"一艘破船靠上了海神岛，船上下来一群陆地人。领头的青年怀里抱着一只白兔，身后跟着个胖子。他的手刚按上海马圣柱，整根圣柱就亮成了金色。\n\n海神殿的钟响了九声。波赛西亲自走下一千零一级台阶，在那青年额头上留下一道三叉戟烙印——海神九考，百年来第一次有人接。\n\n夜里，她召你进殿。殿中没有点灯，她背对着你：「他叫唐三，唐晨的曾孙。九考任何一考失败，都会被反噬而死。」她顿了顿，「海神从不只看一个人。你要不要也接？」","choices":[{"t":"接九考，与唐三同考","need":{"战力":1100,"精神":55},"win":{"text":"烙印落下的一瞬，你听见了海的声音。第二天在台阶上，唐三只问了一句：「你也是？」你点头，他也点头。","d":{"flags":["hs_rival"],"merit":20,"shift":5,"bonds":{"唐三":-5,"波赛西":15},"trait":{"逆":2,"险":2}}}},{"t":"做他的随行考官","win":{"text":"你成了唐三九考的考官。你要做的，是在他每一次快要死掉的时候，什么都不做。","d":{"flags":["hs_examiner"],"merit":25,"bonds":{"波赛西":10},"trait":{"忠":1}}}},{"t":"暗中把实情告诉他","need":{"魅力":45},"win":{"text":"你在台阶下拦住唐三，把波赛西的话说了一半。他沉默很久：「谢谢。我还是会考。」","d":{"flags":["hs_warned"],"bonds":{"唐三":20,"波赛西":-15},"trait":{"忠":-1,"仁":1}}}}]},{"id":"fx_haishendao_04","title":"邪魔虎鲸王","year":2654,"cond":{"rankMin":1},"canon":"M65","echo":{"flag":"hs_rival","text":"前因 · 2652：你和唐三，同一天接下了海神九考。"},"text":"第四考的考题刻在海神殿的石碑上：斩邪魔虎鲸王，灭其族。\n\n三百头邪魔虎鲸在远海集结，领头的十万年魂兽浮出海面时，像一座黑色的岛。唐三站在魔魂大白鲨王小白的背上，额头的烙印亮得刺眼，海幻斗罗带着圣柱战士压住侧翼。\n\n虎鲸王被打穿第三道防线，开始往深海退。它腿上透出一块十万年魂骨的光，谁斩下最后一击，谁就能拿走它。唐三已经追了上去，而你离它更近。","choices":[{"t":"抢在唐三前斩下它","hint":"改写原著 · 达到标示战力后可挑战，获胜才能取得奖励","need":{"战力":2800},"canonChange":{"node":"M65","inertia":4,"desc":"邪魔虎鲸王的十万年魂骨落入你手"},"win":{"text":"你的武魂贯穿了虎鲸王的头颅，一块漆黑的腿骨飞进你怀里。唐三停在半空看了你很久，什么也没说。","d":{"bone":{"slot":"左腿","name":"邪魔虎鲸左腿骨","desc":"十万年魂骨，附虎鲸碎牙斩","attrs":{"体魄":8},"years":100000},"shift":12,"merit":30,"bonds":{"唐三":-30},"flags":["hs_bone"],"trait":{"逆":2,"群":-1},"world":{"offset":{"唐三":-3},"news":{"M65":"第四考中，邪魔虎鲸王被另一名九考者斩杀，十万年左腿骨旁落"},"note":"唐三少了一块十万年左腿骨"},"rareClaim":["邪魔虎鲸王"]}},"battle":{"n":"邪魔虎鲸王","years":100000}},{"t":"封住深海，让他补刀","need":{"战力":1200},"win":{"text":"你一记横击封住了深海的方向。三叉戟从天而落，虎鲸王的血染红了半片海。唐三落回小白背上，冲你点了点头。","d":{"bonds":{"唐三":20},"merit":25,"名望":10,"trait":{"群":1}}}},{"t":"回头捞落水的战士","win":{"text":"你转身去捞那些被虎鲸尾拍进海里的战士。海幻斗罗看着你背着三个人浮上来，第一次对你行了礼。","d":{"bonds":{"海幻斗罗":25},"merit":20,"trait":{"仁":2}}}}]},{"id":"fx_haishendao_05","title":"金泉","year":2655,"cond":{"rankMin":2},"canon":"M66","text":"第六考，九考者要在波赛西手下撑过一炷香。唐三撑过去了，满身是血被抬下了海神山。\n\n那夜，波赛西把你叫到海神殿最深处。殿中央有一汪金色的泉，是海神之光凝成的。她坐在泉边，第一次不像个神：「几十年前，有个用锤子的人站在这里。我对他说，谁成神我就嫁谁。他走了，再没回来。」\n\n她抬手指向那汪泉：「下去吧，海神之光会把你的魂环淬一遍。大供奉的位子，岛上总要有人候着。」","choices":[{"t":"沉入金泉淬环","win":{"text":"金光从脚底一直漫到头顶。你浮上来时，每一道魂环都深了一层颜色。","d":{"ringUp":{"target":"all","mul":1.3,"add":0},"rank":1,"merit":20,"伤势":15,"bonds":{"波赛西":15}}}},{"t":"问她，那人去了哪里","need":{"精神":60},"win":{"text":"波赛西沉默很久：「北方，一座喝血的城。」她把一枚旧锤坠放进你手心，示意你下泉。","d":{"ringUp":{"target":"all","mul":1.3,"add":0},"rank":1,"merit":15,"bonds":{"波赛西":25},"item":"唐晨的锤坠","reveal":["唐晨"]}}},{"t":"推辞，位子留给唐三","win":{"text":"波赛西的眼神冷了下来：「海神不需要谦让的人。」第二天，你的考核单上多了三项。","d":{"merit":5,"bonds":{"波赛西":-10,"唐三":10},"trait":{"群":1,"忠":1}}}}]},{"id":"fx_haishendao_06","title":"海神之位","year":2657,"cond":{"rankMin":2},"canon":"M80","echo":{"flag":"hs_rival","text":"前因 · 2652：你和唐三，同一天接下了海神九考。"},"text":"唐三回来了。他斩了深海魔鲸王，带回一颗鲸珠，也带回一个消息：杀戮之王唐晨上岛三天，就去了。\n\n第九考是传承仪式。波赛西穿上大祭司的全套礼服，站在海神三叉戟前。你知道她要做什么——引路人必须献祭。她回头看了唐三一眼，又看了你一眼：「神位只有一个，海神认谁，谁就上来。」\n\n三叉戟在戟座里嗡嗡作响。你在海神之光里泡得太久，海神也认得你了。唐三向前走了一步，你也可以。","choices":[{"t":"握住三叉戟，夺神位","hint":"改写原著","need":{"战力":2100,"精神":80},"canonChange":{"node":"M80","inertia":5,"desc":"海神神位被你夺走，唐三没有成为海神"},"win":{"text":"你握上戟杆的一瞬，一千零一级台阶同时亮起。波赛西笑了，化作一片金光落进你的身体。唐三站在台下，手里还攥着那颗鲸珠。","d":{"ending":"fx_haishendao_e1","shift":30,"trait":{"逆":3},"world":{"offset":{"唐三":-8},"news":{"M80":"波赛西献祭，海神神位却落入另一名九考者手中，唐三未能成神"},"note":"唐三失去海神神位，双神共存再无可能"}}}},{"t":"退一步，替他护法","win":{"text":"你退到台阶边，替唐三挡住了涌上来的海浪。波赛西化光之前，把大祭司的权杖递给了你。","d":{"ending":"fx_haishendao_e2","rank":1,"bonds":{"唐三":30,"波赛西":20}}}},{"t":"转身下山，离岛","win":{"text":"你没有回头。走到岸边时，身后的海神山亮成了金色，你知道新的神诞生了。","d":{"bonds":{"唐三":10},"trait":{"群":-1}}}}]}],"endings":[{"id":"fx_haishendao_e1","title":"结局·海神","type":"神","grade":3,"text":"海神三叉戟认了你。从那天起，大陆西面的海平静了一百年，所有海魂兽都朝海神岛低头。唐三带着小舞回了大陆，没有成神，却在罗刹之战里另寻了一条活路。你常常站在海神殿前，想起那个抱着白兔登台阶的青年。神界的门一直开着，你迟迟没有进去。","afterlife":["唐三：没有海神神位，他借修罗之力熬过罗刹之战，伤了根基。","波赛西：献祭之后，在神界与唐晨重逢。","海龙斗罗：做了你的大祭司，每天替你擦一遍三叉戟。","海神岛：从魔鬼岛变成了神岛，陆地人排着队来受考。"],"worldline":"海神神位易主，唐三的成神之路被改写，双神共存的终局不复存在。"},{"id":"fx_haishendao_e2","title":"结局·海神大祭司","type":"岛","grade":2,"text":"唐三成了海神，你成了海神岛的大祭司。原本要接任的海龙斗罗把权杖交给你时，只说了一句「你配」。此后几十年，你守着一千零一级台阶，替新的九考者压阵，替海神看着这片海。唐三每年托小白给你捎一坛大陆的酒。你从没离开过这座岛，也从没觉得被困住。","afterlife":["唐三：成为海神，每年从神界送下一道神念问安。","波赛西：献祭前，亲手把大祭司的权杖交给了你。","海龙斗罗：退为副祭司，教你怎么和海魂兽说话。","海神岛：在你手里，迎来了第一批大陆来的受考者。"],"worldline":"海神岛第一次由陆地人执掌，海岛与大陆从此通航。"}]},{"id":"shaludu","name":"杀戮之都","desc":"饮下血腥玛丽，在紫月下杀出一条路。继承杀戮之王的王座，或去碰修罗神的门槛。","join":{"need":{"战力":400},"hint":"在北方小镇酒馆的吧台下，饮尽一杯血腥玛丽。"},"ranks":["杀戮者","杀神","血卫统领","王座继承人","杀戮之王"],"rankReq":[{"merit":0,"等级":0},{"merit":30,"等级":40},{"merit":90,"等级":55},{"merit":170,"等级":70},{"merit":280,"等级":85}],"perk":{"desc":"杀气淬体，战力大增","power":0.15,"train":0,"coins":10},"task":{"name":"地狱杀戮场","lines":["在地狱杀戮场里撑过一场十人混战，只有一个人能走出去。","替血卫收缴拖欠的血税，每月两杯，一滴不能少。","清剿血浆湖边游荡的堕落者，他们早已忘了自己的名字。","护送一个新来的人，活过杀戮之都的第一夜。"]},"nodes":[{"id":"fx_shaludu_01","title":"紫月之下","year":2647,"cond":{},"canon":"M44","text":"杀戮之都上空挂着一轮紫月，从来不落。城里一切魂技都失效，只剩魂力、武魂和刀。\n\n你在这里遇见了两个新人。一个自称唐银，话很少，出手前从不让人看清他的手。另一个穿红衣，眼角带着狐狸似的笑，说自己叫胡列娜，杀人的时候也在笑。\n\n血卫在城门口宣布：今年的地狱杀戮场，十人一场，只活一个。名单贴出来时，你们三个的名字挨在一起。胡列娜凑到你耳边：「三个人联手，总比一个人活得久，你说呢？」唐银没说话，只是看着你。","choices":[{"t":"与唐银结盟","win":{"text":"唐银点了一下头，把半块干粮掰给了你。那一年，你们背靠背杀了十七场。","d":{"bonds":{"唐三":20},"flags":["sl_tangyin"],"merit":15,"trait":{"群":1}}}},{"t":"与胡列娜结盟","need":{"魅力":35},"win":{"text":"胡列娜笑着挽住你的胳膊：「我就知道你识货。」她的杀气很重，你很快学会了不在她身后留空门。","d":{"bonds":{"胡列娜":20},"flags":["sl_huliena"],"merit":15,"rep":{"武魂殿":5}}}},{"t":"谁也不信","need":{"战力":500},"win":{"text":"你一个人杀满了一整年。血卫在你的名字后面，画了一个血红的圈。","d":{"merit":25,"体魄":3,"flags":["sl_alone"],"trait":{"群":-2,"险":1}}}}]},{"id":"fx_shaludu_02","title":"地狱路","year":2648,"cond":{},"canon":"M44","text":"百胜之后，可以走地狱路。千年来走通的只有八个人，他们被叫做杀神。第一关是遮天蔽日的血蝙蝠，第二关是一条十首烈阳蛇，第三关没人说得清，走过的人只说那是心里最怕的东西。\n\n你、唐银和胡列娜同一天踏上了地狱路。烈阳蛇倒下时，十颗头颅中央浮起一颗赤红的内丹，能克天下蛇毒。唐银伸出了手。\n\n深渊边上，胡列娜刚为挡蛇的吐息耗尽了魂力，脚下的石头正在松动。","choices":[{"t":"抢下烈阳蛇内丹","hint":"改写原著","need":{"战力":850},"canonChange":{"node":"M63","inertia":4,"desc":"十首烈阳蛇内丹落入你手，马红俊没能成为七首火凤凰"},"win":{"text":"你比唐银快了半步。内丹落进掌心，滚烫。唐银收回手，什么也没说，眼神冷了一层。三个人一同走出了地狱路。","d":{"rank":1,"item":"十首烈阳蛇内丹","flags":["sl_killgod","sl_dan"],"merit":20,"shift":10,"bonds":{"唐三":-20},"trait":{"逆":1,"群":-1},"world":{"offset":{"马红俊":-3},"news":{"M63":"胖子没有等到十首烈阳蛇内丹，七首火凤凰迟迟没有出现"},"note":"马红俊少了第七魂环的机缘"}}}},{"t":"扑过去拉住胡列娜","win":{"text":"你攥住她的手腕，两个人一起吊在深渊边上。她第一次没有笑：「你傻不傻。」你们一起走完了第三关。","d":{"rank":1,"flags":["sl_killgod","sl_saved_na"],"bonds":{"胡列娜":30},"merit":15,"trait":{"仁":2}}}},{"t":"不回头，直闯第三关","win":{"text":"第三关里，你看见了自己最怕的东西，然后把它劈开了。走出地狱路时，你是第一个。","d":{"rank":1,"flags":["sl_killgod"],"merit":25,"精神":3,"trait":{"群":-1,"险":1}}}}]},{"id":"fx_shaludu_03","title":"雪色天鹅吻","year":2649,"cond":{"rankMin":1},"canon":"M44","echo":{"flag":"sl_tangyin","text":"前因 · 2647：唐银曾和你背靠背杀了十七场。"},"text":"走出地狱路后的一个深夜，你在血浆湖边撞见了唐银。他手里托着一株通体雪白的花，花瓣边缘泛着淡淡的蓝光。\n\n「雪色天鹅吻，」他没回头，「放进湖里，城里的毒会成千上百倍地滋生。这座城吃了太多人，它该死了。」湖底沉着这座城一千年的血，城里还有几千个被血腥玛丽锁住、走不出去的人。\n\n你如今是杀神，血卫见了你要低头。唐银终于转过身：「你要拦我？」","choices":[{"t":"出手拦下唐银","need":{"战力":1000},"win":{"text":"杀神领域撞上杀神领域，湖面炸起十丈血浪。唐银被你逼退三步，把花收回袖中：「你会后悔的。」他当夜就离开了。","d":{"bonds":{"唐三":-25},"merit":30,"shift":5,"flags":["sl_city_saved"],"trait":{"逆":1,"险":1},"world":{"note":"雪色天鹅吻没有投进血浆湖，杀戮之都完好如初"}}}},{"t":"让他投下去","win":{"text":"花沉进湖底。三天后，城里开始有人成片倒下。你守在城门口，把还能走的人一个个送了出去。","d":{"bonds":{"唐三":15},"merit":10,"flags":["sl_city_ruined"],"trait":{"仁":1}}}},{"t":"亲手替他投进去","need":{"精神":50},"win":{"text":"你接过花，亲手放进湖里。唐银看着你，第一次笑了一下：「谢谢。」湖底传来一声不像人的嘶吼。","d":{"bonds":{"唐三":25},"merit":5,"flags":["sl_city_ruined"],"trait":{"逆":1,"仁":-1}}}}]},{"id":"fx_shaludu_04","title":"王血","year":2652,"cond":{"rankMin":1},"canon":"留白·杀戮之王","text":"无论这座城后来成了什么样，紫月始终没落。斗罗历2652年，你被召进城心最深处的王座厅。\n\n王座上坐着一个披头散发的老人，周身裹着暗红的血雾，雾里隐约有九颗蝙蝠的头颅。他的声音像两块铁在摩擦：「八个杀神，只剩你还肯留在这里。」\n\n他抬手，王座下的血池翻涌起来，池底沉着一千年的杀气。「下去泡七天，出来做我的血卫统领。」他握拳的时候，你看见他掌心浮起一柄锤子的虚影，黑色的，和昊天宗的锤一模一样。","choices":[{"t":"沉入血池七日","win":{"text":"七天里你听见了一千年的惨叫。爬出来时，你最弱的那道魂环红得发黑。","d":{"ringUp":{"target":"lowest","mul":1,"add":8000},"rank":1,"merit":20,"伤势":25,"flags":["sl_bloodpool"],"trait":{"险":1}}}},{"t":"直问他那柄锤子","need":{"精神":60},"win":{"text":"老人沉默很久，雾里的蝙蝠头一齐尖叫。「唐……」他只吐出半个字，忽然捂住头，一股巨力把你甩出了王座厅。","d":{"reveal":["唐晨"],"bonds":{"唐晨":15},"merit":15,"伤势":20,"flags":["sl_knows_tc"]}}},{"t":"说自己还没杀够","win":{"text":"老人笑了，笑声像锈刀刮骨：「好，等你杀够了再来。」","d":{"merit":10,"trait":{"群":-1}}}}]},{"id":"fx_shaludu_05","title":"寂灭小队","year":2656,"cond":{"rankMin":2},"canon":"M69","echo":{"flag":"sl_saved_na","text":"前因 · 2648：地狱路的深渊边，你拉住过她的手。"},"text":"武魂帝国派来了寂灭小队，魂斗罗和魂圣加起来上百人，要抹掉这座与武魂殿立过千年之约的城。带队的是个红衣女人，你认得她——胡列娜，如今的武魂帝国圣女。\n\n他们没能走到城门。杀戮之王从紫月下走出来，血雾所过之处，魂斗罗像麦子一样倒下。王已经疯了，分不清敌我。胡列娜被逼到城墙下，狐尾断了两条。\n\n城外忽然亮起一道蓝金色的光，有人在用海神之光呼唤王的名字。王停住了，血雾在发抖。你离胡列娜十步，离王二十步。","choices":[{"t":"挡在胡列娜身前","need":{"战力":1700},"win":{"text":"王的一锤砸在你交叉的双臂上，骨头断了三根。胡列娜在你身后愣住，然后拖着你退进了城门的阴影里。","d":{"bonds":{"胡列娜":35},"伤势":40,"merit":15,"rep":{"武魂殿":10},"flags":["sl_na_debt"],"trait":{"仁":2,"险":2}}}},{"t":"以杀气助光唤醒王","need":{"精神":70},"win":{"text":"你把杀神领域整个铺开，和那道蓝金色的光一起压向王。血雾裂开，露出一张苍老而清醒的脸：「是……昊天的孩子？」","d":{"rank":1,"bonds":{"唐晨":30,"唐三":10},"merit":30,"flags":["sl_woke_tc"]}}},{"t":"随王屠尽寂灭小队","win":{"text":"你跟在王身后，把逃散的魂圣一个个截住。那一夜，杀戮之都外的雪全是红的。","d":{"rank":1,"rep":{"武魂殿":-30},"名望":10,"merit":25,"flags":["sl_slaughter"],"trait":{"仁":-2}}}}]},{"id":"fx_shaludu_06","title":"修罗魔剑","year":2657,"cond":{"rankMin":2},"canon":"M80","echo":{"flag":"sl_woke_tc","text":"前因 · 2656：王清醒的那一刻，看见的是你。"},"text":"唐晨去了海神岛，三天后死在那里。他留下的东西被血卫送回了杀戮之都：一柄通体血红的长剑，剑身刻着「修罗」二字。\n\n修罗神的考核向来普遍撒网、逐个培养。唐晨卡在第八考几十年，到死都没走完。剑送到的那一夜，王座厅里所有的血卫都跪下了，空着的王座在等一个新主人。\n\n第二天，城门外站着唐三。他要把这柄剑带走，说有个人需要它当剑鞘。他身边的少女抱着手臂，安静地看着你。","choices":[{"t":"握剑，接修罗神考","hint":"改写原著","need":{"战力":2000,"精神":75},"canonChange":{"node":"M81","inertia":5,"desc":"修罗魔剑被你夺走，没有进入小舞体内"},"win":{"text":"剑柄入手的一瞬，你听见了唐晨没走完的第八考。唐三看了你很久，转身离去：「那就各走各的路。」","d":{"ending":"fx_shaludu_e2","shift":30,"trait":{"逆":3},"world":{"offset":{"唐三":-5,"小舞":-6},"news":{"M81":"修罗魔剑落入杀戮之都新王手中，小舞没能成为剑鞘"},"note":"唐三失去修罗之力，双神共存不再成立"}}}},{"t":"把剑交出，坐上王座","win":{"text":"你把剑递给唐三，转身一步步走上王座。紫月在你头顶亮了一下。","d":{"ending":"fx_shaludu_e1","rank":1,"bonds":{"唐三":20}}}},{"t":"剑与王座，都不要","win":{"text":"你把剑交给唐三，当夜离开了杀戮之都。紫月在你身后，第一次暗了下去。","d":{"bonds":{"唐三":20},"trait":{"群":1}}}}]}],"endings":[{"id":"fx_shaludu_e1","title":"结局·杀戮之王","type":"王","grade":2,"text":"你成了第二代杀戮之王。你做的第一件事，是烧掉血腥玛丽的配方，从此进城的人不必再喝血。地狱杀戮场还在，但十个人里可以活三个。武魂帝国覆灭后，无处可去的残兵、逃犯和被宗门抛弃的人都往北方来，你一个不拒。紫月下的这座城，渐渐有了炊烟。","afterlife":["唐晨：一道修罗的杀意从神界落在王座上，像一声叹息。","胡列娜：获赦后来过一次，在城墙上坐了一夜，没说留下，也没说要走。","唐三：成神后托人送来一坛酒，坛上写着「唐银」。","杀戮之都：从禁魔之城变成无主者的城，紫月至今未落。"],"worldline":"杀戮之都没有毁灭，成了大陆北方的第三种秩序。"},{"id":"fx_shaludu_e2","title":"结局·修罗","type":"神","grade":3,"text":"修罗魔剑在你手里一天比一天重。你走完了唐晨没走完的第八考，又在第九考里斩掉了自己最后一点心软。几年后，修罗神位传了下来，神界多了一位冷面的执法者。人间再没人见过你笑。只有北方的紫月知道，你成神那天，在王座上坐了很久，像在等一个不会回来的人。","afterlife":["唐三：没有修罗之力，他靠海神之力和千军信仰熬过罗刹之战，伤了根基。","小舞：没有成为剑鞘，九十级后再难寸进，却活得很安稳。","胡列娜：每年都在杀戮之都城下放一束狐尾草。","杀戮之都：在你成神那天沉入地底，紫月熄灭。"],"worldline":"修罗神位易主，唐三失去双神之力，终局之战被彻底改写。"}]},{"id":"zili","name":"自立门户","desc":"不投任何人，自己立一块山门石。招揽四宗族，和唐门抢人，在两国与武魂殿之间做第三极。","join":{"need":{"名望":20,"金魂币":800},"hint":"散尽积蓄，在无主之地立起一块山门石。"},"ranks":["散修","开宗立派","一流宗门","上三宗之列","大陆第四极"],"rankReq":[{"merit":0,"等级":0},{"merit":30,"等级":40},{"merit":90,"等级":55},{"merit":170,"等级":70},{"merit":280,"等级":85}],"perk":{"desc":"门人供养，俸禄丰厚","power":0.05,"train":0.05,"coins":80},"task":{"name":"经营山门","lines":["开山收徒，从三百个报名的孩子里挑出能吃苦的十个。","在索托城大斗魂场挂出宗门旗号，打一场漂亮的连胜。","替过路的商队护送一程，换他们在山下开一间铺子。","上门谈一桩矿脉生意，对方是个不肯低头的老族长。"]},"nodes":[{"id":"fx_zili_01","title":"山门石","year":2646,"cond":{},"canon":"留白·第三方","text":"你在天斗与星罗交界、离诺丁城一百里的一座荒山上，立起了一块山门石。石头是你自己从山里背出来的，上面的字也是你自己刻的。\n\n山下的村民来看热闹，问这是什么宗门。你说名字还没想好，先收人。\n\n第一个月来了三十七个人：被宗门赶出来的旁支子弟，交不起学费的平民魂师，还有一个独眼老头，说年轻时在七宝琉璃宗管过账。他眯着眼看你：「宗门立起来容易，立住难。你打算靠什么立？」","choices":[{"t":"靠拳头，只收能打的","need":{"战力":550},"win":{"text":"你在山门前摆了一座擂台，谁赢了你就当大长老。三个月过去，没人当上大长老，却有一百多人留了下来。","d":{"merit":20,"名望":8,"flags":["zl_wu"],"trait":{"险":1}}}},{"t":"靠买卖，先赚钱","need":{"金魂币":600},"win":{"text":"你把一半积蓄换成了诺丁城的铺面。老账房拨着算盘笑了：「这才像个宗门。」","d":{"merit":20,"金魂币":-300,"flags":["zl_shang"],"trait":{"险":-1}}}},{"t":"靠人心，来者不拒","win":{"text":"你在山门石上添了四个字：不问出身。来的人越来越杂，吵架的也越来越多，但没有一个人走。","d":{"merit":15,"魅力":2,"flags":["zl_ren"],"trait":{"仁":1,"群":1}}}}]},{"id":"fx_zili_02","title":"破之一族","year":2648,"cond":{},"canon":"留白·破之一族","text":"破之一族又被武魂殿袭击了。消息传来时，杨无敌的人已经退到你山门外五十里，直系只剩一百多口，伤员躺满了山谷。\n\n追兵是武魂殿的一支执法队，领头的红衣主教在谷口喊话：「破之一族勾结邪魂师，窝藏者同罪。」杨无敌拄着破魂枪站在最前面，枪尖还在滴血，一个求字也没说。\n\n门人都看着你。收留，就是和武魂殿结仇；不收，破之一族就要死在你家门口。","choices":[{"t":"出山击退执法队","need":{"战力":800},"win":{"text":"你一个人走出山门，红衣主教在你手下撑了十招。执法队退了，杨无敌把枪往地上一插：「破之一族欠你一条命。」","d":{"bonds":{"杨无敌":30},"rep":{"武魂殿":-20},"merit":25,"名望":10,"flags":["zl_po"],"trait":{"仁":1,"险":1}}}},{"t":"以药救人，悄悄收留","need":{"精神":45},"win":{"text":"你把伤员藏进后山矿洞，三天三夜没合眼。杨无敌看着你配的药，第一次开口：「这方子，谁教你的？」","d":{"bonds":{"杨无敌":25},"merit":20,"flags":["zl_po"],"trait":{"仁":2}}}},{"t":"闭门不出","win":{"text":"你关上了山门。第二天，山谷里只剩一地的血。杨无敌带着残部去了天斗城南。","d":{"rep":{"武魂殿":5},"merit":10,"flags":["zl_closed"],"trait":{"仁":-2,"险":-1}}}}]},{"id":"fx_zili_03","title":"茶楼争人","year":2651,"cond":{},"canon":"M54","echo":{"flag":"zl_po","text":"前因 · 2648：破之一族欠你一条命。"},"text":"唐三回到天斗，要立唐门，第一件事就是收拢当年被昊天宗抛弃的四个单属性宗族。泰坦早就跪过少主，白鹤是唐三的舅爷爷，这两家跑不掉。\n\n剩下御之一族和破之一族。牛皋在龙兴城盖了一辈子房子，恨昊天宗恨到骨子里；杨无敌只认药和枪，谁也不服。\n\n你和唐三在龙兴城的同一间茶楼碰上了。他朝你点点头，像早知道你会来：「四宗族本是一家，拆开了谁都活不好。」牛皋坐在你们中间捧着茶碗，看看你，又看看他。","choices":[{"t":"抢下御、破两族","hint":"改写原著","need":{"名望":45,"魅力":45},"canonChange":{"node":"M54","inertia":5,"desc":"御之一族与破之一族投入你门下，四宗族没有全部并入唐门"},"win":{"text":"牛皋放下茶碗，站到了你身后。三天后，杨无敌也带着族人上了你的山。唐三走出茶楼时只说：「希望你护得住他们。」","d":{"shift":18,"rank":1,"merit":30,"rep":{"宗门":15},"bonds":{"杨无敌":20,"牛皋":25,"唐三":-30},"flags":["zl_four"],"trait":{"逆":2,"忠":-1},"world":{"offset":{"唐三":-3},"news":{"M54":"唐门初立，四宗族只来了两家，御之一族与破之一族另投他门"},"note":"唐门没有御堂和药堂，唐家军的城防与毒药要另想办法"}}}},{"t":"与唐门结盟分利","need":{"金魂币":1000},"win":{"text":"你和唐三签下一纸契约：四宗族入唐门，你的矿山供唐门铁料，唐门的暗器生意有你一成。牛皋看着你们俩，放心地笑了。","d":{"金魂币":-500,"bonds":{"唐三":20,"牛皋":10},"merit":25,"flags":["zl_ally_tm"],"trait":{"群":1}}}},{"t":"喝完茶，起身离开","win":{"text":"你把茶喝完，起身走了。有些人，本来就该回家。","d":{"bonds":{"唐三":10},"merit":10,"trait":{"忠":1}}}}]},{"id":"fx_zili_04","title":"七宗重选","year":2652,"cond":{"rankMin":1},"canon":"M51","text":"武魂殿的七宗重选大会在武魂城召开。原来的上三宗，一个封山，一个被打残，一个被灭门，新的七个座位，武魂殿想给谁就给谁。\n\n你的宗门也收到了帖子。会上，圣龙宗宗主拓跋希坐在第一席，一身封号斗罗的红袍。他指着你的座位冷笑：「一个立宗不到十年的野山头，也配进七宗？」\n\n主持大会的白金主教笑着补了一句：签下效忠书，第三席就是你的。不签也行，上擂台打赢拓跋希。","choices":[{"t":"上擂台，打赢拓跋希","need":{"战力":1300},"win":{"text":"拓跋希的圣龙压下来时，你没有退。第九十招，他的红袍裂了。全场寂静，你没签一个字，坐进了七宗。","d":{"rank":1,"merit":30,"名望":20,"rep":{"武魂殿":-15},"bonds":{"拓跋希":-30},"flags":["zl_seven"],"trait":{"险":2}}}},{"t":"签效忠书，换第三席","win":{"text":"你签了字。武魂殿给了你一座城的魂师补贴，也给你派来了一位顾问。","d":{"rank":1,"merit":25,"金魂币":800,"rep":{"武魂殿":25,"天斗":-15},"flags":["zl_wuhun"],"trait":{"忠":-1}}}},{"t":"撕帖，当众离席","need":{"名望":40},"win":{"text":"你把帖子撕成两半，走出了武魂城。当晚，天斗和星罗的使者都追上了你的马车。","d":{"merit":20,"名望":10,"rep":{"武魂殿":-25,"天斗":10,"星罗":10},"flags":["zl_third"],"trait":{"逆":1}}}}]},{"id":"fx_zili_05","title":"三方来使","year":2656,"cond":{"rankMin":2},"canon":"M74","text":"嘉陵关的仗打起来了，你的山门里一下子住进了三拨客人。\n\n武魂帝国来的是长老殿的一位长老，带着比比东的亲笔信：只要你按兵不动，战后天斗南境给你做封地。天斗来的是雪崩的心腹，拉着一车天材地宝，带来一句话：「陛下说，十年前没人看得起您，他也一样。」星罗的人什么都没带，只问一句：要不要一起，把天斗分了？\n\n你的门人已有三千，山下还有一座属于你的城。你站哪边，哪边就多出一个封号斗罗。你也可以哪边都不站。","choices":[{"t":"举宗援天斗","win":{"text":"你带三千门人开到嘉陵关下。雪崩亲自出营相迎，把你的名字写进了天斗的护国宗门册。","d":{"rank":1,"merit":30,"名望":15,"rep":{"天斗":30,"武魂殿":-30},"bonds":{"雪崩":25},"flags":["zl_tiandou"],"trait":{"群":1}}}},{"t":"闭门观战，开秘库淬环","win":{"text":"你把三拨客人留在山上喝茶，自己关进秘库，用他们送来的天材地宝淬了一遍魂环。出关时，三方都更客气了。","d":{"ringUp":{"target":"lowest","mul":2,"add":0},"merit":20,"flags":["zl_neutral"],"trait":{"群":-1,"险":-1}}}},{"t":"趁乱夺哈根达斯王国","need":{"战力":1700},"win":{"text":"武魂帝国的兵全在嘉陵关，你带门人一夜拿下了西鲁城。三个月后，哈根达斯王国换了旗。","d":{"rank":1,"merit":35,"名望":20,"shift":8,"rep":{"武魂殿":-30,"天斗":-10},"flags":["zl_kingdom"],"trait":{"逆":2,"险":2},"world":{"note":"哈根达斯王国落入你手，武魂帝国西北失守"}}}}]},{"id":"fx_zili_06","title":"第四极","year":2657,"cond":{"rankMin":2},"canon":"M85","text":"罗刹神死了，武魂帝国塌了。天斗赢了，却打空了国库；星罗毫发无伤，正在磨刀。唐三成了神，临走前派人给你捎来一句话：「这片大陆，别再打了。」\n\n你站在山门石前。当年的三十七个人，如今是上万门人、两座城、一支谁也不敢小看的魂师军。天斗请你做护国宗门，星罗请你做异姓王。\n\n老账房已经很老了，眯着眼最后问你一次：「你立这个宗门，到底是为了什么？」","choices":[{"t":"立国称尊，做第四极","need":{"名望":70,"战力":1900},"win":{"text":"你在山门石旁立起了第二块石头，只刻了一个字：国。天斗和星罗的使者在山下等了三天，最后都派人送来了贺礼。","d":{"ending":"fx_zili_e1","rank":1,"名望":20}}},{"t":"收兵归山，只做宗门","win":{"text":"你把魂师军遣散了一半，剩下的人回去种地、打铁、教孩子。山门石上的字，你一个也没改。","d":{"ending":"fx_zili_e2","trait":{"仁":2}}}},{"t":"把山门交给弟子，远游","win":{"text":"你把掌门印交给大弟子，背着一个包袱下了山。老账房在山门口站了很久，没有拦你。","d":{"气运":5,"trait":{"群":-1}}}}]}],"endings":[{"id":"fx_zili_e1","title":"结局·大陆第四极","type":"王","grade":3,"text":"斗罗历2658年，大陆上第一次有了四个名字：天斗、星罗、武魂旧地，和你。你的国没有皇帝，只有一块山门石和一座议事堂，四方来投的族长们坐在左右。天斗与星罗都想吞掉你，又都怕对方先动手，于是谁也没动。后来的史书说，这才是三十年和平的真正原因。","afterlife":["唐三：成神前路过你的山门，在山门石上留了一道三叉戟的划痕。","雪崩：年年派使节来，嘴上叫兄弟，心里防着你。","杨无敌：在你山上开了大陆最大的药堂，从不给武魂殿旧人看病。","你的宗门：被后人称为第四极，山门石至今立在诺丁城外。"],"worldline":"大陆从三分变成四极，原著的十年和平变成了四方相持的三十年。"},{"id":"fx_zili_e2","title":"结局·山门不改","type":"宗","grade":2,"text":"你没有称王。宗门退回那座荒山，门人散去大半，留下的人在山脚开了铺子、学堂和铁匠炉。每年都有人来投，你还是那句话：不问出身。后来大陆上出了很多封号斗罗，其中七个说自己是在你的山上长大的。老账房临终前把算盘留给你：「这一笔，算你赚了。」","afterlife":["唐三：唐门销毁暗器之后，把一批铸造师傅送上了你的山。","牛皋：替你把山门修成了大陆最难攻的城，却一次也没用上。","老账房：死在账房里，账本最后一页写着一个「盈」字。","你的宗门：成了大陆最大的平民宗门，弟子遍布两国。"],"worldline":"大陆上多了一个不属于任何国家的宗门，平民魂师从此有了第三条路。"}]},{"id":"shilaike","name":"史莱克学院","desc":"只收怪物的学院。从学员一路做到内院、讲师、决策层，最后坐上院长之位，亲手立起海神阁。","join":{"need":{"名望":10},"hint":"交一枚金魂币报名，过弗兰德那四关考核。"},"ranks":["学员","内院弟子","讲师","海神阁长老","院长·海神阁主"],"rankReq":[{"merit":0,"等级":0},{"merit":30,"等级":35},{"merit":90,"等级":50},{"merit":170,"等级":65},{"merit":280,"等级":80}],"perk":{"desc":"名师指点，修炼加速","power":0.04,"train":0.1,"coins":40},"task":{"name":"学院差事","lines":["替赵无极带新生做体能，跑完五十圈的孩子一个都没哭。","帮弗兰德去索托城讨一笔拖了三年的学费。","在大斗魂场替学院打一场团战，赢回一块招生招牌。","给内院弟子讲一节课：魂环怎么选，比你想的更重要。"]},"nodes":[{"id":"fx_shilaike_01","title":"怪物的门槛","year":2645,"cond":{},"canon":"留白·史莱克","text":"史莱克学院的大门比村口的祠堂还破。弗兰德推了推眼镜，把你从头看到脚：「十二岁以下、二十五级以上，才配叫怪物。你够格了，可够格的人每年都有，留下来的没几个。」\n\n院子里，赵无极光着膀子，正把一个新生扔出去三丈远。另一边，一个胖子在烤香肠，香味飘满了整座学院。弗兰德说内院只剩一个名额，要么接赵无极一炷香，要么替学院在索托城大斗魂场赢回一块招生招牌。","choices":[{"t":"接赵无极一炷香","need":{"体魄":40},"win":{"text":"一炷香烧完，你还站着，鼻血流到了下巴上。赵无极咧嘴一笑，拍了拍你的肩膀，你差点又被拍倒。","d":{"rank":1,"merit":15,"bonds":{"赵无极":15,"弗兰德":10},"体魄":4}}},{"t":"替学院赢回招生招牌","need":{"战力":600},"win":{"text":"你在大斗魂场连胜三场，把那块写着史莱克的招牌扛了回来。弗兰德看着招牌，眼镜后面的眼睛有点湿。","d":{"rank":1,"merit":15,"名望":6,"bonds":{"弗兰德":15}}}},{"t":"先去食堂帮胖子烤香肠","win":{"text":"你和那个叫奥斯卡的胖子烤了一下午香肠。内院名额没拿到，但你认识了半个学院的人。","d":{"merit":8,"bonds":{"奥斯卡":15,"马红俊":5},"魅力":3}}}]},{"id":"fx_shilaike_02","title":"迁校","year":2648,"cond":{},"canon":"留白·史莱克","text":"大赛之后，史莱克在索托城待不下去了。武魂殿的人天天在门口转，招生的孩子被吓跑了一半。弗兰德把老师们叫到一起，桌上摊着一封天斗皇家学院的来信：并入天斗，挂个名，学院就能活下去。\n\n柳二龙拍了桌子：「史莱克就算只剩一间屋子，也姓史莱克！」大师没说话，看着你。你现在是内院里说话最有分量的弟子。","choices":[{"t":"留校任讲师，跟着搬","need":{"名望":30},"win":{"text":"学院搬进了天斗城外的一座旧庄园。你在新教室里讲了第一节课，台下坐着二十个比你小不了几岁的孩子。","d":{"rank":1,"merit":20,"bonds":{"弗兰德":10,"大师":10},"rep":{"天斗":8}}}},{"t":"劝弗兰德留在索托","need":{"魅力":40},"win":{"text":"你陪弗兰德坐了一夜。天亮时他把那封信烧了：「怪物学院，不靠别人活。」学院留在了索托，日子更穷，骨头更硬。","d":{"merit":20,"bonds":{"弗兰德":20,"柳二龙":10},"trait":{"逆":1},"rep":{"武魂殿":-8}}}},{"t":"借机结交天斗皇室","win":{"text":"你替学院跑前跑后办迁校，顺手和太子府的人喝了几顿酒。学院活下来了，你的名字也进了天斗皇室的名册。","d":{"merit":10,"rep":{"天斗":15},"名望":4}}}]},{"id":"fx_shilaike_03","title":"学院门口的执法队","year":2651,"cond":{},"canon":"留白·史莱克","text":"猎魂之夜过去才三天，武魂殿的执法队就堵在了史莱克门口。为首的红衣主教举着一张画像：「交出唐三，史莱克可以继续办学。」\n\n学生们挤在窗户后面看。弗兰德在你身边低声说：「我老了，打不动几场了。今天这扇门，你说了算。」","choices":[{"t":"守门，一个都不交","need":{"战力":1500},"win":{"text":"你一个人站在门口，执法队冲了三次，三次都退了回去。红衣主教走的时候撂下一句：「史莱克，武魂殿记住了。」","d":{"rank":1,"merit":30,"名望":12,"rep":{"武魂殿":-20},"bonds":{"唐三":15,"弗兰德":10}}}},{"t":"出面谈判，拖到天黑","need":{"魅力":50},"win":{"text":"你请红衣主教喝茶，从魂师律法谈到天斗皇室的面子，一直谈到天黑。等他反应过来，唐三早就出了城。","d":{"merit":25,"名望":6,"bonds":{"唐三":10},"trait":{"群":1}}}},{"t":"让学生们分散撤离","win":{"text":"你连夜把学生们分成十几路送出城。第二天执法队冲进来，只剩一座空学院和一锅还温着的香肠。","d":{"merit":15,"trait":{"仁":2},"bonds":{"奥斯卡":10}}}}]},{"id":"fx_shilaike_04","title":"学院上城","year":2654,"cond":{},"canon":"留白·史莱克","text":"武魂帝国的大军压到了天斗城下。城头上缺人，缺到连学院的学生都被征了去。史莱克的孩子们穿着不合身的皮甲，排在你身后，一个个脸色发白。\n\n赵无极已经带着第一批人上了东墙。你要决定剩下的人怎么用。","choices":[{"t":"带学生上城，守西墙","need":{"战力":2200},"win":{"text":"西墙守了七天七夜。你身后那些孩子，第一天还在发抖，第七天已经能替你挡下一道魂技。史莱克的旗插在西墙上，一直没倒。","d":{"rank":1,"merit":40,"名望":15,"rep":{"天斗":15,"武魂殿":-10},"trait":{"险":1}}}},{"t":"护送年幼的学生南撤","win":{"text":"你带着八十个最小的孩子走了一千里，一个都没丢。后来这些孩子里，出了三个封号斗罗。","d":{"merit":30,"trait":{"仁":3},"名望":8}}},{"t":"和武魂殿谈学院中立","need":{"名望":60},"win":{"text":"你拿着弗兰德的亲笔信去了敌营。武魂殿答应不动学院的一草一木，条件是史莱克不派一个人上城。城里有人骂你，学生们都活了下来。","d":{"merit":25,"rep":{"武魂殿":10,"天斗":-15},"trait":{"忠":-1}}}}]},{"id":"fx_shilaike_05","title":"院长之位","year":2656,"cond":{"rankMin":2},"canon":"留白·史莱克","text":"弗兰德老了。他把院长的印章放在桌上，推到你面前：「我这辈子就干成了一件事，把一群怪物养大。现在轮到你了。」\n\n柳二龙在一旁嗑着瓜子：「接就接，别磨叽。」大师递过来一张纸，上面写着三个字：海神阁。「学院不能只有一个院长。要有一群人坐在一起，替它拿主意。」","choices":[{"t":"接下院长之位","need":{"名望":60},"win":{"text":"你接过印章。弗兰德摘下眼镜擦了擦，说了一句「不抛弃，不放弃」，然后背着手走出了院长室，再也没回来坐过。","d":{"rank":1,"merit":40,"名望":15,"bonds":{"弗兰德":20}}}},{"t":"先立海神阁，再谈院长","need":{"悟性":60},"win":{"text":"你和大师、柳二龙、赵无极一起，定下了海神阁的规矩：学院大事，阁中长老合议。你被推为第一任阁主。","d":{"rank":1,"merit":35,"flags":["haishenge"],"bonds":{"大师":15,"柳二龙":10}}}},{"t":"推柳二龙接任","win":{"text":"柳二龙瞪了你半天，最后还是收下了印章：「行，老娘替你顶几年。」","d":{"merit":15,"bonds":{"柳二龙":20},"trait":{"群":1}}}}]},{"id":"fx_shilaike_06","title":"海神阁","year":2657,"cond":{"rankMin":3},"canon":"留白·史莱克","text":"大战结束了。唐三成了神，史莱克七怪各奔东西。学院里，海神湖边新起了一座小楼，楼上挂着一块匾：海神阁。\n\n今天是新生入学的日子。三百个孩子挤在门口，最小的才六岁。他们都听说过史莱克七怪的故事，没有一个人听说过你。你站在楼上，看着他们。","choices":[{"t":"坐镇海神阁，做史莱克的掌舵人","win":{"text":"你在海神阁里一坐就是几十年。史莱克从一座破院子长成了大陆第一学院，每一代怪物入学的第一课，都由你来讲。","d":{"ending":"fx_shilaike_e1","名望":20}}},{"t":"把院长之位交给弟子，去讲最后一课","win":{"text":"你把印章交给了当年在西墙下替你挡过魂技的那个学生，然后走进教室，讲了你作为院长的最后一课。","d":{"ending":"fx_shilaike_e2","trait":{"仁":1}}}},{"t":"下楼去迎新生","win":{"text":"你走下楼，蹲下身，替一个六岁的孩子系好了鞋带。","d":{"魅力":4,"名望":5}}}]}],"endings":[{"id":"fx_shilaike_e1","title":"结局·海神阁主","type":"阁","grade":3,"text":"斗罗历2658年起，史莱克学院的一切大事都由海神阁定夺，而海神阁的第一任阁主是你。你没有成神，也没有称王，却比任何神和王都更长久地留在了这片大陆上：此后百年，大陆上一半的封号斗罗都在你的课堂上坐过。","afterlife":["弗兰德：每年开学都回来，在食堂吃一根香肠就走。","唐三：成神后托梦给你，说海神湖的名字起得好。","史莱克：被后人称为怪物的摇篮，海神阁的规矩一直沿用到万年之后。"],"worldline":"史莱克学院没有在战火里散掉，海神阁提前一万年立了起来。"},{"id":"fx_shilaike_e2","title":"结局·史莱克的最后一课","type":"师","grade":2,"text":"你是史莱克的最后一任「老」院长。交出印章那天，你在教室里讲了最后一课，讲的不是魂技，也不是魂环，而是你自己当年怎么从学院门口那块破牌匾下走进来的。下课铃响的时候，台下三百个孩子一个都没走。","afterlife":["你的弟子：接任院长，把你的最后一课编进了史莱克的入学教材。","赵无极：逢人就说你是他扔出去最远的那个学生。","你：后来常在海神湖边钓鱼，从来没钓上来过一条。"],"worldline":"史莱克的院长换了人，学院的规矩一个字也没变。"}]}]}</script>

function pdef(){return PATHDEF[S.run.id]||{n:"修为",pv:[0],src:""}}
function pathVal(r){r=r||R(); const d=pdef(); return d.alias?(r.x[d.alias]||0):(r.x.path||0)}
function addPath(v,out){ const r=R(); const d=pdef(); if(!v||d.alias==="devour") return; if(d.alias) r.x[d.alias]=(r.x[d.alias]||0)+v; else r.x.path=(r.x.path||0)+v; out&&out.push({t:`${d.n} +${v}`,up:true}) }
function pathNeed(i){ const d=pdef(); return (d.pv&&d.pv[i])||0 }
function WXo(){return WX[S.run.id]||{mods:{},evo:[{lv:0,name:P().wuhun.name,tier:P().wuhun.tier}],act:null}}
function md(k){return (WXo().mods||{})[k]||1}
function curEvo(){const w=WXo();return w.evo[Math.min(S.run.x.evo,w.evo.length-1)]}
function wname(){return curEvo().name} function wtier(){return curEvo().tier}
function checkEvo(out){const r=R(),w=WXo(); while(r.x.evo+1<w.evo.length){const nx=w.evo[r.x.evo+1]; if(r.lv>=nx.lv&&pathVal(r)>=pathNeed(r.x.evo+1)){ r.x.evo++; out.push({t:`武魂进化：${nx.name}（${nx.tier}）`,up:true}); if(nx.gain) out.push(...apply(nx.gain)); if(nx.tier==="极") ringUp({target:"all",mul:1.2},out); if(nx.tier==="神") ringUp({target:"all",mul:1.25},out) } else break }}

function power(r){
 r=r||R();const x=r.x||{};
 const base=npcPower(Math.min(99,r.lv))*.78+Math.min(r.a.体魄,180)*.4+Math.min(r.a.精神,180)*.4;
 // Rings and bones amplify soul power; extra spirits share the same physical foundation.
 const ringBonus=Math.min(.65,r.rings.reduce((a,z)=>a+ringPow(z.years)*effectiveRingFit(z)*(z.on>1?.45:1),0)/2200);
 const support=Math.min(.22,whPow(r,2))+Math.min(.10,whPow(r,3));
 const core=base*(1+ringBonus)*(1+boneBonus(r))*md("power")*(1+support+Math.min(.65,godBonus(r))+Math.min(.10,facPerk("power")));
 const gear=(x.iceGear||0)*.25+Math.min(x.sword||0,160)*.9+(x.gear||0)*.25+(r.id==="xingluo"?Math.max(0,r.rep["星罗"]||0)*.6:0);
 return Math.round((core+Math.min(core*.15,gear))*(r.god?1.6:1))
}

function ringSlotOpen(on,r){r=r||R(); const n=ringsOf(r,on).length; return on===1?n<9&&r.lv>=10*(n+1)-.001:!!r.x['wh'+on]&&r.x['wh'+on].state!=='vessel'&&n<Math.min(9,Math.floor(r.lv/10))}

 const on=a.on||1;

}

function bodyRingCap(r){
 r=r||R();const points=[[0,100],[10,423],[20,900],[30,3000],[40,10000],[50,30000],[60,80000],[70,90000],[80,180000],[90,350000],[99,550000],[100,700000]];
 let base=700000;for(let i=1;i<points.length;i++){const[a,va]=points[i-1],[z,vz]=points[i];if(r.lv<=z){base=va*Math.pow(vz/va,clamp((r.lv-a)/(z-a),0,1));break}}
 return Math.round(base*ringResilience(r))
}
function ringResilience(r){return clamp(.5+Math.sqrt(Math.max(0,r.a.体魄||0)*Math.max(0,r.a.精神||0))/100,.55,2.3)}

function absorbBlock(on,years,special){
 if(special)return null;const r=R(),limit=capFor(on);
 if(on===1&&years>=100000&&mainRings(r).length<7){
  if(mainRings(r).length<6)return "主武魂第七环起，才可尝试普通十万年魂环";
  if(r.a.体魄<80||r.a.精神<80)return "第七环挑战十万年：体魄、精神均需 80";
 }
 if(years>limit*1.35)return `身体承受不足：当前可承 ${yLabel(limit)}`;
 return null
}

function capFor(on){
 const r=R(),body=bodyRingCap(r);if(on!==1)return body;
 const n=mainRings(r).length,limit=Math.round(Math.min(body,CAPS[Math.min(8,n)]*ringResilience(r)));
 return n<6?Math.min(99999,limit):limit
}

function mainRings(r){r=r||R(); return r.rings.filter(x=>!x.sealed&&(!x.on||Number(x.on)===1))}
function ringsOf(r,i){return Number(i)===1?mainRings(r):r.rings.filter(x=>!x.sealed&&Number(x.on)===Number(i))}
function cap(r){return r.lv>=99&&r.god?100:Math.min(99,10*(mainRings(r).length+1))}
function wuT(){return TIER_T[wtier()]||1}
function genius(){return 1+(P().innate||0)/40}
function trainGain(r,months){const f=r.lv<60?1:r.lv<80?.85:r.lv<90?.65:.42;return .12*wuT()*genius()*md("train")*(1+Math.min(.2,facPerk("train")))*(.75+Math.min(r.a.悟性,150)/180)*months*f*(r.hurt>50?.5:1)}


/* 同代进境：用既定主线的唐三成长曲线作参照，不受夺取机缘、敌对或死亡偏移影响。 */
function progressionReference(r){
 r=r||R();const y=r.y0+r.t/12,points=WORLD.fenghao.find(n=>n.n==='唐三').lv;
 if(y<=points[0][0])return points[0][1];
 for(let i=1;i<points.length;i++){const [end,b]=points[i],[start,a]=points[i-1];if(y<=end)return Math.min(99,a+(b-a)*(y-start)/(end-start))}
 return 99;
}
function progressionRate(r,lv){r=r||R();return Math.exp(-Math.max(0,(lv??(r.lv+(r.bank||0)))-progressionReference(r)-3)/2.3)}
function pacedLevelGain(x,r,lv){
 r=r||R();if(x<=0)return x;
 let at=lv??(r.lv+(r.bank||0)),left=x,gain=0,edge=progressionReference(r)+3;
 // Integrate the diminishing return over the whole reward: one big grant and many small grants obey the same curve.
 if(at<edge){const normal=Math.min(left,edge-at);gain+=normal;at+=normal;left-=normal}
 if(left>0)gain+=2.3*Math.log1p(left/2.3*Math.exp(-(at-edge)/2.3));
 return gain;
}
function normalizeProgressionBank(r){
 if(r.progressionPace===1)return;
 // Old saves keep their level and equipment. Only unspent, previously unbalanced banked experience is reconciled once.
 r.bank=pacedLevelGain(Math.max(0,r.bank||0),r,r.lv);r.progressionPace=1;
}
function progressionHint(r){
 r=r||R();const ref=progressionReference(r),lead=r.lv-ref;
 if(r.god)return '神位已成，可继续打磨根基';
 return lead>3?`领先同代约 ${lead.toFixed(1)} 级 · 需沉淀根基`:'运转魂力，稳步精进';
}

function legacyRecord(kind,title){const r=R();r.legacy=r.legacy||{};r.legacy[kind]=(r.legacy[kind]||0)+1;r.legacyLog=r.legacyLog||[];r.legacyLog.push({kind,title:title||kind,y:year(),s:season()});r.legacyLog=r.legacyLog.slice(-120)}
function seasonalStory(){const r=R();r.seasonStoryRecent=r.seasonStoryRecent||[];const recent=r.seasonStoryRecent;const pool=SEASON_STORIES.filter(e=>!recent.includes(e.id));const e=(pool.length?pool:SEASON_STORIES)[Math.floor(rnd()*(pool.length||SEASON_STORIES.length))];recent.push(e.id);r.seasonStoryRecent=recent.slice(-20);
 const ally=Object.entries(r.bonds||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1])[0]?.[0]||"旧日同窗";const seat=r.org?r.org.name:(myFac()?myFac().name:P().faction||"你所在的门庭");const city=["诺丁城","索托城","庚辛城","瀚海城"][(Math.floor(r.t/3)+r.seasonStoryRecent.length)%4];
 const tx=s=>String(s).replace(/\$seat/g,seat).replace(/\$ally/g,ally).replace(/\$city/g,city);
 const choices=e.a.map(([t,text,d,need])=>{const dd=JSON.parse(JSON.stringify(d));if(dd.bonds){dd.bonds=Object.fromEntries(Object.entries(dd.bonds).map(([k,v])=>[tx(k),v]))}if(dd.legacy){dd.legacyTitle=e.t}return {t:tx(t),need,hint:dd.legacy?`记入${dd.legacy}事迹 · ${dd.名望?"名望 +"+dd.名望:"人间有记"}`:"",win:{text:tx(text),d:dd}}});
 return {k:"ev",src:"season",id:`season_${e.id}_${r.turns}`,ev:{title:e.t,text:tx(e.s)+`\n\n${year()}年${season()} · ${r.lv>=70?"强者之责":"人间行记"} · ${seat}`,choices}};
}
