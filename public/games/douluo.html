651,"yearMax":2653,"levelMin":0,"flag":null,"notFlag":null},"w":5,"once":true,"text":"猎魂之夜后一个月，七宝迁入天斗城。宁风致咳着血，在城南划出一大片地交给唐三，叫他立一个新宗门：唐门。七宝出钱、出人、出门路。「七宝输得太惨，」他对你说，「唐三是我们押上的最后一枚筹码。」","choices":[{"t":"代七宝坐进唐门议事堂","win":{"text":"你坐在议事堂末席，替七宝记下每一笔钱的去处。唐三敬了你一杯茶。","d":{"bonds":{"唐三":6,"宁风致":4},"rep":{"宗门":5},"名望":6,"trait":{"忠":1},"flags":["tangmen_seat"]}}},{"t":"回去陪两位老人几天","win":{"text":"师父嘴上赶你走，夜里却多煮了一碗面。古榕嗤笑：「老剑，你也有今天。」","d":{"bonds":{"尘心":8,"古榕":5},"trait":{"群":1}}}}]},{"id":"ev_gengxin","title":"凡铁剑鞘","when":{"yearMin":2651,"yearMax":2653,"levelMin":0,"flag":null,"notFlag":null},"w":4,"once":true,"text":"你随荣荣去庚辛城替唐门采买铁料。铁匠协会里有个满手烫疤的学徒叫欧冶青，盯着你的寒霜剑看了很久：「器武魂没有鞘，会冷着自己。我给你打一副，凡铁的。」","choices":[{"t":"收下这副凡铁剑鞘","win":{"text":"剑鞘不值钱，可寒霜剑放进去严丝合缝。那夜你第一次睡得暖。","d":{"item":"凡铁剑鞘","精神":2,"bonds":{"欧冶青":8},"met":["shenjiang"],"flags":["iron_sheath"]}}},{"t":"去废料堆里淘寒心铁精","need":{"金魂币":300},"chance":0.4,"win":{"text":"你淘出一块寒心铁精，欧冶青把它锻进剑鞘，剑鸣都变清了。","d":{"金魂币":-300,"item":"寒心铁精剑鞘","精神":3,"体魄":2,"bonds":{"欧冶青":5},"met":["shenjiang"],"flags":["iron_sheath"]}},"lose":{"text":"三百金魂币换来一块废铁。欧冶青憋着笑，还是给你打了副鞘。","d":{"金魂币":-300,"item":"凡铁剑鞘","bonds":{"欧冶青":5},"met":["shenjiang"],"flags":["iron_sheath"]}},"note":"按：庚辛城能淘到寒心铁精等稀有金属，是原著的机缘地。"}]},{"id":"ev_cracked","title":"裂了的剑","when":{"yearMin":2651,"yearMax":2654,"levelMin":0,"flag":"sword_cracked","notFlag":null},"w":5,"once":true,"text":"你在病床上躺了半个月，寒霜剑一凝就疼，剑身上蛛网似的裂纹怎么也合不上。古榕站在床边，脸色铁青：「老剑那条胳膊是替你挨的。你要是就此废了，他才是白挨。」","choices":[{"t":"把裂剑一寸寸重新磨过","need":{"精神":48},"chance":0.55,"win":{"text":"冰裂了再冻上，比原来更硬。裂纹成了剑脊上一道白线。","d":{"体魄":3,"精神":4,"bonds":{"古榕":5},"trait":{"险":1},"flags":["reforged_sword"]}},"lose":{"text":"磨到第七天，裂纹又崩开一寸，你疼晕在剑庐里。","d":{"伤势":35,"精神":1}}},{"t":"去唐门求唐三救师父的手","win":{"text":"唐三点头，说他会尽全力。师父知道后，一个谢字也没说。","d":{"bonds":{"唐三":6,"尘心":6},"trait":{"仁":1,"群":1}}}}]},{"id":"ev_reselect","title":"七宗重选","when":{"yearMin":2653,"yearMax":2655,"levelMin":55,"flag":null,"notFlag":null},"w":4,"once":true,"text":"武魂殿召开七宗重选大会，九宝琉璃宗的席位要靠人打下来。荣荣远在海上，宗主身后站着两位老人，还缺一把能上台的年轻的剑。对面是武魂殿扶起的新宗，领头的是个魂斗罗。","choices":[{"t":"替九宝上台出剑","need":{"战力":1100},"chance":0.45,"win":{"text":"你三剑逼下那名魂斗罗，台下一片死寂。九宝的席位，是你砍回来的。","d":{"名望":12,"rep":{"宗门":8,"武魂殿":-6},"trait":{"险":1,"忠":1}}},"lose":{"text":"你撑了十招才落台。席位最后靠宗主的情面保住了。","d":{"伤势":40,"名望":4,"rep":{"宗门":2}}}},{"t":"站在宗主身后，不出剑","win":{"text":"你只是站着。宁风致说过，剑只要站在那里，别人就会算清楚。","d":{"魅力":2,"rep":{"宗门":3},"trait":{"险":-1}}}}]},{"id":"ev_north_again","title":"旧羊皮地图","when":{"yearMin":2653,"yearMax":2656,"levelMin":60,"flag":null,"notFlag":"north_sword"},"w":3,"once":true,"text":"大陆上战火渐起，你的剑意却一直差最后一口气。师父把那张旧羊皮地图又压在了你的剑架上，冰川处的墨点还在，什么字也没写。荣荣远在海上，宗门暂时还用不着你。","choices":[{"t":"独自北上去看那座冰川","need":{"悟性":52},"chance":0.55,"win":{"text":"你在师父十六岁的剑痕前坐了三天，起身时，满谷风雪停了一息。","d":{"悟性":4,"bonds":{"尘心":4},"flags":["north_sword"],"trait":{"群":-1,"险":1}}},"lose":{"text":"暴风雪困了你两个月。你没找到冰川，只带回一身冻伤。","d":{"伤势":35,"体魄":2}}},{"t":"把地图收好，留在宗门","win":{"text":"你把地图压回剑架。有些剑，要到最后才知道自己是什么。","d":{"rep":{"宗门":3},"trait":{"群":1,"险":-1}}}}]}],"nodes":[{"id":"n_awaken","title":"寒霜出鞘","year":2637,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M03","text":"七宝城的琉璃殿每年开春开一次侧门，放外院的孩子觉醒武魂。殿里亮起的尽是琉璃塔、玉笛、药囊，好看，值钱，却没有一样能杀人。\n\n轮到你时，你报的是护卫营。爹前年护送商队去巴拉克，再没回来，名字刻在后山一块青石上，刻得很浅，下雨天要用手指摸才摸得出。\n\n手按上水晶球，掌心猛地一顶，像屋檐下的冰凌咔地断下来。你握住了一柄霜白的细剑，脚边青砖结了一圈白霜。先天魂力九级。\n\n殿门口站着两个老人。骨斗罗古榕先笑出声：「冰做的剑，老剑，正配你那张脸。」剑斗罗尘心没笑，看了你很久，说：「跟我走。」他这辈子从没收过徒弟。人群里，一个绛红裙子的小丫头被挤倒在地，正哭鼻子。","choices":[{"t":"跪下，向剑斗罗叩三个头","hint":"规矩人，师父嘴上不说，心里记着","win":{"text":"你磕得额头见了红。师父没扶你，只把自己的剑穗解下来，系在了你的剑柄上。","d":{"bonds":{"尘心":5},"trait":{"忠":1},"flags":["kowtow"]}}},{"t":"抬头反问：你的剑能教我什么","hint":"骨斗罗会大笑，剑斗罗会多看你一眼","win":{"text":"古榕笑得直拍大腿。师父答：「教你活着把剑收回来。」你没听懂，跟他走了。","d":{"悟性":1,"bonds":{"尘心":6,"古榕":4},"trait":{"逆":1,"险":1},"flags":["asked_back"]}}},{"t":"先去扶起哭鼻子的小丫头","hint":"宁荣荣从此认得你，宗主也是","win":{"text":"她抽抽搭搭地抓着你的袖子不放：「你的剑好冷。」宗主宁风致在一旁笑了。","d":{"魅力":1,"bonds":{"宁荣荣":8,"宁风致":4},"trait":{"仁":1,"群":1},"flags":["helped_rongrong"]}}}]},{"id":"n_leave_home","title":"少主离家","year":2643,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M11","text":"二六四三年春，宁荣荣坐在宗主书房的窗台上晃着腿：「史莱克学院，只收怪物。我倒要看看什么怪物配跟本小姐同学。」她目光一扫，落在门边的你身上，「谁敢偷偷跟着，我就跟谁绝交，一辈子。」\n\n她走后，宁风致亲手给你倒了一杯茶。七宗宗主给护卫营的孤女倒茶，传出去要被账房的老先生念叨半个月。「骨叔剑叔若去，三天之内满城都知道七宝少主到了。你不同。」他没说完，你听懂了：做她的影子。\n\n可师父已经在听剑崖上收拾出了第二张石床。他说你的剑到了该磨的时候，再晚，就钝了。","choices":[{"t":"随少主南下，做她的影子","hint":"分叉：索托城。宗主会记着这份情","win":{"text":"你揣着宗主给的盘缠南下，在史莱克对面的老槐客栈住了下来，推开窗就是那块歪招牌。","d":{"金魂币":200,"bonds":{"宁风致":6,"宁荣荣":4},"rep":{"宗门":3},"trait":{"群":1,"忠":1},"flags":["shadow_guard"]}}},{"t":"留下，随师父上听剑崖","hint":"分叉：听剑崖。师父不会说他很高兴","win":{"text":"你搬上听剑崖。站桩三个时辰，挥剑一万次，少一次师父就站在旁边看着。","d":{"悟性":2,"体魄":1,"bonds":{"尘心":8},"trait":{"群":-1},"flags":["sword_cliff"]}}}]},{"id":"n_order","title":"五百套暗器","year":2644,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M27","echo":{"flag":"sparred_tangsan","text":"前因 · 2643：你在索托斗魂场和唐三交过一回手。"},"text":"二六四四年秋，力之一族族长泰坦当街跪在一个十三岁少年面前，叫他少主。消息传进七宝别院时，你正在屋顶值夜。\n\n脚下书房里，宁风致刚给那个叫唐三的少年下了五百套暗器的订单，五百万金魂币。他说山雨欲来，七宝要先买一把伞。\n\n然后是古榕的声音，冷得像骨头上刮下来的霜：「昊天宗的种，十年后就是第二个唐昊。趁他羽翼未丰——此子留不得。」\n\n「骨叔。」宁风致轻轻打断了他。书房里静了很久。你攥着剑柄，屋瓦上的霜化了又结。末了，宗主的声音仍是温温和和的：「再看看。」","choices":[{"t":"把古榕的话透给唐三","hint":"唐三欠你一份情；骨斗罗迟早知道是你","win":{"text":"唐三听完只说了句多谢，转身便走。三天后古榕看你的眼神，像在看一块没长好的骨头。","d":{"bonds":{"唐三":8,"古榕":-6},"trait":{"仁":1,"忠":-1},"flags":["warned_tangsan"]}}},{"t":"去找骨爷爷当面问个明白","hint":"他会骂你，然后教你七宝怎么活","win":{"text":"古榕骂了你半个时辰，最后说：「辅助宗门活下来，靠的是先想最坏的事。」","d":{"精神":1,"bonds":{"古榕":8},"rep":{"宗门":3},"trait":{"险":1},"flags":["gurong_lesson"]}}},{"t":"把听到的话烂在肚子里","hint":"宁风致会看出你懂分寸","win":{"text":"第二天宗主在廊下遇见你，只笑着说了句：「昨夜风大，辛苦了。」","d":{"魅力":1,"bonds":{"宁风致":6},"trait":{"险":-1,"忠":1},"flags":["kept_silent"]}}}]},{"id":"n_ambush","title":"场边的剑","year":2645,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M35","text":"精英大赛开幕，你没有参赛资格，只抱着剑站在史莱克休息区的栏杆外，像一根柱子。荣荣把九宝琉璃塔的光同时分给六个人，下场时冲你抬了抬下巴：看见没有。你点头，她哼一声扭过头，耳朵尖是红的。\n\n大赛移师武魂城的途中，山谷里伏兵四起。菊斗罗、鬼斗罗一左一右缠住了师父，史莱克众人被分割开，荣荣的马车前只剩下你。\n\n一杆倒刺长枪挑开了车帘。持枪的是武魂殿执事厉锋，四十七级魂宗，四个魂环在夜里一明一灭。他看了一眼你的剑，笑了：「七宝也养剑？」","choices":[{"t":"迎上那杆倒刺长枪","hint":"关键战：独自守住马车三回合","need":{"战力":450},"chance":0.5,"win":{"text":"第三剑，你的霜刃冻住了枪尖的倒刺。厉锋退了，荣荣从车窗里探出头，第一次没嫌你是冰棍。","d":{"名望":8,"体魄":2,"bonds":{"宁荣荣":6,"尘心":4},"trait":{"险":1},"flags":["held_carriage"],"reveal":["月关","鬼魅"]}},"lose":{"text":"倒刺刮开你的左肩，第四枪刺向车窗——天上落下一道剑光，厉锋连人带枪被劈成两半。师父背上挨了鬼斗罗一爪，只说：「还有谁。」","d":{"伤势":45,"bonds":{"尘心":8,"古榕":4},"flags":["master_saved_me"],"reveal":["月关","鬼魅"]}}},{"t":"死守车门，放声喊师父","hint":"不丢人。你会听到师父最长的一段话","win":{"text":"师父回剑救下了你。夜里古榕边缝伤口边骂：「喊救命不丢人，死了才丢人！」师父说了一夜的话。","d":{"伤势":15,"bonds":{"尘心":6,"宁荣荣":4,"古榕":3},"trait":{"群":1,"险":-1},"flags":["called_master"],"reveal":["月关","鬼魅"]}}},{"t":"抱起荣荣钻进密林","hint":"保人不保车","need":{"体魄":35},"chance":0.7,"win":{"text":"你背着荣荣在林子里绕了半夜，甩掉了追兵。她趴在你背上小声说：「木头，你别死。」","d":{"bonds":{"宁荣荣":6},"trait":{"仁":1,"险":-1}}},"lose":{"text":"你在林子里被追上，一枪擦过后背。是骨龙从地底翻起，把你们俩卷了回去。","d":{"伤势":30,"bonds":{"宁荣荣":4,"古榕":4}}}}]},{"id":"n_letters","title":"三封信","year":2647,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M41","echo":{"flag":"held_carriage","text":"前因 · 2645：你独自守住了荣荣的马车。"},"text":"武魂城那一锤之后两年，七怪散了。荣荣不再睡到日上三竿，夜里趴在藏书阁的书堆上睡着，手里攥着一张纸，只写了两个字：十年。\n\n你十六岁，剑意却像卡在鞘口，怎么也拔不出来。开春第一天，你屋里多了三封信。\n\n第一封是一张旧羊皮，压在剑架上：师父手绘的极北冰原地图，冰川处点着一个墨点，一个字也没写。第二封盖着宗主私印：「账房缺一双眼睛。」第三封是东宫的帖子，烫金，太子雪清河请七宝的剑入宫，教小郡主们习剑。那天师父什么也没说，却在你门外站了很久。","choices":[{"t":"带上旧地图，北上极北","hint":"分叉：极北冰原。剑意最纯，离七宝风声最远","win":{"text":"你一个人往北走。过了冰封森林，树没了，只剩一望无际的雪，白得分不清天地。","d":{"悟性":2,"体魄":2,"bonds":{"尘心":4},"trait":{"群":-1,"险":1},"flags":["went_north"]}}},{"t":"留在七宝，学看账看人","hint":"分叉：账房。你会看见第二宗门的另一面","win":{"text":"你被关进账房，一百二十个先生的算盘声像一场不停的雨。荣荣说你迟早被算盘埋了。","d":{"魅力":2,"精神":1,"金魂币":300,"bonds":{"宁风致":5,"宁荣荣":3},"rep":{"宗门":3},"flags":["ledger_room"]}}},{"t":"应太子之邀，入东宫教剑","hint":"分叉：天斗皇宫。人人都说太子好","win":{"text":"雪清河笑着说冰剑如雪，名不虚传。可你站在他面前，总像隔着一层看不见的琉璃。","d":{"魅力":2,"金魂币":200,"bonds":{"雪清河":5},"rep":{"天斗":6},"flags":["east_palace"]}}}]},{"id":"n_night_warned","title":"七宝之夜","year":2651,"cond":{"flag":"raid_warning","notFlag":null,"levelMin":0},"canon":"M51","echo":{"flag":"raid_warning","text":"前因 · 2650：你把武魂殿调兵的风声带回了宗主书房。"},"text":"二六五一年春夜，七宝城的灯一盏盏灭了，只剩最高处的琉璃塔还亮着。三更，你在东墙巡夜，脚下砖石轻轻一颤。城外亮起魂环的光，黄的、紫的、黑的，像潮水漫过来。最前面是两道九环。\n\n同一夜，天斗的另一头，蓝电霸王龙宗满门被屠。后来人们管这叫猎魂之夜。\n\n你早知道它会来。三天前你把风声带进宗主书房，宁风致沉默很久，连夜以游学之名把孩子们送出了城，又在东墙下埋了七宝存了五十年的琉璃阵基。\n\n师父从听剑崖一剑而下，被两个封号斗罗夹在半空，其中一个戴着银面具。一个魂圣狂笑着撞碎北门，直奔内院，宗主和荣荣就在里面。","choices":[{"t":"把警告变成部署，守东墙","hint":"改写原著（宿命 −1）：保住师父的右臂","need":{"战力":850},"cost":{"fate":1},"canonChange":{"node":"M51","inertia":3,"desc":"七宝提前布防，剑斗罗右臂得保，宗门伤亡减半"},"win":{"text":"银面具那一掌冲师父右臂而去，你出剑。不是斩，是止。十丈风雪骤落，那团灰光慢了一息，七杀剑回锋。","d":{"shift":8,"名望":10,"bonds":{"尘心":10,"古榕":5},"rep":{"武魂殿":-10,"宗门":8},"trait":{"逆":2,"忠":1},"flags":["arm_saved"]}}},{"t":"迎战撞进内院的魂圣","hint":"关键战：拖住他，等古榕的骨墙合拢","need":{"战力":900},"chance":0.45,"win":{"text":"你撑过三回合，骨墙合拢，魂圣被骨龙压进地里。可半空中那一掌，还是毁了师父的右臂。","d":{"伤势":30,"名望":10,"bonds":{"宁风致":6,"宁荣荣":4},"trait":{"险":1,"忠":1},"flags":["held_inner"]}},"lose":{"text":"第三拳砸在剑身上，寒霜剑裂了。师父回剑钉死魂圣，把整个右侧留给了银面具。他的右臂，是替你挨的。","d":{"伤势":60,"bonds":{"尘心":10},"trait":{"险":1},"flags":["sword_cracked"]}}},{"t":"背起宗主，护荣荣进密道","hint":"保得住人，保不住别的","win":{"text":"你背着咳血的宗主冲进密道，荣荣攥着你的衣角。天亮时出来，师父的右袖空荡荡地垂着。","d":{"bonds":{"宁风致":8,"宁荣荣":5},"trait":{"仁":1,"险":-1},"flags":["carried_fengzhi"]}}}]},{"id":"n_night","title":"七宝之夜","year":2651,"cond":{"flag":null,"notFlag":"raid_warning","levelMin":0},"canon":"M51","text":"二六五一年春夜，七宝城的灯一盏盏灭了，只剩最高处的琉璃塔还亮着。三更，你在东墙巡夜，脚下砖石轻轻一颤。城外亮起魂环的光，黄的、紫的、黑的，像潮水漫过来。最前面是两道九环。\n\n同一夜，天斗的另一头，蓝电霸王龙宗满门被屠。后来人们管这叫猎魂之夜。\n\n这一个月你夜夜睡不着。城外的商队来了又走，天斗城里传来风声，好几座主殿的魂师不知去向。你什么都没抓住，只觉得这座城太安静了。\n\n师父从听剑崖一剑而下，被两个封号斗罗夹在半空，其中一个戴着银面具。一个魂圣狂笑着撞碎北门，直奔内院，宗主和荣荣就在里面。","choices":[{"t":"迎战撞进内院的魂圣","hint":"关键战：拖住他，等古榕的骨墙合拢","need":{"战力":900},"chance":0.45,"win":{"text":"你撑过三回合，骨墙合拢，魂圣被骨龙压进地里。可半空中那一掌，还是毁了师父的右臂。","d":{"伤势":30,"名望":10,"bonds":{"宁风致":6,"宁荣荣":4},"trait":{"险":1,"忠":1},"flags":["held_inner"]}},"lose":{"text":"第三拳砸在剑身上，寒霜剑裂了。师父回剑钉死魂圣，把整个右侧留给了银面具。他的右臂，是替你挨的。","d":{"伤势":60,"bonds":{"尘心":10},"trait":{"险":1},"flags":["sword_cracked"]}}},{"t":"背起宗主，护荣荣进密道","hint":"保得住人，保不住别的","win":{"text":"你背着咳血的宗主冲进密道，荣荣攥着你的衣角。天亮时出来，师父的右袖空荡荡地垂着。","d":{"bonds":{"宁风致":8,"宁荣荣":5},"trait":{"仁":1,"险":-1},"flags":["carried_fengzhi"]}}}]},{"id":"n_coup","title":"宫变","year":2652,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M56","echo":{"flag":"east_palace","text":"前因 · 2647：你在东宫教过剑，太子待你温和，却从不靠近。"},"text":"二六五二年，七宝以探病之名入宫。跟在宁风致身后的，有唐门的唐三，有剑、骨二老。师父的右手，又稳稳握住了七杀剑。\n\n长廊柱后那片比别处更浓的影子里，纪无声站着。你经过时，听见他极轻的两个字：「小心。」\n\n禁卫里一半是假的，白袍从盔甲下露了出来。雪清河站在雪夜大帝床前，脸上的温和一点点褪去，六道金翼在身后展开——不是他，是她。武魂殿的千仞雪，在东宫藏了十几年。\n\n天使领域压得你的剑抬不起来。唐三冲了上去，二老把一千魂师拦在殿门外。殿门口，一个提灯的金发青年正替千仞雪断后，灯光扫过之处，禁卫们眼神发直。他叫苏夜。","choices":[{"t":"拦住那个提灯的人","hint":"强战：冥月灯能窥人记忆","need":{"战力":1000},"chance":0.5,"win":{"text":"你一剑冻住灯焰，苏夜看了你一眼，像看见了你八岁那年的雪。他退了，断后的阵脚就此崩开。","d":{"名望":8,"rep":{"天斗":8,"武魂殿":-8},"bonds":{"苏夜":-5},"trait":{"险":1},"met":["wuhun"],"reveal":["千仞雪"],"flags":["stopped_suye"]}},"lose":{"text":"灯光扫过你的眼，你看见了冰封森林、听剑崖、东墙……回过神时，剑已脱手，他走远了。","d":{"伤势":40,"精神":1,"bonds":{"苏夜":3},"met":["wuhun"],"reveal":["千仞雪"]}}},{"t":"守在雪夜大帝床前","hint":"天斗会记得七宝的剑没有离开","win":{"text":"你横剑立在龙床前，直到金光散尽。纪无声从影子里出来，站到了你身边。","d":{"rep":{"天斗":10},"bonds":{"纪无声":4,"宁风致":3},"trait":{"忠":2},"met":["huangshi"],"reveal":["千仞雪"]}}},{"t":"宫变后独自北上","hint":"去看那座冰川，补全你的剑意","win":{"text":"荣荣出海那天，你往北走。师父什么也没说，只把旧地图压回了你的剑架上。","d":{"悟性":3,"bonds":{"尘心":3,"宁荣荣":-3},"trait":{"群":-2,"险":1},"reveal":["千仞雪"],"flags":["north_sword"]}}}]},{"id":"n_jialing_sword","title":"嘉陵关","year":2657,"cond":{"flag":"north_sword","notFlag":null,"levelMin":0},"canon":"M83","echo":{"flag":"north_sword","text":"前因：你在极北冰川上，见过师父十六岁斩下的那道剑痕。"},"text":"二六五六年秋，天斗大军兵临嘉陵关。圣龙军团的龙骑从关里冲出，前锋眼看要溃。师父一步踏上半空，七杀剑出鞘，一剑劈出几百丈深沟，龙骑连人带兽被掀翻。两军死寂，然后天斗爆出震天的欢呼。\n\n前一夜，他坐在营火边问你：「仗打完了，想做什么。」你想起极北冰川上那两道剑痕，没答上来。\n\n破关之后，罗刹神归来。死亡领域铺开，唐三倒下，复活之光在荣荣和奥斯卡手里一点点凝聚。你看见两位老人对视了一眼，骨龙低吼，七杀剑嗡鸣——他们要冲进去了。","choices":[{"t":"抢在师父之前出剑","hint":"改写原著（宿命 −2）：拦下剑、骨二老","need":{"战力":1250},"cost":{"fate":2},"chance":0.4,"canonChange":{"node":"M83","inertia":4,"desc":"剑斗罗、骨斗罗未冲入死亡领域，七宝结局改写"},"win":{"text":"你在死亡领域里撑过了第三镰。复活之光亮起时，你跌进了一只握了一百多年剑的右手里。","d":{"shift":15,"trait":{"逆":3,"忠":1},"ending":"e1"}},"lose":{"text":"你挡住了两镰，第三镰落下时，复活之光亮了。你笑了一下，然后没有撑住。","d":{"shift":12,"trait":{"逆":2,"仁":2},"ending":"e4"}}},{"t":"转身守在荣荣身前","hint":"复活之光需要有人守；这是你六岁选好的位置","win":{"text":"你一步跨到荣荣身前，把漫过来的黑雾一缕缕冻碎在半空。越过她的肩，你看见两颗流星坠进深井。","d":{"bonds":{"宁荣荣":10},"trait":{"忠":2,"群":1},"ending":"e2"}}},{"t":"追着师父的剑光冲上去","hint":"师父的最后一剑，会留给你","win":{"text":"死亡领域里，师父第一次在出剑时回头：「胡闹。」那一剑轻得像风，把你推出了一百丈。","d":{"bonds":{"尘心":5},"trait":{"险":2,"群":-1},"ending":"e3"}}}]},{"id":"n_jialing","title":"嘉陵关","year":2657,"cond":{"flag":null,"notFlag":"north_sword","levelMin":0},"canon":"M83","echo":{"flag":"arm_saved","text":"前因 · 2651：你在东墙上保住了师父的右臂。"},"text":"二六五六年秋，天斗大军兵临嘉陵关。圣龙军团的龙骑从关里冲出，前锋眼看要溃。师父一步踏上半空，七杀剑出鞘，一剑劈出几百丈深沟，龙骑连人带兽被掀翻。两军死寂，然后天斗爆出震天的欢呼。\n\n前一夜，他坐在营火边问你：「仗打完了，想做什么。」你看着他的侧脸，没答上来。\n\n破关之后，罗刹神归来。死亡领域铺开，唐三倒下，复活之光在荣荣和奥斯卡手里一点点凝聚。你看见两位老人对视了一眼，骨龙低吼，七杀剑嗡鸣——他们要冲进去了。","choices":[{"t":"抢在师父之前出剑","hint":"改写原著（宿命 −2）：拦下剑、骨二老","need":{"战力":1250},"cost":{"fate":2},"chance":0.4,"canonChange":{"node":"M83","inertia":4,"desc":"剑斗罗、骨斗罗未冲入死亡领域，七宝结局改写"},"win":{"text":"你在死亡领域里撑过了第三镰。复活之光亮起时，你跌进了一只握了一百多年剑的右手里。","d":{"shift":15,"trait":{"逆":3,"忠":1},"ending":"e1"}},"lose":{"text":"你挡住了两镰，第三镰落下时，复活之光亮了。你笑了一下，然后没有撑住。","d":{"shift":12,"trait":{"逆":2,"仁":2},"ending":"e4"}}},{"t":"转身守在荣荣身前","hint":"复活之光需要有人守；这是你六岁选好的位置","win":{"text":"你一步跨到荣荣身前，把漫过来的黑雾一缕缕冻碎在半空。越过她的肩，你看见两颗流星坠进深井。","d":{"bonds":{"宁荣荣":10},"trait":{"忠":2,"群":1},"ending":"e2"}}}]}],"endings":[{"id":"e1","title":"结局·师在剑在","type":"改命","grade":3,"text":"你比七杀剑快了半步，一头扎进死亡领域。镰刀落下，你出剑，不是斩，是止。剑碎了三次，凝了三次；第三镰落下时，身后亮起九宝琉璃塔的七彩光。\n\n九宝宗谱上多了一行史书没有的小字：嘉陵关一役，剑斗罗、骨斗罗生还。荣荣出嫁那天，师父喝了她敬的茶，只说一个「好」字，放杯的手在抖。夜里他问你：「你的剑，找到了吗。」你说，它是用来让人停下来的。","afterlife":["尘心：活着看荣荣出嫁，余生每年开春，陪你在听剑崖看一次雾。","古榕：照旧骂奥斯卡配不上荣荣，喝醉了就靠着老剑的肩打鼾。","宁荣荣：成为九彩斗罗，在宗谱上亲手添了那行小字。","九宝琉璃宗：剑骨二老健在，第二宗门成了大陆最稳的一座山门。"],"worldline":"剑斗罗尘心、骨斗罗古榕于嘉陵关生还，亲眼看着宁荣荣出嫁；九宝琉璃宗的结局被改写。"},{"id":"e2","title":"结局·九宝之剑","type":"守护","grade":1,"text":"你守在荣荣身前，一剑又一剑，把每一缕黑雾冻碎在半空。复活之光落在唐三身上时，七杀剑的光熄了。那天黄昏，你在焦土上找到一截骨头，和一角青衫。\n\n葬礼后，荣荣背挺得笔直：「九宝琉璃宗，只剩一把剑了。」你跪下，把寒霜剑横在膝上：「我在。」从此山门前立起两块青石，一块刻剑，一块刻骨，中间坐着寒霜斗罗。","afterlife":["尘心：战死嘉陵关，只留下一角青衫，葬在九宝山门前。","古榕：与老剑同葬，坟前青石刻着一截骨。","宁荣荣：嫁给奥斯卡，成为九彩斗罗；她的小女儿总缠着你问师父的事。","九宝琉璃宗：寒霜斗罗坐镇山门，百年无人敢犯。"],"worldline":"原著线：二老战死嘉陵关，你接过守护者之位，成为九宝琉璃宗唯一的剑——寒霜斗罗。"},{"id":"e3","title":"结局·霜行万里","type":"剑道","grade":2,"text":"师父那一剑把你推出死亡领域，剑光在你身后合拢，像一道鞘。风里传来他最后一句：「去走你自己的剑。」\n\n葬礼后荣荣红着眼笑：「走吧，木头，九宝有我。」你北行到那座冰川，在师父的剑痕旁斩出第三道，不深，却让几百年的风雪停了一息。后来大陆上传说，北方有个白衣女剑客，她出现的地方，仗就打不起来。","afterlife":["尘心：把最后一剑留给了你，与古榕同葬嘉陵关外。","古榕：战死时骨龙护在老剑左侧，一如七十年来。","宁荣荣：独掌九宝琉璃宗，每年冬天往北方寄一封信，从不落款。","九宝琉璃宗：没有你坐镇，却多了一个传说：北方有剑，止战。"],"worldline":"二老战死；你离开宗门北行，成为不属任何势力的寒霜斗罗，战后大陆多了一把止战之剑。"},{"id":"e4","title":"结局·以身为鞘","type":"牺牲","grade":2,"text":"你倒进一只右手里，看见师父那张石头似的脸碎了。「冰封森林那次，你站着看我选。这一次，换我选了。」\n\n史书写着二老生还，没写为什么。古榕在你坟前坐了一整天：「傻丫头，你是剑斗罗的徒弟，不是剑斗罗。」一个月后，有人在极北冰川上看见师父斩出一道短而直的剑痕，像一道鞘，底下刻着：吾徒{name}，剑在，鞘在。","afterlife":["尘心：回到九宝山门前再没离开，每天抱剑望着北边，说在等雪停。","古榕：活到很老，再没骂过任何人一句傻丫头。","宁荣荣：在宗谱上写下你的名字，给女儿起的小名里也有它。","九宝琉璃宗：剑骨二老健在，山门前多了一块刻着鞘的青石。"],"worldline":"你战死嘉陵关，剑斗罗与骨斗罗因此生还；尘心余生守在九宝山门前，等雪停。"}],"summary":"10 节点（两组互斥）16 事件。分叉一（2643）：南下做影子／上听剑崖；分叉二（2647）：极北悟剑得 north_sword，账房或东宫得 raid_warning。七宝之夜持预警花 1 宿命保住师父右臂，否则战魂圣。嘉陵关花 2 宿命战罗刹神，胜 e1 败 e4；守荣荣 e2；持 north_sword 追剑光 e3。"},{"id":"huangshi","title":"天斗皇室·暗卫","defaultName":"纪无声","gender":"男","tagline":"你是太子的影子，太子却是假的","intro":"天斗皇宫西墙下的鸦巢，养着没有名字的孤儿。你以影蝠觉醒，十二岁起做太子雪清河三步之外的影子。白玉盏、七彩斑斓、深宫长夜，终有一天你会知道太子是谁——做她的影子，还是天斗的影子？","birthYear":2630,"startYear":2636,"faction":"天斗","wuhun":{"name":"影蝠","type":"兽","system":"敏攻/侦察","tier":"上","desc":"从影子里剥离的漆黑蝙蝠，振翼无声，以超声辨物，擅潜伏、侦察与一击即走。"},"innate":7,"attrs":{"体魄":22,"精神":34,"悟性":30,"魅力":16,"气运":18},"coins":40,"rep":{"武魂殿":0,"天斗":5,"星罗":0,"宗门":0,"魂兽":0},"bonds":{"秦鸮":10,"寒蝉":10,"雪夜":2},"flavor":{"work":{"name":"顶班夜巡","desc":"替宫人值夜，换点赏钱"},"faction":{"name":"暗卫密差","desc":"替暗卫营查人、送信、盯梢"},"place":"天斗皇宫·鸦巢"},"rings":[{"slot":1,"options":[{"beast":"夜啼鬼蝠","years":380,"kind":"敏","skill":"无声翼","desc":"振 院的泔水桶。\n\n你在夜里翻出指甲盖大的一片，用暗卫营的银针在内壁一刮。针尖黑了。\n\n寝殿的灯还亮着，太子的影子坐在窗纸后一动不动。鸦巢那边，乌鸦叫了一声。秦鸮教了你八年：暗卫效忠的是天斗，是陛下。可灯下那个人，是这两年来唯一问过你冷不冷的人。","choices":[{"t":"把碎片埋在东宫梅树下","hint":"你选择信他，也选择做共犯","win":{"text":"你把碎玉埋进梅树根下，填土时手很稳。第二年开春，那株梅开得格外好。","d":{"bonds":{"雪清河":8},"flags":["buried_shard"],"trait":{"忠":1,"仁":-1}}}},{"t":"把碎片交给统领秦鸮","hint":"暗卫营会去查，查的人未必活得长","win":{"text":"秦鸮捏着碎玉看了一夜，只说一句：「这件事，从此由我来查。」","d":{"bonds":{"秦鸮":8},"rep":{"天斗":5},"flags":["told_qin"],"trait":{"忠":1,"仁":1}}}},{"t":"贴身藏好，一字不提","hint":"留一张底牌，也留一道心结","win":{"text":"碎玉贴着胸口，凉了很多年。你谁也没告诉，包括你自己。","d":{"精神":1,"flags":["kept_shard"],"trait":{"群":-1,"险":-1}}}}]},{"id":"n_poison","title":"七彩斑斓","year":2646,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":null,"echo":{"flag":"told_qin","text":"前因 · 2644：你把白玉盏的碎片交给了秦鸮。他是替你查死的。"},"text":"去年冬天，秦鸮死在鸦巢的院子里，营里说是旧伤复发。他的位子空着，寒蝉替他守了七夜的灵。\n\n开春以后，雪夜大帝的咳嗽一日重过一日。太医说是积劳，你却在城东独孤博的府外，听见老毒物骂了一句：「七彩斑斓，好狠的手笔。」你从养心殿的药炉底下偷出一包药渣，用油布裹着揣进怀里。\n\n回到东宫已是深夜。长廊尽头，太子披着月白斗篷等你，抬手替你拂去肩上的灰：「父皇的汤，明日起你替我端吧。我近来手抖，怕洒了。」\n\n怀里的药渣贴着胸口，又湿又凉。","choices":[{"t":"把药渣倒进太液池","hint":"你替太子藏住了这一桩罪","win":{"text":"药渣沉进太液池，水面连个泡也没起。第二天，你稳稳地端起了那碗汤。","d":{"bonds":{"雪清河":8},"rep":{"天斗":-5},"flags":["poured_poison"],"trait":{"仁":-2,"忠":1}}}},{"t":"塞进雪崩的蛐蛐罐","hint":"一个纨绔能做什么？也许比你想的多","win":{"text":"你把油布包塞进四皇子府满墙蛐蛐罐中的一只。三日后罐子空了，底下多了张字条：知道了。","d":{"bonds":{"雪崩":10},"flags":["snow_ally"],"trait":{"逆":1,"忠":-1}}}},{"t":"呈到御前，交给陛下","hint":"陛下会接过它，再交到另一个人手里","need":{"名望":10},"win":{"text":"陛下摩挲着药渣，许久才说：「朕知道了。汤，你照端。」那夜他召见了四皇子。","d":{"bonds":{"雪夜":10,"雪崩":4},"rep":{"天斗":5},"flags":["snow_ally","emperor_knows"],"trait":{"忠":2}}}}]},{"id":"n_moon","title":"月轩","year":2650,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M45","echo":{"flag":"third_alive","text":"前因 · 2648：你惊了三皇子的马，他断了一条腿，活了下来。"},"text":"月轩里多了一个学礼仪的蓝衣少年，叫唐三。太子常去看他，回来时总比去时沉默。\n\n这夜东宫闯进刺客，三枚淬毒的针钉进太子肩头。你撞开浴房的门，她正背对着你按住伤口，长发散在身后，那不是一个少年的背影。一股灼热的金光从伤口涌出，毒针叮叮落地，烛光把她身后的影子撑开：一对，两对，三对羽翼。\n\n金光散去，她拢好衣襟，声音仍是太子的温润，尾音却颤了一下：「现在，你知道了。」她看着你按在刀柄上的手，「你在想，要拿这个秘密换什么。」\n\n 门，七宝琉璃宗给他出钱。\n\n这夜她屏退所有人，摘下太子冠，第一次在你面前用自己的声音说话。她叫千仞雪，教皇比比东是她的母亲，供奉殿的千道流是她的祖父。「父皇撑不过明年，七彩斑斓已经入了骨髓。到那一天，我就不必再做雪清河了。」\n\n她走到你面前，比你矮半个头，你第一次发现。「蛇矛和刺血是祖父的人，萨拉斯是母亲的人。整座天斗城，没有一个人是我自己的。」烛光里，她的眼睛是很浅的金色。「我只问一次。你是谁的影子？」","choices":[{"t":"我是你的影子","hint":"从此天斗再没有你的位置","win":{"text":"她没有笑，只是很轻地点了一下头，像把一件很重的东西放进了你手里。","d":{"bonds":{"雪清河":15},"rep":{"天斗":-5,"武魂殿":5},"flags":["her_shadow"],"trait":{"忠":2,"群":1}}}},{"t":"我是天斗的影子，但不卖你","hint":"两边都要守，两边都会疼","win":{"text":"她垂下眼：「两边都守，你会疼的。」第二天，她仍让你站在三步之外。","d":{"bonds":{"雪清河":5,"雪夜":5},"flags":["torn"],"trait":{"仁":1}}}},{"t":"把她说的每个字记下来","hint":"这些话足够让她死一百次","win":{"text":"这些话够她死一百次。你写完那页纸，压在了蛐蛐罐底下。","d":{"bonds":{"雪清河":-10},"rep":{"天斗":6},"flags":["recorded"],"trait":{"忠":-2}}}}]},{"id":"n_coup","title":"天斗宫变","year":2652,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M56","echo":{"flag":"her_shadow","text":"前因 · 2651：你对她说，你是她的影子。"},"text":"宫变在一个无风的夜里。她披上六翼天使的金甲，一千名武魂殿魂师从四门涌向养心殿。唐三赶来了，放下背上那个面色苍白的少女，一个人走进天使领域，漆黑的大锤一锤重过一锤，金色领域裂开了第一道纹。\n\n就在这时，刺血斗罗甩开骨斗罗，像一道血色闪电扑向寝殿，扑向你身后龙床上奄奄一息的陛下。只要陛下死在今夜，天斗要乱十年。\n\n广场中央，她在锤声里回过头，冠落在地，六翼中有一翼染了血。她什么也没说，只是看着你。\n\n刺血斗罗离你还有四十丈。","choices":[{"t":"改命：张开夜帷护她退走","hint":"改写原著（宿命 −1）","cost":{"fate":1},"canonChange":{"node":"M56","inertia":3,"desc":"宫变不以全歼收场：你借暗卫营密道放走千仞雪过半部属，天斗与武魂殿照旧决裂，却留下一笔未清的旧账"},"win":{"text":"夜帷吞没了半座广场。你领着她和五百部属从鸦巢密道出城，身后只剩火光与锤声。","d":{"shift":8,"bonds":{"雪清河":15},"rep":{"天斗":-15,"武魂殿":8},"flags":["her_path","opened_tunnel"],"trait":{"逆":2,"仁":1,"忠":1}}}},{"t":"放下刀，随她走出天斗城","hint":"跟她去武魂城，从此不再回头","win":{"text":"你把东宫腰牌留在寝殿门槛上，跟着那道残破的金光，走进了城外的夜色。","d":{"bonds":{"雪清河":10},"rep":{"天斗":-12,"武魂殿":5},"flags":["her_path"],"trait":{"忠":1,"群":1}}}},{"t":"拦住扑向寝殿的刺血斗罗","hint":"关键战：封号斗罗，撑过三回合","need":{"战力":750},"chance":0.35,"win":{"text":"你在血光里撑过三回合，剑斗罗的剑光终于落下。她隔着人群看了你一眼，转身走了。","d":{"名望":12,"伤势":35,"bonds":{"雪夜":10,"雪崩":6},"rep":{"天斗":10,"武魂殿":-10},"flags":["emp_path","saved_night"],"trait":{"险":2,"忠":1}}},"lose":{"text":"刺血一掌震碎了你的影子。昏过去前，你看见一道金光落在身前，她把你带出了天斗城。","d":{"伤势":65,"bonds":{"雪清河":6},"rep":{"天斗":-5},"flags":["her_path"]}}},{"t":"背起昏迷的陛下冲出寝殿","hint":"救驾之功，从此你是帝国的人","win":{"text":"你背着老人从暗门撞出去，身后的窗棂被血光削成碎片。陛下在你背上，轻得像一把枯枝。","d":{"bonds":{"雪夜":10,"雪崩":8},"rep":{"天斗":8,"武魂殿":-5},"flags":["emp_path","saved_night"],"trait":{"忠":1,"仁":1}}}}]},{"id":"n_snow","title":"雪崩","year":2654,"cond":{"flag":"emp_path","notFlag":null,"levelMin":0},"canon":"M57","echo":{"flag":"antidote_lead","text":"前因 · 2651：独孤博答应过，替你留一条路。"},"text":"宫变之后，宁风致用秘法唤醒了陛下，代价是燃他余寿。两年过去，七彩斑斓还是追进了骨髓。四皇子雪崩立为太子，白天在朝堂上学着不笑，夜里一个人坐在养心殿的台阶上。\n\n独孤博把你拉到廊下：「唐小子托我照看冰火两仪眼。那里的东西配上阴阳两泉，也许能把七彩斑斓的根拔出来。也许。」他盯着你，「这药没人试过，陛下经不起试错。要试，得先找个活人。冲得过去就活，冲不过去……就算冲过去，也不会毫发无损。」\n\n雪崩从殿里出来，眼睛是红的：「父皇刚才又说起你，说等他走了，让你看着我，别让我犯浑。」","choices":[{"t":"改命：以身试药，抢回十年","hint":"改写原著（宿命 −2）：你会失去一只耳朵","need":{"体魄":35},"cost":{"fate":2},"canonChange":{"node":"M75","inertia":4,"desc":"雪夜大帝未在2654年冬病逝；嘉陵关由雪夜坐镇，雪崩以太子身份随军，违令强攻、十万伤亡不再发生"},"win":{"text":"药力冲过经脉，你在冰火两仪眼边昏了七天。醒来时左耳一片死寂，陛下却在那天坐了起来。","d":{"shift":15,"伤势":40,"bonds":{"雪夜":15,"独孤博":8,"雪崩":6},"flags":["saved_emperor","deaf_left"],"trait":{"逆":3,"仁":2,"险":2}}}},{"t":"守在雪崩身后，陪他接江山","hint":"陛下会走，你会留下","win":{"text":"那年冬天陛下驾崩。灵前，雪崩攥着你的手腕，攥得很紧：「别走。」","d":{"bonds":{"雪崩":12},"trait":{"忠":2,"群":1}}}},{"t":"带寒蝉重整鸦巢","hint":"天斗的影子，从此由你来养","win":{"text":"陛下驾崩后第二个月，鸦巢的灰瓦换了新的。你和寒蝉重抄名册，空着秦鸮那一栏。","d":{"名望":5,"bonds":{"寒蝉":10},"rep":{"天斗":6},"flags":["spymaster"],"trait":{"忠":1,"群":-1}}}}]},{"id":"n_wall","title":"嘉陵关·城上","year":2656,"cond":{"flag":"her_path","notFlag":null,"levelMin":0},"canon":"M76","echo":{"flag":"opened_tunnel","text":"前因 · 2652：宫变那夜，你从鸦巢密道放走了她五百部属。"},"text":"武魂帝国立国的第二年，大军压到嘉陵关。千道流在天使神殿里闭门不出，她在殿中等一场传承，你守在城墙暗渠的出口。\n\n子时三刻，护城河底那条废弃的暗渠里，有十几个压得很低的心跳，稳得像受过最严的训练。走在最前面的那一个，你在鸦巢的通铺上听着它睡了整整六年。\n\n寒蝉。你走后，雪崩把秦鸮的位子给了她。一只手扶上铁闸，手背上有一道你熟悉的疤，是九岁那年蝠洞里留下的。她的呼吸停了一下。\n\n「十七，」她在黑暗里叫你在鸦巢的编号，「是你吧。」","choices":[{"t":"在城墙阴影里迎战寒蝉","hint":"关键战：同营长大的她，64 级","need":{"战力":900},"chance":0.55,"win":{"text":"第三回合，你的夜帷吞没了她的蝉鸣。你没有下杀手，拧开铁闸，放她的人回了天斗。","d":{"名望":10,"伤势":30,"bonds":{"寒蝉":5},"trait":{"忠":1,"仁":1},"ending":"e1"}},"lose":{"text":"寒蝉的音刃穿透了你的影子。你倒下时，身体正好挡住通往神殿的那道门。","d":{"伤势":80,"ending":"e4"}}},{"t":"打开铁闸，放她回去","hint":"她会知道，也会原谅","win":{"text":"铁闸升起，她在你身边停了一步：「十七，好好活。」暗渠里的心跳一个个远去。","d":{"bonds":{"寒蝉":15},"rep":{"武魂殿":-5,"天斗":5},"flags":["spared_cicada"],"trait":{"仁":2,"群":1},"ending":"e1"}}},{"t":"不理城下，守在神殿门外","hint":"军械库也许会烧，神殿的门不会被推开","win":{"text":"那夜军械库烧了半座，神殿的门始终没人推开。天亮时，金光照彻百里。","d":{"bonds":{"雪清河":10},"flags":["guard_temple"],"trait":{"忠":2,"群":-1},"ending":"e1"}}}]},{"id":"n_banner","title":"嘉陵关·帅旗","year":2656,"cond":{"flag":"emp_path","notFlag":"saved_emperor","levelMin":0},"canon":"M75","echo":{"flag":"spymaster","text":"前因 · 2654：你和寒蝉重整了鸦巢。"},"text":"雪崩登基两年，御驾亲征嘉陵关。唐三掌天斗军权，严令不得出战，可雪崩望着那座百米高的城墙，眼睛一天比一天红：「父皇是被他们一口一口喂死的。我不想等。」\n\n城头的守城巨弩抬起了一百五十张口，吊桥不知为何放下了一半。雪崩翻身上马，几万骑兵跟着上马。传令官嘶声喊着：「蓝昊王有令，不得出战！」他没有听。\n\n城垛后，白金主教萨拉斯脚下升起八个魂环，目光越过千军万马，落在雪崩身上。那是等猎物上钩的眼神。你的手按在刀柄上。","choices":[{"t":"随他冲阵，替他挡下萨拉斯","hint":"关键战：不必赢，只要他活着回来","need":{"战力":950},"chance":0.4,"win":{"text":"你在萨拉斯手下撑过三回合，硬把雪崩的马头拽回本阵。龙旗还在，他也还在。","d":{"名望":15,"伤势":45,"bonds":{"雪崩":10},"trait":{"险":2,"忠":1},"ending":"e2"}},"lose":{"text":"萨拉斯的圣光落下时，你张开了所有的影子。雪崩回到了本阵，你没有。","d":{"伤势":80,"ending":"e4"}}},{"t":"在帅旗下拔刀逼他回头","hint":"他会恨你三天，记你一辈子","win":{"text":"刀锋横在他马前。他瞪着你，三天没跟你说话，此后却再没违过一次帅令。","d":{"shift":3,"bonds":{"雪崩":8},"flags":["drew_on_snow"],"trait":{"逆":1,"险":1},"ending":"e2"}}},{"t":"守在帅旗下，等他回来","hint":"影子不拦主上","win":{"text":"影子不拦主上，只等主上。他回来时浑身是血，身后少了很多人。","d":{"bonds":{"雪崩":5},"trait":{"忠":1,"险":-1},"ending":"e2"}}}]},{"id":"n_night","title":"雪夜未央","year":2656,"cond":{"flag":"saved_emperor","notFlag":null,"levelMin":0},"canon":"M75","echo":{"flag":"tang_ally","text":"前因 · 2651：你替雪崩去唐门牵过线，唐门的机括今夜就埋在山脚。"},"text":"陛下活过了那个冬天，亲自坐镇嘉陵关外的中军御辇。雪崩以太子身份随军，攥着剑柄攥了两个月，一次也没拔出来。你站在御辇三步之外，左耳一片死寂，只能偏过头，用右耳听这座大营。\n\n就是这只右耳听见了：吊桥那边冲出三百精骑，个个魂力深厚，领头的穿白金主教袍，八个魂环明灭。萨拉斯。他们不冲前军，贴着天灵山脚绕了一个大弧，直扑御辇。武魂帝国也知道了，那个本该死去的老皇帝还活着。\n\n辇里，老人轻轻笑了一声：「眼睛亮的孩子，去吧。」","choices":[{"t":"截住萨拉斯的三百精骑","hint":"关键战：你身后就是陛下","need":{"战力":950},"chance":0.45,"win":{"text":"独孤博的毒雾在你身后铺开，你在萨拉斯面前撑过三回合，禁卫的长枪终于到了。","d":{"名望":15,"伤势":40,"bonds":{"雪夜":10,"独孤博":4},"trait":{"险":2},"ending":"e3"}},"lose":{"text":"你把三百骑拖在山脚整整一炷香。萨拉斯的光落下时，御辇已退进大营深处。","d":{"伤势":80,"ending":"e4"}}},{"t":"把御辇藏进影子里","hint":"暗卫本就不该站在光里","win":{"text":"影子罩住了御辇，萨拉斯的精骑扑了个空，在山脚撞进了唐门的机括阵。","d":{"bonds":{"雪夜":8},"flags":["hid_emperor"],"trait":{"险":-1},"ending":"e3"}}}]}],"endings":[{"id":"e1","title":"结局·天使无名","type":"情","grade":2,"text":"战争结束了。她成过神，也亲手碎过神位。那个从没抱过她的女人替她挡下修罗神剑，她跪在血泊里，哭得像个孩子。唐三赦免了她，看着你说：「你还是她的影子。」\n\n武魂城的城门在清晨打开。她换上青布衣裳，在城门口买了一支糖人，皱眉说太甜。你下意识退进门洞的阴影，她走回来，把你拉进阳光里：「我已经不是太子，也不是神了。你不必再站在三步之外。」","afterlife":["千仞雪：碎去神位后隐于山野，有人见她在小镇学做糖人，总嫌自己做得太甜。","寒蝉：回天斗做了一辈子暗卫统领，再没叫过任何人十七。","雪崩：成为明君，从未下旨追查那个消失的东宫暗卫。","鸦巢：名册上{name}那一栏被划去，旁边有人添了四个小字：去向不明。"],"worldline":"千仞雪自碎神位后没有孤身离去，她身边多了一道影子；天斗暗卫营的名册上少了一个名字。"},{"id":"e2","title":"结局·无名碑","type":"忠","grade":2,"text":"武魂帝国覆灭，雪崩成了明君。嘉陵关那一战之后，他在唐三面前横剑于地：「师父，罚我。」此后再没违过一次帅令。\n\n你接了秦鸮的位子。鸦巢后院那口老井被填平，立起一块一人多高的青石碑，一个字也没刻。雪崩想封你爵位，你说：「影子的名字写进史书，就不是影子了。」\n\n后来的史书写了雪崩大帝的隐忍与十年和平，也写了他身边一位暗卫统领，只有四个字：其名不传。","afterlife":["雪崩：亲自主持唐三的婚礼，答应他十年不攻星罗，到死没有违约。","寒蝉：做了你半辈子的副手，退下来后在鸦巢教孩子们赤足走霜瓦。","千仞雪：被赦免后不知所终，有人说她回过一次东宫，看了看那株梅树。","秦鸮：无字碑落成那夜，你在碑前替他斟了一碗酒。"],"worldline":"主线照原著推进：雪崩成为明君并许下十年之约；鸦巢后院立起一块为所有影子而立的无字碑。"},{"id":"e3","title":"结局·雪夜未央","type":"命","grade":3,"text":"嘉陵关破的那天，雪夜大帝坐在御辇里，看那座百米城墙在唐门暗器和昊天锤影下一寸寸崩塌。天斗没有违令出击，护城河里没有填进十万条命。\n\n第一场雪落时，老皇帝退位，诏书最后一句是：朕老矣，所幸见太平。退位那夜他召你进养心殿，问你左耳是不是还听不见。「属下用一只耳朵，换了陛下十年。不亏。」他笑得咳了很久，像很多年前那样摸了摸你的头：「眼睛亮的孩子，黑里头也亮。」","afterlife":["雪夜大帝：退位后又活了三年，走在一个晴天，枕边放着一只旧蛐蛐罐。","雪崩：在父亲身边学会了等待才登基，比原本的他更好。","独孤博：逢人便说那副药是他配的，却从不提试药的人是谁。","天斗暗卫营：统领{name}左耳失聪，回声只剩十五丈，却再没让一道影子落空。"],"worldline":"雪夜大帝活过了武魂帝国，嘉陵关下没有十万人枉死，雪崩在父亲身边学会了等待之后才登基。"},{"id":"e4","title":"结局·影灭","type":"死","grade":1,"text":"那一击来的时候，你本来躲得开。可你身后有人。\n\n你把所有魂力压成一道薄薄的影子，挡在那一击前面。影子碎了。你倒在嘉陵关发红的泥土里，影蝠从你身体里飘出来，绕着你转了三圈，像六岁觉醒那天一样无声，然后散了。你最后看见的，是身后那个人还站着，离你正好三步。\n\n那就好。\n\n后来写嘉陵关的书有很多，没有一本写到你。只有鸦巢的孩子每年清明，会在老槐树下多摆一碗粥：「给一个影子。」","afterlife":["你护住的那个人：照原路走完了这场战争，只在很深的夜里，偶尔 ","d":{"bonds":{"戴沐白":10,"戴维斯":-5,"朱竹漪":5},"flags":["side_mubai"],"trait":{"群":1,"忠":1}}}},{"t":"去找大哥，替他执刀","hint":"大哥讲规矩，你赌他的规矩","win":{"text":"大哥听完只说一句：「要死，也该死在我手里。」他收下了你。","d":{"bonds":{"戴维斯":10,"戴沐白":-5,"朱竹漪":5},"flags":["side_weisi"],"trait":{"忠":1,"险":1}}}},{"t":"把药碗端给三哥看","hint":"借三哥护住母亲，戴琰会更早动手","need":{"名望":15},"win":{"text":"三哥连夜把母亲接出听雨轩。五哥的刀，从此会出得更早。","d":{"bonds":{"戴沐白":15,"戴琰":-20,"沈氏":5},"flags":["side_mubai","yan_exposed"],"trait":{"仁":1,"险":1}}}}]},{"id":"n_gate","title":"斗虎台","year":2650,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"留白·星罗夺嫡","echo":{"flag":"side_weisi","text":"前因 · 2648：你站在了大哥这一侧。"},"text":"斗虎台上，幽冥白虎对幽冥白虎。竹清胜了竹云，三哥胜了大哥。\n\n人群里一支破魂箭直奔大哥后心，是五哥的箭。你扑过去，用雷铠截下了它，箭头在你肩上嗡嗡发颤。\n\n大哥跪在台上，嘴角带血。宗正戴衡展开祖制：「败者入寂，或死，或废。」三哥攥着拳迟疑，父皇只冷冷一句：「祖制不由你想。」大哥抬头看你：「别替我求情。」\n\n台后就是白虎宗祠的虎门。三百年来，进去求废祖制的皇子没有一个走出来。门缝里有风，像有什么东西在呼吸。三哥看着你，父皇也看着你。","choices":[{"t":"推开虎门，血誓废祖制","hint":"改写原著（宿命 −2）","need":{"名望":25},"cost":{"fate":2},"canonChange":{"node":"留白·星罗夺嫡","inertia":4,"desc":"星罗皇子相残的祖制被废：戴维斯不死不废，朱竹云免于陪寂，戴氏兄弟不必再在斗虎台上分生死"},"win":{"text":"门里是十一具朝着门口的骸骨。三天后你走了出来，满身是血。父皇低头：祖制废。","d":{"shift":15,"伤势":30,"名望":20,"rep":{"星罗":10},"bonds":{"戴维斯":20,"戴沐白":10,"朱竹云":10,"星罗皇帝":10,"朱竹漪":5},"flags":["zuzhi_abolished"],"trait":{"逆":3,"仁":2,"险":1}}}},{"t":"沉默，看大哥被废","hint":"原著方向：败者入寂","win":{"text":"宗正的手按上大哥丹田。他没出声，你也没有。从此他住进了寂园。","d":{"rep":{"星罗":3},"bonds":{"戴维斯":-10},"flags":["weisi_crippled"],"trait":{"逆":-1,"仁":-1}}}},{"t":"求一句：圈而不废","hint":"父皇会准，也会记住你心软","need":{"魅力":30},"win":{"text":"父皇准了。大哥保住魂力，被圈进寂园，走前没有看你。","d":{"bonds":{"戴维斯":5,"朱竹云":5,"星罗皇帝":-5},"flags":["weisi_spared"],"trait":{"仁":1}}}}]},{"id":"n_gengxin","title":"庚辛城","year":2651,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M55","echo":null,"text":"猎魂之夜过去不到半年，三哥留下一封信弃了储位，随唐三走了。\n\n庚辛城武魂殿主殿一夜被屠，殿里没有一具全尸，只有墙上嵌着细如牛毛的针，整个大陆只有一伙人用得出这样的手艺。武魂殿要星罗协查，父皇点了你的名。提灯的苏夜也来了，手里攥着铁匠协会的名册。\n\n你在楼高铺子的后院堵住一个满手烫疤的青年，楼高的三徒弟欧冶青。他不跑，也不求饶：「殿下要抓就抓，图纸烧了。」\n\n巷口灯光一晃，苏夜的声音传来：「七殿下，找到了吗？」","choices":[{"t":"替铁匠协会遮掩","hint":"欧冶青欠你一条命","win":{"text":"你把线索引向北方。欧冶青欠你一条命，苏夜的灯在你脸上多停了一息。奏报递上去，你被调往水云关。","d":{"rep":{"武魂殿":-8,"宗门":3},"bonds":{"欧冶青":15,"苏夜":-5},"flags":["covered_tangmen","at_shuiyun"],"met":["shenjiang","wuhun"],"trait":{"逆":1,"仁":1}}}},{"t":"把欧冶青交给苏夜","hint":"武魂殿记功，庚辛城记仇","win":{"text":"苏夜审了三天放人。武魂殿记你一功，庚辛城不会原谅你。父皇调你去水云关。","d":{"rep":{"武魂殿":10,"星罗":-3},"bonds":{"苏夜":10,"欧冶青":-20},"flags":["gave_ouye","at_shuiyun"],"met":["shenjiang","wuhun"],"trait":{"逆":-1,"仁":-1}}}},{"t":"只交出那本账","hint":"两不得罪，两不领情","win":{"text":"两边都不得罪，也都不领情。父皇看完奏报，把你调去了水云关。","d":{"rep":{"武魂殿":3},"bonds":{"苏夜":5},"flags":["neutral_gengxin","at_shuiyun"],"met":["shenjiang","wuhun"],"trait":{"险":-1}}}}]},{"id":"n_shuiyun","title":"水云","year":2655,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"留白·水云关","echo":{"flag":"zhuyi_vow","text":"前因：城头那杯酒，竹漪喝干了。"},"text":"武魂帝国立国，两国之间的门关上了。你守水云关四年，沧澜江的雾一年比一年浓，浓到站在城头看不见江面。\n\n这年秋天，象甲宗宗主呼延震率两万武魂军压到关下，说是借道。八十二级魂斗罗，八个魂环在雾里一明一暗。韩擎压阵，竹漪握着你的手腕，城头的弩阵还差三回合才能装填完毕。韩擎低声说：「殿下，打不打，只在你一句话。」\n\n同一夜，江滩驿亭亮起一盏灯。送信的兵说，提灯的人只见你一个，带来的是武魂帝国真正的条件。关后，是星罗二十七座城。","choices":[{"t":"开关迎战呼延震","hint":"关键战：撑过三回合","need":{"战力":950},"chance":0.45,"win":{"text":"你撑过三回合，弩阵齐发，象甲宗退兵三十里。水云关的名字传遍了星罗。","d":{"名望":15,"伤势":30,"rep":{"星罗":10,"武魂殿":-10},"bonds":{"韩擎":10,"朱竹漪":5},"flags":["won_huyan","path_hold"],"trait":{"险":1,"群":1}}},"lose":{"text":"象甲踏碎外关。韩擎替你堵住门洞，战死在那里。驿亭的灯还亮着。","d":{"伤势":50,"名望":-5,"flags":["lost_huyan","hanqing_dead","suye_comes"],"trait":{"险":1}}}},{"t":"闭门不战，去驿亭","hint":"听听武魂帝国的条件","win":{"text":"你独自出关。灯下坐着苏夜，桌上摊着一卷写好的帛书。","d":{"bonds":{"苏夜":5},"flags":["met_envoy","suye_comes"],"trait":{"险":-1,"忠":-1}}}}]},{"id":"n_envoy","title":"灯下帛书","year":2655,"cond":{"flag":"suye_comes","notFlag":null,"levelMin":0},"canon":null,"echo":{"flag":"hanqing_dead","text":"前因：韩擎战死在外关的门洞里。"},"text":"驿亭里只点着一盏冥月灯，灯罩碎了一角。苏夜比在武魂城时瘦了，推过来一卷帛书。\n\n「教皇的条件。」他说，「星罗中立，不出一兵。事成之后，武魂帝国的网替殿下一直铺到白虎殿。令堂做太后，朱姑娘做皇后。」\n\n帛书末尾已盖好了教皇印，只空着你的名字。你想起白虎殿那句祖制，想起韩擎，想起关上那些等你回去的人。亭外的江水拍着石阶，一下，又一下。\n\n江雾漫进亭子。苏夜把笔推到你手边：「殿下也可以不签。只是这盏灯，下次就不是我来提了。」","choices":[{"t":"提笔签下密约","hint":"换母亲做太后","win":{"text":"你写下名字。苏夜收起帛书，灯光在你脸上停了很久。","d":{"rep":{"武魂殿":20,"星罗":-5},"bonds":{"苏夜":10},"flags":["pact_signed","path_crown"],"trait":{"忠":-2,"群":-1}}}},{"t":"烧掉帛书，夜袭外关","hint":"关键战：替韩擎讨回那道门","need":{"战力":950},"chance":0.5,"win":{"text":"帛书在灯上烧尽。当夜你踏雷夺回外关，替韩擎把城门重新挂了上去。","d":{"名望":10,"rep":{"武魂殿":-15,"星罗":5},"bonds":{"苏夜":-10,"朱竹漪":5},"flags":["retook_gate","path_hold"],"trait":{"忠":1,"险":1}}},"lose":{"text":"夜袭撞上象甲盾阵，你被抬回内关。外关没夺回来，可关还在。","d":{"伤势":40,"rep":{"武魂殿":-10},"flags":["path_hold"],"trait":{"险":1}}}},{"t":"推回笔，放他离开","hint":"两不相欠","win":{"text":"「两不相欠。」苏夜笑了笑，提着那盏破灯消失在雾里。","d":{"bonds":{"苏夜":5,"朱竹漪":3},"flags":["let_suye_go","path_hold"],"trait":{"仁":1,"险":-1}}}}]},{"id":"n_jialing","title":"嘉陵烽火","year":2656,"cond":{"flag":"zuzhi_abolished","notFlag":null,"levelMin":0},"canon":"M75","echo":{"flag":"pact_signed","text":"前因 · 2655：你签过那卷帛书。"},"text":"嘉陵关久攻不下。一道影子从暗道摸进水云关，是天斗暗卫纪无声，带来雪崩的亲笔：武魂帝国南线空虚，若星罗肯出兵，嘉陵关下能少死几万人。纪无声跪在灯下，衣襟还湿着：「陛下说，天斗会记得水云关。」三哥和唐三，也回来了。\n\n父皇的旨意先到一步：不得先启战端。\n\n当天傍晚，大哥戴维斯骑马上了关。祖制废后，他的魂力一分未损，身后跟着朱竹云和白虎旧部。他把圣旨往桌上一扔：「老头子怕了。七弟，这道关是你守的，你说出不出。」","choices":[{"t":"三虎同出水云关","hint":"改写原著：星罗出兵南线","need":{"名望":40},"canonChange":{"node":"M75","inertia":3,"desc":"星罗出兵落鹰原牵制武魂帝国南线，雪崩违令强攻的伤亡从十万降到不足三万"},"win":{"text":"大哥大笑上马。雷纹与邪眸两头白虎并肩出关，旗上写着一个戴字。","d":{"shift":12,"rep":{"天斗":15,"武魂殿":-15},"bonds":{"戴维斯":10,"戴沐白":10,"纪无声":10},"flags":["xingluo_strikes"],"met":["huangshi"],"trait":{"逆":2,"群":1}}}},{"t":"依旨死守","hint":"星罗不流血，也不站出来","win":{"text":"你送纪无声平安北归。大哥摔门而去，星罗一兵未动。","d":{"bonds":{"戴维斯":-5,"纪无声":5},"flags":["held_order","path_hold"],"met":["huangshi"],"trait":{"逆":-1,"忠":1}}}},{"t":"不出兵，写信给三哥","hint":"南线虚实摆上唐三案头","win":{"text":"南线虚实连夜送到唐三案头。你没出一兵，却替嘉陵关打了一仗。","d":{"rep":{"天斗":8,"武魂殿":-5},"bonds":{"戴沐白":10,"纪无声":5},"flags":["intel_to_mubai","path_hold"],"met":["huangshi"],"trait":{"群":1}}}}]},{"id":"n_luoying","title":"落鹰原","year":2657,"cond":{"flag":"xingluo_strikes","notFlag":null,"levelMin":0},"canon":"M82","echo":{"flag":"youlei_sync","text":"前因：幽雷已经成形，竹漪就在你身侧。"},"text":"星罗军北上落鹰原，武魂帝国南线被死死钉在原地。嘉陵关破城的消息先到，接着是唐三战死，又复活。\n\n第三天黄昏，天边压来一条金龙。圣龙宗宗主拓跋希率残部南下突围，九十三级封号斗罗，九个魂环像一串烧红的铁。他要从落鹰原撕开一条去星罗的路。北边嘉陵关方向的烽火，一夜没熄，落鹰原上的草全伏向南方。\n\n大哥擦掉嘴角的血，朱竹云和竹漪各自站到自家白虎身侧。他看着那条龙，咧嘴一笑：「咱们兄弟拦一条龙，够不够？」","choices":[{"t":"齐出迎战拓跋希","hint":"关键战：以白虎拦龙","need":{"战力":1200},"chance":0.5,"win":{"text":"第三回合，金龙坠地。拓跋希跪在焦土上，圣龙军扔下了兵器。","d":{"名望":20,"reveal":["拓跋希"],"ending":"e2","trait":{"险":1,"群":1}}},"lose":{"text":"龙爪洞穿你的胸口。你用最后的雷光把他钉在原地，直到北边传来武魂城降了。","d":{"伤势":90,"reveal":["拓跋希"],"ending":"e4","trait":{"险":1}}}},{"t":"全军退回水云关","hint":"不拿白虎去赌封号斗罗","win":{"text":"你带兵退回关内。拓跋希绕道而去，十天后北边传来武魂城降了。","d":{"bonds":{"戴维斯":-5},"ending":"e1","trait":{"险":-1}}}}]},{"id":"n_crown","title":"王冠","year":2657,"cond":{"flag":"path_crown","notFlag":null,"levelMin":0},"canon":"M85","echo":{"flag":"retook_gate","text":"前因：外关是你亲手夺回来的。"},"text":"武魂帝国亡了。比比东替女儿挡下那一剑的消息传到星罗城时，父皇已经说不出话。\n\n密约的另一半兑现了。那些领过武魂殿补贴的贵族一夜之间全站到你身后，宗正戴衡捧着白虎冠，在御座前等你。苏夜从南边逃来求庇，那盏灯碎得只剩一圈铁骨，他跪在殿下，一句话也不说。\n\n宫门外的人说，三哥正从武魂城南下，身边跟着朱竹清，还有一个背着黑锤的人。\n\n殿外百官已经跪了一地。你想起六岁那年，父皇转扳指的手停下的那一刻。白虎冠就在眼前，你伸手就能够到。","choices":[{"t":"戴上白虎冠，关死水云","hint":"星罗只剩一个皇帝的故事","win":{"text":"当夜你下了三道旨：闭关、焚册，把苏夜送进寂园。祖制那一行字上，按着你的手印。","d":{"rep":{"星罗":15},"ending":"e3","trait":{"忠":-1,"群":-2}}}},{"t":"放下冠，回关迎三哥","hint":"交出帛书，也交出那张网","win":{"text":"你把帛书和那张网一起交给宗正，骑马出了城，回水云关去。","d":{"rep":{"武魂殿":-15,"星罗":5},"bonds":{"戴沐白":10,"朱竹漪":10},"ending":"e1","trait":{"忠":1,"群":1}}}}]},{"id":"n_hold","title":"死守","year":2657,"cond":{"flag":"path_hold","notFlag":null,"levelMin":0},"canon":"M83","echo":{"flag":"shenbow","text":"前因：城头那一千具刻着青字的神弩，都上了弦。"},"text":"嘉陵关破了，唐三战死又复活，比比东限天斗三日投降。南线武魂军孤注一掷，要从水云关撕开去星罗的路。\n\n领头的是一条金龙。圣龙宗宗主拓跋希，九十三级封号斗罗，龙吟震得城头弩弦嗡嗡作响，江雾被龙翼扇开了一道口子。城下的攻城梯一层层压上来，韩擎留下的旧部守在垛口，没有一个人回头。北边的消息还没有来。\n\n竹漪站在你身侧，把袖子挽到手肘：「幽雷，这次试试十成。」你身后是关，关后是星罗。你这一生没赢过谁，也没输给谁，只是守着这道关。","choices":[{"t":"与竹漪合击守门","hint":"关键战：一起赢，一起输","need":{"精神":50},"chance":0.55,"win":{"text":"幽雷劈开龙鳞，金龙没撑过第三回合，掉头北去。你们一起赢了。","d":{"名望":15,"reveal":["拓跋希"],"bonds":{"朱竹漪":10},"ending":"e1","trait":{"群":1}}},"lose":{"text":"幽雷炸开的那一刻，龙爪穿过了雷光。竹漪接住了你。","d":{"伤势":90,"reveal":["拓跋希"],"ending":"e4","trait":{"群":1}}}},{"t":"放出真身独守城门","hint":"关键战：撑到北边消息","chance":0.35,"win":{"text":"你独自在城门下撑到北边亮起蓝金色的光，拓跋希收爪退走。","d":{"名望":15,"伤势":40,"reveal":["拓跋希"],"ending":"e1","trait":{"险":1,"群":-1}}},"lose":{"text":"真身在第三回合被撕开。你没有退，把那条龙钉在了原地。","d":{"伤势":90,"reveal":["拓跋希"],"ending":"e4","trait":{"险":1,"群":-1}}}}]}],"endings":[{"id":"e1","title":"结局·十年之约","type":"守成","grade":1,"text":"武魂城亡后第十天，三哥带着朱竹清和背锤的唐啸来到水云关。你从城头顺绳滑下，被他一把抱住：「小七，你比我还高了。」\n\n那夜城头喝酒，他说雪崩答应唐三，十年不攻星罗。「十年以后，星罗要有一个不用斗虎台挑出来的皇帝。」\n\n第二年开春你娶了竹漪，关上只摆了三桌酒。她说：「这次不是谁配给谁的。」你守住了这道关。至于笼子，那是十年以后的事。","afterlife":["戴沐白：回星罗城见了父皇，十年里一点点拆着宗祠里的旧规矩。","朱竹漪：做了水云关的女主人，幽雷再没在战场上响过。","沈氏：搬到关后小院，种了一架葡萄，咳嗽一年比一年轻。","星罗：以守代战，商路重开，迎来十年喘息。"],"worldline":"原著方向：星罗以守代战，雪崩与唐三定下十年不攻星罗之约。"},{"id":"e2","title":"结局·三虎同关","type":"改命","grade":3,"text":"金龙坠地三天后，三哥带着唐三从武魂城走出来，一手一个搂住你和大哥。三个姓戴的人第一次站在一起，没有一只手放在刀柄上。\n\n那年秋天，雪崩亲临水云关，在盟书上划掉「十年」，改成「永世」。\n\n父皇临终传位大哥，没有斗虎台。宗祠里那行祖制被凿平，新刻上去的是你用血写的八个字：戴氏子孙，生而为兄。大哥看了很久：「七弟，这字写得太丑了。」","afterlife":["戴维斯：继位为帝，在位三十年，没有一个皇子进过寂园。","戴沐白：与朱竹清游历大陆，回来时教你儿子怎么用白虎打滚。","朱竹漪：随你受封白虎亲王妃，幽雷之名传遍两国。","星罗：与天斗立水云之盟，永世不相攻。"],"worldline":"祖制被废，星罗出兵南线截下最后一条龙，十年之约改为永世之盟。"},{"id":"e3","title":"结局·雷纹王冠","type":"王座","grade":2,"text":"白虎冠比你想象的轻。苏夜进寂园前举灯照了照你：「陛下，你现在怕的，是你自己。」\n\n三天后三哥来了，看着御座上的你，只说了一句：「小七，这些年，辛苦你了。」然后转身离开，再没回过星罗。\n\n十年里星罗越来越强。你的长子六岁觉醒，是一头没有雷纹的白虎。宗正出列，又念起那段祖制。你坐在上首，转着白玉扳指，没有看任何人。","afterlife":["戴沐白：在史莱克旧址住下，再没踏进星罗一步。","苏夜：在寂园最里一间屋子提灯终老，再不窥任何人的记忆。","朱竹漪：受封皇后，从不推辞，也再没和你一起用过幽雷。","星罗：国力日盛，祖制照旧，武魂殿的余烬在暗处未熄。"],"worldline":"星罗中立自保，你借武魂殿遗网登基；祖制照旧，笼子换了主人。"},{"id":"e4","title":"结局·埋骨水云","type":"殉道","grade":2,"text":"你记得的最后一样东西是雾。竹漪抱着你，一遍遍叫的不是七殿下，是{name}。\n\n三哥第五天才到。他接过那只乌木匣，里面是你烧得发紫的护腕，还缠着秋狝那截断绳。他在关前跪了很久：「我跑了这么多年，把该守的全扔给了你。」\n\n那年夏天，雪崩答应唐三十年不攻星罗。星罗人把这十年叫作澜年，老兵说，江雾最浓时，城头会伏着一头白虎，望着北方。","afterlife":["朱竹漪：在关后给你立了衣冠冢，一生未嫁，每年开春洒一杯酒进江雾。","戴沐白：回到星罗城，第一件事是拆了斗虎台。","沈氏：在你走后第二年也去了，葬在衣冠冢旁，竹漪种了一架葡萄。","星罗：未遭战火，那十年被叫作澜年。"],"worldline":"拓跋希的南下被你拦住，星罗未遭战火；你战死，那十年被叫作澜年。"}],"summary":"星罗庶出七皇子线，主题是笼子：藏、站队、拆笼或成为笼子。11 个节点，单局经过 7–9 个：觉醒、精英大赛战戴沐白、配虎站队、斗虎台（宿命 2 推开虎门废祖制）、庚辛城、水云关战呼延震或见密使，再按 path 旗分流到帛书、嘉陵烽火（需废祖制，改写 M75）与三个终局节点。客串苏夜、玉衡、林照、欧冶青、纪无声。"},{"id":"haishen","title":"海神岛·潮音岛民","defaultName":"凌汐","gender":"女","tagline":"魔鬼岛里，有人在远海唱歌","intro":"海马城渔家女，六岁觉醒潮音螺，被大祭司波赛西点为侍祭候补。大陆人叫你的家乡魔鬼岛，你却在螺里听见远海有人唱歌。圣战、九考、魔鲸王，和一段等了百年的旧情，都会落进你的潮声里。","birthYear":2633,"startYear":2639,"faction":"海神岛","wuhun":{"name":"潮音螺","type":"器","system":"辅助控制","tier":"上","desc":"淡青海螺，听潮辨声，以螺音乱敌、增友、镇魂；与远海潮母同源，螺中常闻歌声。"},"innate":7,"attrs":{"体魄":18,"精神":36,"悟性":28,"魅力":26,"气运":25},"coins":60,"rep":{"武魂殿":0,"天斗":0,"星罗":0,"宗门":5,"魂兽":3},"bonds":{"凌渡":15,"吉祥":10,"海马斗罗":8},"flavor":{"work":{"name":"随父出海","desc":"补网打渔，换些金魂币"},"faction":{"name":"巡潮守灯","desc":"为海马圣柱巡潮、添灯"},"place":"海马城"},"rings":[{"slot":1,"options":[{"beast":"回声水母","years":380,"kind":"辅","skill":"潮音·回响","desc":"螺声回荡，同伴魂力运转加快一成，回声探知三十丈。","need":{"战力":90}},{"beast":"老回声水母","years":415,"kind":"辅","skill":"潮音·回响","desc":"嗡鸣更沉，同伴魂力加快一成半，探知五十丈；吸收剧痛。","need":{"战力":125}},{"beast":"礁影海蛇","years":560,"kind":"攻","skill":"潮音·蛇鸣","desc":"螺音化作嘶鸣的蛇影噬咬近敌。越限之环，吸收如赌命。","need":{"战力":200}}]},{"slot":2,"options":[{"beast":"静海歌鲀","years":720,"kind":"控","skill":"潮音·静海","desc":"低沉螺音钻入敌耳，令其迟滞，打断凝聚中的魂技。","need":{"战力":210}},{"beast":"鸣沙蟹","years":600,"kind":"防","skill":"潮音·沙幕","desc":"螺音震起细沙水幕，替自己挡下一记远程魂技。","need":{"战力":190}},{"beast":"歌鲀母","years":1100,"kind":"控","skill":"潮音·沉海","desc":"整片水域的声音一齐沉下去，敌人如坠深水。越限之环。","need":{"战力":330}}]},{"slot":3,"options":[{"beast":"雾鸣鳐","years":1550,"kind":"控","skill":"潮音·雾鸣","desc":"螺声化作带鸣水雾，干扰视听与精神探测，可藏匿身形。","need":{"战力":340}},{"beast":"银环海蛇","years":1300,"kind":"攻","skill":"潮音·银环","desc":"螺音凝成环形声刃，绕身切割近身之敌。","need":{"战力":310}},{"beast":"怒浪雾鸣鳐","years":2600,"kind":"控","skill":"潮音·雾海","desc":"浪尖上的老鳐之环，雾可遮一整支船队。越限之环。","need":{"战力":520}}]},{"slot":4,"options":[{"beast":"鸣角独角鲸","years":4600,"kind":"攻","skill":"潮音·破浪","desc":"螺音凝为一线锐鸣，如独角鲸长角，破水裂甲、震散魂技。", 比潮声还低：「把手放上去，海神看着你们。」\n\n掌心一凉，带蓝的金光爬上手臂，一只淡青海螺落进你手里。先天魂力七级，器武魂潮音螺。人群还没议论完，一道白底金纹的身影已站在你面前——从不下山的大祭司波赛西。\n\n「孩子，你在螺里听见了什么？」你把螺贴到耳边：「有人在唱歌，在很远很远的地方。」\n\n她沉默了很久。「海神亲和。十日后上山，做侍祭候补。」父亲凌渡按在你肩上的手在抖。她转身又停下：「她若不愿，也可以晚些。海神等得起。」","choices":[{"t":"捧着螺，跟大祭司上山","hint":"侍祭候补，波赛西会记住你","win":{"text":"你住进海神山，一年回一次家。东窗下那个背影，记住了你的名字。","d":{"悟性":2,"精神":2,"bonds":{"波赛西":8},"rep":{"宗门":5},"flags":["acolyte_early"],"trait":{"忠":1}}}},{"t":"攥住父亲的手，晚几年","hint":"留在海马城，与海马斗罗更亲","win":{"text":"你留在海马城，每七日上一次山。海马斗罗常来家里喝鱼汤。","d":{"体魄":2,"魅力":2,"bonds":{"海马斗罗":8,"凌渡":8},"flags":["acolyte_late"],"trait":{"群":1}}}}]},{"id":"n_ship","title":"送船","year":2646,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":null,"text":"吉祥十岁生日那天，外务船进港了。两桅白帆，船头钉着三叉戟铜徽，一年一来：卸下大陆的铁器和盐，装走珍珠、鲸油，还有该送走的人。\n\n前一晚她在你家灶台边坐了一夜，把这些年配的药一包包写好：这包治晕船，这包治触须毒，这包给凌叔泡脚。「我又不是不回来了。」「你就是不回来了。」你说完就后悔了。\n\n天亮时海马斗罗站在人群最后，像一根不说话的桅杆。波赛西没有来，规矩比任何人都老。吉祥走上跳板，回头冲你笑了一下。潮音螺在你手里发烫，远海那首歌一遍遍地唱：别让她一个人走。\n\n船工开始收跳板。海马斗罗看着你——只要你往前一步，他就当作没看见。","choices":[{"t":"纵身跳上船","hint":"私自离岛，去大陆看看","win":{"text":"你落在甲板上，吉祥哭着捶你。海神岛在身后缩成一个点。","d":{"bonds":{"吉祥":12,"波赛西":-5},"rep":{"宗门":-5},"flags":["left_once"],"shift":1,"trait":{"逆":1,"群":2,"险":1}}}},{"t":"转身面向海神山跪誓","hint":"做真正的侍祭","win":{"text":"山顶的雾散了整整一个时辰。第二天，波赛西亲手给你系上了银发带。","d":{"名望":5,"bonds":{"波赛西":12},"rep":{"宗门":8},"flags":["vowed"],"trait":{"忠":2,"群":-1}}}},{"t":"吹响潮音螺送她一程","hint":"不走，也不跪","win":{"text":"螺声追着白帆出港很远。吉祥没有回头，可你知道她听见了。","d":{"精神":1,"bonds":{"吉祥":6},"trait":{"仁":1}}}}]},{"id":"n_bloodtide","title":"血潮","year":2650,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":null,"echo":{"flag":"left_once","text":"前因 · 2646：你跳上外务船，在瀚海城待了两年，又随船回岛。"},"text":"那一年，海是红的。沙滩上躺满鳃被撕开的死鱼，一头三条渔船长的魔魂大白鲨冲上断礁海，背鳍被齐根咬断。海马斗罗脸色像压着暴雨：「圣战。邪魔虎鲸和魔魂大白鲨。」\n\n海神岛的规矩是不插手，七圣柱只沿岸巡潮，护着渔民。你被分在断礁海——父亲的船也在这里下网。\n\n第七天黄昏，潮音螺在耳边炸开：一头独眼小白鲨慌不择路地逃，三道巨影呈扇形包抄，直冲渔船堆而来。领头的是一头万年邪魔虎鲸，它浮出半个脑袋盯着礁上的你，咧开锯齿般的牙，像在笑。\n\n海马斗罗在三十里外。吹响求援螺号，他片刻就到；可片刻之后，小白鲨早被撕碎，杀红眼的虎鲸会不会冲进渔船，谁也说不准。","choices":[{"t":"立在礁头，以潮音拦它","hint":"三环对万年：撑过三回合","need":{"战力":380},"chance":0.45,"win":{"text":"静海迟滞了它，雾鸣蒙了它的眼。撑到第三回合，海马斗罗的长戟从天而落。小白鲨从你脚下游走，回头看了你一眼。","d":{"名望":10,"rep":{"魂兽":5,"宗门":5},"bonds":{"海马斗罗":8,"小白":8},"flags":["beat_orca"],"trait":{"险":2,"仁":1}}},"lose":{"text":"它一头撞碎礁石，用尾巴把你卷进深海。黑暗尽头，你听见了那首歌。","d":{"伤势":55,"bonds":{"小白":10},"flags":["sunk"],"reveal":["小白"],"trait":{"险":2}}}},{"t":"吹求援螺号，护船后撤","hint":"稳妥；那头小白鲨活不成","win":{"text":"渔船全数回港。海马斗罗赶到时水面只剩一团血，你耳边的歌断了一拍。","d":{"bonds":{"海马斗罗":5,"凌渡":5},"rep":{"魂兽":-3},"flags":["called_help"],"trait":{"险":-2,"群":1}}}}]},{"id":"n_stillabyss","title":"无风之海","year":2651,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":null,"echo":{"flag":"sunk","text":"前因 · 2650：你被虎鲸拖入深海，在一只岛一样大的巨螺腹中醒来，是鲨王送你回岸。"},"text":"圣战平息后，你耳边的歌变了，急促、断续，像唱歌的人喘不上气。十八岁生日那天，你借了父亲的船，循着歌往西，驶进从没人去过的禁海。\n\n第三天，风停了。海面平得像一面镜子，前方浮着一座海图上没有的浅灰小岛，珊瑚林一圈圈旋向顶端，像你手里的螺。岛在呼吸。\n\n『回声的孩子。』那声音像一万次潮汐叠在一起。它叫潮母，曾是海神的号角，海神飞升后留在这片静渊替海数潮汐；你的先祖拾得它一片碎壳，血脉里才有了潮音螺。\n\n『深海魔鲸王寿劫将至，想吞我的潮心，炼成一副铠甲熬过天劫。从前有大祭司和海神神念在，它不敢来。可大祭司老了。我要一只耳朵，在岛上替我听着——那盏灯，什么时候熄。』","choices":[{"t":"与潮母立约，做它的耳朵","hint":"守一个不能告诉大祭司的秘密","win":{"text":"珊瑚林轻轻一颤，一缕潮声住进你的螺心。你成了远海在岛上的耳朵。","d":{"精神":3,"bonds":{"潮母":20},"rep":{"魂兽":10},"flags":["tide_pact"],"reveal":["远海未名海魂兽"],"shift":2,"trait":{"逆":1,"忠":-1}}}},{"t":"回岛禀报大祭司","hint":"忠于海神殿；潮母有所保留","win":{"text":"波赛西听完，只望着西方说：「它还活着。」从此海神之光多照了西边一分。","d":{"bonds":{"波赛西":10,"潮母":5},"rep":{"宗门":5},"flags":["told_poseidon"],"reveal":["远海未名海魂兽"],"trait":{"忠":2}}}},{"t":"请它渡你一口潮息","hint":"贪一口十万年的气","need":{"精神":40},"chance":0.5,"win":{"text":"潮息灌进经脉，像回到襁褓里。你的魂力整整涨了一截，潮母没有再提约定。","d":{"等级":1.5,"精神":2,"bonds":{"潮母":8},"reveal":["远海未名海魂兽"],"trait":{"险":2}}},"lose":{"text":"十万年的潮息太重，你七窍流血。潮母叹了口气，把你送出了静渊。","d":{"伤势":40,"bonds":{"潮母":3},"reveal":["远海未名海魂兽"],"trait":{"险":2}}}}]},{"id":"n_outsiders","title":"外来者","year":2652,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M61","echo":{"flag":"pearl_pact","text":"前因 · 2648：你与紫珍珠击掌为约，今天进港的正是她的旗舰。"},"text":"外来者的船在一个晴得过分的早晨进港——挂紫帆的紫珍珠海盗旗舰。海神之光没有把他们挡在十里外，这意味着他们被允许登岛。\n\n一个背竹篓的身影跳下跳板，差点栽进海里。「{name}姐！」吉祥扑进你怀里，又郑重地往后一指：「我拜师了。」人群正中是个眉目温和的青年，眼睛深得看不见底，挽着他手臂的蝎子辫少女笑成两道月牙。「唐三。这是小舞。」\n\n海马圣柱前，唐三的手掌落下，整根圣柱从底到顶亮成金色。你的潮音螺骤然发烫，他腰间一枚流光溢彩的罩子与它一起震动、一起唱。光散去，他额上多了一枚三叉戟烙印。\n\n「海神九考。」海马斗罗哑声说。山顶那口百年未鸣的海神钟，响了一声。","choices":[{"t":"请命做唐三的引路侍祭","hint":"随九考同行，见证一切","win":{"text":"海马斗罗点了头。从明天起，你每日提着食盒走侧径上山。","d":{"名望":5,"bonds":{"唐三":8,"吉祥":5},"flags":["guide_tangsan"],"trait":{"群":1}}}},{"t":"回到山顶，守着大祭司","hint":"看她不愿被人看见的一面","win":{"text":"你回到东窗下。波赛西没问为什么，只让你把灯擦亮些。","d":{"bonds":{"波赛西":8,"宁荣荣":3},"flags":["stay_poseidon"],"trait":{"忠":1}}}}]},{"id":"n_frostguest","title":"霜客","year":2653,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M63","echo":{"flag":"tide_pact","text":"前因 · 2651：你与潮母立约，知道远海有一头十万年在等人。"},"text":"这一年你被派去北岸巡潮。雾门礁的雾浓得伸手不见五指，潮音螺里却有两种声音：一叶小舟乱划的桨声，和一艘三桅大船吃满风的帆声。\n\n小舟撞上礁石。船上女子银发如雪，发间别着鹿角玉簪，在四季如春的岛上冻得嘴唇发紫。你听见她的心跳，太慢，太沉，像一头在雪原走了很久的鹿。「我叫白霜。听说远海有一头活了十几万年的海魂兽，我想看看，同类怎么活这么久。」\n\n大船泊在海神之光边界，船头青年提一盏幽蓝的灯：「武魂殿苏夜。她是星斗大森林走失的十万年魂兽，交给我，我立刻掉头。」灯光一晃，一根冰针挑向你的记忆，被你的螺音弹了回去。他轻轻一咦：「只看见一片海，和一首歌。」\n\n白霜靠着礁石，没有求你。她在等。","choices":[{"t":"领白霜入海神之光","hint":"武魂殿会记下你的脸","win":{"text":"海神之光合拢，白船进不得一步。苏夜笑了笑，把灯收进袖里：「后会有期。」","d":{"bonds":{"白霜":12,"苏夜":-5},"rep":{"武魂殿":-8,"魂兽":5},"flags":["sheltered_baishuang"],"met":["beast","wuhun"],"shift":2,"trait":{"仁":1,"逆":1}}}},{"t":"驾舟送她去静渊见潮母","hint":"把秘密分给另一个十万年","need":{"精神":45},"chance":0.6,"win":{"text":"雾鸣藏住小舟，你们在无风之海见到潮母。两个十万年隔水对望，很久没有说话。","d":{"bonds":{"白霜":18,"潮母":6,"苏夜":-5},"rep":{"武魂殿":-8,"魂兽":10},"flags":["baishuang_tide"],"met":["beast","wuhun"],"shift":3,"trait":{"逆":2,"险":1}}},"lose":{"text":"白船咬着雾追了半夜，冥月灯照穿了你的雾鸣。白霜拖着你逃回海神之光里。","d":{"伤势":35,"bonds":{"白霜":10},"rep":{"武魂殿":-10},"flags":["sheltered_baishuang"],"met":["beast","wuhun"],"trait":{"险":1}}}},{"t":"守岛规，两边都不许登岸","hint":"白霜会转舵北去","win":{"text":"白霜点点头，划着小舟消失在雾里。苏夜朝你举了举灯，也掉头走了。","d":{"bonds":{"白霜":-5,"苏夜":5},"rep":{"宗门":5},"flags":["closed_gate"],"met":["beast","wuhun"],"trait":{"仁":-1,"忠":1,"逆":-1}}}}]},{"id":"n_orca_court","title":"虎鲸王庭","year":2654,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M65","echo":{"flag":"beat_orca","text":"前因 · 2650：你曾在断礁海独挡一头万年虎鲸三回合。"},"text":"第四考只有一句话：剿灭邪魔虎鲸一族。三百头虎鲸盘踞怒浪绝境以西，王是一头十万年老鲸。海神岛倾巢而出，七圣柱斗罗各领门人，魔魂大白鲨尽数到齐，唐三立在最前面那条船头。\n\n你和宁荣荣同在辅助阵。海马斗罗只交代一句：「虎鲸靠叫声打仗，你的螺，要让它们听不见彼此。」三道螺音叠成一张网撒下去，九宝琉璃塔的彩光落在你身上，虎鲸的阵型开始错乱。\n\n然后它们冲着辅助阵来了。一头血纹爬满全身的母鲸破浪而出——虎鲸王后，四万年往上，它知道是谁在乱它们的声。海马斗罗被五头万年虎鲸缠在三百丈外，小白正从远处拼命游来。\n\n宁荣荣攥住你的胳膊：「{name}，你说，我听你的。」","choices":[{"t":"迎上去，正面乱它的声","hint":"护住辅助阵，撑过三回合","need":{"战力":650},"chance":0.45,"win":{"text":"螺音钻进王后的颅腔，它在船舷前一头撞偏。小白赶到，把它掀进了浅滩。","d":{"名望":15,"rep":{"宗门":10,"魂兽":-3},"bonds":{"宁荣荣":10,"唐三":8,"小白":5},"flags":["beat_queen"],"reveal":["邪魔虎鲸王"],"trait":{"险":2,"群":1}}},"lose":{"text":"王后咬住了你喷出的声浪，巨力倒灌。你听见手里「咔」的一声，潮音螺裂了。","d":{"伤势":65,"精神":-3,"bonds":{"宁荣荣":8},"flags":["cracked_shell"],"trait":{"险":2}}}},{"t":"护着宁荣荣弃船后撤","hint":"稳妥；唐三多吃一记苦头","win":{"text":"你拽着她跳进圣柱阵中。辅助阵崩了一角，唐三硬扛了王后一击，嘴角带血。","d":{"bonds":{"宁荣荣":12,"唐三":-5},"flags":["retreated"],"trait":{"险":-2,"仁":1}}}}]},{"id":"n_leave","title":"离岛之潮","year":2656,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M67","echo":{"flag":"cracked_shell","text":"前因 · 2654：虎鲸王后咬碎了你的螺音，潮音螺上留下一道裂纹。"},"text":"虎鲸王死在唐三手里，第八环又是十万年。之后的考核快得叫人喘不过气：挑战七圣柱，在波赛西手下撑过一炷香，拔出海神三叉戟。香燃尽那一刻殿门开了，唐三嘴角带血，眼睛亮得惊人。波赛西没有出来送他。\n\n大陆来了挂唐门旗号的海船，消息已经旧了一年：武魂殿立国，天斗老皇帝驾崩，天下乱成一锅粥。七怪要走了。\n\n出发前一夜，吉祥来找你。她二十岁了，是唐三唯一的弟子，额上也有一枚小小的海神烙印。「师父说船上还有一个位子。{name}姐，你想不想去看看大陆现在什么样？」\n\n窗外，海神山顶的灯火亮着。你知道波赛西又坐在了东窗前。","choices":[{"t":"登上唐门的船去大陆","hint":"离开海神岛；你会错过一些事","win":{"text":"船帆鼓起，海神山缩成一点灯火。你第一次没有回头。","d":{"bonds":{"吉祥":8},"rep":{"天斗":5,"宗门":-3},"flags":["left_for_mainland"],"trait":{"逆":1,"险":1}}}},{"t":"留下，大祭司身边需要人","hint":"你会见到一个百年前的人","win":{"text":"你把位子让给了别人。那夜你端着鱼汤走到东窗下，她喝了一口。","d":{"bonds":{"波赛西":10,"海马斗罗":5},"rep":{"宗门":5},"flags":["stayed_island"],"trait":{"忠":1,"群":1}}}}]},{"id":"n_call","title":"海神的呼唤","year":2657,"cond":{"flag":"left_for_mainland","notFlag":null,"levelMin":0},"canon":"M84","echo":{"flag":"silver_tray","text":"前因 · 2655：你替欧冶青寻到了深海沉银，他说要给你打一只螺托。"},"text":"大陆比你想的更吵，也更沉默。吵的是战鼓，沉默的是伤兵营里一天送走的几十个人。年初海上传来消息：波赛西在第九考中献祭，唐三成了新的海神。那夜你朝西跪到天亮——你错过了。\n\n欧冶青在唐门力堂，偶尔半夜满身煤灰地过来，往你手里塞个烫手的烤红薯；有一天他带来一只银白螺托，严丝合缝地扣在潮音螺底下。\n\n嘉陵关破了，欢呼还没落，天就黑了：天使与罗刹同时降临，一道蓝金色的光从天上坠落。唐三死了。百万大军被召到关前，跪地向海神祈祷。\n\n你把螺贴到耳边。百万条小溪各自乱流，大海那头却有东西在等——长明灯、潮母、海神留下的每一缕神念，等一个入海口。吉祥的声音在抖：「{name}姐，你的螺在发光。」","choices":[{"t":"登上点将台，吹响潮音螺","hint":"把百万人的祈祷送往大海","canonChange":{"node":"M84","inertia":1,"desc":"海神的呼唤经潮音螺汇聚，唐三复活提前了一刻"},"win":{"text":"第一声很轻，第二声百川同流，第三声大海那头推开了一扇门。光落在唐三身上。","d":{"名望":20,"shift":3,"bonds":{"唐三":10,"吉祥":5,"欧冶青":5},"rep":{"天斗":10},"met":["shenjiang"],"trait":{"群":1},"ending":"e2"}}},{"t":"以回响替奥斯卡二人续力","hint":"复活之光的代价会轻一些","need":{"精神":50},"canonChange":{"node":"M84","inertia":2,"desc":"奥斯卡、宁荣荣失去魂力的时间由约一年缩短为半年"},"win":{"text":"回响托着两人的魂力。复活之光落下时，他们没有倒下，只是握紧了彼此的手。","d":{"名望":10,"shift":4,"bonds":{"宁荣荣":12,"奥斯卡":8,"欧冶青":5},"rep":{"天斗":5},"met":["shenjiang"],"trait":{"仁":1},"ending":"e2"}}}]},{"id":"n_threedays_pact","title":"三日","year":2657,"cond":{"flag":"tide_pact","notFlag":null,"levelMin":0},"canon":"M80","echo":{"flag":"tide_pact","text":"前因 · 2651：你在静渊与潮母立约，做它在岛上的耳朵。"},"text":"那个老人是踩着浪从东边走来的，海神之光没有拦他。他一身红黑相间的旧袍，手背爬满蝙蝠翅膀似的黑紫细纹。「小姑娘，波赛西还在山上吗？一百年前我从这里走下去，总得自己走上来。」\n\n殿门口，波赛西看着他走上最后一级。「你老了。」「你没有。」你悄悄带上了殿门。\n\n三日里出了两件事。海龙斗罗收到消息：唐三海神之心碎尽，正从海上回来，要斩深海魔鲸王完成第八考。潮母只对你一人说：『我的潮心洗得掉蝙蝠王的毒。只是潮心离体，我只剩几年。只有立过约的耳朵，才捧得住它。』\n\n唐晨扶着门框，黑纹已爬到眼角：「我欠她一百年，不该再让别人替我付利息。」波赛西望着你，那双海一样深的眼睛里，第一次有了你看得懂的东西。","choices":[{"t":"捧螺入海，求那颗潮心","hint":"改写原著：唐晨不死（宿命 −2）","cost":{"fate":2},"canonChange":{"node":"M80","inertia":5,"desc":"唐晨未死于海神岛，嘉陵关多出一位99级斗罗，唐三不再陨落"},"win":{"text":"潮心落进他胸口，黑纹一寸寸退成青烟。他睁眼对波赛西说：「你看，我又欠了一个人。」","d":{"shift":20,"bonds":{"唐晨":20,"波赛西":15,"潮母":-10},"flags":["saved_tangchen"],"trait":{"逆":3,"仁":1},"ending":"e3"}}},{"t":"随唐三下魔鲸海沟","hint":"守住潮心，撑过三回合","need":{"战力":850},"chance":0.35,"win":{"text":"你用海啸撞散它的声呐，在潮母螺口前吹出这辈子最长的一口气。三叉戟的金光从魔鲸王背后贯出。","d":{"名望":30,"rep":{"魂兽":15},"bonds":{"潮母":20,"唐三":10,"小白":10},"reveal":["深海魔鲸王"],"trait":{"险":2},"ending":"e4"}},"lose":{"text":"魔鲸王一声长鸣震碎了你的螺音，唐三把你拖出海沟。醒来时，海面浮着一大片金光。","d":{"伤势":60,"trait":{"险":2},"ending":"e1"}}},{"t":"守东窗那盏灯","hint":"原著之路：三日后，灯旁少一个人","win":{"text":"你守在东窗下，没让任何人进去。第三夜，灯火跳了两下，照旧亮着。","d":{"bonds":{"波赛西":10,"唐晨":5},"trait":{"逆":-2,"忠":1},"ending":"e1"}}}]},{"id":"n_threedays","title":"三日","year":2657,"cond":{"flag":null,"notFlag":"tide_pact","levelMin":0},"canon":"M80","echo":{"flag":"told_poseidon","text":"前因 · 2651：你把潮母的事禀报了大祭司，海神之光多照了西边一分。"},"text":"那个老人是踩着浪从东边走来的，海神之光没有拦他。他一身红黑相间的旧袍，手背爬满蝙蝠翅膀似的黑紫细纹。「小姑娘，波赛西还在山上吗？一百年前我从这里走下去，总得自己走上来。」\n\n殿门口，波赛西看着他走上最后一级。「你老了。」「你没有。」你悄悄带上了殿门。\n\n三日里，海龙斗罗收到消息：唐三海神之心碎尽，正从海上回来，要斩深海魔鲸王完成第八考。同一夜，远海的歌忽然变成一声短促的警报——魔鲸王动了，它在往静渊游。潮母没有向你求什么，它只是在唱。\n\n唐晨扶着门框，黑纹已爬到眼角，听见螺响便笑了：「去吧，小姑娘。这里有我们两个老东西，够了。」","choices":[{"t":"随唐三下魔鲸海沟","hint":"守住静渊，撑过三回合","need":{"战力":850},"chance":0.3,"win":{"text":"你用海啸撞散它的声呐，潮母在你身后一同长鸣。三叉戟的金光从魔鲸王背后贯出。","d":{"名望":30,"rep":{"魂兽":15},"bonds":{"潮母":20,"唐三":10,"小白":10},"reveal":["深海魔鲸王"],"trait":{"险":2},"ending":"e4"}},"lose":{"text":"魔鲸王一声长鸣震碎了你的螺音，唐三把你拖出海沟。醒来时，海面浮着一大片金光。","d":{"伤势":60,"trait":{"险":2},"ending":"e1"}}},{"t":"守东窗那盏灯","hint":"原著之路：三日后，灯旁少一个人","win":{"text":"你守在东窗下，没让任何人进去。第三夜，灯火跳了两下，照旧亮着。","d":{"bonds":{"波赛西":10,"唐晨":5},"trait":{"逆":-2,"忠":1},"ending":"e1"}}}]}],"endings":[{"id":"e1","title":"结局·潮声守岛","type":"守","grade":1,"text":"唐晨在第三夜走了，留下一柄血红的修罗魔剑。第九考前夜，波赛西让你替她梳头，第一次叫你的名字：「侍祭侍奉的是海神，不是哪一个人。今夜以后，你可以忘了这句话。」她走进金光，再没出来。唐三成了海神，海龙斗罗接任大祭司，你做了侍祭长。那年冬天，你废除了「岛上不养无魂之人」的旧规。东窗下的铜灯，你每天去添油。","afterlife":["波赛西：在第九考中献祭，与唐晨在神界重逢。","吉祥：回海马城开药铺，木牌上写着无魂者诊金全免。","潮母：歌声一年比一年轻，仍在静渊替海数着潮汐。","海神岛：海龙斗罗任大祭司，岛门第一次为无魂者打开。"],"worldline":"原著主线照常推进；你成为侍祭长，废除了无魂者十岁离岛的千年旧规。"},{"id":"e2","title":"结局·远帆","type":"行","grade":2,"text":"嘉陵关前的百万人后来都说，他们听见了海。唐三复活，双神共存，武魂帝国覆灭。说书人从不提一个海岛来的侍祭，你也不在意。新海神替你解了额上的烙印，你却没有回岛，做了海神岛第一位驻大陆的使节。紫珍珠的海盗船改成商船，十天一个来回，瀚海城的人叫它潮音号。欧冶青问你：「上岛的考核，有没有给铁匠的？」你笑出了声。","afterlife":["吉祥：留在大陆行医，成了天斗城最难排上号的大夫。","欧冶青：年年来瀚海城码头送船，说总要上岛看看那七根柱子。","林照：每年海祭都来瀚海城看海，不说话，你便陪她站着。","海神岛：与大陆首次通航，魔鬼岛之名渐被人忘了。"],"worldline":"海神岛首次与大陆通航；海神的呼唤经潮音汇聚，复活之光的代价略轻。"},{"id":"e3","title":"结局·晨潮","type":"改","grade":3,"text":"潮母第一次离开静渊，把一颗珍珠色的潮心放进你掌心：『替我看着那座岛，我要睡了。』唐晨的黑纹退成青烟。第九考，波赛西依然献祭：「这一次换我先走，你慢慢来。」嘉陵关决战那天，一柄黑色巨锤从天而降，砸偏了罗刹魔镰，白发老人挡在剑斗罗与骨斗罗身前。唐三没有坠落。第二年春天，唐晨回到海神岛，坐在东窗下她坐了一百年的位置，面朝神界。","afterlife":["唐晨：守着东窗铜灯度过余生，说等她多久都行。","波赛西：依旧献祭，这一次是她让他慢慢来。","潮母：交出潮心后长眠静渊，螺壳上的珊瑚年年长高。","尘心、古榕：被唐晨护在身后，活着走下了嘉陵关。"],"worldline":"唐晨未死，唐三未陨落，尘心、古榕生还，复活之光未动用；潮母长眠。"},{"id":"e4","title":"结局·渊歌","type":"海","grade":2,"text":"魔鲸王在离你十丈处停住，三叉戟的金光从它背后贯出。唐三重铸海神之心，波赛西在第九考中献祭，临行前摸了摸你的头。那年秋天，寿数将尽的潮母选择了化形，你在静渊海面上捞起一个白发小女孩，她一开口就是那首歌。你和小白立下远海之约：海神岛不猎远海的十万年，远海魂兽不近岛岸百里。很多年后，海马城的孩子在螺里听见两个声音唱歌。","afterlife":["潮母：化形为白发女孩住进凌家，父亲多摆了一副碗筷。","小白：与你共立远海之约，接过魔鲸死后空出的大海。","唐三：以鲸珠重铸海神之心，在远海之约上落下金印。","海神岛：与远海魂兽约定不战，海洋霸主之争就此平息。"],"worldline":"魔鲸王死后的海洋真空由远海之约填补；潮母化形为人，留在海马城。"}],"summary":"渔家女凌汐，上品器武魂潮音螺。11节点（2657年三个互斥终局节点，单局见9个）+16事件。分叉：跳船/跪誓；血潮虎鲸检定；静渊立约决定能否花宿命救唐晨；引路/守大祭司；霜客三选；虎鲸王后检定；去留大陆。结局：潮声守岛、远帆、晨潮（改命）、渊歌（胜魔鲸王）。"},{"id":"shenjiang","title":"庚辛城·神匠学徒","defaultName":"欧冶青","gender":"男","tagline":"凡铁打出神器，才算神匠","intro":"庚辛城上千家铁匠铺，城北压着武魂殿的金顶。你六岁觉醒熔炉，被判普通，却被神匠楼高看见一点青火。拉十九年风箱，接单、考级、淘铁精，撞上唐门与三大暗器——你的手艺卖给谁，就会杀死谁。","birthYear":2631,"startYear":2637,"faction":"铁匠协会","wuhun":{"name":"熔炉","type":"器","system":"锻造","tier":"中","desc":"掌心一座泥胎铁箍的小炉，火色淡青，能化开寻常炉火化不开的铁精。"},"innate":5,"attrs":{"体魄":24,"精神":20,"悟性":30,"魅力":15,"气运":18},"coins":60,"rep":{"武魂殿":0,"天斗":0,"星罗":5,"宗门":0,"魂兽":0},"bonds":{"楼高":5,"思龙":5,"思迪":3},"flavor":{"work":{"name":"接单打铁","desc":"替城里铺子打铁换金魂币"},"faction":{"name":"协会差事","desc":"替铁匠协会跑腿办事"},"place":"庚辛城·楼家后院"},"rings":[{"slot":1,"options":[{"beast":"赤鳞火蜥","years":380,"kind":"辅","skill":"炉心火","desc":"熔炉火温暴涨，铁坯更快到火候，近身之敌亦被灼伤","need":{"战力":110}},{"beast":"铁背穿山甲","years":320,"kind":"防","skill":"铁骨","desc":"双臂覆上一层铁甲，挨锤不伤，可硬接刀剑","need":{"战力":90}},{"beast":"赤岩火蝎","years":560,"kind":"攻","skill":"蝎尾淬","desc":"青火凝成蝎尾一刺，灼穿皮甲；越限之环，吸收有爆体之险","need":{"战力":160}}]},{"slot":2,"options":[{"beast":"炎甲虫","years":620,"kind":"辅","skill":"淬火","desc":"青火顺着铁的筋骨重排纹理，所淬兵器多扛三成力","need":{"战力":230}},{"beas win":{"text":"你又坐回风箱后。师父不说话，只偶尔把一块坯子推过来，让你落最后一锤。","d":{"悟性":2,"精神":2,"bonds":{"楼高":10},"flags":["back_yard"]}}}]},{"id":"ev_linzhao","title":"剑斗罗的铁臂","when":{"yearMin":2652,"yearMax":2655,"levelMin":0,"flag":"tang_side","notFlag":null},"w":4,"once":true,"text":"七宝琉璃宗的林照来了力堂，背一柄寒霜剑，眼圈发青。猎魂之夜，她师父剑斗罗断了一臂。「师父不肯要假手。我想求一只能握剑的铁臂，他若不戴，就当我自己的念想。」","choices":[{"t":"熬一个月打只铁臂","need":{"悟性":36},"chance":0.5,"win":{"text":"铁臂五指能屈能伸，握剑时簧片无声。后来听说剑斗罗没戴，却天天擦。","d":{"金魂币":500,"名望":12,"rep":{"宗门":10},"bonds":{"林照":12},"item":"七宝的谢礼","met":["qibao"]}},"lose":{"text":"第三根手指总扣不紧剑柄。林照说没关系，你还是把它熔了。","d":{"名望":-2,"bonds":{"林照":4},"met":["qibao"]}}},{"t":"劝她先问问剑斗罗","win":{"text":"一个月后她带来一句话：师父说，铁匠的手比剑客的嘴老实。","d":{"魅力":2,"bonds":{"林照":5},"met":["qibao"]}}}]},{"id":"ev_judouluo","title":"菊香石院","when":{"yearMin":2652,"yearMax":2654,"levelMin":0,"flag":"wuhun_side","notFlag":null},"w":5,"once":true,"text":"你被安置在教皇殿后山的石院，炉、砧、锤一样不缺，只缺一扇自己能开的门。第七天来了个锦袍绣满菊花的男人，香气浓得发腻。他把一具缴来的诸葛神弩搁在砧上：「冕下要这个，要比唐门的还好。」","choices":[{"t":"补上那两三分，交出真图","win":{"text":"你只用了九天。菊斗罗试射时，弩箭穿透三道石墙。石院的门从那天起不再上锁。","d":{"金魂币":800,"名望":8,"rep":{"武魂殿":15},"bonds":{"苏夜":3},"flags":["true_design"],"reveal":["月关"],"trait":{"忠":1,"仁":-1}}}},{"t":"交一份差一分的图","need":{"精神":32},"chance":0.6,"win":{"text":"造得出，用不久，三百箭后机括就松。菊斗罗摸了半天，没摸出那一分。","d":{"金魂币":400,"rep":{"武魂殿":5},"shift":2,"flags":["flawed_design"],"reveal":["月关"],"trait":{"逆":2}}},"lose":{"text":"菊斗罗只射了五十箭就笑了，一根指头点在你眉心。你在地上躺了三天。","d":{"伤势":55,"rep":{"武魂殿":-10},"reveal":["月关"]}}}]},{"id":"ev_father_blade","title":"半道回纹","when":{"yearMin":2648,"yearMax":2657,"levelMin":0,"flag":null,"notFlag":null},"w":2,"once":true,"text":"鬼市旧货摊上压着一把没开刃的长刀，刀脊一道回纹只敲了一半——你认得那个起手。三百把殿役刀，你爹打到最后一把时倒在了炉前。摊主说刀是从主殿废料堆里流出来的，开价一百五十金魂币。","choices":[{"t":"买下它，补完那道回纹","need":{"金魂币":150},"win":{"text":"你把刀回了炉，补完那道回纹，打成一把菜刀挂在灶台上。那一夜你睡得很沉。","d":{"金魂币":-150,"精神":3,"气运":3,"item":"补完回纹的刀","trait":{"群":1}}}},{"t":"不买，记下那道回纹","win":{"text":"你没碰它。往后你打的每一件东西，刀脊上都多了半道回纹，城里人一看便知。","d":{"精神":1,"名望":3}}}]}],"nodes":[{"id":"n_awaken","title":"觉醒·铁灰色的城","year":2637,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M03","text":"庚辛城的天是被烟熏灰的。一千多座炉在天亮前一齐拉起风箱，城北压着武魂殿主殿的金顶。三年前，你爹从那座殿里领回三百把长刀的殿役，第三十九天夜里趴在炉前，再没起来。\n\n觉醒堂里，你掌心浮出一座泥胎铁箍的小炉。执事看了一眼：「器武魂，熔炉，普通。下一个。」没人注意到炉口那一点淡青的火——除了门边一个胡子被火燎得卷曲的老头。他盯着你的手看了很久。\n\n散场时他拦住你娘：「我叫楼高。这孩子，明天寅时送到我后院拉风箱。」他没说收徒，只说拉风箱。","choices":[{"t":"寅时之前就去后院等着","hint":"楼高嘴上不说，心里会记下","win":{"text":"天没亮你就蹲在楼家后院。老头开门看见你，哼了一声，把风箱柄塞进你手里。","d":{"体魄":2,"bonds":{"楼高":5},"flags":["early_bird"],"trait":{"忠":1}}}},{"t":"带上爹留下的那柄锤","hint":"楼高认得这柄锤","win":{"text":"楼高接过锤，拇指摸过锤柄上的旧痕：「这锤，我认得。」他把它挂在了风箱旁。","d":{"悟性":1,"bonds":{"楼高":6},"item":"父亲的锤子","flags":["father_hammer"]}}},{"t":"先去主殿门口看那座金顶","hint":"把恨记下；主殿也会记住你","win":{"text":"你在金顶下站到天黑，把它的样子刻进心里。门口的武士多看了你两眼。","d":{"精神":2,"rep":{"武魂殿":-5},"flags":["grudge_dian"],"trait":{"逆":1}}}}]},{"id":"n_dianyi","title":"殿役","year":2645,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M40","text":"你十四岁这年，庚辛主殿换了殿主。红衣主教迈尔斯手指白净，到任第三天就在协会门口贴出告示：殿役翻倍，每炉每季交枪头二百、箭镞两千，逾期封炉。\n\n秋天，商队带来武魂城的消息：一支叫史莱克的野学院夺了大赛冠军，决赛后有人一锤砸向教皇殿。全城铁匠在酒馆里压着嗓子说那柄锤，楼高照旧开炉，一支殿役也没交。\n\n第二个月，主殿的武士站到了楼家门口。迈尔斯笑着说，楼会长年纪大了，可以让徒弟替他去主殿铸坊做工，炉子照开。思龙看着你，楼高没有回头。","choices":[{"t":"替师父去主殿铸坊做工","hint":"保住楼家的炉；师父会冷着你","win":{"text":"你跟着武士走进主殿侧门。身后，楼高把锤子往砧上一扔，三天没跟你说话。","d":{"金魂币":150,"rep":{"武魂殿":8},"bonds":{"楼高":-5},"flags":["dianyi"],"trait":{"群":1,"险":-1}}}},{"t":"陪师父顶回去，看炉被封","hint":"断了进项，你得自己找饭吃","win":{"text":"铁封条铆上炉口那天，楼高拍了拍你的后脑勺：「好小子。往后自己找饭吃。」","d":{"金魂币":-30,"rep":{"武魂殿":-8},"bonds":{"楼高":8,"思龙":5},"flags":["forge_sealed"],"trait":{"忠":1,"逆":1}}}},{"t":"去求迈尔斯宽限一季","hint":"赌一把迈尔斯的心情","need":{"魅力":25},"chance":0.35,"win":{"text":"迈尔斯打量你半晌，在告示上楼家那一行划了一道。「一季。」他记住了你的脸。","d":{"名望":6,"rep":{"武魂殿":3},"bonds":{"楼高":3},"flags":["forge_spared"]}},"lose":{"text":"迈尔斯连门都没让你进。第二天，楼家三座炉被铆上了铁封条。","d":{"名望":-2,"rep":{"武魂殿":-5},"flags":["forge_sealed"]}}}]},{"id":"n_night","title":"主殿之夜","year":2651,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M55","echo":{"flag":"suye_token","text":"前因 · 2648：苏夜在你砧子上留过一块月牙铁牌。"},"text":"二十岁这年冬天，唐门宗主唐三和七宝琉璃宗的宁荣荣进了铁匠协会。楼高看了三张图纸——孔雀翎、暴雨梨花针、佛怒唐莲——当夜答应入唐门。迈尔斯的快马明早出城，告楼高私通唐门。\n\n唐三只问主殿有多少人，然后递给你一具诸葛神弩：「你们铁匠熟地道，带路。」那一夜金顶烧成了火柱。你从排烟道钻进铸坊，看见思迪被反绑在铁柱上，铁水正顺着炭屑往他脚边爬。\n\n楼梯上走下来一个人，金纹黑袍烧掉半边，掌心一盏冷灯，怀里抱着主殿名册——庚辛城每一家替协会跑过腿的铺子都在上面。是苏夜。五道魂环在他脚下升起。「让开，」他轻声说，「或者跟我走。」","choices":[{"t":"端起神弩拦住苏夜","hint":"关键战：撑三回合，名册留下","need":{"战力":380},"chance":0.4,"win":{"text":"四十八箭封住楼梯口，你借烟道热浪绕到他身后。三回合后唐三赶到，苏夜丢下名册遁走。","d":{"名望":12,"rep":{"武魂殿":-15,"天斗":5},"bonds":{"唐三":10,"苏夜":-5},"item":"诸葛神弩","flags":["tang_side","list_kept"],"met":["wuhun"],"trait":{"险":1}}},"lose":{"text":"冷灯一晃，你又看见爹趴在炉前，手一松弩就落了地。醒来时，苏夜正拖着你在地火道里走。","d":{"伤势":35,"rep":{"武魂殿":5},"bonds":{"楼高":-5},"flags":["wuhun_side","captured"],"met":["wuhun"]}}},{"t":"冲进火里背出思迪","hint":"师兄活下来，名册会出城","win":{"text":"你背着思迪从铁水里蹚出来，鞋底烧穿了。回头时，苏夜和名册都已不见。","d":{"伤势":15,"名望":5,"bonds":{"思迪":15,"楼高":5},"flags":["tang_side","list_escaped"],"met":["wuhun"],"trait":{"仁":2}}}},{"t":"随苏夜从地火道离开","hint":"走到武魂殿那一边去","win":{"text":"你领他钻进地火道。出口外的荒坡上回头看，整座庚辛城都被映红了，你没看见师父。","d":{"rep":{"武魂殿":12},"bonds":{"苏夜":10,"楼高":-20,"思龙":-10},"flags":["wuhun_side","follow_suye"],"met":["wuhun"],"trait":{"忠":-2,"群":-1}}}}]},{"id":"n_fanti","title":"凡铁","year":2655,"cond":{"flag":"tang_side","notFlag":null,"levelMin":0},"canon":"M68","text":"武魂殿立国了。一条横贯东西的疆域把天斗和星罗切开，庚辛城往北每隔几十里就是一座新哨卡。泰坦把你派回庚辛开唐门分坊：「你是庚辛人，铁精也只有你的火化得开。」思迪管账，手上的烫疤结成了硬壳，打铁却比从前稳。\n\n秋天，戴澜来了。星罗庶出的七皇子，水云关外帝国的军旗一天比一天多。他要一千具诸葛神弩，一个月交货，价钱随你开。\n\n那天夜里你翻出爹留下的一块犁铧铁。楼高说过，用凡铁打出神器，才算神匠。你掌心的青火，第一次跳得这样急。","choices":[{"t":"闭炉七日，用犁铧铁打一把刀","hint":"可能觉醒神匠之火；单子会黄","need":{"悟性":34},"chance":0.55,"win":{"text":"第七天开炉，青火里透出一线金。犁铧铁成了一把刀，戴澜握着它，很久没说话。","d":{"悟性":10,"精神":4,"等级":1,"名望":10,"item":"犁铧刀","shift":3,"bonds":{"戴澜":5},"flags":["shenjiang_fire"],"met":["xingluo"],"trait":{"逆":1,"险":1}}},"lose":{"text":"第七天开炉，刀身裂成三截。戴澜没多说，去了别家。你在冷炉前坐到天亮。","d":{"悟性":2,"伤势":15,"金魂币":-100,"met":["xingluo"]}}},{"t":"一个月交出一千具神弩","hint":"水云关多守一年；也会多死很多人","win":{"text":"分坊三十座炉连轴转了一个月。戴澜点完数，留下一箱金魂币：「我的兄长们，也会死在这批弩下。」","d":{"金魂币":2000,"名望":12,"rep":{"星罗":10},"bonds":{"戴澜":10},"flags":["sold_dailan"],"met":["xingluo"],"trait":{"仁":-1}}}}]},{"id":"n_jianu","title":"嘉陵关的弩","year":2655,"cond":{"flag":"wuhun_side","notFlag":null,"levelMin":0},"canon":"M68","echo":{"flag":"captured","text":"前因 · 2651：你是被苏夜从地火道里拖出庚辛城的。"},"text":"武魂殿变成了武魂帝国。立国那天礼炮响了一个时辰，你砧上的铁屑都在跳。教皇殿后山那座石院早不锁了，门口换了牌子：帝国铸器监·首席。每月上百具仿制的唐门弩从你手里出去，送往每一座新插上帝国旗的城。他们待你很好，好得让你夜里睡不着。\n\n秋天你被派到嘉陵关。城墙高厚各百米，城头一百五十台守城巨弩，要你一台台改到能射穿一丈山岩。苏夜站在你身后，什么都没说。\n\n同一天，一个商队伙计塞给你一张油纸，是楼高的字，只有一句：「炉要开了。」","choices":[{"t":"在每台绞盘里留一道死扣","hint":"总有一天，能让它们一齐哑火","need":{"精神":32},"chance":0.65,"win":{"text":"一百五十道死扣，藏在绞盘最深的齿缝里。验收那天，菊斗罗亲手摸过每一台，没摸出来。","d":{"金魂币":500,"rep":{"武魂殿":5},"flags":["ballista_key"],"trait":{"逆":1,"仁":1}}},"lose":{"text":"改到第九十台时监工撞见你多敲了一锤。你挨了三十鞭，死扣全被拆掉。","d":{"伤势":40,"rep":{"武魂殿":-10},"flags":["ballista_true"]}}},{"t":"把巨弩造到极致","hint":"嘉陵关更难破；帝国视你为功臣","win":{"text":"改好的巨弩一箭穿透了靶后的山岩。帝国赏下一箱金魂币，苏夜替你斟了一杯酒。","d":{"金魂币":1500,"名望":10,"悟性":2,"rep":{"武魂殿":15},"bonds":{"苏夜":5},"flags":["ballista_true"],"trait":{"忠":1,"仁":-1}}}},{"t":"揣着师父的信连夜南逃","hint":"赶回去见师父；帝国会通缉你","need":{"体魄":30},"chance":0.7,"win":{"text":"你从排水渠爬出嘉陵关，一路向南。到天斗城南时鞋底磨穿，信还在怀里。","d":{"rep":{"武魂殿":-25},"bonds":{"楼高":10},"flags":["fled_south","tang_side"],"trait":{"群":2,"险":1}}},"lose":{"text":"追兵在山口截住你，一枪挑穿了肩。苏夜把你押回城头，再没提这件事。","d":{"伤势":45,"bonds":{"苏夜":3},"flags":["ballista_true"]}}}]},{"id":"n_xunqi","title":"殉器","year":2656,"cond":{"flag":"tang_side","notFlag":null,"levelMin":0},"canon":"M72","echo":{"flag":"shenjiang_fire","text":"前因 · 2655：你用一块犁铧铁，烧出了青里透金的火。"},"text":"炉要开了。你赶回天斗城南时，唐门前院的炉一座都没熄——要打仗了。唐三从海上回来，已是封号斗罗。\n\n后院里，楼高瘦成一根烧剩的炭条。炉台上摆着三样东西：孔雀翎、暴雨梨花针、三朵佛怒唐莲。铁是好铁，工是神工，可它们是冷的。「神器要一口气，」师父说，「一口人的气。」\n\n他脱下补过无数次的旧袍，叠好放在砧上。「你拉了十九年风箱，知道我为什么不让你碰锤？因为这一天，得有人替我拉风箱。这城里只有你的火有这个分寸。」\n\n炉火从橘红烧到发白。你知道凡人造神器要一条命，可你隐约觉得，未必是这一条。","choices":[{"t":"拉起风箱，送师父最后一程","hint":"原著：楼高殉器，三件神器出炉","win":{"text":"你拉了一夜。天亮时炉里只剩三样东西，指尖一碰便轻轻一颤，像是活的。炉壁上熔着一道人影。","d":{"悟性":3,"精神":3,"名望":10,"item":"孔雀翎","bonds":{"楼高":10,"泰坦":5},"flags":["lougao_dead"],"trait":{"逆":-2,"忠":1}}}},{"t":"以神匠之火替师父完成最后一锻","hint":"改写原著（宿命 −2）","need":{"悟性":46},"cost":{"fate":2},"canonChange":{"node":"M72","inertia":4,"desc":"楼高未殉器：三件神器以神匠之火为魂，不再需要一条人命"},"win":{"text":"你把右手伸进白火里。青金之火灌进三样东西。醒来时师父蹲在旁边，胡子上全是泪，骂得比哪次都响。","d":{"名望":15,"item":"孔雀翎","shift":12,"bonds":{"楼高":20},"flags":["lougao_alive"],"trait":{"逆":3,"仁":1},"bone":{"slot":"右臂","name":"青金熔炉臂","desc":"右臂在神匠之火里重铸，骨中常燃一缕青金火","attrs":{"体魄":4,"精神":4}}}}},{"t":"推开师父，自己跳进炉口","hint":"改写原著（宿命 −1）·就此结局","cost":{"fate":1},"canonChange":{"node":"M72","inertia":3,"desc":"殉器者换成楼高的第三个徒弟，楼高活到终局"},"win":{"text":"你一把推开师父，跳进了火里。那火是青的，是你自己的颜色。","d":{"shift":8,"bonds":{"楼高":30},"flags":["self_sacrifice"],"trait":{"仁":3,"逆":2},"ending":"e3"}}}]},{"id":"n_jialing","title":"火对火","year":2656,"cond":{"flag":"tang_side","notFlag":null,"levelMin":0},"canon":"M74","echo":{"flag":"lougao_alive","text":"前因 · 2656：师父没进炉。后营那五个魂斗罗，是冲着他来的。"},"text":"三个月后，你站在嘉陵关下。城墙像一道从天上垂下来的铁幕，城头一百五十台巨弩对着平原。唐门器械阵摆在关前三里，诸葛神弩、连弩车、投石架，一半出自你手。\n\n首战那天，一朵铁莲在圣龙军团阵中开了花，平原上空了一大片。当夜关上冲下一道火——帝国黄金一代的焱，火焰领主，带人来烧器械阵。同一时刻，后营亮起了五道魂斗罗的魂环，那里有力堂的图纸、火药，和不能打仗的人。\n\n林照的剑在侧翼亮了一下，纪无声的影子贴在雪崩的大帐边。火已舔上第一排弩车，你只能去一个地方。","choices":[{"t":"打开孔雀翎，迎上焱的火","hint":"关键战：撑到武堂赶来","need":{"战力":600},"chance":0.4,"win":{"text":"三百六十五根针分十二路开屏，焱的火被钉散三次。武堂赶到时，他捂着肩退回关上。","d":{"名望":15,"rep":{"天斗":8,"武魂殿":-10},"bonds":{"林照":5},"flags":["beat_yan"],"met":["qibao","huangshi"],"trait":{"险":1}}},"lose":{"text":"你的火压不住他的火。孔雀翎只开了一半，你被烧得滚下土坡，林照把你拖了回来。","d":{"伤势":50,"bonds":{"林照":5},"met":["qibao","huangshi"]}}},{"t":"握紧暴雨梨花针守后营","hint":"关键战：五个魂斗罗，撑三回合","need":{"战力":700},"chance":0.35,"win":{"text":"四十九枚银钉一次打完。五个魂斗罗被钉在后营门口，泰坦赶到时，你还挡在帐前。","d":{"名望":20,"rep":{"天斗":5},"bonds":{"泰坦":10,"楼高":10},"flags":["held_camp"],"met":["qibao","huangshi"],"trait":{"群":2}}},"lose":{"text":"银钉打空时对面还剩三人。一掌扫中你胸口，后营烧了一角，泰坦把你从火里刨了出来。","d":{"伤势":65,"flags":["camp_burned"],"met":["qibao","huangshi"]}}},{"t":"带人把器械拖出火场","hint":"能救一台是一台","win":{"text":"你带着力堂的人冲进火里拖车。天亮时清点，器械阵还剩七成，明日少死一些人。","d":{"金魂币":300,"名望":5,"rep":{"天斗":5},"bonds":{"林照":3},"flags":["saved_engines"],"met":["qibao","huangshi"],"trait":{"仁":1,"险":-1}}}}]},{"id":"n_chengtou_key","title":"城头·死扣","year":2656,"cond":{"flag":"ballista_key","notFlag":null,"levelMin":0},"canon":"M75","echo":{"flag":"ballista_key","text":"前因 · 2655：你在一百五十台绞盘里各留了一道死扣。"},"text":"师父的死讯是苏夜带来的。他从武魂城回来，在城头站了很久才开口：「楼高进了炉子，炉里出来三件东西。」你手里的锤掉在了地上。那张写着「炉要开了」的油纸，你揣到边角都磨破了。你没有回去。\n\n三个月后，唐门和天斗的大军压到关下。首战，一朵铁莲在圣龙军团里开了花。当夜，城下摸上来一队力之一族——泰坦之子泰诺打头，思龙跟在他身后，拎着铁钳，是来毁弩的。\n\n明日拂晓就是总攻。一百五十台巨弩的绞盘里，各藏着一道只有你知道的死扣。","choices":[{"t":"守住你的弩，迎战泰诺","hint":"关键战：胜则守住城头","need":{"战力":560},"chance":0.45,"win":{"text":"你知道哪段城砖底下是空的。泰诺被三支巨弩箭逼下城墙，思龙的铁钳被青火熔断了半截。「走吧，师兄。」","d":{"名望":20,"rep":{"武魂殿":20},"bonds":{"思龙":-20},"trait":{"忠":1,"群":-2},"ending":"e4"}},"lose":{"text":"泰诺一拳砸碎你脚下的城砖。醒来时你手脚都上了铁链，思龙坐在旁边，一夜没合眼。","d":{"伤势":55,"bonds":{"思龙":5},"flags":["captured_jialing"]}}},{"t":"拔掉死扣，让巨弩一齐哑火","hint":"改写原著（宿命 −2）","cost":{"fate":2},"canonChange":{"node":"M75","inertia":3,"desc":"嘉陵关巨弩一夜哑火，雪崩违令强攻的十万伤亡大减"},"win":{"text":"你沿着城头一台台拔过去。拂晓总攻时，一百五十台巨弩一声没响，关下少死了好几万人。","d":{"名望":10,"shift":10,"rep":{"武魂殿":-30,"天斗":10},"bonds":{"思龙":10},"flags":["ballista_silenced"],"trait":{"逆":2,"仁":2,"忠":-2}}}},{"t":"放下锤子，跟思龙走下城头","hint":"你的弩会被毁；帝国当你是叛徒","win":{"text":"你扔下锤。思龙什么也没说，伸手把你从垛口拉下来。身后，泰诺开始砸第一台弩。","d":{"rep":{"武魂殿":-20},"bonds":{"思龙":10},"flags":["surrendered"],"trait":{"群":1}}}}]},{"id":"n_chengtou","title":"城头","year":2656,"cond":{"flag":"ballista_true","notFlag":null,"levelMin":0},"canon":"M75","text":"师父的死讯是苏夜带来的。他从武魂城回来，在城头站了很久才开口：「楼高进了炉子，炉里出来三件东西。」你手里的锤掉在了地上。那张写着「炉要开了」的油纸，你揣到边角都磨破了。你没有回去。\n\n三个月后，唐门和天斗的大军压到关下。首战，一朵铁莲在圣龙军团里开了花。当夜，城下摸上来一队力之一族——泰坦之子泰诺打头，思龙跟在他身后，拎着铁钳，是来毁弩的。\n\n明日拂晓就是总攻。这段城墙一百五十台巨弩，每一台都被你造到了极致，每一台都听你的。","choices":[{"t":"守住你的弩，迎战泰诺","hint":"关键战：胜则守住城头","need":{"战力":560},"chance":0.45,"win":{"text":"你知道哪段城砖底下是空的。泰诺被三支巨弩箭逼下城墙，思龙的铁钳被青火熔断了半截。「走吧，师兄。」","d":{"名望":20,"rep":{"武魂殿":20},"bonds":{"思龙":-20},"trait":{"忠":1,"群":-2},"ending":"e4"}},"lose":{"text":"泰诺一拳砸碎你脚下的城砖。醒来时你手脚都上了铁链，思龙坐在旁边，一夜没合眼。","d":{"伤势":55,"bonds":{"思龙":5},"flags":["captured_jialing"]}}},{"t":"放下锤子，跟思龙走下城头","hint":"你的弩会被毁；帝国当你是叛徒","win":{"text":"你扔下锤。思龙什么也没说，伸手把你从垛口拉下来。身后，泰诺开始砸第一台弩。","d":{"rep":{"武魂殿":-20},"bonds":{"思龙":10},"flags":["surrendered"],"trait":{"群":1}}}}]},{"id":"n_xilu","title":"熄炉","year":2657,"cond":{"flag":null,"notFlag":null,"levelMin":0},"canon":"M85","echo":{"flag":"lougao_alive","text":"前因 · 2656：师父没进炉。今夜拉风箱的，是他。"},"text":"仗打完了。嘉陵关破在一场毒雾里，之后的仗打到了天上，有金色的翅膀，有比夜还黑的镰刀，有人死了又活过来。斗罗历二六五七年冬，武魂帝国没有了。\n\n唐三召集议事堂，说了三件事：唐家军解散；唐门从此只做宗门，不做军械；所有暗器连同图纸，一并销毁。他看着你：「不管你替谁打过铁，你是楼高的徒弟。你来烧。」\n\n力堂后院的炉又点着了。铁匣里是孔雀翎、暴雨梨花针、最后一朵唐莲，和力堂这些年的几百张图纸；墙外是七千多具诸葛神弩。你爹的锤子靠在砧边，枣木柄是空心的。","choices":[{"t":"把一切一件件投进炉里","hint":"唐门暗器真正绝迹","win":{"text":"纸在青火里卷起来，三样东西在火里叹了一口气。七千具神弩，你烧了四十天。","d":{"名望":10,"shift":2,"flags":["all_destroyed"],"trait":{"仁":2},"ending":"e1"}}},{"t":"截下一张图纸，封进锤柄","hint":"改写原著（宿命 −1）","cost":{"fate":1},"canonChange":{"node":"M85","inertia":3,"desc":"终局暗器销毁并不彻底：一份孔雀翎图纸流传后世"},"win":{"text":"你把孔雀翎的图纸折成一指宽，裹七层油布塞进锤柄，用一枚冷锻铁楔封死。","d":{"shift":6,"item":"锤柄里的孔雀翎图纸","flags":["kept_blueprint"],"trait":{"逆":2,"险":1},"ending":"e2"}}}]}],"endings":[{"id":"e1","title":"结局·凡铁","type":"匠","grade":3,"text":"最后一朵唐莲在火里开到最大，然后塌了下去。第四十一天，你没有倒掉铁水，把它们浇成一千副犁铧，送往嘉陵关外被血泡过的荒地。\n\n你回了庚辛城，只砌一座炉，门口挂块木牌：修锅，打犁，磨刀，不接兵器。思龙捧来一块刻着「神匠」的铁牌，你挂在后墙，低到要弯腰才看得见。有人问你和楼高谁才是神匠，你说：「师父用凡铁打出神器，我把神器打回凡铁。我们俩加起来，才算一个。」","afterlife":["楼高：三件神器入炉那夜，庚辛城的老铁匠都朝天斗方向磕了头。","思龙：接任铁匠协会会长，每年开春都来你铺子里借一缕青火。","唐三：唐门从此不造军械，议事堂的名册上，你的名字从力堂挪进了客卿。","铁匠协会：殿役成了老人嘴里的旧话，孩子觉醒时，再没人等在父亲的炉前。"],"worldline":"唐门暗器连同图纸尽数销毁，熔成千副犁铧送往嘉陵关外；庚辛城多了一位不造杀器的神匠。"},{"id":"e2","title":"结局·锤柄里的孔雀","type":"暗","grade":2,"text":"世上的人都说，唐门的暗器没有了。你回庚辛城开了间小铺，不接兵器，爹的锤子挂在后墙，从不用，也不让人碰。\n\n第十一年秋天，一个两鬓斑白的人在铺里坐了半天，留下一袋金魂币和一张画着白虎的纸条。你把钱分给城南，纸条扔进了炉。\n\n你老了，收了个武魂是铁剪的孤儿。临终前你指着那柄锤：「哪天世道又要吃人，就打开它；哪天你想拿它去吃人，就扔进炉里。分不清，就别打开。」","afterlife":["楼高：至死不知道那张图纸还在世上；或者他知道，只是没说。","唐三：他一直相信暗器已经绝迹，神界的史册上也是这么记的。","星罗：十年之约到期那年，有人带着白虎纸条来过庚辛城，空手而回。","铁匠协会：老铁匠们压低声音说，三件神器也许没有全烧。"],"worldline":"暗器并未绝迹：一份孔雀翎图纸藏在庚辛城一柄旧锤里，世界线留下了一道暗门。"},{"id":"e3","title":"结局·炉中青焰","type":"殉","grade":3,"text":"那火是青的，是你自己的颜色。熔炉从掌心脱出，你这二十五年攒下的每一锤，都泼进了孔雀翎、暴雨梨花针和三朵唐莲里。\n\n后来你在嘉陵关的唐莲里感觉到一千个人的死，也在孔雀翎开屏时救下一个不认识的少年兵。神器没有眼睛。\n\n终局那年冬天，瘸了腿的师父亲手把三件东西放回炉里：「老三，出来吧。」你变回一小团青火，被他封在庚辛城地火井口。从此城里的铁匠开炉前，都先来借一缕火种。","afterlife":["楼高：又活了九年，收的徒弟比前半辈子加起来还多，教的第一件事是拉风箱。","思龙：接任协会会长，在地火井口立了一块无字的铁牌。","唐三：终局销毁暗器时，他把三件神器交给楼高亲手处置，没有过问。","庚辛城：地火井口那点青火燃了很多年，没有人让它熄。"],"worldline":"殉器的不是楼高而是你；楼高活到终局亲手毁器，庚辛城地火井上从此燃着一点不灭的青火。"},{"id":"e4","title":"结局·城头巨弩","type":"死","grade":1,"text":"拂晓总攻，你抬手，落下，一百五十台巨弩同时长啸。那一天关下死了十几万人，比任何人预料的都多。焱把一坛酒浇在你头上，说你是帝国的英雄。那夜你洗了七遍手。\n\n大半年后，毒雾漫上城头，城门被撞开。唐门的人登城后第一件事，是调转巨弩。第七十三台的弩口慢慢转向你，箭镞上一道极细的青线，是你亲手淬的。你没有跑。原来你打的东西，有时也会转回来，找到你。","afterlife":["苏夜：从城头捡起你的锤，擦净血迹揣进怀里，随撤退的人群往西去了。","思龙：在协会门口的石狮下埋了一块没刻字的铁牌，说那是他的师弟。","武魂帝国：覆灭那年冬天，城头一百五十台巨弩被熔成了一座铁山。","嘉陵关：史官记下了伤亡和雪崩的强攻，没有人记那批巨弩是谁改的。"],"worldline":"你改造的巨弩让嘉陵关总攻伤亡远超原著；关破之日，你死在自己淬过的弩箭之下，名字不入史册。"}],"summary":"锻造线，成长靠接单、考级、鉴宝、改弩换金魂币与名望。2645殿役分叉（苏夜/纪无声）；2651主殿之夜拦苏夜定阵营。唐门线：凡铁（神匠之火/卖弩戴澜）→殉器（原著/代殉宿命2/投炉E3）→嘉陵关战焱或守后营。武魂线：改巨弩→城头战泰诺胜E4，或拔死扣宿命2。熄炉：全烧E1，截图纸宿命1→E2。"}]</script>

:{"精神":1}},"note":"按：唐昊隐姓埋名做铁匠，因十五年前那一战失去了妻子阿银。"},{"t":"赶紧离开","win":{"text":"你快步出了酒馆，心一路怦怦直跳，再没敢回头，也再没进过那家酒馆。","d":{"trait":{"险":-1}}}}]},{"id":"c_nuoding_duel","title":"练功场之争","when":{"yearMin":2637,"yearMax":2639,"levelMin":5,"flag":null,"notFlag":null},"w":2,"once":true,"text":"诺丁学院的贵族学员萧尘宇带人堵住了工读生，要他们让出练功场。领头的工读生是个蓝银草少年，袖口里似乎藏着什么东西。萧尘宇瞥见你，冷笑着要你选边站。","choices":[{"t":"站到工读生一边","need":{"战力":60},"chance":0.55,"win":{"text":"蓝银草缠住对方双腿，你补上一拳，萧尘宇灰头土脸地走了。那少年冲你笑了笑。","d":{"名望":2,"bonds":{"唐三":8,"小舞":5},"trait":{"仁":1,"群":1}}},"lose":{"text":"你被萧尘宇的狼爪划破了肩膀，正要倒下时，那个蓝银草少年替你挡下了第二击。","d":{"伤势":15,"bonds":{"唐三":5}}},"note":"按：唐三入学不久便击败萧尘宇，成了七舍真正的老大。"},{"t":"站到萧尘宇一边","win":{"text":"萧尘宇随手赏了你三十金魂币。从那天起，工读生们看你的眼神就彻底冷了下来。","d":{"金魂币":30,"bonds":{"唐三":-8,"小舞":-6},"trait":{"仁":-1}}}},{"t":"两不相帮，转身走开","win":{"text":"身后传来一阵喧哗，你没有回头。后来听说，那天是工读生们赢了。","d":{"trait":{"险":-1}}}}]},{"id":"c_subsidy","title":"领补贴的长队","when":{"yearMin":2637,"yearMax":2650,"levelMin":10,"flag":null,"notFlag":null},"w":2,"once":false,"text":"武魂殿分殿门口排着长队，注册魂师每月可领一枚金魂币的补贴。轮到你时，执事翻着名册压低声音说：若肯在殿里挂个虚职，补贴还能翻上一倍。","choices":[{"t":"只领该领的那份","win":{"text":"你把金魂币揣进怀里，执事耸耸肩，在名册上勾了一笔，扯着嗓子喊了下一个。","d":{"金魂币":20}}},{"t":"挂个虚职","win":{"text":"名册上多了你的名字。每月多领一份钱，也多了一份随时可能落到头上的殿里差遣。","d":{"金魂币":60,"rep":{"武魂殿":4},"flags":["wuhun_post"],"trait":{"逆":-1}}}},{"t":"不领，不欠这份人情","win":{"text":"执事诧异地看了你一眼，没说什么，只在名册上你的名字旁边画了个小小的记号。","d":{"rep":{"武魂殿":-2},"trait":{"逆":1,"群":-1}}},"note":"按：武魂殿代发帝国补贴，七成以上魂师因此与它关系密切。"}]},{"id":"c_hunt_permit","title":"猎魂森林的担保","when":{"yearMin":2637,"yearMax":2648,"levelMin":9,"flag":null,"notFlag":null},"w":2,"once":true,"text":"猎魂森林由国家圈养魂兽，进入须持武魂殿手令，外加三名贵族担保。林外一个落魄贵族在兜售担保名额，开价八十金魂币，拍着胸脯说童叟无欺。","choices":[{"t":"付钱进林","need":{"金魂币":80},"win":{"text":"林中魂兽年限齐整，你在里面练了一整天手，对各类魂兽的习性心里总算有了底。","d":{"金魂币":-80,"体魄":2,"悟性":1}}},{"t":"跟他砍价","need":{"魅力":25},"chance":0.5,"win":{"text":"一番软磨硬泡，他四十金就松了口，临了还多送你一张手绘的林区草图。","d":{"金魂币":-40,"体魄":2}},"lose":{"text":"他嫌你寒酸，转头把名额卖给了别人，还当着众人的面骂了你两句穷鬼。","d":{"名望":-1}}},{"t":"向武魂殿告发他"
