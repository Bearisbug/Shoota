<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>杀穿娱乐圈 · 完整试玩</title><meta name="theme-color" content="#0c0811"><style>/* 杀穿娱乐圈 v2 · 舞台视觉。紧凑字号：正文13 / 次要11–12 / 标签10 / 标题17，数字用窄体 */
:root{
 --bg:#0c0811;--bg2:#150e1c;--panel:#1c1426;--panel2:#241a31;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
 --text:#f4eef8;--sub:#c4b8d0;--dim:#9a8fa8;--gold:#ffcf5a;--gold2:#e7a93a;--pink:#ff4f9a;--red:#ff5a66;--cyan:#5fe1ff;--green:#4fe0a6;--violet:#a98bff;
 --font:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;
 --cond:'DIN Condensed','Roboto Condensed','Bahnschrift','Arial Narrow',var(--font);
 --r:10px;--r2:14px;--gap:8px;--pad:10px;
 --t:13px;--t-sub:11.5px;--t-label:10px;--t-title:17px;
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--tab-h:54px;
 --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-gutter:stable;background:var(--bg)}
html,body{height:100%}
body{font:var(--t)/1.45 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%}
::-webkit-scrollbar{width:8px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 舞台背景：两束追光 + 底部暖光 */
.stage-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
 radial-gradient(120% 60% at 50% 110%,rgba(255,79,154,.20),transparent 60%),
 radial-gradient(60% 40% at 0% 0%,rgba(169,139,255,.22),transparent 70%),
 radial-gradient(60% 40% at 100% 0%,rgba(255,207,90,.16),transparent 70%),var(--bg)}
.stage-bg i{position:absolute;top:-20%;width:38vmax;height:140%;background:linear-gradient(180deg,rgba(255,240,210,.13),transparent 70%);filter:blur(8px);transform-origin:50% 0;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}
.stage-bg i:nth-child(1){left:-8%;animation:sweep 9s ease-in-out infinite alternate}
.stage-bg i:nth-child(2){right:-8%;animation:sweep 11s ease-in-out infinite alternate-reverse;background:linear-gradient(180deg,rgba(255,79,154,.14),transparent 70%)}
@keyframes sweep{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}

/* ---------- 标题页 ---------- */
.title{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(24px + var(--safe-t)) 18px calc(24px + var(--safe-b));text-align:center;position:relative}
.logo{font-weight:900;font-size:44px;line-height:1;letter-spacing:2px;background:linear-gradient(180deg,#fff6d6,#ffcf5a 45%,#e7a93a 55%,#fff1c1);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,207,90,.45)) drop-shadow(0 2px 0 #7a3d00);transform:skew(-6deg)}
.logo small{display:block;font-size:11px;letter-spacing:6px;margin-top:8px;color:var(--pink);-webkit-text-fill-color:var(--pink);filter:none;font-weight:700}
.title-cast{display:flex;gap:6px;justify-content:center;margin:6px 0 2px}
.title-cast .pf{width:64px;height:78px;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);transform:rotate(var(--rot));border:1px solid var(--line2)}
.title-cast .pf:nth-child(3){width:84px;height:102px;margin-top:-12px;border-color:var(--gold)}
.title p.tag{color:var(--sub);font-size:12px;max-width:300px}
.title .btns{display:grid;gap:8px;width:min(300px,100%);margin-top:6px}
.title .ver{position:absolute;bottom:calc(10px + var(--safe-b));font-size:10px;color:var(--dim);letter-spacing:2px}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;font-weight:700;font-size:13px;border:1px solid var(--line2);background:rgba(255,255,255,.06);transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,#ffe08a,#ffbf3a);color:#2a1600;border:0;box-shadow:0 6px 20px rgba(255,191,58,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.pink{background:linear-gradient(180deg,#ff77b2,#ff3d86);color:#fff;border:0;box-shadow:0 6px 20px rgba(255,61,134,.35)}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:0 10px;font-size:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- 外壳 ---------- */
.shell{min-height:100dvh;display:flex;flex-direction:column}
.main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:0 var(--pad) calc(var(--tab-h) + var(--safe-b) + 70px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(16,10,22,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;color:var(--dim);position:relative}
.tabbar button b{font-size:19px;line-height:1;filter:grayscale(1) opacity(.7)}
.tabbar button.on{color:var(--gold)}
.tabbar button.on b{filter:none}
.tabbar button.on::before{content:'';position:absolute;top:0;width:26px;height:2px;border-radius:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.tabbar .dot{position:absolute;top:7px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 6px var(--pink)}

/* HUD */
.hud{position:sticky;top:0;z-index:20;margin:0 calc(var(--pad) * -1);padding:calc(6px + var(--safe-t)) var(--pad) 6px;background:linear-gradient(180deg,rgba(12,8,17,.96),rgba(12,8,17,.86));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hud-top{display:flex;align-items:center;gap:8px}
.ava{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;border:2px solid var(--tier,#8a8f9c);box-shadow:0 0 0 2px rgba(0,0,0,.4),0 0 12px var(--tier,transparent)}
.ava svg{width:100%;height:120%;margin-top:-4%}
.hud-name{min-width:0;flex:1}
.hud-name b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tier-chip{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;padding:1px 6px;border-radius:4px;color:#14090f;background:var(--tier,#8a8f9c);letter-spacing:.5px}
.hud-date{font-size:11px;color:var(--sub)}
.money{font-family:var(--cond);font-size:20px;font-weight:700;color:var(--gold);text-align:right;line-height:1}
.money small{display:block;font:10px var(--font);color:var(--dim);margin-top:2px}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.mt{display:flex;align-items:center;gap:4px;font-size:11px;min-width:0}
.mt i{font-style:normal;font-size:12px}
.mt .bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.mt .bar u{display:block;height:100%;border-radius:3px;background:var(--c);transition:width .6s var(--ease)}
.mt .num{min-width:18px;text-align:right;font-size:13px}
.mt.warn .num{color:var(--red)}

/* 章节条 */
.chapter{margin-top:8px;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r);background:linear-gradient(90deg,color-mix(in srgb,var(--cc) 26%,transparent),rgba(255,255,255,.03));border:1px solid color-mix(in srgb,var(--cc) 40%,transparent)}
.chapter .no{font-family:var(--cond);font-size:22px;font-weight:700;color:var(--cc);line-height:1}
.chapter b{font-size:12px;display:block}
.chapter small{font-size:11px;color:var(--sub)}
.chapter .prog{margin-left:auto;text-align:right;font-size:11px;color:var(--sub);white-space:nowrap}
.chapter .prog .num{font-size:15px;color:var(--text)}

/* 区块 */
.sec{margin-top:12px}
.sec-h{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
.sec-h h3{font-size:13px;font-weight:800;letter-spacing:.5px}
.sec-h h3 em{font-style:normal;font-family:var(--cond);color:var(--gold);font-size:14px;margin-left:3px}
.sec-h small{font-size:11px;color:var(--dim)}
.sec-h .r{margin-left:auto}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r2);padding:var(--pad)}

/* 企划卡 */
.proj{display:flex;gap:10px;align-items:center;position:relative;overflow:hidden}
.proj .cv{width:64px;height:64px;border-radius:8px;overflow:hidden;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.proj .cv svg{width:100%;height:100%;display:block}
.proj .info{flex:1;min-width:0}
.proj .info b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .info small{font-size:11px;color:var(--sub)}
.pbar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.pbar u{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:3px;transition:width .7s var(--ease)}
.proj.empty{border-style:dashed;justify-content:center;min-height:64px;color:var(--sub);font-weight:700;width:100%}
.ready{background:linear-gradient(120deg,rgba(255,207,90,.25),rgba(255,79,154,.18));border-color:rgba(255,207,90,.5);animation:glow 2.4s ease-in-out infinite;width:100%;text-align:left}
@keyframes glow{50%{box-shadow:0 0 22px rgba(255,207,90,.35)}}

/* 行程表 */
.presets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}
.presets::-webkit-scrollbar{display:none}
.presets button{flex:none;font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);min-height:32px}
.sched{display:grid;grid-template-columns:24px repeat(4,1fr);gap:4px}
.sched .wk{font-size:10px;color:var(--dim);text-align:center;padding:2px 0;font-weight:700;letter-spacing:.5px}
.sched .wk.now{color:var(--gold)}
.sched .rl{font-size:10px;color:var(--dim);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;letter-spacing:2px}
.cell{height:50px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;color:var(--sub);position:relative;transition:transform .15s,background .2s}
.cell b{font-size:18px;line-height:1.1}
.cell.empty{border-style:dashed;color:var(--dim)}
.cell.empty b{font-size:14px;opacity:.6}
.cell.offer{background:linear-gradient(160deg,color-mix(in srgb,var(--oc) 40%,transparent),rgba(255,255,255,.03));border-color:color-mix(in srgb,var(--oc) 60%,transparent);color:var(--text)}
.cell.cur{box-shadow:0 0 0 1px var(--gold) inset}
.cell.done{opacity:.42}
.cell.sel{transform:scale(.94);background:rgba(255,207,90,.18)}
.cell .lock{position:absolute;top:2px;right:4px;font-size:9px}

/* 邀约海报 */
.offers{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;scroll-snap-type:x mandatory}
.offers::-webkit-scrollbar{display:none}
.poster{flex:none;width:132px;min-height:150px;border-radius:12px;padding:8px;position:relative;overflow:hidden;text-align:left;scroll-snap-align:start;background:linear-gradient(165deg,color-mix(in srgb,var(--oc) 80%,#000) 0%,color-mix(in srgb,var(--oc) 30%,#120a18) 55%,#120a18 100%);border:1px solid color-mix(in srgb,var(--oc) 50%,transparent);display:flex;flex-direction:column}
.poster::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);pointer-events:none}
.poster .ic{font-size:34px;line-height:1;margin:4px 0 6px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.poster b{font-size:13px;line-height:1.25}
.poster small{font-size:10.5px;color:rgba(255,255,255,.78);display:block;margin-top:2px}
.poster .pay{margin-top:auto;font-family:var(--cond);font-size:18px;color:var(--gold);font-weight:700}
.poster .wk{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:4px}
.poster.yes{outline:2px solid var(--green);outline-offset:-2px}
.poster.yes .wk{background:var(--green);color:#062}
.poster.blocked{filter:saturate(.3);opacity:.7}
.poster .stamp{position:absolute;right:-6px;bottom:30px;transform:rotate(-14deg);font-size:11px;font-weight:900;color:var(--green);border:2px solid var(--green);padding:1px 6px;border-radius:4px;background:rgba(0,0,0,.3)}

/* 主行动按钮 */
.cta{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + var(--safe-b) + 8px);z-index:25;display:flex;justify-content:center;pointer-events:none;padding:0 var(--pad)}
.cta .btn{pointer-events:auto;width:min(540px,100%);min-height:46px;font-size:15px;letter-spacing:1px}

/* 弹层 */
.layer{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,3,10,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.sheet{width:min(560px,100%);max-height:88dvh;overflow:auto;background:linear-gradient(180deg,#261b33,#18101f);border:1px solid var(--line2);border-bottom:0;border-radius:18px 18px 0 0;padding:12px var(--pad) calc(14px + var(--safe-b));animation:up .28s var(--ease)}
.sheet .grip{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 10px}
.sheet h2{font-size:var(--t-title);font-weight:800;display:flex;align-items:center;gap:8px}
.sheet .x{margin-left:auto;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);font-size:16px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.grid-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);min-height:76px}
.act b{font-size:24px;line-height:1.1}
.act span{font-size:12px;font-weight:700}
.act small{font-size:10px;color:var(--dim)}
.act.on{border-color:var(--gold);background:rgba(255,207,90,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);min-height:32px;display:inline-flex;align-items:center;gap:4px}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(255,207,90,.12)}
.chip .num{font-size:13px}
.fold{margin-top:10px;font-size:11.5px;color:var(--sub)}
.fold summary{cursor:pointer;color:var(--dim);font-size:11px;list-style:none}
.fold summary::before{content:'ⓘ ';}
.fold p{margin-top:4px}

/* 邀约详情 */
.offer-hero{display:flex;gap:10px;align-items:center;margin-top:8px;padding:10px;border-radius:12px;background:linear-gradient(120deg,color-mix(in srgb,var(--oc) 45%,transparent),transparent)}
.offer-hero .ic{font-size:44px}
.offer-hero b{font-size:16px;display:block}
.gains{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gain{display:inline-flex;align-items:center;gap:3px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.06);font-size:12px}
.gain .num{font-size:14px}
.gain.up .num{color:var(--green)}.gain.dn .num{color:var(--red)}
.gain.risk{background:rgba(255,90,102,.14);color:#ffb3ba}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

/* 剧情（对话气泡） */
.scene{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(10px + var(--safe-t)) var(--pad) calc(12px + var(--safe-b));overflow:hidden;animation:fade .3s}
.scene .bgx{position:absolute;inset:0;z-index:-1}
.bg-room{background:radial-gradient(80% 60% at 70% 20%,rgba(255,200,140,.35),transparent 60%),linear-gradient(180deg,#2a1a2e,#0e0912)}
.bg-office{background:radial-gradient(70% 50% at 30% 10%,rgba(255,207,90,.25),transparent 60%),linear-gradient(180deg,#1e1a24,#0b0910)}
.bg-night{background:radial-gradient(60% 40% at 80% 10%,rgba(95,225,255,.25),transparent 60%),radial-gradient(70% 50% at 10% 90%,rgba(255,79,154,.3),transparent 60%),linear-gradient(180deg,#0b0c1e,#07060d)}
.bg-studio{background:radial-gradient(70% 50% at 50% 0%,rgba(169,139,255,.35),transparent 60%),linear-gradient(180deg,#1a1230,#0a0812)}
.bg-street{background:radial-gradient(60% 40% at 20% 20%,rgba(255,159,107,.35),transparent 60%),linear-gradient(180deg,#2a1420,#0c0810)}
.bg-cafe{background:radial-gradient(60% 50% at 70% 30%,rgba(255,220,170,.3),transparent 60%),linear-gradient(180deg,#2a2018,#0d0a08)}
.bg-stage{background:conic-gradient(from 180deg at 50% -10%,transparent 40%,rgba(255,240,200,.25) 47%,transparent 53%),radial-gradient(80% 50% at 50% 100%,rgba(255,207,90,.35),transparent 60%),linear-gradient(180deg,#1a0e1e,#0a0610)}
.scene .who{position:absolute;bottom:calc(var(--safe-b) + 150px);width:min(300px,72vw);aspect-ratio:100/120;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}
.scene .who.l{left:-6px}.scene .who.r{right:-6px}
.scene .who svg{width:100%;height:100%}
.scene .who.off{opacity:0;transform:translateY(12px)}
.scene .who.dim{opacity:.35;filter:grayscale(.6)}
.vn{position:relative;z-index:2;width:min(560px,100%);margin:0 auto}
.bubble{position:relative;background:rgba(18,12,24,.92);border:1px solid var(--line2);border-radius:16px;padding:12px 14px 14px;min-height:84px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .25s var(--ease)}
.bubble .nm{position:absolute;top:-12px;left:12px;font-size:11.5px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--nc,#555);color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.bubble.me{border-color:rgba(255,207,90,.5)}.bubble.me .nm{left:auto;right:12px;background:linear-gradient(90deg,#ffcf5a,#ff9f3a);color:#2a1600}
.bubble.sys{background:rgba(0,0,0,.55);text-align:center;font-style:italic;color:var(--sub);border-style:dashed}
.bubble p{font-size:14.5px;line-height:1.6}
.bubble .next{position:absolute;right:12px;bottom:6px;font-size:10px;color:var(--dim);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.choices{display:grid;gap:6px;margin-top:8px}
.choice{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid var(--line2);text-align:left;min-height:48px;animation:pop .3s var(--ease) both}
.choice:nth-child(2){animation-delay:.06s}.choice:nth-child(3){animation-delay:.12s}
.choice b{font-size:22px}
.choice span{flex:1;font-weight:700;font-size:14px}
.choice .hint{display:flex;gap:2px;font-size:12px;opacity:.9}
.choice[disabled]{opacity:.4}
.choice:active{transform:scale(.98)}
.skip{position:absolute;top:calc(10px + var(--safe-t));right:var(--pad);font-size:11px;color:var(--dim);padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.35);z-index:3}

/* 选经纪人 */
.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}

/* 杀穿娱乐圈 v2 · 模拟引擎（纯函数式，不碰 DOM，可在 node 里跑长局审计）。
 * 所有随机都走存档里的种子，读档后结果可复现。 */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rnd(s){let t=(s.rng=(s.rng+0x6D2B79F5)|0);t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
const ri=(s,a,b)=>Math.round(a+(b-a)*rnd(s));
const rr=(s,[a,b])=>Math.round(a+(b-a)*rnd(s));
const pickR=(s,arr)=>arr[Math.floor(rnd(s)*arr.length)];
// 由种子派生的独立随机，不消耗主序列（用于对手阵容和封面等需要“预知”的内容）
function hashN(...xs){let h=2166136261;for(const x of String(xs.join('|'))){h^=x.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function sub(seed){let st=seed|0;return()=>{let t=(st=(st+0x6D2B79F5)|0);t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}

/* ---------- 通用效果 ---------- */
function addFans(s,k,n){s.fans[k]=Math.max(0,Math.round(s.fans[k]+n));}
function remember(s,id,text,d){const n=s.npc[id];if(!n)return;n.mem.unshift({m:s.m,t:text,d});n.mem=n.mem.slice(0,8);}
function addAff(s,id,d){const n=s.npc[id];if(n)n.aff=clamp(Math.round(n.aff+d),-100,100);}
function earn(s,gross){ // 经纪抽成即时扣除；合约分成在月末结算
 if(gross<=0){s.money+=gross;return gross;}
 const fee=s.agent?NPCS[s.agent].fee:0;const net=Math.round(gross*(1-fee));s.money+=net;s.income+=net;return net;}
// 返回可显示的 delta 列表
function applyFx(s,fx={}){
 const d={};const add=(k,v)=>{if(v)d[k]=(d[k]||0)+v;};
 for(const k of ['energy','mood','heat','rep','memory','doubt','original']){if(fx[k]!=null){const before=s[k];let v=fx[k];if(k==='rep'&&v>0)v=Math.max(1,Math.round(v*(1-s.rep/130)));s[k]=clamp(s[k]+v,0,k==='memory'?10:100);add(k,s[k]-before);}}
 if(fx.money){if(fx.money>0)add('money',earn(s,fx.money));else{s.money+=fx.money;add('money',fx.money);}}
 if(fx.moneySet!=null){add('money',fx.moneySet-s.money);s.money=fx.moneySet;}
 for(const k of ['passer','work','solo','anti']){if(fx[k]){const b=s.fans[k];addFans(s,k,fx[k]);add(k,s.fans[k]-b);}}
 if(fx.soloMood)s.fanMood.solo=clamp(s.fanMood.solo+fx.soloMood,0,100);
 if(fx.workMood)s.fanMood.work=clamp(s.fanMood.work+fx.workMood,0,100);
 if(fx.aff)for(const[id,v]of Object.entries(fx.aff)){addAff(s,id,v);d['aff:'+id]=(d['aff:'+id]||0)+v;}
 if(fx.card){s.hand[fx.card]=(s.hand[fx.card]||0)+1;d['card:'+fx.card]=1;}
 if(fx.flag)s.flags[fx.flag]=s.m;if(fx.flag2)s.flags[fx.flag2]=s.m;if(fx.flag==='loan')s.loan=(s.loan||0)+30000;
 if(fx.skillUp){const[k,v]=fx.skillUp;const b=s.skills[k];s.skills[k]=clamp(b+v,0,100);d['skill:'+k]=s.skills[k]-b;}
 if(fx.debtPaid){s.debtPaid=true;s.flags.ch1done=s.flags.ch1done||s.m;}
 if(fx.debtLeft){s.flags.debtLeft=s.m;}
 if(fx.contract)setContract(s,fx.contract);
 if(fx.agentLeave){s.flags.agentLeft=s.agent;s.agent=null;}
 if(fx.cancelWeek)s.flags.cancelWeek=1;
 return d;}
function setContract(s,c){s.contract=c;s.contractUntil=s.m+(c==='hengyao'?12:24);if(c.startsWith('xingdu'))s.flags.betStart=s.m;}
const contractCut=s=>!s.contract||s.m>s.contractUntil?0:{xingdu:.3,xingdu20:.2,xingdu40:.4,hengyao:.5}[s.contract]||0;

/* ---------- 咖位 ---------- */
function starPower(s){const f=s.fans.passer+2*s.fans.work+1.5*s.fans.solo-.5*s.fans.anti;return Math.round(.3*s.heat+.33*s.rep+8.5*Math.log10(Math.max(1,f/500)));}
function updateTier(s){
 const sp=starPower(s);let changed=0;
 const next=TIERS[s.tier+1];
 if(next&&sp>=next.sp&&tierGate(s,next.id)){s.tier++;s.tierLow=0;changed=1;}
 else if(s.tier>0&&sp<TIERS[s.tier].sp-6){s.tierLow++;if(s.tierLow>=2){s.tier--;s.tierLow=0;changed=-1;}}
 else s.tierLow=0;
 s.stats.maxTier=Math.max(s.stats.maxTier,s.tier);return changed;}
// 咖位门槛：一线需要一首前十，顶流需要一首冠军，殿堂需要大奖
function tierGate(s,id){if(id===3)return s.stats.top10>0;if(id===4)return s.stats.top1>0;if(id===5)return!!s.flags.award;return true;}
function chapterOf(s){if(!s.flags.ch1done)return 1;return s.m<19?2:s.m<37?3:s.m<61?4:5;}

/* ---------- 邀约 ---------- */
function genOffers(s){
 if(s.flags.crashUntil>=s.m)return[];
 const n=2+(s.agent==='zhou'?1:0)+(s.tier>=2?1:0)+(s.heat>55?1:0);
 const pool=OFFERS.filter(o=>o.tier<=s.tier||(o.tier===s.tier+1&&s.heat>45));
 const out=[];const used=new Set();const weekLoad=[0,0,0,0];
 for(let i=0;i<n*3&&out.length<n;i++){
  const o=pickR(s,pool);if(used.has(o.id))continue;
  if(o.tier<s.tier-1&&rnd(s)<.7)continue; // 咖位高了，小活儿少来
  if(o.special==='audition'&&(s.flags.auditioned||s.m<3))continue;
  const week=ri(s,0,3);if(weekLoad[week]+o.slots>SLOTS)continue;
  weekLoad[week]+=o.slots;used.add(o.id);
  const tierMul=1+Math.max(0,s.tier-o.tier)*.3;
  out.push({uid:uid(s),id:o.id,week,pay:Math.round(rr(s,o.pay)*tierMul/100)*100,state:'new'});}
 if(s.m===4&&!s.flags.auditioned&&!out.some(o=>o.id==='audition'))out.push({uid:uid(s),id:'audition',week:2,pay:0,state:'new'});
 return out;}
const offerDef=o=>OFFERS.find(x=>x.id===o.id);
function offerBlock(s,o){
 const d=offerDef(o);
 if(o.week<s.w)return'已过期';
 if(d.conflict&&s.excl[d.conflict]&&s.excl[d.conflict].until>=s.m&&s.excl[d.conflict].id!==d.id)return'与'+OFFERS.find(x=>x.id===s.excl[d.conflict].id).from+'独家冲突';
 const cells=s.plan[o.week];const busy=cells.filter(c=>c&&c.offer).length;
 if(busy+d.slots>SLOTS)return'那周档期已满';
 return'';}
function acceptOffer(s,u){
 const o=s.offers.find(x=>x.uid===u);if(!o||o.state!=='new'||offerBlock(s,o))return false;
 const d=offerDef(o);let left=d.slots;const row=s.plan[o.week];
 for(let i=0;i<SLOTS&&left;i++){if(!row[i]||!row[i].offer){row[i]={offer:o.uid};left--;}}
 o.state='yes';if(d.conflict)s.excl[d.conflict]={id:d.id,until:s.m+6};
 return true;}
function declineOffer(s,u){
 const o=s.offers.find(x=>x.uid===u);if(!o)return;
 if(o.state==='yes'){s.plan[o.week]=s.plan[o.week].map(c=>c&&c.offer===u?null:c);const d=offerDef(o);if(d.conflict&&s.excl[d.conflict]?.id===d.id)delete s.excl[d.conflict];}
 o.state='no';const d=offerDef(o);if(d.npc)addAff(s,d.npc,-4);}

/* ---------- 行程 ---------- */
function setCell(s,w,i,a,k){if(w<s.w)return;const c=s.plan[w][i];if(c&&c.offer)return;s.plan[w][i]=a?{a,k}:null;}
function applyPreset(s,id){const p=PRESETS.find(x=>x.id===id);if(!p)return;
 for(let w=s.w;w<WEEKS;w++)p.plan.forEach((a,i)=>{const c=s.plan[w][i];if(!c||!c.offer)s.plan[w][i]={a,k:a==='train'?weakSkill(s):a==='social'?(s.agent||'tang'):null};});}
function weakSkill(s){const mix=SKILL_MIX[s.project?.type||'music'];return Object.keys(mix).sort((a,b)=>s.skills[a]-s.skills[b])[0];}
const mixScore=(s,type)=>{const mix=SKILL_MIX[type]||SKILL_MIX.music;return Object.entries(mix).reduce((t,[k,w])=>t+s.skills[k]*w,0);};

function resolveCell(s,cell,slot,weekend){
 const out={slot,icon:'·',label:'空闲',d:{}};
 if(s.flags.cancelWeek){out.icon='🏥';out.label='停工养病';out.d=applyFx(s,{energy:6});return out;}
 if(!cell){out.icon='☁️';out.label='发呆';out.d=applyFx(s,{energy:8,mood:1});return out;}
 const tired=s.energy<12&&cell.a!=='rest';const perf=tired?.5:1;
 if(cell.offer){
  const o=s.offers.find(x=>x.uid===cell.offer);const d=offerDef(o);out.icon=d.icon;out.label=d.name;out.offer=o.id;
  if(o.done){out.label+='（续）';out.d=applyFx(s,{energy:-8});return out;}
  o.done=1;const q=d.skill?s.skills[d.skill]/100:.5;const fx={energy:-14*d.slots/2,money:o.pay};
  for(const[k,r]of Object.entries(d.gain||{}))fx[k]=Math.round(rr(s,r)*(.6+q*.8)*perf);
  if(d.risk&&rnd(s)<d.risk.p*(1.2-q*.8)){fx.anti=(fx.anti||0)+rr(s,d.risk.anti);fx.rep=(fx.rep||0)+rr(s,d.risk.rep);out.bad=d.risk.text;}
  if(d.special==='audition'){s.flags.auditioned=s.m;if(s.skills.acting>=30){fx.aff={shen:12};s.flags.shenRole=s.m;out.good='沈砚记住了你';remember(s,'shen','试镜那场哭戏，你没用眼药水',12);}else{fx.aff={shen:3};out.bad='眼神不对，落选';remember(s,'shen','试镜时你的眼神是空的',-2);s.flags.shenRetry=s.m;}}
  if(d.special==='cp')fx.soloMood=-10;
  if(d.npc&&d.special!=='audition')fx.aff={[d.npc]:4};
  out.d=applyFx(s,fx);return out;}
 const A=ACTIONS[cell.a];out.icon=A.icon;out.label=A.name;
 const fx={energy:A.energy,mood:A.mood||0};if(A.money)fx.money=A.money;
 if(tired){fx.mood-=4;out.bad='透支了';}
 switch(cell.a){
  case'create':{
   if(!s.project){out.label='找灵感';fx.memory=1;fx.energy=-4;break;}
   const p=s.project,sk=mixScore(s,p.type);
   const add=Math.round((7+sk/9+ri(s,0,3))*perf);p.prog=Math.min(p.need,p.prog+add);
   p.qsum+=sk+ri(s,-5,7)-(tired?10:0)+(s.mood>70?3:s.mood<25?-6:0);p.qn++;
   out.label='创作《'+p.title+'》';out.prog=[p.prog,p.need];
   if(p.prog>=p.need){finishProject(s);out.good='企划完成！';}
   break;}
  case'train':{const k=cell.k||weakSkill(s);const b=s.skills[k];
   const mentor=(k==='acting'&&s.npc.shen.aff>=40)||(k==='vocal'&&s.flags.xu_friend)?1.4:1;
   const g=Math.max(1,Math.round((4+rnd(s)*2.5)*(1-b/125)*perf*mentor));s.skills[k]=clamp(b+g,0,100);
   out.label='练'+SKILLS[k][0];out.icon=SKILLS[k][1];out.d['skill:'+k]=g;break;}
  case'live':{fx.solo=Math.round((80+s.fans.solo*.025+s.heat*6)*perf);fx.soloMood=5;fx.heat=2;fx.money=Math.round(300+s.fans.solo*.04);
   if(s.doubt>45)fx.anti=Math.round(s.doubt*8);break;}
  case'gig':{fx.money=Math.round((2600+s.tier*6500)*(1+rnd(s)*.4)*perf);fx.passer=Math.round((150+s.tier*450)*perf);
   if(weekend)fx.money=Math.round(fx.money*1.2);break;}
  case'social':{const k=cell.k||s.agent||'tang';const n=NPCS[k];
   let g=ri(s,4,8);if(n.traits.includes('记仇')&&s.npc[k].aff<0)g=Math.ceil(g/2);if(n.traits.includes('温和')||n.traits.includes('热血'))g+=2;
   fx.aff={[k]:g};fx.mood+=4;out.label='约'+n.name;out.icon='🥂';out.npc=k;break;}
  case'rest':{if(weekend){fx.energy+=6;fx.mood+=3;}if(s.agent==='lin')fx.mood=Math.round(fx.mood*1.5);break;}}
 Object.assign(out.d,applyFx(s,fx));return out;}

function advanceWeek(s){
 if(s.ended||s.w>=WEEKS||s.queue.length||s.battle)return null;
 const res={week:s.w,cells:[]};
 const e0=s.energy;
 s.plan[s.w].forEach((c,i)=>res.cells.push(resolveCell(s,c,i,i===SLOTS-1)));
 s.flags.cancelWeek=0;
 // 体力连续见底会病倒
 if(s.energy<=3&&e0<25&&!s.seen.sick_recent){s.queue.push('sick');s.seen.sick_recent=s.m;}
 // 未接的、已过期的邀约作废
 s.offers.forEach(o=>{if(o.state==='new'&&o.week<=s.w)o.state='gone';});
 s.w++;
 fireTimed(s);
 return res;}
function fireTimed(s){
 for(const[id,sc]of Object.entries(SCENES)){if(sc.when&&sc.when.m===s.m&&sc.when.w===s.w+1&&!s.seen[id])s.queue.push(id);}
 if(s.w===1&&s.pool&&!s.seen[s.pool+'@'+s.m]){s.queue.push(s.pool);s.seen[s.pool+'@'+s.m]=1;s.lastPool=s.m;s.poolSeen=s.poolSeen||{};s.poolSeen[s.pool]=s.m;s.pool=null;}}

/* ---------- 企划 ---------- */
function projectCost(s,workId){if(!workId)return{memory:0,money:2000};const w=getWork2(workId);return{memory:1+Math.floor(w.diff/30),money:w.cost};}
function canStart(s,workId){
 if(s.project)return'已有企划进行中';
 const c=projectCost(s,workId);if(s.memory<c.memory)return'地球记忆不足';if(s.money<c.money)return'资金不足';
 if(workId){const w=getWork2(workId);if(w.type!=='music'&&s.tier<2)return'腰部艺人解锁';if(s.releases.some(r=>r.workId===workId)||s.ready.some(r=>r.workId===workId))return'已经做过';}
 return'';}
function startProject(s,workId,tag){
 if(canStart(s,workId))return false;const c=projectCost(s,workId);s.memory-=c.memory;s.money-=c.money;
 if(workId){const w=getWork2(workId);s.project={uid:uid(s),workId,type:w.type,tag:w.tag,title:w.title.split(' / ').pop(),base:w.base,diff:w.diff,need:Math.round(70+w.diff*.9),prog:0,qsum:0,qn:0,copy:true};}
 else{const t=tag||'青春';s.project={uid:uid(s),workId:null,type:'music',tag:t,title:originalTitle(s,t),base:0,diff:30,need:80,prog:0,qsum:0,qn:0,copy:false};}
 return true;}
const ORIGINAL_WORDS={青春:['夏日未满','操场的风','十八岁'],爱情:['偏偏是你','心跳延迟','慢慢喜欢'],热血:['不服','逆光而行','燃尽'],治愈:['晚安海岚','小确幸','一盏灯'],城市:['海岚夜车','末班地铁','天台'],人生:['平行线','第二人生','回声']};
function originalTitle(s,tag){const a=ORIGINAL_WORDS[tag]||ORIGINAL_WORDS.青春;return a[(s.releases.length+s.m)%a.length];}
function finishProject(s){
 const p=s.project;const sk=mixScore(s,p.type);const avg=p.qn?p.qsum/p.qn:sk;let q;
 if(p.copy){q=.4*p.base+.6*avg;if(avg<p.diff)q-=(p.diff-avg)*.5;}
 else q=avg*.85+8+Math.min(10,s.original*.25);
 q=clamp(Math.round(q),30,99);
 const r={uid:p.uid,workId:p.workId,title:p.title,type:p.type,tag:p.tag,q,grade:grade(q),copy:p.copy,made:s.m,sk:Math.round(sk)};
 if(p.copy)s.doubt=clamp(s.doubt+3+Math.max(0,q-sk)/3,0,100);
 else{s.doubt=clamp(s.doubt-6,0,100);s.original=clamp(s.original+4,0,100);if(s.hand.evidence<3)s.hand.evidence++;}
 s.ready.push(r);s.project=null;return r;}
const grade=q=>q>=90?'S':q>=80?'A':q>=70?'B':q>=60?'C':'D';

/* ---------- 发行与榜单 ---------- */
const PROMOS=[{id:0,name:'不推',cost:0,mul:1},{id:1,name:'小推',cost:10000,mul:1.12},{id:2,name:'大推',cost:50000,mul:1.26},{id:3,name:'全网轰炸',cost:200000,mul:1.42}];
const PLATFORMS={all:{name:'全平台',mul:1,bonus:0},excl:{name:'独家首发',mul:.86,bonus:1}};
function rivalsFor(s,m){
 const R=sub(hashN(s.seed,'riv',m));const n=12;const out=[];
 for(let i=0;i<n;i++){const p=Math.round(48+Math.min(12,m*.2)+R()*34+(R()<.15?14:0)+(s.tier||0)*4);
  out.push({title:RIVAL_SONGS[Math.floor(R()*RIVAL_SONGS.length)],artist:RIVAL_ARTISTS[Math.floor(R()*RIVAL_ARTISTS.length)],power:p,rival:1});}
 const xu=XU_RELEASES.filter(x=>x.m<=m&&m-x.m<4).map(x=>({title:x.title,artist:'许望川',power:Math.round(x.power*Math.pow(.85,m-x.m)*(s.npc.xu.aff>=40?.95:1)),xu:1,fresh:m===x.m}));
 return out.concat(xu);}
function songPower(s,r,age,noise=1){
 const fanF=Math.min(.4,Math.log10(1+(s.fans.work+s.fans.solo)/800)*.12);
 return r.q*(.72+s.heat/450+fanF*.6)*(PLATFORMS[r.platform||'all'].mul)*(PROMOS[r.promo||0].mul)*Math.pow(.74,age)*noise;}
function predictRank(s,r,m){
 const riv=rivalsFor(s,m).map(x=>x.power);const lo=songPower(s,r,0,.9),hi=songPower(s,r,0,1.1);
 const rank=p=>riv.filter(x=>x>p).length+1;return[rank(hi),rank(lo)];}
function scheduleRelease(s,u,opt){
 const i=s.ready.findIndex(r=>r.uid===u);if(i<0||s.pendingRelease)return false;
 const promo=PROMOS[opt.promo||0];if(s.money<promo.cost)return false;
 const r=s.ready.splice(i,1)[0];r.platform=opt.platform||'all';r.promo=promo.id;r.month=s.m+(opt.next?1:0);
 s.money-=promo.cost;if(r.platform==='excl')earn(s,8000+s.tier*20000);
 s.pendingRelease=r;return true;}
function buildChart(s){
 const prev=Object.fromEntries((s.chart||[]).map((e,i)=>[e.key,i+1]));
 const mine=s.releases.filter(r=>s.m-r.month<6).map(r=>{const age=s.m-r.month;return{key:r.uid,title:r.title,artist:s.name,power:songPower(s,r,age,r.noise??1),mine:1,uid:r.uid,fresh:age===0};});
 const riv=rivalsFor(s,s.m).map(x=>({...x,key:x.artist+x.title}));
 const all=mine.concat(riv).sort((a,b)=>b.power-a.power).slice(0,10);
 all.forEach((e,i)=>{e.prev=prev[e.key]||0;e.rank=i+1;});
 return all;}

/* ---------- 月末 ---------- */
function endMonth(s){
 if(s.ended||s.w<WEEKS||s.queue.length||s.battle)return null;
 const rep={m:s.m,label:dateLabel(s),before:snap(s),lines:[],songs:[],tierChange:0};
 // 发行
 if(s.pendingRelease&&s.pendingRelease.month<=s.m){const r=s.pendingRelease;r.month=s.m;r.noise=.92+rnd(s)*.16;r.best=99;s.releases.push(r);s.pendingRelease=null;s.stats.released++;s.lastRelease=s.m;
  s.fanMood.work=clamp(s.fanMood.work+(r.q-60)/2,0,100);}
 // 榜单
 const chart=buildChart(s);rep.chart=chart;
 let beatXu=false;const xuRow=chart.find(e=>e.xu&&e.fresh);
 chart.filter(e=>e.mine).forEach(e=>{const r=s.releases.find(x=>x.uid===e.uid);r.best=Math.min(r.best||99,e.rank);
  const k=11-e.rank,tf=1+s.tier*.9;const fx={money:Math.round(k*1700*tf+r.q*60),work:Math.round(k*140*(1+s.heat/45)*tf),passer:Math.round(k*320*tf),heat:e.rank===1?12:e.rank<=3?7:e.rank<=10?3:0};
  if(e.rank===1){s.stats.top1++;if(e.fresh)rep.gold=r.title;}if(e.fresh&&e.rank<=10)s.stats.top10++;
  rep.songs.push({title:r.title,rank:e.rank,prev:e.prev,d:applyFx(s,fx),uid:r.uid});
  if(xuRow&&e.rank<xuRow.rank)beatXu=true;});
 s.releases.filter(r=>s.m-r.month<12&&!chart.some(e=>e.uid===r.uid)).forEach(r=>{earn(s,Math.round(r.q*25*(1+s.tier*.5)));});
 if(beatXu){addAff(s,'xu',-6);remember(s,'xu','你的歌压了我的新歌',-6);rep.lines.push(['xu','……这次算你运气好。']);s.flags.beatXu=s.m;}
 else if(xuRow&&s.releases.some(r=>r.month===s.m))rep.lines.push(['xu','榜单看了吗？差距在这。']);
 s.chart=chart;
 // 合约分成
 const cut=contractCut(s);if(cut&&s.income>0){const c=Math.round(s.income*cut);s.money-=c;rep.cut=c;}
 // 固定支出
 if(s.loan){const pay=Math.min(Math.max(0,s.money-10000),Math.ceil(s.loan*.12));s.money-=pay;s.loan=Math.ceil((s.loan-pay)*1.01);rep.loan=pay;}
 if(s.flags.studio){const spend=6000; s.money-=spend;rep.studioCost=spend;s.studio=s.studio||{progress:0,graduates:0}; if(s.money>=0&&s.studio.graduates<3){s.studio.progress+=2+Math.floor(s.skills.biz/15)+(s.flags.mentor?2:0);if(s.studio.progress>=100){s.studio.progress-=100;s.studio.graduates++;rep.lines.push(['agent','第'+s.studio.graduates+'位新人正式出道了。']);}}}
 const cost=3000+s.tier*s.tier*7000;s.money-=cost;rep.cost=cost;
 if(s.flags.debtLeft&&!s.debtPaid){const intr=Math.round(s.debt*.02);s.debt+=intr;if(s.money>=s.debt+20000){s.money-=s.debt;s.debtPaid=true;s.queue.push('debt_ok');}}
 // 自然变化
 s.heat=Math.round(s.heat*.8);if(s.contract==='hengyao'&&s.m<=s.contractUntil)s.heat=Math.min(s.heat,35);
 s.mood=clamp(Math.round(s.mood+(55-s.mood)*.15),0,100);
 s.memory=clamp(s.memory+2,0,10);s.doubt=clamp(s.doubt-2,0,100);s.rep=clamp(Math.round(s.rep+(s.rep>60?-.5:0)),0,100);
 const sinceRel=s.m-(s.lastRelease||0);
 s.fanMood.work=clamp(s.fanMood.work+(sinceRel>3?-7:-1),0,100);s.fanMood.solo=clamp(s.fanMood.solo-4,0,100);
 if(s.fanMood.solo<30){const lost=Math.round(s.fans.solo*.08);addFans(s,'solo',-lost);addFans(s,'anti',lost*.3);rep.lines.push(['tang','好多姐妹……脱粉了。']);}
 if(s.fanMood.work<30){addFans(s,'work',-Math.round(s.fans.work*.06));}
 addFans(s,'anti',-s.fans.anti*.05);addFans(s,'passer',-s.fans.passer*.03);
 if(s.money<0){s.mood=clamp(s.mood-10,0,100);rep.lines.push(['agent','账上是负数了。下个月得接活。']);s.flags.broke=(s.flags.broke||0)+1;}else s.flags.broke=0;
 rep.tierChange=updateTier(s);
 if(rep.tierChange<0)rep.lines.push(['agent','咖位掉了。圈里人最会看风向。']);
 // 对赌检查
 if(s.contract&&s.contract.startsWith('xingdu')&&s.m<=s.contractUntil&&(s.m-s.flags.betStart)%3===0&&s.m>s.flags.betStart&&s.heat<40&&!s.seen['bet_check@'+s.m]){s.queue.push('bet_check');s.seen['bet_check@'+s.m]=1;}
 // 章节
 if(s.m===6&&!s.debtPaid&&!s.flags.debtLeft)s.queue.push('debt_day');
 else if(s.m===6&&s.debtPaid&&!s.seen.debt_ok)s.queue.push('debt_ok');
 if(s.flags.debtLeft&&!s.debtPaid&&s.m>=12&&!s.seen['debt_fail2']){s.queue.push('debt_fail');s.flags.debtLeft=0;s.flags.debtFailed=1;s.seen.debt_fail2=s.m;}
 if((s.flags.broke||0)>=3&&!s.queue.includes('broke')){s.queue.push('broke');s.flags.broke=0;}
 rep.after=snap(s);rep.d=diffSnap(s.mStart||rep.before,rep.after);
 s.history.push({m:s.m,money:s.money,fans:fansTotal(s),sp:starPower(s),tier:s.tier,heat:s.heat,rep:s.rep});
 s.lastReport=rep;
 // 新月份
 s.m++;s.w=0;s.mStart=snap(s);s.plan=emptyPlan();s.income=0;s.energy=clamp(s.energy+10,0,100);
 s.offers=genOffers(s);s.pool=pickPool(s);
 if(s.flags.frozen3&&s.m-s.flags.frozen3<=3)s.offers=s.offers.slice(0,1);
 fireTimed(s);
 for(const [id,m] of STORY_MILESTONES)if(s.m>=m&&!s.seen[id]&&!s.queue.includes(id)){s.queue.push(id);break;}
 return rep;}

function resolveScene(s,id,idx){

 if(sc.agentPick){const a=AGENTS[idx];if(!a)return null;s.agent=a;addAff(s,a,25);remember(s,a,'你在三个人里选了我',20);AGENTS.filter(x=>x!==a).forEach(x=>remember(s,x,'你没选我',-3));}

 else if(sc.choices){const c=sc.choices[idx];if(!c||!choiceOk(s,c))return null;out.d=applyFx(s,c.fx);if(c.mem)remember(s,...c.mem);if(c.battle)out.battle=c.battle;out.choice=c;if(c.end)s.ended={id:c.end,m:s.m,tier:s.tier};}

function bestAlly(s){return['xu','he','shen','tang','lin','zhou','lu','zhuang'].filter(k=>k!==s.agent||k==='tang').map(k=>[k,s.npc[k].aff]).filter(([k,a])=>a>=40).sort((a,b)=>b[1]-a[1])[0]?.[0]||null;}
function battleHand(s){
 const h=['statement','silence','fans','live'];
 if(s.money>=20000)h.push('lawyer');
 if(s.money>=(s.agent==='zhou'?25000:50000))h.push('buy');
 if(s.hand.evidence>0)h.push('evidence');
 if(bestAlly(s))h.push('ally');
 if(s.hand.dirt>0)h.push('counter');

function startBattle(s,id){const b=BATTLES[id];
 const S=clamp(Math.round(b.s0+(s.rep-30)/3-s.fans.anti/Math.max(1,fansTotal(s))*12),-80,40);
 s.battle={id,round:0,S,H:30,used:[],log:[],hand:battleHand(s),ally:bestAlly(s)};s.stats.battles++;return s.battle;}
const REUSABLE=['statement','silence'];
function playCard(s,cardId){
 const B=s.battle;if(!B||B.round>=BATTLE_ROUNDS.length)return null;
 if(!B.hand.includes(cardId)||(B.used.includes(cardId)&&!REUSABLE.includes(cardId)))return null;
 const C=CARDS[cardId],def=BATTLES[B.id],mv=OPP_MOVES[def.deck[B.round]];
 if(C.cost&&s.money<(cardId==='buy'&&s.agent==='zhou'?C.cost/2:C.cost))return null;
 let ds=rr(s,C.s),dh=rr(s,C.h);const ev={card:cardId,move:def.deck[B.round],notes:[]};
 if(cardId==='fans')ds+=Math.round(Math.min(10,Math.log10(1+s.fans.solo)*2))-6;
 if(cardId==='live')ds=Math.round(ds*(.4+s.rep/60));
 const counter=C.beats?.includes(def.deck[B.round]);const weak=C.weak?.includes(def.deck[B.round]);
 if(counter){ds=Math.round(ds*1.5);ev.notes.push('克制');}
 if(weak){ds-=10;ev.notes.push('被克制');}
 let os=rr(s,mv.s),oh=rr(s,mv.h);if(counter){os=Math.round(os/2);oh=Math.round(oh/2);}
 if(C.cost){const c=cardId==='buy'&&s.agent==='zhou'?C.cost/2:C.cost;s.money-=c;ev.cost=c;}
 if(cardId==='evidence')s.hand.evidence--;
 if(cardId==='counter'){s.hand.dirt--;s.rep=clamp(s.rep-3,0,100);}
 if(cardId==='ally'){addAff(s,B.ally,-6);remember(s,B.ally,'热搜战里我替你转发了',2);ev.ally=B.ally;}
 if(cardId==='live')s.mood=clamp(s.mood+C.mood,0,100);
 if(C.risk==='expose'&&rnd(s)<.18+s.doubt/250){ds=-16;ev.notes.push('被扒出买热搜');addFans(s,'anti',1500);}
 if(C.risk==='anti'&&B.H>55){addFans(s,'anti',600);ev.notes.push('控评引起反感');}
 B.S=clamp(B.S+ds+os,-100,100);B.H=clamp(B.H+dh+oh,0,100);
 ev.ds=ds;ev.os=os;ev.S=B.S;ev.H=B.H;B.used.push(cardId);B.log.push(ev);B.round++;
 if(B.round>=BATTLE_ROUNDS.length)ev.result=finishBattle(s);

function finishBattle(s){
 const B=s.battle,def=BATTLES[B.id];const r=B.S>=15?'win':B.S<=-45?'crash':B.S<=-10?'lose':'draw';

 const scale=.6+B.H/100;fx=Object.fromEntries(Object.entries(fx).map(([k,v])=>[k,typeof v==='number'&&['heat','passer','anti','solo'].includes(k)?Math.round(v*scale):v]));
 if(r==='crash'&&s.agent==='lin')fx=Object.fromEntries(Object.entries(fx).map(([k,v])=>[k,typeof v==='number'?Math.round(v/2):v]));
 const d=applyFx(s,fx);
 if(r==='win')s.stats.wins++;
 if(r==='crash'){s.stats.crash++;s.flags.crashUntil=s.m+1;s.offers.forEach(o=>{if(o.state==='yes'&&o.week>=s.w){declineOffer(s,o.uid);o.state='cancel';}});}
 if(def.opp==='cheng'&&r==='win'){s.hand.dirt++;}
 B.result={r,d};return B.result;}

 if(!['fans','skills','npc','flags','seen','stats','hand','fanMood'].every(k=>v[k]&&typeof v[k]==='object'))return false;
 if(!['queue','offers','ready','releases','history','log'].every(k=>Array.isArray(v[k])))return false;
 if(!Array.isArray(v.plan)||v.plan.length!==WEEKS||v.plan.some(row=>!Array.isArray(row)||row.length!==SLOTS))return false;
 if(!Object.keys(NPCS).every(k=>v.npc[k]&&Number.isFinite(v.npc[k].aff)&&Array.isArray(v.npc[k].mem)))return false;
 if(!Object.keys(SKILLS).every(k=>Number.isFinite(v.skills[k]))||!['passer','work','solo','anti'].every(k=>Number.isFinite(v.fans[k])))return false;
 if(!['energy','mood','heat','rep','memory','doubt','original','tier'].every(k=>Number.isFinite(v[k]))||!TIERS[v.tier])return false;

function cover(o){
 const pal=TAG_PALETTE[o.tag]||TAG_PALETTE.青春;const R=sub(hashN(o.title,o.seed||0));const id='c'+(++svgN);
 const kind=Math.floor(R()*5),[a,b,c]=pal;const t=esc2(o.title);const big=t.length<=4;
 let art='';
 if(kind===0)art=`<circle cx="${30+R()*40}" cy="${30+R()*20}" r="${18+R()*14}" fill="${b}"/>${Array.from({length:6},(_,i)=>`<rect x="0" y="${62+i*6}" width="100" height="${2+i*.4}" fill="${a}" opacity="${.9-i*.12}"/>`).join('')}`;
 else if(kind===1)art=Array.from({length:7},(_,i)=>`<circle cx="50" cy="${44}" r="${46-i*6}" fill="none" stroke="${i%2?a:b}" stroke-width="${1.5+R()*2}" opacity=".85"/>`).join('');
 else if(kind===2)art=`<path d="M0 100 L0 ${60+R()*10} L22 ${48+R()*10} L40 ${62} L60 ${40+R()*12} L80 ${56} L100 ${44+R()*10} L100 100Z" fill="${a}" opacity=".9"/><path d="M0 100 L0 78 L30 70 L55 80 L100 66 L100 100Z" fill="${shade(c,.15)}"/>${Array.from({length:14},()=>`<circle cx="${R()*100}" cy="${R()*40}" r="${R()*1.2+.3}" fill="#fff"/>`).join('')}`;
 else if(kind===3)art=Array.from({length:9},(_,i)=>`<rect x="${-30+i*16}" y="-10" width="7" height="140" fill="${i%2?a:b}" transform="rotate(28 50 50)" opacity=".85"/>`).join('');
 else art=`<rect x="14" y="14" width="72" height="72" fill="none" stroke="${b}" stroke-width="1.2"/><circle cx="50" cy="50" r="26" fill="${a}"/><circle cx="50" cy="50" r="6" fill="${c}"/><path d="M14 86 L86 14" stroke="${b}" stroke-width=".8"/>`;
 return`<svg class="cover-svg" viewBox="0 0 100 100" role="img" aria-label="《${t}》封面"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(c,.12)}"/><stop offset="1" stop-color="${shade(c,-.4)}"/></linearGradient></defs>
 <rect width="100" height="100" fill="url(#${id})"/>${art}
 <rect width="100" height="100" fill="url(#grain)" opacity=".25"/>
 <text x="8" y="${big?90:92}" font-size="${big?14:Math.max(8,13-t.length*.5)}" font-weight="800" fill="#fff" style="paint-order:stroke" stroke="${c}" stroke-width="2.5">${t}</text>
 ${o.artist?`<text x="8" y="11" font-size="5.5" fill="#fff" opacity=".85" letter-spacing=".6">${esc2(o.artist)}</text>`:''}
 ${o.grade?`<g><rect x="78" y="4" width="18" height="11" rx="2" fill="${o.grade==='S'?'#ffcf5a':o.grade==='A'?'#ff4f9a':'#ffffff'}"/><text x="87" y="12.5" text-anchor="middle" font-size="8" font-weight="900" fill="#14090f">${o.grade}</text></g>`:''}
 </svg>`;}

/* ---------- 小组件 ---------- */
const B=(label,a,cls='',dis=false,extra='')=>`<button class="btn ${cls}" data-a="${a}" ${dis?'disabled':''} ${extra}>${label}</button>`;
function deltaChips(d,limit=8){const out=[];for(const[k,v]of Object.entries(d||{})){if(!v)continue;let ic,lab;
 if(k.startsWith('aff:')){const id=k.slice(4);ic=`<span class="fa-mini">${NPCS[id]?.name||''}</span>❤`;lab=(v>0?'+':'')+v;}
 else if(k.startsWith('skill:')){const sk=k.slice(6);ic=SKILLS[sk][1];lab='+'+v;}
 else if(k.startsWith('card:')){ic=CARDS[k.slice(5)]?.icon||'🃏';lab='+1';}
 else{ic=STAT_ICON[k]||'';lab=k==='money'?(v>0?'+':'-')+yen(Math.abs(v)).slice(0):sgn(v);}
 out.push(`<span class="gain ${v>0?'up':'dn'}">${ic}<b class="num">${lab}</b></span>`);}
 return out.slice(0,limit).join('');}
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800);}
const HUD_ANCHOR={money:'hud-money',energy:'mt-energy',mood:'mt-mood',heat:'mt-heat',rep:'mt-rep'};
function floatDeltas(d,delay=0){
 Object.entries(d||{}).forEach(([k,v],i)=>{if(!v)return;setTimeout(()=>{
  const el=$(HUD_ANCHOR[k])||$('hud-name');if(!el)return;const r=el.getBoundingClientRect();
  const lab=k==='money'?(v>0?'+':'-')+yen(Math.abs(v)):(STAT_ICON[k]||(k.startsWith('skill:')?SKILLS[k.slice(6)][1]:k.startsWith('aff:')?'❤':''))+sgn(v);
  const f=document.createElement('div');f.className='fl '+(v>0?'up':'dn')+(k==='money'&&v>0?' gold':'');f.textContent=lab;
  f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top+r.height/2+(i%3)*14)+'px';$('floaters').appendChild(f);setTimeout(()=>f.remove(),1600);},delay+i*90);});}
function goldBurst(){if(RM.matches)return;const g=document.createElement('div');g.className='gold-burst';g.innerHTML=Array.from({length:46},()=>`<i style="left:${Math.random()*100}%;animation-delay:${Math.random()*.8}s;transform:rotate(${Math.random()*90}deg)"></i>`).join('');document.body.appendChild(g);setTimeout(()=>g.remove(),3200);}
function shatter(){const g=document.createElement('div');g.className='shatter';g.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M55 0 L48 30 L60 45 L42 62 L52 80 L44 100"/><path d="M48 30 L18 36 L0 34 M60 45 L86 50 L100 48 M42 62 L14 70 L0 76 M52 80 L78 88 L100 96"/><path d="M18 36 L10 12 M86 50 L92 20 M14 70 L22 100"/></svg>`;document.body.appendChild(g);document.querySelector('.app')?.classList.add('shake');setTimeout(()=>g.remove(),2600);}
function countUp(el,from,to,ms=900){if(RM.matches||!el){if(el)el.textContent=W(to);return;}const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/ms);el.textContent=W(Math.round(from+(to-from)*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f);};requestAnimationFrame(f);}
function stateMood(s){if(s.flags.crashUntil>=s.m)return'crash';if(s.mood<25||s.money<0)return'low';if(s.heat>=60||s.chart?.[0]?.mine)return'hot';return'';}

 return`<header class="hud" style="--tier:${t.color}"><div class="hud-top"><div class="ava">${portrait(s.look,{state:stateMood(s),nobg:false})}</div>

 <div class="meters">${m('energy','⚡',s.energy,'linear-gradient(90deg,#4fe0a6,#b6ff7a)',s.energy<20)}${m('mood','💗',s.mood,'linear-gradient(90deg,#ff77b2,#ffb3d1)',s.mood<25)}${m('heat','🔥',s.heat,'linear-gradient(90deg,#ff6a2b,#ffcf5a)')}${m('rep','⭐',s.rep,'linear-gradient(90deg,#a98bff,#5fe1ff)')}</div>
 <div class="chapter" style="--cc:${ch.color}"><span class="no">${String(ch.n).padStart(2,'0')}</span><div><b>${ch.name}</b><small>${ch.goal}</small></div>${goal}</div></header>`;}
function cellView(w,i){
 const c=S.plan[w][i],done=w<S.w,cur=w===S.w;let cls='cell',inner;
 if(!c){cls+=' empty';inner=`<b>＋</b>${i===2?'周末':'空'}`;}

 else{const A=ACTIONS[c.a];let lab=A.name;let ic=A.icon;if(c.a==='train'&&c.k){ic=SKILLS[c.k][1];lab='练'+SKILLS[c.k][0];}if(c.a==='social'&&c.k)lab='约'+NPCS[c.k].name.slice(-2);if(c.a==='create'&&!S.project)lab='找灵感';inner=`<b>${ic}</b>${lab}`;}

 if(s.pendingRelease){const r=s.pendingRelease;h+=`<div class="card proj" style="margin-top:6px"><div class="cv">${cover({title:r.title,tag:r.tag,artist:s.name,grade:r.grade})}</div><div class="info"><b>《${esc(r.title)}》</b><small>📅 ${r.month===s.m?'本月底':'下月底'}上线 · ${PLATFORMS[r.platform].name} · ${PROMOS[r.promo].name}</small></div></div>`;}
 if(s.project){const p=s.project,est=grade(estimateQ(s,p));h+=`<div class="card proj" style="margin-top:6px"><div class="cv">${cover({title:p.title,tag:p.tag,artist:s.name})}</div><div class="info"><b>${p.copy?'':'✍️ '}《${esc(p.title)}》</b><small>${p.copy?'复刻 · 地球记忆':'原创'} · 预估 <span class="gr ${est}">${est}</span></small><div class="pbar"><u style="width:${p.prog/p.need*100}%"></u></div></div><span class="num" style="font-size:14px;color:var(--sub)">${Math.round(p.prog/p.need*100)}%</span></div>`;}
 else h+=`<button class="card proj empty" style="margin-top:${h?6:0}px" data-a="newproj">🎼 开一个新企划　<small style="color:var(--gold)">🌍 记忆 ${s.memory}/10</small></button>`;

function estimateQ(s,p){const sk=mixScore(s,p.type);const avg=p.qn?p.qsum/p.qn:sk;let q=p.copy?.4*p.base+.6*avg-(avg<p.diff?(p.diff-avg)*.5:0):avg*.85+8+Math.min(10,s.original*.25);return clamp(Math.round(q),30,99);}

function libraryList(s){
 const q=ui.lib.q.trim();let l=WORKS.filter(w=>(w.type==='music'||s.tier>=2&&['screen','tv','book'].includes(w.type)));
 if(q)l=l.filter(w=>w.title.includes(q)||(w.artist||'').includes(q));
 const sk=mixScore(s,'music');
 l=l.map(w=>[w,(canStart(s,w.id)?-1000:0)+estimateQ(s,{copy:true,base:w.base,diff:w.diff,type:w.type,qn:0})-Math.abs(w.diff-sk)*.2]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
 return l.slice(0,q?40:24);}

function renderScene(){

 const who=cur[0];const isMe=who==='me',isSys=who==='sys';
 if(!isSys&&!isMe&&NPCS[who]){S.met=S.met||[];if(!S.met.includes(who))S.met.push(who);}
 const pf=isMe?portrait(S.look,{mood:'normal',state:stateMood(S),nobg:true}):NPCS[who]?portrait(NPCS[who].look,{nobg:true,mood:who==='cheng'||who==='xu'?'angry':'normal'}):'';
 const nc=isMe?'':NPCS[who]?.color||'#555';
 let bottom='';
 if(!atEnd)bottom=`<div class="bubble ${isMe?'me':isSys?'sys':''}" style="--nc:${nc}">${isSys?'':`<span class="nm">${isMe?esc(S.name):NPCS[who].name}</span>`}<p>${esc(cur[1])}</p><span class="next">点击继续 ▾</span></div>`;
 else if(sc.agentPick)bottom=`<div class="bubble sys"><p>选一个经纪人。TA会一直记得。</p></div><div class="agents">${AGENTS.map((a,k)=>{const n=NPCS[a];return`<button class="agent" data-a="agent:${k}" style="--ac:${n.color};animation-delay:${k*.07}s"><div class="pf">${portrait(n.look,{mood:'happy'})}</div><div class="t"><span class="tg">${n.tag}</span><b>${n.name}</b><small>“${esc(n.pitch)}”</small><small>✨ ${esc(n.perk)}</small><small>抽成 <span class="fee">${Math.round(n.fee*100)}%</span></small></div></button>`;}).join('')}</div>`;
 else if(sc.choices)bottom=`<div class="bubble ${isMe?'me':isSys?'sys':''}" style="--nc:${nc}">${isSys?'':`<span class="nm">${isMe?esc(S.name):NPCS[who].name}</span>`}<p>${esc(cur[1])}</p></div><div class="choices">${sc.choices.map((c,k)=>{const ok=choiceOk(S,c);return`<button class="choice" data-a="ch:${k}" ${ok?'':'disabled'}><b>${c.icon}</b><span>${esc(c.label)}${!ok?`<small class="req-note">${esc(choiceReason(S,c))}</small>`:''}</span><span class="hint">${hintIcons(c)}</span></button>`;}).join('')}</div>`;
 else bottom=`<div class="bubble ${isMe?'me':isSys?'sys':''}" style="--nc:${nc}">${isSys?'':`<span class="nm">${isMe?esc(S.name):NPCS[who].name}</span>`}<p>${esc(cur[1])}</p></div><div class="choices"><button class="choice" data-a="ch:0"><b>${sc.battle?'⚔️':'▶'}</b><span>${sc.battle?'迎战':'继续'}</span><span class="hint">${sc.fx?hintIcons({fx:sc.fx}):''}</span></button></div>`;
 return`<div class="scene" data-a="${atEnd?'noop':'line'}" role="dialog" aria-label="剧情"><div class="bgx bg-${sc.bg||'room'}"></div>
 ${pf?`<div class="who ${isMe?'r':'l'}">${pf}</div>`:''}
 ${!atEnd?`<button class="skip" data-a="skipline">跳过 ⏭</button>`:''}
 <div class="vn">${bottom}</div></div>`;}
function choiceReason(s,c){const q=c.req||{};if(q.money&&s.money<q.money)return '需要 '+yen(q.money);if(q.aff)return NPCS[q.aff[0]].name+'好感 ≥'+q.aff[1];if(q.skill)return SKILLS[q.skill[0]][0]+' ≥'+q.skill[1];if(q.award)return '原创≥16 · 前十≥2 · 口碑≥45';if(q.director)return '演技≥55 · 影视作品品质≥65';if(q.graduates)return '培养三位新人出道';if(q.released)return '发行作品≥'+q.released;if(q.flag)return ({award:'取得年度大奖',caseEvidence:'保全旧案证据',caseCleared:'完成旧案裁决'})[q.flag]||'尚未满足剧情条件';return '条件未满足';}
function hintIcons(c){const fx=c.fx||{};const out=[];
 for(const[k,v]of Object.entries(fx)){if(k==='aff'){for(const[id,a]of Object.entries(v))out.push(`<span title="${NPCS[id].name}">${a>0?'❤️':'💔'}</span>`);continue;}
  if(k==='card')out.push(CARDS[v]?.icon||'🃏');else if(k==='debtPaid')out.push('🧾✔');else if(k==='contract')out.push('📜');
  else if(STAT_ICON[k])out.push(`${STAT_ICON[k]}${v>0?'↑':'↓'}`);else if(k==='soloMood')out.push(`💖${v>0?'↑':'↓'}`);else if(k==='workMood')out.push(`💿${v>0?'↑':'↓'}`);}
 if(c.battle)out.push('⚔️');return out.slice(0,4).join(' ');}

function renderBattle(){
 const b=S.battle;if(!b)return'';const def=BATTLES[b.id];const tag=def.tag.replace('{name}',S.name);
 const round=Math.min(b.round,BATTLE_ROUNDS.length-1),mvId=def.deck[round],mv=OPP_MOVES[mvId];
 const pos=b.H>80?1:b.H>60?2:b.H>40?3:b.H>20?4:5;const fill=['#澜星音乐节阵容','#海岚暴雨','#年度综艺盘点','#打工人的周一','#猫咪迷惑行为'];
 const list=[];let fi=0;for(let k=1;k<=5;k++)list.push(k===pos?{t:tag,me:1}:{t:fill[fi++]});
 const badge=k=>k===1?'<span class="badge bao">爆</span>':k===2?'<span class="badge fei">沸</span>':k===3?'<span class="badge re">热</span>':k===5?'<span class="badge xin">新</span>':'';
 const against=Math.round((100-b.S)/2);const oppFace=NPCS[def.opp]?portrait(NPCS[def.opp].look,{mood:'angry'}):`<div style="display:grid;place-items:center;height:100%;font-size:20px;background:#333">📰</div>`;
 const done=b.round>=BATTLE_ROUNDS.length;
 const cards=b.hand.map(id=>{const C=CARDS[id];const used=b.used.includes(id)&&!REUSABLE.includes(id);const cost=C.cost?(id==='buy'&&S.agent==='zhou'?C.cost/2:C.cost):0;const dis=used||done||S.money<cost||ui.busy;
  const ctr=!done&&C.beats?.includes(mvId),wk=!done&&C.weak?.includes(mvId);
  let desc=C.desc;if(id==='ally'&&b.ally)desc=NPCS[b.ally].name+'帮你';if(id==='evidence')desc='剩 '+S.hand.evidence;
  return`<button class="pcard" style="--tc:${C.tone}" data-a="card:${id}" ${dis?'disabled':''}>${ctr?'<span class="ctr">克制</span>':''}${wk?'<span class="wk">怕</span>':''}<b>${C.icon}</b><span>${C.name}</span><small>${esc(desc)}</small></button>`;}).join('');
 let result='';
 if(done&&b.result){const r=b.result.r;const name={win:'舆论反转',draw:'暂时平息',lose:'口碑受损',crash:'塌 房'}[r];const line=r==='win'?def.winLine:r==='lose'||r==='crash'?def.loseLine:null;
  result=`<div class="result"><div class="stamp ${r}">${name}</div><div class="gains" style="justify-content:center">${deltaChips(b.result.d,8)}</div>${line?`<div class="mini-b"><div class="fa">${portrait(NPCS[line[0]].look,{mood:r==='win'?'angry':'happy'})}</div><p>${esc(line[1])}</p></div>`:''}${r==='crash'?'<p style="font-size:12px;color:var(--sub)">这个月邀约全部取消。熬过去。</p>':''}${B('关闭微博','bend','gold')}</div>`;}
 return`<div class="battle" role="dialog" aria-label="热搜战"><div class="app">
 <div class="app-bar"><b>澜博</b><span class="srch">🔍 ${esc(tag)}</span><span class="clock">${done?'结束':BATTLE_ROUNDS[round]}</span></div>
 <div class="trend">${list.map((x,k)=>`<div class="tr ${x.me?'me':''}"><span class="n">${k+1}</span><span>${esc(x.t)}</span>${badge(k+1)}</div>`).join('')}</div>
 <div class="opinion"><div class="op-top"><span>👿 骂 <b class="num">${against}%</b></span><span style="color:var(--dim)">🔥 热度 <b class="num" style="font-size:13px">${b.H}</b></span><span>💖 挺 <b class="num">${100-against}%</b></span></div><div class="op-bar" style="--p:${against}%"><i></i></div></div>
 ${done?'':`<div class="intent"><div class="fa">${oppFace}</div><div><small>${esc(def.oppName)} · 下一步</small><b>${mv.icon} ${mv.name}</b></div><span class="mvic">${mv.icon}</span></div>`}
 <div class="feed" id="feed">${ui.comments.map(c=>`<div class="cm ${c.sys?'sys':''}"><span class="av" style="background:${c.c}">${esc(c.n[0])}</span><div class="bx"><small>${esc(c.n)}</small>${esc(c.t)}</div><span class="lk">♥${c.l}</span></div>`).join('')}</div>
 <div class="hand">${cards}</div>${result}</div></div>`;}
function seedComments(){const b=S.battle;ui.comments=[];const def=BATTLES[b.id];
 ui.comments.push({sys:1,n:def.oppName,c:'#8c1c2c',t:OPP_MOVES[def.deck[0]].line,l:W(8000+Math.round(Math.random()*20000))});addComments(3);}
function addComments(n){const b=S.battle;const pool=b.S<-15?COMMENTS.bad:b.S>15?COMMENTS.good:COMMENTS.mid;
 for(let k=0;k<n;k++){const mix=Math.random();const p=mix<.2?COMMENTS.mid:pool;ui.comments.push({n:NICKS[Math.floor(Math.random()*NICKS.length)],c:['#ff5fa2','#7fd3ff','#ffb547','#4fb3a9','#a98bff'][Math.floor(Math.random()*5)],t:p[Math.floor(Math.random()*p.length)],l:W(Math.round(Math.random()*9000))});}
 ui.comments=ui.comments.slice(-14);}

function renderReport(){
 const r=ui.report;if(!r)return'';const s=S;const d=r.d||{};
 const k=(lab,v,dv,fmt=W)=>`<div class="kpi"><small>${lab}</small><span class="num">${fmt(v)}</span><div class="d ${dv>0?'up':dv<0?'dn':''}">${dv?(dv>0?'▲':'▼')+W(Math.abs(dv)):'—'}</div></div>`;
 const fansD=(d.passer||0)+(d.work||0)+(d.solo||0);
 return`<div class="report" role="dialog" aria-label="月度战报"><div class="in">
 <div class="mag"><div class="issue">STAR WEEKLY · ${r.label}</div><h2>${r.gold?`《${esc(r.gold)}》<br>登顶！`:r.songs.length?`《${esc(r.songs[0].title)}》<br>${r.songs[0].rank<=10?'第 '+r.songs[0].rank+' 名':'未进前十'}`:'本月<br>战报'}</h2>
 <div class="pf">${portrait(s.look,{state:stateMood(s),mood:r.gold?'happy':r.tierChange<0?'sad':'normal',nobg:true})}</div>
 <div class="kpis">${k('资金',r.after.money,d.money,yen)}${k('粉丝',r.after.passer+r.after.work+r.after.solo,fansD)}${k('咖位分',r.after.sp,d.sp)}</div></div>
 ${r.tierChange>0?`<div class="banner up">⬆ 咖位升级 · ${TIERS[s.tier].name}</div>`:r.tierChange<0?`<div class="banner dn">⬇ 咖位下滑 · ${TIERS[s.tier].name}</div>`:''}
 <div class="ledger">${r.cut?`<span class="gain dn">📜 分成 <b class="num">-${yen(r.cut)}</b></span>`:''}<span class="gain dn">🏠 开销 <b class="num">-${yen(r.cost)}</b></span>${d.heat?`<span class="gain ${d.heat>0?'up':'dn'}">🔥<b class="num">${sgn(d.heat)}</b></span>`:''}${d.anti?`<span class="gain ${d.anti<0?'up':'dn'}">👿<b class="num">${sgn(d.anti)}</b></span>`:''}</div>
 ${r.lines.length?`<div class="bubbles">${r.lines.map(([who,t])=>{const id=who==='agent'?(s.agent||'lin'):who;return`<div class="mini-b"><div class="fa">${npcFace(id)}</div><p><b style="font-size:11px;color:${NPCS[id].color}">${NPCS[id].name}</b><br>${esc(t)}</p></div>`;}).join('')}</div>`:''}
 <section class="sec"><div class="sec-h"><h3>澜星热歌榜</h3><small>${r.label}</small></div><div class="chart" id="rchart">${chartRows(r.chart,true)}</div></section>
 <div style="margin-top:12px">${B('进入 '+dateLabel(s)+' ▶','repclose','gold block')}</div></div></div>`;}

/* ---------- 渲染 ---------- */
function renderEnding(){const e=ENDINGS[S.ended.id]||ENDINGS.artist;return `<div class="title ending"><div class="ending-face">${portrait(S.look,{state:'hot',mood:'happy'})}</div><small>十年星途 · ${esc(S.name)}</small><h1 class="logo">${e[0]}</h1><p class="tag">${e[1]}</p><div class="chips"><span class="chip">💿 ${S.stats.released} 部作品</span><span class="chip">🏆 ${S.stats.top1} 次冠军</span><span class="chip">🌱 ${S.studio?.graduates||0} 位新人</span></div><div class="btns">${B('保存这段人生','export','gold')}${B('回到标题','title')}</div></div>`;}
function render(){
 const app=$('app');
 if(ui.view==='title'){app.innerHTML=renderTitle()+renderSheet();return;}
 const feedTop=$('feed')?.scrollTop;
 app.innerHTML=S.ended?renderEnding():renderGame()+renderSheet()+renderScene()+renderBattle()+renderReport();
 document.body.classList.toggle('crashed',S.flags.crashUntil>=S.m);
 const f=$('feed');if(f)f.scrollTop=f.scrollHeight;
 save();}
function animateWeekRun(){const els=[...document.querySelectorAll('.wr')];els.forEach((e,i)=>setTimeout(()=>e.classList.add('show'),RM.matches?0:i*380));}
function animateChart(){const rows=[...document.querySelectorAll('#rchart .crow')];if(RM.matches)return;rows.forEach(r=>{const f=+r.dataset.from;if(!f)return;r.style.transition='none';r.style.transform=`translateY(${f}px)`;r.style.opacity=f>200?.2:1;});requestAnimationFrame(()=>requestAnimationFrame(()=>rows.forEach((r,i)=>{r.style.transition='';r.style.transitionDelay=(i*.05)+'s';r.style.transform='';r.style.opacity='';})));}

/* ---------- 交互 ---------- */
function act(a,el,ev){
 const [k,...p]=a.split(':');const s=S;
 switch(k){
  case'noop':return;
  case'new':ui.sheet={kind:'create'};break;
  case'look':ui.draft.look=p[0];ui.draft.name=$('nm')?.value||ui.draft.name;break;
  case'start':{const nm=($('nm')?.value||'').trim()||'陆星河';S=newGame({name:nm,look:ui.draft.look});S.met=['cheng'];ui.view='game';ui.sheet=null;ui.line=0;ui.tab='home';break;}
  case'continue':S=loadV2();if(!S)return;ui.view='game';ui.line=0;break;
  case'inherit':{const v1=loadV1();if(!v1)return;S=migrateV1(v1);S.look='a';S.met=['cheng'];ui.view='game';ui.line=0;toast('旧存档已继承 · 原存档保留不动');break;}
  case'tab':ui.tab=p[0];ui.sheet=null;scrollTo({top:0});break;
  case'close':ui.sheet=null;break;
  case'close-bg':if(el===ev?.target){ui.sheet=null;break;}return;
  case'cell':ui.sheet={kind:'cell',w:+p[0],i:+p[1]};break;
  case'set':{const sh=ui.sheet;if(!p[0]){setCell(s,sh.w,sh.i,null);ui.sheet=null;break;}
   if(p[0]==='train'||p[0]==='social'){const kk=p[0]==='train'?weakSkill(s):(s.agent||'tang');setCell(s,sh.w,sh.i,p[0],kk);sh.pick=p[0];break;}
   setCell(s,sh.w,sh.i,p[0]);ui.sheet=null;break;}
  case'setk':{const sh=ui.sheet;setCell(s,sh.w,sh.i,p[0],p[1]);ui.sheet=null;break;}
  case'fillrow':{const sh=ui.sheet;const c=s.plan[sh.w][sh.i];for(let w=s.w;w<WEEKS;w++)setCell(s,w,sh.i,c.a,c.k);ui.sheet=null;toast('已排满这一行');break;}
  case'preset':applyPreset(s,p[0]);toast(PRESETS.find(x=>x.id===p[0]).icon+' 已按「'+PRESETS.find(x=>x.id===p[0]).name+'」排好剩余行程');break;
  case'offer':ui.sheet={kind:'offer',uid:p[0]};break;
  case'acc':if(acceptOffer(s,p[0])){toast('✅ 已接下，行程已占');ui.sheet=null;}break;
  case'dec':declineOffer(s,p[0]);ui.sheet=null;break;
  case'newproj':ui.sheet={kind:'proj'};break;
  case'lib':ui.lib.mode=p[0];break;
  case'pick':if(startProject(s,p[0])){ui.sheet=null;toast('🎼 企划开始！把行程排上「创作」');if(!s.plan[s.w].some(c=>c&&c.a==='create'))applyPreset(s,'work');}break;
  case'orig':if(startProject(s,null,p[0])){ui.sheet=null;toast('✍️ 原创企划开始');}else toast(canStart(s,null));break;
  case'rel':ui.sheet={kind:'rel',uid:p[0]};ui.rel={next:0,platform:'all',promo:s.money>=PROMOS[1].cost+5000?1:0};break;
  case'ro':ui.rel[p[0]]=p[0]==='platform'?p[1]:+p[1];break;
  case'relgo':if(scheduleRelease(s,ui.sheet.uid,ui.rel)){ui.sheet=null;toast('🚀 已排期，月底见分晓');}break;
  case'work':ui.sheet={kind:'work',uid:p[0]};break;
  case'wr-close':ui.weekRun=null;break;
  case'go':return goNext();
  case'line':ui.line++;break;
  case'skipline':ui.line=99;break;
  case'agent':case'ch':return pickChoice(+p[0]);
  case'card':return playBattle(p[0]);
  case'bend':{const r=s.battle?.result?.r;endBattle(s);ui.comments=[];if(r==='crash'&&!RM.matches)shatter();render();openNextScene();return;}
  case'repclose':ui.report=null;render();openNextScene();return;
  case'export':{const blob=new Blob([JSON.stringify(s)],{type:'application/json'});const u=URL.createObjectURL(blob);const x=document.createElement('a');x.href=u;x.download='杀穿娱乐圈-存档.json';x.click();URL.revokeObjectURL(u);return;}
  case'import':{const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const v=JSON.parse(t);if(validV2(v)){S=v;toast('已导入');render();}else if(v.version===1){S=migrateV1(v);S.look='a';toast('旧版存档已转换');render();}else toast('存档格式不对');}catch(e){toast('读不了这个文件');}});};inp.click();return;}
  case'reset':if(confirm('删除当前进度，重新开始？')){localStorage.removeItem(V2_KEY);S=null;ui.view='title';}break;
  case'title':save();ui.view='title';break;
 }
 render();
 if(k==='lib'||k==='proj'){const q=$('libq');if(q)q.oninput=()=>{ui.lib.q=q.value;const pos=q.selectionStart;render();const n=$('libq');n.focus();n.setSelectionRange(pos,pos);};}
 if(ui.sheet?.kind==='proj'){const q=$('libq');if(q&&!q.oninput)q.oninput=()=>{ui.lib.q=q.value;const pos=q.selectionStart;render();const n=$('libq');n.focus();n.setSelectionRange(pos,pos);};}}
function goNext(){
 const s=S;if(ui.busy||s.ended)return;
 if(s.queue.length){ui.line=0;render();return;}
 if(s.w<WEEKS){
  const r=advanceWeek(s);if(!r)return;ui.weekRun=r;ui.busy=true;ui.tab='home';render();animateWeekRun();
  const all={};r.cells.forEach(c=>Object.entries(c.d).forEach(([k,v])=>{if(HUD_ANCHOR[k])all[k]=(all[k]||0)+v;}));
  const delay=RM.matches?0:r.cells.length*380;
  floatDeltas(all,delay);
  setTimeout(()=>{ui.busy=false;render();openNextScene();},delay+250);return;}
 const rep=endMonth(s);if(!rep)return;ui.report=rep;ui.weekRun=null;render();animateChart();
 const mineTop=rep.songs.find(x=>x.rank===1);if(rep.gold||mineTop||rep.tierChange>0)setTimeout(goldBurst,RM.matches?0:700);}
function openNextScene(){if(S.queue.length&&!S.battle&&!ui.report){ui.line=0;render();}}
function pickChoice(i){
 const s=S;const id=s.queue[0];const before={money:s.money,energy:s.energy,mood:s.mood,heat:s.heat,rep:s.rep};
 const out=resolveScene(s,id,i);if(!out)return;ui.line=0;
 if(s.battle){seedComments();}
 render();
 const d={};for(const k in before){const v=s[k]-before[k];if(v)d[k]=v;}floatDeltas(d,100);
 const cards=Object.keys(out.d||{}).filter(k=>k.startsWith('card:'));if(cards.length)toast('获得底牌 '+cards.map(c=>CARDS[c.slice(5)].icon+CARDS[c.slice(5)].name).join(' '));
 if(id==='debt_ok')setTimeout(goldBurst,200);}
function playBattle(card){
 const s=S;if(ui.busy)return;const el=document.querySelector(`.pcard[data-a="card:${card}"]`);const ev=playCard(s,card);if(!ev)return;
 ui.busy=true;if(el&&!RM.matches)el.classList.add('played');
 const C=CARDS[card];ui.comments.push({sys:1,n:s.name,c:'#ffcf5a',t:`${C.icon} ${C.name}${ev.notes.length?' · '+ev.notes.join(' '):''}（风向 ${ev.ds>=0?'+':''}${ev.ds}）`,l:W(5000+Math.round(Math.random()*30000))});
 const def=BATTLES[s.battle.id];if(s.battle.round<BATTLE_ROUNDS.length)ui.comments.push({sys:1,n:def.oppName,c:'#8c1c2c',t:OPP_MOVES[def.deck[s.battle.round]].line,l:W(3000+Math.round(Math.random()*20000))});
 addComments(2);
 setTimeout(()=>{ui.busy=false;render();if(ev.result?.r==='win')goldBurst();if(ev.result?.r==='crash'&&!RM.matches)shatter();},RM.matches?0:520);}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;act(el.dataset.a,el,e);});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&ui.sheet){ui.sheet=null;render();}
 if((e.key===' '||e.key==='Enter')&&document.querySelector('.scene[data-a="line"]')&&!e.target.closest('button,input')){e.preventDefault();act('line');}});
document.body.insertAdjacentHTML('afterbegin','<div class="stage-bg" aria-hidden="true"><i></i><i></i></div>'+GRAIN_DEFS);
render();
</script></body></html>
