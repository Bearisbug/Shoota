final:'全球决战开始前，阿玛拉走过来与你握手。她问起你最早在哪里演出，你说是海岚一场只有八十人的小型现场。她笑着说，她的第一场演出甚至没有售票。两个人在摄像机照不到的走廊里短暂聊起了那些笨拙的开场。\n\n灯光亮起时，你看见观众席里的伙伴，也想起曾经被撤掉的资源、无人回复的投稿，以及愿意相信你的第一位歌手。那些经历没有替你赢下今天，却让你知道为什么必须把最后一个音唱完整。\n\n你带来的不再只是一段来自地球的旋律。它经过澜星的语言、团队的排练和你自己的生活，才成为这一刻真实的声音。最后一轮没有额外捷径：选好作品，兑现能力，让结果落在公开的评分里。',
champion:'最后一组分数亮起，你的名字出现在全球冠军的位置。你愣了一秒，才听见身后的乐手开始欢呼。阿玛拉主动拥抱你，祝贺这场完整的演出；她说下次想邀请你一起参加社区音乐节。竞争结束，并不意味着同行关系必须结束。\n\n接过奖杯时，你感谢参与制作的每一个名字。你也想起另一个世界里最早创造这些作品的人：没有他们，记忆不会发光；没有眼前这群伙伴，记忆也不会成为真正的现场。镜头之外，林见夏终于放下了攥了一晚的流程单。\n\n世界冠军让海外邀约与传播机会显著增加，却不是人生的终点。接下来的收入如何使用、是否继续帮助新人、怎样面对年龄与能力的变化，仍然由你决定。多年后人们可能记住这座奖杯，也可能先提起你替他们打开的那扇门。',
defeat:'分数公布时，你停在晋级线外。工作人员没有立刻催你离场，留给你时间向乐队鞠躬。对手的优势清楚写在评分里：也许是完成度，也许是作品更契合命题。这一晚的遗憾是真实的，但它不需要被编成一场阴谋。\n\n复盘室里，团队把反馈拆成可以改进的事项：哪种唱法仍不稳定，哪些主题缺少合适储备，制作与精力是否在赛前已经透支。你可以回到发行、训练和合作中积累，再向资格赛报名。已有作品、伙伴关系和过往成绩不会因此消失。\n\n离开场馆时，仍有陌生观众叫住你，说想知道下一首作品什么时候发布。世界并没有因为一次失利关上门。你把名牌收进包里，决定带着更可靠的准备回来。'
};

function migrateSave(s){
 if(!s||s.version!==1)return s;
 if(s.expansion!==2){s.karma=50;s.commissions=[];s.challenges=[];s.starTrust={};s.favors={};s.expansion=2;}
 if(s.skills){if(s.skills.tv===undefined)s.skills.tv=s.skills.screen;if(s.skills.show===undefined)s.skills.show=Math.max(25,s.skills.screen-5);}

 for(const star of STARS){if(s.starTrust?.[star.id]===undefined)(s.starTrust||(s.starTrust={}))[star.id]=0;if(s.favors?.[star.id]===undefined)(s.favors||(s.favors={}))[star.id]=0;}

function scheduleOpps(s){const offset=Math.floor((s.week-1)/24)*24;return OPPS.map(o=>o.id==='open'?{...o,end:999999}:{...o,start:o.start+offset,end:o.end+offset});}

function getWork(id){return WORKS.find(w=>w.id===id);}
function relation(s,type){return s.relations[PEOPLE.find(p=>p.type===type)?.id]||0;}

function estimate(s,w,config){
 const m=METHODS.find(x=>x.id===config.method)||METHODS[0],c=CHANNELS.find(x=>x.id===config.channel)||CHANNELS[0],o=scheduleOpps(s).find(x=>x.id===config.opp)||OPPS[0];
 const adapt=config.adapt!==false,used=s.released.filter(p=>getWork(p.work).tag===w.tag&&getWork(p.work).type===w.type&&s.week-p.week<=5).length;
 const localPenalty=['古典','武侠','现实','城市','神话'].includes(w.tag)?14:6,fit=o.tags.length?(o.tags.includes(w.tag)?100:45):70;
 const team=Math.floor(relation(s,w.type)/10),quality=clamp(Math.round(w.base*.55+s.skills[w.type]*.42-w.diff*.2+team+m.quality+(adapt?8:-localPenalty)),20,99);
 const cost=Math.ceil(w.cost*m.cost*(adapt?1.15:1)),steps=w.steps+m.extra,reach=Math.max(.6,1-used*.16);
 const eligible=(o.type==='all'||o.type===w.type)&&s.fans>=o.gate,mult=eligible?(o.factor*(fit===100?1.15:fit===45?.65:1)):1;
 const challenge=activeChallenge(s),def=challenge&&CHALLENGES.find(d=>d.id===challenge.id),suppression=def&&def.types.includes(w.type)&&!challenge.backed?def.penalty:1;
 const commission=config.commission&&s.commissions.find(c=>c.id===config.commission&&c.status==='active'),writerFactor=commission?.65:1;
 const fans=Math.round(MEDIA[w.type].fans*Math.pow(quality/60,2)*c.reach*mult*reach*(1+Math.sqrt(s.fans)/170)*suppression*writerFactor);
 const deal=s.contractUntil>=s.week?.8:1,share=m.share*c.share*deal;
 const gross=Math.round(MEDIA[w.type].income*(quality/70)**2*c.reach*mult*reach*share*suppression);
 return {quality,cost,steps,fit,fans,gross,share,used,reach,eligible,m,c,o,adapt,team,suppression,writerFactor};
}
function gate(s,w,config){
 if(!w)return '作品不存在';const e=estimate(s,w,config);
 if(s.ended&&!s.continued)return '请先查看结局并选择继续经营';
 if(s.projects.length>=2)return '最多同时制作2部作品';
 if([...s.projects,...s.released].some(p=>p.work===w.id))return '这部作品已立项或发行';
 if(s.ap<1)return '本周行动不足，先进入下一周';if(s.energy<15)return '需要15精力，先休息';
 if(s.memory<w.memory)return '记忆不足，先整理记忆';if(s.money<e.cost)return '预算不足，可接商单或选择联合制作';
 if(s.skills[w.type]<w.diff-25)return `${TYPES[w.type]}能力需达到${w.diff-25}，先进行专业训练`;
 if(e.m.id==='partner'&&s.rep<40)return '联合制作需要行业口碑40';if(s.rep<e.c.gate)return `${e.c.name}需要行业口碑${e.c.gate}`;
 if(!e.eligible)return '尚未达到该机会的领域或粉丝门槛';if(s.week<e.o.start||s.week>e.o.end)return '该发行机会尚未开放或已经结束';
 if(config.commission){const rec=s.commissions.find(c=>c.id===config.commission&&c.status==='active');if(!rec)return '委托已经结束，请改为自主发行';if(w.type!=='music')return '邀歌委托只能绑定歌曲';if(s.projects.some(p=>p.config.commission===config.commission))return '这份邀歌已有制作项目';}
 return '';
}

function begin(s,w,config){const err=gate(s,w,config);if(err)return err;const e=estimate(s,w,config);s.money-=e.cost;s.ap--;s.energy-=15;s.memory-=w.memory;s.projects.push({id:Date.now()+'-'+w.id,work:w.id,config:{...config},progress:1,steps:e.steps,cost:e.cost,quality:e.quality,share:e.share,started:s.week,deadline:e.o.end});log(s,'正式立项',`《${w.title}》投入${money(e.cost)}；计划${e.steps}次制作行动，发行另需1行动。`);return '';}

function release(s,id){
 const p=s.projects.find(p=>p.id===id);if(!p||p.progress<p.steps)return '请先完成制作';if(s.ap<1)return '发行需要1行动';
 const w=getWork(p.work),e=estimate(s,w,p.config),expired=s.week>(p.deadline||e.o.end);
 const actual=estimate(s,w,expired?{...p.config,opp:'open'}:p.config),ratio=(p.quality/actual.quality)**2;

 else if(id==='social'){if(!PEOPLE.some(p=>p.id===type))return '伙伴不存在';if(s.energy<10)return '需要10精力';s.energy-=10;s.relations[type]=clamp(s.relations[type]+12);log(s,'认真聊了一次创作',`${PEOPLE.find(p=>p.id===type).name}好感 +12。`);}

 if(s.money<(o.cost||0))return '资金不足，可先接商单';if(s.ap<(o.ap||0))return '行动不足，可先进入下一周';if(s.energy<(o.energy||0))return '精力不足，可先休息';if(s.memory+(o.memory||0)<0)return '记忆不足，可先整理记忆';

function render(){const s=state,ch=CHAPTERS[Math.min(5,Math.floor((s.week-1)/32))];$('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-icon"><span>✧</span></div><div><strong>杀穿娱乐圈</strong><small>ANOTHER WORLD, YOUR STAGE</small></div></div><div class="eyebrow" style="margin:0 12px 17px;font-size:8px">你的第二人生</div><nav class="nav" aria-label="主导航">${[['home','◈','主工作台'],['library','▤','作品资料库'],['projects','◉','作品成绩'],['people','♧','人脉档案'],['stage','♬','日程与世界'],['public','◎','社交平台'],['market','↗','音乐与市场'],['story','⌑','星途手记']].map(([id,icon,label])=>btn(`<span class="icon">${icon}</span><span>${label}</span>`,'tab:'+id,tab===id?'active':'')).join('')}</nav><div class="side-footer"><span class="save-dot"></span>${saveOK?'进度已自动保存':'保存不可用，请导出存档'}<br>文娱生涯 · 主工作台<br>${btn('玩法手册','help','small ghost')}${btn('存档','settings','small ghost')}<div style="margin-top:22px;color:#626b78;letter-spacing:1px">PARALLEL STARLIGHT<br>VERSION 4.0</div></div></aside><main class="main"><header class="topbar"><div class="breadcrumb"><span class="mobile-brand">杀穿娱乐圈</span>平行世界 · 澜星 <span style="padding:0 10px">/</span><strong>海岚市</strong></div><div class="profile">${btn('玩法','help','small ghost')}<div class="avatar">${esc(s.name[0])}</div><div><strong>${esc(s.name)}</strong><div class="muted">${rank()} · ${s.studio?'星渡工作室':'独立创作者'}</div></div></div></header>${tab==='home'?home(ch):tab==='library'?library():tab==='projects'?projects():tab==='people'?people():tab==='stage'?stagePage():tab==='market'?marketPage():tab==='public'?publicPage():story(ch)}<div class="footer-note">地球的记忆，是起点。属于你的故事，才刚刚开始。</div></main></div>`;}
function rank(){return state.fans>=35000?'时代新声':state.fans>=12000?'人气创作者':state.fans>=3000?'崭露头角':state.fans>=500?'小有回声':'无名新人';}
function stats(){const s=state;return `<div class="statusbar">${[['流动资金',money(s.money),'每周固定支出 '+money(600+(s.studio?700:0)),'◈'],['作品粉丝',num(s.fans),rank(),'♧'],['行业口碑',s.rep+'<span style="font-size:12px;color:#9298a3"> / 100</span>',s.rep>=40?'已开放联合制作':'达到40可联合制作','◇'],['本周行动',s.ap+'<span style="font-size:12px;color:#9298a3"> / 3</span>','每周恢复3行动 · 精力 +30','⌁']].map(([label,value,note,icon],i)=>`<div class="stat"><span class="stat-symbol">${icon}</span><div class="stat-label">${label}</div><div class="stat-value ${i===0?'gold':''}">${value}</div><div class="stat-note">${note}</div></div>`).join('')}</div>`;}
function home(ch){const s=state,ev=pendingEvent(s);const opps=availableOpps(s).filter(o=>o.id!=='open');let guide=!s.released.length&&!s.projects.length?'第一步：从「天台新人之夜」或「灯塔连载征稿」选择作品，立项后推进制作。':s.projects.length?'下一步：在「正在制作」推进项目。制作完成后，还需1行动正式发行。':'下一步：查看本周机会，积累新作品；训练能力后可挑战制作难度更高的名作。';return `<div class="page-heading"><div><h2>你的故事，正在发生</h2><p>带着一个世界的记忆，走向另一个世界的舞台。</p></div><span class="week-chip">${age(s)}岁 · 第 ${s.week} 回合</span></div><section class="hero"><div class="hero-copy"><div class="eyebrow">CHAPTER ${ch[0]} &nbsp; / &nbsp; ${ch[2]}</div><h1>${ch[1]}</h1><p>${ch[3]}<br>${s.week===1?'窗外的海岚和地球一样喧闹，却没人听过你记得的旋律。':''}</p><div class="hero-actions">${btn(s.projects.length?'继续我的创作 <span>↗</span>':s.released.length?'开始下一部作品 <span>↗</span>':'挑选第一部作品 <span>↗</span>',s.projects.length?'tab:projects':'pick:open','primary')}${btn('世界与我的来处','world','ghost')}</div></div><div class="scene-art"><div class="beam"></div><div class="beam second"></div><div class="rings"></div><div class="wave">${Array.from({length:35},(_,i)=>`<i style="height:${8+(Math.sin(i*1.7)+1)*14}px"></i>`).join('')}</div></div></section>${stats()}${s.ended?`<div class="story-notice"><div><strong>第一季已经落幕</strong><p>你的经历已经写进季末手记，可以查看结局或继续自由创作。</p></div>${btn('查看结局','ending','primary small')}</div>`:''}${ev?`<div class="story-notice"><div><span class="eyebrow">一段新的故事</span><h3>${ev.title}</h3><p>${ev.who}有话对你说。处理后，这个决定会写入你的手记。</p></div>${btn('打开来信 ↗','event','small primary')}</div>`:''}<div class="grid-main"><div><section class="panel"><div class="panel-head"><h3>本周机会 <small>OPPORTUNITIES</small></h3><small>时机，让作品被看见</small></div>${opps.map(o=>oppCard(o)).join('')||'<p class="muted">本季限定窗口已结束，自主发行一直开放。</p>'}${btn('浏览全部地球记忆 →','tab:library','small ghost')} ${btn('查看发行日历','opps','small ghost')}<div class="guide-line">${guide}</div></section><section class="panel"><div class="panel-head"><h3>正在制作 <small>${s.projects.length} / 2</small></h3><small>立项 → 制作 → 发行</small></div>${projectRows()}</section></div><aside class="right-col"><section class="panel"><div class="panel-head"><h3>创作者状态</h3><small>每一次行动都有代价</small></div>${meter('精力',s.energy,'green')}${meter('记忆清晰度',s.memory,'purple')}<div class="actions-grid">${btn('☕ 休息片刻<small>1行动 · 精力 +45</small>','routine:rest','action-tile',!s.ap)}${btn('▧ 整理记忆<small>1行动 · 记忆 +30</small>','routine:memory','action-tile',!s.ap)}${btn('♬ 接一单工作<small>1行动 · '+money(4000+Math.min(12000,Math.floor(s.fans*.12)))+'</small>','routine:gig','action-tile',!s.ap)}${btn('↗ 专业训练<small>1行动 · 能力 +7</small>','train','action-tile',!s.ap)}</div></section><section class="panel"><div class="panel-head"><h3>把记忆变成能力</h3></div>${meter('音乐制作',s.skills.music)}${meter('文学创作',s.skills.book,'green')}${meter('影视制作',s.skills.screen,'purple')}</section><section class="panel"><div class="quote">${PEOPLE[(s.week-1)%3].quote}</div><div class="quote-author">— ${PEOPLE[(s.week-1)%3].name} · ${PEOPLE[(s.week-1)%3].role}</div></section></aside></div><div class="bottom-strip"><div><strong style="font-size:12px">本周还可行动 ${s.ap} 次</strong><div class="dots">${[1,2,3].map(n=>`<i class="${n>s.ap?'off':''}"></i>`).join('')}</div></div><div>${btn('存档管理','settings','ghost small')} ${btn(s.week===24?'结束本周 · 迎接季末 →':'结束本周 · 进入下一周 →','next','primary')}</div></div>`;}
function oppCard(o){const locked=state.fans<o.gate||state.week<o.start||state.week>o.end;return `<article class="opportunity"><div class="opp-icon">${o.type==='music'?'♫':o.type==='book'?'▤':o.type==='screen'?'▷':'✧'}</div><div class="opp-body"><h4>${o.name}</h4><p>${o.story}</p><div class="tags"><span class="tag gold">第 ${o.end} 周截止</span>${o.tags.slice(0,3).map(t=>`<span class="tag">${t}</span>`).join('')}<span class="tag ${locked?'bad':'good'}">${state.week<o.start?'第'+o.start+'周开放':state.week>o.end?'窗口已结束':locked?'需'+num(o.gate)+'粉丝':'窗口触达 ×'+o.factor}</span></div></div>${btn('选作品 ↗','pick:'+o.id,'small',locked)}</article>`;}
function projectRows(){return state.projects.length?state.projects.map(p=>{const w=getWork(p.work),o=OPPS.find(o=>o.id===p.config.opp);return `<div class="project-row"><header><div><span class="eyebrow">${TYPES[w.type]}</span><h3>《${w.title}》</h3></div><span class="tag gold">${p.progress===p.steps?'等待发行':'制作中'}</span></header><p>已投入 ${money(p.cost)} · 完成度 ${p.quality} · ${o.name}${o.id!=='open'?' / 第'+(p.deadline||o.end)+'回合截止':''}</p><div class="bar"><i style="width:${p.progress/p.steps*100}%"></i></div><div class="project-controls"><small>制作进度 ${p.progress}/${p.steps}${state.week>(p.deadline||o.end)?' · 窗口已过，改为常规发行':''}</small><div>${btn('取消','cancel:'+p.id,'small ghost')}${btn(p.progress===p.steps?'正式发行 ↗':'推进制作 +1','project:'+p.id,'small primary',!state.ap)}</div></div></div>`;}).join(''):`<div class="empty"><span class="big">♬</span>还没有正在制作的作品<br>从一次机会开始，把记忆写成现实。</div>`;}
function library(){const works=WORKS.filter(w=>(filter==='all'||w.type===filter)&&(!query||w.title.includes(query)||w.tag.includes(query)));return `<div class="page-heading"><div><div class="eyebrow">THE EARTH ARCHIVE</div><h2>地球记忆</h2><p>32份来自旧世界的光。名作的潜力，需要你的能力来兑现。</p></div>${btn('选择发行机会','opps','small ghost')}</div><div class="filters">${[['all','全部作品'],['music','音乐 · 12'],['book','文学 · 10'],['screen','影视 · 10']].map(([k,l])=>btn(l,'filter:'+k,filter===k?'active':'')).join('')}<input id="search" type="search" aria-label="搜索作品或题材" placeholder="搜索作品 / 题材" value="${esc(query)}"></div><div class="work-grid">${works.map(w=>workCard(w,'open')).join('')}</div>${works.length?'':'<div class="empty">没有找到对应作品，试试其他关键词。</div>'}<div class="guide-line">作品仅展示名称、创作者信息与游戏策略，不包含原作歌词、正文、电影片段。全部收益与预算为游戏平衡数值。</div>`;}
function workCard(w,opp){const used=[...state.projects,...state.released].some(p=>p.work===w.id),locked=state.skills[w.type]<w.diff-25;return `<article class="work-card"><div class="cover ${w.type}"><span class="cover-num">EARTH ARCHIVE / ${String(WORKS.indexOf(w)+1).padStart(2,'0')}</span><span>${w.type==='music'?'♫':w.type==='book'?'▤':'▷'} &nbsp;${w.tag}</span></div><div class="work-body"><h3>${w.title}</h3><p>${w.desc}</p><div class="tags"><span class="tag">${TYPES[w.type]} / ${w.tag}</span><span class="tag ${used?'good':locked?'bad':'gold'}">${used?'已唤醒':locked?'需能力'+(w.diff-25):'可以尝试'}</span></div><div class="work-meta"><span>潜力 <b>${w.base}</b> · 难度 <b>${w.diff}</b></span><span>基础预算 <b>${money(w.cost)}</b></span><span>制作 <b>${w.steps}行动</b> · 发行 <b>1行动</b></span><span>记忆消耗 <b>${w.memory}</b></span></div>${btn(used?'查看作品档案':locked?'查看解锁条件':'制定创作方案 →','plan:'+w.id+':'+opp,'small '+(!used&&!locked?'primary':''))}</div></article>`;}
function projects(){const s=state;return `<div class="page-heading"><div><div class="eyebrow">YOUR CREATIVE FOOTPRINT</div><h2>我的作品</h2><p>每一次被听见，都有一段不为人知的制作过程。</p></div>${btn('开始新项目','pick:open','primary small')}</div><section class="panel"><div class="panel-head"><h3>正在制作</h3><small>最多2项并行 · 制作中提高能力仅影响未来立项</small></div>${projectRows()}</section><section class="panel"><div class="panel-head"><h3>已发行作品 · ${s.released.length}</h3><small>累计到账 ${money(s.released.reduce((a,p)=>a+p.total,0))}</small></div>${s.released.length?`<div class="table-wrap"><table><thead><tr><th>作品</th><th>发行周</th><th>完成度</th><th>新增粉丝</th><th>累计到账</th><th>投入回报</th><th>详情</th></tr></thead><tbody>${[...s.released].reverse().map(p=>`<tr><td>${getWork(p.work).title}<br><small>${TYPES[getWork(p.work).type]}</small></td><td>第${p.week}周</td><td>${p.quality}</td><td>+${num(p.fans)}</td><td>${money(p.total)}</td><td style="color:${p.total>=p.cost?'var(--green)':'var(--red)'}">${money(p.total-p.cost)}</td><td>${btn('复盘','record:'+p.work,'small ghost')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">你的第一部作品，还在未来等你。</div>'}</section><section class="panel"><div class="panel-head"><h3>成长曲线</h3><small>每回合粉丝快照</small></div>${chart()}</section>`;}
function chart(){const arr=state.history.slice(-24),max=Math.max(100,...arr.map(h=>h.fans));return `<svg viewBox="0 0 700 140" class="chart" role="img" aria-label="最近24周粉丝变化"><line x1="30" x2="690" y1="110" y2="110" stroke="#333b46"/><line x1="30" x2="690" y1="25" y2="25" stroke="#2b323b" stroke-dasharray="4 4"/><text x="0" y="22">${num(max)}</text><polyline points="${arr.map((h,i)=>(30+i*650/Math.max(1,arr.length-1))+','+(110-h.fans/max*85)).join(' ')}"/>${arr.filter((_,i)=>i%Math.max(1,Math.ceil(arr.length/8))===0).map(h=>`<text x="${30+arr.indexOf(h)*650/Math.max(1,arr.length-1)}" y="135">W${h.week}</text>`).join('')}</svg>`;}
function people(){return `<div class="page-heading"><div><div class="eyebrow">NO ONE SHINES ALONE</div><h2>同行之人</h2><p>他们有自己的判断。好作品和真诚合作，让信任慢慢发生。</p></div></div><div class="person-grid">${PEOPLE.map(p=>`<article class="panel person-card"><div class="portrait" style="color:${p.color};border-color:${p.color};background:${p.color}15">${p.name[0]}</div><div><h3>${p.name}</h3><small>${p.role}</small></div><p>${p.quote}</p>${meter('信任',state.relations[p.id])}<p>参与${TYPES[p.type]}项目时，提供 <b style="color:var(--gold)">+${Math.floor(state.relations[p.id]/10)}</b> 完成度。<br>成功交付该领域作品：信任 +6。</p>${btn('聊聊创作 · 1行动','social:'+p.id,'ghost',!state.ap)}</article>`).join('')}</div><section class="panel"><h3>合作与独立</h3><p class="muted" style="margin-top:12px">${state.studio?'星渡工作室运作中：每周固定支出 ¥1,300。团队建立时带来的能力成长会保留。':'你以项目制与伙伴合作。每周基础支出 ¥600，达到口碑40可为新项目选择联合制作。'}</p>${state.studio?btn('解散固定团队 · 恢复项目合作','dissolve','small ghost'):''}<p class="fineprint">${state.contractUntil>=state.week?'短期发行合约有效至第'+state.contractUntil+'周；期间立项作品收益保留80%，该项目后续分成不变。':'目前没有生效中的短期发行合约。'}</p></section>`;}
function story(ch){return `<div class="page-heading"><div><div class="eyebrow">A LIFE WORTH REMEMBERING</div><h2>星途手记</h2><p>这里记得你走过的路，也记得你做过的选择。</p></div>${btn('世界设定','world','ghost small')}</div><div class="grid-main"><section class="panel"><div class="timeline">${CHAPTERS.map((c,i)=>`<article style="opacity:${state.week<i*32+1?.4:1}"><span class="eyebrow">CHAPTER ${c[0]} · ${c[2]}</span><h3>${c[1]}</h3><p>${c[3]}</p>${state.week>=i*32+1&&state.week<(i+1)*32+1?'<span class="tag gold">正在书写</span>':''}</article>`).join('')}</div>${age(state)>=60?btn('查看晚年与作品遗产','ending','primary'):''}</section><section class="panel"><div class="panel-head"><h3>近期手记</h3><small>保留最近100条</small></div>${state.logs.slice(0,20).map(l=>`<article class="log"><small>第 ${l.week} 周</small><strong>${esc(l.title)}</strong><p>${esc(l.text)}</p></article>`).join('')||'<p class="muted">你醒来的这一天，海岚下了一场雨。</p>'}</section></div>`;}
function showModal(title,body,foot='',wide=false){$('modal').innerHTML=`<section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="modal-head"><h2>${title}</h2>${modalKind==='intro'?'':btn('×','close','close')}</header><div class="modal-body">${body}</div>${foot?'<footer class="modal-foot">'+foot+'</footer>':''}</section>`;$('modal').hidden=false;document.body.style.overflow='hidden';setTimeout(()=>$('modal').querySelector('button,input,select')?.focus(),20);}
function closeModal(){if(modalKind==='intro')return;$('modal').hidden=true;$('modal').innerHTML='';document.body.style.overflow='';modalKind='';}
function intro(){modalKind='intro';const dots=`<small>序章 ${introStep+1} / 3</small>`;if(introStep===0)showModal('序章 · 一个没有那些作品的世界',`<div class="intro"><div class="eyebrow">PARALLEL STARLIGHT</div><h1>如果那些名作，<br>只有你记得。</h1><p>昨夜，你还是地球上一名替别人打磨作品的幕后创作者。一次意外后，你在海岚市一间出租屋醒来，手机里的身份变成了一个23岁的无名新人。</p><p>这里叫<span class="highlight">澜星</span>。人们讲熟悉的语言，拥有流媒体、小说网站与电影院，却没有你记忆里的任何一首歌、任何一本书。</p><p>澜星有自己的创作者和成熟产业，并不缺少作品。你的优势是另一个世界的记忆；你的难题，是让这些故事在这里真正成立。</p></div>`,dots+btn('我想知道接下来怎么做 →','intro-next','primary'));else if(introStep===1)showModal('序章 · 记忆不是一张万能通行证',`<div class="intro"><h2>让好作品，遇见对的时机。</h2><div class="intro-cards"><article><b>01 / 先看机会</b><p>毕业季需要青春表达，书展欢迎深度叙事。选作品前，先读主题与截止周。</p></article><article><b>02 / 把记忆做出来</b><p>能力决定能否立项；预算、合作和本土化决定完成度。每周只有3次行动。</p></article><article><b>03 / 交给这个世界</b><p>完成制作后再发行。赚取首发与8周长尾收益，积累粉丝、口碑和伙伴。</p></article></div><p>你从<span class="highlight">23岁走到70岁</span>，每4个经营回合推进1个生涯年。你不必横跨所有领域，也没有唯一正确路线。可以成为歌手、畅销作者、制片人，或者慢慢组建自己的工作室。</p><p>失败不会删档。错过窗口可以常规发行，资金不足可以接商单。所有项目结果都有数值复盘。</p></div>`,btn('← 上一步','intro-back','ghost')+btn('建立我的身份 →','intro-next','primary'));else showModal('序章 · 给第二人生一个名字',`<div class="intro"><div class="eyebrow">YOUR NEW IDENTITY</div><h2 style="margin:12px 0 22px">海岚，欢迎你。</h2><label class="field"><span>你在这个世界的名字</span><input id="player-name" maxlength="12" value="陆星河" placeholder="输入名字" style="width:100%"></label><p>你在地球时，最熟悉哪一种工作？</p><div class="origin-grid">${[['music','音乐幕后','音乐44 / 文学32 / 影视25'],['book','文字编辑','音乐32 / 文学44 / 影视25'],['screen','片场助理','音乐32 / 文学32 / 影视37']].map(([id,t,d])=>`<button data-act="origin:${id}" class="${origin===id?'selected':''}">${t}<span>${d}</span></button>`).join('')}</div><div class="guide-line">开局：¥12,000 · 精力100 · 记忆85 · 口碑25 · 粉丝0<br>每周3行动，生活支出¥600。起步身份只改变能力，不锁定路线。</div></div>`,btn('← 上一步','intro-back','ghost')+btn('从第1周开始我的星途 →','start','primary'));}
function pick(opp='open'){modalKind='pick';const o=OPPS.find(o=>o.id===opp);const list=WORKS.filter(w=>(o.type==='all'||o.type===w.type)&&![...state.projects,...state.released].some(p=>p.work===w.id)).sort((a,b)=>(o.tags.includes(b.tag)?1:0)-(o.tags.includes(a.tag)?1:0));showModal(o.name,`<p class="muted">${o.story}</p><div class="progress-steps"><span>1 选择作品</span><span>2 制作方案</span><span>3 推进制作</span><span>4 正式发行</span></div><div class="guide-line">${o.id==='open'?'常规发行无截止时间。':'第'+o.end+'周结束前必须完成制作并发行。'} 前列作品优先匹配本次主题；低门槛不代表最终效果一定最好。</div><div class="work-grid">${list.map(w=>workCard(w,opp)).join('')}</div>`,btn('返回总览','close','ghost'),true);}
function plan(id,opp='open',preserve=false){modalKind='plan';const w=getWork(id);if(!preserve)draft={work:id,opp,method:'lean',channel:'indie',adapt:true};const e=estimate(state,w,draft),err=gate(state,w,draft),used=state.released.find(p=>p.work===id);if(used){showRecord(id);return;}const remain=(e.steps+1)-1,earliest=state.week+Math.max(0,Math.ceil((remain-Math.max(0,state.ap-1))/3));showModal('创作方案 · '+w.title,`<div class="selection-layout"><div><div class="tags"><span class="tag gold">${TYPES[w.type]} · ${w.tag}</span><span class="tag">地球原作：${w.credit}</span></div><p class="story-text" style="font-size:16px;margin:17px 0">${w.desc}</p><label class="field"><span>发行机会 · 作品在发行时接受窗口检查</span><select id="plan-opp">${availableOpps(state).filter(o=>o.type==='all'||o.type===w.type).map(o=>`<option value="${o.id}" ${draft.opp===o.id?'selected':''}>${o.name}${o.id!=='open'?' · 第'+o.end+'周截止':''}</option>`).join('')}</select></label><label class="field"><span>制作方式 · 费用在立项时一次扣除</span><select id="plan-method">${METHODS.map(m=>`<option value="${m.id}" ${draft.method===m.id?'selected':''}>${m.name}${m.id==='partner'?' · 口碑40':''}</option>`).join('')}</select><small>${e.m.text}</small></label><label class="field"><span>发行渠道 · 成本已计入分成</span><select id="plan-channel">${CHANNELS.map(c=>`<option value="${c.id}" ${draft.channel===c.id?'selected':''}>${c.name}</option>`).join('')}</select><small>${e.c.text}</small></label><label class="field"><span>文化转译 · 重写地名、历史与生活细节</span><select id="plan-adapt"><option value="yes" ${draft.adapt?'selected':''}>本土化重构 · 预算 +15%，完成度 +8</option><option value="no" ${!draft.adapt?'selected':''}>保留地球语境 · 完成度 -${['古典','武侠','现实','城市','神话'].includes(w.tag)?14:6}</option></select></label><div class="guide-line">${e.fit===100?'主题高度匹配：'+w.tag+'正是这次企划需要的表达。':e.fit===45?'主题不匹配：这部作品可以发行，但本窗口触达将乘以0.65。':'自主发行：依赖完成度和渠道，不享受主题加成。'}${e.used?' 近5周同题材作品'+e.used+'部，触达系数为'+e.reach.toFixed(2)+'。':''}</div></div><aside class="estimate"><div class="eyebrow">立项预演</div><div class="report-banner" style="padding:12px 0"><span class="score" style="font-size:48px">${e.quality}</span><div class="muted">预计完成度 / 100</div></div>${[['总预算',money(e.cost)],['制作 + 发行',e.steps+' + 1 行动'],['记忆消耗',w.memory+' 点'],['当前能力 / 立项门槛',state.skills[w.type]+' / '+Math.max(0,w.diff-25)],['最快发行时间','第 '+earliest+' 周'],['预计新增粉丝','约 '+num(e.fans)],['首发到账预估',money(e.gross)],['项目净收益预估',money(e.gross-e.cost)],['最终收益分成',Math.round(e.share*100)+'%']].map(([k,v])=>`<div class="estimate-row"><span>${k}</span><strong>${v}</strong></div>`).join('')}<p class="fineprint">最快时间仅计算行动，不含休息和其他项目。收益预估按当前粉丝与窗口计算；实际发行时重新核算。完成度与收益分成在立项时锁定。</p>${earliest>e.o.end?'<p class="warning">最快也会错过本窗口，建议更换机会或作品。</p>':''}${err?'<p class="warning">'+err+'</p>':''}</aside></div>`,btn('← 返回选作品','pick:'+draft.opp,'ghost')+btn('确认立项 · '+money(e.cost),'begin','primary',!!err),true);}
function showReport(r,record=false){modalKind='report';showModal(record?'作品复盘 · '+r.title:'作品发行 · 第一阵回声',`<div class="report-banner"><div class="eyebrow">${r.quality>=75?'A MOMENT TO REMEMBER':'EVERY WORK IS A NEW BEGINNING'}</div><h2 style="margin:16px 0">《${r.title}》</h2><div class="score">${r.quality}</div><span class="muted">最终完成度</span></div><div class="report-metrics"><div><strong>+${num(r.fans)}</strong><small>新粉丝</small></div><div><strong>${money(r.income)}</strong><small>首发到账</small></div><div><strong>${r.rep>=0?'+':''}${r.rep}</strong><small>行业口碑</small></div></div><p class="story-text" style="font-size:16px;margin:22px 0">${r.quality>=75?'作品发布后，评论区里有人写：“不知道为什么，这个故事像是早就等着我。”合作者把这条评论截下来，发给了你。':r.quality>=60?'第一批反馈到了。有人记住了故事，也有人指出制作里不够成熟的地方。它没有一夜席卷全城，却让陌生人开始认真听你说话。':'故事的潜力被看见了，但制作上的短板也很明显。这一次的回声提醒你：记忆只是开始，表达还要打磨。'}</p><div class="estimate-row"><span>已付制作成本</span><strong>${money(r.cost)}</strong></div><div class="estimate-row"><span>首发净收益</span><strong>${money(r.income-r.cost)}</strong></div><div class="estimate-row"><span>${r.platforms?'按当前播放估算下回合分成':'下周长尾收益 / 共持续8周'}</span><strong>${money(r.platforms?Object.values(r.platforms).reduce((n,m)=>n+m.current,0)*.004*r.share:r.royalty)}${r.platforms?' / 随播放变化':' / 每周衰减14%'}</strong></div><div class="guide-line">${r.expired?'错过原定窗口，已按常规发行结算。':r.fit===100?'主题与机会匹配，享受额外触达。':r.fit===45?'题材与窗口不匹配，触达受损。':'常规题材匹配，无额外主题加成。'} 收益分成 ${Math.round(r.share*100)}%。${r.used?'近期同题材发行导致受众疲劳。':''}</div>`,btn('收好这份回声 →','close','primary'));}
function showRecord(id){const p=state.released.find(p=>p.work===id);if(p)showReport({...p,title:getWork(p.work).title},true);}
function showEvent(){const e=pendingEvent(state);if(!e){notify('目前没有待处理来信');return;}modalKind='event';showModal(e.title,`<div class="eyebrow">第 ${e.week} 周来信 · ${e.who}</div><p class="story-text">${!state.released.length&&e.week===4?'见夏听说你正在准备自己的第一部作品，带来了一份新人孵化邀约。小厂牌愿意提前承担一点风险，以换取接下来一段时间的收益分成。你翻到最后一页，先看了期限。':!state.released.length&&e.week===8?'你在同行交流里谈到了几种构思，跨度让人意外。大家希望看到具体的创作过程，而不是一个漂亮的提案。下一次开口之前，你打算怎样准备？':e.text}</p>${e.options.map((o,i)=>`<button class="choice" data-act="choice:${i}"><strong>${o.label} ↗</strong><small>${o.detail}</small></button>`).join('')}`,`<small>选择会写入手记；可先准备资源再回复。</small>${btn('稍后回复','close','ghost')}`);}
function showEnding(){modalKind='ending';const result=state.seasonResult||{ending:ending(state),fans:state.fans,rep:state.rep,count:state.released.length,marks:state.marks};const [rawTitle,rawDesc]=result.ending;const title=esc(rawTitle),desc=esc(rawDesc);showModal('晚年 · 你的传奇档案',`<div class="intro" style="text-align:center"><div class="eyebrow">SEASON ONE / THE EPILOGUE</div><h1>${title}</h1><p>${desc}</p><div class="report-metrics"><div><strong>${Number(result.count)}</strong><small>已发行作品</small></div><div><strong>${num(Number(result.fans))}</strong><small>作品粉丝</small></div><div><strong>${Number(result.rep)}</strong><small>行业口碑</small></div></div><p>这份答卷保留第24周结束时的成绩，继续经营不会改写第一季。</p><div class="tags" style="justify-content:center">${(result.marks||[]).map(m=>`<span class="tag gold">${esc(m)}</span>`).join('')}</div><p>未完项目与已有版税会保留。继续后进入自由创作，常规发行永久开放。</p></div>`,btn('回到手记','ending-close','ghost')+btn('继续自由创作 →','continue','primary'));}
function world(){modalKind='world';showModal('世界档案 · 澜星与地球',`<div class="help-prose"><div class="eyebrow">WORLD BIBLE / 01</div><h3>相似的生活，不同的文化史</h3><p>澜星与地球有相似的语言、情感、现代技术和市场结构；历史人物、城市与文化作品沿着不同的路径发展。海岚是这里的沿海文娱中心，栀夏是音乐平台，灯塔是文学平台，流光影业负责影视发行。</p><p>这个世界有认真工作的艺术家、成熟的观众与自己的经典。没有的只是地球上那些作品，因此你拥有内容上的先发优势，却不能靠一份梗概自动赢过整个行业。</p><h3>你是谁，为什么记得</h3><p>你曾是地球的幕后创作者，同时长期整理影音与阅读笔记。穿越使这份记忆变得异常清晰，但精细回想仍消耗心力。原身23岁，离开艺术学校后以临时项目维生，没有债务，只有¥12,000存款和几位泛泛之交。</p><p>金手指只能帮助回忆结构、旋律和核心表达，不会凭空提供演唱、写作、摄制能力。工作需要你与澜星伙伴重新完成。因此“记忆清晰度”和“五项制作能力与独立演唱能力”是两套独立数值。</p><h3>为什么从小作品开始</h3><p>小舞台不要求明星履历，连载平台允许新人投稿，低成本短片接受新团队。大平台和联合投资则需要口碑背书。你的第一件事是交付一个完整作品，然后逐渐获得更大的制作权限。</p><h3>作品转译，而非照抄世界</h3><p>不同文化史会让原作的地名、历史与风俗失去语境。本土化选项把这些背景转译为澜星生活；人物的动机和情绪仍然保留。游戏只模拟作品策略，不提供原作内容。</p><h3>第一季的时间尺度</h3><p>24周是压缩的经营赛季。影视项目代表小体量改编、试播或概念验证，并不等同于现实工业大片的完整制作周期。金钱、销量、粉丝和预算均为虚构平衡单位。</p><h3>叙事参考</h3><p>参考文娱网文常见的“能力兑现—得到机会—作品检验—跨领域成长”结构；剧情、人物与规则为本游戏原创。参考书目：<a href="https://book.qidian.com/honor/1022282526" target="_blank" rel="noopener">《全职艺术家》</a>、<a href="https://book.qidian.com/booklist/detail/644736/" target="_blank" rel="noopener">《溯流文艺时代》相关书目介绍</a>。</p></div>`,btn('回到我的故事','close','primary'));}
function help(){modalKind='help';showModal('玩法手册 · 每一个数字都有来处',`<div class="help-prose"><h3>第一次怎么玩</h3><p>1. 在总览选「天台新人之夜」，尝试《成都》《起风了》或《平凡之路》。也可以从「灯塔连载征稿」走文字路线。<br>2. 确认本土化、制作方式与渠道，检查预算、主题匹配和最早发行周。<br>3. 立项消耗1行动、15精力和作品要求的记忆，并算作第1次制作。继续推进直到进度满。<br>4. 再消耗1行动发行，查看首发结算；结束本周获得恢复与长尾收益。</p><h3>资源与恢复</h3><div class="table-wrap"><table><tr><th>数值</th><th>用途与规则</th></tr><tr><td>资金</td><td>立项付全款；每周生活¥600，工作室另¥700</td></tr><tr><td>行动</td><td>每周3点，不累积；制作、发行、训练等各1点</td></tr><tr><td>精力 / 100</td><td>制作15、商单18、训练12、社交10、记忆整理8；休息+45，每周+30</td></tr><tr><td>记忆 / 100</td><td>立项扣作品记忆值；整理+30，休息+5，每周+8</td></tr><tr><td>五项制作能力 / 100</td><td>立项需达到难度−25；训练¥800获得+7，继续制作+1</td></tr><tr><td>伙伴信任 / 100</td><td>每10信任给该领域+1完成度；聊天+12，发行+6</td></tr><tr><td>口碑 / 100</td><td>完成度≥75加6，≥60加3，否则减3；渠道与合作的门槛</td></tr><tr><td>粉丝</td><td>发行与剧情增加；解锁限定机会，也提升新作触达</td></tr></table></div><h3>完成度如何计算</h3><p>完成度 = 潜力×0.55 + 对应能力×0.42 − 难度×0.2 + 伙伴信任整十加成 + 制作方式加成 + 文化转译加成，四舍五入后限制在20—99。<br>独立制作+0；精制+12但预算×1.7、多1制作行动；联合制作+7、自付35%预算、收入保留45%。本土化预算+15%、完成度+8；未本土化按题材扣6或14。</p><p>完成度与分成在立项时锁定，之后的训练影响下一部作品。不会通过刷新页面随机改变成绩。</p><h3>发行与收益如何计算</h3><p>主题匹配系数：匹配1.15、不匹配0.65、常规1。窗口系数按机会卡展示；过期则整体改为常规发行。渠道触达为1 / 1.55 / 2.3，收益保留比例为100% / 80% / 65%。</p><p>粉丝增量 = 领域基数 × (完成度÷60)² × 渠道触达 × 窗口系数 × 主题系数 × 题材疲劳 × (1+√现有粉丝÷170)。音乐/文学/影视基数分别为750/1000/3500。</p><p>首发到账 = 领域收入基数 × (完成度÷70)² × 渠道触达 × 窗口系数 × 主题系数 × 题材疲劳 × 最终分成。收入基数分别为¥9,500 / ¥16,000 / ¥90,000。分成 = 制作方式分成 × 渠道分成 × 立项时短期合约分成。</p><p>近5周每发行1部同题材作品，新作触达降低16%，最低60%。首发后每周版税为首发到账的7.5%，随后每周衰减14%，最多结算8周。</p><h3>时间、失败与退出</h3><p>机会要求在截止周结束前发行。过期不销毁项目，自动转为常规发行。取消项目不退钱，但会返还一半立项记忆。资金不足支付周支出时自动获得生活补助，资金归零、口碑−3；不会死档。</p><p>剧情不会抢占你的常规行动；只有明确标注的选项才消耗资源。可稍后回复，未回复来信按先后顺序保留到第24周。结束第24周进入结局；未完项目可以带到自由创作。</p><h3>六种第一季结果</h3><p>按优先级判定：时代的回声（粉丝≥35,000、口碑≥65、三领域均发行）→ 聚光灯下的名字（粉丝≥18,000、口碑≥55）→ 慢慢发光的人（口碑≥65、至少3部作品）→ 独立制片人（资金≥150,000）→ 故事才刚开始（至少1部作品）→ 未寄出的作品。</p><h3>存档</h3><p>每次行动后自动保存到当前浏览器。存档不跨设备同步；可在存档管理导出文件，之后导入继续。清除浏览器数据会移除本地进度。</p></div>`,btn('明白了，继续创作','close','primary'));}
function settings(){modalKind='settings';showModal('存档与旅程',`<p class="muted">${saveOK?'当前进度已自动保存在本浏览器。':'浏览器存储不可用，请导出存档以免丢失进度。'} 导出文件可跨浏览器或设备迁移。</p><div class="intro-cards"><article><b>第 ${state.week} 周</b><p>${esc(state.name)} · ${rank()}</p></article><article><b>${state.released.length} 部作品</b><p>${num(state.fans)} 位粉丝</p></article><article><b>${money(state.money)}</b><p>口碑 ${state.rep} / 100</p></article></div><div style="display:flex;gap:10px;flex-wrap:wrap">${btn('导出存档','export','primary')}${btn('导入存档','import','ghost')}${btn('重新开始','reset','danger ghost')}</div><input id="import-file" type="file" accept="application/json,.json" hidden>`,btn('回到游戏','close','ghost'));}
function next(){modalKind='next';const ev=pendingEvent(state);showModal(state.week===24?'告别第一季':'结束第 '+state.week+' 周',`<p class="story-text" style="font-size:16px">${state.ap?'本周还剩 '+state.ap+' 次行动，进入下一周后不会保留。':'本周的努力已经留下痕迹。给自己一点时间，让新的机会到来。'}</p><div class="guide-line">下一周：3行动 · 精力+30 · 记忆+8<br>扣除固定支出 ${money(600+(state.studio?700:0))}，结算已有作品长尾收益。</div>${ev?'<p class="warning">还有未回复的来信：'+ev.title+'。'+(state.week===24?'季末后将关闭本季剧情选项。':'下一周仍可处理。')+'</p>':''}${state.projects.length&&state.week===24?'<p class="muted">未完成项目会保留，季末后可以继续自由创作。</p>':''}`,btn('再想想','close','ghost')+btn('确认进入下一周 →','next-confirm','primary'));}
function dispatch(act){const [a,b,c]=act.split(':');if(a==='tab'){tab=b;render();window.scrollTo(0,0);}else if(a==='close')closeModal();else if(a==='world')world();else if(a==='help')help();else if(a==='settings')settings();else if(a==='filter'){filter=b;render();}else if(a==='intro-next'){introStep++;intro();}else if(a==='intro-back'){introStep--;intro();}else if(a==='origin'){const n=$('player-name').value;origin=b;intro();$('player-name').value=n;}else if(a==='start'){const name=$('player-name').value.trim()||'陆星河';state=fresh(name,origin);log(state,'在海岚醒来','身上只有¥12,000，脑海里却装着一整个世界。');save();modalKind='';closeModal();render();notify('先读本周机会，再选择适合的第一部作品。');}else if(a==='pick')pick(b);else if(a==='plan')plan(b,c);else if(a==='opps'){modalKind='opps';showModal('发行日历 · 提前安排下一部作品',scheduleOpps(state).map(oppCard).join(''));}else if(a==='begin'){if(doAction(()=>begin(state,getWork(draft.work),draft),'项目已立项，继续制作后即可发行。'))closeModal();}else if(a==='routine')doAction(()=>routine(state,b));else if(a==='social')doAction(()=>routine(state,'social',b),'信任来自一次次认真交谈。');else if(a==='train'){modalKind='train';showModal('专业训练',`<p class="muted">每次消耗1行动、¥800、12精力。对应能力+7，上限100。</p>${Object.entries(TYPES).map(([k,v])=>btn(v+'训练 <small>当前'+state.skills[k]+' → '+clamp(state.skills[k]+7)+'</small>','train-do:'+k,'choice',state.skills[k]>=100)).join('')}`);}else if(a==='train-do'){if(doAction(()=>routine(state,'train',b),'训练完成，能力 +7'))closeModal();}else if(a==='project'){const p=state.projects.find(p=>p.id===b);if(!p)return;if(p.progress===p.steps){if(doAction(()=>release(state,b)))showReport(state.lastReport);}else doAction(()=>workProject(state,b),'制作向前推进了一步。');}else if(a==='record')showRecord(b);else if(a==='cancel'){modalKind='cancel';const p=state.projects.find(p=>p.id===b);showModal('暂停这次创作？',`<p class="story-text">取消《${getWork(p.work).title}》会失去已投入的${money(p.cost)}与制作进度，返还一半记忆消耗。之后可以重新立项。</p>`,btn('继续制作','close','ghost')+btn('确认取消项目','cancel-confirm:'+b,'danger'));}else if(a==='cancel-confirm'){const p=state.projects.find(p=>p.id===b);state.memory=clamp(state.memory+Math.floor(getWork(p.work).memory/2));state.projects=state.projects.filter(x=>x.id!==b);log(state,'暂别一个项目','取消《'+getWork(p.work).title+'》，已付成本不退。');save();closeModal();render();}else if(a==='event')showEvent();else if(a==='choice'){if(doAction(()=>chooseEvent(state,Number(b)))){closeModal();notify('这个决定，已经写进你的故事。');}}else if(a==='next')next();else if(a==='next-confirm'){if(doAction(()=>nextWeek(state))){closeModal();if(state.ended&&!state.continued)showEnding();else if(pendingEvent(state))showEvent();}}else if(a==='ending')showEnding();else if(a==='ending-close'){closeModal();tab='story';render();}else if(a==='continue'){state.continued=true;save();closeModal();render();}else if(a==='dissolve'){modalKind='dissolve';showModal('回到项目合作',`<p class="story-text">解散固定团队后，每周不再支付¥700团队支出。已经获得的专业成长保留，伙伴仍可参与单个项目。</p>`,btn('保留工作室','close','ghost')+btn('确认恢复项目合作','dissolve-confirm','primary'));}else if(a==='dissolve-confirm'){state.studio=false;log(state,'回到项目合作','团队不再固定驻场，每周支出恢复¥600。');save();closeModal();render();}else if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='杀穿娱乐圈-第'+state.week+'周存档.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('存档已导出。');}else if(a==='import')$('import-file').click();else if(a==='reset'){modalKind='reset';showModal('重新开始一段人生',`<p class="story-text">当前浏览器的进度会被新旅程替换。建议先导出存档，保留这一次的作品和故事。</p>`,btn('保留当前旅程','close','ghost')+btn('导出当前存档','export','ghost')+btn('确认重新开始','reset-confirm','danger'));}else if(a==='reset-confirm'){state=fresh();introStep=0;origin='music';tab='home';render();intro();}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)dispatch(b.dataset.act);});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();$('search').focus();$('search').setSelectionRange(pos,pos);}});
document.addEventListener('change',async e=>{if(e.target.id.startsWith('plan-')){const key=e.target.id.slice(5);draft[key]=key==='adapt'?e.target.value==='yes':e.target.value;const focus=e.target.id;plan(draft.work,draft.opp,true);$(focus)?.focus();}if(e.target.id==='import-file'&&e.target.files[0]){try{if(e.target.files[0].size>5000000)throw Error();const v=migrateSave(JSON.parse(await e.target.files[0].text()));if(!validSave(v))throw Error();window.importCandidate=v;modalKind='import-confirm';showModal('导入这段旅程？',`<p class="story-text">${esc(v.name)} · 第${v.week}周 · ${v.released.length}部作品。导入会替换当前浏览器中的进度。</p>`,btn('取消','close','ghost')+btn('确认导入','import-confirm','primary'));}catch(err){notify('存档格式无效或版本不兼容，当前进度未改变。');}}});
document.addEventListener('click',e=>{if(e.target.closest('[data-act="import-confirm"]')){state=window.importCandidate;save();closeModal();render();notify('存档已导入。');}});
document.addEventListener('keydown',e=>{if($('modal').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const nodes=[...$('modal').querySelectorAll('button:not(:disabled),input:not([hidden]),select,a[href]')];if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();if(!hasSave)intro();

CHAPTERS.splice(0,6,['01','无人知晓的名字','23—30岁','从街角舞台开始，先让第一批陌生人记住你的作品。'],['02','世界在舞台之外','31—38岁','国内比赛、明星邀歌与海外市场，开始交汇成你的事业。'],['03','世界听见的那一夜','39—46岁','走进世界之声。对手不是陪衬，你要用真正的现场完成每一次晋级。'],['04','从名字到时代','47—54岁','电影、剧集和综艺继续开拓，你开始决定把资源交给谁。'],['05','光照见后来的人','55—62岁','代表作经得起时间，人情也开始照亮年轻人的第一步。'],['06','留下的，不止一个名字','63—70岁','慢慢交回聚光灯。那些作品、冠军与被帮助过的人，将替你继续讲述。']);
let libraryPage=1,languageFilter='all',commissionContext=null,pickPage=1,pickQuery='',selectedOpp='open';
const counts=()=>Object.fromEntries(Object.keys(TYPES).map(t=>[t,WORKS.filter(w=>w.type===t).length]));
const totalFavors=s=>Object.values(s.favors).reduce((a,b)=>a+b,0);
function displayUnits(text){return text.replace(/第\s*(\d+)\s*周/g,'第$1回合').replace(/(\d+)\s*周/g,'$1回合').replace(/每周/g,'每回合').replace(/本周/g,'本回合').replace(/下一周/g,'下一回合').replace(/下周/g,'下回合');}
const originalRender=render;render=function(){originalRender();const app=$('app');app.innerHTML=displayUnits(app.innerHTML);};
const originalShowModal=showModal;showModal=function(title,body,foot='',wide=false){originalShowModal(displayUnits(title),displayUnits(body),displayUnits(foot),wide);};
const originalHome=home;home=function(ch){let html=originalHome(ch);const invite=COMMISSIONS.find(d=>!commissionRequirement(state,d)),challenge=activeChallenge(state),offer=offeredChallenge(state),contest=activeContest(state);let card=`<section class="career-strip"><div><span class="eyebrow">一生的刻度</span><strong>${age(state)} 岁 <small>/ 70岁</small></strong><div class="bar"><i style="width:${Math.min(100,(age(state)-23)/47*100)}%"></i></div></div><p>每4个经营回合推进1个生涯年。<br>60岁起可退休，70岁自动留下生涯档案。</p><div>${btn('世界舞台','tab:stage','small primary')} ${btn('查看榜单','tab:market','small ghost')}</div></section>`;
 if(contest){const d=COMPETITIONS.find(d=>d.id===contest.id);card+=`<div class="story-notice"><div><span class="eyebrow">正在参赛 · ${contest.round+1}/${d.rounds.length}</span><h3>${d.title}</h3><p>${d.rounds[contest.round].name} · 第${contest.due}回合前上台</p></div>${btn('走进赛场','tab:stage','primary small')}</div>`;}
 if(challenge||offer){const d=CHALLENGES.find(d=>d.id===challenge?.id)||offer;card+=`<div class="story-notice conflict"><div><span class="eyebrow">${challenge?'发行正受到影响':'行业风波待回应'}</span><h3>${d.title}</h3><p>${challenge?'第'+challenge.due+'回合前交付达标新作；目标完成度'+challenge.threshold:'具体选择决定是暂退、公开验证，还是请伙伴出面。'}</p></div>${btn('查看风波','challenge:'+d.id,'small primary')}</div>`;}
 if(invite||state.commissions.some(c=>c.status==='active'))card+=`<div class="story-notice"><div><span class="eyebrow">不是一锤子买卖</span><h3>${invite?STARS.find(s=>s.id===invite.star).name+'发来邀歌':'有邀歌正在等待你的作品'}</h3><p>按歌手的处境与声线选歌。兑现承诺之后，才有人品和人情。</p></div>${btn('行业人脉','tab:people','small primary')}</div>`;

function marketPage(){state.released.forEach(p=>addMarket(state,p));const own=state.released.filter(p=>getWork(p.work).type===marketType&&state.week-p.week<=8);const peers=[{name:'《城市另一端》',who:'诺音工作室',score:94},{name:'《无声来信》',who:'曜川制作',score:89},{name:'《漫长的夏天》',who:'白鲸计划',score:84},{name:'《明日航线》',who:'星野创作社',score:79},{name:'《暖色夜晚》',who:'恒曜娱乐',score:74},{name:'《沿途》',who:'独立联合',score:69},{name:'《回响之间》',who:'蓝岸制作',score:64},{name:'《星港信号》',who:'晴空企划',score:59}].map((p,i)=>({...p,score:p.score+Math.sin(state.week+i)*2}));const rows=[...peers,...own.map(p=>({name:'《'+getWork(p.work).title+'》',who:state.name,score:marketScore(state,p),own:true,p}))].sort((a,b)=>b.score-a.score);return `<div class="page-heading"><div><div class="eyebrow">THE AUDIENCE HAS A VOICE</div><h2>作品走进市场之后</h2><p>歌曲打榜、电影票房、剧集热度与综艺收视，各有自己的回声。</p></div><span class="week-chip">第${state.week}回合榜单</span></div><div class="filters">${Object.entries(TYPES).map(([k,v])=>btn(v+'榜','market-type:'+k,marketType===k?'active':'')).join('')}</div><div class="grid-main"><section class="panel"><div class="panel-head"><h3>${TYPES[marketType]}表现榜</h3><small>公开模拟榜 · 同领域竞争</small></div>${rows.slice(0,14).map((r,i)=>`<div class="chart-row ${r.own?'your-row':''}"><span class="chart-rank">${String(i+1).padStart(2,'0')}</span><div><strong>${esc(r.name)}</strong><small>${esc(r.who)} ${r.own?'· 你的作品':''}</small></div><div class="chart-value"><strong>${r.score.toFixed(1)}</strong><small>${r.p?metricValue(r.p):'综合市场分'}</small></div></div>`).join('')}<p class="fineprint">本土榜综合分=完成度×0.78+受众规模（最多18分）−发行后每回合3.5分。发行8回合后退出当期榜；作品页永久保存累计成绩。同行作品名与榜单全部为模拟。</p></section><aside><section class="panel"><h3>海外竞争，不是换一个榜名</h3><p class="fineprint">国际影响力 ${state.influence}/100 · 海外粉丝 ${num(state.internationalFans)}</p>${OVERSEAS_RIVALS.filter(r=>r.domain===marketType).map(r=>`<p class="story-text" style="font-size:14px">${r.name}<br><small>${r.region} · 对标强度${r.strength}</small></p><p class="muted">${r.desc}</p>`).join('')}</section><section class="panel"><h3>哪些作品可以出海</h3><p class="fineprint">本土粉丝2000、完成度60即可尝试。每部作品可进行一次海外发行；翻译、本地宣传和合作分成将影响表现。</p></section></aside></div><section class="panel"><div class="panel-head"><h3>你的市场成绩单</h3><small>展示${TYPES[marketType]}全部已发行作品</small></div><div class="table-wrap"><table><thead><tr><th>作品</th><th>${metricLabel(marketType)}</th><th>最好榜位</th><th>海外</th><th>发行</th></tr></thead><tbody>${state.released.filter(p=>getWork(p.work).type===marketType).slice().reverse().map(p=>`<tr><td>${esc(getWork(p.work).title)}</td><td>${metricValue(p)}</td><td>#${p.market.bestRank}</td><td>${p.market.overseas?num(p.market.overseas.fans)+'粉丝':'未发行'}</td><td>${p.market.overseas?'<span class="tag good">已出海</span>':btn('海外方案','overseas:'+p.work,'small primary')}</td></tr>`).join('')||'<tr><td colspan="5">这一领域还没有已发行作品。</td></tr>'}</tbody></table></div></section>`;}
function overseasModal(id){const w=getWork(id),p=state.released.find(p=>p.work===id),base={music:8000,book:12000,screen:80000,tv:50000,show:35000}[w.type];modalKind='overseas';showModal('出海方案 · '+w.title,`<p class="story-text" style="font-size:16px">${w.language||'中文'}作品同样需要找到具体受众。保留原语言有成本优势；本地化并不意味着抹掉原作，而是重做字幕、文化说明与宣传定位。</p>${[['raw','保留原语言，轻量发行',.6,'表现分−14；保留100%收益，先测试小众听众。'],['localized','专业翻译与本地宣传',1,'表现分+8；保留100%收益，以当地观众能理解的方式推广。'],['partner','与当地团队联合发行',.45,'表现分+3；保留45%收益，需要3000海外粉丝或任一明星信任18引荐。']].map(([k,t,c,d])=>btn(`<strong>${t} · ${money(base*c)}</strong><small>${d}</small>`,'export-work:'+id+':'+k,'choice')).join('')}<p class="fineprint">投入和收益与国内发行分开。成功与否按公开表现分对比海外对手，失败也保留实际获得的收入与听众。</p>`,btn('再准备一下','close','ghost'));}
const oldReport=showReport;showReport=function(r,record=false){oldReport(r,record);let extra='';if(r.market&&!r.platforms)extra+=`<div class="brief-panel"><h3>市场回声</h3><p>当期榜位 #${r.market.rank} · 最好榜位 #${r.market.bestRank}${r.work?' · '+metricLabel(getWork(r.work).type)+' '+metricValue(r):''}</p></div>`;if(r.commission)extra+=`<div class="brief-panel"><span class="eyebrow">${r.commission.name}的回信 · 额外酬劳${money(r.commission.fee)}</span><p>${esc(r.commission.text)}</p></div>`;if(r.challenge)extra+=`<div class="brief-panel ${r.challenge.won?'victory':''}"><h3>${r.challenge.won?'实力反转':'回应仍在继续'}</h3><p>${esc(r.challenge.text)}</p></div>`;if(extra)$('modal').querySelector('.modal-body').insertAdjacentHTML('beforeend',extra);};
function showEnding(){modalKind='ending';const r=state.retired?(state.legacy||legacyResult(state)):legacyResult(state);showModal(state.retired?'晚年 · 你留下的作品与传说':'尚未落幕的人生',`<div class="legacy"><div class="eyebrow">THE WORK REMAINS, EVEN WHEN THE LIGHTS GO OUT</div><h1>${esc(r.title)}</h1><p class="story-text">${r.age}岁${state.retired?'那年':'的今天'}，${esc(r.name)}${state.retired?'把录音棚的钥匙交给后来的人。聚光灯渐渐远去，留下的不是账户里的数字，而是人们仍在讲、仍在唱的故事。':'仍在创作。今天看到的是一份生涯草稿，退休时才会成为最终答卷。'}</p><div class="report-metrics"><div><strong>${r.total}</strong><small>留下的作品</small></div><div><strong>${r.wins.length}</strong><small>歌唱赛事冠军</small></div><div><strong>${num(r.globalFans)}</strong><small>海外听众</small></div></div><div class="tags" style="margin:20px 0">${Object.entries(r.counts).map(([t,n])=>`<span class="tag gold">${TYPES[t]} ${n}</span>`).join('')}</div>${r.world?`<div class="brief-panel victory"><h3>世界冠军的那一夜</h3><p>后来的人反复观看那段总决赛录像。他们记得你面对过怎样的对手，也记得最后一首歌结束时，你没有立刻离开舞台。</p></div>`:''}<h3>被岁月留下的代表作</h3><div class="legacy-works">${r.tops.map(w=>`<article><span>${w.type}</span><strong>《${esc(w.title)}》</strong><small>完成度 ${w.quality}</small></article>`).join('')||'<p class="muted">这一次，记忆还没有变成正式作品。</p>'}</div><p class="story-text" style="font-size:15px">你兑现了${r.helped}次邀歌承诺，完成${r.reversals}次行业风波反转。${r.karma>=75?'有人记得你在他们最难的时候，没有把合作变成一次趁火打劫。':'人与人的关系里，有些承诺被兑现，也有一些遗憾。'}<br>电影累计模拟票房 ${money(r.boxOffice)}，综艺最高模拟收视 ${r.maxRating.toFixed(2)}%。</p><p class="muted">${r.wins.map(esc).join(' · ')||'没有冠军奖杯，也不意味着没有属于你的回声。'}</p></div>`,btn('回看作品与往事','ending-close','ghost')+(!state.retired&&age(state)>=60?btn('决定退休，留下这份答卷','retire-confirm','primary'):''),true);}
function next(){modalKind='next';const c=activeContest(state),q=state.commissions.filter(c=>c.status==='active'),a=activeChallenge(state);showModal('结束第'+state.week+'回合',`<p class="story-text" style="font-size:16px">本回合剩余${state.ap}行动不会保留。下一回合恢复3行动、30精力、8记忆，并结算支出与版税。</p><div class="guide-line">你现在${age(state)}岁；每4回合推进一个生涯年。${age(state)>=69?'70岁时将自动退休，未完成项目不会算作留下的正式作品。':''}</div>${c?'<p class="warning">比赛本轮截止：第'+c.due+'回合。</p>':''}${q.map(c=>'<p class="warning">邀歌「'+commissionDef(c.id).title+'」截止：第'+c.due+'回合。</p>').join('')}${a?'<p class="warning">行业反转截止：第'+a.due+'回合。</p>':''}`,btn('再做一点事','close','ghost')+btn('下一回合 →','next-confirm','primary'));}
function help(){modalKind='help';showModal('文娱生涯 · 完整玩法',`<div class="help-prose"><h3>从23岁到70岁</h3><p>每4个经营回合推进1个生涯年；这是时间压缩的经营游戏，不是现实工期。每回合3行动。60岁起可退休，70岁自动收官；最终档案统计正式发行作品、代表作、冠军、海外影响与帮过的人。第24回合只存下出道季记录，人生继续。</p><h3>五条作品线 + 一条演唱能力</h3><p>歌曲、电影、电视剧、综艺、文学分别计算制作能力；演唱能力独立决定比赛表现。制作训练或声乐训练消耗1行动、¥800、12精力，能力+7。立项需对应能力达到作品难度−25。作品库有中英文、歌手与主题检索。</p><h3>从记忆到发行</h3><p>立项支付全额预算、15精力、相应记忆和1行动，算第1次制作；继续制作每次1行动15精力；进度满后再花1行动发行。完成度与项目分成在立项锁定。每部作品只能正式发行一次，但比赛可演唱既有作品。</p><p>完成度 = 潜力×0.55 + 对应制作能力×0.42 − 难度×0.2 + 伙伴信任每10点加1 + 制作方式加成 + 本土化加成，限制20—99。独立+0，精制+12但预算×1.7且多1制作行动，联合+7且自付35%预算、收入45%（需口碑40）。本土化预算+15%、完成度+8；不转译按题材扣6或14。</p><h3>资金、粉丝与真实的约束</h3><p>每回合生活费¥600，固定工作室另¥700。休息+45精力、+5记忆；整理记忆花8精力恢复30记忆；商单花18精力获得¥4,000—16,000。生活费不足时资金归零、口碑−3，不会死档。最近5回合同领域同题材每部让触达−16%，最低60%。</p><p>发行涨粉 = 领域基数×(完成度/60)²×渠道×窗口×主题×疲劳×(1+√现有粉丝/170)×风波系数×幕后写歌系数；歌曲/文学/电影/剧集/综艺基数750/1000/2200/1900/1600。邀歌幕后涨粉系数65%，否则100%。</p><p>首发收入基数分别¥9,500/16,000/90,000/76,000/60,000，再乘(完成度/70)²、渠道、窗口、主题、疲劳、风波及项目分成。主题匹配1.15，不匹配0.65，常规1。三种渠道触达1/1.55/2.3，收益保留100%/80%/65%。首发后8回合有长尾收益，首期首发收入7.5%，后续每期衰减14%。</p><h3>专业口碑、人品、人情</h3><p>专业口碑来自制作质量；人品初始50，来自守约、帮助与失约；人情按明星分别记录，只在成功交付时获得。8条连续邀歌包含新人出道、天后复出、天王转型、公益与回馈新人。主题匹配60分、唱法匹配40分；100分且完成度达标才成功验收。普通公平合作、主动减半报价、纯商业合作各有不同酬劳与人情收益。</p><p>邀歌错过截止人品−4；不合适稿件可能只收到35%协商酬劳，不算成功，也不能解锁后续邀歌。失败2回合后可用1行动重新洽谈。已发行歌曲不能反复用于新委托刷人情。</p><h3>打压与反转</h3><p>6条行业风波依照真实履历开放，不会无缘无故全行业封杀。准备证据需1行动10精力，然后在期限内新立项并发行达标作品。2点对应明星人情可恢复替代渠道、降低3点门槛，但不自动获胜。失败只结束本轮风波、口碑−4；不删作品和伙伴。主动暂退口碑−3，不承受资源限制。</p><h3>多场歌唱比赛，世界级高潮</h3><p>街角赛、校园联赛、全国冠军季、亚洲交流赛、世界公开资格赛、全球巅峰总决赛、传世舞台，共7项19轮。资格赛独立开放，全球决赛必须先取得通行证。每轮6回合期限，选歌1行动15精力；未发行歌曲还消耗记忆；排练最多2次，各1行动12精力；登台1行动10精力。</p><p>表现 = 潜力×25% + 演唱×35% + 制作×15% + 题材匹配10 + 唱法匹配5 + 排练每次4 + 已发行熟练度4。分数事前可见，同一赛事不得重复用歌，平分按加赛规则玩家晋级；落败4回合后可重新报名。海外对手也有自己的成长经历。</p><h3>歌曲榜、票房、收视与海外</h3><p>榜单综合分 = 完成度×0.78 + min(18,log10(新增粉丝+1)×4) − 发行年龄×3.5。每领域模拟8个同行作品与你同榜。所有播放、票房、销量和收视均为游戏模拟，不代表现实数据。电影累计票房不等于你的个人到账，制作分成仍按项目计算。</p><p>出海需2000本土粉丝与作品完成度60，每部只可做一次。保留原语言成本60%、表现−14；专业本地化成本100%、表现+8；海外联合成本45%、表现+3、收益45%，需3000海外粉丝或一位明星信任18引荐。海外表现还加国际影响力×0.08，再与相应领域对手比较；海外收入另外结算8回合长尾。</p><h3>存档与自由选择</h3><p>所有行动自动保存，旧版存档会补齐新增数值与制作领域。导出存档可跨设备继续。主动休整一年会推进4回合，期间委托、赛事和风波照常到期，请先安排好承诺。</p></div>`,btn('明白了，走进这个世界','close','primary'),true);}
const originalSettings=settings;settings=function(){originalSettings();$('modal').querySelector('.modal-body').insertAdjacentHTML('beforeend',`<div class="brief-panel"><h3>你的人生还在继续 · ${age(state)}岁</h3><p>暂别繁忙的一年会连续推进4回合。所有截止时间和版税照常结算；不会自动制作或自动比赛。</p>${btn('休整一年','year-break','ghost small')} ${btn(age(state)>=60?'看看我留下了什么':'查看生涯草稿','ending','ghost small')}</div>`);};
const originalDispatch=dispatch;dispatch=function(act){const [a,b,c]=act.split(':');
 if(a==='language'){languageFilter=b;libraryPage=1;render();return;}
 if(a==='page'){libraryPage=Number(b);render();window.scrollTo(0,0);return;}
 if(a==='filter'){libraryPage=1;commissionContext=null;return originalDispatch(act);}
 if(a==='tab'){commissionContext=null;pickQuery='';pickPage=1;return originalDispatch(act);}
 if(a==='pick'){if(modalKind!=='plan'){commissionContext=null;pickPage=1;pickQuery='';}pick(b);return;}
 if(a==='plan'){return plan(b,c);}
 if(a==='pick-page'){pickPage=Number(b);pick(selectedOpp);return;}
 if(a==='invite'){invite(b);return;}
 if(a==='accept'){if(doAction(()=>acceptCommission(state,b,c))){commissionContext=b;pickPage=1;pickQuery='';pick('open');}return;}
 if(a==='commission-pick'){commissionContext=b;pickPage=1;pickQuery='';pick('open');return;}
 if(a==='withdraw'){modalKind='withdraw';showModal('认真说明，而不是失联',`<p class="story-text">退出「${commissionDef(b).title}」会使人品−3。制作中的歌曲保留，可作为自己的作品发行；2回合后可重新洽谈。</p>`,btn('继续履约','close','ghost')+btn('确认说明无法交付','withdraw-confirm:'+b,'danger'));return;}
 if(a==='withdraw-confirm'){if(doAction(()=>withdrawCommission(state,b)))closeModal();return;}
 if(a==='retry'){if(doAction(()=>retryCommission(state,b)))invite(b);return;}

 if(a==='fight'){if(doAction(()=>startChallenge(state,b,c))){closeModal();notify(c==='retreat'?'这一次，你保留了资源。':'回应已经开始，接下来必须拿出达标新作。');}return;}
 if(a==='backing'){doAction(()=>requestBacking(state,b),'人情已经兑现，制作仍由你完成。');return;}
 if(a==='industry-history'){modalKind='history';showModal('行业往事 · 关系有来处',`<div class="timeline">${state.challenges.map(r=>`<article><span class="eyebrow">${{active:'回应中',won:'实力反转',lost:'未能反转',settled:'暂退一步'}[r.status]}</span><h3>${CHALLENGES.find(d=>d.id===r.id).title}</h3><p>${esc(r.result||'证据已经准备，新的作品仍在路上。')}</p>${btn('回看详情','challenge:'+r.id,'small ghost')}</article>`).join('')||'<p class="muted">当你的作品逐渐进入行业视野，风波才会发生。当前未到触发条件。</p>'}</div><h3 style="margin:22px 0">未来可能遇到的考验</h3>${CHALLENGES.filter(d=>!state.challenges.some(r=>r.id===d.id)).map(d=>`<p class="fineprint">${d.title} · ${challengeRequirement(state,d)||'已可回应'}</p>${!challengeRequirement(state,d)&&!activeChallenge(state)?btn('打开这次风波','challenge:'+d.id,'small ghost'):''}`).join('')}`,btn('回到人脉','close','primary'));return;}
 if(a==='train'){modalKind='train';showModal('能力，要一次次练出来',`<p class="muted">每次1行动、¥800、12精力，对应能力+7。演唱能力用于比赛；制作能力用于作品与舞台编排。</p>${Object.entries({...TYPES,vocal:'演唱'}).map(([k,v])=>btn(v+'训练 <small>当前'+state.skills[k]+' → '+clamp(state.skills[k]+7)+'</small>','train-do:'+k,'choice',state.skills[k]>=100)).join('')}`);return;}
 if(a==='contest-join'){const d=COMPETITIONS.find(x=>x.id===b);modalKind='contest-join';showModal(d.title,`<p class="story-text" style="font-size:15px">${d.id==='worldSummit'?esc(WORLD_SCENES.opening).replace(/\n/g,'<br>'):d.rounds[0].text}</p><div class="timeline">${d.rounds.map((r,i)=>`<article><h3>${i+1}. ${r.name}</h3><p>${r.rival.name} · ${r.rival.region} · 对手分数${r.rival.score}</p><div class="tags"><span class="tag">${r.tags.join('/')}</span><span class="tag">${r.styles.join('/')}</span></div></article>`).join('')}</div><p class="guide-line">报名差旅费 ${money(d.fee)}。每轮6回合内完成；每轮选曲不可重复。失败可4回合后重赛。</p>`,btn('再准备一下','close','ghost')+btn('报名，走进赛场','contest-enter:'+b,'primary'));return;}

function world(){modalKind='world';showModal('世界档案 · 一段完整的第二人生',`<div class="help-prose"><div class="eyebrow">LANSTAR / ANOTHER CULTURAL HISTORY</div><h3>地球的记忆，澜星的现实</h3><p>澜星有与地球相似的现代技术、语言与情感，却走过不同的文化史。这里有本土经典、成熟的观众和认真工作的同行，只是没有你记忆中的那些地球作品。中文、英文等语言都存在，原作涉及的历史与地域细节仍需转译。</p><h3>23岁醒来，70岁留下什么</h3><p>你原本是地球的幕后创作者，长期整理影音与阅读笔记。穿越后，你成为海岚市一位23岁、遭诬陷后被雪藏的签约新人，合约刚刚到期，手里还剩¥12,000存款。记忆能帮助回想作品的结构与核心表达，不能凭空替代唱功、制作、编剧和团队管理。</p><p>每4个经营回合浓缩1个生涯年。回合代表一个阶段的制作、发行和社交安排，不是现实中的一星期。23—30岁起步、31—38岁走向海外、39—46岁登上世界舞台，之后你仍要面对新项目、新人和自己的年龄。60岁起可主动退休，70岁自动收官。</p><h3>海岚不是全世界</h3><p>QQ音乐、网易云音乐、汽水音乐、灯塔文学、流光影业和海岚卫视是你的本土入口。海外有伊贝拉海岸、北岚联盟、星湾联邦与其他地区。它们有自己的代表创作者、发行习惯与语言环境。中英文作品可以保留原语言、专业本地化，或与当地团队联合发行。</p><h3>行业里的好人和利益</h3><p>林见夏、许知秋、沈砚、乔映、唐叙分别协助五类作品。苏晚晴是寻找新声音的天后，顾长歌是面对转型的天王，夏栀还在等待第一首代表作，陈亦安把时间留给公益与新人。帮助不是一个瞬间的加分按钮，只有真正履约，才会留下可兑现的人情。</p><p>恒曜娱乐可能撤掉推荐位，发行方可能换档，行业可能质疑你的制作能力。这些影响都有范围和期限。你可以暂退、准备证据，或向曾被你帮助的人开口；真正的反转仍需要作品，而不是一句狠话。</p><h3>比赛不是人生的终点</h3><p>7场歌唱赛事、19轮不同命题通向世界之声的四轮全球决战。海外对手也有自己的生活与能力，失败会留下遗憾，但不会清空你的作品。多年后的结局会记下留下多少歌曲、影视和节目，哪几部成为代表作，拿过哪些冠军，跨过多少语言，以及有谁被你照亮。</p><h3>作品与数值的边界</h3><p>作品库收录中英文大众熟知的经典与代表性作品，歌曲仅标演唱参考，不把演唱者等同于词曲作者。“制作语种”指本次可制作版本，非中英原作可采用中文译制改编。所有预算、播放、票房、收视、评分和奖励均为游戏平衡数值；不包含原作歌词、剧本或音视频。</p></div>`,btn('回到我的第二人生','close','primary'),true);}

function intro(){modalKind='intro';const dots=`<small>序章 ${introStep+1} / 3</small>`;if(introStep===0)showModal('序章 · 所有人都在等你认错',`<div class="intro"><div class="eyebrow">PARALLEL STARLIGHT / THE SECOND LIFE</div><h1>你醒来时，<br>名字正在热搜上。</h1><div class="mock-feed"><span class="service-badge weibo">微博 · 游戏内模拟</span><h3># 恒曜新人涉嫌偷盗工程文件 #</h3><p>公司公告暂停全部演出、商务和宣传。评论里几乎没有人问过你的解释。</p><small>“拿别人的作品出道，还想回来？”<br>“先把事情说清楚，再谈音乐。”</small></div><p>九个月前，原身按约交出的试唱工程被改写归属，完整聊天只剩了对他不利的截句。你穿越来的今天，合约终于到期；冻结的工作结束了，背在名字上的指控却没有结束。</p><p>这是平行世界澜星。这里有成熟的娱乐产业，却没有地球的那些经典。你记得它们，但首先要让别人愿意认真听完一首。</p></div>`,dots+btn('先看看我手里还有什么 →','intro-next','primary'));else if(introStep===1)showModal('序章 · 把注意力变成愿意留下的人',`<div class="intro"><h2>翻身，要同时回答两件事。</h2><div class="intro-cards"><article><b>01 / 我没有偷</b><p>取回原始工程、独立录音记录和交接佐证，提交核验。好歌不能代替旧案证据。</p></article><article><b>02 / 我值得被听见</b><p>选经典、做完整作品，观察QQ音乐、网易云和汽水音乐三份不同成绩单。</p></article><article><b>03 / 什么时候开口</b><p>微博与抖音有独立运营行动。争议蓄积围观，作品承接试听，完播后才可能转粉。</p></article></div><p>每回合<span class="highlight">3制作行动 + 2运营行动</span>，共享精力与资金。预告要兑现，证据要有来源。你可以借势反击，也能先稳住信任再发作品。</p><p>作品库、明星邀歌、七项赛事、海外竞争仍在前方。从23岁到70岁，结局记住的不只是热搜，还有你留下的作品和选择。</p></div>`,btn('← 上一步','intro-back','ghost')+btn('给第二人生一个名字 →','intro-next','primary'));else showModal('序章 · 还没被他们写完的人生',`<div class="intro"><div class="eyebrow">THE NAME ON THE NEXT RECORD</div><h2 style="margin:12px 0 22px">这一回，由你继续写。</h2><label class="field"><span>你在这个世界的名字</span><input id="player-name" maxlength="12" value="陆星河" style="width:100%"></label><p>地球上的经历，让你更熟悉哪一份工作？</p><div class="origin-grid">${[['music','音乐幕后','音乐44 / 文学32 / 电影25'],['book','文字编辑','音乐32 / 文学44 / 电影25'],['screen','片场助理','音乐32 / 文学32 / 电影37']].map(([id,t,d])=>`<button data-act="origin:${id}" class="${origin===id?'selected':''}">${t}<span>${d}</span></button>`).join('')}</div><div class="guide-line">¥12,000 · 120位仍在等待的作品粉 · 公众信任12 · 争议82<br>微博6.4万、抖音2.6万待转化围观。围观每回合流失30%，并不等于你的粉丝。<br>专业口碑12 · 每回合生活费¥600 · 精力100 · 记忆85</div></div>`,btn('← 上一步','intro-back','ghost')+btn('从被雪藏的名字重新开始 →','start','primary'));}

function sceneCard(r){const d=SCENE_DEFS.find(d=>d.id===r.id),o=d.options.find(o=>o.id===r.option);return `<article class="scene-row"><div><span class="eyebrow">${d.who} · ${r.status==='active'?'承诺进行中':'新故事'}</span><h3>${d.title}</h3><p>${r.status==='active'?o.detail:d.cause}</p><small>第${r.due}回合截止${r.status==='active'?' · '+goalProgress(r,o):''}</small></div>${btn(r.status==='active'?'查看进度':'阅读与回应','scene:'+r.id,'small '+(r.status==='active'?'ghost':'primary'))}</article>`;}
function goalProgress(r,o){const g=o?.goal;if(!g)return '已作出选择';switch(g.kind){case'proof':return '材料 '+state.audience.case.proofs.length+'/'+g.n;case'evidence':return state.audience.case.proofs.includes(g.id)?'材料已取得':'仍需 '+CASE_EVIDENCE.find(d=>d.id===g.id).name;case'clear':return caseLabel(state);case'release':return '等待接受任务后发行的达标新作';case'post':return '等待新的指定策略帖子达到'+num(g.n)+'有效试听/观看';case'performance':return '等待新的比赛演唱达到'+g.score+'分';case'rank':return '等待下一次实际行动后，任一平台进入前'+g.n;case'commission':return '等待 '+commissionDef(g.id).title+' 成功验收';case'export':return '等待新的成功海外发行';case'world':return '全球巅峰赛尚待完成';default:return '进行中';}}

function showCase(){const c=state.audience.case;modalKind='case';showModal('旧案档案 · 把名字还给事实',`<div class="case-summary"><span class="eyebrow">THE UNFINISHED COAST / 九个月前</span><h2>《未寄出的海岸》工程交接案</h2><p>原身按约提交试唱工程，作品被包装成程昱的创作。恒曜公开截句，把正常交付说成偷盗。公司雪藏了你，今天合约到期，公告造成的影响仍在。</p><div class="tags"><span class="tag gold">${caseLabel(state)}</span><span class="tag">新歌成绩不改变旧案事实</span></div></div><div class="evidence-grid">${CASE_EVIDENCE.map(d=>{const have=c.proofs.includes(d.id),reason=d.requires.filter(id=>!c.proofs.includes(id));return `<article class="panel"><span class="eyebrow">${d.who}</span><h3>${d.name}</h3><p>${d.text}</p><small>${d.ap}制作行动 · ${d.pr}运营行动 · ${d.energy}精力 · ${money(d.cost)}</small>${btn(have?'✓ 已保存':reason.length?'先取得前置材料':'取得这项材料','evidence:'+d.id,have?'small ghost':'small primary',have||reason.length>0||c.status!=='accused')}</article>`;}).join('')}</div><div class="guide-line">核验条件：原始工程 + 独立录音棚记录 +（私下证人陈述或外部交接回执）。两条第三证据路线可选，不强迫证人公开。提交后下一回合公布结果；花费1制作行动、10精力、¥1,800。</div>${c.status==='reviewing'?'<p class="victory brief-panel">材料已受理，第'+c.reviewAt+'回合公布核验结果。等待期间仍能制作与运营。</p>':c.status==='cleared'?'<p class="victory brief-panel">核验还原了正常交付事实，恒曜已更正公告。推荐与联合投资恢复按正常专业口碑门槛开放。</p>':''}`,btn('返回','close','ghost')+btn(c.status==='reviewing'?'等待下一回合核验':caseCleared(state)?'已归档':'提交完整证据链','case-submit','primary',c.status!=='accused'||!caseReady(state)),true);}

function publicHelp(){modalKind='public-help';showModal('舆论、作品和事实，各有自己的账',`<div class="help-prose"><h3>01 / 冤案不会被好歌自动抹掉</h3><p>新开局：专业口碑12、公众信任12、争议82、120位作品粉；微博6.4万与抖音2.6万待转化围观。合约到期允许自主发行，旧案限制推荐与联合投资。原始工程、独立会话、证人或外部回执交叉印证后，花1制作行动、10精力、¥1,800提交核验，下一回合更正事实。未澄清时公众信任最高55。</p><h3>02 / 3制作行动 + 2运营行动</h3><p>每回合恢复3制作行动、2运营行动、30精力和8记忆。发帖通常1运营行动并花精力；剧情回应也是1运营行动。取证、制作、比赛继续使用注明的额度。帖子不会向真实微博或抖音发出。</p><h3>03 / 黑红是入口，不是收益本身</h3><p>两平台关注池容量各为12万+作品粉×12，最高300万；每回合流失30%。曝光的一部分进入池子，完整作品/片段/现场再消耗它。单次承接最多3万+作品粉×0.4。有效消费受策略、信任和新鲜度影响，完整消费再按信任转粉。跨平台估计重叠会扣除，同作品连续推广还会递减。</p><p>争议回应增加围观，却损失7信任、增加14争议与18疲劳。重复争议或同策略素材，近3回合每次使新鲜度系数变为1/(1+次数×0.75)。疲劳在每回合恢复8，争议自然下降5。高信任又缺曝光时借势可能有效；开局已有大量负面围观时，继续争吵通常不如认真承接。</p><h3>04 / 发帖前先看素材和兑现窗口</h3><p>制作记录要绑定真实项目。预告要绑定制作中作品，当前起3回合内正式发行；逾期信任−10，每项目只能预告一次。完整作品必须已发行；连续现场只支持歌曲，演唱能力至少50。证据更新需至少两项材料，同一批材料不能重复刷收益。</p><h3>05 / 经典评分与三平台榜位</h3><p>经典潜力保持稳定，成品完成度仍由制作决定。听众评分基础=(经典潜力×78%+完成度×22%)/10，按游戏受众小幅调整，最高9.9。评分人数来自有效播放样本，不足20时标明积累中。公众负面评价不直接扣歌曲评分。</p><p>三个平台各自记录当期播放、累计播放、完播、收藏、复听、当期/上期/最好名次和24回合走势。与每个平台100首虚构同行曲目竞争。名次由当期有效消费排序，经典高分不保证首发登顶；作品推到适合的受众，才能改善传播。</p><p>所有音乐平台名称用于游戏辨识，权重与数据是虚构经营规则，不是现实榜单、评分或平台算法。新歌默认8回合榜单窗口，新的完整推广可使旧作至少重返3回合。音乐后续按当期播放×¥0.004×作品分成结算，原8回合固定音乐版税不重复计；其他领域继续沿用原有收益规则。</p><h3>06 / 账号粉丝与歌手人气榜</h3><p>微博、抖音账号粉丝独立记录，不等于围观池，也不能和作品粉相加。同一人可能关注多个账号。发帖预览展示新增关注与取关；长期停更或高疲劳会自然掉粉。音乐平台也有独立歌手关注人数，来自发行、有效试听和留存，不能靠争议帖直接获得。</p><p>每平台歌手人气榜与100位虚构同行比较。人气指数=平台关注人数×0.4+当期估计听众×（0.4+留存指数×0.6）。听众按播放与复听估算，跨歌曲可能重叠；留存综合完播、收藏和复听。显示本期、上期、最好名次与趋势。三平台之间不合并计算所谓唯一粉丝。</p><h3>07 / 30个事件与长期后果</h3><p>每回合最多新触发1条，最多2条未结束事件。阅读免费，选择之后可能产生真实任务。按时完成才获得目标奖励；接取后逾期信任−4，未接取自动过去无惩罚。事件覆盖取证、传播、新人署名、天后信任、榜单对撞、影视宣传、跨文化与晚年。</p><h3>08 / 参考了什么</h3><p>已阅读《全职艺术家》第29章的质量与榜单区分、《娱乐：雪藏两年，一首歌震惊全网》第1章与第10章的受挫开局和多方舆论；查阅另外两部文娱小说的官方简介及目录。游戏人物、旧案、规则和事件为重新设计。</p><p><a href="https://en.webnovel.com/book/17457891905841004/47285512339687108" target="_blank" rel="noopener">全职艺术家 · 第29章</a> · <a href="https://fanqienovel.com/reader/7112981494871622175" target="_blank" rel="noopener">雪藏两年 · 第1章</a> · <a href="https://fanqienovel.com/reader/7112981495593042439" target="_blank" rel="noopener">第10章</a></p></div>`,btn('回到作品和故事里','close','primary'),true);}

const beforePublicDispatch=dispatch;dispatch=function(act){const [a,b,c]=act.split(':');if(a==='tab'&&modalKind)closeModal();
 if(a==='case-file'){showCase();return;}if(a==='evidence'){if(doAction(()=>collectEvidence(state,b)))showCase();return;}if(a==='case-submit'){if(doAction(()=>submitCase(state)))showCase();return;}
 if(a==='compose'){openCompose(b);return;}if(a==='compose-platform'){openCompose('statement',b);return;}if(a==='compose-source'){publicDraft.platform=b;if(!POST_FORMS.find(f=>f.id===publicDraft.form).platforms.includes(b))publicDraft.form='statement';const f=POST_FORMS.find(f=>f.id===publicDraft.form);publicDraft.work=postCandidates(state,f)[0]?.work||'';publicDraft.text=postTemplate(state,publicDraft);composeModal();return;}
 if(a==='promote'){openCompose('full');publicDraft.work=b;publicDraft.text=postTemplate(state,publicDraft);composeModal();return;}if(a==='public-post'){publicDraft.text=$('public-text').value;if(doAction(()=>publishPost(state,publicDraft)))postReport();return;}if(a==='public-return'){closeModal();tab='public';render();return;}
 if(a==='scene'){sceneModal(b);return;}if(a==='scene-choice'){if(doAction(()=>chooseScene(state,b,c)))sceneModal(b);return;}if(a==='scene-history'){modalKind='scene-history';showModal('故事档案 · 每一次变化都有前因',`<div class="timeline">${state.audience.scenes.map(r=>{const d=SCENE_DEFS.find(d=>d.id===r.id);return `<article><span class="eyebrow">${{open:'等待回应',active:'承诺进行中',won:'已兑现',lost:'留下遗憾',resolved:'选择已记录',skipped:'没有承接'}[r.status]}</span><h3>${d.title}</h3><p>${r.result||d.cause}</p>${btn('回看','scene:'+r.id,'small ghost')}</article>`;}).join('')}</div><details><summary>查看尚未遇到的剧情（含标题预告）</summary>${SCENE_DEFS.filter(d=>!state.audience.scenes.some(r=>r.id===d.id)).map(d=>'<p class="fineprint">'+d.title+' · '+d.cause+'</p>').join('')}</details>`,btn('返回','close','primary'),true);return;}
 if(a==='music-mode'){musicChartMode=b;render();return;}if(a==='service'){serviceFilter=b;render();return;}if(a==='public-help'){publicHelp();return;}
 const priorCase=state.audience.case.status;const out=beforePublicDispatch(act);if(a==='next-confirm'&&priorCase==='reviewing'&&state.audience.case.status==='cleared'){modalKind='case-result';showModal('更正公告 · 你的名字终于被写对',`<div class="intro"><div class="eyebrow">THE RECORDS SPEAK</div><h1>不是一首歌，<br>替你抹去了过去。</h1><p>是原始版本、外部会话和交接记录，一起还原了那天发生的事情。</p><p>恒曜更正公告。那些曾经避而不谈的合作方，终于有了一份能够引用的事实。平台上还有迟来的质疑，但你不用再把每一次新作，都当成替旧案辩白。</p><div class="guide-line">专业口碑+18 · 公众信任+28 · 新围观9万人<br>推荐与联合制作恢复按正常能力和口碑门槛开放。</div></div>`,btn('让下一部作品，属于现在','public-return','primary'));}return out;
};

function signedNum(n){return (n>0?'+':'')+num(n);}
function accountDashboard(compact=false){const a=state.audience;return `<section class="panel account-dashboard"><div class="panel-head"><h3>我的账号 · 粉丝与人气</h3><small>独立平台记录 · 不合并去重</small></div><div class="account-grid">${PUBLIC_PLATFORMS.map(d=>`<article style="--service:${d.color}"><span class="eyebrow">${d.name}账号粉丝</span><strong>${num(a.followers[d.id])}</strong><small>本期净变化 ${signedNum(a.followers[d.id]-a.previousFollowers[d.id])}</small>${compact?'':accountSpark(a.accountHistory,d.id,d.name)}</article>`).join('')}${MUSIC_SERVICES.map(d=>{const m=a.artists[d.id];return `<article style="--service:${d.color}"><span class="eyebrow">${d.name} · 歌手</span><strong>${chartPlace(m.rank)}</strong><small>歌手人气榜 · 关注${num(m.followers)}</small>${compact?'':`<small>本期关注 ${signedNum(m.followers-m.previousFollowers)} · 最好${chartPlace(m.bestRank)}</small>`}</article>`;}).join('')}</div>${compact?'':btn('查看各平台歌手人气榜','artist-board','ghost small')}</section>`;}
function accountSpark(hs,id,label){if(hs.length<2)return '<small>下一回合起显示粉丝走势</small>';const max=Math.max(1,...hs.map(h=>h[id])),min=Math.min(...hs.map(h=>h[id]));return `<svg class="rank-spark" viewBox="0 0 240 70" role="img" aria-label="${label}账号粉丝最近24回合走势"><polyline points="${hs.map((h,i)=>(5+i*230/(hs.length-1))+','+(56-(h[id]-min)/Math.max(1,max-min)*44)).join(' ')}" fill="none" stroke="var(--service)" stroke-width="2"/><text x="4" y="69">第${hs[0].week}回合</text><text x="177" y="69">第${hs.at(-1).week}回合</text></svg>`;}
function artistBoard(){const d=MUSIC_SERVICES.find(d=>d.id===serviceFilter),m=state.audience.artists[d.id],rows=artistRows(state,d.id),shown=rows.slice(0,12),own=rows.find(r=>r.own);if(own&&!shown.includes(own))shown.push(own);return `<div class="page-heading"><div><span class="eyebrow">ARTIST CHART / MORE THAN ONE SONG</span><h2>被听见的作品，被记住的名字</h2><p>歌手人气与单曲榜分开结算。以下为游戏内模拟排名。</p></div><span class="week-chip">第${state.week}回合</span></div><div class="filters">${Object.entries(TYPES).map(([k,v])=>btn(v+'榜','market-type:'+k,k==='music'?'active':'')).join('')}</div>${musicModeTabs()}<div class="service-tabs">${MUSIC_SERVICES.map(p=>btn(`<i style="background:${p.color}"></i>${p.name}`,'service:'+p.id,serviceFilter===p.id?'active':'')).join('')}</div>${accountDashboard(true)}<div class="grid-main"><section class="panel"><div class="panel-head"><h3>${d.name} · 歌手人气榜</h3><small>前12名 + 你的名次</small></div>${shown.map(r=>`<div class="chart-row ${r.own?'your-row':''}"><span class="chart-rank">${rows.indexOf(r)+1}</span><div><strong>${esc(r.name)}</strong><small>${r.own?'你的音乐人账号 · ':''}关注 ${num(r.followers)} · 当期估计听众 ${num(r.listeners)}</small></div><div class="chart-value"><strong>${num(r.score)}</strong><small>人气指数 · 留存${Math.round(r.retention*100)}%</small></div></div>`).join('')}<p class="fineprint">人气 = 平台关注 × 0.4 + 当期估计听众 × (0.4 + 留存 × 0.6)。听众按播放和复听估计，跨歌曲可能重叠；同行曲线随回合变化。关注与长期作品目录形成底盘，当前作品热度决定冲榜速度。</p></section><aside><section class="panel" style="--service:${d.color}"><span class="eyebrow">${d.name} / ${esc(state.name)}</span><h3>人气榜 ${chartPlace(m.rank)}</h3><p class="fineprint">上期 ${m.previousRank?chartPlace(m.previousRank):'暂无'} · 最好 ${chartPlace(m.bestRank)}<br>平台关注 ${num(m.followers)} · 本期 ${signedNum(m.followers-m.previousFollowers)}<br>当期估计听众 ${num(m.listeners)}<br>听众留存指数 ${Math.round(m.retention*100)}%</p>${rankSpark(m)}${!own?'<p class="guide-line">发行第一首歌后建立音乐人账号并参与排名。</p>':''}${btn('用作品把听众留下','compose:full','primary small')}</section><section class="panel"><h3>涨粉不只有一种速度</h3><p class="fineprint">单曲通过完播、收藏与复听积累平台关注；指向某平台的推广更有利于那里涨粉。旧作品仍在被听见，也会慢慢积累关注。长期缺少活跃作品则出现流失。微博热搜不会直接提高音乐平台关注。</p></section></aside></div>`;}
function musicModeTabs(){return `<div class="filters chart-mode">${btn('单曲榜 · 作品成绩','music-mode:songs',musicChartMode==='songs'?'active':'')}${btn('歌手榜 · 账号人气','music-mode:artists',musicChartMode==='artists'?'active':'')}</div>`;}
const beforeArtistMarket=marketPage;marketPage=function(){if(marketType!=='music')return beforeArtistMarket();if(musicChartMode==='artists')return artistBoard();return beforeArtistMarket().replace('<div class="service-tabs">',musicModeTabs()+'<div class="service-tabs">');};
const beforeArtistDispatch=dispatch;dispatch=function(act){if(act==='artist-board'){tab='market';marketType='music';musicChartMode='artists';closeModal();render();return;}return beforeArtistDispatch(act);};
render();if(!hasSave)intro();
