function deskTitle(){return state.retired?'生涯档案':activeCompany(state)?COMPANY_OFFERS.find(d=>d.id===activeCompany(state).id).name+' · 合作中':'独立创作者';}
function deskRecommendation(){const s=state;if(s.retired)return {title:'这一生的作品已经留下',text:'回看代表作、冠军、帮助过的人和你的世界排名。',label:'打开晚年档案',act:'ending',step:4};const urgent=s.desk.notices.find(n=>n.status==='booked'&&n.due<=s.week+1);if(urgent&&s.ap)return {title:'先赴已经答应的录制',text:NOTICE_DEFS.find(d=>d.id===urgent.id).title+'，第'+urgent.due+'回合截止。完成录制才会获得节目成绩与酬劳。',label:'安排这次录制',act:'notice-record:'+urgent.key,step:3};const c=activeContest(s);if(c&&c.due<=s.week+1&&s.ap)return {title:'比赛的登台时间快到了',text:COMPETITIONS.find(d=>d.id===c.id).title+'，本轮第'+c.due+'回合截止。',label:c.selection?'排练或登台':'选择比赛歌曲',act:'desk-contest',step:3};if(s.energy<15&&s.ap)return {title:'先休息，再继续创作',text:'当前精力不足以制作。休息花1制作行动，恢复45精力和5记忆。',label:'休息恢复 · 1行动',act:'routine:rest',step:1};const p=s.projects[0];if(p&&s.ap)return {title:p.progress>=p.steps?'《'+getWork(p.work).title+'》已经可以发行':'继续写完《'+getWork(p.work).title+'》',text:p.progress>=p.steps?'成品已完成。发行花1制作行动，随后在工作台推广，并查看三平台成绩。':'当前进度'+p.progress+'/'+p.steps+'。再花1制作行动、15精力推进一次；作品写完后还要正式发行。',label:p.progress>=p.steps?'正式发行这部作品':'继续制作 · 1行动',act:'project:'+p.id,step:p.progress>=p.steps?2:1};const promote=s.released.findLast(p=>s.week-p.week<=2&&!s.audience.posts.some(x=>x.work===p.work&&x.form==='full'));if(promote&&s.audience.pr&&s.energy>=6)return {title:'作品完成了，让更多人听见',text:'《'+getWork(promote.work).title+'》尚未做过完整作品推广。现在用微博或抖音接住围观。',label:'为这部作品准备发布帖',act:'promote:'+promote.work,step:3};if(!s.ap)return {title:'这回合的创作安排已经用完',text:'还有'+s.audience.pr+'次运营可用于回应、发帖或接洽，也可以结束回合。下一回合恢复3制作行动、2运营行动。',label:'结束本回合，推进故事 →',act:'next',step:4};if(!s.projects.length&&s.memory<10)return {title:'先把地球的记忆整理清楚',text:'整理记忆花1制作行动、8精力，恢复30记忆。随后再挑选下一部作品。',label:'整理记忆 · 1行动',act:'routine:memory',step:0};if(!s.projects.length&&s.money<3000)return {title:'先为下一部作品攒些制作费',text:'商业委托花1制作行动、18精力，收入至少¥4,000。也可以在创作方案中比较更便宜的路线。',label:s.energy>=18?'接商业委托 · 1行动':'先休息恢复 · 1行动',act:s.energy>=18?'routine:gig':'routine:rest',step:0};if(!s.released.length&&!s.projects.length)return {title:'先写出能让人重新认识你的第一部作品',text:'从歌曲开始比较容易：选择《起风了》或《成都》，确认方案后，工作台会带你完成制作和发行。也可以选择文学、电影、剧集或综艺路线。',label:'选择第一部作品 →',act:'desk-create',step:0};if(s.audience.case.status==='accused'&&caseReady(s)&&s.money>=1800)return {title:'证据已经齐了，把旧案交给独立核验',text:'提交花1制作行动、10精力、¥1,800。下一回合公布结果，作品成绩与旧案事实分别处理。',label:'查看证据并提交',act:'case-file',step:3};return {title:'决定下一部要留下的作品',text:'选择新的创作，或在下面接一个赛事、综艺、明星邀歌。每一项承诺都需要你安排时间完成。',label:'选择下一部作品 →',act:'desk-create',step:0};}
function deskInboxCount(){return sceneOpen(state).length+(pendingEvent(state)?1:0)+(offeredChallenge(state)||activeChallenge(state)?1:0)+state.commissions.filter(c=>c.status==='active').length+COMMISSIONS.filter(d=>!commissionRequirement(state,d)).length;}
function deskBtn(label,act,cls='ghost small',disabled=false){return btn(label,act,cls,disabled||state.retired);}
function deskCreateContent(){const s=state;return `<section class="panel desk-work"><div class="panel-head"><h3>正在写的作品 <span class="muted">${s.projects.length}/2</span></h3>${deskBtn('＋ 开始新作品','desk-create','small ghost',s.projects.length>=2)}</div>${s.projects.length?s.projects.map(p=>`<article class="desk-project"><header><div><span class="eyebrow">${TYPES[getWork(p.work).type]} · ${p.config.commission?'给'+STARS.find(x=>x.id===commissionDef(p.config.commission).star).name:'自己的作品'}</span><h3>《${esc(getWork(p.work).title)}》</h3></div><span class="tag ${p.progress>=p.steps?'good':'gold'}">${p.progress>=p.steps?'等待发行':'制作中'}</span></header><div class="desk-steps">${Array.from({length:p.steps},(_,i)=>'<i class="'+(i<p.progress?'done':'')+'">'+(i+1)+'</i>').join('')}<b>→</b><span>正式发行</span></div><p>已完成${p.progress}/${p.steps}次制作 · 成品完成度${p.quality} · 已投入${money(p.cost)}${p.deadline<99999?' · 第'+p.deadline+'回合发行窗口截止':''}</p><div class="desk-actions">${deskBtn(p.progress>=p.steps?'正式发行 · 1行动':'继续写／制作 · 1行动 · 15精力','project:'+p.id,'primary',s.ap<1||p.progress<p.steps&&s.energy<15)}${deskBtn('取消项目','cancel:'+p.id,'small ghost')}</div>${s.ap<1?'<p class="warning">本回合制作行动已用完，结束回合后继续。</p>':''}</article>`).join(''):`<div class="desk-empty"><span>01 → 02 → 03</span><h3>选一部作品，把它写完，再交给观众。</h3><p>立项算第一次制作；剩余进度与发行按钮都会留在这里。</p>${deskBtn(s.released.length?'选择下一部作品':'选择第一部作品','desk-create','primary')}</div>`}</section><section class="panel"><div class="panel-head"><h3>已经发行，接下来怎么运营</h3><small>最近4部 · 完整成绩在资料页</small></div>${s.released.slice(-4).reverse().map(p=>`<article class="desk-list-row"><div><h3>《${esc(getWork(p.work).title)}》</h3><p>${TYPES[getWork(p.work).type]} · 完成度${p.quality} · 带来${num(p.fans)}作品粉</p></div><div class="desk-actions">${deskBtn('发作品帖','promote:'+p.work,'small primary',s.audience.pr<1)}${!p.market?.overseas?deskBtn('安排出海','overseas:'+p.work):''}${btn('成绩','record:'+p.work,'small ghost')}</div></article>`).join('')||'<p class="muted">发行后，这里会出现作品推广与出海入口。</p>'}</section>`;}
function deskInboxContent(){const s=state,ev=pendingEvent(s),challenge=activeChallenge(s),offered=offeredChallenge(s);return `<section class="panel"><div class="panel-head"><h3>来信与剧情 · 在这里作决定</h3><small>阅读免费，选项注明行动与后果</small></div>${sceneOpen(s).map(sceneCard).join('')}${ev?`<article class="desk-list-row"><div><span class="eyebrow">${ev.who} · 生涯来信</span><h3>${ev.title}</h3><p>${ev.text.slice(0,100)}…</p></div>${deskBtn('阅读与回应','event','small primary')}</article>`:''}${challenge||offered?`<article class="desk-list-row"><div><span class="eyebrow">${challenge?'正在应对':'行业风波'}</span><h3>${CHALLENGES.find(d=>d.id===challenge?.id)?.title||offered.title}</h3><p>${challenge?'第'+challenge.due+'回合前拿出达标新作。':offered.text.slice(0,90)+'…'}</p></div>${deskBtn('决定如何回应','challenge:'+(challenge?.id||offered.id),'small primary')}</article>`:''}${!sceneOpen(s).length&&!ev&&!challenge&&!offered?'<div class="empty">暂时没有需要回应的来信。新作、比赛、平台成绩与下一回合会触发新的故事。</div>':''}</section><section class="panel"><div class="panel-head"><h3>明星邀歌 · 接下来要为谁创作</h3><small>报酬与人情在交付后结算</small></div>${COMMISSIONS.filter(d=>!commissionRequirement(s,d)||s.commissions.some(c=>c.id===d.id&&c.status==='active')).map(d=>{const r=s.commissions.find(c=>c.id===d.id),p=s.projects.find(p=>p.config.commission===d.id);return `<article class="desk-list-row"><div><span class="eyebrow">${STARS.find(x=>x.id===d.star).name}</span><h3>${d.title}</h3><p>${r?'已承诺 · 第'+r.due+'回合前交付':d.brief}</p></div><div class="desk-actions">${deskBtn(r?p?'继续制作':'为TA选歌':'阅读邀歌',r?p?'desk-section:create':'commission-pick:'+d.id:'invite:'+d.id,'small primary')}${r?deskBtn('说明无法交付','withdraw:'+d.id):''}</div></article>`;}).join('')||'<p class="muted">发行作品并积累口碑后，符合条件的明星邀歌会自动来到这张工作台。</p>'}</section><section class="panel"><h3>回应公众与旧案</h3><p class="muted">${caseLabel(s)} · 公众信任${s.audience.trust}/100 · 围观池${num(s.audience.pools.weibo+s.audience.pools.douyin)}</p><div class="desk-actions">${deskBtn('准备微博／抖音回应','compose','primary',s.audience.pr<1)}${deskBtn('处理旧案与取证','case-file')}${btn('只看平台数据','tab:public','small ghost')}</div></section>`;}
function deskContestContent(){const s=state,c=activeContest(s),d=c&&COMPETITIONS.find(d=>d.id===c.id),r=c&&d.rounds[c.round];return c?`<section class="panel desk-live"><div class="panel-head"><h3>${d.title}</h3><span class="tag gold">第${c.due}回合截止</span></div><h2>${c.round+1}/${d.rounds.length} · ${r.name}</h2><p>${r.text}</p><div class="tags"><span class="tag">命题 ${r.tags.join(' / ')}</span><span class="tag">唱法 ${r.styles.join(' / ')}</span><span class="tag">对手 ${r.rival.name} / ${r.rival.score}分</span></div>${c.selection?`<div class="brief-panel"><h3>《${getWork(c.selection.work).title}》 · 预测${performanceEstimate(s,c,getWork(c.selection.work),c.selection.practice).score}分</h3><p>已排练${c.selection.practice}/2次。每次排练额外+4表现，先看预测再决定上台。</p><div class="desk-actions">${deskBtn('排练 · 1行动 / 12精力','rehearse','ghost',c.selection.practice>=2||s.ap<1||s.energy<12)}${deskBtn('登台比赛 · 1行动 / 10精力','perform','primary',s.ap<1||s.energy<10)}</div></div>`:deskBtn('选本轮演唱作品 →','contest-pick','primary',s.ap<1||s.energy<15)}</section>`:'';}
function deskStageContent(){const s=state,booked=s.desk.notices.filter(n=>n.status==='booked'),notices=NOTICE_DEFS.filter(d=>!noticeRequirement(s,d)),contests=COMPETITIONS.filter(d=>!contestRequirement(s,d));return deskContestContent()+`<section class="panel"><div class="panel-head"><h3>已经答应的综艺与通告</h3><small>预约 → 可选准备 → 正式录制</small></div>${booked.map(n=>{const d=NOTICE_DEFS.find(d=>d.id===n.id);return `<article class="desk-list-row"><div><span class="eyebrow">第${n.due}回合前赴约 · ${n.prepared?'已准备':'尚未准备'}</span><h3>${d.title}</h3><p>携带《${getWork(n.work).title}》 · ${NOTICE_ANGLES.find(a=>a.id===n.angle).name}</p></div>${deskBtn('准备／赴约','notice-record:'+n.key,'small primary')}</article>`;}).join('')||'<p class="muted">还没有承诺录制。接下邀请后，待办会一直留在这里直到完成或过期。</p>'}</section><section class="panel"><div class="panel-head"><h3>节目组发来的邀请</h3><small>不想参加，可以婉拒</small></div>${notices.map(d=>`<article class="desk-list-row"><div><span class="eyebrow">${d.type} · ${d.host}</span><h3>${d.title}</h3><p>${d.text}</p></div>${deskBtn('看看邀请与条件','notice-offer:'+d.id,'small primary')}</article>`).join('')||'<p class="muted">当前没有符合条件的新通告。先发布作品，节目组会根据履历邀请你。</p>'}</section><section class="panel"><div class="panel-head"><h3>现在可以报名的赛事</h3><small>主动报名，不自动参赛</small></div>${contests.map(d=>`<article class="desk-list-row"><div><span class="eyebrow">${d.rounds.length}轮 · 报名${money(d.fee)}</span><h3>${d.title}</h3><p>首轮：${d.rounds[0].name} · 冠军奖励${money(d.rewardMoney)}</p></div>${deskBtn(activeContest(s)?'先完成当前赛事':'查看并决定报名','contest-join:'+d.id,'small primary',!!activeContest(s))}</article>`).join('')||'<p class="muted">目前尚无可报名赛事。下方日程会显示最近的机会与条件。</p>'}</section>`;}
function deskBusinessContent(){const s=state,c=activeCompany(s);return `<section class="panel"><div class="panel-head"><h3>签约与独立 · 决定怎样工作</h3><small>所有公司与条款均为游戏设定</small></div>${c?`<div class="brief-panel"><h3>${COMPANY_OFFERS.find(d=>d.id===c.id).name} · 合作中</h3><p>第${c.until}回合到期 · 适用新项目保留${Math.round(c.share*100)}%收益 · 推广触达×${c.reach}</p>${deskBtn('查看条款／提前结束','company-view:'+c.id)}</div>`:COMPANY_OFFERS.map(d=>{const err=companyRequirement(s,d);return `<article class="desk-list-row"><div><span class="eyebrow">${d.tag} · ${err?'等待条件':'新合作邀约'}</span><h3>${d.name}</h3><p>预付款${money(d.advance)} · ${d.term}回合 · 适用新作保留${Math.round(d.share*100)}%收益</p><small>${err||'已具备接洽条件，你可以签约，也可以继续独立。'}</small></div>${deskBtn('阅读条款','company-view:'+d.id,'small '+(err?'ghost':'primary'))}</article>`;}).join('')}</section><section class="panel"><h3>训练、生活与人脉</h3><div class="desk-actions">${deskBtn('训练制作／演唱','train','primary',!s.ap)}${deskBtn('休息 · +45精力','routine:rest','ghost',!s.ap)}${deskBtn('整理记忆 · +30','routine:memory','ghost',!s.ap||s.energy<8)}${deskBtn('接临时工作 · 赚资金','routine:gig','ghost',!s.ap||s.energy<18)}</div><div class="producer-grid">${PEOPLE.map(p=>`<div><h3>${p.name}</h3><p>${p.role} · 信任${s.relations[p.id]}</p>${deskBtn('约TA聊创作 · 1行动','social:'+p.id,'small ghost',!s.ap||s.energy<10)}</div>`).join('')}</div>${activeChallenge(s)?`<div class="desk-actions">${STARS.map(p=>deskBtn('请'+p.name+'帮忙 · 2人情','backing:'+p.id,'small ghost',s.favors[p.id]<2||activeChallenge(s).backed)).join('')}</div>`:''}</section>`;}
function upcomingAgenda(){const s=state;const list=[...s.desk.notices.filter(n=>n.status==='booked').map(n=>({week:n.due,title:NOTICE_DEFS.find(d=>d.id===n.id).title,detail:'已接通告 · 录制截止',action:'notice-record:'+n.key})),...s.commissions.filter(c=>c.status==='active').map(c=>({week:c.due,title:commissionDef(c.id).title,detail:'已接邀歌 · 交付截止',action:'desk-section:inbox'})),...s.audience.promises.filter(p=>p.status==='pending').map(p=>({week:p.due,title:'《'+getWork(p.work).title+'》',detail:'公开预告 · 发行截止',action:'desk-section:create'})),...sceneOpen(s).filter(r=>r.status==='active').map(r=>({week:r.due,title:SCENE_DEFS.find(d=>d.id===r.id).title,detail:'剧情承诺 · 截止',action:'scene:'+r.id}))];const c=activeContest(s);if(c)list.push({week:c.due,title:COMPETITIONS.find(d=>d.id===c.id).title,detail:'已报名 · 本轮登台截止',action:'desk-contest'});const future=[...COMPETITIONS.filter(d=>!s.contests.some(c=>c.id===d.id&&c.status==='won')).map(d=>({week:Math.max(s.week,d.minWeek),title:d.title,detail:contestRequirement(s,d)||'现在可报名',action:'desk-section:stage'})),...NOTICE_DEFS.filter(d=>!s.desk.notices.some(n=>n.key===noticeKey(s,d))).map(d=>({week:Math.max(s.week,d.minWeek),title:d.title,detail:noticeRequirement(s,d)||'节目组已发出邀请',action:'desk-section:stage'}))];return [...list.sort((a,b)=>a.week-b.week),...future.sort((a,b)=>a.week-b.week)].slice(0,7);}
home=function(){const s=state,g=deskRecommendation(),pending=sceneOpen(s),c=activeCompany(s);return `<div class="desk-heading"><div><span class="eyebrow">YOUR DESK / THE NEXT CHAPTER</span><h1>主工作台</h1><p>${esc(s.name)} · ${age(s)}岁 · ${deskTitle()} · 第${s.week}回合</p></div>${btn(s.retired?'查看生涯档案':'结束本回合 →',s.retired?'ending':'next','ghost')}</div><div class="desk-resources"><span>资金 <b>${money(s.money)}</b></span><span>制作行动 <b>${s.ap}/3</b></span><span>运营行动 <b>${s.audience.pr}/2</b></span><span>精力 <b>${s.energy}/100</b></span><span>记忆 <b>${s.memory}/100</b></span></div><section class="desk-next"><div><span class="eyebrow">现在，建议你做这件事</span><h2>${g.title}</h2><p>${g.text}</p>${btn(g.label,g.act,'primary desk-primary')}</div><div class="desk-flow">${['选择作品','写作／制作','正式发行','宣传／回应','结束回合'].map((x,i)=>`<span class="${i===g.step?'current':i<g.step?'done':''}"><b>${String(i+1).padStart(2,'0')}</b>${x}</span>`).join('')}</div></section><div class="desk-layout"><div class="desk-main"><nav class="desk-tabs" aria-label="工作安排">${[['create','创作与发行'],['inbox','来信与回应'+(deskInboxCount()?' · '+deskInboxCount():'')],['stage','赛事与通告'],['business','签约与经营']].map(([id,name])=>btn(name,'desk-section:'+id,deskSection===id?'active':'')).join('')}</nav>${deskSection==='create'?deskCreateContent():deskSection==='inbox'?deskInboxContent():deskSection==='stage'?deskStageContent():deskBusinessContent()}</div><aside class="desk-aside"><section class="panel desk-story"><span class="eyebrow">故事来到你的桌前</span>${pending.length?pending.slice(0,2).map(r=>{const d=SCENE_DEFS.find(d=>d.id===r.id);return `<article><small>${d.who}</small><h3>${d.title}</h3><p>${r.status==='active'?'你已经作出承诺，第'+r.due+'回合前完成。':d.cause}</p>${deskBtn(r.status==='active'?'查看承诺进度':'阅读并作出回应','scene:'+r.id,'small primary')}</article>`;}).join(''):pendingEvent(s)?`<h3>${pendingEvent(s).title}</h3><p>${pendingEvent(s).who}发来一封新来信。</p>${deskBtn('阅读与回应','event','small primary')}`:'<p>眼前没有新来信。作品、比赛与下一回合会让故事继续。</p>'}${deskBtn('查看全部来信与邀歌','desk-section:inbox','small ghost')}</section><section class="panel"><div class="panel-head"><h3>接下来，别错过</h3>${btn('完整日程','tab:stage','small ghost')}</div>${upcomingAgenda().slice(0,4).map(a=>`<article class="desk-agenda"><span>第${a.week}回合</span><div><strong>${a.title}</strong><small>${a.detail}</small></div></article>`).join('')||'<p class="muted">暂无日程</p>'}</section><section class="panel"><h3>我的近况</h3><p class="fineprint">${caseLabel(s)}<br>微博 ${num(s.audience.followers.weibo)} · 抖音 ${num(s.audience.followers.douyin)}<br>世界人气 #${worldRows(s).findIndex(r=>r.own)+1}<br>${c?COMPANY_OFFERS.find(d=>d.id===c.id).name+'合作至第'+c.until+'回合':'暂无生效公司合作'}</p><div class="desk-actions">${btn('社交数据','tab:public','small ghost')}${btn('作品榜单','tab:market','small ghost')}</div></section></aside></div><section class="panel desk-recent"><div class="panel-head"><h3>刚刚发生的事</h3>${btn('完整手记','tab:story','small ghost')}</div>${s.logs.slice(0,3).map(l=>`<p><span>第${l.week}回合</span><b>${esc(l.title)}</b>${esc(l.text)}</p>`).join('')}</section>`;};
function deskCreate(){modalKind='desk-create';showModal('开始创作 · 先选一种作品',`<p class="story-text" style="font-size:16px">这一次，你准备把哪一种地球记忆带来澜星？选定后只展示对应作品，确认方案后回到工作台继续制作。</p><div class="desk-domain-grid">${Object.entries(TYPES).map(([k,v])=>btn(`<span>${{music:'♫',book:'▤',screen:'▣',tv:'▥',show:'✧'}[k]}</span><strong>${v==='音乐'?'写一首歌':v==='文学'?'写一本书':v==='电影'?'制作电影':v==='电视剧'?'创作剧集':'制作综艺'}</strong><small>${WORKS.filter(w=>w.type===k).length}部地球记忆 · 当前能力${state.skills[k]}</small>`,'desk-domain:'+k,'ghost')).join('')}</div><div class="guide-line">第一次可从歌曲《起风了》《成都》开始。确认方案时会显示预算、制作次数和最快发行时间。</div>`,btn('回到工作台','close','ghost'),true);}
let deskDomain=null;
function companyModal(id){const d=COMPANY_OFFERS.find(d=>d.id===id),c=activeCompany(state),err=companyRequirement(state,d);modalKind='company';showModal(d.name+' · 合作条款',`<span class="eyebrow">${d.tag}</span><p class="story-text" style="font-size:16px">${d.text}</p><div class="report-metrics"><div><strong>${money(d.advance)}</strong><small>一次性预付款</small></div><div><strong>${d.term}回合</strong><small>期限，不自动续约</small></div><div><strong>${Math.round(d.share*100)}%</strong><small>新项目保留收益</small></div></div><p class="guide-line">适用领域：${d.types.map(t=>TYPES[t]).join('、')}。推广触达×${d.reach}，额外分成乘以${d.share}。签约花1运营行动，不替你接通告或参加赛事。既有项目不改条款；合作期内立项项目的推广与分成锁定到该项目结束。</p><p class="fineprint">提前结束：花1制作行动，按未履行期比例返还预付款。即使合作结束，已经立项作品仍按旧条款结算。</p>${c?.id===id?'<p class="guide-line">正在合作，第'+c.until+'回合到期。现在提前结束需返还'+money(companyExitCost(state))+'。</p>':err?'<p class="warning">'+err+'</p>':''}`,btn('回到工作台','close','ghost')+(c?.id===id?deskBtn('按条款提前结束','company-exit','danger'):deskBtn('婉拒，继续独立','company-decline:'+id,'ghost',!!err)+deskBtn('同意条款并签约 · 1运营','company-sign:'+id,'primary',!!err||state.audience.pr<1)),true);}
function noticeOffer(id){const d=NOTICE_DEFS.find(d=>d.id===id);noticeDraft={id,angle:'work',work:noticeWorks(state,d)[0]?.work||''};noticeCompose();}
function noticeCompose(){const d=NOTICE_DEFS.find(d=>d.id===noticeDraft.id),works=noticeWorks(state,d);modalKind='notice-offer';showModal(d.title+' · 是否接受邀请',`<span class="eyebrow">${d.host} / ${d.type}</span><p class="story-text" style="font-size:16px">${d.text}</p><label class="field"><span>带哪部自己的作品去</span><select id="notice-work">${works.map(p=>'<option value="'+p.work+'" '+(noticeDraft.work===p.work?'selected':'')+'>'+esc(getWork(p.work).title)+'</option>').join('')}</select></label><label class="field"><span>提前和节目组约定表达方向</span><select id="notice-angle">${NOTICE_ANGLES.map(a=>'<option value="'+a.id+'" '+(noticeDraft.angle===a.id?'selected':'')+'>'+a.name+'</option>').join('')}</select></label><div class="guide-line">${NOTICE_ANGLES.find(a=>a.id===noticeDraft.angle).text}<br>预约花1运营行动；第${state.week+2}回合前完成录制。可先花1制作行动、10精力准备，再花1制作行动、${d.energy}精力正式录制。未赴约：人品−3、信任−4。</div><p>参考酬劳 ${money(d.fee)}，按实际表现结算。节目${d.id==='radio'?'收听':'收视'}、传播、作品涨粉会在录制后展示；不能通过反复点击重复结算。</p>`,btn('暂不决定','close','ghost')+deskBtn('婉拒这期邀请','notice-decline:'+d.id,'ghost')+deskBtn('接受邀请，排进工作台','notice-book','primary',!!noticeRequirement(state,d)||state.audience.pr<1),true);}
function noticeRecord(key){const n=state.desk.notices.find(n=>n.key===key);if(!n)return;const d=NOTICE_DEFS.find(d=>d.id===n.id);modalKind='notice-record';if(n.status==='done'){const r=n.result;showModal(d.title+' · 播出回声',`<span class="eyebrow">${d.host} · 已完成录制</span><h2>《${getWork(n.work).title}》走进了新的观众席</h2><div class="report-metrics"><div><strong>${r.score}</strong><small>表现分</small></div><div><strong>${r.rating.toFixed(2)}%</strong><small>模拟${d.id==='radio'?'收听率':'收视率'}</small></div><div><strong>${num(r.views)}</strong><small>节目传播</small></div></div><p class="story-text" style="font-size:16px">${n.angle==='buzz'?'尖锐的问题带来了讨论，也让一些人保持距离。接下来需要新作品承接这次声量。':n.angle==='facts'?'你把已知事实和未有结论的部分说清楚。观众仍有不同看法，但这次表达有了边界。':'镜头留下了一段完整表达。节目组把作品入口放在最后，愿意继续听的人开始寻找你的名字。'}</p><p class="guide-line">作品粉+${num(r.fans)} · 实际酬劳${money(r.fee)}。播出记录已保存，人气与关注池已更新。</p>`,btn('回到主工作台，安排下一件事','desk-return','primary'),true);return;}if(n.status!=='booked'){showModal(d.title,'<p>这项通告已经'+(n.status==='missed'?'错过期限':'婉拒')+'，记录保留在日程档案。</p>',btn('返回','close','ghost'));return;}const e=noticeEstimate(state,n);showModal('通告待办 · '+d.title,`<span class="eyebrow">第${n.due}回合前录制 · ${n.prepared?'已完成准备':'尚未准备'}</span><h2>携带《${getWork(n.work).title}》</h2><p class="story-text" style="font-size:16px">${NOTICE_ANGLES.find(a=>a.id===n.angle).text}</p><div class="report-metrics"><div><strong>${e.score}</strong><small>当前预测表现</small></div><div><strong>+${num(e.fans)}</strong><small>预计作品粉</small></div><div><strong>${money(e.fee)}</strong><small>预计酬劳</small></div></div><p class="guide-line">准备：1制作行动、10精力，表现+8，只能一次。<br>录制：1制作行动、${d.energy}精力。当前${state.ap}制作行动、${state.energy}精力。<br>读完这张卡还不算赴约，必须点击正式录制。</p>`,btn('稍后再做','close','ghost')+deskBtn('准备台本／排练 · 1行动','notice-prepare:'+key,'ghost',n.prepared||state.ap<1||state.energy<10)+deskBtn('正式录制 · 1行动','notice-attend:'+key,'primary',state.ap<1||state.energy<d.energy),true);}

function studioComposer(){const d=state.studioFlow.draft,f=POST_FORMS.find(f=>f.id===d.form),e=postForecast(state,d),err=postRequirement(state,d),works=postCandidates(state,f),last=state.studioFlow.lastPost;return `<section class="studio-composer" aria-label="发布感言"><div class="studio-section-head"><h3>写一句感言，接着聊</h3><small>游戏内发布 · 1天</small></div><div class="studio-compose-fields"><label>平台<select id="studio-platform">${PUBLIC_PLATFORMS.map(p=>'<option value="'+p.id+'" '+(d.platform===p.id?'selected':'')+'>'+p.name+'</option>').join('')}</select></label><label>表达方式<select id="studio-form">${POST_FORMS.filter(f=>f.platforms.includes(d.platform)).map(f=>'<option value="'+f.id+'" '+(d.form===f.id?'selected':'')+'>'+f.name+'</option>').join('')}</select></label>${works.length?'<label>关联作品<select id="studio-work">'+works.map(p=>'<option value="'+p.work+'" '+(p.work===d.work?'selected':'')+'>'+esc(getWork(p.work).title)+'</option>').join('')+'</select></label>':''}</div><textarea id="studio-text" aria-label="感言内容" rows="3" maxlength="600" placeholder="写下想说的话，草稿会自动保留">${esc(d.text)}</textarea><p class="studio-compose-note">${esc(f.guide)} 费用 ${money(f.cost)} · ${f.energy}精力${e?' · 预计曝光 '+num(e.exposure):''}。文案可改，效果按表达方式与真实素材结算。</p>${err?'<p class="studio-lock">'+esc(err)+'</p>':''}<div class="studio-compose-actions"><span id="studio-draft-status">${d.text?'草稿已保留':'写好后发布，作品与讨论仍留在本页'}</span>${btn('发布这条感言','studio-post:'+state.studioFlow.revision,'primary small',!!err||state.retired)}</div>${last?'<div class="studio-posted" role="status"><b>已发布 · '+dateLabel(last.day)+'</b><p>'+esc(last.text)+'</p></div>':''}</section>`;}
function opinionPanel(){const p=opinionProfile(state),b=currentBattle(state)||state.creator.battles.at(-1),t=battleEngagement(state,b);return `<section class="opinion-panel" aria-label="双方舆论对比"><div class="studio-section-head"><h3>舆论正在偏向谁</h3><span>作品可信度 ${p.credibility}/100</span></div><div class="opinion-labels"><b>支持你 ${p.player}%</b><span>观望 ${p.undecided}%</span><b>支持公司 ${p.company}%</b></div><div class="opinion-bar" role="img" aria-label="支持你${p.player}%，观望${p.undecided}%，支持公司${p.company}%"><i style="width:${p.player}%"></i><i style="width:${p.undecided}%"></i><i style="width:${p.company}%"></i></div><div class="opinion-versus">${[['player','你的发文'],['company','恒曜娱乐']].map(([k,label])=>'<article><b>'+label+'</b><div>赞 <strong>'+num(t[k].likes)+'</strong></div><div>评论 <strong>'+num(t[k].comments)+'</strong></div><div>踩 <strong>'+num(t[k].dislikes)+'</strong></div></article>').join('')}</div><p class="opinion-caption">当前讨论累计互动 · 评论不等于支持</p><details><summary>${p.qualityWorks}部优质作品正在为你积累信用</summary><p>不同作品的完成度、公众信任、行业口碑、受众和已完成的回应共同影响倾向。公司初期声量更大；重复发帖不增加作品资历。帖子互动为发文时的快照，倾向随作品和回应更新。比例是游戏估算，旧案结论仍需独立核验。</p></details></section>`;}
function studioPost(p){return `<article class="studio-public-post ${p.author===state.name?'own':''}"><header><b>${esc(p.author)}</b><small>${dateLabel(p.day)} · ${esc(p.badge)}</small></header><p>${esc(p.text)}</p><footer><span>赞 ${num(p.likes)}</span><span>评论 ${num(p.comments)}</span><span>踩 ${num(p.dislikes||0)}</span></footer></article>`;}
function studioDiscussion(){const b=currentBattle(state)||state.creator.battles.at(-1),posts=discussionPosts(state,b);return `<section class="studio-discussion"><div class="studio-section-head"><h3>你与公司的公开交锋</h3><small>${b?.status==='active'?'等待你的回应':b?'本轮已告一段落':'讨论正在发生'}</small></div><div class="studio-thread" tabindex="0" aria-label="双方公开发文">${posts.map(studioPost).join('')}</div>${b?.status==='active'?'<div class="studio-replies"><small>选择一句回应 · 1天 / 2精力 · 选择后立即发布</small>'+battleOptions(state,b).map(o=>choiceButton(o.text,(o.cost?money(o.cost)+' · ':'')+'公众信任 +'+o.trust,'battle-reply:'+b.event+':'+b.step+':'+o.id,state.money<o.cost||state.energy<2||state.retired)).join('')+'</div>':'<p class="studio-compose-note">继续创作或在左侧发文。新的作品与事件会带来下一轮回应。</p>'}</section>`;}
const beforeStudioHome=home;
home=function(){if(state.retired)return beforeStudioHome();initStudio(state);const q=queuedDecisions()[0],battle=q?.key.startsWith('battle-');return `<div class="desk-heading"><div><span class="eyebrow">CREATE / RELEASE / CONVERSATION</span><h1>创作与发声</h1><p>${dateLabel(state.calendar.day)} · ${esc(state.name)} · 选作品、发歌、回应都在这里</p></div>${btn('其他安排','queue-menu','small ghost')}</div><div class="calendar-hud"><span>资金 <b>${money(state.money)}</b></span><span>精力 <b>${Math.round(state.energy)}/100</b></span><span>作品粉 <b>${num(state.fans)}</b></span><span>公众信任 <b>${state.audience.trust}/100</b></span></div>${creatorStrip()}<div class="studio-layout"><section class="studio-create" aria-label="同页创作工作区"><div class="studio-section-head"><h2>下一部作品</h2><small>选定即完成制作与发行</small></div><div class="studio-types">${Object.entries(TYPES).map(([k,v])=>btn(v,'studio-type:'+k,studioType===k?'selected small':'small ghost')).join('')}</div><input id="studio-search" type="search" aria-label="搜索创作作品" placeholder="搜索作品名或歌手" value="${esc(studioSearch)}"><div id="studio-catalog">${studioCatalog()}</div>${studioWorkResult()}${studioComposer()}</section><aside class="studio-public">${opinionPanel()}${studioDiscussion()}</aside></div><details class="studio-other"><summary>剧情、机会与其他待办 ${queuedDecisions().length}项</summary><section id="decision-surface"><div id="decision-default">${battle?'<p>当前公司的公开交锋在右侧继续，创作与发文也可同时安排。</p>':decisionCard()}</div><div id="decision-host"></div></section>${btn('安排休息或工作','queue-routine','small ghost')}${btn('比赛、通告与合作','queue-business','small ghost')}${btn('日程推进','next','small ghost')}</details>`;};
function revealStudio(){closeModal();tab='home';render();}
deskCreate=function(){studioType='music';studioPage=1;commissionContext=null;revealStudio();};
pick=function(opp='open'){studioOpp=opp;studioType=deskDomain||'music';studioPage=1;revealStudio();};
showRecord=function(id){state.studioFlow.selected=id;setStudioWork(state,id);save();revealStudio();};
showSpotlight=function(id){const r=state.momentum.releaseReports.find(r=>r.id===Number(id));if(r){state.studioFlow.selected=r.work;setStudioWork(state,r.work);save();}hideSpotlight();if(tab==='home')render();};
composeModal=function(){if(publicDraft){state.studioFlow.draft={...publicDraft};state.studioFlow.draftDirty=!!publicDraft.text;save();}revealStudio();};
const studioDispatch=dispatch;
dispatch=function(act){const [a,b,c]=act.split(':');
 if(a==='studio-type'){studioType=b;studioPage=1;studioSearch='';commissionContext=null;render();return;}
 if(a==='studio-page'){studioPage=Math.max(1,Number(b));render();return;}
 if(a==='studio-work'){showRecord(b);return;}
 if(a==='studio-post'){if(doAction(()=>publishStudioPost(state,b)))render();return;}
 if(a==='queue-public'||a==='compose'){openCompose(b||'statement');return;}
 if(a==='promote'){state.studioFlow.draftDirty=false;setStudioWork(state,b);save();revealStudio();return;}
 if(a==='desk-domain'){studioType=b;studioPage=1;revealStudio();return;}
 const result=studioDispatch(act);
 if(a==='battle-reply'){const el=$('app').querySelector('.studio-thread');if(el)el.scrollTop=el.scrollHeight;}
 if(!hasSave||a==='start'||a==='import-confirm'){initStudio(state);if(a==='start')notify('左侧选作品和发感言，右侧看双方讨论，所有结果留在同一页。');}
 if(!$('modal').hidden&&tab==='home'){const panel=$('app').querySelector('.studio-other');if(panel){panel.open=true;panel.scrollIntoView?.({block:'nearest'});}}
 return result;
};
document.addEventListener('input',e=>{if(e.target.id==='studio-text'){state.studioFlow.draft.text=e.target.value;state.studioFlow.draftDirty=true;save();const status=$('studio-draft-status');if(status)status.textContent='草稿已保留';}if(e.target.id==='studio-search'){studioSearch=e.target.value;studioPage=1;$('studio-catalog').innerHTML=studioCatalog();}});
document.addEventListener('change',e=>{if(!['studio-form','studio-work','studio-platform'].includes(e.target.id))return;const d=state.studioFlow.draft,key=e.target.id.slice(7);d[key]=e.target.value;if(key==='platform'&&!POST_FORMS.find(f=>f.id===d.form).platforms.includes(d.platform))d.form='statement';const f=POST_FORMS.find(f=>f.id===d.form),candidates=postCandidates(state,f);if(!candidates.some(p=>p.work===d.work))d.work=candidates[0]?.work||'';if(!state.studioFlow.draftDirty)d.text=postTemplate(state,d);save();render();});
render();if(!hasSave)intro();
</script></body></html>
