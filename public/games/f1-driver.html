  function relationshipPanel(full=false){const r=C.rel(S),t=C.team(S),members=[['principal',t.tp,'车队领队','信任决定长期支持与续约'],['mate',C.mateName(S),'你的队友','关系影响合作与队内风险'],['engineer','Alex Morgan','比赛工程师','信任影响调校支持与协商']];return `<section class="card"><div class="card-head"><h2>团队关系</h2><span class="caption">PADDOCK RELATIONS</span></div>${members.map(([k,n,role,desc])=>`<div class="relationship"><div class="row spread"><div><div class="name">${escape(n)}</div><div class="role">${role} · ${relLabel(r[k])}</div></div><div class="value" style="color:${r[k]<40?'var(--orange)':'var(--teal)'}">${num(r[k])}<small class="text-muted"> /100</small></div></div>${meter(r[k],r[k]<40?'var(--orange)':'var(--teal)')}<div class="desc">${desc}</div></div>`).join('')}<div class="tension-box"><div class="row spread"><span class="text-small text-orange">队内竞争热度</span><b class="mono text-orange">${num(r.tension)}%</b></div>${meter(r.tension,'var(--orange)')}<p>${r.tension>=65?'两侧车库正在分裂。下一场可能触发队内危机。':r.tension>=40?'每一次资源分配，都可能变成新的争执。':'我们是队友，也是彼此最近的对手。'}</p></div>${full?'':`<div style="padding:0 20px 18px">${btn('查看关系','relations','ghost small full')}</div>`}</section>`;}
  function home(){
    if(S.phase==='season')return seasonView();
    const t=C.team(S),r=C.rel(S),m=C.rawDriver(C.mateId(S)),pts=(S.grid.you?.points||0);
    const st=C.standings(S);
    const overview='<section class="card"><h3>车手状态</h3><div class="bd"><div class="dh"><div class="num" style="color:var(--accent)">'+S.number+'</div><div><div class="nm">'+escape(S.name)+'</div><div class="meta">'+t.name+' · '+(S.contract.role==='equal'?'平等竞争':'新人支持席位')+' · '+C.origins[S.origin].label+'</div></div><div class="rt"><div><small>赛季积分</small><span class="big" style="font-size:28px">'+pts+'</span></div><div><small>声望</small><span class="big" style="font-size:28px">'+num(S.reputation)+'</span></div></div></div><div class="row" style="gap:20px"><span class="muted">精力 <b class="mono '+(S.energy<40?'warn':'good')+'">'+num(S.energy)+'</b></span><span class="muted">士气 <b class="mono">'+num(S.morale)+'</b></span><span class="muted">年薪 <b class="mono">$'+S.contract.salary+'M</b></span><span class="muted">合同至 <b class="mono">'+S.contract.endYear+'</b></span></div><div class="divider"></div><div class="row"><span class="muted">队友</span><b>'+escape(m[1])+'</b><span class="sp"></span><span class="muted">'+S.grid[m[0]].points+' 分 · 关系 '+num(r.mate)+'</span></div><div class="row" style="margin-top:8px">'+(S.results.filter(x=>x.year===S.year).slice(-8).map(x=>'<span class="rc '+(x.pos===1?'p1':x.pos===2?'p2':x.pos===3?'p3':x.points?'pts':x.pos==='DNF'?'dnf':'')+'" title="'+escape(x.gp)+'">'+x.pos+'</span>').join('')||'<span class="dim">本赛季尚未出赛</span>')+'</div></div></section>';
    const leaders='<section class="card"><h3>车手积分榜<span class="sp"></span><button class="inline-link" data-view="standings">完整</button></h3><div class="bd flush"><table class="t"><tbody>'+st.slice(0,8).map((d,i)=>'<tr class="'+(d.id==='you'?'me':'')+'"><td class="num" style="width:30px">'+(i+1)+'</td><td><i class="team-line" style="--tc:'+C.getTeam(d.team).color+'"></i>'+driver(d.id)+'</td><td class="n mono">'+d.points+'</td></tr>').join('')+'</tbody></table></div></section>';
    return head('DRIVER CAREER',escape(S.name)+' 驾驶舱','效力 '+escape(t.name)+' · 赛季目标：稳定进入前 '+S.contract.target+' · 当前合同：'+(S.contract.role==='equal'?'平等竞争':'新人支持席位'))+driverKPIs()+'<div class="grid g2"><div class="stack">'+hero()+overview+(S.phase==='prep'?eventCard():latestNotes(4))+'</div><div class="stack">'+skillsCard()+careerValuePanel()+teamIdentityCard(S.team)+relationshipPanel()+leaders+'</div></div>';
  }
  function skillsCard(){const d=C.driverInfo(S);return '<section class="card"><div class="card-head"><h2>车手能力</h2>'+btn('更新面板','refresh-abilities','small')+'</div><div class="card-body">'+abilityRows(d)+'<div class="row spread text-small text-muted" style="margin-top:12px"><span>本场状态 <b class="mono '+(d.form>=0?'good':'warn')+'">'+signed(d.form,1)+'</b> · 士气 '+num(S.morale)+'（状态 '+signed(d.moraleEffect||0,2)+'） · 精力 '+num(S.energy)+'</span><button class="inline-link" data-driver="you">查看天赋与成长</button></div><div class="talent-inline">'+d.talents.map(t=>talentChip(t)).join(' ')+'</div></div></section>';}

  function latestNotes(n=5){return `<section class="card"><div class="card-head"><h2>收件箱</h2><span class="caption">YOUR STORY</span></div><div class="timeline">${S.journal.slice(0,n).map(j=>`<div class="timeline-item"><span class="time">${j.year}<br>ROUND ${String(j.round).padStart(2,'0')}</span><div><h3>${escape(j.title)}</h3><p>${escape(j.text)}</p></div></div>`).join('')}</div></section>`;}
  function progress(){const stage={reserve:'替补试训',prep:0,grid:1,race:2,post:3}[S.phase]??3;return `<div class="week-progress">${['赛前准备','排位与发车','正赛驾驶舱','赛后复盘'].map((n,i)=>`<div class="week-step ${i===stage?'current':i<stage?'done':''}"><b>${i<stage?'✓':'0'+(i+1)}</b>${n}</div>`).join('')}</div>`;}
  function training(){
    const status=C.trainingStatus(S),reserve=S.phase==='reserve',allowed=reserve?['simulator','longrun','engineering','recovery']:Object.keys(C.prepActions);
    return `<section class="card"><div class="card-head"><h2>${reserve?'替补试训准备':'赛前训练与沟通'}</h2><span class="actions-left">${S.weekend.actions} / 3 次准备</span></div><div class="card-body"><div class="note ${status.fatigue?'warn':''}">精力 <b>${num(status.energy)}</b> / 100 · 疲劳：${status.fatigue?'慢 '+status.fatigue.toFixed(3)+' 秒':'无额外圈速损失'}<br><span class="dim">低于 62 精力会产生疲劳。模拟器提升速度，长距离练习改善保胎；低精力时应安排恢复。下方净变化已计入疲劳、成长与工程师支持，按相同干地排位条件估算。</span></div>${S.weekend.lastTraining?`<div class="result-note" role="status">${escape(C.prepActions[S.weekend.lastTraining.key].label)}已完成：${escape(S.weekend.lastTraining.summary)}；精力 ${num(S.weekend.lastTraining.energy)}。</div>`:''}<div class="training-grid">${allowed.map((id,i)=>{const a=C.prepActions[id],v=C.trainingPreview(S,id);return `<button class="training" data-prepare="${id}" ${S.weekend.actions<=0?'disabled':''}>${icon(['wheel','flag','settings','rest','people','chat'][i])}<b>${a.label}</b><small>${a.desc}</small><small class="training-net ${v.gain>0?'good':v.gain<0?'warn':'dim'}">${v.summary}</small><small class="training-details">${escape((v.details||[]).join(' · '))}</small></button>`;}).join('')}</div></div></section>`;
  }
  function reserveView(){const r=S.reserve,t=C.team(S),a=C.reserveAssessment(S,t.id);return head('RESERVE DRIVER PROGRAM',r.ready?'领队已发出正式席位邀请':r.completed?'本次试训已经结束':'先走进车库，争取下一张发车位',t.name+' · 季前替补计划')+`<div class="notice">替补试训不计正赛发车或积分。至少完成 ${r.minimumTests} 轮，最近 ${r.minimumTests} 轮均分达到 ${r.threshold} 后可转正。季前最多 6 周，已用 ${a.weeksUsed} 周，换队也不重置；每轮考核实付补贴 $${(S.contract.salary/52).toFixed(3)}M。</div><div class="cols"><div class="stack">${r.completed?'':training()}<section class="card"><div class="card-head"><h2>领队的试训评估</h2><span class="chip">${r.ready?'晋升获批':r.completed?'考核结束':'第 '+(r.tests.length+1)+' 轮'}</span></div><div class="card-body"><div class="contract-detail"><div class="contract-stat"><small>已完成试训</small><b>${r.tests.length} / ${r.minimumTests}</b></div><div class="contract-stat"><small>最近三轮均分</small><b>${r.reviewAverage?.toFixed(2)||'—'} / ${r.threshold}</b></div><div class="contract-stat"><small>本轮预估评分</small><b>${a.expected.toFixed(2)} ± 0.70</b></div><div class="contract-stat"><small>已到账补贴</small><b>$${(r.stipendPaid||0).toFixed(3)}M</b></div></div><p class="story">${r.ready?'你达到了转正门槛，训练项目已结束。由你决定是否接受正式席位。':r.completed?'季前试训额度已用完，本次未获得晋升。已获得的能力和补贴会保留；返回市场，仍可选择有正式空缺的车队。':'考核综合驾驶能力、精力、调校与工程反馈。先分配本轮三次准备，再参加考核；预估分数已计入当前准备，实际有 ±0.70 的发挥波动。'}</p>${r.ready?btn('接受晋升，签下正式席位','promote-reserve','primary full'):r.completed?'':btn('参加本轮综合试训','reserve-test','primary full',S.weekend.actions>0?'disabled':'')}<div class="gap-sm"></div>${btn(r.completed&&!r.ready?'返回市场，选择正式空缺':'结束替补计划，重新选队','leave-reserve','ghost full')}${r.tests.length?`<div class="divider"></div><div class="timeline">${r.tests.slice(-6).reverse().map(x=>`<div class="timeline-item"><span class="time">TEST ${x.number}</span><div><h3>${x.score.toFixed(2)} 分</h3><p>精力 ${num(x.energy)} · 工程师信任 ${num(x.engineer)}</p></div></div>`).join('')}</div>`:''}</div></section></div><div class="stack">${skillsCard()}${teamIdentityCard(t.id)}${relationshipPanel()}${latestNotes(4)}</div></div>`;}

  function weekend(){if(S.phase==='post'&&showFinishBoard)return raceView();if(S.phase==='season')return seasonView();if(S.phase==='race')return raceView();if(S.phase==='post')return postView();if(S.phase==='grid')return gridView();return `${head('RACE WEEKEND / '+C.track(S).id.toUpperCase(),'比赛周末',`${escape(C.track(S).cir)} · ${escape(C.track(S).tag)} · ${C.track(S).laps} 圈正赛`)}${progress()}<div class="cols"><div class="stack">${eventCard()}${training()}</div><div class="stack">${skillsCard()}<section class="card"><div class="card-head"><h2>排位赛，怎样跑这一圈？</h2><span class="caption">QUALIFYING</span></div><div class="card-body"><p class="story no-margin">准备行动可以保留不用。先处理围场来信，再把这一周的努力带上赛道。</p><div class="gap-sm"></div><label>排位风格<select id="quali-approach"><option value="balanced" ${S.weekend.qualiApproach==='balanced'?'selected':''}>找到节奏 · 正常发挥</option><option value="attack" ${S.weekend.qualiApproach==='attack'?'selected':''}>极限冲刺 · 快 0.20 秒，16% 失误风险</option><option value="safe" ${S.weekend.qualiApproach==='safe'?'selected':''}>稳定完成 · 慢 0.12 秒</option></select></label><div class="gap"></div>${btn('戴上头盔，进入排位','qualify','primary full',S.weekend.eventDone?'':'disabled')}<p class="text-small text-muted" style="margin-top:12px">${S.weekend.eventDone?'精力、调校与练习都会影响单圈表现。':'先回应车库里的来信，排位才会开始。'}</p></div></section></div></div>`;}
  function gridView(){const q=S.weekend.grid,p=q.findIndex(d=>d.id==='you')+1;return `${head('LIGHTS OUT IS NEXT','排位成绩与发车设置','排位成绩已确定。和策略组确认第一套轮胎，下一次就是发车。')}${progress()}<div class="result-hero"><div class="result-position">P${p}</div><div><div class="eyebrow">YOUR STARTING POSITION</div><h2>${escape(C.track(S).gp)} · 发车区</h2><p>${escape(C.mateName(S))} 将从 P${q.findIndex(d=>d.id===C.mateId(S))+1} 出发。你们从此刻开始互相比较。</p></div></div><div class="cols"><section class="card"><div class="card-head"><h2>正赛发车顺序</h2><span class="caption">STARTING GRID</span></div><div class="table-wrap"><table><thead><tr><th>POS</th><th>车手</th><th>车队</th><th>排位圈速</th></tr></thead><tbody>${q.map((d,i)=>`<tr class="${d.id==='you'?'mine':''}"><td class="pos-cell">${i+1}</td><td>${driver(d.id)}${d.id==='you'?' <span class="badge-num">YOU</span>':''}</td><td><i class="team-line" style="--tc:${C.getTeam(d.team).color}"></i>${tname(d.team)}</td><td class="mono">${lapTime(d.time)}</td></tr>`).join('')}</tbody></table></div></section><div class="stack"><section class="card"><div class="card-head"><h2>第一段比赛的选择</h2><span class="caption">STARTING COMPOUND</span></div><div class="card-body"><p class="story no-margin">${S.weekend.raceWeather?.start===0?'工程师：起跑时已在下雨，赛道湿度约 '+Math.round(S.weekend.raceWeather.intensity*80)+'%。建议'+(S.weekend.raceWeather.intensity*.8>.65?'全雨胎':'半雨胎')+'起步。':'工程师：起跑预计为干地。中性胎灵活、软胎快、硬胎跑得远；你来决定。'}</p><div class="choices">${['S','M','H','I','W'].map(c=>`<button class="choice ${S.weekend.startTyre===c?'recommended':''}" data-start-tyre="${c}"><div class="row">${tyre(c)}<b>${D.COMP[c].cn}${S.weekend.startTyre===c?' · 已选择':''}</b></div><small>${{S:'起步更快，但更早进入换胎窗口',M:'速度与寿命平衡，适合灵活应变',H:'暖胎较慢，用长距离等待机会',I:'湿滑赛道使用，干地会过热',W:'大雨和积水时使用，积水较少时偏慢'}[c]}</small></button>`).join('')}</div><div class="gap"></div>${btn('准备好了，开始正赛','start-race','primary full')}</div></section><div class="notice">干地正赛需使用至少两种干胎配方；未完成会按原模板取消成绩（DSQ）。实际使用过半雨胎或全雨胎的比赛可豁免。比赛会在关键无线电决策处自动停下。</div></div></div>`;}
  function lapTime(x){const m=Math.floor(x/60);return `${m}:${(x-m*60).toFixed(3).padStart(6,'0')}`;}
  function raceView(){
    const r=S.race,tr=C.track(S),me=C.car(S),N=CareerNativeRaceUI,ended=S.phase==='post'||r.finished,options={selectedDriver,selectedTyre:pitTyre,pendingLap:nextCommandLap(),planDraft,ended:ended||stagedRace?.phase==='post',paceEnded:ended,running,driverGrowth:C.driverInfo(S)};
    const toolbar='<div class="rhead race-stage-toolbar"><div><div class="dim" style="font:700 11px/1 var(--f-display);letter-spacing:.14em">GRAND PRIX · '+tr.en.toUpperCase()+'</div><div class="lapc" id="lapc"><span data-live-lap>'+(r.lap?'LAP '+Math.min(tr.laps,r.lap+1):'GRID')+'</span><small> / '+tr.laps+'</small></div></div><span data-live-flag class="flag '+(ended?'chq':r.redAwaiting?'red':r.sc?(r.scType==='VSC'?'vsc':'sc'):'green')+'">'+(ended?'.':r.redAwaiting?'红旗 · 等待重新发车':r.sc?(r.scType==='VSC'?'VSC 虚拟安全车':'安全车'):'绿旗')+'</span><span data-live-weather class="chip '+(r.wet>.15?'warn':'')+'">'+(r.wet>.05?'湿度 '+Math.round(r.wet*100)+'%':'干地')+'</span>'+(Number.isFinite(r.tempNow)?'<span class="chip" title="温度影响轮胎磨损和赛道变干">赛道 '+Math.round(r.tempNow)+'°C</span>':'')+(Number.isFinite(r.wind)?'<span class="chip" title="风影响赛道变干">风 '+Math.round(r.wind)+' km/h</span>':'')+(Number.isFinite(r.evo)?'<span class="chip" title="橡胶附着带来的提速">橡胶 '+r.evo.toFixed(2)+'s</span>':'')+(Number.isFinite(r.fuelKg)?'<span class="chip" title="燃油越少车越轻">燃油 '+Math.round(r.fuelKg)+'kg</span>':'')+'<span class="sp"></span>'+(ended?btn('查看成绩','race-results','pri big'):btn(running?'❚❚ 暂停':r.lap?'▶ 继续':'▶ 发车','toggle-run',running?'big':'pri big',r.pending?'disabled':'')+'<div class="speed"><span class="lbl">速度</span><div class="seg">'+RACE_SPEEDS.map(v=>'<button data-speed="'+v+'" class="'+(speed===v?'on':'')+'">'+v+'×</button>').join('')+'</div></div>'+btn('跳到终点','skip-race','', 'title="交给策略组完成剩余比赛"'))+'</div>';
    const map='<section class="card mapcard race-map-card"><div class="map-heading"><span>'+escape(tr.cir)+' · 赛道实况</span><span class="sp"></span><span class="dim" data-live-progress>本圈 0%</span>'+btn(expandedMap?'恢复布局':'展开赛道','expand-map','small',`aria-expanded="${expandedMap}" aria-controls="mapslot"`)+'</div><div id="mapslot" class="race-map-slot">'+circuit(tr,true)+'</div><div class="lap-progress"><i data-live-progress-bar></i></div><div class="maplg"><span><i class="dot me"></i>你的赛车</span><span><i class="sec" style="background:#ff4d57"></i>S1 <i class="sec" style="background:#4aa8ff"></i>S2 <i class="sec" style="background:#ffd23f"></i>S3</span><span class="dim">虚线 = 维修区</span><span class="dim" data-map-wet>湿度 '+Math.round(r.wet*100)+'%</span></div><div class="map-selection"><span data-map-selection>'+(selectedDriver?'已标记 '+driver(selectedDriver):'点选计时表，在地图上标记车手')+'</span>'+(selectedDriver?'<button class="inline-link" data-driver="'+selectedDriver+'">查看车手档案</button>':'')+'</div></section>';
    const globalEvent=event=>['safety','sc','weather','w','win'].includes(event.kind||event.type);
    const feed=r.log.filter(event=>!mineOnly||event.me||event.id==='you'||globalEvent(event)).slice(0,120);
    const feedHTML='<section class="card race-feed-card" aria-label="赛况"><h3 class="race-feed-heading">赛况<span class="sp"></span><span class="race-feed-options"><label><input type="checkbox" data-race-option="mine" '+(mineOnly?'checked':'')+'> 只看我的比赛</label><label><input type="checkbox" data-race-option="alerts" '+(alertsEnabled?'checked':'')+'> 突发事件弹窗</label></span></h3><div class="feed" tabindex="0" aria-label="比赛事件列表">'+feed.map(event=>'<div class="ev e-'+escape(event.kind)+' '+(event.me||event.id==='you'?'me':'')+'"><span class="l">L'+event.lap+'</span><span class="t">'+escape(event.text)+'</span></div>').join('')+'</div></section>';
    return toolbar+'<div class="rgrid race-stage '+(expandedMap?'is-map-expanded':'')+'"><div class="stack race-main">'+map+N.radar(S)+'<div class="native-driver-control">'+N.driverControl(S,options)+'</div></div><aside class="stack race-sidebar">'+N.timingTable(S,options)+feedHTML+'</aside></div>'+(!ended?N.decisionPopup(S,{minimized:popupMinimized,alerts:raceAlerts}):'');
  }



  function resultTable(result){return `<div class="table-wrap"><table><thead><tr><th>POS</th><th>车手</th><th>车队</th><th>用时 / 状态</th><th>进站</th><th>积分</th></tr></thead><tbody>${result.table.map((d,i)=>`<tr class="${d.id==='you'?'mine':''}"><td class="pos-cell">${d.pos}</td><td>${driver(d.id)}</td><td><i class="team-line" style="--tc:${C.getTeam(d.team).color}"></i>${tname(d.team)}</td><td class="mono">${d.dnf?escape(d.why):i===0?lapTime(d.time):'+'+(d.time-result.table[0].time).toFixed(2)}${d.penalty?` <span class="text-red">+${d.penalty}s 罚时</span>`:''}</td><td>${d.stops}</td><td class="mono">${d.points}</td></tr>`).join('')}</tbody></table></div>`;}
  function pressEffects(choice){const p=C.pressPreview(S,choice),labels={principal:'领队',mate:'队友',engineer:'工程师',reputation:'职业声望',morale:'士气',tension:'内斗热度'},parts=Object.entries(labels).filter(([key])=>Math.abs(p.effects[key]||0)>1e-8).map(([key,label])=>label+' '+signed(p.effects[key],1));if(Math.abs(p.popularityGain)>1e-8)parts.push('人气 '+signed(p.popularityGain,2));return escape(parts.join(' · ')||'当前数值已达边界，本次不再增加')+'<br>'+escape(p.reason);}
  function postView(){const x=S.results.at(-1);return `${head('THE CHEQUERED FLAG','正赛成绩与赛后复盘',`${escape(x.gp)} · 第 ${x.round+1} 站`)}${progress()}${raceImpactPanel(x)}<div class="result-hero"><div class="result-position">${typeof x.pos==='string'?x.pos:'P'+x.pos}</div><div><div class="eyebrow">${escape(S.name.toUpperCase())} / RACE RESULT</div><h2>${x.pos===1?'大奖赛冠军':x.pos<=3?'领奖台完赛':x.points>0?'积分区完赛':x.pos==='DSQ'?'取消成绩':x.pos==='DNS'?'因伤缺席':x.pos==='DNF'?'未能完赛':'正赛完赛'}</h2><p>P${x.grid} 发车 · ${x.stops} 次进站 · 队友 ${typeof x.matePos==='string'?x.matePos:'P'+x.matePos}</p></div><div class="right"><b>+${x.points} PTS</b><span class="text-small text-muted">本场收入 $${money(x.salary)}M</span></div></div><div class="cols"><div class="stack"><section class="card"><div class="card-head"><h2>正赛最终成绩</h2><span class="caption">RACE CLASSIFICATION</span></div>${resultTable(x)}</section><section class="card"><div class="card-head"><h2>这场比赛，是怎样走到这里的</h2><span class="caption">YOUR DECISIONS</span></div><div class="timeline">${x.choices.map(c=>`<div class="timeline-item"><span class="time">CHOICE</span><div><h3>${escape(c.title)}</h3><p><span class="text-mint">${escape(c.choice)}</span> · ${escape(c.result)}</p></div></div>`).join('')||'<div class="empty">安静的一场比赛，也会留在生涯里。</div>'}</div></section></div><div class="stack"><section class="card"><div class="card-head"><h2>围访区的最后一个问题</h2><span class="caption">POST-RACE</span></div><div class="card-body"><h3 class="story-title">“你怎样评价今天的比赛？”</h3>${S.weekend.pressDone?'<div class="result-note">你的回答已经传回车库。下一个周末，他们会记得。</div>':`<div class="choices"><button class="choice" data-press="team"><b>感谢车队，我们一起做到了</b><small>${pressEffects('team')}</small></button><button class="choice" data-press="honest"><b>说说我的驾驶和需要改进的地方</b><small>${pressEffects('honest')}</small></button><button class="choice" data-press="blame"><b>今天的资源分配本可以更公平</b><small>${pressEffects('blame')}</small></button></div>`}<div class="gap"></div>${btn(S.round===D.TRACKS.length-1?'结束赛季，写下这一年':'前往下一站','next-round','primary full',S.weekend.pressDone?'':'disabled')}</div></section>${relationshipPanel()}</div></div>`;}
  function market(){
    const first=!S.team||S.phase==='reserve';
    return `${head('DRIVER MARKET',first?'选择车队与席位':'车手合同市场',first?'先看正式席位是否空缺，再决定直接参赛，还是从替补试训争取晋升。':'当前赛季继续履约，到期年可预约下一赛季的正式席位。',`<span class="tag mint">车手声望 ${num(S.reputation)}</span>`)}<div class="notice">${S.nextContract?`你已预约 ${escape(tname(S.nextContract.team))} 的 ${S.nextContract.startYear} 年席位。`:first?'以下是本局开局的招募设定。正式席位已满的车队不会让你直接顶替现役车手；替补计划提供最多六周的试训晋升路径。四大车队曝光高，也更可能要求新人支持队友。':`当前合同：${escape(tname(S.team))} · $${S.contract.salary}M / 年 · 至 ${S.contract.endYear} 年。${S.contract.endYear>S.year?'合同尚未到期，暂不能签约。':'现已进入到期年，可预约明年席位。'}`}</div><div class="team-grid">${C.activeTeams(S).map(t=>{const o=C.offer(S,t.id),rs=C.offer(S,t.id,'reserve'),q=o.seats;return `<article class="team-card ${S.nextContract?.team===t.id?'selected':''}" style="--tc:${t.color}"><div class="team-banner"><div class="team-wordmark">${t.name.toUpperCase()}</div><div class="team-sub">${t.fictional?'架空中国厂队':escape(t.base)}</div></div><div class="data"><div class="row spread"><span class="tag ${o.level===3?'mint':''}">${C.teamIdentity(t.id).tier}</span><span class="text-small text-muted">赛车 ${o.power.toFixed(1)}</span></div><div class="seat-status ${q.raceOpen?'open':'full'}"><b>${q.raceLabel}</b><span>${q.reserveLabel}</span></div><p class="text-small text-muted seat-reason">${escape(q.reason)}</p><div class="kv"><span>${q.raceOpen?'正式席位队友':'现役阵容'}</span><b>${escape(C.rawDriver(t.drivers[0])[1])}${q.raceOpen?'':' / '+escape(C.rawDriver(t.drivers[1])[1])}</b></div><div class="kv"><span>${q.raceOpen?'正式年薪':'试训每周补贴'}</span><b>$${(q.raceOpen?o.salary:rs.weeklyStipend).toFixed(q.raceOpen?1:3)}M</b></div><div class="kv"><span>正式席位地位</span><b>${o.role==='equal'?'平等竞争':'新人支持席位'}</b></div>${teamMultipliers(t.id)}</div><div class="foot seat-actions">${btn(q.raceOpen?'查看正式合同':'正式席位已满','offer',q.raceOpen?'primary full':'ghost full',`data-team="${t.id}" data-path="race" ${q.raceOpen?'':'disabled'}`)}${first?btn('查看替补计划','offer','ghost full',`data-team="${t.id}" data-path="reserve" ${!rs.available?'disabled':''}`):''}</div></article>`;}).join('')}</div>`;
  }
  function contractModal(tid,path='race'){const t=C.getTeam(tid),o=C.offer(S,tid,path),reserve=path==='reserve',a=o.assessment;return `<div class="eyebrow">${escape(t.full)} · ${reserve?'替补合同':'正式车手合同'}</div><div class="team-wordmark">${t.name.toUpperCase()}</div><div class="seat-status ${o.seats.raceOpen?'open':'full'}"><b>${o.seats.raceLabel}</b><span>${o.seats.reserveLabel}</span></div><p style="margin-top:12px">${reserve?`先担任替补，至少完成三轮，最近三轮均分达到 ${a.threshold} 分后争取转正。每轮占一周，整个生涯最多六周季前额度；退出换队也不重置。目前还剩 ${a.weeksRemaining} 周。试训不计正赛发车与积分，每轮考核会发放补贴。`:'你会驾驶正式赛车参加整个赛季。签约前，把成长环境、商业回报与车队内的地位一起考虑。'}</p>${teamIdentityCard(tid)}<div class="contract-detail"><div class="contract-stat"><small>${reserve?'试训每周补贴':'固定年薪'}</small><b>$${(reserve?o.weeklyStipend:o.salary).toFixed(reserve?3:1)}M</b></div><div class="contract-stat"><small>${reserve?'试训额度':'保障期'}</small><b>${reserve?a.weeksRemaining+' 周':o.years+' 年'}</b></div><div class="contract-stat"><small>合同地位</small><b>${reserve?'替补与试训':o.role==='equal'?'平等竞争':'新人支持席位'}</b></div><div class="contract-stat"><small>${reserve?'晋升考核':'成绩目标'}</small><b>${reserve?'三轮综合评估':'前 '+o.target}</b></div></div>${reserve?`<div class="note ${a.expected<a.threshold?'warn':''}">当前预估评分 ${a.expected.toFixed(2)} ±0.70；转正门槛 ${a.threshold}。${a.expected<a.threshold-1?'目前距离门槛较远，可以先从有正式空缺的车队开始生涯。':'训练和工程反馈会影响本轮评分，达标后才能转正。'}</div>`:''}${!o.available?`<div class="notice">${escape(o.unavailableReason)}</div>`:''}<p>${reserve?'替补不占正式发车位，先靠训练与工程反馈争取信任。达到考核标准后由你决定是否接受晋升，也可带着成长重新选择车队。':o.role==='support'?'新人支持条款：队友默认拥有资源优先权，车队更可能要求你让位。你仍然可以协商或拒绝，关系会回应你的决定。':'平等竞争条款：车队不会默认优先队友，可以用赛道数据争取自己的比赛。'}</p><div class="divider"></div><h3>和经纪人商量条件 <span class="text-small text-muted">${o.tries} / 2 次提案</span></h3><div class="negotiation">${btn(reserve?'提高周补贴 25%':'提高年薪 25%','negotiate','small',`data-team="${tid}" data-path="${path}" data-ask="salary" ${o.tries>=2||!o.available?'disabled':''}`)}${!reserve?btn('争取平等竞争','negotiate','small',`data-team="${tid}" data-path="${path}" data-ask="equal" ${o.tries>=2||o.role==='equal'||!o.available?'disabled':''}`):''}${!reserve?btn('争取两年保障','negotiate','small',`data-team="${tid}" data-path="${path}" data-ask="years" ${o.tries>=2||o.years===2||!o.available?'disabled':''}`):''}</div>${S.flags.negotiationReply?`<div class="result-note">${escape(S.flags.negotiationReply)}</div>`:''}<div class="modal-actions">${btn('再看看','close','ghost')}${btn(reserve?'签约替补，开始试训':S.team&&S.phase!=='reserve'?'签约下赛季':'签下正式合同','sign','primary',`data-team="${tid}" data-path="${path}" ${!o.available?'disabled':''}`)}</div>`;}
  function relations(){return `${head('THE PEOPLE BEHIND YOUR RACE','围场关系','成绩会改变你们的关系，关系也会改变下一场比赛。')}<div class="cols equal"><div class="stack">${relationshipPanel(true)}<section class="card"><div class="card-head"><h2>关系会带来什么</h2><span class="caption">A PADDOCK THAT REMEMBERS</span></div><div class="card-body"><div class="section"><h3>领队 · 支持与职业安全</h3><p class="story no-margin">领队信任和工程师信任共同决定能否协商车队指令。赛季结束时，领队信任低于 28 且合同到期，会失去续约；你可以在同一个世界里继续寻找车队。</p></div><div class="divider"></div><h3>队友 · 最接近你的对手</h3><p class="story">分享数据、私下沟通、采访和争位都会改变关系。低信任与高竞争热度叠加时，自由争位可能引发接触。</p><div class="divider"></div><h3>工程师 · 无线电另一端的判断</h3><p class="story">好的合作会带来更精确的调校支持，帮你争取升级验证与策略协商。信任很低时，临时进站沟通也更容易出问题。</p></div></section></div><div class="stack"><section class="card"><div class="card-head"><h2>一场队内战争，是怎样开始的</h2><span class="tag orange">动态剧情</span></div><div class="card-body"><h3 class="story-title">从同一个车库出发，想要同一个冠军。</h3><p class="story">一次抢先的进站、一套独有的升级、一句被媒体放大的话。竞争热度达到 65 后，赛前会触发“车库分裂”事件。你可以修复边界，也可以继续把冲突推向公开。</p><div class="result-note">有梅奔式内斗的张力，也有你自己的走向。这里的人物对话和事件均属于游戏剧情。</div><h3>你还可以主动做些什么</h3><p class="story">每站有 3 次准备机会。选择和队友吃顿饭、向领队解释目标，或和工程师多看一圈数据——这些时间，都有它的价值。</p><div class="gap"></div>${btn('回到本周的准备','weekend','primary')}</div></section>${latestNotes(5)}</div></div>`;}
  function standingsView(){const st=C.standings(S),constructors=C.activeTeams(S).map(t=>({...t,points:st.filter(d=>d.team===t.id).reduce((a,d)=>a+d.points,0)})).sort((a,b)=>b.points-a.points);return `${head('EVERY POINT TELLS A STORY','积分榜',`${S.year} 赛季 · 已完成 ${(S.grid.you?.results||[]).length} / ${D.TRACKS.length} 站`)}${stats()}<div class="cols"><section class="card"><div class="card-head"><h2>车手世界锦标赛</h2><span class="caption">DRIVERS’ CHAMPIONSHIP</span></div><div class="table-wrap"><table><thead><tr><th>POS</th><th>车手</th><th>车队</th><th>胜场</th><th>积分</th></tr></thead><tbody>${st.map((d,i)=>`<tr class="${d.id==='you'?'mine':''}"><td class="pos-cell">${i+1}</td><td>${driver(d.id)}${d.id==='you'?' <span class="badge-num">YOU</span>':''}</td><td><i class="team-line" style="--tc:${C.getTeam(d.team).color}"></i>${tname(d.team)}</td><td>${d.wins}</td><td class="mono">${d.points}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><div class="card-head"><h2>车队积分</h2><span class="caption">CONSTRUCTORS</span></div><div class="table-wrap"><table><thead><tr><th>POS</th><th>车队</th><th>积分</th></tr></thead><tbody>${constructors.map((t,i)=>`<tr class="${t.id===S.team?'mine':''}"><td class="pos-cell">${i+1}</td><td><i class="team-line" style="--tc:${t.color}"></i>${t.name}</td><td class="mono">${t.points}</td></tr>`).join('')}</tbody></table></div></section></div>`;}
  function calendarView(){return `${head('A SEASON AROUND THE WORLD','赛季日历',`${S.year} · ${D.TRACKS.length} 站比赛 · 沿用原作架空赛历`)}<div class="calendar-grid">${D.TRACKS.map((tr,i)=>{const result=S.results.find(r=>r.year===S.year&&r.round===i);return `<section class="calendar-item ${i===S.round?'current':''}"><div class="row spread"><span class="round">ROUND ${String(i+1).padStart(2,'0')}</span><span class="text-small text-muted">${escape(tr.date.replace('-',' / '))}</span></div><h2 class="city">${escape(tr.city)}</h2><div class="track">${escape(tr.cir)}</div><div style="height:100px;display:flex;align-items:center;margin-top:12px">${circuit(tr).replace('class="circuit"','class="circuit" style="height:90px"')}</div><div class="row spread"><span class="res">${result?typeof result.pos==='string'?result.pos:'P'+result.pos:i===S.round?'NEXT UP':'—'}</span><span class="text-small text-muted">${result?'+'+result.points+' PTS':tr.laps+' LAPS'}</span></div></section>`;}).join('')}</div>`;}

  const signed=(v,n=2)=>(v>=0?'+':'')+Number(v).toFixed(n);
  const fans=v=>v>=1?Number(v).toFixed(2)+' 百万':(v*100).toFixed(1)+' 万';
  function talentChip(t){return '<span class="chip '+(t.active?'acc skill-active':'')+'" title="'+escape(t.condition)+'">'+escape(t.name)+' Lv.'+t.rank+(t.active?' · 触发':'')+'</span>';}
  function skillEffectsText(t){const f=1+(t.rank-1)*.12,e=t.effect,a=[];if(e.time)a.push('圈速 −'+(e.time*f).toFixed(2)+'s');for(const[k,label]of[['pace','速度'],['craft','缠斗'],['cons','稳定'],['wet','雨战']])if(e[k])a.push(label+' +'+(e[k]*f).toFixed(1));if(e.attack)a.push('超车成功率 +'+Math.round(e.attack*f*100)+' 个百分点');if(e.defend)a.push('降低对手超车率 '+Math.round(e.defend*f*100)+' 个百分点');if(e.wear)a.push('损耗 −'+Math.round((1-e.wear)*f*100)+'%');if(e.risk)a.push('失误风险 −'+Math.round((1-e.risk)*f*100)+'%');if(e.growth)a.push('成长 +'+Math.round((e.growth-1)*f*100)+'%');return a.join(' · ');}
  function draftTalentPreview(){return '<div class="divider"></div><div class="row"><span class="muted">本次天赋</span><span class="chip acc">'+C.origins[draft.origin].trait+'</span></div><div class="talent-list">'+draft.roll.talentIds.map(id=>{const t=C.rules.skills[id];return '<div class="talent-entry"><b>'+t.name+' <span class="dim">Lv.1</span></b><div class="muted">'+t.condition+'</div><div class="dim">'+skillEffectsText({...t,rank:1})+'</div></div>';}).join('')+'</div><div class="dim" style="font-size:12px;margin-top:8px">开局可自由刷新；进入生涯后通过训练和比赛成长。</div>';}
  function abilityRows(d){return ['单圈速度','赛道缠斗','稳定性','轮胎管理','雨战能力'].map((n,i)=>'<div class="ability-row"><span class="muted">'+n+'</span>'+meter(d.effective[i],'var(--accent)')+'<b class="mono" title="初始 '+d.initialSkills[i].toFixed(1)+' · 永久能力 '+d.skills[i].toFixed(2)+' · 本场有效 '+d.effective[i].toFixed(2)+'">'+d.effective[i].toFixed(1)+'</b><small class="'+(d.skills[i]-d.initialSkills[i]>0?'good':'dim')+'">'+signed(d.skills[i]-d.initialSkills[i])+'</small></div>').join('');}
  function talentDetails(d){return '<div class="talent-list">'+d.talents.map(t=>'<section class="talent-entry '+(t.active?'triggered':'')+'"><div class="row spread"><b>'+escape(t.name)+' <span class="mono">Lv.'+t.rank+'</span></b><span class="chip '+(t.active?'acc':'')+'">'+(t.active?'当前生效':t.when==='learning'?'成长专长':'等待场景')+'</span></div><p>'+escape(t.condition)+'</p><div class="text-small">'+skillEffectsText(t)+'</div><div class="row spread dim" style="font-size:11px;margin-top:7px"><span>本场触发 '+t.count+' 圈</span><span>'+(t.rank>=5?'熟练度已满':(t.xp%24).toFixed(1)+' / 24 升级熟练度')+'</span></div>'+meter(t.rank>=5?100:t.xp%24/24*100,t.active?'var(--accent)':'var(--dim)')+'</section>').join('')+'</div>';}
  function driverModal(id){const d=C.driverInfo(S,id);return '<div class="dh"><div class="num acc">'+(id==='you'?S.number:C.rawDriver(id)[3])+'</div><div><div class="nm">'+escape(d.name)+'</div><div class="meta">'+escape(tname(d.team))+' · 国籍：'+escape(CareerWorld.natName(CareerWorld.nat(S,id)))+' · 天赋：'+escape(d.title)+'</div></div><span class="sp"></span><span class="chip">状态 '+signed(d.form,1)+'</span></div>'+abilityRows(d)+'<p class="dim" style="font-size:12px;margin-top:9px">显示本场有效能力；右侧增量是相对初始值的永久成长。技能只在条件满足时生效，安全车会抑制攻防类技能。</p>'+talentDetails(d)+'<div class="note" style="margin-top:12px">车队基础成长 ×'+d.growth.toFixed(2)+'。最近一场：'+['速度','缠斗','稳定','保胎','雨战'].map((n,i)=>n+' '+signed(d.lastGrowth[i])).join(' · ')+'</div><p class="dim" style="font-size:11px;margin-top:12px">车手天赋、技能名称与数值均为游戏设定；多个技能叠加受平衡上限约束。</p>';}
  function driversView(){const ids=['you',...D.DRIVERS0.map(d=>d[0])];return head('DRIVER PROFILES','车手档案','查看每位车手的天赋、当前状态、永久成长与场景技能。',btn('更新能力面板','refresh-abilities','small'))+'<section class="card"><h3>围场车手<span class="sp"></span><span class="dim">点击姓名查看详细能力</span></h3><div class="table-wrap"><table class="t"><thead><tr><th>车手</th><th>天赋</th><th>车队</th><th>速度</th><th>缠斗</th><th>稳定</th><th>保胎</th><th>雨战</th><th>状态</th><th>场景技能</th></tr></thead><tbody>'+ids.map(id=>{const d=C.driverInfo(S,id);return '<tr class="'+(id==='you'?'me':'')+'"><td><button class="inline-link driver-link" data-driver="'+id+'">'+escape(d.name)+'</button></td><td><span class="chip acc">'+escape(d.title)+'</span></td><td>'+escape(d.team?tname(d.team):'待命')+'</td>'+d.effective.map((v,i)=>'<td class="mono" title="永久能力 '+d.skills[i].toFixed(2)+'">'+v.toFixed(1)+'</td>').join('')+'<td class="mono '+(d.form>=0?'good':'warn')+'">'+signed(d.form,1)+'</td><td>'+d.talents.map(t=>talentChip(t)).join(' ')+'</td></tr>';}).join('')+'</tbody></table></div></section><div class="note" style="margin-top:12px">能力随训练、比赛、车队培养与状态变化。刷新面板只同步当前数值；不会重掷已经开始的生涯。</div>';}
  function teamMultipliers(id){const t=C.teamIdentity(id);return '<div class="team-bonuses"><span>曝光 <b>×'+t.exposure.toFixed(2)+'</b></span><span>商业 <b>×'+t.commercial.toFixed(2)+'</b></span><span>成长 <b>×'+t.growth.toFixed(2)+'</b></span><span>传奇 <b>×'+t.legend.toFixed(2)+'</b></span></div>';}
  function teamIdentityCard(id){const t=C.teamIdentity(id);return '<section class="card"><h3>车队环境<span class="sp"></span><span class="chip acc">'+t.tier+'</span></h3><div class="bd">'+teamMultipliers(id)+'<p class="muted" style="font-size:12px;margin:9px 0 0">'+t.pressure+'</p></div></section>';}
  // Financial views read settled receipts only; navigation never awards income.
  function incomeSummary(){
    const races=S.results.filter(x=>x.year===S.year),sum=(rows,get)=>rows.reduce((n,x)=>n+Number(get(x)||0),0);
    return {races,season:sum(races,x=>x.salary),commercial:sum(races,x=>x.impact?.commercial),detailed:races.every(x=>x.impact),allRace:sum(S.results,x=>x.salary),raceFans:sum(races,x=>x.impact?.fans)};
  }
  function driverKPIs(){
    const f=incomeSummary(),rank=S.grid.you?.results.length?'P'+C.position(S):'—';
    return '<div class="kpis4 driver-kpis">'+[
      ['车手积分',rank,(S.grid.you?.points||0)+' 分 · 本赛季'],
      ['车手人气',S.popularity.toFixed(1)+' / 100','职业声望 '+num(S.reputation)+' · 影响合同谈判'],
      ['全球车迷',fans(S.fans),'本季比赛带来 '+signed(f.raceFans*100,1)+' 万'],
      ['个人资金','$'+money(S.money)+'M','本季正赛到账 $'+f.season.toFixed(3)+'M']
    ].map(([label,value,note])=>'<div class="kpi2"><small>'+label+'</small><b>'+value+'</b><span class="dim">'+note+'</span></div>').join('')+'</div>';
  }
  function financeView(){
    const f=incomeSummary(),identity=C.teamIdentity(S.team),reserve=S.contract.role==='reserve';
    const amount=v=>'$'+Number(v||0).toFixed(3)+'M';
    const kv=rows=>'<div class="driver-finance-kv">'+rows.map(([label,value])=>'<div><span>'+label+'</span><b class="mono">'+value+'</b></div>').join('')+'</div>';
    const trend=f.races.slice(-12),maxChange=Math.max(.1,...trend.map(x=>Math.abs(x.impact?.popularity||0)));
    const latest=S.results.at(-1);
    return head('DRIVER INFLUENCE','人气与收入','成绩决定职业声望，人气与车迷带来个人商业分成。金额单位为百万美元（M），每场正赛结算到账。')+driverKPIs()+
      '<div class="grid g2"><section class="card"><h3>个人财务概况</h3><div class="bd">'+kv([
        ['当前个人资金',amount(S.money)],['生涯累计收入',amount(S.career.earnings)],
        ['本季正赛到账',amount(f.season)],['其中：薪资与成绩奖金',f.detailed?amount(f.season-f.commercial):'旧记录缺少分项'],
        ['其中：个人商业分成',f.detailed?amount(f.commercial):amount(f.commercial)+'（已记录）'],['生涯累计商业分成',amount(S.commercialIncome)],
        ['生涯替补试训收入',amount(Math.max(0,S.career.earnings-f.allRace))],
        [reserve?'替补合同年薪':'正式合同年薪',amount(S.contract.salary)],
        [reserve?'每轮试训补贴':'每站基本薪资',amount(S.contract.salary/(reserve?52:D.TRACKS.length))]
      ])+'<p class="dim finance-note">个人资金包含开局资金；累计收入只统计已赚取的薪资、奖金、试训补贴与商业分成。正赛账目不包含替补试训。</p></div></section>'+
      '<div class="stack"><section class="card"><h3>人气与商业价值<span class="sp"></span><span class="chip acc">'+identity.tier+'</span></h3><div class="bd">'+kv([
        ['车手人气',S.popularity.toFixed(1)+' / 100'],['全球车迷',fans(S.fans)],['职业声望',S.reputation.toFixed(1)+' / 100'],['传奇评价',S.legacy.toFixed(1)],['最近一站商业分成',latest?.impact?amount(latest.impact.commercial):'尚未结算']
      ])+'<div class="divider"></div>'+teamMultipliers(S.team)+'<p class="muted finance-note">'+escape(identity.pressure)+'</p><p class="dim finance-note">每站商业分成由基础金额、车迷规模和人气共同决定，再乘车队商业系数。四大车队提供更多曝光；小车队的突破带来额外传奇评价和关注。车队指令、赛后采访与成绩会影响你的生涯选择。</p><button class="inline-link" data-view="contracts">比较各车队环境与合同 →</button></div></section>'+
      '<section class="card"><h3>本季人气变化<span class="sp"></span><span class="dim">最近 12 站 · 正赛结算</span></h3><div class="bd">'+(trend.length?trend.map(x=>{const change=x.impact?.popularity;return '<div class="fame-row"><span class="muted">R'+(x.round+1)+' '+escape(x.gp)+'</span><span class="fame-track"><i style="width:'+(Math.abs(change||0)/maxChange*100)+'%;background:var(--'+(change<0?'red':'accent')+')"></i></span><b class="mono '+(change<0?'bad':'good')+'">'+(change===undefined?'—':signed(change,1))+'</b></div>';}).join(''):'<div class="empty">完成首场正赛后，这里显示每一站的人气变化。</div>')+'<p class="dim finance-note">记录比赛结算带来的增减；赛后采访的变化会直接反映在当前人气中。</p></div></section></div></div>'+
      '<section class="card income-ledger"><h3>每站个人账目<span class="sp"></span><span class="dim">全部赛季 · 已到账</span></h3><div class="bd flush tw"><table class="t"><thead><tr><th>赛季 / 大奖赛</th><th>车队</th><th>成绩</th><th class="n">薪资与奖金</th><th class="n">商业分成</th><th class="n">合计到账</th><th class="n">人气</th><th class="n">车迷变化</th></tr></thead><tbody>'+
      (S.results.slice().reverse().map(x=>'<tr><td>'+x.year+' · R'+(x.round+1)+' '+escape(x.gp)+'</td><td>'+escape(tname(x.team))+'</td><td class="mono">'+(typeof x.pos==='number'?'P'+x.pos:escape(x.pos))+'</td><td class="n mono">'+(x.impact?amount(x.salary-x.impact.commercial):'—')+'</td><td class="n mono">'+(x.impact?amount(x.impact.commercial):'—')+'</td><td class="n mono good">'+amount(x.salary)+'</td><td class="n mono '+((x.impact?.popularity||0)<0?'bad':'good')+'">'+(x.impact?signed(x.impact.popularity,1):'—')+'</td><td class="n mono">'+(x.impact?signed(x.impact.fans*100,1)+' 万':'—')+'</td></tr>').join('')||'<tr><td colspan="8" class="empty">尚未产生正赛收入。正式参赛后，每站薪资、奖金与商业分成会在这里入账。</td></tr>')+
      '</tbody></table></div><div class="bd dim finance-note">合计到账已包含商业分成，不再重复累加。旧存档缺少分项记录时显示“—”。</div></section>';
  }

  function careerValuePanel(){return '<section class="card"><h3>成绩、人气与生涯价值<span class="sp"></span><button class="inline-link" data-view="influence">全球影响力</button></h3><div class="bd"><div class="career-value-grid"><div><small>车手人气</small><b>'+S.popularity.toFixed(1)+'<em>/100</em></b></div><div><small>支持者</small><b>'+fans(S.fans)+'</b></div><div><small>累计商业分成</small><b>$'+S.commercialIncome.toFixed(2)+'M</b></div><div><small>传奇评价</small><b>'+S.legacy.toFixed(1)+'</b></div></div><div class="divider"></div><div class="row spread"><span class="muted text-small">职业声望 '+num(S.reputation)+' · 影响续约与谈判</span><span class="chip">硬核规则</span></div></div></section>';}
  function raceImpactPanel(x){if(!x.impact)return '';const i=x.impact;return '<section class="card" style="margin-bottom:14px"><h3>这一站带来了什么<span class="sp"></span><button class="inline-link" data-view="finance">查看个人账目</button></h3><div class="bd"><div class="row" style="gap:20px"><span>人气 <b class="mono '+(i.popularity>=0?'good':'warn')+'">'+signed(i.popularity,1)+'</b></span><span>车迷 <b class="mono">'+signed(i.fans*100,1)+' 万</b></span><span>本场到账 <b class="mono acc">$'+Number(x.salary||0).toFixed(3)+'M</b></span><span>其中商业分成 <b class="mono acc">$'+i.commercial.toFixed(3)+'M</b></span><span>传奇 <b class="mono pur">+'+i.legacy.toFixed(1)+'</b></span></div>'+(i.milestone?'<div class="note good" style="margin-top:10px">'+escape(i.milestone)+'。小车队的突破带来了额外人气与传奇评价。</div>':'')+'<div class="dim" style="font-size:12px;margin-top:8px">本场永久成长：'+['速度','缠斗','稳定','保胎','雨战'].map((n,j)=>n+' '+signed(i.growth[j])).join(' · ')+'</div></div></section>';}

  const achievements={debut:['01','第一次发车','完成职业生涯首场正赛'],teammate:['↗','同一间车库','在正赛击败队友'],podium:['△','看见领奖台','首次进入前三'],win:['★','属于你的国歌','赢得一场大奖赛'],pole:['P1','最前方的席位','获得杆位'],trust:['∞','无线电里的默契','工程师信任达到 90'],rivalry:['⚡','两侧车库','队内竞争热度达到 75'],champion:['♛','世界冠军','赢得年度车手冠军'],underdog:['↗','小车队奇迹','代表四大之外的车队赢得大奖赛'],star:['★','围场明星','人气达到 70 或拥有 100 万车迷'],legend:['∞','传奇车手','传奇评价达到 100']};
  function careerView(){return `${head('A LIFE IN THE FAST LANE','车手生涯',`${escape(S.name)} · #${S.number} · 从 ${S.seasons[0]?.year||2026} 年开始的职业生涯 · ${C.activeTeams(S).length} 支车队 · 比亚迪${C.teamEnabled(S,'byd')?'已加入':'未加入'}`)}<div class="metrics">${[['正赛出场',S.career.starts,'STARTS'],['大奖赛胜利',S.career.wins,'WINS'],['领奖台',S.career.podiums,'PODIUMS'],['世界冠军',S.career.titles,'TITLES']].map(([n,v,l])=>`<div class="metric"><div class="metric-label">${n}</div><div class="metric-value">${v}</div><div class="metric-foot">${l}</div></div>`).join('')}</div>${careerValuePanel()}<div class="section-title"><h2>属于你的里程碑</h2><span>${S.achievements.length} / ${Object.keys(achievements).length} UNLOCKED</span></div><div class="achievement-grid">${Object.entries(achievements).map(([id,[sym,n,d]])=>`<article class="achievement ${S.achievements.includes(id)?'unlocked':''}"><span class="icon">${sym}</span><h3>${n}</h3><p>${d}</p><div class="text-small ${S.achievements.includes(id)?'text-mint':'text-muted'}" style="margin-top:10px">${S.achievements.includes(id)?'已达成':'尚未达成'}</div></article>`).join('')}</div><div class="gap"></div><div class="cols equal"><section class="card"><div class="card-head"><h2>赛季履历</h2><span class="caption">SEASON HISTORY</span></div>${S.seasons.length?`<div class="table-wrap"><table><thead><tr><th>赛季</th><th>车队</th><th>排名</th><th>积分</th></tr></thead><tbody>${S.seasons.slice().reverse().map(y=>`<tr><td>${y.year}</td><td>${tname(y.team)}</td><td>P${y.rank}</td><td>${y.points}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">你的第一个赛季，还在书写中。</div>'}</section>${skillsCard()}</div><div class="gap"></div><section class="card"><div class="card-head"><h2>每一站的脚印</h2><span class="caption">RACE HISTORY</span></div>${S.results.length?`<div class="table-wrap"><table><thead><tr><th>年份</th><th>大奖赛</th><th>车队</th><th>发车</th><th>完赛</th><th>积分</th><th></th></tr></thead><tbody>${S.results.slice().reverse().map((r)=>`<tr><td>${r.year}</td><td>${escape(r.gp)}</td><td>${tname(r.team)}</td><td>P${r.grid}</td><td>${r.pos==='DNF'?'DNF':'P'+r.pos}</td><td>${r.points}</td><td>${btn('回看','history','ghost small',`data-result="${S.results.indexOf(r)}"`)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">第一场正赛，会成为这一切的起点。</div>'}</section>`;}
  function journalView(){return `${head('PADDOCK DIARY','围场纪事','每一次谈判、准备和关键决定，都留下了痕迹。')}${latestNotes(160)}`;}
  function seasonView(){const y=S.seasons.at(-1);return `${head('THE END OF A CHAPTER',`${S.year}，你成为了怎样的车手？`,'一个赛季的结束，是另一段人生的开始。')}<div class="result-hero"><div class="result-position">P${y.rank}</div><div><div class="eyebrow">${S.year} WORLD CHAMPIONSHIP</div><h2>${y.rank===1?'世界冠军。从此，你的名字属于这项运动。':'这一年的故事，由你亲手跑完。'}</h2><p>${y.points} 积分 · ${y.wins} 场胜利 · 冠军 ${escape(y.winner)}</p></div></div><div class="cols"><div class="stack">${careerValuePanel()}<section class="card"><div class="card-head"><h2>走出车库时，你留下了什么</h2><span class="caption">THE HUMAN SIDE</span></div><div class="card-body"><h3 class="story-title">${y.tension>=65?'你赢得过圈速，也留下了一间分裂的车库。':y.principal>=75&&y.mate>=70?'不只是积分，还有一群愿意再次并肩作战的人。':'有掌声，有分歧，也有下一次证明自己的机会。'}</h3><p class="story">领队信任 ${num(y.principal)}，队友关系 ${num(y.mate)}，竞争热度 ${num(y.tension)}。下一年，这些关系会继续影响你的故事。</p><div class="gap"></div>${S.nextContract?`<div class="result-note">下一站：${escape(tname(S.nextContract.team))}。新合同已经签好，等待你走进新的赛季。</div>`:`<div class="result-note">${S.contract.endYear>S.year?'你仍有保障合同，可以继续在当前车队成长。':y.principal<28?'车队不再续约。下一季，你将带着经历寻找新的席位。':'你可以接受当前车队的自动续约，或先到合同市场寻找新的方向。'}</div>`}<div class="row wrap">${btn('看看下赛季的席位','market','ghost')}${btn('开启新赛季','new-season','primary')}</div></div></section>${latestNotes(7)}</div><div class="stack">${relationshipPanel()}${skillsCard()}</div></div>`;}
  function savesModal(){return `${S?`<div class="notice">本局围场：${C.activeTeams(S).length} 支车队 / ${C.activeTeams(S).length*2} 位正赛车手 · 比亚迪${C.teamEnabled(S,'byd')?'已加入':'未加入'}。此设置在开局时确定；已有生涯保留原阵容与成绩。</div>`:''}<p>每次选择与每一圈都会自动保存到当前浏览器。换设备或导入 Shoota 前，可以先导出一份生涯存档。</p><div class="gap"></div><div class="save-grid">${[1,2,3].map(i=>{const x=read(KEY+'.slot'+i);return `<section class="save-slot"><h3>手动存档 ${i}</h3><p>${C.validate(x)?`${escape(x.name)} · ${x.year}<br>${escape(tname(x.team))} · ${x.career.starts} 场正赛`:'这里还没有一段生涯。'}</p><div class="row">${btn('存入','save-slot','small',`data-slot="${i}" ${!S?'disabled':''}`)}${btn('读取','load-slot','ghost small',`data-slot="${i}" ${!C.validate(x)?'disabled':''}`)}</div></section>`;}).join('')}</div><div class="divider"></div><div class="row wrap">${btn('导出生涯存档','export','primary',!S?'disabled':'')}${btn('导入生涯存档','import','ghost')}${btn('下载单文件游戏','download-game','ghost')}${btn('玩法说明','help','ghost')}</div><input type="file" id="import-file" accept=".json,application/json" hidden><p style="margin-top:15px" class="${storageOK?'':'save-warning'}">${storageOK?'存档保存在本机，可继续游戏后再来管理。':'浏览器拒绝写入或空间不足。当前仍可游玩，请及时导出生涯存档。'}</p><div class="divider"></div>${btn('重新开始一段生涯','reset-ask','danger small')}<p class="text-small" style="margin-top:10px">重新开始只清除当前自动存档，手动存档仍会保留。</p>`;}
  function helpModal(){return `<div class="section"><h3>01 / 你是一位车手</h3><p>创建姓名、国籍与背景，决定比亚迪是否加入围场，再从本局车队中选择席位。争冠车快、压力高，新人支持席位也意味着车队可能优先队友。合同里的地位可以谈判。</p></div><div class="section"><h3>02 / 每站三次准备，先处理一封来信</h3><p>练习能提高速度、减轻损耗；恢复精力降低疲劳；花时间沟通会改变关系。围场事件必须回应，准备行动可以不用完，再进入排位。</p></div><div class="section"><h3>03 / 在无线电里，保留自己的声音</h3><p>比赛沿用旧版的大赛道、计时榜、天气雷达、进站计划与突发事件弹窗，支持暂停和 0.5× / 1× / 2× / 4× / 8× / 16× 倍速。你决定驾驶节奏、战术和每次换胎。对手进站、undercut／overcut 与后车威胁随局势变化重新交给你判断。跟车进攻、保胎等待和抵挡新胎追兵，也需要你按真实距离、轮胎和精力作出取舍；雨势变化、安全车与 VSC、轮胎衰竭、攻防机会和车队指令都会等待你的回应。完成有效驾驶圈会积累对应属性和实际触发技能的经验，升级从下一圈生效并随进度保存。</p></div><div class="section"><h3>04 / 带着结果继续生活</h3><p>赛后采访改变关系与关注，职业声望取决于成绩；未达标时，一次得体采访只能缓和损失，公开抱怨会损害职业评价。成绩带来积分和收入。合同到期年可以预约下季席位。赛季结束后自动续约或转会；若被放弃，仍能在同一段生涯继续寻找车队。</p></div><div class="notice no-margin">这是基于原 F1 领队模版制作的独立车手生涯游戏。名单、能力、赛历及 BYD 厂队沿用原作的架空游戏设定，人物对话与队内剧情为虚构。当前使用完整大奖赛周末的简化流程，不含冲刺赛；地图展示赛道相对位置示意。</div>`;}
  function showModal(title,content,wide=false){pauseRace();modalFocus=document.activeElement;modalContent={title,wide};$('#modal-root').innerHTML=`<div class="modal-backdrop" data-overlay="true"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-head"><h2 id="dialog-title">${escape(title)}</h2><button class="modal-close" data-action="close" aria-label="关闭">×</button></div><div class="modal-body">${content}</div></section></div>`;document.body.style.overflow='hidden';$('.modal-close').focus();}
  function closeModal(){modalContent=null;$('#modal-root').innerHTML='';document.body.style.overflow='';modalFocus?.isConnected&&modalFocus.focus();if(S?.phase==='race'&&view==='weekend')render(true);}
  function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4200);}
  function navigate(v){pauseRace();if(!S){toast('先创建你的车手，开始这段生涯。');return;}if(!S.team){view='contracts';render();return;}running=false;view=v;render();}
  function actPrimary(){if(!S)return;if(!S.team){navigate('contracts');return;}navigate(S.phase==='season'?'home':'weekend');}
  function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function afterState(keep=true){save();render(keep);}
  function updateDraft(){const f=$('#profile-form');if(f){draft.name=f.elements.name.value;draft.number=f.elements.number.value;draft.nationality=f.elements.nationality?.value||'CHN';draft.includeBYD=f.elements.includeBYD?.value==='true';}}
  document.addEventListener('submit',e=>{if(e.target.id!=='profile-form')return;e.preventDefault();updateDraft();S=C.create(draft);recoverySave=null;view='contracts';save();render();});
  document.addEventListener('click',e=>{
    const el=e.target.closest('button,[data-overlay],[data-race-focus],[data-action="select-race-driver"],[data-world-market]');if(!el||el.disabled)return;
    if(el.dataset.overlay&&e.target===el){closeModal();return;}
    if(S&&(el.dataset.worldAction||el.dataset.worldMarket)){const next=CareerWorldUI.handle(el.dataset,S);if(next){view=next;render(true);}return;}
    if(el.dataset.view)return navigate(el.dataset.view);
    if(el.dataset.raceFocus){selectRaceDriver(el.dataset.raceFocus);return;}
    if(el.dataset.driver){showModal('车手能力与天赋',driverModal(el.dataset.driver),true);return;}
    if(el.dataset.origin){updateDraft();draft.origin=el.dataset.origin;draft.roll=C.rollProfile(draft.origin);render(true);return;}
    if(el.dataset.event){if(C.chooseEvent(S,el.dataset.event)){afterState();toast(S.flash.text);}return;}
    if(el.dataset.prepare){if((S.phase==='reserve'?C.reservePrepare:C.prepare)(S,el.dataset.prepare)){afterState();toast(S.weekend.lastTraining?.summary||'准备已完成');}return;}
    if(el.dataset.startTyre){S.weekend.startTyre=el.dataset.startTyre;afterState();return;}
    if(el.dataset.mode){setImmediateMode(el.dataset.mode);return;}
    if(el.dataset.speed){if(!RACE_SPEEDS.includes(Number(el.dataset.speed)))return;speed=Number(el.dataset.speed);raceMotion?.setSpeed(speed);render(true);return;}
    if(el.dataset.answer){const choice=el.dataset.answer;if(C.answerRace(S,choice)){raceAlerts=[];C.clearRaceAlerts?.(S);popupMinimized=false;if(choice==='edit'){editResume=false;pauseRace();planDraft=futurePlan();afterState();toast('在进站计划中修改草稿，应用后再继续比赛。');}else{afterState();if(!S.race.pending)playRace();}}return;}
    if(el.dataset.tactic){if(S?.phase==='race'&&stagedRace?.phase!=='post'){const lap=nextCommandLap();C.cancelDrivingWindow?.(S,'tactic');if(C.setTactic(S,el.dataset.tactic,lap)){recomputeStagedLap();afterState();}}return;}
    if(el.dataset.pitTyre){pitTyre=el.dataset.pitTyre;render(true);return;}
    if(el.dataset.press){C.press(S,el.dataset.press);afterState();toast('这句回答，已经传回车库。');return;}
    const action=el.dataset.action;
    if(!action)return;
    switch(action){
      case'select-race-driver':selectRaceDriver(el.dataset.id);break;
      case'race-results':showFinishBoard=false;view='weekend';afterState(false);break;
      case'race-pop-min':popupMinimized=true;render(true);break;
      case'race-pop-max':popupMinimized=false;render(true);break;
      case'race-pop-continue':if(!S.race.pending){raceAlerts=[];C.clearRaceAlerts?.(S);popupMinimized=false;playRace();}break;
      case'skip-race':skipRace();break;
      case'plan-edit':editResume=running;pauseRace();planDraft=futurePlan();render(true);break;
      case'plan-lap':if(planDraft?.[Number(el.dataset.index)]){const stop=planDraft[Number(el.dataset.index)],delta=Number(el.dataset.delta),last=C.track(S).laps-1;let lap=stop.lap+delta;while(planDraft.some(x=>x!==stop&&x.lap===lap))lap+=delta;if(lap>=nextCommandLap()&&lap<=last)stop.lap=lap;planDraft.sort((a,b)=>a.lap-b.lap);updatePlanDraft();}break;
      case'plan-comp':if(planDraft?.[Number(el.dataset.index)]&&Object.hasOwn(D.COMP,el.dataset.comp)){planDraft[Number(el.dataset.index)].comp=el.dataset.comp;updatePlanDraft();}break;
      case'plan-delete':if(planDraft){planDraft.splice(Number(el.dataset.index),1);updatePlanDraft();}break;
      case'plan-add':if(planDraft){const lap=Math.max(nextCommandLap(),(planDraft.at(-1)?.lap||S.race.lap)+5);if(lap<C.track(S).laps)planDraft.push({lap,comp:C.advice(S).rec});else toast('剩余圈数不足，无法再增加一次进站。');updatePlanDraft();}break;
      case'plan-next':{const stops=planDraft||futurePlan(),lap=nextCommandLap();if(stops.length)stops[0].lap=lap;else stops.push({lap,comp:C.advice(S).rec});if(planDraft){updatePlanDraft();}else applyPitPlan(stops);break;}
      case'plan-apply':if(planDraft&&applyPitPlan(planDraft)){planDraft=null;if(S.race.planDraft!==undefined)C.resumeRaceDecisions(S);afterState();if(editResume&&!S.race.pending){editResume=false;playRace();}}break;
      case'plan-discard':planDraft=null;if(S.race.planDraft!==undefined){C.resumeRaceDecisions(S);afterState();}else render(true);if(editResume&&!S.race.pending){editResume=false;playRace();}break;
      case'plan-recommend':{const stops=[];for(const x of C.replan(S)[0]?.stops||[]){const lap=Math.max(x.lap,nextCommandLap(),(stops.at(-1)?.lap??0)+1);if(lap<C.track(S).laps)stops.push({...x,lap});}if(planDraft){planDraft=stops;updatePlanDraft();}else applyPitPlan(stops);break;}
      case'plan-cancel':{const stops=futurePlan(),index=el.dataset.lap?stops.findIndex(x=>x.lap===Number(el.dataset.lap)):Number(el.dataset.index);if(index<0||index>=stops.length){toast('这次进站已经进入执行圈，不能取消。');break;}stops.splice(index,1);applyPitPlan(stops);break;}
      case'pit-cancel':if((S.race.pitRequest?.executeLap??S.race.lap+1)<nextCommandLap()){toast('本圈已经进入进站执行阶段，无法撤回。');}else if(C.cancelPit(S)){if(stagedRace?.phase==='race')C.cancelPit(stagedRace);afterState();}break;
      case'expand-map':expandedMap=!expandedMap;render(true);break;
      case'primary':actPrimary();break;
      case'reroll':if(!S){updateDraft();draft.roll=C.rollProfile(draft.origin);render(true);toast('能力和场景技能已更新。');}break;
      case'refresh-abilities':afterState();toast('已同步训练成长、状态与当前场景效果。');break;
      case'weekend':navigate('weekend');break;
      case'relations':navigate('relations');break;
      case'calendar':navigate('calendar');break;
      case'market':navigate('contracts');break;
      case'help':showModal('玩法说明',helpModal());break;
      case'close':closeModal();break;
      case'offer':delete S.flags.negotiationReply;showModal('车手合同',contractModal(el.dataset.team,el.dataset.path||'race'));break;
      case'negotiate':{const r=C.negotiate(S,el.dataset.team,el.dataset.ask,el.dataset.path||'race');S.flags.negotiationReply=r.text;save();showModal('经纪人的合同桌',contractModal(el.dataset.team,el.dataset.path||'race'));break;}
      case'sign':{const hadTeam=!!S.team&&S.phase!=='reserve';if(C.sign(S,el.dataset.team,el.dataset.path||'race')){closeModal();save();view=hadTeam?'contracts':'home';render();toast(hadTeam?'下一赛季的合同已签署。':'合同签好了。欢迎来到 '+tname(S.team)+'。');}break;}
      case'reserve-test':if(C.reserveTest(S)){afterState();toast(S.reserve.ready?'领队已开放正式席位。':S.reserve.completed?'试训额度已用完，可返回市场选择正式空缺。':'本轮试训与补贴已记录，准备下一轮。');}break;
      case'promote-reserve':if(C.promoteReserve(S)){view='home';afterState(false);toast('你获得了正式发车位。');}break;
      case'leave-reserve':if(C.leaveReserve(S)){view='contracts';afterState(false);}break;
      case'qualify':{const approach=$('#quali-approach')?.value||'balanced';if(C.qualify(S,approach)){save();render();}break;}
      case'start-race':resetPlayback();if(C.initRace(S,S.weekend.startTyre)){pitTyre='H';view='weekend';afterState(false);}break;
      case'toggle-run':if(running){pauseRace();render(true);}else playRace();break;
      case'step':playRace('one');break;
      case'fast-forward':speed=16;playRace('decision');break;
      case'pit':{if(stagedRace?.phase==='post'){toast('已进入最后一圈冲线，请等待成绩。');break;}const executeLap=S.race.lap+(stagedRace?2:1);if(C.requestPit(S,pitTyre,true,executeLap)){if(stagedRace?.phase==='race')C.requestPit(stagedRace,pitTyre,true,executeLap);afterState();toast('已通知车组，第 '+executeLap+' 圈入口执行进站。');}break;}
      case'next-round':if(C.next(S)){running=false;view=S.phase==='season'?'home':'weekend';afterState(false);}break;
      case'new-season':if(C.startSeason(S)){view=S.phase==='market'?'contracts':'home';afterState(false);}break;
      case'saves':showModal('存档与设置',savesModal(),true);break;
      case'save-slot':{try{localStorage.setItem(KEY+'.slot'+el.dataset.slot,JSON.stringify(S));showModal('保存这段人生',savesModal(),true);toast('已保存到手动存档 '+el.dataset.slot);}catch{toast('存储空间不足，请导出存档。');}break;}
      case'load-slot':{const v=read(KEY+'.slot'+el.dataset.slot);if(!C.validate(v))return toast('这份存档无法读取。');showModal('读取手动存档',`<p>将读取 ${escape(v.name)} 在 ${v.year} 年的进度。当前自动存档会被覆盖。</p><div class="modal-actions">${btn('取消','close','ghost')}${btn('读取这段生涯','confirm-load','primary',`data-slot="${el.dataset.slot}"`)}</div>`);break;}
      case'confirm-load':{const v=read(KEY+'.slot'+el.dataset.slot);if(C.validate(v)){resetPlayback();S=C.upgradeState(v);running=false;closeModal();view='home';afterState(false);toast('已回到这段生涯。');}break;}
      case'export':download(JSON.stringify({format:'shoota-f1-driver',version:1,savedAt:new Date().toISOString(),state:S},null,2),`F1-Driver-${S.name}-${S.year}-R${S.round+1}.json`,'application/json');toast('生涯存档已导出。');break;
      case'import':$('#import-file').click();break;
      case'confirm-import':{if(importCandidate){resetPlayback();S=C.upgradeState(importCandidate);importCandidate=null;running=false;closeModal();view='home';afterState(false);toast('生涯存档已导入。');}break;}
      case'download-game':{const html='<!doctype html>\n'+document.documentElement.outerHTML.replace(/<div\b(?=[^>]*\bid=["']app["'])[^>]*>[\s\S]*?(?=<script>)/,'<div id="app"></div><div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div>');download(html,'F1-Driver-'+BUILD+'.html','text/html');toast('单文件游戏已下载，可在本机打开或导入 Shoota。');break;}
      case'recover-save':if(recoverySave)download(recoverySave,'F1-Driver-原始存档备份.json','application/json');break;
      case'reset-ask':showModal('开始另一段人生',`<p>当前自动存档会被清除，手动存档保留。建议先导出当前生涯，留住你已经跑过的每一圈。</p><div class="modal-actions">${btn('继续当前生涯','close','ghost')}${btn('确认重新开始','reset','danger')}</div>`);break;
      case'reset':{resetPlayback();S=null;try{localStorage.removeItem(KEY);}catch{}closeModal();view='home';render();break;}
      case'history':{const r=S.results[Number(el.dataset.result)];if(r)showModal(`${r.year} · ${r.gp}`,`<p>${r.pos==='DNF'?'未能完赛':'P'+r.pos} · ${r.points} 积分 · ${r.stops} 次进站</p><div class="gap"></div>${resultTable(r)}<div class="gap"></div><h3>当时的决定</h3>${r.choices.map(c=>`<div class="result-note">${escape(c.title)}<br>${escape(c.choice)} · ${escape(c.result)}</div>`).join('')}`,true);break;}
    }
  });
  let importCandidate=null;
  document.addEventListener('change',async e=>{
    if(!S&&['nationality','includeBYD'].includes(e.target.getAttribute?.('name'))){const name=e.target.getAttribute('name');updateDraft();render(true);document.querySelector('select[name="'+name+'"]')?.focus();return;}
    if(S&&e.target.dataset?.worldSelect){const next=CareerWorldUI.handle({worldAction:e.target.dataset.worldSelect,worldValue:e.target.value},S);if(next){view=next;render(true);}return;}
    if(e.target.dataset?.raceOption){if(e.target.dataset.raceOption==='mine')mineOnly=!!e.target.checked;else alertsEnabled=!!e.target.checked;if(!alertsEnabled)raceAlerts=[];render(true);return;}
    if(e.target.id==='quali-approach'&&S?.phase==='prep'){if(['balanced','attack','safe'].includes(e.target.value)){S.weekend.qualiApproach=e.target.value;save();}return;}
    if(e.target.id!=='import-file')return;
    const file=e.target.files[0];if(!file)return;if(file.size>5*1024*1024){e.target.value='';return toast('存档超过 5MB，无法导入。');}
    try{const raw=JSON.parse(await file.text()),s=raw.state||raw;if(!C.validate(s))throw Error('invalid');importCandidate=C.upgradeState(s);showModal('确认导入生涯',`<p>读取 ${escape(s.name)} · ${s.year} 年 · ${s.career.starts} 场正赛的生涯，会替换当前自动存档。手动存档仍然保留。</p><div class="modal-actions">${btn('取消','close','ghost')}${btn('导入并继续','confirm-import','primary')}</div>`);}catch{toast('这不是有效的 F1-Driver 存档，当前进度未改变。');}finally{e.target.value='';}
  });
  document.addEventListener('keydown',e=>{
    if(S&&(e.key==='Enter'||e.key===' ')&&e.target?.dataset?.worldMarket){e.preventDefault();CareerWorldUI.handle(e.target.dataset,S);render(true);document.querySelector('[data-world-market="'+e.target.dataset.worldMarket+'"]')?.focus();return;}
    if(e.key==='Escape'&&modalContent){closeModal();return;}
    if(e.key==='Escape'&&S?.phase==='race'&&view==='weekend'&&(S.race.pending||raceAlerts.length)){popupMinimized=!popupMinimized;render(true);return;}
    if(e.code==='Space'&&document.activeElement.closest?.('button,a,[role="button"]'))return;
    if(!modalContent&&S?.phase==='race'&&view==='weekend'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){if(e.key===']'||e.key==='['){const at=RACE_SPEEDS.indexOf(speed);speed=RACE_SPEEDS[Math.max(0,Math.min(RACE_SPEEDS.length-1,at+(e.key===']'?1:-1)))];raceMotion?.setSpeed(speed);render(true);return;}if(e.code==='Space'&&raceAlerts.length&&!S.race.pending){e.preventDefault();raceAlerts=[];C.clearRaceAlerts?.(S);playRace();return;}}
    const trap=modalContent?'.modal':$('[data-race-decision-dialog]')?'.rpop':null;if(trap&&e.key==='Tab'){const els=[...document.querySelectorAll(trap+' button:not(:disabled),'+trap+' input:not([hidden]),'+trap+' select,'+trap+' a')];if(!els.length)return;const first=els[0],last=els.at(-1);if(!document.activeElement.closest(trap)){e.preventDefault();first.focus();}else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
    if(e.code==='Space'&&!modalContent&&S?.phase==='race'&&view==='weekend'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(!S.race.pending){if(running){pauseRace();render(true);}else playRace();}}
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseRace();save();if(S?.phase==='race')render(true);}});
  window.addEventListener('beforeunload',save);
  function raceSnapshot(state){const tr=C.track(state);return CareerRaceAnimation.snapshot(state.race,{base:tr.base,colorFor:c=>C.getTeam(c.team).color,labelFor:c=>c.id==='you'?state.name:C.rawDriver(c.id)?.[2]||c.id});}
  function resetPlayback(){running=false;stagedRace=null;raceMotion?.destroy();raceMotion=null;playMode='continuous';selectedDriver=null;planDraft=null;editResume=false;popupMinimized=false;raceAlerts=[];showFinishBoard=false;}
  function capturePaceProgress(){if(stagedRace&&S?.race?.livePace&&raceMotion?.active)S.race.livePace.progress=Math.max(S.race.livePace.progress,raceMotion.fraction);}
  function pauseRace(){running=false;raceMotion?.pause();capturePaceProgress();}
  function liveFrame(f){
    if(!f||view!=='weekend'||!S?.race)return;
    const flag=$('[data-live-flag]'),weather=$('[data-live-weather]'),wet=$('[data-map-wet]');if(flag){flag.className='flag '+(showFinishBoard?'chq':S.race.redAwaiting?'red':f.sc?(f.scType==='VSC'?'vsc':'sc'):'green');flag.textContent=showFinishBoard?'.':S.race.redAwaiting?'红旗 · 等待重新发车':f.sc?(f.scType==='VSC'?'VSC 虚拟安全车':'安全车'):'绿旗';}if(weather)weather.textContent=f.wet>.2?'湿地 '+Math.round(f.wet*100)+'%':'干地';if(wet)wet.textContent='湿度 '+Math.round(f.wet*100)+'%';
    const lap=$('[data-live-lap]'),progress=$('[data-live-progress]'),bar=$('[data-live-progress-bar]'),body=$('[data-live-tower] tbody');
    if(lap)lap.textContent=!S.race.lap&&!stagedRace&&!running?'GRID':'LAP '+Math.min(C.track(S).laps,Math.floor(f.lap)+1);
    if(progress)progress.textContent='本圈 '+Math.round(f.fraction*100)+'%';if(bar)bar.style.width=(f.fraction*100)+'%';
    const timingOrder=f.cars.map(c=>c.id).join(','),reorder=body?.getAttribute?.('data-timing-order')!==timingOrder;
    for(const c of f.cars){const row=$('[data-live-driver="'+c.id+'"]');if(!row)continue;const pos=row.querySelector?.('[data-live-pos]'),gap=row.querySelector?.('[data-live-gap]'),interval=row.querySelector?.('[data-live-interval]');if(pos)pos.textContent=c.dnf?'—':c.position;if(gap)gap.textContent=c.dnf?c.status||'DNF':c.pit?'PIT':c.position===1?'LEADER':'+'+c.gap.toFixed(1);if(interval)interval.textContent=c.position===1||c.dnf?'—':'+'+c.interval.toFixed(1);row.classList.toggle('out',c.dnf);row.classList.toggle('sel',c.id===selectedDriver);if(reorder&&body?.appendChild)body.appendChild(row);if(c.id==='you'){const p=$('[data-live-player-pos]');if(p)p.textContent=c.dnf?c.status||'DNF':'P'+c.position;const g=$('#cg-you'),i=f.cars.indexOf(c),ahead=f.cars[i-1],behind=f.cars[i+1];if(g&&(running||stagedRace||S.race.lap))g.textContent=c.dnf?C.car(S).why:'前 '+(ahead&&!ahead.dnf?ahead.label+' +'+c.interval.toFixed(1):'—')+' · 后 '+(behind&&!behind.dnf?behind.label+' −'+behind.interval.toFixed(1):'—')+(c.pit?' · 维修区':'');}}
    if(reorder)body?.setAttribute?.('data-timing-order',timingOrder);
  }
  function selectRaceDriver(id){if(!['race','post'].includes(S?.phase)||!S.race.cars.some(c=>c.id===id))return;selectedDriver=id;raceMotion?.setSelected(id);for(const row of document.querySelectorAll('[data-live-driver]'))row.classList.toggle('sel',row.dataset.liveDriver===id);const label=$('[data-map-selection]');if(label)label.textContent='已标记 '+C.driverName(S,id);}
  function syncRaceMotion(){
    if(!S?.race||!(S.phase==='race'||S.phase==='post'&&showFinishBoard)||view!=='weekend'){raceMotion?.pause();return;}
    const svg=$('svg[data-race-map]');if(!svg)return;
    if(!raceMotion)raceMotion=new CareerRaceAnimation({onFrame:liveFrame,onComplete:completeRaceLap});
    raceMotion.setGeometry(D.GEO[C.track(S).id]||D.GEO.aus).mount(svg).setSpeed(speed).setSelected(selectedDriver);
    if(!stagedRace&&S.phase==='race'&&S.race.livePace?.progress>0&&!S.race.pending&&S.race.planDraft===undefined){
      const next=C.clone(S);if(C.advance(next,1)===1){stagedRace=next;raceMotion.transition(raceSnapshot(S),raceSnapshot(next),LAP_PLAYBACK_MS).seek(S.race.livePace.progress);}
    }
    if(!stagedRace&&raceMotion.plan?.after.lap!==S.race.lap)raceMotion.show(raceSnapshot(S));
    if(!running)raceMotion.pause();liveFrame(raceMotion.sample());
  }
  function beginRaceLap(){
    if(!running||!S||S.phase!=='race'||S.race.pending||modalContent||view!=='weekend')return;
    if(stagedRace){raceMotion?.play();return;}
    stagedRace=C.clone(S);if(!C.advance(stagedRace,1)){stagedRace=null;pauseRace();return;}
    raceMotion.transition(raceSnapshot(S),raceSnapshot(stagedRace),LAP_PLAYBACK_MS,{autoplay:true}).setSpeed(speed);
    if(stagedRace.phase==='post'){const pitButton=$('[data-action="pit"]');if(pitButton){pitButton.disabled=true;pitButton.textContent='最后一圈，准备冲线';}for(const button of document.querySelectorAll('button'))if(button.dataset.tactic||button.dataset.action?.startsWith('plan-')||button.dataset.action==='pit-cancel')button.disabled=true;}
  }
  function playRace(mode='continuous'){
    if(S?.phase!=='race'||S.race.pending||modalContent||planDraft)return;raceAlerts=[];C.clearRaceAlerts?.(S);popupMinimized=false;
    running=true;playMode=mode;render(true);beginRaceLap();
  }
  function updatePlanDraft(){if(S.race.planDraft!==undefined){S.race.planDraft=C.clone(planDraft);save();}render(true);}
  function nextCommandLap(){return S.race.lap+(stagedRace||S.race.livePace?.progress>0?2:1);}
  function setImmediateMode(mode){
    if(S?.phase!=='race'||C.car(S).dnf||!Object.hasOwn(C.modes,mode))return;
    const resume=running;raceMotion?.pause();
    if(stagedRace&&raceMotion.fraction>=1){running=false;completeRaceLap();if(S.phase!=='race')return;}
    if(stagedRace&&raceMotion.sample()?.cars.find(c=>c.id==='you')?.dnf){if(resume)raceMotion.play();return;}
    const fraction=stagedRace?raceMotion.fraction:S.race.livePace?.progress||0;
    if(!C.setDrivingMode(S,mode,fraction)){if(resume)raceMotion?.play();return;}
    recomputeStagedLap();if(stagedRace)raceMotion.retarget(raceSnapshot(stagedRace));
    afterState();toast(C.modes[mode].label+'已立即生效'+(S.race.sc?'；安全车期间仍遵守限速。':'，从当前位置开始执行。'));
    if(resume&&!S.race.pending){running=true;if(stagedRace)raceMotion.play();else playRace();}
  }
  function recomputeStagedLap(){
    if(!stagedRace)return;
    // Future commands preserve this lap's physics. Replaying its saved start
    // also cancels an expiry already calculated behind the current animation.
    const next=C.clone(S);if(C.advance(next,1)===1)stagedRace=next;
  }
  function futurePlan(){const r=S.race;return (r.queuedPlan?.stops||r.plan?.stops||[]).filter(x=>!x.done&&x.lap>=nextCommandLap()).map(x=>({lap:x.lap,comp:x.comp})).sort((a,b)=>a.lap-b.lap);}
  function applyPitPlan(stops){if(S?.phase!=='race'||stagedRace?.phase==='post'){toast('最后一圈已经开始，无法再修改后续进站。');return false;}const lap=nextCommandLap();if(!C.setPitPlan(S,stops,lap)){toast('计划未应用：进站圈数须不同，且应位于当前执行圈之后、最后一圈之前。');return false;}if(stagedRace?.phase==='race')C.setPitPlan(stagedRace,stops,lap);afterState();return true;}
  function skipRace(){pauseRace();if(stagedRace){S=stagedRace;stagedRace=null;}if(S.phase==='race')C.simulateToEnd(S);showFinishBoard=S.phase==='post';raceAlerts=[];popupMinimized=false;planDraft=null;C.clearRaceAlerts?.(S);if(raceMotion)raceMotion.show(raceSnapshot(S));afterState(false);}
  function completeRaceLap(){
    if(!stagedRace)return;S=stagedRace;stagedRace=null;
    raceAlerts=alertsEnabled?CareerNativeRaceUI.collectAlerts((S.race.alerts?.length?S.race.alerts:S.race.log.filter(e=>e.lap===S.race.lap))):[];
    if(playMode==='one'||S.phase!=='race'||S.race.pending||raceAlerts.length)running=false;
    if(S.phase==='post'){showFinishBoard=true;raceAlerts=[];}
    popupMinimized=false;afterState();
    const upgrades=(S.race.growthEvents||[]).filter(e=>e.id==='you'&&e.lap===S.race.lap);if(upgrades.length)toast(upgrades.map(e=>e.type==='talent'?e.name+' 升至 Lv.'+e.to:e.name+' +'+e.gain.toFixed(2)).join(' · '));
    if(running)setTimeout(beginRaceLap,0);
  }

  try{window.Platform?.defineAchievements?.(Object.entries(achievements).map(([id,[,title,description]])=>({id,title,description})));}catch{}
  render();
})();
