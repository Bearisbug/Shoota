<title>F1-Driver · 争冠之路 · 2026.10.22.2</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}

/* Layout: pit-wall shell — sticky team bar, left rail, dense timing panels. Single dark theme by choice (pit-wall screens). Accent follows the player's team livery. */
:root {
  --bg: #0a0c0f; --rail: #0d1014; --panel: #12161b; --panel2: #191e25; --line: #222932; --line2: #2e3743;
  --fg: #e3e8ee; --muted: #8a96a4; --dim: #5a6573;
  --accent: #ff8000; --accent-ink: #160b00; --accent-soft: rgba(255, 128, 0, .14);
  --purple: #b25cff; --green: #3ddc84; --yellow: #ffd23f; --red: #ff4d57; --blue: #4aa8ff;
  --good: var(--green); --bad: var(--red); --warn: var(--yellow);
  --f-display: 'Titillium Web', 'Noto Sans SC', 'Arial Narrow', sans-serif;
  --f-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13.5px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--rail); }
* { box-sizing: border-box; }
a { color: inherit; text-decoration: none; cursor: pointer; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

#app { display: grid; grid-template-columns: 196px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--rail); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; flex-wrap: wrap; }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, var(--accent) 0 34%, transparent 34%); }
.brand { font: 900 17px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; font-style: italic; }
.brand b { color: var(--accent); }
.club { display: flex; align-items: center; gap: 10px; min-width: 0; }
.livery { width: 34px; height: 22px; border-radius: 3px; display: grid; place-items: center; font: 900 11px/1 var(--f-display); letter-spacing: .04em; flex: none; transform: skewX(-12deg); }
.livery span { transform: skewX(12deg); }
.club .nm { font: 700 17px/1.1 var(--f-display); letter-spacing: .02em; white-space: nowrap; }
.club .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
.kpis { display: flex; gap: 18px; margin-left: auto; flex-wrap: wrap; }
.kpi { text-align: right; }
.kpi small { display: block; color: var(--dim); font: 600 10.5px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 3px; }
.kpi b { font: 700 15px/1 var(--f-mono); }
.go .btn.pri { font: 700 15px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 9px 18px; }

nav.rail { background: var(--rail); border-right: 1px solid var(--line); padding: 10px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
nav.rail .grp { font: 700 11px/1 var(--f-display); letter-spacing: .16em; color: var(--dim); text-transform: uppercase; padding: 14px 10px 6px; }

nav.rail a:hover { background: var(--panel2); color: var(--fg); }
nav.rail a.on { background: var(--accent-soft); color: var(--fg); box-shadow: inset 3px 0 0 var(--accent); }
.badge { background: var(--accent); color: var(--accent-ink); font: 700 11px/1 var(--f-mono); padding: 2px 6px; border-radius: 9px; }

main { overflow-y: auto; padding-block: 18px 48px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); min-width: 0; }
.h1 { font: 900 28px/1.05 var(--f-display); letter-spacing: .01em; text-transform: uppercase; margin: 0 0 4px; text-wrap: balance; font-style: italic; }
.h1 small { font: 600 14px/1 var(--f-display); color: var(--muted); font-style: normal; letter-spacing: .06em; margin-left: 8px; }
.lede { color: var(--muted); margin: 0 0 16px; max-width: 72ch; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); align-items: start; }
.grid.g2 { grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); }
.grid.g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sp { flex: 1; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; min-width: 0; }
.card > h3 { margin: 0; padding: 10px 14px; font: 700 13px/1.2 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.card > h3 .sp { flex: 1; }
.card .bd { padding: 12px 14px; }
.card .bd.flush { padding: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.big { font: 900 36px/1 var(--f-display); font-style: italic; }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .acc { color: var(--accent); } .pur { color: var(--purple); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.note { background: var(--panel2); border-left: 3px solid var(--accent); padding: 9px 12px; border-radius: 0 4px 4px 0; color: var(--muted); }
.note b { color: var(--fg); }
.note.bad { border-left-color: var(--bad); } .note.good { border-left-color: var(--good); }

.btn { background: var(--panel2); border: 1px solid var(--line2); padding: 6px 12px; border-radius: 3px; cursor: pointer; white-space: nowrap; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn.ghost { background: transparent; }
.btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.btn[disabled] { opacity: .38; cursor: not-allowed; }
.btn.big { font: 700 16px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 11px 20px; }

.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font: 700 11px/1.2 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel); }
table.t td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t tr:hover td { background: rgba(255, 255, 255, .025); }
table.t .n, table.t th.n { text-align: right; }
table.t tr.me td { background: var(--accent-soft); }
table.t tr.cut td { border-bottom: 2px solid var(--line2); }
table.t .num { font-family: var(--f-mono); font-size: 12.5px; }
.pl { color: var(--fg); font-weight: 500; cursor: pointer; } .pl:hover { color: var(--accent); text-decoration: underline; }
.tm { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; }
.tm i { width: 4px; height: 14px; border-radius: 1px; display: inline-block; flex: none; }
.code { font: 700 13px/1 var(--f-display); letter-spacing: .06em; }
.nat { font: 600 10.5px/1 var(--f-mono); color: var(--dim); }

.ov { display: inline-block; min-width: 30px; text-align: center; font: 700 12.5px/1 var(--f-mono); padding: 4px 4px; border-radius: 3px; color: #0a0c0f; }
.meter { height: 7px; background: var(--panel2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); min-width: 50px; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.meter.g > i { background: var(--good); } .meter.w > i { background: var(--warn); } .meter.b > i { background: var(--bad); }
.chip { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
.chip.acc { color: var(--accent); border-color: var(--accent); }
.chip.good { color: var(--good); border-color: rgba(61, 220, 132, .45); }
.chip.bad { color: var(--bad); border-color: rgba(255, 77, 87, .45); }
.chip.warn { color: var(--warn); border-color: rgba(255, 210, 63, .45); }

/* tyres */
.ty { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--c); font: 900 10px/1 var(--f-display); color: var(--fg); background: #000; flex: none; vertical-align: middle; }
.tyw { display: inline-flex; align-items: center; gap: 5px; }

/* result cells */
.rc { display: inline-block; min-width: 26px; text-align: center; font: 700 11.5px/1 var(--f-mono); padding: 4px 3px; border-radius: 2px; background: var(--panel2); color: var(--muted); }
.rc.p1 { background: #e7c24b; color: #1a1300; } .rc.p2 { background: #c9d0d8; color: #111; } .rc.p3 { background: #c98a4f; color: #1a0d00; }
.rc.pts { background: rgba(61, 220, 132, .16); color: var(--green); }
.rc.dnf { background: rgba(255, 77, 87, .14); color: var(--red); }
.rc.na { background: transparent; color: var(--dim); }
.rc sup { font-size: 8.5px; color: var(--purple); margin-left: 1px; }

/* attributes */
.attr { display: grid; grid-template-columns: 76px minmax(0, 1fr) 30px; gap: 10px; align-items: center; padding: 3px 0; }
.attr span:first-child { color: var(--muted); }
.attr b { font: 700 12.5px/1 var(--f-mono); text-align: right; }

/* driver header */
.dh { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.dh .num { font: 900 italic 40px/1 var(--f-display); width: 64px; text-align: center; flex: none; }
.dh .nm { font: 700 22px/1.05 var(--f-display); }
.dh .meta { color: var(--muted); font-size: 12.5px; }
.dh .rt { margin-left: auto; display: flex; gap: 18px; }
.dh .rt div { text-align: center; } .dh .rt small { display: block; color: var(--dim); font: 700 10.5px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 5px; }

/* inputs */
input[type=number], select, input[type=text] { background: var(--bg); color: var(--fg); border: 1px solid var(--line2); border-radius: 3px; padding: 5px 7px; font: inherit; }
input[type=number] { width: 72px; font-family: var(--f-mono); }
textarea { width: 100%; min-height: 110px; background: var(--bg); color: var(--fg); border: 1px solid var(--line2); border-radius: 3px; font: 11.5px/1.4 var(--f-mono); padding: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 3px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 5px 10px; cursor: pointer; color: var(--muted); border-right: 1px solid var(--line2); font-size: 12.5px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-soft); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.seg button[disabled] { opacity: .35; cursor: not-allowed; }

/* modal & toast */
[hidden] { display: none !important; }
#modal { position: fixed; inset: 0; background: rgba(3, 4, 6, .74); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: calc(40px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.mbox { background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; width: min(860px, 100%); position: relative; padding: 18px 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
.mbox .x { position: absolute; right: 10px; top: 6px; background: none; border: 0; font-size: 24px; color: var(--muted); cursor: pointer; }
#toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 80; max-width: min(380px, calc(100% - 32px)); }
.toast { background: var(--panel2); border: 1px solid var(--line2); border-left: 3px solid var(--accent); padding: 9px 12px; border-radius: 3px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); animation: tin .2s ease-out; }
.toast.good { border-left-color: var(--good); } .toast.bad { border-left-color: var(--bad); }
@keyframes tin { from { transform: translateY(6px); opacity: 0; } }

/* start screen */
.start { max-width: 1200px; margin: 0 auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 20px; display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
.hero h1 { font: 900 italic clamp(38px, 7vw, 76px)/.88 var(--f-display); letter-spacing: -.01em; text-transform: uppercase; margin: 0; }
.hero h1 b { color: var(--red); }
.hero .kick { font: 700 12px/1 var(--f-display); letter-spacing: .3em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
.hero p { color: var(--muted); max-width: 52ch; margin: 0; }
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0; cursor: pointer; display: flex; flex-direction: column; text-align: left; overflow: hidden; }
.tcard:hover { border-color: var(--line2); background: var(--panel2); }
.tcard .stripe { height: 5px; background: var(--c); }
.tcard .in { padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 6px; }
.tcard .tn { font: 700 19px/1 var(--f-display); }
.tcard .tf { color: var(--dim); font-size: 11.5px; }
.tcard .ds { font: 600 13px/1.3 var(--f-display); letter-spacing: .03em; }
.tcard .st { display: flex; gap: 12px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.tcard .st b { color: var(--fg); font-family: var(--f-mono); font-weight: 700; }

/* race view */
.rhead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; margin-bottom: 12px; }
.lapc { font: 900 italic 30px/1 var(--f-display); }
.lapc small { font: 600 14px/1 var(--f-display); color: var(--muted); font-style: normal; }
.flag { font: 700 13px/1 var(--f-display); letter-spacing: .12em; padding: 6px 10px; border-radius: 2px; text-transform: uppercase; }
.flag.green { background: rgba(61, 220, 132, .16); color: var(--green); }
.flag.sc { background: var(--yellow); color: #1a1400; animation: blink 1s steps(2) infinite; }
.flag.vsc { background: rgba(255, 210, 63, .2); color: var(--yellow); border: 1px dashed var(--yellow); }
.flag.chq { background: repeating-conic-gradient(#fff 0 25%, #111 0 50%) 0 0/10px 10px; color: transparent; width: 40px; }
@keyframes blink { 50% { opacity: .55; } }
.rgrid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.tower td { padding: 4px 6px; font-size: 12.5px; }
.tower .pos { font: 700 13px/1 var(--f-mono); width: 26px; text-align: right; }
.tower .chg { font-size: 10px; width: 22px; }
.tower .up { color: var(--green); } .tower .dn { color: var(--red); }
.tower tr.out td { opacity: .45; }
.tower tr.pit td { background: rgba(74, 168, 255, .08); }
.ctrl { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
.ctrl .ch { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.ctrl .ch .p { font: 900 italic 28px/1 var(--f-display); min-width: 46px; }
.ctrl .cb { padding: 10px 12px; display: flex; flex-direction: column; gap: 9px; }
.ctrl .cb .lbl { color: var(--dim); font: 700 10.5px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; min-width: 54px; }
.feed { max-height: 330px; overflow-y: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
.ev { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; padding: 5px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.ev .l { color: var(--dim); font-family: var(--f-mono); font-size: 11.5px; }
.ev.me { box-shadow: inset 3px 0 0 var(--accent); }
.e-sc .t, .e-w .t { color: var(--yellow); } .e-bad .t { color: var(--red); } .e-pit .t { color: var(--blue); } .e-win .t { color: var(--green); font-weight: 700; } .e-pen .t, .e-inc .t { color: #ff9f43; } .e-radio .t { color: var(--fg); font-style: italic; } .e-ov .t { color: var(--muted); }
.prompt { border: 1px solid var(--yellow); background: linear-gradient(180deg, rgba(255, 210, 63, .1), var(--panel)); border-radius: 4px; padding: 14px 16px; margin-bottom: 12px; }
.prompt h4 { margin: 0 0 6px; font: 900 italic 20px/1.1 var(--f-display); text-transform: uppercase; color: var(--yellow); }
.prompt p { margin: 0 0 10px; }
.rec { font-size: 10.5px; background: var(--yellow); color: #1a1400; padding: 1px 5px; border-radius: 2px; margin-left: 6px; font-weight: 700; }

/* misc */
.trk { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.trk div small { display: block; color: var(--dim); font: 700 10.5px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
.trk div b { font: 700 16px/1.1 var(--f-mono); }
.opt { border: 1px solid var(--line2); border-radius: 4px; padding: 9px 11px; cursor: pointer; background: var(--panel2); text-align: left; display: flex; flex-direction: column; gap: 3px; }
.opt:hover { border-color: var(--muted); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt b { font: 700 14px/1.2 var(--f-display); }
.opt small { color: var(--muted); font-size: 12px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.dfsel { display: flex; gap: 6px; }
.pumeter { display: flex; align-items: center; gap: 3px; font-size: 11px; }
.pumeter i { width: 18px; height: 6px; border-radius: 1px; background: var(--line2); }
.pumeter i.used { background: var(--muted); opacity: .5; }
.pumeter i.cur { background: var(--accent); }
.pumeter i.next { background: var(--green); }
.pumeter i.over { outline: 1px solid var(--red); }
.pumeter span { margin-left: 6px; }
.dftab { display: grid; gap: 0; font-size: 12.5px; }
.dftab .dfh, .dftab .dfr { display: grid; grid-template-columns: 64px repeat(5, minmax(0, 1fr)); gap: 4px; align-items: center; }
.dftab .dfh { margin-bottom: 4px; }
.dftab .dfh > span { font-size: 11px; }
.dftab .dfh button { padding: 8px 0; border: 1px solid var(--line2); background: var(--panel2); border-radius: 3px; cursor: pointer; font: 700 15px/1 var(--f-mono); color: var(--muted); }
.dftab .dfh button.rng { border-color: rgba(61, 220, 132, .5); color: var(--fg); }
.dftab .dfh button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.dftab .dfr { padding: 5px 0; border-top: 1px solid var(--line); }
.dftab .dfr > span:first-child { color: var(--dim); font-size: 11.5px; }
.dftab .dfr > span:not(:first-child) { text-align: center; font-family: var(--f-mono); color: var(--muted); font-size: 12px; padding: 2px 0; border-radius: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dftab .dfr > span.on { color: var(--fg); background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 600; }
.dftab .dfr small { font-size: 9.5px; color: var(--dim); margin-left: 1px; }

@media (max-width: 520px) { .dftab .dfh, .dftab .dfr { grid-template-columns: 52px repeat(5, minmax(0, 1fr)); gap: 2px; } .dftab .dfr > span:not(:first-child) { font-size: 10.5px; } .dftab .dfr small { display: none; } }
.dfsel button { flex: 1; padding: 8px 0; border: 1px solid var(--line2); background: var(--panel2); border-radius: 3px; cursor: pointer; font: 700 15px/1 var(--f-mono); color: var(--muted); position: relative; }
.dfsel button.rng { border-color: rgba(61, 220, 132, .5); color: var(--fg); }

.bars { display: flex; flex-direction: column; gap: 4px; }

.speed { display: flex; align-items: center; gap: 8px; }

/* strategist */
.strat { display: flex; flex-direction: column; gap: 3px; background: var(--panel2); border-left: 3px solid var(--purple); padding: 7px 10px; border-radius: 0 3px 3px 0; font-size: 12.5px; }

.tw-ty { display: inline-block; width: 34px; height: 5px; background: var(--panel2); border-radius: 3px; overflow: hidden; vertical-align: middle; margin-left: 4px; }

/* live pit plan */
.pplan { display: flex; flex-direction: column; gap: 5px; background: var(--panel2); border-left: 3px solid var(--blue); padding: 7px 10px; border-radius: 0 3px 3px 0; font-size: 12.5px; }

.pp-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.tyc { background: none; border: 1px solid transparent; border-radius: 50%; padding: 1px; cursor: pointer; opacity: .45; }
.tyc.on { opacity: 1; border-color: var(--fg); }

.pplan.editing { border-left-color: var(--yellow); background: linear-gradient(90deg, rgba(255,210,63,.06), var(--panel2) 40%); }
.pp-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.pplan.editing .pp-h b { color: var(--yellow); }
.pp-st { font: 700 10.5px/1 var(--f-display); letter-spacing: .08em; padding: 3px 6px; border-radius: 3px; background: var(--line); color: var(--muted); white-space: nowrap; }
.pp-st.run { background: rgba(74,168,255,.18); color: var(--blue); animation: blink 1.2s steps(2) infinite; }
.pp-row.proc { background: rgba(74,168,255,.06); border-radius: 3px; padding: 3px 4px; }
.stl { display: flex; flex-direction: column; gap: 3px; }
.stl .stint { height: 12px; }
.stl-lab { position: relative; height: 13px; font: 600 10px/1 var(--f-mono); color: var(--dim); }
.stl-lab span { position: absolute; top: 0; transform: translateX(-50%); }
.stl-lab span:first-child { left: 0; transform: none; }
.pp-rec { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
/* lap time breakdown */
.lapbrk { font-size: 12px; }
.lapbrk > b { display: block; font: 700 10.5px/1 var(--f-display); letter-spacing: .12em; color: var(--dim); margin-bottom: 5px; }
.lbs { display: flex; flex-wrap: wrap; gap: 4px; }
.lb { display: inline-flex; gap: 5px; align-items: baseline; padding: 3px 7px; border-radius: 3px; background: var(--panel2); font: 600 12px/1 var(--f-mono); color: var(--muted); }
.lb i { font: 500 11px/1 var(--f-body); font-style: normal; color: var(--dim); }
.lb.pos { color: #ff8a8f; } .lb.neg { color: var(--green); }
/* radar */
.wxrow { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }

.rc-strip { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; height: 70px; align-items: end; padding-bottom: 16px; }
.rc-cell { position: relative; height: 100%; display: flex; align-items: flex-end; }

.rc-line.l15 { bottom: calc(16px + 54px * .15); } .rc-line.l65 { bottom: calc(16px + 54px * .65); }
/* popup */
.rpop-wrap { position: fixed; inset: 0; z-index: 55; background: rgba(3, 4, 6, .55); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fadein .15s ease-out; }
@keyframes fadein { from { opacity: 0; } }
.rpop { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line2); border-top: 4px solid var(--pc, var(--accent)); border-radius: 6px; padding: 16px 18px 18px; box-shadow: 0 24px 60px rgba(0, 0, 0, .6); max-height: 100%; overflow-y: auto; animation: popin .2s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes popin { from { transform: translateY(10px) scale(.97); } }
.rpop.k-sc, .rpop.k-w { --pc: var(--yellow); } .rpop.k-bad, .rpop.k-pit { --pc: var(--red); } .rpop.k-inc, .rpop.k-pen { --pc: #ff9f43; } .rpop.k-lead { --pc: var(--purple); }
.rpop .ph { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.rpop .pflag { font: 700 11px/1 var(--f-display); letter-spacing: .16em; text-transform: uppercase; color: var(--pc, var(--accent)); }
.rpop h4 { margin: 0 0 10px; font: 900 italic 26px/1.1 var(--f-display); text-transform: uppercase; }
.pevs { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.pev { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 7px 10px; background: var(--panel2); border-radius: 3px; border-left: 3px solid var(--line2); }
.pev.sc, .pev.w { border-left-color: var(--yellow); } .pev.bad { border-left-color: var(--red); } .pev.inc, .pev.pen { border-left-color: #ff9f43; } .pev.good { border-left-color: var(--purple); }
.pev.me { background: var(--accent-soft); }
.pendpit { display: flex; flex-direction: column; gap: 6px; background: var(--accent-soft); border-radius: 4px; padding: 8px 10px; margin-bottom: 12px; font-size: 13px; }
.btn.danger { background: transparent; border-color: var(--red); color: var(--red); }
.pq { margin-bottom: 12px; } .pq p { margin: 4px 0 0; color: var(--muted); }
.rpop-mini { position: fixed; z-index: 55; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(640px, calc(100% - 32px)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line2); border-left: 4px solid var(--pc, var(--accent)); border-radius: 6px; padding: 10px 14px; box-shadow: 0 16px 40px rgba(0, 0, 0, .55); animation: popin .2s ease-out; }
.rpop-mini.k-sc, .rpop-mini.k-w { --pc: var(--yellow); } .rpop-mini.k-bad { --pc: var(--red); } .rpop-mini.k-inc { --pc: #ff9f43; } .rpop-mini.k-lead { --pc: var(--purple); }
.rpop-mini .pflag { font: 700 11px/1 var(--f-display); letter-spacing: .14em; color: var(--pc, var(--accent)); }
/* diagnosis */
.sub2 { color: var(--dim); font: 700 11px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; }
.dv { display: grid; grid-template-columns: 70px minmax(0, 1fr) 70px; gap: 10px; align-items: center; padding: 4px 0; font-size: 12.5px; }
.dv > span:last-child { text-align: right; }
.dvt { position: relative; height: 12px; background: var(--panel2); border-radius: 2px; }
.dvt i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.dvt b { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.fitrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.fit { background: var(--panel2); border-radius: 4px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.fit svg { width: 54px; height: 54px; }
.fit b { font: 900 italic 18px/1 var(--f-display); }
.fit span { font-size: 11.5px; color: var(--muted); }

@media (max-width: 860px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
  nav.rail { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px 8px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  nav.rail .grp { display: none; }
  nav.rail a { white-space: nowrap; }
  .kpis { margin-left: 0; width: 100%; justify-content: space-between; order: 3; }
  .kpi { text-align: left; }
  .rgrid { grid-template-columns: minmax(0, 1fr); }
  .grid.g2 { grid-template-columns: minmax(0, 1fr); }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .dh .rt { margin-left: 0; }
}

/* ---------- records & influence ---------- */
.natc { font-size: 11.5px; color: var(--muted); white-space: nowrap; }

@media (max-width: 900px) { .wgrid { grid-template-columns: 1fr; } .kpis4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .lbrow { grid-template-columns: 18px 96px minmax(0, 1fr) 52px; } .lbrow .ib, .lbrow > span:last-child { display: none; } .kpi2 b { font-size: 19px; } .mkrow { grid-template-columns: 64px minmax(0, 1fr) 50px 40px; } }

.world-page button.lbrow, .world-page button.world-market-row {

.world-page .wleg button.lg { background: none; border: 0; padding: 2px 0; cursor: pointer; }
.world-page .lbrow { grid-template-columns: 20px 112px minmax(25px, 1fr) 58px 68px 26px; gap: 6px; }
.world-page .lbrow.d { grid-template-columns: 20px minmax(0, 1.5fr) minmax(25px, 1fr) 58px; }
.world-actions { margin: 12px 0; gap: 8px; flex-wrap: wrap; }

.driver-kpis .kpi2 span { white-space: normal; overflow: visible; }
.driver-finance-kv > div {
  display: flex; justify-content: space-between; align-items: baseline;

.fame-row > b { text-align: right; font-size: 12px; }

.card-head { flex-wrap: wrap; }
.card-head h2, .card-head h3 { letter-spacing: .14em; }
.metrics { border: 0; border-radius: 0; background: none; gap: 10px; }

.metric-value { font: 700 24px/1.15 var(--f-mono); overflow-wrap: anywhere; }
@media (max-width: 680px) {
  .driver-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .driver-kpis .kpi2 { padding: 10px 11px; }
  .metric:nth-child(3) { border-left: 1px solid var(--line); }

/* Final race-layout overrides, matched to F1 Team Principal 2026.
   Load after career-layout.css and race-animation.css. The original shell,
   colours, typography and card system remain the source of these values. */

/* Race header: the original compact pit-wall toolbar. */
.race-stage-toolbar.rhead,
.rhead:has(+ .race-stage) {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: 10px 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  margin-bottom: 12px;
}

/* At desktop widths the track always owns the wider column. */
.race-stage.rgrid {
  display: grid;
  width: 100%;
  max-width: none;
  grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
  gap: 12px;
  align-items: start;
}

.race-stage > .race-main,
.race-stage > .race-sidebar {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  max-width: 100%;
  order: 0;
}

/* Undo the earlier <=1000px rule that moved the timing card ahead of the map. */
.race-stage.rgrid > .card {
  order: 0;
  max-height: none;
  overflow: visible;
}

.race-main .mapcard {
  position: relative;
  padding: 10px;
  overflow: hidden;
}

.race-main .map-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 0 0 8px;
  padding: 0 4px;
  font-size: 12px;
}

/* Give the SVG a real, responsive canvas; no fixed 230/300/330px SVG height. */
.race-stage .race-map-slot {
  display: block;
  position: relative;
  width: 100%;
  height: auto;
  min-height: 0;
  max-height: 560px;
  aspect-ratio: 4 / 3;
  overflow: hidden;
}

.race-stage #mapslot.race-map-slot {
  aspect-ratio: 4 / 3;
  max-height: 560px;
}

.race-stage .race-map-slot > .race-track-svg,
.race-stage .race-map-slot > .circuit,
.race-stage .race-map-slot > .livemap {
  display: block;
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  min-height: 0;
  max-width: none;
  max-height: none;
  overflow: visible;
}

.race-main .maplg {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  padding: 6px 4px 2px;
  font-size: 12px;
  color: var(--muted);
}

/* Keep the source's dense, two-panel driver and pit controls below the track. */
.race-main > .control-grid,
.race-main > .race-controls,
.race-main > .grid.g2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  min-width: 0;
  align-items: start;
}

.race-main .ctrl .ch {
  gap: 10px;
  padding: 10px 12px;
}

.race-main .ctrl .cb {
  padding: 10px 12px;
  gap: 9px;
}

.race-main .ctrl .segmented {
  flex-wrap: wrap;
}

.race-feed-card .feed {
  max-height: 330px;
  border: 0;
  border-radius: 0 0 4px 4px;
  overflow-y: auto;
  overscroll-behavior-y: contain;
}

.race-sidebar .race-feed-card {
  width: 100%;
  min-width: 0;
  overflow: hidden;
}
.race-feed-card .race-feed-heading {
  flex-wrap: wrap;
  gap: 8px;
}
.race-feed-options {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  letter-spacing: 0;
  text-transform: none;
  font: 500 12px/1.5 var(--f-body);
}
.race-feed-options label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.race-feed-card .ev .t { min-width: 0; overflow-wrap: anywhere; }
.race-feed-card .feed:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* The timing table stays in normal flow, with all 24 drivers reachable. */
.race-sidebar .race-timing {
  width: 100%;
  min-width: 0;
  max-height: none;
  overflow: hidden;
}

.race-sidebar .race-timing .tw,
.race-sidebar .race-timing .table-wrap {
  width: 100%;
  max-height: none;
  overflow-x: auto;
  overflow-y: visible;
}

.race-sidebar .tower {
  width: 100%;
  min-width: 380px;
  border-collapse: collapse;
}

.race-sidebar .tower th {
  padding: 7px 6px;
  font-size: 10.5px;
  white-space: nowrap;
}

.race-sidebar .tower td {
  padding: 4px 6px;
  font-size: 12.5px;
  white-space: nowrap;
}

.race-sidebar .tower .pos {
  width: 26px;
  font: 700 13px/1 var(--f-mono);
  text-align: right;
}

.race-sidebar .tower .driver-link {
  font-size: 12.5px;
}

.race-sidebar details.card > summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 14px;
  list-style: none;
  color: var(--muted);
  cursor: pointer;
  font: 700 13px/1.2 var(--f-display);
  letter-spacing: .12em;
}

.race-sidebar details.card > summary::-webkit-details-marker {
  display: none;
}

.race-sidebar details.card > summary::after {
  content: "+";
  color: var(--dim);
  font: 700 15px/1 var(--f-mono);
}

.race-sidebar details.card[open] > summary {
  border-bottom: 1px solid var(--line);
}

.race-sidebar details.card[open] > summary::after {
  content: "−";
}

/* Wide pit-wall displays can use a larger canvas without stretching the track. */
@media (min-width: 1440px) {
  .race-stage .race-map-slot,
  .race-stage #mapslot.race-map-slot {
    max-height: 640px;
  }
}

/* Optional driver-controlled map expansion; the timing column is still usable. */
.race-stage.rgrid.is-map-expanded {
  grid-template-columns: minmax(0, 2fr) minmax(330px, .8fr);
}

.race-stage.is-map-expanded .race-map-slot,
.race-stage.is-map-expanded #mapslot.race-map-slot {
  aspect-ratio: auto;
  height: min(76vh, 780px);
  min-height: 500px;
  max-height: 780px;
}

/* On narrow screens the timing and feed stay together below the track controls. */
@media (max-width: 860px) {
  .race-stage.rgrid,
  .race-stage.rgrid.is-map-expanded {
    grid-template-columns: minmax(0, 1fr);
  }

  .race-stage > .race-main {
    order: 0;
  }

  .race-stage > .race-sidebar {
    order: 1;
  }

  .race-stage.is-map-expanded .race-map-slot,
  .race-stage.is-map-expanded #mapslot.race-map-slot {
    height: 60vh;
    min-height: 360px;
    max-height: 640px;
  }
}

@media (max-width: 520px) {
  .race-main > .control-grid,
  .race-main > .race-controls,
  .race-main > .grid.g2 {
    grid-template-columns: minmax(0, 1fr);
  }

  .race-main .map-heading {
    align-items: flex-start;
    font-size: 11px;
  }

  .race-main .map-heading > [data-live-progress] {
    flex-shrink: 0;
  }

  .race-main .maplg {
    column-gap: 10px;
    row-gap: 4px;
    font-size: 11px;
  }
}

/* Native track details and labels from the supplied document. */
.career-track-map{--trk-edge:#59636f;--trk:#2b333d}
.career-track-map[data-wet="true"]{--trk:#243444}
.career-track-map .track-sector-label{font:700 34px var(--f-display);paint-order:stroke;stroke:var(--bg);stroke-width:4px}

/* The legacy live race uses one first-person car control instead of two team cars. */

/* The driver's original pace/tactic controls, offered in a real battle. */
.rpop .driving-choice { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; white-space: normal; text-align: left; max-width: 100%; }
.rpop .driving-choice small { display: block; max-width: 270px; color: var(--muted); font: 400 11.5px/1.6 var(--f-body); }
.rpop .driving-choice.pri small { color: var(--accent-ink); opacity: .82; }
.driving-status { padding: 7px 10px; border-left: 3px solid var(--yellow); background: var(--panel2); font-size: 12px; }
.driving-status small { display: block; color: var(--muted); margin-top: 3px; font-size: 11.5px; line-height: 1.6; }

/* Phone portrait (≤600px): compact, dense pit-wall layout in the spirit of Football Manager Mobile.
   Body 13px, secondary 11–12px, table figures 11–12px tabular, labels ≥10px; condensed face for headings and numbers;
   4–8px module spacing; 40–44px primary controls. Desktop is untouched — every rule lives inside this query. */
@media (max-width: 600px) {
  :root {
    --dim: #7f8b99; /* raised from #5a6573 so 10–11px labels keep ≥4.5:1 on the dark panels */
    --f-cond: 'Roboto Condensed', 'Arial Narrow', 'Avenir Next Condensed', 'sans-serif-condensed', 'Noto Sans SC', 'PingFang SC', sans-serif;
    --m-gap: 8px; --m-pad: 8px; --m-tap: 40px;
  }
  body { font-size: 13px; line-height: 1.45; }
  .muted, .dim, small { line-height: 1.4; }

  /* Condensed face for headings and figures; hierarchy by weight and colour, not size */
  .h1, .hero h1, .card > h3, .card-head h2, .card-head h3, .top .club .nm, .kpi b, .kpi2 b, .metric-value,
  .result-position, .lapc, .tower .pos, .ch .p, .team-wordmark, .rpop h4, .modal-head h2, .big, .num, .res {
    font-family: var(--f-cond); font-stretch: condensed;
  }
  .kpi b, .kpi2 b, .metric-value, table, .lapc, .ch .p, .result-position, .num { font-variant-numeric: tabular-nums; }

  /* ---------- top bar: team + action on one row, four KPIs on the next ---------- */
  .top {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 8px;
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px));
  }
  .top .brand { display: none; }
  .top .club { grid-column: 1; grid-row: 1; gap: 6px; min-width: 0; }
  .top .club .nm { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .top .club .nm span { font-size: 11px !important; }
  .top .club .sub { font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
  .top .go { grid-column: 2; grid-row: 1; margin: 0; }
  .top .go .btn { min-height: var(--m-tap); padding: 0 12px; font-size: 13px; letter-spacing: .02em; }
  .top .kpis {
    grid-column: 1 / -1; grid-row: 2; order: 0; width: 100%; margin: 0;
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;
  }
  .top .kpi { text-align: left; min-width: 0; }
  .top .kpi small { font-size: 10px; letter-spacing: .04em; margin-bottom: 1px; color: var(--muted); }
  .top .kpi b { font-size: 13px; }
  .top .kpi .muted { font-size: 11px; }

  /* ---------- navigation: one swipeable tab strip, active tab underlined ---------- */
  nav.rail {
    padding: 0 max(4px, env(safe-area-inset-right, 0px)) 0 max(4px, env(safe-area-inset-left, 0px)); gap: 0;
    scrollbar-width: none; overscroll-behavior-x: contain;
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 20px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 20px), transparent);
  }
  nav.rail::-webkit-scrollbar { display: none; }
  .rail-link { width: auto; min-height: var(--m-tap); padding: 0 10px; font-size: 13px; border-radius: 0; white-space: nowrap; }
  .rail-link.on { background: none; color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }

  /* ---------- page rhythm: 8px modules, tight cards, small radii ---------- */
  main { padding: var(--m-pad) max(var(--m-pad), env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(var(--m-pad), env(safe-area-inset-left, 0px)); }
  .stack, .grid, .grid.g2 { gap: var(--m-gap); }
  .card, .metric, .kpi2, .choice, .save-slot, .calendar-item { border-radius: 4px; }
  .card > h3, .card-head { padding: 6px var(--m-pad); }
  .card > h3, .card-head h2, .card-head h3 { font-size: 11px; letter-spacing: .08em; }
  .card .bd, .card-body { padding: var(--m-pad); }
  .page-head { margin-bottom: var(--m-gap); gap: var(--m-gap); }
  .h1, .page-head .h1, .world-page .h1 { font-size: 18px; line-height: 1.15; margin-bottom: 2px; }
  .page-head p { font-size: 12px; line-height: 1.5; }
  .notice { padding: 6px var(--m-pad); font-size: 12px; line-height: 1.55; margin-bottom: var(--m-gap); }
  .chip { font-size: 11px; }
  .gap { height: var(--m-gap); }
  .footer-note { font-size: 10px; margin-top: var(--m-gap); }
  p { margin-bottom: 6px; }

  /* intro */
  .start { padding-top: var(--m-pad); }
  .hero { gap: var(--m-gap); margin-bottom: var(--m-gap); }
  .hero h1, .start .hero h1 { font-size: 30px; }
  .hero .kick { font-size: 10px; letter-spacing: .16em; margin-bottom: 6px; }
  .start .hero p { font-size: 12.5px; line-height: 1.6; }

  /* figures that were display-sized on desktop */
  .metric { padding: var(--m-pad); }
  .metric-value { font-size: 20px; margin-top: 2px; }
  .kpi2 { padding: var(--m-pad); }
  .kpi2 b, .driver-kpis .kpi2 b { font-size: 17px; }
  .dh .num, .result-position { font-size: 28px; }
  .ch .p, span.big { font-size: 20px; }
  .team-wordmark, .modal-body .team-wordmark { font-size: 20px !important; }
  .lapc span { font-size: 20px; }
  .result-hero .right b { font-size: 18px; }
  .big, div.big { font-size: 17px; }
  .story-title { font-size: 14px; }
  h2.city, .res { font-size: 14px; }
  .modal-head h2 { font-size: 15px; }

  /* choices, buttons, segmented controls: 40px+ targets without inflating rows */
  .btn { min-height: var(--m-tap); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; font-size: 13px; }
  .btn.small, .btn.sm { min-height: var(--m-tap); padding: 0 10px; font-size: 12px; }
  .inline-link { min-height: var(--m-tap); display: inline-flex; align-items: center; }
  /* in-table links and sort headers fill the row height instead of making rows taller */
  td .inline-link, td a, td > button { min-height: 32px; display: inline-flex; align-items: center; }
  th button, th.sortable { min-height: 32px; white-space: nowrap; }
  th button { display: inline-flex; align-items: center; }
  .seg button { min-height: var(--m-tap); min-width: 44px; }
  .choices { gap: 6px; margin-top: var(--m-gap); }
  .choice { padding: 8px 10px; min-height: 44px; }
  .choice b { font-size: 13px; }
  .choice small, .choice span { font-size: 12px; }
  select, input { min-height: var(--m-tap); font-size: 16px; } /* 16px stops iOS zooming into focused fields */

  /* ---------- tables: 32px rows, condensed figures, sticky first column when wider than the screen ---------- */
  table.t td, td { padding: 0 6px; height: 32px; font-size: 12px; }
  th, table.t th { padding: 0 6px; height: 32px; font-size: 10px; letter-spacing: .06em; }
  .table-wrap, .tw { overflow-x: auto; overscroll-behavior-x: contain; }
  .table-wrap th:first-child, .table-wrap td:first-child, .tw th:first-child, .tw td:first-child { position: sticky; left: 0; z-index: 1; background: var(--panel); }

  /* ---------- race: toolbar → map → timing → my car → radar → feed ---------- */
  .rhead.race-stage-toolbar { gap: 6px; padding: var(--m-pad); }
  .rhead.race-stage-toolbar .chip { font-size: 11px; padding: 1px 6px; }
  .rhead.race-stage-toolbar > .btn { order: 1; flex: 1 1 40%; font-size: 13px; }
  .rhead.race-stage-toolbar > .btn.big { font-size: 14px; padding: 0 12px; }
  .rhead .speed { order: 2; width: 100%; }
  .rhead .speed .seg { flex: 1; display: flex; }
  .rhead .speed .seg button { flex: 1; }
  .rgrid.race-stage { display: flex; flex-direction: column; align-items: stretch; gap: var(--m-gap); }
  .race-stage .race-main, .race-stage .race-sidebar { display: contents; }
  .race-stage .race-map-card { order: 1; }
  .race-stage .race-timing { order: 2; }
  .race-stage .native-driver-control { order: 3; }
  .race-stage .radar { order: 4; }
  .race-stage .race-feed-card { order: 5; }
  .race-stage .race-sidebar .race-timing .tw { max-height: min(360px, 48dvh); overflow: auto; overscroll-behavior: contain; }
  .race-timing thead th { position: sticky; top: 0; z-index: 2; background: var(--panel); }
  .race-timing thead th:first-child { z-index: 3; }
  .tower { min-width: 0; }
  .race-stage .tower td { padding: 0 4px; height: 30px; font-size: 12px; }
  .tower td .inline-link, .tower td > button { min-height: 0; } /* the whole tower row is the tap target */
  .tower .pos { font-size: 12px; width: 22px; }

  /* in-race decisions become a bottom sheet so the map and tower stay visible above it */
  .rpop-wrap { align-items: flex-end; padding: 0; }
  .rpop {
    width: 100%; max-height: 78dvh; border-radius: 8px 8px 0 0; overscroll-behavior: contain;
    padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  }
  .rpop h4 { font-size: 17px; line-height: 1.2; }
  .rpop button, .rpop .btn { white-space: normal; text-align: left; justify-content: flex-start; flex-wrap: wrap; height: auto; min-height: 44px; max-width: 100%; padding: 8px 12px; line-height: 1.35; }
  .rpop .row { gap: 6px; }

  /* ---------- dialogs: fit the screen, respect safe areas, keep scroll inside ---------- */
  .modal-backdrop { padding: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .modal { max-height: calc(100dvh - 16px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overscroll-behavior: contain; border-radius: 6px; }
  .modal-head { padding: 6px 6px 6px 10px; }
  .modal-body { padding: var(--m-pad) 10px; }
  .modal-body .section { margin-bottom: 10px; }
  .modal-body .card { margin-top: var(--m-gap); }
  .modal-close { min-width: 40px; min-height: 40px; }
  .save-grid { gap: 6px; }
  .save-slot { padding: 8px 10px; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 8px; }
  .save-slot h3 { font-size: 13px; margin: 0; }
  .save-slot p { grid-column: 1; margin: 0; min-height: 0; font-size: 12px; }
  .save-slot .row { grid-column: 2; grid-row: 1 / span 2; margin: 0; display: flex; gap: 6px; }
  .modal-actions { margin-top: 10px; gap: 6px; }
  .modal-actions .btn { flex: 1 1 auto; }
}

  'use strict';
  const colors=['#ff4d57','#4aa8ff','#ffd23f'];

    return {x:s.a[0]+(s.b[0]-s.a[0])*fraction-Math.sin(s.angle)*off,y:s.a[1]+(s.b[1]-s.a[1])*fraction+Math.cos(s.angle)*off,angle:s.angle};

    // source centerline instead of cutting across a bend between sample points.
    for(let turn=Math.floor(from);turn<=Math.ceil(to);turn++)for(const s of g.segments){const f=turn+s.start/g.length;if(f>from&&f<to)fractions.push(f);}
    return [...new Set(fractions)].sort((a,b)=>a-b).map((fraction,i)=>{const p=at(g,fraction,offset);return (i?'L':'M')+p.x.toFixed(2)+' '+p.y.toFixed(2);}).join('');

    const labels=sectors?[{at:.03,off:-42,text:'S1 ▸',index:0},{at:1/3,off:-40,text:'S2',index:1},{at:2/3,off:-40,text:'S3',index:2}].map(s=>{const p=at(g,s.at,s.off);return `<text class="sl track-sector-label" data-sector-label="${s.index+1}" x="${p.x.toFixed(2)}" y="${p.y.toFixed(2)}" fill="${colors[s.index]}" font-size="34" font-weight="700" text-anchor="middle" dominant-baseline="middle">${s.text}</text>`;}).join(''):'';
    return `<svg class="trkmap career-track-map circuit" ${options.live?'data-race-map="true" ':''}viewBox="${viewBox}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${label} ${options.live?'连续比赛动画':'赛道图'}"><title>${label} · S1 / S2 / S3</title><path class="track-pitlane" d="${path(g,-.07,.04,30)}" fill="none" stroke="var(--line2,#2e3743)" stroke-width="8" stroke-dasharray="14 10" stroke-linecap="round"/><path class="track-edge" d="${main}" fill="none" stroke="var(--trk-edge,#59636f)" stroke-width="34" stroke-linejoin="round"/><path class="track-road" data-track-main="true" d="${main}" fill="none" stroke="var(--trk,#2b333d)" stroke-width="24" stroke-linejoin="round"/>${sectorPaths}${startLine}${labels}<g class="cars race-car-layer" data-race-car-layer=""></g></svg>`;

    const crossing=fc.laps.find(x=>x.w>.15),heavy=fc.laps.find(x=>x.w>.65),drying=wet>.15?fc.laps.find(x=>x.w<.13):null,tips=[];

  const ALERT_META={sc:['安全车','sc'],w:['天气变化','w'],bad:['事故','bad'],inc:['赛道事件','inc'],pen:['处罚','pen'],lead:['领跑易主','good'],pit:['进站问题','bad']};
  const alertKind=kind=>({safety:'sc',weather:'w',wet:'w',dry:'w',incident:'inc',penalty:'pen',good:'lead'}[kind]||kind);
  function normalizeAlert(alert){

  function collectAlerts(events){

      const raw=event.kind||event.type,text=event.text??event.txt??'',type=raw==='good'&&!/升至 P1$|取得领先|领跑易主/.test(text)?'good':alertKind(raw),mine=event.me||event.id==='you';
