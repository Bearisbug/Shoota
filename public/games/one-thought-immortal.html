function explore(){sub||='local';const tabsHTML=tabs([['local','此地历练'],['regions','远游三域']]);if(sub==='regions'){const list=Object.entries(G.REGIONS);return wrap('山外有山','迁徙会消耗一季；榜单、拜访与可争夺的灵脉随所在地域变化。',tabsHTML+cardsPage(list,([id,v])=>`<div class="list-card"><div class="copy"><h3>${v.name}${state.region===id?' · 所在地':''}</h3><p>${v.desc}<br>${id==='east'?'炼气可行':id==='north'?'筑基／凝罡可行':'金丹／抱丹可行'}</p></div><div>${cmd('启程','travel',id)}</div></div>`),pager(2));}
return wrap(G.REGIONS[state.region].name,'人情、机缘与风险都在这里。出发前，先看自己的准备。',tabsHTML+`<div class="tabs">${btn('⚔ 行装','data-modal="gear"')}${btn('☯ 行事','data-modal="stance"')}${btn('▤ 根骨天赋','data-modal="profile"')}</div><div class="local-landscape"></div><div class="list-card"><div class="copy"><h3>循迹入山</h3><p>一次历练耗一季、22 精力。危险机缘可战可退；真实胜率在抉择前公开。<br>正魔与宗门抉择会在季度之间陆续发生。</p></div></div>`,`<div class="footer"><span class="hint">${state.energy<22?'精力不足，请先调息。':state.world.stories.x_toll?'旧事已有回响，新路还在前方。':'山外的故事正在等你。'}</span>${btn('出发历练　→',`data-do="explore" ${state.energy<22?'disabled':''}`,'primary')}</div>`);}
function worldPage(){sub||='factions';const ts=tabs([['factions','势力'],['lands','灵脉'],['clan','山门'],['news','风闻']]);let body='',foot='';if(sub==='factions'){const fs=Object.values(state.world.factions);body=cardsPage(fs,f=>`<div class="list-card faction-card"><span class="big-symbol">${G.PATHS[f.path].name[0]}</span><div class="copy"><h3>${f.name} ${state.treaties[f.id]?'<span class="badge">盟约</span>':''}</h3><p>${G.REGIONS[f.region].name} · ${G.PATHS[f.path].name}<br>关系 ${state.factionRelations[f.id]} · 领地 ${G.owned(state,f.id).length} · 军力 ${f.army}</p></div>${btn('交涉',`data-faction="${f.id}"`)}</div>`);foot=pager(3);}else if(sub==='lands'){const lands=state.world.territories.filter(t=>t.region===state.region);body=`<p class="micro-summary">${G.REGIONS[state.region].name} · 宗门参战 ${G.clanPower(state)} · 已占 ${G.owned(state).length}/9</p>`+cardsPage(lands,t=>`<div class="list-card"><div class="copy"><h3>${t.name}</h3><p>归属：${t.owner==='player'?esc(state.clan.name):G.sects[t.owner].name}<br>守御 ${G.defense(state,t)} · 每季收入 ${t.income} 宗库</p></div><div>${t.owner==='player'?'<span class="badge">已控制</span>':cmd('争夺','war',t.id)}</div></div>`);foot=pager(Math.ceil(lands.length/2));}else if(sub==='news'){body=cardsPage(state.world.history,x=>`<article class="journal-entry"><small>${x.date}</small><p>${esc(x.text)}</p></article>`);if(!state.world.history.length)body='<p class="empty">天下尚无新消息。四季后，势力会推进争夺。</p>';foot=pager(Math.ceil(state.world.history.length/2));}else if(state.clan){const c=state.clan;body=`<div class="clan-summary"><h3>${esc(c.name)}</h3><div class="mini-stats"><span>弟子 <b>${c.disciples}/60</b></span><span>宗库 <b title="${c.treasury}" aria-label="宗库 ${c.treasury}">${compactCount(c.treasury)}</b></span><span>士气 <b>${c.morale}</b></span><span>训练 <b>${c.training}/30</b></span></div><p>每季收入 ${G.owned(state).reduce((n,t)=>n+t.income,0)+c.facilities.field*12} · 供养 ${Math.ceil(c.disciples*1.5)}。缺粮会降低士气并流失弟子。</p></div><div class="tabs clan-tabs">${btn('门人宗库','data-clan-mode="manage"',clanMode==='manage'?'active':'')}${btn('山门建设','data-clan-mode="build"',clanMode==='build'?'active':'')}</div>${clanMode==='manage'?`<div class="clan-actions">${cmd('招收弟子','recruit')}${cmd('培养门人','train')}${cmd('注资 80','fund')}${cmd('支取 60','stipend')}</div>`:`<div class="build-grid">${Object.entries({hall:'传功殿',field:'灵田',forge:'炼器坊',ward:'护山阵'}).map(([id,n])=>`<div>${cmd(n+' '+c.facilities[id]+'/3','build',id)}</div>`).join('')}</div>`}`;}else{body=`${state.sect?`<div class="list-card"><div class="copy"><h3>${G.sects[state.sect].name} · ${state.level>=6?'长老':state.level>=3?'内门弟子':'外门弟子'}</h3><p>${G.sects[state.sect].bonus}<br>贡献 ${state.contribution}；60 贡献可换破境丹。</p></div></div><div class="inline-actions">${btn('领宗门事务',`data-do="task" ${state.energy<20?'disabled':''}`)}${btn('兑换破境丹',`data-do="exchange" ${state.contribution<60?'disabled':''}`)}${cmd('辞别山门','leave')}</div>`:`<div class="list-card"><div class="copy"><h3>无门无派</h3><p>可加入已有势力，或以自己的名字开山立派。</p></div>${btn('查看六门','data-modal="join"')}</div>`}<div class="found-panel"><h3>自创宗门</h3><p>需筑基／凝罡、声望 20 和开山灵石。创宗后独立于旧门。</p><label for="clan-name" class="field-label">山门之名</label><input id="clan-name" value="${esc(clanDraft)}" maxlength="12" placeholder="2–12 字"><div>${cmd('立自己的山门','found',clanDraft,'primary')}</div></div>`;}return wrap('天下不是静止的','六方势力各有利益。结盟、止戈或争夺，都会留下真实的版图。',ts+body,foot);}
function peoplePage(){const folks=G.companions.map(([id])=>state.world.actors[id]);const body=cardsPage(folks,a=>{const b=state.bonds[a.id];return `<div class="list-card bond-card"><span class="big-symbol">${a.gender==='female'?'◇':a.gender==='male'?'△':'○'}</span><div class="copy"><h3>${a.name} ${b.romance?'<span class="badge">道侣</span>':b.sworn?'<span class="badge">结义</span>':''}</h3><p>${a.role} · ${G.REGIONS[a.region].name}<br>交情 ${state.relations[a.id]} · 信任 ${b.trust} · 心事 ${b.quest}/2</p></div>${btn('相见',`data-person="${a.id}"`)}</div>`;},2);return wrap('同道，也可以同心','六位有各自底线与心事的人。成年后可自愿结缘，性别不限制关系。',body,pager(3));}
function rankPage(){let body=`<div class="tabs">${btn('修士榜','data-rank-type="people"',rankType==='people'?'active':'')}${btn('宗门榜','data-rank-type="sects"',rankType==='sects'?'active':'')}${rankType==='people'?btn('筛选榜单','data-modal="filters"'):''}</div>`;let count;if(rankType==='sects'){const rows=G.factionRankings(state);count=Math.ceil(rows.length/2);body+='<p class="micro-summary">按可调动军力排序，灵脉收入与军队消长会改变名次。</p>'+cardsPage(rows,r=>`<div class="list-card rank-row"><span class="rank-no">${r.rank}</span><div class="copy"><h3>${esc(r.name)}${r.id==='player'?' · 你的山门':''}</h3><p>${G.PATHS[r.path].name} · 领地 ${r.land} 处</p></div><b>${r.score}</b></div>`);}else{const rows=G.rankings(state,filters),mine=rows.find(r=>r.id==='player');count=Math.ceil(rows.length/2);body+=`<p class="micro-summary">${filters.region==='all'?'天下':G.REGIONS[filters.region].name} · ${filters.path==='all'?'正魔皆列':G.PATHS[filters.path].name} · ${{all:'全年龄',young:'30岁以下',middle:'30–59岁',elder:'60岁以上'}[filters.age]} · ${filters.realm==='all'?'全境界':['炼气/淬体','筑基/凝罡','金丹/抱丹','元婴/法相','化神/不灭'][+filters.realm]}<br>${mine?'你排第 '+mine.rank+' / '+rows.length+' 名':'本筛选未收录你'} · 按个人战力排序</p>`;body+=rows.length?cardsPage(rows,r=>`<div class="list-card rank-row ${r.id==='player'?'self-row':''}"><span class="rank-no">${r.rank}</span><div class="copy"><h3>${esc(r.name)}${r.id==='player'?' · 你':''}</h3><p>${Math.floor(r.age)} 岁 · ${r.id==='player'?G.realmName(state):G.realms[r.level]}<br>${G.REGIONS[r.region].name} · ${G.PATHS[r.path].name}</p></div><div><b>${r.score}</b>${r.id!=='player'?btn('切磋',`data-command="duel" data-target="${r.id}"`):''}</div></div>`):'<p class="empty">此条件下暂无修士。放宽年龄、地域或境界筛选再看看。</p>';}
return wrap('天地榜','同一批修士会随年份成长。切磋不等于击杀，名次来自真实的当前力量。',body,pager(count));}
function bag(){sub||='items';const ts=tabs([['items','物品'],['market','坊市'],['journal','年谱'],['profile','道途']]);let body='',foot='';if(sub==='items'){const arr=Object.entries(G.items);body=cardsPage(arr,([id,v])=>`<div class="list-card"><div class="copy"><h3>${v.name} × ${state[id]}</h3><p>${v.desc}</p></div>${id==='pill'?btn('服用',`data-do="pill" ${state.pill?'':'disabled'}`):''}</div>`);foot=pager(2);}else if(sub==='market'){const arr=[['pill',35],['ward',30],['elixir',100],['sword',85]];body=cardsPage(arr,([id,p])=>{const price=Math.round(p*(state.relations.merchant>=30?.8:1));return `<div class="list-card"><div class="copy"><h3>${id==='sword'?'青锋剑':G.items[id].name}</h3><p>${id==='sword'?'装备后危险历练胜率 +8%':G.items[id].desc}<br>${price} 灵石${state.relations.merchant>=30?' · 交情八折':''}</p></div>${btn(id==='sword'&&state.gear.includes('sword')?'已拥有':'买入',`data-buy="${id}" ${state.stones<price||id==='sword'&&state.gear.includes('sword')?'disabled':''}`)}</div>`;});foot=pager(2);}else if(sub==='journal'){body=cardsPage(state.log,l=>`<article class="journal-entry"><small>${esc(l.date)}</small><h3>${esc(l.title)}</h3><p>${esc(l.text)}</p></article>`);foot=pager(Math.ceil(state.log.length/2));}else{body=profileBody();}return wrap(sub==='journal'?'此生年谱':'方寸之间，万象在身',sub==='journal'?'结算保留当时的事实；旧事不会被后来的身份改写。':'天赋、物品与机缘属于这一个人，不随横竖屏改变。',ts+body,foot+(notice?`<p class="toast-static" role="status">${esc(notice)}</p>`:''));}
function profileBody(){return `<div class="list-card"><div class="copy"><h3>${esc(state.name)} · ${G.realmName(state)}</h3><p>${G.ROOTS[state.root].name} · ${G.PATHS[state.path].name}<br>阳寿 ${G.age(state).toFixed(1)}/${G.lifespan(state)} · 声望 ${state.reputation} · 善恶 ${state.karma}<br>修为 ${state.xp}/${G.need(state)} · 战力 ${G.power(state)}<br>灵石 ${state.stones} · 精力 ${state.energy} · 气血 ${state.hp} · 悟性 ${state.insight}${state.clan?`<br>${esc(state.clan.name)} · 宗库 ${state.clan.treasury}`:''}</p></div></div><p class="micro-summary">${G.ROOTS[state.root].bonus}</p><div class="talent-list">${state.talents.map(id=>{const t=G.TALENTS[id];return `<div><span class="grade grade-${t.grade}">${G.GRADES[t.grade]}</span><strong>${t.name}</strong><p>${t.desc}</p></div>`;}).join('')}</div><div class="inline-actions">${btn('破境明细','data-modal="break"')}${btn('更换道途','data-modal="paths"')}${state.level>=12?cmd('再问终章','final'):''}</div><p class="micro-summary">残镜：${{self:'归你持有，修炼 +7',healer:'交予药师',traveler:'归同行者',returned:'已归还原主'}[state.flags.mirror]||'尚未发现'}。<br>${state.partner?'道侣：'+esc(state.world.actors[state.partner].name):'此生尚未结为道侣。'}</p>`;}
function eventLimit(){return innerWidth>720&&innerHeight<=540?1:2;}
function eventView(){const limit=eventLimit();if(eventKey!==state.pending.instance){eventKey=state.pending.instance;eventChoice=null;eventPage=0;eventStep=0;}const e=G.options(state,state.pending.id),chosen=e.choices.find(c=>c.id===eventChoice);eventPage=Math.min(eventPage,Math.ceil(e.choices.length/limit)-1);return `<section class="scene event-scene"><div class="chapter">天地有变，人心有声</div><h2>一念，万般可能。</h2></section><section class="story story-v2 ${eventStep===0?'story-reading':'story-choosing'}"><div class="story-body"><div class="story-head"><div class="tag">${esc(e.tag)}</div><h2>${esc(e.title)}</h2>${eventStep===0?`<p class="narrative">${esc(e.text)}</p>`:`${btn('← 重读来由','data-do="event-back"','text-btn story-back')}<p class="micro-summary">第 ${eventPage+1} 页选择，共 ${e.choices.length} 种做法。条件与代价会在确认时再次检查。</p>`}</div>${eventStep===1?`<div class="choices">${e.choices.slice(eventPage*limit,eventPage*limit+limit).map(c=>btn(`<strong>${esc(c.label)}</strong><small>${esc(c.note)}${!c.ok?' · 条件未满足':''}</small>`,`data-choice="${c.id}" ${c.ok?'':'disabled'} aria-pressed="${c.id===eventChoice}"`,'choice '+(c.id===eventChoice?'selected':''))).join('')}${e.choices.length>limit?pager(Math.ceil(e.choices.length/limit),'eventPage'):''}</div>`:''}</div><div class="footer"><span class="hint">${eventStep?chosen?'已选：'+esc(chosen.label):'选择不会额外耗季。':'读完来由，再决定如何回应。'}</span>${btn(eventStep?'落下这一念　→':'看看选择　→',`data-do="${eventStep?'resolve':'event-next'}" ${eventStep&&!chosen?.ok?'disabled':''}`,'primary')}</div></section>`;}
function resultView(){const r=state.result;return `<section class="story result"><div class="story-body"><div class="result-mark">${r.title.startsWith('破境')?'成':'记'}</div><div class="tag">${G.date(state)} · 已记入年谱</div><h2>${esc(r.title)}</h2><p class="narrative">${esc(r.text)}</p><div class="changes">${r.changes.map(c=>`<span class="change">${esc(c)}</span>`).join('')}</div></div><div class="footer"><span class="hint">${saveIssue?esc(saveIssue):'本季已自动保存'}</span>${btn(state.pending?'新的因果　→':state.ending?'查看此生终章　→':'继续仙途　→','data-do="continue"','primary')}</div></section>`;}
function endView(){return `<section class="story result"><div class="story-body"><div class="result-mark">道</div><div class="tag">此生已成卷 · ${Math.floor(G.age(state))} 岁</div><h2>${esc(state.ending.title)}</h2><p class="narrative">${esc(state.ending.text)}</p><div class="changes"><span class="change">${G.realmName(state)}</span><span class="change">${G.PATHS[state.path].name}</span><span class="change">灵脉 ${G.owned(state).length}</span><span class="change">${state.partner?'道侣相伴':'自在此生'}</span></div></div><div class="footer">${btn('导出此生','data-do="export"')}${btn('再写一世　→','data-do="new"','primary')}</div></section>`;}
function render(){if(!state||newMode){app.innerHTML=onBoard();return;}const views={home,explore,world:worldPage,people:peoplePage,rank:rankPage,bag};app.innerHTML=`<div class="shell">${side()}<main class="main"><header class="topbar"><div><div class="breadcrumb">一念长生 / 万象篇</div><h2>${G.date(state)} <span style="font-size:13px">· ${G.REGIONS[state.region].name}</span></h2></div><div class="top-actions">${btn('？ 指引','data-modal="help"')}${btn('⚙ 存档','data-modal="settings"')}</div></header>${resources()}<div class="toolbar">${nav(true)}<span class="date">${G.PATHS[state.path].name}　·　${state.clan?esc(state.clan.name)+'宗主':state.sect?G.sects[state.sect].name:'自在散修'}</span><div class="tools">${btn('⚔ 行装','data-modal="gear"')}${btn('☯ 行事','data-modal="stance"')}${btn('▤ 道途','data-modal="profile"')}</div></div><div class="workspace"><div class="center">${state.result?resultView():state.ending&&tab!=='bag'?endView():state.pending?eventView():views[tab]()}</div>${aside()}</div></main></div>`;}
function showDialog(title,body){modal.innerHTML=`<div class="dialog-wrap"><header class="dialog-head"><h2 id="modal-title">${esc(title)}</h2>${btn('×','data-do="close" aria-label="关闭详情"')}</header><div class="dialog-body">${body}</div></div>`;if(!modal.open)modal.showModal();}
function commandDialog(kind,target){command={kind,target};const q=G.quote(state,kind,target);const names={travel:'前往'+(G.REGIONS[target]?.name||''),visit:'拜访',adventure:'结伴历练',swear:'结为义友',romance:'表达心意，结为道侣',part:'解除道侣之约',found:'开山立派',recruit:'招收弟子',train:'培养门人',build:'建设山门',fund:'注资宗库',stipend:'支取灵石',gift:'赠礼交涉',pact:'缔结盟约',betray:'解除盟约',war:'争夺灵脉',duel:'登门切磋',path:'更换道途',leave:'辞别山门',final:'再问终章'};showDialog(names[kind]||'确认行动',`<p>${kind==='found'?'宗名：'+esc(target)+'。创宗会离开所属宗门，开启门人供养与领地经营。':kind==='romance'?'只有完成两段心事、满足交情与信任后才可结缘。对方仍有自己的底线；你们也可日后自愿告别。':kind==='war'?'胜利改写领地归属与收入。失败损失 3 名弟子、10 士气与 20 气血；胜利也损失 1 名弟子。':kind==='pact'?'盟约双方互不侵犯。解除盟约会损害关系与声望。':kind==='build'?'传功殿提高静修；灵田提供收入；炼器坊强化训练与个人战力；护山阵提高攻守力量。':'确认后将按以下代价执行，不满足条件不会扣费。'}</p>${q.player?`<div class="battle-preview"><span>我方 <b>${q.player}</b></span><span>对手 <b>${q.enemy}</b></span><span>胜算 <b>${q.chance}%</b></span></div>`:''}<p>耗时：${q.time?'一季':'不耗季'}${q.energy?' · 精力 '+q.energy:''}${q.stones?' · 灵石 '+q.stones:''}${q.treasury?' · 宗库 '+q.treasury:''}</p>${q.ok?'':`<p class="alert">${q.missing.map(esc).join('；')}</p>`}${btn('确认行动',`data-do="commit" ${q.ok?'':'disabled'}`,'primary wide')}`);}
function factionDialog(id){const f=state.world.factions[id];showDialog(f.name,`<p>${G.sects[id].desc}。<br>当前关系 ${state.factionRelations[id]}；领地 ${G.owned(state,id).map(t=>t.name).join('、')||'暂无'}。${state.treaties[id]?'已有互不侵犯盟约。':''}</p><div class="dialog-actions">${cmd('送礼改善关系','gift',id)}${state.treaties[id]?cmd('解除盟约','betray',id):cmd('缔结盟约','pact',id)}</div><p>关系 −30 以下且你拥有领地时，对方可能送来战书；有效盟约可阻止这种进攻。</p>`);}
function personDialog(id){const a=state.world.actors[id],b=state.bonds[id];showDialog(a.name+' · '+a.role,`<p>${G.REGIONS[a.region].name} · ${Math.floor(a.birthAge+(state.turn-state.world.epoch)/4)} 岁 · ${G.realms[a.level]}<br>${esc(a.values)}。</p><div class="mini-stats"><span>交情 <b>${state.relations[id]}</b></span><span>信任 <b>${b.trust}</b></span><span>亲密 <b>${b.affection}</b></span><span>心事 <b>${b.quest}/2</b></span></div><p>交情 20 / 40、信任 10 / 25 时，在同一地域逐步触发两段心事。拜访与同行都耗一季；不是送礼就会自动成为道侣。</p><div class="dialog-actions">${cmd('坐下聊聊','visit',id)}${cmd('结伴历练','adventure',id)}${cmd('把酒结义','swear',id)}${b.romance?cmd('各自珍重','part',id):cmd('表达心意','romance',id)}</div>`);}
const help=[['开局与根骨','六类灵根各有优势，无灵根使用淬体、凝罡、抱丹、法相、不灭的炼体称谓，与修仙境界按同一阶位比较。天赋分五品，每批六选三，开局前可无限刷新。','每次正式行动一季。修炼、炼丹、拜访、建设都占时间；世界里的其他人也会成长。身份性别不影响路线与数值。'],['三域与六门','游历页可在青岚、霜原、沧海之间迁徙。NPC 所在地、拜访条件与灵脉争夺依据实际地域；炼体与修仙同阶享有相同通行资格。','天下页可查势力关系与版图。每年发生 NPC 势力争夺。玩家领地遭袭先收到战书，可防守、赔偿或撤离，不会悄悄没收。'],['建立自己的山门','筑基／凝罡、声望 20 和开山灵石可创宗。宗库独立于个人财物；每季有供养支出，灵田与领地产出收入。','训练、弟子、设施、士气与玩家修为共同决定参战力量。争夺前显示实际双方数值、胜算、费用和失败代价；盟约存在时不能互攻。'],['羁绊与正魔','六位人物各有两段心事。交情、信任、亲密与故事经历分别记录，达到条件后可结义或表达心意，不受玩家性别限制。','正魔是修行道路，善恶来自实际行为。恶行可能让正道道侣失去信任并离开；更换道途不会洗掉旧债和人物记忆。'],['榜单与结局','人物榜可组合年龄、地域、正魔、境界筛选。所有名字对应持续成长的同一批人物；你的名次来自实际战力。宗门榜按军力独立排序。','到达化神／不灭后可飞升、传道、经营宗门或与道侣长游，也可暂不结局继续游戏。旧版存档自动迁移，原始 v1 存档仍保留。']];
function openModal(kind){if(kind==='settings')showDialog('存档与此生',`<p>${esc(state.name)} · ${G.realmName(state)} · ${G.date(state)}。进度保存在当前浏览器。v1 旧档可直接导入，境界、财物与历史保留。</p>${btn('导出存档 JSON','data-do="export"','wide')}${btn('导入存档','data-do="import"','wide')}${btn('开始新的一世','data-do="new"','wide')}<p class="alert">${esc(saveIssue)||'新开局直到最后确认才替换当前 v2 进度。建议先导出备份。'}</p>`);
else if(kind==='profile')showDialog('根骨与道途',profileBody());
else if(kind==='gear')showDialog('出行准备 · 行装',`<p>装备与行事不耗时间，但当前剧情结算前不能更改。</p><div class="list">${[['robe','素衣法袍','危险历练失败时气血损失减少 6。'],['sword','青锋剑','危险历练胜率 +8%，个人战力基数 +24。']].map(([id,n,d])=>`<div class="list-card"><div class="copy"><h3>${n}</h3><p>${d}</p></div>${btn(state.equipment===id?'已装备':state.gear.includes(id)?'装备':'未拥有',`data-equip="${id}" ${!state.gear.includes(id)||state.pending||state.result||state.ending?'disabled':''}`)}</div>`).join('')}</div>`);
else if(kind==='stance')showDialog('出行准备 · 行事',`<p>稳健无修正；果决提高危险历练胜率但加重失败伤势；谨慎降低胜率并减少伤势。争夺灵脉分别修正 +8% / −5%。</p><div class="list">${[['steady','稳健','历练基础伤势 26'],['bold','果决','历练胜率 +12%；基础伤势 38'],['careful','谨慎','历练胜率 −8%；基础伤势 16']].map(([id,n,d])=>`<div class="list-card"><div class="copy"><h3>${n}</h3><p>${d}</p></div>${btn(state.stance===id?'已应用':'应用',`data-stance="${id}" ${state.pending||state.result||state.ending?'disabled':''}`)}</div>`).join('')}</div>`);
else if(kind==='paths')showDialog('再问心中道',`<p>更换道途耗一季；新的立场影响势力关系，善恶与已经发生的故事不会重置。</p><div class="list">${Object.entries(G.PATHS).map(([id,v])=>`<div class="list-card"><div class="copy"><h3>${v.name}</h3><p>${v.desc}</p></div>${cmd('择此道','path',id)}</div>`).join('')}</div>`);
else if(kind==='join')showDialog('六方山门',`<p>正道山门不接纳仍有恶行的魔修；行善后可重新尝试。自创宗门后不能再兼任别派弟子。</p><div class="list">${Object.entries(G.sects).map(([id,v])=>`<div class="list-card"><div class="copy"><h3>${v.name}</h3><p>${v.bonus}</p></div>${btn('拜入',`data-join="${id}" ${G.joinAllowed(state,id)?'':'disabled'}`)}</div>`).join('')}</div>`);
else if(kind==='break'){const b=G.breakthrough(state);showDialog('叩关之前',`<h3>${G.realmName(state)} → ${G.realmName(state,Math.min(12,state.level+1))}</h3><p>需修为 ${G.need(state)}、灵石 ${b.cost}、精力 20 和一季。当前成功率 ${b.chance}%。${b.pill?'会自动消耗 1 破境丹。':''}</p><p>小境界基础 79%，大境界基础 51%；每 5 悟性 +1%；灵根与天赋、道途、守拙誓言继续修正。气血低于 70 扣 15%。最高 96%。</p><p>成功后进入下一境界；失败消耗本次费用，保留 ${Math.round(Math.max(.7,...state.talents.map(id=>G.TALENTS[id].effects.retention||0))*100)}% 修为，气血 −20、悟性 +4。</p>`);}
else if(kind==='filters'){const select=(key,title,opts)=>`<label class="field-label" for="filter-${key}">${title}</label><select id="filter-${key}">${Object.entries(opts).map(([id,n])=>`<option value="${id}" ${filters[key]===id?'selected':''}>${n}</option>`).join('')}</select>`;showDialog('组合筛选榜单',`<div class="filters-grid">${select('region','地域',{all:'天下',...Object.fromEntries(Object.entries(G.REGIONS).map(([k,v])=>[k,v.name]))})}${select('path','正魔',{all:'正魔皆列',...Object.fromEntries(Object.entries(G.PATHS).map(([k,v])=>[k,v.name]))})}${select('age','年龄',{all:'全年龄',young:'30 岁以下',middle:'30–59 岁',elder:'60 岁以上'})}${select('realm','境界',{all:'全部境界',0:'炼气 / 淬体',1:'筑基 / 凝罡',2:'金丹 / 抱丹',3:'元婴 / 法相',4:'化神 / 不灭'})}</div>${btn('应用筛选','data-do="apply-filters"','primary wide')}`);}
else{const h=help[helpPage];showDialog('万象篇指引',`<h3>${h[0]}</h3><p>${h[1]}</p><p>${h[2]}</p><div class="pager">${btn('←',`data-help="${helpPage-1}" ${helpPage===0?'disabled':''}`)}<span>${helpPage+1}/${help.length}</span>${btn('→',`data-help="${helpPage+1}" ${helpPage===help.length-1?'disabled':''}`)}</div>`);}}
function exportSave(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download=`一念长生-v2-${state.name.replace(/[^\u4e00-\u9fa5a-zA-Z0-9_-]/g,'')}-${state.turn}季.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function handler(e){const el=e.target.closest('button');if(!el||el.disabled)return;const d=el.dataset;
if(d.draft){draft[d.draft]=d.value;notice='';render();return;}
if(d.talent){if(draft.talents.includes(d.talent))draft.talents=draft.talents.filter(x=>x!==d.talent);else if(draft.talents.length<3)draft.talents.push(d.talent);else notice='已经选择 3 项，请先取消一项再换。';render();return;}
if(d.do==='reroll'){roll();notice='新一批已生成，默认选中前三项，可自行调整。';render();return;}
if(d.wizardPage!==undefined){wizardPage=+d.wizardPage;render();return;}
if(d.do==='next'||d.do==='previous'){if(d.do==='next'&&wizard===0&&!draft.name.trim()){notice='请先填写道号。';document.getElementById('player-name').focus();return;}wizard+=d.do==='next'?1:-1;wizardPage=0;notice='';render();return;}
if(d.tab){tab=d.tab;sub='';page=0;notice='';render();return;}
if(d.sub){sub=d.sub;page=0;notice='';render();return;}
if(d.page!==undefined){page=+d.page;render();return;}
if(d.select){selected=d.select;render();return;}
if(d.eventPage!==undefined){eventPage=+d.eventPage;render();return;}
if(d.choice){eventChoice=d.choice;render();return;}
if(d.do==='event-next'||d.do==='event-back'){eventStep=d.do==='event-next'?1:0;render();return;}
if(d.modal){openModal(d.modal);return;}
if(d.person){personDialog(d.person);return;}
if(d.faction){factionDialog(d.faction);return;}
if(d.command){commandDialog(d.command,d.command==='found'?clanDraft:d.target);return;}
if(d.help!==undefined){helpPage=+d.help;openModal('help');return;}
if(d.clanMode){clanMode=d.clanMode;render();return;}
if(d.rankType){rankType=d.rankType;page=0;render();return;}
if(d.do==='apply-filters'){for(const k of Object.keys(filters))filters[k]=document.getElementById('filter-'+k).value;page=0;modal.close();render();return;}
if(d.do==='close'){modal.close();return;}
if(d.equip){G.equip(state,d.equip);save();render();openModal('gear');return;}
if(d.stance){G.stance(state,d.stance);save();render();openModal('stance');return;}
if(d.do==='export'){exportSave();return;}
if(d.do==='import'){document.getElementById('import-file').click();return;}
if(d.do==='new'){newMode=true;wizard=0;wizardPage=0;notice='';modal.close();render();return;}
if(d.do==='cancel-new'){newMode=false;render();return;}
if(d.do==='start'){if(draft.talents.length!==3||!draft.name.trim())return;state=G.create({...draft});newMode=false;tab='home';sub='';page=0;selected='practice';eventKey='';save();render();return;}
const now=Date.now();if(now-lastCommit<240)return;lastCommit=now;let ok=false;
if(d.do==='commit'&&command){ok=G.run(state,command.kind,command.target);if(ok){modal.close();command=null;}else commandDialog(command.kind,command.target);}
else if(d.do==='act')ok=G.act(state,selected);
else if(d.do==='continue')ok=G.continueGame(state);
else if(d.do==='resolve')ok=G.resolve(state,eventChoice,state.pending?.instance);
else if(d.do==='explore')ok=G.explore(state,{east:'valley',north:'ruins',sea:'sea'}[state.region]);
else if(d.buy){ok=G.trade(state,d.buy);notice=ok?'购置成功，物品已入囊。':'条件未满足。';}
else if(d.do==='pill'){ok=G.use(state,'pill');notice=ok?'丹药入脉，修为 +35。':'';}
else if(d.do==='task')ok=G.task(state);
else if(d.do==='exchange'){ok=G.exchange(state);notice=ok?'已兑换一枚破境丹。':'';}
else if(d.join){ok=G.join(state,d.join);if(ok)modal.close();}
else if(d.do==='confirm-import'&&importCandidate){state=importCandidate;importCandidate=null;modal.close();tab='home';sub='';eventKey='';ok=true;}
if(ok)save();render();}
document.addEventListener('click',handler);
let lastEventLimit=eventLimit();addEventListener('resize',()=>{const next=eventLimit();if(next!==lastEventLimit){lastEventLimit=next;if(state?.pending&&!newMode){const choices=G.options(state,state.pending.id).choices;const index=choices.findIndex(c=>c.id===eventChoice);eventPage=index>=0?Math.floor(index/next):0;render();}}});
document.addEventListener('input',e=>{if(e.target.id==='player-name')draft.name=e.target.value;if(e.target.id==='clan-name')clanDraft=e.target.value;});
document.getElementById('import-file').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>1500000)throw Error('存档文件过大');importCandidate=G.parse(await f.text());showDialog('确认读取存档',`<p>${esc(importCandidate.name)} · ${G.realmName(importCandidate)} · ${G.date(importCandidate)}。这会替换当前 v2 进度。旧版备份不删除。</p>${btn('先导出当前进度','data-do="export"','wide')}${btn('确认读取','data-do="confirm-import"','wide primary')}`);}catch(err){importCandidate=null;showDialog('无法导入',`<p>${esc(err.message)}</p><p>当前进度未改变。</p>`);}});
render();
})();
</script></body></html>
