<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>一克之差</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}

/* 布局：固定 390×760 的逻辑舞台整体缩放；上方三台戥秤，中间药柜台面堆药包，下方暂存台与道具 */
:root{
  --lacquer:#13302a;   /* 药柜漆绿 */
  --lacquer2:#1b3f37;
  --lacquer3:#285549;
  --brass:#c9a24a;
  --brass-hi:#efd58e;
  --brass-lo:#7a5d22;
  --kraft:#dcbf91;     /* 牛皮纸药包 */
  --kraft-lo:#b28d58;
  --ink:#2b1c10;
  --cinnabar:#d24c33;  /* 朱砂 */
  --jade:#86d6ad;
  --paper:#f1e6cc;
  --mute:#9cb7ab;
  --f-brush:"Ma Shan Zheng","STXingkai","KaiTi","STKaiti",serif;
  --f-serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background-color:var(--lacquer);
  background-image:
    radial-gradient(ellipse at 50% 35%, rgba(255,255,255,.05), transparent 65%),
    linear-gradient(rgba(0,0,0,.22) 2px, transparent 2px),
    linear-gradient(90deg, rgba(0,0,0,.22) 2px, transparent 2px);
  background-size:auto, 104px 70px, 104px 70px;
  color:var(--paper);
  font-family:var(--f-sans);
  overflow:hidden;
  user-select:none; -webkit-user-select:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#root{position:relative;height:100%;box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:4px}
#stage{position:absolute;left:50%;top:50%;width:390px;height:760px;transform:translate(-50%,-50%);transform-origin:center}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}

/* 顶栏 */
header{position:absolute;left:0;top:0;width:390px;height:58px}
.hrow{position:absolute;left:8px;right:8px;top:4px;height:34px;display:flex;align-items:center;justify-content:space-between}
h1{margin:0;position:absolute;left:50%;transform:translateX(-50%);font:400 30px/34px var(--f-brush);color:var(--brass-hi);letter-spacing:4px;text-shadow:0 2px 0 rgba(0,0,0,.4);white-space:nowrap}
.chip{font:700 13px/1 var(--f-serif);color:var(--ink);background:var(--brass);padding:6px 9px;border-radius:4px;box-shadow:inset 0 -2px 0 var(--brass-lo)}
.hbtns{display:flex;gap:6px}
.hbtn{height:28px;min-width:28px;padding:0 9px;border:1.5px solid rgba(201,162,74,.55);border-radius:6px;font-size:13px;color:var(--brass-hi);display:flex;align-items:center;justify-content:center}
.hbtn svg{width:16px;height:16px}
.srow{position:absolute;left:10px;right:10px;top:40px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);letter-spacing:.5px;font-variant-numeric:tabular-nums}
.srow b{color:var(--paper);font-weight:500}

/* 戥秤 */
#scales{position:absolute;inset:0;pointer-events:none;z-index:2}
.ring{position:absolute;top:62px;width:126px;height:176px;border-radius:12px;border:1.5px dashed transparent;pointer-events:auto;transition:background .2s,border-color .2s}
.ring.sel{background:rgba(201,162,74,.09);border-color:rgba(239,213,142,.55);border-style:solid}
.ring.retired{pointer-events:none}
.rtag{position:absolute;left:50%;top:-9px;transform:translateX(-50%);font-size:10px;letter-spacing:1px;background:var(--brass);color:var(--ink);padding:2px 7px;border-radius:9px;opacity:0;transition:opacity .2s;white-space:nowrap;font-weight:700}
.ring.sel .rtag{opacity:1}
.pillar{position:absolute;top:114px;width:6px;height:92px;background:linear-gradient(90deg,var(--brass-lo),var(--brass),var(--brass-lo));border-radius:3px}
.sbase{position:absolute;top:204px;width:56px;height:9px;background:var(--brass-lo);border-radius:5px 5px 2px 2px;box-shadow:inset 0 2px 0 var(--brass)}
.knob{position:absolute;top:109px;width:10px;height:10px;border-radius:50%;background:var(--brass-hi);box-shadow:0 0 0 2px var(--brass-lo);z-index:2}
.beam,.str,.pan,.bob{position:absolute;left:0;top:0;transition:transform .5s cubic-bezier(.34,1.5,.6,1)}
.beam{top:111px;width:90px;height:6px;border-radius:3px;background:linear-gradient(var(--brass-hi),var(--brass) 60%,var(--brass-lo));transform-origin:50% 50%}
.str{width:1.5px;height:44px;background:rgba(239,213,142,.55);transform-origin:0 0}
.pan{width:46px;height:9px;border-radius:2px 2px 23px 23px/2px 2px 9px 9px;background:linear-gradient(var(--brass-hi),var(--brass) 50%,var(--brass-lo))}
.bob{width:36px;height:24px;border-radius:9px 9px 4px 4px;background:linear-gradient(160deg,#5b5a55,#2e2d2a);color:var(--brass-hi);font:900 15px/24px var(--f-serif);text-align:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 2px 3px rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
.bob small{font-size:9px;margin-left:1px}
.bob.pop{animation:pop .45s ease}
@keyframes pop{0%{filter:brightness(2)}40%{scale:1.25}100%{scale:1}}
.slbl{position:absolute;top:212px;width:126px;text-align:center;font:700 13px/15px var(--f-serif);color:var(--mute);letter-spacing:1px;font-variant-numeric:tabular-nums}
.slbl.near{color:var(--cinnabar);animation:throb .9s ease-in-out infinite}
.slbl.even{color:var(--jade)}
.slbl small{display:block;font:500 10.5px/13px var(--f-sans);color:var(--mute);letter-spacing:.5px}
.slbl small.last{color:var(--brass-hi)}
@keyframes throb{50%{opacity:.55}}
.sdone{position:absolute;top:118px;width:54px;height:54px;border-radius:50%;border:3px solid var(--cinnabar);color:var(--cinnabar);font:400 30px/48px var(--f-brush);text-align:center;transform:rotate(-14deg) scale(.4);opacity:0;transition:all .35s cubic-bezier(.3,1.6,.5,1)}
.sdone.on{opacity:.9;transform:rotate(-14deg) scale(1)}
.ring.flash{animation:flash .5s ease}
@keyframes flash{30%{background:rgba(134,214,173,.28);border-color:var(--jade)}}

/* 台面 */
#board{position:absolute;left:14px;top:244px;width:362px;height:340px;border-radius:14px;background:var(--lacquer2);box-shadow:inset 0 3px 10px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.05);z-index:1}
#tray{position:absolute;left:10px;top:594px;width:370px;height:56px;border-radius:10px;background:rgba(0,0,0,.28);z-index:1}
#tray.danger{box-shadow:0 0 0 2px var(--cinnabar)}
.slot{position:absolute;top:0;height:56px;display:flex;align-items:center;justify-content:center}
.slot i{display:block;border:1.5px dashed rgba(156,183,171,.3);border-radius:7px}
#trayLbl{position:absolute;right:12px;top:654px;font-size:11px;color:var(--mute);letter-spacing:1px;z-index:1;font-variant-numeric:tabular-nums}
#trayLbl.danger{color:var(--cinnabar);font-weight:700}
#trayHint{position:absolute;left:12px;top:654px;font-size:11px;color:var(--mute);z-index:1}

/* 道具 */
#props{position:absolute;left:14px;top:678px;width:362px;display:flex;gap:10px;z-index:3}
.prop{flex:1;height:52px;border-radius:10px;border:1.5px solid rgba(201,162,74,.6);color:var(--brass-hi);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;background:rgba(201,162,74,.06)}
.prop b{font:700 15px/1 var(--f-serif);letter-spacing:2px}
.prop span{font-size:10px;color:var(--mute)}
.prop em{position:absolute;right:-5px;top:-7px;min-width:18px;height:18px;border-radius:9px;background:var(--cinnabar);color:#fff;font:700 11px/18px var(--f-sans);font-style:normal}
.prop:disabled{opacity:.35;cursor:default}

/* 药包 */
#layer{position:absolute;inset:0;pointer-events:none;z-index:5}
.tile{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:7px;background:var(--kraft);color:var(--ink);overflow:hidden;pointer-events:auto;transform-origin:0 0;
  box-shadow:inset 0 -3px 0 var(--kraft-lo),inset 0 0 0 1px rgba(43,28,16,.15),0 2px 0 rgba(0,0,0,.35),0 5px 8px rgba(0,0,0,.25);
  transition:transform .42s cubic-bezier(.3,1.3,.55,1),filter .25s,opacity .3s}
.tile .band{position:absolute;left:0;right:0;top:0;height:13px;background:var(--hb)}
.tile .nm{position:absolute;left:0;right:0;top:1px;text-align:center;font-size:9px;line-height:11px;color:#fff6e2;letter-spacing:1px}
.tile .w{position:absolute;left:0;right:0;top:13px;text-align:center;font:900 23px/31px var(--f-serif);font-variant-numeric:tabular-nums}
.tile .w small{font-size:10px;font-weight:700;margin-left:1px}
.tile.cov{filter:brightness(.3) saturate(.35);cursor:default}
.tile.cov .nm,.tile.cov .w,.tile.cov .tag{visibility:hidden}
.tile.cov .band{background:var(--kraft-lo)}
.tile.cov.peek{filter:brightness(.72) saturate(.7)}
.tile.cov.peek .nm,.tile.cov.peek .w,.tile.cov.peek .tag{visibility:visible}
.tile.cov.peek .band{background:var(--hb)}
.tile .tag{position:absolute;right:2px;bottom:2px;font:700 9px/1 var(--f-sans);padding:2px 3px;border-radius:3px;background:var(--ink);color:var(--kraft)}
.tile.blind{background:#cdb184}
.tile.blind .w{color:#5a4126}
.drawer{position:absolute;top:500px;height:58px;border-radius:9px;background:rgba(0,0,0,.28);box-shadow:inset 0 2px 6px rgba(0,0,0,.4);z-index:1}
.drlbl{position:absolute;top:562px;font-size:11px;color:var(--mute);letter-spacing:1px;z-index:1;font-variant-numeric:tabular-nums}
.drlbl b{color:var(--paper);font-weight:500}
.tile.inpan{pointer-events:none}
.tile.gone{opacity:0;pointer-events:none}
.tile.shake{animation:shake .3s}
@keyframes shake{25%{margin-left:-3px}75%{margin-left:3px}}

/* 特效与提示 */
#fx{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.pt{position:absolute;width:7px;height:7px;border-radius:2px;animation:pfly .75s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes pfly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.3);opacity:0}}
.ft{position:absolute;font:900 16px/1 var(--f-serif);color:var(--jade);transform:translateX(-50%);animation:ftup .9s ease-out forwards;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.ft.bad{color:var(--cinnabar)}
@keyframes ftup{to{translate:0 -36px;opacity:0}}
#toast{position:absolute;left:50%;top:252px;transform:translate(-50%,-6px);background:rgba(10,24,20,.92);color:var(--paper);font-size:13px;padding:7px 14px;border-radius:16px;z-index:9;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;border:1px solid rgba(201,162,74,.35)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 弹窗 */
#modal{position:absolute;inset:0;z-index:20;background:rgba(5,14,12,.72);display:flex;align-items:center;justify-content:center}
.card{width:316px;background:var(--paper);color:var(--ink);border-radius:14px;padding:22px 20px 18px;box-sizing:border-box;box-shadow:0 18px 40px rgba(0,0,0,.5);position:relative;animation:cardin .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes cardin{from{transform:scale(.85);opacity:0}}
.card h2{margin:0 0 6px;font:400 34px/1.15 var(--f-brush);color:var(--cinnabar);text-align:center;text-wrap:balance}
.card .sub{text-align:center;font-size:13px;color:#6a5640;margin:0 0 14px}
.card .big{text-align:center;font:900 20px/1.4 var(--f-serif);margin:6px 0 4px;text-wrap:balance}
.card .big em{font-style:normal;color:var(--cinnabar)}
.card ol{margin:0 0 16px;padding-left:20px;font-size:13.5px;line-height:1.65}
.card ol li+li{margin-top:4px}
.card .note{font-size:12px;color:#6a5640;margin:-6px 0 14px;line-height:1.5}
.card .stat{display:flex;justify-content:center;gap:18px;margin:10px 0 16px;font-size:12px;color:#6a5640;font-variant-numeric:tabular-nums}
.card .stat b{display:block;font:900 22px/1.2 var(--f-serif);color:var(--ink);text-align:center}
.btns{display:flex;flex-direction:column;gap:8px}
.btn{height:46px;border-radius:10px;font:700 16px/1 var(--f-serif);letter-spacing:2px}
.btn.pri{background:var(--lacquer2);color:var(--brass-hi);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.btn.sec{border:1.5px solid var(--kraft-lo);color:#6a5640}
.stamp{position:absolute;right:14px;top:12px;width:46px;height:46px;border:2.5px solid var(--cinnabar);border-radius:50%;color:var(--cinnabar);font:400 26px/40px var(--f-brush);text-align:center;transform:rotate(12deg);opacity:.85}

@media (prefers-reduced-motion: reduce){
  .tile,.beam,.str,.pan,.bob,.sdone{transition-duration:.08s}
  .slbl.near{animation:none}
  .pt,.ft{animation-duration:.2s}
}
</style>
</head>
<body>
<div id="root">
  <div id="stage">
    <header>
      <div class="hrow">
        <span class="chip" id="lvChip">第 1 关</span>
        <h1>一克之差</h1>
        <div class="hbtns">
          <button class="hbtn" id="bSound" type="button" aria-label="声音开关"></button>
          <button class="hbtn" id="bRestart" type="button">重来</button>
        </div>
      </div>
      <div class="srow"><span id="sAtt"></span><span id="sDone"></span><span id="sNext"></span></div>
    </header>
    <div id="scales"></div>
    <div id="board"></div>
    <div id="tray"></div>
    <span id="trayHint">翻盘的药包落在这里，点它能再放回秤上</span>
    <span id="trayLbl"></span>
    <div id="props">
      <button class="prop" id="pUndo" type="button"><b>撤回</b><span>收回上一包</span><em>1</em></button>
      <button class="prop" id="pPeek" type="button"><b>透视</b><span>看清压住的 5 秒</span><em>1</em></button>
      <button class="prop" id="pSwap" type="button"><b>换方子</b><span>换掉选中秤的目标</span><em>1</em></button>
    </div>
    <div id="layer"></div>
    <div id="fx"></div>
    <div id="toast"></div>
    <div id="modal" hidden><div class="card" id="card"></div></div>
  </div>
</div>

<script>
/*GEN-START*/
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PAN_MAX=3,LIGHT_MAX=6;
const SEEDS={3:27999,4:36221,5:43837,6:51857,7:59675,8:68402,9:75513,10:83432,11:91553,12:99472,13:107795,14:115916};
function cfgFor(lv){
  if(lv===1) return {n:3,wmin:2,wmax:9,k3:0,L:2,dr:[0,0],decoy:0,blind:0,cruel:0,cap:6,tmax:18};
  if(lv===2) return {n:14,wmin:2,wmax:15,k3:.45,L:10,dr:[7,7],decoy:9,blind:.4,cruel:.4,cap:4,tmax:34,seed:108};
  const e=Math.min(lv-3,8),h=Math.floor(e/2);
  return {n:12+e,wmin:2,wmax:e>3?15:14,k3:.45,L:9+h,dr:[6+h,6+h],decoy:7+h,blind:.3+e*.015,cruel:.32+e*.01,cap:4,tmax:32,seed:SEEDS[lv]};
}
function pick(a,b,R){return a+Math.floor(R()*(b-a+1))}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* 主台面：gx 0..12，gy 1..9；同一层的格子间隔 2，奇偶层错开半格 */
function layoutPositions(N,L,R){
  const w=[];for(let l=0;l<L;l++)w.push(1.25-l/L*.5);
  const sw=w.reduce((a,b)=>a+b);
  const counts=w.map(x=>Math.max(1,Math.round(N*x/sw)));
  let diff=N-counts.reduce((a,b)=>a+b),i=0;
  while(diff!==0){const j=i%L;if(diff>0){counts[j]++;diff--}else if(counts[j]>1){counts[j]--;diff++}i++}
  const pos=[];
  for(let l=0;l<L;l++){
    const c=counts[l],ox=l%2,oy=(l>>1)%2;
    const maxC=ox?6:7,maxR=oy?4:5;
    let cols=Math.min(maxC,Math.max(ox?2:3,(ox?2:1)+2*Math.round((Math.sqrt(c*1.6)-(ox?2:1))/2)));
    let rows=oy?2:3;
    while(cols*rows<c){if(rows<maxR)rows+=2;else if(cols<maxC)cols+=2;else break}
    const cells=[];
    for(let a=0;a<cols;a++)for(let b=0;b<rows;b++)cells.push({gx:6-(cols-1)+2*a,gy:5-(rows-1)+2*b,layer:l});
    const pairs=[],singles=[];
    for(const ce of cells){
      if(ce.gx===6){singles.push([ce]);continue}
      if(ce.gx<6)pairs.push([ce,cells.find(o=>o.gx===12-ce.gx&&o.gy===ce.gy)]);
    }
    shuffle(pairs,R);shuffle(singles,R);
    let need=Math.min(c,cells.length);const chosen=[];
    for(const p of pairs){if(need>=2){chosen.push(...p);need-=2}}
    for(const s of singles){if(need>=1){chosen.push(...s);need--}}
    for(const p of pairs){if(need>0&&!chosen.includes(p[0])){chosen.push(p[0]);need--}}
    pos.push(...chosen.map(p=>({...p,src:'b'})));
  }
  return pos;
}
/* 估算每个位置被翻出来的先后：上层越高越早，抽屉越靠上越早 */
function depthOf(p,L,dr){
  if(p.src==='b')return 1-p.layer/Math.max(1,L-1);
  return 1.08-(p.k+.5)/dr[p.d];
}
function genLevel(lv,over){
  const cfg=Object.assign(cfgFor(lv),over||{}),R=mulberry32(cfg.seed||4242+lv*7919);
  const targets=[],groups=[];
  for(let i=0;i<cfg.n;i++){
    for(let tries=0;tries<60;tries++){
      const k=R()<cfg.k3?3:2,g=[];
      for(let j=0;j<k;j++)g.push(pick(cfg.wmin,cfg.wmax,R));
      const T=g.reduce((a,b)=>a+b);
      if(T>cfg.tmax||T<7)continue;
      targets.push(T);groups.push(g);break;
    }
  }
  const items=[];
  groups.forEach((g,i)=>{const key=Math.floor(R()*g.length);g.forEach((w,j)=>items.push({w,ti:i,key:j===key}))});
  for(let i=0;i<cfg.decoy;i++){
    /* 干扰包：偏大的重量，单独放不进当前大多数方子 */
    items.push({w:pick(Math.max(cfg.wmin,cfg.wmax-6),cfg.wmax,R),ti:-1,key:false,decoy:true});
  }
  const nD=cfg.dr[0]+cfg.dr[1];
  const pos=layoutPositions(items.length-nD,cfg.L,R);
  for(let d=0;d<2;d++)for(let k=0;k<cfg.dr[d];k++)pos.push({src:'d',d,k});
  pos.forEach(p=>p.depth=depthOf(p,cfg.L,cfg.dr)+R()*.06);
  const order=pos.slice().sort((a,b)=>b.depth-a.depth); /* 浅 -> 深 */
  const used=new Set(),N=order.length;
  const take=(idx)=>{idx=Math.max(0,Math.min(N-1,idx));for(let r=0;r<N;r++){for(const s of [1,-1]){const j=idx+s*r;if(j>=0&&j<N&&!used.has(j)){used.add(j);return order[j]}}}};
  const out=[];
  const keys=items.filter(x=>x.key),decs=items.filter(x=>x.decoy),rest=shuffle(items.filter(x=>!x.key&&!x.decoy),R);
  for(const it of keys){const f=it.ti/cfg.n+cfg.cruel+R()*.12;out.push({...it,...take(Math.round(f*N))})}
  for(const it of decs){out.push({...it,...take(Math.floor(R()*N*.3))})}
  const free=[];for(let j=0;j<N;j++)if(!used.has(j))free.push(order[j]);
  shuffle(free,R);rest.forEach((it,i)=>out.push({...it,...free[i]}));
  for(const t of out){t.blind=lv>1&&t.depth<.97&&R()<cfg.blind;delete t.depth}

/* 渲染 */
function render(){

/* 交互 */
function activeSel(){if(!G.scales[G.sel].retired)return G.sel;const i=G.scales.findIndex(s=>!s.retired);if(i>=0)G.sel=i;return i}

function onTile(t){

/* 结算 */

function intro(){

    <p class="sub">药铺抓药，一克都不能差</p>
    <ol>
      <li>点亮着的药包，它会放上<b>选中的那台秤</b>。点秤可以换。</li>
      <li>右盘总重正好等于左边砝码，秤就平了，药包收走，换下一张方子。</li>
      <li>每台秤<b>最多放 3 包</b>。超重，或者 3 包放满还没平，都会<b>翻盘</b>，整盘药包掉进暂存台。暂存台放不下就输。</li>
    </ol>
    <p class="note">压住的药包什么都看不见，抽屉只看得到最上面一包。标着“轻”“重”的是盲包，放上秤才知道几克。</p>
    <div class="btns"><button class="btn pri" id="mGo" type="button">开始抓药</button></div>`);
  $('#mGo').onclick=()=>{save.intro=true;persist();ac();hideModal()};
}
function showModal(h){$('#card').innerHTML=h;$('#modal').hidden=false}
function hideModal(){$('#modal').hidden=true}

/* 特效 */
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1400)}
function burst(x,y,n=14){
  const cols=['#efd58e','#c9a24a','#86d6ad','#d24c33','#f1e6cc'];
  for(let i=0;i<n;i++){const d=document.createElement('div');d.className='pt';const a=Math.random()*Math.PI*2,r=30+Math.random()*60;
    d.style.left=x+'px';d.style.top=y+'px';d.style.background=cols[i%cols.length];
    d.style.setProperty('--dx',Math.cos(a)*r+'px');d.style.setProperty('--dy',Math.sin(a)*r-20+'px');d.style.setProperty('--r',(Math.random()*540)+'deg');
    fx.appendChild(d);setTimeout(()=>d.remove(),800)}
}
function floatText(x,y,txt,bad){const d=document.createElement('div');d.className='ft'+(bad?' bad':'');d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';fx.appendChild(d);setTimeout(()=>d.remove(),950)}

/* 绑定 */
$('#pUndo').onclick=doUndo;$('#pPeek').onclick=doPeek;$('#pSwap').onclick=doSwap;
$('#bRestart').onclick=()=>{if(G&&!G.busy)startLevel(G.lv)};
$('#bSound').onclick=()=>{save.sound=!save.sound;persist();if(save.sound)sfx.sel();render()};
for(const id of ['#tray'])$(id).style.pointerEvents='none';

function start(data){
  fit();
  const lv=(data&&data.lv)||save.level||1;
  startLevel(lv);
  if(!save.intro)intro();
}
try{window.claude?.hot?.snapshot?.(()=>({lv:G?G.lv:save.level}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
