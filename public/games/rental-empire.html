const titles={overview:['经营总览','每一座城市，都在为你的下一步积累力量。'],competition:['市场与竞争','看清每座城市的需求、对手与市场份额。'],market:['基础采购','按品牌、属性和预算选车，把采购与日常运营分开。'],fleet:['我的车队','定日租金、做促销，让每一辆车找到合适的生意。'],branches:['门店与经理','一城一位经理，多城组成协同区。'],events:['经营日历','提前看见旺季、新车与城市故事，做好下一步准备。'],finance:['资本与回报','分清利润与现金，规划你的下一笔投资。'],reports:['经营报告','每个月的成绩，都会变成下一次决策的依据。']};

function render(){if(!s.started||!s.setupConfirmed)return onboarding(s.started);let [title,sub]=titles[tab];$('#app').innerHTML=`<div class="shell view-${tab}"><aside class="sidebar"><div class="logo"><span class="logo-mark">↗</span><span class="game-wordmark" aria-label="脚踩神州，拳打一嗨"><span>脚踩神州</span><span>拳打一嗨</span></span></div><div class="brand-sub">RENTAL EMPIRE</div><div class="nav-label">你的租车事业</div><nav class="nav">${Object.entries(titles).map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="navigate('${id}')"><span class="nav-glyph">${glyphs[id]}</span>${t[0]}</button>`).join('')}<button class="mobile-more ${['branches','events','finance','reports'].includes(tab)?'active':''}" onclick="mobileMore()"><span class="nav-glyph">•••</span>更多</button></nav><div class="side-bottom"><div class="side-world">${G.CITIES.length} 个市场<br><span>${G.PROVINCES.length} 个省级区域 · ${new Set(G.CARS.map(c=>c.brand)).size} 个品牌</span></div><div class="founder"><div class="avatar">${esc(s.name.slice(0,1))}</div><div>${esc(s.name)}<div style="font-size:9px;margin-top:5px">${s.branches.length} 家门店 · 创始人</div></div></div><button style="background:transparent;color:#9bb89f;padding:5px 0" onclick="help()">玩法与数据说明 ↗</button></div></aside><main class="main"><header class="topbar"><span class="breadcrumb">${esc(s.name)}　/　<strong>${title}</strong></span><div class="top-right"><span><i class="dot"></i>${DEMO?'测试模式 · 不保存':storageProblem?'请导出存档':'本地自动存档'}</span><button onclick="saveMenu()">公司与存档</button></div></header><section class="page-head"><div><div class="eyebrow">YOUR RENTAL EMPIRE</div><h1>${title}</h1><p>${sub}</p></div><div class="head-actions"><span style="font-size:12px;margin-right:8px">${date(s.month)}</span><button class="primary" onclick="nextMonth()" ${s.cash<0?'disabled':''}>结算本月　→</button></div></section>${s.cash<0?'<div class="warning">现金不足，先出售车辆或引入投资，再继续经营。</div>':''}${({overview,competitionPage,market,fleet,branches,events,finance,reports}[tab==='competition'?'competitionPage':tab])()}<footer class="bottom-note">${esc(s.name)} · 脚踩神州，拳打一嗨 2.2<br>城市名称参考公开行政区划，协同区为公司经营分组。市场份额、车辆属性、价格与事件均为游戏参数，非实时市场统计。</footer></main></div>`;save()}
function navigate(t){tab=t;render();window.scrollTo({top:0,behavior:'instant'})}
function cashLines(f){return `<div class="money-line"><span>预计租金收入</span><strong>${money(f.revenue)}</strong></div><div class="money-line"><span>用车、保险、清洁与维护</span><span>− ${money(f.variable+f.insurance+f.maintenance)}</span></div><div class="money-line"><span>门店、经理、营销与区域办公室</span><span>− ${money(f.fixed)}</span></div><div class="money-line"><span>还本付息与模拟税费</span><span>− ${money(f.principal+f.interest+f.tax)}</span></div><div class="money-line total"><span>预计月净现金流</span><span class="${sign(f.cashflow)}">${money(f.cashflow)}</span></div>`}
function shareBars(data){return `<div class="share-stack" aria-label="市场份额">${rivals.map(r=>`<span title="${esc(r.name())} ${pct(data.shares[r.id])}" style="width:${data.shares[r.id]*100}%;background:${r.color}"></span>`).join('')}</div>${rivals.map(r=>`<div class="share-row"><span><i style="background:${r.color}"></i>${esc(r.name())}</span><strong>${pct(data.shares[r.id])}</strong><small>${Math.round(data.totals[r.id]).toLocaleString()} 车日</small></div>`).join('')}`}
function scopeTitle(sc=scope,id=scopeId){return sc==='nation'?'全国市场':sc==='province'?G.province(id).name:sc==='region'?G.region(id).name:G.city(id).name}
function setScope(sc,id){scope=sc;scopeId=id;marketPage=0;marketSearch='';if(sc==='city')marketProvince=G.city(id).province;if(sc==='region')marketProvince=G.region(id).province;if(sc==='province')marketProvince=id;tab='competition';render();window.scrollTo({top:0,behavior:'smooth'})}
let overviewSection='cities',overviewCityPage=0,fleetPage=0;
function companyJourney(){const steps=[{title:'首店启程',goal:'完成首月经营',value:Math.min(1,s.month),target:1,action:'查看车队',tab:'fleet',note:'把第一间门店做好，让每一辆车都开始创造收入。'},{title:'初具规模',goal:'组建 5 辆车的车队',value:s.fleet.length,target:5,action:'采购车辆',tab:'market',note:'选择适合本地需求的车型，为下一步扩张打好基础。'},{title:'走出一座城',goal:'经营 3 座城市',value:s.branches.length,target:3,action:'寻找新市场',tab:'competition',note:'从一间好店，到彼此协作的城市网络。'},{title:'区域经营者',goal:'经营 10 座城市',value:s.branches.length,target:10,action:'管理门店',tab:'branches',note:'让经理负责每座城，把更多精力放在区域经营。'},{title:'全国拓展',goal:'经营 30 座城市',value:s.branches.length,target:30,action:'查看市场',tab:'competition',note:'建立跨区域的车队网络，让路途遍布更多城市。'}];return steps.find(x=>x.value<x.target)||{title:'全国经营者',goal:'继续扩大市场份额',value:30,target:30,action:'全国竞争',tab:'competition',note:'你的事业已经连成网络，下一段路仍由你决定。'}}
function setOverviewSection(section){overviewSection=section;render()}
function overview(){let f=G.forecast(s),ev=G.activeEvents(s),stories=G.story(s),actual=overviewPeriod==='actual'&&!!s.history.at(-1)?.cityStats,stats=G.cityStats(s,actual),top=stats.slice(0,10),national=G.competition(s),last=s.history.at(-1),journey=companyJourney(),pageSize=matchMedia('(max-width:800px)').matches?1:5;overviewCityPage=Math.min(overviewCityPage,Math.max(0,Math.ceil(top.length/pageSize)-1));return `<div class="headquarters"><section class="journey-banner"><div class="journey-symbol" aria-hidden="true">↗</div><div class="journey-copy"><span>你的事业 · 第 ${s.month+1} 个月</span><h2>${journey.title}</h2><p>${journey.note}</p></div><button class="journey-target" onclick="navigate('${journey.tab}')"><span>${journey.goal}<b>${Math.min(journey.value,journey.target)} / ${journey.target}　→</b></span><i><em style="width:${Math.min(100,journey.value/journey.target*100)}%"></em></i></button></section><div class="metrics overview-metrics">${metric('可用现金',money(s.cash),'创始人持股 '+s.founder.toFixed(1)+'%')}${metric('预计月净利润',money(f.profit),'本月预计营收 '+money(f.revenue))}${metric('经营版图',s.branches.length+' <small>座城市</small>',s.fleet.length+' 辆车 · '+s.regional.length+' 个区域办公室')}${metric('全国市场份额',pct(national.shares.you),'按出租车日加权 · 模拟市场')}</div><div class="hq-tabs" role="tablist" aria-label="总览内容">${[['cities','城市业绩'],['brief','本月简报'],['journey','成长路线']].map(([id,title])=>`<button role="tab" aria-selected="${overviewSection===id}" onclick="setOverviewSection('${id}')">${title}${id==='brief'&&!s.decisions[stories.id]?'<i></i>':''}</button>`).join('')}<button aria-haspopup="dialog" onclick="strategyDialog(s.branches[0].city)">竞争策略</button></div><div class="hq-content">${overviewSection==='cities'?`<section class="panel top-cities-panel"><div class="panel-head"><div><div class="eyebrow">YOUR STRONGEST MARKETS</div><h2>TOP 10 · 在营城市</h2><p>${stats.length} 座城市 · ${s.fleet.length} 辆车 · 按净利润排名</p></div><select aria-label="城市业绩时间" onchange="overviewPeriod=this.value;render()"><option value="forecast" ${!actual?'selected':''}>本月预计</option><option value="actual" ${actual?'selected':''} ${!last?.cityStats?'disabled':''}>上月实际</option></select></div><div class="city-performance"><div class="city-performance-head"><span>城市 / 负责人</span><span>车辆</span><span>月营收</span><span>净利润</span><span>市占率</span></div>${top.slice(overviewCityPage*pageSize,(overviewCityPage+1)*pageSize).map((r,i)=>`<button class="city-performance-row" onclick="setScope('city','${r.city}')"><span class="city-identity"><b class="rank-number">${String(overviewCityPage*pageSize+i+1).padStart(2,'0')}</b><span><strong>${G.city(r.city).name}</strong><small>经理 ${esc(r.manager)}</small></span></span><span data-label="车辆"><strong>${r.cars}</strong><small> 辆</small></span><span data-label="月营收"><strong>${money(r.revenue)}</strong></span><span data-label="净利润" class="${sign(r.profit)}"><strong>${money(r.profit)}</strong></span><span data-label="市占率"><strong>${pct(r.share)}</strong></span></button>`).join('')}</div><div class="city-page-footer"><span>${actual?'上月已结算':'本月预测'} · 点击城市查看市场</span>${top.length>pageSize?`<div><button aria-label="上一页城市业绩" ${!overviewCityPage?'disabled':''} onclick="overviewCityPage--;render()">←</button><span>${overviewCityPage+1}/${Math.ceil(top.length/pageSize)}</span><button aria-label="下一页城市业绩" ${(overviewCityPage+1)*pageSize>=top.length?'disabled':''} onclick="overviewCityPage++;render()">→</button></div>`:`<button onclick="navigate('branches')">管理门店 ↗</button>`}</div></section><div class="hq-bottom-line"><span>${G.city(s.branches[0].city).name}出发 · 正在书写全国版图</span><button onclick="setOverviewSection('brief')">本月经营提示 →</button></div>`:overviewSection==='brief'?`<div class="grid-main"><div><section class="panel"><div class="panel-head"><div><div class="eyebrow">MARKET SIGNALS</div><h2>本月市场风向</h2></div><button class="text-btn" onclick="navigate('events')">日历 ↗</button></div><div class="pad" style="padding-top:0">${ev.slice(0,3).map(e=>`<div class="event"><span class="pill">${e.kind}</span>　<strong>${e.title}</strong><p>${e.desc}</p></div>`).join('')}</div></section><section class="strategy"><span class="badge">经理提案 · ${s.decisions[stories.id]?'已处理':'等待你的决定'}</span><h2>${stories.title}</h2><p>${stories.text}</p><button class="primary" onclick="navigate('events')">听听经理的想法 →</button></section></div><section class="panel"><div class="panel-head"><h2>现金流预估</h2><span class="pill">${shortDate(s.month)}</span></div><div class="finance-mini">${cashLines(f)}<p>净利润扣除折旧，现金流扣除偿还本金；融资和借款不计入营业收入。</p></div></section></div>`:`<section class="panel growth-panel"><div class="panel-head"><div><div class="eyebrow">THE ROAD AHEAD</div><h2>从第一间店，到全国网络</h2><p>经营里程碑随你的事业实时更新。</p></div></div><div class="growth-stages">${[['01','首月经营','完成第一个月结算',s.month>=1],['02','组建车队','拥有至少 5 辆车',s.fleet.length>=5],['03','跨城经营','进入 3 座城市',s.branches.length>=3],['04','区域版图','进入 10 座城市',s.branches.length>=10],['05','全国网络','进入 30 座城市',s.branches.length>=30]].map(([num,title,desc,done])=>`<div class="growth-stage ${done?'done':''}"><span>${done?'✓':num}</span><div><h3>${title}</h3><p>${desc}</p></div><small>${done?'已达成':'待达成'}</small></div>`).join('')}</div><div class="growth-summary"><span>当前全国份额 <strong>${pct(national.shares.you)}</strong></span><button class="primary" onclick="navigate('${journey.tab}')">${journey.action} →</button></div></section>`}</div></div>`}
function competitionPage(){let data=G.competition(s,scope,scopeId),cities=G.scopeCities(scope,scopeId),provinceId=scope==='province'?scopeId:scope==='region'?G.region(scopeId).province:scope==='city'?G.city(scopeId).province:marketProvince,ct=scope==='city'?G.city(scopeId):null;return `<div class="scope-bar"><div class="tabs" style="margin:0">${[['nation','全国'],['province','省份'],['region','省内片区'],['city','城市']].map(([sc,label])=>`<button class="${scope===sc?'selected':''}" onclick="setScope('${sc}','${sc==='nation'?'':sc==='province'?provinceId:sc==='region'?(ct?ct.region:G.regions.find(r=>r.province===provinceId).id):ct?ct.id:G.CITIES.find(c=>c.province===provinceId).id}')">${label}</button>`).join('')}</div><select aria-label="竞争省份" onchange="setScope('province',this.value)">${G.PROVINCES.map(p=>`<option value="${p.id}" ${p.id===provinceId?'selected':''}>${p.name}</option>`).join('')}</select></div><div class="breadcrumb-path"><button onclick="setScope('nation','')">全国</button>${scope!=='nation'?` / <button onclick="setScope('province','${provinceId}')">${G.province(provinceId).name}</button>`:''}${scope==='region'||ct?` / <button onclick="setScope('region','${ct?ct.region:scopeId}')">${G.region(ct?ct.region:scopeId).name}</button>`:''}${ct?' / '+ct.name:''}</div><div class="metrics">${metric(scopeTitle()+' · 你的份额',pct(data.shares.you),'分子：你的预计出租车日')}${metric('模拟市场总量',wan(data.size)+' <small>车日</small>','分母：本区域全部供应商出租车日')}${metric('已覆盖市场',s.branches.filter(b=>cities.some(c=>c.id===b.city)).length+' / '+cities.length,'市场份额按车日加权汇总，非简单平均')}${metric('竞争目标',pct(Math.max(data.shares.shenzhou,data.shares.ehi)),'超过神州与一嗨的当前模拟份额')}</div><div class="cols"><section class="panel"><div class="panel-head"><h2>${scopeTitle()} · 竞争格局</h2><span class="pill">本月预测</span></div><div class="pad" style="padding-top:0">${shareBars(data)}<p>携程合作商户为独立模拟车队池，不重复计入神州和一嗨。所有份额为游戏数据，并非真实市场占有率。</p><button onclick="openPromotion('${ct?ct.id:s.branches[0].city}')">制定门店促销</button></div></section><section class="panel"><div class="panel-head"><h2>${ct?ct.name+' · 车型需求榜':'向下查看经营市场'}</h2><span class="subtle">${ct?'100 = 基础需求':'城市 → 协同区 → 省份 → 全国'}</span></div><div class="pad" style="padding-top:0">${ct?demandTable(ct.id,6):scope==='province'?`<div class="region-tiles">${G.regions.filter(r=>r.province===provinceId).map(r=>`<button onclick="setScope('region','${r.id}')"><strong>${r.name}</strong><span>${r.cities.length} 个市场 · 份额 ${pct(G.competition(s,'region',r.id).shares.you)}</span></button>`).join('')}</div>`:`<p>下方城市列表可以查询本地需求、开设门店，也可以进入省份或协同区查看整个区域的竞争。</p><div class="hint">聚合份额 = 所辖城市你的出租车日之和 ÷ 所辖城市市场总车日之和。门店扩张和调拨会直接改变这张竞争图。</div>`}${ct?`<p>${ct.tag} · 开店 ${money(ct.setup)} · 基础场地支出 ${money(ct.fixed)}/月</p><button onclick="cityDetail('${ct.id}')">查看市场 / 开店</button>`:''}</div></section></div><section class="panel"><div class="panel-head"><h2>${scope==='city'?'同片区市场':'城市市场清单'}</h2><input aria-label="搜索城市" placeholder="搜索城市或州、盟、地区" value="${esc(marketSearch)}" oninput="marketSearch=this.value;marketPage=0;renderCityList()"></div><div id="cityList">${cityList()}</div></section>`}
function cityList(){let cities=(scope==='city'?G.scopeCities('region',G.city(scopeId).region):G.scopeCities(scope,scopeId)).filter(c=>!marketSearch||c.fullName.includes(marketSearch)||c.name.includes(marketSearch));let shown=cities.slice(marketPage*15,marketPage*15+15);return `<div class="table-wrap"><table class="city-table"><thead><tr><th>城市 / 市场</th><th>所属省份 / 协同区</th><th>热门车型</th><th>你的市场份额</th><th>本地负责人</th><th>操作</th></tr></thead><tbody>${shown.map(c=>{let b=s.branches.find(b=>b.city===c.id),hot=G.demandRank(s,c.id)[0],share=G.competition(s,'city',c.id).shares.you;return `<tr><td><strong>${c.name}</strong><div class="car-sub">${c.kind} · ${c.tag}</div></td><td>${G.province(c.province).name}<div class="car-sub">${c.regionName}</div></td><td>${hot.brand} ${hot.name}<div class="car-sub">需求指数 ${hot.index}</div></td><td>${pct(share)}</td><td>${b?b.manager.name:'未设门店'}</td><td><button onclick="setScope('city','${c.id}')">进入市场 →</button></td></tr>`}).join('')}</tbody></table>${!cities.length?'<div class="empty">没有匹配的城市</div>':''}</div><div class="pagination"><span>共 ${cities.length} 个市场 · 第 ${marketPage+1} / ${Math.max(1,Math.ceil(cities.length/15))} 页</span><div><button ${!marketPage?'disabled':''} onclick="marketPage--;renderCityList()">上一页</button> <button ${marketPage*15+15>=cities.length?'disabled':''} onclick="marketPage++;renderCityList()">下一页</button></div></div>`}
function renderCityList(){$('#cityList').innerHTML=cityList()}
function demandTable(id,limit=8){return `<div class="demand-list">${G.demandRank(s,id).slice(0,limit).map((c,i)=>`<div class="demand-row"><span class="rank">${String(i+1).padStart(2,'0')}</span><div><strong>${c.brand} ${c.name}</strong><small>${c.type} · ${c.seats} 座 · ${c.energy}</small></div><div><strong>${c.index}</strong><small>${c.reason}</small></div></div>`).join('')}</div>`}
let catalogQuery={type:'全部',brand:'全部',energy:'全部',budget:0,search:''},catalogFiltersOpen=false;
function filteredCars(){let {type:filter,brand:brandFilter,energy:energyFilter,budget:budgetFilter,search:carSearch}=catalogQuery;return G.CARS.filter(c=>(filter==='全部'||c.type===filter)&&(brandFilter==='全部'||c.brand===brandFilter)&&(energyFilter==='全部'||c.energy===energyFilter)&&(!budgetFilter||c.price<=budgetFilter)&&(!carSearch||(c.brand+' '+c.name).toLowerCase().includes(carSearch.toLowerCase())))}
function market(){let brands=[...new Set(G.CARS.map(c=>c.brand))];return `<div class="catalog-summary"><span><strong>${G.CARS.length}</strong> 款车型</span><span><strong>${brands.length}</strong> 个品牌</span><span>为下一段旅程，选一辆合适的车</span><select aria-label="采购投放门店" onchange="purchaseCity=this.value;renderCatalog()">${s.branches.map(b=>`<option value="${b.city}" ${purchaseCity===b.city?'selected':''}>投放至 ${G.city(b.city).name}</option>`).join('')}</select></div><form class="catalog-search-form" onsubmit="event.preventDefault();submitCatalogSearch()"><details class="catalog-filters" ${catalogFiltersOpen?'open':''} ontoggle="catalogFiltersOpen=this.open"><summary>筛选车型 <span>品牌 · 动力 · 预算 · 类型</span></summary><div class="filter-bar"><select aria-label="品牌筛选" onchange="brandFilter=this.value;updateCatalogStatus()"><option>全部</option>${brands.map(b=>`<option ${brandFilter===b?'selected':''}>${b}</option>`).join('')}</select><select aria-label="动力筛选" onchange="energyFilter=this.value;updateCatalogStatus()">${['全部','纯电','插混','增程','混动','燃油','柴油'].map(e=>`<option ${energyFilter===e?'selected':''}>${e}</option>`).join('')}</select><select aria-label="采购预算" onchange="budgetFilter=+this.value;updateCatalogStatus()">${[[0,'不限预算'],[100000,'10 万以内'],[180000,'18 万以内'],[200000,'20 万以内'],[300000,'30 万以内'],[500000,'50 万以内'],[600000,'60 万以内'],[1000000,'100 万以内']].map(([v,t])=>`<option value="${v}" ${budgetFilter===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="tabs">${['全部',...G.TYPES].map(t=>`<button type="button" data-car-type="${t}" aria-pressed="${filter===t}" class="${filter===t?'selected':''}" onclick="selectCatalogType('${t}')">${t}</button>`).join('')}</div></details><div class="catalog-quick-search"><input aria-label="快速搜索车型" placeholder="搜索品牌 / 车型，如问界 M9" value="${esc(carSearch)}" oninput="carSearch=this.value;updateCatalogStatus()"><button type="submit" class="primary">搜索车型</button><button type="button" class="catalog-reset" onclick="resetCatalogSearch()">重置条件</button></div></form><div id="catalogSearchStatus" class="catalog-search-status" role="status">${esc(catalogStatusText())}</div><section class="panel" id="catalogBody">${catalogBody()}</section><div class="hint">座位与续航为代表配置的游戏参数，续航包含所选动力形式的总里程，不是厂家实测。车型库含历史量产车型，并非实时在售清单；新车上架日期是游戏剧情。日租金和促销请在「我的车队」中设置。</div>`}
function draftCatalogQuery(){return {type:filter,brand:brandFilter,energy:energyFilter,budget:budgetFilter,search:carSearch.trim()}}
function catalogStatusText(){if(JSON.stringify(draftCatalogQuery())!==JSON.stringify(catalogQuery))return '条件已更改，点击「搜索车型」后更新结果。';let q=catalogQuery,tags=[q.brand!=='全部'?q.brand:'',q.type!=='全部'?q.type:'',q.energy!=='全部'?q.energy:'',q.budget?wan(q.budget)+'以内':'',q.search?'“'+q.search+'”':''].filter(Boolean);return '找到 '+filteredCars().length+' 款车型 · '+(tags.length?tags.join(' / '):'全部车型')}
function updateCatalogStatus(){if($('#catalogSearchStatus'))$('#catalogSearchStatus').textContent=catalogStatusText()}
function selectCatalogType(type){filter=type;document.querySelectorAll('[data-car-type]').forEach(button=>{let active=button.dataset.carType===type;button.classList.toggle('selected',active);button.setAttribute('aria-pressed',String(active))});updateCatalogStatus()}
function submitCatalogSearch(){catalogQuery=draftCatalogQuery();catalogPage=0;catalogFiltersOpen=false;$('.catalog-filters').open=false;renderCatalog();updateCatalogStatus()}
function resetCatalogSearch(){filter=brandFilter=energyFilter='全部';budgetFilter=0;carSearch='';catalogQuery=draftCatalogQuery();catalogPage=0;catalogFiltersOpen=false;render()}
function catalogBody(){let size=matchMedia('(max-width:800px)').matches?1:12,all=filteredCars();catalogPage=Math.min(catalogPage,Math.max(0,Math.ceil(all.length/size)-1));let shown=all.slice(catalogPage*size,catalogPage*size+size);return `<div class="table-wrap"><table class="procurement-table"><thead><tr><th>品牌＋车型</th><th>车辆属性</th><th>模拟采购价</th><th>采购</th></tr></thead><tbody>${shown.map(c=>`<tr><td><strong>${c.brand} ${c.name}</strong></td><td>${attrs(c)}</td><td><strong>${money(c.price)}</strong></td><td><button class="${G.available(s,c)&&s.cash>=c.price?'primary':''}" onclick="purchase('${c.id}')" ${G.available(s,c)?'':'disabled'}>${G.available(s,c)?'采购':date(c.release)+' 上架'}</button></td></tr>`).join('')}</tbody></table>${!all.length?'<div class="empty">未找到匹配车型，试试其他品牌或预算。</div>':''}</div><div class="pagination"><span>共 ${all.length} 款 · 第 ${catalogPage+1} / ${Math.max(1,Math.ceil(all.length/size))} 页</span><div><button ${!catalogPage?'disabled':''} onclick="catalogPage--;renderCatalog()">上一页</button> <button ${catalogPage*size+size>=all.length?'disabled':''} onclick="catalogPage++;renderCatalog()">下一页</button></div></div>`}
function renderCatalog(){$('#catalogBody').innerHTML=catalogBody()}
let pendingPurchase=null;
function purchaseLimit(id,dest){let c=G.car(id),b=s.branches.find(b=>b.city===dest);if(!c||!b)return 0;return Math.max(0,Math.min(Math.floor(s.cash/c.price),b.level*8-s.fleet.filter(v=>v.city===dest).length))}
function purchase(id){let c=G.car(id),b=s.branches.find(b=>b.city===purchaseCity);if(!c||!b)return toast('请选择已开业门店');pendingPurchase={id,city:purchaseCity};let limit=purchaseLimit(id,purchaseCity);modal(`<div class="eyebrow">基础采购 · ${G.city(purchaseCity).name}</div><h2 class="modal-title">${c.brand} ${c.name}</h2><p>${attrs(c)} · 单价 ${money(c.price)}</p><div class="purchase-quantity"><label for="purchaseQuantity">采购数量</label><div class="quantity-controls"><button id="quantityMinus" aria-label="减少采购数量" onclick="changePurchaseQuantity(-1)">−</button><input id="purchaseQuantity" aria-describedby="purchaseLimit purchaseFeedback" type="number" inputmode="numeric" min="1" max="${Math.max(1,limit)}" step="1" value="1" oninput="updatePurchasePreview()" onkeydown="if(event.key==='Enter'){event.preventDefault();confirmPurchase()}"><button id="quantityPlus" aria-label="增加采购数量" onclick="changePurchaseQuantity(1)">＋</button><span>辆</span></div><small id="purchaseLimit">按当前现金与车位，最多可采购 ${limit} 辆</small></div><div id="purchasePreview" class="report-grid"></div><p id="purchaseFeedback" class="purchase-feedback" role="status"></p><p class="purchase-insurance-note">新车采用${G.INS[b.policy?.insurance??1].name}，可在车队中调整租金与折扣。</p><div class="modal-foot"><button onclick="closeModal();pendingPurchase=null">取消</button><button id="purchaseConfirm" class="primary" onclick="confirmPurchase()">确认采购</button></div>`);updatePurchasePreview()}
function changePurchaseQuantity(delta){if(!pendingPurchase)return;let input=$('#purchaseQuantity'),value=Number(input.value);input.value=Math.max(1,Math.min(Math.max(1,purchaseLimit(pendingPurchase.id,pendingPurchase.city)),(Number.isInteger(value)?value:1)+delta));updatePurchasePreview()}
function updatePurchasePreview(){if(!pendingPurchase)return;let {id,city}=pendingPurchase,c=G.car(id),b=s.branches.find(b=>b.city===city),qty=Number($('#purchaseQuantity').value),valid=Number.isSafeInteger(qty)&&qty>=1,used=s.fleet.filter(v=>v.city===city).length,capacity=b.level*8,limit=purchaseLimit(id,city),error=!valid?'请输入至少 1 辆的整数数量。':!G.available(s,c)?'该车型尚未进入采购目录。':qty>capacity-used?'门店车位不足，请减少数量或先扩建。':qty*c.price>s.cash?'可用现金不足，请减少数量或先融资。':'';$('#purchasePreview').innerHTML=`<div><small>采购总价</small><strong>${valid?money(qty*c.price):'—'}</strong></div><div><small>采购后可用现金</small><strong class="${valid&&qty*c.price>s.cash?'negative':''}">${valid?money(s.cash-qty*c.price):'—'}</strong></div>`;$('#purchaseFeedback').textContent=error||`采购后车位 ${used+qty} / ${capacity} · 本次入库 ${qty} 辆`;$('#purchaseFeedback').classList.toggle('negative',!!error);$('#purchaseConfirm').disabled=!!error;$('#purchaseConfirm').textContent=valid?'确认采购 '+qty+' 辆':'确认采购';$('#quantityMinus').disabled=!valid||qty<=1;$('#quantityPlus').disabled=!valid||qty>=limit}
function confirmPurchase(){if(!pendingPurchase||!$('#modal').open)return;let {id,city}=pendingPurchase,qty=Number($('#purchaseQuantity').value),e=G.buy(s,id,city,qty);if(e){updatePurchasePreview();return toast(e)}pendingPurchase=null;closeModal();render();toast(qty+' 辆新车已到店，可前往我的车队定价')}
function fleet(){let metrics=G.fleetMetrics(s),f=G.forecast(s),vs=s.fleet.filter(v=>fleetCity==='全部'||v.city===fleetCity),size=matchMedia('(max-width:800px)').matches?1:10;fleetPage=Math.min(fleetPage,Math.max(0,Math.ceil(vs.length/size)-1));return `<div class="metrics">${metric('在营车辆',s.fleet.length+' 辆','车辆出售估值 '+money(G.value(s)))}${metric('促销中的车辆',s.fleet.filter(v=>G.discount(s,v)<1).length+' 辆','单车与门店促销叠加，到期自动恢复')}${metric('预计月保费',money(f.insurance),'基础 / 全面 / 安心尊享')}${metric('待保养车辆',s.fleet.filter(v=>v.health<65).length+' 辆','经理可自动保养，保留 2 万现金')}</div><div class="scope-bar"><select aria-label="车队门店筛选" onchange="fleetCity=this.value;fleetPage=0;selectedVehicles.clear();render()"><option value="全部">全部门店</option>${s.branches.map(b=>`<option value="${b.city}" ${fleetCity===b.city?'selected':''}>${G.city(b.city).name}</option>`).join('')}</select><div><button onclick="batchTransfer()">批量调拨</button> <button onclick="openPromotion('${fleetCity==='全部'?s.branches[0].city:fleetCity}')">门店打折</button> <button class="primary" onclick="navigate('market')">＋ 采购</button></div></div><section class="panel"><div class="table-wrap"><table class="fleet-table"><thead><tr><th>选择</th><th>品牌＋车型</th><th>车辆属性</th><th>单日租金</th><th>本月预计</th><th>门店 / 状态</th><th>管理</th></tr></thead><tbody>${vs.slice(fleetPage*size,(fleetPage+1)*size).map(v=>{let c=G.car(v.id),a=metrics.get(v.uid),dis=G.discount(s,v);return `<tr><td><input aria-label="选择车辆 ${v.uid}" type="checkbox" ${selectedVehicles.has(v.uid)?'checked':''} onchange="this.checked?selectedVehicles.add(${v.uid}):selectedVehicles.delete(${v.uid})"></td><td><strong>${c.brand} ${c.name}</strong><div class="car-sub">#${String(v.uid).padStart(3,'0')}</div></td><td>${c.type} · ${c.seats} 座 · ${c.energy}<div class="car-sub">累计 ${(v.mileage||0).toLocaleString()} km · 续航 ${c.range} km</div></td><td><strong>${money(G.rentalPrice(s,v))}</strong>${dis<1?`<div class="car-sub"><del>${money(G.baseRent(s,v))}</del> · ${(dis*10).toFixed(1)} 折</div>`:''}</td><td>${pct(a.u)} 出租率<div class="car-sub">${money(a.revenue)} 营收</div></td><td>${G.city(v.city).name}<div class="car-sub">车况 ${Math.round(v.health)}% · ${G.INS[v.insurance].name}</div></td><td><button onclick="manageCar(${v.uid})">定价 / 管理</button></td></tr>`}).join('')}</tbody></table>${!vs.length?'<div class="empty">这家门店尚无车辆，可采购或从其他城市调入。</div>':''}</div><div class="pagination"><span>共 ${vs.length} 辆 · ${fleetPage+1}/${Math.max(1,Math.ceil(vs.length/size))} 页</span><div><button ${!fleetPage?'disabled':''} onclick="fleetPage--;render()">上一辆</button> <button ${(fleetPage+1)*size>=vs.length?'disabled':''} onclick="fleetPage++;render()">下一辆</button></div></div></section>`}
function manageCar(uid){let v=s.fleet.find(v=>v.uid===uid),c=G.car(v.id);modal(`<div class="eyebrow">我的车队 · #${uid}</div><h2 class="modal-title">${c.brand} ${c.name}</h2><p>${attrs(c)}<br>${G.city(v.city).name} · 累计 ${(v.mileage||0).toLocaleString()} km · 车况 ${Math.round(v.health)}%</p><div class="settings"><div class="form-row"><label for="dailyRate">单日租金（折扣前）</label><input id="dailyRate" type="number" min="50" max="20000" value="${Math.round(G.baseRent(s,v))}"></div><div class="form-row"><label for="carInsurance">保险方案</label><select id="carInsurance">${G.INS.map((p,i)=>`<option value="${i}" ${v.insurance===i?'selected':''}>${p.name} · ${money(c.price*p.rate/12)}/月</option>`).join('')}</select></div><div class="form-row"><label for="carDiscount">单车折扣</label><select id="carDiscount">${[[1,'不打折'],[.95,'9.5 折'],[.9,'9 折'],[.85,'8.5 折'],[.8,'8 折'],[.7,'7 折']].map(([n,t])=>`<option value="${n}" ${v.promo&&v.promo.until>=s.month&&v.promo.factor===n?'selected':''}>${t}</option>`).join('')}</select></div><div class="form-row"><label for="carDuration">折扣持续时间</label><select id="carDuration"><option value="1">本月</option><option value="3">3 个月</option><option value="6">6 个月</option></select></div></div><div class="hint">老客专属折扣按门店老客占比加权计入成交日租。打折会降低每车日收入，并提高预计出租率，出租率上限 95%。门店折扣与单车折扣相乘。折扣到期自动恢复，不改变日租金原价。</div><div class="modal-foot" style="flex-wrap:wrap"><button class="danger" onclick="sellPrompt(${uid})">出售</button><button onclick="maintain(${uid})">保养 ${money(G.maintenanceCost(v))}</button><button onclick="closeModal()">取消</button><button class="primary" onclick="saveVehicle(${uid})">保存定价与保险</button></div>`)}
function saveVehicle(uid){let v=s.fleet.find(v=>v.uid===uid),rate=+$('#dailyRate').value;if(!Number.isFinite(rate)||rate<50||rate>20000)return toast('日租金需在 50—20,000 元之间');v.dailyRate=rate;v.insurance=+$('#carInsurance').value;v.promo={factor:+$('#carDiscount').value,until:s.month+(+$('#carDuration').value)-1};closeModal();render();toast('日租金、保险与折扣已生效')}
function maintain(uid){let e=G.maintain(s,uid);if(e)return toast(e);closeModal();render();toast('车辆已完成保养')}
function sellPrompt(uid){let v=s.fleet.find(v=>v.uid===uid),c=G.car(v.id),price=G.value({...s,fleet:[v]});modal(`<h2 class="modal-title">出售 ${c.brand} ${c.name}</h2><p>按车龄与车况回收 ${money(price)}，出售后不再产生租金。</p><div class="modal-foot"><button onclick="manageCar(${uid})">返回</button><button class="danger" onclick="sell(${uid})">确认出售</button></div>`)}
function sell(uid){let v=s.fleet.find(v=>v.uid===uid);s.cash+=G.value({...s,fleet:[v]});s.fleet=s.fleet.filter(v=>v.uid!==uid);selectedVehicles.delete(uid);closeModal();render();toast('车辆已售出')}
function openPromotion(id){let b=s.branches.find(b=>b.city===id);if(!b)return toast('先在该城市开设门店，才能设置促销');let before=G.forecast(s);modal(`<h2 class="modal-title">${G.city(id).name} · 主动打折</h2><p>针对竞争对手开展整店促销。选择折扣后可先看经营预估，再决定是否执行。</p><div class="settings"><div class="form-row"><label for="storeDiscount">门店折扣</label><select id="storeDiscount" onchange="previewPromotion('${id}')">${[[1,'恢复原价'],[.95,'9.5 折'],[.9,'9 折'],[.85,'8.5 折'],[.8,'8 折'],[.7,'7 折']].map(([v,t])=>`<option value="${v}" ${v===(b.promo&&b.promo.until>=s.month?b.promo.factor:1)?'selected':''}>${t}</option>`).join('')}</select></div><div class="form-row"><label for="storeDuration">持续月份</label><select id="storeDuration"><option value="1">本月</option><option value="3">3 个月</option><option value="6">6 个月</option></select></div></div><div id="promotionEstimate" class="hint"></div><p>促销按折后日租金结算；不同车辆会受到出租率上限限制。公司盈利不一定随出租率一起上升。</p><div class="modal-foot"><button onclick="closeModal()">取消</button><button class="primary" onclick="setPromotion('${id}')">执行门店促销</button></div>`);previewPromotion(id)}
function previewPromotion(id){let copy=G.clone(s),b=copy.branches.find(b=>b.city===id),before=G.forecast(s);b.promo={factor:+$('#storeDiscount').value,until:s.month};let after=G.forecast(copy),share=G.competition(copy,'city',id).shares.you;$('#promotionEstimate').innerHTML=`公司预计营收：${money(before.revenue)} → ${money(after.revenue)}<br>公司预计净利润：${money(before.profit)} → ${money(after.profit)}<br>${G.city(id).name}预计市场份额：${pct(share)}`}
function setPromotion(id){let b=s.branches.find(b=>b.city===id);b.promo={factor:+$('#storeDiscount').value,until:s.month+(+$('#storeDuration').value)-1};closeModal();render();toast('门店折扣已生效，到期自动恢复')}
function batchTransfer(){let ids=[...selectedVehicles].filter(id=>s.fleet.some(v=>v.uid===id));if(!ids.length)return toast('请先勾选需要调拨的车辆');modal(`<h2 class="modal-title">统一调拨 ${ids.length} 辆车</h2><p>同省每车 ¥500，跨省每车 ¥1,200；目的地有区域办公室时享 8 折调拨费。已在目的地的车不会重复收费。</p><div class="form-row"><label for="transferCity">调入门店</label><select id="transferCity">${s.branches.map(b=>`<option value="${b.city}">${G.city(b.city).name} · 空余 ${b.level*8-s.fleet.filter(v=>v.city===b.city).length} 车位</option>`).join('')}</select></div><div class="modal-foot"><button onclick="closeModal()">取消</button><button class="primary" onclick="confirmTransfer()">确认调拨</button></div>`)}
function confirmTransfer(){let e=G.transfer(s,[...selectedVehicles],$('#transferCity').value);if(e)return toast(e);selectedVehicles.clear();closeModal();render();toast('车辆已调入目的门店')}
let strategyDraft=null,strategyStep=0;
function strategyDialog(id,key){let b=s.branches.find(b=>b.city===id);if(!b)return;let active=key||(G.STRATEGIES[b.strategy]?b.strategy:'market'),preset=G.STRATEGIES[active];strategyDraft={city:id,key:active,price:b.policy&&!key?b.policy.price:preset.price,insurance:b.policy&&!key?b.policy.insurance:preset.insurance,cleaning:b.policy&&!key?b.policy.cleaning:preset.cleaning,loyalDiscount:b.policy&&!key?b.policy.loyalDiscount:preset.loyalDiscount};strategyStep=0;renderStrategyDialog()}

vs=copy.fleet.filter(v=>v.city===d.city),sum=k=>vs.reduce((n,v)=>n+metrics.get(v.uid)[k],0),recs=G.strategyRecommendations(copy,d.city,d.key);modal(`<div class="eyebrow">COMPETITIVE STRATEGY · 02 / 02</div><h2 class="modal-title">${ct.name} · ${p.name}</h2><div class="strategy-estimates"><div><small>城市预计月营收</small><strong>${money(before.revenue)} → ${money(after.revenue)}</strong></div><div><small>城市预计月净利润</small><strong class="${sign(after.profit)}">${money(before.profit)} → ${money(after.profit)}</strong></div><div><small>预计市占率</small><strong>${pct(before.share)} → ${pct(after.share)}</strong></div><div><small>每月清洁 / 保费预估</small><strong>${money(sum('cleaning'))} / ${money(sum('insurance'))}</strong></div></div><p class="strategy-cost-note">当前老客占比 ${pct(b.repeatShare||0)}；老客按 ${+(d.loyalDiscount*10).toFixed(1)} 折结算。复购需完成订单逐月积累，上限 60%。公开基准日租 × ${Math.round(d.price*100)}%，成交日租再按老客占比加权。</p><details class="strategy-recommendations"><summary>推荐车型与策略取舍</summary><p>${p.tradeoff}</p>${recs.map(c=>`<div>${c.brand} ${c.name}<small>${c.type} · 需求指数 ${c.index} · ${money(c.price)}</small></div>`).join('')}<p>按当地需求和策略预算推荐，不会自动购车。</p></details><p class="strategy-apply-note">将重设本店 ${vs.length} 辆车的租金与保险，清除本店和单车促销。新购车辆沿用此方案；其他门店不变。可在车队中再单独调整。</p><div class="modal-foot"><button onclick="strategyStep=0;renderStrategyDialog()">返回调整</button><button class="primary" onclick="confirmStrategy()">确认应用到${ct.name}</button></div>`)}

function nextMonth(){if(s.cash<0)return toast('请先补足现金');if($('#modal').open)return;let before=G.clone(s),r=G.advance(s),previous=before.history.at(-1);render();modal(`<div class="month-review"><div class="review-stamp"><span>月度经营纪要</span><b>${String(r.month%12+1).padStart(2,'0')}</b><small>${2026+Math.floor(r.month/12)} / 第 ${r.month+1} 个月</small></div><div class="review-body"><div class="eyebrow">MONTHLY REVIEW</div><h2 class="modal-title">${r.profit>=0?'把路走稳，生意向前。':'调整方向，下月再出发。'}</h2><div class="review-profit"><span>本月经营净利润</span><strong class="${sign(r.profit)}">${money(r.profit)}</strong><small>${previous?'较上月 '+(r.profit-previous.profit>=0?'+':'')+money(r.profit-previous.profit):'第一份月报，记录你的经营起点。'}</small></div><div class="report-grid"><div><small>本月营收</small><strong>${money(r.revenue)}</strong></div><div><small>净现金流</small><strong class="${sign(r.cashflow)}">${money(r.cashflow)}</strong></div><div><small>车队出租率</small><strong>${pct(r.utilization)}</strong></div><div><small>期末可用现金</small><strong>${money(s.cash)}</strong></div></div><details class="review-details"><summary>经理汇报 · ${r.news.length} 条动态</summary><div class="modal-news">${r.news.map(n=>`<p>${esc(n)}</p>`).join('')}</div></details><p class="review-note">净利润含折旧；净现金流含还本。采购、扩店与融资不计入营收。</p></div></div><div class="modal-foot"><button onclick="closeModal();navigate('reports')">详细报告</button><button class="primary" onclick="closeModal()">前往 ${shortDate(s.month)} →</button></div>`)}

function reports(){let latest=s.history.at(-1),f=latest||G.forecast(s),hist=s.history.slice(-12),max=Math.max(1,...hist.map(h=>Math.abs(h.profit))),sc=s.branches[0].city,actual=G.competition(s,'city',sc,!!latest);return `<div class="cols"><section class="panel"><div class="panel-head"><h2>最近十二个月净利润</h2><span class="subtle">绿色盈利 / 棕色亏损</span></div>${hist.length?`<div class="chart">${hist.map(h=>`<div class="bar-wrap" title="${date(h.month)}：${money(h.profit)}"><div class="bar ${h.profit<0?'loss':''}" style="height:${Math.max(2,Math.abs(h.profit)/max*100)}%"></div><span>${shortDate(h.month)}</span></div>`).join('')}</div>`:'<div class="empty">完成第一个月后生成经营曲线。</div>'}</section><section class="panel"><div class="panel-head"><h2>${G.city(sc).name} · ${latest?'上月实际':'本月预计'}份额</h2><button class="text-btn" onclick="setScope('city','${sc}')">更多区域 →</button></div><div class="pad" style="padding-top:0">${shareBars(actual)}</div></section></div><div class="cols"><section class="panel"><div class="panel-head"><h2>${latest?date(latest.month)+' 损益表':'首月预计损益表'}</h2></div><div class="finance-mini">${[['租金收入',f.revenue],['用车成本',-(f.variable-(f.cleaning||0))],['清洁支出',-(f.cleaning||0)],['保险费',-f.insurance],['维护与自动保养',-f.maintenance],['门店、经理、营销与区域办公室',-f.fixed],['月中培训、调拨、保养与提案',-(f.storyCost||0)],['利息',-f.interest],['事故自付',-(f.loss||0)],['折旧（非现金）',-f.depreciation],['模拟利润税费',-f.tax],['净利润',f.profit],['偿还本金（非损益）',-f.principal],['经营及偿债后净现金流',f.cashflow]].map(([k,v])=>`<div class="money-line ${k==='净利润'?'total':''}"><span>${k}</span><strong>${money(v)}</strong></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><h2>经理经营汇报</h2></div><div class="pad" style="padding-top:0">${s.history.slice(-3).reverse().map(h=>`<div class="event"><strong>${date(h.month)} · 利润 ${money(h.profit)}</strong>${h.news.slice(0,8).map(n=>`<p>${esc(n)}</p>`).join('')}</div>`).join('')||'<div class="empty">各城经理将在月底汇报运营与事故。</div>'}</div></section></div>`}
function finance(){let f=G.forecast(s),payback=f.cashflow>0?Math.ceil(Math.max(0,s.capital-s.operatingCash)/f.cashflow):null;return `<div class="metrics">${metric('公司净资产',money(G.equity(s)),'现金 + 资产估值 − 未偿本金')}${metric('未偿贷款本金',money(G.debt(s)),'下月还本付息 '+money(f.principal+f.interest))}${metric('累计经营净现金',money(s.operatingCash),'排除融资、借款、购车及开店支出')}${metric('创始人持股',s.founder.toFixed(1)+'%','初始投入 '+money(s.capital))}</div><div class="cols"><section class="panel"><div class="panel-head"><h2>银行贷款</h2><span class="pill">等额本金</span></div><div class="pad" style="padding-top:0"><p>模拟年利率 7.2%，每月按剩余本金计息。新贷款从下次结算起还款。</p><div class="form-row"><label>借款金额</label><select id="loanAmount" onchange="loanPreview()"><option value="100000">10 万元</option><option value="200000">20 万元</option><option value="500000">50 万元</option></select></div><div class="form-row"><label>借款期限</label><select id="loanMonths" onchange="loanPreview()"><option value="24">24 个月</option><option value="12">12 个月</option><option value="36">36 个月</option></select></div><div class="hint" id="loanPreview">首月还款 ${money(100000/24+600)} · 后续逐月递减</div><p>剩余授信 ${money(Math.max(0,Math.max(100000,G.value(s)*.65+Math.max(0,f.profit)*12)-G.debt(s)))}</p><button class="primary" onclick="takeLoan()">确认借款</button></div></section><section class="panel"><div class="panel-head"><h2>引入股权投资</h2><span class="pill orange">让渡股份</span></div><div class="pad" style="padding-top:0"><p>与模拟投资人谈判，以股份换取扩张资金。融资不会增加利润，也不需要按月还本。</p><div class="money-line"><span>当前模拟投前估值</span><strong>${money(G.valuation(s))}</strong></div><div class="form-row"><label>投资人出资</label><select id="raiseAmount" onchange="raisePreview()"><option value="200000">20 万元</option><option value="500000">50 万元</option><option value="1000000">100 万元</option></select></div><div class="hint" id="raisePreview">本轮出售 ${(200000/(G.valuation(s)+200000)*100).toFixed(1)}% 股权，创始人持股降至 ${(s.founder*G.valuation(s)/(G.valuation(s)+200000)).toFixed(1)}%</div><p>估值 = 净资产 + 正向预计月利润 × 30 + 品牌价值，最低 20 万。</p><button class="primary" onclick="fundraise()">查看投资条款</button></div></section></div><div class="cols"><section class="panel"><div class="panel-head"><h2>投资回本测算</h2><span class="subtle">静态估算</span></div><div class="pad" style="padding-top:0"><div class="big-num">${payback===null?'暂未形成正现金流':payback===0?'已覆盖初始投入':`约 ${payback} 个月`}</div><p>按当前预计净现金流，覆盖剩余初始投入所需时间。累计经营净现金为负时，会增加待回收金额。</p><div class="progress"><span style="width:${Math.min(100,Math.max(0,s.operatingCash/s.capital*100))}%"></span></div><div class="money-line"><span>初始投入 / 累计经营净现金</span><strong>${wan(s.capital)} / ${wan(s.operatingCash)}</strong></div><div class="hint">这是公司经营现金覆盖初始资本的进度，不等于股东已收到分红。未预测未来购车、扩店、市场变化和退出残值；融资后的股东回报还受稀释影响。</div></div></section><section class="panel"><div class="panel-head"><h2>贷款明细</h2></div><div class="pad" style="padding-top:0">${s.loans.map((l,i)=>`<div class="event"><div class="row-between"><strong>贷款 ${i+1} · 剩余 ${l.months} 期</strong><button onclick="repay(${i})">提前结清</button></div><p>本金 ${money(l.balance)} · 下期 ${money(G.payment(l))}</p></div>`).join('')||'<div class="empty">暂无贷款，轻装前行。</div>'}</div></section></div>`}

function loanPreview(){let a=+$('#loanAmount').value,m=+$('#loanMonths').value;$('#loanPreview').textContent=`首月还款 ${money(a/m+a*.072/12)} · 总利息 ${money(a*.072/12*(m+1)/2)} · 后续逐月递减`}
function takeLoan(){let e=G.loan(s,+$('#loanAmount').value,+$('#loanMonths').value);if(e)return toast(e);render();toast('贷款已到账，下一次结算开始还款')}
function raisePreview(){let a=+$('#raiseAmount').value,v=G.valuation(s);$('#raisePreview').textContent=`本轮出售 ${(a/(v+a)*100).toFixed(1)}% 股权，创始人持股降至 ${(s.founder*v/(v+a)).toFixed(1)}%`}
function fundraise(){let a=+$('#raiseAmount').value,v=G.valuation(s);modal(`<div class="eyebrow">TERM SHEET · 模拟投资人</div><h2 class="modal-title">一笔新的成长资金</h2><div class="report-grid"><div><small>本轮投资金额</small><strong>${wan(a)}</strong></div><div><small>投后估值</small><strong>${wan(v+a)}</strong></div><div><small>新投资人持股</small><strong>${(a/(a+v)*100).toFixed(1)}%</strong></div><div><small>你的剩余持股</small><strong>${(s.founder*v/(v+a)).toFixed(1)}%</strong></div></div><p>投资人不参与日常经营。已有股东等比例稀释；资金进入公司账户，不计入营收或利润。</p><div class="modal-foot"><button onclick="closeModal()">暂不接受</button><button class="primary" onclick="acceptRaise(${a})">签署投资协议</button></div>`)}
function acceptRaise(a){G.raise(s,a);closeModal();render();toast('投资款已到账，股权结构已更新')}
function repay(i){let l=s.loans[i];if(s.cash<l.balance)return toast('现金不足以结清该笔本金');modal(`<h2 class="modal-title">提前结清贷款</h2><p>立即支付剩余本金 ${money(l.balance)}，游戏中不收提前还款费用。</p><div class="modal-foot"><button onclick="closeModal()">取消</button><button class="primary" onclick="s.cash-=s.loans[${i}].balance;s.loans.splice(${i},1);closeModal();render();toast('贷款已结清')">确认结清</button></div>`)}
function help(){modal(`<h2 class="modal-title">把每座城市，连成你的事业。</h2><p>先在「市场与竞争」了解当地需求，再到「基础采购」买车，在「我的车队」设置单日租金和折扣。每月自动模拟订单、事故、收入和成本。</p><div class="hint">城市 → 省内协同区 → 省份 → 全国，份额统一按出租车日计算。协同区是公司运营分组，不是正式行政区。<br>每城经理影响获客、服务、控本。两家同片区门店可设区域办公室，带来协同效果并增加管理成本。<br>节假日、地方活动、上新和提案会真实影响模拟需求；游戏里的上架日期不对应现实。</div><p>城市库基于<a class="link" href="https://www.mca.gov.cn/mzsj/xzqh/2023/202301xzqh.html" target="_blank" rel="noopener">民政部 2023 年公开行政区划表</a>：333 个地级行政区，加上直辖市、港澳、省直管县级市场及台湾补充市场，共 393 个经营据点。未声称同步后续调整。</p><p>327 款真实品牌车型含历史车型；采购价格、日租金、座位/续航代表参数、市场份额、保险与融资均为游戏设定，非实时在售清单或现实报价。携程合作商户是独立虚构车队池，避免与连锁车行重复计算。</p><p>利润扣折旧和利息，但不扣贷款本金；现金流扣本金、不扣折旧。模拟利润税按正向利润的 10% 简化计提。保险只简化模拟维修赔付，不覆盖现实承保规则。</p><div class="modal-foot"><button class="primary" onclick="closeModal()">明白，继续经营</button></div>`)}
function saveMenu(){modal(`<h2 class="modal-title">公司与存档</h2><div class="form-row"><label for="companyName">公司 / 店铺名称</label><input id="companyName" maxlength="20" value="${esc(s.name)}"> <button onclick="renameCompany()">保存名称</button></div><p>进度保存在当前浏览器。旧版存档可以导入并自动升级；重新创业前可以先导出留档。</p><div class="modal-foot" style="flex-wrap:wrap"><button onclick="exportSave()">导出存档</button><button onclick="$('#importFile').click()">导入存档</button><button onclick="restorePrevious()">恢复上一次事业</button><button class="danger" onclick="resetPrompt()">重新创业</button><button class="primary" onclick="closeModal()">完成</button></div><input type="file" id="importFile" accept="application/json" style="display:none" onchange="importSave(this.files[0])">`)}

function exportSave(){let b=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`脚踩神州拳打一嗨-${s.name}-${s.month+1}月.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('存档已导出')}
function validSave(t){try{if(!t||t.version!==2||!Number.isInteger(t.month)||t.month<0||t.month>12000)return false;for(const k of ['cash','capital','invested','founder','rep','nextId','profit','operatingCash','seed'])if(!Number.isFinite(t[k]))return false;if(t.capital<=0||t.founder<0||t.founder>100||t.rep<0||t.rep>100)return false;if(typeof t.name!=='string'||t.name.length>20||t.name!==G.cleanName(t.name))return false;if(!Array.isArray(t.branches)||!t.branches.length||t.branches.length>G.CITIES.length||new Set(t.branches.map(b=>b.city)).size!==t.branches.length)return false;for(const b of t.branches){if(!G.city(b.city)||!Number.isInteger(b.level)||b.level<1||b.level>1000||!Number.isFinite(b.price)||b.price<.7||b.price>1.5||![0,800,2000,5000].includes(b.marketing)||![1,2,3].includes(b.service)||!b.manager)return false;if(b.repeatShare!==undefined&&(!Number.isFinite(b.repeatShare)||b.repeatShare<0||b.repeatShare>.6))return false;if(b.policy&&(!G.STRATEGIES[b.strategy]||!Number.isFinite(b.policy.price)||b.policy.price<.7||b.policy.price>1.5||![0,1,2].includes(b.policy.insurance)||!Number.isFinite(b.policy.cleaning)||b.policy.cleaning<10||b.policy.cleaning>100||!Number.isFinite(b.policy.loyalDiscount)||b.policy.loyalDiscount<.7||b.policy.loyalDiscount>1))return false;for(const k of ['sales','service','efficiency','salary','level','trainedMonth'])if(!Number.isFinite(b.manager[k]))return false;if(typeof b.manager.name!=='string'||/[<>&]/.test(b.manager.name))return false;if(typeof b.manager.style!=='string'||/[<>&]/.test(b.manager.style))return false}
if(!Array.isArray(t.fleet)||t.fleet.length>50000||new Set(t.fleet.map(v=>v.uid)).size!==t.fleet.length)return false;for(const v of t.fleet){if(!G.car(v.id)||!t.branches.some(b=>b.city===v.city)||!Number.isInteger(v.uid)||!Number.isInteger(v.age)||v.age<0||!Number.isFinite(v.health)||v.health<0||v.health>100||![0,1,2].includes(v.insurance)||!Number.isFinite(v.earnings))return false;if(v.dailyRate!==undefined&&(!Number.isFinite(v.dailyRate)||v.dailyRate<50||v.dailyRate>20000))return false}if(t.nextId<=Math.max(0,...t.fleet.map(v=>v.uid)))return false;for(const obj of [...t.fleet,...t.branches])if(obj.promo&&(!Number.isFinite(obj.promo.factor)||obj.promo.factor<.7||obj.promo.factor>1||!Number.isInteger(obj.promo.until)))return false;if(!Array.isArray(t.loans)||t.loans.some(l=>!Number.isFinite(l.balance)||l.balance<0||!Number.isFinite(l.rate)||l.rate<0||!Number.isInteger(l.months)||l.months<1))return false;if(!Array.isArray(t.history)||!Array.isArray(t.events)||!Array.isArray(t.effects)||!Array.isArray(t.regional)||!t.decisions)return false;for(const h of t.history){for(const k of ['month','revenue','variable','insurance','maintenance','fixed','interest','principal','depreciation','tax','profit','cashflow','utilization','cash','days'])if(!Number.isFinite(h[k]))return false;if(!Array.isArray(h.news)||h.news.some(n=>typeof n!=='string'))return false}for(const e of t.effects)if(!G.city(e.city)||!G.TYPES.includes(e.type)||!Number.isFinite(e.factor)||e.factor<0||e.factor>2||!Number.isInteger(e.until)||typeof e.title!=='string'||/[<>]/.test(e.title))return false;for(const r of t.regional)if(!G.region(r.region)||typeof r.name!=='string'||/[<>]/.test(r.name))return false;return true}catch{return false}}
async function importSave(file){if(!file)return;try{if(file.size>15000000)throw Error();let t=G.migrate(JSON.parse(await file.text()));if(!validSave(t))throw Error();s=t;purchaseCity=s.branches[0].city;scope='city';scopeId=purchaseCity;selectedVehicles.clear();closeModal();render();toast('存档已恢复')}catch{toast('无法导入：存档格式或数据不正确')}}

const startCopy=[['每一段远途，','都有一个起点。','选一座你想深耕的城市，把第一间门店开在这里。'],['让这段路，','有你的名字。','未来，客户会在全国各地看到这块招牌。'],['第一间门店，','准备开业。','资金、车队与经理已就位。接下来，由你掌舵。']];
function onboarding(reset=false){startReset=reset;const c=G.city(startCity),copy=startCopy[startStep];$('#app').innerHTML=`<main class="opening step-${startStep}"><header class="opening-header"><div class="logo"><span class="logo-mark">↗</span><span class="game-wordmark" aria-label="脚踩神州，拳打一嗨"><span>脚踩神州</span><span>拳打一嗨</span></span><span class="opening-edition">RENTAL EMPIRE</span></div><span class="opening-status">创业序章 <i></i></span></header><div class="opening-layout"><aside class="opening-story"><div class="story-kicker">A MILLION TO BEGIN. A NATION TO EXPLORE.</div><h1>脚踩神州，<br>拳打一嗨。</h1><p>经营你的第一间租车行，<br>让每一辆车，驶向下一次可能。</p><div class="route-art" aria-hidden="true"><div class="route-ring ring-one"></div><div class="route-ring ring-two"></div><div class="route-line"></div><span class="route-origin"></span><span class="route-label">${c?esc(c.name):'你的第一站'}</span><span class="route-end">全国网络 ↗</span></div><div class="opening-capital"><span>你的创业启动金</span><strong>100<span> 万元</span></strong><small>一笔本金，一份属于你的事业。</small></div><div class="story-foot">393 个市场 <b>·</b> 77 个品牌 <b>·</b> 无限种经营可能</div></aside><section class="opening-workspace" aria-label="开业引导"><ol class="opening-steps">${['选择城市','命名车行','准备开业'].map((label,i)=>`<li class="${i===startStep?'current':i<startStep?'complete':''}" ${i===startStep?'aria-current="step"':''}><span>${i<startStep?'✓':'0'+(i+1)}</span>${label}</li>`).join('')}</ol><div class="opening-content" key="${startStep}"><div class="opening-heading"><div class="opening-chapter">CHAPTER 0${startStep+1}<span>启动金 100 万元</span></div><h2 tabindex="-1">${copy[0]}<br>${copy[1]}</h2><p>${copy[2]}</p></div>${startStep===0?`<div class="opening-filters"><select aria-label="开局省份" onchange="startProvince=this.value;startSearch='';startPage=0;$('#startSearch').value='';renderStartCities()"><option value="">全国 · 推荐起点</option>${G.PROVINCES.map(p=>`<option value="${p.id}" ${p.id===startProvince?'selected':''}>${p.name}</option>`).join('')}</select><input id="startSearch" aria-label="搜索开局城市" placeholder="搜索城市，如大理" value="${esc(startSearch)}" oninput="startSearch=this.value.trim();startPage=0;renderStartCities()"></div><div id="startCities">${startCityOptions()}</div>`:startStep===1?`<div class="name-studio"><label for="startName">你的店铺 / 公司名称</label><input id="startName" maxlength="20" autocomplete="organization" placeholder="例如：山海租车" value="${esc(startName)}" oninput="startName=this.value;updateStartSummary()" onkeydown="if(event.key==='Enter')nextStartStep()"><div class="name-input-note"><span>好名字，让人记住下一段旅程。</span><span id="nameCount">${startName.length}/20</span></div><div class="store-sign"><span>即将点亮的第一块招牌</span><strong id="namePreview">${esc(startName.trim()||'你的租车行')}</strong><div>${esc(c.name)} · 首家门店 <i>即将开业</i></div></div><p class="opening-guide">先把第一间店做好。车辆采购、租金与促销，都由你决定。</p></div>`:openingBrief(c)}</div><footer class="opening-actions"><div class="opening-selection" id="startSummary" aria-live="polite"></div><div class="opening-buttons">${startStep>0?'<button class="opening-back" onclick="moveStartStep(-1)">上一步</button>':reset&&s.setupConfirmed?'<button class="opening-back" onclick="render()">返回事业</button>':''}<button id="startButton" class="primary" onclick="nextStartStep()"></button></div></footer><div class="opening-disclaimer">${reset?'开业后将保留原事业备份。 ':''}车辆、市场与经营数值均为游戏模拟。</div></section></div></main>`;updateStartSummary()}
function filteredStartCities(){if(!startProvince&&!startSearch)return ['510100','330100','320500','532900','460200','420100'].map(id=>G.city(id)).filter(Boolean);return G.CITIES.filter(c=>startSearch?(c.name.includes(startSearch)||c.fullName.includes(startSearch)):c.province===startProvince)}
function startCityOptions(){const size=matchMedia('(max-width:600px) and (max-height:740px)').matches?4:6,cs=filteredStartCities(),pages=Math.max(1,Math.ceil(cs.length/size));startPage=Math.min(startPage,pages-1);return `<div class="opening-city-grid">${cs.slice(startPage*size,startPage*size+size).map(c=>`<button class="opening-city ${c.id===startCity?'selected':''}" aria-pressed="${c.id===startCity}" onclick="startCity='${c.id}';renderStartCities()"><div><strong>${c.name}</strong><span class="city-check">${c.id===startCity?'✓':'↗'}</span></div><span>${c.tag}<small>开店 ${wan(c.setup)}</small></span></button>`).join('')||'<div class="opening-empty">没有找到这座城市<br><small>试试城市全名，或选择省份。</small></div>'}</div><div class="opening-pagination"><span>${!startProvince&&!startSearch?'推荐起点 · 全国 '+G.CITIES.length+' 城可选':'找到 '+cs.length+' 座城市'}${pages>1?' · '+(startPage+1)+'/'+pages:''}</span><div><button aria-label="上一页城市" ${!startPage?'disabled':''} onclick="startPage--;renderStartCities()">←</button><button aria-label="下一页城市" ${startPage+1>=pages?'disabled':''} onclick="startPage++;renderStartCities()">→</button></div></div>`}
function renderStartCities(){$('#startCities').innerHTML=startCityOptions();const route=$('.route-label');if(route)route.textContent=G.city(startCity)?.name||'你的第一站';updateStartSummary()}
function openingBrief(c){const example=G.create(c.id,START_CAPITAL,startName);return `<div class="opening-brief"><div class="brief-identity"><span class="brief-mark">${esc(startName.trim().slice(0,1))}</span><div><h3>${esc(G.cleanName(startName))}</h3><p>${c.fullName} · 经理 ${example.branches[0].manager.name}</p></div><span class="brief-ready">已就绪</span></div><div class="opening-ledger"><div><span>创业启动金</span><strong>¥1,000,000</strong></div><div><span>起步车队 · 3 辆<small>比亚迪 秦 PLUS DM-i × 2 · 海豚 × 1</small></span><b>− ¥282,000</b></div><div><span>首店筹备</span><b>− ${money(c.setup)}</b></div><div class="ledger-total"><span>开业后可用现金</span><strong>${money(example.cash)}</strong></div></div><p class="opening-guide"><span>你的第一步</span>开业后，先看本地需求，再为车队定价。赚下第一笔租金，去往下一座城。</p></div>`}
function updateStartSummary(){const c=G.city(startCity),button=$('#startButton');if(startStep===0){button.disabled=!c;button.textContent='下一步，起个名字 →';$('#startSummary').innerHTML=c?`<span>第一站已选</span><strong>${esc(c.name)}<small> · ${G.province(c.province).name}</small></strong>`:'<span>第一站，由你决定</span><strong>请选择一座出发城市</strong>'}else if(startStep===1){button.disabled=!G.cleanName(startName.trim())||!startName.trim();button.textContent='查看开业计划 →';$('#startSummary').innerHTML=`<span>你的第一间店</span><strong>${esc(c.name)}<small> · 启动金 100 万元</small></strong>`;$('#nameCount').textContent=startName.length+'/20';$('#namePreview').textContent=startName.trim()||'你的租车行'}else{button.disabled=opening;button.textContent='正式开业 →';$('#startSummary').innerHTML='<span>一切准备就绪</span><strong>下一站，你来决定。</strong>'}}
function moveStartStep(delta){startStep=Math.max(0,Math.min(2,startStep+delta));onboarding(startReset);$('.opening-heading h2').focus({preventScroll:true})}
function nextStartStep(){if(startStep===0&&!G.city(startCity))return;if(startStep===1&&!startName.trim())return toast('先给你的租车行起个名字');if(startStep<2)return moveStartStep(1);startGame()}
function startGame(){if(opening||startStep!==2||!startName.trim()||!G.city(startCity))return;opening=true;if(s.started&&!DEMO){try{localStorage.setItem(KEY+'-before-new-start',JSON.stringify(s))}catch{}}s=G.create(startCity,START_CAPITAL,startName.trim());s.setupConfirmed=true;purchaseCity=startCity;scope='city';scopeId=startCity;marketProvince=G.city(startCity).province;tab='overview';selectedVehicles.clear();render();window.scrollTo({top:0,behavior:'instant'});toast('开业大吉！你的 100 万元创业计划，今天启程。');opening=false;startStep=0}
function restorePrevious(){let raw;try{raw=localStorage.getItem(KEY+'-before-new-start')}catch{}if(!raw)return toast('还没有上一次事业备份');try{let previous=G.migrate(JSON.parse(raw));if(!validSave(previous))return toast('备份无法读取');modal(`<h2 class="modal-title">恢复上一次事业</h2><p>${esc(previous.name)} · ${date(previous.month)} · ${previous.fleet.length} 辆车<br>恢复后会将当前事业互换保存为备份。</p><div class="modal-foot"><button onclick="closeModal()">取消</button><button class="primary" onclick="confirmRestore()">确认恢复</button></div>`)}catch{toast('备份无法读取')}}
function confirmRestore(){let previous=G.migrate(JSON.parse(localStorage.getItem(KEY+'-before-new-start')));localStorage.setItem(KEY+'-before-new-start',JSON.stringify(s));s=previous;s.setupConfirmed=true;purchaseCity=s.branches[0].city;scope='city';scopeId=purchaseCity;closeModal();render();toast('上一次事业已恢复')}
function mobileMore(){modal(`<h2 class="modal-title">经营工作台</h2><div class="more-menu"><button onclick="closeModal();strategyDialog(s.branches[0].city)">竞争策略 →</button>${['branches','events','finance','reports'].map(id=>`<button onclick="closeModal();navigate('${id}')"><span>${glyphs[id]}</span>${titles[id][0]} →</button>`).join('')}<button onclick="closeModal();saveMenu()">公司名称与存档 →</button><button onclick="closeModal();help()">玩法与数据说明 →</button></div><div class="modal-foot"><button onclick="closeModal()">返回</button></div>`)}
render();if(migrated&&s.setupConfirmed)modal(`<h2 class="modal-title">你的事业已升级为全国版。</h2><p>已保留旧版资金、车队、门店与贷款，新增全国城市库、经理、经营日历和更大的车型库。旧存档仍保留在浏览器中。</p><p>现在可在「公司与存档」修改公司名称，或选择「重新创业」，从任意城市开始。</p><div class="modal-foot"><button class="primary" onclick="closeModal()">继续经营</button></div>`);

let layoutTimer;window.addEventListener('resize',()=>{clearTimeout(layoutTimer);layoutTimer=setTimeout(()=>{if(s.started&&s.setupConfirmed&&!$('#modal').open&&$('.shell')&&['overview','fleet'].includes(tab))render();else if($('#catalogBody'))renderCatalog();else if($('#startCities'))renderStartCities()},120)});

</script></body></html>
