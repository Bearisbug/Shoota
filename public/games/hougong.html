  rows.push(['皇后',S.flags.hhDown?'禁足景仁宫':(hhL||'——')]);
  rows.push(['华妃',hfActive(S)?({party:'你是她的人',neutral:'中立',enemy:'结怨'}[a.hf]||'——'):(S.flags.hfDead||S.t>=15?'殁于冷宫':'冷宫')]);
  const fs={null:'同住偏殿',you:'与你交好',hh:'已投景仁宫',double:'两边传话',cold:'冷宫',dead:'已殁'}[a.fang.side];
  rows.push(['方氏',(['cold','dead'].includes(a.fang.side)?'':fangTitle()+' · ')+fs]);
  if(S.t>=12)rows.push(['祺贵人',S.flags.qiDown?'失势':({feud:'结仇',peace:'面和'}[a.qi]||'——')]);
  rows.push(['云苓',{new:'初到',trusted:'信任',watched:'提防',sworn:'死忠',torn:'心事重重',coerced:'如常',swapped:'已换作秋纹',dead:'已故',out:'已出宫',stay:'留宫做姑姑'}[a.yl]]);
  rows.push(['家中',{ok:'平安',rising:'得势',resigned:'致仕回乡',fallen:'获罪流放'}[a.fam]+(S.flags.broDead?' · 兄长战殁':'')]);
  if(a.prince)rows.push(['果郡王',{proper:'守礼',cool:'疏远',secret:'私交',cut:'已出京'}[a.prince]]);
  return`<dl class="court">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}
function arcsHTML(){
  const items=ARCS.map(a=>{const d=a.ids.filter(id=>S.at[id]!=null).length;return d?`<li><span>${a.name}</span><span>${cnNum(d)} / ${cnNum(a.ids.length)}</span></li>`:'';}).join('');
  return items?`<ul class="arcs">${items}</ul>`:'<p class="muted" style="margin:0;font-size:.8rem">尚未展开</p>';
}
function dossier(dead){
  const kids=S.kids.length?S.kids.map(k=>(k.sex==='子'?'阿哥':'公主')+(k.dead?'（殇）':'')).join('、'):'无';
  const o=ORIGINS[S.origin];
  const f=S.arc.fang;
  return`<aside class="dossier">
    <div class="portrait${dead?' dead':''}">${portrait(S,dead)}</div>
    <div class="idblock"><h3>${esc(title())}</h3><p>${palace()} · 年${cnNum(age())}<br>${o.sub}${o.name.includes('旗')?'':o.name} · 性情${TRAITS[S.trait].name}</p></div>
    <div class="stats-wrap">
      <div class="sect"><h4>指标</h4>${statRow('fav')}${statRow('pres')}${statRow('charm')}${statRow('wit')}${statRow('hp',S.st.hp<30)}${statRow('loyal')}${statRow('sus',true)}
        <dl class="kv" style="margin-top:6px"><dt>银两</dt><dd>${S.st.silver} 两</dd><dt>年例</dt><dd>${ALLOW[S.rank]} 两</dd><dt>侍寝</dt><dd>${S.nights} 回</dd><dt>子嗣</dt><dd>${kids}${S.preg?' · 有孕':''}</dd>${S.ban?'<dt>禁足</dt><dd>'+S.ban+' 季</dd>':''}</dl></div>
      <div class="sect"><h4>人情</h4>${relRow('皇后',S.rel.hh,S.flags.hhDown?'禁足景仁宫':null)}${relRow('华妃',S.rel.hf,hfActive(S)?null:'已失势')}${relRow('太后',S.rel.th,thAlive(S)?null:'已薨')}${relRow('方氏',f.rel,['dead','cold'].includes(f.side)?(f.side==='dead'?'已殁':'冷宫'):null)}</div>
    </div>
    <div class="sect"><h4>六宫</h4>${courtHTML()}</div>
    <div class="sect"><h4>剧情线</h4>${arcsHTML()}</div>
  </aside>`;
}
function logHTML(){return`<section class="log"><h4>起居注</h4><ol>${S.log.slice(0,40).map(l=>`<li><span>${l.d}</span>${fill(l.text)}</li>`).join('')||'<li><span></span>尚无记载。</li>'}</ol></section>`;}
function seasonHead(){
  const dots=[0,1,2].map(i=>`<i class="${i<S.ap?'on':''}"></i>`).join('');
  const busy=S.queue.length||S.report||S.pending;
  return`<div class="season"><h2>${dateStr()}</h2><span class="sub">第${cnNum(S.t+1)}季 / 共五十一季${S.queue.length&&!S.pending&&!S.report?` · 本季尚有 ${cnNum(S.queue.length)} 件事`:''}</span>${!busy?`<span class="ap">行动 ${dots}</span>`:''}</div>`;
}

function render(){
  if(!S){renderStart();return;}
  view='game';navHome.hidden=false;
  while(!S.pending&&!S.report&&S.queue.length){const e=EV[S.queue[0]];if(e.valid&&!e.valid(S)){S.queue.shift();continue;}break;}
  if(!S.pending&&!S.report&&S.queue.length){const e=EV[S.queue[0]],key=S.queue[0]+':'+S.t;if(S._preKey!==key){S._preKey=key;S._prechg=[];if(e.pre){const pd=e.pre(S);S._prechg=pd?apply(pd):[];}save();}}
  let body='';
  if(S.pending)body=outcomeHTML();
  else if(S.report)body=reportHTML();
  else if(S.queue.length)body=eventHTML();
  else body=actionsHTML();
  app.innerHTML=`<div class="game">${dossier(false)}<section class="main">${seasonHead()}${body}${logHTML()}</section></div>`;
  bind();
}
function echoHTML(e){
  if(!e.echo)return'';
  const ks=e.echo(S).filter(k=>S.memo[k]);
  if(!ks.length)return'';
  return`<div class="echo">${ks.map(k=>`<p><b>前因</b><span>${S.memo[k].d}：${fill(S.memo[k].t)}</span></p>`).join('')}</div>`;
}
function eventHTML(){
  const id=S.queue[0],e=EV[id];
  const showIntel=S.intel&&e.intel&&!S.flags.noIntel;
  const vis=e.choices.filter(c=>!c.show||c.show(S));
  const tag=(SCRIPT[S.t]||[]).includes(id)?'大事':ARCEV.includes(id)?(ARCS.find(a=>a.ids.includes(id))||{name:''}).name+'线':'';
  return`<article class="card"><div class="meta"><span>${fill(e.place)}</span>${tag?`<span>${tag}</span>`:''}</div><h3>${tx(e.title)}</h3>
  ${echoHTML(e)}
  ${showIntel?`<p class="intel"><b>风声</b><span>${fill(e.intel)}</span></p>`:''}
  <div class="text">${paras(tx(e.text))}</div>${chipsHTML(S._prechg)}
  <ol class="choices">${vis.map((c,i)=>{
    const okNeed=!c.need||c.need(S), okCost=!c.cost||S.st.silver>=c.cost;
    const tags=[];
    if(c.need)tags.push(`<span class="tg${okNeed?'':' no'}">需${c.needText}</span>`);
    if(c.cost)tags.push(`<span class="tg${okCost?'':' no'}">耗银 ${c.cost} 两</span>`);
    return`<li><button class="ch" type="button" data-c="${i}" ${okNeed&&okCost?'':'disabled'}><span class="mk">${MK[i]||'·'}</span><span>${fill(c.t)}</span>${tags.length?`<span class="tags">${tags.join('')}</span>`:''}</button></li>`;}).join('')}</ol></article>`;
}
function outcomeHTML(){
  const p=S.pending;
  return`<article class="card outcome"><div class="meta"><span>${fill(p.place)}</span></div><h3>${p.title}</h3>
  ${p.ok===true?'<p class="verdict ok">得手</p>':p.ok===false?'<p class="verdict bad">失手</p>':''}
  <div class="text">${paras(p.text)}</div>${chipsHTML(p.chg)}
  ${p.note?`<p class="note"><span class="an">按</span><span>${fill(p.note)}</span></p>`:''}
  <button class="primary" id="bCont" type="button">继续</button></article>`;
}
function reportHTML(){
  const r=S.report;
  return`<article class="card outcome"><div class="meta"><span>季终 · ${r.date}</span></div><h3>季终</h3>
  <div class="text">${r.lines.map(l=>`<p>${fill(l)}</p>`).join('')}</div>${chipsHTML(r.chg)}
  ${r.news?`<p class="news"><b>宫中动静</b>${r.news}</p>`:''}
  <button class="primary" id="bNext" type="button">进入${dateStr()}</button></article>`;
}
function actionsHTML(){
  const last=S.last?`<div class="lastres"><p><b>${S.last.name}</b>　${fill(S.last.text)}</p>${chipsHTML(S.last.chg)}</div>`:'';
  const acts=ACTS.filter(a=>!a.show||a.show(S));
  return`<article class="card">${last}
  <p class="muted" style="margin:0 0 6px;font-size:.86rem">${S.ap?`本季还可做 ${cnNum(S.ap)} 件事。${S.ban?'禁足中，只能做宫内的事。':''}`:'本季的事都做完了。'}</p>
  <div class="acts">${acts.map(a=>{
    const okBan=!S.ban||a.ban, okNeed=!a.need||a.need(S), okCost=!a.cost||S.st.silver>=a.cost, can=S.ap>0&&okBan&&okNeed&&okCost;
    const tags=[`<span class="tg">${a.hint}</span>`];
    if(a.cost)tags.push(`<span class="tg${okCost?'':' no'}">${a.cost} 两</span>`);
    if(a.need&&!okNeed)tags.push(`<span class="tg no">需${a.needText}</span>`);
    if(!okBan)tags.push('<span class="tg no">禁足</span>');
    return`<button class="act" type="button" data-a="${a.id}" ${can?'':'disabled'}><b>${a.name}</b><small>${fill(a.desc)}</small><span class="tags">${tags.join('')}</span></button>`;}).join('')}</div>
  <div class="endbar"><span>季末结算：侍寝、份例、圣宠消退${S.preg?'、胎象':''}${S.q===3?'、家中捎银':''}。</span><button class="primary" id="bEnd" type="button">结束本季</button></div></article>`;
}
function bind(){
  app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>choose(+b.dataset.c));
  app.querySelectorAll('.act').forEach(b=>b.onclick=()=>doAct(b.dataset.a));
  const c=document.getElementById('bCont');if(c)c.onclick=cont;
  const n=document.getElementById('bNext');if(n)n.onclick=()=>{S.report=null;save();render();toTop();};
  const e=document.getElementById('bEnd');if(e)e.onclick=()=>{endSeason();save();render();toTop();};
}
function toTop(){try{window.scrollTo({top:0,behavior:'auto'});}catch(e){}}

function choose(i){
  const id=S.queue[0],e=EV[id];
  const c=e.choices.filter(x=>!x.show||x.show(S))[i];
  if(!c)return;
  if(c.need&&!c.need(S))return;
  if(c.cost&&S.st.silver<c.cost)return;
  const chg=[];
  if(c.cost)chg.push(...apply({silver:-c.cost}));
  const useIntel=S.intel&&e.intel&&!S.flags.noIntel;
  const bonus=useIntel?HARD.intel:0;
  if(useIntel)S.intel=false;
  const ok=c.chance?roll(clamp(c.chance(S)*HARD.chance+bonus,.05,.88)):undefined;
  S.at[id]=S.t;
  const r=c.run(S,ok)||{};
  if(r.death){die(r.death);return;}
  if(r.chg)chg.push(...r.chg);
  chg.push(...apply(r.d));
  let text=r.text||'';
  if(r.promote){const l=promote(r.promote);if(l)text+='\n'+l;}
  if(r.after)r.after(S);
  if(e.post)e.post(S);
  S.pending={title:tx(e.title),place:e.place,text,ok:r.ok,chg,note:r.note};
  log(`${tx(e.title)}：${stripText(text)}`);
  save();render();toTop();
}
function stripText(t){const s=String(t).split('\n')[0];return s.length>46?s.slice(0,46)+'…':s;}
function cont(){
  S.pending=null;S.queue.shift();S._prechg=[];
  const d=checkVitals();if(d){die(d);return;}
  save();render();toTop();
}
function doAct(id){
  const a=ACTS.find(x=>x.id===id);if(!a||S.ap<=0)return;
  if(a.need&&!a.need(S))return;if(a.cost&&S.st.silver<a.cost)return;if(S.ban&&!a.ban)return;if(a.show&&!a.show(S))return;
  S.ap--;
  const chg=[];if(a.cost)chg.push(...apply({silver:-a.cost}));
  const ok=a.chance?roll(clamp(a.chance(S)*HARD.chance,.05,.88)):undefined;
  const r=a.run(S,ok);
  chg.push(...apply(r.d));
  S.last={name:a.name,text:r.text,chg,ok};
  log(`${a.name}：${r.text}`);
  const d=checkVitals();if(d){die(d);return;}
  save();render();
}

function die(id){
  const d=ENDS[id];
  if(!seen.includes(id)){seen.push(id);store('hgssb3_seen',seen);}
  S.dead=true;store('hgssb3_save',null);
  const w=d.when?d.when(S):{era:'雍正',y:S.y,season:SEASONS[S.q]};
  const ag=w.era==='雍正'?15+w.y:28+w.y;
  const who=d.kind==='good'?`${taifei(S)}　${S.name}氏`:(S.flags.in&&S.rank>=3?`${title()}　${S.name}氏`:title());
  const status=d.status?(typeof d.status==='function'?d.status(ag):d.status):(d.kind==='good'?`无疾而终，年${cnNum(ag)}`:`殁，年${cnNum(ag)}`);
  let grade='',epi='';
  if(d.kind==='good'){
    const lk=live(S);const sc=S.rank*12+lk.length*10+S.st.pres/4+S.st.fav/8+(lk.some(k=>k.sex==='子')?10:0)+(S.flags.hhDown?8:0);
    grade=sc>=95?'甲上':sc>=75?'甲':sc>=55?'乙':'丙';
    const L=epilogue(S);if(L.length)epi=`<h4 style="margin:1.2em 0 .4em;font-size:.8rem;letter-spacing:.3em;color:var(--muted);font-weight:400">身后事</h4><div class="text">${L.map(l=>`<p>${fill(l)}</p>`).join('')}</div>`;
  }
  view='dead';navHome.hidden=false;
  app.innerHTML=`<div class="game">${dossier(d.kind!=='good')}<section class="main"><article class="archive ${d.kind}">
    <div class="seal" aria-hidden="true">${d.seal||'殁'}</div>
    <p class="arc-head">内务府 · 敬事房档册</p>
    <h3>${d.name}</h3>
    <p class="arc-line">${yearCN(w.era,w.y)}${w.season}　${esc(who)}　${status}</p>
    ${grade?`<p>一生评定：<span class="grade">${grade}</span>　侍寝 ${S.nights} 回 · 子嗣 ${live(S).length} · 威望 ${S.st.pres}</p>`:''}
    <div class="text">${paras(tx(d.text))}</div>${epi}
    <p class="note"><span class="an">按</span><span>${fill(d.note)}</span></p>
    <p class="muted" style="font-size:.84rem;margin:0">生死簿已录 ${seen.length} / ${ORDER.length} 种结局</p>
    <div class="btns"><button class="primary" id="bAgain" type="button">重新入宫</button><button id="bBook" type="button">翻看生死簿</button></div>
  </article>${logHTML()}</section></div>`;
  document.getElementById('bAgain').onclick=renderStart;
  document.getElementById('bBook').onclick=renderBook;
  toTop();
}

function renderBook(){
  navHome.hidden=false;const back=view==='game'&&S&&!S.dead;view='book';
  const kd={death:['死','kd-death'],out:['出宫',''],good:['善终','kd-good']};
  app.innerHTML=`<section><p class="eyebrow">共 ${ORDER.length} 种结局 · 已录 ${seen.length} 种</p><h2 style="font-size:2.4rem;margin:.1em 0 .2em">生死簿</h2>
  <p class="muted" style="max-width:40em;margin:0">有的死法藏在大事里，有的藏在一条剧情线的第四段，要你在第一段先种下因。</p>
  <ul class="book-list">${ORDER.map(id=>{const d=ENDS[id],got=seen.includes(id),k=kd[d.kind];return`<li class="${got?'got':''}"><span class="src"><span>${d.src}</span><span class="${k[1]}">${got?k[0]:''}</span></span><span class="nm">${got?d.name:'？？？'}</span></li>`;}).join('')}</ul>
  <div class="btns"><button class="primary" id="bBack" type="button">${back?'回到宫中':'回到卷首'}</button></div></section>`;
  document.getElementById('bBack').onclick=()=>back?render():renderStart();
  toTop();
}

function renderStart(){
  view='start';navHome.hidden=true;
  const sv=load('hgssb3_save',null);
  const canResume=sv&&sv.v===3&&!sv.dead&&sv.name;
  let pick={name:canResume?sv.name:'陆',origin:'han',trait:'cai'};
  const preview=()=>{const tmp=newState(pick.name||'某',pick.origin,pick.trait);tmp.flags.in=1;return portrait(tmp,false);};
  app.innerHTML=`<section class="create">
    <div>
      <p class="eyebrow">雍正元年 · 选秀</p>
      <h1>后宫生死簿</h1>
      <p>新帝登基，广选秀女。你年方十六，今日便要入殿候选。</p>
      <p>自雍正元年至十三年，共五十一季。同住的方氏、身边的云苓、翊坤宫、景仁宫、你的家人、一位不该多看的王爷、一个后来入宫的新人，还有你将来的孩子——八条剧情线各自往前走，你今天怎么待一个人，三年后她就怎么待你。</p>
      <p>每季可做三件事，季末敬事房翻牌、内务府发份例。数值决定你能选什么，也暗中决定成败——没有人会告诉你胜算几何。有些选择，无论数值多高都是死路。</p>
      <div class="step"><label for="nameIn">姓氏</label><div class="namerow"><input id="nameIn" maxlength="2" value="${esc(pick.name)}" autocomplete="off"><span>氏</span></div><p class="err" id="nameErr" hidden>请填一到两个汉字。</p></div>
      <div class="step"><span class="lbl">出身</span><div class="pick" id="pOrigin">${Object.entries(ORIGINS).map(([k,o])=>`<button type="button" data-k="${k}" aria-pressed="${k===pick.origin}"><b>${o.name}</b><small>${o.sub} · 初封${RANKS[o.rank]}<br>${o.desc}</small></button>`).join('')}</div>
        <p class="rule">清制，选秀只选八旗之女，汉人民女不在其列；包衣三旗之女另由内务府选为宫女。</p></div>
      <div class="step"><span class="lbl">性情</span><div class="pick" id="pTrait">${Object.entries(TRAITS).map(([k,t])=>`<button type="button" data-k="${k}" aria-pressed="${k===pick.trait}"><b>${t.name}</b><small>${t.desc}</small></button>`).join('')}</div></div>
      <div class="btns"><button class="primary" id="btnStart" type="button">入宫</button>${canResume?`<button id="btnResume" type="button">接着上回（${yearCN('雍正',sv.y)}${SEASONS[sv.q]}）</button>`:''}</div>
      <p class="muted" style="font-size:.84rem;margin-top:14px">生死簿已录 ${seen.length} / ${ORDER.length} 种结局</p>
    </div>
    <aside><div class="portrait" id="pv">${preview()}</div><p class="muted" style="font-size:.8rem;margin:0">画像随位分而变：发间簪花、点翠、流苏、凤钿，袍色依清制由湖色、藕荷而至香色、金黄、明黄。</p></aside>
  </section>`;
  const inp=document.getElementById('nameIn'),pv=document.getElementById('pv');
  inp.addEventListener('input',()=>{pick.name=inp.value.trim();});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')start();});
  const bindPick=(id,key)=>document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{pick[key]=b.dataset.k;document.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute('aria-pressed',x===b));pv.innerHTML=preview();});
  bindPick('pOrigin','origin');bindPick('pTrait','trait');
  function start(){const v=inp.value.trim();if(!/^[一-鿿]{1,2}$/.test(v)){document.getElementById('nameErr').hidden=false;inp.focus();return;}
    S=newState(v,pick.origin,pick.trait);S.queue=['xuanxiu','yl_arrive'];log(`${v}氏，${ORIGINS[pick.origin].sub}，年十六，应选入宫。`);save();render();toTop();}
  document.getElementById('btnStart').onclick=start;
  if(canResume)document.getElementById('btnResume').onclick=()=>{S=sv;render();toTop();};
  toTop();
}
navHome.onclick=renderStart;
navBook.onclick=renderBook;
renderStart();
</script>
</body>
</html>
