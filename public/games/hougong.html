/* —— 仪式：晋位 —— */
function ceremony(){
  const c=S.cere;S.cere=null;save();
  if(c.kind!=='promo')return;
  const o=document.createElement('div');o.className='cere';o.setAttribute('role','dialog');o.setAttribute('aria-label','晋位');
  o.innerHTML=`<div class="rays"></div><div class="cere-box">${rankBadge(c.rank,120,'big')}<p class="cere-k">圣旨到</p><h2>晋 ${RANKS[c.rank]}</h2>${c.rank>=3&&c.hao?`<p class="cere-s">赐号「${c.hao}」</p>`:''}<button class="btn gold" type="button">谢主隆恩</button></div>`;
  document.body.appendChild(o);
  const b=o.querySelector('button');b.focus();
  b.onclick=()=>{o.classList.add('out');setTimeout(()=>o.remove(),FX?260:0);};
}

/* —— 页签 —— */
function tabHTML(t){
  if(t==='self')return selfHTML();
  if(t==='people')return peopleHTML();
  if(t==='court')return courtTabHTML();
  return bookHTML();
}
function selfHTML(){
  const o=ORIGINS[S.origin],g=goal();
  const kids=S.kids.length?S.kids.map(k=>`<span class="kid ${k.dead?'gone':''}">${icon('kid')}${k.sex==='子'?'阿哥':'公主'}${k.dead?'（殇）':''}</span>`).join(''):'<span class="muted">无</span>';
  const bars=[['fav'],['pres'],['charm'],['wit'],['hp'],['loyal'],['sus']].map(([k])=>{const v=S.st[k],bad=k==='sus'?v>=60:k==='hp'&&v<30;return`<div class="bar-row ${bad?'bad':''}">${icon(KEYICON[k])}<span class="bl">${KEYS[k]}</span><span class="bar"><i style="width:${v}%"></i></span><b class="num">${v}</b></div>`;}).join('');
  return`<section class="hero"><div class="arch">${portrait(S,false)}</div><div class="hero-t"><h2>${esc(title())}</h2><p>${palace()} · 年${cnNum(age())}</p><p>${o.sub}${o.name.includes('旗')?'':' · '+o.name} · 性情${TRAITS[S.trait].name}</p>
    <dl class="kv"><dt>${icon('silver')}银两</dt><dd class="num">${S.st.silver}</dd><dt>年例</dt><dd class="num">${ALLOW[S.rank]}</dd><dt>${icon('night')}侍寝</dt><dd class="num">${S.nights}</dd></dl></div></section>
    <section class="panel"><div class="ph"><h3>位分</h3><span class="muted">${g.done?'已至极位':'下一阶 · '+g.name}</span></div>
      <div class="ladder">${RANKS.map((n,i)=>`<span class="${i<S.rank?'past':i===S.rank?'cur':''}">${rankBadge(i,38,i>S.rank?'dim':'')}<small>${n}</small></span>`).join('')}</div></section>
    <section class="panel"><div class="ph"><h3>指标</h3></div>${bars}</section>
    <section class="panel"><div class="ph"><h3>子嗣 · 母家</h3></div><div class="row"><span class="k">子嗣</span><span class="v kids">${kids}${S.preg?'<span class="tg odds">有孕</span>':''}</span></div>
      <div class="row"><span class="k">家中</span><span class="v">${{ok:'平安',rising:'得势',resigned:'致仕回乡',fallen:'获罪流放'}[S.arc.fam]}${S.flags.broDead?' · 兄长战殁':''}</span></div>${S.ban?`<div class="row"><span class="k">禁足</span><span class="v">${S.ban} 季</span></div>`:''}</section>
    ${inventoryHTML()}<details class="panel rules"><summary>规矩 · 怎么玩</summary><p>每季先办完宫里的事，再用三盏灯做三件事。季末敬事房翻牌、内务府发份例，圣宠会慢慢消退。</p><p>卷一失误只会降罪。之后君疑满、康健尽或长期冷落会结束此生；朱笔勾销可无限重选，不花点数。后几卷一季跨半年或一年，剧情年月保留原时序。</p></details>`;
}
function peopleHTML(){
  const a=S.arc,f=a.fang;
  const card=(id,name,v,state,gone,extra)=>{
    const mood=gone?'dead':v==null?'calm':relMood(v);
    return`<div class="npc ${gone?'gone':''}">${avatar(id,mood,48)}<div class="nb"><div class="nt"><b>${name}</b><span class="tg ${v>=15?'odds':v<=-15?'no':''}">${gone||(v==null?state:relWord(v))}</span></div>
      ${v!=null&&!gone?`<span class="rb"><i class="${v<0?'neg':'pos'}" style="width:${Math.abs(v)/2}%"></i></span>`:''}<small>${extra||state||''}</small></div></div>`;};
  const hhL={party:'你是她的人',double:'假意投靠',refused:'未入其门',enemy:'敌对',leverage:'互相牵制'}[a.hh]||'';
  const hfL={party:'你是她的人',neutral:'中立',enemy:'结怨'}[a.hf]||'';
  const fs={null:'同住偏殿',you:'与你交好',hh:'已投景仁宫',double:'两边传话',cold:'冷宫',dead:'已殁'}[f.side];
  const yl={new:'初到',trusted:'信任',watched:'提防',sworn:'死忠',torn:'心事重重',coerced:'如常',swapped:'已换作秋纹',dead:'已故',out:'已出宫',stay:'留宫做姑姑'}[a.yl];
  let h=`<section class="panel"><div class="ph"><h3>上位</h3></div>
    <div class="npc">${avatar('emperor',moodMap().emperor,48)}<div class="nb"><div class="nt"><b>皇帝</b><span class="tg">${icon('night')}${S.nights} 回</span></div><span class="duo"><span>${icon('fav')}<b class="num">${S.st.fav}</b></span><span class="${S.st.sus>=60?'bad':''}">${icon('sus')}<b class="num">${S.st.sus}</b></span></span><small>${S.st.sus>=60?'近来看你的眼神淡了':S.st.fav>=40?'常翻你的牌子':'记得你这个人'}</small></div></div>
    ${card('hh','皇后',S.flags.hhDown?null:S.rel.hh,'',S.flags.hhDown?'禁足景仁宫':'',hhL)}
    ${card('hf','华妃',hfActive(S)?S.rel.hf:null,'',hfActive(S)?'':(S.v4.world.some(x=>x.id==='hfSaved')?'远居静养':S.flags.hfDead||S.t>=15?'殁于冷宫':'冷宫'),hfL)}
    ${card('th','太后',thAlive(S)?S.rel.th:null,'',thAlive(S)?'':'已薨','')}</section>
    <section class="panel"><div class="ph"><h3>身边 · 同辈</h3></div>
    ${card('fang',['cold','dead'].includes(f.side)?'方氏':fangTitle(),['cold','dead'].includes(f.side)?null:f.rel,'',f.side==='dead'?'已殁':f.side==='cold'?'冷宫':'',fs)}
    ${card('yl','云苓',null,yl,['dead','out'].includes(a.yl)?yl:'','掌事宫女')}
    ${S.t>=12?card('qi','祺贵人',null,S.flags.qiDown?'失势':({feud:'结仇',peace:'面和'}[a.qi]||'新人'),'',''):''}
    ${a.prince?card('prince','果郡王',null,{proper:'守礼',cool:'疏远',secret:'私交',cut:'已出京'}[a.prince],'',''):''}</section>`;
  return h+memoryHTML();
}
function courtTabHTML(){
  const arcs=ARCS.map(a=>{const d=a.ids.filter(id=>S.at[id]!=null).length;return`<div class="arc-row"><span>${a.name}</span><span class="bar"><i style="width:${d/a.ids.length*100}%"></i></span><b class="num">${d}/${a.ids.length}</b></div>`;}).join('');
  const news=Object.keys(NEWS).map(Number).filter(t=>t<=S.t).reverse().map(t=>`<li><span>${t<4?'元':cnNum(Math.floor(t/4)+1)}年</span>${newsText4(t)}</li>`).join('');
  return`<section class="panel"><div class="ph"><h3>剧情线</h3><span class="muted">走过的段落</span></div>${arcs}</section>
    ${worldHTML()}${news?`<section class="panel"><div class="ph"><h3>宫中动静</h3></div><ul class="newsl">${news}</ul></section>`:''}
    <section class="panel"><div class="ph"><h3>起居注</h3></div><ol class="logl">${S.log.slice(0,60).map(l=>`<li><span>${l.d}</span>${fill(l.text)}</li>`).join('')||'<li>尚无记载。</li>'}</ol></section>`;
}
function bookHTML(){
  const kd={death:['死','d'],out:['出宫','o'],good:['善终','g']};
  return`<section class="book-h"><h2>生死簿</h2><p>已录 <b class="num">${seen.length}</b> / ${ORDER.length}</p></section>
  <ul class="plaques">${ORDER.map(id=>{const d=ENDS[id],got=seen.includes(id),k=kd[d.kind];return`<li class="${got?'got '+k[1]:''}"><span class="pq-top"></span><span class="pq-n">${got?d.name:'？'}</span><small>${d.src}</small></li>`;}).join('')}</ul>
  <p class="muted center">有的死法藏在大事里，有的藏在一条剧情线的第四段。</p>`;
}

/* —— 交互 —— */
function choose(i){
  const id=S.queue[0],e=EV[id];
  const c=e.choices.filter(x=>!x.show||x.show(S))[i];
  if(!c||S.pending)return;
  if(c.need&&!c.need(S))return;
  if(c.cost&&S.st.silver<c.cost)return;
  checkpoint();const beforeRel={...S.rel,fang:S.arc.fang.rel};const chg=[];
  if(c.cost)chg.push(...apply({silver:-c.cost}));
  const useIntel=(S.intel||S.trait==='dream')&&e.intel&&!S.flags.noIntel;
  const bonus=useIntel?HARD.intel:0;
  if(useIntel)S.intel=false;
  const ok=c.chance?roll(clamp(c.chance(S)*HARD.chance+bonus,.05,.88)):undefined;
  S.at[id]=S.t;
  const r=c.run(S,ok)||{};
  if(r.death){if(softFailure(r.death,i)||counterDeath4(r.death))return;die(r.death);return;}
  if(r.chg)chg.push(...r.chg);
  chg.push(...apply(r.d));
  let text=r.text||'';
  if(r.promote){const l=promote(r.promote);if(l)text+='\n'+l;}
  if(r.after)r.after(S);
  if(e.post)e.post(S);
  S.pending={title:tx(e.title),place:e.place,text,ok:r.ok,chg,note:r.note,pick:i};
  recordMemory(beforeRel,tx(e.title));log(`${tx(e.title)}：${stripText(text)}`);
  save();render();
  floatChips(chg);
  const el=document.getElementById('result');if(el)el.scrollIntoView({block:'start',behavior:FX?'smooth':'auto'});
}
function stripText(t){const s=String(t).split('\n')[0];return s.length>46?s.slice(0,46)+'…':s;}
function cont(){
  S.pending=null;S.queue.shift();S._prechg=[];
  const d=checkVitals();if(d){if(softFailure(d,0))return;die(d);return;}
  save();render();toTop();
}
function doAct(id){
  const a=ACTS.find(x=>x.id===id);if(!a||S.ap<=0)return;
  if(a.need&&!a.need(S))return;if(a.cost&&S.st.silver<a.cost)return;if(S.ban&&!a.ban)return;if(a.show&&!a.show(S))return;
  checkpoint();const beforeRel={...S.rel,fang:S.arc.fang.rel};S.ap--;
  const chg=[];if(a.cost)chg.push(...apply({silver:-a.cost}));
  const ok=a.chance?roll(clamp(a.chance(S)*HARD.chance,.05,.88)):undefined;
  const r=a.run(S,ok);
  chg.push(...apply(r.d));
  S.last={name:a.name,text:r.text,chg,ok};
  recordMemory(beforeRel,a.name);log(`${a.name}：${r.text}`);
  const d=checkVitals();if(d){if(softFailure(d,0))return;die(d);return;}
  save();render();floatChips(chg);
}

/* —— 死局：档册 —— */
let deadInfo=null;
function die(id){
  const d=ENDS[id];
  const fresh=!seen.includes(id);
  if(fresh){seen.push(id);store('hgssb4_seen',seen);}
  S.dead=true;if(S.turn>=25)achievement4('hougong_survive');if(S.v4.world.length>=3)achievement4('hougong_rewrite');if((S.v4.home?.done.length||0)>=6)achievement4('hougong_home');store('hgssb4_save',null);
  const w=d.when?d.when(S):{era:'雍正',y:S.y,season:SEASONS[S.q]};
  const ag=w.era==='雍正'?15+w.y:28+w.y;
  const who=d.kind==='good'?`${taifei(S)}　${S.name}氏`:(S.flags.in&&S.rank>=3?`${title()}　${S.name}氏`:title());
  const status=d.status?(typeof d.status==='function'?d.status(ag):d.status):(d.kind==='good'?`无疾而终，年${cnNum(ag)}`:`殁，年${cnNum(ag)}`);
  let grade='',epi=[];
  if(d.kind==='good'){
    const lk=live(S);const sc=S.rank*12+lk.length*10+S.st.pres/4+S.st.fav/8+(lk.some(k=>k.sex==='子')?10:0)+(S.flags.hhDown?8:0);
    grade=sc>=95?'甲上':sc>=75?'甲':sc>=55?'乙':'丙';epi=epilogue(S);
  }
  deadInfo={id,d,w,who,status,grade,epi,fresh};
  tab='season';renderDeadTab();toTop();
}
function renderDeadTab(){
  const {d,w,who,status,grade,epi,fresh}=deadInfo;
  view='dead';
  let body;
  if(tab==='season')body=`<article class="archive ${d.kind}"><div class="seal-stamp" aria-hidden="true">${d.seal||'殁'}</div>
    <p class="arc-head">内务府 · 敬事房档册</p><h2>${d.name}</h2>
    <p class="arc-line">${yearCN(w.era,w.y)}${w.season}　${esc(who)}　${status}</p>
    ${grade?`<p class="grade-l">一生评定 <span class="grade">${grade}</span></p>`:''}
    <div class="story">${compactStory(tx(d.text))}</div>
    ${epi.length?`<details class="note" open><summary>身后事</summary>${epi.map(l=>`<p>${fill(l)}</p>`).join('')}</details>`:''}
    <details class="note"><summary>按 · 典故</summary><p>${fill(d.note)}</p></details>
    <div class="arc-foot"><span>生死簿 <b class="num">${seen.length}</b>/${ORDER.length}</span>${fresh?'<span class="tg gold">新录一条</span>':''}</div>
  </article>${load('hgssb4_checkpoint',null)?'<button class="btn seal wide" type="button" data-rewrite>朱笔勾销 · 重选这一步</button>':''}<button class="btn ghost wide" type="button" data-again>重新入宫</button>`;
  else body=tabHTML(tab);
  app.className='shell dead';
  app.innerHTML=`${topbar()}${statbar()}<main class="pg">${body}</main>${tabbar()}`;
  bind();
}

/* —— 卷首 —— */
const ORIGIN_FLAG={man:['#E9C23A','','#8A6414'],han:['#F4F1E8','','#8A6414'],low:['#3E6AA8','#C23A2E','#8A6414']};
function renderStart(){
  view='start';tab='season';lastSt=null;
  const sv=resumeV4();
  const canResume=sv&&sv.v===4&&!sv.dead&&sv.name;
  let pick={name:canResume?sv.name:'陆',origin:'han',trait:'dream'};
  const preview=()=>{const tmp=newState(pick.name||'某',pick.origin,pick.trait);tmp.flags.in=1;return portrait(tmp,false);};
  app.className='shell start';
  app.innerHTML=`<section class="gate"><div class="gate-roof"></div><p class="gate-k">雍正元年 · 选秀</p><h1>后宫生死簿</h1><p class="gate-s">新帝登基，广选秀女。你年方十六，今日入殿候选。</p></section>
    <main class="pg">
    <section class="panel"><div class="ph"><h3>姓氏</h3><span class="muted">生死簿 ${seen.length}/${ORDER.length}</span></div>
      <div class="namerow"><span class="arch sm" id="pv">${preview()}</span><label class="nm"><input id="nameIn" maxlength="2" value="${esc(pick.name)}" autocomplete="off" aria-describedby="nameErr" aria-label="姓氏"><span>氏</span></label></div>
      <p class="err" id="nameErr" hidden>请填一到两个汉字。</p></section>
    <section class="panel"><div class="ph"><h3>出身</h3></div><div class="pick" id="pOrigin">${Object.entries(ORIGINS).map(([k,o])=>`<button type="button" data-k="${k}" aria-pressed="${k===pick.origin}">${banner(...(ORIGIN_FLAG[k]||ORIGIN_FLAG.han))}<span><b>${o.name}</b><small>初封${RANKS[o.rank]} · ${o.sub}</small></span></button>`).join('')}</div>
      <details class="note"><summary>家世详情</summary>${Object.values(ORIGINS).map(o=>`<p><b>${o.name}</b>　${o.desc}</p>`).join('')}<p>清制，选秀只选八旗之女；包衣三旗之女另由内务府选为宫女。</p></details></section>
    <section class="panel"><div class="ph"><h3>随身所长</h3></div><div class="pick tri" id="pTrait">${GIFTS4.map(k=>[k,TRAITS[k]]).map(([k,t])=>`<button type="button" data-k="${k}" aria-pressed="${k===pick.trait}"><span><b>${t.name}</b><small>${t.desc}</small></span></button>`).join('')}</div></section>
    </main>
    <div class="dock start-dock">${canResume?`<button class="btn ghost" id="btnResume" type="button">续 · ${yearCN('雍正',sv.y)}${SEASONS[sv.q]}</button>`:''}<button class="btn seal" id="btnStart" type="button">入宫</button></div>
    <nav class="tabs solo"><button type="button" data-book>${icon('book')}<span>生死簿</span></button></nav>`;
  const inp=document.getElementById('nameIn'),pv=document.getElementById('pv');
  inp.addEventListener('input',()=>{pick.name=inp.value.trim();});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')start();});
  const bindPick=(id,key)=>document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{pick[key]=b.dataset.k;document.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute('aria-pressed',x===b));pv.innerHTML=preview();});
  bindPick('pOrigin','origin');bindPick('pTrait','trait');
  function start(){const v=inp.value.trim();if(!/^[一-鿿]{1,2}$/.test(v)){document.getElementById('nameErr').hidden=false;inp.focus();return;}
    store('hgssb4_checkpoint',null);S=newState(v,pick.origin,pick.trait);S.queue=[S.origin==='bao'?'v4_baoEntry':'xuanxiu','yl_arrive'];log(`${v}氏，${ORIGINS[pick.origin].sub}，年十六，应选入宫。`);save();tab='season';render();toTop();}
  document.getElementById('btnStart').onclick=start;
  if(canResume)document.getElementById('btnResume').onclick=()=>{S=sv;tab='season';render();toTop();if(S.v4.migrated){S.v4.migrated=false;log('旧版存档已迁入32季新篇，原档原样保留。');save();}};
  app.querySelector('[data-book]').onclick=renderBookAlone;
  toTop();
}
function renderBookAlone(){
  view='book';
  app.className='shell start';
  app.innerHTML=`<header class="tb"><div class="who"><b>生死簿</b><small>历代秀女的结局</small></div><button class="ib" id="bBack" type="button" aria-label="返回">${icon('door')}</button></header><main class="pg">${bookHTML()}</main>`;
  document.getElementById('bBack').onclick=renderStart;toTop();
}
function renderBook(){if(S&&!S.dead){tab='book';render();}else renderBookAlone();}
renderStart();
