<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1116"><meta name="description" content="从17岁直接加入CBA成年队，训练成长、争取出场、协商合同，冲击NBA。一个属于你的篮球生涯模拟游戏。"><title>篮球巨星 · 从 CBA 到 NBA</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" media="print" onload="this.media='all'"><style>
body{margin:0}img{max-width:100%}
/* Layout: FM-style shell — sticky club bar on top, left rail nav, dense data panels in main. Single dark theme by choice. */
:root {
  --bg: #0c1116; --rail: #0f161c; --panel: #141c23; --panel2: #1a242d; --line: #24303a; --line2: #2f3d49;
  --fg: #dde5ea; --muted: #8394a2; --dim: #566673;
  --accent: #ee7d2f; --accent-ink: #1b0e05; --accent-soft: rgba(238, 125, 47, .14);
  --good: #4fbf7f; --warn: #e2aa3d; --bad: #dc5a54; --elite: #4cc5e3;
  --gold: #f0c548;
  --t1: #d0564f; --t2: #db8b3a; --t3: #c8cbc0; --t4: #5cc07d; --t5: #4cc5e3;
  --f-display: 'Barlow Condensed', 'Noto Sans SC', 'Arial Narrow', sans-serif;
  --f-body: 'IBM Plex Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13.5px/1.45 var(--f-body); }
* { box-sizing: border-box; }
a { color: inherit; text-decoration: none; cursor: pointer; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

#app { display: grid; grid-template-columns: 188px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--rail); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; flex-wrap: wrap; }
.brand { font: 700 18px/1.05 var(--f-display); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.brand b { color: var(--accent); }
.club { display: flex; align-items: center; gap: 10px; min-width: 0; }
.crest { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--f-display); color: #fff; letter-spacing: .03em; flex: none; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .15); }
.club .nm { font: 600 17px/1.1 var(--f-display); letter-spacing: .02em; white-space: nowrap; }
.club .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
.when { color: var(--muted); font-size: 12px; margin-left: auto; text-align: right; white-space: nowrap; }
.when b { color: var(--fg); font: 600 15px/1.1 var(--f-display); letter-spacing: .03em; display: block; }
.go { display: flex; gap: 6px; flex-wrap: wrap; }
.prog { height: 3px; background: var(--accent); position: fixed; left: 0; top: env(safe-area-inset-top, 0px); z-index: 50; transition: width .1s; }

nav.rail { background: var(--rail); border-right: 1px solid var(--line); padding: 10px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
nav.rail .grp { font: 600 11px/1 var(--f-display); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; padding: 12px 10px 6px; }
nav.rail a { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: 4px; color: var(--muted); }
nav.rail a:hover { background: var(--panel2); color: var(--fg); }
nav.rail a.on { background: var(--accent-soft); color: var(--accent); box-shadow: inset 2px 0 0 var(--accent); }
.badge { background: var(--accent); color: var(--accent-ink); font: 600 11px/1 var(--f-mono); padding: 2px 6px; border-radius: 9px; }

main { overflow-y: auto; padding-block: 18px 40px; padding-inline: 20px; min-width: 0; }
.h1 { font: 700 26px/1.1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; margin: 0 0 4px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 16px; max-width: 70ch; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
.grid.g2 { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sp { flex: 1; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.card > h3 { margin: 0; padding: 10px 14px; font: 600 13px/1.2 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.card > h3 .sp { flex: 1; }
.card .bd { padding: 12px 14px; }
.card .bd.flush { padding: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.big { font: 700 34px/1 var(--f-display); letter-spacing: .01em; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .acc { color: var(--accent); }
.note { background: var(--panel2); border-left: 3px solid var(--accent); padding: 9px 12px; border-radius: 0 4px 4px 0; color: var(--muted); }
.note b { color: var(--fg); }

.btn { background: var(--panel2); border: 1px solid var(--line2); padding: 6px 12px; border-radius: 4px; cursor: pointer; white-space: nowrap; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.go .btn.pri { font: 600 15px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 9px 16px; }

.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font: 600 11px/1.2 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
table.t th.sortable { cursor: pointer; } table.t th.sortable:hover, table.t th.on { color: var(--accent); }
table.t td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t tr:hover td { background: rgba(255, 255, 255, .025); }
table.t .n, table.t th.n { text-align: right; }
table.t tr.me td { background: var(--accent-soft); }
table.t tr.cut td { border-bottom: 2px solid var(--line2); }
table.t .num { font-family: var(--f-mono); font-size: 12.5px; }
.pl { color: var(--fg); font-weight: 500; } .pl:hover { color: var(--accent); text-decoration: underline; }
.tm { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; } .tm i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; } .tm:hover { color: var(--accent); }
.pos i { font-style: normal; color: var(--dim); }
.ph .jersey small { display: block; font-size: 12px; opacity: .75; margin-top: 2px; }
.ph .jersey { flex-direction: column; }
.depths { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.depth { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; line-height: 1.9; font-size: 12.5px; }
.depth .dh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.depth .dh b { font: 700 18px/1 var(--f-display); color: var(--accent); }
.depth .dh span { font-size: 11.5px; }
.pos { font: 600 11px/1 var(--f-mono); color: var(--muted); background: var(--panel2); border: 1px solid var(--line2); padding: 2px 4px; border-radius: 3px; }

.ov { display: inline-block; min-width: 30px; text-align: center; font: 600 12.5px/1 var(--f-mono); padding: 4px 4px; border-radius: 3px; color: #0c1116; }
.ov.t1 { background: var(--t1); } .ov.t2 { background: var(--t2); } .ov.t3 { background: var(--t3); } .ov.t4 { background: var(--t4); } .ov.t5 { background: var(--t5); }
.av { font: 600 13px/1 var(--f-mono); }
.av.t1 { color: var(--t1); } .av.t2 { color: var(--t2); } .av.t3 { color: var(--t3); } .av.t4 { color: var(--t4); } .av.t5 { color: var(--t5); }
.stars { letter-spacing: 1px; white-space: nowrap; font-size: 13px; }
.stars .f { color: var(--accent); } .stars .e { color: var(--line2); }
.stars .h { background: linear-gradient(90deg, var(--accent) 50%, var(--line2) 50%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.chip { display: inline-block; font-size: 11.5px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
.chip.win { color: var(--good); border-color: rgba(79, 191, 127, .4); } .chip.rebuild { color: var(--elite); border-color: rgba(76, 197, 227, .4); }
.chip.acc { color: var(--accent); border-color: rgba(238, 125, 47, .45); }
.chip.st { color: var(--fg); border-color: var(--muted); }
.W { color: var(--good); font-weight: 600; } .L { color: var(--bad); font-weight: 600; }
.meter { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.meter > i { display: block; height: 100%; background: var(--accent); }
.meter.g > i { background: var(--good); } .meter.w > i { background: var(--warn); } .meter.b > i { background: var(--bad); }
.know { display: inline-block; width: 60px; vertical-align: middle; }

/* attributes */
.attrs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 4px 18px; }
.attrs h4 { margin: 6px 0 4px; font: 600 11px/1 var(--f-display); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; grid-column: auto; }
.ar { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px dotted var(--line); gap: 8px; }
.ar span:first-child { color: var(--muted); }

/* player header */
.ph { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.ph .jersey { width: 56px; height: 56px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font: 700 22px/1 var(--f-display); color: #fff; flex: none; }
.ph .nm { font: 700 24px/1.05 var(--f-display); letter-spacing: .02em; }
.ph .meta { color: var(--muted); font-size: 12.5px; }
.ph .rt { margin-left: auto; display: flex; gap: 18px; }
.ph .rt div { text-align: center; } .ph .rt small { display: block; color: var(--dim); font: 600 10.5px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 5px; }

/* inputs */
input[type=number], select, textarea, input[type=text] { background: var(--bg); color: var(--fg); border: 1px solid var(--line2); border-radius: 4px; padding: 5px 7px; font: inherit; }
input[type=number] { width: 74px; font-family: var(--f-mono); }
input[type=range] { accent-color: var(--accent); width: 100%; }
textarea { width: 100%; min-height: 110px; font: 11.5px/1.4 var(--f-mono); }
.slider { display: grid; grid-template-columns: 110px minmax(0, 1fr) 54px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.slider small { grid-column: 1 / -1; color: var(--dim); margin-top: -4px; }

/* modal & toast */
[hidden] { display: none !important; }
#modal { position: fixed; inset: 0; background: rgba(4, 7, 10, .72); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
.mbox { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; width: min(920px, 100%); position: relative; padding: 18px 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
.mbox .x { position: absolute; right: 10px; top: 8px; background: none; border: 0; font-size: 22px; color: var(--muted); cursor: pointer; }
#toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 80; max-width: min(380px, calc(100% - 32px)); }
.toast { background: var(--panel2); border: 1px solid var(--line2); border-left: 3px solid var(--accent); padding: 9px 12px; border-radius: 4px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); animation: tin .2s ease-out; }
.toast.good { border-left-color: var(--good); } .toast.bad { border-left-color: var(--bad); }
@keyframes tin { from { transform: translateY(6px); opacity: 0; } }

// Aggregate recorded appearances only. A missing legacy field stays unknown;

ass="small muted" style="margin-top:10px">${E(trial.reason||(e.canWithdraw?'本周可先完成受邀试训，再于'+e.withdrawDeadline+'前决定是否撤回；撤回会消耗一次机会。':'撤回期限已过，本届报名已经生效。请完成受邀联合试训后再推进选秀；国家队任务冲突时归队后按邀请补测。'))}</p>`:''}<div class="scout-meter" style="margin-top:20px"><i style="left:${C.clamp((p.score-45)/45*100,0,99)}%"></i></div><div class="scout-ends"><span>继续成长</span><span>次轮竞争</span><span>首轮竞争</span><span>乐透级别</span></div>`}<div style="margin-top:14px">${link('查看签约机会','contracts')}</div></div></section><section class="card">${head((s.retired?'最后赛季':entered?e.draftYear+'年':'本届')+'模拟新秀榜',tag(entered?'当季名单 · 与个人选秀历史分开':'动态评估 · 非最终结果'))}<div class="table-wrap"><table><thead><tr><th>排名</th><th>球员</th><th>位置</th><th>年内年龄</th><th>来自</th><th>潜力</th><th>球探评分</th></tr></thead><tbody>${list.map((x,i)=>`<tr class="${x.me?'me':''}"><td class="num">${i+1}</td><td>${playerLink({...x,id:'prospect-'+x.id})} ${x.me?tag('你','lime'):''}</td><td class="muted">${x.pos}</td><td class="num">${x.age}</td><td class="muted small">${E(x.team)}</td><td class="num muted">${x.potential}</td><td>${ovBadge(x.score)}</td></tr>`).join('')}</tbody></table></div><div class="card-foot">模拟两轮共60个顺位。海外成长期间可保留签约权；本路线落选后通过自由球员签约继续冲击NBA。</div></section></div><aside class="stack"><section class="card">${head('联合试训报告',tag(s.retired?'已退役':cb?'已完成':entered?'选秀已结束':'受邀后参加'))}<div class="card-body">${cb?`<div class="kv"><span>综合评价</span><span class="num acc">${cb.grade}</span></div><div class="kv"><span>3/4场冲刺</span><span>${cb.sprint}秒</span></div><div class="kv"><span>垂直弹跳</span><span>${cb.vertical}cm</span></div><div class="kv"><span>定点三分</span><span>${cb.shoot} / 25</span></div>`:s.retired?'<p class="muted small">你已退役，不再安排联合试训。</p>':entered?'<p class="muted small">本次选秀已结束，不需要在后续赛季重复试训。当年的原始报告若未保留，以已记录的选秀结果为准。</p>':'<p class="muted small">游戏简化：报名后安排联合试训邀请。受邀球员需完成试训；国家队任务冲突时可在归队后按邀请补测。身体测试受健康与疲劳影响，撤回报名需在截止日前完成。</p>'}</div></section><section class="card">${head('球探建议')}<div class="card-body stack">${scoutAdvice().map(([a,b])=>`<div><h3 class="small acc" style="margin-bottom:5px">${a}</h3><p class="small muted">${b}</p></div>`).join('')}${extraActionButton('参加国际展示营 · ¥1.5万','scout','ghost small')}</div></section><section class="card">${head('规则依据与模拟范围')}<div class="bd"><p class="small muted">依据NBA／NBPA协议第十条：选秀年内年满19岁可提前参选；国际球员年内满22岁自动符合资格；提前报名和撤回有截止日，最多撤回两届。本路线默认在中国居住与打球、未进入美国大学、未在美国完成高中。</p><p class="small muted" style="margin-top:10px">游戏采用40周压缩赛季与模拟新秀、顺位、薪资和签约权流程；不完整复刻选秀权交易、复杂劳资例外与真实球队名单。</p><p class="small acc" style="margin-top:10px"><a href="https://nbpa.com/cba" target="_blank" rel="noopener">查看NBA／NBPA官方协议 ↗</a> · <a href="https://pr.nba.com/2026-nba-draft-combine-participants/" target="_blank" rel="noopener">受邀球员试训要求 ↗</a></p></div></section></aside></div>`;}
function combineAvailability(s=state){
  const e=C.draftEligibility(s),completed=s.draft.combine?.season===s.season;
  const allowed=!s.retired&&s.draft.status==='not-entered'&&s.draft.declared&&!completed&&!s.national.camp&&(e.canCombine??[35,36].includes(s.week));
  return{allowed,reason:s.retired?'已退役，不再参加试训。':s.national.camp?'国家队任务期间暂不能参加试训，归队后按邀请安排补测。':e.combineReason||''};
}
function draftOutcomeText(s=state){
  if(s.draft.status==='drafted')return(s.draft.selectedBy?C.team(s,s.draft.selectedBy).name:'选秀球队')+'在'+(s.draft.year||'当')+'年选择了你。'+(s.retired?'你已退役，选秀结果作为生涯记录保留。':s.draft.rights?'签约权仍属于该队，可在休赛期决定赴NBA或继续海外成长。':'你已签署过NBA合同，此后的转队按现有合同与自由球员资格处理。');
  return s.retired?'当年选秀落选。你已完成生涯，球员档案保留之后的比赛与签约记录。':'选秀结果已确定。继续提升到73总评、35球探关注，休赛期可争取NBA双向合同。';
}
function scoutAdvice(){let s=state,p=s.player,a=[];if(s.retired)return[['生涯已结束','选秀、比赛与能力记录已保留，可在球员档案和生涯荣誉中回顾。']];if(p.a.three<72)a.push(['让投射成为门票',`三分能力目前${Math.round(p.a.three)}。CBA得分不能直接转化为NBA竞争力，可优先强化外线投射。`]);if(p.a.perD<68&&p.pos!=='C')a.push(['证明你能守住自己的位置','NBA的速度和空间会放大防守短板。外防、力量和阅读比赛都需要准备。']);if(p.pos==='C'&&p.a.intD<75)a.push(['禁区里的存在感','提升内线防守、封盖和篮板，才能在更强的对抗中站稳。']);if(s.scout<40)a.push(['先打比赛，再被看见','稳定出场会慢慢提升关注。18岁后可参加国际展示营，每周限一次额外安排。']);if(a.length<2)a.push(['持续性，比高光更重要','平衡训练和恢复。低体能会拖累训练、比赛效率，并增加缺阵风险。']);return a.slice(0,3);}

<tr><th>#</th><th>球员</th><th>位置</th><th>年龄</th><th>球队</th><th>能力</th><th>潜力</th><th>风格</th><th>徽章</th><th>类型</th></tr></thead><tbody>${list.map((p,i)=>`<tr class="${p.me?'me':''}"><td class="num dim">${i+1}</td><td>${playerLink(p)} ${p.me?tag('你','lime'):''}</td><td class="muted">${p.pos}</td><td class="num">${p.age}</td><td class="small muted">${E(C.team(s,p.team).short)}</td><td>${ovBadge(p.ovr)}</td><td class="num muted">${p.potential}</td><td class="small">${C.styles(p.me?{...s.player,me:true}:p).slice(0,2).map(x=>x.name).join(' / ')}</td><td>${C.badges(p.me?s.player:p).filter(b=>b.level).length}</td><td>${tag(p.me?'我的球员':p.foreign?'外援':'本土 / 联盟')}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">没有符合条件的球员</td></tr>'}</tbody></table></div>`}</section>`;}
function historyView(){let s=state,total=s.games.reduce((v,g)=>v+g.pts,0),gp=s.games.filter(g=>g.min).length;return`<div class="four-col" style="margin-bottom:21px">${metric('生涯年数',s.retired?s.seasons.length:s.season+1,'年','从17岁到'+C.age(s)+'岁','calendar')}${metric('生涯出战',gp,'场',`生涯得分 ${fmt(total)}`,'ball')}${metric('生涯荣誉',s.honors.length,'项',`里程碑 ${s.milestones.length} 个`,'star')}${metric('成长幅度',C.ovr(s)-s.growth[0].value,'OVR',`从 ${s.growth[0].value} 到 ${C.ovr(s)}`,'up')}</div>${growthCard()}<div class="two-col" style="margin-top:21px"><section class="card">${head('赛季履历',tag(s.seasons.length+'个已完成赛季'))}${s.seasons.length?`<div class="table-wrap"><table><thead><tr><th>赛季</th><th>球队 / 联赛</th><th>能力</th><th>场次</th><th>得分</th><th>篮板</th><th>助攻</th></tr></thead><tbody>${[...s.seasons].reverse().map(r=>`<tr><td class="num">${r.year}–${String(r.year+1).slice(2)}</td><td>${E(C.team(s,r.team).short)}<br><span class="small dim">${leagueName(r.league)}</span></td><td class="num lime">${r.ovr}</td><td class="num">${r.stats.gp}</td><td class="num">${r.stats.pts}</td><td class="num">${r.stats.reb}</td><td class="num">${r.stats.ast}</td></tr>`).join('')}</tbody></table></div>`:empty('第一章，还在书写','完成第一个赛季后，履历会记录在这里。','history')}</section><aside class="stack"><section class="card">${head('里程碑',icon('star',16))}${s.milestones.length?[...s.milestones].reverse().map(m=>`<div class="milestone"><div class="circle">${icon('check',15)}</div><div><h3>${E(m.title)}</h3><p>${E(m.body)}</p><small>${E(m.date)}</small></div></div>`).join(''):empty('你的名字，等待第一枚印记','首秀、20+、选秀与签约，都会被这份档案记住。','star')}</section><section class="card">${head('荣誉室',tag('TEAM & INDIVIDUAL'))}${s.honors.length?s.honors.map(h=>`<div class="milestone"><div class="circle">${icon('star',15)}</div><div><h3>${E(h.name)}</h3><small>${h.year}</small></div></div>`).join(''):empty('下一座奖杯，会属于谁','在联赛站稳，向全明星、MVP与总冠军前进。','star')}</section></aside></div>`;}
function settingsView(){return`${saveSlotsPanel()}<div class="two-col" style="margin-top:14px"><div class="stack"><section class="card">${head('管理你的生涯存档',tag(saveOK?'自动保存中':'浏览器存储不可用',saveOK?'lime':'bad'))}<div class="card-body"><h3 style="font-size:15px;margin-bottom:8px">${E(state.player.name)} · ${C.age(state)}岁 · ${C.ovr(state)} OVR</h3><p class="small muted">进度保存在当前浏览器，每次操作后自动更新。更换浏览器或清除数据前，请导出存档；也可以把存档导入到另一台设备继续玩。</p><div class="flex wrap" style="margin-top:23px">${btn(icon('download')+' 导出存档','export','primary')}${btn(icon('upload')+' 导入存档','import','ghost')}${btn('创建新球员','new','ghost')}</div></div></section><section class="card">${head('游戏规则',tag('MY CAREER / V2.0'))}<div class="card-body rule-grid"><div><h3>01 / 从17岁开始</h3><p>17岁直接加入自选CBA球队的成年队，以1年发展型职业合同开始。健康时每队至少15分钟培养时间，随经验与能力增加，再竞争首发。40周为一年：32周常规赛、3周季后赛、1周休整和4周休赛期，38岁结束生涯。</p></div><div><h3>02 / 能力没有联赛滤镜</h3><p>沿用原NBA模版的18项属性与位置权重，CBA数据降低到NBA标尺。跨联赛后数值保持连续，改变的是对抗、角色与统计产出。</p></div><div><h3>03 / 选择训练，也要恢复</h3><p>每周选择训练方向与强度，系统自动搭配两组对应训练和一组恢复；选择恢复时整周休整。年龄、潜力、体能、疲劳与士气共同影响收益，高强度更容易疲劳受伤。</p></div><div><h3>04 / 签约就是生涯选择</h3><p>CBA提供不同薪资、年限和出场定位。NBA跳出条款影响你能否提前赴美。休赛期落笔，下赛季生效。每份报价最多两次提案，拒绝仍保留原报价。</p></div><div><h3>05 / 按日历年判断选秀年龄</h3><p>选秀年内满19岁即可提前报名，生日较晚时选秀当天可能只有18岁。国际球员22岁自动参选。提前报名至少在选秀前60天，撤回至少提前10天，最多撤回两届。第36–37周试训，第38周出结果。</p></div><div><h3>06 / 最高舞台之后</h3><p>NBA的对抗和上场竞争更强。赢得轮换、首发、全明星和MVP，或者回到CBA争冠。30岁后身体逐渐衰退，38岁退役。</p></div></div></section></div><aside class="stack"><section class="card">${head('关于这个篮球世界',icon('ball',16))}<div class="card-body stack"><p class="small muted">初始球队和球员来自本地NBA、CBA篮球经理模版，共50支球队与957名球员。原模版包含模拟未来名单，游戏不宣称为实时真实阵容。</p><p class="small muted">新秀榜、后续新人、比赛与合同均为程序模拟。CBA与NBA评级、薪酬、三轮单场季后赛、固定汇率1美元=7元人民币，都是游戏平衡设定。</p><p class="small muted">CBA常规时间40分钟、NBA常规时间48分钟，战平进入5分钟加时；完整赛程压缩至40周。三分、罚球和投篮数据与得分逐球一致。</p><p class="small muted">NBA选秀年龄规则参考 <a href="https://nbpa.com/cba" target="_blank" rel="noopener">NBA / NBPA 劳资协议</a> 与 <a href="https://api-hub.nba.com/news/who-are-the-youngest-nba-players-i const SAVE_SLOT_IDS=[1,2,3];
let pendingSlot=null;
let slotDatabase=null,slotStorageReady=typeof indexedDB==='undefined',slotStoragePromise=null,slotBusy=false,slotLastError='',slotReadFailed=false;
const durableSlots=new Map();
const durableSlotTimes=new Map();
function owns(value,key){return Object.prototype.hasOwnProperty.call(value,key);}
const slotKey=id=>SAVE_KEY+'_slot_'+id;
const slotNumber=value=>SAVE_SLOT_IDS.includes(Number(value))&&String(Number(value))===String(value)?Number(value):null;
function slotTimestamp(raw){try{return Date.parse(JSON.parse(raw)?.savedAt)||0;}catch{return 0;}}
function rememberDurableSlot(record){durableSlots.set(record.id,record.raw);durableSlotTimes.set(record.id,record.updatedAt||slotTimestamp(record.raw));}
function newestSlotRaw(id,record=durableSlots.has(id)?{raw:durableSlots.get(id),updatedAt:durableSlotTimes.get(id)}:null){
  const local=readLocalSlotRaw(id);
  return record&&(!local||slotTimestamp(local)<=(record.updatedAt||slotTimestamp(record.raw)))?record.raw:local;
}
function nextSlotTime(id,prior){return Math.max(Date.now(),slotTimestamp(prior)+1,(durableSlotTimes.get(id)||0)+1);}

  const national=batch.nationalGames.length?`<section class="recap-section"><h3>区间国家队比赛 · ${batch.nationalGames.length}场</h3><div class="table-wrap"><table class="recap-table"><thead><tr><th>日期</th><th>球队 / 对手</th><th>胜负 / 比分</th><th>分钟</th><th>得分</th><th>篮板</th><th>助攻</th><th>抢断</th><th>封盖</th><th>失误</th><th>投篮</th><th>三分</th><th>罚球</th></tr></thead><tbody>${batch.nationalGames.map(g=>`<tr data-batch-national="${g.id}"><td>${E(g.date)}</td><td>${E(g.team)} vs ${E(g.opp)}</td><td class="${g.win?'good':'bad'}">${g.win?'胜':'负'} ${g.score}:${g.against}</td>${['min','pts','reb','ast','stl','blk','tov'].map(k=>`<td class="num">${g[k]??'—'}</td>`).join('')}<td>${g.fgm}/${g.fga}</td><td>${g.tpm}/${g.tpa}</td><td>${g.ftm}/${g.fta}</td></tr>`).join('')}</tbody></table></div></section>`:'';
  modal('快进结果 · 实际推进 '+batch.weeks+' 周',`<div class="section-note">${E(batch.before.date)} → ${E(batch.date)} · ${E(batch.reason)}</div><div class="compact-summary recap-summary"><div><span>俱乐部战绩</span><b>${wins}胜 ${batch.games.length-wins}负</b></div><div><span>个人出场</span><b>${played.length} / ${batch.games.length}</b><small>场</small></div><div><span>区间场均</span><b>${played.length?fmt(sum('pts')/played.length):0} / ${played.length?fmt(sum('reb')/played.length):0} / ${played.length?fmt(sum('ast')/played.length):0}</b><small>分 / 板 / 助</small></div><div><span>能力变化</span><b>${batch.before.ovr} → ${batch.ovr}</b><small>精确变化 ${gainText(batch.exact-batch.before.exact)}</small></div><div><span>本次薪资收入</span><b>¥${cashText(batch.income)}</b><small>万元</small></div></div><section class="recap-section"><h3>期间全部俱乐部比赛 · ${batch.games.length}场</h3>${rows?`<div class="table-wrap"><table class="recap-table"><thead><tr><th>日期 / 联赛</th><th>球队 / 对手</th><th>胜负 / 比分</th><th>出场</th><th>分钟</th><th>得分</th><th>篮板</th><th>前场</th><th>后场</th><th>助攻</th><th>抢断</th><th>封盖</th><th>失误</th><th>犯规</th><th>投篮</th><th>三分</th><th>罚球</th><th>评分</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="muted">这段时间没有俱乐部比赛。</p>'}</section>${national}<section class="recap-section"><h3>训练、身体与恢复</h3><div class="recap-gains"><div><span>体能</span><b>${Math.round(batch.before.energy)} → ${Math.round(batch.energy)}</b></div><div><span>疲劳</span><b>${Math.round(batch.before.fatigue)} → ${Math.round(batch.fatigue)}</b></div>${changes.map(a=>`<div><span>${E(a.label)}</span><b class="${a.delta>=0?'good':'bad'}">${gainText(a.delta)}</b></div>`).join('')}</div><p class="small muted" style="margin-top:8px">伤病：${E(injury(batch.before.injury))} → ${E(injury(batch.injury))}</p>${medical.map(note=>`<p class="small muted">${E(note)}</p>`).join('')}</section>${recapNextNote()}`,`<small>以上包含本次快进期间的全部比赛，比赛统计与赛程页面一致。</small><div class="row">${recapNextButton()}${btn('返回球馆','close',careerNextStep()?'ghost':'primary')}</div>`,true);
}

// Dense NBA-template player panels, shared across the roster, league and broadcast.
const BADGE_LEVELS=['未解锁','铜','银','金','名人堂'];
function playerLink(p){return `<button class="pl" data-act="player-open" data-id="${E(p.me?'me':p.id||'')}">${E(p.name)}</button>`;}
function detailPlayer(id){if(String(id).startsWith('prospect-')){const q=state.prospects.find(p=>p.id===Number(id.slice(9)));return q?{...q,id,prospect:true,ovr:Math.min(q.potential,C.round(q.score-15)),height:{PG:190,SG:196,SF:202,PF:209,C:216}[q.pos],arch:{PG:'pg',SG:'shooter',SF:'wing',PF:'stretch',C:'rim'}[q.pos]}:null;}return id==='me'?{...state.player,id:'me',me:true,team:state.team,league:state.league,age:C.age(state),ovr:C.ovr(state)}:state.world.find(p=>p.id===id);}
function radarPlayer(p){const ordered=C.styles(p),vals=['投射','持球','终结','外防','内线','身体','精神'].map(name=>ordered.find(v=>v.name===name)),n=vals.length,cx=130,cy=118,r=82,point=(i,v)=>[cx+Math.sin(i/n*Math.PI*2)*r*v,cy-Math.cos(i/n*Math.PI*2)*r*v],pts=v=>vals.map((_,i)=>point(i,v).join(',')).join(' ');return `<svg viewBox="0 0 260 244" class="player-radar" role="img" aria-label="${E(p.name)}七维能力雷达">${[.25,.5,.75,1].map(v=>`<polygon points="${pts(v)}" fill="none" stroke="var(--line2)"/>`).join('')}${vals.map((x,i)=>{const [x2,y2]=point(i,1),[tx,ty]=point(i,1.22);return `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="var(--line)"/><text x="${tx}" y="${ty}" fill="var(--muted)" text-anchor="middle" font-size="11">${E(x.name)}</text>`;}).join('')}<polygon points="${vals.map((x,i)=>point(i,Math.min(x.value,102)/102).join(',')).join(' ')}" fill="rgba(238,125,47,.18)" stroke="var(--accent)" stroke-width="2"/></svg>`;}
function playerSkillPanel(raw){const p=C.playerDetails(raw),styles=C.styles(p),groups=[['进攻',['fin','post','mid','three','ft','pass','hand']],['防守',['reb','perD','intD','blk','stl']],['身体 / 精神',['spd','jmp','str','sta','iq','cons']]];return `<section class="card">${head('全部18项能力',tag('统一 NBA 能力标尺'))}<div class="bd attrwrap">${radarPlayer(p)}<div class="attribute-grid">${groups.map(([name,ks])=>`<div class="attr-group"><h3>${name}</h3>${ks.map(k=>`<div class="attrline" data-player-attribute="${k}"><span>${DB.attrs.find(a=>a[0]===k)[1]}</span><b class="av ${p.a[k]>=86?'elite':p.a[k]>=76?'good':p.a[k]>=65?'acc':''}">${p.a[k].toFixed(1)}</b><i><em style="width:${Math.min(100,p.a[k])}%"></em></i></div>`).join('')}</div>`).join('')}</div></div><div class="style-summary"><b>风格 · ${styles.slice(0,2).map(x=>x.name).join(' / ')}</b><span class="dim">根据当前能力自动形成</span><div class="style-grid">${styles.map(x=>`<span>${x.name} <b class="${x.value>=86?'elite':x.value>=76?'good':'muted'}">${x.value.toFixed(1)}</b></span>`).join('')}</div></div></section>`;}
function badgePanel(p){const badges=C.badges(p),owned=badges.filter(b=>b.level);return `<section class="card badge-panel">${head('徽章 · 实战加成',tag(owned.length+' 已解锁'))}<div class="bd"><div class="badge-categories">${['终结','投篮','组织','防守','身体','精神'].map(cat=>`<div><h3>${cat} <small>${owned.filter(b=>b.cat===cat).length}</small></h3>${badges.filter(b=>b.cat===cat).map(b=>`<div class="bdi ${b.level?'':'locked'}"><span class="bdg b${b.level}">${b.name}</span><span>${BADGE_LEVELS[b.level]} · ${b.effect}${b.next?`<small>当前 ${b.value.toFixed(1)} / 下级 ${b.next}</small>`:'<small>最高等级</small>'}</span></div>`).join('')}</div>`).join('')}</div><p class="dim small">徽章随对应能力自动升级；每级提供0.6个百分点的对应加成，同类累计上限4.5个百分点。高潜力代表成长空间，开局不会直接获得高级徽章。</p></div></section>`;}
function popularityPanel(){const pop=C.popularity(state),rotation=C.rotation(state);return `<section class="card">${head('人气与外界关注',tag(pop.value+' / 100','lime'))}<div class="bd"><div class="stat-strip"><div><b>${fmt(state.fans)}</b><span>关注球迷</span></div><div><b>${pop.value}</b><span>综合人气</span></div><div><b>${state.player.potential}</b><span>潜力期待</span></div></div><div class="condition-grid" style="margin:10px 0">${bar('身体状态',state.energy,'good')}${bar('疲劳',state.fatigue,state.fatigue>=50?'bad':'orange')}${bar('教练信任',state.trust)}${bar('士气',state.morale,'good')}</div><p class="small">${state.injury?E(state.injury.name):'身体健康'} · 实际轮换 ${E(rotation.role)} · 预计 ${rotation.minutes} 分钟<br>位置竞争：同位置第${rotation.me.positionRank} · 全队第${rotation.me.rank} · 合同地位 ${E(state.contract.role||'培养球员')}</p><div class="pop-factors">${Object.entries(pop.factors).map(([key,v])=>`<span>${key}<b>+${v.toFixed(1)}</b></span>`).join('')}</div><p class="dim small">年轻、高潜会带来开局关注；长期影响力由能力、球队胜率、荣誉和球迷共同决定。比赛表现与每周曝光增加球迷，商业收入沿用实际球迷数量。</p></div></section>`;}
function openPlayerDetail(id){const fromMatch=modalKind==='match',raw=detailPlayer(id);if(!raw){toast('该球员已离开当前名单');return;}const p=C.playerDetails(raw),t=C.team(state,p.team)||{name:p.team,color:'#394a58'},obs=p.observed?.season===state.season?p.observed:null,rotation=p.team===state.team?C.rotation(state).players.find(q=>p.me?q.me:q.id===p.id):null;
  modalKind='player';modal(E(p.name)+' · 球员档案',`<div class="ph detail-head"><div class="jersey" style="background:${E(t.color)}">${p.me?p.jersey:p.pos}<small>${p.pos}</small></div><div><div class="nm">${E(p.name)}</div><div class="meta">${E(t.name)} · ${p.age}岁 · ${p.height}cm · ${E(p.pos)}</div><div class="muted small">${p.me?'我的生涯球员':p.prospect?'选秀新秀 · 球探评估 '+p.score:'职业球员 · '+(p.foreign?'外援':'本土 / 联盟')}</div></div><div class="rt"><div><small>能力</small>${ovBadge(p.ovr)}</div><div><small>潜力</small><b class="acc">${p.potential}</b></div><div><small>健康</small><b>${p.me?(state.injury?'伤停':'健康'):p.injuryUntil>state.season*40+state.week?'伤停':'健康'}</b></div></div></div>${rotation?`<div class="note">${E(rotation.role)} · 预计 ${rotation.minutes} 分钟 · ${E(rotation.reason)}</div>`:''}${playerSkillPanel(p)}${badgePanel(p)}${p.prospect?'<p class="note">新秀当前能力按球探综合评价扣除成长溢价估算；选秀排序还考虑年龄、潜力与曝光，不等于当前总评。属性及身体条件为游戏设定。</p>':p.me?popularityPanel():`<section class="card">${head('本赛季 · 与你同场的已记录比赛',tag((obs?.gp||0)+'场'))}<div class="table-wrap"><table><thead><tr><th>分钟</th><th>得分</th><th>篮板</th><th>助攻</th><th>抢断</th><th>封盖</th><th>失误</th><th>投篮</th><th>三分</th><th>罚球</th></tr></thead><tbody><tr>${['min','pts','reb','ast','stl','blk','tov'].map(k=>`<td class="num">${obs?(obs[k]/obs.gp).toFixed(1):'—'}</td>`).join('')}${[['fgm','fga'],['tpm','tpa'],['ftm','fta']].map(([m,a])=>`<td>${obs?obs[m]+'/'+obs[a]:'—'}</td>`).join('')}</tr></tbody></table></div><div class="card-foot">名单原始文件只有总评；18项能力按位置与风格生成并与总评对齐，属于游戏设定。这里仅汇总已完整模拟的同场比赛，不虚构其余场次数据。</div></section>`}`,btn(fromMatch?'返回比赛':'返回',fromMatch?'player-back-match':'close','primary'),true);
}
function tradePanel(){const s=state,options=C.tradeOptions(s);return `<section class="card trade-panel">${head('申请交易 · 由经纪人协商',tag('同联赛转会'))}<div class="bd"><p class="muted small">新队承接当前合同的年薪、到期年与条款；不能通过交易绕过NBA选秀。前24周开放，申请间隔6周。未谈成保留原合同，教练信任−3。</p><div class="row"><select id="trade-target" aria-label="交易目标球队">${options.list.map(o=>`<option value="${E(o.team)}">${E(C.team(s,o.team).name)} · ${o.role} · 预计谈成 ${o.chance}%</option>`).join('')}</select>${btn('请经纪人申请交易','trade-request','primary',options.reason?'disabled':'')}</div>${options.reason?`<p class="warn small">${E(options.reason)}</p>`:'<p class="dim small">无论转会至哪支球队，健康时至少15分钟培养时间；实际轮换随成长增加。</p>'}${s.trades.history.length?`<table><thead><tr><th>日期</th><th>从</th><th>至</th><th>结果</th></tr></thead><tbody>${s.trades.history.map(h=>`<tr><td>${h.date}</td><td>${E(C.team(s,h.from).short)}</td><td>${E(C.team(s,h.to).short)}</td><td class="${h.accepted?'good':'muted'}">${h.accepted?'完成 · 原合同转移':'未达成'}</td></tr>`).join('')}</tbody></table>`:''}</div></section>`;}
function nationalCalendarPanel(){return `<section class="card">${head('国家队大赛日历',tag('可接受 / 可婉拒'))}<div class="table-wrap"><table><thead><tr><th>年份</th><th>赛事</th><th>赛制</th><th>选拔</th></tr></thead><tbody>${C.nationalCalendar(state).map(x=>`<tr><td class="num">${x.year}</td><td>${x.name}</td><td>${x.format}</td><td>66 OVR起，健康时评估征召</td></tr>`).join('')}</tbody></table></div><div class="card-foot">世界杯沿用原世锦赛的历史，不重复设置赛事。正式比赛按四年周期；为适配40周赛季，国家队大赛压缩到第35周窗口，资格赛和淘汰赛均为游戏简化赛制，未获资格不能直接进入决赛。集训两周，接受或休整均由你决定。</div></section>`;}
const previousPlayerView=playerView;
playerView=function(){let html=previousPlayerView();const start=html.indexOf('<div class="player-overview">'),end=html.indexOf('<section class="card player-statistics"',start);if(start>=0&&end>=0)html=html.slice(0,start)+`<div class="player-overview">${playerSkillPanel(detailPlayer('me'))}${popularityPanel()}</div>${badgePanel(detailPlayer('me'))}`+html.slice(end);return html;};
const previousTrainingView=trainingView;
trainingView=function(){const pace=C.developmentPace(state);return `<section class="card training-tendency">${head('场上倾向',tag('影响出手与球权'))}<div class="bd row"><div class="row"><span class="muted">进攻选择</span>${[['balanced','均衡'],['outside','外线'],['rim','冲筐']].map(([v,n])=>btn(n,'court-tendency',v===(state.tendency||'balanced')?'small selected':'small ghost',`data-value="${v}" ${state.retired?'disabled':''}`)).join('')}</div><div class="row"><span class="muted">比赛职责</span>${[['team','组织'],['score','得分'],['defend','防守']].map(([v,n])=>btn(n,'court-approach',v===state.approach?'small selected':'small ghost',`data-value="${v}" ${state.retired?'disabled':''}`)).join('')}</div><span class="dim small">${E(pace.label)} · 最近${pace.games}场均${pace.minutes.toFixed(1)}分钟 / 首发${Math.round(pace.starts*100)}% · 实战培养加成 +${Math.round((pace.multiplier-1.08)*100)}%<br>当前强度每周综合成长上限 ${pace.weeklyCap.toFixed(3)}；高潜球员打上首发、获得更多实际时间后成长更快。上限不等于保证收益，疲劳、伤病与接近潜力上限会减速。${pace.offseason?'休赛期沿用本季末的实战培养基础。':'新比赛从下次训练起计入培养评估。'}</span></div></section>`+previousTrainingView();};
const previousContractsView=contractsView;
contractsView=function(){return tradePanel()+previousContractsView();};
const previousNationalView=nationalView;
nationalView=function(){return nationalCalendarPanel()+previousNationalView();};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const d=el.dataset;if(state&&!state.retired){if(d.act==='court-tendency'&&['balanced','outside','rim'].includes(d.value)){state.tendency=d.value;persist();render();}if(d.act==='court-approach'&&['team','score','defend'].includes(d.value)){state.approach=d.value;persist();render();}}if(d.act==='player-open')openPlayerDetail(d.id);if(d.act==='player-back-match'&&matchSession)renderMatchReplay();if(d.act==='trade-request'){const target=$('#trade-target')?.value;if(target){const r=C.requestTrade(state,target);actionResult(r);if(r.ok)toast(r.message);}}});
document.addEventListener('change',e=>{if(!state||state.retired||creationOpen)return;const d=e.target.dataset,v=e.target.value;if(d.change==='court-tendency'&&['balanced','outside','rim'].includes(v)){state.tendency=v;persist();render();}if(d.change==='court-approach'&&['team','score','defend'].includes(v)){state.approach=v;persist();render();}});

function liveBoxPanel(game,snapshot){return `<div class="match-box-columns">${[game.team,game.opp].map(id=>`<section class="card match-box">${head(E(C.team(state,id).short)+' · 技术统计',tag('实时累计'))}<div class="table-wrap"><table><thead><tr><th>球员</th><th>分</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TO</th><th>PF</th><th>FG</th><th>3P</th><th>FT</th></tr></thead><tbody>${snapshot.box.filter(p=>p.team===id).map(p=>`<tr class="${p.me?'me':''}"><td>${playerLink(p)} ${p.onCourt?'<span class="good">●</span>':''}</td><td class="num">${p.min.toFixed(1)}</td>${['pts','reb','ast','stl','blk','tov','pf'].map(k=>`<td class="num">${p[k]}</td>`).join('')}<td>${p.fgm}/${p.fga}</td><td>${p.tpm}/${p.tpa}</td><td>${p.ftm}/${p.fta}</td></tr>`).join('')}</tbody></table></div></section>`).join('')}</div>`;}

persist();render();initSaveSlotStorage();</script></body></html>
