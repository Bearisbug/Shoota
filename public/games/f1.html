<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>F1 Team Principal 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: pit-wall shell — sticky team bar, left rail, dense timing panels. Single dark theme by choice (pit-wall screens). Accent follows the player's team livery. */
:root {
  --bg: #0a0c0f; --rail: #0d1014; --panel: #12161b; --panel2: #191e25; --line: #222932; --line2: #2e3743;
  --fg: #e3e8ee; --muted: #8a96a4; --dim: #5a6573;
  --accent: #ff8000; --accent-ink: #160b00; --accent-soft: rgba(255, 128, 0, .14);
  --purple: #b25cff; --green: #3ddc84; --yellow: #ffd23f; --red: #ff4d57; --blue: #4aa8ff;
  --good: var(--green); --bad: var(--red); --warn: var(--yellow);
  --f-display: 'Titillium Web', 'Noto Sans SC', 'Arial Narrow', sans-serif;
  --f-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13.5px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--rail); }
* { box-sizing: border-box; }
a { color: inherit; text-decoration: none; cursor: pointer; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

#app { display: grid; grid-template-columns: 196px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--rail); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; flex-wrap: wrap; }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, var(--accent) 0 34%, transparent 34%); }
.brand { font: 900 17px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; font-style: italic; }
.brand b { color: var(--accent); }
.club { display: flex; align-items: center; gap: 10px; min-width: 0; }
.livery { width: 34px; height: 22px; border-radius: 3px; display: grid; place-items: center; font: 900 11px/1 var(--f-display); letter-spacing: .04em; flex: none; transform: skewX(-12deg); }
.livery span { transform: skewX(12deg); }
.club .nm { font: 700 17px/1.1 var(--f-display); letter-spacing: .02em; white-space: nowrap; }
.club .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
.kpis { display: flex; gap: 18px; margin-left: auto; flex-wrap: wrap; }
.kpi { text-align: right; }
.kpi small { display: block; color: var(--dim); font: 600 10.5px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 3px; }
.kpi b { font: 700 15px/1 var(--f-mono); }
.go .btn.pri { font: 700 15px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 9px 18px; }

nav.rail { background: var(--rail); border-right: 1px solid var(--line); padding: 10px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
nav.rail .grp { font: 700 11px/1 var(--f-display); letter-spacing: .16em; color: var(--dim); text-transform: uppercase; padding: 14px 10px 6px; }
nav.rail a { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: 3px; color: var(--muted); }
nav.rail a:hover { background: var(--panel2); color: var(--fg); }
nav.rail a.on { background: var(--accent-soft); color: var(--fg); box-shadow: inset 3px 0 0 var(--accent); }
.badge { background: var(--accent); color: var(--accent-ink); font: 700 11px/1 var(--f-mono); padding: 2px 6px; border-radius: 9px; }

main { overflow-y: auto; padding-block: 18px 48px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); min-width: 0; }
.h1 { font: 900 28px/1.05 var(--f-display); letter-spacing: .01em; text-transform: uppercase; margin: 0 0 4px; text-wrap: balance; font-style: italic; }
.h1 small { font: 600 14px/1 var(--f-display); color: var(--muted); font-style: normal; letter-spacing: .06em; margin-left: 8px; }
.lede { color: var(--muted); margin: 0 0 16px; max-width: 72ch; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); align-items: start; }
.grid.g2 { grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); }
.grid.g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sp { flex: 1; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; min-width: 0; }
.card > h3 { margin: 0; padding: 10px 14px; font: 700 13px/1.2 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.card > h3 .sp { flex: 1; }
.card .bd { padding: 12px 14px; }
.card .bd.flush { padding: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.big { font: 900 36px/1 var(--f-display); font-style: italic; }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .acc { color: var(--accent); } .pur { color: var(--purple); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.note { background: var(--panel2); border-left: 3px solid var(--accent); padding: 9px 12px; border-radius: 0 4px 4px 0; color: var(--muted); }
.note b { color: var(--fg); }
.note.bad { border-left-color: var(--bad); } .note.good { border-left-color: var(--good); }

.btn { background: var(--panel2); border: 1px solid var(--line2); padding: 6px 12px; border-radius: 3px; cursor: pointer; white-space: nowrap; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn.ghost { background: transparent; }
.btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.btn[disabled] { opacity: .38; cursor: not-allowed; }
.btn.big { font: 700 16px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 11px 20px; }

.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font: 700 11px/1.2 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel); }
table.t td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t tr:hover td { background: rgba(255, 255, 255, .025); }
table.t .n, table.t th.n { text-align: right; }
table.t tr.me td { background: var(--accent-soft); }
table.t tr.cut td { border-bottom: 2px solid var(--line2); }
table.t .num { font-family: var(--f-mono); font-size: 12.5px; }
.pl { color: var(--fg); font-weight: 500; cursor: pointer; } .pl:hover { color: var(--accent); text-decoration: underline; }
.tm { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; }
.tm i { width: 4px; height: 14px; border-radius: 1px; display: inline-block; flex: none; }
.code { font: 700 13px/1 var(--f-display); letter-spacing: .06em; }
.nat { font: 600 10.5px/1 var(--f-mono); color: var(--dim); }

.ov { display: inline-block; min-width: 30px; text-align: center; font: 700 12.5px/1 var(--f-mono); padding: 4px 4px; border-radius: 3px; color: #0a0c0f; }
.meter { height: 7px; background: var(--panel2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); min-width: 50px; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.meter.g > i { background: var(--good); } .meter.w > i { background: var(--warn); } .meter.b > i { background: var(--bad); }
.chip { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
.chip.acc { color: var(--accent); border-color: var(--accent); }
.chip.good { color: var(--good); border-color: rgba(61, 220, 132, .45); }
.chip.bad { color: var(--bad); border-color: rgba(255, 77, 87, .45); }
.chip.warn { color: var(--warn); border-color: rgba(255, 210, 63, .45); }

/* tyres */
.ty { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--c); font: 900 10px/1 var(--f-display); color: var(--fg); background: #000; flex: none; vertical-align: middle; }
.tyw { display: inline-flex; align-items: center; gap: 5px; }

/* result cells */
.rc { display: inline-block; min-width: 26px; text-align: center; font: 700 11.5px/1 var(--f-mono); padding: 4px 3px; border-radius: 2px; background: var(--panel2); color: var(--muted); }
.rc.p1 { background: #e7c24b; color: #1a1300; } .rc.p2 { background: #c9d0d8; color: #111; } .rc.p3 { background: #c98a4f; color: #1a0d00; }
.rc.pts { background: rgba(61, 220, 132, .16); color: var(--green); }
.rc.dnf { background: rgba(255, 77, 87, .14); color: var(--red); }
.rc.na { background: transparent; color: var(--dim); }
.rc sup { font-size: 8.5px; color: var(--purple); margin-left: 1px; }

/* attributes */
.attr { display: grid; grid-template-columns: 76px minmax(0, 1fr) 30px; gap: 10px; align-items: center; padding: 3px 0; }
.attr span:first-child { color: var(--muted); }
.attr b { font: 700 12.5px/1 var(--f-mono); text-align: right; }

/* driver header */
.dh { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.dh .num { font: 900 italic 40px/1 var(--f-display); width: 64px; text-align: center; flex: none; }
.dh .nm { font: 700 22px/1.05 var(--f-display); }
.dh .meta { color: var(--muted); font-size: 12.5px; }
.dh .rt { margin-left: auto; display: flex; gap: 18px; }
.dh .rt div { text-align: center; } .dh .rt small { display: block; color: var(--dim); font: 700 10.5px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 5px; }

/* inputs */
input[type=number], select, input[type=text] { background: var(--bg); color: var(--fg); border: 1px solid var(--line2); border-radius: 3px; padding: 5px 7px; font: inherit; }
input[type=number] { width: 72px; font-family: var(--f-mono); }
textarea { width: 100%; min-height: 110px; background: var(--bg); color: var(--fg); border: 1px solid var(--line2); border-radius: 3px; font: 11.5px/1.4 var(--f-mono); padding: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 3px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 5px 10px; cursor: pointer; color: var(--muted); border-right: 1px solid var(--line2); font-size: 12.5px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-soft); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.seg button[disabled] { opacity: .35; cursor: not-allowed; }

/* modal & toast */
[hidden] { display: none !important; }
#modal { position: fixed; inset: 0; background: rgba(3, 4, 6, .74); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: calc(40px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.mbox { background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; width: min(860px, 100%); position: relative; padding: 18px 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
.mbox .x { position: absolute; right: 10px; top: 6px; background: none; border: 0; font-size: 24px; color: var(--muted); cursor: pointer; }
#toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 80; max-width: min(380px, calc(100% - 32px)); }
.toast { background: var(--panel2); border: 1px solid var(--line2); border-left: 3px solid var(--accent); padding: 9px 12px; border-radius: 3px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); animation: tin .2s ease-out; }
.toast.good { border-left-color: var(--good); } .toast.bad { border-left-color: var(--bad); }
@keyframes tin { from { transform: translateY(6px); opacity: 0; } }

/* start screen */
.start { max-width: 1200px; margin: 0 auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 20px; display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
.hero h1 { font: 900 italic clamp(38px, 7vw, 76px)/.88 var(--f-display); letter-spacing: -.01em; text-transform: uppercase; margin: 0; }
.hero h1 b { color: var(--red); }
.hero .kick { font: 700 12px/1 var(--f-display); letter-spacing: .3em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
.hero p { color: var(--muted); max-width: 52ch; margin: 0; }
.paddock-option { margin-bottom: 16px; }
.paddock-option label { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; color: var(--fg); }
.paddock-option input { width: 18px; height: 18px; flex: 0 0 auto; accent-color: var(--accent); }
.paddock-option input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.paddock-option p { margin: 4px 0 0; }
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0; cursor: pointer; display: flex; flex-direction: column; text-align: left; overflow: hidden; }
.tcard:hover { border-color: var(--line2); background: var(--panel2); }
.tcard .stripe { height: 5px; background: var(--c); }
.tcard .in { padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 6px; }
.tcard .tn { font: 700 19px/1 var(--f-display); }
.tcard .tf { color: var(--dim); font-size: 11.5px; }
.tcard .ds { font: 600 13px/1.3 var(--f-display); letter-spacing: .03em; }
.tcard .st { display: flex; gap: 12px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.tcard .st b { color: var(--fg); font-family: var(--f-mono); font-weight: 700; }

/* race view */
.rhead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; margin-bottom: 12px; }
.lapc { font: 900 italic 30px/1 var(--f-display); }
.lapc small { font: 600 14px/1 var(--f-display); color: var(--muted); font-style: normal; }
.flag { font: 700 13px/1 var(--f-display); letter-spacing: .12em; padding: 6px 10px; border-radius: 2px; text-transform: uppercase; }
.flag.green { background: rgba(61, 220, 132, .16); color: var(--green); }
.flag.sc { background: var(--yellow); color: #1a1400; animation: blink 1s steps(2) infinite; }
.flag.vsc { background: rgba(255, 210, 63, .2); color: var(--yellow); border: 1px dashed var(--yellow); }
.flag.chq { background: repeating-conic-gradient(#fff 0 25%, #111 0 50%) 0 0/10px 10px; color: transparent; width: 40px; }
@keyframes blink { 50% { opacity: .55; } }
.rgrid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.tower td { padding: 4px 6px; font-size: 12.5px; }
.tower .pos { font: 700 13px/1 var(--f-mono); width: 26px; text-align: right; }
.tower .chg { font-size: 10px; width: 22px; }
.tower .up { color: var(--green); } .tower .dn { color: var(--red); }
.tower tr.out td { opacity: .45; }
.tower tr.pit td { background: rgba(74, 168, 255, .08); }
.ctrl { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
.ctrl .ch { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.ctrl .ch .p { font: 900 italic 28px/1 var(--f-display); min-width: 46px; }
.ctrl .cb { padding: 10px 12px; display: flex; flex-direction: column; gap: 9px; }
.ctrl .cb .lbl { color: var(--dim); font: 700 10.5px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; min-width: 54px; }
.feed { max-height: 330px; overflow-y: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
.ev { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; padding: 5px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.ev .l { color: var(--dim); font-family: var(--f-mono); font-size: 11.5px; }
.ev.me { box-shadow: inset 3px 0 0 var(--accent); }
.e-sc .t, .e-w .t { color: var(--yellow); } .e-bad .t { color: var(--red); } .e-pit .t { color: var(--blue); } .e-win .t { color: var(--green); font-weight: 700; } .e-pen .t, .e-inc .t { color: #ff9f43; } .e-radio .t { color: var(--fg); font-style: italic; } .e-ov .t { color: var(--muted); }
.prompt { border: 1px solid var(--yellow); background: linear-gradient(180deg, rgba(255, 210, 63, .1), var(--panel)); border-radius: 4px; padding: 14px 16px; margin-bottom: 12px; }
.prompt h4 { margin: 0 0 6px; font: 900 italic 20px/1.1 var(--f-display); text-transform: uppercase; color: var(--yellow); }
.prompt p { margin: 0 0 10px; }
.rec { font-size: 10.5px; background: var(--yellow); color: #1a1400; padding: 1px 5px; border-radius: 2px; margin-left: 6px; font-weight: 700; }

/* misc */
.trk { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.trk div small { display: block; color: var(--dim); font: 700 10.5px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
.trk div b { font: 700 16px/1.1 var(--f-mono); }
.opt { border: 1px solid var(--line2); border-radius: 4px; padding: 9px 11px; cursor: pointer; background: var(--panel2); text-align: left; display: flex; flex-direction: column; gap: 3px; }
.opt:hover { border-color: var(--muted); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt b { font: 700 14px/1.2 var(--f-display); }
.opt small { color: var(--muted); font-size: 12px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.dfsel { display: flex; gap: 6px; }
.pumeter { display: flex; align-items: center; gap: 3px; font-size: 11px; }
.pumeter i { width: 18px; height: 6px; border-radius: 1px; background: var(--line2); }
.pumeter i.used { background: var(--muted); opacity: .5; }
.pumeter i.cur { background: var(--accent); }
.pumeter i.next { background: var(--green); }
.pumeter i.over { outline: 1px solid var(--red); }
.pumeter span { margin-left: 6px; }
.dftab { display: grid; gap: 0; font-size: 12.5px; }
.dftab .dfh, .dftab .dfr { display: grid; grid-template-columns: 64px repeat(5, minmax(0, 1fr)); gap: 4px; align-items: center; }
.dftab .dfh { margin-bottom: 4px; }
.dftab .dfh > span { font-size: 11px; }
.dftab .dfh button { padding: 8px 0; border: 1px solid var(--line2); background: var(--panel2); border-radius: 3px; cursor: pointer; font: 700 15px/1 var(--f-mono); color: var(--muted); }
.dftab .dfh button.rng { border-color: rgba(61, 220, 132, .5); color: var(--fg); }
.dftab .dfh button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.dftab .dfr { padding: 5px 0; border-top: 1px solid var(--line); }
.dftab .dfr > span:first-child { color: var(--dim); font-size: 11.5px; }
.dftab .dfr > span:not(:first-child) { text-align: center; font-family: var(--f-mono); color: var(--muted); font-size: 12px; padding: 2px 0; border-radius: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

// star power 0-100: titles, wins, podiums, current ability, youth hype and current momentum
function starPower(id) {

  const hype = age <= 21 && o >= 85 ? (o - 84) * 3 : 0;

}

        <div class="row" style="gap:3px;margin-top:6px">${S.cal.slice(Math.max(0, S.round - 6), S.round).map((x, i) => rcCell(d.st.res[Math.max(0, S.round - 6) + i])).join('') || '<span class="dim">尚未出赛</span>'}</div></div>`; }).join('')}</div></div>

    </div>
    <div class="stack">
      ${diagCard(false)}
      <div class="card"><h3>车队状况</h3><div class="bd stack" style="gap:12px">
        <div class="row" style="gap:22px"><div><div class="dim" style="font-size:11px">车队积分榜</div><div class="big">P${pos}</div></div><div><div class="dim" style="font-size:11px">积分</div><div class="big">${me.pts}</div></div><div><div class="dim" style="font-size:11px">现金</div><div class="big" style="font-size:28px">${money(me.cash)}</div></div></div>
        <div><div class="row"><span class="muted">董事会满意度</span><span class="sp"></span><b class="mono">${Math.round(S.board.sat)}</b></div>${meter(S.board.sat, S.board.sat < 30 ? 'b' : S.board.sat < 55 ? 'w' : 'g')}</div>
        <div><div class="row"><span class="muted">成本上限使用</span><span class="sp"></span><b class="mono">$${Math.round(me.capSpent)}M / $${CAP}M</b></div>${meter(me.capSpent / CAP * 100, me.capSpent > CAP ? 'b' : '')}</div>
        <div class="row">${S.projects.length ? `<span class="chip acc">${S.projects.length} 个研发项目进行中</span>` : '<span class="chip warn">研发产线空闲</span>'}${Object.values(me.unval).some(v => v > 0) ? '<span class="chip warn">有未验证的新部件</span>' : ''}</div>

    </div>
  </div>`;
}

/* ---------- inbox ---------- */
function inboxView() {
  S.inbox.forEach(m => m.read = true);
  return `<h1 class="h1">收件箱</h1><p class="lede">董事会、技术部和围场的最新消息。</p>
  <div class="card"><div class="bd flush">${S.inbox.map(m => `<div style="padding:11px 14px;border-bottom:1px solid var(--line);${m.kind === 'bad' ? 'box-shadow:inset 3px 0 0 var(--bad)' : m.kind === 'good' ? 'box-shadow:inset 3px 0 0 var(--good)' : ''}"><div class="row"><b style="font-weight:600">${esc(m.title)}</b><span class="sp"></span><span class="dim" style="font-size:11.5px">${esc(m.from)} · ${m.y} R${m.r + 1}</span></div><div class="muted" style="margin-top:2px">${esc(m.body)}</div></div>`).join('') || '<div class="empty">没有消息</div>'}</div></div>`;
}

/* ---------- drivers ---------- */
function attrRows(d) { return [['速度', d.pace], ['缠斗', d.craft], ['稳定性', d.cons], ['轮胎管理', d.tyre], ['雨战', d.wet]].map(([k, v]) => `<div class="attr"><span>${k}</span>${meter((v - 60) / 39 * 100)}<b style="color:${ovCol(v)}">${Math.round(v)}</b></div>`).join('') + (d.pot ? `<div class="attr"><span>潜力</span>${meter((d.pot - 60) / 39 * 100, 'g')}<b class="pur">${d.pot}</b></div><div class="dim" style="font-size:12px">天赋型车手：赛季中每场比赛都会进步，休赛期成长更快</div>` : ''); }
function driverCard(id, role) {
  const d = D(id), me = ME(), pu = S.pu[id] || { used: 1, miles: 0 };
  return `<div class="card"><div class="bd">
    <div class="dh"><div class="num" style="color:${me.color}">${d.num}</div><div><div class="nm">${esc(d.name)}</div><div class="meta">${d.code} · ${d.nat} · ${ageOf(d)} 岁 · ${role}${d.inj ? ` · <span class="bad">伤缺 ${d.inj} 场</span>` : ''}</div></div>
      <div class="rt"><div><small>综合</small>${ovCell(ovr(d))}</div><div><small>积分</small><b class="mono">${d.st.pts}</b></div><div><small>士气</small><b class="mono ${d.morale < 40 ? 'bad' : d.morale > 75 ? 'good' : ''}">${Math.round(d.morale)}</b></div></div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">
      <div>${attrRows(d)}</div>
      <div>${kv([['合同', `至 ${d.until} 赛季${d.until <= S.year ? ' <span class="chip warn">到期</span>' : ''}`], ['年薪', money(d.salary)], ['本季', `${d.st.wins} 胜 · ${d.st.pod} 领奖台 · ${d.st.poles} 杆位 · ${d.st.dnf} 退赛`], ['生涯', `${dCareer(d.id).starts} 场 · ${dCareer(d.id).wins} 胜 · ${dCareer(d.id).titles} 冠`], ['动力单元', `第 ${pu.used}/${PU_QUOTA} 台 · 已跑 ${pu.miles} 站`]])}</div>
    </div>
    <div class="row" style="gap:3px;margin-top:10px;flex-wrap:wrap">${S.cal.map((x, i) => rcCell(d.st.res[i])).join('')}</div>
    <div class="row" style="margin-top:12px">${role !== '替补车手' && me.reserve ? `<button class="btn sm" data-act="swapres" data-slot="${me.drivers.indexOf(id)}">换上替补 ${D(me.reserve).code}</button>` : ''}<button class="btn sm" data-act="offer" data-id="${id}">${d.until <= S.year ? '续约' : '延长合同'}</button></div>
  </div></div>`;
}
function driversView() {
  const me = ME();
  const signed = S.signed.map(s => D(s.id));
  return `<h1 class="h1">车手</h1><p class="lede">士气影响单圈表现；被车队指令要求让车、输给队友或频繁退赛都会让士气下降。替补车手会在正式车手受伤时上阵。</p>
  <div class="grid g2">${me.drivers.map((id, i) => driverCard(id, i === 0 ? '一号车手' : '二号车手')).join('')}
  ${me.reserve ? driverCard(me.reserve, '替补车手') : `<div class="card"><h3>替补车手</h3><div class="bd"><p class="muted">没有签约替补。正式车手受伤时，系统会临时找一位自由车手顶替。</p><button class="btn" data-act="go" data-v="market">去车手市场</button></div></div>`}
  ${signed.length ? `<div class="card"><h3>已签约 · 等待加盟</h3><div class="bd stack">${signed.map(d => `<div class="row">${dLink(d.id)} ${ovCell(ovr(d))}<span class="muted">${d.team ? T(d.team).name + ' · 下赛季加盟' : '自由身'}</span><span class="sp"></span>${!d.team || d.team === S.me ? `<button class="btn sm" data-act="place" data-id="${d.id}" data-slot="0">替换 ${D(me.drivers[0]).code}</button><button class="btn sm" data-act="place" data-id="${d.id}" data-slot="1">替换 ${D(me.drivers[1]).code}</button><button class="btn sm" data-act="place" data-id="${d.id}" data-slot="res">设为替补</button>` : ''}</div>`).join('')}</div></div>` : ''}
  </div>`;
}

/* ---------- R&D ---------- */
function rdView() {
  const me = ME(), left = S.cal.length - S.round, baseLeft = capBase(me) / S.cal.length * left;
  const avail = CAP - me.capSpent - baseLeft;
  const slots = rdSlots(me);
  const depts = me.works ? ['aero', 'chassis', 'pu', 'rel'] : ['aero', 'chassis', 'rel'];
  const cmp = k => {
    const arr = teamList().map(t => ({ t, v: carVal(t, k) })).sort((a, b) => b.v - a.v);
    const mx = arr[0].v, mn = arr[arr.length - 1].v - 3;
    return `<div class="card"><h3>${DEPTS[k]}<span class="sp"></span><span class="mono" style="color:var(--fg)">${carVal(me, k).toFixed(1)}</span><span class="dim">P${arr.findIndex(x => x.t.id === S.me) + 1}</span></h3><div class="bd bars">${arr.map(x => `<div class="bar ${x.t.id === S.me ? 'me' : ''}"><span>${x.t.name}</span><div class="tr"><i style="width:${(x.v - mn) / (mx - mn) * 100}%;background:${x.t.color};opacity:${x.t.id === S.me ? 1 : .55}"></i></div><b>${x.v.toFixed(1)}</b></div>`).join('')}${k === 'pu' ? `<p class="dim" style="margin:6px 0 0;font-size:12px">动力单元由供应商决定：${PUS[me.pu].name}${me.works ? '（你是厂队，可以研发）' : '（客户车队无法研发）'}。落后较多的引擎商享有 ADUO 额外研发机会。</p>` : ''}</div></div>`;
  };
  const unv = Object.entries(me.unval).filter(([, v]) => v > 0);
  return `<h1 class="h1">赛车研发</h1><p class="lede">研发支出计入成本上限（动力单元另有独立预算）。空气动力研发受风洞配额（ATR）影响：车队积分榜越靠后，风洞时间越多。新的空气动力和底盘部件需要在练习赛验证才能发挥全部效果。</p>
  ${diagCard(true)}
  <div class="grid" style="margin-top:14px">
    <div class="card"><h3>成本上限</h3><div class="bd stack" style="gap:10px">
      <div class="row"><div><div class="dim" style="font-size:11px">本季已支出</div><div class="big" style="font-size:28px">$${me.capSpent.toFixed(1)}M</div></div><span class="sp"></span><div style="text-align:right"><div class="dim" style="font-size:11px">剩余可用于研发</div><div class="big ${avail < 0 ? 'bad' : 'good'}" style="font-size:28px">${money(avail)}</div></div></div>
      ${meter(me.capSpent / CAP * 100, me.capSpent > CAP ? 'b' : '')}
      <div class="muted" style="font-size:12.5px">上限 $${CAP}M。运营、人员等固定开支每站约 ${money(capBase(me) / S.cal.length)}，剩余 ${left} 站共需约 ${money(baseLeft)}。超支 5% 以内罚款，超过 5% 将被扣除车队积分。</div>
    </div></div>
    <div class="card"><h3>研发资源</h3><div class="bd">${kv([['风洞配额 ATR', `<b class="mono">${Math.round(atr(S.me) * 100)}%</b>`], ['并行项目', `${S.projects.length} / ${slots}`], ['技术总监', ovCell(me.staff.td)], ['风洞 / 工厂', `${me.fac.tunnel} 级 / ${me.fac.factory} 级`], ['现金', money(me.cash)]])}
      ${unv.length ? `<div class="note" style="margin-top:10px"><b>未验证部件：</b>${unv.map(([k, v]) => DEPTS[k] + ' +' + v).join('、')}。目前只发挥一半效果，在练习赛安排「新部件验证」。</div>` : ''}</div></div>
  </div>
  <h2 class="h1" style="font-size:20px;margin-top:22px">研发项目</h2>
  <div class="grid">
    <div class="card"><h3>进行中</h3><div class="bd stack">${S.projects.map(p => `<div><div class="row"><b>${DEPTS[p.dept]} · ${SIZES[p.size].cn}</b><span class="sp"></span><span class="mono muted">还剩 ${p.left} 站</span></div>${meter((p.total - p.left) / p.total * 100)}<div class="dim" style="font-size:12px">预计提升约 +${p.est.toFixed(1)} · 花费 ${money(p.cost)}</div></div>`).join('') || '<div class="empty">产线空闲，开始一个新项目吧</div>'}
      ${S.builds.length ? `<div class="dim" style="font-size:12px">设施施工：${S.builds.map(b => FACS[b.k][0] + ' 还剩 ' + b.left + ' 站').join('、')}</div>` : ''}</div></div>
    <div class="card"><h3>启动新项目</h3><div class="bd flush tw"><table class="t"><thead><tr><th>部门</th>${Object.values(SIZES).map(s => `<th>${s.cn}</th>`).join('')}</tr></thead><tbody>
      ${depts.map(k => `<tr><td><b>${DEPTS[k]}</b><div class="dim" style="font-size:11.5px">当前 ${carVal(me, k).toFixed(1)}</div></td>${Object.entries(SIZES).map(([sk, s]) => { const g = projGain(me, k, sk) * DIM(carVal(me, k)); const cost = k === 'pu' ? s.cost * 1.2 : s.cost; const dis = S.projects.length >= slots || me.cash < cost; return `<td><button class="btn sm ${dis ? '' : ''}" data-act="proj" data-d="${k}" data-s="${sk}" ${dis ? 'disabled' : ''}>+${(g * .55).toFixed(1)}~${(g * 1.35).toFixed(1)}</button><div class="dim" style="font-size:11px">${money(cost)} · ${projRaces(me, sk)} 站</div></td>`; }).join('')}</tr>`).join('')}
    </tbody></table><p class="dim" style="font-size:12px;padding:0 14px 12px;margin:0">数值越高越难提升；约 10% 的项目会因风洞与赛道数据不相关而收效甚微。</p></div></div>
  </div>
  <h2 class="h1" style="font-size:20px;margin-top:22px">全场对比</h2>
  <div class="grid">${['aero', 'chassis', 'pu', 'rel'].map(cmp).join('')}</div>`;
}

function factoryView() {
  const me = ME();
  const leave = S.leave || [];
  return `<h1 class="h1">工厂与人员</h1><p class="lede">关键人员决定研发效率、策略质量和进站速度。从对手车队挖人需要支付更高的签约费，并等待竞业期结束。设施升级不计入成本上限，但需要现金。</p>

    <div class="card"><h3>设施</h3><div class="bd stack">${Object.entries(FACS).map(([k, [n, eff]]) => { const lvl = me.fac[k], b = S.builds.find(x => x.k === k); return `<div><div class="row"><b>${n}</b><span class="chip">${lvl} 级</span><span class="dim" style="font-size:12px">${eff}</span><span class="sp"></span>${lvl >= 5 ? '<span class="chip good">满级</span>' : b ? `<span class="chip warn">施工中 · 还剩 ${b.left} 站</span>` : `<button class="btn sm" data-act="fac" data-k="${k}" ${me.cash < facCost(k, lvl) ? 'disabled' : ''}>升级 ${money(facCost(k, lvl))} · 6 站</button>`}</div>${meter(lvl / 5 * 100)}</div>`; }).join('')}
      <div class="dim" style="font-size:12px">风洞每级提升空气动力项目收益约 6%；工厂 4 级起项目周期缩短 1 站，并增加并行项目数；模拟器 5 级时调校与部件验证自动完成。</div></div></div>
  </div>
  ${crewCard(me)}
  <h2 class="h1" style="font-size:20px;margin-top:22px">人才市场</h2>
  <div class="card"><div class="bd flush tw"><table class="t"><thead><tr><th>岗位</th><th>候选人</th><th>能力</th><th>现任</th><th class="n">年薪</th><th class="n">签约费</th><th>到岗</th><th></th></tr></thead><tbody>
  ${(S.cands || []).sort((a, b) => a.role.localeCompare(b.role) || b.r - a.r).map(c => `<tr><td>${STAFF[c.role]}</td><td>${c.from ? `${T(c.from).name} 现任` : '自由身'}</td><td>${ovCell(c.r)}</td><td>${ovCell(me.staff[c.role])}</td><td class="n mono">${money(c.sal)}</td><td class="n mono">${money(c.fee)}</td><td>${c.leave ? c.leave + ' 站后' : '立即'}</td><td><button class="btn sm ${c.r > me.staff[c.role] ? 'pri' : ''}" data-act="hire" data-id="${c.id}" ${me.cash < c.fee ? 'disabled' : ''}>聘用</button></td></tr>`).join('')}
  </tbody></table><p class="dim" style="font-size:12px;padding:8px 14px 12px;margin:0">候选人名单每 4 站刷新一次。年薪计入成本上限。</p></div></div>`;
}

/* ---------- finance ---------- */
function financeView() {
  const me = ME(), f = S.fin;
  const sum = k => f.reduce((a, x) => a + (x[k] || 0), 0);
  const pos = teamPos(S.me);
  return `<h1 class="h1">财务</h1><p class="lede">每站结算一次：商业与赞助收入、赞助目标奖金、周边与授权收入（取决于全球车迷数），减去运营、人员、车手薪资、引擎租赁费与设施维护。赛季结束按车队积分榜发放奖金。</p>
  <div class="grid">
    <div class="card"><h3>概况</h3><div class="bd">${kv([['现金', `<b class="mono">${money(me.cash)}</b>`], ['年度商业收入', money(me.income)], ['本季净流入', money(sum('net'))], ['赞助奖金', money(sum('bonus'))], ['周边与授权（随全球车迷数）', money(sum('merch'))], ['事故维修', money(sum('crash'))], ['预计年终奖金', `${money(PRIZE[pos - 1])}（按目前 P${pos}）`], ['引擎', me.works ? '厂队自供' : `${PUS[me.pu].name} 客户 · 每年 $16M`]])}</div></div>
    <div class="card"><h3>年终奖金表</h3><div class="bd bars">${PRIZE.map((p, i) => `<div class="bar ${i + 1 === pos ? 'me' : ''}"><span>P${i + 1}</span><div class="tr"><i style="width:${p / 140 * 100}%;background:${i + 1 === pos ? 'var(--accent)' : 'var(--line2)'}"></i></div><b>$${p}M</b></div>`).join('')}</div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>每站账目</h3><div class="bd flush tw"><table class="t"><thead><tr><th>站</th><th class="n">收入</th><th class="n">奖金</th><th class="n">周边</th><th class="n">运营+人员</th><th class="n">车手</th><th class="n">引擎</th><th class="n">设施</th><th class="n">维修</th><th class="n">净额</th></tr></thead><tbody>
  ${f.slice().reverse().map(x => `<tr><td>R${x.round + 1} ${x.gp}</td><td class="n num">${x.income.toFixed(1)}</td><td class="n num good">${x.bonus ? '+' + x.bonus.toFixed(1) : '—'}</td><td class="n num good">${x.merch ? '+' + x.merch.toFixed(1) : '—'}</td><td class="n num">−${x.base.toFixed(1)}</td><td class="n num">−${x.drivers.toFixed(1)}</td><td class="n num">${x.pufee ? '−' + x.pufee.toFixed(1) : '—'}</td><td class="n num">−${x.upkeep.toFixed(1)}</td><td class="n num ${x.crash ? 'bad' : ''}">${x.crash ? '−' + x.crash.toFixed(1) : '—'}</td><td class="n num ${x.net < 0 ? 'bad' : 'good'}">${x.net.toFixed(1)}</td></tr>`).join('') || '<tr><td colspan="10" class="empty">本赛季还没有比赛</td></tr>'}
  </tbody></table></div></div>`;
}

/* ---------- weekend ---------- */
function trackCard(tr) {
  const lvl = (v, a) => v >= a[1] ? '高' : v >= a[0] ? '中' : '低';
  const ranks = teamList().map(t => ({ id: t.id, v: carIdx(t, tr, true) })).sort((a, b) => b.v - a.v);
  const myR = ranks.findIndex(x => x.id === S.me) + 1;

function quick(kind) {

/* ---------- market ---------- */
function marketView() {

function offerModal(id) {
  const d = D(id), ask = driverAsk(d, S.me), ours = d.team === S.me;

  <div class="row" style="margin:12px 0"><span class="muted">年薪 ($M)</span><input type="number" id="offSal" step="0.5" min="0.5" value="${ask}"><span class="muted">合同年数</span><select id="offYrs"><option value="1">1 年</option><option value="2" selected>2 年</option><option value="3">3 年</option></select></div>
  <p class="dim" style="font-size:12px">要价约 ${money(ask)}。车手薪资不计入成本上限，但从现金中支付。</p>

  initInfluence(st);
  const before = st.cal.slice(0, st.round).filter(id => !TR[id]).length;
  if (st.cal.some(id => !TR[id])) { st.cal = st.cal.filter(id => TR[id]); st.round = Math.max(0, st.round - before); if (st.wk && !TR[st.wk.tr]) { S = st; setupWeekend(); } }
  return st;
}

  const ov = a.over || a.overPro;
  if (a.over) rows.push(`<div class="tline"><i>Overcut</i><span>${a.over.ok ? yes(`${D(a.over.rival).code} 刚进站，你的旧胎还快 ${a.over.delta.toFixed(1)}s/圈，多跑 1–2 圈`) : no(`${D(a.over.rival).code} 刚进站，他的新胎快 ${(-a.over.delta).toFixed(1)}s/圈，应尽快回应`)}</span></div>`);
  else if (a.overPro) rows.push(`<div class="tline"><i>Overcut</i><span>${a.overPro.ok ? yes(`对 ${D(a.overPro.rival).code}：等他先进站，你多跑 1–2 圈可赚约 ${a.overPro.gain.toFixed(1)}s${a.overPro.traffic ? '（他出站会进车流）' : ''}`) : no(`对 ${D(a.overPro.rival).code}：多跑只能赚约 ${Math.max(0, a.overPro.gain).toFixed(1)}s，不够弥补 ${a.overPro.gap.toFixed(1)}s 差距`)}</span></div>`);
  else rows.push(`<div class="tline"><i>Overcut</i><span>${no(a.under && a.under.nostop ? `${D(a.under.rival).code} 不再进站，无法 overcut` : '前方没有可利用的对手')}</span></div>`);
  if (a.clean) rows.push(`<div class="tline"><i>干净空气</i><span>${a.clean.ok && (c.stuckLaps || 0) >= 2 ? yes(`现在进站，出站前方${a.clean.free >= 99 ? '没有车' : ' ' + a.clean.free.toFixed(1) + 's 内没有车'}，可全力推约 ${a.clean.laps} 圈，多赚约 ${a.clean.gain.toFixed(1)}s`) : a.clean.stuck ? no(`出站后会落在 ${rj.behind ? D(rj.behind).code : ''} 身后 ${a.clean.free.toFixed(1)}s，同样是乱流`) : `<span class="ok">✓ 已在干净空气中</span>`}</span></div>`);
  // rivals' pit windows: who is about to stop around us
  const run = RS.order.map(id => C(RS, id)).filter(x => x.st === 'run'), ix = run.indexOf(c);
  const rw = (r, tag) => { const w = rivalWindow(RS, r); if (!w) return ''; const g = Math.abs(r.t - c.t).toFixed(1), cn = COMP[w.comp].cn;
    const when = w.just ? `<span class="no">第 ${w.just} 圈刚进站</span>` : w.none ? '<span class="dim">预计不再进站</span>' : w.must ? '<span class="no">还必须进站一次</span>' : `预计 <b>第 ${w.from}–${w.to} 圈</b> 进站${w.from - RS.lap <= 2 ? ' <span class="no">· 随时可能进</span>' : ''}`;
    return `<div class="tline"><i>${tag} ${D(r.id).code}</i><span>${g}s · ${cn} ${w.age} 圈（${Math.round(w.cond * 100)}%）· ${when}</span></div>`; };
  if (run[ix - 1]) rows.push(rw(run[ix - 1], '前车'));
  if (run[ix + 1]) rows.push(rw(run[ix + 1], '后车'));
  // team play with my other car
  const mate = RS.cars.find(x => x.mine && x !== c && x.st === 'run');
  if (mate) {
    const nxA = c.plan.stops.find(s => !s.done && s.lap > RS.lap), nxB = mate.plan.stops.find(s => !s.done && s.lap > RS.lap);
    const bh = run[ix + 1];
    if (c.tactic === 'gun' && c.gunOn) rows.push(`<div class="tline"><i>车队配合</i><span><span class="ok">✓ 正在拖住</span> ${D(c.gunOn).code}，掩护 ${D(mate.id).code}（还剩 ${Math.max(0, c.gunUntil - RS.lap)} 圈）</span></div>`);
    else if (bh && bh.tid !== c.tid && RS.lap - bh.lastPit <= 4 && RS.lap - mate.lastPit <= 8 && bh.t - c.t < 1.6 && Math.abs(bh.t - mate.t) < 10) rows.push(`<div class="tline"><i>车队配合</i><span><span class="ok">✓ 可行</span> ${D(bh.id).code} 新胎跟在你身后，正和 ${D(mate.id).code} 争位——切到「阻挡后车」可拖住他</span></div>`);
    else if (nxA && nxB && Math.abs(nxA.lap - nxB.lap) <= 1 && !RS.sc) rows.push(`<div class="tline"><i>车队配合</i><span><span class="no">⚠ 与 ${D(mate.id).code} 只差 ${Math.abs(nxA.lap - nxB.lap)} 圈进站</span>：同圈会排队，前后圈会让对手同时 undercut 两台车，建议错开 3 圈以上</span></div>`);
  }
  if (a.threat) rows.push(`<div class="tline"><i>后方威胁</i><span>${a.threat.on ? `<span class="no">⚠ ${D(a.threat.rival).code} 可以 undercut 你</span>（落后 ${a.threat.gap.toFixed(1)}s）` : `<span class="dim">${D(a.threat.rival).code} 落后 ${a.threat.gap.toFixed(1)}s，${a.threat.nostop ? '他不再进站，无 undercut 威胁' : '暂无威胁'}</span>`}</span></div>`);
  return `<div class="strat"><b>战术机会 · 策略师实时判断</b>${rows.join('')}</div>`;
}

function tyBar(comp, acc) {
  const L = isDry(comp) ? COMP[comp].life : 45, cond = clamp(1 - acc / (L * 1.15), 0, 1);
  const col = acc > L || cond < .4 ? 'var(--red)' : cond < .7 ? 'var(--yellow)' : 'var(--green)';
  return `<span class="tw-ty" title="胎况 ${Math.round(cond * 100)}%${acc > L ? '，已过性能断崖' : ''}"><i style="width:${Math.max(4, cond * 100)}%;background:${col}"></i></span>`;
}

function pitPlanBox(RS, c) {
  if (RS.done || c.st !== 'run') return '';
  const L = RS.lap;
  const pend = c.plan.stops.map((st, i) => ({ st, i })).filter(x => !x.st.done && x.st.lap > L).sort((a, b) => a.st.lap - b.st.lap);
  const opts = replan(RS, c), best = opts[0];
  const desc = st => st.length ? st.map(s => `第 ${s.lap} 圈换${COMP[s.comp].cn}`).join('，') : '不再进站，跑到终点';
  const urgent = c.force ? `<div class="pp-row proc"><span class="pp-st run">处理中</span><span>紧急进站：<b>下一圈</b>换${COMP[c.force].cn}</span><span class="sp"></span><button class="btn sm danger" data-act="cancelpit" data-id="${c.id}">取消</button></div>` : '';
  if (c.draft) {
    const rows = c.draft.map((st, i) => `<div class="pp-row"><span class="mono" style="min-width:64px">第 <b>${st.lap}</b> 圈</span><button class="btn sm" data-act="plap2" data-id="${c.id}" data-i="${i}" data-d="-1" ${st.lap <= L + 1 ? 'disabled' : ''}>−</button><button class="btn sm" data-act="plap2" data-id="${c.id}" data-i="${i}" data-d="1" ${st.lap >= RS.laps - 1 ? 'disabled' : ''}>+</button><span class="dim">换</span>${['S', 'M', 'H', 'I', 'W'].map(k => `<button class="tyc ${st.comp === k ? 'on' : ''}" data-act="pcomp2" data-id="${c.id}" data-i="${i}" data-k="${k}" title="${COMP[k].cn}">${tyre(k)}</button>`).join('')}<button class="btn sm ghost" data-act="pdel2" data-id="${c.id}" data-i="${i}">删除</button></div>`).join('');
    let cmp = '';
    if (opts.length) { const dT = planCost(RS, c, c.draft) - best.t; cmp = dT > 0.4 ? `<span class="dim">推荐方案（${desc(best.stops)}）比草稿快约 ${dT.toFixed(1)}s</span><button class="btn sm" data-act="papply" data-id="${c.id}">换成推荐</button>` : '<span class="good">草稿接近最优</span>'; }
    const tlD = stintLine(RS, c, c.draft);
    return `<div class="pplan editing"><div class="pp-h"><b>进站计划 · 编辑中</b><span class="dim">${LIVE.paused ? '比赛已暂停，' : '比赛仍在进行，'}修改要点「应用计划」才生效${LIVE.editResume ? '，应用后自动继续' : ''}</span></div>${tlD}${urgent}${rows || '<div class="dim" style="font-size:12px">草稿里没有进站（应用后将不再进站）</div>'}
      <div class="row" style="gap:6px"><button class="btn sm" data-act="padd2" data-id="${c.id}">+ 增加进站</button><button class="btn sm" data-act="pnext" data-id="${c.id}">下一圈进站</button></div>
      ${cmp ? `<div class="pp-rec">${cmp}</div>` : ''}
      <div class="row" style="gap:6px"><button class="btn pri" data-act="papplyd" data-id="${c.id}">应用计划</button><button class="btn ghost" data-act="pdiscard" data-id="${c.id}">放弃修改</button></div></div>`;
  }
  const rows = pend.map(({ st, i }) => { const n = st.lap - L; const state = n <= 1 ? `<span class="pp-st run">处理中 · 第 ${st.lap} 圈末进站</span>` : `<span class="pp-st">已下达 · 还有 ${n} 圈</span>`; return `<div class="pp-row ${n <= 1 ? 'proc' : ''}">${state}<span>第 <b>${st.lap}</b> 圈换${COMP[st.comp].cn} ${tyre(st.comp)}</span><span class="chip" style="font-size:10.5px">${st.src === 'pre' ? '赛前计划' : '比赛中修改'}</span><span class="sp"></span><button class="btn sm danger" data-act="pcancel" data-id="${c.id}" data-i="${i}">取消</button></div>`; }).join('');
  let rec = '';
  if (opts.length) { const gain = planCost(RS, c, c.plan.stops.filter(s => !s.done)) - best.t; rec = gain > 0.4 ? `<div class="pp-rec"><span>推荐：<b>${desc(best.stops)}</b>，比当前计划快约 <b class="good">${gain.toFixed(1)}s</b></span><button class="btn sm" data-act="papply" data-id="${c.id}">载入推荐</button></div>` : `<div class="pp-rec dim">当前计划接近最优（推荐：${desc(best.stops)}）</div>`; }
  const tl = stintLine(RS, c, c.force ? [{ lap: L + 1, comp: c.force }, ...pend.map(x => x.st).filter(x => x.lap > L + 1)] : pend.map(x => x.st));
  return `<div class="pplan"><div class="pp-h"><b>进站计划 · 未来全部进站</b><span class="sp"></span><button class="btn sm" data-act="pedit" data-id="${c.id}">修改计划</button><button class="btn sm" data-act="pnext" data-id="${c.id}">下一圈进站</button></div>${tl}${urgent}${rows || (c.force ? '' : '<div class="dim" style="font-size:12px">没有已下达的进站</div>')}${rec}</div>`;
}

function lapBreak(RS, c) {
  const lc = c.lc; if (!lc || RS.lap === 0 || RS.sc) return '';
  const f = (v, lab, tip) => `<span class="lb ${v > 0.005 ? 'pos' : v < -0.005 ? 'neg' : ''}" title="${tip}"><i>${lab}</i>${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(2)}</span>`;
  return `<div class="lapbrk"><b>上一圈构成（相对赛道基准，秒）</b><div class="lbs">${f(lc.pace, '车+车手', '赛车性能、车手能力、调校、状态')}${f(lc.tyre, '轮胎', '配方差异、磨损、冷胎、粒化')}${f(lc.fuel, '燃油', '剩余燃油重量')}${f(lc.evo, '赛道', '橡胶附着带来的提速')}${lc.air ? f(lc.air, c.air === 'clean' ? '干净空气' : c.air === 'dirty' ? '乱流' : '气流', c.air === 'clean' ? '前方 2 秒内没有车，下压力完整，轮胎也更省' : c.air === 'dirty' ? '紧跟前车 1 秒内，下压力损失、轮胎磨损加快' : '与前车 1–2 秒，部分受乱流影响') : ''}${lc.boost ? f(lc.boost, '超车模式', '2026 规则：距前车 1 秒内可获得额外电能') : ''}${lc.wx > 0.005 ? f(lc.wx, '天气', '湿地与轮胎不匹配') : ''}${Math.abs(lc.mode) > 0.005 ? f(lc.mode, '节奏', '进攻/保胎/阻挡') : ''}${f(lc.var + lc.inc, '波动/意外', '车手发挥、失误、受损')}</div></div>`;
}

function pendPits(RS, mini) {
  const pend = RS.cars.filter(c => c.mine && c.st === 'run' && c.force);
  if (!pend.length) return '';
  if (mini) return pend.map(c => `<span class="chip acc">${D(c.id).code} 待进站换${COMP[c.force].cn}</span><button class="btn sm danger" data-act="cancelpit" data-id="${c.id}">取消</button>`).join('');
  return `<div class="pendpit">${pend.map(c => `<div class="row"><span>已安排 <b>${D(c.id).code}</b> 下一圈进站换${COMP[c.force].cn}</span><span class="sp"></span><button class="btn sm danger" data-act="cancelpit" data-id="${c.id}">取消这次进站</button></div>`).join('')}</div>`;
}

function radarCard(RS) {
  if (RS.done) return '';
  const fc = forecast(RS), ev = fc.ev, L = RS.lap;
  const now = RS.w > 0.65 ? '全雨胎赛道' : RS.w > 0.15 ? '半雨胎赛道' : RS.w > 0.05 ? '潮湿' : '干地';
  let txt;
  if (!ev) txt = `未来 ${fc.laps.length} 圈预计无雨。`;
  else if (fc.raining) txt = `正在${RAINTXT(ev.int)}，雨还会持续约 <b>${Math.max(1, ev.end - L)} 圈</b>（预计第 ${ev.end} 圈前后停）。`;
  else txt = `预计第 <b>${ev.start}</b> 圈开始${RAINTXT(ev.int)}（约 ${ev.start - L} 圈后，可能性 <b>${Math.round(fc.prob * 100)}%</b>），持续约 ${ev.end - ev.start} 圈。`;
  // drying estimate from current temperature and wind
  const dr = dryRate(RS), wNow = fc.raining || (ev && !fc.raining) ? Math.max(RS.w, ev ? ev.int * 0.8 : 0) : RS.w;
  const dryLaps = wNow > 0.13 ? Math.ceil((wNow - 0.13) / dr) : 0;
  const dryTxt = (fc.raining || RS.w > 0.13 || ev) ? `按现在的赛道温度和风速，赛道每圈约变干 ${Math.round(dr * 100)}%。${fc.raining ? `雨停后约 <b>${dryLaps}</b> 圈可以换回干胎。` : RS.w > 0.13 ? `约 <b>${Math.ceil((RS.w - 0.13) / dr)}</b> 圈后可以换回干胎。` : ev ? `如果真的下了${RAINTXT(ev.int)}，雨停后约 ${dryLaps} 圈才能换回干胎。` : ''}` : '';
  const cross = fc.laps.find(x => x.w > 0.15), wetX = fc.laps.find(x => x.w > 0.65), dryX = RS.w > 0.15 ? fc.laps.find(x => x.w < 0.13) : null;
  const tips = [];
  const mc = RS.cars.find(x => x.mine && x.st === 'run');
  if (mc && (RS.w > 0.1 || !isDry(mc.comp) || (ev && fc.prob >= 0.4))) {
    const call = wetCall(RS, mc, fc.laps.map(x => x.w));
    if (call.comp) tips.push(`工程师判断（${D(mc.id).code}）：现在换${COMP[call.comp].cn}，算上进站预计净赚约 ${call.gain.toFixed(0)} 秒`);
    else if (call.plan && call.plan.save > 1.5) tips.push(`工程师判断（${D(mc.id).code}）：先别动，约 ${call.plan.inLaps} 圈后换${COMP[call.plan.comp].cn}最划算`);
    else if (RS.w > 0.12 && isDry(mc.comp)) tips.push(`工程师判断（${D(mc.id).code}）：湿滑时间不长，换雨胎再换回来不划算，留在干胎上`);
    else if (!isDry(mc.comp)) tips.push(`工程师判断（${D(mc.id).code}）：继续用${COMP[mc.comp].cn}`);
  }
  if (cross && RS.w <= 0.15 && fc.prob >= 0.4) tips.push(`第 ${cross.lap} 圈前后湿度超过 15%`);
  if (wetX && RS.w <= 0.65) tips.push(`第 ${wetX.lap} 圈前后可能需要全雨胎`);
  if (dryX) tips.push(`第 ${dryX.lap} 圈前后可换回干胎`);
  const cells = fc.laps.map(x => { const h = Math.max(3, Math.round(x.w * 100)); const col = x.w > 0.65 ? 'var(--blue)' : x.w > 0.15 ? '#3bb273' : x.w > 0.03 ? '#7fa7c9' : 'var(--line2)'; return `<div class="rc-cell" title="第 ${x.lap} 圈 · 预计湿度 ${Math.round(x.w * 100)}%${x.rain ? ' · 下雨' : ''}"><i style="height:${h}%;background:${col};opacity:${ev && !fc.raining ? Math.max(0.45, fc.prob) : 1}"></i>${x.lap % 5 === 0 ? `<span>${x.lap}</span>` : ''}</div>`; }).join('');
  return `<div class="card radar"><h3>天气雷达<span class="sp"></span><span class="chip ${RS.w > 0.15 ? 'warn' : ''}">现在：${now} · 湿度 ${Math.round(RS.w * 100)}%</span></h3><div class="bd stack" style="gap:8px">
    <div class="wxrow"><span>赛道 <b>${RS.tempNow || RS.temp}°C</b></span><span>风速 <b>${RS.wind} km/h</b></span><span>变干速度 <b>${Math.round(dr * 100)}%/圈</b></span></div>
    <div>${txt}${dryTxt ? ' ' + dryTxt : ''}</div>
    <div class="rc-strip"><div class="rc-line l15"><span>15% 半雨胎</span></div><div class="rc-line l65"><span>65% 全雨胎</span></div>${cells}</div>
    ${tips.length ? `<div class="dim" style="font-size:12px">${tips.join(' · ')}</div>` : ''}
    <div class="dim" style="font-size:11.5px">预报精度取决于策略主管能力（${ME().staff.strat}），越临近越准。</div>
  </div></div>`;
}

function stintLine(RS, c, stops) {
  const L = RS.lap, tot = RS.laps - L; if (tot <= 0) return '';
  const st = stops.filter(x => x.lap > L).sort((a, b) => a.lap - b.lap);
  const segs = []; let from = L, comp = c.comp;
  st.forEach(x => { segs.push([comp, x.lap - from, from]); from = x.lap; comp = x.comp; });
  segs.push([comp, RS.laps - from, from]);
  return `<div class="stl"><div class="stint">${segs.map(([k, n, f]) => `<i title="${COMP[k].cn}：第 ${f + 1}–${f + n} 圈（${n} 圈）" style="flex:${Math.max(1, n)};background:${COMP[k].col}"></i>`).join('')}</div><div class="stl-lab"><span>L${L}</span>${st.map(x => `<span style="left:${(x.lap - L) / tot * 100}%">L${x.lap}</span>`).join('')}<span style="right:0;left:auto">L${RS.laps}</span></div><div class="dim" style="font-size:11.5px">${segs.map(([k, n]) => `${COMP[k].cn} ${n} 圈`).join(' → ')}</div></div>`;
}
function boot(data) {
  if (data && data.S) { S = migrate(data.S); VIEW = data.VIEW || 'home'; if (data.LIVE && data.LIVE.RS) { LIVE = { RS: data.LIVE.RS, kind: data.LIVE.kind, paused: true, alerts: [], anim: { lap: data.LIVE.RS.lap, f: 1, ended: true } }; } }
  render();
  if (LIVE) LIVE.raf = requestAnimationFrame(liveFrame);
}
window.claude?.hot?.snapshot?.(() => ({ S, VIEW, LIVE: LIVE ? { RS: LIVE.RS, kind: LIVE.kind } : null }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
