<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>峡谷经理 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: broadcast desk — sticky scorebug bar on top, nav rail left, dense data panes right */
:root{
  --bg:#edf0f2;--panel:#fbfcfd;--panel2:#f2f5f7;--ink:#14212c;--mute:#5a6a78;--line:#d3dbe1;
  --acc:#0b7680;--acc-ink:#ffffff;--acc-soft:#d3ebec;--gold:#93690c;--gold-soft:#f2e4c1;
  --blue:#2a63c6;--red:#bf3f37;--blue-soft:rgba(42,99,198,.14);--red-soft:rgba(191,63,55,.14);
  --good:#2a7d47;--bad:#b23a32;--shade:rgba(20,33,44,.45);
  --fd:'Chakra Petch','Noto Sans SC',system-ui,sans-serif;
  --fb:'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --fm:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d141a;--panel:#141e27;--panel2:#18242f;--ink:#e3e9ee;--mute:#8d9cab;--line:#24323e;
  --acc:#3cbcb2;--acc-ink:#05282a;--acc-soft:#123a3c;--gold:#dcb252;--gold-soft:#3a2f14;
  --blue:#5b90ea;--red:#e4675f;--blue-soft:rgba(91,144,234,.18);--red-soft:rgba(228,103,95,.18);
  --good:#56c27c;--bad:#e4675f;--shade:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d141a;--panel:#141e27;--panel2:#18242f;--ink:#e3e9ee;--mute:#8d9cab;--line:#24323e;
  --acc:#3cbcb2;--acc-ink:#05282a;--acc-soft:#123a3c;--gold:#dcb252;--gold-soft:#3a2f14;
  --blue:#5b90ea;--red:#e4675f;--blue-soft:rgba(91,144,234,.18);--red-soft:rgba(228,103,95,.18);
  --good:#56c27c;--bad:#e4675f;--shade:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--fb);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
a{color:var(--acc);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num,.tbl td.n,.tbl th.n{font-family:var(--fm);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:.02em;white-space:nowrap}
.brand small{font-weight:500;color:var(--mute);font-size:12px;margin-left:6px;letter-spacing:.08em}
.status{display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:var(--mute);font-size:13px}
.status b{color:var(--ink);font-weight:600}
.play{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);padding:6px 12px;border-radius:5px;cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.warn{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.shell{display:grid;grid-template-columns:176px minmax(0,1fr);min-height:calc(100vh - 60px)}
.nav{border-right:1px solid var(--line);background:var(--panel);padding-block:12px;display:flex;flex-direction:column;gap:1px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px}
.nav a{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:5px;color:var(--ink);font-size:14px}
.nav a:hover{background:var(--panel2);text-decoration:none}
.nav a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.nav .k{font-family:var(--fd);font-size:10px;color:var(--mute);letter-spacing:.1em}
.nav .badge{font-size:11px;background:var(--gold-soft);color:var(--gold);padding:0 6px;border-radius:9px}
.main{min-width:0;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:1240px;width:100%;display:flex;flex-direction:column;gap:20px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:6px;gap:2px;
    padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .nav a{white-space:nowrap;padding:6px 10px}
  .nav .k{display:none}
  .status{order:3;flex-basis:100%}
}

h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--fd);font-size:26px;font-weight:700;line-height:1.15}
h2{font-size:17px;font-weight:700}
h3{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;font-family:var(--fd)}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--mute)}
.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}

.tb{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:20px;padding:0 6px;background:var(--tc);color:#fff;
  font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.05em;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);flex:none}
.tb.lg{min-width:64px;height:34px;font-size:16px;border-radius:5px}
.ov{display:inline-block;min-width:30px;text-align:center;font-family:var(--fm);font-weight:600;font-size:12px;padding:1px 5px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.ov.s{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.ov.a{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.ov.c{color:var(--mute)}
.pos{display:inline-block;font-size:11px;font-weight:600;padding:0 5px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.chip.acc{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.W{color:var(--good);font-weight:600}.L{color:var(--bad);font-weight:600}

.wrap-x{overflow-x:auto;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.wrap-x.tall{max-height:440px;overflow:auto}
.wrap-x.tall thead th{position:sticky;top:0;z-index:1}
.tbl tr.tot td{background:var(--panel2);font-weight:600}
.chip[title]{cursor:help}
.tbl th{font-size:11px;font-weight:600;color:var(--mute);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2);letter-spacing:.04em}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--acc)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right}
.tbl tr.me td{background:var(--acc-soft)}
.tbl tr.cut td{border-bottom:2px solid var(--acc)}
.tbl tr.dim td{opacity:.6}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-family:var(--fm);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc)}
.bar.gold i{background:var(--gold)}
.bar.warn i{background:var(--bad)}
.meter{display:grid;grid-template-columns:62px 1fr 34px;gap:8px;align-items:center;font-size:12px}
.meter .bar{height:8px}

.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .big{font-family:var(--fd);font-size:34px;font-weight:700;line-height:1}
.stat-row{display:flex;gap:26px;flex-wrap:wrap}
.stat-row div{display:flex;flex-direction:column}
.stat-row b{font-family:var(--fd);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-row span{font-size:11px;color:var(--mute);letter-spacing:.08em}

.list{display:flex;flex-direction:column}
.list > div{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;min-width:0}
.list > div:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}

/* bracket */
.bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:6px}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-width:200px}
.bcol h3{margin-bottom:2px}
.sbox{border:1px solid var(--line);border-radius:5px;background:var(--panel);font-size:13px;overflow:hidden}
.sbox .ln{display:flex;align-items:center;gap:8px;padding:5px 8px}
.sbox .ln + .ln{border-top:1px solid var(--line)}
.sbox .ln.win{font-weight:700}
.sbox .ln .sc{margin-left:auto;font-family:var(--fm)}
.sbox .gl{padding:3px 8px;background:var(--panel2);font-size:11px;display:flex;gap:8px;border-top:1px solid var(--line)}
.sbox.me{border-color:var(--acc)}

/* box score */
.sb-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.sb-head .side{display:flex;align-items:center;gap:10px}
.sb-head .side.r{justify-content:flex-end}
.sb-head .mid{text-align:center}
.sb-head .mid b{font-family:var(--fd);font-size:28px;display:block;line-height:1.1}
.sideB{border-left:3px solid var(--blue)}.sideR{border-left:3px solid var(--red)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot.b{background:var(--blue)}.dot.r{background:var(--red)}
.ch{display:inline-block;font-size:12px;padding:0 6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.evlog{display:flex;flex-direction:column;font-size:13px;max-height:360px;overflow:auto}
.evlog div{display:grid;grid-template-columns:44px 12px 1fr;gap:6px;align-items:center;padding:3px 0}
.evlog .t{font-family:var(--fm);color:var(--mute);font-size:12px}
svg text{font-family:var(--fm)}

/* modal */
#modal{display:none}
#modal:not([hidden]){position:fixed;inset:0;z-index:50;background:var(--shade);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding-block:max(30px,env(safe-area-inset-top,0px)) 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:100%;max-width:1000px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.mclose{margin-left:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:6px;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* start screen */
.start{max-width:1100px;margin:0 auto;padding-block:36px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.start h1{font-size:44px;letter-spacing:.01em}
.start .lead{max-width:62ch;color:var(--mute);font-size:15px}
.tcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tcard{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.tcard:hover{border-color:var(--acc)}
.tcard .nm{font-weight:700;font-size:15px}
.tcard .chips{display:flex;gap:4px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 14px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
.seg button + button{border-left:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
select,input[type=number],input[type=text],textarea{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:13px;max-width:100%}
textarea{width:100%;font-family:var(--fm);font-size:11px;min-height:110px}
.note{font-size:12px;color:var(--mute);border-left:3px solid var(--line);padding-left:10px;max-width:80ch}
.verdict{padding:10px 12px;border-radius:5px;font-size:13px;border:1px solid var(--line);background:var(--panel2)}
.verdict.ok{border-color:var(--good);color:var(--good)}
.verdict.no{border-color:var(--bad);color:var(--bad)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.cols2{grid-template-columns:1fr}.sb-head{grid-template-columns:1fr}.sb-head .side.r{justify-content:flex-start}}
@media (prefers-reduced-motion:no-preference){.flash{animation:fl .6s ease-out}@keyframes fl{from{background:var(--acc-soft)}to{background:transparent}}}
</style>
</head>

  Rookie:{mac:4,mec:-3},Ruler:{tf:4,con:3},knight:{mec:4},Bin:{mec:5,lan:4,con:-3},Viper:{tf:5},Zeus:{mec:5,lan:3}};

// 阵容：名字/位置/国籍/出生年/能力/r=本土身份
const TEAM_DATA=[
 {id:'GEN',name:'Gen.G',lg:'LCK',color:'#93761a',pop:88,r:'Kiin/TOP/KR/1999/87;Canyon/JNG/KR/2001/91;Chovy/MID/KR/2001/93;Ruler/BOT/KR/1998/89;Duro/SUP/KR/2002/83'},
 {id:'HLE',name:'韩华生命',lg:'LCK',color:'#cf5a14',pop:85,r:'Zeus/TOP/KR/2004/91;Kanavi/JNG/KR/2000/89;Zeka/MID/KR/2002/87;Gumayusi/BOT/KR/2002/88;Delight/SUP/KR/2002/86'},

const rnd=Math.random;
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));

const gauss=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(rnd()*a.length)];
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const mv=o=>50*Math.exp((o-65)*0.135);

function makePlayer(name,pos,nat,by,ovr,tid,res,gen){
  const rng=mulberry(hashStr(name+pos));
  const r={};let m=0;
  for(const[k]of ATTR){r[k]=(rng()-0.5)*14;m+=WT[k]*r[k]}
  const sty=STYLE[name]||{};
  for(const[k]of ATTR)r[k]=clamp(Math.round(ovr+r[k]-m+(sty[k]||0)),25,99);
  const p={id:S.nextPid++,name,pos,nat,by,tid,r,res:!!res,gen:!!gen,ten:(tid&&tid!=='FA')?Math.floor(rng()*3):0,st:null,car:[],aw:[]};
  p.ovr=calcOvr(r);p.peak=p.ovr;
  const a=S.season-by;
  const g=a<=18?14:a<=20?9:a<=22?5:a<=24?2:0;
  p.pot=Math.min(99,p.ovr+Math.round(g*(0.5+rng())));
  p.star=STARS.has(name);
  p.c={amt:Math.max(MINSAL,r5(mv(p.ovr)*(0.85+rng()*0.3)*(p.star?1.5:1)*(name==='Faker'?1.6:1))),exp:S.season+Math.floor(rng()*3)};
  p.st={reg:emptyLine(),po:emptyLine(),wld:emptyLine()};
  p.sty=pickStyle(p);p.bd=[];p.log=[];p.xp=0;p.sg=0;
  S.players[p.id]=p;refreshBadges(p);return p;
}
function parseRoster(str,tid,gen){for(const row of str.split(';')){const[n,pos,nat,by,o,f]=row.split('/');makePlayer(n,pos,nat,+by,+o,tid,f==='r',gen)}}
function genRookie(region,pos){
  const used=new Set(Object.values(S.players).map(p=>p.name));
  let n=pick(ROOKIE_NAMES);let k=2;while(used.has(n)){n=pick(ROOKIE_NAMES)+(k++)}
  const nat=region||(rnd()<.5?'KR':'CN');
  const p=makePlayer(n,pos||pick(POS),nat,S.season-ri(17,19),ri(58,72),'FA',false,true);
  p.pot=clamp(p.ovr+ri(10,26),p.ovr,96);refreshBadges(p);
  setAsk(p);return p;
}
function setAsk(p){const a=age(p);p.ask=Math.max(MINSAL,r5(mv(p.ovr)*(0.95+rnd()*0.25)*(p.star?1.5:1)));p.askY=a<=23?ri(2,3):ri(1,2)}

function initSeason(){
  for(const p of Object.values(S.players)){p.st={reg:emptyLine(),po:emptyLine(),wld:emptyLine()};p.log=[];p.sg=0}
  S.labs=[];
  for(const t of Object.values(S.teams)){t.st={sw:0,sl:0,gw:0,gl:0,str:0};t.fin={spon:0,match:0,prize:0,sal:0,tax:0};t.log=[]}
  const rr=ids=>{ids=shuffle(ids.slice());const n=ids.length,rounds=[];const arr=ids.slice();
    for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];m.push(r%2?[b,a]:[a,b])}rounds.push(m);arr.splice(1,0,arr.pop())}
    return rounds.concat(rounds.map(m=>m.map(([a,b])=>[b,a])))};
  const L1=rr(leagueTeams('LCK').map(t=>t.id)),L2=rr(leagueTeams('LPL').map(t=>t.id));
  S.sched=[];
  for(let d=0;d<Math.max(L1.length,L2.length);d++){
    const day=[];
    for(const[lg,L]of[['LCK',L1],['LPL',L2]])if(L[d])for(const[a,b]of L[d])day.push(mkSeries(a,b,3,lg));
    S.sched.push(day);
  }
  S.phase='REG';S.day=0;S.po=null;S.wld=null;
}
const mkSeries=(a,b,bo,lg)=>({id:S.nextSid++,lg,a,b,bo,sa:0,sb:0,w:null,gids:[]});

function autoStarters(t,keep){
  if(!isUser(t.id))keep=false;
  const ro=roster(t.id);const used=new Set();const st={};
  if(keep)for(const pos of POS){const p=P(t.starters[pos]);if(p&&p.tid===t.id&&!used.has(p.id)){st[pos]=p.id;used.add(p.id)}}
  for(const pos of POS){if(st[pos])continue;
    const nat=ro.filter(p=>p.pos===pos&&!used.has(p.id)).sort((a,b)=>b.ovr-a.ovr)[0];
    if(nat){st[pos]=nat.id;used.add(nat.id)}}
  for(const pos of POS){if(st[pos])continue;
    const any=ro.filter(p=>!used.has(p.id)).sort((a,b)=>b.ovr-a.ovr)[0];
    if(any){st[pos]=any.id;used.add(any.id)}}
  t.starters=st;
}
function lineup(tid){
  const t=T(tid);const L={};const used=new Set();let bad=false;
  for(const pos of POS){const p=P(t.starters[pos]);if(!p||p.tid!==tid||used.has(p.id)){bad=true;break}used.add(p.id);L[pos]=p}
  if(bad){autoStarters(t,true);return lineup2(tid)}
  return L;
}
function lineup2(tid){const t=T(tid),L={};for(const pos of POS){const p=P(t.starters[pos]);L[pos]=(p&&p.tid===tid)?p:phantom(pos)}return L}
function phantom(pos){return{id:0,name:'空缺',pos,r:{mec:40,lan:40,tf:40,mac:40,pool:40,con:40},ovr:40,st:null}}
const isStarter=p=>{const t=S.teams[p.tid];return !!t&&Object.values(t.starters).includes(p.id)};
function eff(p,pos){return p.pos===pos?p.ovr:p.ovr-12}
function teamRating(tid){const L=lineup(tid);return Math.round(POS.reduce((s,pos)=>s+PW[pos]*eff(L[pos],pos),0)/5)}
function chemOf(tid){const L=lineup(tid);return POS.reduce((s,pos)=>s+Math.min(L[pos].ten||0,2)/2,0)/5}
function foreignCount(tid,extra=[],minus=[]){
  const t=T(tid);if(t.lg!=='LPL')return 0;
  const ids=new Set(roster(tid).map(p=>p.id));minus.forEach(i=>ids.delete(i));extra.forEach(i=>ids.add(i));
  return [...ids].map(P).filter(p=>!['CN','TW','HK'].includes(p.nat)&&!p.res).length;
}

function teamCalc(tid,gn,type){
  const L=lineup(tid);let e=0,l=0,te=0,tl=0;const out=[];const big=type&&type!=='reg';
  for(const pos of POS){const p=L[pos],R=p.r,bd=p.bd||[],se=STE[p.sty]||{};
    const pen=(p.pos!==pos?12:0)+(bd.includes('pool')?0:Math.max(0,82-R.pool)*0.06*(gn-1));
    let form=gauss()*(100-R.con)*0.07*(bd.includes('rock')?.5:1)*(se.v||1);

  const dc=[0,0];const d1=pick(DRAG);let d2=pick(DRAG.filter(d=>d!==d1));const soul=pick(DRAG.filter(d=>d!==d1&&d!==d2));let soulT=-1;

    const ty=i===0?d1:i===1?d2:soul;ev.push({t,tm,ty:'drag',x:dc[tm]===4?`拿下${ty}龙，获得${soul}龙魂`:`拿下${ty}小龙（第 ${dc[tm]} 条）`});if(dc[tm]===4){soulT=tm;if(t+6<dur-1)ev.push({t:t+6,tm:rnd()<.62?tm:1-tm,ty:'elder',x:'拿下远古巨龙'})}}

function P2Champ(tid,label){for(const p of roster(tid))if(p.st&&(p.st.po.g+p.st.wld.g+p.st.reg.g)>0)p.aw.push(label)}
function awards(lg){

/* ================= 休赛期 ================= */
function toResign(){
  if(S.phase!=='DONE')return;
  const ns=S.season+1;
  for(const p of Object.values(S.players)){
    if(p.tid==='RET')continue;
    const a=ns-p.by;
    let base=a<=19?3:a<=21?2.2:a<=23?1.2:a<=25?.3:a<=27?0:a<=29?-.6:a<=31?-1.1:a<=33?-1.8:-3;
    const gp=p.st?p.st.reg.g+p.st.po.g+p.st.wld.g:0;
    if(base>0)base*=clamp((p.pot-p.ovr)/5,.3,1.6)*(gp>=40?1:gp>=20?.75:gp>=5?.55:.35);
    if(base<0)base*=(p.ovr>=88?.4:p.ovr>=84?.6:1)*(p.star?.7:1);
    const d=base+gauss()*(a>=25?1:1.6);const old=p.ovr;
    for(const[k]of ATTR){let x=d+gauss()*(a>=25?.8:1.3);if(k==='mec'&&a>=29)x-=.5;if(k==='mac'&&a>=24)x+=.4;p.r[k]=clamp(Math.round(p.r[k]+x),25,99)}
    p.ovr=calcOvr(p.r);p.peak=Math.max(p.peak,p.ovr);
    p.pot=a>=25?p.ovr:Math.max(p.ovr,Math.round(p.pot+gauss()*1.5));
    p.dlt=p.ovr-old;
    // 退役
    let pr=0;if(a>=31)pr=.06+(a-31)*.1+(p.ovr<78?.25:0);else if(a>=27&&p.ovr<72)pr=.3;else if(p.ovr<60&&a>=23)pr=.4;
    if(p.tid==='FA'&&a>=25&&p.ovr<68)pr+=.4;if(p.ovr>=85)pr*=.2;if(p.star&&p.ovr>=82)pr*=.3;if(p.star&&p.ovr>=84&&a<36)pr=0;
    if(rnd()<pr){const was=p.tid;p.tid='RET';p.retired=ns-1;
      if(p.peak>=85)S.hof.unshift({name:p.name,pos:p.pos,peak:p.peak,s:ns-1,aw:p.aw.length});
      if(S.teams[was]){news(`${p.name}（${was}）宣布退役`,isUser(was)?'L':'')}}
  }
  {const act=Object.values(S.players).filter(p=>p.tid!=='RET').sort((a,b)=>b.ovr-a.ovr).slice(0,110);const mean=act.reduce((s,p)=>s+p.ovr,0)/act.length;const sh=clamp(Math.round((80.5-mean)*.8),-2,3);
   if(sh)for(const p of Object.values(S.players)){if(p.tid==='RET')continue;if(sh<0&&ns-p.by>24)continue;for(const[k]of ATTR)p.r[k]=clamp(p.r[k]+sh,25,99);const o=p.ovr;p.ovr=calcOvr(p.r);p.dlt=(p.dlt||0)+p.ovr-o;p.pot=Math.max(p.ovr,p.pot+sh);p.peak=Math.max(p.peak,p.ovr)}}
  for(const p of Object.values(S.players)){if(p.tid==='RET')continue;const old=(p.bd||[]).slice();refreshBadges(p,ns);if(p.tid===S.userTid)for(const b of p.bd)if(!old.includes(b))news(`${p.name} 获得徽章「${BADGES[b].n}」`,'W')}
  for(const p of roster(S.userTid))if(p.dlt)news(`${p.name} 休赛期成长 ${p.dlt>0?'+':''}${p.dlt}（OVR ${p.ovr}）`,p.dlt>0?'W':'L');
  for(const p of Object.values(S.players))if(p.tid===S.userTid&&p.c.exp<=S.season){p.mood=gauss()*.15}
  for(const t of Object.values(S.teams))autoStarters(t,true);
  S.phase='RESIGN';
  toast('休赛期：处理合同到期的选手');
}
function resignAsk(p){
  const t=T(p.tid);const wp=t.st.sw/Math.max(1,t.st.sw+t.st.sl);
  const mood=.5+(wp-.5)*.8+(isStarter(p)?.15:-.25)+(t.pop-70)/150+(p.mood||0);
  const ask=Math.max(MINSAL,r5(mv(p.ovr)*(1.15-.3*clamp(mood,0,1))*(p.star?1.5:1)));
  return{ask,mood,willing:mood>.12};
}
function resign(pid,years){
  const p=P(pid);const{ask,willing}=resignAsk(p);if(!willing)return toast(`${p.name} 拒绝与球队续约`);
  const amt=r5(ask*(years===1?1.05:years===3?(age(p)<=24?1.08:.95):1));
  p.c={amt,exp:S.season+years};news(`${p.name} 续约 ${years} 年，年薪 ${money(amt)}`,'W');save();render();
}
function release(pid){
  const p=P(pid);const left=Math.max(1,p.c.exp-S.season+(offseason()?0:1));const cost=r5(p.c.amt*.5*left);
  const t=T(p.tid);t.cash-=cost;p.tid='FA';setAsk(p);p.ten=0;autoStarters(t,true);

function toFA(){
  if(S.phase!=='RESIGN')return;
  for(const t of Object.values(S.teams)){
    for(const p of roster(t.id)){if(p.c.exp>S.season)continue;
      if(isUser(t.id)){p.tid='FA';setAsk(p);p.ten=0;news(`${p.name} 合同到期，进入自由市场`);continue}
      if(!['LCK','LPL'].includes(t.lg)){p.c={amt:p.c.amt,exp:S.season+ri(1,3)};continue}
      const{ask}=resignAsk(p);const keep=(p.ovr>=72||(isStarter(p)&&p.ovr>=68))&&payroll(t.id)+ask-p.c.amt<=CAP*(p.ovr>=80?1.35:1.1)&&rnd()<.85;
      if(keep)p.c={amt:ask,exp:S.season+ri(1,3)};else{p.tid='FA';setAsk(p);p.ten=0;if(p.ovr>=80)news(`${p.name} 与 ${t.id} 合同到期，成为自由选手`)}}
    autoStarters(t,true);
  }
  for(let i=0;i<20;i++)genRookie(null,POS[i%5]);
  S.phase='FA';S.faDay=0;
  toast('自由市场开启');
}
function aiFA(prob,force){
  const teams=shuffle(Object.values(S.teams).filter(t=>['LCK','LPL'].includes(t.lg)&&!isUser(t.id)));
  for(const t of teams){
    const ro=roster(t.id);if(ro.length>=MAXR)continue;
    const need=POS.filter(pos=>!ro.some(p=>p.pos===pos));
    const room=CAP-payroll(t.id);
    const fas=roster('FA').filter(p=>foreignCount(t.id,[p.id])<=2||t.lg!=='LPL');
    let target=null;
    if(need.length){const pos=need[0];target=fas.filter(p=>p.pos===pos&&(p.ask<=room||p.ask<=MINSAL*2)).sort((a,b)=>b.ovr-a.ovr)[0];
      if(!target&&force){const g=genRookie(t.lg==='LCK'?'KR':'CN',pos);target=g}}
    else if(ro.length<6||rnd()<.35){const L=lineup(t.id);
      target=fas.filter(p=>p.ask<=room&&p.ovr>eff(L[p.pos],p.pos)+2).sort((a,b)=>b.ovr-a.ovr)[0];
      if(!target&&ro.length<6)target=fas.filter(p=>p.ask<=Math.max(room,MINSAL)).sort((a,b)=>b.pot-a.pot)[0]}
    if(target&&(force||rnd()<prob))signPlayer(target,t.id,target.ask,target.askY);
  }
}
function signPlayer(p,tid,amt,years){
  p.tid=tid;p.c={amt,exp:contractExp(years)};p.ten=0;delete p.ask;delete p.askY;autoStarters(T(tid),true);
  if(isUser(tid)||p.ovr>=78)news(`${T(tid).id} 签下 ${p.name}（${PCN[p.pos]}，OVR ${p.ovr}），${years} 年 ${money(amt)}/年`,isUser(tid)?'W':'');
}
function decayAsks(f){for(const p of roster('FA'))p.ask=Math.max(MINSAL,r5(Math.max(p.ask*f,Math.min(p.ask,mv(p.ovr)*.55))))}
function faDay(){if(S.phase!=='FA')return;S.faDay++;aiFA(.3,false);decayAsks(.95)}
function startSeason(){
  if(S.phase!=='FA')return;
  const ur=roster(S.userTid);
  if(ur.length<5){toast('你的阵容不足 5 人，先在自由市场签约');return false}
  for(let i=0;i<4;i++){aiFA(1,i===3);decayAsks(.9)}
  for(const t of Object.values(S.teams)){
    if(!['LCK','LPL'].includes(t.lg)){for(const pos of POS)if(!roster(t.id).some(p=>p.pos===pos)){const g=genRookie(t.lg==='EU'?'EU':t.lg==='NA'?'NA':'PCS',pos);g.tid=t.id;g.c={amt:MINSAL,exp:S.season+2};g.ovr=Math.max(g.ovr,70)}}
    let ro=roster(t.id);while(ro.length>MAXR&&!isUser(t.id)){const w=ro.sort((a,b)=>a.ovr-b.ovr)[0];w.tid='FA';setAsk(w);ro=roster(t.id)}
    autoStarters(t,true)}
  S.season++;
  for(const p of Object.values(S.players)){if(S.teams[p.tid])p.ten=(p.ten||0)+1;delete p.dlt;if(p.tid!=='RET')refreshBadges(p)}
  // 清理：旧比赛、远古退役选手
  S.games={};

/* ================= 交易 ================= */
function isCore(p){const ro=roster(p.tid).sort((a,b)=>b.ovr-a.ovr);return p.ovr>=84&&ro.indexOf(p)>=0&&ro.indexOf(p)<2}
function yearsLeft(p){return Math.max(1,p.c.exp-S.season+(offseason()?0:1))}
function tradeValue(p){
  const a=age(p);const yw=a<=18?.6:a<=20?.45:a<=22?.25:a<=24?.1:0;
  const base=mv(p.ovr+Math.max(0,p.pot-p.ovr)*yw)*(p.star?1.5:1);
  const left=yearsLeft(p);
  let v=base*(1+.75*left)-Math.max(0,p.c.amt-base)*left*.6;
  if(a>=29)v*=.75;
  return Math.max(10,r5(v));
}
function evalTrade(){
  const me=S.userTid,ot=UI.tradeT;if(!ot)return null;
  const give=UI.tm.map(P).filter(Boolean),get=UI.tt.map(P).filter(Boolean),cash=+UI.cash||0;
  const out={give,get,cash,errs:[]};
  if(!['REG','RESIGN','FA'].includes(S.phase))out.errs.push('季后赛与世界赛期间交易窗口关闭');
  if(!give.length&&!get.length)out.errs.push('选择要交易的选手');
  const myN=roster(me).length-give.length+get.length,otN=roster(ot).length-get.length+give.length;
  if(myN>MAXR)out.errs.push(`交易后你的阵容超过 ${MAXR} 人`);
  if(otN>MAXR)out.errs.push(`交易后对方阵容超过 ${MAXR} 人`);
  if(otN<5)out.errs.push('对方交易后不足 5 人，不会接受');
  if(foreignCount(me,get.map(p=>p.id),give.map(p=>p.id))>2)out.errs.push('LPL 外援名额上限为 2 人');
  if(foreignCount(ot,give.map(p=>p.id),get.map(p=>p.id))>2)out.errs.push('对方外援名额将超过 2 人');
  if(cash>T(me).cash)out.errs.push('俱乐部资金不足以支付转会费');
  if(cash<0)out.errs.push('转会费不能为负数');
  const sin=get.reduce((s,p)=>s+p.c.amt,0),sout=give.reduce((s,p)=>s+p.c.amt,0);
  out.sin=sin;out.sout=sout;out.after=payroll(me)-sout+sin;
  if(out.after>CAP&&sin>sout*1.25+10)out.errs.push(`超出工资帽 ${money(CAP)}：引进薪资不能超过送出薪资的 125%`);
  const vin=Math.round(give.reduce((s,p)=>s+tradeValue(p)*.9,0)+cash),vout=get.reduce((s,p)=>s+tradeValue(p)*(isCore(p)?1.4:1),0);
  let needPen=0;const otL=lineup(ot);for(const p of get){if(otL[p.pos].id!==p.id)continue;const repl=[...roster(ot).filter(q=>!UI.tt.includes(q.id)),...give].filter(q=>q.pos===p.pos).sort((a,b)=>b.ovr-a.ovr)[0];const drop=p.ovr-(repl?repl.ovr:50);if(drop>2)needPen+=tradeValue(p)*Math.min(.6,drop*.04)}
  out.vin=vin;out.vout=Math.round(vout+needPen);out.diff=Math.round(vin-(vout+needPen)*1.1);out.ok=!out.errs.length&&out.diff>=0;
  return out;
}
function doTrade(){
  const e=evalTrade();if(!e||!e.ok)return;
  const me=S.userTid,ot=UI.tradeT;
  for(const p of e.give){p.tid=ot;p.ten=0}for(const p of e.get){p.tid=me;p.ten=0}
  T(me).cash-=e.cash;T(ot).cash+=e.cash;
  autoStarters(T(me),true);autoStarters(T(ot),true);
  news(`交易完成：${me} 送出 ${e.give.map(p=>p.name).join('、')||'无'}${e.cash?` + ${money(e.cash)}转会费`:''}，从 ${ot} 得到 ${e.get.map(p=>p.name).join('、')||'无'}`,'W');
  UI.tm=[];UI.tt=[];UI.cash=0;toast('交易完成');
}

function doAct(k){

    case'home':return pHome();case'roster':return pTeam(S.userTid);case'team':return pTeam(R.a);case'sched':return pSched();
    case'stand':return pStand();case'playoffs':return pPlayoffs();case'worlds':return pWorlds();case'players':return pPlayers();
    case'trade':return pTrade();case'fa':return pFA();case'resign':return pResign();case'finance':return pFinance();
    case'summary':return pSummary();case'history':return pHistory();case'save':return pSave();case'game':return pGame(R.a);
  }}catch(e){console.error(e);return`<div class="card">页面出错：${esc(e.message)}</div>`}
  return pHome();
}

function nextSeries(){
  if(S.phase==='REG'){for(let d=S.day;d<S.sched.length;d++){const se=S.sched[d].find(s=>isUser(s.a)||isUser(s.b));if(se)return{se,d}}}
  if(S.phase==='PO'){const u=T(S.userTid);const b=S.po[u.lg];if(b&&!b.done){const se=b.rounds[b.rounds.length-1].find(s=>!s.w&&(isUser(s.a)||isUser(s.b)));if(se)return{se}}}
  if(S.phase==='WLD'&&S.wld.stage==='ko'){const cur=S.wld.ko[S.wld.ko.length-1];const se=cur.find(s=>!s.w&&(isUser(s.a)||isUser(s.b)));if(se)return{se}}
  return null;
}

function teamStatsHtml(tid){
  const rows=roster(tid).sort((a,b)=>POS.indexOf(a.pos)-POS.indexOf(b.pos)).map(p=>[p,stLine(p,'all')]).filter(r=>r[1].g);
  if(!rows.length)return'<div class="muted small">本季还没有比赛数据。</div>';
  const tot=sumLines(...rows.map(r=>r[1]));
  const tr=(name,pos,s,cls)=>`<tr class="${cls||''}"><td>${name}</td><td>${pos}</td><td class="n">${s.g}</td><td class="n">${s.g?pct(s.w/s.g):'-'}</td><td class="n">${s.k}</td><td class="n">${s.d}</td><td class="n">${s.a}</td><td class="n"><b>${kda(s)}</b></td><td class="n">${avg(s,'k')}/${avg(s,'d')}/${avg(s,'a')}</td><td class="n">${kpf(s)}</td><td class="n">${csm(s)}</td><td class="n">${rtf(s)}</td><td class="n">${s.mvp}</td></tr>`;
  return`<div class="wrap-x"><table class="tbl"><thead><tr><th>选手</th><th>位置</th><th class="n">局数</th><th class="n">胜率</th><th class="n">总击杀</th><th class="n">总阵亡</th><th class="n">总助攻</th><th class="n">KDA</th><th class="n">场均 K/D/A</th><th class="n">参团率</th><th class="n">分均补刀</th><th class="n">评分</th><th class="n">MVP</th></tr></thead><tbody>
    ${rows.map(([p,s])=>tr(pl(p),posb(p.pos),s)).join('')}${tr('全队选手合计','',{...tot,g:tot.g,w:tot.w,tk:0},'tot').replace(/<td class="n">\d+<\/td><td class="n">[^<]*<\/td>/,'<td class="n">-</td><td class="n">-</td>')}</tbody></table></div>`;
}
function teamLogHtml(tid){

}
function seriesCell(se){

}
function pSched(){return pSched0()+`<div class="sec"><h2>${T(S.userTid).id} 逐局数据</h2>${teamLogHtml(S.userTid)}</div>`}

}

  return`<div class="sbox ${isUser(se.a)||isUser(se.b)?'me':''}">${ln(se.a)}${ln(se.b)}${se.gids.length?`<div class="gl">${se.gids.map((g,i)=>`<a data-a="game" data-id="${g}">G${i+1}</a>`).join('')}<span class="muted" style="margin-left:auto">BO${se.bo}</span></div>`:`<div class="gl muted">BO${se.bo}${label?' · '+label:''}</div>`}</div>`;
}

function pPlayers(){
  let ps=Object.values(S.players).filter(p=>p.tid!=='RET');
  if(UI.plLg==='FA')ps=ps.filter(p=>p.tid==='FA');else if(UI.plLg==='OS')ps=ps.filter(p=>S.teams[p.tid]&&OVERSEAS.includes(p.tid));else if(UI.plLg!=='ALL')ps=ps.filter(p=>S.teams[p.tid]&&T(p.tid).lg===UI.plLg);
  if(UI.plPos!=='ALL')ps=ps.filter(p=>p.pos===UI.plPos);
  const stg=UI.plStage,avgM=UI.plMode==='avg';const L=p=>stLine(p,stg);
  const per=(s,k)=>s.g?(avgM?s[k]/s.g:s[k]):-1;
  const val={ovr:p=>p.ovr,pot:p=>p.pot,age:p=>age(p),sal:p=>p.tid==='FA'?p.ask:p.c.amt,val:p=>p.tid==='FA'?0:tradeValue(p),g:p=>L(p).g,wr:p=>L(p).g?L(p).w/L(p).g:-1,k:p=>per(L(p),'k'),d:p=>per(L(p),'d'),a:p=>per(L(p),'a'),
    kda:p=>{const s=L(p);return s.g?(s.k+s.a)/Math.max(1,s.d):-1},kp:p=>{const s=L(p);return s.tk?(s.k+s.a)/s.tk:-1},cs:p=>{const s=L(p);return s.min?s.cs/s.min:-1},rt:p=>{const s=L(p);return s.g?s.rt/s.g:-1},mvp:p=>L(p).mvp}[UI.plSort]||(p=>p.ovr);

  const th=(k,l)=>`<th class="n s" data-a="plsort" data-k="${k}">${l}${UI.plSort===k?(UI.plDir<0?' ↓':' ↑'):''}</th>`;
  const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-a="plf" data-f="${key}" data-v="${v}" class="${UI[key]===v?'on':''}">${l}</button>`).join('')}</div>`;

function pSave(){
  let json='';try{json=JSON.stringify(S)}catch(e){}
  return`<div class="sec"><h2>存档</h2><p class="muted small">进度自动保存在这个浏览器里。换设备时，复制下面的存档文本，在新设备粘贴载入。</p>
    <label class="field">导出存档<textarea id="exp" readonly>${esc(json)}</textarea></label><div class="row"><button class="btn" data-a="copy">复制存档</button><span class="muted small">${(json.length/1024).toFixed(0)} KB</span></div></div>
  <div class="sec"><label class="field">导入存档<textarea id="imp" placeholder="粘贴存档文本"></textarea></label><div class="row"><button class="btn" data-a="import">载入</button></div></div>
  <div class="sec"><h3>新游戏</h3><div class="row">${UI.confirmNew?'<span class="L">当前进度会被覆盖。</span><button class="btn warn" data-a="newconfirm">确认开新档</button><button class="btn" data-a="newcancel">取消</button>':'<button class="btn" data-a="newask">开始新游戏</button>'}</div></div>
  <p class="note">数据来源：Liquipedia、Leaguepedia、GosuGamers、Sheep Esports 的 2026 赛季阵容与赛果。能力值、年龄、合同为游戏估算。</p>`;
}
function goldSvg(b){
  const g=b.gold,n=g.length-1,W=640,H=170,pad=28;const mx=Math.max(3000,...g.map(Math.abs));const x=t=>pad+(W-pad-8)*t/n,y=v=>H/2-v/mx*(H/2-14);
  const pts=g.map((v,t)=>`${x(t).toFixed(1)},${y(v).toFixed(1)}`).join(' ');const area=`${x(0)},${y(0)} ${pts} ${x(n)},${y(0)}`;const uid='g'+b.id;
  const ticks=[];for(let t=0;t<=n;t+=5)ticks.push(t);
  const evs=b.ev.filter(e=>['drag','baron','elder','tower','herald'].includes(e.ty)).map(e=>`<circle cx="${x(e.t).toFixed(1)}" cy="${e.tm===0?10:H-10}" r="4" fill="${e.tm===0?'var(--blue)':'var(--red)'}"><title>${mm(e.t)} ${T(e.tm===0?b.a:b.b).id} ${e.x}</title></circle>`).join('');
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="经济差曲线"><defs><clipPath id="${uid}t"><rect x="0" y="0" width="${W}" height="${H/2}"/></clipPath><clipPath id="${uid}b"><rect x="0" y="${H/2}" width="${W}" height="${H/2}"/></clipPath></defs>
    ${ticks.map(t=>`<line x1="${x(t)}" x2="${x(t)}" y1="6" y2="${H-6}" stroke="var(--line)" stroke-width="1"/><text x="${x(t)}" y="${H/2+12}" font-size="9" fill="var(--mute)" text-anchor="middle">${t}</text>`).join('')}
    <polygon points="${area}" fill="var(--blue-soft)" clip-path="url(#${uid}t)"/><polygon points="${area}" fill="var(--red-soft)" clip-path="url(#${uid}b)"/>
    <line x1="${pad}" x2="${W-8}" y1="${H/2}" y2="${H/2}" stroke="var(--mute)" stroke-width="1"/>
    <polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="4" y="16" font-size="10" fill="var(--blue)">+${(mx/1000).toFixed(1)}k</text><text x="4" y="${H-6}" font-size="10" fill="var(--red)">+${(mx/1000).toFixed(1)}k</text>${evs}</svg>`;
}
function pGame(id){
  const b=S.games[id];if(!b)return'<div class="card">这局比赛的记录已清理（每个新赛季只保留当季对局）。</div>';
  const A=T(b.a),B=T(b.b);const tbl=si=>{const rows=b.ps.filter(q=>q[2]===si);const tk=rows.reduce((s,q)=>s+q[5],0);
    return`<div class="wrap-x ${si===0?'sideB':'sideR'}"><table class="tbl"><thead><tr><th>${tb(si===0?b.a:b.b)}</th><th>英雄</th><th class="n">K/D/A</th><th class="n">KDA</th><th class="n">参团</th><th class="n">补刀</th><th class="n">经济</th><th class="n">评分</th></tr></thead><tbody>
    ${rows.map(q=>`<tr><td>${posb(q[3])} ${P(q[0])?pl(P(q[0])):esc(q[1])}${q[11]?' <span class="chip gold">MVP</span>':''}</td><td><span class="ch">${q[4]}</span></td><td class="n">${q[5]}/${q[6]}/${q[7]}</td><td class="n">${gkda(q[5],q[6],q[7])}</td><td class="n">${tk?pct((q[5]+q[7])/tk):'-'}</td><td class="n">${q[8]}</td><td class="n">${q[9].toFixed(1)}k</td><td class="n">${q[10].toFixed(1)}</td></tr>`).join('')}${(()=>{const d=rows.reduce((x,q)=>x+q[6],0),a=rows.reduce((x,q)=>x+q[7],0),cs=rows.reduce((x,q)=>x+q[8],0),g=rows.reduce((x,q)=>x+q[9],0);return`<tr class="tot"><td>全队</td><td></td><td class="n">${tk}/${d}/${a}</td><td class="n">${gkda(tk,d,a)}</td><td></td><td class="n">${cs}</td><td class="n">${g.toFixed(1)}k</td><td></td></tr>`})()}</tbody></table></div>`};
  const ka=b.ps.filter(q=>q[2]===0).reduce((s,q)=>s+q[5],0),kb=b.ps.filter(q=>q[2]===1).reduce((s,q)=>s+q[5],0);
  return`<div class="row"><a data-a="back">← 返回</a><span class="muted small">${esc(b.label||'')} · 第 ${b.gn} 局${b.gn>1?' · Fearless：本系列已用英雄不可再选':''}</span></div>
  <div class="sb-head"><div class="side"><span class="dot b"></span>${tb(b.a,true)}<div><b>${esc(A.name)}</b><div class="small muted">蓝色方${b.w===b.a?' · 胜':''}</div></div></div>
    <div class="mid"><b class="num">${ka} : ${kb}</b><span class="muted small">击杀 · ${b.dur} 分钟</span></div>
    <div class="side r"><div style="text-align:right"><b>${esc(B.name)}</b><div class="small muted">红色方${b.w===b.b?' · 胜':''}</div></div>${tb(b.b,true)}<span class="dot r"></span></div></div>
  <div class="sec"><h3>经济差</h3><div class="card" style="padding:10px">${goldSvg(b)}<div class="small muted">上方为蓝色方领先，圆点为小龙、先锋、首塔、大龙等资源。</div></div></div>
  <div class="cols2"><div class="sec">${tbl(0)}</div><div class="sec">${tbl(1)}</div></div>
  <div class="sec"><h3>比赛事件</h3><div class="card"><div class="evlog">${b.ev.map(e=>`<div><span class="t">${mm(e.t)}</span><span class="dot ${e.tm===0?'b':'r'}"></span><span><b>${T(e.tm===0?b.a:b.b).id}</b> ${esc(e.x)}</span></div>`).join('')}</div></div></div>`;
}
function playerModal(id){
  const p=P(id);if(!p)return'';const mine=p.tid===S.userTid;const fa=p.tid==='FA';const t=S.teams[p.tid];
  const st=p.st||{reg:emptyLine(),po:emptyLine(),wld:emptyLine()};
  const room=CAP-payroll(S.userTid);const canSign=fa&&roster(S.userTid).length<MAXR&&(p.ask<=room||p.ask<=MINSAL)&&foreignCount(S.userTid,[p.id])<=2;
  const sumRow=([n,s])=>`<tr class="${n==='合计'?'tot':''}"><td>${n}</td><td class="n">${s.g}</td><td class="n">${s.g?`${s.w}-${s.g-s.w}`:'-'}</td><td class="n">${s.k} / ${s.d} / ${s.a}</td><td class="n"><b>${kda(s)}</b></td><td class="n">${avg(s,'k')}/${avg(s,'d')}/${avg(s,'a')}</td><td class="n">${kpf(s)}</td><td class="n">${csm(s)}</td><td class="n">${rtf(s)}</td><td class="n">${s.mvp}</td></tr>`;
  const log=(p.log||[]).slice().reverse();
  const career=p.car.slice().reverse();
  const tv=t&&['LCK','LPL'].includes(t.lg)?tradeValue(p)*(isCore(p)?1.4:1):0;
  return`<div class="mbox" role="dialog" aria-label="${esc(p.name)}"><div class="row">${t?tb(t.id):'<span class="chip">'+(fa?'自由选手':'已退役')+'</span>'}<h2>${esc(p.name)}</h2>${posb(p.pos)}${styChip(p)}<span class="muted small">${NAT[p.nat]||p.nat} · ${age(p)} 岁${p.star?' · 明星选手':''}</span><button class="btn sm mclose" data-a="mclose">关闭</button></div>
  <div class="cols2"><div class="sec"><div class="stat-row"><div><b>${p.ovr}</b><span>OVR</span></div><div><b>${p.pot}</b><span>潜力</span></div><div><b>${money(fa?p.ask:p.c.amt)}</b><span>${fa?'要价/年':'年薪'}</span></div><div><b>${fa?p.askY+' 年':p.c.exp}</b><span>${fa?'期望年限':'合同到期'}</span></div>${tv?`<div><b>${money(tv)}</b><span>${isCore(p)?'买断价（核心）':'买断价'}</span></div>`:''}</div>
    ${ATTR.map(([k,l])=>`<div class="meter"><span>${l}</span><div class="bar ${p.r[k]>=90?'gold':''}"><i style="width:${p.r[k]}%"></i></div><span class="num">${p.r[k]}</span></div>`).join('')}
    ${age(p)<=23&&p.ovr<p.pot?`<div class="small muted">本季比赛成长 ${p.sg>0?'+'+p.sg:'0'} · 经验 ${Math.floor(p.xp||0)}/${age(p)<=20?11:age(p)<=22?14:18} 局（季后赛、世界赛经验翻倍）</div>`:''}</div>
  <div class="sec"><h3>风格</h3><div class="small">${p.sty?`<b>${styInfo(p.sty)[1]}</b> · ${esc(styInfo(p.sty)[2])}`:'-'}</div>
    <h3>徽章</h3>${(p.bd||[]).length?`<div class="list">${p.bd.map(b=>`<div><span class="chip gold">${BADGES[b].n}</span><span class="grow small muted">${esc(BADGES[b].d)}</span></div>`).join('')}</div>`:'<div class="muted small">暂无徽章。属性达标后自动获得。</div>'}
    <h3>荣誉</h3>${p.aw.length?`<div class="row">${p.aw.slice().reverse().map(a=>`<span class="chip gold">${esc(a)}</span>`).join('')}</div>`:'<div class="muted small">暂无</div>'}
    ${fa?`<div class="row"><span class="small">${money(p.ask)} × ${p.askY} 年</span><button class="btn pri" data-a="sign" data-id="${p.id}" ${canSign?'':'disabled'}>签下</button></div>${canSign?'':'<div class="small muted">阵容已满、工资帽空间不足或外援超限</div>'}`:''}
    ${t&&!mine&&['LCK','LPL'].includes(t.lg)&&['REG','RESIGN','FA'].includes(S.phase)?`<button class="btn" data-a="tradefor" data-id="${p.id}">加入交易</button>`:''}</div></div>
  <div class="sec"><h3>${S.season} 赛季汇总</h3><div class="wrap-x"><table class="tbl"><thead><tr><th>阶段</th><th class="n">局数</th><th class="n">胜-负</th><th class="n">总 K / D / A</th><th class="n">KDA</th><th class="n">场均 K/D/A</th><th class="n">参团率</th><th class="n">分均补刀</th><th class="n">评分</th><th class="n">MVP</th></tr></thead><tbody>
    ${[['常规赛',st.reg],['季后赛',st.po],['世界赛',st.wld],['合计',sumLines(st.reg,st.po,st.wld)]].map(sumRow).join('')}</tbody></table></div></div>
  <div class="sec"><h3>逐局数据（${log.length} 局）</h3>${log.length?`<div class="wrap-x tall"><table class="tbl"><thead><tr><th>阶段</th><th>局</th><th>对手</th><th>结果</th><th>英雄</th><th class="n">K/D/A</th><th class="n">KDA</th><th class="n">参团</th><th class="n">补刀</th><th class="n">分均</th><th class="n">评分</th><th class="n">时长</th><th></th></tr></thead><tbody>
    ${log.map(r=>`<tr><td class="small">${esc(S.labs[r[14]]||'')}</td><td class="num">G${r[13]}</td><td>${tb(r[2])}</td><td class="${r[3]?'W':'L'}">${r[3]?'胜':'负'}</td><td><span class="ch">${r[4]}</span></td><td class="n">${r[5]}/${r[6]}/${r[7]}</td><td class="n">${gkda(r[5],r[6],r[7])}</td><td class="n">${r[11]?pct((r[5]+r[7])/r[11]):'-'}</td><td class="n">${r[8]}</td><td class="n">${(r[8]/r[9]).toFixed(1)}</td><td class="n">${r[10].toFixed(1)}${r[12]?' <span class="chip gold">MVP</span>':''}</td><td class="n">${r[9]}′</td><td>${r[0]&&S.games[r[0]]?`<a data-a="game" data-id="${r[0]}">详情</a>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted small">本季还没有出场。</div>'}</div>
  <div class="sec"><h3>生涯数据</h3>${career.length?`<div class="wrap-x"><table class="tbl"><thead><tr><th>赛季</th><th>队伍</th><th class="n">局数</th><th class="n">胜率</th><th class="n">总 K / D / A</th><th class="n">KDA</th><th class="n">场均 K/D/A</th><th class="n">评分</th><th class="n">季后赛</th><th class="n">世界赛</th></tr></thead><tbody>
    ${career.map(c=>{const s=sumLines(c.reg,c.po,c.wld);return`<tr><td class="num">${c.s}</td><td>${tb(c.t)}</td><td class="n">${s.g}</td><td class="n">${s.g?pct(s.w/s.g):'-'}</td><td class="n">${s.k} / ${s.d} / ${s.a}</td><td class="n"><b>${kda(s)}</b></td><td class="n">${avg(s,'k')}/${avg(s,'d')}/${avg(s,'a')}</td><td class="n">${rtf(s)}</td><td class="n">${c.po.g?`${c.po.w}-${c.po.g-c.po.w}`:'-'}</td><td class="n">${c.wld.g?`${c.wld.w}-${c.wld.g-c.wld.w}`:'-'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="muted small">完整赛季结束后记录。</div>'}</div></div>`;
}
function openModal(html){const m=document.getElementById('modal');m.innerHTML=html;m.hidden=!html}
function closeModal(){openModal('')}

/* ================= 事件 ================= */
let prevRoute=null;
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');
  if(!el){if(ev.target.id==='modal')closeModal();return}
  const a=el.dataset.a,id=el.dataset.id;
  if(['setst','schedday','trteam','trcash','trsel'].includes(a))return;
  ev.preventDefault();
  switch(a){
    case'lgsel':UI.lg=el.dataset.lg;render();break;
    case'newgame':newGame(id);R={p:'home'};save();render();break;
    case'rehire':S.userTid=id;S.owner=[];S.fired=false;news(`你接手了 ${T(id).name}`,'gold');R={p:'home'};save();render();break;
    case'go':closeModal();R={p:el.dataset.p};render();window.scrollTo(0,0);break;
    case'act':doAct(el.dataset.k);break;
    case'team':closeModal();if(id===S.userTid)R={p:'roster'};else R={p:'team',a:id};render();window.scrollTo(0,0);break;
    case'pl':openModal(playerModal(+id));break;
    case'mclose':closeModal();break;
    case'game':closeModal();prevRoute=R;R={p:'game',a:+id};render();window.scrollTo(0,0);break;
    case'back':R=prevRoute&&prevRoute.p!=='game'?prevRoute:{p:'sched'};render();break;
    case'autost':autoStarters(T(S.userTid));save();render();toast('已按能力排好首发');break;
    case'release':{const p=P(+id);if(el.dataset.c){release(+id);save();render()}else{el.dataset.c='1';el.textContent=`确认（违约金 ${money(r5(p.c.amt*.5*Math.max(1,p.c.exp-S.season+(offseason()?0:1))))}）`}break}
    case'resign':resign(+id,+el.dataset.y);break;
    case'sign':{const p=P(+id);const u=T(S.userTid);const room=CAP-payroll(u.id);
      if(roster(u.id).length>=MAXR)return toast('阵容已满');if(p.ask>room&&p.ask>MINSAL)return toast('工资帽空间不足');if(foreignCount(u.id,[p.id])>2)return toast('外援名额已满');
      signPlayer(p,u.id,p.ask,p.askY);closeModal();save();render();toast(`签下 ${p.name}`);break}
    case'plsort':{const k=el.dataset.k;if(UI.plSort===k)UI.plDir*=-1;else{UI.plSort=k;UI.plDir=k==='age'?1:-1}render();break}
    case'plf':UI[el.dataset.f]=el.dataset.v;render();break;
    case'tradewith':UI.tradeT=id;UI.tm=[];UI.tt=[];UI.cash=0;R={p:'trade'};render();break;
    case'tradefor':{const p=P(+id);if(UI.tradeT!==p.tid){UI.tradeT=p.tid;UI.tm=[];UI.tt=[];UI.cash=0}if(!UI.tt.includes(p.id))UI.tt.push(p.id);closeModal();R={p:'trade'};render();break}
    case'dotrade':doTrade();save();render();break;
    case'trclear':UI.tm=[];UI.tt=[];UI.cash=0;render();break;
    case'copy':{const ta=document.getElementById('exp');const done=()=>toast('已复制存档');try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();toast('已选中，请手动复制')})}catch(e){ta.select();toast('已选中，请手动复制')}break}
    case'import':{try{const o=JSON.parse(document.getElementById('imp').value);if(!o||o.v!==2||!o.teams)throw 0;S=o;save();R={p:'home'};render();toast('存档已载入')}catch(e){toast('存档格式不对，请粘贴完整的导出文本')}break}
    case'newask':UI.confirmNew=true;render();break;
    case'newcancel':UI.confirmNew=false;render();break;
    case'newconfirm':UI.confirmNew=false;S=null;try{localStorage.removeItem(KEY)}catch(e){}render();break;
  }
});
document.addEventListener('change',ev=>{
  const el=ev.target;const a=el.dataset&&el.dataset.a;if(!a)return;
  if(a==='setst'){const u=T(S.userTid);const pos=el.dataset.pos,pid=+el.value;for(const k of POS)if(u.starters[k]===pid&&k!==pos)u.starters[k]=u.starters[pos];u.starters[pos]=pid;save();render()}
  else if(a==='schedday'){UI.schedDay=+el.value;render()}
  else if(a==='trteam'){UI.tradeT=el.value||null;UI.tm=[];UI.tt=[];UI.cash=0;render()}
  else if(a==='trsel'){const k=el.dataset.k,id=+el.dataset.id;UI[k]=el.checked?[...UI[k],id]:UI[k].filter(x=>x!==id);render()}
  else if(a==='trcash'){UI.cash=Math.max(0,Math.round(+el.value||0));render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ================= 启动 ================= */
function start(data){S=(data&&data.S)||load();if(data&&data.R)R=data.R;render()}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S,R}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
</html>
