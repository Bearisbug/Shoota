<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: broadcast desk — sticky scorebug bar on top, nav rail left, dense data panes right */
:root{
  --bg:#edf0f2;--panel:#fbfcfd;--panel2:#f2f5f7;--ink:#14212c;--mute:#5a6a78;--line:#d3dbe1;
  --acc:#0b7680;--acc-ink:#ffffff;--acc-soft:#d3ebec;--gold:#93690c;--gold-soft:#f2e4c1;
  --blue:#2a63c6;--red:#bf3f37;--blue-soft:rgba(42,99,198,.14);--red-soft:rgba(191,63,55,.14);
  --good:#2a7d47;--bad:#b23a32;--shade:rgba(20,33,44,.45);
  --map:#c4d0c0;--map-lane:#e7ddc4;--map-river:#9dc1d4;--map-wall:#a8b8a3;
  --fd:'Chakra Petch','Noto Sans SC',system-ui,sans-serif;
  --fb:'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --fm:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d141a;--panel:#141e27;--panel2:#18242f;--ink:#e3e9ee;--mute:#8d9cab;--line:#24323e;
  --acc:#3cbcb2;--acc-ink:#05282a;--acc-soft:#123a3c;--gold:#dcb252;--gold-soft:#3a2f14;
  --blue:#5b90ea;--red:#e4675f;--blue-soft:rgba(91,144,234,.18);--red-soft:rgba(228,103,95,.18);
  --good:#56c27c;--bad:#e4675f;--shade:rgba(0,0,0,.6);--map:#17251f;--map-lane:#3c3a2c;--map-river:#173a4c;--map-wall:#0f1a15;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d141a;--panel:#141e27;--panel2:#18242f;--ink:#e3e9ee;--mute:#8d9cab;--line:#24323e;
  --acc:#3cbcb2;--acc-ink:#05282a;--acc-soft:#123a3c;--gold:#dcb252;--gold-soft:#3a2f14;
  --blue:#5b90ea;--red:#e4675f;--blue-soft:rgba(91,144,234,.18);--red-soft:rgba(228,103,95,.18);
  --good:#56c27c;--bad:#e4675f;--shade:rgba(0,0,0,.6);--map:#17251f;--map-lane:#3c3a2c;--map-river:#173a4c;--map-wall:#0f1a15;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--fb);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
a{color:var(--acc);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num,.tbl td.n,.tbl th.n{font-family:var(--fm);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:.02em;white-space:nowrap}
.brand small{font-weight:500;color:var(--mute);font-size:12px;margin-left:6px;letter-spacing:.08em}
.status{display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:var(--mute);font-size:13px}
.status b{color:var(--ink);font-weight:600}
.play{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);padding:6px 12px;border-radius:5px;cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.warn{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.shell{display:grid;grid-template-columns:176px minmax(0,1fr);min-height:calc(100vh - 60px)}
.nav{border-right:1px solid var(--line);background:var(--panel);padding-block:12px;display:flex;flex-direction:column;gap:1px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px}
.nav a{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:5px;color:var(--ink);font-size:14px}
.nav a:hover{background:var(--panel2);text-decoration:none}
.nav a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.nav .k{font-family:var(--fd);font-size:10px;color:var(--mute);letter-spacing:.1em}
.nav .badge{font-size:11px;background:var(--gold-soft);color:var(--gold);padding:0 6px;border-radius:9px}
.main{min-width:0;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:1240px;width:100%;display:flex;flex-direction:column;gap:20px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:6px;gap:2px;
    padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .nav a{white-space:nowrap;padding:6px 10px}
  .nav .k{display:none}
  .status{order:3;flex-basis:100%}
}

h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--fd);font-size:26px;font-weight:700;line-height:1.15}
h2{font-size:17px;font-weight:700}
h3{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;font-family:var(--fd)}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--mute)}
.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}

.tb{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:20px;padding:0 6px;background:var(--tc);color:#fff;
  font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.05em;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);flex:none}
.tb.lg{min-width:64px;height:34px;font-size:16px;border-radius:5px}
.ov{display:inline-block;min-width:30px;text-align:center;font-family:var(--fm);font-weight:600;font-size:12px;padding:1px 5px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.ov.s{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.ov.a{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.ov.c{color:var(--mute)}
.pos{display:inline-block;font-size:11px;font-weight:600;padding:0 5px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.chip.acc{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.W{color:var(--good);font-weight:600}.L{color:var(--bad);font-weight:600}

.wrap-x{overflow-x:auto;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.wrap-x.tall{max-height:440px;overflow:auto}
.wrap-x.tall thead th{position:sticky;top:0;z-index:1}
.tbl tr.tot td{background:var(--panel2);font-weight:600}
.chip[title]{cursor:help}
.tbl th{font-size:11px;font-weight:600;color:var(--mute);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2);letter-spacing:.04em}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--acc)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right}
.tbl tr.me td{background:var(--acc-soft)}
.tbl tr.cut td{border-bottom:2px solid var(--acc)}
.tbl tr.dim td{opacity:.6}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-family:var(--fm);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc)}
.bar.gold i{background:var(--gold)}
.bar.warn i{background:var(--bad)}
.meter{display:grid;grid-template-columns:62px 1fr 34px;gap:8px;align-items:center;font-size:12px}
.meter .bar{height:8px}

.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .big{font-family:var(--fd);font-size:34px;font-weight:700;line-height:1}
.stat-row{display:flex;gap:26px;flex-wrap:wrap}
.stat-row div{display:flex;flex-direction:column}
.stat-row b{font-family:var(--fd);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-row span{font-size:11px;color:var(--mute);letter-spacing:.08em}

.list{display:flex;flex-direction:column}
.list > div{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;min-width:0}
.list > div:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}

/* bracket */
.bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:6px}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-width:200px}
.bcol h3{margin-bottom:2px}
.sbox{border:1px solid var(--line);border-radius:5px;background:var(--panel);font-size:13px;overflow:hidden}
.sbox .ln{display:flex;align-items:center;gap:8px;padding:5px 8px}
.sbox .ln + .ln{border-top:1px solid var(--line)}
.sbox .ln.win{font-weight:700}
.sbox .ln .sc{margin-left:auto;font-family:var(--fm)}
.sbox .gl{padding:3px 8px;background:var(--panel2);font-size:11px;display:flex;gap:8px;border-top:1px solid var(--line)}
.sbox.me{border-color:var(--acc)}

/* box score */
.sb-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.sb-head .side{display:flex;align-items:center;gap:10px}
.sb-head .side.r{justify-content:flex-end}
.sb-head .mid{text-align:center}
.sb-head .mid b{font-family:var(--fd);font-size:28px;display:block;line-height:1.1}
.sideB{border-left:3px solid var(--blue)}.sideR{border-left:3px solid var(--red)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot.b{background:var(--blue)}.dot.r{background:var(--red)}
.ch{display:inline-block;font-size:12px;padding:0 6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.evlog{display:flex;flex-direction:column;font-size:13px;max-height:360px;overflow:auto}
.evlog div{display:grid;grid-template-columns:44px 12px 1fr;gap:6px;align-items:center;padding:3px 0}
.evlog .t{font-family:var(--fm);color:var(--mute);font-size:12px}
svg text{font-family:var(--fm)}

/* modal */

/* match day */
.mx-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.mx-head .grow{flex:1;min-width:160px}
.mx-score{font-family:var(--fd);font-size:28px;font-weight:700}
.mx-used{flex-basis:100%}
.pre-row{display:grid!important;grid-template-columns:44px minmax(0,1fr);gap:4px 8px;align-items:center}
.pre-row .pre-ch{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pre-row select{max-width:100%}
.field>span{font-size:12px;color:var(--mute)}
.field .seg{flex-wrap:wrap}
.chico{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:6px;background:var(--cc);color:#fff;font-weight:700;font-size:13px;flex:none;letter-spacing:-.02em}
.chico.sm{width:22px;height:22px;font-size:10px;border-radius:4px}
.chico.empty{background:var(--panel2);color:var(--mute);border:1px dashed var(--line)}
.bp-bar{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 14px;font-size:14px}
.bp-bar.mine{border-color:var(--acc);background:var(--acc-soft)}
.bp{display:grid;grid-template-columns:210px minmax(0,1fr) 210px;gap:14px;align-items:start}
.bp-team{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0}
.bp-team.turn{box-shadow:0 0 0 2px var(--acc-soft)}
.bp-team.sideB{border-left:3px solid var(--blue)}.bp-team.sideR{border-left:3px solid var(--red)}
.bp-bans{display:flex;gap:4px;flex-wrap:wrap}
.bp-ban{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 4px;border-radius:4px;border:1px dashed var(--line);font-size:11px;background:var(--panel2);color:var(--mute);text-decoration:line-through}
.bp-pick{display:grid;grid-template-columns:38px minmax(0,1fr);gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0}
.bp-pick[data-a]{cursor:pointer}.bp-pick[data-a]:hover{border-color:var(--acc)}
.bp-pick.now{border-color:var(--acc);background:var(--acc-soft)}
.bp-pick b{font-size:13px}
.bp-pool{display:flex;flex-direction:column;gap:10px;min-width:0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;max-height:460px;overflow:auto;padding:2px}
.cc{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cc .row{gap:6px;flex-wrap:nowrap}.cc b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc:hover:not(:disabled){border-color:var(--acc)}
.cc:disabled{opacity:.38;cursor:not-allowed}
.cc .pf{font-family:var(--fm);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.chip{cursor:pointer;font:inherit;font-size:12px}
.bp-comp{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
@media (max-width:980px){.bp{grid-template-columns:1fr 1fr}.bp-pool{grid-column:1/-1;order:3}}
.mx-bug{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.mx-bug .sd{display:flex;align-items:center;gap:12px;min-width:0}
.mx-bug .sd.r{justify-content:flex-end;text-align:right}.mx-bug .sd.r .row{justify-content:flex-end}
.mx-bug .k{font-family:var(--fd);font-size:34px;font-weight:700;min-width:44px;text-align:center}
.mx-bug .clock{text-align:center}.mx-bug .clock .num{font-size:22px;font-weight:600}
.mx-drag{display:flex;gap:3px;min-height:12px}.mx-bug .sd.r .mx-drag{justify-content:flex-end}
.dg{display:inline-block;width:11px;height:11px;border-radius:50%}
.mx-main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.mx-mapw{position:relative;width:100%;max-width:640px;aspect-ratio:1/1;justify-self:center}
#mapc{width:100%;height:100%;display:block;border-radius:8px;border:1px solid var(--line);background:var(--map)}
.mx-prompt{position:absolute;left:12px;right:12px;bottom:12px;background:var(--panel);border:2px solid var(--acc);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.mx-opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mx-opt{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.mx-opt:hover{border-color:var(--acc);background:var(--acc-soft)}
.mx-opt b{font-size:14px}.mx-opt span{font-size:12px;color:var(--mute)}
.mx-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.mx-feed{max-height:380px;overflow:auto;font-size:13px;display:flex;flex-direction:column}
.mx-feed>div,.evlog>div{display:grid;grid-template-columns:44px 12px minmax(0,1fr);gap:6px;align-items:baseline;padding:3px 0;border-bottom:1px dashed var(--line)}
.mx-feed .t{font-family:var(--fm);color:var(--mute);font-size:12px}
.mx-feed .big{font-weight:600}.mx-feed .kl,.evlog .kl{color:var(--mute);font-size:12px}
tr.dead td{opacity:.45}
.mx-res{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px}
.mx-res.win{border-left:4px solid var(--good)}.mx-res.lose{border-left:4px solid var(--bad)}
.mx-res h1{font-size:34px}
@media (max-width:900px){.mx-main{grid-template-columns:minmax(0,1fr)}.mx-bug{grid-template-columns:1fr 1fr}.mx-bug .clock{grid-column:1/-1;order:-1}}
#mx-gold svg,.gold-wrap svg{max-height:210px;display:block;margin:0 auto}
@media (max-width:860px){.top{position:static}body::before{display:none}}

.bp-ph{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.bp-steps{display:flex;gap:6px;flex-wrap:wrap}
.bp-step{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 8px 3px 6px;border-radius:4px;border:1px solid var(--line);background:var(--panel2)}
.bp-step i{font-style:normal;font-family:var(--fm);color:var(--mute);font-size:11px}
.bp-step small{color:var(--mute)}
.bp-step.b{border-left:3px solid var(--blue)}.bp-step.r{border-left:3px solid var(--red)}
.bp-step.bn span{color:var(--mute);text-decoration:line-through}
.mu{display:flex;flex-direction:column}
.mu-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px 12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.mu-h{font-size:12px;color:var(--mute);padding:4px 0}
.mu-side{display:flex;gap:8px;align-items:center;min-width:0}.mu-side.r{flex-direction:row-reverse;text-align:right}
.mu-mid{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;min-width:72px}
.mu-why{grid-column:1/-1;text-align:center}
ul.cn{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:3px}
@media (max-width:600px){.mu-row{grid-template-columns:1fr}.mu-side.r{flex-direction:row;text-align:left}.mu-mid{flex-direction:row;justify-content:flex-start}.mu-why{text-align:left}}

.mx-node{gap:12px}
.nd-res{font-size:13px;padding:8px 10px;border-radius:6px;background:var(--acc-soft);border:1px solid var(--line)}
.nd-seg{display:flex;flex-direction:column;gap:4px}.nd-seg .mx-feed{max-height:220px}
.nd-q{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.bp-det summary{cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;list-style:none}
.bp-det summary::-webkit-details-marker{display:none}.bp-det summary::before{content:'▸';color:var(--mute)}.bp-det[open] summary::before{content:'▾'}
.bp-body{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.shell.lv-mode{grid-template-columns:minmax(0,1fr)}.shell.lv-mode .nav{display:none}.shell.lv-mode .main{max-width:1480px;margin:0 auto;padding-block:12px 40px;gap:12px}

function makePlayer(name,pos,nat,by,ovr,tid,res,gen){
  const rng=mulberry(hashStr(name+pos));
  const r={};let m=0;
  for(const[k]of ATTR){r[k]=(rng()-0.5)*14;m+=WT[k]*r[k]}
  const sty=STYLE[name]||{};
  for(const[k]of ATTR)r[k]=clamp(Math.round(ovr+r[k]-m+(sty[k]||0)),25,99);
  const p={id:S.nextPid++,name,pos,nat,by,tid,r,res:!!res,gen:!!gen,ten:(tid&&tid!=='FA')?Math.floor(rng()*3):0,st:null,car:[],aw:[]};
  p.ovr=calcOvr(r);p.peak=p.ovr;
  const a=S.season-by;
  const g=a<=18?14:a<=20?9:a<=22?5:a<=24?2:0;
  p.pot=Math.min(99,p.ovr+Math.round(g*(0.5+rng()))+(a>=25?Math.round(rng()*4)+(STARS.has(name)?3:0):0));
  if(POTFIX[name])p.pot=Math.max(p.ovr,POTFIX[name]);
  p.star=STARS.has(name);
  p.c={amt:Math.max(MINSAL,r5(mv(p.ovr)*(0.85+rng()*0.3)*(p.star?1.5:1)*(name==='Faker'?1.6:1))),exp:S.season+Math.floor(rng()*3)};
  p.st={reg:emptyLine(),po:emptyLine(),wld:emptyLine()};
  p.sty=pickStyle(p);p.bd=[];p.log=[];p.xp=0;p.sg=0;development(p);
  S.players[p.id]=p;refreshBadges(p);return p;
}

    return rounds};
  const L1=rr(leagueTeams('LCK').map(t=>t.id)),L2=rr(leagueTeams('LPL').map(t=>t.id));

function autoStarters(t,keep){
  if(!isUser(t.id))keep=false;
  const ro=roster(t.id);const used=new Set();const st={};
  const eligible=p=>t.lg!=='LPL'||!isImport(p)||Object.values(st).map(P).filter(isImport).length<2;
  if(keep)for(const pos of POS){const p=P(t.starters[pos]);if(p&&p.tid===t.id&&!used.has(p.id)&&eligible(p)){st[pos]=p.id;used.add(p.id)}}
  for(const pos of POS){if(st[pos])continue;
    const nat=ro.filter(p=>p.pos===pos&&!used.has(p.id)&&eligible(p)).sort((a,b)=>b.ovr-a.ovr)[0];
    if(nat){st[pos]=nat.id;used.add(nat.id)}}
  for(const pos of POS){if(st[pos])continue;
    const any=ro.filter(p=>!used.has(p.id)&&eligible(p)).sort((a,b)=>b.ovr-a.ovr)[0];
    if(any){st[pos]=any.id;used.add(any.id)}}
  t.starters=st;
}
function lineup(tid){
  const t=T(tid);const L={};const used=new Set();let bad=false;
  for(const pos of POS){const p=P(t.starters[pos]);if(!p||p.tid!==tid||used.has(p.id)||(t.lg==='LPL'&&foreignCount(tid)>2)){bad=true;break}used.add(p.id);L[pos]=p}
  if(bad){autoStarters(t,true);return lineup2(tid)}
  return L;

function toResign(){

    const gp=p.st?p.st.reg.g+p.st.po.g+p.st.wld.g:0;
    if(base>0)base*=clamp((p.pot-p.ovr)/12,0,1)*(gp>=40?.8:gp>=20?.6:gp>=5?.4:.2)*devMult(p.tid)*development(p).learning*(.35+development(p).drive/100);
    if(base<0)base*=(p.ovr>=88?.4:p.ovr>=84?.6:1)*(p.star?.7:1);
    const d=base+clamp(gauss(),-1,1)*(a>=25?.35:.4);const old=p.ovr,ceiling=Math.max(p.ovr,p.pot);
    for(const[k]of ATTR){let x=d+clamp(gauss(),-1,1)*.3;if(k==='mec'&&a>=29)x-=.4;if(k==='mac'&&a>=24)x+=.15;const before=p.r[k];p.r[k]=clamp(Math.round(p.r[k]+x),25,99);if(calcOvr(p.r)>ceiling)p.r[k]=before}
    p.ovr=calcOvr(p.r);p.peak=Math.max(p.peak,p.ovr);
    p.pot=Math.max(p.ovr,p.pot);

    if(p.tid==='FA'&&a>=25&&p.ovr<68)pr+=.4;if(p.ovr>=85)pr*=.2;if(p.star&&p.ovr>=82)pr*=.3;if(p.star&&p.ovr>=84&&a<36)pr=0;

      if(p.peak>=85)S.hof.unshift({name:p.name,pos:p.pos,peak:p.peak,s:ns-1,aw:p.aw.length});
      if(S.teams[was]){news(`${p.name}（${was}）宣布退役`,isUser(was)?'L':'')}}
  }

function aiFA(prob,force){
  const teams=shuffle(Object.values(S.teams).filter(t=>['LCK','LPL'].includes(t.lg)&&!isUser(t.id)));
  for(const t of teams){
    const ro=roster(t.id);

    const room=Math.max(0,t.cash)+baseIncome(t)-annualCost(t);
    const fas=roster('FA').filter(p=>foreignCount(t.id,[p.id])<=2||t.lg!=='LPL');
    let target=null;
    if(need.length){const pos=need[0];target=fas.filter(p=>p.pos===pos&&(p.ask<=room||p.ask<=MINSAL*2)).sort((a,b)=>b.ovr-a.ovr)[0];
      if(!target&&force){const g=genRookie(t.lg==='LCK'?'KR':'CN',pos);target=g}}
    else if(ro.length<6||rnd()<.35){const L=lineup(t.id);
      target=fas.filter(p=>p.ask<=room&&p.ovr>eff(L[p.pos],p.pos)+2).sort((a,b)=>b.ovr-a.ovr)[0];
      if(!target&&ro.length<6)target=fas.filter(p=>p.ask<=Math.max(room,MINSAL)).sort((a,b)=>b.pot-a.pot)[0]}
    if(target&&(force||rnd()<prob))signPlayer(target,t.id,target.ask,target.askY);
  }
}

function isCore(p){const ro=roster(p.tid).sort((a,b)=>b.ovr-a.ovr);return p.ovr>=84&&ro.indexOf(p)>=0&&ro.indexOf(p)<2}
function isIcon(p){return p.star&&age(p)>=27&&p.ovr>=84&&(p.ten||0)>=1}
function buyout(p){const v=Math.round(tradeValue(p)*(isIcon(p)?2.5:isCore(p)?1.3:1));return isIcon(p)?Math.max(v,3000):v}
function yearsLeft(p){return Math.max(1,p.c.exp-S.season+(offseason()?0:1))}
function tradeValue(p){
  const a=age(p);const yw=a<=18?.6:a<=20?.45:a<=22?.25:a<=24?.1:0;
  const base=mv(p.ovr+Math.max(0,p.pot-p.ovr)*yw)*(p.star?1.5:1);
  const left=yearsLeft(p);
  let v=base*(.8+.5*left)-Math.max(0,p.c.amt-base)*left*.5;
  if(a>=29)v*=.75;
  return Math.max(10,r5(v));
}
function evalTrade(){
  const me=S.userTid,ot=UI.tradeT;if(!ot)return null;
  const give=UI.tm.map(P).filter(Boolean),get=UI.tt.map(P).filter(Boolean),cash=+UI.cash||0,cin=+UI.cin||0;
  const out={give,get,cash,cin,errs:[]};
  if(!['REG','RESIGN','FA'].includes(S.phase))out.errs.push('季后赛与世界赛期间交易窗口关闭');
  if(!give.length&&!get.length)out.errs.push('选择要交易的选手');
  const myN=roster(me).length-give.length+get.length,otN=roster(ot).length-get.length+give.length;
  if(otN<3)out.errs.push('对方交易后人数太少，不会接受');
  if(cash>T(me).cash)out.errs.push('俱乐部资金不足以支付转会费');
  if(cash<0||cin<0)out.errs.push('转会费不能为负数');
  if(cin>T(ot).cash)out.errs.push(`对方资金不足（现有 ${money(T(ot).cash)}）`);
  const sin=get.reduce((s,p)=>s+p.c.amt,0),sout=give.reduce((s,p)=>s+p.c.amt,0);
  out.sin=sin;out.sout=sout;out.after=payroll(me)-sout+sin;
  const vin=Math.round(give.reduce((s,p)=>s+tradeValue(p)*.9,0)+cash),vout=get.reduce((s,p)=>s+buyout(p),0);
  let needPen=0;const otL=lineup(ot);for(const p of get){if(otL[p.pos].id!==p.id)continue;const repl=[...roster(ot).filter(q=>!UI.tt.includes(q.id)),...give,...roster('FA')].filter(q=>q.pos===p.pos).sort((a,b)=>b.ovr-a.ovr)[0];const drop=p.ovr-(repl?repl.ovr:50);if(drop>2)needPen+=tradeValue(p)*Math.min(.4,drop*.03)}
  out.vin=vin;out.vout=Math.round(vout+needPen+cin);out.diff=Math.round(vin-(vout+needPen+cin)*1.05);out.ok=!out.errs.length&&out.diff>=0;
  return out;
}
function aiRefill(tid){const t=T(tid);if(!t||isUser(tid))return;
  for(const pos of POS){if(roster(tid).some(p=>p.pos===pos))continue;
    const f=roster('FA').filter(p=>p.pos===pos&&foreignCount(tid,[p.id])<=2).sort((a,b)=>b.ovr-a.ovr)[0];
    if(f){signPlayer(f,tid,f.ask,f.askY);news(`${tid} 签下 ${f.name} 补位${PCN[pos]}`)}
    else{const g=genRookie({LCK:'KR',LPL:'CN'}[t.lg]||t.lg,pos);signPlayer(g,tid,MINSAL,2)}}
  autoStarters(t)}
function doTrade(){
  const e=evalTrade();if(!e||!e.ok)return;
  const me=S.userTid,ot=UI.tradeT;
  for(const p of e.give){p.tid=ot;p.ten=0}for(const p of e.get){p.tid=me;p.ten=0}
  T(me).cash+=e.cin-e.cash;T(ot).cash+=e.cash-e.cin;financeDefaults(T(me)).transferIn+=e.cin;T(me).fin.transferOut+=e.cash;financeDefaults(T(ot)).transferIn+=e.cash;T(ot).fin.transferOut+=e.cin;
  aiRefill(ot);autoStarters(T(me),true);autoStarters(T(ot),true);
  news(`交易完成：${me} 送出 ${e.give.map(p=>p.name).join('、')||'无'}${e.cash?` + ${money(e.cash)}转会费`:''}，从 ${ot} 得到 ${e.get.map(p=>p.name).join('、')||'无'}${e.cin?` + ${money(e.cin)}转会费`:''}`,'W');
  UI.tm=[];UI.tt=[];UI.cash=0;UI.cin=0;toast('交易完成');
}

 else if(kind==='fatigue'){d.form=-3;d.formRounds=2;text='训练透支，需要恢复：短期状态 -3，持续两场系列赛。'}
 else {d.drive=clamp(d.drive+5,20,100);d.form=1;d.formRounds=2;if(p.ovr<p.pot)p.xp=Math.min(7.99,(p.xp||0)+ageGrowth(age(p)));text='主动加练，训练投入 +5；积累少量经验，短期状态 +1。'}
 d.cooldown=4;rememberDevelopment(p,text);refreshBadges(p);return text}
function developmentEvent(tid,se){const t=T(tid);if(t.devLastSeries===se.id)return;t.devLastSeries=se.id;const ro=roster(tid);for(const p of ro){const d=development(p);if(d.formRounds>0&&--d.formRounds===0)d.form=0;if(d.cooldown>0)d.cooldown--}
 if((isUser(tid)&&S.devEvent)||rnd()>=.24)return;const eligible=ro.filter(p=>development(p).cooldown===0);if(!eligible.length)return;
 const p=pick(eligible),d=development(p),z=rnd();const kind=z<.25?'late':z<.45?'fatigue':z<(.45+(100-d.drive)/170)?'slack':'grind';const text=applyLifestyle(p,kind);
 if(isUser(tid)){S.devEvent={id:`${S.season}:${se.id}:${p.id}`,pid:p.id,kind,text};news(`游戏剧情 · ${p.name}：${text}`,kind==='grind'?'W':'L')}
}
function resolveDevelopment(id,choice){const e=S.devEvent;if(!e||e.id!==id||!['talk','train','rest'].includes(choice))return;const p=P(e.pid);if(!p||p.tid!==S.userTid){S.devEvent=null;save();render();return}const d=development(p);let note;
 if(choice==='talk'){d.drive=clamp(d.drive+6,20,100);d.slack=Math.max(0,d.slack-1);note='经理谈话：投入 +6，降低持续松懈风险。'}
 else if(choice==='train'){d.drive=clamp(d.drive+3,20,100);if(p.ovr<p.pot)p.xp=Math.min(7.99,(p.xp||0)+ageGrowth(age(p)));d.form=clamp(d.form-1,-5,3);d.formRounds=Math.max(d.formRounds,1);note='专项训练：投入 +3，积累年龄对应经验，但短期状态 -1。'}
 else{d.form=0;d.formRounds=0;note='安排休息：恢复短期状态，已损失的基础能力仍需重新训练。'}
 rememberDevelopment(p,note);S.devEvent=null;save();render();toast(note)}
function formChip(p){const d=development(p);return`<span class="chip ${d.form<0?'':'acc'}" title="游戏状态，不改变基础OVR">状态 ${d.form>0?'+':''}${d.form}${d.formRounds?' · '+d.formRounds+'场':''}</span>`}
function developmentPanel(p){const d=development(p);return`<section class="sec"><h3>成长与状态</h3><div class="row"><span>训练投入 ${d.drive}/100</span><span>学习效率 ×${d.learning.toFixed(2)}</span>${formChip(p)}</div><p class="small muted">${age(p)} 岁 · 年龄成长系数 ×${ageGrowth(age(p))} · 经验 ${(p.xp||0).toFixed(1)}/8 · 本季能力变化 ${(p.sg||0)>0?'+':''}${p.sg||0}。大型赛事经验更高，接近潜力时减速。</p>${d.history.length?`<div class="list small">${d.history.map(x=>`<div>${x.season} · ${esc(x.text)}</div>`).join('')}</div>`:''}<p class="small muted">学习效率、投入及生活剧情均为游戏设定，不代表选手的现实经历。</p></section>`}
function developmentCard(){const e=S.devEvent;if(!e)return'';const p=P(e.pid);if(!p)return'';return`<section class="card"><h3>队内动态 · 游戏剧情</h3><h2>${esc(p.name)}</h2><p>${esc(e.text)}</p><div class="row">${formChip(p)}<span>训练投入 ${development(p).drive}/100</span></div><div class="row"><button class="btn" data-a="devevent" data-id="${e.id}" data-choice="talk">谈话 · 投入 +6</button><button class="btn" data-a="devevent" data-id="${e.id}" data-choice="train">专项训练 · 经验积累</button><button class="btn pri" data-a="devevent" data-id="${e.id}" data-choice="rest">休息 · 恢复状态</button></div><p class="small muted">专项训练会短暂增加疲劳。剧情仅发生在本局模拟中。</p></section>`}
function migrateDevelopment(){if(!S||S.developmentVersion===1)return;for(const p of Object.values(S.players)){development(p);const oldNeed=age(p)<=20?6:age(p)<=22?8:11;p.xp=Math.min(7.99,Math.max(0,p.xp||0)/oldNeed*8)}S.developmentVersion=1;save()}

/* ================= 启动 ================= */
function migrate(){if(!S||S.ev===2)return;for(const p of Object.values(S.players)){const f=mv(p.ovr)/mvOld(p.ovr);if(p.c)p.c.amt=Math.max(MINSAL,r5(p.c.amt*f));if(p.ask)p.ask=Math.max(MINSAL,r5(p.ask*f))}for(const t of Object.values(S.teams))t.cash=Math.round(t.cash*.58);S.ev=2;save()}
function migrate2(){if(!S)return;let ch=false;
  if(!S.coaches){initCoaches();ch=true}
  if(!S.pv){for(const p of Object.values(S.players)){if(POTFIX[p.name])p.pot=Math.max(p.pot,POTFIX[p.name]);if(p.peak)p.pot=Math.max(p.pot,p.peak)}S.pv=1;ch=true}
  if(!S.nv){for(const p of Object.values(S.players)){if(NATMAP[p.name])p.nat=NATMAP[p.name];else if(REGN[p.nat])p.nat=rollNat(p.nat)}S.nv=1;ch=true}
  if(!S.yr){S.yr={splits:{},msi:null};S.split=S.split||3;
    for(const t of Object.values(S.teams))t.yst=['WLD','DONE','RESIGN','FA'].includes(S.phase)?{sw:t.st.sw,sl:t.st.sl,gw:t.st.gw,gl:t.st.gl}:{sw:0,sl:0,gw:0,gl:0};
    if(S.po&&S.po.LCK&&!S.po.LCK.tpl){if(S.phase==='PO')startPlayoffs();else{S.yr.splits[3]={};for(const lg of['LCK','LPL']){const b=S.po[lg];const pl_=b.place||b.seeds||[];S.yr.splits[3][lg]={c:pl_[0],r:pl_[1],fmvp:'-',place:pl_}}}}
    ch=true}
  if(ch)save()}
function start(data){S=(data&&data.S)||load();migrate();migrate2();migrateClub();migrateDevelopment();if(data&&data.R)R=data.R;if(S?.review)R={p:'review'};else if(S?.legendDraft&&(S.legendDraft.welcomePending||(!S.legendDraft.done&&S.legendDraft.pos)))R={p:'legend'};render()}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S,R}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
