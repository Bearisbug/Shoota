{id:'friend_project',followOnly:true,chapter:'友谊 · 一起做完的事',scene:'school',title:'还差最后一张海报',body:s=>`${N(s)}抱着没画完的海报来找你。${F(s,'friendship')==='close'?'你们从那次午餐以后一直要好。':'你们已经认识几年，但还不算亲密。'}明天就要展示，可你也有自己的作业。\n你们得决定，怎样把今晚分给彼此。`,options:s=>[O('together','约好一小时，一起完成','关系 +5 · 知识 +3',`你们把纸铺在地上，把最难的部分一人分一半。${N(s)}记住了这次有人一起收尾的夜晚。`,[0,2,3,5],{flags:{friendship:'close',teamwork:true}}),O('teach','教会方法，让对方自己试试','知识 +5 · 关系 +2','你没有接过全部工作，而是在旁边讲清步骤。第二天的海报不完美，却有了对方自己的想法。',[0,1,5,2],{flags:{mentorSeed:true}})]},
{id:'stand_up',age:13,chapter:'少年 · 站在哪一边',scene:'school',title:'教室后排的笑声',body:s=>`一位同学说错了答案，后排的笑声一直没有停。你看见对方低着头，把课本边角折了又折。\n${F(s,'courage')?'小时候迈过台阶的那点勇气，好像又被需要了。':'出声会不会让自己也变成笑话？你并没有把握。'}`,options:s=>[O('speak','打断笑声，把话题接回来','关系 +4 · 幸福 −1','你说自己也曾经弄错。笑声停了，老师继续讲课。下课时，对方轻轻向你说了声谢谢。',[0,-1,1,4],{flags:{stoodUp:true}}),O('support','下课后单独陪陪对方','关系 +5','你没有在众人面前开口，但在走廊里陪对方走了一段。被理解的感觉，让那一天没那么难过。',[0,2,0,5],{flags:{quietSupport:true}})]},
{id:'interest_test',age:16,chapter:'少年 · 第一次被看见',scene:'school',title:'报名表还差一个名字',body:s=>`老师把报名表放在你面前。${I(s)}原来不只是消磨时间，也可以认真试一次。\n准备会占去几个周末。${s.tier===0?'家里还需要你帮忙，你得把时间排得更仔细。':'家人愿意支持，但结果没有人能够保证。'}`,options:s=>[O('enter','报名，给自己一次机会','知识 +5 · 健康 −2 · 开启后续','你在表格上写下名字。接下来的日子里，事情比想象中难，但第一次认真准备的经验留了下来。',[-2,3,5,0],{flags:{portfolio:true},follow:['first_result',1]}),O('practice','暂不参赛，坚持自己的练习','幸福 +4 · 知识 +3','你收起报名表，照常练习。喜欢一件事，也可以不把它立刻放进比赛里。',[0,4,3,0],{flags:{privatePassion:true}})]},
{id:'first_result',followOnly:true,chapter:'少年 · 回声',scene:'school',title:'结果公布的那个下午',body:s=>`名单上${s.stats.knowledge>45?'有你的名字，但并不在最前面':'没有你的名字'}。${N(s)}在走廊另一头等你，没有先问名次。\n作品里有你认真花过的时间。怎样看待这一次，也会影响下一次。`,options:s=>[O('feedback','去问评审，哪里还能更好','知识 +7 · 留下作品集','你带着修改意见回家。后来申请机会时，这份有修改痕迹的作品，比一张名次表更能说明你做过什么。',[0,1,7,0],{flags:{portfolio:true}}),O('celebrate','和朋友吃点东西，给努力收尾','幸福 +6 · 关系 +4','你们聊了很多比结果更重要的事。那天的遗憾没有消失，却不再占满整段记忆。',[0,6,0,4],{flags:{friendship:'close'}})]},
{id:'tuition',age:19,when:s=>s.student,chapter:'求学 · 现实的重量',scene:'school',title:'课表之外的那张账单',body:s=>`新学期的书单和住宿账单一起到了。${s.tier===0?'家里寄来的钱比上次少，电话里却仍说一切都好。':'家里愿意分担一部分，剩下的仍要自己安排。'}\n你开始明白，继续读书不仅是做题，也是在安排有限的时间和钱。`,options:s=>[O('aid','准备材料，申请学习补助','知识 +3 · 获得基准收入的 12%','你把经历写进申请，没有把困难藏起来。补助缓解了这个学期的压力，你也学会向制度和他人求助。',[0,2,3,0],{cash:.12,flags:{receivedAid:true}}),O('parttime','找一份课余工作','健康 −3 · 获得基准收入的 18%','傍晚下课后，你换上工作服。钱攒下了一些，但赶车和熬夜的疲倦也真实地落在身体上。',[-3,-1,2,2],{cash:.18,flags:{workedThroughSchool:true}})]},
{id:'first_shift',age:19,when:s=>!s.student,chapter:'谋生 · 第一次独立',scene:'work',title:'交班前的十分钟',body:s=>'第一份工作比想象中琐碎。临近交班，一件你以为做好的事又出了差错，同事正等着离开。\n没人教过你怎样在慌张的时候开口。你得决定如何收拾这个尾巴。',options:s=>[O('ask','承认疏漏，请同事教一遍','知识 +5 · 关系 +3','同事没有替你全部做完，而是带你重新走了一遍流程。下次遇到同样的问题，你已经知道该从哪里查起。',[0,0,5,3],{flags:{workTrust:true}}),O('stay','记下流程，留下来处理','健康 −2 · 知识 +6','你比平时晚回家，却把步骤写成了自己的小抄。谨慎成了你最早的一项工作习惯。',[-2,1,6,0],{flags:{carefulWorker:true}})]},
{id:'room',age:23,chapter:'独立 · 自己的一扇窗',scene:'home',title:'钥匙第一次只属于你',body:s=>`你看了两间住处。一间便宜，要通勤很久；另一间离日常生活近，但每个月都得算得更仔细。\n${F(s,'moneyHabit')==='save'?'你想起小时候那个攒钱的盒子。':'原来，成年后的自由也会以账单的形式出现。'}`,options:s=>[O('near','住得近一些，换回每天的时间','支出基准收入 10% · 幸福 +7','搬家那天，屋里只有一盏灯和几只纸箱。回家的路变短了，你终于可以在晚饭后慢慢做一点喜欢的事。',[0,7,0,0],{cash:-.1,flags:{home:'near'},follow:['home_warming',1]}),O('save','选便宜的房间，留一点余地','健康 −2 · 储备基准收入 8%','早起并不轻松，但账户里留下的余地让你安心。你把那间小房间一点一点收拾成自己的地方。',[-2,2,0,0],{cash:.08,flags:{home:'modest'},follow:['home_warming',1]})]},
{id:'home_warming',followOnly:true,chapter:'独立 · 有人来过',scene:'home',title:'第一次请朋友来吃饭',body:s=>`${N(s)}拎着一小袋水果来到你的住处。${F(s,'home')==='near'?'窗外是熟悉的街口。':'屋子不大，椅子也没有配成一套。'}锅里的东西比预想中咸了一点。\n你们围着小桌坐下，突然发现，自己真的已经长大。`,options:s=>[O('cook','一起补救这顿饭','关系 +6 · 幸福 +4','你们加了一点水，把失败的菜改成了汤。很多年后，再说起这顿饭，记住的仍是笑声。',[0,4,0,6],{flags:{friendship:'close'}}),O('walk','打包带到楼下，边走边聊','健康 +3 · 关系 +3','晚风让局促的房间变成了一整条街。你们在陌生的城市里，认出了几个可以常来的地方。',[3,3,0,3])]},
{id:'relationship_time',age:27,when:s=>!!s.partner,chapter:'爱情 · 不止是相遇',scene:'home',title:'两个人的日历',body:s=>`${P(s)}在日历上圈了一天，想和你一起出门。那天却刚好赶上工作最忙的时候。\n${s.focus==='career'?'你最近常常晚归，已经错过了好几次晚饭。':'你们很少争执，但没有说出口的期待也在慢慢累积。'}`,options:s=>[O('reserve','提前安排工作，守住这一天','关系 +9 · 收入基准 3% 的机会成本',`${P(s)}真正高兴的不是去了哪里，而是你把这一天认真留了出来。`,[0,5,0,9],{cash:-.03,flags:{partnerBond:'secure'}}),O('explain','坦白说明，约好补上的时间','关系 +3 · 一年后兑现约定','你们把失望也说了出来。承诺被写在日历上，接下来需要真正做到。',[0,0,1,3],{flags:{partnerPromise:true},follow:['promise',1]})]},
{id:'promise',followOnly:true,chapter:'爱情 · 约定的回声',scene:'park',title:'那张留在日历里的纸',body:s=>`${P(s)}整理东西时翻出去年那张纸：有空的时候，我们一起去。\n忙碌并没有自动消失。这个约定现在又回到你手里。`,options:s=>[O('go','今天就定下来','支出基准收入 5% · 关系 +10','你们终于出发。路并不远，但一个迟来的约定，因为被兑现而重新有了分量。',[0,6,0,10],{cash:-.05,flags:{partnerBond:'secure',partnerPromise:false}}),O('honest','承认做不到，一起换个计划','关系 +2 · 幸福 −2','你没有再说下次一定。你们决定从每周一起吃一顿不看手机的晚饭开始。',[0,-2,0,2],{flags:{partnerPromise:false,partnerBond:'working'}})]},
{id:'single_life',age:29,when:s=>!s.partner,chapter:'关系 · 自己的生活',scene:'park',title:'聚会散场以后',body:s=>`朋友们谈起各自的伴侣和孩子。有人关心地问：你是不是也该想想了？\n回家路上，你想起${I(s)}。独处的自由和偶尔的孤单，都不是一句话能概括的。`,options:s=>[O('community','加入一个长期兴趣小组','关系 +7 · 幸福 +4','一开始你只是坐在角落，后来渐渐有人记得你的名字。新的陪伴从固定见面的日子里长出来。',[0,4,2,7],{flags:{community:true}}),O('own','认真安排独处的生活','知识 +5 · 幸福 +5','你把房间、周末和计划重新整理了一遍。独处没有被解释成缺少什么，而成了一种你愿意经营的生活。',[0,5,5,0],{flags:{independent:true}})]},
{id:'work_boundary',age:31,when:s=>s.job!=='none',chapter:'工作 · 代价与选择',scene:'work',title:'最后一班车之前',body:s=>`项目负责人说，再坚持几个月就好了。办公室里的人越来越少，窗外的最后一班车快要开走。\n${s.partner?`${P(s)}发来消息，问饭还要不要留着。`:'你原本答应自己，今晚要做一点工作之外的事。'}`,options:s=>[O('boundary','说明能承担的范围，按时离开','健康 +6 · 关系 +3 · 可能错过额外报酬','开口并不容易，但你开始把工作完成和无限待命分开。晚上的时间重新有了一点形状。',[6,3,0,3],{flags:{boundaries:true}}),O('push','完成这个阶段，再主动休息','健康 −6 · 获得基准收入 18%','项目完成了，报酬也到账了。你在回家的车上睡着，身体没有因为任务结束就立刻恢复。',[-6,1,4,-2],{cash:.18,flags:{overworked:true},follow:['burnout',3]})]},
{id:'burnout',followOnly:true,chapter:'工作 · 透支之后',scene:'clinic',title:'不是睡一觉就能好',body:s=>'你发现自己开始忘记小事，周末也提不起精神。几年前熬过的那个项目已经没人再提，但透支留下的习惯还在。\n这一次，身体没有继续配合“再坚持一下”。',options:s=>[O('recover','认真休息并寻求帮助','支出基准收入 8% · 健康 +14','你逐渐把睡眠、饮食和休息排回日程。恢复比预想中慢，但不再每一天都靠硬撑。',[14,4,0,2],{cash:-.08,flags:{overworked:false}}),O('change','调整工作方式，减少负担','健康 +8 · 知识 +3','你和同事重新分工，把一些不必要的事情停下来。工作仍在继续，却不再占用全部的你。',[8,2,3,0],{flags:{overworked:false,boundaries:true}})]},
{id:'new_parent',age:34,when:s=>s.children.length>0,chapter:'家庭 · 学着做父母',scene:'home',title:'凌晨三点的灯',body:s=>`${child(s)}又醒了。你和${P(s)}轮流抱着孩子，谁都困得说不出完整的话。\n白天的工作不会因此暂停。爱是真实的，疲惫和手忙脚乱也同样真实。`,options:s=>[O('share','重新分工，给彼此完整的睡眠','健康 +4 · 关系 +7','你们把需要做的事写下来，开始轮流承担。没有人突然成为完美父母，但至少不再让一个人独自扛着。',[4,1,1,7],{flags:{sharedCare:true}}),O('ask_help','向可信任的人求助','支出基准收入 5% · 健康 +6','你们找到了一点外部帮助。第一次短暂休息时，你没有因为需要别人而责怪自己。',[6,3,0,4],{cash:-.05,flags:{supportNetwork:true}})]},
{id:'parent_call',age:35,when:s=>s.parents.some(p=>p.alive),chapter:'亲情 · 听见变化',scene:'home',title:'电话那头慢了一拍',body:s=>`电话里，家人又说一切都好。可聊到常去的路，你发现有些事情已经不再像以前那么容易。\n${s.country!==s.origin?'你们之间隔着很远的路程。':'回家的路一直在那里，只是你最近很少走。'}`,options:s=>[O('visit','安排一次认真陪伴','支出基准收入 4% · 关系 +8','你不再只问吃得好不好，而是陪着走了一段路、看了那些具体的困难。照顾从真正看见开始。',[0,4,1,8],{cash:-.04,flags:{parentCare:true}}),O('regular','固定联系，并安排就近帮助','关系 +6 · 知识 +2','你们约好固定的时间。那些原本随口带过的小事，开始有人记得、有人跟进。',[0,2,2,6],{flags:{parentCare:true}})]},
{id:'arrival',followOnly:true,chapter:'移居 · 重新开始',scene:'town',title:'听不懂的第一句话',body:s=>'搬到新地方后的第一段日子，比宣传里安静。你在柜台前反复确认同一个手续，背后已经排起了队。\n熟悉的能力还在，只是表达和生活的规则都要重新学习。',options:s=>[O('learn','参加本地课程，慢慢适应','知识 +7 · 关系 +4 · 支出基准收入 3%','教室里坐着同样重新开始的人。你们交换信息，也交换一些不必解释的疲惫。',[0,2,7,4],{cash:-.03,flags:{settled:true}}),O('network','先寻找同乡与邻里支持','关系 +8 · 幸福 +3','有人告诉你去哪办手续，哪家店比较实惠。陌生的城市终于有了几个能叫出名字的人。',[0,3,2,8],{flags:{settled:true}})]},
{id:'child_school',age:38,when:s=>s.children.length>0,chapter:'家庭 · 另一间教室',scene:'school',title:'这次站在校门外的是你',body:s=>`${child(s)}第一次背着书包走向校门。你想起自己六岁时的那一天——${s.story.choices.school==='home'?'当年的课堂在家里，如今是一条不同的路。':'那时候，站在身后的还是你的家人。'}\n你想叮嘱很多事情，最后却只剩下几句话。`,options:s=>[O('listen','告诉孩子：遇到困难可以说','关系 +8 · 留下信任','放学后，你先问今天有什么有趣的事，没有先问表现。孩子慢慢开始愿意讲那些很小、却很重要的烦恼。',[0,4,0,8],{flags:{childTrust:true}}),O('routine','陪着建立自己的学习习惯','知识 +4 · 关系 +4','你们一起找了一个安静的角落。帮助没有变成包办，完成作业之后还留着玩耍的时间。',[0,2,4,4],{flags:{childRoutine:true}})]},
{id:'career_offer',age:42,when:s=>s.job!=='none'&&s.job!=='retired',chapter:'事业 · 走得更远',scene:'work',title:'职务之外的那一部分',body:s=>`${s.job==='business'?'有人提出扩大你的生意，但需要更多投入。':'一个承担更多责任的机会摆在面前。'}收入可能增加，时间也会被重新切分。\n${F(s,'overworked')?'你还记得上次透支的感觉。':F(s,'boundaries')?'你已经学会为生活留边界。':'这一次，没人能替你衡量值得与否。'}`,options:s=>[O('accept','接下来，同时明确分工','健康 −3 · 年度收入系数 +12%','你接受了新职责，也把支持和分工谈清楚。事情没有因此变轻，但至少不必独自撑起全部。',[-3,3,4,0],{flags:{promotion:true},incomeBoost:.12}),O('craft','留在熟悉的位置，把手艺做深','知识 +8 · 幸福 +4','你没有把这次放弃当成失败。之后几年，别人开始因为你真正擅长的事来找你。',[0,4,8,0],{flags:{craftsmanship:true}})]},
{id:'debt',age:43,when:s=>s.cash<0,chapter:'财务 · 把日子拆小',scene:'home',title:'不再回避那个数字',body:s=>'账单已经堆了一阵子。你并不是完全不知道，只是每次打开都想先做别的事情。\n今晚，你把支出一项项列出来。困难还在，但终于有了轮廓。',options:s=>[O('plan','削减可选支出，分阶段处理','幸福 −3 · 一次节省基准收入 15%','你先从能改变的小项开始。计划没有让债务立刻消失，却让每个月不再只是被动等待。',[0,-3,4,0],{cash:.15,flags:{budgetPlan:true}}),O('talk','找可信任的人一起梳理','关系 +5 · 知识 +3','把困难说出口并没有想象中可怕。你们逐项核对，找出了几处可以停止的开支。',[0,1,3,5],{cash:.06,flags:{budgetPlan:true}})]},
{id:'mentor',age:44,when:s=>F(s,'portfolio')||F(s,'mentorSeed')||F(s,'craftsmanship'),chapter:'传承 · 被人需要',scene:'work',title:'有人问你，最初是怎么开始的',body:s=>`年轻的同事拿着一份做不好的东西来请教。你一眼就认出了那种不知从何改起的心情。\n${F(s,'portfolio')?'当年那份反复修改的作品，好像仍在你的抽屉里。':'原来，走过的弯路也会有用。'}`,options:s=>[O('mentor','留一个下午，陪对方做一遍','关系 +7 · 知识 +3','你讲起自己的错误，对方才敢拿出真正不懂的部分。之后几个月，你看见那个人一点点站稳。',[0,4,3,7],{flags:{mentored:true},follow:['student_return',15]}),O('guide','整理方法，让更多人能看懂','知识 +6 · 幸福 +3','你把习惯做的事拆成步骤，也第一次看清自己一路积累了多少东西。',[0,3,6,2],{flags:{sharedKnowledge:true}})]},
{id:'teen_child',age:48,when:s=>s.children.length>0,chapter:'亲子 · 门关上以后',scene:'home',title:'孩子有了自己的秘密',body:s=>`${child(s)}最近不再把每件事都讲给你听。那扇曾经一直敞着的门，开始轻轻关上。\n${F(s,'childTrust')?'你记得曾经答应过：遇到困难可以说。':'你想靠近，又怕自己的关心变成追问。'}`,options:s=>[O('respect','留下可以说话的空间','关系 +8 · 孩子更愿意沟通','你没有强行要一个答案，只说饭在桌上，有需要就叫我。几天后，孩子在洗碗时主动说起了一件烦心事。',[0,3,0,8],{flags:{childTrust:true}}),O('share','讲一段自己少年时的困惑','关系 +5 · 幸福 +3','孩子第一次听见你也有过不懂和犯错的时候。你们没有立刻解决问题，但距离近了一点。',[0,3,2,5],{flags:{childTrust:true}})]},
{id:'empty_nest',age:52,when:s=>s.children.length>0,chapter:'家庭 · 放手',scene:'home',title:'屋里少了一种声音',body:s=>`${child(s)}有了自己的生活，收拾东西离开家。桌上少了一副常用的碗筷，你却还会下意识多做一点饭。\n${P(s)}问你，接下来想怎样安排自己的日子。`,options:s=>[O('support','支持独立，约好固定联系','关系 +5 · 幸福 +3','你们约好联系，却不把每一次没接到电话都当成远离。新的相处方式需要慢慢练习。',[0,3,0,5],{flags:{childIndependent:true}}),O('restart','把留出来的时间还给自己','知识 +5 · 幸福 +6',`你重新拿起${I(s)}。家并没有失去意义，只是开始容纳另一种生活。`,[0,6,5,0],{flags:{rediscovered:true}})]},
{id:'old_friend',age:54,chapter:'友谊 · 很久以后',scene:'park',title:'通讯录里那个很久没拨的号码',body:s=>`${N(s)}的名字还在通讯录里。${F(s,'friendship')==='close'?'你记得午餐桌旁的位置，也记得那顿做咸了的饭。':'你们从认识到疏远，并没有发生什么戏剧性的事情。'}\n只是忙着忙着，很多年就过去了。`,options:s=>[O('call','现在就拨过去','关系 +8 · 幸福 +5','开头有一点生疏，后来话越来越多。你们发现彼此已经变化，也还有一些东西没变。',[0,5,0,8],{flags:{friendship:'renewed'}}),O('letter','写一封慢慢想过的信','知识 +2 · 关系 +5','你删去了那些客套的近况，写下真正想说的事。发出之后，心里安静了一点。',[0,3,2,5],{flags:{friendship:'renewed'}})]},
{id:'second_chance',age:57,chapter:'中年 · 没有太晚',scene:'park',title:'又一次站在门口',body:s=>`${I(s)}重新出现在生活里。附近有一个不问年龄的小组，活动时间刚好是你能空出的晚上。\n你已经不需要向所有人证明什么，但仍然会在门口迟疑。`,options:s=>[O('join','走进去，从新手做起','知识 +6 · 幸福 +7','你第一次做得很生疏，旁边的人也一样。原来重新开始不需要把从前的自己全部推翻。',[0,7,6,2],{flags:{secondPassion:true}}),O('home','按自己的节奏慢慢做','幸福 +5 · 健康 +2','你给家里腾出一个小角落。那件事不用变成职业，也不必赢过谁，只是重新让你期待明天。',[2,5,2,0],{flags:{secondPassion:true}})]},
{id:'student_return',followOnly:true,chapter:'传承 · 远处的回信',scene:'work',title:'一封没有想到会收到的信',body:s=>'多年前你帮助过的年轻人发来消息，说现在也开始带新人。信里提到一句你早已忘记说过的话。\n你没有改变整个世界，但某段经验，已经走到了你看不见的地方。',options:s=>[O('reply','认真回信，听听对方的故事','关系 +8 · 幸福 +8','你们聊起各自这些年的曲折。那些没有写进履历的下午，突然有了很长的回声。',[0,8,0,8],{flags:{legacy:'people'}}),O('keep','把这封信好好保存','幸福 +6','你把信收在重要的东西旁边。有些肯定来得很晚，仍然能照亮很长一段路。',[0,6,0,2],{flags:{legacy:'letter'}})]},
{id:'health_plan',age:61,chapter:'健康 · 与身体商量',scene:'clinic',title:'检查报告之后',body:s=>`报告没有给出简单的一句好或不好，而是列了几件需要长期留意的事。${s.stats.health<45?'你最近确实常常觉得疲惫。':'现在还来得及慢慢调整。'}\n你开始明白，照顾身体并不是一次做对，而是之后的许多天。`,options:s=>[O('follow','安排复诊，建立可坚持的作息','支出基准收入 6% · 健康 +10','你把建议拆成能做到的小事，并按时回访。变化不剧烈，却让生活重新多了一点余地。',[10,2,1,0],{cash:-.06,flags:{healthPlan:true}}),O('company','和家人朋友一起养成习惯','健康 +7 · 关系 +4','散步多了一个同伴，做饭也不再只是凑合。有人一起做，让改变更容易坚持。',[7,3,0,4],{flags:{healthPlan:true}})]},
{id:'retired_morning',age:66,when:s=>s.job==='retired',chapter:'退休 · 新的早晨',scene:'park',title:'闹钟不响的第一个星期',body:s=>'不用赶路了，你却仍然在老时间醒来。自由比想象中安静，甚至让人有一点不知所措。\n过去被工作填满的那一部分，现在需要自己重新命名。',options:s=>[O('community','去社区里做一点力所能及的事','关系 +7 · 幸福 +5','你逐渐有了新的固定约定。被需要的感觉回来了一点，却不必再以透支为代价。',[1,5,0,7],{flags:{community:true}}),O('slow','允许自己暂时没有安排','健康 +5 · 幸福 +4','你学习不把每一天都算成产出。花开了，饭做好了，今天也就有了值得记住的部分。',[5,4,0,0],{flags:{peaceful:true}})]},
{id:'memory_box',age:73,chapter:'暮年 · 留下什么',scene:'home',title:'装不下的旧盒子',body:s=>`整理柜子时，你找到了几样东西：${F(s,'portfolio')?'旧作品，':'发黄的纸，'}${F(s,'friendship')?'朋友留下的字条，':''}${s.children.length?'孩子小时候的画，':''}还有一些只有你知道来历的小物件。\n盒子放不下全部的过去。`,options:s=>[O('tell','把故事讲给愿意听的人','关系 +8 · 幸福 +5','你没有把自己讲成一个始终正确的人。那些走错的路，也成了别人可以理解你的地方。',[0,5,0,8],{flags:{legacy:'stories'}}),O('write','写下来，为记忆留一个地址','知识 +3 · 幸福 +6','你从一件很小的事开始写，没有试图总结所有意义。字慢慢变多，那些日子也重新有了声音。',[0,6,3,0],{flags:{legacy:'writing'}})]},
{id:'help_later',age:77,chapter:'暮年 · 接受陪伴',scene:'park',title:'走得慢一点，也能一起走',body:s=>'有一段路，你发现自己不再像从前那样轻松。别人伸出手时，你下意识想说不用。\n年轻时努力学会独立，现在或许也要学习另一种勇敢。',options:s=>[O('accept','接受帮助，把真实需要说出来','关系 +7 · 健康 +4','你们换了一条平缓的路。接受陪伴没有让你失去自己，反而让能去的地方多了一些。',[4,3,0,7],{flags:{acceptHelp:true}}),O('adapt','调整安排，保留能自主做的部分','健康 +5 · 幸福 +3','你找到了一种更适合现在的节奏。有些事情交给别人，有些仍然亲手完成。',[5,3,1,2],{flags:{adapted:true}})]},
{id:'ordinary_light',age:82,chapter:'暮年 · 此刻',scene:'park',title:'今天没有什么大事',body:s=>`早上的光落在熟悉的地方。${s.partner?`${P(s)}就在不远处。`:F(s,'community')?'邻里有人向你挥手。':'窗外有孩子经过。'}\n你经历过的那些选择，并没有排成一条笔直的路。它们只是一起，把你带到了这个普通的早晨。`,options:s=>[O('notice','记住眼前这一个瞬间','幸福 +7','你听了一会儿风，也听了一会儿自己的呼吸。今天没有改变一生，却仍然是这一生的一部分。',[0,7,0,0],{flags:{peaceful:true}}),O('reach','向一个人说一句想说的话','关系 +7 · 幸福 +4','那句话不宏大，只是谢谢、想念，或者今天过得怎么样。说出口以后，你觉得很好。',[0,4,0,7],{flags:{lastConnection:true}})]}
];

{id:'contract',age:28,when:s=>s.job!=='none'&&!s.student,chapter:'工作 · 不确定的时候',scene:'work',title:'合同到期的那个月',body:s=>`负责人说，下一阶段的安排还没有定。你照常完成工作，却开始在回家以后看招聘信息。\n${s.partner?P(s)+'看出了你的不安，问有没有什么可以一起商量。':'账单不会因为等待而停下来。'}你需要为不确定做一点准备。`,options:s=>[O('prepare','整理经验，寻找新的机会','知识 +6 · 暂时减少基准收入 5%','你把做过的事一项项整理出来，也联系了熟悉的同行。机会没有立刻出现，但你不再只等一个人的决定。',[0,-2,6,2],{cash:-.05,flags:{careerReady:true}}),O('negotiate','主动谈清条件，争取继续','关系 +4 · 知识 +2','你问清了期限和责任，也为自己设了一个等待的截止日期。第一次，你不再把所有安排都交给别人。',[0,1,2,4],{flags:{workTrust:true}})]},
{id:'relationship_crisis',age:39,when:s=>!!s.partner,chapter:'关系 · 走到分岔',scene:'home',title:'争执背后没说完的话',body:s=>`你和${P(s)}又因为一件小事起了争执。说到后来，才发现彼此说的并不是今天的事。\n${F(s,'sharedCare')?'分担家务并不等于已经理解了对方。':F(s,'overworked')?'长久的忙碌让很多需要落了空。':'一些原本以为会被理解的失望，已经放了很久。'}`,options:s=>[O('repair','把各自的需要说清楚，尝试修复','关系 +10 · 花时间面对分歧','你们没有在一个晚上解决所有问题，但约好具体改变的事情，而不是只说以后会更好。',[0,3,2,10],{flags:{partnerBond:'repairing'},follow:['relationship_return',3]}),O('distance','承认距离，重新商量相处边界','关系 −4 · 幸福 +2 · 仍保留伴侣关系','你们允许彼此有更多独立空间，暂时停止用争执逼出答案。这不是离婚决定，关系仍需要继续沟通。',[0,2,1,-4],{flags:{partnerBond:'distant'},follow:['relationship_return',3]})]},
{id:'relationship_return',followOnly:true,chapter:'关系 · 几年以后',scene:'park',title:'重新走过那段路',body:s=>`${P(s)}提起了几年前那个难熬的夜晚。${F(s,'partnerBond')==='repairing'?'你们真的改变了一些小事，也仍有做不到的时候。':'有了空间以后，你们需要重新确认，怎样继续生活在一起。'}\n关系不是一次按下正确答案，就能永远不再遇到问题。`,options:s=>[O('renew','重新约定彼此能做到的事','关系 +8 · 幸福 +4','这次的约定更小，也更具体。你们把过去的失望说完，又给未来留了一点空间。',[0,4,0,8],{flags:{partnerBond:'secure'}}),O('help','寻求可信任的外部支持','支出基准收入 3% · 关系 +7','有了一个能平静说话的环境，你们终于听见一些过去总被打断的话。',[0,3,2,7],{cash:-.03,flags:{partnerBond:'working'}})]},
{id:'care_parent',age:46,when:s=>s.parents.some(p=>p.alive),chapter:'亲情 · 角色改变',scene:'clinic',title:'这次由你来安排',body:s=>`${s.parents.find(p=>p.alive)?.role||'家人'}需要有人陪着处理检查和日常事务。你发现，那个以前替你准备一切的人，现在也会犹豫和不安。\n工作、家庭和照顾之间，没有完全不付出代价的安排。`,options:s=>[O('share','和家人分担，建立长期安排','支出基准收入 6% · 关系 +9','你们把联系人、时间和需要记下来。照顾不再全靠临时硬撑，也更容易持续。',[0,3,1,9],{cash:-.06,flags:{parentCare:true}}),O('personal','调整自己的节奏，多亲自陪伴','健康 −3 · 关系 +11','你抽出了更多时间，也真切感到照顾的辛苦。陪伴之余，你开始留意自己的疲惫，需要时也会求助。',[-3,2,0,11],{flags:{parentCare:true}})]},
{id:'business_setback',age:47,when:s=>s.job==='business',chapter:'经营 · 没有按计划发生',scene:'work',title:'没有等来的订单',body:s=>'你为一笔订单提前做了准备，对方却临时改变计划。房租和成本已经付出，账上的缓冲比预想中薄。\n经营带来的自由，也意味着要亲自处理这些失控的时刻。',options:s=>[O('scale_back','收缩规模，保住日常运转','损失基准收入 18% · 知识 +5','你停掉了最难维持的部分。承认计划需要缩小很难，却让剩下的事情有机会继续。',[0,-3,5,0],{cash:-.18,flags:{businessLesson:true}}),O('new_clients','寻找新客户，分散依赖','健康 −4 · 损失基准收入 10%','你花了很长时间重新介绍自己。新的客户更零散，但生意不再全部系在一份承诺上。',[-4,-1,6,3],{cash:-.1,flags:{businessLesson:true}})]}
);
for(const e of entries){const original=e.when;if(e.scene==='school'&&(e.age||11)<18)e.when=s=>(!s.course||s.course.schooling)&&(!original||original(s));if(e.id==='relationship_return')e.when=s=>!!s.partner;}
const map=Object.fromEntries(entries.map(e=>[e.id,e]));
function ensure(s){if(!s.story)s.story={schema:1,flags:{},choices:{},completed:[],queue:[],memories:[],people:{friend:s.friendName||'乔安'},incomeBoost:0};return s.story;}
function offer(s){let st=ensure(s);let queued=st.queue.find(q=>q.due<=s.age&&!st.completed.includes(q.id)&&(!map[q.id]?.when||map[q.id].when(s)));let e=queued?map[queued.id]:entries.find(e=>!e.followOnly&&s.age>=e.age&&s.age<=e.age+2&&!st.completed.includes(e.id)&&(!e.when||e.when(s)));if(!e)return false;st.completed.push(e.id);st.queue=st.queue.filter(q=>q.id!==e.id);s.seen.push('story:'+e.id);s.pending={id:'story:'+e.id,story:true,title:e.title,chapter:e.chapter,scene:e.scene,body:e.body(s),options:e.options(s),type:'choice'};return true;}
function resolve(s,id){const o=s.pending.options.find(o=>o.id===id);if(!o)return null;let st=ensure(s);Object.assign(st.flags,o.flags||{});if(o.follow&&!st.queue.some(q=>q.id===o.follow[0])&&!st.completed.includes(o.follow[0]))st.queue.push({id:o.follow[0],due:s.age+o.follow[1]});if(o.incomeBoost)st.incomeBoost=Math.min(.3,st.incomeBoost+o.incomeBoost);return o;}
function record(s,d,id,result){let st=ensure(s);st.choices[d.id]=id;if(d.id==='interest')st.flags.interest=id;if(d.id==='move'&&id==='move'&&!st.completed.includes('arrival')&&!st.queue.some(q=>q.id==='arrival'))st.queue.push({id:'arrival',due:s.age+1});st.memories.push({age:s.age,title:d.title,choice:d.options.find(o=>o.id===id)?.label||id,text:result,chapter:d.chapter||'人生转折'});st.memories=st.memories.slice(-100);st.lastChoice={age:s.age,title:d.title,text:result};}
function context(s){ensure(s);let a=s.age;if(a<6)return ['小小的世界',s.tier===0?'家里在节省每一笔开支，但今天依然有人蹲下来，认真听你说完一句话。':'你开始分清家人的脚步声，也能从窗外的光猜到一天到了什么时刻。'];if(a<18)return ['长大的日常',F(s,'friendship')?`放学后，${N(s)}和你走过熟悉的路。你们聊起${I(s)}，也聊起还没想好的以后。`:'课堂以外，生活也在教你认识自己的脾气、喜欢的事，以及怎样和别人相处。'];if(s.student)return ['还在学习的日子','课程、作业和生活费占据了大部分时间。偶尔解决一个真正不懂的问题，你仍会觉得这一路值得。'];if(a<65)return [s.children.length?'家里和家外':s.job==='creative'?'靠喜欢的事生活':'日子慢慢成形',s.children.length?`${child(s)}已经 ${a-s.children[0].born} 岁。工作和家事之间，${F(s,'sharedCare')?'你们继续分担，也继续学习怎样做家人。':'你还在寻找一种能照顾别人，也能照顾自己的节奏。'}`:s.partner?`你和${P(s)}已经一起走过 ${a-s.partner.since} 年。那些小小的约定，正在成为家的样子。`:F(s,'community')?'固定见面的朋友，熟悉的街道，让一个人的生活也有可以分享的部分。':'你为生活奔忙，也在有限的时间里留住一点自己的兴趣。没有大事发生的一年，同样真实地留下了痕迹。'];return ['慢下来的时光',F(s,'legacy')?'你已经开始把经历讲给别人，或者写在纸上。记忆不必宏大，也值得有人听见。':s.children.length?`${child(s)}已经有自己的生活。你们在新的距离里，慢慢学会新的陪伴。`:'你走得比以前慢，反而注意到很多从前匆匆经过的东西。熟悉的人与地方，组成了今天的安心。'];}
function summary(s){let st=ensure(s);return st.memories.filter(m=>m.chapter!=='人生转折').filter((m,i,a)=>i===0||i===a.length-1||m.chapter.startsWith('爱情')||m.chapter.startsWith('传承')).slice(-4);}
const api={entries,ensure,offer,resolve,record,context,summary};if(typeof module!=='undefined')module.exports=api;root.LifeStories=api;
})(globalThis);

(function(root){'use strict';let raf=0;const SKIN=['#efbd92','#d79566','#a76b48','#754b3c'],HAIR=['#393137','#58443a','#b57640','#252f35'];

function schoolOffers(s,c,major){const p=state(s);p.majorIntent=major;const score=s.stats.knowledge*.65+s.upbringing.school*.2+s.course.skills*.15;const schools=[{tier:1,name:'青禾应用学院',threshold:35,fee:.12},{tier:2,name:'明川理工学院',threshold:57,fee:.2},{tier:3,name:'星河研究大学',threshold:78,fee:.28}].map(x=>({...x,name:place(s,c)+' · '+x.name,chance:Math.round(clamp(65+(score-x.threshold)*1.3,8,94)),cost:Math.round(c.income*x.fee)}));enqueue(s,'把申请寄向哪所学校',`申请 ${MAJORS[major].name}。知识占综合准备的65%，家庭求学资源20%，技能15%；本次准备分 ${Math.round(score)}。每校名额不同，机会不等于保证。学校为虚构，费用为模拟单位；先看录取，接受后才支付入学准备费。`,schools.map((x,i)=>option('school:'+i,x.name,`录取约 ${x.chance}% · 入学准备费 ${x.cost.toLocaleString()} · ${s.course.level>=3?2:4}年学习`)),{schools,major});}
function vocational(s,c){s.course.occupation=null;s.course.employment=null;s.student=true;s.job='none';s.education='职业学习';s.course.academic={school:place(s,c)+' · 匠心职业学院',major:'engineering',tier:0,status:'studying',started:s.age};s.course.program={kind:'degree',name:s.course.academic.school+' · 设备维修',years:2,end:s.age+2,level:2};receipt(s,'你决定先学一门手艺',`${s.course.academic.school}向你开放了设备维修课程。两年后参加资格考核，完成后再选择工作；这不会自动给你一份岗位。`);}
function jobRoute(s,c){const q=s.course,p=state(s);if(s.student){receipt(s,'先完成眼前的学习','全日制学习期间暂不接收新的全职岗位。实习、课程项目与毕业后的求职会继续展开。');return;}if(p.jobYear!==s.age){p.jobYear=s.age;p.jobAttempts=0;}if(p.jobAttempts>=2){receipt(s,'先把这轮求职沉淀下来','今年两轮投递已完成，暂不重复抽取结果。现有工作保持不变；你可以在安排里培训，明年再投递。');return;}const academic=q.academic,major=academic?.major;enqueue(s,'这一次，想做怎样的工作',`${academic?academic.school+' · '+MAJORS[major]?.name+'（'+(academic.status==='graduated'?'已毕业':'未取得此学位')+'）':'目前没有已记录的学校和专业'}。知识 ${Math.round(s.stats.knowledge)}，技能 ${Math.round(q.skills)}，累计工作 ${q.workYears} 年。先选方向，再比较雇主、岗位和录用机会。`,[...(major?[option('jobs:related','沿着专业继续走','对口岗位获得专业匹配加成'),option('jobs:cross','试试跨专业工作','部分岗位需要补充技能')]:[option('jobs:all','看看现在能申请的岗位','依据学历、知识和技能筛选')]),option('venture-menu','考虑自己经营','先比较项目预算和风险'),option('continue','暂时保留目前的安排','不改变现有工作')]);}
function offers(s,c,route){const q=s.course,p=state(s),major=q.academic?.major,related=MAJORS[major]?.jobs||[];const credential=q.academic?.status==='graduated'?q.academic:(q.credentials||[]).filter(x=>x.major===major).at(-1);const graduated=!!credential;let rows=Object.entries(ROLES).filter(([id,x])=>{if(route==='related'&&!related.includes(id))return false;if(route==='cross'&&related.includes(id))return false;if(id==='teacher'&&(!graduated||major!=='education'))return false;return x[2]<=q.level||(['repair','cook'].includes(id)&&q.skills>=30)||(id==='designer'&&q.skills>=45);});rows=rows.sort(([a,ar],[b,br])=>(related.includes(b)?1:0)-(related.includes(a)?1:0)||br[2]-ar[2]);if(!rows.length){receipt(s,'暂时没有达到门槛的对口岗位','招聘方要求的学历或技能尚未满足。你仍可以转向其他岗位，也可以培训后再来。',[option('jobs:all','比较其他岗位','不要求与你的专业相关'),option('continue','先做准备','当前工作不变')]);return;}rows=rows.slice(0,4).map(([id,x])=>{const match=related.includes(id)&&graduated;const chance=Math.round(clamp(20+s.stats.knowledge*.22+q.skills*.25+Math.min(15,q.workYears*2)+s.stats.relations*.08+(match?12:0)+(graduated?(credential.tier||0)*2:0)-(route==='cross'&&x[2]>=3?12:0),10,94));return {id,company:place(s,c)+' · '+x[0],role:x[1],group:x[3],chance,match};});enqueue(s,'向哪家公司投递',`每年最多投递两轮，当前已投 ${p.jobAttempts} 轮。录用综合知识、技能、工作经验、人际沟通、已取得的学位与专业匹配；跨专业高级岗位额外扣12个百分点。公司均为虚构，接受录用之前不会辞去旧工作。`,rows.map((x,i)=>option('apply:'+i,x.company+' · '+x.role,`录用约 ${x.chance}% · 薪酬基准${Math.round(root.LifeCourse.JOBS[x.id].factor*100)}% · ${x.match?'专业对口':'跨专业／通用'}`)).concat(option('continue','这次先不投递','现有工作不变')),{jobs:rows});}
function ventureMenu(s,c){const q=s.course,p=state(s);if(p.ventureYear===s.age){receipt(s,'这一年的筹备已经结束','先处理现有事业与账单，明年再考虑新项目。');return;}const projects=[{id:'shop',name:'街角生活小店',rate:.5,skill:'commerce'},{id:'repair',name:'设备维修工作室',rate:.35,skill:'engineering'},{id:'studio',name:'设计与数字服务工作室',rate:.25,skill:'design'}].map(x=>({...x,cost:Math.round(c.income*x.rate),chance:Math.round(clamp(20+q.skills*.35+s.stats.knowledge*.15+s.mobility.network*.15+Math.min(12,q.workYears)+(q.academic?.status==='graduated'&&q.academic.major===x.skill?12:0),8,88))}));enqueue(s,'先把创业计划摊开',`可用现金 ${Math.round(s.cash).toLocaleString()}。知识、技能、工作经验、人脉与专业匹配影响首批订单；投入可能全部损失。筹备不等于辞职，只有开业成功才转为经营者。`,projects.map((x,i)=>option('venture:'+i,x.name,`投入 ${x.cost.toLocaleString()} · 首批订单约 ${x.chance}%${s.cash<x.cost?' · 现金不足':''}`)).concat(option('continue','保留工作，暂不投入','不扣除资金')),{projects});}
function resolve(s,id,c,r){const q=s.course,p=state(s),d=s.pending;id=id.slice(5);let text='',delta=[0,0,0,0];
if(id.startsWith('major:')){schoolOffers(s,c,id.split(':')[1]);text='你把'+MAJORS[id.split(':')[1]].name+'列为学习方向。';}
else if(id.startsWith('school:')){const school=d.schools[+id.split(':')[1]];p.schoolAttempt=s.age;const accepted=r()*100<school.chance;p.schoolOffer={...school,major:d.major,accepted,year:s.age,level:q.level>=3?4:3};text=`${school.name} · ${MAJORS[d.major].name}：${accepted?'录取通过':'本次未录取'}。录取机会约${school.chance}%，结果已固定。`;receipt(s,accepted?'录取通知到了':'这次，没有等到录取',text+(accepted?` 入学准备费 ${school.cost.toLocaleString()}，现有现金 ${Math.round(s.cash).toLocaleString()}；允许的教育负债上限为当地三年基准收入。`:' 名额没有为你留下，但这不是人生的终点。同年不再重抽，下一步由你决定。'),accepted?[option('enroll','接受录取，开始学习','记录学校和专业，支付入学准备费'),option('vocational','改选职业教育','不支付大学入学准备费'),option('jobroute','先去工作','放弃本次入学，比较岗位')]:[option('prepare','准备下一年的申请','知识 +4；保持目前工作'),option('vocational','进入职业教育','两年后参加资格考核'),option('jobroute','先工作，再考虑返校','比较现在能够申请的岗位')]);}
else if(id==='enroll'){const o=p.schoolOffer;if(!o?.accepted||o.year!==s.age)return {text:'录取已不在本年度有效期。',delta};if(s.cash-o.cost< -c.income*3){receipt(s,'录取有了，预算还没有',`入学准备费 ${o.cost.toLocaleString()} 会超过三年收入的教育债务上限。学校不会强行替你入学。`,[option('prepare','暂缓，准备下一年','知识 +4，保留现有工作'),option('vocational','改选职业教育','先学习职业技能'),option('jobroute','先找工作筹资','不扣本次入学费')]);text='你没有支付超出承受范围的入学费。';}else{s.cash-=o.cost;s.student=true;s.job='none';q.occupation=null;q.employment=null;s.education=o.level===4?'研究生在读':'大学在读';q.academic={school:o.name,major:o.major,tier:o.tier,status:'studying',started:s.age};const years=o.level===4?2:4;q.program={kind:'degree',name:o.name+' · '+MAJORS[o.major].name,years,end:s.age+years,level:o.level};p.schoolOffer=null;text=`你进入${q.academic.school}学习${MAJORS[o.major].name}。已支付入学准备费${o.cost.toLocaleString()}，预计${s.age+years}岁参加毕业考核。`;receipt(s,'新的学生证上，写着你的名字',text+' 在读期间停止原来的全职工作，生活与学习开支持续结算。');}}
else if(id==='prepare'){delta=[0,1,4,0];text='你整理了申请材料与薄弱科目，知识提高4点。下一年可以重新申请，现有工作没有改变。';receipt(s,'这一年，先把基础打牢',text);}
else if(id==='vocational'){vocational(s,c);text='你选择了职业教育，毕业后仍需自主求职。';}
else if(id==='local-study'){academy(s,c);text='你改为比较本地专业与学校。';}
else if(id==='jobroute'){jobRoute(s,c);text='你开始比较下一段工作的方向。';}
else if(id.startsWith('jobs:')){offers(s,c,id.split(':')[1]);text='你选择了'+(id.endsWith('related')?'专业相关':'开放或跨专业')+'的求职方向。';}
else if(id.startsWith('apply:')){const j=d.jobs[+id.split(':')[1]];p.jobAttempts++;const ok=r()*100<j.chance;p.jobOffer=ok?{...j,year:s.age}:null;text=`${j.company}回复了你的申请：${ok?'愿意录用你':'本次没有录用'}，岗位为${j.role}，本次机会约${j.chance}%。`;receipt(s,ok?'一封录用通知':'面试之后，收到了一封婉拒',text+(ok?` 薪酬基准为当地收入的${Math.round(root.LifeCourse.JOBS[j.id].factor*100)}%，再受技能、时代和生活条件影响。`:' 招聘名额与能力匹配共同影响结果，原来的工作没有被取消。'),ok?[option('accept-job','接受这份工作','切换雇主与岗位，开始积累任职经历'),option('jobroute','继续找，暂不接受','现有工作保持不变')]:[option('jobroute','看看其他方向','每年最多两轮投递'),option('continue','先培训或积累经验','在生活安排里准备，明年再投')]);}
else if(id==='accept-job'){const j=p.jobOffer;if(j&&j.year===s.age){q.employment={company:j.company,role:j.role,occupation:j.id,since:s.age,related:j.match};q.occupation=j.id;s.job=j.group;q.unemployedUntil=0;s.mobility.careerLevel=0;p.jobOffer=null;text=`你接受${j.company}的${j.role}岗位。${j.match?'专业知识会在工作中得到检验。':'从新的领域开始，需要更多实际练习。'}`;receipt(s,'第一天，找到自己的工位',text+' 今后的行业变动、进修机会和同事关系会与你的岗位相连。');}}
else if(id==='venture-menu'){ventureMenu(s,c);text='你先比较投入、技能与订单风险。';}
else if(id.startsWith('venture:')){const v=d.projects[+id.split(':')[1]];if(s.student||s.cash<v.cost){text=s.student?'在读期间先完成学业，暂不开设全职事业。':'现金不足，没有扣款或借贷，也没有改变现有工作。';receipt(s,'这份计划还需要准备',text,[option('continue','保留计划，先积累','明年可再次筹备')]);}else{p.ventureYear=s.age;s.cash-=v.cost;const ok=r()*100<v.chance;text=`你为${v.name}投入${v.cost.toLocaleString()}。${ok?'首批订单落定，事业开张。':'首批订单未能落定，这笔前期投入没有收回，原工作保留。'} 本次机会约${v.chance}%。`;if(ok){q.business={name:place(s,c)+' · '+v.name,sector:v.id,started:s.age,invested:v.cost};q.employment=null;q.occupation='owner';s.job='business';q.unemployedUntil=0;}delta=[0,ok?5:-6,3,0];receipt(s,ok?'第一笔订单，不是成功的终点':'筹备结束，但还没有开张',text,ok?[option('continue','认真经营下去','之后会面对订单、现金流和行业变化')]:[option('jobroute','先靠工作恢复现金流','可保留旧工作或比较新岗位'),option('continue','记下损失，先休整','不会自动重复投入')]);}}
else if(id==='internship'){q.skills=clamp(q.skills+10);p.internship=true;text=`你在${d.company}完成短期实习，技能提高10点；尚未获得长期岗位。`;receipt(s,'从课堂走到真实的任务前',text);}
else if(id==='research'){delta=[0,2,7,0];text='你留在课程项目中，把理论和作品再磨一遍，知识提高7点。';}
else if(id==='social-train'){const cost=Math.round(c.income*.06);if(s.cash>=cost){s.cash-=cost;q.skills=clamp(q.skills+10);text=`你支付${cost.toLocaleString()}参加转型培训，技能提高10点。短期收入压力仍在，但下次求职有了新的积累。`;}else{delta=[0,-2,3,0];text='付费培训超出现金预算，你改用公开资料自学，知识提高3点；没有扣款。';}receipt(s,'把变化变成下一步的准备',text);}
else if(id==='social-lead'){const chance=clamp(15+q.skills*.35+s.stats.knowledge*.2+Math.min(20,q.workYears*2),10,90),ok=r()*100<chance;text=`${q.employment?.company||'任职机构'}公布了项目负责人的考核结果：${ok?'通过':'暂未通过'}（本次机会约${Math.round(chance)}%）。`;if(ok){s.mobility.careerLevel++;q.skills=clamp(q.skills+4);text+='你开始协调同事与进度，职级提高一级，后续收入随职级结算。';}else{text+='目前岗位保留；这次准备让技能提高3点，下一次仍可以争取。';q.skills=clamp(q.skills+3);}receipt(s,'承担责任之前，先收到答复',text);}
else if(id==='social-mentor'){delta=[0,3,2,6];p.mentoredAt=s.age;text=`你在${q.employment?.company||'工作单位'}留出时间带新人。关系提高6点、知识提高2点；没有即时加薪，但合作不再只是分配任务。`;receipt(s,'把自己的弯路讲给后来的人',text);}
else if(id==='business-pilot'){const cost=Math.round(c.income*.12);if(s.cash<cost){text='试单预算不足，没有扣款。你暂时保留原有经营方式。';}else{s.cash-=cost;q.business.pilot={due:s.age+1,cost,chance:clamp(.3+q.skills/250+s.stats.relations/500,.2,.88)};text=`你投入${cost.toLocaleString()}做一个小批次试单，明年根据技能和客户关系结算。没有提前把合同额当成利润。`;}receipt(s,'先接一个能承担的订单',text);}
else if(id==='social-network'){delta=[0,-1,0,8];text='你约同事和同行交换信息，关系提高8点。消息不会自动变成职位，但下一次面试能更好地表达自己。';receipt(s,'在行业里重新找到联系',text);}
else if(id==='business-small'){const cost=Math.round(c.income*.04);if(s.cash>=cost){s.cash-=cost;q.skills=clamp(q.skills+5);q.unemployedUntil=0;text=`你投入${cost.toLocaleString()}调整服务，压缩品类，恢复接单；技能提高5点。`;}else{text='现金不足以调整服务，你暂时缩减经营，收入压力仍会持续。';}receipt(s,'把生意缩到可以照看的大小',text);}
else if(id==='business-close'){text=`你结束了${q.business?.name||'当前事业'}，没有凭空收回已经花掉的成本。现有债务保留，再找一份工作。`;q.business=null;s.job='none';q.occupation=null;receipt(s,'把门关上，也给下一步留路',text,[option('jobroute','开始寻找工作','查看学历与技能允许的岗位')]);}
else text='你读完结果，决定按自己的节奏继续。';
if(!(d.outcome&&id==='continue'))p.history.push({age:s.age,title:d.title,choice:id,text});return {text,delta};}
function annual(s,c,r){const q=s.course,p=state(s),a=s.age;

</script><script>/* UI deliberately separate from the seeded model. */

function focusCard(){let f=E.FOCUSES[life.focus];return `<div class="focus-card"><small>今年的重心</small><div>${f.icon} ${f.name}</div><small style="margin-top:6px">${f.desc}</small>${life.age<6?'<small>6岁后可以主动安排年度重心</small>':btn('focus','调整生活的重心　↗')}${btn('course','学习、职业与生活安排 ↗')}</div>`;}
function peers(){return `<div class="side-title">与你同一秒来到世界</div>${life.peers.map(p=>{let c=E.country(p.country);return `<div class="peer ${p.alive?'':'gone'}"><div class="peer-flag">${c.flag}</div><div><b>${esc(p.name)} <small>· ${c.name}${p.sex?' · '+p.sex:''}</small></b><p>${esc(p.status)}</p></div></div>`;}).join('')}<p class="tiny-note">不同的起点，相同的时间。<br>他们也在经历属于自己的一生。</p>`;}
function moment(){if(life.pending){let d=life.pending;return `<section class="content-card decision-card ${d.outcome?'outcome-card':''}" aria-label="当前人生抉择"><div class="decision-body"><div class="moment-top"><span class="eyebrow">${esc(d.chapter||(d.type==='reflection'?'这个年纪的选择':'人生的分岔路'))}</span><span class="pill">${life.age} 岁 · 时间已暂停</span></div><div class="decision-heading"><h2>${esc(d.title)}</h2>${btn('story-detail','读完整故事 ↗','story-read quiet')}</div><p class="body story-excerpt">${esc(d.body.split("\n")[0])}</p><div class="choices">${d.options.map((o,i)=>`<button class="choice ${selected===o.id?'selected':''}" data-action="choose" data-value="${esc(o.id)}" aria-pressed="${selected===o.id}"><span class="number">${i+1}</span><span><strong>${esc(o.label)}</strong><small>${esc(o.hint)}</small></span><span class="arrow">↗</span></button>`).join('')}</div></div></section>`;}
let latest=life.logs[0];return `<section class="content-card"><div class="moment-top"><span class="eyebrow">${life.age<6?'THE FIRST CHAPTER':life.age<18?'GROWING INTO YOURSELF':life.age<65?'THE DAYS IN BETWEEN':'THE QUIET YEARS'}</span><span class="pill">${life.age} 岁 · ${stage()}</span></div><h2>${esc(latest.title)}</h2><p class="body">${esc(latest.text)}</p>${life.story?.lastChoice?.age===life.age?'<div class="result-stamp">✓ 这个选择已经留在你的人生里</div>':''}<p class="quote">${life.age<18?'世界一点点变大，你也一点点长大。':life.age<65?'生活往往是在最普通的日子里，悄悄成形。':'那些认真活过的日子，都留在了你身上。'}</p></section><div class="history-preview"><div class="row between"><span>最近走过的日子</span>${btn('tab','完整记录 ↗','quiet','data-value="journal"')}</div>${life.logs.slice(1,3).map(l=>`<div class="history-item"><span class="date">${l.age} 岁</span><div>${esc(l.title)}<p>${esc(l.text)}</p></div></div>`).join('')}</div>`;}
function stage(){return life.age<6?'童年':life.age<18?'少年':life.age<35?'青年':life.age<65?'中年':'暮年';}
function lifeMap(){return `<h3>人生的格子</h3><p class="small">一格一年 · 绿色是来过，金色是重要选择</p><div class="life-grid">${Array.from({length:110},(_,i)=>`<i class="${i<life.age?'lived':''} ${life.logs.some(l=>l.age===i+1&&l.type==='choice')?'milestone':''}" title="${i+1} 岁"></i>`).join('')}</div><div class="row between small"><span>0 岁</span><span>110 岁</span></div>`;}
function survival(){let c=E.country(life.country),t=E.MORTALITY.table(c,life.sex,E.SOCIAL),compare=E.country(config.compare||'cn'),other=E.MORTALITY.table(compare,life.sex,E.SOCIAL),points=t.curve.map((n,i)=>`${25+i*2.2},${125-n*100}`).join(' '),otherPoints=other.curve.map((n,i)=>`${25+i*2.2},${125-n*100}`).join(' ');return `<h3>生命的时间</h3><p class="small">${c.name} · ${life.sex} / 对照：${compare.name}</p><svg viewBox="0 0 290 150" class="chart" role="img" aria-label="按寿命与幼儿死亡观察值校准的游戏存活曲线"><path d="M25 20V125H270" fill="none" stroke="currentColor" opacity=".2"/><polyline points="${otherPoints}" fill="none" stroke="#b18d66" stroke-width="2" stroke-dasharray="3 3"/><polyline points="${points}" fill="none" stroke="currentColor" stroke-width="2"/><text x="3" y="26">100</text><text x="12" y="128">0</text><text x="23" y="143">0 岁</text><text x="238" y="143">110 岁</text></svg><p class="tiny-note">曲线校准国家男女寿命与幼儿死亡观察值；逐年龄形状仍为游戏模型，不是真实生命表，也不是你的寿命预测。个人健康与家庭就医条件继续影响游戏风险。</p>`;}

function careerProfile(){const d=E.pathways.describe(life);return `<div class="career-profile"><h3>学习与任职档案</h3><p>${esc(d.school)}</p><p>${esc(d.work)}</p><small>学校与公司为虚构的游戏机构。旧存档不补造已发生的履历。</small></div>`;}
function profile(){return `<section class="content-card"><h2>你现在的模样</h2>${stats()}${facts()}${careerProfile()}${focusCard()}<p class="tiny-note">属性改变机会与处境，不是对一个人价值的评分。</p></section>`;}
function family(){let q=E.course.ensure(life);return `<section class="content-card"><div class="moment-top"><span class="eyebrow">PEOPLE WHO MAKE A LIFE</span><span class="pill">家人与生活</span></div><h2>有些人，陪你走过</h2>${life.parents.map(p=>`<div class="family-person"><span class="family-avatar">${p.role==='母亲'?'❀':'♧'}</span><div>${p.role}<small>${p.alive?`${p.age+life.age} 岁 · 仍在你的生活里`:`已离世 · 享年 ${p.end} 岁`}</small></div></div>`).join('')}${life.partner?`<div class="family-person"><span class="family-avatar">♡</span><div>${esc(life.partner.name)}<small>伴侣 · 一起走过 ${life.age-life.partner.since} 年</small></div></div>`:`<div class="family-person"><span class="family-avatar">◌</span><div>${life.age<18?'在亲人的陪伴里成长':'独自生活，也认真生活'}<small>${life.age<18?'未来还有许多相遇':'目前没有伴侣'}</small></div></div>`}${life.children.map(c=>`<div class="family-person"><span class="family-avatar">✧</span><div>${esc(c.name)}<small>孩子 · ${life.age-c.born} 岁${life.age-c.born>=18?' · 已成年':''}</small></div></div>`).join('')}${q.siblings.map(x=>`<div class="family-person"><span class="family-avatar">♧</span><div>${esc(x.name)}<small>${life.age+x.offset}岁 · 共享这段家庭来路</small></div></div>`).join('')}<p>朋友：${q.friends.map(f=>esc(f.name)+' · '+(f.closeness>=60?'亲近':f.closeness>=30?'仍有联系':'渐渐疏远')).join('、')}<br>孙辈：${q.grandchildren}位${q.pet?'<br>宠物：'+esc(q.pet.name)+' · 相伴'+(life.age-q.pet.since)+'年':''}</p><p>兴趣：${q.hobbies.map(h=>E.course.HOBBIES[h.id]+' Lv.'+Math.floor(h.level)).join('、')||'还在寻找'}</p>${btn('course','安排相聚、恋爱与家庭','',`data-value="family"`)}<p class="tiny-note">关系和生活随选择、年龄与经历变化。</p></section>`;}
function finance(){let c=E.country(life.country),blocked=life.age<18||!!life.pending;return `<div class="panels-two"><section class="content-card"><span class="eyebrow">THE MEANS TO LIVE</span><h2 style="margin-top:10px">生活的底气</h2><small>现金余额 · 模拟购买力单位</small><div class="finance-total">${money(life.cash)}</div><div class="balance-row"><span>包含房产的净资产</span><span>${money(E.course.netWorth(life))}</span></div><div class="balance-row"><span>剩余房贷</span><span>${money(E.course.ensure(life).mortgage)}</span></div><div class="balance-row"><span>投资账户</span><span>${money(life.invested)}</span></div><div class="balance-row"><span>上一年收入</span><span>+ ${money(life.income)}</span></div><div class="balance-row"><span>上一年生活支出</span><span>− ${money(life.expenses)}</span></div><div class="balance-row"><span>上一年投资盈亏</span><span>${money(life.marketReturn||0)}</span></div><p class="tiny-note">未成年由家庭照料。成年后每年结算收入和支出；生活开支含收入的52%及当地基准生活费；负余额为债务，按模拟年息2.5%计息。投资每年可能亏损或增长。</p><div class="row" style="flex-wrap:wrap;margin-top:15px">${btn('invest','投入现金的 25%','',blocked||life.cash<100?'disabled':'')}${btn('withdraw','全部转回现金','',blocked||life.invested<=0?'disabled':'')}</div></section><section class="content-card"><h2>钱可以换来什么</h2>${btn('course','打开生活安排 · 住房、交通、学习','primary','data-value="assets"')}<p class="body">给身体、回忆和重要的人，留一点预算。</p><div class="finance-actions">${[['checkup','♡ 健康检查',.06,'健康 +9'],['trip','↗ 一次旅行',.1,'幸福 +9，知识 +2'],['gift','♧ 一份心意',.04,'关系 +8，幸福 +3']].map(([k,n,v,h])=>{let cost=Math.round(c.income*v),used=life.used.includes(k);return btn('spend',`${n}<small>${used?'今年已完成':`${money(cost)} · ${h}`}</small>`,'',`data-value="${k}" ${blocked||used||life.cash<cost?'disabled':''}`);}).join('')}</div><p class="tiny-note">${life.pending?'先完成人生抉择，再安排消费。':life.age<18?'18 岁后开放消费与投资。':'每项体验每年一次；现金不足时不可购买。'}</p></section></div>`;}
function journal(){let page=life.page||0,logs=life.logs,total=Math.max(1,Math.ceil(logs.length/4));page=Math.min(page,total-1);return `<section class="content-card"><div class="row between"><h2>走过的日子</h2></div><p class="small">${logs.length} 条记录 · 最新的在前 · ☆ 收藏片刻</p>${logs.slice(page*4,page*4+4).map(l=>`<div class="journal-row"><div class="date">${l.age}<small> 岁</small></div><div><h3>${esc(l.title)}</h3><p>${esc(l.text)}</p></div>${btn('star',l.star?'★':'☆','quiet',`data-value="${l.id}" aria-label="${l.star?'取消收藏':'收藏'}：${esc(l.title)}"`)}</div>`).join('')}<div class="pagination">${btn('page','← 更新','',`data-value="${page-1}" ${page===0?'disabled':''}`)}<span>${page+1} / ${total}</span>${btn('page','更早 →','',`data-value="${page+1}" ${page===total-1?'disabled':''}`)}</div>${life.notes.length?`<div class="rule"></div><h3>写给人生的话</h3>${life.notes.slice(-3).reverse().map(n=>`<p class="tiny-note">${n.age} 岁 · ${esc(n.text)}</p>`).join('')}${life.notes.length>3?btn('allnotes',`查看全部 ${life.notes.length} 条随笔`,'quiet'):''}`:''}</section>`;}
function world(){return `<div class="panels-two"><section class="content-card">${peers()}<div class="rule"></div>${config.compare?`<p class="small">现实出生地对照：${E.country(config.compare).name} · 模型基准收入 ${money(E.country(config.compare).income)}；此生所在地 ${E.country(life.country).name} · ${money(E.country(life.country).income)}。</p>`:''}${survival()}${btn('countries','查看国家模型 ↗','quiet')}</section><section class="content-card">${lifeMap()}<p class="tiny-note">这些格子没有预言你的寿命，只记录已经发生的故事。</p></section></div>`;}
function scenePanel(){let c=E.country(life.country);return `<aside class="scene-panel"><div class="scene-heading"><span><i class="live-dot"></i>${esc(LifePixels.label(life))}</span><small>${life.born+life.age}</small></div><canvas data-pixel="life" width="480" height="240" role="img" aria-label="${esc(life.name)}，${life.age}岁，${esc(LifePixels.label(life))}"></canvas><div class="scene-caption"><b>${c.flag} ${c.name}</b><span>${life.age<6?'在家人的怀抱里':life.age<18?life.education:E.JOBS[life.job].name}</span></div><div class="scene-stats">${stats()}</div><div class="chapter-line"><span>出生</span><i style="--progress:${Math.min(100,life.age/100*100)}%"></i><span>一生</span></div><p class="scene-note">${life.story?.flags?.interest?'仍然记得：'+({books:'书里的大世界',sport:'放学后的球场',art:'第一次画满的纸'}[life.story.flags.interest]):'故事正在发生，每一年都算数。'}</p></aside>`;}
function game(){let c=E.country(life.country);return `${header()}<main class="game"><div class="identity"><div><h1>${esc(life.name)}<span class="pill">${stage()}</span></h1><p>${c.flag} ${c.name}<span class="identity-detail"> · ${life.born} 年出生 · ${esc(life.education)}</span></p></div><div class="identity-age"><div class="age">${life.age}<small>岁</small></div><div class="year">${life.born+life.age} 年</div></div></div><div class="tools" aria-label="人生调整工具栏">${btn('focus',`${E.FOCUSES[life.focus].icon} 重心`)}${btn('origin','⌂ 出身')}${btn('course','▤ 安排')}${btn('auto',life.auto?'✓ 自动抉择':'◌ 自动抉择',`auto-button ${life.auto?'active':''}`,`aria-pressed="${life.auto}"`)}${btn('more','⋯ 更多','push')}${btn('pause',running?'Ⅱ 暂停':'▷ 播放',running?'active':'')}${btn('speed',`${speed}×`,'', 'aria-label="切换时间速度"')}</div><div class="workspace">${scenePanel()}<section class="story-pane"><nav class="mobile-tabs" aria-label="人生信息">${[['life','故事'],['profile','状态'],['family','家人'],['finance','财务'],['world','世界'],['journal','记录']].map(([k,n])=>btn('tab',n,tab===k?'active':'',`data-value="${k}" aria-current="${tab===k?'page':'false'}"`)).join('')}</nav><div class="game-content">${tab==='life'?moment():tab==='profile'?profile():tab==='family'?family():tab==='finance'?finance():tab==='world'?world():journal()}</div></section><aside class="right-panel">${peers()}<div class="save-status">${saveLabel()}</div>${btn('memories','✧ 那些有回声的选择','memory-entry')}</aside></div></main>${actions()}`;}

function actions(){let d=life.pending;return `<footer class="game-actions"><div class="time-status"><span id="time-label">${d?(selected?'已选：'+esc(d.options.find(o=>o.id===selected)?.label||''):'有一个抉择在等你'):running?'时间正在流动':'停留在此刻'}</span><div class="time-track"><i id="time-progress" style="width:${progress*100}%"></i></div></div>${d?btn('confirm',tab!=='life'?'回到当前抉择':'确认选择　→','primary',tab==='life'&&!selected?'disabled':''):`${btn('next-choice','下个抉择 »')}${btn('next','下一年　→','primary')}`}</footer>`;}
function memoryBody(s){if(['reel','extras','guest'].includes(memoryTab))return memoryExtra(s); let b=E.origins.ensure(s,E.country(s.origin)),f=MEM.facts(s,E),items=MEM.items(s);if(memoryTab==='room'){let item=items.find(x=>x.id===roomItem)||items[0];return `<div class="memory-room"><canvas data-pixel="room" width="480" height="240" role="img" aria-label="根据这段人生布置的纪念房间"></canvas></div><div class="relic-list" aria-label="查看人生留下的物品">${items.map(x=>btn('relic',`${x.icon} ${esc(x.label)}`,x.id===item.id?'active':'',`data-value="${x.id}"`)).join('')}</div><article class="relic-story" aria-live="polite"><small>${item.age}岁 · ${s.born+item.age}年</small><h3>${esc(item.label)}</h3><p>${esc(item.text)}</p></article>`;}if(memoryTab==='origin')return originPanel(s,1)+`<div class="rule"></div><h3>${esc(b.place.label)}</h3><p>${esc(b.environment||'旧版本未记录环境。')}</p>${btn('origin','查看完整出生档案 ↗')}`;if(memoryTab==='path'){let log=[...s.logs].reverse().filter(l=>['choice','origin','work','farewell','birth'].includes(l.type)),total=Math.max(1,Math.ceil(log.length/4));pathPage=Math.min(pathPage,total-1);return `<h2>${esc(f.title)}</h2><p>${esc(f.summary)}</p><div class="career-profile"><h3>学习与任职档案</h3><p>${esc(E.pathways.describe(s).school)}</p><p>${esc(E.pathways.describe(s).work)}</p></div>${MEM.chart(s)}<div class="origin-comparison"><span>起点<br><b>${esc(b.label)}</b></span><span>→</span><span>最后经济处境<br><b>${esc(E.origins.GROUPS[E.origins.rankNow(s,E.country(s.country))])}</b></span></div>${log.slice(pathPage*4,pathPage*4+4).map(l=>`<article class="history-item"><span class="date">${l.age}岁</span><div><b>${esc(l.title)}</b><p>${esc(l.text)}</p></div></article>`).join('')}<div class="pagination">${btn('path-page','← 前页','',`data-value="${pathPage-1}" ${pathPage===0?'disabled':''}`)}<span>${pathPage+1} / ${total}</span>${btn('path-page','后页 →','',`data-value="${pathPage+1}" ${pathPage===total-1?'disabled':''}`)}</div>`;}if(memoryTab==='album'){let photos=MEM.album(s);if(!photos.length)return '<h2>旧记录里的片刻</h2><p>这份旧存档没有逐年照片状态。原有人生日志仍可完整回看，不补造相簿。</p>';albumPage=Math.min(albumPage,photos.length-1);let x=photos[albumPage];return `<div class="album-heading"><h2>${x.age}岁的${esc(s.name)}</h2><span>${x.year}年</span></div><canvas data-pixel="album" data-age="${x.age}" width="480" height="240" role="img" aria-label="从存档重绘的${x.age}岁场景"></canvas><p class="tiny-note">${E.country(x.country).name} · ${esc(x.education)} · ${E.JOBS[x.job]?.name||''}<br>健康 ${x.health} · 幸福 ${x.joy} · 现金 ${money(x.cash)}</p><div class="pagination">${btn('album-page','← 前一张','',`data-value="${albumPage-1}" ${albumPage===0?'disabled':''}`)}<span>${albumPage+1} / ${photos.length}</span>${btn('album-page','后一张 →','',`data-value="${albumPage+1}" ${albumPage===photos.length-1?'disabled':''}`)}</div><p class="tiny-note">画面依据当年保存的年龄、伴侣、子女和职业重绘。</p>`;}return `<div class="last-chapter"><span class="eyebrow">THE LAST CHAPTER</span><h2>${s.age}年，仅此一次</h2><p>${esc(s.cause||'这一生仍在继续。')}</p><p>${s.country===s.origin?`你在${E.country(s.origin).name}出生，也在那里走完了这一生。`:`你从${E.country(s.origin).name}出发，最后生活在${E.country(s.country).name}。`}</p><p>${s.partner?`你与${esc(s.partner.name)}相伴${s.age-s.partner.since}年。`:'没有伴侣，并不意味着这些年没有人与人之间的连接。'}${s.children.length?`你养育了${s.children.length}个孩子。`:''}</p><div class="summary-stats"><div><strong>${f.choices}</strong><small>做过的选择</small></div><div><strong>${f.work===null?'—':f.work}</strong><small>有收入的工作年数</small></div><div><strong>${s.story?.memories?.length||0}</strong><small>留下的回声</small></div></div><p class="tiny-note">这是一段模拟人生。我们只保留发生过的故事，不为你编写未发生的葬礼或后代。</p>${btn('review','查看完整人生记录')}${s.notes.length?btn('legacy-notes','阅读旧版本留下的话'):''}</div>`;}
function ending(s){E.origins.ensure(s,E.country(s.origin));let f=MEM.facts(s,E);return `${header()}<main class="memorial"><div class="memorial-heading"><div><span class="eyebrow">A ROOM FOR EVERY LIFE</span><h1>${esc(s.name)}的房间</h1></div>${btn('archive','返回人生收藏','quiet')}</div><div class="memorial-layout"><aside class="memory-profile"><canvas data-pixel="portrait" width="480" height="240" role="img" aria-label="${esc(s.name)}的人生肖像"></canvas><h2>${esc(s.name)}</h2><p>${s.born} — ${s.born+s.age} · ${s.age}岁</p><b>${esc(f.title)}</b><p class="small">${esc(f.location)}</p>${MEM.chart(s)}<div class="memory-status">${saveLabel()}</div></aside><section class="memory-main"><nav class="memory-tabs" aria-label="纪念册章节">${[['room','房间'],['origin','出身'],['path','轨迹'],['album','相簿'],['last','终章'],['reel','影片'],['extras','彩蛋'],['guest','留言']].map(([k,n])=>btn('memory-tab',n,memoryTab===k?'active':'',`data-value="${k}" aria-pressed="${memoryTab===k}"`)).join('')}</nav><div class="memory-content">${memoryBody(s)}</div></section></div><footer class="memorial-actions"><span class="small">${s.ended?'人生已经结束，记忆可以重访。':'这段人生尚未结束。'}</span>${btn('works','制作与分享')}${btn('memorial-export','保存纪念册')}${btn('export','备份存档')}${btn('restart','再遇见一种人生','primary')}</footer></main>`;}
function archiveView(){let total=Math.max(1,Math.ceil(archive.length/4));archivePage=Math.min(archivePage,total-1);return `${header()}<main class="archive"><div class="archive-head"><div><div class="eyebrow">EVERY LIFE LEAVES A TRACE</div><h1 style="margin-top:10px">人生收藏</h1><p class="small">让曾经来过的故事，有一处安放。</p></div>${btn('home','返回首页','quiet')}</div>${archive.length?`<div class="archive-grid">${archive.slice(archivePage*4,archivePage*4+4).map(s=>`<button class="archive-card" data-action="archive-open" data-value="${esc(s.id)}"><span class="eyebrow">${E.country(s.origin).flag} ${E.country(s.origin).name}</span><h2>${esc(s.name)}</h2><p>${s.born} — ${s.ended?s.born+s.age:'进行中'} · ${s.age} 岁</p><p>${esc(s.upbringing?.label||'旧版出生记录')} · ${s.ended?'进入纪念房间':'继续这段人生'}　↗</p></button>`).join('')}</div><div class="pagination">${btn('archive-page','← 上一页','',`data-value="${archivePage-1}" ${archivePage===0?'disabled':''}`)}<span>${archivePage+1} / ${total} · 共 ${archive.length} 段人生</span>${btn('archive-page','下一页 →','',`data-value="${archivePage+1}" ${archivePage===total-1?'disabled':''}`)}</div>`:`<div class="empty"><div class="moment-symbol">♧</div><h2>故事，还在路上。</h2><p>已完成的人生与暂时停下的进度，都会保留在这里。</p>${btn(life?'resume':'new',life?'继续这段人生':'开始第一段人生','primary','style="margin-top:20px"')}</div>`}<div class="archive-actions">${btn('export','↓ 导出存档')}${btn('import','↑ 导入存档')}${btn('about','数据与保存说明')}</div><p class="tiny-note">最多保留 100 段人生；满额后会提示，不自动删除最早记录。记录只保存在这个浏览器内，不会发布到网上。</p></main>`;}

function about(){modal('关于此生',`<div class="eyebrow">ONE IN BILLIONS · ${E.VERSION}</div><h3>看着一个人长大，让选择留下回声。</h3><p>随机出生，逐年生活。调整生活重心，经历求学、工作、爱情、育儿、移居、健康与退休。像素场景跟随人生状态变化，故事会记住以前的人和决定。</p><h3>内容与参考</h3><p>核心体验参考 <a href="https://1in8b.life/zh/" target="_blank" rel="noopener">1in8b.life</a>。代码、剧情和像素画面均为独立创作。包含 ${E.stories.entries.length} 个新增连续剧情节点，以及原有年龄节点；每段人生只会遇到符合自身经历的部分。</p><h3>国家数据与模拟假设</h3><p>本版接入世界银行 WDI 的 2023 年公开快照，覆盖 ${E.COUNTRIES.length} 个国家与地区。人口、粗出生率、男女预期寿命、城市人口比例等保留原始观测值与来源；缺失指标明确标记。出生权重由人口乘粗出生率计算。</p><p>GDP（PPP）不是工资：游戏收入基准暂按它的60%映射，并受职业、学习与选择影响。大学毛入学率只参与机会指数设计，不直接当作录取概率。死亡曲线按国家男女寿命与幼儿死亡观察值校准；逐年龄形状仍是游戏模型，不是国家分年龄生命表。</p><p>过去／未来目前仍使用2023年国家快照与模拟时代收入系数，不宣称已接入完整历史数据、战争事件或联合国预测。数据为 CC BY 4.0，来源：<a href="https://data.worldbank.org/" target="_blank" rel="noopener">World Bank WDI</a>。</p><h3>保存与人生收藏</h3><p>进度、出生档案和纪念册只在本浏览器保存，刷新后暂停恢复。收藏最多100段；进行中的人生也能保留和切换，支持JSON备份和离线HTML纪念册。保留只读分享稿、公开存档接口与访客留言入口；账号、服务器与审核接入前不会发布，也不显示虚构在线人数。</p><h3>平静地讲述</h3><p>故事涉及疾病、压力与家人离世，以不描写画面的方式呈现。没有唯一正确的人生。参考站的全部事件与统计系统尚未完整同步。</p>`,btn('countries','查看国家数据')+btn('close','继续','primary'));}

function roomStyles(){let q=E.course.ensure(review||life);modal('让房间留住你的颜色',`<p>布置会保存在这段人生里。</p><div class="row wrap">${[['warm','暖纸与木色'],['forest','绿意与晨光'],['night','夜色与灯光']].map(([k,n])=>btn('set-room-style',n,q.roomStyle===k?'active':'',`data-value="${k}"`)).join('')}</div>`,btn('close','回到房间','primary'));}
async function exportFilm(){let s=review||life,rows=MEM.album(s);if(!rows.length){toast('旧存档没有可用的逐年画面。');return;}if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){modal('当前浏览器无法制作视频','<p>可以使用人生放映或保存完整HTML纪念册。</p>',btn('close','返回'));return;}if(window.parent!==window){modal('视频需要独立打开游戏','<p>当前平台容器限制二进制下载。请用离线HTML打开同一份存档再制作视频；这里可以先观看人生放映或导出纪念册。</p>',btn('film-view','观看放映','primary')+btn('close','返回'));return;}let cv=document.createElement('canvas');cv.width=480;cv.height=480;let ctx=cv.getContext('2d'),scene=document.createElement('canvas'),stream=cv.captureStream(15),chunks=[],rec=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm'});let tick=null;rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};rec.onstop=()=>{clearInterval(tick);stream.getTracks().forEach(t=>t.stop());let a=document.createElement('a'),u=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.href=u;a.download='此生-'+s.name+'-人生短片.webm';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);toast('短片已生成。');};let start=performance.now();const draw=()=>{let elapsed=performance.now()-start,index=Math.min(rows.length-1,Math.floor(elapsed/20000*rows.length)),row=rows[index];LifePixels.draw(scene,MEM.snapshot(s,row),elapsed/1000,'life');ctx.fillStyle='#f1eadb';ctx.fillRect(0,0,480,480);ctx.drawImage(scene,0,60,480,240);ctx.fillStyle='#394d40';ctx.font='28px sans-serif';ctx.fillText(s.name+' · '+row.age+'岁',24,350);ctx.font='16px sans-serif';ctx.fillText(row.year+'年 · '+row.education,24,390);ctx.fillText('此生 · 每个普通日子都曾发生',24,444);if(elapsed>=20000&&rec.state==='recording')rec.stop();};draw();rec.start();tick=setInterval(draw,100);modal('正在制作20秒短片','<p>保持此页打开。制作完成后会下载 WebM 视频。</p>',btn('close','继续等待','primary'));}
function lab(){running=false;labToken++;modal('人生实验室',`<p>在本机运行不同人生，不占用个人收藏。样本用游戏模型产生，不能代表真实社会统计。</p><div class="row wrap">${[100,300,1000].map(n=>btn('lab-run',n+'人抽样','',`data-value="${n}"`)).join('')}${btn('lab-five','今日五人生')}${btn('lab-era','年代对照')}</div><div id="lab-result" aria-live="polite"></div><h3 style="margin-top:20px">同日起点 · 课堂演示</h3><p class="small">点击4个数字设置班级码；同日、同码和同设置会得到相同出生档案。点击开始后各自选择。</p><div class="row wrap">${classDigits.map((v,i)=>btn('class-digit',v,'',`data-value="${i}" aria-label="第${i+1}位班级码：${v}"`)).join('')}${btn('class-start','从这个起点开始','primary')}</div><p class="tiny-note">年代对照仅改变游戏背景和收入系数，仍共用2023国家快照，不是真实历史重演。没有统计分析上传。</p>`,btn('worksheet','保存讨论学习单')+btn('close','返回','primary'));}
async function runLab(count,mode='sample'){let token=++labToken,rows=[],day=new Date().toISOString().slice(0,10),years=mode==='era'?[1950,1970,1990,2010,2026]:null;$('#lab-result').innerHTML='<p>正在计算…</p>';for(let i=0;i<count;i++){if(token!==labToken||!$('#dialog').open||!$('#lab-result'))return;rows.push(LifeLab.simulate(E,{...config,year:years?years[i]:config.year},LifeLab.seed(day+':'+mode+':'+i)));if(i%10===0){$('#lab-result').textContent=`已完成 ${i+1} / ${count} 人`;await new Promise(r=>setTimeout(r,0));}}if(token!==labToken||!$('#lab-result'))return;let r=LifeLab.summarize(rows,E);$('#lab-result').innerHTML=`<div class="lab-results"><div><small>样本</small><b>${r.count}</b></div><div><small>平均终年年龄</small><b>${r.averageAge.toFixed(1)}</b></div><div><small>活到5岁</small><b>${(r.under5Survival*100).toFixed(1)}%</b></div><div><small>25岁有大学学历</small><b>${(r.degree25*100).toFixed(1)}%</b></div><div><small>经济上升至少两档</small><b>${r.up}</b></div><div><small>经济下降至少两档</small><b>${r.down}</b></div></div><p class="tiny-note">学历比例仅以活到25岁的 ${r.adultDenominator} 人为分母；经济档位为游戏阈值，不代表真实收入分位。</p><div class="lab-bars">${r.ageBins.map((v,i)=>`<div style="height:${Math.max(3,v/Math.max(...r.ageBins)*100)}%" title="${i*10}至${i===10?110:i*10+9}岁：${v}人"></div>`).join('')}</div>${count===5?rows.map(s=>`<article class="public-card"><b>${s.born} · ${esc(s.name)}</b><p>${esc(s.upbringing.place.label)} · ${esc(s.upbringing.label)} → ${s.age}岁 · ${esc(s.education)}</p></article>`).join(''):''}`;}

function courseHub(group=courseGroup,page=0){courseGroup=Object.hasOwn(COURSE_GROUPS,group)?group:'education';coursePage=page;running=false;const q=E.course.ensure(life),c=E.country(life.country),rows=E.course.actions(life,c,E.country).filter(a=>a.group===courseGroup),size=matchMedia('(max-width:600px) and (max-height:740px)').matches?2:3,pages=Math.max(1,Math.ceil(rows.length/size));coursePage=Math.max(0,Math.min(pages-1,page));let body=`<div class="course-summary"><b>${esc(life.education)}</b><span>语言 ${Math.round(q.language)} · 技能 ${Math.round(q.skills)}</span><span>现金 ${money(life.cash)} · ${esc(E.jobName(life))}</span></div><div class="course-nav">${Object.entries(COURSE_GROUPS).map(([k,n])=>btn('course-group',n,courseGroup===k?'active':'',`data-value="${k}"`)).join('')}</div>`;

 case'spend':if(E.spend(life,v)){save();render();toast('已安排，状态与现金已更新。');}break;
 case'invest':case'withdraw':if(E.invest(life,a==='withdraw')){save();render();toast('资金已调整。');}break;
 case'archive':running=false;view='archive';review=null;close();render();break;case'archive-page':archivePage=+v;render();break;case'archive-open':{let found=archive.find(s=>s.id===v);if(!found)break;if(!found.ended){try{archive=STORE.retain(archive,life);}catch(e){toast(e.message);break;}life=JSON.parse(JSON.stringify(found));E.origins.ensure(life,E.country(life.origin));review=null;view=life.phase==='birth'?'birth':'game';birthPage=life.birthPage||0;tab='life';running=false;save();}else{review=found;memoryTab='room';albumPage=0;pathPage=0;view='ending';}render();break;}
 case'memory-tab':clearInterval(reelTimer);reelTimer=null;memoryTab=v;render();break;case'relic':{roomItem=v;render();let item=MEM.items(review||life).find(x=>x.id===v);if(item)modal(item.label,`<p>${item.age}岁 · ${(review||life).born+item.age}年</p><p>${esc(item.text)}</p>`,btn('close','回到房间','primary'));break;}case'album-page':albumPage=+v;render();break;case'path-page':pathPage=+v;render();break;case'memorial-export':exportMemorial();break;case'legacy-notes':modal('旧版本留下的话',(review||life).notes.map(n=>`<p>${n.age}岁 · ${esc(n.text)}</p>`).join(''),btn('close','返回'));break;
 case'reel-step':reelIndex=Math.max(0,reelIndex+(+v));render();break;case'reel-play':if(reelTimer){clearInterval(reelTimer);reelTimer=null;render();}else{reelTimer=setInterval(()=>{if(view!=='ending'||memoryTab!=='reel'||document.hidden)return;let rows=MEM.album(review||life);if(reelIndex>=rows.length-1){clearInterval(reelTimer);reelTimer=null;}else reelIndex++;render();},3500);render();}break;case'guest-message':{let target=review||life;target.guestMessage=['愿你被记得','谢谢你认真来过','愿每个起点都有更多机会'][+v];save();render();break;}
 case'last-note':modal('留给这一生的话',`<p>${esc((review||life).notes.at(-1)?.text||'愿你记得，那些普通却明亮的日子。')}</p>`,btn('close','关闭'));break;case'review':reviewLife();break;case'card':card();break;case'export':exportSave();break;case'import':openImport();break;case'import-file':$('#import-file').click();break;case'import-text':prepareImport($('#import-text').value);break;case'select-export':$('#export-text').focus();$('#export-text').select();break;
 case'theme':prefs.dark=!prefs.dark;document.body.classList.toggle('dark',prefs.dark);save();render();break;case'music':toggleMusic();break;
 case'story-detail':{let d=life.pending;if(d)modal(d.title,`<div class="eyebrow">${esc(d.chapter||'人生抉择')}</div><div class="full-story">${d.body.split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}</div><p class="small">关闭后继续选择，时间保持暂停。</p>`,btn('close','回到选择','primary'));break;}
 case'memories':{let m=(review||life)?.story?.memories||[];modal('那些有回声的选择',m.length?m.slice(-12).reverse().map(x=>`<article class="memory-item"><small>${x.age}岁 · ${esc(x.chapter)}</small><h3>${esc(x.title)}</h3><b>${esc(x.choice)}</b><p>${esc(x.text)}</p></article>`).join(''):'<p>选择还在前方。你的经历会在这里留下回声。</p>',btn('close','继续人生','primary'));break;}
 case'works':works();break;case'public-preview':publicPreview();break;case'public-save':(review||life).publicDraft={schema:1,visibility:'private',savedAt:new Date().toISOString()};save();toast('分享稿已保留在本机，尚未发布。');break;case'public-json':download('此生-只读人生.json','application/json',JSON.stringify(LifePublicSave.draft(review||life,E),null,2));break;case'public-html':exportPublicHtml();break;case'csv-export':download('此生-逐年记录.csv','text/csv',LifePublicSave.csv(review||life));break;case'film-view':close();memoryTab='reel';view='ending';render();break;case'film-export':exportFilm().catch(()=>toast('视频制作未完成，请使用HTML纪念册。'));break;case'room-style':roomStyles();break;case'set-room-style':E.course.setPolicy(review||life,'roomStyle',v);save();render();roomStyles();break;case'lab':lab();break;case'lab-run':runLab(+v);break;case'lab-five':runLab(5,'five');break;case'lab-era':runLab(5,'era');break;case'class-digit':classDigits[+v]=(classDigits[+v]+1)%10;lab();break;case'class-start':{if(life){try{archive=STORE.retain(archive,life);}catch(e){toast(e.message);break;}}life=E.newLife(config,LifeLab.seed(new Date().toISOString().slice(0,10)+':'+classDigits.join('')+':'+JSON.stringify(config)));life.classroom=true;birthPage=0;view='birth';review=null;running=false;close();save();render();break;}case'worksheet':worksheet();break;
 case'about':about();break;case'settings':settings();break;case'save-settings':config.year=+$('#year-select').value;config.duration=+$('#duration-select').value;config.compare=$('#compare-select').value;if(life&&view==='game'){life.duration=config.duration;life.compare=config.compare;save();}close();render();toast('设置已保存；出生年份只用于新人生。');break;
 case'country-detail':countryDetail(v);break;case'countries':countries();break;case'countries-page':countries(+v,$('#country-search')?.value||'');break;case'more':more();break;case'close':close();break;
 case'allnotes':modal('写给人生的话',life.notes.map(n=>`<div class="history-item"><span class="date">${n.age} 岁</span><p>${esc(n.text)}</p></div>`).join(''),btn('close','关闭'));break;
 }
});
function openImport(){if(window.parent!==window){modal('在平台恢复进度','<p>平台内暂不支持恢复JSON，原进度不会改变。</p><p>请退出游戏，在平台“存档”页恢复CJ1；JSON备份请在独立版导入。</p>',btn('close','知道了','primary'));return;}modal('导入 JSON 存档',`<p>粘贴“此生”导出的完整 JSON。最多100段人生，文件不超过32MB。平台CJ1请在平台“存档”页恢复。</p><label for="import-text">JSON 存档内容</label><textarea id="import-text" rows="6" spellcheck="false" placeholder="粘贴完整 JSON，不是 CJ1 存档码"></textarea><p id="import-error" role="alert"></p>`,btn('import-file','选择 JSON 文件')+btn('import-text','检查并恢复','primary'));}
function prepareImport(text){
 try{
  if(new Blob([text]).size>32*1024*1024)throw Error();
  let data=JSON.parse(text);
  STORE.parse(data,E.valid);
  modal('恢复备份存档',`<p>备份内含 ${data.archive.length} 段珍藏人生${data.life?`，当前人生为 ${esc(data.life.name)}（${data.life.age} 岁）`:''}。</p><p>导入将替换本浏览器当前存档与收藏；可以先导出原进度。</p>`,btn('export','先导出原进度')+'<button id="apply-import" class="primary">确认恢复</button>');
  $('#apply-import').onclick=async()=>{if(importBusy)return;importBusy=true;running=false;const button=$('#apply-import');button.disabled=true;button.textContent='正在保存，请勿关闭';$('#dialog').querySelectorAll('button').forEach(el=>el.disabled=true);
   try{const candidate={...data,config:{...config,...data.config,compare:data.life?.compare||''},prefs:{...prefs}};if(candidate.life){E.origins.ensure(candidate.life,E.country(candidate.life.origin));if(candidate.life.pending?.type==='reflection'&&candidate.life.pending.options[0]?.id==='write')candidate.life.pending.options=[{id:'reflect-learn',label:'继续认识世界',hint:'知识 +3 · 幸福 +1'},{id:'reflect-people',label:'珍惜身边的人',hint:'关系 +3 · 幸福 +2'},{id:'reflect-rest',label:'照顾自己',hint:'健康 +3 · 幸福 +1'}];}
    await storageSession.importBundle(candidate);life=candidate.life;archive=candidate.archive;config=candidate.config;birthPage=life?.birthPage||0;selected=null;reflectionDraft='';progress=0;review=null;storageOK=true;importBusy=false;close();view='home';render();toast('存档已写入此设备，可继续人生或打开收藏。');
   }catch(e){importBusy=false;$('#dialog').querySelectorAll('button').forEach(el=>el.disabled=false);button.textContent='重试恢复';let error=$('#restore-error');if(!error){error=document.createElement('p');error.id='restore-error';error.setAttribute('role','alert');$('#dialog .dialog-body').append(error);}error.textContent='恢复未完成，原进度和收藏未改变。'+(window.parent!==window?e.message:'请保留原始JSON，检查浏览器存储空间后重试，或关闭弹窗继续原人生。');}
  };
 }catch{const error=$('#import-error');if(error)error.textContent='无法读取这个存档，原进度没有改变。请粘贴完整的此生 JSON 存档。';else toast('无法读取这个存档，原进度没有改变。');}
}
$('#import-file').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>32*1024*1024){toast('文件超过32MB上限，原进度未改变。请保留原始备份。');return;}try{prepareImport(await file.text());}catch{toast('无法读取这个文件，原进度没有改变。');}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){running=false;render();save();}});
$('#dialog').addEventListener('cancel',e=>{if(importBusy){e.preventDefault();return;}if($('#note-input')){try{sessionStorage.setItem('this-life.note-draft',$('#note-input').value);}catch{}}});
setInterval(()=>{if(!life||life.ended||!running||view!=='game'||$('#dialog').open||document.hidden)return;if(life.pending){if(life.auto){let opt=life.pending.options[Math.floor(E.rand(life)*life.pending.options.length)];E.resolve(life,opt.id);selected=null;reflectionDraft='';save();render();}return;}let seconds=life.duration*60/80;progress+=.25*speed/seconds;if(progress>=1)tick();else{let bar=$('#time-progress');if(bar)bar.style.width=`${Math.min(100,progress*100)}%`; }},250);
window.addEventListener('resize',()=>{if(['game','birth','ending','archive'].includes(view)&&document.activeElement?.tagName!=='TEXTAREA')render();});
render();
})();
</script></body></html>
