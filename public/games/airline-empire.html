:root{--bg:#f3f2ec;--paper:#fffefa;--ink:#183c34;--muted:#66776d;--line:#e0e5da;--green:#205a49;--lime:#eaf2df;--orange:#a56b31;--red:#a64636;--font:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}

.app-layout{height:100vh;height:100dvh;min-height:0;display:grid;grid-template-columns:224px minmax(0,1fr);overflow:hidden}

.sidebar{position:relative;width:auto;inset:auto;padding:26px 17px 18px;min-height:0;overflow:auto;background:#193d34;color:#e9f0e8;border:0;display:flex;flex-direction:column;z-index:20}

.topbar{grid-row:1}.mobile-page-switch{grid-row:2}.content{grid-row:3}.command-dock{grid-row:4}
.main-shell{grid-column:2;min-width:0;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}

.topbar{height:64px;padding:0 30px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#fbfcf7;gap:16px}

.content{min-height:0;min-width:0;overflow:auto;overscroll-behavior:contain;padding:26px 30px 30px;scrollbar-gutter:stable;max-width:1600px;width:100%;margin:0 auto}

.nav button{display:flex;align-items:center;gap:12px;padding:11px 13px;min-height:44px;border-radius:8px;font-size:13px;white-space:nowrap;color:#b8c9bd;text-align:left}

.nav button.active{background:#dce8d2;color:#173e31;box-shadow:0 5px 20px #071b1220}

.brand{display:flex;align-items:center;gap:11px;margin:0 4px 18px}

.brand-mark{width:38px;height:38px;background:#d9e7cc;color:#204e3c;border-radius:10px;display:grid;place-items:center;transform:rotate(-7deg)}

.brand small{font-size:9px;letter-spacing:1.8px;display:block;color:#a8bba8}

.nav-label{color:#8fa893;font-size:10px;letter-spacing:1.5px;padding:0 13px;margin:20px 0 9px}

.helpbox{padding:16px;background:#24483b;border:1px solid #3d5b48;border-radius:10px;font-size:13px;margin:20px 0 12px}

.profile{display:flex;gap:10px;align-items:center;padding:14px 6px 0;border-top:1px solid #47604d;font-size:13px}

.btn{min-height:44px;padding:10px 15px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center;gap:7px;justify-content:center;white-space:normal;line-height:1.4}

.btn.tiny{min-height:44px;font-size:12px;padding:8px 11px}

.icon-btn{min-width:44px;min-height:44px;padding:10px;border-radius:7px;flex-shrink:0}

.filter-btn{min-height:44px;padding:8px 13px;border-radius:7px;border:1px solid var(--line);background:white;font-size:13px}

.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:14px}

.subtitle{font-size:13px;color:#6a7b70;margin-top:7px;line-height:1.6}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 3px 14px #1c3e2604}

.page-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}

.modal-backdrop{position:fixed;inset:0;background:#09251db3;backdrop-filter:blur(7px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}

.modal{width:620px;max-width:100%;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow:hidden;background:#fffefa;border-radius:18px;box-shadow:0 24px 90px #061b1750;display:flex;flex-direction:column;min-height:0}

.modal-head{padding:20px 24px 14px;display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0;background:#fffefa;gap:12px;border-bottom:1px solid var(--line)}

.modal-head h2{font-size:21px;line-height:1.45;letter-spacing:-.5px}

.modal-body{min-height:0;overflow:auto;overscroll-behavior:contain;padding:20px 24px;flex:1 1 auto}

.modal-body p{font-size:14px;line-height:1.8;color:#657768;margin-bottom:14px}

.form-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:0;flex-wrap:wrap}

.field{display:flex;flex-direction:column;gap:7px;min-width:0;font-size:13px;color:#53695b}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}

.stat{background:#fffefa;border:1px solid var(--line);border-radius:11px;padding:16px 18px}

.stat-value{font-variant-numeric:tabular-nums;font-size:28px;font-weight:650;letter-spacing:-1px;margin-top:5px;color:#183e31;line-height:1.35}

.stat-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#657a68}

.stat-foot{display:flex;gap:7px;font-size:12px;margin-top:8px;color:#788574}

.model-name{width:100%;height:100%;padding:20px 24px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(120deg,#edf2e7,#f9faf5);text-align:left}

.aircraft-card .plane-render{height:150px;display:flex;align-items:center;justify-content:center;background:#eff3e9}

.maker-model{gap:8px;padding:20px 22px}

.maker-model strong{font-size:22px;line-height:1.3;letter-spacing:-.5px}

.maker-logo{width:150px;height:36px;object-fit:contain;object-position:left center;flex-shrink:0}

.maker-logo[alt="Airbus"]{width:145px;height:50px}

.world-map.large{height:420px}

.mobile-extra{display:none}

.mobile-page-switch{display:none}

.footer-note{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-top:24px;color:#7e8b77;font-size:12px}

.info-inline{font-size:12px;color:#56735a}

function head(eyebrow,title,sub,actions=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subtitle">${sub}</p></div><div class="head-buttons">${actions}</div></div>`;}
function stats(items){return `<div class="stats">${items.map(([label,value,unit,foot,icon,positive])=>`<div class="stat"><div class="stat-top">${label}<span class="sicon">${ic(icon,15)}</span></div><div class="stat-value">${value}<em>${unit}</em></div><div class="stat-foot"><span class="${positive?'positive':''}">${positive?'↗ ':''}${foot}</span></div></div>`).join('')}</div>`;}
function overview(){const report=state.lastReport,rs=state.routes.filter(r=>r.active),rank=E.rankings(state).findIndex(r=>r.player)+1;let flights=[];for(const p of state.fleet.filter(p=>E.planeAvailable(state,p)))try{flights.push(...E.schedulePlan(state,p.id).flatMap(t=>t.segments.map(l=>({...l,model:p.model,base:t.base}))));}catch{}flights.sort((a,b)=>a.dep-b.dep);const tasks=[state.pending?['董事会等待你的决定',state.pending.title,'story','处理待办']:['本周航班计划已准备',`${rs.length} 条在营航线 · ${flights.length} 个计划航段`,'navigate','检查排班','schedule'],state.fleet.some(p=>p.condition<65)?['机队需要照料','留意维护状态，安排检修再出发。','navigate','查看机队','fleet']:['为下一程做准备','比较市场需求，再决定下一条航线。','navigate','寻找机会','insights']];return `<section class="overview-hero"><div><span class="eyebrow">${esc(state.name)} · FLIGHT OPERATIONS</span><h1>让每一次起飞，都有远方。</h1><p>${E.ap(state.base).city}始发 · 全球排名 #${rank} · 你的天空，正在延伸</p>${button('致有蓝天梦的人','blueDream','book')}</div><span class="hero-coordinate">${state.base}<small>${E.ap(state.base).lat.toFixed(2)}° N</small></span></section>${stats([['可用现金',money(state.cash),'',report?`周利润 ${money(report.profit,true)}`:'可用于运营与扩张的现金','wallet'],['在役飞机',state.fleet.filter(p=>!p.delivery).length,'架',`${state.fleet.filter(p=>p.delivery).length} 架待交付`,'plane'],['运营航线',rs.length,'条',`覆盖 ${new Set(rs.flatMap(E.routePoints)).size} 座机场`,'route'],['旅客口碑',state.rep.toFixed(1),'/100',`可靠性 ${state.reliable.toFixed(1)}%`,'star']])}${quickTools()}<div class="workspace-tabs" role="tablist" aria-label="运营总览分区">${[['dispatch','本周运营'],['network','航线地图'],['news','世界动态']].map(([id,label])=>`<button role="tab" aria-selected="${dashboardTab===id}" data-action="dashboardTab" data-tab="${id}">${label}</button>`).join('')}</div><div class="briefing-workspace">${dashboardTab==='dispatch'?`<div class="briefing-grid"><section class="panel departure-board"><div class="panel-head"><h2>本周起飞计划</h2>${button('完整排班','navigate','clock','data-target="schedule"','tiny')}</div>${flights.slice(0,3).map(l=>`<div class="departure-row"><time>${E.localClock(state,l.base,l.dep,l.a).time}<small>周${E.localClock(state,l.base,l.dep,l.a).weekday}</small></time><div><strong>${l.a} <span>→</span> ${l.b}</strong><small>${E.ap(l.a).city}至${E.ap(l.b).city} · ${E.modelName(l.model)}</small></div><span class="status-light">已计划</span></div>`).join('')||'<div class="empty">先为可用飞机规划一条航线。</div>'}</section><aside class="panel duty-brief"><div class="panel-head"><h2>运营简报</h2><span class="tag">W${state.week}</span></div>${tasks.map(([t,d,a,b,target])=>`<div class="brief-task"><div><h3>${esc(t)}</h3><p>${esc(d)}</p></div>${button(b,a,'arrow',target?`data-target="${target}"`:'','tiny')}</div>`).join('')}${button('查看经营周报','report','chart','','brief-report')}</aside></div>`:dashboardTab==='network'?`<section class="panel map-panel"><div class="panel-head"><h2>连接你与世界</h2><div class="tabs">${['china','world'].map(id=>`<button data-action="map" data-mode="${id}" class="${mapMode===id?'active':''}">${id==='china'?'中国':'全球'}</button>`).join('')}</div></div>${map(false)}<div class="map-legend"><span><i class="map-key base"></i>运营基地</span><span><i class="map-key"></i>在营航线</span>${button('展开全景','panorama','globe','','tiny')+button('规划航线','newRoute','plus','','tiny')}</div></section>`:`<section class="panel padded"><div class="card-title"><h2>世界的变化，航线的机会</h2>${button('完整日历','navigate','','data-target="events"','tiny')}</div>${E.activeEvents(state).slice(0,2).map(e=>eventMini(e)).join('')||'<p>本周市场平稳。</p>'}${calendarUpcoming().slice(0,1).map(e=>eventMini(e,true)).join('')}</section>`}</div>`;}

function project(lon,lat){return AIR_MAP.project(lon,lat,mapMode);}
function map(large){let shapes='';const world=window.AIR_WORLD||[];for(const poly of world){let pts=poly.map(p=>project(p[0],p[1]));if(mapMode==='world'){let runs=[],run=[];for(let i=0;i<pts.length;i++){if(i&&Math.abs(pts[i][0]-pts[i-1][0])>500){if(run.length>2)runs.push(run);run=[];}run.push(pts[i]);}if(run.length>2)runs.push(run);shapes+=runs.map(a=>`<path class="land" d="M${a.map(p=>p.map(n=>n.toFixed(1)).join(',')).join('L')}Z"/>`).join('');}else shapes+=`<path class="land" d="M${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join('L')}Z"/>`;}
const projected=D.airports.map(a=>({...a,xy:project(a.lon,a.lat)})).filter(a=>a.xy[0]>0&&a.xy[0]<1000&&a.xy[1]>0&&a.xy[1]<450);let routepaths=state.routes.flatMap(r=>E.routeLegs(r).map(l=>({...r,...l}))).map(r=>AIR_MAP.curves(E.ap(r.from),E.ap(r.to),mapMode).map(c=>`<path class="flight-path ${r.active?'':'paused'}" d="${c.d}"><title>${E.ap(r.from).city} → ${E.ap(r.to).city}${r.active?'':' · 暂停'}</title></path>${r.active?`<circle class="flight-dot" r="2.3" fill="#608c64"><animateMotion dur="${7+r.id%4}s" repeatCount="indefinite" path="${c.d}"/></circle>`:''}`).join('')).join('');let connected=new Set(state.routes.flatMap(E.routePoints));let labels=new Set(mapMode==='china'?['HGH','PKX','PVG','CAN','TFU','KMG','URC','HRB','XIY','HKG','NRT','BKK','ICN','SYX']:['HGH','LHR','CDG','DXB','SIN','SYD','LAX','JFK','JNB','GRU','NRT']);return `<div class="world-map ${large?'large':''}"><svg viewBox="0 0 1000 450" role="img" aria-label="航线网络地图，美洲在东侧，欧洲与非洲在西侧"><defs><pattern id="mapdots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".55" fill="#dce5d7"/></pattern></defs><rect width="1000" height="450" fill="url(#mapdots)" opacity=".3"/>${[60,150,240,330,420].map(y=>`<path class="graticule" d="M0 ${y}H1000"/>`).join('')}${shapes}${routepaths}${projected.map(a=>{let base=state.hubs.some(h=>h.code===a.code),active=connected.has(a.code),[x,y]=a.xy;return `<g class="destination" data-action="airport" data-code="${a.code}" tabindex="0" role="button" aria-label="${a.city} ${a.code}"><title>${a.city} ${a.name} · ${a.code}</title>${base?`<circle cx="${x}" cy="${y}" r="10" fill="#c8aa6e" opacity=".12"/><circle cx="${x}" cy="${y}" r="6.5" fill="none" stroke="#bb9c63" stroke-width=".7"/>`:''}<circle cx="${x}" cy="${y}" r="${base?3.4:active?3:1.8}" fill="${base?'#b8995b':active?'#4e7f58':'#bfcdb7'}"/>${(labels.has(a.code)||active)?`<text x="${x+8}" y="${y+(a.code==='PVG'?14:-6)}" class="map-label ${base?'base':''}">${esc(a.city)}${base?' · 基地':''}</text>`:''}</g>`}).join('')}</svg></div>`;}
let panoramaView={x:0,y:0,w:1000,h:450},panoramaDrag=null,panoramaDragged=false;
function applyPanorama(){const svg=$('.panorama-map svg');if(!svg)return;svg.setAttribute('viewBox',`${panoramaView.x} ${panoramaView.y} ${panoramaView.w} ${panoramaView.h}`);$('#map-zoom-level').textContent=Math.round(1000/panoramaView.w*100)+'%';}
function zoomPanorama(factor,airport=null){const v=panoramaView,w=Math.max(125,Math.min(1000,v.w/factor)),h=w*.45,center=airport?AIR_MAP.project(airport.lon,airport.lat):[v.x+v.w/2,v.y+v.h/2];panoramaView={x:Math.max(0,Math.min(1000-w,center[0]-w/2)),y:Math.max(0,Math.min(450-h,center[1]-h/2)),w,h};applyPanorama();}
function focusMapAirport(code){const a=E.ap(code);if(!a)return;panoramaView.w=1000;zoomPanorama(4,a);$('#panorama-airport').value=code;$('#panorama-info').textContent=`${a.country} · ${a.city} · ${a.code} · ${state.routes.filter(r=>E.routePoints(r).includes(code)).length} 条航线经过此机场`;}
function panorama(){mapMode='world';panoramaView={x:0,y:0,w:1000,h:450};showModal('全球航线全景',`<div class="panorama-toolbar"><label>查找机场<select id="panorama-airport" aria-label="在全景地图查找机场"><option value="">选择城市或机场</option>${D.airports.slice().sort((a,b)=>a.city.localeCompare(b.city,'zh-CN')).map(a=>`<option value="${a.code}">${esc(a.city)} · ${a.code} · ${esc(a.country)}</option>`).join('')}</select></label><div class="panorama-tools">${button('−','mapZoom','','data-factor="0.67" aria-label="缩小地图"')}<span id="map-zoom-level">100%</span>${button('+','mapZoom','','data-factor="1.5" aria-label="放大地图"')}${button('查看全部','mapFit')}${button('定位基地','mapBase')}</div></div><div class="panorama-map">${map(true)}</div><div class="panorama-caption"><span>西侧 · 欧洲 / 非洲</span><span>亚洲 · 太平洋</span><span>东侧 · 美洲</span></div><p id="panorama-info">${state.routes.length} 条航线 · ${state.hubs.length} 个基地 · ${D.airports.length} 座机场。拖动地图查看细节，点击机场查看信息。</p><div class="form-actions"><span class="map-disclaimer">航线示意图；实际航程按距离计算。</span>${button('收起全景','closeModal','close','','primary')}</div>`,'美洲航线向东跨太平洋，欧洲和非洲位于西侧。',true);$('.modal').classList.add('panorama-modal');applyPanorama();}
document.addEventListener('pointerdown',e=>{const svg=e.target.closest('.panorama-map svg');if(!svg)return;panoramaDragged=false;panoramaDrag={id:e.pointerId,x:e.clientX,y:e.clientY,start:{...panoramaView},svg};});
document.addEventListener('pointermove',e=>{const d=panoramaDrag;if(!d||e.pointerId!==d.id)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(Math.hypot(dx,dy)<5&&!panoramaDragged)return;panoramaDragged=true;d.svg.setPointerCapture(e.pointerId);const r=d.svg.getBoundingClientRect(),scale=Math.min(r.width/d.start.w,r.height/d.start.h);panoramaView.x=Math.max(0,Math.min(1000-panoramaView.w,d.start.x-dx/scale));panoramaView.y=Math.max(0,Math.min(450-panoramaView.h,d.start.y-dy/scale));applyPanorama();});
document.addEventListener('pointerup',()=>{panoramaDrag=null;});document.addEventListener('pointercancel',()=>{panoramaDrag=null;panoramaDragged=false;});
function eventMini(e,future=false){return `<div class="event-item"><div class="event-symbol ${future?'amber':''}">${ic(future?'calendar':'sun',15)}</div><div><h4>${esc(e.title)}</h4><p>${esc(e.desc||'提前布局运力，准备迎接客流变化。')}</p><div class="event-impact">${future?'提前规划':e.closed?'相关航线暂停':e.demand>1?`相关市场客流 +${Math.round((e.demand-1)*100)}%`:'留意运营成本变化'}</div>${future?`<div class="event-date">${e.when}</div>`:''}</div></div>`;}
function routeTable(rows,compact=false){return rows.length?`<div class="table-scroll"><table><thead><tr><th>航线</th>${compact?'':'<th>执飞机型</th><th>往返 / 周</th>'}<th>客座率</th><th>航线贡献</th><th>${compact?'状态':'管理'}</th></tr></thead><tbody>${rows.map(r=>{let e=state.lastReport&&r.last?r.last:E.estimate(state,r),p=state.fleet.find(p=>p.id===r.plane);return `<tr><td><div class="route-name"><div><strong>${r.from}</strong><small>${E.ap(r.from).city}</small></div><span class="route-arrow">${ic('arrow',15)}</span><div><strong>${r.to}</strong><small>${E.ap(r.to).city}</small></div></div>${r.via?`<small class="stop-caption">经 ${E.ap(r.via).city} ${r.via} · 每次 ${E.stopMinutes(r)} 分钟</small>`:''}</td>${compact?'':`<td>${p?esc(E.modelName(p.model)):'待指派飞机'}<small style="display:block">${p?'B-YS'+String(p.id).padStart(3,'0'):'出租方已收回 · 请调整航线'}</small></td><td>${r.freq} 班</td>`}<td><div class="load"><span class="track"><i style="width:${e.load*100}%"></i></span>${pct(e.load)}</div></td><td class="table-amount ${e.profit>=0?'positive':'negative'}">${money(e.profit,true)}</td><td>${compact?`<span class="tag ${!r.active||e.closed?'amber':''}">${!r.active?'已暂停':E.effects(state,r).closed?'空域限制':!E.planeAvailable(state,p)?'飞机停场':'运营中'}</span>`:`<div class="route-actions">${button('调整','editRoute','',`data-id="${r.id}"`,'tiny')}${button(r.active?'暂停':'恢复','toggle','',`data-id="${r.id}"`,'tiny')}${button('关闭','closeRoute','',`data-id="${r.id}"`,'tiny danger')}</div>`}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">还没有开通航线。为已交付的飞机规划第一条航线。</div>';}
function routes(){const rows=pageItems(state.routes,'routes');return `${head('NETWORK PLANNING','每一条航线，都是一次连接。','按机场、运力与市场规划你的网络。',button('展开全景','panorama','globe')+button('开通航线','newRoute','plus','','primary'))}<div class="workspace-tabs" role="tablist" aria-label="航网分区">${[['list','航线运营'],['map','全球地图']].map(([id,label])=>`<button role="tab" aria-selected="${networkTab===id}" data-action="networkTab" data-tab="${id}">${label}</button>`).join('')}</div>${networkTab==='list'?`${pager('routes')}<section class="panel route-management">${routeTable(rows)}</section>`:`<section class="panel map-panel"><div class="panel-head"><h2>航线网络 · ${state.routes.length} 条</h2><div class="tabs"><button data-action="map" data-mode="china">中国</button><button data-action="map" data-mode="world">全球</button></div></div>${map(true)}<p class="map-legend">点击机场可规划航线；也可使用上方「开通航线」按钮。</p></section>`}`;}

function planeSVG(m){const brand=D.makers[m.maker];return `<div class="model-name maker-model"><img class="maker-logo" src="${brand.logo}" alt="${brand.name}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><small hidden>${brand.name}</small><strong>${esc(E.modelName(m))}</strong><span class="${m.fictional?'concept-label':''}">${m.fictional?'虚拟飞机 · 概念性能':m.id.includes('ULR')?'超远程系列 · 提前开放':m.usedOnly?'成熟机型 · 二手交易':m.type+' · 自定义客舱'}</span></div>`;}

function fleet(){const rows=pageItems(state.fleet.filter(p=>fleetFilter==='全部'||fleetFilter==='待交付'&&p.delivery||fleetFilter==='检修'&&p.maintenance||fleetFilter==='在役'&&!p.delivery&&!p.maintenance),'fleet','cards');return `${head('FLEET MANAGEMENT','好飞机，是好航司的起点。','统一机队、合理利用，把飞机的每一个小时用在值得的地方。',button('我的机库','navigate','tool','data-target="hangar"')+button('购置 / 租赁飞机','market','plus','','primary'))}<div class="filters">${['全部','在役','待交付','检修'].map(x=>`<button class="filter-btn ${fleetFilter===x?'active':''}" data-action="fleetFilter" data-filter="${x}">${x}</button>`).join('')}<small style="margin-left:auto">全天 24 小时可排班 · 每架飞机每周最多飞行 100 小时</small></div>${pager('fleet')}<div class="page-grid fleet-grid">${rows.map(p=>{const m=E.model(p.model),hours=E.usedHours(state,p.id),c=E.cabinOf(p),cs=E.cabinStats(m,c);return `<article class="aircraft-card"><div class="plane-render">${planeSVG(m)}</div><div class="card-body"><div class="card-title"><h3>${esc(E.modelName(m))}</h3><span class="tag ${p.delivery||p.maintenance?'amber':p.condition<55?'red':''}">${p.reposition?'调机中 · 1 周':p.delivery?`${p.delivery} 周后交付`:p.maintenance?`检修 ${p.maintenance} 周`:p.maintenanceBlocked?'检修待资金':p.condition<=65?'下周自动检修':'可运营'}</span></div><small>B-YS${String(p.id).padStart(3,'0')} · ${p.mode==='lease'?'经营性租赁':'自有资产'} · ${m.maker} · 驻地 ${E.planeBase(state,p)} · 机龄 ${(p.age/52).toFixed(1)} 年${E.pledged(state,p.id)?' · 已抵押':''}</small><div class="specs"><div><small>客舱座位</small>${cs.total} 席</div><div><small>参考航程</small>${m.range.toLocaleString()} km</div><div><small>周租金</small>${p.mode==='lease'?money(E.weeklyLease(p)):'无'}</div></div><div class="cabin-summary"><span>经济 ${c.economy} · 商务 ${c.business} · 头等 ${c.first}</span><strong>舒适度 ${cs.comfort.toFixed(0)}</strong></div>${p.mode==='lease'?`<p class="lease-caption">出租方：${E.lessor(E.leaseInfo(p,state).lessor).name} · 模拟租赁公司${p.leaseContract?.recall?`<br>预计第 ${p.leaseContract.recall.dueWeek} 周收回，未用租金按日返还。`:''}</p>`:''}${p.mode==='lease'?button('查看租约','leaseDetail','book',`data-id="${p.id}"`):''}${button('调整舱位布局','cabin','seat',`data-id="${p.id}"`,'cabin-edit')}<div class="progress-row"><div><span>维护状态</span><span class="${p.condition<65?'negative':''}">${p.condition.toFixed(0)}%</span></div><div class="track"><i style="width:${p.condition}%"></i></div></div><div class="progress-row"><div><span>计划利用率</span><span>${hours.toFixed(1)} / 100 小时</span></div><div class="track"><i style="width:${hours}%"></i></div></div><div class="card-bottom">${button('安排航线','newRoute','',`data-plane="${p.id}" ${!E.planeAvailable(state,p)?'disabled':''}`,'primary')}${button('检修','maintain','',`data-id="${p.id}" ${p.delivery||p.maintenance?'disabled':''}`)}${button('调往基地','rebase','',`data-id="${p.id}"`)}${button(p.mode==='lease'?'退租':'出售','dispose','',`data-id="${p.id}" ${p.delivery?'disabled':''}`)}</div></div></article>`}).join('')||'<div class="empty">暂无符合条件的飞机。</div>'}</div>`;}
let catalogFiltersOpen=false;

function delayPolicyModal(){const p=E.disruptionPolicy(state);showModal('延误保障策略',`<form id="delay-policy-form"><p>天气、航路管制会按实际时刻影响航班。同一架飞机晚到后，后续航班会顺延；原计划中的空闲时间可吸收部分延误。</p><label class="field">严重延误时优先处理方式<select name="mode">${Object.entries(E.DELAY_POLICIES).map(([key,label])=>`<option value="${key}" ${p.mode===key?'selected':''}>${label}</option>`).join('')}</select></label><label class="field" style="margin-top:14px">每周自动改签预算上限<select name="budget">${[.5,1,3].map(n=>`<option value="${n}" ${p.budget===n?'selected':''}>${money(n)}</option>`).join('')}</select></label><p class="advisor-detail">延误达到 3 小时尝试保障。优先改签：寻找同起讫机场、能更早送达的自家后续航班空位，再询价合作航司；没有合适座位或预算不足时，继续照顾旅客，部分旅客会退票。优先退款：严重延误旅客直接退还票款及辅营费用。</p><p class="advisor-detail">游戏补偿：延误 3 小时起每人 250 元，6 小时起 500 元；2 小时起餐饮 80 元，6 小时起餐宿合计 480 元。自家改签服务成本每人 80 元；合作航司按原订单收入的 115% 加 60 元计费。改签预算还受当前现金限制，补偿与餐宿另计。</p><p class="muted">以上为游戏服务标准，不代表现实航司、法律赔偿规则或实时天气。合作运力为模拟报价，不保证存在空位。选择策略本身不扣费，下周实际发生后结算。</p><div class="form-actions">${button('取消','closeModal')}<button type="submit" class="btn primary">保存保障策略</button></div></form>`,'旅客体验 · 在成本与恢复出行之间作出选择');}
function delayPanel(page=0){const d=state.lastReport?.disruption;if(!d){toast('下一次周结算后可查看运行保障记录。');return;}const legs=d.legs.filter(l=>l.delay>=15),pages=Math.ceil(legs.length/4)+1;page=Math.max(0,Math.min(page,pages-1));let body='';if(page===0){body=`<p>${d.incidents.length?d.incidents.map(e=>esc(e.title)).join('；'):legs.length?'上周延误继续影响本周航班':'本周没有影响运营的天气或航路管制。'}</p><div class="quote"><div><small>延误 / 连锁航段</small>${d.delayedLegs} / ${d.propagatedLegs}</div><div><small>航段准点率</small>${d.onTime.toFixed(1)}%</div><div><small>受影响旅客</small>${d.affectedPax} 人</div><div><small>保障后满意度</small>${d.affectedPax?d.satisfaction.toFixed(1)+'/100':'—'}</div></div><p>本周策略：${esc(E.DELAY_POLICIES[d.policy])}。自家改签 ${d.rebookedOwn} 人，合作航司改签 ${d.rebookedPartner} 人，退款 ${d.refundedPax} 人；口碑影响 ${d.repDelta.toFixed(2)}。</p><div class="report-lines">${[['退票收入减少',d.refunds],['旅客现金补偿',d.compensation],['餐饮与住宿',d.care],['同航路改签支出',d.rebooking],['运行恢复额外开支',d.operations]].map(([label,n])=>`<div><span>${label}</span><span>−${money(n)}</span></div>`).join('')}<div class="total"><span>本周利润影响</span><strong>−${money(d.loss)}</strong></div></div><p class="muted">改签须有同起讫机场的空位、较早到达时间及预算。合作航司运力为游戏模拟；补偿不能完全抵消等待带来的不满。周界后未消化的飞机延误会延续到下周。</p>`;}else body=legs.slice((page-1)*4,page*4).map(l=>`<article class="delay-leg"><span class="tag">${l.propagated?'前序晚到 · 连锁延误':'天气 / 航路影响'}</span><h3>${l.from} → ${l.to} · B-YS${String(l.plane).padStart(3,'0')}</h3><p>计划起飞 ${delayClock(l,l.plannedDep,l.from)} → 实际 ${delayClock(l,l.actualDep,l.from)}</p><p>计划到达 ${delayClock(l,l.plannedArr,l.to)} → 实际 ${delayClock(l,l.actualArr,l.to)}</p><strong class="negative">晚到 ${Math.round(l.delay)} 分钟</strong></article>`).join('');showModal(`第 ${d.week} 周 · 延误与旅客保障`,`<div class="advisor-pager"><span>${page===0?'保障与收支汇总':`航段明细 · ${page} / ${pages-1}`}</span></div>${body}<div class="form-actions">${button(page===0?'关闭':'上一页',page===0?'closeModal':'delayReport','','data-page="'+(page-1)+'"')}${button('调整保障策略','delayPolicy')}${page<pages-1?button('查看'+(page===0?'延误航段':'下一页'),'delayReport','arrow','data-page="'+(page+1)+'"','primary'):''}</div>`,'按实际航班传递延误 · 费用已计入本周结算');}

function events(){const active=E.activeEvents(state);return `${head('WORLD INTELLIGENCE','世界的变化，也是航线的机会。','节庆、赛事与国际情景将改变需求、油价及航路可用性。')}${state.pending?`<section class="section-intro" style="background:#f6f0df"><div><small>${esc(state.pending.tag)}</small><h2 style="margin-top:5px">${esc(state.pending.title)}</h2><p>董事会需要你的决定。结算前必须完成处理。</p></div>${button('查看并决策','story','arrow','','primary')}</section>`:''}<div class="notice">外交、冲突、油价与竞争故事均为虚构经营情景；节庆窗口为游戏近似，赛事按所列年份触发。游戏不提供实时新闻或现实战争预测。</div><h2 style="margin-bottom:15px">本周正在影响市场</h2><div class="page-grid">${active.map(e=>`<article class="panel event-card"><span class="tag ${e.calendar?'':'amber'}">${e.calendar?'季节与赛历':'模拟情景'}</span><h3>${esc(e.title)}</h3><p>${esc(e.desc)}</p><div class="impact">${e.closed?'相关航线暂停运营':`相关需求 ×${(e.demand??1).toFixed(2)} · 燃油价格 ×${(e.fuel||1).toFixed(2)}`}${e.calendar?'':` · 持续至第 ${e.until} 周`}</div></article>`).join('')||'<div class="panel empty">本周市场平稳，可专注航线优化与机队维护。</div>'}</div><h2 style="margin:26px 0 15px">提前看下一站</h2><div class="page-grid">${calendarUpcoming().map(e=>`<article class="panel event-card"><small class="mono">${e.when}</small><h3>${e.title}</h3><p>${e.desc}</p></article>`).join('')}</div><section class="panel" style="margin-top:24px"><div class="panel-head"><h2>公司经营纪事</h2><small>最近 ${Math.min(20,state.log.length)} 条</small></div><div class="timeline">${state.log.slice(0,20).map(l=>`<div class="timeline-row"><span>W${String(l.week).padStart(2,'0')}</span><div class="${l.type==='warn'?'negative':''}">${esc(l.text)}</div></div>`).join('')}</div></section>`;}
function finance(){const r=state.lastReport,history=state.history.slice(-12),max=Math.max(1,...history.flatMap(x=>[x.revenue,x.cost]));return `${head('FINANCIAL HEALTH','让每一次增长，都有底气。','关注现金流与持续盈利，留出面对淡季和意外的余量。',button('融资方案','loan','wallet'))}${stats([['可用现金',money(state.cash),'人民币','实时现金余额','wallet'],['上周营业收入',r?money(r.revenue):'—','人民币',r?`${r.pax.toLocaleString()} 人次 · ${r.flights} 个单程航班`:'完成一周经营后生成','chart'],['上周净利润',r?money(r.profit,true):'—','人民币','扣除租金、薪酬、总部费用与利息','arrowup',r&&r.profit>0],['融资负债',money(E.totalDebt(state)),'人民币','银行授信 + 飞机抵押贷款','building']])}<div class="two-col"><section class="panel padded"><div class="card-title"><h2>收入与成本趋势</h2><small>最近 12 周</small></div>${history.length?`<div class="chart">${history.map(h=>`<div class="chart-group" title="第 ${h.week} 周：收入 ${money(h.revenue)}，成本 ${money(h.cost)}"><i style="height:${h.revenue/max*100}%"></i><i class="cost" style="height:${h.cost/max*100}%"></i><span>W${h.week}</span></div>`).join('')}</div><div class="map-legend" style="justify-content:center"><span><i class="map-key"></i>营业收入</span><span><i class="map-key dim"></i>全部成本</span></div>`:'<div class="empty">完成第一周后，经营曲线将在这里展开。</div>'}</section><section class="panel padded"><h2 style="margin-bottom:20px">上周收支明细</h2>${r?reportLines(r):'<div class="empty">尚未结算首周。</div>'}</section></div><section class="panel padded" style="margin-top:20px"><h2>融资与现金管理</h2><div class="settings-row"><div><strong>银行授信</strong><p>基础授信 1.5 亿元 + 未抵押自有飞机估值的 45%，贷款无固定期限，可提前还款。</p></div>${button('申请贷款','loan','','','primary')}</div><div class="settings-row"><div><strong>提前偿还负债</strong><p>优先保留覆盖机队租金和运营成本的现金。</p></div>${button('偿还 5,000 万','repay','',`${state.debt<=0?'disabled':''}`)}</div><div class="settings-row"><div><strong>航油套期保值</strong><p>支付 200 万元，未来 12 周按基础油价结算；不会抵消绕飞带来的耗油增加。</p></div>${button(state.fuelHedge>=state.week?'套保生效中':'锁定航油价格','hedge','',`${state.fuelHedge>=state.week?'disabled':''}`)}</div></section>${financingPanels()}`;}
function reportLines(r){return `<div class="report-lines"><div><span class="muted">票款与辅营收入</span><span>${money((r.flightRevenue??r.revenue)+(r.disruption?.refunds||0))}</span></div>${r.hangarRevenue?`<div><span class="muted">机库外部订单收入</span><span>${money(r.hangarRevenue)}</span></div>`:''}<div><span class="muted">燃油、机场、客舱及维护准备</span><span>−${money(r.variable-(r.hangarCost||0)-(r.maintenanceCost||0)-(r.disruption?.totalCost||0))}</span></div>${r.disruption?.loss?`${[['延误退票 · 收入冲减',r.disruption.refunds],['延误现金补偿',r.disruption.compensation],['延误餐饮与住宿',r.disruption.care],['同航路改签费用',r.disruption.rebooking],['运行恢复额外支出',r.disruption.operations]].filter(([,n])=>n).map(([label,n])=>`<div><span class="muted">${label}</span><span>−${money(n)}</span></div>`).join('')}`:''}<div><span class="muted">飞机租赁</span><span>−${money(r.leaseGross??r.lease)}</span></div>${r.leaseRentRefund?`<div><span class="muted">提前收回 · 未用租金返还</span><span>+${money(r.leaseRentRefund)}</span></div>`:''}<div><span class="muted">机组与运营薪酬</span><span>−${money(r.payroll)}</span></div><div><span class="muted">基地、总部与服务固定投入</span><span>−${money(r.overhead)}</span></div>${r.maintenanceCost?`<div><span class="muted">自动检修支出 · ${r.autoMaintenance.length} 架</span><span>−${money(r.maintenanceCost)}</span></div>`:''}${r.hangarCost?`<div><span class="muted">机库材料、人工与固定开支</span><span>−${money(r.hangarCost)}</span></div>`:''}<div><span class="muted">贷款利息</span><span>−${money(r.interest)}</span></div><div class="total"><span>本周净利润</span><span class="${r.profit>=0?'positive':'negative'}">${money(r.profit,true)}</span></div>${r.leaseDepositRefund?`<div><span>租赁押金返还（不计营业利润）</span><span>+${money(r.leaseDepositRefund)}</span></div>`:''}${r.principal?`<div><span>偿还抵押本金（不计入费用）</span><span>−${money(r.principal)}</span></div><div><span>经营现金净变动</span><strong>${money(r.cashFlow,true)}</strong></div>`:''}${r.pax&&r.cabinComfort?`<div><span>乘客实际客舱体验</span><span>${r.cabinComfort.toFixed(1)} / 100</span></div>`:''}</div>`;}
function ranking(){return `${head('GLOBAL AIRLINE INDEX','世界一流，由你定义。','国内 65 家运输航司与国际知名品牌；分数与名次均为游戏模拟。')}${stats([['你的综合排名','#'+(E.rankings(state).findIndex(x=>x.player)+1),'/ '+(D.airlines.length+1),'与国内外主要航司同场竞技','award'],['综合得分',E.score(state),'/ 100','规模、服务、口碑、可靠性与盈利','star'],['航司资料库',D.airlines.length,'家','国内运输航司与国际知名品牌','globe'],['连续盈利',state.profitStreak,'周','持续盈利为综合评分提供加分','chart']])}<div class="filters"><div class="search"><input id="rank-search" placeholder="搜索航司、国家或地区…" value="${esc(rankQuery)}" aria-label="搜索航司"></div>${['全部','中国内地','港澳台','国际','低成本','货运'].map(x=>`<button class="filter-btn ${rankFilter===x?'active':''}" data-action="rankFilter" data-filter="${x}">${x}</button>`).join('')}</div><section class="panel"><div id="ranking-table">${rankingTable()}</div></section><p class="info-inline" style="margin-top:14px">评分权重：口碑 27% + 机队规模 18%（80 架封顶）+ 航线覆盖 18%（70 条封顶）+ 服务 20% + 可靠性 12% + 连续盈利 5%。此榜单不代表 Skytrax 或任何现实评级。</p>`;}
function rankingTable(){const rows=E.rankings(state).map((r,i)=>({...r,rank:i+1})).filter(r=>(rankFilter==='全部'||rankFilter==='中国内地'&&r.country==='中国'||rankFilter==='港澳台'&&['中国香港','中国澳门','中国台湾'].includes(r.country)||rankFilter==='国际'&&!r.country.startsWith('中国')||rankFilter==='低成本'&&r.style==='低成本'||rankFilter==='货运'&&r.style==='货运')&&(`${r.name}${r.country}${r.code}`).toLowerCase().includes(rankQuery.toLowerCase()));const visible=pageItems(rows,'ranking');return `${pager('ranking')}<div class="table-scroll ranking-scroll"><table class="ranking-grid"><thead><tr><th>全球排名</th><th>航空公司</th><th>国家 / 地区</th><th>经营模式</th><th>机队 / 航线</th><th>综合得分</th><th>竞争动态</th></tr></thead><tbody>${visible.map(r=>`<tr class="${r.player?'leader-row-player':''}"><td><span class="rank-badge ${r.rank<=3?'gold':''}">${r.rank}</span></td><td><button class="airline-name airline-detail-link" data-action="airlineDetail" data-code="${r.player?'player':r.code}" aria-label="查看${esc(r.name)}详情"><span class="airline-logo">${r.code}</span><div><strong>${esc(r.name)}</strong><small>${r.player?'你的航空公司':'查看航司档案 →'}</small></div></button></td><td>${r.country}</td><td><span class="tag grey">${r.style}</span></td><td class="airline-size">${E.airlineProfile(state,r.player?'player':r.code).fleet} 架 / ${E.airlineProfile(state,r.player?'player':r.code).routes} 条<small>${r.player?'当前经营':'游戏模拟'}</small></td><td class="rank-score">${r.score.toFixed(1)}</td><td><span class="${r.player?'positive':'muted'}">${r.player?'持续成长':r.score>=90?'全球标杆':r.score>=80?'国际竞争力':'区域发展'}</span></td></tr>`).join('')||'<tr><td colspan="7" class="empty">没有找到符合条件的航司。</td></tr>'}</tbody></table></div>`;}
function airlineDetail(key){const r=E.airlineProfile(state,key),player=r.player;showModal(esc(r.name),`<div class="airline-dossier"><div class="dossier-top"><span class="airline-logo">${r.code}</span><div><span class="eyebrow">AIRLINE PROFILE · W${state.week}</span><h3>${r.country} · ${r.style}</h3><p>全球综合排名 #${r.rank} · ${r.score.toFixed(1)} 分</p></div><span class="tag ${player?'':'amber'}">${player?'我的航司':'游戏模拟档案'}</span></div><div class="dossier-stats">${[['在役飞机',r.fleet,'架'],['运营航线',r.routes,'条'],['覆盖机场',r.destinations,'座'],['待交付订单',r.orders,'架']].map(([l,v,u])=>`<div><small>${l}</small><strong>${v.toLocaleString()} <em>${u}</em></strong></div>`).join('')}</div><div class="dossier-columns"><section><h3>总部与运营中心</h3><dl><dt>${player?'公司总部':r.facts?'现实总部 · 已核实':'游戏总部'}</dt><dd>${esc(player?r.headquarters:r.facts?.headquarters||r.headquarters)}</dd><dt>${player?'运营基地':'游戏主枢纽'}</dt><dd>${r.hubs.map(c=>`${E.ap(c).city} · ${E.ap(c).name} (${c})`).join('<br>')}</dd><dt>经营定位</dt><dd>${r.style==='货运'?'货运参考航司，不参与玩家客运分流':r.style==='低成本'?'高密度客舱、价格竞争与较高飞机利用率':r.style==='支线'?'连接中小城市与区域枢纽':'枢纽网络、商务需求与旅客服务'}</dd></dl>${r.facts?`<a class="info-inline" href="${r.facts.source}" target="_blank" rel="noopener noreferrer">总部资料来源 ↗</a>`:player?'':'<p class="muted">现实总部尚未逐家核实；此处游戏总部按主枢纽设置。</p>'}</section><section><h3>${player?'当前机队构成':'模拟机队构成'}</h3>${r.mix.map(m=>`<div class="fleet-mix"><span>${esc(E.model(m.id)?E.modelName(m.id):m.id)}</span><strong>${m.count} 架</strong><div class="track"><i style="width:${r.fleet?m.count/r.fleet*100:0}%"></i></div></div>`).join('')||'<p>暂无已交付飞机。</p>'}<div class="report-lines"><div><span>服务水平</span><strong>${r.service.toFixed(1)} / 5</strong></div><div><span>运行可靠性</span><strong>${r.reliability.toFixed(1)}%</strong></div></div></section></div>${player?'':`<section class="dossier-competition"><h3>与你的竞争关系 · ${r.overlap.length} 条航线</h3>${r.overlap.length?`<p>以下市场已在你的需求预估中计入这家航司的竞争影响。</p>${r.overlap.map(x=>button(`${x.from} → ${x.to} · 查看经营`,'editRoute','',`data-id="${x.id}"`,'tiny')).join('')}`:`<p>${r.style==='货运'?'货运航司不分流客运需求。':'当前没有在你的在营航线上直接竞争。'}</p>`}</section>`}<p class="dossier-note">${player?'以上数据读取你的当前存档，停飞航线不计入运营航线，待交付飞机单列。':'机队、机型构成、航线数、覆盖机场、订单、服务与可靠性均为游戏模拟，非现实航司统计。规模按游戏季度规则增长，不代表对手逐架飞机的完整排班。总部资料核对日：2026-10-24。'}</p><div class="form-actions">${button('返回排行榜','navigate','','data-target="ranking"')}${player?button('管理我的机队','navigate','','data-target="fleet"','primary'):button('查看市场洞察','navigate','','data-target="insights"','primary')}</div></div>`,player?'你的公司 · 即时经营档案':'航司档案 · 真实品牌与模拟经营',true);}
function company(){const missions=[['首航成功','完成第一个经营周',state.week>1,`${Math.min(1,state.week-1)} / 1`],['区域新势力','拥有 5 架已交付飞机',state.fleet.filter(p=>!p.delivery).length>=5,`${state.fleet.filter(p=>!p.delivery).length} / 5`],['国际化起点','获得国际及地区航线资质',state.license,state.license?'已完成':'待申请'],['十万份信任','累计承运 100,000 人次',state.totalPassengers>=1e5,`${state.totalPassengers.toLocaleString()} / 100,000`],['卓越服务','四项服务全部达到 5 级',E.services(state)===20,`${E.services(state)} / 20`],['世界最佳航司','登顶全球综合排名第 1',state.won,`当前第 ${E.rankings(state).findIndex(x=>x.player)+1} 名`]];return `${head('COMPANY DEVELOPMENT','把一家航司，做成一个时代的名字。','发展基地、解锁国际网络，在一座座里程碑中成长。')}<div class="two-col"><section><div class="panel padded" style="margin-bottom:18px"><h2>国际及地区航线资质</h2><p class="subtitle" style="margin:10px 0 17px">满足口碑 60、已交付飞机 3 架后，可支付 800 万申请。审批耗时 4 周。</p><div class="progress-row"><div><span>品牌口碑</span><span>${state.rep.toFixed(1)} / 60</span></div><div class="track"><i style="width:${Math.min(100,state.rep/60*100)}%"></i></div></div><div class="progress-row"><div><span>已交付飞机</span><span>${state.fleet.filter(p=>!p.delivery).length} / 3</span></div></div>${button(state.license?'已获得国际资质':state.licenseDue?`审批中 · 还有 ${state.licenseDue} 周`:'申请国际资质','license','globe',`${state.license||state.licenseDue?'disabled':''}`,'primary')}</div><section class="panel padded"><div class="card-title"><h2>运营基地</h2>${button('增加基地','hub','plus','','tiny')}</div>${state.hubs.map(h=>`<div class="settings-row"><div><strong>${E.ap(h.code).city} ${h.code}</strong><p>等级 ${h.level} · 每周 ${h.level*180} 个单程时刻</p></div>${button('扩建 '+money(h.level*18),'expandHub','',`data-code="${h.code}"`,'tiny')}</div>`).join('')}<div class="settings-row"><div><strong>品牌推广计划</strong><p>投入 300 万，未来四周所有运营航线的客流提升 12%，受座位上限约束。</p></div>${button(state.marketing>=state.week?'推广中':'开始推广','marketing','',`${state.marketing>=state.week?'disabled':''}`,'tiny')}</div></section></section><section><h2 style="margin-bottom:15px">成长里程碑</h2>${missions.map(([title,desc,done,progress])=>`<div class="achievement ${done?'done':''}"><span class="medal">${ic(done?'check':'flag',18)}</span><div><h3>${title}</h3><p>${desc}</p><div class="mission-progress">${done?'已达成 · ':''}${progress}</div></div></div>`).join('')}</section></div>`;}
function settings(){return `${head('YOUR AIRLINE, SAFELY SAVED','每一程，都值得保留。','游戏在当前浏览器自动保存；导出存档可备份或迁移到其他浏览器。')}<section class="panel padded"><div class="settings-row"><div><h3>当前航司</h3><p>${esc(state.name)} · ${dateText()} · 第 ${state.week} 周</p></div><span class="tag">${saveError?'存储不可用':'自动保存已开启'}</span></div><div class="settings-row"><div><h3>导出经营存档</h3><p>下载当前机队、航线、资金与完整经营进度。</p></div>${button('导出存档','export','download','','primary')}</div><div class="settings-row"><div><h3>导入经营存档</h3><p>导入会替换当前进度，建议先导出备份。</p></div>${button('选择存档','import','book')}</div><div class="settings-row"><div><h3>创立另一家航空公司</h3><p>选择新的中国基地机场与航司名称，从初始资金重新出发。</p></div>${button('重新开始','newGame','plus','','danger')}</div><div class="settings-row"><div><h3>经营指南与数值规则</h3><p>了解排班、航线贡献、现金与服务评分。</p></div>${button('查看指南','guide','info')}</div></section>`;}
function sources(){return `${head('REFERENCE & SIMULATION','真实的航空世界，可玩的经营规则。','透明区分现实资料、游戏参数和虚构事件。')}<section class="panel padded"><h2>收录范围</h2><p class="subtitle" style="line-height:2;margin:12px 0 22px">首版收录 ${D.airports.length} 座机场、${D.aircraft.length} 款现代飞机及 ${D.airlines.length} 家主要客运航司。国内部分收录民航局名录所列 65 家运输航空公司（含货运及集团子公司），海外部分为知名品牌精选，不声称覆盖世界全部航司。货运航司仅作资料与综合榜参照，不分流客运需求；玩家当前经营客运业务。航司合并、品牌运营与资质状态可能变化。飞机卡片采用制造商标志与标准名称；总览保留 A350 实拍。虚拟飞机均明确标注；品牌仅用于机型识别，不代表官方合作。</p><h2>公开参考入口</h2><p class="subtitle" style="margin:8px 0 14px">新增机场代码与坐标已对照 OurAirports 公有领域数据；已核对民航局运输航空公司名录、空客 A320neo 与波音 787 官方产品页，以及 FIFA 2026 赛事日期。其他机型采用公开常见规格的游戏参考值，仍需逐型号复核；部分赛历使用已标注的近似窗口。资料核对日：2026 年 10 月 24 日。</p><div class="source-list">${D.sources.map(([label,url])=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`).join('')}<a href="https://commons.wikimedia.org/wiki/File:A350_First_Flight_-_Low_pass_02.jpg" target="_blank" rel="noopener noreferrer">A350 首飞摄影 · Wikimedia Commons ↗</a></div><p class="subtitle" style="margin:15px 0;line-height:1.9">A350 首飞摄影：Don-vip，<a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a>。使用缩略版本，并按界面裁切展示；照片及裁切展示保持相同许可。其他机型仅展示名称与参数，不使用飞机示意图。</p><h2 style="margin:26px 0 12px">哪些属于模拟设定？</h2><div class="report-lines"><div><span>经营数值</span><small>购机价、二手报价、租金、融资、机库、舱位空间、油耗、需求与评分</small></div><div><span>国际情景</span><small>外交合作、冲突、空域限制及影响均为虚构</small></div><div><span>时间规则</span><small>每次结算 7 天；航班按分钟排班；节庆为近似需求窗口</small></div><div><span>飞行限制</span><small>球面距离、6% 航程余量、每周 100 小时排班</small></div><div><span>运行简化</span><small>未模拟航权双边谈判、详细机场性能、ETOPS、改舱停场与实时天气</small></div><div><span>排行榜</span><small>真实名称、模拟分数；不对应任何现实奖项</small></div></div><h2 style="margin:26px 0 10px">收支与破产规则</h2><p class="subtitle" style="line-height:2">航线贡献不扣机队租金、机组薪酬、总部与服务固定费用，完整损益请看财务周报。租赁交付后开始收租，退租返还 80% 押金。维护状态低于 55 自动停飞，检修两周恢复到 100。现金低于 −1,000 万进入清算；更高但为负时，可以通过融资或资产处置救助。停飞航线没有票款和飞行可变成本，但仍承担机队固定支出。</p></section>`;}
function showModal(title,body,sub='',wide=false){if(!$('.modal'))lastFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-head"><div><h2 id="dialog-title">${title}</h2>${sub?`<p class="subtitle">${sub}</p>`:''}</div><button class="icon-btn" data-action="closeModal" aria-label="关闭" ${needsSetup?'hidden':''}>${ic('close',20)}</button></div><div class="modal-body">${body}</div></section></div>`;const modal=$('.modal'),actions=[...modal.querySelectorAll('.form-actions')].at(-1);if(actions){const form=actions.closest('form');if(form)actions.querySelectorAll('button[type=submit]').forEach(b=>b.setAttribute('form',form.id));const footer=document.createElement('div');footer.className='modal-footer';footer.append(actions);modal.append(footer);}modal.querySelector('button:not([hidden]),input,select')?.focus();}function closeModal(){if(needsSetup)return;stopSimulation();$('#modal-root').innerHTML='';if(lastFocus?.isConnected)lastFocus.focus();}

function countries(){return [...new Set(D.airports.map(a=>a.country))].sort((a,b)=>a==='中国'?-1:b==='中国'?1:a.localeCompare(b,'zh-CN'));}
function countryOptions(selected,all=false){return (all?['全部国家 / 地区',...countries()]:countries()).map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${c==='中国'?'中国内地':esc(c)}</option>`).join('');}
function cityOptions(country,selected,baseOnly=false){return D.airports.filter(a=>a.country===country&&(!baseOnly||!state.hubs.some(h=>h.code===a.code))).sort((a,b)=>a.city.localeCompare(b.city,'zh-CN')).map(a=>`<option value="${a.code}" ${a.code===selected?'selected':''}>${esc(a.city)} · ${a.code} · ${esc(a.name)}</option>`).join('');}
function planeOptions(from,selected){return state.fleet.filter(p=>E.planeAvailable(state,p)&&E.planeBase(state,p)===from).map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${E.modelName(p.model)} · B-YS${String(p.id).padStart(3,'0')} · ${E.usedHours(state,p.id).toFixed(1)} 小时 / 周</option>`).join('');}
function routeModal(id=null,to=null,plane=null,base=null){const r=state.routes.find(x=>x.id===id);let from=r?.from||base||(plane?E.planeBase(state,state.fleet.find(p=>p.id===plane)):state.base),selectedTo=r?.to||to||D.airports.find(a=>a.region==='CN'&&a.code!==from&&!state.routes.some(x=>x.from===from&&x.to===a.code))?.code||'PVG',country=E.ap(selectedTo).country;showModal(r?'调整航线计划':'开通一条新航线',`<form id="route-form" data-id="${id||''}"><div class="form-grid"><label class="field full">出发基地<select name="from" ${r?'disabled':''}>${state.hubs.map(h=>`<option value="${h.code}" ${h.code===from?'selected':''}>${E.ap(h.code).country} · ${E.ap(h.code).city} · ${h.code}</option>`).join('')}</select></label><label class="field">目的地国家 / 地区<select name="country" ${r?'disabled':''}>${countryOptions(country)}</select></label><label class="field">目的地城市 / 机场<select name="to" ${r?'disabled':''}>${cityOptions(country,selectedTo)}</select></label><label class="field">经停国家 / 地区<select name="viaCountry"><option value="">不经停 · 直飞</option>${countryOptions(r?.via?E.ap(r.via).country:'美国')}</select></label><label class="field">经停城市 / 机场<select name="via">${r?.via?cityOptions(E.ap(r.via).country,r.via):'<option value="">不经停</option>'}</select></label><label class="field full">每次经停地面时间（分钟）<input name="stopMinutes" type="number" min="60" max="720" step="1" aria-describedby="stop-time-hint" value="${r?.stopMinutes||90}"><small id="stop-time-hint">至少 60 分钟（60 mins），最多 720 分钟；默认 90 分钟。直飞时不计经停时间。<br>同机经停往返，去程与返程均停留；无需设立分基地。游戏简化航权与过境手续。</small></label><label class="field full">执飞飞机<select name="plane">${planeOptions(from,r?.plane||plane)}</select></label><label class="field">每周往返班次<input name="freq" type="number" min="1" max="28" value="${r?.freq||7}" required></label><label class="field">票价策略<select name="price">${[.65,.75,.85,1,1.15,1.3,1.5,1.8].map(v=>`<option value="${v}" ${v===(r?.price||1)?'selected':''}>${v===1?'标准票价':v<1?'优惠':'溢价'} · ${Math.round(v*100)}%</option>`).join('')}</select></label></div><div id="route-quote"></div><div class="form-actions">${button('取消','closeModal')}<button type="submit" class="btn primary" id="save-route">${r?'保存航线计划':'支付开航费用并开通'}</button></div></form>`,r?'变更班次或执飞机会重新自动排班；可在「航班排班」调整具体时间。':'国内开航 160 万；涉及国际及地区 500 万；新增或更换经停机场另付 200 万。全天 24 小时可排班，优先从基地当地 07:00 开始。',true);initRouteWizard();if(!r?.via)$('#route-form').elements.viaCountry.value='';routeQuote();}
function hubModal(){showModal('让新的城市，成为你的基地',`<p>国内分基地：口碑 65，投入 2,500 万。海外及地区分基地：国际资质、口碑 70、已交付飞机 5 架，投入 6,000 万。开设后可调入飞机，在当地始发运营。</p><form id="hub-form"><div class="form-grid"><label class="field">国家 / 地区<select name="country">${countryOptions('中国')}</select></label><label class="field">城市 / 机场<select name="code">${cityOptions('中国',null,true)}</select></label></div><p id="hub-quote" class="subtitle" style="margin-top:15px">国内基地每周固定开支 6 万；海外基地 15 万。游戏简化外国经营资质与航权审批。</p><div class="form-actions"><button class="btn primary" type="submit">投资并设立分基地</button></div></form>`,'可在全球已收录的城市设分基地。');}
function rebaseModal(id){const p=state.fleet.find(p=>p.id===id);showModal('调往另一座基地',`<p>${E.modelName(p.model)} 当前驻地 ${E.ap(E.planeBase(state,p)).city}。需先关闭或改派它的全部航线。在役飞机调机需要一周，按航程收取调机费用；待交付订单可免费更改进驻基地。</p><form id="rebase-form" data-id="${id}"><label class="field">目标基地<select name="code">${state.hubs.filter(h=>h.code!==E.planeBase(state,p)).map(h=>`<option value="${h.code}">${E.ap(h.code).country} · ${E.ap(h.code).city} · ${h.code} · ${p.delivery?'免费':money(.1+E.block(E.planeBase(state,p),h.code)*E.model(p.model).fuel*.0062)}</option>`).join('')}</select></label><div class="form-actions"><button class="btn primary" type="submit" ${state.hubs.length<2?'disabled':''}>确认调往基地</button></div></form>`,'先在「公司发展」增设基地，再调入飞机。');}
function insights(){const from=state.hubs.some(h=>h.code===insightBase)?insightBase:state.base;const rows=D.airports.filter(a=>a.code!==from&&(insightCountry==='全部国家 / 地区'||a.country===insightCountry)).map(a=>E.marketStats(state,from,a.code)).sort((a,b)=>insightSort==='competition'?b.rivals.length-a.rivals.length:insightSort==='demand'?b.demand-a.demand:insightSort==='score'?b.score-a.score:b.gap-a.gap);const visible=pageItems(rows,'insights');return `${head('MARKET INTELLIGENCE','找到旅客，比追着飞机跑更重要。','比较市场需求、预计运力与竞争，从机会出发规划航网。')}${stats([['可研究机场',D.airports.length,'座',`${countries().length} 个国家或地区`,'globe'],['当前筛选市场',rows.length,'个',`${E.ap(from).city}始发市场`,'route'],['存在座位缺口',rows.filter(r=>r.gap>0).length,'个','按本周事件与模拟运力估算','people'],['需求最旺城市',rows.length?E.ap([...rows].sort((a,b)=>b.demand-a.demand)[0].to).city:'—','','市场总需求，不等于你的销量','chart']])}<div class="market-controls"><label class="field">始发基地<select id="insight-base">${state.hubs.map(h=>`<option value="${h.code}" ${h.code===from?'selected':''}>${E.ap(h.code).city} · ${h.code}</option>`).join('')}</select></label><label class="field">目的地国家 / 地区<select id="insight-country">${countryOptions(insightCountry,true)}</select></label><label class="field">排序<select id="insight-sort">${[['gap','座位缺口优先'],['demand','总需求优先'],['competition','竞争最激烈'],['score','机会分优先']].map(([k,v])=>`<option value="${k}" ${insightSort===k?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="notice">模拟市场：需求受城市规模参数、距离与节庆影响；竞争运力按资料库中航司的枢纽与市场覆盖估算，不代表真实航班数据。正缺口是市场机会，并不保证你能售出全部座位。筛选与排序覆盖全部市场。</div>${pager('insights')}<section class="panel table-scroll insight-table"><table><thead><tr><th>目的地</th><th>周需求 / 座位供给</th><th>预计座位缺口</th><th>竞争</th><th>距离 / 机会分</th><th>规划</th></tr></thead><tbody>${visible.map(r=>{const a=E.ap(r.to),existing=state.routes.find(x=>[x.from,x.to].sort().join()===[from,r.to].sort().join());return `<tr><td><strong>${esc(a.city)} · ${a.code}</strong><small style="display:block">${a.country}</small></td><td>${r.demand.toLocaleString()} / ${r.supply.toLocaleString()}<small style="display:block">自家运力 ${r.own.toLocaleString()}</small></td><td class="${r.gap>0?'positive':'negative'}">${r.closed?'区域停航':r.gap.toLocaleString()}</td><td><span class="tag ${r.rivals.length>=4?'amber':''}">${r.competition} · ${r.rivals.length} 家</span><small class="rival-names">${r.rivals.map(x=>esc(x.name)).join('、')||'暂无主要模拟对手'}</small></td><td>${r.km.toLocaleString()} km<small style="display:block">机会分 ${r.score} / 100</small></td><td>${existing?button('管理现有航线','editRoute','',`data-id="${existing.id}"`,'tiny'):button('规划航线','planMarket','',`data-from="${from}" data-to="${r.to}"`,'tiny')}</td></tr>`}).join('')}</tbody></table></section>`;}
function clockLabel(base,minute,airport){const c=E.localClock(state,base,minute,airport);return `${c.date} 周${c.weekday} ${c.time}`;}
function timetable(){const p=state.fleet.find(p=>p.id===schedulePlane)||state.fleet[0];let slots=[],error='';if(p)try{slots=E.schedulePlan(state,p.id);}catch(e){error=e.message;}const base=p?E.planeBase(state,p):state.base;return `${head('FLIGHT SCHEDULING','每一程，都有明确的起降时间。','全天 24 小时自动排班，优先白天、必要时夜航；返程、经停与地面周转一并安排，手动锁定时刻保持不变。',p?button('整架飞机自动重排','autoSchedule','clock',`data-id="${p.id}"`,'primary'):'')}<div class="market-controls"><label class="field">选择飞机<select id="schedule-plane">${state.fleet.map(x=>`<option value="${x.id}" ${x.id===p?.id?'selected':''}>${E.modelName(x.model)} · B-YS${String(x.id).padStart(3,'0')} · 驻地 ${E.planeBase(state,x)}</option>`).join('')}</select></label><div class="schedule-key">${p?`${E.ap(base).city}驻地 · 周飞行 ${E.usedHours(state,p.id).toFixed(1)} / 100 小时 · 每次周转至少 ${E.turnMinutes(p)} 分钟`:''}</div></div>${error?`<div class="notice">${error}</div>`:''}${p&&!E.planeAvailable(state,p)?'<div class="notice">飞机当前未就绪，以下为预排计划，交付或维护完成后才实际运营。</div>':''}<div class="week-scroll"><div class="week-grid">${Array.from({length:7},(_,d)=>`<section class="day-column"><h3>周${'一二三四五六日'[d]}</h3>${slots.filter(t=>Math.floor(t.start/1440)===d).map(t=>`<button class="flight-slot ${t.manual?'locked':''}" data-action="manualSchedule" data-id="${t.route}"><small>${t.manual?'手动锁定':'自动排班'}</small><strong>${t.from} ⇄ ${t.to}</strong>${t.via?`<span>经 ${t.via}</span>`:''}<span>${E.localClock(state,base,t.start,base).time} 出发</span><span>${clockLabel(base,t.end,base)} 返回</span></button>`).join('')||'<p>无始发航班</p>'}</section>`).join('')}</div></div><p class="info-inline" style="margin:12px 0">上方按基地出发日排列；下方逐航段显示机场当地时间。采用机场标准时区，暂不模拟夏令时、宵禁或机组执勤上限。跨日往返会占用后续日期，不能重叠排班。</p><section class="panel table-scroll"><table><thead><tr><th>航段 / 飞机</th><th>出发机场当地时间</th><th>到达机场当地时间</th><th>飞行时长</th><th>计划来源</th></tr></thead><tbody>${slots.flatMap(t=>t.segments.map(l=>({...t,...l}))).sort((a,b)=>a.dep-b.dep).map(t=>`<tr><td><strong>${t.a} → ${t.b}</strong><small style="display:block">${E.ap(t.a).city} → ${E.ap(t.b).city}</small></td><td>${clockLabel(base,t.dep,t.a)}</td><td>${clockLabel(base,t.arr,t.b)}</td><td>${Math.floor(t.duration/60)} 小时 ${t.duration%60} 分</td><td>${button(t.manual?'修改手动时刻':'手动调整','manualSchedule','',`data-id="${t.route}"`,'tiny')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">请先为这架飞机开通航线。</td></tr>'}</tbody></table></section>`;}
function manualSchedule(id){const r=state.routes.find(r=>r.id===id);if(!r)return;try{const slots=E.schedulePlan(state,r.plane).filter(t=>t.route===id);showModal(`${r.from} ⇄ ${r.to} · 手动时刻`,`<form id="schedule-form" data-id="${id}"><p>按出发基地当地时间设置每次往返的首班起飞时间。可调整目的地停留时间，返程会在抵达后按该时长起飞。锁定这条航线后，其余自动班次会避让；已锁定班次之间不能冲突。</p><div class="schedule-fields">${slots.map((t,i)=>`<div><span>往返 ${i+1}</span><label class="field">星期<select name="day-${i}">${Array.from({length:7},(_,d)=>`<option value="${d}" ${Math.floor(t.start/1440)===d?'selected':''}>周${'一二三四五六日'[d]}</option>`).join('')}</select></label><label class="field">起飞时间<input name="time-${i}" type="time" value="${E.localClock(state,r.from,t.start,r.from).time}" required></label><label class="field">目的地停留（分钟）<input name="ground-${i}" type="number" min="${E.turnMinutes(state.fleet.find(p=>p.id===r.plane))}" max="1440" step="1" value="${t.turn}" required></label></div>`).join('')}</div><div id="schedule-quote" aria-live="polite"></div><div class="form-actions">${button('取消','closeModal')}<button class="btn primary" type="submit" id="save-schedule">保存并锁定时刻</button></div></form>`,'时间精确到分钟 · 自动检查飞机占用与地面周转',true);scheduleQuote();}catch(e){toast(e.message);}}
function scheduleInput(){const f=$('#schedule-form'),r=state.routes.find(r=>r.id===+f.dataset.id);return Array.from({length:r.freq},(_,i)=>{const [h,m]=f.elements['time-'+i].value.split(':').map(Number);return {day:+f.elements['day-'+i].value,departure:h*60+m,turnaround:Number(f.elements['ground-'+i].value)};});}
function scheduleQuote(){const f=$('#schedule-form');if(!f)return;const r=state.routes.find(r=>r.id===+f.dataset.id);try{const schedule=scheduleInput();const slots=E.schedulePlan({...state,routes:state.routes.map(x=>x.id===r.id?{...x,schedule}:x)},r.plane);$('#schedule-quote').innerHTML=`<div class="quote"><div class="quote-note">时间检查通过。整架飞机共安排 ${slots.length} 次往返，没有重叠；每次周转至少 ${E.turnMinutes(state.fleet.find(p=>p.id===r.plane))} 分钟。</div></div>`;$('#save-schedule').disabled=false;}catch(e){$('#schedule-quote').innerHTML=`<div class="notice" style="margin-top:18px">${esc(e.message)}</div>`;$('#save-schedule').disabled=true;}}

function transitSuggestions(r,m){const direct=E.distance(r.from,r.to),range=m.range*.94;if(direct<6000&&!r.via&&direct<=range)return '';const options=E.transitOptions(state,r.from,r.to,r.plane);return `<section class="transit-options"><h3>${direct>range?'直飞航程不足 · 推荐经停':'长航线方案 · 可选经停'}</h3><p>${esc(E.modelName(m))} 的单段运营上限 ${Math.floor(range).toLocaleString()} km；直飞距离 ${direct.toLocaleString()} km。按实际飞行总距离排序，已排除本周停航机场。</p>${options.length?options.map(o=>`<button type="button" class="transit-option ${r.via===o.via?'selected':''}" data-action="chooseStop" data-code="${o.via}"><strong>${E.ap(o.via).city} · ${o.via}</strong><span>${o.legs.map(l=>l.km.toLocaleString()).join(' + ')} km</span><small>单程约 ${o.hours.toFixed(1)} 小时，含 90 分钟经停</small></button>`).join(''):'<p class="negative">目前没有同时满足两段航程且开放的经停点，请换长航程飞机。也可在上方手动选择其他机场检查。</p>'}<p>仅检查航程与停航限制；班次、驻地、资质及周排班会在下方继续校验。可在上方自选任意经停机场。</p></section>`;}
function initRouteWizard(){const form=$('#route-form');routeStage=0;form.querySelectorAll('.form-grid>.field').forEach(label=>{const name=label.querySelector('input,select').name;label.dataset.routeStage=['viaCountry','via','stopMinutes'].includes(name)?1:['freq','price'].includes(name)?2:0;});$('#route-quote').dataset.routeStage=2;const nav=document.createElement('div');nav.className='wizard-tabs';nav.innerHTML=['出发与目的地','直飞或经停','班次与报价'].map((t,i)=>`<button type="button" data-action="routeStage" data-stage="${i}">${i+1}. ${t}</button>`).join('');form.prepend(nav);const actions=$('.modal-footer .form-actions');actions.innerHTML=`${button('取消','closeModal')}${button('上一步','routeBack')}${button('下一步','routeNext','arrow','','primary')}<button type="submit" form="route-form" id="save-route" class="btn primary">${form.dataset.id?'保存航线计划':'支付并开通航线'}</button>`;setRouteStage(0);}
function setRouteStage(stage){routeStage=Math.max(0,Math.min(2,stage));$('.modal').dataset.routeStage=routeStage;$('#route-form').querySelectorAll('[data-route-stage]').forEach(e=>e.hidden=Number(e.dataset.routeStage)!==routeStage);$('#route-form').querySelectorAll('.wizard-tabs button').forEach(b=>b.setAttribute('aria-current',Number(b.dataset.stage)===routeStage?'step':'false'));$('.modal-footer [data-action=routeBack]').hidden=routeStage===0;$('.modal-footer [data-action=routeNext]').hidden=routeStage===2;$('#save-route').hidden=routeStage!==2;$('.modal-body').scrollTop=0;}
function cabinPanel(stage){const f=$('#cabin-form');[...f.children].filter(e=>e.id!=='cabin-quote').forEach(e=>e.hidden=stage===1);$('#cabin-quote').hidden=stage===0;$('.modal-footer [data-action=cabinReview]').hidden=stage===1;$('.modal-footer [data-action=cabinBack]').hidden=stage===0;$('#save-cabin').hidden=stage===0;$('.modal-body').scrollTop=0;}
function routeQuote(){let form=$('#route-form');if(!form)return;let obj=Object.fromEntries(new FormData(form));if(!form.elements.plane.value){$('#route-quote').innerHTML='<p class="notice" style="margin-top:15px">此基地没有可用飞机。请先在机队管理中调入飞机，等待交付或完成检修。</p>';$('#save-route').disabled=true;return;}$('#save-route').disabled=false;obj.from=form.elements.from.value;obj.to=form.elements.to.value;let r={...obj,plane:+obj.plane,freq:+obj.freq,price:+obj.price,stopMinutes:+obj.stopMinutes,active:true};if(r.from===r.to){$('#save-route').disabled=true;$('#route-quote').innerHTML='<p class="notice" style="margin-top:15px">请将目的地设为不同机场。</p>';return;}let validation='';try{E.validateRoute(state,r,+form.dataset.id||undefined);}catch(err){validation=err.message;}$('#save-route').disabled=!!validation;const e=E.estimate(state,r),p=state.fleet.find(x=>x.id===r.plane),m=E.model(p.model),legs=E.routeLegs(r),km=legs.reduce((n,l)=>n+l.km,0),hours=E.usedHours(state,r.plane,+form.dataset.id)+e.hours,range=legs.some(l=>l.km>m.range*.94),intl=E.routeInternational(r),load=E.scheduleLoad({...state,routes:[...state.routes.filter(x=>x.id!==+form.dataset.id),{...r,id:+form.dataset.id||-1}]},r.plane);$('#route-quote').innerHTML=`${transitSuggestions(r,m)}<div class="quote"><div><small>单程实际航程${r.via?'（含经停）':''}</small>${km.toLocaleString()} km</div><div><small>预计客座率 / 经济舱单程票价</small>${pct(e.load)} / ¥${e.fare}</div><div><small>预计周航线贡献</small><strong class="${e.profit>=0?'positive':'negative'}">${money(e.profit,true)}</strong></div><div><small>飞机合计周飞行时间</small><span class="${hours>100?'negative':''}">${hours.toFixed(1)} / 100 小时</span></div><div><small>含经停与周转的占用时间</small><span class="${load.total>168?'negative':''}">${load.total.toFixed(1)} / 168 小时</span></div><div><small>参考运营航程</small><span class="${range?'negative':''}">${Math.floor(m.range*.94).toLocaleString()} km</span></div><div><small>同市场竞争航司</small>${E.competitors(r).length} 家</div><div class="quote-note">100 小时限制仅计算飞行；排班还需预留经停与地面周转，并避开手动锁定时刻。自动排班优先 07:00 起飞，必要时使用夜间时段。<br>${r.via?`经 ${E.ap(r.via).city}：${legs.map(l=>`${l.from} → ${l.to} ${l.km.toLocaleString()} km`).join(' · ')}；单程含经停 ${(E.routeHours(r)+E.stopMinutes(r)/60).toFixed(1)} 小时。经停带来额外机场费并使需求下调 18%，通程旅客只计一次。<br>`:''}${validation?'⚠ '+esc(validation)+' ':''}${range?'⚠ 航程不足。 ':''}${hours>100?'⚠ 排班超限，请减班。 ':''}${intl&&!state.license?'⚠ 需要国际及地区资质。 ':''}${Object.entries(e.classes).map(([k,v])=>`${({economy:'经济',business:'商务',first:'头等'})[k]} ${v.pax} 人次 × ¥${v.fare}`).join(' · ')}。估算已考虑本周事件，未扣租金、机组及总部固定费用。客流与票价采用游戏模型。</div></div>`;}
function leaseDetail(id){const p=state.fleet.find(p=>p.id===id);if(!p||p.mode!=='lease')return;const c=E.leaseInfo(p,state),l=E.lessor(c.lessor),routes=state.routes.filter(r=>r.plane===id);showModal('租约 · '+E.modelName(p.model),`<span class="tag">${esc(l.name)} · 游戏虚构</span><p class="advisor-reason">${leaseTerms(E.model(p.model),l)}</p><div class="quote"><div><small>已交押金</small>${money(c.depositPaid)}</div><div><small>周租金</small>${money(E.weeklyLease(p))}</div><div><small>合同到期周</small>第 ${c.startWeek+c.term} 周</div><div><small>关联航线</small>${routes.length} 条</div></div>${c.recall?`<p class="notice">${esc(c.recall.reason)}：第 ${c.recall.dueWeek} 周周${'一二三四五六日'[c.recall.day]}零时收回；当周未用 ${7-c.recall.day}/7 天租金 ${money(E.weeklyLease(p)*(7-c.recall.day)/7)}、押金 ${money(c.depositPaid)} 将在该周结算返还。</p>`:'<p>目前没有收回通知。收回风险、租金与通知期限均为游戏规则。</p>'}<p>关联航线：${routes.map(r=>r.from+' ⇄ '+r.to).join('、')||'暂无'}。收回后保留航线并暂停执飞，你可以改派可用飞机。</p><div class="form-actions">${button('关闭','closeModal')}${button('管理航线','navigate','route','data-target="routes"','primary')}</div>`,'按实际占用天数计租 · 退款在周结算入账');}
function leaseTerms(m,l){return `每周租金 ${money(m.lease*l.factor)}，租期 ${l.term} 周；出租方提前收回至少提前 ${l.notice} 周通知。持有 13 周后，每周模拟提前收回概率 ${(l.risk*100).toFixed(2)}%。出租方收回时押金全退，周租按实际占用天数计费；服务配置及改装费不退。玩家主动退租仍返还 80% 押金。`;}
function acquisition(id,mode,offerKey=0){const m=E.model(id),offer=mode==='used'?E.usedOffers(m).find(o=>o.key===offerKey):null,aircraftPrice=offer?offer.price:mode==='lease'?m.deposit:m.price,fitout=E.serviceFitout(state,m),price=aircraftPrice+fitout,label=offer?'购买二手':mode==='lease'?'租赁':'购买全新';showModal(`${label} ${E.modelName(m)}`,`${m.fictional?'<p class="notice">虚拟飞机：性能、价格、供货为游戏设定。</p>':''}<div class="plane-render" style="height:180px">${planeSVG(m)}</div><p>${offer?`${offer.age/52} 年机龄，维护状态 ${offer.condition}%，1 周交付。后续维护费用和损耗为新机的 ${E.ageFactor(offer).toFixed(2)} 倍。`:mode==='lease'?`押金 ${money(m.deposit)}，周租及提前收回条款见下方出租方报价。2 周后交付并开始计租。`:'6 周后交付，自有飞机不承担租金，仍需支付机组、维护及运营费用。'}</p>${mode==='lease'?`<label class="field" style="margin-top:16px">出租方（游戏虚构）<select id="lease-lessor" data-model="${m.id}">${E.LESSORS.map(l=>`<option value="${l.id}">${l.name} · 周租 ${money(m.lease*l.factor)} · ${l.term} 周租期</option>`).join('')}</select></label><p id="lease-terms" class="lease-terms">${leaseTerms(m,E.LESSORS[0])}</p>`:''}<div class="quote"><div><small>飞机款 / 押金</small>${money(aircraftPrice)}</div><div><small>补齐公司服务配置</small>${money(fitout)}</div><div><small>本次合计支付</small>${money(price)}</div><div><small>支付后现金</small><span class="${state.cash<price?'negative':''}">${money(state.cash-price)}</span></div><div><small>默认经济舱</small>${m.seats} 席</div><div class="quote-note">签约后可在「机队管理 → 调整舱位布局」设置各舱人数。交付前调整布局免费，增加座位仍需补交公司服务标准的配置差额。</div></div><div class="form-actions">${button('再考虑一下','closeModal')}${button('确认'+label,'confirmAcquire','',`data-model="${id}" data-mode="${mode}" data-offer="${offerKey}" ${state.cash<price?'disabled':''}`,'primary')}</div>`,'经营决策 · 资金将立即扣除');}


function cabinModal(id){const p=state.fleet.find(p=>p.id===id),m=E.model(p.model),c=E.cabinOf(p),rules=E.cabinRules(m);showModal(`${E.modelName(m)} · 客舱布局`,`<form id="cabin-form" data-id="${id}"><div class="cabin-presets">${[['standard','标准经济'],['dense','高密度经济'],['mixed','两舱布局'],...(rules.first?[['flagship','三舱旗舰']]:[])].map(([key,label])=>button(label,'cabinPreset','',`data-preset="${key}"`)).join('')}</div><div class="form-grid"><label class="field">经济舱座位<input type="number" name="economy" value="${c.economy}" min="0" max="${rules.max}" step="1" required></label><label class="field">商务舱座位<input type="number" name="business" value="${c.business}" min="0" max="${rules.max}" step="1" required></label><label class="field">头等舱座位${rules.first?'':' · 仅宽体大型机开放'}<input type="number" name="first" value="${c.first}" min="0" max="${rules.max}" step="1" ${rules.first?'required':'disabled'}></label><label class="field">经济舱座椅间距<select name="pitch">${[[28,'紧凑 · 28 英寸'],[30,'标准 · 30 英寸'],[33,'宽适 · 33 英寸']].map(([v,t])=>`<option value="${v}" ${v===c.pitch?'selected':''}>${t}</option>`).join('')}</select></label></div><div class="cabin-tools">${button('用经济舱填满剩余空间','fillCabin')}</div><div id="cabin-quote" aria-live="polite"></div><div class="form-actions">${button('取消','closeModal')}<button class="btn primary" type="submit" id="save-cabin">应用客舱布局</button></div></form>`,`B-YS${String(id).padStart(3,'0')} · 在空间、票价与乘客体验之间取舍`,true);const actions=$('.modal-footer .form-actions');actions.insertAdjacentHTML('afterbegin',button('返回布局','cabinBack'));actions.insertAdjacentHTML('beforeend',button('查看费用与效果','cabinReview','arrow','','primary'));cabinQuote();cabinPanel(0);}
function cabinInput(){const f=$('#cabin-form');return Object.fromEntries(['economy','business','first','pitch'].map(k=>[k,Number(f.elements[k].value)]));}
function cabinQuote(){const f=$('#cabin-form');if(!f)return;const p=state.fleet.find(p=>p.id===+f.dataset.id),m=E.model(p.model),c=cabinInput(),cs=E.cabinStats(m,c);let error='';try{E.validateCabin(m,c);}catch(e){error=e.message;}const fee=E.cabinFee(p,c,state);$('#save-cabin').disabled=!!error||state.cash<fee;const assigned=state.routes.filter(r=>r.plane===p.id),sim={...state,fleet:state.fleet.map(x=>x.id===p.id?{...x,cabin:c}:x)},before=assigned.reduce((n,r)=>n+E.estimate(state,r).profit,0),after=error?0:assigned.reduce((n,r)=>n+E.estimate(sim,r).profit,0);$('#cabin-quote').innerHTML=`<div class="cabin-space"><div class="card-title"><strong>客舱空间分配</strong><small>${Math.round(cs.used/cs.budget*100)}% 已使用</small></div><div class="cabin-bar">${[['first',c.first*E.cabinRules(m).firstSpace,'头等舱'],['business',c.business*E.cabinRules(m).businessSpace,'商务舱'],['economy',c.economy*c.pitch,'经济舱']].map(([k,units,name])=>`<i class="${k}" style="width:${Math.max(0,Math.min(100,units/cs.budget*100))}%" title="${name} ${c[k]} 席"></i>`).join('')}</div><div class="cabin-legend"><span class="first">头等 ${c.first}</span><span class="business">商务 ${c.business}</span><span class="economy">经济 ${c.economy}</span><span>空余 ${Math.max(0,Math.floor(cs.remaining/28))} 标准单位</span></div></div>${error?`<div class="notice">${error}</div>`:''}<div class="quote"><div><small>总座位</small>${cs.total} 席</div><div><small>客舱舒适度</small><strong class="${cs.comfort<m.comfort?'negative':'positive'}">${cs.comfort.toFixed(0)} / 100</strong></div><div><small>${p.delivery?'交付前配置差额':'本次改装费'}</small>${money(fee)}</div><div><small>经济舱体验</small>${cs.economyComfort.toFixed(0)} / 100</div><div><small>现有航线周贡献变化</small>${error?'—':money(after-before,true)}</div><div><small>经济舱 / 商务舱 / 头等舱票价</small>1 × / 2.5 × / 4.8 ×</div><div class="quote-note">商务舱和头等舱有独立客流上限。高密度布局增加运力，也会降低经济舱体验、客流和每周口碑；加座不保证收入上涨。空间是游戏预算，并非适航认证座位图。${assigned.length?'':'当前无执飞航线，贡献变化为 0。'}${state.cash<fee?' 现金不足，无法改装。':''}改装费用立即扣除，新布局用于下次结算；本版本不另计停场时间。</di function maintenanceModal(id){const p=state.fleet.find(p=>p.id===id),base=E.model(p.model).price*.007*E.ageFactor(p);showModal('安排飞机检修',`<p>检修期间，所执飞航班暂停。机龄会增加检修费用；检修完成恢复维护状态。</p><button class="choice" data-action="confirmMaintenance" data-id="${id}"><strong>外包检修 · ${money(base)}</strong><small>2 周停场 · 无自有机库要求</small></button>${(state.hangars||[]).map(h=>{const u=E.hangarUsage(state,h);return `<button class="choice" data-action="confirmMaintenance" data-id="${id}" data-hangar="${h.code}" ${u.free<1?'disabled':''}><strong>${E.ap(h.code).city}自有机库 · ${money(base*.6)}</strong><small>1 周停场 · ${h.delivery?'施工中':`空闲 ${u.free} / ${u.slots} 位`} · 调机费用已简化计入检修费</small></button>`}).join('')}<div class="form-actions">${button('管理我的机库','navigate','tool','data-target="hangar"')}</div>`,'维护成本、维修位占用与时间都进入经营结算。');}

function financeAssets(kind){const eligible=state.fleet.filter(p=>p.mode==='buy'&&!p.delivery&&!p.maintenance&&!E.pledged(state,p.id));showModal(kind==='mortgage'?'以飞机资产支持下一轮增长':'售后回租 · 回笼现金保留运力',`${eligible.length?eligible.map(p=>{let q,error='';try{q=E.assetFinanceQuote(state,p,kind);}catch(e){error=e.message;}return `<button class="choice" data-action="assetFinanceQuote" data-id="${p.id}" data-kind="${kind}" ${error?'disabled':''}><strong>${E.modelName(p.model)} · B-YS${String(p.id).padStart(3,'0')}</strong><small>${error||`预计净到账 ${money(q.net)} · 资产估值 ${money(q.value)}`}</small></button>`}).join(''):'<div class="empty">当前没有可用的自有飞机。先在飞机市场购买全新或二手飞机，交付后即可使用资产融资。</div>'}<div class="form-actions">${button('前往飞机市场','market')}</div>`,'已抵押、待交付或正在检修的飞机暂不可使用。');}

function financingPanels(){return `<section class="panel padded" style="margin-top:20px"><h2>用飞机资产，撬动下一架飞机</h2><div class="settings-row"><div><strong>飞机抵押贷款 · 年利率 5.2%</strong><p>按飞机估值的 50% 融资，手续费 0.5%，104 周等额还本。保留飞机所有权和运营能力。</p></div>${button('选择抵押飞机','financeAssets','','data-kind="mortgage"','primary')}</div><div class="settings-row"><div><strong>售后回租 · 一次性回笼资金</strong><p>卖出自有飞机并继续租用，释放现金，后续增加租金；可用二手飞机或全新飞机。</p></div>${button('选择回租飞机','financeAssets','','data-kind="leaseback"')}</div>${(state.facilities||[]).map(l=>`<div class="settings-row"><div><strong>${state.fleet.find(p=>p.id===l.plane)?.model} 抵押借款</strong><p>剩余 ${money(l.balance)} · ${l.remaining} 周 · 下周本金 ${money(Math.min(l.balance,l.original/104))} + 利息 ${money(l.balance*.052/52)}</p></div>${button('提前还清','repayMortgage','',`data-id="${l.plane}"`)}</div>`).join('')}</section>`;}

function weeklyReport(){const r=state.lastReport;if(!r){toast('点击右上角「经营下一周」，即可生成第一份周报。');return;}showModal(`第 ${r.week} 周 · 经营简报`,`${state.won?'<div class="welcome-banner">你已登顶全球航司综合榜。新的航空标杆，诞生了。</div>':''}<div class="quote" style="margin:0 0 23px"><div><small>本周承运</small>${r.pax.toLocaleString()} 人次</div><div><small>执行航班</small>${r.flights} 班</div><div><small>当前现金</small>${money(state.cash)}</div></div>${reportLines(r)}${r.disruption?.delayedLegs?`<p class="notice">${r.disruption.delayedLegs} 个航段延误，${r.disruption.propagatedLegs} 个受前序晚到影响；旅客保障支出 ${money(r.disruption.totalCost)}。</p>${button('查看延误与旅客保障','delayReport','shield')}`:''}${r.events.length?`<p style="margin-top:20px">本周市场因素：${r.events.map(esc).join(' · ')}</p>`:''}<div class="form-actions">${button('查看财务详情','navigate','',`data-target="finance"`)}${button(state.pending?'处理新事件':'返回运营中心',state.pending?'story':'closeModal','arrow','','primary')}</div>`,`${dateText(r.date)} — ${dateText(new Date(Date.parse(r.date)+6*86400000).toISOString().slice(0,10))}`);}

function setupAirportOptions(province,selected){return D.airports.filter(a=>a.region==='CN'&&a.province===province).map(a=>`<option value="${a.code}" ${a.code===selected?'selected':''}>${a.city} · ${a.name} (${a.code})</option>`).join('');}
function newGame(first=false,stage=0){setupFirst=first;setupStage=stage;const steps=`<div class="onboard-progress">${['一个梦想','你的航司','准备起飞'].map((t,i)=>`<span class="${i===stage?'current':''}">${String(i+1).padStart(2,'0')} ${t}</span>`).join('')}</div>`;let body='';if(stage===0)body=`<div class="dream-photo"><span>THE JOURNEY STARTS WITH YOU</span></div><div class="dream-copy"><h3>把望向天空的那一眼，<br>变成自己的航线图。</h3><p>从第一次在舷窗边看见云海，到想让一架写着自己航司名字的飞机起飞。这里，留给每一个有蓝天梦的人。</p><p>选择一座出发的城市。从第一条航线开始，把可靠、温暖的飞行带到更远的地方。</p></div><div class="form-actions">${button('开始我的航空故事','onboardNext','arrow','','primary')}</div>`;else if(stage===1)body=`<form id="identity-form"><p class="setup-intro">给梦想一个名字，也给它一座起飞的机场。</p><div class="form-grid"><label class="field full">航空公司名称<input name="name" maxlength="16" value="${esc(setupDraft.name)}" required placeholder="为你的航空公司取名"></label><label class="field">基地省份 / 直辖市<select name="province">${D.provinces.map(province=>`<option value="${province}" ${province===E.ap(setupDraft.base).province?'selected':''}>${province}</option>`).join('')}</select></label><label class="field">城市 / 基地机场<select name="base">${setupAirportOptions(E.ap(setupDraft.base).province,setupDraft.base)}</select></label></div><div class="setup-capital"><span>创始资本</span><strong>2,000 <small>万元</small></strong><p>另有全新自有 Airbus A320neo、Boeing 737-8（MAX 8）各一架，已交付，无租金、无贷款。</p></div><div class="form-actions">${button('上一步','onboardBack')}<button type="submit" class="btn primary">查看首航计划 ${ic('arrow',14)}</button></div></form>`;else {const preview=E.initial(setupDraft);body=`<form id="new-game-form"><input name="name" type="hidden" value="${esc(setupDraft.name)}"><input name="base" type="hidden" value="${setupDraft.base}"><div class="boarding-pass"><div><small>首航准备 · READY FOR DEPARTURE</small><h3>${esc(setupDraft.name)}</h3><p>${E.ap(setupDraft.base).city}基地 · ${setupDraft.base}</p></div><strong>${setupDraft.base}</strong></div><div class="launch-plan"><p><b>01</b> 接收两架全新自有飞机：Airbus A320neo 与 Boeing 737-8，各自安排一条首航航线。</p><p><b>02</b> 首航 ${preview.routes.map(r=>E.ap(r.to).city).join('、')}，先熟悉航线与旅客服务。</p><p><b>03</b> 查看经营周报，用下一周的收入规划更远的目的地。</p></div>${first?'':'<label class="checkboxline"><input type="checkbox" required>我确认重新开始，替换当前浏览器中的经营进度。</label>'}<div class="form-actions">${button('返回修改','onboardBack')}<button type="submit" class="btn primary">创立我的航空公司 ${ic('arrow',14)}</button></div></form>`;}showModal(stage===0?'致每一个有蓝天梦的人':stage===1?'从这里，写下航司的名字。':'你的第一张航线图，已准备好。',steps+body,'打造全球最佳航司 · 创始人登机指引',stage===0);}

function guide(){showModal('从第一条航线，到世界最佳航司。',`<div class="help-steps">${[['经营一周','点击右上角经营下一周。所有航线统一结算，报告展示完整收支；每四周会有一项需要决策的事件。'],['为飞机安排合适航线','选择出发基地、目的地、执飞机型与班次。每周最多飞行 100 小时；全天可排班，含经停和周转的占用不能超过一周 168 小时。'],['分清贡献和利润','航线贡献只扣飞行相关成本；公司净利润还会扣飞机租金、薪酬、总部费用和贷款利息。'],['在增长中留出余量','租赁飞机 2 周交付，购买 6 周交付。飞机维护低于 55 自动停飞，两周检修后恢复。不要把现金全部花完。'],['提升服务并走向国际','提高口碑到 60，并拥有 3 架已交付飞机，即可申请国际资质。关注节假日、世界杯与奥运客流。'],['冲击全球第一','发展 80 架以上机队、70 条航线、顶级服务，保持口碑、可靠性与连续盈利，冲击全球综合榜第一。']].map(([t,d])=>`<div><section><h4>${t}</h4><p>${d}</p></section></div>`).join('')}</div><div class="form-actions">${button('开始我的下一程','closeModal','arrow','','primary')}</div>`,'这是每周推进的经营模拟，所有选择都会进入经营结算。');}
