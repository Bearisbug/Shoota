document.addEventListener('toggle',ev=>{if(ev.target.id==='catalog-filters')catalogFiltersOpen=ev.target.open;},true);
document.addEventListener('click',ev=>{if(panoramaDragged&&ev.target.closest('.panorama-map')){panoramaDragged=false;return;}if(ev.target.classList.contains('modal-backdrop')){closeModal();return;}const el=ev.target.closest('[data-view],[data-action]');if(!el)return;if(el.dataset.view){setView(el.dataset.view);return;}let a=el.dataset.action,id=+el.dataset.id;if(simulationRunning&&!['pauseBatch','closeModal'].includes(a))return;switch(a){case 'delayPolicy':delayPolicyModal();break;case 'delayReport':delayPanel(+el.dataset.page||0);break;case 'leaseDetail':leaseDetail(id);break;case 'advisor':advisorModal();break;case 'advisorPrev':advisorPage--;advisorModal(false);break;case 'advisorNext':advisorPage++;advisorModal(false);break;case 'advisorOpen':openAdvisorSuggestion();break;case 'advisorReport':advisorReturn==='batch'?batchReport():weeklyReport();break;case 'panorama':panorama();break;case 'mapZoom':zoomPanorama(+el.dataset.factor);break;case 'mapFit':panoramaView={x:0,y:0,w:1000,h:450};applyPanorama();break;case 'mapBase':focusMapAirport(state.base);break;case 'batchPanel':batchPanel();break;case 'batchReport':batchReport();break;case 'startBatch':try{E.startSimulation(state,+el.dataset.weeks);save();runSimulation();}catch(err){toast(err.message);}break;case 'resumeBatch':runSimulation();break;case 'pauseBatch':stopSimulation();batchReport();break;case 'cancelBatch':stopSimulation();E.cancelSimulation(state);save();render();batchReport();break;case 'routeStage':setRouteStage(+el.dataset.stage);break;case 'routeBack':setRouteStage(routeStage-1);break;case 'routeNext':setRouteStage(routeStage+1);break;case 'cabinReview':cabinPanel(1);break;case 'cabinBack':cabinPanel(0);break;case 'blueDream':blueDream();break;case 'onboardNext':newGame(setupFirst,setupStage+1);break;case 'onboardBack':{const f=$('#identity-form');if(f)setupDraft=Object.fromEntries(new FormData(f));newGame(setupFirst,Math.max(0,setupStage-1));break;}case 'modelDetail':modelDetail(el.dataset.model);break;case 'page':pages[el.dataset.key]=(pages[el.dataset.key]||0)+Number(el.dataset.delta);render();break;case 'dashboardTab':dashboardTab=el.dataset.tab;render();break;case 'networkTab':networkTab=el.dataset.tab;render();break;case 'chooseStop':{const f=$('#route-form'),airport=E.ap(el.dataset.code);f.elements.viaCountry.value=airport.country;f.elements.via.innerHTML=cityOptions(airport.country,airport.code);f.elements.stopMinutes.value=90;routeQuote();break;}case 'airlineDetail':airlineDetail(el.dataset.code);break;case 'hub':hubModal();break;case 'rebase':rebaseModal(id);break;case 'planMarket':routeModal(null,el.dataset.to,null,el.dataset.from);break;case 'manualSchedule':manualSchedule(id);break;case 'autoSchedule':confirmModal('自动重排整架飞机','解除这架飞机全部手动时刻，按照航线班次重新生成无冲突的周计划。','confirmAutoSchedule',`data-id="${id}"`);break;case 'confirmAutoSchedule':act('autoSchedule',{id},'周计划已自动生成');break;case 'usedOffers':usedMarket(el.dataset.model);break;case 'cabin':cabinModal(id);break;case 'cabinPreset':{const f=$('#cabin-form'),p=state.fleet.find(p=>p.id===+f.dataset.id),c=E.cabinPreset(E.model(p.model),el.dataset.preset);Object.entries(c).forEach(([k,v])=>f.elements[k].value=v);cabinQuote();break;}case 'fillCabin':{const f=$('#cabin-form'),p=state.fleet.find(p=>p.id===+f.dataset.id);f.elements.economy.value=E.cabinStats(E.model(p.model),cabinInput()).maxEconomy;cabinQuote();break;}case 'buildHangar':confirmModal('建造自有机库','投入 1,800 万，4 周后启用 2 个维修位。启用后每周固定支出 9 万。','confirmBuildHangar',`data-code="${el.dataset.code}"`);break;case 'confirmBuildHangar':act('buildHangar',{code:el.dataset.code},'机库已开工');break;case 'upgradeHangar':{const h=state.hangars.find(h=>h.code===el.dataset.code);confirmModal('扩建机库维修能力',`投入 ${money(h.level*12)}，新增 2 个维修位，每周固定费用增加 9 万。`,'confirmUpgradeHangar',`data-code="${h.code}"`);break;}case 'confirmUpgradeHangar':act('upgradeHangar',{code:el.dataset.code},'机库已扩建');break;case 'hangarOrder':confirmModal('承接四周例行检修订单','一个维修位将连续占用四周。每周收入 42 万，材料人工 20 万；另承担机库固定开支。','confirmHangarOrder',`data-code="${el.dataset.code}"`);break;case 'confirmHangarOrder':act('hangarContract',{code:el.dataset.code},'外部维修订单已签订');break;case 'financeAssets':financeAssets(el.dataset.kind);break;case 'assetFinanceQuote':assetFinanceModal(id,el.dataset.kind);break;case 'confirmAssetFinance':act(el.dataset.kind,{id},'资产融资已完成');break;case 'repayMortgage':{const l=state.facilities.find(l=>l.plane===id);confirmModal('提前还清抵押借款',`支付 ${money(l.balance)}，解除飞机抵押。`,'confirmRepayMortgage',`data-id="${id}"`);break;}case 'confirmRepayMortgage':act('repayMortgage',{id},'抵押贷款已还清');break;case 'navigate':setView(el.dataset.target);break;case 'closeModal':closeModal();break;case 'guide':guide();break;case 'advance':if(state.pending){story();return;}if(E.simulationActive(state)){batchReport();return;}try{E.advance(state);save();render();if(!maybeAdvisor())weeklyReport();}catch(e){toast(e.message);}break;case 'report':weeklyReport();break;case 'map':mapMode=el.dataset.mode;render();break;case 'newRoute':routeModal(null,null,+el.dataset.plane||null);break;case 'editRoute':routeModal(id);break;case 'airport':if($('.panorama-modal')){focusMapAirport(el.dataset.code);break;}if(el.dataset.code===state.base)toast('这是你的主基地。在航线网络中规划新目的地。');else routeModal(null,el.dataset.code);break;case 'toggle':act('toggle',{id},'航线运营状态已更新');break;case 'closeRoute':confirmModal('关闭这条航线？','飞机将被保留，开航费用不会退还；可以重新规划其他目的地。','confirmClose',`data-id="${id}"`,'danger');break;case 'confirmClose':act('close',{id},'航线已关闭，飞机可重新调配');break;case 'market':setView('market');break;case 'fleetFilter':fleetFilter=el.dataset.filter;pages.fleet=0;render();break;case 'purchaseChannel':purchaseChannel=el.dataset.channel;render();break;case 'marketFilter':marketFilter=el.dataset.filter;render();break;case 'rankFilter':rankFilter=el.dataset.filter;pages.ranking=0;render();break;case 'acquire':acquisition(el.dataset.model,el.dataset.mode,+el.dataset.offer||0);break;case 'confirmAcquire':act('buy',{model:el.dataset.model,mode:el.dataset.mode,offer:+el.dataset.offer||0,lessor:$('#lease-lessor')?.value},'已签订飞机合同，交付进度可在机队中查看');break;case 'maintain':maintenanceModal(id);break;case 'confirmMaintenance':act('maintenance',{id,hangar:el.dataset.hangar},'飞机已进入检修计划');break;case 'dispose':{let p=state.fleet.find(x=>x.id===id);confirmModal(p.mode==='lease'?'退还租赁飞机':'出售自有飞机','所有相关航线需先关闭或改派。退租返还 80% 押金；出售按机龄与维护状态折价。','confirmDispose',`data-id="${id}"`,'danger');break;}case 'confirmDispose':act('sell',{id},'飞机已处置，资金已到账');break;case 'serviceUpgrade':{let k=el.dataset.key;confirmModal('升级'+SERVICE.find(x=>x[0]===k)[2],`本次投入 ${money(E.serviceUpgradeCost(state,k))}，为 ${state.fleet.length} 架飞机统一升级一级（含待交付订单），并增加未来运营成本。新购或租入飞机会另收补齐公司标准的配置费。`,'confirmService',`data-key="${k}"`);break;}case 'confirmService':act('service',{key:el.dataset.key},'服务升级完成');break;case 'story':story();break;case 'choice':if(act('choice',{index:+el.dataset.index},'决策已执行，结果已记入公司纪事')&&E.simulationActive(state))batchReport();break;case 'newGame':newGame();break;case 'loan':loan();break;case 'confirmLoan':act('loan',{amount:+el.dataset.amount},'贷款已到账');break;case 'repay':confirmModal('提前还款',`偿还 ${money(Math.min(state.debt,50))} 的银行贷款，立即减少未来利息。`,'confirmRepay','');break;case 'confirmRepay':act('repay',{amount:50},'贷款已偿还');break;case 'hedge':confirmModal('锁定未来十二周航油价格','支付 200 万元，抵消燃油价格冲击；绕飞耗油变化仍会发生。','confirmHedge','');break;case 'confirmHedge':act('hedge',{},'航油保价已生效');break;case 'license':act('license',{},'国际及地区资质已提交审批');break;case 'expandHub':confirmModal('扩建基地时刻',`投入 ${money(state.hubs.find(h=>h.code===el.dataset.code).level*18)}，每周增加 180 个单程时刻。`,'confirmExpand',`data-code="${el.dataset.code}"`);break;case 'confirmExpand':act('expand',{code:el.dataset.code},'基地扩建已完成');break;case 'marketing':act('marketing',{},'四周品牌推广已启动');break;case 'export':{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`打造全球最佳航司-存档-W${state.week}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('存档已导出');break;}case 'import':confirmModal('导入会替换当前进度','请确认已经导出需要保留的存档。接下来选择本游戏导出的 JSON 文件。','selectImport','');break;case 'selectImport':closeModal();$('#import-file').click();break;}});
document.addEventListener('change',ev=>{if(ev.target.closest('#identity-form')&&ev.target.name==='province'){const f=$('#identity-form');f.elements.base.innerHTML=setupAirportOptions(ev.target.value,f.elements.base.value);return;}if(ev.target.id==='lease-lessor'){$('#lease-terms').textContent=leaseTerms(E.model(ev.target.dataset.model),E.lessor(ev.target.value));return;}if(ev.target.id==='panorama-airport'){focusMapAirport(ev.target.value);return;}if(ev.target.id==='category-filter'){marketFilter=ev.target.value;pages.market=0;render();return;}if(ev.target.id==='channel-filter'){purchaseChannel=ev.target.value;pages.market=0;render();return;}if(ev.target.id==='mobile-view'){setView(ev.target.value);return;}if(ev.target.id==='insight-base'){insightBase=ev.target.value;pages.insights=0;render();}if(ev.target.id==='insight-country'){insightCountry=ev.target.value;pages.insights=0;render();}if(ev.target.id==='insight-sort'){insightSort=ev.target.value;pages.insights=0;render();}if(ev.target.id==='schedule-plane'){schedulePlane=+ev.target.value;render();}if(ev.target.closest('#hub-form')&&ev.target.name==='country')$('#hub-form').elements.code.innerHTML=cityOptions(ev.target.value,null,true);if(ev.target.closest('#route-form')){const f=$('#route-form');if(ev.target.name==='country')f.elements.to.innerHTML=cityOptions(ev.target.value);if(ev.target.name==='viaCountry'){f.elements.via.innerHTML=ev.target.value?cityOptions(ev.target.value,ev.target.value==='美国'?'LAX':null):'<option value="">不经停</option>';}if(ev.target.name==='from')f.elements.plane.innerHTML=planeOptions(ev.target.value);}if(ev.target.closest('#schedule-form'))scheduleQuote();if(ev.target.id==='maker-filter'){makerFilter=ev.target.value;pages.market=0;render();}if(ev.target.closest('#route-form'))routeQuote();if(ev.target.closest('#cabin-form'))cabinQuote();});document.addEventListener('input',ev=>{if(ev.target.closest('#schedule-form'))scheduleQuote();if(ev.target.closest('#route-form'))routeQuote();if(ev.target.closest('#cabin-form'))cabinQuote();if(ev.target.id==='rank-search'){rankQuery=ev.target.value;pages.ranking=0;$('#ranking-table').innerHTML=rankingTable();}});
document.addEventListener('submit',ev=>{ev.preventDefault();let form=ev.target,data=Object.fromEntries(new FormData(form));if(form.id==='delay-policy-form'){act('delayPolicy',data,'延误保障策略已保存，下周生效');return;}if(form.id==='identity-form'){setupDraft={name:(data.name||'').trim(),base:data.base};if(!setupDraft.name){toast('请给你的航司取一个名字。');return;}newGame(setupFirst,2);return;}if(form.id==='schedule-form')act('schedule',{id:+form.dataset.id,schedule:scheduleInput()},'航班时刻已锁定');if(form.id==='rebase-form')act('rebase',{id:+form.dataset.id,code:data.code},'飞机调动已安排');if(form.id==='cabin-form')act('cabin',{...cabinInput(),id:+form.dataset.id},'客舱布局已保存，下次结算生效');if(form.id==='route-form')act(form.dataset.id?'editRoute':'route',{...data,id:+form.dataset.id},'航线计划已保存，下周开始按新计划运营');if(form.id==='new-game-form'){state=E.initial(data);needsSetup=false;save();closeModal();view='overview';render();toast('你的航空公司已经成立。下一站，世界。');}if(form.id==='hub-form')act('hub',{code:data.code},'新运营基地已设立');});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.destination')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}if(!$('.modal'))return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const nodes=[...$('.modal').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),a')].filter(n=>!n.closest('[hidden]')&&n.getClientRects().length);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
$('#import-file').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>2e6)throw Error('存档文件过大，请选择正确的游戏存档。');state=E.validateSave(JSON.parse(await file.text()));save();view='overview';render();toast('经营进度已恢复');}catch(err){toast(err.message||'无法读取这个存档');}finally{e.target.value='';}});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const mode=layoutMode();if(mode!==viewportMode){for(const [key,m] of Object.entries(pageMeta)){const next=m.size<=3?(mode==='compact'?1:mode==='medium'?2:3):(mode==='compact'?4:8);pages[key]=Math.floor((pages[key]||0)*m.size/next);}viewportMode=mode;if(!$('.modal'))render();}},120);});
render();if(needsSetup)newGame(true);if(saveError)toast('上次存档无法读取。已开启新局，原存档在下一次操作前不会覆盖。');
</script></body></html>
