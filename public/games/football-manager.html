      case 'offer-yes': acceptOffer(+a.dataset.i); break;
      case 'offer-no': state.offers.splice(+a.dataset.i, 1); persist(); render(); break;
      case 'mk-go': Object.assign(ui.mkt, { q: $('#mk-q').value, lg: $('#mk-lg').value, pos: $('#mk-pos').value, age: +$('#mk-age').value || 40, ovr: +$('#mk-ovr').value || 0, price: +$('#mk-price').value || 0 }); render(); break;
      case 'loan-pick': loanDialog(id); break;
      case 'loan-go': sendLoan(id, a.dataset.host, a.dataset.half === '1'); break;
      case 'loan-back': { const L = state.loans.find(x => x.pid === id); if (L) confirmBox(`提前召回 ${E(W().players[id].n)}？`, '召回', () => { returnLoan(L, null); persist(); render(); }); break; }
      case 'lineup-auto': state.lineup = null; ui.tpSel = ''; persist(); render(); break;
      case 'tp': tpTap(a.dataset.k); break;
      case 'tp-clear': ui.tpSel = ''; render(); break;
      case 'role': { const i = +a.dataset.slot; state.tactic.roles = FB.FORMATIONS[state.tactic.formation].map((x, k) => state.tactic.roles[k] || null); state.tactic.roles[i] = a.dataset.v; persist(); render(); break; }
      case 'youth-sign': { const w = W(), p = w.players[id]; if (mySquad().length >= 32) { toast('阵容已满 32 人'); break; } p.yt = 0; delete p.yt; FB.movePlayer(w, p, state.club); p.wage = Math.max(.3, FB.wageFor(p.ovr, club().lg, ageOf(p)) * .5); p.cy = FB.START_YEAR + w.season + 4; state.youth.prospects = state.youth.prospects.filter(x => x !== id); news('青训签约', `${p.n} 签下首份职业合同。`, ''); persist(); render(); break; }
      case 'youth-drop': delete W().players[id]; state.youth.prospects = state.youth.prospects.filter(x => x !== id); persist(); render(); break;
      case 'fac': { const k = a.dataset.k, lvl = state.fac[k], cost = Math.round(4 * lvl * FB.LEAGUE_META[club().lg].money * 10) / 10; if (club().balance < cost) { toast('余额不足'); break; } confirmBox(`花费 ${money(cost)} 升级${k === 'train' ? '训练' : '青训'}设施？`, '升级', () => { club().balance -= cost; state.fin.fac += cost; state.fac[k]++; persist(); render(); }); break; }
      case 'slots': openModal(slotsHtml(), { title: '存档 / 加载', footer: btn('导出当前进度', 'export', 'ghost') + btn('完成', 'close-modal', 'primary') }); break;
      case 'save-slot': { const slot = +a.dataset.slot; const doIt = () => { const r = SAVE.write(slot, snapshot(), meta()); toast(r.ok ? `已保存到存档位 ${slot}` : r.err); refreshSlots(); }; if (SAVE.meta(slot)) confirmBox(`覆盖存档位 ${slot}？`, '覆盖保存', doIt); else doIt(); break; }
      case 'load-slot': { const slot = +a.dataset.slot; const doIt = () => { const o = SAVE.read(slot); if (!o || o.broken) return toast('这个存档无法读取'); try { state = restore(o.data); closeModal(true); view = 'home'; persist(); render(); toast(`已加载存档位 ${slot}`); } catch (err) { toast('这个存档无法读取'); } }; if (state) confirmBox(`加载存档位 ${slot}？当前未保存到存档位的进度只保留在自动进度里，加载后会被替换。`, '加载', doIt); else doIt(); break; }
      case 'clear-slot': { const slot = +a.dataset.slot; confirmBox(`清空存档位 ${slot}？此操作不能撤销。`, '清空', () => { SAVE.clear(slot); refreshSlots(); render(); }, { danger: true }); break; }
      case 'export': UI.download(`绿茵经理-${club().name}-${FB.START_YEAR + W().season}-W${W().week + 1}.json`, JSON.stringify({ game: 'football-manager', save: snapshot() })); break;
      case 'import': $('#import-file').click(); break;
    }
  });
  function refreshSlots() { const m = UI.topModal(); if (m && m.querySelector('.dialog .bd')) { const bd = m.querySelector('.dialog .bd'); if (bd.innerHTML.includes('存档位')) bd.innerHTML = slotsHtml(); } }
  document.addEventListener('change', e => {
    if (e.target.matches('select[data-pick="captain"]') && state) {
      const p = W().players[e.target.value];
      if (p && p.club === state.club) { state.captains = state.captains || {}; state.captains[state.club] = p.id; state.captainModes = state.captainModes || {}; state.captainModes[state.club] = 'manual'; persist(); render(); toast('已任命 ' + p.n + ' 为队长'); }
      return;
    }
    if (e.target.matches('select[data-pick="form"]') && state) { const v = e.target.value; state.tactic.formation = v; state.tactic.roles = []; state.lineup = null; ui.tpSel = ''; club().formation = v; persist(); return render(); }
    const s = e.target.closest('select[data-slot]');
    if (s && state) {
      const i = +s.dataset.slot, form = state.tactic.formation;
      if (!state.lineup || state.lineup.formation !== form) state.lineup = { formation: form, ids: FB.FORMATIONS[form].map(() => null) };
      // 同一球员只能占一个位置
      state.lineup.ids = state.lineup.ids.map((x, k) => (k !== i && x === s.value) ? null : x);
      state.lineup.ids[i] = s.value || null;
      if (state.lineup.ids.every(x => !x)) state.lineup = null;
      persist(); render();
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('.filters')) { e.preventDefault(); document.querySelector('[data-act="mk-go"]').click(); } });
  $('#import-file').addEventListener('change', e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(r.result); if (o.game !== 'football-manager' || !o.save || !o.save.w) throw new Error('bad'); const doIt = () => { state = restore(o.save); closeModal(true); view = 'home'; persist(); render(); toast('已导入存档'); }; if (state) confirmBox('导入会替换当前进度，确定吗？', '导入', doIt); else doIt(); } catch (err) { toast('文件不是有效的绿茵经理存档'); } };
    r.onerror = () => toast('文件读取失败');
    r.readAsText(f);
  });

  state = loadAuto();
  if (state && state.fired) setTimeout(showJobs, 50);
  render();
  window.__FM = { legendPool: LEGEND_POOL, get state() { return state; }, advance, finishWeek, render };
})();
</script></body></html>
