<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>重生之我是夜宵摊摊主</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: an app shell — sticky money/share bar on top, five pages (街景 · 经营 · 招商 · 对决 · 口碑) behind a bottom tab bar on phones; on desktop the street map stays left and the other pages sit in a right column */
:root{
  --night:#16112a;
  --panel:#221b3d;
  --panel-2:#2d2551;
  --line:rgba(255,214,170,.16);
  --ink:#f8ecda;
  --muted:#aa9ec4;
  --lantern:#ff6a3d;
  --gold:#ffc857;
  --good:#74e0a0;
  --bad:#ff7a7a;
  --warn:#ffb23d;
  --rival:#ff8a7a;
  --tenant:#7ee0c3;
  --on-bright:#24122a;
  --paper:#fff4e0;
  --display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --navh:62px;
  --num:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,var(--body);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--night)}
body{min-height:100vh;background:radial-gradient(900px 420px at 30% -160px, rgba(255,106,61,.18), transparent 70%), var(--night);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#1b1534}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(27,21,52,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb{max-width:1280px;margin:0 auto;padding-block:8px;padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:400;font-size:22px;margin:0;line-height:1.05;color:var(--gold);text-shadow:0 0 14px rgba(255,170,60,.45),0 2px 0 #7a2d10;letter-spacing:.04em;white-space:nowrap}
.logo small{font-size:.6em;color:var(--lantern);text-shadow:none;margin-right:2px;letter-spacing:.1em}
.hud{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;justify-content:flex-end;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.chip svg{width:20px;height:20px}
.chip b{font-size:15px}
.chip.money b{color:var(--gold);font-size:16px}
.chip .debt{color:var(--bad);font-size:11px;font-weight:700}
.chip small{color:var(--muted);font-size:11px}
.chip.share{padding:3px 9px}
.sharemini{display:flex;width:56px;height:7px;border-radius:4px;overflow:hidden;background:var(--rival)}
.sharemini i{display:block;height:100%;background:var(--gold);transition:width .5s}
.chip .me{color:var(--gold);font-weight:700}
.chip .rv{color:var(--rival);font-weight:700}
.stars{display:inline-flex;color:rgba(255,255,255,.18);font-size:13px;letter-spacing:-1px}
.stars i{font-style:normal}
.stars i.on{color:var(--gold);text-shadow:0 0 6px rgba(255,200,87,.7)}
@media (max-width:560px){.tb{gap:6px}.logo{font-size:19px}.hud{justify-content:flex-start;flex:1 1 100%}.chip.stars-chip{display:none}}

/* shell */
.shell{max-width:1280px;margin:0 auto;padding-block:10px calc(var(--navh) + env(safe-area-inset-bottom,0px) + 18px);padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.page{display:none;flex-direction:column;gap:12px;min-width:0}
.page.on{display:flex}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(27,21,52,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{position:relative;background:none;border:0;height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--muted);font-size:11px}
.nav button svg{width:26px;height:26px;opacity:.6;transition:transform .15s}
.nav button.on{color:var(--gold)}
.nav button.on svg{opacity:1;transform:translateY(-2px) scale(1.08)}
.nav .badge{position:absolute;top:6px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--tenant);color:var(--on-bright);font-size:10px;font-weight:900;display:grid;place-items:center;padding:0 4px}
.nav .badge.red{background:var(--bad)}
@media (min-width:980px){
  .shell{grid-template-columns:minmax(0,1fr) 400px;grid-template-areas:"map nav" "map side";align-items:start;padding-bottom:30px}
  #p-map{display:flex;grid-area:map}
  .page.side{grid-area:side}
  .nav{position:sticky;top:64px;grid-area:nav;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden}
  .nav button[data-v="map"]{display:none}
  .nav button{height:54px;flex-direction:row;gap:6px;font-size:14px}
  .nav button svg{width:22px;height:22px}
  .nav .badge{top:4px;left:auto;right:10px}
}

.btn{border:0;border-radius:11px;padding:.55em 1.05em;background:var(--lantern);color:var(--on-bright);font-weight:700;cursor:pointer;box-shadow:0 3px 0 #9c3517;transition:transform .08s,filter .15s;white-space:nowrap;min-height:38px}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9c3517}
.btn.gold{background:var(--gold);box-shadow:0 3px 0 #a7781c}
.btn.teal{background:var(--tenant);box-shadow:0 3px 0 #3f9a86}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:.3em .75em;font-size:12px;border-radius:9px;min-height:32px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,122,122,.45);box-shadow:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.38;cursor:not-allowed;filter:none;transform:none}
.btn.big{font-family:var(--display);font-weight:400;font-size:1.2em;letter-spacing:.08em;padding:.4em 1.4em}

.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.box h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.box h3 small{font-family:var(--body);font-size:12px;color:var(--muted)}
.muted{color:var(--muted);font-size:13px;margin:0}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:0 8px;line-height:18px;white-space:nowrap}
.pill.ok{background:rgba(116,224,160,.16);color:var(--good)}
.pill.warn{background:rgba(255,178,61,.18);color:var(--warn)}
.pill.bad{background:rgba(255,122,122,.2);color:var(--bad)}
.pill.dead{background:rgba(255,255,255,.1);color:var(--muted)}
.pill.teal{background:rgba(126,224,195,.16);color:var(--tenant)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{background:transparent;border:0;padding:6px 11px;cursor:pointer;color:var(--muted);font-size:13px;min-height:34px}
.seg button.on{background:var(--gold);color:var(--on-bright);font-weight:700}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.kv div{background:var(--night);border-radius:10px;padding:6px 10px;min-width:0}
.kv small{display:block;font-size:11px;color:var(--muted)}
.kv b{font-size:16px;font-variant-numeric:tabular-nums}
.kv b.gold{color:var(--gold)} .kv b.rv{color:var(--rival)} .kv b.bad{color:var(--bad)} .kv b.good{color:var(--good)}

/* map page */
.zones{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ztab{flex:none;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 12px 5px 6px;cursor:pointer;text-align:left}
.ztab svg{width:28px;height:28px}
.ztab b{display:block;font-family:var(--display);font-weight:400;font-size:16px;line-height:1.1}
.ztab small{display:block;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ztab.on{background:var(--panel-2);border-color:var(--gold)}
.ztab.on b{color:var(--gold)}
.ztab.locked{opacity:.55}
.ztab.ready{opacity:1;border-color:rgba(116,224,160,.6)}
.ztab.ready small{color:var(--good)}
.mapwrap{position:relative;width:100%;border-radius:16px;overflow:hidden;background:#111a19;box-shadow:0 0 0 2px #4a3524,0 12px 36px rgba(0,0,0,.45)}
#cv{display:block;margin:0 auto;max-width:100%;touch-action:manipulation;cursor:pointer}
.openbtn{position:absolute;right:10px;bottom:10px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions .grow{flex:1}
.memory{background:linear-gradient(135deg,rgba(185,163,255,.16),rgba(255,106,61,.08));border-color:rgba(185,163,255,.4)}
.memory h3{color:#d9cbff}
.memory p{margin:0;font-size:13px}
.memory b{color:var(--ink)}
.goal .gt{font-weight:700;font-size:15px}
.goal .gr{font-size:12px;color:var(--gold)}
.pbar{height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0 2px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lantern),var(--gold));transition:width .4s}
.goal .gp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* overlays */
.banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:45;text-align:center;pointer-events:none;width:min(92%,560px);opacity:0;transition:opacity .4s}
.banner.show{opacity:1}
.banner .bt{font-family:var(--display);font-size:clamp(26px,7vw,46px);color:var(--gold);text-shadow:0 0 22px rgba(255,170,60,.7),0 3px 0 #7a2d10;line-height:1.15}
.banner .bs{display:inline-block;margin-top:8px;background:rgba(16,11,34,.9);border:1px solid var(--line);border-radius:12px;padding:6px 14px;color:var(--ink);font-size:14px}
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:44;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
@media (min-width:561px){.toasts{top:calc(env(safe-area-inset-top,0px) + 70px)}}
.toast{background:rgba(16,11,34,.94);border:1px solid rgba(255,200,87,.5);color:var(--ink);border-radius:14px;padding:6px 14px;font-size:13px;animation:tin .3s ease-out;max-width:520px;text-align:center}
.toast.rv{border-color:rgba(255,138,122,.65)}
.toast.bad{border-color:rgba(255,122,122,.8);background:rgba(60,12,24,.95)}
.toast b{color:var(--gold)}
.toast.rv b{color:var(--rival)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

.ov{position:fixed;inset:0;z-index:50;background:rgba(9,6,20,.6);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:up .25s ease-out}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:20px;border-bottom:1px solid var(--line);padding-bottom:20px}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;color:var(--gold);text-align:center}
.sheet .sub{color:var(--muted);margin:2px 0 12px;text-align:center}
.sheet .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.sheet p{color:var(--muted)}
.sheet .hero{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
.sheet .hero svg{width:42px;height:42px}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.shead svg{width:54px;height:54px;flex:none}
.shead b{font-size:18px;display:block}
.shead small{color:var(--muted)}
.shead .x{margin-left:auto}
.stabs{display:flex;gap:4px;background:var(--night);border-radius:12px;padding:4px;margin:6px 0 10px}
.stabs button{flex:1;background:none;border:0;border-radius:9px;padding:8px 4px;color:var(--muted);cursor:pointer;font-weight:700;font-size:13px}
.stabs button.on{background:var(--panel-2);color:var(--gold)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--night);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.opt svg{width:44px;height:44px}
.opt b{font-size:15px}
.opt small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.opt .cb{color:var(--good);font-size:12px}
.opt .cb.neg{color:var(--bad)}
.opt.locked{opacity:.45}
.opt .catdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc);margin-right:4px;vertical-align:middle}
.rows{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:8px 0;font-variant-numeric:tabular-nums}
.rows span{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 10px}
.tags span{font-size:12px;border-radius:6px;padding:1px 7px;background:rgba(116,224,160,.14);color:var(--good)}
.tags span.neg{background:rgba(255,122,122,.14);color:var(--bad)}

/* manage page */
.fund{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:8px}
.fund div{background:var(--night);border-radius:10px;padding:6px 10px}
.fund small{display:block;font-size:11px;color:var(--muted)}
.fund b{font-size:16px;font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.zrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--night);border-radius:12px;padding:8px 10px}
.zrow + .zrow{margin-top:6px}
.zrow svg{width:36px;height:36px}
.zrow small{display:block;color:var(--muted);font-size:12px}
.slist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 10px;align-items:center;background:var(--night);border-radius:12px;padding:7px 10px;border-left:4px solid var(--cc);cursor:pointer}
.srow svg{width:40px;height:40px}
.srow b{font-size:14px}
.srow small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.srow .loss{color:var(--bad);font-weight:700}
.srow .gain{color:var(--good)}
.srow .acts{display:flex;gap:6px}
.sgroup{font-size:12px;color:var(--muted);margin:10px 2px 4px;display:flex;justify-content:space-between}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}

/* lease page */
.offers{display:flex;flex-direction:column;gap:8px}
.offer{background:var(--night);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.offer.hot{border-color:rgba(255,138,122,.6)}
.offer.poach{border-color:rgba(255,200,87,.6);background:linear-gradient(180deg,rgba(255,200,87,.08),var(--night))}
.offer .oh{display:flex;gap:10px;align-items:center}
.offer .oh svg{width:44px;height:44px;flex:none}
.offer .oh b{display:block;font-size:15px;line-height:1.2}
.offer .oh small{color:var(--muted);font-size:12px}
.offer .ot{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.offer .tg{display:flex;flex-wrap:wrap;gap:4px}
.offer .tg span{font-size:11px;border-radius:5px;padding:0 6px;background:rgba(126,224,195,.14);color:var(--tenant)}
.offer .tg span.rv{background:rgba(255,138,122,.16);color:var(--rival)}
.offer .tg span.gd{background:rgba(255,200,87,.14);color:var(--gold)}
.offer .row{display:flex;gap:6px}
.qstar{color:var(--gold);letter-spacing:-1px}

/* duel */
.duel{border-color:rgba(255,138,122,.35)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:6px}
.vs .side-a,.vs .side-b{display:flex;align-items:center;gap:8px;min-width:0}
.vs .side-b{flex-direction:row-reverse;text-align:right}
.vs .av{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none}
.vs .side-a .av{box-shadow:0 0 0 2px var(--gold)}
.vs .side-b .av{box-shadow:0 0 0 2px var(--rival)}
.vs b{display:block;font-size:14px;line-height:1.2}
.vs small{color:var(--muted);font-size:11px}
.vs .x{font-family:var(--display);color:var(--muted);font-size:18px}
.sharebar{position:relative;display:flex;height:24px;border-radius:12px;overflow:hidden;background:var(--rival);margin:4px 0 2px}
.sharebar i{display:block;height:100%;background:linear-gradient(90deg,#ffb23d,var(--gold));transition:width .6s}
.sharebar span{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-weight:900;font-size:12px;color:var(--on-bright);font-variant-numeric:tabular-nums}
.sharebar .l{left:10px}.sharebar .r{right:10px}
.sharecap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
#rivalCv{display:block;width:100%;height:84px;border-radius:12px;margin:10px 0 6px;background:#120e22}
.rfin{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rfin b{color:var(--ink)}
.bench{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.brow{display:grid;grid-template-columns:48px minmax(0,1fr) 16px minmax(0,1fr);gap:6px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.brow .lb{color:var(--muted)}
.brow .bv{display:flex;flex-direction:column;gap:2px;min-width:0}
.brow .bv span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bv.b{text-align:right}
.brow .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.brow .bv.a .bar i{display:block;height:100%;background:var(--gold);margin-left:auto}
.brow .bv.b .bar i{display:block;height:100%;background:var(--rival)}
.brow .w{text-align:center}
.brow .w.win{color:var(--good)} .brow .w.lose{color:var(--bad)} .brow .w.tie{color:var(--muted)}
.tipbox{margin-top:10px;background:rgba(255,122,122,.1);border:1px solid rgba(255,122,122,.3);border-radius:10px;padding:8px 10px;font-size:13px}
.tipbox.good{background:rgba(116,224,160,.1);border-color:rgba(116,224,160,.3)}
.tipbox b{color:var(--ink)}
.rfeed{list-style:none;margin:8px 0 0;padding:0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.rfeed li::before{content:"· ";color:var(--rival)}
.duelstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.duelstats div{background:var(--night);border-radius:8px;padding:5px 8px;font-size:11px;color:var(--muted)}
.duelstats b{display:block;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.deadbox{text-align:center;padding:8px 0}
.deadbox .dt{font-family:var(--display);font-size:22px;color:var(--good)}

/* social */
.social h3 .appname{display:flex;align-items:center;gap:6px}
.social h3 svg{width:22px;height:22px}
.rate{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.rate .big{font-size:40px;font-weight:900;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;grid-row:span 2}
.rate .vsr{font-size:12px;color:var(--muted)}
.rate .vsr b{color:var(--rival)}
.tagcloud{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 8px}
.tagcloud span{font-size:12px;border-radius:999px;padding:1px 9px;background:rgba(116,224,160,.14);color:var(--good)}
.tagcloud span.neg{background:rgba(255,122,122,.14);color:var(--bad)}
.tagcloud span i{font-style:normal;opacity:.7;margin-left:3px}
.posts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.post{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;background:var(--night);border-radius:12px;padding:8px 10px}
.post .pa{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;color:var(--on-bright)}
.post .ph{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.post .ph b{color:var(--ink);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post .ps{color:var(--gold);font-size:12px;letter-spacing:-1px}
.post .ps.low{color:var(--bad)}
.post p{margin:2px 0 3px;font-size:13px;line-height:1.45}
.post .pf{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}
.post.viral{box-shadow:inset 0 0 0 1px rgba(255,200,87,.6)}
.post.viral.neg{box-shadow:inset 0 0 0 1px rgba(255,122,122,.7)}
.post .about{font-size:11px;color:var(--rival);border:1px solid rgba(255,138,122,.4);border-radius:4px;padding:0 4px;margin-left:4px}
.post .about.z{color:var(--muted);border-color:var(--line)}
.skill{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;align-items:center;background:var(--night);border-radius:12px;padding:10px 12px}
.skill + .skill{margin-top:6px}
.skill svg{width:44px;height:44px;grid-row:span 2}
.skill p{margin:0;color:var(--muted);font-size:13px}
.skill p b{color:var(--ink)}
.skill .btn{justify-self:start}

/* sheet-specific */
.result{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:10px 0;text-align:center}
.result div{background:var(--night);border-radius:12px;padding:10px 6px}
.result small{display:block;color:var(--muted);font-size:12px}
.result .rev{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.result .me .rev{color:var(--gold)} .result .rv .rev{color:var(--rival)}
.result .vsx{font-family:var(--display);color:var(--muted);background:none;padding:0;font-size:18px}
.verdict{font-family:var(--display);font-size:24px;margin:2px 0;text-align:center}
.verdict.win{color:var(--good)} .verdict.lose{color:var(--bad)}
.fin{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin:6px 0 12px}
.fin td{padding:5px 6px;border-bottom:1px solid var(--line)}
.fin td:last-child{text-align:right;font-weight:700}
.fin .neg{color:var(--bad)} .fin .pos{color:var(--good)}
.fin tr.total td{border-bottom:0;font-size:15px}
.fin small{color:var(--muted)}
.alert{background:rgba(255,122,122,.12);border:1px solid rgba(255,122,122,.4);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--ink);margin:0 0 10px}
.alert.good{background:rgba(116,224,160,.12);border-color:rgba(116,224,160,.4)}
.alert.mem{background:rgba(185,163,255,.12);border-color:rgba(185,163,255,.45)}
.bestst{display:flex;align-items:center;gap:12px;justify-content:center;background:var(--night);border-radius:12px;padding:8px 12px;margin:8px 0 12px}
.bestst svg{width:46px;height:46px}
.quote{font-family:var(--display);font-size:19px;color:var(--ink);text-align:center;margin:8px 0 12px;line-height:1.5}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.pickr{background:var(--night);border:1px solid var(--line);border-radius:14px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);text-align:center}
.pickr:hover{border-color:var(--c)}
.pickr .av{width:54px;height:54px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--c)}
.pickr b{color:var(--ink);font-size:14px}
.pickr .df{font-weight:700;color:var(--c)}
@media (max-width:440px){.picks{grid-template-columns:1fr}.pickr{flex-direction:row;text-align:left;gap:10px;padding:10px}.pickr .av{width:46px;height:46px;flex:none}}
details.guide summary{cursor:pointer;font-family:var(--display);font-size:18px;list-style:none}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:" ＋";color:var(--muted);font-size:14px}
details.guide[open] summary::after{content:" －"}
.guide ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px}
.guide b{color:var(--ink)}
.story .sp{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.story .sp .av{width:56px;height:56px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--gold);flex:none}
.story .sp small{display:block;color:var(--muted);font-size:12px}
.story .sp b{font-size:17px}
.story h2{text-align:left;margin:4px 0 0}
.story .st{font-size:15px;line-height:1.75;color:var(--ink);margin:10px 0 14px}
.story .st small{color:var(--muted);font-size:13px}
.story .st.res{background:var(--night);border-radius:12px;padding:12px 14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:var(--night);border:1px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;min-height:48px}
.choice:hover{border-color:var(--gold)}
.choice b{display:block;font-size:15px;color:var(--gold)}
.choice small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.choice:disabled{opacity:.45;cursor:not-allowed}
.sheet .hero .av{width:76px;height:76px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px var(--gold)}
.sheet .hero .av svg,.story .sp .av svg,.zrow .av svg{width:100%;height:100%}
.zrow .av{width:36px;height:36px;border-radius:50%;overflow:hidden}
.zrow .btnrow{justify-content:flex-end}
.memory .mem{margin-top:8px;color:#d9cbff}
.req{display:inline-block;font-size:12px;color:var(--muted);margin-right:8px;white-space:nowrap}
.req.ok{color:var(--good)}
/* condensed tabular numbers (all widths) */
.chip b,.kv b,.fund b,.fin td:last-child,.result .rev,.rate .big,.duelstats b,.sharebar span{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.btn:disabled{opacity:.6;filter:saturate(.35)}
.zones{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:24px}
.zones::-webkit-scrollbar{display:none}
.sheet{overscroll-behavior:contain}
.opt small,.srow small,.zrow small,.offer .ot{text-wrap:pretty}

/* phones: compact, FM-style density */
@media (max-width:560px){
  :root{--navh:52px}
  body{font-size:13px;line-height:1.45}
  /* topbar: one row — the platform bar already shows the game title */
  .tb{padding-block:6px;flex-wrap:nowrap;gap:6px}
  .logo{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .hud{flex:1 1 auto;flex-wrap:nowrap;justify-content:space-between;gap:4px}
  .chip{font-size:12px;padding:2px 8px 2px 3px;gap:4px;min-height:30px}
  .chip svg{width:18px;height:18px}
  .chip b{font-size:15px}
  .chip.money b{font-size:16px}
  .chip.share{padding:2px 8px}
  .sharemini{width:40px}
  .toasts{top:calc(env(safe-area-inset-top,0px) + 50px)}
  .toast{font-size:12px;padding:5px 12px;border-radius:10px}
  /* shell + nav */
  .shell{padding-block:6px calc(var(--navh) + env(safe-area-inset-bottom,0px) + 10px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px));gap:8px}
  .page{gap:8px}
  .nav button{font-size:11px;gap:1px}
  .nav button svg{width:22px;height:22px}
  .nav .badge{top:3px}
  /* buttons: ≥40px tap height */
  .btn{min-height:40px;border-radius:9px}
  .btn.small{min-height:40px;font-size:13px;padding:.3em .8em;border-radius:8px}
  .btn.big{min-height:44px;font-size:18px}
  .seg button{min-height:40px;min-width:38px;padding:4px 8px}
  .actions{flex-wrap:nowrap;gap:6px}
  .actions > .chip{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .actions .grow{flex:1 1 0;min-width:0}
  .actions .btn,.actions .seg{flex:none}
  .mapwrap{border-radius:10px}
  /* modules: flatter, tighter */
  .box{border-radius:10px;padding:8px}
  .box h3{font-size:16px;margin:0 0 6px}
  .box h3 small{font-size:12px}
  .muted{font-size:12px}
  .kv,.fund{gap:4px}
  .kv div,.fund div{border-radius:6px;padding:4px 8px}
  .kv b,.fund b{font-size:16px}
  .ztab{border-radius:8px;padding:4px 10px 4px 4px;min-height:40px}
  .ztab b{font-size:15px}
  /* list rows inside modules become divider rows, whole row stays the tap target */
  .offers,.slist,.posts,.opts{gap:0}
  .offer,.opt,.srow,.zrow,.skill,.post{background:none;border:0;border-radius:0;border-top:1px solid var(--line);padding:6px 2px}
  .zrow + .zrow,.skill + .skill{margin-top:0}
  .srow{border-left:3px solid var(--cc);padding-left:8px}
  .offer.hot{border-left:3px solid var(--rival);padding-left:8px}
  .offer.poach{border-left:3px solid var(--gold);padding-left:8px;background:linear-gradient(90deg,rgba(255,200,87,.08),transparent 70%)}
  .opt.locked{opacity:.6}
  .offer{gap:4px}
  .offer .oh svg,.opt svg,.skill svg{width:36px;height:36px}
  .opt{grid-template-columns:36px minmax(0,1fr) auto;gap:2px 8px}
  .skill{grid-template-columns:36px minmax(0,1fr);gap:2px 10px}
  .srow svg{width:34px;height:34px}
  .srow{grid-template-columns:34px minmax(0,1fr) auto;gap:2px 8px}
  .opt b,.offer .oh b{font-size:14px}
  .sgroup{margin:8px 2px 2px}
  .duelstats div{border-radius:6px;padding:4px 6px}
  .tipbox,.alert{border-radius:8px;padding:6px 8px}
  .rate .big{font-size:36px}
  /* sheets: smaller header, header + tabs stay pinned while the list scrolls */
  .sheet{max-height:90vh;padding:6px 12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-radius:14px 14px 0 0}
  .sheet::before{margin-bottom:6px}
  .sheet h2{font-size:22px}
  .sheet .sub{margin:0 0 8px}
  .shead{position:sticky;top:-6px;z-index:2;background:var(--panel);margin:0 -12px 0;padding:4px 12px;gap:10px;height:52px}
  .shead svg{width:40px;height:40px}
  .shead > div{min-width:0}
  .shead b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shead small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shead .x{min-width:52px;flex:none}
  .stabs{position:sticky;top:46px;z-index:2;margin:0 -12px 6px;border-radius:0;padding:4px 12px;background:var(--panel);box-shadow:0 1px 0 var(--line)}
  .stabs button{min-height:40px;padding:6px 4px;background:var(--night)}
  .stabs button.on{background:var(--panel-2)}
  .result div,.bestst,.story .st.res{border-radius:8px}
  .choice{border-radius:10px;padding:8px 12px}
  .story .st{font-size:14px;line-height:1.65;margin:8px 0 10px}
  .pickr{border-radius:10px}
}
/* ===== night-market glow (visual layer only) ===== */
:root{--warm:#2c1f3a;--warm-2:#352548;--neon:#ffd27a}
body{background:
  radial-gradient(520px 260px at 12% -40px, rgba(255,106,61,.30), transparent 70%),
  radial-gradient(420px 240px at 92% 0, rgba(255,200,87,.16), transparent 70%),
  radial-gradient(700px 500px at 50% 110%, rgba(255,80,60,.10), transparent 70%),
  var(--night)}
body::after{content:"";position:fixed;inset:-10% -20% auto;height:70vh;z-index:0;pointer-events:none;opacity:.07;
  background:radial-gradient(closest-side,#fff,transparent) 18% 60%/180px 120px no-repeat,radial-gradient(closest-side,#fff,transparent) 62% 40%/240px 150px no-repeat,radial-gradient(closest-side,#fff,transparent) 85% 75%/160px 110px no-repeat;
  filter:blur(18px);animation:steam 16s ease-in-out infinite alternate}
@keyframes steam{from{transform:translate3d(0,30px,0)}to{transform:translate3d(-30px,-40px,0)}}
.shell{position:relative;z-index:1}
.topbar{background:linear-gradient(180deg,rgba(44,24,52,.96),rgba(27,21,52,.94));border-bottom:0;box-shadow:0 1px 0 rgba(255,170,90,.18)}
.topbar::after{content:"";position:absolute;left:0;right:0;top:100%;height:10px;pointer-events:none;
  background:radial-gradient(3px 4px at 50% 6px,#ff6a3d 70%,transparent 75%) 0 0/46px 10px repeat-x,
             linear-gradient(180deg,rgba(255,170,90,.35),rgba(255,170,90,.35)) 0 2px/100% 1px no-repeat;
  filter:drop-shadow(0 0 4px rgba(255,120,50,.8));opacity:.9}
.box{background:linear-gradient(180deg,var(--warm-2),var(--warm) 60%);border:0;box-shadow:inset 0 1px 0 rgba(255,214,170,.12),0 6px 18px rgba(0,0,0,.28)}
.box h3{color:var(--neon);text-shadow:0 0 6px rgba(255,150,60,.4)}
.box h3 small{text-shadow:none}
.memory{background:linear-gradient(135deg,rgba(185,163,255,.20),rgba(255,106,61,.10)),var(--warm);box-shadow:inset 0 1px 0 rgba(217,203,255,.2),0 6px 18px rgba(0,0,0,.28)}
.memory h3{color:#e6dbff;text-shadow:0 0 8px rgba(185,163,255,.6)}
.kv div,.fund div,.duelstats div{background:rgba(16,11,34,.55);box-shadow:inset 0 1px 0 rgba(255,214,170,.06)}
.chip{background:linear-gradient(180deg,#2e2449,#221b3d);border-color:rgba(255,200,120,.22)}
.chip.money{box-shadow:0 0 10px rgba(255,200,87,.18)}
.ztab{background:linear-gradient(180deg,#2e2449,#221b3d);border-color:transparent}

.ztab.on b{text-shadow:0 0 8px rgba(255,170,60,.6)}
.mapwrap{box-shadow:0 0 0 2px #4a3524,0 0 28px rgba(255,120,50,.18),0 12px 36px rgba(0,0,0,.45)}
.btn{background:linear-gradient(180deg,#ff8a5c,var(--lantern))}
.btn.gold{background:linear-gradient(180deg,#ffe08a,var(--gold) 55%,#f5b53a)}
.btn.teal{background:linear-gradient(180deg,#a6f0da,var(--tenant))}
.btn.ghost,.btn.danger{background:rgba(255,255,255,.03)}
.btn.gold.big{box-shadow:0 3px 0 #a7781c,0 0 18px rgba(255,200,87,.45)}
.seg{background:rgba(16,11,34,.6)}
.nav{background:linear-gradient(0deg,rgba(24,16,40,.98),rgba(40,26,54,.97));border-top:0;box-shadow:0 -1px 0 rgba(255,170,90,.2),0 -8px 20px rgba(0,0,0,.3)}
.nav button.on svg{filter:drop-shadow(0 0 6px rgba(255,190,80,.7))}
.nav button.on{text-shadow:0 0 8px rgba(255,170,60,.5)}
.sheet{background:linear-gradient(180deg,#3a2648 0,var(--panel) 120px);border-color:rgba(255,200,120,.2)}
.sheet h2{text-shadow:0 0 12px rgba(255,150,60,.6),0 2px 0 #7a2d10}
.toast{background:linear-gradient(180deg,rgba(52,30,48,.96),rgba(22,15,40,.96));box-shadow:0 6px 18px rgba(0,0,0,.4),0 0 12px rgba(255,170,60,.18)}
.banner.show .bt{animation:neon .7s ease-out}
@keyframes neon{0%{opacity:0;transform:scale(.9);filter:brightness(2)}40%{opacity:1}55%{opacity:.6}70%{opacity:1;transform:none}}
.verdict,.result .rev{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (max-width:560px){
  body{margin:0}
  .toasts{top:auto;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 10px);flex-direction:column-reverse}

</style>

<body>


<header class="topbar"><div class="tb"><h1 class="logo"><small>重生之</small>我是夜宵摊摊主</h1><div class="hud" id="hud"></div></div></header>

<main class="shell">
  <section class="page on" id="p-map">

</main>

<div class="toasts" id="toasts"></div>
<div class="banner" id="banner"><div class="bt"></div><div class="bs"></div></div>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
/* ================= art ================= */
const S = inner => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true"><g stroke="#2b1830" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${inner}</g></svg>`;

function bfs(sx, sy){
  const dist = new Int16Array(W*H).fill(-1), prev = new Int16Array(W*H).fill(-1);
  const s = idx(sx,sy); if(!isWalk(Z.grid[s])) return {dist, prev};
  const q = [s]; dist[s] = 0; let h = 0;
  while(h < q.length){
    const i = q[h++], x = i%W, y = (i/W)|0;
    for(const [dx,dy] of D4){
      const nx = x+dx, ny = y+dy; if(nx<0||ny<0||nx>=W||ny>=H || !inU(nx,ny)) continue;
      const j = idx(nx,ny); if(dist[j]>=0 || !isWalk(Z.grid[j])) continue;
      dist[j] = dist[i]+1; prev[j] = i; q.push(j);
    }
  }
  return {dist, prev};
}
function isSlot(x,y){
  const c = cellAt(x,y); if(!c || !inU(x,y) || c.k!=='grass') return false;
  return D4.some(([dx,dy]) => { const n = cellAt(x+dx,y+dy); return isWalk(n) && inU(x+dx,y+dy); });
}
function slotsOf(z){ const keep = Z; useZ(z); const out = []; for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(isSlot(x,y)) out.push([x,y]); useZ(keep); return out; }
function recompute(){
  Z.gd = bfs(...GATE).dist;
  const hasTemple = Z.grid.some(c=>c.k==='deco'&&c.t==='temple');
  const stages = []; Z.grid.forEach((c,i)=>{ if(c.k==='deco'&&c.t==='stage') stages.push([i%W,(i/W)|0]); });
  Z.grid.forEach((c,i) => {
    if(c.k!=='stall') return;
    const x = i%W, y = (i/W)|0, me = ST[c.t];
    let pm = 1, am = 1, lan = 0, tree = false, seat = false, same = false;
    const hit = new Set(), tags = [];
    for(let dy=-1; dy<=1; dy++) for(let dx=-1; dx<=1; dx++){
      if(!dx && !dy) continue;
      const n = cellAt(x+dx,y+dy); if(!n) continue;
      if(n.k==='deco'){ if(n.t==='lantern') lan++; if(n.t==='tree') tree = true; if(n.t==='seat') seat = true; }
      if(n.k==='stall'){
        const o = ST[n.t];
        if(n.t===c.t) same = true;
        COMBOS.forEach((cb,k) => { if((me.cat===cb.a && cb.b.includes(o.cat)) || (o.cat===cb.a && cb.b.includes(me.cat))) hit.add(k); });
      }
    }
    hit.forEach(k => { const cb = COMBOS[k]; pm *= cb.m; tags.push([`${cb.n} +${Math.round((cb.m-1)*100)}%`,1]); });
    if(seat){ pm *= 1.15; tags.push(['有座位 +15%',1]); }
    if(hasTemple){ pm *= 1.08; tags.push(['神明保佑 +8%',1]); }
    lan = Math.min(2, lan); if(lan){ am *= 1+.2*lan; tags.push([`灯笼×${lan} 人气 +${20*lan}%`,1]); }
    if(tree){ am *= 1.05; tags.push(['绿意 +5%',1]); }
    if(stages.some(([sx,sy]) => Math.max(Math.abs(sx-x),Math.abs(sy-y))<=2)){ am *= 1.15; tags.push(['热闹 +15%',1]); }
    if(same){ am *= .7; tags.push(['隔壁同款抢客 -30%',0]); }
    const fronts = [];
    for(const [dx,dy] of D4){ const n = cellAt(x+dx,y+dy); if(isWalk(n) && inU(x+dx,y+dy)) fronts.push(idx(x+dx,y+dy)); }
    c.m = {pm, am, tags, combo: hit.size>0};
    c.fronts = fronts;
    c.reach = fronts.some(f => Z.gd[f] >= 0);
  });
  Z.dirty = false;
}
function preview(t, x, y){
  const me = ST[t], combos = new Set(); let same = false, lan = 0;
  for(let dy=-1; dy<=1; dy++) for(let dx=-1; dx<=1; dx++){
    if(!dx && !dy) continue;
    const n = cellAt(x+dx,y+dy); if(!n) continue;
    if(n.k==='deco' && n.t==='lantern') lan++;
    if(n.k==='stall'){
      if(n.t===t) same = true;
      COMBOS.forEach(cb => { const o = ST[n.t]; if((me.cat===cb.a && cb.b.includes(o.cat)) || (o.cat===cb.a && cb.b.includes(me.cat))) combos.add(`${cb.n} +${Math.round((cb.m-1)*100)}%（配${o.n}）`); });
    }
  }
  return {combos:[...combos], same, lan:Math.min(2,lan)};
}

  });
  const recent = waits.length ? waits.reduce((a,b)=>a+b,0)/waits.length : 0;
  return {n, cats:cats.size, types:types.size, avgSvc: n ? svc/n : 3, apSum:ap, avgAp: n ? ap/n : 0, decor, present,
    wait: .55*recent + .45*(qs ? est/qs : 0), rep:G.rep, rating:rating(), stage, zoneAp};
}
function rivalStats(){
  const R = G.rival, st = R.stalls, n = st.length;
  const lanBoost = 1 + Math.min(.25, .2*R.lantern/Math.max(1,n)) + (R.stage ? .08 : 0) + (R.tree ? .03 : 0);
  let svc = 0, ap = 0, cap = 0, price = 0;
  st.forEach(s => {
    const b = ST[s.t], sv = b.svc*(1-.18*(s.lv-1)), a = (b.ap+.3*(s.lv-1))*lanBoost, ec = (G.event && G.event.cat && G.event.cat[b.cat]) || {};
    svc += sv; ap += a*(ec.ap||1); cap += 1/sv;
    price += b.price*(1+.4*(s.lv-1))*1.12*(1+.15*Math.min(1, R.seat*3/Math.max(1,n)))*(R.temple?1.08:1)*((G.event&&G.event.price)||1)*(ec.pm||1);
  });
  return {n, cats:new Set(st.map(s=>ST[s.t].cat)).size, types:new Set(st.map(s=>s.t)).size, avgSvc: n ? svc/n : 3, apSum: R.dead ? 0 : ap, avgAp: n ? ap/n : 0,
    decor: R.lantern*4 + R.tree*2 + R.seat*3 + R.stage*14 + R.temple*16, present:R.present, wait:R.wait, rep:R.rep, rating:rRating(), cap, avgPrice: n ? price/n : 0, stage:R.stage};
}
function scoreOf(s, promo){
  const L = 100*(1 - Math.exp(-(s.present*.8 + s.decor + s.n*1.5)/45));
  const V = Math.min(100, s.cats/7*70 + Math.min(s.types,14)/14*30);
  const Sp = clamp(100*1.15/Math.max(.6, s.avgSvc), 0, 100);
  const Wt = 100*Math.exp(-s.wait/9);
  const st = starsOf(s.rep), lo = STAR_AT[st], hi = STAR_AT[st+1] || lo+1;
  const Rp = clamp(.6*(st + Math.min(1,(s.rep-lo)/(hi-lo)))*20 + .4*(s.rating-1)/4*100, 0, 100);
  const Q = clamp(s.avgAp/2.7*100, 0, 100);
  const size = 1 - Math.exp(-s.n/4);
  const A = s.n ? (.22*L + .18*V + .12*Sp + .2*Wt + .14*Rp + .14*Q) * (.3 + .7*size) * promo : 1;
  return {L, V, Sp, Wt, Rp, Q, size, A};
}
function myPromoMult(){
  let m = (flyerOn()?1.3:1) * (saleOn()?1.5:1) * (adsOn()?1.2:1) * (kolOn()?1.25:1);
  if(G.buff.hypeN===G.night) m *= 1.2;
  if(G.buff.flopN===G.night) m *= .85;
  if(nightOn()){ if(G.clock < (G.buff.hide ?? -1)) m *= .5; if(G.clock < (G.buff.fear ?? -1)) m *= .6; if(G.clock < (G.buff.dark ?? -1)) m *= .5; }
  return m;
}
function computeMetrics(){
  const me = myStats(), rv = rivalStats(), R = G.rival;
  const myPromo = myPromoMult();
  const rvPromo = nightOn() && G.clock < R.promoUntil ? 1.4 : 1;
  const a = scoreOf(me, myPromo), b = scoreOf(rv, rvPromo);
  const share = R.dead ? 1 : Math.pow(a.A,2) / (Math.pow(a.A,2) + Math.pow(b.A,2));
  M = {me, rv, a, b, share, myPromo, rvPromo};
  if(nightOn() && G.clock > 20) G.stats.maxShare = Math.max(G.stats.maxShare||0, share*100);
  return M;
}

function genApp(rivalBid, zoneId, starter){
  const zs = zoneId ? [zoneId] : openZones().map(z=>z.id);

  const pool = Object.keys(ST).filter(t => ST[t].z===zid && ST[t].tier <= Math.max(tier, ZONES[zoneIdx(zid)].star));
  if(!pool.length) return null;
  const zi = zoneIdx(zid);
  const have = new Set(G.zones[zi].grid.filter(c=>c.k==='stall').map(c=>ST[c.t].cat));
  let t = pick(pool);
  const miss = pool.filter(t=>!have.has(ST[t].cat)); if(miss.length && Math.random() < .55) t = pick(miss);
  if(starter){ const lo = pool.filter(t=>!have.has(ST[t].cat)).sort((a,b)=>ST[a].cost-ST[b].cost); t = lo[0] || pool.sort((a,b)=>ST[a].cost-ST[b].cost)[0]; }
  const s = stars(), qr = Math.random()*(1 + s*.25);
  const q = starter ? 2 : qr > 1.1 ? 3 : qr > .45 ? 2 : 1;
  const rent = Math.max(20, Math.round((ST[t].cost*.05 + 30)*(1.3 - .2*q)/10)*10);

function spawn(z, o={}){
  if(!z || z.cust.length > 200) return false;
  if(SF().limit && !o.transfer && z.cust.length >= 120) return false;
  const st = stars();
  const wallet = o.wallet ?? Math.round((50+Math.random()*160)*(1+.6*st)*(o.rich?2.5:1)*TOUR[G.tour].w);

  z.cust.push({x:GATE[0]+.5, y:GATE[1]+.5, path:[], st:'decide', wallet, wants, buys:0, max:2+rnd(3)+(o.rich?2:0),
    col:o.col||pick(SHIRTS), hair:o.hair||pick(HAIRS), ox:(Math.random()-.5)*.55, oy:(Math.random()-.5)*.55, idle:0, wander:0, qwait:0, maxWait:0, ph:Math.random()*6, rich:!!o.rich,
    patience: 9 + Math.random()*9, gone:false, fav:null, favLv:0, favQ:0, combo:false, waitStall:null, spent:0, spentAvg:0, hops:(o.hops||0)});
  if(!o.transfer) G.stats.guests++;

function pickZone(exclude){
  const zs = []; let tot = 0;
  G.zones.forEach((z,i) => { if(z.open && z!==exclude){ const w = .3 + (M ? M.me.zoneAp[i]||0 : 1); zs.push([z,w]); tot += w; } });
  if(!zs.length) return null;
  let r = Math.random()*tot; for(const [z,w] of zs){ r -= w; if(r <= 0) return z; } return zs[0][0];
}
function pathTo(prev, from, to){
  const out = []; let i = to;
  while(i !== from && i >= 0){ out.push(i); i = prev[i]; }
  return i===from ? out.reverse() : null;
}
function goLeave(cu){

function decide(cu){

  const cheapest = stalls.length ? Math.min(...stalls.map(c=>eff(c).price)) : 1e9;
  if(closing || cu.buys >= cu.max || cu.wallet < cheapest){ goLeave(cu); return; }
  const {dist, prev} = bfs(tx,ty);
  const cand = []; let total = 0;
  Z.grid.forEach((c,i) => {
    if(c.k!=='stall' || !c.reach) return;
    const e = eff(c); if(e.price > cu.wallet) return;
    let bf = -1, bd = 1e9; for(const f of c.fronts){ if(dist[f]>=0 && dist[f]<bd){ bd = dist[f]; bf = f; } }

function stepCustomer(cu, dt){

    const k = s.q.indexOf(cu);
    if(k < 0){ cu.st = 'decide'; return true; }

function streetRate(){

const rivalAvgRev = () => { const R = G.rival; return R.revHist.length ? R.revHist.reduce((a,b)=>a+b,0)/R.revHist.length : 6000; };
const rivalCredit = () => Math.max(4000 + 2000*Math.min(G.night,5), Math.round(rivalAvgRev()*.8));
const rivalUpkeep = () => { const R = G.rival; return R.stalls.reduce((a,s)=>a+Math.round(ST[s.t].price*(1+.5*(s.lv-1))*15 + 40),0) + R.lantern*5 + R.stage*60 + R.temple*80; };

function rivalSim(dt){
  const R = G.rival; if(R.dead) return;
  const P = RP(), s = M ? M.rv : rivalStats();
  const stay = 14 + R.wait*1.4;
  const wal = 130*(1+.6*starsOf(R.rep));

  const rev = sales*dt*s.avgPrice;
  R.revNight += rev; R.money += rev*(1-COGS)*P.inc; R.rep += sales*dt*.8;
  const rho = s.cap ? demand/s.cap : 2;
  const target = s.avgSvc*.7 + (rho < .9 ? s.avgSvc*rho/(1-rho) : s.avgSvc*9 + (rho-.9)*40);
  R.wait += (Math.min(40,target) - R.wait) * Math.min(1, dt*.4);

function rfeed(t){ const R = G.rival; R.feed.unshift(`${G.phase==='day'?'白天':clockText()} ${t}`); if(R.feed.length > 4) R.feed.length = 4; }
function rivalInvest(){
  const R = G.rival, P = RP(), tier = starsOf(R.rep);
  if(R.dead || R.strikes > 0 || R.money < 0) return;
  const capN = Math.min(32, 4 + (P.style==='many' ? 3 : 2)*G.night);
  const avail = Object.keys(ST).filter(t => ST[t].tier <= tier);
  const reserve = rivalUpkeep()*.5;
  const rounds = R.money > rivalUpkeep()*4 ? 4 : 2;
  for(let k=0; k<rounds; k++){
    const have = new Set(R.stalls.map(x=>ST[x.t].cat));
    const opts = [];
    if(R.stalls.length < capN){
      const miss = avail.filter(t => !have.has(ST[t].cat)).sort((a,b)=>ST[b].ap-ST[a].ap);
      if(miss.length) opts.push({kind:'stall', t:miss[0], cost:ST[miss[0]].cost, w:3});
      if(R.wait > 5){ const f = avail.slice().sort((a,b)=>(ST[a].svc-ST[b].svc)||(ST[b].ap-ST[a].ap))[0]; opts.push({kind:'stall', t:f, cost:ST[f].cost, w:2.6}); }
      const best = avail.filter(t => !R.stalls.some(x=>x.t===t)).sort((a,b)=>(ST[b].tier-ST[a].tier)||(ST[b].ap-ST[a].ap))[0];
      if(best) opts.push({kind:'stall', t:best, cost:ST[best].cost, w:P.style==='quality' ? 2.2 : P.style==='many' ? 2.4 : 1.4});
    }
    const up = R.stalls.filter(x=>x.lv<3).sort((a,b)=>(a.lv-b.lv)||(ST[b.t].ap-ST[a.t].ap))[0];
    if(up) opts.push({kind:'up', s:up, cost:Math.round(ST[up.t].cost*.9*up.lv), w:P.style==='quality' ? 2.8 : (R.wait>5 ? 2.2 : 1.1)});
    if(R.lantern < R.stalls.length*1.2) opts.push({kind:'lantern', cost:60, w:P.style==='deco' ? 2.6 : 1.3});
    if(R.tree < R.stalls.length/2) opts.push({kind:'tree', cost:40, w:P.style==='deco' ? 1.6 : .5});
    if(tier>=1 && R.seat < R.stalls.length/3) opts.push({kind:'seat', cost:200, w:1});
    if(tier>=2 && R.stage < 2) opts.push({kind:'stage', cost:1500, w:1.5});
    if(tier>=3 && !R.temple) opts.push({kind:'temple', cost:5000, w:1.6});
    const live = G.clock > 90 ? R.revNight*360/G.clock : 0;
    const margin = Math.max(rivalAvgRev(), live, 5000)*(1-COGS)*P.inc;
    const risk = P.style==='many' ? .85 : P.style==='quality' ? .7 : .6;
    const addUp = o => o.kind==='stall' ? ST[o.t].price*15+40 : o.kind==='up' ? ST[o.s.t].price*7.5 : 0;
    for(let j=opts.length-1;j>=0;j--) if(rivalUpkeep() + addUp(opts[j]) > margin*risk) opts.splice(j,1);
    if(!opts.length) return;
    let ok = opts.filter(o => o.cost <= R.money - reserve);
    if(!ok.length){
      if(Math.random() > P.borrow) return;
      const big = opts.filter(o=>o.kind==='stall'||o.kind==='up').sort((a,b)=>b.w-a.w)[0]; if(!big) return;
      const need = Math.round(big.cost - (R.money - reserve) + 50);
      if(R.debt + need > rivalCredit()*P.borrow) return;
      R.debt += need; R.money += need; rfeed(`借了 ${fmt(need)} 扩张`);
      if(need > 2000) rivalToastBuf.push(`借了 ${fmt(need)} 继续扩张`);
      ok = [big];
    }
    let tot = ok.reduce((a,o)=>a+o.w,0), r = Math.random()*tot, ch = ok[0];
    for(const o of ok){ r -= o.w; if(r <= 0){ ch = o; break; } }
    R.money -= ch.cost;
    if(ch.kind==='stall'){ R.stalls.push({t:ch.t, lv:1}); rfeed(`开了「${ST[ch.t].n}」`); rivalToastBuf.push(`开了新摊位「${ST[ch.t].n}」`); }
    else if(ch.kind==='up'){ ch.s.lv++; rfeed(`把「${ST[ch.s.t].n}」升到 Lv${ch.s.lv}`); if(ch.s.lv===3) rivalToastBuf.push(`把「${ST[ch.s.t].n}」升到满级`); }
    else if(ch.kind==='stage'){ R.stage++; rfeed('请来街头艺人'); rivalToastBuf.push('请来了街头艺人'); }
    else if(ch.kind==='temple'){ R.temple = 1; rfeed('盖了土地公庙'); rivalToastBuf.push('盖了一座土地公庙'); }
    else { R[ch.kind]++; rfeed(ch.kind==='lantern' ? '挂了一盏灯笼' : ch.kind==='tree' ? '种了一棵树' : '摆了座位区'); }
  }
}
function rivalSettle(){

}

    ctx.fillStyle = long ? '#ffd0d0' : '#ffc857'; ctx.font = `700 ${Math.max(9,T*.15)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('排'+c.q.length, px+T*.75, py+T*.135);
  }
}
function drawDeco(c, x, y){
  const px = x*T, py = y*T;
  if(c.t==='lantern'){
    ctx.strokeStyle = 'rgba(255,214,170,.35)'; ctx.lineWidth = Math.max(1, T*.03);
    ctx.beginPath(); ctx.moveTo(px+T*.1,py+T*.06); ctx.quadraticCurveTo(px+T*.5, py+T*.2, px+T*.9, py+T*.06); ctx.stroke();
    const sw = Math.sin(performance.now()/700 + x*1.3 + y) * T*.03;
    drawImg('lantern', px+T*.18+sw, py+T*.12, T*.64);
  } else if(c.t==='stage'){ drawImg('stage', px-T*.05, py-T*.1, T*1.1); }
  else if(c.t==='temple'){ drawImg('temple', px-T*.05, py-T*.12, T*1.1); }

function drawCustomer(cu){
  const px = cu.x*T, py = cu.y*T, r = T*.16, bob = Math.abs(Math.sin(cu.ph))*T*.04*(cu.st==='queue'?0:1);
  ctx.globalAlpha = cu.gone ? .55 : 1;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(px, py+r*.9, r*.95, r*.4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = cu.col; ctx.beginPath(); ctx.ellipse(px, py-bob, r*.85, r, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#f6cfa8'; ctx.beginPath(); ctx.arc(px, py-r*1.25-bob, r*.62, 0, 7); ctx.fill();
  ctx.fillStyle = cu.hair; ctx.beginPath(); ctx.arc(px, py-r*1.38-bob, r*.6, Math.PI, 0); ctx.fill();
  if(cu.rich){ ctx.fillStyle = '#ffc857'; ctx.fillRect(px-r*.55, py-r*2.05-bob, r*1.1, r*.28); }
  if(cu.buys>0 && T>26){ ctx.fillStyle = '#fff4e0'; ctx.fillRect(px+r*.55, py-r*.3-bob, r*.45, r*.55); }
  if(cu.st==='queue' && cu.qwait > cu.patience*.65 && !cu.gone){
    ctx.fillStyle = '#ff7a7a'; ctx.font = `900 ${Math.max(9,T*.2)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

}
function render(now){
  if(!cv.width) return;
  const w = cv.width/dpr, h = cv.height/dpr;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  const OXp = -VX0*T, OYp = -VY0*T;
  ctx.setTransform(dpr,0,0,dpr,OXp*dpr,OYp*dpr);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) drawGround(x, y, Z.grid[idx(x,y)]);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(isSlot(x,y)) drawSlot(x,y);
  const ppl = Z.cust.slice().sort((a,b)=>a.y-b.y);
  let pi = 0;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const c = Z.grid[idx(x,y)];
      if(c.k==='stall') drawStall(c, x, y);
      else if(c.k==='deco') drawDeco(c, x, y);
      else if(c.k==='gate') drawImg('gate', x*T-T*.05, y*T-T*.25, T*1.15);
    }
    while(pi < ppl.length && ppl[pi].y < y+1){ drawCustomer(ppl[pi]); pi++; }
  }
  while(pi < ppl.length) drawCustomer(ppl[pi++]);
  lx.setTransform(1,0,0,1,0,0); lx.globalCompositeOperation = 'source-over';
  lx.clearRect(0,0,lc.width,lc.height);
  lx.fillStyle = G.phase==='day' ? 'rgba(10,8,30,.25)' : 'rgba(8,6,28,.5)'; lx.fillRect(0,0,lc.width,lc.height);
  lx.globalCompositeOperation = 'destination-out';
  lx.setTransform(1,0,0,1,OXp*dpr,OYp*dpr);
  const lights = [];
  Z.grid.forEach((c,i) => {
    const x = i%W+.5, y = ((i/W)|0)+.5;
    if(c.k==='deco' && c.t==='lantern') lights.push([x,y,2.3,1]);
    else if(c.k==='deco' && (c.t==='stage'||c.t==='temple')) lights.push([x,y,2,.9]);
    else if(c.k==='deco' && c.t==='tree') lights.push([x,y,1.2,.6]);
    else if(c.k==='stall') lights.push([x,y,1.35,.85]);
    else if(c.k==='gate') lights.push([x,y,1.8,1]);
  });
  for(const [x,y,r,a] of lights){
    const g = lx.createRadialGradient(x*T*dpr, y*T*dpr, 0, x*T*dpr, y*T*dpr, r*T*dpr);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    lx.fillStyle = g; lx.beginPath(); lx.arc(x*T*dpr, y*T*dpr, r*T*dpr, 0, 7); lx.fill();
  }
  ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(lc, 0, 0); ctx.setTransform(dpr,0,0,dpr,OXp*dpr,OYp*dpr);
  ctx.globalCompositeOperation = 'lighter';
  for(const [x,y,r] of lights){
    if(r < 2) continue;
    const g = ctx.createRadialGradient(x*T, y*T, 0, x*T, y*T, r*T*.8);
    g.addColorStop(0, 'rgba(255,140,60,.22)'); g.addColorStop(1, 'rgba(255,140,60,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x*T, y*T, r*T*.8, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  if(G.event && G.event.id==='rain' && nightOn()){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.strokeStyle = 'rgba(180,200,255,.25)'; ctx.lineWidth = 1; ctx.beginPath();
    const t = now/1000;
    for(let k=0;k<70;k++){ const rx = ((k*97 + t*60) % (w+40)) - 20, ry = ((k*53 + t*420) % (h+40)) - 20; ctx.moveTo(rx, ry); ctx.lineTo(rx-4, ry+12); }
    ctx.stroke(); ctx.setTransform(dpr,0,0,dpr,OXp*dpr,OYp*dpr);
  }
  if(sel){ const c = cellAt(...sel); if(c && c.k!=='grass'){ ctx.strokeStyle = '#ffc857'; ctx.lineWidth = 2.5; rr(ctx, sel[0]*T+2, sel[1]*T+2, T-4, T-4, T*.12); ctx.stroke(); } }
  if(hover && !sel){ const [hx,hy] = hover, c = cellAt(hx,hy); if(c && (c.k==='stall'||c.k==='deco'||isSlot(hx,hy))){ ctx.strokeStyle = 'rgba(255,200,87,.6)'; ctx.lineWidth = 2; rr(ctx, hx*T+2, hy*T+2, T-4, T-4, T*.12); ctx.stroke(); } }
  for(const p of Z.pt){ ctx.fillStyle = `rgba(255,230,190,${.7*(1-p.t/.6)})`; ctx.beginPath(); ctx.arc((p.x+p.vx*p.t)*T, (p.y+p.vy*p.t)*T, T*.06*(1-p.t), 0, 7); ctx.fill(); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const f of Z.fl){
    const a = f.t < .15 ? f.t/.15 : 1 - Math.max(0,(f.t-.7)/.6);
    ctx.globalAlpha = a;
    ctx.font = `900 ${Math.max(11, T*.27*f.sc)}px "Noto Sans SC", sans-serif`;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(20,10,30,.8)';
    const yy = (f.y - f.t*.6)*T;
    ctx.strokeText(f.txt, f.x*T, yy); ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x*T, yy);
  }
  ctx.globalAlpha = 1;
}
function renderRival(now){
  const R = G.rival;
  const w = rcv.width/dpr, h = rcv.height/dpr; if(!w || !rcv.clientWidth) return;
  rctx.setTransform(dpr,0,0,dpr,0,0);
  if(R.absent){
    rctx.fillStyle = '#2a2440'; rctx.fillRect(0,0,w,h);
    rctx.strokeStyle = '#5a5466'; rctx.lineWidth = 2; rctx.beginPath();
    for(let x=6; x<w; x+=16){ rctx.moveTo(x,h*.3); rctx.lineTo(x,h*.85); }
    rctx.moveTo(0,h*.42); rctx.lineTo(w,h*.42); rctx.moveTo(0,h*.72); rctx.lineTo(w,h*.72); rctx.stroke();
    rctx.fillStyle = '#fff4e0'; rr(rctx, w/2-44, h/2-13, 88, 26, 4); rctx.fill();
    rctx.fillStyle = '#24122a'; rctx.font = '900 14px "Noto Sans SC", sans-serif'; rctx.textAlign = 'center'; rctx.textBaseline = 'middle'; rctx.fillText('空地招租', w/2, h/2+1);
    return;
  }
  rctx.fillStyle = '#1d3b33'; rctx.fillRect(0,0,w,h);
  rctx.fillStyle = '#6b5848'; rctx.fillRect(0,h*.56,w,h*.3);
  const n = R.stalls.length, sz = Math.min(30, (w-8)/Math.max(1,n));
  R.stalls.forEach((s,k) => {
    const x = 4 + k*sz, y = h*.56 - sz*.95;
    rctx.fillStyle = '#4a3328'; rctx.fillRect(x+1, y+sz*.1, sz-2, sz*.86);
    const col = CATC[ST[s.t].cat];
    for(let j=0;j<3;j++){ rctx.fillStyle = j%2 ? '#fff4e0' : col; rctx.fillRect(x+1+j*(sz-2)/3, y, (sz-2)/3+.5, sz*.2); }
    drawImg(s.t, x+sz*.15, y+sz*.22, sz*.7, rctx);
    for(let l=0;l<s.lv;l++){ rctx.fillStyle = '#ffc857'; rctx.fillRect(x+3+l*4, y+sz*.88, 2.5, 2.5); }
  });
  if(!R.dead){
    const nl = Math.min(R.lantern, 14);
    for(let k=0;k<nl;k++){
      const x = nl > 1 ? 10 + k*(w-20)/(nl-1) : w/2, y = 6 + Math.sin(now/700+k)*1.5;
      rctx.fillStyle = 'rgba(255,140,60,.25)'; rctx.beginPath(); rctx.arc(x,y,7,0,7); rctx.fill();
      rctx.fillStyle = '#ff6a3d'; rctx.beginPath(); rctx.ellipse(x,y,3,4,0,0,7); rctx.fill();
    }
    const ppl = Math.min(60, Math.round(R.present));
    for(let k=0;k<ppl;k++){
      const t = now/1000*(.15 + (k%7)*.03) + k*1.7;
      const x = ((Math.sin(t) * .5 + .5) * (w-10)) + 5, y = h*.6 + ((k*37)%100)/100*h*.22;
      rctx.fillStyle = SHIRTS[k%SHIRTS.length]; rctx.beginPath(); rctx.arc(x, y+3, 2.6, 0, 7); rctx.fill();
      rctx.fillStyle = '#f6cfa8'; rctx.beginPath(); rctx.arc(x, y-1, 1.8, 0, 7); rctx.fill();
    }
  }
  if(G.phase==='day' || R.dead){ rctx.fillStyle = R.dead ? 'rgba(10,8,30,.6)' : 'rgba(10,8,30,.35)'; rctx.fillRect(0,0,w,h); }
  if(R.dead){
    for(let k=0;k<6;k++){ rctx.fillStyle = k%2 ? '#5a5466' : '#6b6578'; rctx.fillRect(0, h*.15 + k*h*.12, w, h*.12); }
    rctx.fillStyle = '#fff4e0'; rr(rctx, w/2-46, h/2-13, 92, 26, 4); rctx.fill();
    rctx.fillStyle = '#d9362b'; rctx.font = '900 14px "Noto Sans SC", sans-serif'; rctx.textAlign = 'center'; rctx.textBaseline = 'middle'; rctx.fillText('已倒闭', w/2, h/2+1);
  } else if(nightOn() && G.clock < R.promoUntil){
    rctx.fillStyle = 'rgba(255,106,61,.9)'; rr(rctx, w-96, 4, 92, 18, 9); rctx.fill();
    rctx.fillStyle = '#fff'; rctx.font = '700 11px "Noto Sans SC", sans-serif'; rctx.textAlign = 'center'; rctx.textBaseline = 'middle';
    rctx.fillText(R.promoName, w-50, 13.5);
  }
}

function weakest(){
  if(!M || G.rival.dead) return null;
  if(M.me.n < Math.max(2, M.rv.n*.6)) return {n:'规模', tip:`对面有 ${M.rv.n} 家店，你只有 ${M.me.n} 家：多开几家，或者招商`};
  let worst = null, gap = 4;
  DIMS.forEach(d => { const g = (M.b[d.k] - M.a[d.k]) * d.w; if(g > gap){ gap = g; worst = d; } });
  return worst;
}

function fixedFees(){ const f = SF(); return (f.protect==='pay' ? f.fee : 0) + (f.clean==='staff' ? cleanFee() : 0) + (f.quiet==='snack' ? 200 : 0); }
function nightFees(rev){
  const f = SF(), out = [];
  if(f.protect==='pay') out.push(['彪哥的「管理费」', f.fee]);

function endEarly(){ if(nightOn()) G.clock = nightEnd(); }
function priciest(){ return allStalls().filter(c=>c.m).reduce((m,c) => !m || eff(c).price > eff(m).price ? c : m, null); }

function callPolice(){
  const f = SF(); f.policeN = G.night;

  if(Math.random() < p){ f.protect = 'gone'; G.rep += 80; newsPost('警方端掉了一个在夜市收保护费的团伙！摊主们终于可以安心做生意了', 5); return true; }
  f.protect = 'refuse'; return false;

function doTrouble(){
  let n = 0;
  G.zones.forEach(z => {
    if(!z.open) return;
    useZ(z);
    z.cust.forEach(cu => {
      if(cu.st==='leave' || Math.random() > .45) return;
      const s = cu.target && z.grid[cu.target.s]; if(s && s.q){ const k = s.q.indexOf(cu); if(k>=0) s.q.splice(k,1); }
      cu.gone = true; cu.scared = true; n++; goLeave(cu);
    });
  });
  useZ(G.zones[VZ]);
  G.buff.fear = G.clock + 45; G.rep = Math.max(0, G.rep - 30); G.story.incidents++;
  const cands = allStalls().filter(c=>!c.ten && c.lv>1);
  let hit = '';
  if(cands.length){ const c = pick(cands); c.lv--; hit = `「${ST[c.t].n}」的灶台被砸坏了，降回 Lv${c.lv}。`; G.zones.forEach(z=>z.dirty=true); }
  return `${n} 位客人被吓跑了。${hit}接下来 45 分钟客流减少。`;
}

  computeMetrics();
}

function chapterIdx(){ return G.tour >= 1 ? Math.min(5, G.tour+1) : (G.story.seen.length ? 1 : 0); }
function planStory(){
  const S = G.story; S.planFor = G.night; S.tonight = [];
  const evs = STORY.filter(e => e.type==='night' && !(e.once && S.done[e.id]) && e.when());
  const once = evs.filter(e=>e.once), rep = evs.filter(e=>!e.once && Math.random() < e.p), list = [];
  if(once.length) list.push(once[0]);
  if(rep.length && list.length < 2) list.push(pick(rep));
  list.forEach(e => S.tonight.push({id:e.id, at:Math.round(e.at[0] + Math.random()*(e.at[1]-e.at[0]))}));
  S.tonight.sort((a,b)=>a.at-b.at);
}
function pickDayStory(){
  const S = G.story;
  const ev = STORY.find(e => e.type==='day' && !(e.once && S.done[e.id]) && !((S.snooze[e.id]||0) > G.night) && e.when());
  return ev ? ev.id : null;
}

}

function chooseStory(i){
  const so = storyOpen; if(!so || so.done) return;

/* ================= loop ================= */
let last = performance.now(), hudTimer = 0;
function frame(now){
  const real = Math.min(.1, (now - last)/1000); last = now;
  if(!G.bankrupt){
    let dt = real*speed;
    while(dt > 0 && !storyOpen){ const step = Math.min(dt, .05); update(step); dt -= step; }
  }
  shownMoney += (G.money - shownMoney) * Math.min(1, real*8);
  if(Math.abs(G.money-shownMoney) < 1) shownMoney = G.money;
  hudTimer -= real; sideTimer -= real; rivalToastT -= real;
  if(rivalToastT <= 0 && rivalToastBuf.length){ rivalToastT = 3.5; toast(`<b>${RP().name}</b> ${rivalToastBuf.splice(0,2).join('，')}`, true); }
  if(hudTimer <= 0){
    hudTimer = .25; const m = $('#mny');
    if(m){ m.textContent = fmt(shownMoney); const c = $('#clk'); if(c) c.textContent = G.phase==='day'?'白天':clockText();
      if(M && $('#shA')){ const sh = Math.round(M.share*100); $('#shA').textContent = sh+'%'; $('#shBar').style.width = sh+'%'; } }
  }
  if(sideTimer <= 0){
    sideTimer = 1;
    renderHUD(); renderNav(); renderZones(); renderActions(); renderMemory(); renderGoal();
    const p = isDesktop() && page==='map' ? 'manage' : page;
    if($('#ov').hidden || isDesktop()){ if(p!=='manage' || !document.activeElement || !document.activeElement.closest('#p-manage')) renderPage(); }
  }
  if(saveTimer > 0){ saveTimer -= real; if(saveTimer <= 0) save(); }
  render(now);
  renderRival(now);
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
function boot(data){
  const s = (data && data.save) ? JSON.parse(data.save) : load();
  let first = false;
  if(s){ G = s; hydrate(); }
  else { freshGame('kai'); first = true; }
  goPage(isDesktop() ? 'manage' : 'map');
  resize();
  if(first){ G.phase = 'day'; computeMetrics(); renderAll(); showIntro(false); }
  else if(G.story.pending){ G.phase = 'day'; computeMetrics(); renderAll(); const p = STORY.find(x=>x.id===G.story.pending); if(p) showStory(p, false); else startNight(); }
  else startNight();
  requestAnimationFrame(t => { last = t; frame(t); });
}
