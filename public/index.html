<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
/* 存档搬到 https（docs/DESIGN.md FLOW-SAVE-MOVE S1，保留到 2026-11-21）：这台浏览器还没查过 http 下的旧数据时，去 http 的搬家页取一次。
   标记先记第几次去查再跳，带回后记 done；搬家页打不开时下次打开再试，最多 3 次；本地存储写不了时不跳。 */
(function moveCheck(){
  try {
    const st = localStorage.getItem('changju.moved');
    if (location.protocol !== 'https:' || location.hash.startsWith('#move=') || st === 'done' || Number(st) >= 3) return;
    localStorage.setItem('changju.moved', String(Number(st) + 1));
    window.__cjMoving = true;
    location.replace('http://' + location.host + '/move#r=' + encodeURIComponent(location.hash.slice(1)));
  } catch (e) {}
})();
</script>
<title>shoota 游戏平台</title>
<link rel="icon" href="brand/assets/logo/app-icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#13100D">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="brand/fonts/fonts.css">
<link rel="stylesheet" href="brand/tokens.css">
<link rel="stylesheet" href="brand/state-layer.css">
<style>
/* Layout: store shell — sticky top bar, featured hero with a side panel, cover grid; a game runs in a full-bleed overlay with a thin platform bar on top. Every value comes from brand/tokens.css (dark mode only, pinned by data-theme on <html>); interactive states come from brand/state-layer.css. */
*{box-sizing:border-box}
html{background:var(--semantic-color-surface-background);color-scheme:dark;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:var(--semantic-color-border-strong) transparent}
body{background:var(--semantic-color-surface-background);color:var(--semantic-color-text-primary);font-family:var(--semantic-typography-body-font-family);font-size:var(--semantic-typography-body-font-size);font-weight:var(--semantic-typography-body-font-weight);line-height:var(--semantic-typography-body-line-height);letter-spacing:var(--semantic-typography-body-letter-spacing);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:var(--semantic-layout-z-index-sticky);background:var(--semantic-color-surface-background)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:var(--semantic-layout-content);margin:0 auto;padding-left:calc(env(safe-area-inset-left,0px) + var(--primitive-dimension-space-4));padding-right:calc(env(safe-area-inset-right,0px) + var(--primitive-dimension-space-4))}
.num{font-variant-numeric:tabular-nums}
.ico{display:inline-block;flex:none;width:var(--semantic-icon-size-sm);height:var(--semantic-icon-size-sm);background:currentColor;-webkit-mask:var(--ico) center/contain no-repeat;mask:var(--ico) center/contain no-repeat}
.ico-search{--ico:url(brand/assets/icons/search.svg)}
.ico-back{--ico:url(brand/assets/icons/arrow-left.svg)}
.ico-full{--ico:url(brand/assets/icons/maximize.svg)}
.ico-copy{--ico:url(brand/assets/icons/copy.svg)}
.ico-down{--ico:url(brand/assets/icons/download.svg)}
.ico-file{--ico:url(brand/assets/icons/file-up.svg)}
.ico-check{--ico:url(brand/assets/icons/check.svg)}

/* type levels: each selector group reads one token level */
.sec-h h2{font-family:var(--semantic-typography-heading2-font-family);font-size:var(--semantic-typography-heading2-font-size);font-weight:var(--semantic-typography-heading2-font-weight);line-height:var(--semantic-typography-heading2-line-height);letter-spacing:var(--semantic-typography-heading2-letter-spacing)}
.hero-info h3,.d-head h1,.lib-title{font-family:var(--semantic-typography-heading1-font-family);font-size:var(--semantic-typography-heading1-font-size);font-weight:var(--semantic-typography-heading1-font-weight);line-height:var(--semantic-typography-heading1-line-height);letter-spacing:var(--semantic-typography-heading1-letter-spacing)}
.band h3,.box h3,.perk b,.start h3,.empty-t{font-family:var(--semantic-typography-heading3-font-family);font-size:var(--semantic-typography-heading3-font-size);font-weight:var(--semantic-typography-heading3-font-weight);line-height:var(--semantic-typography-heading3-line-height);letter-spacing:var(--semantic-typography-heading3-letter-spacing)}
.btn,.cap b,.cont b,.pbar .t,.bk-list li,.menu .who b{font-family:var(--semantic-typography-body-strong-font-family);font-size:var(--semantic-typography-body-strong-font-size);font-weight:var(--semantic-typography-body-strong-font-weight);line-height:var(--semantic-typography-body-strong-line-height);letter-spacing:var(--semantic-typography-body-strong-letter-spacing)}
.nav a,.chip,.facts,.tbl table,.lib-list b,.menu a,.menu button,.toast,.pbar,.note,.statline{font-family:var(--semantic-typography-label-font-family);font-size:var(--semantic-typography-label-font-size);font-weight:var(--semantic-typography-label-font-weight);line-height:var(--semantic-typography-label-line-height);letter-spacing:var(--semantic-typography-label-letter-spacing)}
.sec-h .aside,.pill,.tag,.cap .meta,.cont span,.crumbs,.lib-list span,.kv span,.fine,.err,.menu .who span,.bk-list span,.chip .n{font-family:var(--semantic-typography-caption-font-family);font-size:var(--semantic-typography-caption-font-size);font-weight:var(--semantic-typography-caption-font-weight);line-height:var(--semantic-typography-caption-line-height);letter-spacing:var(--semantic-typography-caption-letter-spacing)}
.d-main h2{font-family:var(--semantic-typography-eyebrow-font-family);font-size:var(--semantic-typography-eyebrow-font-size);font-weight:var(--semantic-typography-eyebrow-font-weight);line-height:var(--semantic-typography-eyebrow-line-height);letter-spacing:var(--semantic-typography-eyebrow-letter-spacing)}
.kv b,.statline b,.steps li::before,.avatar{font-family:var(--semantic-typography-metric-font-family);font-weight:var(--semantic-typography-metric-font-weight);letter-spacing:var(--semantic-typography-metric-letter-spacing)}
.kv b{font-size:var(--semantic-typography-metric-font-size);line-height:var(--semantic-typography-metric-line-height)}
.bk-code{font-family:var(--semantic-typography-code-font-family);font-size:var(--semantic-typography-code-font-size);font-weight:var(--semantic-typography-code-font-weight);line-height:var(--semantic-typography-code-line-height);letter-spacing:var(--semantic-typography-code-letter-spacing)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:var(--semantic-layout-z-index-sticky);background:var(--semantic-color-surface-background);border-bottom:var(--semantic-layout-hairline) solid var(--semantic-color-border-subtle)}
.top .wrap{display:flex;align-items:center;gap:var(--primitive-dimension-space-4);flex-wrap:wrap;padding-block:var(--primitive-dimension-space-3)}
.logo{display:flex;align-items:center;gap:var(--semantic-space-within-group);text-decoration:none;border-radius:var(--semantic-radius-sm)}
.logo-mark{width:var(--primitive-dimension-space-8);height:var(--primitive-dimension-space-8);display:block;flex:none}
.logo-word{height:var(--primitive-dimension-space-5);width:auto;display:block}
.nav{display:flex;gap:var(--primitive-dimension-space-1)}
.nav a{padding:var(--primitive-dimension-space-2) var(--primitive-dimension-space-4);border-radius:var(--semantic-radius-pill);text-decoration:none;color:var(--semantic-color-text-secondary);white-space:nowrap}
.nav a[aria-current="page"]{color:var(--semantic-color-action-primary);background:var(--semantic-color-surface-selected)}
.search{flex:1 1 200px;max-width:300px;margin-left:auto;display:flex;align-items:center;gap:var(--semantic-space-within-group);padding:0 var(--primitive-dimension-space-3);background:var(--semantic-color-surface-sunken);border:var(--semantic-layout-hairline) solid var(--semantic-color-border-strong);border-radius:var(--semantic-radius-pill);color:var(--semantic-color-text-tertiary)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;padding:var(--primitive-dimension-space-2) 0;color:var(--semantic-color-text-primary)}
.search input::placeholder{color:var(--semantic-color-text-tertiary)}
.acct{position:relative}
.avatar{width:var(--primitive-dimension-space-8);height:var(--primitive-dimension-space-8);border-radius:var(--semantic-radius-pill);border:0;background:var(--semantic-color-surface-overlay);color:var(--semantic-color-text-primary);font-size:var(--semantic-typography-body-font-size);cursor:pointer;display:grid;place-items:center}
.menu{position:absolute;right:0;top:calc(100% + var(--semantic-space-within-group));z-index:var(--semantic-layout-z-index-dropdown);background:var(--semantic-color-surface-overlay);border:var(--semantic-layout-hairline) solid var(--semantic-color-border-subtle);border-radius:var(--semantic-radius-md);min-width:220px;padding:var(--primitive-dimension-space-1);box-shadow:var(--semantic-elevation-overlay);display:grid}
.menu .who{padding:var(--primitive-dimension-space-2) var(--primitive-dimension-space-3) var(--primitive-dimension-space-3);border-bottom:var(--semantic-layout-hairline) solid var(--semantic-color-border-subtle);margin-bottom:var(--primitive-dimension-space-1)}
.menu .who b{display:block}
.menu .who span{color:var(--semantic-color-text-secondary)}
.menu button,.menu a{background:none;border:0;text-align:left;padding:var(--primitive-dimension-space-2) var(--primitive-dimension-space-3);border-radius:var(--semantic-radius-sm);cursor:pointer;text-decoration:none}
@media (max-width:760px){
  .search{order:5;flex-basis:100%;max-width:none;margin-left:0}
  .top .wrap{gap:var(--primitive-dimension-space-3)}
  .acct{margin-left:auto}
  .nav a{padding:var(--primitive-dimension-space-2) var(--primitive-dimension-space-3)}
}
@media (max-width:420px){.logo-word{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--semantic-space-within-group);border:var(--semantic-layout-hairline) solid var(--semantic-color-border-subtle);background:var(--semantic-color-surface-raised);color:var(--semantic-color-text-primary);border-radius:var(--semantic-radius-md);padding:var(--primitive-dimension-space-2) var(--primitive-dimension-space-4);cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform var(--semantic-motion-duration-fast) var(--semantic-motion-easing-standard)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--semantic-color-action-primary);border-color:var(--semantic-color-action-primary);color:var(--semantic-color-text-on-action)}
.btn-lg{padding:var(--primitive-dimension-space-3) var(--primitive-dimension-space-6);font-size:var(--semantic-typography-heading3-font-size)}
.btn-quiet{background:none;border-color:transparent;color:var(--semantic-color-text-secondary)}
.btn[disabled],.btn[aria-disabled="true"]{cursor:not-allowed}
.btn .ico{width:var(--semantic-icon-size-sm);height:var(--semantic-icon-size-sm)}

/* status pill and tags */
.pill{display:inline-flex;align-items:center;gap:var(--primitive-dimension-space-1);padding:0 var(--primitive-dimension-space-2);border-radius:var(--semantic-radius-pill);background:var(--semantic-color-surface-overlay);color:var(--semantic-color-text-secondary);white-space:nowrap}
.pill::before{content:"";width:var(--primitive-dimension-space-1);height:var(--primitive-dimension-space-1);border-radius:var(--semantic-radius-pill);background:currentColor}
.pill.ok{color:var(--semantic-color-feedback-success)}
.pill.dev{color:var(--semantic-color-feedback-warning)}
.tag{display:inline-block;padding:var(--primitive-dimension-space-1) var(--primitive-dimension-space-3);border-radius:var(--semantic-radius-pill);background:var(--semantic-color-surface-overlay);color:var(--semantic-color-text-secondary);text-decoration:none;cursor:pointer;border:0}
.tags{display:flex;flex-wrap:wrap;gap:var(--primitive-dimension-space-2)}

/* cover art: canvas illustration per game; the title tint belongs to the art, not to the UI palette */
.cv{position:relative;overflow:hidden;background:var(--semantic-color-surface-sunken);aspect-ratio:46/21;max-width:100%;width:100%;border-radius:var(--semantic-radius-md);container-type:inline-size;isolation:isolate}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cv-t{position:absolute;left:6%;right:40%;bottom:13%;font-family:var(--semantic-typography-heading1-font-family);font-weight:var(--semantic-typography-heading1-font-weight);font-size:clamp(15px,7.4cqw,60px);line-height:1.08;color:var(--semantic-color-text-primary)}
.cv-s{display:block;margin-top:.45em;font-family:var(--semantic-typography-label-font-family);font-weight:var(--semantic-typography-label-font-weight);font-size:clamp(9px,2.4cqw,17px);line-height:1.3;opacity:.85}
.cv[data-c="douluo"] .cv-t{color:#f3d58a}
.cv[data-c="hougong"] .cv-t{color:#f7e7c4}
.cv[data-c="lol"] .cv-t{color:#d9f6ff}
.cv[data-c="yike"] .cv-t{color:#efd58e}
.cv[data-c="f1"] .cv-t,.cv[data-c="nba"] .cv-t{font-size:clamp(14px,6.6cqw,50px)}
.cv[data-c="f1-driver"] .cv-t{color:#fff;font-size:clamp(15px,7.2cqw,56px);font-style:italic}
.cv[data-c="wealth-reborn"] .cv-t{color:#ffe4a3;font-size:clamp(15px,7.6cqw,60px)}
.cv[data-c="basketball-star"] .cv-t{color:#fff0d9}
.cv[data-c="f1"] .cv-t{color:#fff;font-style:italic}
.cv[data-c="nba"] .cv-t,.cv[data-c="cba"] .cv-t{color:#fff0d9;font-size:clamp(15px,7.2cqw,56px)}

/* store */
.page{padding-block:var(--primitive-dimension-space-8) var(--primitive-dimension-space-16);display:grid;grid-template-columns:minmax(0,1fr);gap:var(--semantic-space-section)}
.page.tight{gap:var(--semantic-space-between-groups)}
.page.narrow{max-width:760px;margin:0 auto}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--primitive-dimension-space-3);margin-bottom:var(--primitive-dimension-space-4)}
.sec-h .aside{color:var(--semantic-color-text-tertiary)}

.hero{display:grid;grid-template-columns:minmax(0,1fr) 320px;background:var(--semantic-color-surface-raised);border:var(--semantic-layout-hairline) solid var(--semantic-color-border-subtle);border-radius:var(--semantic-radius-lg);overflow:hidden}
.hero-art{display:block;text-decoration:none}
.hero-art .cv{border-radius:0;height:100%;aspect-ratio:auto;min-height:260px}
.hero-info{padding:var(--primitive-dimension-space-6);display:flex;flex-direction:column;gap:var(--primitive-dimension-space-3);min-width:0}
.hero-info p{margin:0;color:var(--semantic-color-text-secondary)}
.hero-info .grow{flex:1}
.hero-nav{display:flex;justify-content:center;gap:var(--primitive-dimension-space-1);margin-top:var(--primitive-dimension-space-3)}
.hero-nav button{flex:0 1 var(--primitive-dimension-space-8);min-width:var(--primitive-dimension-space-4);height:var(--primitive-dimension-space-5);padding:var(--primitive-dimension-space-2) 0;border:0;border-radius:var(--semantic-radius-pill);background:var(--semantic-color-border-subtle);background-clip:content-box;color:var(--semantic-color-text-primary);cursor:pointer}
.hero-nav button[aria-pressed="true"]{background-color:var(--semantic-color-action-primary)}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}.hero-art .cv{aspect-ratio:46/21;min-height:0}.hero-info{padding:var(--primitive-dimension-space-5)}}

.chips{display:flex;flex-wrap:wrap;gap:var(--semantic-space-within-group);margin-bottom:var(--primitive-dimension-space-5)}
.chip{display:inline-flex;align-items:baseline;gap:var(--primitive-dimension-space-1);border:var(--semantic-layout-hairline) solid var(--semantic-color-border-subtle);background:none;color:var(--semantic-color-text-secondary);border-radius:var(--semantic-radius-pill);padding:var(--primitive-dimension-space-2) var(--primitive-dimension-space-4);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--semantic-color-surface-selected);border-color:var(--semantic-color-action-primary);color:var(--semantic-color-text-primary)}
.chip .n{color:var(--semantic-color-text-tertiary)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--primitive-dimension-space-4) var(--primitive-dimension-space-3)}
.cap{display:grid;gap:var(--primitive-dimension-space-2);padding:var(--primitive-dimension-space-2);margin:calc(-1 * var(--primitive-dimension-space-2));border-radius:var(--semantic-radius-lg);text-decoration:none;align-content:start;min-width:0;color:var(--semantic-color-text-primary)}
.cap .cv{transition:transform var(--semantic-motion-duration-base) var(--semantic-motion-easing-standard)}
@media (hover:hover) and (pointer:fine){.cap:hover .cv{transform:translateY(calc(-1 * var(--primitive-dimension-space-1)))}}
.cap-row{display:flex;justify-content:space-between;align-items:center;gap:var(--semantic-space-within-group);margin-top:var(--primitive-dimension-space-1)}
.cap b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap p{margin:0;color:var(--semantic-color-text-secondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap .meta{color:var(--semantic-color-text-tertiary)}

.cont{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--primitive-dimension-space-3)}
.cont a{display:grid;grid-template-columns:120px minmax(0,1fr);gap:var(--primitive-dimension-space-3);align-items:center;background:var(--semantic-color-surface-raised);border-radius:var(--semantic-radius-lg);padding:var(--primitive-dimension-space-2);text-decoration:none}
.cont a .cv{border-radius:var(--semantic-radius-sm)}
.cont b{display:block}
.cont span{color:var(--semantic-color-text-secondary)}

.empty-t{color:var(--semantic-color-text-primary)}
.empty{border:var(--semantic-layout-hairline) dashed var(--semantic-color-border-strong);border-radius:var(--semantic-radius-lg);padding:var(--primitive-dimension-space-8);text-align:center;color:var(--semantic-color-text-secondary);display:grid;gap:var(--primitive-dimension-space-3);justify-items:center}

.band{background:var(--semantic-color-surface-raised);border:var(--semantic-layout-hairline) solid var(--semantic-color-border-subtle);border-radius:var(--semantic-radius-lg);padding:var(--primitive-dimension-space-6);display:flex;gap:var(--primitive-dimension-space-5);align-items:center;justify-content:space-between;flex-wrap:wrap}
.band p{margin:var(--primitive-dimension-space-1) 0 0;color:var(--semantic-color-text-secondary);max-width:60ch}

/* detail */
.crumbs{color:var(--semantic-color-text-tertiary);display:flex;gap:var(--primitive-dimension-space-2);flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--semantic-color-text-secondary);border-radius:var(--semantic-radius-inner-min)}
@media (hover:hover){.crumbs a:hover,.inline-link:hover{text-decoration:underline}}
.d-head{display:grid;gap:var(--primitive-dimension-space-1)}
.d-head .sub{color:var(--semantic-color-text-secondary)}
.d-top{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:var(--semantic-space-between-groups);align-items:start}
.d-top .cv{border-radius:var(--semantic-radius-lg)}
.d-side{display:grid;gap:var(--primitive-dimension-space-4);background:var(--semantic-color-surface-raised);border-radius:var(--semantic-radius-lg);padding:var(--primitive-dimension-space-5)}
.d-side .tagline{margin:0;color:var(--semantic-color-text-primary)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--primitive-dimension-space-2) var(--primitive-dimension-space-4);margin:0}
.facts dt{color:var(--semantic-color-text-tertiary)}
.facts dd{margin:0;color:var(--semantic-color-text-primary)}
.d-body{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:var(--semantic-space-between-groups);align-items:start}
.d-main{display:grid;gap:var(--primitive-dimension-space-10);min-width:0}
.d-main section{display:grid;gap:var(--primitive-dimension-space-3)}
.d-main h2{color:var(--semantic-color-text-tertiary);padding-bottom:var(--primitive-dimension-space-3);border-bottom:var(--semantic-layout-hairline) solid var(--semantic-color-border-subtle)}
.start{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--primitive-dimension-space-4);background:var(--semantic-color-surface-raised);border:var(--semantic-layout-hairline) solid var(--semantic-color-border-subtle);border-radius:var(--semantic-radius-lg);padding:var(--primitive-dimension-space-5)}
.start p{margin:var(--primitive-dimension-space-1) 0 0;color:var(--semantic-color-text-secondary)}
@media (max-width:520px){.start{grid-template-columns:minmax(0,1fr)}}
.prose p{margin:0 0 .8em;max-width:68ch;color:var(--semantic-color-text-secondary)}
.prose p:last-child{margin-bottom:0}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:var(--primitive-dimension-space-3);counter-reset:s}
.steps li{display:grid;grid-template-columns:var(--primitive-dimension-space-8) minmax(0,1fr);gap:var(--primitive-dimension-space-3);color:var(--semantic-color-text-secondary);counter-increment:s}
.steps li::before{content:counter(s);width:var(--primitive-dimension-space-6);height:var(--primitive-dimension-space-6);border-radius:var(--semantic-radius-pill);background:var(--semantic-color-surface-selected);color:var(--semantic-color-action-primary);display:grid;place-items:center;font-size:var(--semantic-typography-label-font-size);margin-top:var(--primitive-dimension-space-1)}
.tbl{overflow-x:auto;border:var(--semantic-layout-hairline) solid var(--semantic-color-border-subtle);border-radius:var(--semantic-radius-md);scrollbar-width:thin;overscroll-behavior-x:contain}
.tbl table{border-collapse:collapse;width:100%;min-width:560px}
.tbl th,.tbl td{text-align:left;padding:var(--primitive-dimension-space-2) var(--primitive-dimension-space-3);border-bottom:var(--semantic-layout-hairline) solid var(--semantic-color-border-subtle);vertical-align:top}

  function open(){
    if (p) return p;

      const t = setTimeout(() => { if (p === cur) p = null; res(STUCK); }, 3000);

async function packSaves(){
  const u = me(), saves = {}, stats = {};
  for (const g of allGames()) {
    const ls = await IDB.get('kv', u.email + '|' + g.id), s = peek(g.id);
    if ((ls && Object.keys(ls).length) || s?.seconds) { saves[g.id] = ls || {}; if (s) stats[g.id] = s; }
  }

}
const gzip = (bytes, Stream) => new Response(new Blob([bytes]).stream().pipeThrough(new Stream('gzip'))).arrayBuffer().then(b => new Uint8Array(b));
async function encodeSaves(d){
  let bytes = new TextEncoder().encode(JSON.stringify(d)), tag = 'CJ0';
  if (window.CompressionStream) { bytes = await gzip(bytes, CompressionStream); tag = 'CJ1'; }
  let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return tag + btoa(bin);
}
async function decodeSaves(code){
  code = code.replace(/\s+/g, '');
  const tag = code.slice(0, 3);
  if (tag === 'CJ1' && !window.DecompressionStream) throw new Error('old');
  if (tag !== 'CJ0' && tag !== 'CJ1') throw new Error('bad');
  let bytes = Uint8Array.from(atob(code.slice(3)), c => c.charCodeAt(0));
  if (tag === 'CJ1') bytes = await gzip(bytes, DecompressionStream);
  const d = JSON.parse(new TextDecoder().decode(bytes));
  if (!d || d.v !== 1 || !d.saves || typeof d.saves !== 'object') throw new Error('bad');
  return d;
}
async function applySaves(d){
  const u = me(), ids = Object.keys(d.saves).filter(id => findGame(id));
  meta.stats[u.email] ??= {};
  for (const id of ids) {
    await IDB.put('kv', d.saves[id], u.email + '|' + id);
    meta.stats[u.email][id] = d.stats?.[id] || { seconds:0, last:d.at, ach:{}, status:'' };
    if (d.achDefs?.[id]) meta.achDefs[id] = d.achDefs[id];
  }
  meta.wish[u.email] = [...new Set([...(meta.wish[u.email] || []), ...(d.wish || []).filter(id => findGame(id))])];
  persist();
  return ids.length;
}

  const h = location.hash.slice(6), i = h.indexOf('&r='), code = i < 0 ? h : h.slice(0, i);
  let st = null, back = '';
  try { st = localStorage.getItem('changju.moved'); back = i < 0 ? '' : decodeURIComponent(h.slice(i + 3)); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search + (back ? '#' + back : ''));
  if (!st || st === 'done') return false; // 本机没有发起搬家，地址里的数据不认
  try {
    if (!code) return false;
    const d = await decodeSaves(code), u = me();
    meta.stats[u.email] ??= {};
    for (const id of new Set([...Object.keys(d.saves), ...Object.keys(d.stats || {})])) {
      if (!findGame(id)) continue;
      const key = u.email + '|' + id, mine = peek(id), theirs = d.stats?.[id];
      if ((mine || await IDB.get('kv', key)) && (theirs?.seconds || 0) <= (mine?.seconds || 0)) continue; // 留累计时长更长的那份
      if (d.saves[id]) await IDB.put('kv', d.saves[id], key);
      if (theirs) meta.stats[u.email][id] = theirs;
      if (d.achDefs?.[id]) meta.achDefs[id] ??= d.achDefs[id];
    }
    meta.wish[u.email] = [...new Set([...(meta.wish[u.email] || []), ...(d.wish || []).filter(id => findGame(id))])];
    if (/^[0-9a-f]{32}$/.test(d.vid || '') && d.vid !== meta.vid) {
      if (meta.vid) fetch('/api/merge', { method:'POST', body:JSON.stringify({ v:d.vid, from:meta.vid }), keepalive:true, headers:{ 'content-type':'application/json' } }).catch(() => {});
      meta.vid = d.vid;
    }
    persist();
    return Boolean(d.had);
  } catch (e) { return false; }
  finally { try { localStorage.setItem('changju.moved', 'done'); } catch (e) {} }
}
const titles = ids => ids.map(id => '《' + esc(findGame(id).title) + '》').join('');
async function renderBackup(){
  const d = await packSaves(), have = Object.keys(d.saves);
  const code = have.length ? await encodeSaves(d) : '';
  if (location.hash.slice(1) !== 'backup') return;
  $('#view').innerHTML = `<div class="page tight narrow">
    <div class="d-head"><h1>备份 / 恢复进度</h1><div class="sub">不用注册账号，进度保存在这台设备的浏览器里。换手机、换浏览器或清理缓存都会丢失进度，提前复制一份存档码存好。</div></div>
    <section class="box">
      <h3>备份这台设备的进度</h3>
      ${have.length ? `<ul class="bk-list">${have.map(id => `<li>${esc(findGame(id).title)}<span>${fmtPlay(d.stats[id]?.seconds || 0)}${d.stats[id]?.status ? ' · ' + esc(d.stats[id].status) : ''}</span></li>`).join('')}</ul>
        <label class="sr" for="bkOut">存档码</label>
        <div class="fieldbox state-layer focus-ring is-field"><textarea id="bkOut" class="bk-code" rows="3" readonly>${code}</textarea></div>
        <div class="acts"><button class="state-layer focus-ring btn btn-primary" type="button" data-act="bk-copy"><span class="ico ico-copy" aria-hidden="true"></span>复制存档码</button><button class="state-layer focus-ring btn" type="button" data-act="bk-file"><span class="ico ico-down" aria-hidden="true"></span>下载存档文件</button></div>
        <p class="fine">存档码共 ${code.length.toLocaleString('zh-CN')} 个字符，只包含游戏进度。可以发到微信「文件传输助手」，或存进备忘录。</p>`
      : `<p>这台设备上还没有游戏进度。玩过之后，再回来复制存档码。</p><div class="acts"><a class="state-layer focus-ring btn" href="#store">去商店挑一款</a></div>`}
    </section>
    <form class="box" id="bkIn" novalidate>
      <h3>在这台设备上恢复进度</h3>
      <p>粘贴在另一台设备上复制的存档码，或者选择下载的存档文件（.txt）。</p>
      <label class="sr" for="bkCode">存档码</label>
      <div class="fieldbox state-layer focus-ring is-field"><textarea id="bkCode" class="bk-code" rows="3" placeholder="粘贴存档码，以 CJ 开头" aria-describedby="bkErr" spellcheck="false" autocomplete="off"></textarea></div>
      <p class="err" id="bkErr" role="alert"></p>
      <div class="acts">
        <button class="state-layer focus-ring btn btn-primary" type="submit" id="bkGo">恢复进度</button>
        <label class="state-layer focus-ring is-field btn" id="bkPick"><span class="ico ico-file" aria-hidden="true"></span>选择存档文件<input id="bkFile" type="file" accept=".txt,text/plain" class="sr"></label>
        <button class="state-layer focus-ring btn btn-quiet" type="button" id="bkCancel" hidden>取消</button>
      </div>
      <div class="note" id="bkAsk" tabindex="-1" hidden></div>
    </form>
  </div>`;
  let pending = null;
  const form = $('#bkIn'), input = $('#bkCode'), err = $('#bkErr'), ask = $('#bkAsk');
  const reset = () => { pending = null; ask.hidden = true; $('#bkCancel').hidden = true; $('#bkPick').hidden = false; $('#bkGo').textContent = '恢复进度'; };
  const fail = msg => { reset(); err.textContent = msg; input.setAttribute('aria-invalid', 'true'); input.focus(); };
  input.addEventListener('input', () => { err.textContent = ''; input.removeAttribute('aria-invalid'); if (pending) reset(); });
  $('#bkCancel').addEventListener('click', () => { reset(); input.focus(); });
  $('#bkFile').addEventListener('change', e => {
    const f = e.target.files[0]; e.target.value = '';
    if (f) f.text().then(t => { input.value = t.trim(); err.textContent = ''; form.requestSubmit(); }, () => fail('读不了这个文件。请重新选择下载的存档文件，或者直接粘贴存档码。'));
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (pending) {
      const n = await applySaves(pending);
      track({ t:'restore' });
      toast(`已恢复 ${n} 款游戏的进度`); go('library'); return;
    }
    if (!input.value.trim()) return fail('先粘贴存档码，或者点「选择存档文件」。');
    let got;
    try { got = await decodeSaves(input.value); }
    catch (x) { return fail(x.message === 'old' ? '这个浏览器版本太旧，读不了这份存档码。换系统自带的浏览器，或者升级系统后再试。' : '这段存档码读不出来，可能复制时漏了开头或结尾。回到原设备点「复制存档码」，整段重新复制一次。'); }
    const ids = Object.keys(got.saves).filter(id => findGame(id));
    if (!ids.length) return fail('这份存档码里没有本平台游戏的进度。');
    const over = ids.filter(id => have.includes(id));
    pending = got;
    ask.innerHTML = `这份存档码导出于 ${esc(new Date(got.at).toLocaleString('zh-CN', { month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' }))}，包含${titles(ids)}的进度。`
      + (over.length ? `恢复后，这台设备上${titles(over)}现在的进度会被替换，替换后找不回来。` : '');
    ask.hidden = false; $('#bkPick').hidden = true; $('#bkCancel').hidden = false; $('#bkGo').textContent = '确认恢复';
    $('#bkGo').focus();
  });
}

/* ───────── 运行游戏 ───────── */
let P = null;
const EMBED = window.__CJ_GAMES__ || null;   // 单文件版：游戏以 base64 打包在页面里
const within = (pr, ms) => Promise.race([pr, new Promise(r => setTimeout(r, ms))]);
// 取游戏文件，返回 { html } 或 { err:'net' | 'file' }。同一版本（按目录登记的大小）先读本机存的；下载 15 秒没有新数据就重下一次（REQ-017）
async function getHtml(g, onProg){
  if (EMBED && EMBED[g.id]) { try { return { html:new TextDecoder().decode(Uint8Array.from(atob(EMBED[g.id]), c => c.charCodeAt(0))) }; } catch (e) {} }
  if (!g.src) return { err:'file' };
  const kept = await within(IDB.get('games', g.id), 2000);
  if (kept && kept.size === g.size && typeof kept.html === 'string') return { html:kept.html };
  const url = g.src.replace(/\.html$/, ''); // 静态资源会把 .html 地址跳到不带后缀的地址，直接请求后者省一次往返
  for (let i = 0; i < 2; i++) {
    const r = await download(url, g.size, onProg);
    if (r.html != null) { IDB.put('games', { id:g.id, size:g.size, html:r.html }); return r; }
    if (r.err === 'file') return r;
  }
  return { err:'net' };
}
async function download(url, total, onProg){
  const ac = new AbortController(); let t = 0;
  const arm = () => { clearTimeout(t); t = setTimeout(() => ac.abort(), 15000); };
  try {
    arm();
    const r = await fetch(url, { signal:ac.signal });
    if (!r.ok) return { err:'file' };
    if (!r.body?.getReader) return { html:await r.text() };
    const rd = r.body.getReader(), parts = []; let got = 0;
    for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; arm(); onProg?.(got, total); }
    return { html:await new Blob(parts).text() };
  } catch (e) { return { err:'net' }; }
  finally { clearTimeout(t); }
}
function inject(html, init){
  const json = JSON.stringify(init).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  const boot = '<script>(function(){var I=' + json + ';' + BOOT + '})();<\/script>';
  const head = html.match(/<head[^>]*>/i);
  if (head) return html.slice(0, head.index + head[0].length) + boot + html.slice(head.index + head[0].length);
  const dt = html.match(/<!doctype[^>]*>/i);
  if (dt) return html.slice(0, dt.index + dt[0].length) + boot + html.slice(dt.index + dt[0].length);
  return boot + html;
}
// 注入到游戏里的引导脚本：接管 localStorage、提供 Platform SDK
const BOOT = `
var post=function(m){m.__cj=1;try{parent.postMessage(m,'*')}catch(e){}};
var data=I.storage||{},has=function(k){return Object.prototype.hasOwnProperty.call(data,k)};
var ls={getItem:function(k){k=String(k);return has(k)?data[k]:null},
setItem:function(k,v){k=String(k);v=String(v);data[k]=v;post({type:'ls-set',k:k,v:v})},
removeItem:function(k){k=String(k);if(has(k)){delete data[k];post({type:'ls-del',k:k})}},
clear:function(){for(var k in data)delete data[k];post({type:'ls-clear'})},
key:function(i){var ks=Object.keys(data);return i<ks.length?ks[i]:null}};
Object.defineProperty(ls,'length',{get:function(){return Object.keys(data).length}});
var lsp=typeof Proxy==='function'?new Proxy(ls,{get:function(t,p){if(p in t)return t[p];if(typeof p==='string'&&has(p))return data[p];return undefined},set:function(t,p,v){t.setItem(p,v);return true},deleteProperty:function(t,p){t.removeItem(p);return true}}):ls;
var sd={},ss={getItem:function(k){return Object.prototype.hasOwnProperty.call(sd,k)?sd[k]:null},setItem:function(k,v){sd[String(k)]=String(v)},removeItem:function(k){delete sd[k]},clear:function(){sd={}},key:function(i){return Object.keys(sd)[i]||null}};
try{Object.defineProperty(window,'localStorage',{configurable:true,get:function(){return lsp}})}catch(e){}
try{Object.defineProperty(window,'sessionStorage',{configurable:true,get:function(){return ss}})}catch(e){}
var done={};
window.Platform=Object.freeze({version:'1.0',game:I.game,user:I.user,
unlock:function(k){k=String(k);if(done[k])return;done[k]=1;post({type:'unlock',key:k})},
defineAchievements:function(list){try{post({type:'defs',list:JSON.parse(JSON.stringify(list||[]))})}catch(e){}},
setStatus:function(t){post({type:'status',text:String(t).slice(0,60)})},
exit:function(){post({type:'exit'})}});
`;
async function openPlayer(id){
  const g = findGame(id);
  if (!g) { go('store'); return; }
  const u = me();
  if (P && P.gid === id) return;
  closePlayer();
  const st = stat(id); st.last = now(); persist();
  navigator.storage?.persist?.();
  const key = u.email + '|' + id;
  P = { gid:id, key, ls:{}, secs:0, unsent:0, timer:null, saveT:null, frame:null };
  track({ t:'start', g:id });
  $('#pTitle').textContent = g.title; $('#pStatus').textContent = st.status || ''; $('#pTime').textContent = '本次 0 分钟';
  $('#pSaved').textContent = '读取存档…'; $('#pSaved').className = 'saved';
  $('#player').hidden = false; document.body.style.overflow = 'hidden';
  bootGame(g);
}
const mb = n => (n / 1048576).toFixed(1) + ' MB';
function loadView(g){
  $('#pStage').innerHTML = `<div class="loading" role="status"><div class="load-box"><b>正在载入游戏…</b><span id="pProg">${g.size ? '共 ' + mb(g.size) : ''}</span></div></div>`;
}
function failView(title, body, acts){
  $('#pStage').innerHTML = `<div class="loading" role="alert"><div class="load-box"><b>${esc(title)}</b><p>${esc(body)}</p><div class="acts">${acts.map((a, i) => `<button class="state-layer focus-ring btn${i ? '' : ' btn-primary'}" type="button" data-i="${i}">${esc(a[0])}</button>`).join('')}</div></div></div>`;
  $('#pStage').querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', acts[+b.dataset.i][1]));
  $('#pStage [data-i="0"]').focus();
}
// 载入游戏：任何一步卡住都给出提示与出路，不让玩家停在「正在载入」（REQ-017）
async function bootGame(g){
  const id = g.id, tok = P.boot = (P.boot || 0) + 1, live = () => P && P.gid === id && P.boot === tok;
  const back = () => go('game-' + id);
  loadView(g);
  if (await IDB.ready() === 'stuck') {
    if (live()) failView('存档暂时读不出来', '本机存档库没有回应，进度没有丢。请刷新页面再试。', [['刷新页面', () => location.reload()], ['返回', back]]);
    return;
  }
  const prog = (got, total) => { const el = live() && $('#pProg'); if (el) el.textContent = `已下载 ${mb(got)} / 共 ${mb(total || got)}`; };
  const [got, ls] = await Promise.all([getHtml(g, prog), IDB.get('kv', P.key)]);
  if (!live()) return;
  if (got.err === 'net') { failView('网络不稳定，游戏没下载下来', '已经自动重试过一次。换个网络或稍等一会儿，再点「重试」。', [['重试', () => bootGame(g)], ['返回', back]]); return; }
  if (got.err) { failView('游戏文件读取失败', '服务器上没找到这款游戏的文件，请稍后再试。', [['重试', () => bootGame(g)], ['返回', back]]); return; }
  const html = got.html, u = me();
  P.ls = ls || {}; P.lsJson = JSON.stringify(P.ls);
  const fr = document.createElement('iframe');
  fr.setAttribute('sandbox', 'allow-scripts allow-forms allow-pointer-lock allow-popups allow-popups-to-escape-sandbox');
  fr.setAttribute('title', g.title);
  fr.setAttribute('allow', 'fullscreen; autoplay');
  fr.srcdoc = inject(html, { game:{ id, title:g.title }, user:{ id:hashId(u.email), nickname:u.nickname }, storage:P.ls });
  P.frame = fr;
  $('#pStage').innerHTML = ''; $('#pStage').appendChild(fr);
  $('#pSaved').textContent = Object.keys(P.ls).length ? '已读取存档' : '新存档';
  P.timer = setInterval(() => {
    if (document.hidden || !P) return;
    P.secs += 5; const s = stat(P.gid); s.seconds = (s.seconds || 0) + 5; s.last = now();
    P.unsent += 5; if (P.unsent >= 120) reportPlay();
    if (P.secs % 30 === 0) persist();
    $('#pTime').textContent = '本次 ' + Math.floor(P.secs / 60) + ' 分钟';
  }, 5000);
}
function saveLs(){
  if (!P) return;
  clearTimeout(P.saveT); P.saveT = null;
  const json = JSON.stringify(P.ls);
  if (json === P.lsJson) return; // 游戏把存档原样写回、或写入后又删掉时，存档没变，顶栏不改
  P.lsJson = json;
  IDB.put('kv', P.ls, P.key);
  const t = new Date(); $('#pSaved').textContent = `已存档 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`; $('#pSaved').className = 'saved on';
}
function dirty(){ if (P && !P.saveT) P.saveT = setTimeout(saveLs, 700); }
// 游玩时长攒在本地，满 2 分钟、切到后台、退出或关页面时上报
function reportPlay(){ if (P && P.unsent) { track({ t:'play', g:P.gid, s:P.unsent }); P.unsent = 0; } }
function closePlayer(){
  if (!P) { $('#player').hidden = true; document.body.style.overflow = ''; return; }
  reportPlay();
  if (P.saveT) saveLs();
  clearInterval(P.timer); persist();
  if (P.frame) P.frame.srcdoc = '';
  P = null;
  $('#pStage').innerHTML = ''; $('#player').hidden = true; document.body.style.overflow = '';
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
}
window.addEventListener('message', e => {
  if (!P || !P.frame || e.source !== P.frame.contentWindow) return;
  const m = e.data; if (!m || m.__cj !== 1) return;
  if (m.type === 'ls-set') { P.ls[m.k] = String(m.v); dirty(); }
  else if (m.type === 'ls-del') { delete P.ls[m.k]; dirty(); }
  else if (m.type === 'ls-clear') { P.ls = {}; dirty(); }
  else if (m.type === 'status') { const s = stat(P.gid); s.status = String(m.text).slice(0, 60); $('#pStatus').textContent = s.status; persist(); }
  else if (m.type === 'defs' && Array.isArray(m.list)) {
    meta.achDefs[P.gid] = m.list.slice(0, 200).filter(a => a && a.key).map(a => ({ key:String(a.key).slice(0, 60), name:String(a.name || a.key).slice(0, 40) })); persist();
  }
  else if (m.type === 'unlock') {
    const s = stat(P.gid), k = String(m.key).slice(0, 60);
    if (s.ach[k]) return;
    s.ach[k] = now(); persist();
    const g = findGame(P.gid), a = achList(g).find(x => x.key === k);
    toast(`<small>解锁成就 · ${esc(g.title)}</small>${esc(a ? a.name : k)}`, 'ach');
  }
  else if (m.type === 'exit') go('game-' + P.gid);
});
window.addEventListener('pagehide', () => { if (P) { reportPlay(); saveLs(); persist(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) reportPlay(); });
$('#pExit').addEventListener('click', () => { const id = P?.gid; go(id ? 'game-' + id : 'store'); });
$('#pFull').addEventListener('click', () => {
  const el = $('#player');
  try { (el.requestFullscreen ? el.requestFullscreen() : Promise.reject()).catch(() => toast('这个窗口不支持全屏。')); } catch (e) { toast('这个窗口不支持全屏。'); }
});

/* ───────── 交互 ───────── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-genre],[data-hero],[data-lib],[data-login]');
  if (!t) { if (ui.menu && !e.target.closest('.acct')) { ui.menu = false; renderAcct(); } return; }
  if (t.hasAttribute('data-login')) { const h = location.hash.slice(1); if (h && h !== 'login') ui.returnTo = ui.returnTo || h; return; }
  if (t.dataset.genre !== undefined) {
    e.preventDefault(); ui.genre = t.dataset.genre; ui.q = ''; $('#q').value = '';
    const known = allGames().some(g => g.genre === ui.genre);
    if (!known && ui.genre !== '全部') { ui.genre = '全部'; ui.q = t.dataset.genre; $('#q').value = ui.q; }
    if ((location.hash.slice(1) || 'store') === 'store') renderStore(); else go('store');
    return;
  }
  if (t.dataset.hero !== undefined) { ui.hero = +t.dataset.hero; renderStore(); return; }
  if (t.dataset.lib !== undefined) { ui.lib = t.dataset.lib; renderLibrary(); return; }
  const a = t.dataset.act;
  if (a === 'menu') { ui.menu = !ui.menu; renderAcct(); }
  else if (a === 'clear-filter') { ui.genre = '全部'; ui.q = ''; $('#q').value = ''; renderStore(); }
  else if (a === 'wish') {
    const u = me(); if (!u) return; const list = meta.wish[u.email] ??= []; const id = t.dataset.id;
    const i = list.indexOf(id); if (i >= 0) list.splice(i, 1); else list.push(id); persist();
    toast(i >= 0 ? '已移出愿望单' : '已加入愿望单'); renderGame(id);
  }
  else if (a === 'bk-copy') {
    const out = $('#bkOut'), ok = () => { track({ t:'backup' }); toast('存档码已复制。发到微信「文件传输助手」或存进备忘录。'); };
    (navigator.clipboard ? navigator.clipboard.writeText(out.value) : Promise.reject()).then(ok, () => { out.select(); document.execCommand('copy') ? ok() : toast('没能自动复制。长按上面的存档码，全选后复制。', 'bad'); });
  }
  else if (a === 'bk-file') {
    track({ t:'backup' });
    const url = URL.createObjectURL(new Blob([$('#bkOut').value], { type:'text/plain' }));
    Object.assign(document.createElement('a'), { href:url, download:`shoota-存档-${new Date().toLocaleDateString('sv')}.txt` }).click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
});
$('#q').addEventListener('input', e => {
  ui.q = e.target.value; ui.genre = '全部';
  if ((location.hash.slice(1) || 'store') !== 'store') { location.hash = 'store'; return; }
  renderStore(); const q = $('#q'); q.focus();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.menu) { ui.menu = false; renderAcct(); } });

/* ───────── 启动 ───────── */
(async () => {
  const had = location.hash.startsWith('#move=') && await moveIn();
  ensureVid(hadMeta || had);
  track({ t:'visit' });
  route();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
})();
})();
