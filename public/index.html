<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>shoota 游戏平台</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&family=Barlow+Condensed:wght@500;600&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: Steam-style store shell — sticky top bar, wide featured hero with a side rail, capsule grid; a game runs in a full-bleed overlay with a thin platform bar on top. Single dark look by choice. */
:root{
  --bg:#10151c;        /* page ground */
  --top:#0b0f14;       /* top bar */
  --panel:#18202a;     /* blocks, cards */
  --raised:#222c38;    /* hover, selected */
  --line:#2a3644;
  --fg:#e4ebf2;
  --muted:#8c9aaa;
  --faint:#5d6b7b;
  --accent:#3ddc97;    /* 主按钮「开始游戏」 */
  --accent-ink:#052618;
  --gold:#e9c46a;      /* 待导入 / 提醒 */
  --blue:#66c0f4;      /* 推荐 / 本机导入 */
  --red:#e5636a;       /* 不推荐 / 错误 */
  --display:"Noto Serif SC","Songti SC","STSong",serif;
  --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --num:"Barlow Condensed","Noto Sans SC",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:15px/1.65 var(--body);-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--top)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--top);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-mark{width:30px;height:30px;display:block;flex:none}
.logo b{font:900 22px/1 var(--display);letter-spacing:.06em}
.nav{display:flex;gap:2px}
.nav a{padding:6px 12px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
.nav a:hover{color:var(--fg)}
.nav a[aria-current="page"]{color:var(--fg);background:var(--raised)}
.search{flex:1 1 200px;max-width:300px;margin-left:auto;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px 7px 34px}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2}
.acct{position:relative}
.avatar{width:34px;height:34px;border-radius:50%;border:0;background:var(--raised);color:var(--fg);font-weight:700;cursor:pointer;display:grid;place-items:center}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:220px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.45);display:grid}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .who b{display:block}
.menu .who span{color:var(--muted);font-size:13px;word-break:break-all}
.menu button,.menu a{background:none;border:0;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;text-decoration:none;font-size:14px}
.menu button:hover,.menu a:hover{background:var(--raised)}
@media (max-width:760px){
  .search{order:5;flex-basis:100%;max-width:none;margin-left:0}
  .top .wrap{gap:10px}
  .acct{margin-left:auto}
  .nav a{padding:6px 8px}
}
@media (max-width:420px){.logo b{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:8px 16px;cursor:pointer;text-decoration:none;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn-primary:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn-lg{padding:12px 22px;font-size:16px}
.btn-quiet{background:none;border-color:transparent;color:var(--muted)}
.btn-quiet:hover{color:var(--fg);border-color:transparent}
.btn-danger{color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--raised);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--accent);background:rgba(61,220,151,.1)}
.pill.dev{color:var(--gold);background:rgba(233,196,106,.1)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:4px;background:#1d2733;color:#a9c1d6;text-decoration:none;cursor:pointer;border:0}
.tag:hover{background:#26384a;color:var(--fg)}
.tags{display:flex;flex-wrap:wrap;gap:6px}

/* cover art */
.cv{position:relative;overflow:hidden;background:#05070a;aspect-ratio:46/21;max-width:100%;width:100%;border-radius:6px;container-type:inline-size;isolation:isolate}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cv-t{position:absolute;left:6%;right:40%;bottom:13%;font:900 clamp(15px,8.2cqw,64px)/1.06 var(--display);letter-spacing:.03em;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.cv-s{display:block;margin-top:.45em;font:500 clamp(9px,2.4cqw,17px)/1.3 var(--body);letter-spacing:.04em;opacity:.85;text-shadow:none}
.cv[data-c="douluo"] .cv-t{color:#f3d58a}
.cv[data-c="hougong"] .cv-t{color:#f7e7c4}
.cv[data-c="f1"] .cv-t{color:#fff;font-family:var(--num);font-weight:600;letter-spacing:.02em;font-style:italic;font-size:clamp(14px,6.6cqw,50px)}
.cv[data-c="nba"] .cv-t{color:#fff;font-family:var(--num);font-weight:600;letter-spacing:.02em;font-size:clamp(14px,6.6cqw,50px);right:30%}
.cv[data-c="lol"] .cv-t{color:#d9f6ff}
.cv[data-c="yike"] .cv-t{color:#efd58e}
.cv[data-c="auto"] .cv-t{color:#fff}

/* store */
.page{padding-block:28px 64px;display:grid;gap:40px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font:700 19px/1.3 var(--body)}
.sec-h .aside{color:var(--muted);font-size:13px}

.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;background:var(--panel);border-radius:8px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.hero-art{display:block;text-decoration:none}
.hero-art .cv{border-radius:0;height:100%;aspect-ratio:auto;min-height:250px}
.hero-info{padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero-info h3{font:900 26px/1.2 var(--display)}
.hero-info p{margin:0;color:#c3cfdb;font-size:14px}
.hero-info .grow{flex:1}
.hero-info .acts{display:flex;gap:8px;flex-wrap:wrap}
.hero-nav{display:flex;justify-content:center;gap:8px;margin-top:14px}
.hero-nav button{width:28px;height:6px;border-radius:3px;border:0;background:var(--line);cursor:pointer;padding:0}
.hero-nav button[aria-pressed="true"]{background:var(--fg)}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero-art .cv{aspect-ratio:46/21;min-height:0}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.chip .n{font-family:var(--num);color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"] .n{color:var(--bg);opacity:.6}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px 18px}
.cap{display:grid;gap:9px;text-decoration:none;align-content:start;min-width:0}
.cap-row b{flex:1}
.cap .cv{transition:transform .18s ease,box-shadow .18s ease}
.cap:hover .cv,.cap:focus-visible .cv{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.5)}
.cap-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cap b{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap p{margin:0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap .meta{color:var(--faint);font-size:12px}

.cont{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cont a{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;background:var(--panel);border-radius:8px;padding:10px;text-decoration:none}
.cont a:hover{background:var(--raised)}
.cont b{display:block;font-size:14px}
.cont span{color:var(--muted);font-size:12px}

.empty{border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}

.band{background:var(--panel);border-radius:8px;padding:22px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.band h3{font:700 17px/1.4 var(--body)}
.band p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:60ch}

/* detail */
.crumbs{color:var(--muted);font-size:13px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--fg)}
.d-head{display:grid;gap:6px}
.d-head h1{font:900 clamp(26px,4vw,38px)/1.15 var(--display);letter-spacing:.02em}
.d-head .sub{color:var(--muted)}
.d-top{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.d-side{display:grid;gap:14px;background:var(--panel);border-radius:8px;padding:18px}
.d-side .tagline{margin:0;color:#c9d5e1;font-size:14px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:13px}
.facts dt{color:var(--faint)}
.facts dd{margin:0;color:var(--fg)}
.d-body{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.d-main{display:grid;gap:34px;min-width:0}
.d-main section{display:grid;gap:12px}
.d-main h2{font:700 13px/1 var(--body);color:var(--muted);letter-spacing:.08em;padding-bottom:10px;border-bottom:1px solid var(--line)}
.prose p{margin:0 0 .8em;max-width:68ch;color:#cfd9e3}
.prose p:last-child{margin-bottom:0}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;color:#cfd9e3;counter-increment:s}
.steps li::before{content:counter(s);font:600 15px/26px var(--num);width:26px;height:26px;border-radius:50%;background:var(--raised);text-align:center;color:var(--fg)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:500;background:var(--panel)}
.tbl tr:last-child td{border-bottom:0}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.perk{background:var(--panel);border-radius:8px;padding:14px}
.perk b{display:block;margin-bottom:4px;font-family:var(--display);font-size:16px;color:var(--gold)}
.perk span{color:var(--muted);font-size:13px}
.note{background:rgba(233,196,106,.08);border:1px solid rgba(233,196,106,.25);color:#e8d7a8;border-radius:8px;padding:12px 14px;font-size:13px}
.d-aside{display:grid;gap:14px}
.box{background:var(--panel);border-radius:8px;padding:16px;display:grid;gap:10px}
.box h3{font:700 14px/1.4 var(--body)}
.box p{margin:0;color:var(--muted);font-size:13px}
.statline{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.statline b{color:var(--fg);font-family:var(--num);font-size:16px;font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
@media (max-width:900px){.d-top,.d-body{grid-template-columns:1fr}}

/* backup */
textarea,.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
textarea{min-height:96px;resize:vertical}
.bk-code{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:var(--muted)}
.bk-list{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.bk-list li{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.bk-list span{color:var(--muted);font-size:13px;white-space:nowrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

/* library */
.lib{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.lib-list{background:var(--panel);border-radius:8px;padding:8px;display:grid;gap:2px}
.lib-list button{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;border:0;background:none;text-align:left;border-radius:6px;padding:6px;cursor:pointer}
.lib-list button:hover{background:var(--raised)}
.lib-list button[aria-pressed="true"]{background:var(--raised);box-shadow:inset 3px 0 0 var(--accent)}
.lib-list .cv{border-radius:3px}
.lib-list b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-list span{font-size:12px;color:var(--muted)}
.lib-main{display:grid;gap:18px;min-width:0}
.lib-hero{position:relative;border-radius:8px;overflow:hidden}
.lib-hero .cv{border-radius:0}
.lib-bar{display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:var(--panel);border-radius:8px;padding:14px 18px}
.kv{display:grid}
.kv span{font-size:12px;color:var(--muted)}
.kv b{font:600 20px/1.2 var(--num)}
@media (max-width:820px){.lib{grid-template-columns:1fr}}

/* login */
.auth{max-width:420px;margin:24px auto 0;background:var(--panel);border-radius:10px;padding:28px;display:grid;gap:18px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.auth h1{font:900 26px/1.2 var(--display)}
.auth .lead{margin:0;color:var(--muted);font-size:14px}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input{padding:11px 12px;font-size:16px}
.err{color:var(--red);font-size:13px;margin:0;min-height:1em}
.demo-code{background:rgba(102,192,244,.08);border:1px solid rgba(102,192,244,.3);border-radius:8px;padding:12px 14px;font-size:13px;color:#bfe3f8;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demo-code b{font:600 22px/1 var(--num);letter-spacing:.2em;color:var(--fg)}
.code-boxes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.code-boxes input{text-align:center;font:600 24px/1 var(--num);padding:12px 0;background:var(--bg);border:1px solid var(--line);border-radius:6px;width:100%}
.code-boxes input:focus{border-color:var(--accent);outline:none}
.auth .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;font-size:13px}
.linkbtn[disabled]{color:var(--faint);cursor:default}
.fine{font-size:12px;color:var(--faint);margin:0}

/* player */
#player{position:fixed;inset:0;z-index:50;background:#000;display:grid;grid-template-rows:auto minmax(0,1fr)}
.pbar{display:flex;align-items:center;gap:14px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--top);border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.pbar .t{font-weight:700;font-size:14px}
.pbar .st{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar .saved{color:var(--faint)}
.pbar .saved.on{color:var(--accent)}
.pstage{position:relative;background:#000;padding-bottom:env(safe-area-inset-bottom,0px)}
.pstage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);background:var(--bg)}

/* toasts */
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;justify-items:end;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;box-shadow:0 12px 30px rgba(0,0,0,.5);max-width:340px;font-size:14px;animation:tin .25s ease}
.toast.ach{border-left-color:var(--gold)}
.toast.ach small{display:block;color:var(--gold);font-size:12px}
.toast.bad{border-left-color:var(--red)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#store" aria-label="shoota 首页"><img class="logo-mark" src="logo.svg" alt="" width="30" height="30"><b>shoota</b></a>
    <nav class="nav" aria-label="主导航">
      <a href="#store" data-nav="store">商店</a>
      <a href="#library" data-nav="library">游戏库</a>
      <a href="#backup" data-nav="backup">存档</a>
    </nav>
    <label class="search"><span class="sr">搜索游戏</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="搜索游戏、类型" autocomplete="off">
    </label>
    <div class="acct" id="acct"></div>
  </div>
</header>
<main id="view" class="wrap"></main>
<div id="player" hidden>
  <div class="pbar">
    <button class="btn" id="pExit" type="button">← 退出游戏</button>
    <span class="t" id="pTitle"></span>
    <span class="st" id="pStatus"></span>
    <span class="saved" id="pSaved">存档待写入</span>
    <span class="num" id="pTime">本次 0 分钟</span>
    <button class="btn" id="pFull" type="button">全屏</button>
  </div>
  <div class="pstage" id="pStage"></div>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();

/* ───────── 游戏目录（桌面上的 6 款，随平台一起发布在 games/ 下） ───────── */

/* ───────── 本机存储：localStorage 放账号与统计，IndexedDB 放各游戏存档 ───────── */
const META_KEY = 'changju.meta.v1';
const blank = () => ({ session:null, users:{}, stats:{}, wish:{}, achDefs:{}, sendLog:{} });
let meta = (() => { try { const s = localStorage.getItem(META_KEY); if (s) return Object.assign(blank(), JSON.parse(s)); } catch (e) {} return blank(); })();
function persist(){ try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {} }

const IDB = (() => {
  const mem = { games:new Map(), kv:new Map() };
  let p = null;
  function open(){
    if (p) return p;
    p = new Promise(res => {
      try {
        const r = indexedDB.open('changju', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('games', { keyPath:'id' }); d.createObjectStore('kv'); };
        r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
      } catch (e) { res(null); }
    });
    return p;
  }
  function req(store, mode, make){
    return open().then(d => new Promise(res => {
      if (!d) return res(undefined);
      try { const q = make(d.transaction(store, mode).objectStore(store)); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }
      catch (e) { res(undefined); }
    }));
  }
  return {
    async get(store, key){ const d = await open(); return d ? req(store, 'readonly', s => s.get(key)) : mem[store].get(key); },
    async put(store, val, key){ const d = await open(); if (!d) { mem[store].set(key ?? val.id, val); return; } return req(store, 'readwrite', s => key === undefined ? s.put(val) : s.put(val, key)); }
  };
})();

/* ───────── 路由 ───────── */
function go(h){ if (location.hash.slice(1) === h) route(); else location.hash = h; }
window.addEventListener('hashchange', route);
function route(){
  const h = location.hash.slice(1) || 'store';
  ui.menu = false;
  if (!h.startsWith('play-')) closePlayer();
  document.querySelectorAll('[data-nav]').forEach(a => a.toggleAttribute('aria-current', false));
  const nav = h.startsWith('library') ? 'library' : h === 'backup' ? 'backup' : (h === 'store' || h.startsWith('game-')) ? 'store' : '';
  if (nav) $(`[data-nav="${nav}"]`).setAttribute('aria-current', 'page');
  renderAcct();
  if (h === 'login') { location.replace('#store'); return; }
  if (h.startsWith('play-')) { openPlayer(h.slice(5)); return; }
  if (h.startsWith('game-')) renderGame(h.slice(5));
  else if (h === 'library') renderLibrary();
  else if (h === 'backup') renderBackup();
  else renderStore();
  window.scrollTo(0, 0);
}

          <a class="btn btn-primary btn-lg" href="#play-${g.id}">${s.seconds ? '继续游戏' : '开始游戏'}</a>
          <div class="kv"><span>游玩时间</span><b>${fmtPlay(s.seconds || 0)}</b></div>
          <div class="kv"><span>上次游玩</span><b style="font-family:var(--body);font-size:15px;font-weight:500">${fmtWhen(s.last)}</b></div>
          ${achs.length ? `<div class="kv"><span>成就</span><b>${got.length} / ${achs.length}</b></div>` : ''}
          ${s.status ? `<div class="kv"><span>进度</span><b style="font-family:var(--body);font-size:15px;font-weight:500">${esc(s.status)}</b></div>` : ''}
          <a class="btn btn-quiet" href="#game-${g.id}" style="margin-left:auto">商店页面</a>
        </div>
        <div class="box"><h3>关于存档</h3><p>《${esc(g.title)}》的存档自动保存在这台设备的浏览器里，下次打开接着玩。换浏览器或清除网站数据后进度会丢失，<a href="#backup" style="color:var(--blue)">先复制一份存档码</a>，到新设备上粘贴就能恢复。</p></div>
      </div>
    </div>
  </div>`;
}

/* ───────── 本机玩家（demo 不需要注册） ───────── */
function ensurePlayer(){
  if (meta.session && meta.users[meta.session.email]) return;
  meta.users.local ??= { nickname:'玩家', created:now() };
  meta.session = { email:'local', at:now() }; persist();
}
ensurePlayer();

/* ───────── 备份 / 恢复进度：存档码是 'CJ1' + base64(gzip(JSON))；浏览器不支持压缩时退回 'CJ0' + base64(JSON) ───────── */
async function packSaves(){
  const u = me(), saves = {}, stats = {};
  for (const g of allGames()) {
    const ls = await IDB.get('kv', u.email + '|' + g.id), s = peek(g.id);
    if ((ls && Object.keys(ls).length) || s?.seconds) { saves[g.id] = ls || {}; if (s) stats[g.id] = s; }
  }
  return { v:1, at:now(), saves, stats, wish:meta.wish[u.email] || [], achDefs:meta.achDefs };
}
const gzip = (bytes, Stream) => new Response(new Blob([bytes]).stream().pipeThrough(new Stream('gzip'))).arrayBuffer().then(b => new Uint8Array(b));
async function encodeSaves(d){
  let bytes = new TextEncoder().encode(JSON.stringify(d)), tag = 'CJ0';
  if (window.CompressionStream) { bytes = await gzip(bytes, CompressionStream); tag = 'CJ1'; }
  let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return tag + btoa(bin);
}
async function decodeSaves(code){
  code = code.replace(/\s+/g, '');
  const tag = code.slice(0, 3);
  if (tag === 'CJ1' && !window.DecompressionStream) throw new Error('old');
  if (tag !== 'CJ0' && tag !== 'CJ1') throw new Error('bad');
  let bytes = Uint8Array.from(atob(code.slice(3)), c => c.charCodeAt(0));
  if (tag === 'CJ1') bytes = await gzip(bytes, DecompressionStream);
  const d = JSON.parse(new TextDecoder().decode(bytes));
  if (!d || d.v !== 1 || !d.saves || typeof d.saves !== 'object') throw new Error('bad');
  return d;
}
async function applySaves(d){
  const u = me(), ids = Object.keys(d.saves).filter(id => findGame(id));
  meta.stats[u.email] ??= {};
  for (const id of ids) {
    await IDB.put('kv', d.saves[id], u.email + '|' + id);
    meta.stats[u.email][id] = d.stats?.[id] || { seconds:0, last:d.at, ach:{}, status:'' };
    if (d.achDefs?.[id]) meta.achDefs[id] = d.achDefs[id];
  }
  meta.wish[u.email] = [...new Set([...(meta.wish[u.email] || []), ...(d.wish || []).filter(id => findGame(id))])];
  persist();
  return ids.length;
}
const titles = ids => ids.map(id => '《' + esc(findGame(id).title) + '》').join('');
async function renderBackup(){
  const d = await packSaves(), have = Object.keys(d.saves);
  const code = have.length ? await encodeSaves(d) : '';
  if (location.hash.slice(1) !== 'backup') return;
  $('#view').innerHTML = `<div class="page" style="gap:22px;max-width:760px;margin:0 auto">
    <div class="d-head"><h1>备份 / 恢复进度</h1><div class="sub">不用注册账号，进度保存在这台设备的浏览器里。换手机、换浏览器或清理缓存都会丢失进度，提前复制一份存档码存好。</div></div>
    <section class="box" style="gap:14px">
      <h3>备份这台设备的进度</h3>
      ${have.length ? `<ul class="bk-list">${have.map(id => `<li>${esc(findGame(id).title)}<span>${fmtPlay(d.stats[id]?.seconds || 0)}${d.stats[id]?.status ? ' · ' + esc(d.stats[id].status) : ''}</span></li>`).join('')}</ul>
        <label class="sr" for="bkOut">存档码</label>
        <textarea id="bkOut" class="bk-code" rows="3" readonly>${code}</textarea>
        <div class="acts"><button class="btn btn-primary" type="button" data-act="bk-copy">复制存档码</button><button class="btn" type="button" data-act="bk-file">下载存档文件</button></div>
        <p class="fine">存档码共 ${code.length.toLocaleString('zh-CN')} 个字符，只包含游戏进度。可以发到微信「文件传输助手」，或存进备忘录。</p>`
      : `<p>这台设备上还没有游戏进度。玩过之后，再回来复制存档码。</p><div class="acts"><a class="btn" href="#store">去商店挑一款</a></div>`}
    </section>
    <form class="box" id="bkIn" style="gap:12px" novalidate>
      <h3>在这台设备上恢复进度</h3>
      <p>粘贴在另一台设备上复制的存档码，或者选择下载的存档文件（.txt）。</p>
      <label class="sr" for="bkCode">存档码</label>
      <textarea id="bkCode" class="bk-code" rows="3" placeholder="粘贴存档码，以 CJ 开头" aria-describedby="bkErr" spellcheck="false" autocomplete="off"></textarea>
      <p class="err" id="bkErr" role="alert"></p>
      <div class="acts">
        <button class="btn btn-primary" type="submit" id="bkGo">恢复进度</button>
        <label class="btn" id="bkPick">选择存档文件<input id="bkFile" type="file" accept=".txt,text/plain" class="sr"></label>
        <button class="btn btn-quiet" type="button" id="bkCancel" hidden>取消</button>
      </div>
      <div class="note" id="bkAsk" tabindex="-1" hidden></div>
    </form>
  </div>`;
  let pending = null;
  const form = $('#bkIn'), input = $('#bkCode'), err = $('#bkErr'), ask = $('#bkAsk');
  const reset = () => { pending = null; ask.hidden = true; $('#bkCancel').hidden = true; $('#bkPick').hidden = false; $('#bkGo').textContent = '恢复进度'; };
  const fail = msg => { reset(); err.textContent = msg; input.setAttribute('aria-invalid', 'true'); input.focus(); };
  input.addEventListener('input', () => { err.textContent = ''; input.removeAttribute('aria-invalid'); if (pending) reset(); });
  $('#bkCancel').addEventListener('click', () => { reset(); input.focus(); });
  $('#bkFile').addEventListener('change', e => {
    const f = e.target.files[0]; e.target.value = '';
    if (f) f.text().then(t => { input.value = t.trim(); err.textContent = ''; form.requestSubmit(); }, () => fail('读不了这个文件。请重新选择下载的存档文件，或者直接粘贴存档码。'));
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (pending) {
      const n = await applySaves(pending);
      toast(`已恢复 ${n} 款游戏的进度`); go('library'); return;
    }
    if (!input.value.trim()) return fail('先粘贴存档码，或者点「选择存档文件」。');
    let got;
    try { got = await decodeSaves(input.value); }
    catch (x) { return fail(x.message === 'old' ? '这个浏览器版本太旧，读不了这份存档码。换系统自带的浏览器，或者升级系统后再试。' : '这段存档码读不出来，可能复制时漏了开头或结尾。回到原设备点「复制存档码」，整段重新复制一次。'); }
    const ids = Object.keys(got.saves).filter(id => findGame(id));
    if (!ids.length) return fail('这份存档码里没有本平台游戏的进度。');
    const over = ids.filter(id => have.includes(id));
    pending = got;
    ask.innerHTML = `这份存档码导出于 ${esc(new Date(got.at).toLocaleString('zh-CN', { month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' }))}，包含${titles(ids)}的进度。`
      + (over.length ? `恢复后，这台设备上${titles(over)}现在的进度会被替换，替换后找不回来。` : '');
    ask.hidden = false; $('#bkPick').hidden = true; $('#bkCancel').hidden = false; $('#bkGo').textContent = '确认恢复';
    $('#bkGo').focus();
  });
}

/* ───────── 运行游戏 ───────── */
let P = null;
const EMBED = window.__CJ_GAMES__ || null;   // 单文件版：游戏以 base64 打包在页面里
async function getHtml(g){
  if (EMBED && EMBED[g.id]) { try { return new TextDecoder().decode(Uint8Array.from(atob(EMBED[g.id]), c => c.charCodeAt(0))); } catch (e) {} }
  if (g.src) { try { const r = await fetch(g.src); if (r.ok) return await r.text(); } catch (e) {} }
  return null;
}
function inject(html, init){
  const json = JSON.stringify(init).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  const boot = '<script>(function(){var I=' + json + ';' + BOOT + '})();<\/script>';
  const head = html.match(/<head[^>]*>/i);
  if (head) return html.slice(0, head.index + head[0].length) + boot + html.slice(head.index + head[0].length);
  const dt = html.match(/<!doctype[^>]*>/i);
  if (dt) return html.slice(0, dt.index + dt[0].length) + boot + html.slice(dt.index + dt[0].length);
  return boot + html;
}
// 注入到游戏里的引导脚本：接管 localStorage、提供 Platform SDK
const BOOT = `
var post=function(m){m.__cj=1;try{parent.postMessage(m,'*')}catch(e){}};
var data=I.storage||{},has=function(k){return Object.prototype.hasOwnProperty.call(data,k)};
var ls={getItem:function(k){k=String(k);return has(k)?data[k]:null},
setItem:function(k,v){k=String(k);v=String(v);data[k]=v;post({type:'ls-set',k:k,v:v})},
removeItem:function(k){k=String(k);if(has(k)){delete data[k];post({type:'ls-del',k:k})}},
clear:function(){for(var k in data)delete data[k];post({type:'ls-clear'})},
key:function(i){var ks=Object.keys(data);return i<ks.length?ks[i]:null}};
Object.defineProperty(ls,'length',{get:function(){return Object.keys(data).length}});
var lsp=typeof Proxy==='function'?new Proxy(ls,{get:function(t,p){if(p in t)return t[p];if(typeof p==='string'&&has(p))return data[p];return undefined},set:function(t,p,v){t.setItem(p,v);return true},deleteProperty:function(t,p){t.removeItem(p);return true}}):ls;
var sd={},ss={getItem:function(k){return Object.prototype.hasOwnProperty.call(sd,k)?sd[k]:null},setItem:function(k,v){sd[String(k)]=String(v)},removeItem:function(k){delete sd[k]},clear:function(){sd={}},key:function(i){return Object.keys(sd)[i]||null}};
try{Object.defineProperty(window,'localStorage',{configurable:true,get:function(){return lsp}})}catch(e){}
try{Object.defineProperty(window,'sessionStorage',{configurable:true,get:function(){return ss}})}catch(e){}
var done={};
window.Platform=Object.freeze({version:'1.0',game:I.game,user:I.user,
unlock:function(k){k=String(k);if(done[k])return;done[k]=1;post({type:'unlock',key:k})},
defineAchievements:function(list){try{post({type:'defs',list:JSON.parse(JSON.stringify(list||[]))})}catch(e){}},
setStatus:function(t){post({type:'status',text:String(t).slice(0,60)})},
exit:function(){post({type:'exit'})}});
`;
async function openPlayer(id){
  const g = findGame(id);
  if (!g) { go('store'); return; }
  const u = me();
  if (P && P.gid === id) return;
  closePlayer();
  const st = stat(id); st.last = now(); persist();
  navigator.storage?.persist?.();
  const key = u.email + '|' + id;
  P = { gid:id, key, ls:{}, secs:0, timer:null, saveT:null, frame:null };
  $('#pTitle').textContent = g.title; $('#pStatus').textContent = st.status || ''; $('#pTime').textContent = '本次 0 分钟';
  $('#pSaved').textContent = '读取存档…'; $('#pSaved').className = 'saved';
  $('#pStage').innerHTML = '<div class="loading">正在载入游戏…</div>';
  $('#player').hidden = false; document.body.style.overflow = 'hidden';
  const [html, ls] = await Promise.all([getHtml(g), IDB.get('kv', key)]);
  if (!P || P.gid !== id) return;
  if (!html) { closePlayer(); toast('游戏文件读取失败，请稍后再试，或重新上架这款游戏。', 'bad'); go('game-' + id); return; }
  P.ls = ls || {};
  const fr = document.createElement('iframe');
  fr.setAttribute('sandbox', 'allow-scripts allow-forms allow-pointer-lock');
  fr.setAttribute('title', g.title);
  fr.setAttribute('allow', 'fullscreen; autoplay');
  fr.srcdoc = inject(html, { game:{ id, title:g.title }, user:{ id:hashId(u.email), nickname:u.nickname }, storage:P.ls });
  P.frame = fr;
  $('#pStage').innerHTML = ''; $('#pStage').appendChild(fr);
  $('#pSaved').textContent = Object.keys(P.ls).length ? '已读取存档' : '新存档';
  P.timer = setInterval(() => {
    if (document.hidden || !P) return;
    P.secs += 5; const s = stat(P.gid); s.seconds = (s.seconds || 0) + 5; s.last = now();
    if (P.secs % 30 === 0) persist();
    $('#pTime').textContent = '本次 ' + Math.floor(P.secs / 60) + ' 分钟';
  }, 5000);
}
function saveLs(){
  if (!P) return;
  clearTimeout(P.saveT); P.saveT = null;
  IDB.put('kv', P.ls, P.key);
  const t = new Date(); $('#pSaved').textContent = `已存档 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`; $('#pSaved').className = 'saved on';
}
function dirty(){ if (P && !P.saveT) P.saveT = setTimeout(saveLs, 700); }
function closePlayer(){
  if (!P) { $('#player').hidden = true; document.body.style.overflow = ''; return; }
  if (P.saveT) saveLs();
  clearInterval(P.timer); persist();
  if (P.frame) P.frame.srcdoc = '';
  P = null;
  $('#pStage').innerHTML = ''; $('#player').hidden = true; document.body.style.overflow = '';
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
}
window.addEventListener('message', e => {
  if (!P || !P.frame || e.source !== P.frame.contentWindow) return;
  const m = e.data; if (!m || m.__cj !== 1) return;
  if (m.type === 'ls-set') { P.ls[m.k] = String(m.v); dirty(); }
  else if (m.type === 'ls-del') { delete P.ls[m.k]; dirty(); }
  else if (m.type === 'ls-clear') { P.ls = {}; dirty(); }
  else if (m.type === 'status') { const s = stat(P.gid); s.status = String(m.text).slice(0, 60); $('#pStatus').textContent = s.status; persist(); }
  else if (m.type === 'defs' && Array.isArray(m.list)) {
    meta.achDefs[P.gid] = m.list.slice(0, 200).filter(a => a && a.key).map(a => ({ key:String(a.key).slice(0, 60), name:String(a.name || a.key).slice(0, 40) })); persist();
  }
  else if (m.type === 'unlock') {
    const s = stat(P.gid), k = String(m.key).slice(0, 60);
    if (s.ach[k]) return;
    s.ach[k] = now(); persist();
    const g = findGame(P.gid), a = achList(g).find(x => x.key === k);
    toast(`<small>解锁成就 · ${esc(g.title)}</small>${esc(a ? a.name : k)}`, 'ach');
  }
  else if (m.type === 'exit') go('game-' + P.gid);
});
window.addEventListener('pagehide', () => { if (P) { saveLs(); persist(); } });
$('#pExit').addEventListener('click', () => { const id = P?.gid; go(id ? 'game-' + id : 'store'); });
$('#pFull').addEventListener('click', () => {
  const el = $('#player');
  try { (el.requestFullscreen ? el.requestFullscreen() : Promise.reject()).catch(() => toast('这个窗口不支持全屏。')); } catch (e) { toast('这个窗口不支持全屏。'); }
});

/* ───────── 交互 ───────── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-genre],[data-hero],[data-lib],[data-login]');
  if (!t) { if (ui.menu && !e.target.closest('.acct')) { ui.menu = false; renderAcct(); } return; }
  if (t.hasAttribute('data-login')) { const h = location.hash.slice(1); if (h && h !== 'login') ui.returnTo = ui.returnTo || h; return; }
  if (t.dataset.genre !== undefined) {
    e.preventDefault(); ui.genre = t.dataset.genre; ui.q = ''; $('#q').value = '';
    const known = allGames().some(g => g.genre === ui.genre);
    if (!known && ui.genre !== '全部') { ui.genre = '全部'; ui.q = t.dataset.genre; $('#q').value = ui.q; }
    if ((location.hash.slice(1) || 'store') === 'store') renderStore(); else go('store');
    return;
  }
  if (t.dataset.hero !== undefined) { ui.hero = +t.dataset.hero; renderStore(); return; }
  if (t.dataset.lib !== undefined) { ui.lib = t.dataset.lib; renderLibrary(); return; }
  const a = t.dataset.act;
  if (a === 'menu') { ui.menu = !ui.menu; renderAcct(); }
  else if (a === 'clear-filter') { ui.genre = '全部'; ui.q = ''; $('#q').value = ''; renderStore(); }
  else if (a === 'wish') {
    const u = me(); if (!u) return; const list = meta.wish[u.email] ??= []; const id = t.dataset.id;
    const i = list.indexOf(id); if (i >= 0) list.splice(i, 1); else list.push(id); persist();
    toast(i >= 0 ? '已移出愿望单' : '已加入愿望单'); renderGame(id);
  }
  else if (a === 'bk-copy') {
    const out = $('#bkOut'), ok = () => toast('存档码已复制。发到微信「文件传输助手」或存进备忘录。');
    (navigator.clipboard ? navigator.clipboard.writeText(out.value) : Promise.reject()).then(ok, () => { out.select(); document.execCommand('copy') ? ok() : toast('没能自动复制。长按上面的存档码，全选后复制。', 'bad'); });
  }
  else if (a === 'bk-file') {
    const url = URL.createObjectURL(new Blob([$('#bkOut').value], { type:'text/plain' }));
    Object.assign(document.createElement('a'), { href:url, download:`shoota-存档-${new Date().toLocaleDateString('sv')}.txt` }).click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
});
$('#q').addEventListener('input', e => {
  ui.q = e.target.value; ui.genre = '全部';
  if ((location.hash.slice(1) || 'store') !== 'store') { location.hash = 'store'; return; }
  renderStore(); const q = $('#q'); q.focus();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.menu) { ui.menu = false; renderAcct(); } });

/* ───────── 启动 ───────── */
(async () => {
  route();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
})();
})();
</script>
