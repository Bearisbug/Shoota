# push main → 质量门 → 部署到 Cloudflare Worker「changju」→ 健康检查（身份断言 + 逐文件比对）→ 不通过自动回滚。
# PR 只跑质量门。手册见 docs/DEPLOY.md。
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER: wrangler@4.151.1
  SITE: https://shoota.ai

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 质量门（内嵌脚本语法 + 游戏文件齐全）
        run: node scripts/check.mjs

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://shoota.ai
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 记录部署前的版本（失败回滚目标）
        id: prev
        run: |
          v=$(npx -y $WRANGLER deployments status --json | jq -r '.versions[0].version_id')
          [ -n "$v" ] && [ "$v" != null ] || { echo "读不到当前线上版本，停止部署"; exit 1; }
          echo "当前线上版本：$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: 部署
        id: deploy
        run: npx -y $WRANGLER deploy --message "${GITHUB_SHA::7} $(git log -1 --format=%s | head -c 80)"

      - name: 健康检查（身份断言 + 逐文件比对线上内容）
        id: health
        run: |
          for try in $(seq 1 12); do
            bad=""
            home=$(curl -fsSL "$SITE/?v=$GITHUB_SHA") || home=""
            case "$home" in *'<title>shoota 游戏平台</title>'*) ;; *) bad="身份断言：首页不是 shoota 游戏平台" ;; esac
            if [ -z "$bad" ]; then
              for f in $(cd public && find . -type f | sed 's#^\./##' | sort); do
                path=$f; [ "$f" = index.html ] && path=""
                want=$(sha256sum "public/$f" | cut -d' ' -f1)
                got=$(curl -fsSL "$SITE/$path?v=$GITHUB_SHA" | sha256sum | cut -d' ' -f1) || got=""
                [ "$want" = "$got" ] || { bad="/$path 与本次提交的内容不一致"; break; }
              done
            fi
            [ -z "$bad" ] && { echo "✓ 第 $try 次检查通过：首页是 shoota，$(find public -type f | wc -l) 个文件与 ${GITHUB_SHA::7} 一致"; exit 0; }
            echo "第 $try 次未通过：$bad"; sleep 10
          done
          exit 1

      - name: 失败回滚
        if: failure() && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        run: |
          npx -y $WRANGLER rollback "${{ steps.prev.outputs.version }}" --name changju -m "rolled_back: ${GITHUB_SHA::7} 健康检查未通过" -y
          echo "::error::部署未通过健康检查，已回滚到 ${{ steps.prev.outputs.version }}"
