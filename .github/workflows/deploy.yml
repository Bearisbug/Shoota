# push main → 质量门（类型检查、单测、构建、检查脚本）→ 部署到 Cloudflare Worker「changju」（shoota.ai）→ 健康检查（身份断言 + dist 逐文件比对）→ 不通过自动回滚。
# push test → 同样的流程部署到测试站 Worker「changju-test」（test.shoota.ai）；push rewrite → 部署到重写预览站 Worker「changju-next」（next.shoota.ai）。两个站各用自己的数据库，不碰正式站。
# PR 只跑质量门。部署用质量门那一次构建出的 dist，不重新构建。手册见 docs/DEPLOY.md。
name: deploy

on:
  push:
    branches: [main, test, rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 单测（浏览器侧在 Node 里跑，Worker 在 workerd 里跑）
        run: npm test
      - name: 构建
        run: npm run build
      - name: 检查脚本（内嵌脚本语法、目录与文件、外部字体、改写游戏不碰本地存储、brand 副本）
        run: npm run check
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'test' || github.ref_name == 'rewrite')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'test' && 'test' || 'next' }}
      url: ${{ github.ref_name == 'main' && 'https://shoota.ai' || github.ref_name == 'test' && 'https://test.shoota.ai' || 'https://next.shoota.ai' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # main 部署正式站，test 部署测试站，rewrite 部署重写预览站；WENV 在 main 上为空（空串放在 && 后面会被当成假，所以 main 落到最后的 ''）
      SITE: ${{ github.ref_name == 'main' && 'https://shoota.ai' || github.ref_name == 'test' && 'https://test.shoota.ai' || 'https://next.shoota.ai' }}
      WORKER: ${{ github.ref_name == 'main' && 'changju' || github.ref_name == 'test' && 'changju-test' || 'changju-next' }}
      DB: ${{ github.ref_name == 'main' && 'shoota-metrics' || github.ref_name == 'test' && 'shoota-metrics-test' || 'shoota-metrics-next' }}
      WENV: ${{ github.ref_name == 'test' && '--env test' || github.ref_name == 'rewrite' && '--env next' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: 记录部署前的版本（失败回滚目标）
        id: prev
        run: |
          v=$(npx wrangler deployments status $WENV --json | jq -r '.versions[0].version_id')
          [ -n "$v" ] && [ "$v" != null ] || { echo "读不到当前线上版本，停止部署"; exit 1; }
          echo "当前线上版本：$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: 数据库迁移（只新增表或列，回滚 Worker 时不回退）
        run: npx wrangler d1 migrations apply $DB --remote $WENV

      - name: 部署
        id: deploy
        run: npx wrangler deploy $WENV --message "${GITHUB_SHA::7} $(git log -1 --format=%s | head -c 80)"

      # dist/kanban/ 由 Worker 验过会话才返回、登录页会填入提示文字，_headers 由平台读走不对外提供，这两样不逐字节比对
      - name: 健康检查（身份断言 + dist 逐文件比对线上内容 + 看板与接口在线）
        id: health
        run: |
          files=$(cd dist && find . -type f ! -path './kanban/*' ! -name _headers | sed 's#^\./##' | sort)
          for try in $(seq 1 12); do
            bad=""
            home=$(curl -fsSL "$SITE/?v=$GITHUB_SHA") || home=""
            case "$home" in *'<title>shoota 游戏平台</title>'*) ;; *) bad="身份断言：首页不是 shoota 游戏平台" ;; esac
            if [ -z "$bad" ]; then
              for f in $files; do
                path=$f; [ "$f" = index.html ] && path=""
                want=$(sha256sum "dist/$f" | cut -d' ' -f1)
                got=$(curl -fsSL "$SITE/$path?v=$GITHUB_SHA" | sha256sum | cut -d' ' -f1) || got=""
                [ "$want" = "$got" ] || { bad="/$path 与本次构建的内容不一致"; break; }
              done
            fi
            if [ -z "$bad" ]; then
              kb=$(curl -fsS "$SITE/kanban") || kb=""
              case "$kb" in *'<title>shoota 看板'*) ;; *) bad="/kanban 没有返回看板登录页" ;; esac
            fi
            if [ -z "$bad" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$SITE/api/e")
              [ "$code" = 400 ] || bad="上报接口对空上报返回 $code，应为 400"
            fi
            if [ -z "$bad" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$SITE/api/launch")
              [ "$code" = 400 ] || bad="启动遥测接口对空上报返回 $code，应为 400（旧版 Worker 没有这个接口，返回 404）"
            fi
            [ -z "$bad" ] && { echo "✓ 第 $try 次检查通过：首页是 shoota，$(echo "$files" | wc -l) 个文件与 ${GITHUB_SHA::7} 的构建一致，看板、上报与启动遥测接口在线"; exit 0; }
            echo "第 $try 次未通过：$bad"; sleep 10
          done
          exit 1

      - name: 失败回滚
        if: failure() && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        run: |
          npx wrangler rollback "${{ steps.prev.outputs.version }}" --name $WORKER -m "rolled_back: ${GITHUB_SHA::7} 健康检查未通过" -y
          echo "::error::部署未通过健康检查，已回滚到 ${{ steps.prev.outputs.version }}"
